  - id: "STIG-RHEL-10-800060-dns_name_servers"
    name: "RHEL 10 must have at least two name servers configured for systems using Domain Name Server (DNS) resolution."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-800060, V-281338, SV-281338r1167164_rule, CAT II. CCI-002385. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      r=$(grep -Ei '^nameserver[[:space:]]+' /etc/resolv.conf 2>/dev/null | grep -vcE '127\.0\.0\.53'); s=$(cat /etc/systemd/resolved.conf /etc/systemd/resolved.conf.d/*.conf 2>/dev/null | grep -iE '^[[:space:]]*DNS=' | sed 's/^[^=]*=//' | tr ' ' '\n' | grep -cE '[0-9a-fA-F.:]'); [ "$s" -gt "$r" ] && echo "$s" || echo "$r"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^([2-9]|[1-9][0-9]+)$" }
    rationale: |
      To provide availability for name resolution services, multiple redundant name servers are mandated. A failure in name resolution could lead to the failure of security functions requiring name resolution, which may include time synchronization, centralized authentication, and remote system logging.
    remediation: |
      Configure RHEL 10 to use two or more name servers for DNS resolution based on the DNS mode of the system.

      If the NetworkManager DNS mode is set to "none", add the following lines to "/etc/resolv.conf":

      nameserver [name server 1]
      nameserver [name server 2]

      Replace [name server 1] and [name server 2] with the IPs of two different DNS resolvers.

      If the NetworkManager DNS mode is set to "default", add two DNS servers to a NetworkManager connection using the following command:

      $ nmcli connection modify [connection name] ipv4.dns [name server 1],[name server 2]

      Replace [name server 1] and [name server 2] with the IPs of two different DNS resolvers.

      Replace [connection name] with a valid NetworkManager connection name on the system.

      Replace ipv4 with ipv6 if IPv6 DNS servers are used.
  - id: "STIG-RHEL-10-800070-ipsec_tunnel"
    name: "RHEL 10 must not have unauthorized IP tunnels configured."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-800070, V-281339, SV-281339r1268226_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      systemctl status ipsec | grep ": active" > /dev/null && grep -rni conn /etc/ipsec.conf /etc/ipsec.d/
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: |
      IP tunneling mechanisms can be used to bypass network filtering. If tunneling is required, it must be documented with the information system security officer (ISSO).
    remediation: |
      Configure RHEL 10 to not have unauthorized IP tunnels configured.

      Remove all unapproved tunnels from the system, or document them with the ISSO.
  - id: "STIG-RHEL-10-800080-tcp_syncookie"
    name: "RHEL 10 must be configured to use Transmission Control Protocol (TCP) syncookies."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-800080, V-281340, SV-281340r1167170_rule, CAT II. CCI-002385, CCI-001095. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv4.tcp_syncookies
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: |
      Denial of service (DoS) is a condition when a resource is not available for legitimate users. When this occurs, the organization either cannot accomplish its mission or must operate at degraded capacity.

      Managing excess capacity ensures that sufficient capacity is available to counter flooding attacks. Employing increased capacity and service redundancy may reduce the susceptibility to some DoS attacks. Managing excess capacity may include, for example, establishing selected usage priorities, quotas, or partitioning.
    remediation: |
      Configure RHEL 10 to use TCP syncookies.

      Create a configuration file if it does not already exist:

      $ sudo vi /etc/sysctl.d/99-ipv4_tcp_syncookies.conf

      Add the following line to the file:

      net.ipv4.tcp_syncookies = 1

      Reload settings from all system configuration files with the following command:

      $ sudo sysctl --system
