      If necessary, create a "wheel" group and add administrative users to the group.
  - id: "STIG-RHEL-10-600510-pam_sudo-attrs"
    name: "RHEL 10 must be configured to not bypass password requirements for privilege escalation. (/etc/pam.d/sudo: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600510, V-281206, SV-281206r1166570_rule, CAT II. CCI-002038. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/pam.d/sudo'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Without reauthentication, users may access resources or perform tasks for which they do not have authorization. When operating systems provide the capability to escalate a functional capability, it is critical the user reauthenticate.
    remediation: |
      Configure RHEL 10 to require users to supply a password for privilege escalation.

      Remove any occurrences of " pam_succeed_if " in the "/etc/pam.d/sudo" file.
  - id: "STIG-RHEL-10-600510-pam_sudo-content"
    name: "RHEL 10 must be configured to not bypass password requirements for privilege escalation. (/etc/pam.d/sudo has the expected content (1 rule))"
