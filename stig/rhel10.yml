  - id: "STIG-RHEL-10-700500-ssh_pub_keys"
    name: "RHEL 10 must be configured so that Secure Shell (SSH) public host key files have mode 0644 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700500, V-281253, SV-281253r1184654_rule, CAT II. CCI-002696. NIST SP 800-53 Rev. 4: CM-6."
