    rationale: |
      Use of a complex password helps to increase the time and resources required to compromise the password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks.

      Password complexity is one factor of several that determines how long it takes to crack a password. The more complex the password, the greater the number of possible combinations that must be tested before the password is compromised.

      Requiring a minimum number of uppercase characters makes password guessing attacks more difficult by ensuring a larger search space.
    remediation: |
      Configure RHEL 10 to enforce password complexity by requiring that at least one uppercase character be used by setting the "ucredit" option.

      Add or update the following line in the "/etc/security/pwquality.conf" file or a configuration file in the "/etc/security/pwquality.conf.d/" directory to contain the "ucredit" parameter:

      ucredit = -1
  - id: "STIG-RHEL-10-600260-pwquality_difok"
    name: "RHEL 10 must require the change of at least eight characters when passwords are changed."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600260, V-281185, SV-281185r1195433_rule, CAT II. CCI-004066. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      grep difok /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^.*:difok\\s*=\\s*([8-9]|[1-3][0-9])" }
      - { none: "~ ^.*:difok\\s*=\\s*[0-7]" }
    rationale: |
      Use of a complex password helps to increase the time and resources required to compromise the password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute–force attacks.

      Password complexity is one factor of several that determines how long it takes to crack a password. The more complex the password, the greater the number of possible combinations that must be tested before the password is compromised.

      Requiring a minimum number of different characters during password changes ensures that newly changed passwords should not resemble previously compromised ones.

      Note that passwords that are changed on compromised systems will still be compromised.
    remediation: |
      Configure RHEL 10 to require the change of at least eight of the total number of characters when passwords are changed by setting the "difok" option.

      Add or update the following line in the "/etc/security/pwquality.conf" file or a configuration file in the "/etc/security/pwquality.conf.d/" directory to contain the "difok" parameter:

      difok = 8
  - id: "STIG-RHEL-10-600270-users_24hr_minpasswd_restrict"
    name: "RHEL 10 must enforce that passwords have a 24 hours/1 day minimum lifetime restriction in /etc/shadow."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600270, V-281186, SV-281186r1184622_rule, CAT II. CCI-004066. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      awk -F: '$2 ~ /^\$/ && $4 < 1 {print $1 " " $4}' /etc/shadow
    expect: empty
    rationale: |
      Enforcing a minimum password lifetime helps to prevent repeated password changes to defeat the password reuse or history enforcement requirement. If users are allowed to immediately and continually change their password, the password could be repeatedly changed in a short period of time to defeat the organization's policy for password reuse.
    remediation: |
      Configure RHEL 10 so that noncompliant accounts enforce a 24 hours/1 day minimum password lifetime:

      $ sudo passwd -n 1 [user]
  - id: "STIG-RHEL-10-600280-pwquality_maxclassrepeat"
    name: "RHEL 10 must require the maximum number of repeating characters of the same character class to be limited to four when passwords are changed."
