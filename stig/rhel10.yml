      $ sudo systemctl restart sshd.service
  - id: "STIG-RHEL-10-700510-ssh_config_gssapiauth"
    name: "RHEL 10 must be configured so that the Secure Shell (SSH) daemon does not allow Generic Security Service Application Program Interface (GSSAPI) authentication."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700510, V-281254, SV-281254r1184754_rule, CAT II. CCI-001813. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      sshd -T | grep -i gssapiauthentication
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (?i)^GSSAPIAuthentication no" }
    rationale: |
      GSSAPI authentication is used to provide additional authentication mechanisms to applications. Allowing GSSAPI authentication through SSH exposes the system's GSSAPI to remote hosts, increasing the attack surface of the system.

      OpenSSH uses the first occurrence of a keyword it sees, and drop-in files are read in lexicographical order at the start of the configuration. Red Hat recommends using drop-in files rather than changing base configuration files.
    remediation: |
      Configure RHEL 10 SSH daemons to not allow GSSAPI authentication.

      In "/etc/ssh/sshd_config.d", create a drop file that will lexicographically precede 50-redhat.conf and add the following line:

      GSSAPIAuthentication no

      Restart the SSH service with the following command for the changes to take effect:

      $ sudo systemctl restart sshd.service
