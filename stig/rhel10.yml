  - id: "STIG-RHEL-10-400500-local_init_files_world_writable"
    name: "RHEL 10 must prohibit local initialization files from executing world-writable programs."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400500, V-281095, SV-281095r1184678_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      find /home -perm -002 -type f -name ".[^.]*" -exec ls -ld {} \;
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: |
      If user startup files execute world-writable programs, especially in unprotected directories, they could be maliciously modified to destroy user files or otherwise compromise the system at the user level. If the system is compromised at the user level, it is easier to elevate privileges to eventually compromise the system at the root and network level.
    remediation: |
      Configure RHEL 10 so that local initialization files do not execute world-writable programs with the following command:

      $ sudo chmod 0755 <file>
  - id: "STIG-RHEL-10-500000-systemd-journald-enabled"
    name: "RHEL 10 must enable the systemd-journald service. (Service systemd-journald is enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500000, V-281096, SV-281096r1165643_rule, CAT II. CCI-001665. NIST SP 800-53 Rev. 4: SC-24."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journald | cut -d= -f2
    expect: "~ ^enabled"
    rationale: |
      In the event of a system failure, RHEL 10 must preserve any information necessary to determine cause of failure and return to operations with least disruption to system processes.
    remediation: |
      Configure RHEL 10 to enable the systemd-journald service.

      To enable the systemd-journald service, run the following command:

      $ sudo systemctl enable --now systemd-journald
  - id: "STIG-RHEL-10-500000-systemd-journald-running"
    name: "RHEL 10 must enable the systemd-journald service. (Service systemd-journald is running)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500000, V-281096, SV-281096r1165643_rule, CAT II. CCI-001665. NIST SP 800-53 Rev. 4: SC-24."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journald | cut -d= -f2
    expect: "== active"
    rationale: |
      In the event of a system failure, RHEL 10 must preserve any information necessary to determine cause of failure and return to operations with least disruption to system processes.
    remediation: |
      Configure RHEL 10 to enable the systemd-journald service.

      To enable the systemd-journald service, run the following command:

      $ sudo systemctl enable --now systemd-journald
  - id: "STIG-RHEL-10-500005-auditd_processes_prior_to_audit_daemon"
    name: "RHEL 10 must enable auditing of processes that start prior to the audit daemon."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500005, V-281097, SV-281097r1268226_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      grubby --info=ALL | grep args
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ audit=1" }
      - { none: "~ audit=0" }
    rationale: |
      Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.

      If auditing is enabled late in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state information available only if auditing is enabled before a given process is created.
    remediation: |
      Configure RHEL 10 to enable auditing of processes that start prior to the audit daemon with the following command:

      $ sudo grubby --update-kernel=ALL --args="audit=1"

      Add or modify the following line in "/etc/default/grub" to ensure the configuration survives kernel updates:

      GRUB_CMDLINE_LINUX="audit=1"
  - id: "STIG-RHEL-10-500010-audit_local_events-attrs"
    name: "RHEL 10 must audit local events. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500010, V-281098, SV-281098r1268225_rule, CAT II. CCI-000169. NIST SP 800-53 Rev. 4: AU-12."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Without establishing what type of events occurred, along with the source, location, and outcome, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack.

      If option "local_events" is not set to "yes", only events from the network will be aggregated.
    remediation: |
      Configure RHEL 10 to generate audit records for local events by adding or updating the following line in "/etc/audit/auditd.conf":

      local_events = yes

      Restart the audit daemon with the following command for the changes to take effect:

      $ sudo service auditd restart
