    severity: medium
    run: |
      stat -c "%a" /etc/ssh/*.pub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (4|6)(0|4)(0|4)" }
    rationale: |
      If a public host key file is modified by an unauthorized user, the SSH service may be compromised.
    remediation: |
      Configure RHEL 10 SSH public host key files to have mode "0644" or less permissive.

