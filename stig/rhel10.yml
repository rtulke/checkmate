  - id: "STIG-RHEL-10-200634-ssh_config_clientaliveinterval"
    name: "RHEL 10 must be configured so that the file integrity tool verifies Access Control Lists (ACLs)."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200634, V-280981, SV-280981r1165298_rule, CAT II. CCI-002475. NIST SP 800-53 Rev. 4: SC-28."
