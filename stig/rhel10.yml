  - id: "STIG-RHEL-10-400190-audit_log_dir_mode-attrs"
    name: "RHEL 10 must enforce the audit log directory to have a mode of 0750 or less permissive to prevent unauthorized read access."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400190, V-281055, SV-281055r1165520_rule, CAT II. CCI-000162, CCI-000163, CCI-000164. NIST SP 800-53 Rev. 4: AU-9, SI-11."
