  - id: "STIG-RHEL-10-600430-faillock_directory-attrs"
    name: "RHEL 10 must ensure account lockouts persist. (/etc/security/faillock.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600430, V-281198, SV-281198r1166546_rule, CAT II. CCI-000044, CCI-002238. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
