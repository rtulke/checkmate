  - id: "STIG-RHEL-10-800110-ipv4_martians_live"
    name: "RHEL 10 must log Internet Protocol version 4 (IPv4) packets with impossible addresses."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-800110, V-281343, SV-281343r1167179_rule, CAT II. CCI-002385, CCI-001098. NIST SP 800-53 Rev. 4: SC-5, SC-7."
