    remediation: |
      Configure RHEL 10 to disable the "ctrl-alt-del.target" with the following command:

      $ sudo systemctl disable --now ctrl-alt-del.target
      $ sudo systemctl mask --now ctrl-alt-del.target
  - id: "STIG-RHEL-10-701050-kexec_load_live"
    name: "RHEL 10 must prevent the loading of a new kernel for later execution."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-701050, V-281307, SV-281307r1268241_rule, CAT I. CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      sysctl -n kernel.kexec_load_disabled
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: |
      Changes to any software components can have significant effects on the overall security of the operating system. This requirement ensures the software has not been tampered with and has been provided by a trusted vendor.

      Disabling kexec_load prevents an unsigned kernel image (that could be a windows kernel or modified vulnerable kernel) from being loaded. Kexec can be used to subvert the entire secureboot process and should be avoided at all costs, especially because it can load unsigned kernel images.
    remediation: |
      Configure RHEL 10 to disable kernel image loading.

      Create a drop-in if it does not already exist:

      $ sudo vi /etc/sysctl.d/99-kernel_kexec_load_disabled.conf

      Add the following to the file:

      kernel.kexec_load_disabled = 1

      Reload settings from all system configuration files with the following command:

      $ sudo sysctl --system
  - id: "STIG-RHEL-10-701050-kexec_load_conf"
    name: "RHEL 10 must prevent the loading of a new kernel for later execution. (conf)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-701050, V-281307, SV-281307r1268241_rule, CAT I. CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      grep kernel.kexec_load_disabled /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^.*conf:kernel.kexec_load_disabled\\s*=\\s*1" }
      - { none: "~ ^.*conf:kernel.kexec_load_disabled\\s*=\\s*(0|[2-9])" }
    rationale: |
      Changes to any software components can have significant effects on the overall security of the operating system. This requirement ensures the software has not been tampered with and has been provided by a trusted vendor.

      Disabling kexec_load prevents an unsigned kernel image (that could be a windows kernel or modified vulnerable kernel) from being loaded. Kexec can be used to subvert the entire secureboot process and should be avoided at all costs, especially because it can load unsigned kernel images.
    remediation: |
      Configure RHEL 10 to disable kernel image loading.

      Create a drop-in if it does not already exist:

      $ sudo vi /etc/sysctl.d/99-kernel_kexec_load_disabled.conf

      Add the following to the file:

      kernel.kexec_load_disabled = 1

      Reload settings from all system configuration files with the following command:

      $ sudo sysctl --system
  - id: "STIG-RHEL-10-000530-homedir_exists"
    name: "RHEL 10 must use a separate file system for user home directories (such as /home or an equivalent)."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-000530, V-280937, SV-280937r1184727_rule, CAT II. CCI-002385. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/home'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: |
      Ensuring that "/home" is mounted on its own partition enables the setting of more restrictive mount options and helps ensure that users cannot trivially fill partitions used for log or audit data storage.
    remediation: |
      Configure RHEL 10 to use a separate file system for user home directories by migrating the "/home" directory onto a separate file system/partition.
  - id: "STIG-RHEL-10-000540-tmp_exists"
    name: "RHEL 10 must use a separate file system for /tmp."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-000540, V-280938, SV-280938r1184728_rule, CAT II. CCI-002385. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/tmp'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: |
      The "/tmp" partition is used as temporary storage by many programs. Placing "/tmp" in its own partition enables the setting of more restrictive mount options, which can help protect programs that use it.
    remediation: |
      Configure RHEL 10 to use a separate file system for temporary storage directories by migrating the "/tmp" path onto a separate file system.
  - id: "STIG-RHEL-10-000550-var_separate_filesystem"
    name: "RHEL 10 must use a separate file system for /var."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-000550, V-280939, SV-280939r1184729_rule, CAT II. CCI-002385. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/var'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: |
      Ensuring that "/var" is mounted on its own partition enables the setting of more restrictive mount options. This helps protect system services such as daemons or other programs that use it. It is not uncommon for the "/var" directory to contain world-writable directories installed by other software packages.
    remediation: |
      Configure RHEL 10 to use a separate file system for the "/var" directory by migrating the "/var" path onto a separate file system.
  - id: "STIG-RHEL-10-000560-removable_nodev"
    name: "RHEL 10 must use a separate file system for /var/log."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-000560, V-280940, SV-280940r1184730_rule, CAT II. CCI-002385. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      grep "1" /sys/block/*/removable | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 0" }
      - { none: "~ [1-9]" }
    rationale: |
      Placing "/var/log" in its own partition enables better separation between log files and other files in "/var/".
    remediation: |
      Configure RHEL 10 to use a separate file system for log file directories by migrating the "/var/log" path onto a separate file system.
  - id: "STIG-RHEL-10-000570-vartmp_exists"
    name: "RHEL 10 must use a separate file system for /var/tmp."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-000570, V-280941, SV-280941r1184731_rule, CAT II. CCI-002385. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-rhel10, stig-cat-2]
