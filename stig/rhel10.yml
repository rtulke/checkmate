  - id: "STIG-RHEL-10-200635-aide_conf_crypto_xattrs"
    name: "RHEL 10 must be configured so that the file integrity tool verifies extended attributes."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200635, V-280982, SV-280982r1165301_rule, CAT II. CCI-002475. NIST SP 800-53 Rev. 4: SC-28."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      grep -E '(\/usr\/sbin\/(audit|au|rsys))' /etc/aide.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ usr/sbin/auditctl.*xattrs" }
      - { some: "~ usr/sbin/auditd.*xattrs" }
      - { some: "~ usr/sbin/ausearch.*xattrs" }
      - { some: "~ usr/sbin/aureport.*xattrs" }
      - { some: "~ usr/sbin/autrace.*xattrs" }
      - { some: "~ usr/sbin/augenrules.*xattrs" }
    rationale: |
      RHEL 10 installation media ships with an optional file integrity tool called Advanced Intrusion Detection Environment (AIDE). AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file is under the "/etc" directory.

      Extended attributes in file systems are used to contain arbitrary data and file metadata with security implications.
    remediation: |
      Configure RHEL 10 so that the file integrity tool checks file and directory extended attributes.

      If AIDE is installed, ensure the "xattrs" rule is present on all uncommented file and directory selection lists.
  - id: "STIG-RHEL-10-200640-rsyslog_installed"
