  - id: "STIG-RHEL-10-200692-postfix_prevent"
    name: "RHEL 10 must be configured to prevent unrestricted mail relaying."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200692, V-280999, SV-280999r1165352_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      if command -v postconf; then postconf -n smtpd_client_restrictions; else echo 'OK postgres is not installed.'; fi
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ smtpd_client_restrictions = permit_mynetworks,reject" }
    rationale: |
