    run: |
      INT_UID=`awk -F: '$3 >= 1000 { print $1 }' /etc/passwd | grep -v nobody`; for name in $INT_UID; do grep $name /etc/shadow | awk -F: '$5 > 180 || $5 <= 0 {print $1}'; done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: |
      Any password, no matter how complex, can eventually be cracked; therefore, passwords need to be changed periodically. If RHEL 10 does not limit the lifetime of passwords and force users to change their passwords, there is the risk that RHEL 10 passwords could be compromised.
    remediation: |
      Configure RHEL 10 to enforce a 180-day maximum password lifetime restriction on user account passwords.

      Set the 180-day maximum password lifetime restriction with the following command:

      $ sudo passwd -x 180 [user]
  - id: "STIG-RHEL-10-600120-create_home_login-attrs"
    name: "RHEL 10 must assign a home directory for local interactive user accounts upon creation. (/etc/login.defs: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600120, V-281171, SV-281171r1166465_rule, CAT II. CCI-002824. NIST SP 800-53 Rev. 4: SI-16."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      If local interactive users are not assigned a valid home directory, there is no place for the storage and control of files they should own.
    remediation: |
      Configure RHEL 10 to assign home directories to all new local interactive users by setting the "CREATE_HOME" parameter in "/etc/login.defs" to "yes" as follows:

      CREATE_HOME yes
  - id: "STIG-RHEL-10-600120-create_home_login-content"
