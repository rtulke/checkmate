  - id: "STIG-RHEL-10-400160-primary_group_set_manual"
    name: "RHEL 10 must ensure that all local interactive user home directories are group-owned by the home directory owner's primary group."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400160, V-281049, SV-281049r1268226_rule, CAT II. CCI-000213, CCI-002385. NIST SP 800-53 Rev. 4: AC-3, SC-5."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      echo "MANUAL - Validate users primary groups are set as expected"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: |
      If the group identifier (GID) of a local interactive user's home directory is not the same as the primary GID of the user, this would allow unauthorized access to the user's files. Users who share the same group may not be able to access files that they legitimately should be able to access.
    remediation: |
      Configure RHEL 10 interactive users' home directories to be group-owned by the user's primary GID.

      Change the group owner of a local interactive user's home directory to the group found in "/etc/passwd". To change the group owner of a local interactive user's home directory, use the following command:

      Note: The example will be for the user "disauser", who has a home directory of "/home/disauser" and has a primary group of users.

      $ sudo chgrp users /home/disauser
  - id: "STIG-RHEL-10-400165-audit_log_group-attrs"
    name: "RHEL 10 must enforce group ownership of audit logs by root or by a restricted logging group to prevent unauthorized read access."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400165, V-281050, SV-281050r1184685_rule, CAT II. CCI-000162, CCI-000163, CCI-000164, CCI-001314. NIST SP 800-53 Rev. 4: AU-9, SI-11."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: |
      Unauthorized disclosure of audit records can reveal system and configuration data to attackers, thus compromising its confidentiality.
    remediation: |
      Configure RHEL 10 to prevent unauthorized read access by ensuring that audit logs are group-owned by root or by a restricted logging group.

      Change the group of the directory of "/var/log/audit" to be owned by a correct group.

      Identify the group that is configured to own audit logs:

      $ sudo grep -P '^[ ]*log_group[ ]+=.*$' /etc/audit/auditd.conf

      Change the ownership to that group:

      $ sudo chgrp ${GROUP} /var/log/audit
  - id: "STIG-RHEL-10-400170-audit_log_dir_owner-attrs"
    name: "RHEL 10 must enforce root ownership of the audit log directory to prevent unauthorized read access."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400170, V-281051, SV-281051r1165508_rule, CAT II. CCI-000162, CCI-000163, CCI-000164, CCI-001314. NIST SP 800-53 Rev. 4: AU-9, SI-11."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/var/log/audit'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -d "$f" ] || echo "$f is not a directory"
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
    expect: empty
    rationale: |
      Unauthorized disclosure of audit records can reveal system and configuration data to attackers, thus compromising its confidentiality.
    remediation: |
      Configure RHEL 10 to prevent unauthorized read access by ensuring the audit log directory is "root" owned with the following command:

      $ sudo chown root /var/log/audit
  - id: "STIG-RHEL-10-400175-audit_log_owner-attrs"
    name: "RHEL 10 must enforce root ownership of audit logs to prevent unauthorized access."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400175, V-281052, SV-281052r1165511_rule, CAT II. CCI-000162, CCI-000163, CCI-000164, CCI-001314. NIST SP 800-53 Rev. 4: AU-9, SI-11."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/var/log/audit/audit.log'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -f "$f" ] || echo "$f is not a regular file"
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
    expect: empty
    rationale: |
      Unauthorized disclosure of audit records can reveal system and configuration data to attackers, thus compromising its confidentiality.
    remediation: |
      Configure RHEL 10 to enforce "root" ownership of audit logs to prevent unauthorized access with the following command:

      $ sudo chown root [audit_log_file]

      Replace "[audit_log_file]" with the correct audit log path. By default this location is "/var/log/audit/audit.log".
  - id: "STIG-RHEL-10-400180-audit_disk_error_action-attrs"
    name: "RHEL 10 must enforce group ownership by root or a restricted logging group for audit log files to prevent unauthorized access."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400180, V-281053, SV-281053r1165514_rule, CAT II. CCI-000162, CCI-000163, CCI-000164, CCI-001314. NIST SP 800-53 Rev. 4: AU-9, SI-11."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: |
      Unauthorized disclosure of audit records can reveal system and configuration data to attackers, thus compromising its confidentiality.
    remediation: |
      Configure RHEL 10 to enforce group ownership by "root" or a restricted logging group for audit log files to prevent unauthorized access.

      Identify the group that is configured to own the audit log:

      $ sudo grep -P '^[ ]*log_group[ ]+=.*$' /etc/audit/auditd.conf

      Change the ownership to that group using the following command:

      $ sudo chgrp ${log_group} ${log_file}
