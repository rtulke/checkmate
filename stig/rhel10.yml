  - id: "STIG-RHEL-10-500210-audit_action_mail_acct-attrs"
    name: "RHEL 10 must notify the system administrator (SA) and/or information system security officer (ISSO) (at a minimum) of an audit processing failure. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500210, V-281114, SV-281114r1166294_rule, CAT II. CCI-000139, CCI-001855. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs as required. Without this notification, the security personnel may be unaware of an impending failure of the audit capability, and system operation may be adversely affected.

      Audit processing failures include software/hardware errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded.

      This requirement applies to each audit data storage repository (i.e., distinct information system component where audit records are stored), the centralized audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both.
    remediation: |
      Configure RHEL 10 to notify the SA and/or ISSO (at a minimum) of an audit processing failure.

      Edit the following line in "/etc/audit/auditd.conf" to ensure administrators are notified via email for those situations:

      action_mail_acct = root

      Restart the audit daemon with the following command for the changes to take effect:

      $ sudo service auditd restart
