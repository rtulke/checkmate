    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200640, V-280983, SV-280983r1273566_rule, CAT II. CCI-001851, CCI-000154. NIST SP 800-53 Rev. 4: AU-4, AU-6."
