  - id: "STIG-RHEL-10-800090-ipv4_allredirects_live"
    name: "RHEL 10 must ignore Internet Protocol version 4 (IPv4) Internet Control Message Protocol (ICMP) redirect messages."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-800090, V-281341, SV-281341r1167173_rule, CAT II. CCI-002385, CCI-001096. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.all.accept_redirects
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: |
      ICMP redirect messages are used by routers to inform hosts that a more direct route exists for a particular destination. These messages modify the host's route table and are unauthenticated. An illicit ICMP redirect message could result in a man-in-the-middle attack.

      This feature of the IPv4 protocol has few legitimate uses. It should be disabled unless absolutely required.
    remediation: |
      Configure RHEL 10 to ignore IPv4 ICMP redirect messages.

      Create a configuration file if it does not already exist:

      $ sudo vi /etc/sysctl.d/99-ipv4_accept_redirects.conf

      Add the following line to the file:

      net.ipv4.conf.all.accept_redirects = 0

      Reload settings from all system configuration files with the following command:

      $ sudo sysctl --system
