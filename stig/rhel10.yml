  - id: "STIG-RHEL-10-700550-ssh_config_x11forward"
    name: "RHEL 10 must be configured so that the Secure Shell (SSH) daemon disables remote X connections for interactive users."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700550, V-281258, SV-281258r1184758_rule, CAT II. CCI-002696. NIST SP 800-53 Rev. 4: CM-6."
