  - id: "STIG-RHEL-10-800100-ipv4_all_accept_source_route_live"
    name: "RHEL 10 must not forward Internet Protocol version 4 (IPv4) source-routed packets."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-800100, V-281342, SV-281342r1167176_rule, CAT II. CCI-002385, CCI-001097. NIST SP 800-53 Rev. 4: SC-5, SC-7."
