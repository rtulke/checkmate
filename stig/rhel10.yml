  - id: "STIG-RHEL-10-701210-autofs_notrunning-enabled"
    name: "RHEL 10 must disable file system automount function. (Service autofs.service is not enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-701210, V-281323, SV-281323r1273607_rule, CAT II. CCI-000778, CCI-001958. NIST SP 800-53 Rev. 4: IA-3."
