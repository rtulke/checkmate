  - id: "STIG-RHEL-10-600020-system_acct_no_shell"
    name: "RHEL 10 must not assign an interactive login shell for system accounts."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600020, V-281168, SV-281168r1273589_rule, CAT II. CCI-002696. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      awk -F: '($3<1000){print $1 ":" $7}' /etc/passwd | grep -vE "nologin|sync|shutdown|halt|false|root"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: |
      Ensuring shells are not given to system accounts upon login makes it more difficult for attackers to use system accounts.
    remediation: |
      Configure RHEL 10 so that all noninteractive accounts on the system do not have an interactive shell assigned to them.

      If the system account needs a shell assigned for mission operations, document the need with the information system security officer (ISSO).

      Run the following command to disable the interactive shell for a specific noninteractive user account:

      $ sudo usermod --shell /usr/sbin/nologin <user>
  - id: "STIG-RHEL-10-600100-pass_max_days_login-attrs"
    name: "RHEL 10 user account passwords for new users or password changes must have a 180-day maximum password lifetime restriction in /etc/login.defs. (/etc/login.defs: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600100, V-281169, SV-281169r1273590_rule, CAT II. CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Any password, no matter how complex, can eventually be cracked; therefore, passwords need to be changed periodically. If the operating system does not limit the lifetime of passwords and force users to change their passwords, there is the risk that the operating system passwords could be compromised.

      Setting the password maximum age ensures users are required to periodically change their passwords. Requiring shorter password lifetimes increases the risk of users writing down the password in a convenient location subject to physical compromise.
    remediation: |
      Configure RHEL 10 to enforce a 180-day maximum password lifetime.

      Add, or modify the following line in the "/etc/login.defs" file:

      PASS_MAX_DAYS 180
  - id: "STIG-RHEL-10-600100-pass_max_days_login-content"
