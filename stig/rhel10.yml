  - id: "STIG-RHEL-10-300070-ipsec_libreswan-attrs"
    name: "RHEL 10 must use FIPS 140-3-approved cryptographic algorithms for IP tunnels. (/etc/ipsec.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-300070, V-281014, SV-281014r1268222_rule, CAT I. CCI-000068. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      f='/etc/ipsec.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Overriding the systemwide cryptographic policy makes the behavior of the Libreswan service violate expectations and makes system configuration more fragmented.
    remediation: |
      Configure RHEL 10 so that Libreswan uses the systemwide cryptographic policy.

      Add the following line to "/etc/ipsec.conf":

      include /etc/crypto-policies/back-ends/libreswan.config
