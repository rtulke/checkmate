  - id: "STIG-RHEL-10-500120-audit_log_format-attrs"
    name: "RHEL 10 must produce audit records containing information to establish the identity of any individual or process associated with the event. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500120, V-281110, SV-281110r1166282_rule, CAT II. CCI-001487. NIST SP 800-53 Rev. 4: AU-3, CM-6."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Without establishing what type of events occurred, along with the source, location, and outcome, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack.

      Audit record content that may be necessary to satisfy this requirement includes, for example, time stamps, source and destination addresses, user/process identifiers, event descriptions, success/fail indications, filenames involved, and access control or flow control rules invoked.

      Enriched logging aids in making sense of who, what, and when events occur on a system. Without this, determining root cause of an event will be much more difficult.
    remediation: |
      Configure RHEL 10 audit system to resolve audit information before writing to disk.

      Edit the "/etc/audit/auditd.conf" file and add or update the "log_format" option:

      log_format = ENRICHED

      Restart the audit daemon with the following command for the changes to take effect:

      $ sudo service auditd restart
