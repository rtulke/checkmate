  - id: "STIG-RHEL-10-500115-audit_overflow_action-attrs"
    name: "RHEL 10 must take appropriate action when the internal event queue is full. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500115, V-281109, SV-281109r1184691_rule, CAT II. CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      The audit system must have an action set up in case the internal event queue becomes full so that no data is lost. Information stored in one location is vulnerable to accidental or incidental deletion or alteration.

      Off-loading is a common process in information systems with limited audit storage capacity.
    remediation: |
      Configure RHEL 10 to take appropriate action when the internal event queue is full.

      Edit the "/etc/audit/auditd.conf" file and add or update the "overflow_action" option:

      overflow_action = syslog

      Restart the audit daemon with the following command for the changes to take effect:

      $ sudo service auditd restart
