  - id: "STIG-RHEL-10-701070-protect_hardlinks_live"
    name: "RHEL 10 must enable kernel parameters to enforce discretionary access control (DAC) on hardlinks."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-701070, V-281309, SV-281309r1184631_rule, CAT II. CCI-002165, CCI-002235. NIST SP 800-53 Rev. 4: AC-3, AC-6."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      sysctl -n fs.protected_hardlinks
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: |
      By enabling the "fs.protected_hardlinks" kernel parameter, users can no longer create soft or hard links to files they do not own. Disallowing such hardlinks mitigates vulnerabilities based on insecure file systems accessed by privileged programs, avoiding an exploitation vector exploiting unsafe use of open() or creat().
    remediation: |
      Configure RHEL 10 to enable DAC on hardlinks.

      Create a drop-in if it does not already exist:

      $ sudo vi /etc/sysctl.d/99-fs_protected_hardlinks.conf

      Add the following to the file:

      fs.protected_hardlinks = 1

      Reload settings from all system configuration files with the following command:

      $ sudo sysctl --system
