  - id: "STIG-RHEL-10-800300-Networkmgr_DNS"
    name: "RHEL 10 must configure a DNS processing mode in Network Manager to avoid conflicts with other Domain Name Server (DNS) managers and to not leak DNS queries to untrusted networks."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-800300, V-281362, SV-281362r1167236_rule, CAT II. CCI-002385, CCI-001115. NIST SP 800-53 Rev. 4: SC-5, SC-7."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      NetworkManager --print-config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^dns\\s*=\\s*none" }
    rationale: |
      To ensure that DNS resolver settings are respected, a DNS mode in Network Manager must be configured. The following are common DNS values in "NetworkManager.conf [main]":

      - default: NetworkManager will update "/etc/resolv.conf" to reflect the nameservers provided by currently active connections.
      - none: NetworkManager will not modify "/etc/resolv.conf". Used when DNS is managed manually or by another service.
      - systemd-resolved: Uses "systemd-resolved" to manage DNS.
      - dnsmasq: Enables the internal "dnsmasq" plugin.
    remediation: |
      Configure RHEL 10 to use a DNS mode in Network Manager.

      In "/etc/NetworkManager/NetworkManager.conf", add the following line in the "[main]" section:

      dns = none

      Where <dns processing mode> is default, none, or systemd-resolved.

      Network Manager must be reloaded for the change to take effect:

      $ sudo systemctl reload NetworkManager
  - id: "STIG-RHEL-10-800310-tftp_secure_if_installed"
    name: "RHEL 10 must be configured to operate in secure mode if the Trivial File Transfer Protocol (TFTP) server service is required."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-800310, V-281363, SV-281363r1195454_rule, CAT II. CCI-000197. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      /bin/bash -lc 'if ! rpm -q tftp-server &>/dev/null; then echo COMPLIANT_NOT_INSTALLED; exit 0; fi; es=$(systemctl cat tftp.service 2>/dev/null | grep -i ^ExecStart || true); echo "$es"; echo "$es" | grep -qE "(^|[[:space:]])-s([[:space:]]|$)"'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (COMPLIANT_NOT_INSTALLED|.*-s.*)" }
    rationale: |
      Restricting TFTP to a specific directory prevents remote users from copying, transferring, or overwriting system files.
    remediation: |
      Configure RHEL 10 TFTP to operate in secure mode with the following command:

      $ sudo systemctl edit tftp.service

      In the editor, enter the following:

      [Service]
      ExecStart=/usr/sbin/in.tftpd -s /var/lib/tftpboot

      After making changes, reload the systemd daemon and restart the TFTP service as follows:

      $ sudo systemctl daemon-reload
      $ sudo systemctl restart tftp.service
  - id: "STIG-RHEL-10-900000-audit_max_log_file_action-attrs"
    name: "RHEL 10 must enforce mode 0640 or less for the /etc/audit/auditd.conf file to prevent unauthorized access."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-900000, V-281364, SV-281364r1167242_rule, CAT II. CCI-000171. NIST SP 800-53 Rev. 4: AU-12."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7137)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
    expect: empty
    rationale: |
      Without the capability to restrict the roles and individuals that can select which events are audited, unauthorized personnel may be able to prevent the auditing of critical events. Misconfigured audits may degrade the system's performance by overwhelming the audit log. Misconfigured audits may also make it more difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.
    remediation: |
      Configure RHEL 10 to set the mode of the "/etc/audit/auditd.conf" file to "0640" with the following command:

      $ sudo chmod 0640 /etc/audit/auditd.conf
  - id: "STIG-RHEL-10-900100-audit_conf_login_immut-attrs"
    name: "RHEL 10 must prevent unauthorized changes to the audit system. (/etc/audit/audit.rules: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-900100, V-281365, SV-281365r1167245_rule, CAT II. CCI-000162, CCI-000163, CCI-000164. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/audit.rules'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Unauthorized disclosure of audit records can reveal system and configuration data to attackers, thus compromising its confidentiality.

      Audit information includes all information (e.g., audit records, audit settings, audit reports) needed to successfully audit RHEL 10 system activity.

      In immutable mode, unauthorized users cannot execute changes to the audit system to potentially hide malicious activity and then put the audit rules back. A system reboot would be noticeable, and a system administrator could then investigate the unauthorized changes.
    remediation: |
      Configure RHEL 10 to protect the audit system from unauthorized changes.

      Set the audit rules to be immutable by adding the following line to end of "/etc/audit/rules.d/audit.rules":

      -e 2

      Restart the audit daemon with the following command for the changes to take effect:

      $ sudo service auditd restart
  - id: "STIG-RHEL-10-900100-audit_conf_login_immut-content"
    name: "RHEL 10 must prevent unauthorized changes to the audit system. (/etc/audit/audit.rules has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-900100, V-281365, SV-281365r1167245_rule, CAT II. CCI-000162, CCI-000163, CCI-000164. NIST SP 800-53 Rev. 4: AU-9."
