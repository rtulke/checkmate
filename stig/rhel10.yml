  - id: "STIG-RHEL-10-400335-user_initiate_files"
    name: "RHEL 10 must enforce that all local initialization files configured by systemd-tmpfiles have mode 0600 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400335, V-281084, SV-281084r1268226_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      find /home/ -name "\.*" -perm /g+wx,o+wx
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: |
      Excessive permissions on local interactive user home directories may allow unauthorized access to user files by other users.
    remediation: |
      Configure RHEL 10 to enforce that all local initialization files configured by systemd-tmpfiles have mode "0600" or less permissive.

      Ensure the following lines are in a ".conf" file under "/etc/tmpfiles.d/":

      C /root/.bash_logout   600 root root - /usr/share/rootfiles/.bash_logout
      C /root/.bash_profile  600 root root - /usr/share/rootfiles/.bash_profile
      C /root/.bashrc        600 root root - /usr/share/rootfiles/.bashrc
      C /root/.cshrc         600 root root - /usr/share/rootfiles/.cshrc
      C /root/.tcshrc        600 root root - /usr/share/rootfiles/.tcshrc
  - id: "STIG-RHEL-10-400340-ssh_priv_keys_perms"
    name: "RHEL 10 must enforce mode 0600 or less permissive for Secure Shell (SSH) private host key files."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400340, V-281085, SV-281085r1268226_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      stat -c "%a" /etc/ssh/*_key
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (4|6)00" }
    rationale: |
      If an unauthorized user obtains the private SSH host key file, the host could be impersonated.
    remediation: |
      Configure RHEL 10 to enforce mode "0600" for SSH private host key files with the following command:

      $ sudo chmod 0600 /etc/ssh/ssh_host*key

      Restart the SSH daemon for the changes to take effect:

      $ sudo systemctl restart sshd.service
  - id: "STIG-RHEL-10-400345-grub_cfg_group-attrs"
    name: "RHEL 10 must enforce root group ownership of the /boot/grub2/grub.cfg file."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400345, V-281086, SV-281086r1268226_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/boot/grub2/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: |
      The "root" group is a highly privileged group. Furthermore, the group owner of this file should not have any access privileges anyway.
    remediation: |
      Configure RHEL 10 to enforce group ownership of the "/boot/grub2/grub.cfg" file.

      Change the group owner of the file "/boot/grub2/grub.cfg" to "root" by running the following command:

      $ sudo chgrp root /boot/grub2/grub.cfg
  - id: "STIG-RHEL-10-400350-grub_cfg_owner-attrs"
    name: "RHEL 10 must enforce root ownership of the /boot/grub2/grub.cfg file."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400350, V-281087, SV-281087r1268226_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/boot/grub2/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
    expect: empty
    rationale: |
      The " /boot/grub2/grub.cfg" file stores sensitive system configuration. Protection of this file is critical for system security.
    remediation: |
      Configure RHEL 10 to enforce ownership of the "/boot/grub2/grub.cfg" file.

      Change the owner of the "/boot/grub2/grub.cfg" file to "root" by running the following command:

      $ sudo chown root /boot/grub2/grub.cfg
  - id: "STIG-RHEL-10-400355-home_nodev"
    name: "RHEL 10 must prevent device files from being interpreted on file systems that contain user home directories."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400355, V-281088, SV-281088r1165619_rule, CAT II. CCI-001764. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/home'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nodev(,|$)"
    rationale: |
      The "nodev" mount option causes the system to not interpret character or block special devices. Executing character or block special devices from untrusted file systems increases the opportunity for nonprivileged users to attain unauthorized administrative access.

      The only legitimate location for device files is the "/dev" directory located on the root partition, with the exception of chroot jails if implemented.
    remediation: |
      Configure RHEL 10 to prevent device files from being interpreted on file systems that contain user home directories.

      Modify "/etc/fstab" to use the "nodev" option on the "/home" directory.
  - id: "STIG-RHEL-10-400360-home_nosuid"
    name: "RHEL 10 must prevent files with the setuid and setgid bit set from being executed on file systems that contain user home directories."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400360, V-281089, SV-281089r1165622_rule, CAT II. CCI-001764. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/home'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nosuid(,|$)"
    rationale: |
      The "nosuid" mount option causes the system to not execute "setuid" and "setgid" files with owner privileges. This option must be used for mounting any file system not containing approved "setuid" and "setguid" files. Executing files from untrusted file systems increases the opportunity for nonprivileged users to attain unauthorized administrative access.
    remediation: |
      Configure RHEL 10 to prevent files with the "setuid" and "setgid" bit set from being executed on file systems that contain user home directories.

      Modify "/etc/fstab" to use the "nosuid" option on the "/home" directory.
  - id: "STIG-RHEL-10-400365-home_noexec"
    name: "RHEL 10 must prevent code from being executed on file systems that contain user home directories."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400365, V-281090, SV-281090r1268226_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/home'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]noexec(,|$)"
    rationale: |
      The "noexec" mount option causes the system to not execute binary files. This option must be used for mounting any file system not containing approved binary files, as they may be incompatible. Executing files from untrusted file systems increases the opportunity for nonprivileged users to attain unauthorized administrative access.
    remediation: |
      Configure RHEL 10 to prevent code from being executed on file systems that contain user home directories.

      Modify "/etc/fstab" to use the "noexec" option on the "/home" directory.
