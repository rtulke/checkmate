      $ sudo service auditd restart
  - id: "STIG-RHEL-10-500015-audit_write_logs-attrs"
    name: "RHEL 10 must write audit records to disk. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500015, V-281099, SV-281099r1165652_rule, CAT II. CCI-000163. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Audit data must be synchronously written to disk to ensure log integrity. This setting ensures that all audit event data is written to disk.
    remediation: |
      Configure the RHEL 10 audit system to write log files to the disk.

      Edit the "/etc/audit/auditd.conf" file and add or update the "write_logs" option to "yes":

      write_logs = yes

      Restart the audit daemon with the following command for changes to take effect:

      $ sudo service auditd restart
