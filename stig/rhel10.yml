  - id: "STIG-RHEL-10-700680-shosts_equiv_check"
    name: "RHEL 10 must not have a shosts.equiv file on the system."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700680, V-281271, SV-281271r1268226_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: SC-8."
