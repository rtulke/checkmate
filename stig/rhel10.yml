  - id: "STIG-RHEL-10-600520-sudo_password_restrict_elevate"
    name: "RHEL 10 must restrict privilege elevation to authorized personnel."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600520, V-281207, SV-281207r1166573_rule, CAT II. CCI-002696. NIST SP 800-53 Rev. 4: SI-6."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      grep -iwR ALL /etc/sudoers /etc/sudoers.d/
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*:\\w+\\s+ALL\\s+ALL=\\(ALL\\) ALL" }
      - { none: "~ ^.*:\\w+\\s+ALL\\s+ALL=\\(ALL:ALL\\) ALL" }
    rationale: |
      If the "sudoers" file is not configured correctly, any user defined on the system can initiate privileged actions on the target system.
    remediation: |
      Configure RHEL 10 to restrict privilege elevation to authorized personnel.

      Remove the following entries from the "/etc/sudoers" file or configuration file under "/etc/sudoers.d/":

      ALL     ALL=(ALL) ALL
      ALL     ALL=(ALL:ALL) ALL
  - id: "STIG-RHEL-10-600530-sudo_password_reauth_escalate"
    name: "RHEL 10 must require users to reauthenticate for privilege escalation."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600530, V-281208, SV-281208r1166576_rule, CAT II. CCI-002038. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      grep -i '!authenticate' /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ ^.*:Defaults.*!authenticate" }
    rationale: |
      Without reauthentication, users may access resources or perform tasks for which they do not have authorization.

      When operating systems provide the capability to escalate a functional capability, it is critical that the user reauthenticate.
    remediation: |
      Configure RHEL 10 to not allow users to execute privileged actions without authenticating.

      Remove any occurrence of "!authenticate" found in the "/etc/sudoers" file or files in the "/etc/sudoers.d" directory:

      $ sudo sed -i '/\!authenticate/ s/^/# /g' /etc/sudoers /etc/sudoers.d/*
  - id: "STIG-RHEL-10-600540-sudo_reauth"
    name: "RHEL 10 must require reauthentication when using the sudo command."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600540, V-281209, SV-281209r1166579_rule, CAT II. CCI-002038. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      grep -i 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^.*:Defaults.*timestamp_timeout=0" }
      - { none: "~ ^.*:Defaults.*timestamp_timeout\\s*=\\s*-\\d" }
    rationale: |
      Without reauthentication, users may access resources or perform tasks for which they do not have authorization.

      When operating systems provide the capability to escalate a functional capability, it is critical that the organization requires the user to reauthenticate when using the "sudo" command.

      If the value is set to an integer less than "0", the user's time stamp will not expire, and the user will not have to reauthenticate for privileged actions until the user's session is terminated.
    remediation: |
      Configure RHEL 10 to reauthenticate "sudo" commands after the specified timeout.

      Add the following line to "/etc/sudoers" or a file in "/etc/sudoers.d":

      Defaults timestamp_timeout=0
  - id: "STIG-RHEL-10-600550-sudo_password_required"
    name: "RHEL 10 must use the invoking user's password for privilege escalation when using sudo."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600550, V-281210, SV-281210r1166582_rule, CAT II. CCI-002038. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      grep -Ei '(!rootpw|!targetpw|!runaspw)' /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^.*:Defaults.*!targetpw" }
      - { some: "~ ^.*:Defaults.*!rootpw" }
      - { some: "~ ^.*:Defaults.*!runaspw" }
    rationale: |
      If the "rootpw", "targetpw", or "runaspw" flags are defined and not disabled, by default the operating system will prompt the invoking user for the "root" user password.
    remediation: |
      Configure RHEL 10 to use the invoking user's password for privilege escalation when using "sudo".

      Define the following in the Defaults section of the /etc/sudoers file or a single configuration file in the /etc/sudoers.d/ directory:

      Defaults !targetpw
      Defaults !rootpw
      Defaults !runaspw
  - id: "STIG-RHEL-10-600600-system-auth_faillock-attrs"
    name: "RHEL 10 must configure the use of the pam_faillock.so module in the /etc/pam.d/system-auth file. (/etc/pam.d/system-auth: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600600, V-281212, SV-281212r1166588_rule, CAT II. CCI-000044. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/pam.d/system-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      If the pam_faillock.so module is not loaded, the system will not correctly lock out accounts to prevent password guessing attacks.
    remediation: |
      Configure RHEL 10 to include the use of the pam_faillock.so module in the "/etc/pam.d/system-auth" file.

      If PAM is managed with authselect, enable the feature with the following command:

      $ sudo authselect enable-feature with-faillock

      Otherwise, add/modify the appropriate sections of the "/etc/pam.d/system-auth" file to match the following lines:

      Note: The "preauth" line must be listed before pam_unix.so.

      auth required pam_faillock.so preauth
      auth required pam_faillock.so authfail
      account required pam_faillock.so
