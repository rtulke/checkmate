    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600320, V-281191, SV-281191r1195448_rule, CAT II. CCI-004066. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-rhel10, stig-cat-2]
