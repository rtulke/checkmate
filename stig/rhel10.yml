  - id: "STIG-RHEL-10-600110-60days_max_passwd_lifetime"
    name: "RHEL 10 must, for user account passwords, have a 180-day maximum password lifetime restriction"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600110, V-281170, SV-281170r1273591_rule, CAT II. CCI-004066. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-rhel10, stig-cat-2]
