  - id: "STIG-RHEL-10-200690-postfix"
    name: "RHEL 10 must notify designated personnel if baseline configurations are changed in an unauthorized manner."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200690, V-280997, SV-280997r1195387_rule, CAT II. CCI-000139. NIST SP 800-53 Rev. 4: AU-5."
