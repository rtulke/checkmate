  - id: "STIG-RHEL-10-600710-shadow_hash_algo"
    name: "RHEL 10 must be configured to use a FIPS 140-3-approved cryptographic hashing algorithm for system authentication by ensuring that the pam_unix.so module is configured in the system-auth file."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600710, V-281219, SV-281219r1273594_rule, CAT II. CCI-004062, CCI-000803. NIST SP 800-53 Rev. 4: IA-7."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      grep "^password.*pam_unix.so.*sha512" /etc/pam.d/system-auth
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^password\\s+\\S+\\s+pam_unix\\.so\\s.*\\bsha512\\b" }
    rationale: |
      Unapproved mechanisms that are used for authentication to the cryptographic module are not verified and therefore cannot be relied on to provide confidentiality or integrity, and DoW data may be compromised.

      RHEL 10 systems using encryption are required to use FIPS-compliant mechanisms for authenticating to cryptographic modules.

      FIPS 140-3 is the current standard for validating that mechanisms used to access cryptographic modules use authentication that meets DoW requirements. This allows for Security Levels 1, 2, 3, or 4 for use on a general-purpose computing system.
    remediation: |
      Configure RHEL 10 to use a FIPS 140-3-approved cryptographic hashing algorithm for system authentication in "/etc/pam.d/system-auth" via the "pam_unix.so" module.

      Edit/modify the following line in the "/etc/pam.d/system-auth" file to include the sha512 option for pam_unix.so:

      password sufficient pam_unix.so sha512
