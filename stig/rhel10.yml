  - id: "STIG-RHEL-10-800040-chrony_time_check-attrs"
    name: "RHEL 10 must securely compare internal information system clocks at least every 24 hours. (/etc/chrony.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-800040, V-281336, SV-281336r1273614_rule, CAT II. CCI-004923, CCI-004926, CCI-001890, CCI-004922. NIST SP 800-53 Rev. 4: AU-8."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/chrony.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events. Sources outside the configured acceptable allowance (drift) may be inaccurate.

      Synchronizing internal information system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected over a network.

      Depending on the infrastructure being used, the "pool" directive may not be supported.

      Authoritative time sources include the United States Naval Observatory (USNO) time servers, a time server designated for the appropriate DoW network (NIPRNet/SIPRNet), and/or the Global Positioning System (GPS).
    remediation: |
      Configure RHEL 10 to securely compare internal information system clocks at least every 24 hours with an NTP server by adding/modifying the following line in the "/etc/chrony.conf" file:

      server [ntp.server.name] iburst maxpoll 16
  - id: "STIG-RHEL-10-800040-chrony_time_check-content"
    name: "RHEL 10 must securely compare internal information system clocks at least every 24 hours. (/etc/chrony.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-800040, V-281336, SV-281336r1273614_rule, CAT II. CCI-004923, CCI-004926, CCI-001890, CCI-004922. NIST SP 800-53 Rev. 4: AU-8."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/chrony.conf'
    allow_rc: any
    expect: { some: "~ ^server.*\\.mil.*maxpoll\\s([1-9]|1[0-6])" }
    rationale: |
      Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events. Sources outside the configured acceptable allowance (drift) may be inaccurate.

      Synchronizing internal information system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected over a network.

      Depending on the infrastructure being used, the "pool" directive may not be supported.

      Authoritative time sources include the United States Naval Observatory (USNO) time servers, a time server designated for the appropriate DoW network (NIPRNet/SIPRNet), and/or the Global Positioning System (GPS).
    remediation: |
      Configure RHEL 10 to securely compare internal information system clocks at least every 24 hours with an NTP server by adding/modifying the following line in the "/etc/chrony.conf" file:

      server [ntp.server.name] iburst maxpoll 16
  - id: "STIG-RHEL-10-800050-berkley_pkt_filter_live"
    name: "RHEL 10 must enable hardening for the Berkeley Packet Filter (BPF) just-in-time compiler."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-800050, V-281337, SV-281337r1167161_rule, CAT II. CCI-002824. NIST SP 800-53 Rev. 4: SI-16."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.core.bpf_jit_harden
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 2"
    rationale: |
      When hardened, the extended BPF just-in-time (JIT) compiler will randomize any kernel addresses in the BPF programs and maps, and will not expose the JIT addresses in "/proc/kallsyms".
    remediation: |
      Configure RHEL 10 to enable hardening for the BPF JIT compiler.

      Create the drop-in file if it does not already exist:

      $ sudo vi /etc/sysctl.d/99-net_core-bpf_jit_harden.conf

      Add the following line to the file:

      net.core.bpf_jit_harden = 2

      Reload settings from all system configuration files with the following command:

      $ sudo sysctl --system
