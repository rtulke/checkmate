  - id: "STIG-RHEL-10-500300-audit_conf_execve"
    name: "RHEL 10 must generate audit records for successful and unsuccessful uses of the execve system call."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500300, V-281116, SV-281116r1166300_rule, CAT II. CCI-002233, CCI-002234, CCI-004188. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      grep execpriv /etc/audit/audit.rules /etc/audit/rules.d/99_auditd.rules /etc/audit/audit.rules.d/audit.rules
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^.*:-a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv" }
      - { some: "~ ^.*:-a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv" }
      - { some: "~ ^.*:-a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k execpriv" }
      - { some: "~ ^.*:-a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv" }
    rationale: |
      Misuse of privileged functions, either intentionally or unintentionally by authorized users, or by unauthorized external entities that have compromised information system accounts, is a serious and ongoing concern and can have significant adverse impacts on organizations.

      Auditing the use of privileged functions is one way to detect such misuse and identify the risk from insider threats and the advanced persistent threat.
    remediation: |
      Configure RHEL 10 to generate audit records upon successful and unsuccessful attempts to use the "execve" system call.

      Add or update the following file system rules to "/etc/audit/rules.d/audit.rules":

      -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv
      -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv
      -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k execpriv
      -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv

      Restart the audit daemon with the following command for the changes to take effect:

      $ sudo service auditd restart
