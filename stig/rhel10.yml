  - id: "STIG-RHEL-10-700600-ssh_config_pubkeyauth"
    name: "RHEL 10 must be configured so that SSHD accepts public key authentication."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700600, V-281263, SV-281263r1273600_rule, CAT II. CCI-000765, CCI-000766. NIST SP 800-53 Rev. 4: IA-2."
