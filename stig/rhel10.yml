      Audit processing failures include software/hardware errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded.
    remediation: |
      Configure RHEL 10 to shut down when auditing failures occur.

      Add the following line to the bottom of the "/etc/audit/rules.d/audit.rules" file:

      -f 2
  - id: "STIG-RHEL-10-500040-audit_space_left-attrs"
    name: "RHEL 10 must take action when allocated audit record storage volume reaches 75 percent of the audit record storage capacity. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500040, V-281104, SV-281104r1273579_rule, CAT II. CCI-001855. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      If action is not taken when storage volume reaches 75 percent utilization, the auditing system may fail when the storage volume reaches capacity.
    remediation: |
      Configure RHEL 10 to initiate an action when allocated audit record storage volume reaches 75 percent of the repository maximum audit record storage capacity by adding/modifying the following line in the /etc/audit/auditd.conf file:

      space_left  = 25%

      Restart the audit daemon with the following command for the changes to take effect:

      $ sudo service auditd restart
  - id: "STIG-RHEL-10-500040-audit_space_left-content"
    name: "RHEL 10 must take action when allocated audit record storage volume reaches 75 percent of the audit record storage capacity. (/etc/audit/auditd.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500040, V-281104, SV-281104r1273579_rule, CAT II. CCI-001855. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect: { some: "~ ^space_left = 25%" }
    rationale: |
      If action is not taken when storage volume reaches 75 percent utilization, the auditing system may fail when the storage volume reaches capacity.
    remediation: |
      Configure RHEL 10 to initiate an action when allocated audit record storage volume reaches 75 percent of the repository maximum audit record storage capacity by adding/modifying the following line in the /etc/audit/auditd.conf file:

      space_left  = 25%

      Restart the audit daemon with the following command for the changes to take effect:

      $ sudo service auditd restart
  - id: "STIG-RHEL-10-500045-audit_name_format-attrs"
    name: "RHEL 10 must label all off-loaded audit logs before sending them to the central log server. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500045, V-281105, SV-281105r1166267_rule, CAT II. CCI-000132, CCI-001851. NIST SP 800-53 Rev. 4: AU-3, AU-4."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Enriched logging is needed to determine who, what, and when events occur on a system. Without this, determining root cause of an event will be much more difficult.

      When audit logs are not labeled before they are sent to a central log server, the audit data will not be able to be analyzed and tied back to the correct system.
    remediation: |
      Configure RHEL 10 so that all off-loaded audit logs are labeled before sending them to the central log server.

      Edit the "/etc/audit/auditd.conf" file and add or update the "name_format" option:

      name_format = hostname

