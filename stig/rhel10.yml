  - id: "STIG-RHEL-10-200620-opensc_pkg"
    name: "RHEL 10 must have the opensc package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200620, V-280975, SV-280975r1273565_rule, CAT II. CCI-004046, CCI-001953. NIST SP 800-53 Rev. 4: NA."
