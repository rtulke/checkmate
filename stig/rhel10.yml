  - id: "STIG-RHEL-10-200691-root_aliases-attrs"
    name: "RHEL 10 must have mail aliases to notify the information system security officer (ISSO) and system administrator (SA) (at a minimum) of an audit processing failure. (/etc/aliases: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200691, V-280998, SV-280998r1208794_rule, CAT II. CCI-000139. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/aliases'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs as required. Without this notification, the security personnel may be unaware of an impending failure of the audit capability, and system operation may be adversely affected.

      Audit processing failures include software/hardware errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded.

      This requirement applies to each audit data storage repository (i.e., distinct information system component where audit records are stored), the centralized audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both.
    remediation: |
      Configure RHEL 10 to have mail aliases notify the ISSO and SA (at a minimum) of an audit processing failure.

      Edit the aliases map file (by default /etc/aliases) used by Postfix and configure a root alias (using the user ISSO as an example):

      root:    ISSO

      Update the aliases database with the following command:

      $ sudo newaliases
