  - id: "STIG-RHEL-10-700620-ssh_config_permitroot"
    name: "RHEL 10 must not permit direct logins to the root account using remote access via Secure Shell (SSH)."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700620, V-281265, SV-281265r1184765_rule, CAT II. CCI-004045. NIST SP 800-53 Rev. 4: IA-2."
