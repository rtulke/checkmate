  - id: "STIG-RHEL-10-400230-crondirs_perms"
    name: "RHEL 10 must be configured to prohibit modification of permissions for cron configuration files and directories from the operating system defaults."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400230, V-281063, SV-281063r1195403_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-6."
