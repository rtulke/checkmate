      blacklist usb-storage
  - id: "STIG-RHEL-10-700860-firewire_blacklist"
    name: "RHEL 10 must disable Bluetooth."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700860, V-281289, SV-281289r1273601_rule, CAT II. CCI-000381, CCI-001443. NIST SP 800-53 Rev. 4: CM-7."
