  - id: "STIG-RHEL-10-700850-usb-storage_blacklist"
    name: "RHEL 10 must be configured to disable USB mass storage."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700850, V-281288, SV-281288r1166816_rule, CAT II. CCI-000778, CCI-001958. NIST SP 800-53 Rev. 4: IA-3."
