    name: "RHEL 10 must audit local events. (/etc/audit/auditd.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500010, V-281098, SV-281098r1268225_rule, CAT II. CCI-000169. NIST SP 800-53 Rev. 4: AU-12."
