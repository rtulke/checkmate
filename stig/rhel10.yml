    severity: medium
    run: |
      rpm -q --quiet opensc
    expect: true
    rationale: |
      The use of Personal Identity Verification (PIV) credentials facilitates standardization and reduces the risk of unauthorized access.

      The DoW has mandated the use of the common access card (CAC) to support identity management and personal authentication for systems covered under Homeland Security Presidential Directive (HSPD) 12, as well as making the CAC a primary component of layered protection for national security systems.
    remediation: |
      Configure RHEL 10 to have the "opensc" package installed with the following command:

      $ sudo dnf -y install opensc
  - id: "STIG-RHEL-10-200632-aide_hashing-attrs"
    name: "RHEL 10 must use a file integrity tool that is configured to use FIPS 140-3-approved cryptographic hashes for validating file contents and directories. (/etc/aide.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200632, V-280979, SV-280979r1165292_rule, CAT II. CCI-002475. NIST SP 800-53 Rev. 4: SC-28."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/aide.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      RHEL 10 installation media ships with an optional file integrity tool called Advanced Intrusion Detection Environment (AIDE). AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file is under the "/etc" directory.

      File integrity tools use cryptographic hashes for verifying that file contents and directories have not been altered. These hashes must be FIPS 140-3-approved cryptographic hashes.
    remediation: |
      Configure RHEL 10 so that the file integrity tool uses FIPS 140-3 cryptographic hashes for validating file and directory contents.

      If AIDE is installed, ensure the "sha512" rule is present on all uncommented file and directory selection lists, and that no legacy hashes exist.

      By default, AIDE excludes log files such as "/var/log" and other volatile files to reduce unnecessary notifications.
  - id: "STIG-RHEL-10-200632-aide_hashing-content"
    name: "RHEL 10 must use a file integrity tool that is configured to use FIPS 140-3-approved cryptographic hashes for validating file contents and directories. (/etc/aide.conf has the expected content (5 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200632, V-280979, SV-280979r1165292_rule, CAT II. CCI-002475. NIST SP 800-53 Rev. 4: SC-28."
