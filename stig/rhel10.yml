# Generated by tools/cis-import from ansible-lockdown/RHEL10-STIG-Audit (MIT license).
# Do not edit by hand; regenerate with `make stig-import`. See stig/NOTICE.
name: DISA STIG Red Hat Enterprise Linux 10
version: "1.3.0"
description: >
  Automated checks for 395 rules of the DISA Security Technical
  Implementation Guide for Red Hat Enterprise Linux 10 (version 1.3.0), converted from the goss
  audit content of the ansible-lockdown project. Severity follows the STIG
  category: CAT I high, CAT II medium, CAT III low. Rationale and fix
  texts are taken from the DISA STIG V1R3 (30 Sep 2026). Select categories
  with tags, e.g. `--tags stig-cat-1`.

defaults:
  when: "(facts.distro == \"rhel\" or \"rhel\" in facts.distro_like) and facts.version_major == 10"
  timeout: 120s

checks:
  - id: "STIG-RHEL-10-000500-fips_enabled"
    name: "RHEL 10 must enable FIPS mode."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-000500, V-281009, SV-281009r1268222_rule, CAT I. CCI-000068, CCI-000877, CCI-001453, CCI-002890, CCI-003123, CCI-002450, CCI-002418. NIST SP 800-53 Rev. 4: AC-17, MA-4, SC-8, SC-13."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      cat /proc/sys/crypto/fips_enabled
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^1$" }
    rationale: |
      Use of weak or untested encryption algorithms undermines the purposes of using encryption to protect data. The operating system must implement cryptographic modules adhering to the higher standards approved by the federal government because this provides assurance they have been tested and validated.
    remediation: |
      Configure RHEL 10 to implement FIPS mode.

      If this check fails on an installed system, it is a permanent finding until the system is reinstalled with "fips=1" during installation.

      Red Hat 10 does not support switching to strict FIPS mode after installation.
  - id: "STIG-RHEL-10-000510-disk_encryption_pkg"
    name: "RHEL 10 must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information on local disk partitions that requires at-rest protection."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-000510, V-280935, SV-280935r1184775_rule, CAT I. CCI-002476, CCI-001199, CCI-002475. NIST SP 800-53 Rev. 4: SC-28."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet cryptsetup
    expect: true
    rationale: |
      RHEL 10 systems handling data that requires "data-at-rest" protections must employ cryptographic mechanisms to prevent unauthorized disclosure and modification of the information at rest.

      Selection of a cryptographic mechanism is based on the need to protect the integrity of organizational information. The strength of the mechanism is commensurate with the security category and/or classification of the information. Organizations have the flexibility to either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific data structures (e.g., files, records, or fields).
    remediation: |
      Configure RHEL 10 to prevent unauthorized modification of all information at rest by using disk encryption.

      Encrypting a partition in an already installed system is more difficult, because existing partitions will have to be resized and changed.

      To encrypt an entire partition, dedicate a partition for encryption in the partition layout.
  - id: "STIG-RHEL-10-000510-check_encrypted_disks"
    name: "RHEL 10 must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information on local disk partitions that requires at-rest protection. (disks encrypted)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-000510, V-280935, SV-280935r1184775_rule, CAT I. CCI-002476, CCI-001199, CCI-002475. NIST SP 800-53 Rev. 4: SC-28."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      if [ `dmsetup status | awk '{print $NF}' | grep -cv crypt` -ge 1 ] ; then echo "Fail - unencrypted disks"; else echo "OK - System disks encrypted"; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK - System disks encrypted" }
      - { none: "~ Fail - unencrypted disks" }
    rationale: |
      RHEL 10 systems handling data that requires "data-at-rest" protections must employ cryptographic mechanisms to prevent unauthorized disclosure and modification of the information at rest.

      Selection of a cryptographic mechanism is based on the need to protect the integrity of organizational information. The strength of the mechanism is commensurate with the security category and/or classification of the information. Organizations have the flexibility to either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific data structures (e.g., files, records, or fields).
    remediation: |
      Configure RHEL 10 to prevent unauthorized modification of all information at rest by using disk encryption.

      Encrypting a partition in an already installed system is more difficult, because existing partitions will have to be resized and changed.

      To encrypt an entire partition, dedicate a partition for encryption in the partition layout.
  - id: "STIG-RHEL-10-001000-rhel_version_supported-attrs"
    name: "RHEL 10 must be a vendor-supported release. (/etc/redhat-release: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-001000, V-282965, SV-282965r1197252_rule, CAT I. CCI-003376. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      f='/etc/redhat-release'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      An operating system release is considered "supported" if the vendor continues to provide security patches for the product. With an unsupported release, it will not be possible to resolve security issues discovered in the system software.

      Red Hat offers the Extended Update Support (EUS) add-on to a Red Hat Enterprise Linux subscription, for a fee, for customers who wish to standardize on a specific minor release for an extended period.

      End-of-life dates for Red Hat Linux 10 releases are as follows:
      - Current end of Full Support for Red Hat Linux 10 is 31 May 2030.
      - Current end of Maintenance Support for Red Hat Linux 10 is 31 May 2035.
      - Current end of Extended Life Cycle Support (ELS) for Red Hat Linux 9 is 31 May 2038.
    remediation: |
      Upgrade to a supported version of RHEL 10.
  - id: "STIG-RHEL-10-001000-rhel_version_supported-content"
    name: "RHEL 10 must be a vendor-supported release. (/etc/redhat-release has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-001000, V-282965, SV-282965r1197252_rule, CAT I. CCI-003376. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      cat '/etc/redhat-release'
    allow_rc: any
    expect: { some: "~ .*10.[0-9]" }
    rationale: |
      An operating system release is considered "supported" if the vendor continues to provide security patches for the product. With an unsupported release, it will not be possible to resolve security issues discovered in the system software.

      Red Hat offers the Extended Update Support (EUS) add-on to a Red Hat Enterprise Linux subscription, for a fee, for customers who wish to standardize on a specific minor release for an extended period.

      End-of-life dates for Red Hat Linux 10 releases are as follows:
      - Current end of Full Support for Red Hat Linux 10 is 31 May 2030.
      - Current end of Maintenance Support for Red Hat Linux 10 is 31 May 2035.
      - Current end of Extended Life Cycle Support (ELS) for Red Hat Linux 9 is 31 May 2038.
    remediation: |
      Upgrade to a supported version of RHEL 10.
  - id: "STIG-RHEL-10-001030-gpg_checkdnf_conf-attrs"
    name: "RHEL 10 must check the GNU Privacy Guard (GPG) signature of software packages originating from external software repositories before installation. (/etc/dnf/dnf.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-001030, V-280932, SV-280932r1275251_rule, CAT I. CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      f='/etc/dnf/dnf.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Changes to any software components can have significant effects on the overall security of the operating system. This requirement ensures the software has not been tampered with and has been provided by a trusted vendor.

      All software packages must be signed with a cryptographic key recognized and approved by the organization.

      Verifying the authenticity of software prior to installation validates the integrity of the software package received from a vendor.
    remediation: |
      Configure RHEL 10 dnf to always check the GPG signature of software packages originating from external software repositories before installation.

      Add or update the following line in the [main] section of the "/etc/dnf/dnf.conf" file:

      gpgcheck=1

      Note: Any of the following are acceptable: "1", "true", or "yes" (keywords containing letters are case insensitive).
  - id: "STIG-RHEL-10-001030-gpg_checkdnf_conf-content"
    name: "RHEL 10 must check the GNU Privacy Guard (GPG) signature of software packages originating from external software repositories before installation. (/etc/dnf/dnf.conf has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-001030, V-280932, SV-280932r1275251_rule, CAT I. CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      cat '/etc/dnf/dnf.conf'
    allow_rc: any
    expect:
      - { some: "~ ^gpgcheck\\s*=\\s*(1|[Tt]rue|[Yy]es)\\s*$" }
      - { none: "~ ^gpgcheck\\s*=\\s*(0|[Ff]alse|[Nn]o)\\s*$" }
    rationale: |
      Changes to any software components can have significant effects on the overall security of the operating system. This requirement ensures the software has not been tampered with and has been provided by a trusted vendor.

      All software packages must be signed with a cryptographic key recognized and approved by the organization.

      Verifying the authenticity of software prior to installation validates the integrity of the software package received from a vendor.
    remediation: |
      Configure RHEL 10 dnf to always check the GPG signature of software packages originating from external software repositories before installation.

      Add or update the following line in the [main] section of the "/etc/dnf/dnf.conf" file:

      gpgcheck=1

      Note: Any of the following are acceptable: "1", "true", or "yes" (keywords containing letters are case insensitive).
  - id: "STIG-RHEL-10-001040-localgpg_check_conf-attrs"
    name: "RHEL 10 must check the GNU Privacy Guard (GPG) signature of locally installed software packages before installation. (/etc/dnf/dnf.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-001040, V-280933, SV-280933r1275252_rule, CAT I. CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      f='/etc/dnf/dnf.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Changes to any software components can have significant effects on the overall security of the operating system. This requirement ensures the software has not been tampered with and that it has been provided by a trusted vendor.

      All software packages must be signed with a cryptographic key recognized and approved by the organization.

      Verifying the authenticity of software prior to installation validates the integrity of the software package received from a vendor.
    remediation: |
      Configure RHEL 10 dnf to always check the GPG signature of local software packages before installation.

      Add or update the following line in the [main] section of the "/etc/dnf/dnf.conf" file:

      localpkg_gpgcheck=1

      Note: Any of the following are acceptable: "1", "true", or "yes" (keywords containing letters are case insensitive).
  - id: "STIG-RHEL-10-001040-localgpg_check_conf-content"
    name: "RHEL 10 must check the GNU Privacy Guard (GPG) signature of locally installed software packages before installation. (/etc/dnf/dnf.conf has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-001040, V-280933, SV-280933r1275252_rule, CAT I. CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      cat '/etc/dnf/dnf.conf'
    allow_rc: any
    expect:
      - { some: "~ ^localpkg_gpgcheck\\s*=\\s*(1|[Tt]rue|[Yy]es)\\s*$" }
      - { none: "~ ^localpkg_gpgcheck\\s*=\\s*(0|[Ff]alse|[Nn]o)\\s*$" }
    rationale: |
      Changes to any software components can have significant effects on the overall security of the operating system. This requirement ensures the software has not been tampered with and that it has been provided by a trusted vendor.

      All software packages must be signed with a cryptographic key recognized and approved by the organization.

      Verifying the authenticity of software prior to installation validates the integrity of the software package received from a vendor.
    remediation: |
      Configure RHEL 10 dnf to always check the GPG signature of local software packages before installation.

      Add or update the following line in the [main] section of the "/etc/dnf/dnf.conf" file:

      localpkg_gpgcheck=1

      Note: Any of the following are acceptable: "1", "true", or "yes" (keywords containing letters are case insensitive).
  - id: "STIG-RHEL-10-001050-gpg_check_repos"
    name: "RHEL 10 must have GNU Privacy Guard (GPG) signature verification enabled for all software repositories."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-001050, V-280934, SV-280934r1275255_rule, CAT I. CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    timeout: 120000ms
    run: |
      grep -cREi '^[[:space:]]*gpgcheck[[:space:]]*=[[:space:]]*(0|false|no)' /etc/yum.repos.d/*.repo
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*:0" }
      - { none: "~ ^.*:[1-9]" }
    rationale: |
      Changes to any software components can have significant effects on the overall security of the operating system. This requirement ensures the software has not been tampered with and has been provided by a trusted vendor.

      All software packages must be signed with a cryptographic key recognized and approved by the organization.

      Verifying the authenticity of software prior to installation validates the integrity of the software package received from a vendor.
    remediation: |
      Configure RHEL 10 software repositories defined in "/etc/yum.repos.d/" to have "gpgcheck" enabled with the following command:

      $ sudo sed -i 's/gpgcheck\s*=.*/gpgcheck=1/g' /etc/yum.repos.d/*

      Note: Any of the following are acceptable: "1", "true", or "yes" (keywords containing letters are case insensitive).
  - id: "STIG-RHEL-10-200020-telnet-server"
    name: "RHEL 10 must not have the telnet-server package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200020, V-280944, SV-280944r1184749_rule, CAT I. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet telnet-server
    expect: false
    rationale: |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities are often overlooked and therefore, may remain unsecure. They increase the risk to the platform by providing additional attack vectors.

      The telnet service provides an unencrypted remote access service, which does not provide for the confidentiality and integrity of user passwords or the remote session. If a privileged user were to log in using this service, the privileged user password could be compromised.

      Removing the "telnet-server" package decreases the risk of accidental (or intentional) activation of the telnet service.
    remediation: |
      Configure RHEL 10 to not have the "telnet-server" package installed with the following command:

      $ sudo dnf -y remove telnet-server
  - id: "STIG-RHEL-10-200070-tftp"
    name: "RHEL 10 must not have the tftp package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200070, V-280949, SV-280949r1195338_rule, CAT I. CCI-000197. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet tftp
    expect: false
    rationale: |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities are often overlooked and therefore, may remain unsecure. They increase the risk to the platform by providing additional attack vectors.

      If Trivial File Transfer Protocol (TFTP) is required for operational support (such as transmission of router configurations), its use must be documented with the information system security manager, restricted to only authorized personnel, and have access control rules established.
    remediation: |
      Configure RHEL 10 to not have the "tftp" package installed with the following command:

      $ sudo dnf -y remove tftp
  - id: "STIG-RHEL-10-200090-vsftpd"
    name: "RHEL 10 must not have a File Transfer Protocol (FTP) server package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200090, V-280951, SV-280951r1273560_rule, CAT I. CCI-000197, CCI-000381. NIST SP 800-53 Rev. 4: IA-5, CM-7."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet vsftpd
    expect: false
    rationale: |
      The FTP service provides an unencrypted remote access that does not provide for the confidentiality and integrity of user passwords or the remote session. If a privileged user were to log in using this service, the privileged user password could be compromised. Secure Shell (SSH) or other encrypted file transfer methods must be used in place of this service.

      Removing the "vsftpd" package decreases the risk of accidental activation.
    remediation: |
      Configure RHEL 10 to not have the FTP package installed with the following command:

      $ sudo dnf -y remove vsftpd
  - id: "STIG-RHEL-10-200631-aide_conf_crypto"
    name: "RHEL 10 must use cryptographic mechanisms to protect the integrity of audit tools."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200631, V-280978, SV-280978r1165289_rule, CAT I. CCI-001496. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      grep -E '(\/usr\/sbin\/(audit|au|rsys))' /etc/aide.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ /usr/sbin/auditctl p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/auditd p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/ausearch p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/aureport p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/augenrules p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
    rationale: |
      Protecting the integrity of the tools used for auditing purposes is a critical step toward ensuring the integrity of audit information. Audit information includes all information (e.g., audit records, audit settings, and audit reports) needed to successfully audit information system activity.

      Audit tools include, but are not limited to, vendor-provided and open-source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.

      It is not uncommon for attackers to replace the audit tools or inject code into the existing tools to provide the capability to hide or erase system activity from the audit logs.

      To address this risk, audit tools must be cryptographically signed to provide the capability to identify when the audit tools have been modified, manipulated, or replaced. An example is a checksum hash of the file or files.
    remediation: |
      Configure RHEL 10 to use cryptographic mechanisms to protect the integrity of audit tools.

      Add or update the following lines to "/etc/aide.conf" to protect the integrity of the audit tools.

      /usr/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512
  - id: "STIG-RHEL-10-300000-crypto_policies_pkg"
    name: "RHEL 10 must have the crypto-policies package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-300000, V-281007, SV-281007r1195399_rule, CAT I. CCI-002450, CCI-002890, CCI-003123. NIST SP 800-53 Rev. 4: SC-13, MA-4."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet crypto-policies
    expect: true
    rationale: |
      Centralized cryptographic policies simplify applying secure ciphers across an operating system and the applications that run on that operating system. Use of weak or untested encryption algorithms undermines the purposes of using encryption to protect data.
    remediation: |
      Configure RHEL 10 to have the "crypto-policies" package installed with the following command:

      $ sudo dnf -y install crypto-policies
  - id: "STIG-RHEL-10-300010-systemwide_cryptographic_policy"
    name: "RHEL 10 must implement a FIPS 140-3-compliant systemwide cryptographic policy."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-300010, V-281008, SV-281008r1268222_rule, CAT I. CCI-000068, CCI-002450, CCI-002890, CCI-003123. NIST SP 800-53 Rev. 4: AC-17, SC-13, MA-4."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      update-crypto-policies --show
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^FIPS" }
    rationale: |
      Centralized cryptographic policies simplify applying secure ciphers across an operating system and the applications that run on that operating system. Use of weak or untested encryption algorithms undermines the purposes of using encryption to protect data.
    remediation: |
      Configure RHEL 10 to use a FIPS 140-3-compliant systemwide cryptographic policy.

      Set the systemwide crypto-policy to FIPS with the following command:

      $ sudo update-crypto-policies --set FIPS
      Setting system policy to FIPS

      Note: Systemwide crypto-policies are applied on application startup. It is recommended to restart the system for the change of policies to fully take place.
  - id: "STIG-RHEL-10-300030-ssh_config_macs_client-attrs"
    name: "RHEL 10 must be configured so that Secure Shell (SSH) clients use only DoW-approved encryption ciphers employing FIPS 140-3-validated cryptographic hash algorithms to protect the confidentiality of SSH client connections. (/etc/crypto-policies/back-ends/openssh.config: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-300030, V-281010, SV-281010r1273569_rule, CAT I. CCI-000068, CCI-000877, CCI-001453, CCI-002890, CCI-003123, CCI-002418. NIST SP 800-53 Rev. 4: AC-17, MA-4, SC-8."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      f='/etc/crypto-policies/back-ends/openssh.config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Without cryptographic integrity protections, information can be altered by unauthorized users without detection.

      Remote access (e.g., Remote Desktop Protocol [RDP]) is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganizational-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      Cryptographic mechanisms used for protecting the integrity of information include, for example, signed hash functions that use asymmetric cryptography. This enables distribution of the public key to verify the hash information while maintaining the confidentiality of the secret key used to generate the hash.

      RHEL 10 incorporates systemwide crypto policies by default. The SSH configuration file has no effect on the ciphers, MACs, or algorithms unless specifically defined in the "/etc/sysconfig/sshd" file. The employed algorithms can be viewed in the "/etc/crypto-policies/back-ends/openssh.config" file.
    remediation: |
      Configure RHEL 10 SSH clients to use only ciphers employing FIPS 140-3-approved algorithms.

      Reinstall crypto-policies with the following command:

      $ sudo dnf -y reinstall crypto-policies

      Set the crypto-policy to FIPS with the following command:

      $ sudo update-crypto-policies --set FIPS
      Setting system policy to FIPS

      Note: Systemwide crypto policies are applied on application startup. It is recommended to restart the system for the change of policies to fully take place.
  - id: "STIG-RHEL-10-300030-ssh_config_macs_client-content"
    name: "RHEL 10 must be configured so that Secure Shell (SSH) clients use only DoW-approved encryption ciphers employing FIPS 140-3-validated cryptographic hash algorithms to protect the confidentiality of SSH client connections. (/etc/crypto-policies/back-ends/openssh.config has the expected conten…)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-300030, V-281010, SV-281010r1273569_rule, CAT I. CCI-000068, CCI-000877, CCI-001453, CCI-002890, CCI-003123, CCI-002418. NIST SP 800-53 Rev. 4: AC-17, MA-4, SC-8."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      cat '/etc/crypto-policies/back-ends/openssh.config'
    allow_rc: any
    expect: { some: "~ Ciphers aes256-gcm@openssh\\.com,aes256-ctr,aes128-gcm@openssh\\.com,aes128-ctr" }
    rationale: |
      Without cryptographic integrity protections, information can be altered by unauthorized users without detection.

      Remote access (e.g., Remote Desktop Protocol [RDP]) is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganizational-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      Cryptographic mechanisms used for protecting the integrity of information include, for example, signed hash functions that use asymmetric cryptography. This enables distribution of the public key to verify the hash information while maintaining the confidentiality of the secret key used to generate the hash.

      RHEL 10 incorporates systemwide crypto policies by default. The SSH configuration file has no effect on the ciphers, MACs, or algorithms unless specifically defined in the "/etc/sysconfig/sshd" file. The employed algorithms can be viewed in the "/etc/crypto-policies/back-ends/openssh.config" file.
    remediation: |
      Configure RHEL 10 SSH clients to use only ciphers employing FIPS 140-3-approved algorithms.

      Reinstall crypto-policies with the following command:

      $ sudo dnf -y reinstall crypto-policies

      Set the crypto-policy to FIPS with the following command:

      $ sudo update-crypto-policies --set FIPS
      Setting system policy to FIPS

      Note: Systemwide crypto policies are applied on application startup. It is recommended to restart the system for the change of policies to fully take place.
