  - id: "STIG-RHEL-10-300090-crypto_policy_fips"
    name: "RHEL 10 cryptographic policy must not be overridden."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-300090, V-281016, SV-281016r1273577_rule, CAT I. CCI-002450, CCI-002890, CCI-003123. NIST SP 800-53 Rev. 4: SC-13, MA-4."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    timeout: 120000ms
    run: |
      update-crypto-policies --check && echo PASS
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ PASS" }
    rationale: |
      Centralized cryptographic policies simplify applying secure ciphers across an operating system and the applications that run on that operating system. Use of weak or untested encryption algorithms undermines the purposes of using encryption to protect data.
    remediation: |
      Configure RHEL 10 to correctly implement the systemwide cryptographic policies by reinstalling the crypto-policies package contents.

      Reinstall crypto-policies with the following command:

      $ sudo dnf -y reinstall crypto-policies

      Set the crypto-policy to FIPS with the following command:

      $ sudo update-crypto-policies --set FIPS
      Setting system policy to FIPS

      Note: Systemwide crypto policies are applied on application startup. It is recommended to restart the system for the change of policies to fully take place.
  - id: "STIG-RHEL-10-600560-sudoers_nopasswd"
    name: "RHEL 10 must require users to provide a password for privilege escalation."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600560, V-281211, SV-281211r1166585_rule, CAT I. CCI-002038. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      grep -ir nopasswd /etc/sudoers /etc/sudoers.d/ | grep -v '#'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: |
      Without reauthentication, users may access resources or perform tasks for which they do not have authorization.

      When operating systems provide the capability to escalate a functional capability, it is critical that the user reauthenticate.
    remediation: |
      Configure RHEL 10 to not allow users to execute privileged actions without authenticating with a password.

      Remove any occurrence of "NOPASSWD" found in the "/etc/sudoers" file or files in the "/etc/sudoers.d" directory:

      $ sudo find /etc/sudoers /etc/sudoers.d -type f -exec sed -i '/NOPASSWD/ s/^/# /g' {} \;
  - id: "STIG-RHEL-10-600640-sshd_use_pam-attrs"
    name: "RHEL 10 must enable the Pluggable Authentication Module (PAM) interface for SSHD. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600640, V-281216, SV-281216r1166600_rule, CAT I. CCI-000877. NIST SP 800-53 Rev. 4: MA-4."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      When "UsePAM" is set to "yes", PAM runs through account and session types properly. This is important when restricted access to services based on IP, time, or other factors of the account is needed. Additionally, this ensures users can inherit certain environment variables on login or disallow access to the server.
    remediation: |
      Configure RHEL 10 SSHD to use the "UsePAM" interface by adding or modifying the following line in "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d".

      UsePAM yes

      Restart the SSH daemon with the following command for the settings to take effect:

      $ sudo systemctl restart sshd.service
  - id: "STIG-RHEL-10-600640-sshd_use_pam-content"
    name: "RHEL 10 must enable the Pluggable Authentication Module (PAM) interface for SSHD. (/etc/ssh/sshd_config has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600640, V-281216, SV-281216r1166600_rule, CAT I. CCI-000877. NIST SP 800-53 Rev. 4: MA-4."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect:
      - { some: "~ ^UsePAM yes" }
      - { none: "~ ^UsePAM no" }
    rationale: |
      When "UsePAM" is set to "yes", PAM runs through account and session types properly. This is important when restricted access to services based on IP, time, or other factors of the account is needed. Additionally, this ensures users can inherit certain environment variables on login or disallow access to the server.
    remediation: |
      Configure RHEL 10 SSHD to use the "UsePAM" interface by adding or modifying the following line in "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d".

      UsePAM yes

      Restart the SSH daemon with the following command for the settings to take effect:

      $ sudo systemctl restart sshd.service
  - id: "STIG-RHEL-10-600730-shadow_hash_algo_fips"
    name: "RHEL 10 must employ FIPS 140-3-approved cryptographic hashing algorithms for all stored passwords."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600730, V-281221, SV-281221r1208797_rule, CAT I. CCI-004062, CCI-000803. NIST SP 800-53 Rev. 4: IA-7."
