    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-800130, V-281345, SV-281345r1167185_rule, CAT II. CCI-002385, CCI-001100. NIST SP 800-53 Rev. 4: SC-5, SC-7."
