  - id: "STIG-RHEL-10-600650-pam_password_hashing-attrs"
    name: "RHEL 10 must ensure that the pam_unix.so module is configured in the password-auth file to use a FIPS 140-3-approved cryptographic hashing algorithm for system authentication. (/etc/pam.d/password-auth: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600650, V-281217, SV-281217r1273593_rule, CAT II. CCI-004062, CCI-000803. NIST SP 800-53 Rev. 4: IA-7."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/pam.d/password-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Unapproved mechanisms that are used for authentication to the cryptographic module are not verified; therefore, they cannot be relied on to provide confidentiality or integrity, and DoW data may be compromised.

      RHEL 10 systems using encryption are required to use FIPS-compliant mechanisms for authenticating to cryptographic modules.

      FIPS 140-3 is the current standard for validating that mechanisms used to access cryptographic modules use authentication that meets DoW requirements. This allows for Security Levels 1, 2, 3, or 4 for use on a general-purpose computing system.
    remediation: |
      Configure RHEL 10 to use the sha512 cryptographic hashing algorithm for local account passwords.

      Edit/modify the following line in the "/etc/pam.d/password-auth" file to include the sha512 option for pam_unix.so:

      password sufficient pam_unix.so sha512
