  - id: "STIG-RHEL-10-400450-sbin_auditctl_perms-attrs"
    name: "RHEL 10 must enforce a mode of 0755 or less permissive for audit tools."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-400450, V-281094, SV-281094r1165637_rule, CAT II. CCI-001493, CCI-001494, CCI-001495. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/sbin/auditctl'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7022)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
    expect: empty
    rationale: |
      Protecting audit information also includes identifying and protecting the tools used to view and manipulate log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information.

      RHEL 10 systems providing tools to interface with audit information will leverage user permissions and roles identifying the user accessing the tools, and the corresponding rights the user enjoys, to make access decisions regarding the access to audit tools.

      Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.
    remediation: |
      Configure RHEL 10 so that the audit tools to have a mode of "0755" by running the following command:

      $ sudo chmod 0755 [audit_tool]

      Replace "[audit_tool]" with each audit tool that has a mode more permissive than "0755".
