  - id: "STIG-RHEL-10-200660-audit_installed"
    name: "RHEL 10 must have the audit package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200660, V-280993, SV-280993r1268225_rule, CAT II. CCI-000169, CCI-000130, CCI-000131, CCI-000132, CCI-000133, CCI-000134, CCI-000135, CCI-000154, CCI-000158, CCI-001876, CCI-001464, CCI-001487, CCI-001914, CCI-001875, CCI-001877, CCI-001878, CCI-001879, CCI-001880, CCI-001881, CCI-001882, CCI-001889, CCI-003938, CCI-002884, CCI-000172. NIST SP 800-53 Rev. 4: AU-3, AU-6, AU-7, AU-8, AU-12, AU-14, CM-5, MA-4."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet audit
    expect: true
    rationale: |
      Without establishing what type of events occurred, along with the source, location, and outcome, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack.

      Audit record content that may be necessary to satisfy this requirement includes, for example, time stamps, source and destination addresses, user/process identifiers, event descriptions, success/fail indications, filenames involved, and access control or flow control rules invoked.

      Associating event types with detected events in audit logs provides a means of investigating an attack, recognizing resource utilization or capacity thresholds, or identifying an improperly configured RHEL 10 system.
    remediation: |
      Configure RHEL 10 to have the "audit" service package installed with the following command:

      $ sudo dnf -y install audit
  - id: "STIG-RHEL-10-200661-audit_enabled-enabled"
    name: "RHEL 10 must enable the audit service. (Service auditd is enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-200661, V-280994, SV-280994r1268225_rule, CAT II. CCI-000169, CCI-000130, CCI-000131, CCI-000132, CCI-000133, CCI-000134, CCI-000135, CCI-000154, CCI-000158, CCI-001876, CCI-001464, CCI-001487, CCI-001914, CCI-001875, CCI-001877, CCI-001878, CCI-001879, CCI-001880, CCI-001881, CCI-001882, CCI-001889, CCI-003938, CCI-002884, CCI-000172. NIST SP 800-53 Rev. 4: AU-3, AU-6, AU-7, AU-8, AU-12, AU-14, CM-5, MA-4."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState auditd | cut -d= -f2
    expect: "~ ^enabled"
    rationale: |
      Without establishing what type of events occurred, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack. Ensuring the auditd service is active ensures audit records generated by the kernel are appropriately recorded.

      Additionally, a properly configured audit subsystem ensures that actions of individual system users can be uniquely traced to those users so they can be held accountable for their actions.
    remediation: |
      Configure RHEL 10 to enable the auditd service with the following command:

      $ sudo systemctl enable --now auditd
