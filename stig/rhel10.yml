    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: |
      The system must use a strong hashing algorithm to store the password.

      Passwords must be protected at all times, and encryption is the standard method for protecting passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised.
    remediation: |
      Configure RHEL 10 to employ FIPS 140-3-approved cryptographic hashing algorithms for all stored passwords.

      Lock all interactive user accounts not using SHA-512 hashing until the passwords can be regenerated with SHA-512.
  - id: "STIG-RHEL-10-600740-login_defs_encrypt-attrs"
    name: "RHEL 10 must be configured to use the shadow file to store only encrypted representations of passwords. (/etc/login.defs: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600740, V-281222, SV-281222r1273622_rule, CAT I. CCI-004062. NIST SP 800-53 Rev. 4: IA-7."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Passwords must be protected at all times, and encryption is the standard method for protecting passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Passwords that are encrypted with a weak algorithm are no more protected than if they are kept in plain text.

      This setting ensures user and group account administration utilities are configured to store only encrypted representations of passwords. Additionally, the "crypt_style" configuration option ensures the use of a strong hashing algorithm that makes password cracking attacks more difficult.

      The default for Red Hat 10 is yescrypt. Although yescrypt is structurally built using an outer layer of SHA-256 (which is a NIST-approved algorithm), the yescrypt algorithm as a whole is not recognized or validated by the National Institute of Standards and Technology (NIST) Cryptographic Module Validation Program (CMVP).
    remediation: |
      Configure RHEL 10 to store only SHA512 encrypted representations of passwords.

      Add or update the following line in the "/etc/login.defs" file:

      ENCRYPT_METHOD SHA512
  - id: "STIG-RHEL-10-600740-login_defs_encrypt-content"
    name: "RHEL 10 must be configured to use the shadow file to store only encrypted representations of passwords. (/etc/login.defs has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600740, V-281222, SV-281222r1273622_rule, CAT I. CCI-004062. NIST SP 800-53 Rev. 4: IA-7."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect: { some: "~ ^ENCRYPT_METHOD SHA512" }
    rationale: |
      Passwords must be protected at all times, and encryption is the standard method for protecting passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Passwords that are encrypted with a weak algorithm are no more protected than if they are kept in plain text.

      This setting ensures user and group account administration utilities are configured to store only encrypted representations of passwords. Additionally, the "crypt_style" configuration option ensures the use of a strong hashing algorithm that makes password cracking attacks more difficult.

      The default for Red Hat 10 is yescrypt. Although yescrypt is structurally built using an outer layer of SHA-256 (which is a NIST-approved algorithm), the yescrypt algorithm as a whole is not recognized or validated by the National Institute of Standards and Technology (NIST) Cryptographic Module Validation Program (CMVP).
    remediation: |
      Configure RHEL 10 to store only SHA512 encrypted representations of passwords.

      Add or update the following line in the "/etc/login.defs" file:

      ENCRYPT_METHOD SHA512
  - id: "STIG-RHEL-10-600750-libcrypt_sha512"
    name: "RHEL 10 must be configured so that user and group account administration utilities are configured to store only encrypted representations of passwords."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-600750, V-281223, SV-281223r1273596_rule, CAT I. CCI-004062. NIST SP 800-53 Rev. 4: IA-7."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      rpm -q libuser > /dev/null 2>&1 && grep -i "^crypt_style" /etc/libuser.conf || echo libuser-not-installed
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (^crypt_style\\s*=\\s*sha512|^libuser-not-installed$)" }
    rationale: |
      Passwords must be protected at all times, and encryption is the standard method for protecting passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Passwords that are encrypted with a weak algorithm are no more protected than if they are kept in plain text.

      This setting ensures user and group account administration utilities are configured to store only encrypted representations of passwords. Additionally, the "crypt_style" configuration option ensures the use of a strong hashing algorithm that makes password cracking attacks more difficult.
    remediation: |
      Configure RHEL 10 to use the SHA-512 algorithm for password hashing.

      Add or change the following line in the "[defaults]" section of the "/etc/libuser.conf" file:

      crypt_style = sha512
  - id: "STIG-RHEL-10-700640-ssh_config_userenv"
    name: "RHEL 10 must not allow users to override Secure Shell (SSH) environment variables."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700640, V-281267, SV-281267r1184767_rule, CAT I. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      sshd -T | grep -i PermitUserEnvironment
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^permituserenvironment (no|false|off|0)$" }
      - { none: "~ ^permituserenvironment (yes|true|on|1)$" }
    rationale: |
      SSH environment options potentially allow users to bypass access restriction in some configurations.

      OpenSSH uses the first occurrence of a keyword it sees, and drop-in files are read in lexicographical order at the start of the configuration. Red Hat recommends using drop-in files rather than changing base configuration files.
    remediation: |
      Configure RHEL 10 to disable unattended or automatic login via SSH.

      In "/etc/ssh/sshd_config.d", create a drop file that will lexicographically precede 50-redhat.conf and add the following line:

      PermitUserEnvironment no

      Restart the SSH daemon with the following command for the setting to take effect:

      $ sudo systemctl restart sshd.service
  - id: "STIG-RHEL-10-700650-ssh_config_rekeylimit"
    name: "RHEL 10 must force a frequent session key renegotiation for Secure Shell (SSH) connections to the server."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700650, V-281268, SV-281268r1184768_rule, CAT I. CCI-002418, CCI-000068, CCI-002421. NIST SP 800-53 Rev. 4: AC-17, SC-8."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      sshd -T | grep -i rekeylimit
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^rekeylimit 1073741824 3600" }
    rationale: |
      Without protection of the transmitted information, confidentiality and integrity may be compromised because unprotected communications can be intercepted and either read or altered.

      This requirement applies to both internal and external networks and all types of information system components from which information can be transmitted (e.g., servers, mobile devices, notebook computers, printers, copiers, scanners, and facsimile machines). Communication paths outside the physical protection of a controlled boundary are exposed to the possibility of interception and modification.

      Protecting the confidentiality and integrity of organizational information can be accomplished by physical means (e.g., employing physical distribution systems) or by logical means (e.g., employing cryptographic techniques). If physical means of protection are employed, then logical means (cryptography) do not have to be employed, and vice versa.

      Session key regeneration limits the chances of a session key becoming compromised.

      OpenSSH uses the first occurrence of a keyword it sees, and drop-in files are read in lexicographical order at the start of the configuration. Red Hat recommends using drop-in files rather than changing base configuration files.
    remediation: |
      Configure RHEL 10 to force a frequent session key renegotiation for SSH connections to the server.

      In "/etc/ssh/sshd_config.d", create a drop file that will lexicographically precede 50-redhat.conf and add the following line:

      RekeyLimit 1G 1h

      Restart the SSH daemon with the following command for the settings to take effect:

      $ sudo systemctl restart sshd.service
  - id: "STIG-RHEL-10-700950-ctrl_alt_del"
    name: "RHEL 10 must disable the systemd Ctrl-Alt-Delete burst key sequence."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700950, V-281298, SV-281298r1273604_rule, CAT I. CCI-002235. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      grep -iR CtrlAltDelBurstAction /etc/systemd/
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*:CtrlAltDelBurstAction=none" }
      - { none: "~ ^.*:CtrlAltDelBurstAction=(reboot.*|poweroff.*)$" }
    rationale: |
      A locally logged-on user who presses Ctrl-Alt-Delete when at the console can reboot the system. If accidentally pressed, as could happen in the case of a mixed operating system environment, this can create the risk of short-term loss of availability of systems due to unintentional reboot.

      In a graphical user environment, risk of unintentional reboot from the Ctrl-Alt-Delete sequence is reduced because the user will be prompted before any action is taken.
    remediation: |
      Configure RHEL 10 to disable the CtrlAltDelBurstAction by adding it to a drop file in a "/etc/systemd/system.conf.d/" configuration file:

      If no drop file exists, create one with the following command:

      $ sudo mkdir -p /etc/systemd/system.conf.d && sudo vi /etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.conf

      Edit the file to contain the setting by adding the following text:

      [Manager]
      CtrlAltDelBurstAction=none

      Reload the daemon for this change to take effect.

      $ sudo systemctl daemon-reload
  - id: "STIG-RHEL-10-700960-ctrl-alt-del.target-enabled"
    name: "RHEL 10 must disable the x86 Ctrl-Alt-Delete key sequence. (Service ctrl-alt-del.target is not enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700960, V-281299, SV-281299r1166849_rule, CAT I. CCI-002235. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      systemctl show -p UnitFileState ctrl-alt-del.target | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: |
      A locally logged-on user who presses Ctrl-Alt-Delete when at the console can reboot the system. If accidentally pressed, as could happen in the case of a mixed operating system environment, this can create the risk of short-term loss of systems availability due to unintentional reboot.

      In a graphical user environment, risk of unintentional reboot from the Ctrl-Alt-Delete sequence is reduced because the user will be prompted before any action is taken.
    remediation: |
      Configure RHEL 10 to disable the "ctrl-alt-del.target" with the following command:

      $ sudo systemctl disable --now ctrl-alt-del.target
      $ sudo systemctl mask --now ctrl-alt-del.target
  - id: "STIG-RHEL-10-700960-ctrl-alt-del.target-running"
    name: "RHEL 10 must disable the x86 Ctrl-Alt-Delete key sequence. (Service ctrl-alt-del.target is not running)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700960, V-281299, SV-281299r1166849_rule, CAT I. CCI-002235. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      systemctl show -p ActiveState ctrl-alt-del.target | cut -d= -f2
    expect: "!= active"
    rationale: |
      A locally logged-on user who presses Ctrl-Alt-Delete when at the console can reboot the system. If accidentally pressed, as could happen in the case of a mixed operating system environment, this can create the risk of short-term loss of systems availability due to unintentional reboot.

      In a graphical user environment, risk of unintentional reboot from the Ctrl-Alt-Delete sequence is reduced because the user will be prompted before any action is taken.
    remediation: |
      Configure RHEL 10 to disable the "ctrl-alt-del.target" with the following command:

      $ sudo systemctl disable --now ctrl-alt-del.target
      $ sudo systemctl mask --now ctrl-alt-del.target
  - id: "STIG-RHEL-10-700960-ctrl-alt-del.target_masked-attrs"
    name: "RHEL 10 must disable the x86 Ctrl-Alt-Delete key sequence."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700960, V-281299, SV-281299r1166849_rule, CAT I. CCI-002235. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel10, stig-cat-1]
    severity: high
    run: |
      f='/etc/systemd/system/ctrl-alt-del.target'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
