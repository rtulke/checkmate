  - id: "STIG-RHEL-10-500020-faillock_audit-attrs"
    name: "RHEL 10 must log username information when unsuccessful login attempts occur. (/etc/security/faillock.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500020, V-281100, SV-281100r1165655_rule, CAT II. CCI-000044. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      Without auditing of these events, it may be harder or impossible to identify what an attacker did after an attack.
    remediation: |
      Configure RHEL 10 to log username information when unsuccessful login attempts occur.

      Enable the feature using the following command:

      $ sudo authselect enable-feature with-faillock

      Add/modify the "/etc/security/faillock.conf" file to match the following line:

      audit
