  - id: "STIG-RHEL-10-500025-audit_rules_perms"
    name: "RHEL 10 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500025, V-281101, SV-281101r1195411_rule, CAT II. CCI-000171. NIST SP 800-53 Rev. 4: AU-12."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      stat -c '%a' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ [4,6][0,4]0" }
    rationale: |
      Without the capability to restrict the roles and individuals that can select which events are audited, unauthorized personnel may be able to prevent the auditing of critical events. Misconfigured audits may degrade the system's performance by overwhelming the audit log. Misconfigured audits may also make it more difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.
    remediation: |
      Configure RHEL 10 so that the files in directory "/etc/audit/rules.d/" and the "/etc/audit/auditd.conf" file have a mode of "0640" with the following commands:

      $ sudo chmod 0600 /etc/audit/rules.d/audit.rules
      $ sudo chmod 0640 /etc/audit/rules.d/[customrulesfile].rules
      $ sudo chmod 0640 /etc/audit/auditd.conf
  - id: "STIG-RHEL-10-500030-audit_conf_crond"
    name: "RHEL 10 must allocate an audit_backlog_limit of sufficient size to capture processes that start prior to the audit daemon."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500030, V-281102, SV-281102r1195414_rule, CAT II. CCI-000130, CCI-000135, CCI-000169, CCI-001464, CCI-001849, CCI-002884, CCI-000172. NIST SP 800-53 Rev. 4: AU-12, AU-3, AU-4, AU-14, MA-4."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      grep -oP 'audit_backlog_limit=\K[0-9]+' /proc/cmdline
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ 8192" }
    rationale: |
      Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.

      If auditing is enabled late in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state information only available if auditing is enabled before a given process is created.

      Audit records can be generated from various components within the information system (e.g., module or policy filter).

      Allocating an "audit_backlog_limit" of sufficient size is critical in maintaining a stable boot process. With an insufficient limit allocated, the system is susceptible to boot failures and crashes.
    remediation: |
      Configure RHEL 10 to allocate sufficient "audit_backlog_limit" to capture processes that start prior to the audit daemon with the following command:

      $ sudo grubby --update-kernel=ALL --args=audit_backlog_limit=8192

      The setting will be applied on reboot.
  - id: "STIG-RHEL-10-500035-audit_conf_crit_proc-attrs"
    name: "RHEL 10 must take appropriate action when a critical audit processing failure occurs. (/etc/audit/audit.rules: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500035, V-281103, SV-281103r1166261_rule, CAT II. CCI-000139. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/audit.rules'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: |
      It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs as required. Without this notification, the security personnel may be unaware of an impending failure of the audit capability, and system operation may be adversely affected.

      Audit processing failures include software/hardware errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded.
    remediation: |
      Configure RHEL 10 to shut down when auditing failures occur.

      Add the following line to the bottom of the "/etc/audit/rules.d/audit.rules" file:

      -f 2
  - id: "STIG-RHEL-10-500035-audit_conf_crit_proc-content"
    name: "RHEL 10 must take appropriate action when a critical audit processing failure occurs. (/etc/audit/audit.rules has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500035, V-281103, SV-281103r1166261_rule, CAT II. CCI-000139. NIST SP 800-53 Rev. 4: AU-4."
