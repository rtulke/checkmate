    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-700870, V-281290, SV-281290r1273602_rule, CAT II. CCI-001444, CCI-001443, CCI-002421, CCI-002418. NIST SP 800-53 Rev. 4: SC-8, AC-18."
