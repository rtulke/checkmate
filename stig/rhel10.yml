  - id: "STIG-RHEL-10-500780-audit_conf_chmod"
    name: "RHEL 10 must generate audit records for all uses of the chmod, fchmod, fchmodat, and fchmodat2 syscalls."
    description: "DISA STIG for Red Hat Enterprise Linux 10, RHEL-10-500780, V-281163, SV-281163r1166441_rule, CAT II. CCI-000130, CCI-000135, CCI-000169, CCI-002884, CCI-000172. NIST SP 800-53 Rev. 4: AU-3, AU-12, MA-4."
    tags: [stig, stig-rhel10, stig-cat-2]
    severity: medium
    run: |
      grep chmod /etc/audit/audit.rules /etc/audit/rules.d/99_auditd.rules /etc/audit/audit.rules.d/audit.rules
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^.*:-a always,exit -F arch=b32 -S chmod,fchmod,fchmodat,fchmodat2 -F auid\u003e=1000 -F auid!=unset -k .*" }
      - { some: "~ ^.*:-a always,exit -F arch=b64 -S chmod,fchmod,fchmodat,fchmodat2 -F auid\u003e=1000 -F auid!=unset -k .*" }
    rationale: |
      Without generating audit records that are specific to the security and mission needs of the organization, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.

      Audit records can be generated from various components within the information system (e.g., module or policy filter).

      When a user logs on, the auid is set to the uid of the account that is being authenticated. Daemons are not user sessions and have the loginuid set to -1. The auid representation is an unsigned 32-bit integer, which equals 4294967295. The audit system interprets -1, 4294967295, and "unset" in the same way.

      The system call rules are loaded into a matching engine that intercepts each syscall made by all programs on the system. Therefore, it is very important to use syscall rules only when absolutely necessary because these affect performance. More rules lead to poorer performance. The performance can be helped, however, by combining syscalls into one rule whenever possible.
    remediation: |
      Configure RHEL 10 to generate audit records upon successful and unsuccessful attempts to use the "chmod", "fchmod", "fchmodat", and "fchmodat2" syscalls.

      Add or update the following rules in "/etc/audit/rules.d/audit.rules":

      -a always,exit -F arch=b32 -S chmod,fchmod,fchmodat,fchmodat2 -F auid>=1000 -F auid!=unset -k perm_mod

      -a always,exit -F arch=b64 -S chmod,fchmod,fchmodat,fchmodat2 -F auid>=1000 -F auid!=unset -k perm_mod

      Restart the audit daemon with the following command for the changes to take effect:

      $ sudo service auditd restart
