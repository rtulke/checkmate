    name: "Must be configured so that all network connections associated with SSH traffic are terminated at the end of the session or after 10 minutes of inactivity, except to fulfill documented and validated mission requirements."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040320, V-204587, SV-204587r917833_rule, CAT II. CCI-001133, CCI-00236."
