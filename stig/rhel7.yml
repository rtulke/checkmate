    name: "The Red Hat Enterprise Linux operating system must have the screen package installed. (tmux package)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010090, V-255926, SV-255926r880779_rule, CAT II. CCI-000057."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet tmux
    expect: true
    rationale: *rat-53d73c96a7
    remediation: *rem-77c04252db
  - id: "STIG-RHEL-07-010118-pam_passwd_substack"
    name: "Must be configured so that /etc/pam.d/passwd implements /etc/pam.d/system-auth when changing passwords."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010118, V-204405, SV-204405r603261_rule, CAT II. CCI-000192."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -Ei "substack" /etc/pam.d/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^password\\s+substack\\s+system-auth" }
    rationale: &rat-fb1cebbc1f |
      Pluggable authentication modules (PAM) allow for a modular approach to integrating authentication methods. PAM operates in a top-down processing model and if the modules are not listed in the correct order, an important security function could be bypassed if stack entries are not centralized.
    remediation: &rem-607b3f1ff5 |
      Configure PAM to utilize /etc/pam.d/system-auth when changing passwords.

      Add the following line to "/etc/pam.d/passwd" (or modify the line to have the required value):

      password     substack    system-auth
  - id: "STIG-RHEL-07-010119-pam_quality_system_auth"
    name: "Must be configured so that when passwords are changed or new passwords are established, pwquality must be used."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010119, V-204406, SV-204406r902704_rule, CAT II. CCI-000192."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -Ei "required" /etc/pam.d/system-auth
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^password\\s+required\\s+pam_pwquality.so\\s+retry=[1-3]$" }
    rationale: &rat-8c2b3e1db6 |
      Use of a complex password helps to increase the time and resources required to compromise the password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks. "pwquality" enforces complex password construction configuration and has the ability to limit brute-force attacks on the system.
    remediation: &rem-8f64f3b841 |
      Configure the operating system to use "pwquality" to enforce password complexity rules.

      Add the following line to "/etc/pam.d/system-auth" (or modify the line to have the required value):

           password requisite pam_pwquality.so retry=3

      Note: The value of "retry" should be between "1" and "3".
  - id: "STIG-RHEL-07-010120-pwquality_ucredit"
    name: "Must be configured so that when passwords are changed or new passwords are established, the new password must contain at least one upper-case character."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010120, V-204407, SV-204407r603261_rule, CAT II. CCI-000192."
