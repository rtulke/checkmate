    remediation: &rem-750598fb50 |
      Configure the operating system to automatically lock the root account, for a minimum of 15 minutes, when three unsuccessful logon attempts in 15 minutes are made.

      Modify the first three lines of the auth section and the first line of the account section of the "/etc/pam.d/system-auth" and "/etc/pam.d/password-auth" files to match the following lines:

      auth        required      pam_faillock.so preauth silent audit deny=3 even_deny_root fail_interval=900 unlock_time=900
      auth        sufficient    pam_unix.so try_first_pass
      auth        [default=die] pam_faillock.so authfail audit deny=3 even_deny_root fail_interval=900 unlock_time=900
      account     required      pam_faillock.so

      Note: Per requirement RHEL-07-010199, RHEL 7 must be configured to not overwrite custom authentication configuration settings while using the authconfig utility, otherwise manual changes to the listed files will be overwritten whenever the authconfig utility is used.
  - id: "STIG-RHEL-07-010330-system_auth_faillock_so"
    name: "Must lock the associated account after three unsuccessful root logon attempts are made within a 15-minute period."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010330, V-204428, SV-204428r958736_rule, CAT II. CCI-002238."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -Ei "faillock.so|deny_root" /etc/pam.d/system-auth
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^account\\s+required\\s+pam_faillock.so" }
      - { some: "~ ^auth\\s+required pam_faillock.so preauth silent audit deny=3 even_deny_root fail_interval=900 unlock_time=900" }
      - { some: "~ ^auth\\s+\\[default=die\\] pam_faillock.so authfail audit deny=3 even_deny_root fail_interval=900 unlock_time=900" }
    rationale: *rat-8c2fc8f449
    remediation: *rem-750598fb50
  - id: "STIG-RHEL-07-010339-sudoers_includedir"
    name: "Must specify the default \"include\" directory for the /etc/sudoers file."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010339, V-251703, SV-251703r833183_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i includedir /etc/sudoers
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^#includedir /etc/sudoers.d" }
    rationale: &rat-681aeddbef |
      The "sudo" command allows authorized users to run programs (including shells) as other users, system users, and root. The "/etc/sudoers" file is used to configure authorized "sudo" users as well as the programs they are allowed to run. Some configuration options in the "/etc/sudoers" file allow configured users to run programs without re-authenticating. Use of these configuration options makes it easier for one compromised account to be used to compromise other accounts.

      It is possible to include other sudoers files from within the sudoers file currently being parsed using the #include and #includedir directives. When sudo reaches this line it will suspend processing of the current file (/etc/sudoers) and switch to the specified file/directory. Once the end of the included file(s) is reached, the rest of /etc/sudoers will be processed. Files that are included may themselves include other files. A hard limit of 128 nested include files is enforced to prevent include file loops.
    remediation: &rem-fe283e9f09 |
      Configure the /etc/sudoers file to only include the /etc/sudoers.d directory.

      Edit the /etc/sudoers file with the following command:

      $ sudo visudo

      Add or modify the following line:
      #includedir /etc/sudoers.d
  - id: "STIG-RHEL-07-010340-sudo_nopasswd"
    name: "Must be configured so that users must provide a password for privilege escalation."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010340, V-204429, SV-204429r833190_rule, CAT II. CCI-002038."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -iR nopasswd /etc/sudoers /etc/sudoers.d/* | grep -v ':#'
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ ." }
    rationale: &rat-726293edf1 |
      Without re-authentication, users may access resources or perform tasks for which they do not have authorization.

      When operating systems provide the capability to escalate a functional capability, it is critical the user re-authenticate.
    remediation: &rem-1206ddcfe9 |
      Configure the operating system to require users to supply a password for privilege escalation.

      Check the configuration of the "/etc/sudoers" file with the following command:
      $ sudo visudo

      Remove any occurrences of "NOPASSWD" tags in the file.

      Check the configuration of the /etc/sudoers.d/* files with the following command:
      $ sudo grep -ir nopasswd /etc/sudoers.d

      Remove any occurrences of "NOPASSWD" tags in the file.
  - id: "STIG-RHEL-07-010341-priv_elevation"
    name: "Must restrict privilege elevation to authorized personnel."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010341, V-237633, SV-237633r646850_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -iw 'ALL' /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { none: "~ ALL ALL=\\(ALL\\) ALL" }
      - { none: "~ ALL ALL=\\(ALL:ALL\\) ALL" }
    rationale: &rat-899f987ec4 |
      The sudo command allows a user to execute programs with elevated (administrator) privileges. It prompts the user for their password and confirms your request to execute a command by checking a file, called sudoers. If the "sudoers" file is not configured correctly, any user defined on the system can initiate privileged actions on the target system.
    remediation: &rem-4b7eb366ef |
      Remove the following entries from the sudoers file:
      ALL     ALL=(ALL) ALL
      ALL     ALL=(ALL:ALL) ALL
  - id: "STIG-RHEL-07-010342-priv_escalation_pw"
    name: "must use the invoking user's password for privilege escalation when using sudo. (Check files)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010342, V-237634, SV-237634r880755_rule, CAT II. CCI-002227."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -EisR '(!rootpw|!targetpw|!runaspw)' /etc/sudoers /etc/sudoers.d/* | grep -v '#'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ Defaults !targetpw" }
      - { some: "~ Defaults !rootpw" }
      - { some: "~ Defaults !runaspw" }
    rationale: &rat-5b35797596 |
      The sudoers security policy requires that users authenticate themselves before they can use sudo. When sudoers requires authentication, it validates the invoking user's credentials. If the rootpw, targetpw, or runaspw flags are defined and not disabled, by default the operating system will prompt the invoking user for the "root" user password.
      For more information on each of the listed configurations, reference the sudoers(5) manual page.
    remediation: &rem-9c862cf3a5 |
      Define the following in the Defaults section of the /etc/sudoers file or a configuration file in the /etc/sudoers.d/ directory:
           Defaults !targetpw
           Defaults !rootpw
           Defaults !runaspw

      Remove any configurations that conflict with the above from the following locations:
           /etc/sudoers
           /etc/sudoers.d/
  - id: "STIG-RHEL-07-010342-priv_escalation_pw_count"
    name: "must use the invoking user's password for privilege escalation when using sudo. (Check for multiple instances)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010342, V-237634, SV-237634r880755_rule, CAT II. CCI-002227."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -ERis '(!rootpw|!targetpw|!runaspw)' /etc/sudoers /etc/sudoers.d/* | grep -v '#' | cut -d":" -f1 | uniq | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^[0-1]\\b" }
    rationale: *rat-5b35797596
    remediation: *rem-9c862cf3a5
  - id: "STIG-RHEL-07-010343-reauth_sudo"
    name: "operating system must require re-authentication when using the sudo command. (Check files)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010343, V-237635, SV-237635r861075_rule, CAT II. CCI-002038."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -iRs 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ timestamp_timeout=[0-9]\\d*$" }
    rationale: &rat-004ba451a3 |
      Without re-authentication, users may access resources or perform tasks for which they do not have authorization.

      When operating systems provide the capability to escalate a functional capability, it is critical the organization requires the user to re-authenticate when using the "sudo" command.

      If the value is set to an integer less than 0, the user's time stamp will not expire and the user will not have to re-authenticate for privileged actions until the user's session is terminated.
    remediation: &rem-8c285bd008 |
      Configure the "sudo" command to require re-authentication.
      Edit the /etc/sudoers file:
      $ sudo visudo

      Add or modify the following line:
      Defaults timestamp_timeout=[value]
      Note: The "[value]" must be a number that is greater than or equal to "0".

      Remove any duplicate or conflicting lines from /etc/sudoers and /etc/sudoers.d/ files.
  - id: "STIG-RHEL-07-010343-reauth_sudo_count"
    name: "operating system must require re-authentication when using the sudo command. (Check for multiple instances)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010343, V-237635, SV-237635r861075_rule, CAT II. CCI-002038."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -iRs 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/* | cut -d":" -f1 | uniq | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^[0-1]\\b" }
    rationale: *rat-004ba451a3
    remediation: *rem-8c285bd008
  - id: "STIG-RHEL-07-010344-pam_sudo_succeed"
    name: "operating system must require re-authentication when using the sudo command."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010344, V-251704, SV-251704r809568_rule, CAT II. CCI-002038."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i pam_succeed /etc/pam.d/sudo
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ pam_succeed_if" }
    rationale: *rat-726293edf1
    remediation: &rem-25e455a7c7 |
      Configure the operating system to require users to supply a password for privilege escalation.

      Check the configuration of the "/etc/ pam.d/sudo" file with the following command:
      $ sudo vi /etc/pam.d/sudo

      Remove any occurrences of "pam_succeed_if" in the file.
  - id: "STIG-RHEL-07-010350-sudo_nopasswd"
    name: "Must be configured so that users must re-authenticate for privilege escalation."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010350, V-204430, SV-204430r603261_rule, CAT II. CCI-002038."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      egrep '^[^#]*!authenticate' /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-bd677fefc3 |
      Without re-authentication, users may access resources or perform tasks for which they do not have authorization.

      When operating systems provide the capability to escalate a functional capability, it is critical the user reauthenticate.
    remediation: &rem-d1dbc6f3fa |
      Configure the operating system to require users to reauthenticate for privilege escalation.

      Check the configuration of the "/etc/sudoers" file with the following command:

      # visudo
      Remove any occurrences of "!authenticate" tags in the file.

      Check the configuration of the "/etc/sudoers.d/*" files with the following command:

      # grep -i authenticate /etc/sudoers /etc/sudoers.d/*
      Remove any occurrences of "!authenticate" tags in the file(s).
  - id: "STIG-RHEL-07-010430-fail_delay_login_defs"
    name: "Must be configured so that the delay between logon prompts following a failed console logon attempt is at least four seconds."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010430, V-204431, SV-204431r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i fail_delay /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^FAIL_DELAY [4-9]$" }
    rationale: &rat-d5e55f4226 |
      Configuring the operating system to implement organization-wide security implementation guides and security checklists verifies compliance with federal standards and establishes a common security baseline across DoD that reflects the most restrictive security posture consistent with operational requirements.

      Configuration settings are the set of parameters that can be changed in hardware, software, or firmware components of the system that affect the security posture and/or functionality of the system. Security-related parameters are those parameters impacting the security state of the system, including the parameters required to satisfy other security control requirements. Security-related parameters include, for example, registry settings; account, file, and directory permission settings; and settings for functions, ports, protocols, services, and remote connections.
    remediation: &rem-45e1dbea67 |
      Configure the operating system to enforce a delay of at least four seconds between logon prompts following a failed console logon attempt.

      Modify the "/etc/login.defs" file to set the "FAIL_DELAY" parameter to "4" or greater:

      FAIL_DELAY 4
  - id: "STIG-RHEL-07-010460-sshd_config_userenv"
    name: "Must not allow users to override SSH environment variables."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010460, V-204434, SV-204434r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i permituserenv /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PermitUserEnvironment no" }
      - { none: "~ ^PermitUserEnvironment yes" }
    rationale: &rat-b48b37e882 |
      Failure to restrict system access to authenticated users negatively impacts operating system security.
    remediation: &rem-75c5c141fc |
      Configure the operating system to not allow users to override environment variables to the SSH daemon.

      Edit the "/etc/ssh/sshd_config" file to uncomment or add the line for "PermitUserEnvironment" keyword and set the value to "no":

      PermitUserEnvironment no

      The SSH service must be restarted for changes to take effect.
  - id: "STIG-RHEL-07-010470-sshd_hostbasedauth"
    name: "Must not allow a non-certificate trusted host SSH logon to the system."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010470, V-204435, SV-204435r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i hostbasedauthentication /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^HostbasedAuthentication no" }
      - { none: "~ ^HostbasedAuthentication yes" }
    rationale: *rat-b48b37e882
    remediation: &rem-a0ff4475d9 |
      Configure the operating system to not allow a non-certificate trusted host SSH logon to the system.

      Edit the "/etc/ssh/sshd_config" file to uncomment or add the line for "HostbasedAuthentication" keyword and set the value to "no":

      HostbasedAuthentication no

      The SSH service must be restarted for changes to take effect.
  - id: "STIG-RHEL-07-010481-rescue_service_auth"
    name: "Must require authentication upon booting into single-user and maintenance modes."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010481, V-204437, SV-204437r603261_rule, CAT II. CCI-000213."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i execstart /usr/lib/systemd/system/rescue.service
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^ExecStart=.*/usr/sbin/sulogin;.*\"" }
    rationale: &rat-7a1930f087 |
      If the system does not require valid root authentication before it boots into single-user or maintenance mode, anyone who invokes single-user or maintenance mode is granted privileged access to all files on the system.
    remediation: &rem-4fb5d29764 |
      Configure the operating system to require authentication upon booting into single-user and maintenance modes.

      Add or modify the "ExecStart" line in "/usr/lib/systemd/system/rescue.service" to include "/usr/sbin/sulogin":

      ExecStart=-/bin/sh -c "/usr/sbin/sulogin; /usr/bin/systemctl --fail --no-block default"
  - id: "STIG-RHEL-07-010483-grub_cfg_superuser"
    name: "Red Hat Enterprise Linux operating systems version 7.2 or newer booted with a BIOS must have a unique name for the grub superusers account when booting into single-user and maintenance modes. (BIOS (\u003e=RHEL7.3))"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010483, V-244557, SV-244557r833185_rule, CAT II. CCI-000213."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i superuser /boot/grub2/grub.cfg
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s+set superusers=\"su_mode_superuser\"" }
      - { some: "~ ^\\s+export superusers" }
    rationale: &rat-4b1fa86d14 |
      If the system does not require valid authentication before it boots into single-user or maintenance mode, anyone who invokes single-user or maintenance mode is granted privileged access to all files on the system. GRUB 2 is the default boot loader for RHEL 7 and is designed to require a password to boot into single-user mode or make modifications to the boot menu.
      The GRUB 2 superuser account is an account of last resort. Establishing a unique username for this account hardens the boot loader against brute force attacks. Due to the nature of the superuser account database being distinct from the OS account database, this allows the use of a username that is not among those within the OS account database. Examples of non-unique superusers names are root, superuser, unlock, etc.
    remediation: &rem-8e06d5497f |
      Configure the system to have a unique name for the grub superusers account.

      Edit the /etc/grub.d/01_users file and add or modify the following lines:

      set superusers="[someuniquestringhere]"
      export superusers
      password_pbkdf2 [someuniquestringhere] ${GRUB2_PASSWORD}

      Generate a new grub.cfg file with the following command:

      $ sudo grub2-mkconfig -o /boot/grub2/grub.cfg
  - id: "STIG-RHEL-07-020020-semanage_staff_u_check"
    name: "Must prevent non-privileged users from executing privileged functions to include disabling, circumventing, or altering implemented security safeguards/countermeasures."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020020, V-204444, SV-204444r928571_rule, CAT II. CCI-002235, CCI-002165."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      semanage login -l | grep staff_u | cut -d " " -f1
    expect: { rc: "== 0" }
    rationale: &rat-622589058b |
      Preventing nonprivileged users from executing privileged functions mitigates the risk that unauthorized individuals or processes may gain unnecessary access to information or privileges.

      Privileged functions include, for example, establishing accounts, performing system integrity checks, or administering cryptographic key management activities. Nonprivileged users are individuals who do not possess appropriate authorizations. Circumventing intrusion detection and prevention mechanisms or malicious code protection mechanisms are examples of privileged functions that require protection from nonprivileged users.
    remediation: &rem-fcd3aec8e5 |
      Configure the operating system to prevent non-privileged users from executing privileged functions to include disabling, circumventing, or altering implemented security safeguards/countermeasures.

      Use the following command to map a new user to the "staff_u" SELinux user:

           $ sudo semanage login -a -s staff_u <username>

      Use the following command to map an existing user to the "staff_u" SELinux user:

           $ sudo semanage login -m -s staff_u <username>

      Use the following command to map a new user to the "user_u" SELinux user:

           $ sudo semanage login -a -s user_u <username>

      Use the following command to map an existing user to the "user_u" SELinux user:

           $ sudo semanage login -m -s user_u <username>
  - id: "STIG-RHEL-07-020020-semanage_sysadm_u_check"
    name: "The Red Hat Enterprise Linux operating system must prevent non-privileged users from executing privileged functions to include disabling, circumventing, or altering implemented security safeguards/countermeasures."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020020, V-204444, SV-204444r928571_rule, CAT II. CCI-002235, CCI-002165."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      semanage login -l | grep sysadm_u | cut -d " " -f1 | grep -Ev "root|__default__|sysadm_u "
    expect: { rc: "== 1" }
    rationale: *rat-622589058b
    remediation: *rem-fcd3aec8e5
  - id: "STIG-RHEL-07-020020-semanage_unconfined_check"
    name: "The Red Hat Enterprise Linux operating system must prevent non-privileged users from executing privileged functions to include disabling, circumventing, or altering implemented security safeguards/countermeasures."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020020, V-204444, SV-204444r928571_rule, CAT II. CCI-002235, CCI-002165."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      semanage login -l | grep unconfined | grep -v "root"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: *rat-622589058b
    remediation: *rem-fcd3aec8e5
  - id: "STIG-RHEL-07-020021-semanage_confine_least_priv"
    name: "The Red Hat Enterprise Linux operating system must confine SELinux users to roles that conform to least privilege."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020021, V-250312, SV-250312r928579_rule, CAT II. CCI-002235, CCI-002165."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      semanage user -l | grep -E "staff_u|user_u"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^staff_u\\s+user\\s+s0\\s+s0-s0:c0.c1023\\s+staff_r sysadm_r$" }
      - { some: "~ ^user_u\\s+user\\s+s0\\s+s0\\s+user_r$" }
    rationale: *rat-622589058b
    remediation: &rem-4dd2fb6ccc |
      Configure the operating system to confine SELinux users to roles that conform to least privilege.

      Use the following command to map the "staff_u" SELinux user to the "staff_r" and "sysadm_r" roles:

           $ sudo semanage user -m staff_u -R staff_r -R sysadm_r

      Use the following command to map the "user_u" SELinux user to the "user_r" role:

           $ sudo semanage -m user_u -R user_r
  - id: "STIG-RHEL-07-020022-semanage_deny_priv_ssh"
    name: "The Red Hat Enterprise Linux operating system must not allow privileged accounts to utilize SSH."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020022, V-250313, SV-250313r942891_rule, CAT II. CCI-002165, CCI-002235."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      getsebool ssh_sysadm_login
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ssh_sysadm_login --\u003e off" }
    rationale: &rat-fcf93e4430 |
      Preventing non-privileged users from executing privileged functions mitigates the risk that unauthorized individuals or processes may gain unnecessary access to information or privileges.

      Privileged functions include, for example, establishing accounts, performing system integrity checks, or administering cryptographic key management activities. Non-privileged users are individuals who do not possess appropriate authorizations. Circumventing intrusion detection and prevention mechanisms or malicious code protection mechanisms are examples of privileged functions that require protection from non-privileged users.
    remediation: &rem-9aafc2c0c9 |
      Configure the operating system to prevent privileged accounts from utilizing SSH.
      Use the following command to set the "ssh_sysadm_login" boolean to "off":

           $ sudo setsebool -P ssh_sysadm_login off

      Note: SELinux confined users mapped to sysadm_u are not allowed to login to the system over SSH, by default. If this is a required function, it can be configured by setting the ssh_sysadm_login SELinux boolean to "on" with the following command:

           $ sudo setsebool -P ssh_sysadm_login on

      This must be documented with the ISSO as an operational requirement.
  - id: "STIG-RHEL-07-020023-selinux_sudo_context"
    name: "The Red Hat Enterprise Linux operating system must elevate the SELinux context when an administrator calls the sudo command. (Check files)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020023, V-250314, SV-250314r928582_rule, CAT II. CCI-002165, CCI-002235."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -iRs sysadm_r /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ %wheel ALL=\\(ALL\\) TYPE=sysadm_t ROLE=sysadm_r ALL" }
    rationale: *rat-622589058b
    remediation: &rem-ffceb9f76c |
      Configure the operating system to elevate the SELinux context when an administrator calls the sudo command.
      Edit a file in the "/etc/sudoers.d" directory with the following command:

           $ sudo visudo -f /etc/sudoers.d/<customfile>

      Use the following example to build the <customfile> in the /etc/sudoers.d directory to allow any administrator belonging to a designated sudoers admin group to elevate their SELinux context with the use of the sudo command:

           %{designated_group_or_user_name} ALL=(ALL) TYPE=sysadm_t ROLE=sysadm_r ALL

      Remove any configurations that conflict with the above from the following locations:

           /etc/sudoers
           /etc/sudoers.d/
  - id: "STIG-RHEL-07-020023-selinux_sudo_context_count"
    name: "The Red Hat Enterprise Linux operating system must elevate the SELinux context when an administrator calls the sudo command. (Check count)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020023, V-250314, SV-250314r928582_rule, CAT II. CCI-002165, CCI-002235."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -iRs sysadm_r /etc/sudoers /etc/sudoers.d/* | cut -d":" -f1 | uniq | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^[0-1]\\b" }
    rationale: *rat-622589058b
    remediation: *rem-ffceb9f76c
  - id: "STIG-RHEL-07-020028-mailx"
    name: "The Red Hat Enterprise Linux operating system must be configured to allow sending email notifications of configuration changes and adverse events to designated personnel. (package)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020028, V-256970, SV-256970r902696_rule, CAT II. CCI-001744."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet mailx
    expect: true
    rationale: &rat-e2e8e4abfe |
      Unauthorized changes to the baseline configuration could make the system vulnerable to various attacks or allow unauthorized access to the operating system. Changes to operating system configurations can have unintended side effects, some of which may be relevant to security.

      Detecting such changes and providing an automated response can help avoid unintended, negative consequences that could ultimately affect the security state of the operating system. The operating system's IMO/ISSO and SAs must be notified via email and/or monitoring system trap when there is an unauthorized modification of a configuration item.
    remediation: &rem-c448aa0ac1 |
      Install the "mailx" package on the system:

           $ sudo yum install mailx
  - id: "STIG-RHEL-07-020029-aide_installed"
    name: "Must use a file integrity tool to verify correct operation of all security functions (package)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020029, V-251705, SV-251705r880854_rule, CAT II. CCI-002696."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet aide
    expect: true
    rationale: &rat-3df739457a |
      Without verification of the security functions, security functions may not operate correctly, and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.

      This requirement applies to the Red Hat Enterprise Linux operating system performing security function verification/testing and/or systems and environments that require this functionality.
    remediation: &rem-e7ecdfc1a2 |
      Install AIDE, initialize it, and perform a manual check.

      Install AIDE:
           $ sudo yum install aide

      Initialize it:
           $ sudo /usr/sbin/aide --init

           AIDE, version 0.15.1
           ### AIDE database at /var/lib/aide/aide.db.new.gz initialized.

      The new database will need to be renamed to be read by AIDE:
           $ sudo mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz

      Perform a manual check:
           $ sudo /usr/sbin/aide --check

           AIDE, version 0.15.1
           ### All files match AIDE database. Looks okay!

      Done.
  - id: "STIG-RHEL-07-020029-aide_check"
    name: "Must use a file integrity tool to verify correct operation of all security functions (db_check)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020029, V-251705, SV-251705r880854_rule, CAT II. CCI-002696."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      /usr/sbin/aide --check
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ \\.\\*AIDE database\\. Looks okay!" }
    rationale: *rat-3df739457a
    remediation: *rem-e7ecdfc1a2
  - id: "STIG-RHEL-07-020030-aide_cron"
    name: "Must be configured so that a file integrity tool verifies the baseline operating system configuration at least weekly. \nRHEL-07-020040 (Must be configured so that designated personnel are notified if basel…)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020030, V-204445, SV-204445r958794_rule, CAT II. CCI-001744."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep aide /etc/cron.d/aide
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(\\*|0)\\s5\\s\\*\\s\\*\\s\\*\\sroot /usr/sbin/aide --check" }
    rationale: &rat-f02c5c1ed2 |
      Unauthorized changes to the baseline configuration could make the system vulnerable to various attacks or allow unauthorized access to the operating system. Changes to operating system configurations can have unintended side effects, some of which may be relevant to security.

      Detecting such changes and providing an automated response can help avoid unintended, negative consequences that could ultimately affect the security state of the operating system. The operating system's Information System Security Manager (ISSM)/Information System Security Officer (ISSO) and System Administrators (SAs) must be notified via email and/or monitoring system trap when there is an unauthorized modification of a configuration item.
    remediation: &rem-c6463d8538 |
      Configure the file integrity tool to run automatically on the system at least weekly.

      The following example output is generic. It will set cron to run AIDE daily, but other file integrity tools may be used:

           # more /etc/cron.daily/aide
           #!/bin/bash

           /usr/sbin/aide --check | /bin/mail -s "$HOSTNAME - Daily AIDE integrity check run" root@example_server_name.mil

      Note: Per requirement RHEL-07-020028, the "mailx" package must be installed on the system to enable email functionality.
  - id: "STIG-RHEL-07-020100-modprobe_usb-storage"
    name: "Must be configured to disable USB mass storage. (running)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020100, V-204449, SV-204449r942894_rule, CAT II. CCI-001958, CCI-000778, CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      modprobe -n -v usb-storage
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /bin/false" }
    rationale: &rat-0e5f4c06fb |
      USB mass storage permits easy introduction of unknown devices, thereby facilitating malicious activity.
    remediation: &rem-defa61ba1b |
      Configure the operating system to disable the ability to use the USB Storage kernel module.

      Create a file under "/etc/modprobe.d" with the following command:

           # touch /etc/modprobe.d/usb-storage.conf

      Add the following line to the created file:

           install usb-storage /bin/false

      Configure the operating system to disable the ability to use USB mass storage devices.

           # vi /etc/modprobe.d/blacklist.conf

      Add or update the line:

           blacklist usb-storage
  - id: "STIG-RHEL-07-020100-modprobe_usb_storage"
    name: "Must be configured to disable USB mass storage."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020100, V-204449, SV-204449r942894_rule, CAT II. CCI-001958, CCI-000778, CCI-000366."
