    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PrintLastLog yes" }
      - { none: "~ ^PrintLastLog no" }
    rationale: &rat-fa32a5bedc |
      Providing users with feedback on when account accesses via SSH last occurred facilitates user recognition and reporting of unauthorized account use.
    remediation: &rem-18fa6d8e29 |
      Configure SSH to provide users with feedback on when account accesses last occurred by setting the required configuration options in "/etc/pam.d/sshd" or in the "sshd_config" file used by the system ("/etc/ssh/sshd_config" will be used in the example) (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor).

      Modify the "PrintLastLog" line in "/etc/ssh/sshd_config" to match the following:

      PrintLastLog yes

      The SSH service must be restarted for changes to "sshd_config" to take effect.
  - id: "STIG-RHEL-07-040370-permitroot_sshd_config"
    name: "Must not permit direct logons to the root account using remote access via SSH."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040370, V-204592, SV-204592r991589_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i permitroot /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PermitRootLogin no" }
      - { none: "~ ^PermitRootLogin yes" }
    rationale: &rat-598211f32e |
      Even though the communications channel may be encrypted, an additional layer of security is gained by extending the policy of not logging on directly as root. In addition, logging on with a user-specific account provides individual accountability of actions performed on the system.
    remediation: &rem-51eaa83d27 |
      Configure SSH to stop users from logging on remotely as the root user.

      Edit the appropriate  "/etc/ssh/sshd_config" file to uncomment or add the line for the "PermitRootLogin" keyword and set its value to "no" (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor):

      PermitRootLogin no

      The SSH service must be restarted for changes to take effect.
  - id: "STIG-RHEL-07-040380-user_hosts_sshd_config"
    name: "Must be configured so that the SSH daemon does not allow authentication using known hosts authentication."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040380, V-204593, SV-204593r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i userknown /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^IgnoreUserKnownHosts yes" }
      - { none: "~ ^IgnoreUserKnownHosts no" }
    rationale: *rat-20ce5e0cb6
    remediation: &rem-512843c66f |
      Configure the SSH daemon to not allow authentication using known hosts authentication.

      Add the following line in "/etc/ssh/sshd_config", or uncomment the line and set the value to "yes":

      IgnoreUserKnownHosts yes

      The SSH service must be restarted for changes to take effect.
  - id: "STIG-RHEL-07-040400-macs_sshd_config"
    name: "Must be configured so that the SSH daemon is configured to only use Message Authentication Codes (MACs) employing FIPS 140-2 approved cryptographic hash algorithms."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040400, V-204595, SV-204595r744117_rule, CAT II. CCI-001453."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i Macs /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^MACs hmac-sha2-512,hmac-sha2-256" }
    rationale: &rat-845617e61f |
      DoD information systems are required to use FIPS 140-2 approved cryptographic hash functions. The only SSHv2 hash algorithm meeting this requirement is SHA.

      The system will attempt to use the first hash presented by the client that matches the server list. Listing the values "strongest to weakest" is a method to ensure the use of the strongest hash available to secure the SSH connection.
    remediation: &rem-4ba87c45ac |
      Edit the "/etc/ssh/sshd_config" file to uncomment or add the line for the "MACs" keyword and set its value to "hmac-sha2-512" and/or "hmac-sha2-256" (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor):

      MACs hmac-sha2-512,hmac-sha2-256

      The SSH service must be restarted for changes to take effect.
  - id: "STIG-RHEL-07-040410-ssh_pub_key_perms"
    name: "Must be configured so that the SSH public host key files have mode 0644 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040410, V-204596, SV-204596r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      keysperm=$(sudo find /etc/ssh/ -name *_key.pub -type f  -perm /137 ); echo $keyperms
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-a8ce4a0a5e |
      If a public host key file is modified by an unauthorized user, the SSH service may be compromised.
    remediation: &rem-1b84d887d0 |
      Note: SSH public key files may be found in other directories on the system depending on the installation.

      Change the mode of public host key files under "/etc/ssh" to "0644" with the following command:

      # chmod 0644 /etc/ssh/*.key.pub
  - id: "STIG-RHEL-07-040420-ssh_priv_key_perms"
    name: "Must be configured so that the SSH private host key files have mode 0640 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040420, V-204597, SV-204597r880743_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      keyperms=$(sudo find / -name *_key -type f -perm /133 ); echo $keyperms
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-c122f86567 |
      If an unauthorized user obtains the private SSH host key file, the host could be impersonated.
    remediation: &rem-0e8e8ae122 |
      Configure the mode of SSH private host key files under "/etc/ssh" to "0640" with the following command:

      # chmod 0640 /path/to/file/ssh_host*key
  - id: "STIG-RHEL-07-040430-gssapi_sshd_config"
    name: "Must be configured so that the SSH daemon does not permit Generic Security Service Application Program Interface (GSSAPI) authentication unless needed."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040430, V-204598, SV-204598r603261_rule, CAT II. CCI-000318, CCI-001812, CCI-001813, CCI-000368, CCI-001814."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i gssapi /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GSSAPIAuthentication no" }
      - { none: "~ ^GSSAPIAuthentication yes" }
    rationale: &rat-fd9fc55e32 |
      GSSAPI authentication is used to provide additional authentication mechanisms to applications. Allowing GSSAPI authentication through SSH exposes the system's GSSAPI to remote hosts, increasing the attack surface of the system. GSSAPI authentication must be disabled unless needed.
    remediation: &rem-4b9d0fd1d5 |
      Uncomment the "GSSAPIAuthentication" keyword in "/etc/ssh/sshd_config" (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor) and set the value to "no":

      GSSAPIAuthentication no

      The SSH service must be restarted for changes to take effect.

      If GSSAPI authentication is required, it must be documented, to include the location of the configuration file, with the ISSO.
  - id: "STIG-RHEL-07-040440-kerberos_sshd_config"
    name: "Must be configured so that the SSH daemon does not permit Kerberos authentication unless needed."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040440, V-204599, SV-204599r603261_rule, CAT II. CCI-000368, CCI-001813, CCI-001812, CCI-001814, CCI-000318."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i kerberos /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^KerberosAuthentication no" }
      - { none: "~ ^KerberosAuthentication yes" }
    rationale: &rat-800cb574b2 |
      Kerberos authentication for SSH is often implemented using Generic Security Service Application Program Interface (GSSAPI). If Kerberos is enabled through SSH, the SSH daemon provides a means of access to the system's Kerberos implementation. Vulnerabilities in the system's Kerberos implementation may then be subject to exploitation. To reduce the attack surface of the system, the Kerberos authentication mechanism within SSH must be disabled for systems not using this capability.
    remediation: &rem-c59b8ca1d9 |
      Uncomment the "KerberosAuthentication" keyword in "/etc/ssh/sshd_config" (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor) and set the value to "no":

      KerberosAuthentication no

      The SSH service must be restarted for changes to take effect.

      If Kerberos authentication is required, it must be documented, to include the location of the configuration file, with the ISSO.
  - id: "STIG-RHEL-07-040450-strict_mode_sshd_config"
    name: "Must be configured so that the SSH daemon performs strict mode checking of home directory configuration files."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040450, V-204600, SV-204600r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i strictmode /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^StrictModes yes" }
      - { none: "~ ^StrictModes no" }
    rationale: &rat-eb86a97d2b |
      If other users have access to modify user-specific SSH configuration files, they may be able to log on to the system as another user.
    remediation: &rem-1f6e621558 |
      Uncomment the "StrictModes" keyword in "/etc/ssh/sshd_config" (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor) and set the value to "yes":

      StrictModes yes

      The SSH service must be restarted for changes to take effect.
  - id: "STIG-RHEL-07-040460-priv_sep_sshd_config"
    name: "Must be configured so that the SSH daemon uses privilege separation."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040460, V-204601, SV-204601r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i privilegesep /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^UsePrivilegeSeparation (sandbox|yes)" }
      - { none: "~ ^UsePrivilegeSeparation no" }
    rationale: &rat-9ea8e78fcd |
      SSH daemon privilege separation causes the SSH process to drop root privileges when not needed, which would decrease the impact of software vulnerabilities in the unprivileged section.
    remediation: &rem-268bc762f3 |
      Uncomment the "UsePrivilegeSeparation" keyword in "/etc/ssh/sshd_config" (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor) and set the value to "sandbox" or "yes":

      UsePrivilegeSeparation sandbox

      The SSH service must be restarted for changes to take effect.
  - id: "STIG-RHEL-07-040470-compression_sshd_config"
    name: "Must be configured so that the SSH daemon does not allow compression or only allows compression after successful authentication (rhel \u003c= 7.3)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040470, V-204602, SV-204602r880758_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i compression /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Compression (delayed|no)" }
      - { none: "~ ^Compression yes" }
    rationale: &rat-8ace2cc0d5 |
      If compression is allowed in an SSH connection prior to authentication, vulnerabilities in the compression software could result in compromise of the system from an unauthenticated connection, potentially with root privileges.
    remediation: &rem-cf3fd93889 |
      Uncomment the "Compression" keyword in "/etc/ssh/sshd_config" (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor) on the system and set the value to "delayed" or "no":

           Compression no

      The SSH service must be restarted for changes to take effect.
  - id: "STIG-RHEL-07-040500-etc_chrony.conf-attrs"
    name: "Must for networked systems, synchronize clocks with a server that is synchronized to one of the redundant United States Naval Observatory (USNO) time servers, a time server designated for the appropriate DoD network (NIPRNet/SIPRNet), and/or the Global Positioning System (GPS). (/etc/chrony.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040500, V-204603, SV-204603r809230_rule, CAT II. CCI-001891, CCI-002046."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      f='/etc/chrony.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f7f42259e9 |
      Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events. Sources outside the configured acceptable allowance (drift) may be inaccurate.

      Synchronizing internal information system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected over a network.

      Organizations should consider endpoints that may not have regular access to the authoritative time server (e.g., mobile, teleworking, and tactical endpoints).
    remediation: &rem-bf7a44b468 |
      Edit the "/etc/ntp.conf" or "/etc/chrony.conf" file and add or update an entry to define "maxpoll" to "16" as follows:

      server 0.rhel.pool.ntp.org iburst maxpoll 16

      If NTP was running and "maxpoll" was updated, the NTP service must be restarted:

      # systemctl restart ntpd

      If NTP was not running, it must be started:

      # systemctl start ntpd

      If "chronyd" was running and "maxpoll" was updated, the service must be restarted:

      # systemctl restart chronyd.service

      If "chronyd" was not running, it must be started:

      # systemctl start chronyd.service
  - id: "STIG-RHEL-07-040500-etc_chrony.conf-content"
    name: "Must for networked systems, synchronize clocks with a server that is synchronized to one of the redundant United States Naval Observatory (USNO) time servers, a time server designated for the appropriate DoD network (NIPRNet/SIPRNet), and/or the Global Positioning System (GPS). (/etc/chrony.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040500, V-204603, SV-204603r809230_rule, CAT II. CCI-001891, CCI-002046."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/chrony.conf'
    allow_rc: any
    expect: { some: "~ server\\s.*maxpoll ([0-9]|1[0-6])$" }
    rationale: *rat-f7f42259e9
    remediation: *rem-bf7a44b468
  - id: "STIG-RHEL-07-040520-firewalld"
    name: "Must enable an application firewall, if available."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040520, V-204604, SV-204604r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet firewalld
    expect: true
    rationale: &rat-7f1c5b853f |
      Firewalls protect computers from network attacks by blocking or limiting access to open network ports. Application firewalls limit which applications are allowed to communicate over the network.
    remediation: &rem-15b1b1ece2 |
      Ensure the operating system's application firewall is enabled.

      Install the "firewalld" package, if it is not on the system, with the following command:

      # yum install firewalld

      Start the firewall via "systemctl" with the following command:

      # systemctl start firewalld
  - id: "STIG-RHEL-07-040520-firewalld-enabled"
    name: "Must enable an application firewall, if available. (Service firewalld is enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040520, V-204604, SV-204604r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState firewalld | cut -d= -f2
    expect: "~ ^enabled"
    rationale: *rat-7f1c5b853f
    remediation: *rem-15b1b1ece2
  - id: "STIG-RHEL-07-040520-firewalld-running"
    name: "Must enable an application firewall, if available. (Service firewalld is running)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040520, V-204604, SV-204604r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState firewalld | cut -d= -f2
    expect: "== active"
    rationale: *rat-7f1c5b853f
    remediation: *rem-15b1b1ece2
  - id: "STIG-RHEL-07-040610-net.ipv4.conf.all.accept_source_route"
    name: "Must not forward Internet Protocol version 4 (IPv4) source-routed pack"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040610, V-204609, SV-204609r880797_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.all.accept_source_route
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-64390aef94 |
      Source-routed packets allow the source of the packet to suggest that routers forward the packet along a different path than configured on the router, which can be used to bypass network security measures. This requirement applies only to the forwarding of source-routed traffic, such as when IPv4 forwarding is enabled and the system is functioning as a router.
    remediation: &rem-02d9c542b3 |
      Set the system to the required kernel parameter by adding the following line to "/etc/sysctl.conf" or a configuration file in the /etc/sysctl.d/ directory (or modify the line to have the required value):

           net.ipv4.conf.all.accept_source_route = 0

      Issue the following command to make the changes take effect:

           # sysctl -system
  - id: "STIG-RHEL-07-040611-net.ipv4.conf.all.rp_filter"
    name: "Must use a reverse-path filter for IPv4 network traffic when possible on all interfaces."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040611, V-204610, SV-204610r880800_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.all.rp_filter
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-4719509613 |
      Enabling reverse path filtering drops packets with source addresses that should not have been able to be received on the interface they were received on. It should not be used on systems that are routers for complicated networks, but is helpful for end hosts and routers serving small networks.
    remediation: &rem-14f7f11722 |
      Set the system to the required kernel parameter by adding the following line to "/etc/sysctl.conf" or a configuration file in the /etc/sysctl.d/ directory (or modify the line to have the required value):

           net.ipv4.conf.all.rp_filter = 1

      Issue the following command to make the changes take effect:

           # sysctl --system
