  - id: "STIG-RHEL-07-010270-password_auth_remember"
    name: "Must be configured so that passwords are prohibited from reuse for a minimum of five generations."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010270, V-204422, SV-204422r917818_rule, CAT II. CCI-000200."
