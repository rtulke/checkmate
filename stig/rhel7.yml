    severity: medium
    run: |
      sysctl -n net.ipv4.conf.all.accept_redirects
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: *rat-1c77eb3372
    remediation: &rem-08351f5b53 |
      Set the system to ignore IPv4 ICMP redirect messages by adding the following line to "/etc/sysctl.conf" or a configuration file in the /etc/sysctl.d/ directory (or modify the line to have the required value):

           net.ipv4.conf.all.accept_redirects = 0

      Issue the following command to make the changes take effect:

           # sysctl --system
  - id: "STIG-RHEL-07-040650-net.ipv4.conf.default.send_redirects"
    name: "Must not allow interfaces to perform Internet Protocol version 4 (IPv4) Internet Control Message Protocol (ICMP) redirects by default."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040650, V-204616, SV-204616r880818_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.default.send_redirects
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-8112cdb412 |
      ICMP redirect messages are used by routers to inform hosts that a more direct route exists for a particular destination. These messages contain information from the system's route table, possibly revealing portions of the network topology.
    remediation: &rem-1ba53d9629 |
      Configure the system to not allow interfaces to perform IPv4 ICMP redirects by default.

      Set the system to the required kernel parameter by adding the following line to "/etc/sysctl.conf" or a configuration file in the /etc/sysctl.d/ directory (or modify the line to have the required value):

           net.ipv4.conf.default.send_redirects = 0

      Issue the following command to make the changes take effect:

           # sysctl --system
  - id: "STIG-RHEL-07-040660-net.ipv4.conf.all.send_redirects"
    name: "Must not send Internet Protocol version 4 (IPv4) Internet Control Message Protocol (ICMP) redirects."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040660, V-204617, SV-204617r880821_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.all.send_redirects
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: *rat-8112cdb412
    remediation: &rem-79b8fb754d |
      Configure the system to not allow interfaces to perform IPv4 ICMP redirects.

      Set the system to the required kernel parameter by adding the following line to "/etc/sysctl.conf" or a configuration file in the /etc/sysctl.d/ directory (or modify the line to have the required value):

           net.ipv4.conf.all.send_redirects = 0

      Issue the following command to make the changes take effect:

           # sysctl --system
  - id: "STIG-RHEL-07-040670-int_promis"
    name: "Nnmclietwork interfaces configured on the Red Hat Enterprise Linux operating system must not be in promiscuous mode."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040670, V-204618, SV-204618r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      ip link | grep -i promisc
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-4d55728802 |
      Network interfaces in promiscuous mode allow for the capture of all network traffic visible to the system. If unauthorized individuals can access these applications, it may allow then to collect information such as logon IDs, passwords, and key exchanges between systems.

      If the system is being used to perform a network troubleshooting function, the use of these tools must be documented with the Information System Security Officer (ISSO) and restricted to only authorized personnel.
    remediation: &rem-672aa60216 |
      Configure network interfaces to turn off promiscuous mode unless approved by the ISSO and documented.

      Set the promiscuous mode of an interface to off with the following command:

      #ip link set dev <devicename> multicast off promisc off
  - id: "STIG-RHEL-07-040680-mail_restricted"
    name: "Must be configured to prevent unrestricted mail relaying."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040680, V-204619, SV-204619r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      postconf -n smtpd_client_restrictions
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^smtpd_client_restrictions = permit_mynetworks, reject" }
    rationale: &rat-a0224f2a94 |
      If unrestricted mail relaying is permitted, unauthorized senders could use this host as a mail relay for the purpose of sending spam or other unauthorized activity.
    remediation: &rem-68f4cf6f8d |
      If "postfix" is installed, modify the "/etc/postfix/main.cf" file to restrict client connections to the local network with the following command:

      # postconf -e 'smtpd_client_restrictions = permit_mynetworks,reject'
  - id: "STIG-RHEL-07-040710-x11forward_sshd_config"
    name: "Must be configured so that remote X connections are disabled except to fulfill documented and validated mission requirements."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040710, V-204622, SV-204622r603849_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i x11f /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^X11Forwarding yes" }
      - { some: "~ ^X11Forwarding no" }
    rationale: &rat-a84cb6911b |
      The security risk of using X11 forwarding is that the client's X11 display server may be exposed to attack when the SSH client requests forwarding. A system administrator may have a stance in which they want to protect clients that may expose themselves to attack by unwittingly requesting X11 forwarding, which can warrant a ''no'' setting.
      X11 forwarding should be enabled with caution. Users with the ability to bypass file permissions on the remote host (for the user's X11 authorization database) can access the local X11 display through the forwarded connection. An attacker may then be able to perform activities such as keystroke monitoring if the ForwardX11Trusted option is also enabled.
      If X11 services are not required for the system's intended function, they should be disabled or restricted as appropriate to the system’s needs.
    remediation: &rem-e03b38f261 |
      Edit the "/etc/ssh/sshd_config" file to uncomment or add the line for the "X11Forwarding" keyword and set its value to "no" (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor):

      X11Forwarding no

      The SSH service must be restarted for changes to take effect:

      # systemctl restart sshd
  - id: "STIG-RHEL-07-040711-x11_use_localhost_sshd_config"
    name: "Must prevent remote hosts from connecting to the proxy display."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040711, V-233307, SV-233307r603301_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i x11use /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^X11UseLocalhost yes" }
      - { none: "~ ^X11UseLocalhost no" }
    rationale: &rat-cd5bb314aa |
      When X11 forwarding is enabled, there may be additional exposure to the server and client displays if the sshd proxy display is configured to listen on the wildcard address. By default, sshd binds the forwarding server to the loopback address and sets the hostname part of the DIPSLAY environment variable to localhost. This prevents remote hosts from connecting to the proxy display.
    remediation: &rem-4be2b5d398 |
      Configure the SSH daemon to prevent remote hosts from connecting to the proxy display.

      Edit the "/etc/ssh/sshd_config" file to uncomment or add the line for the "X11UseLocalhost" keyword and set its value to "yes" (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor):

      X11UseLocalhost yes
  - id: "STIG-RHEL-07-040712-ciphers_sshd_config_fips"
    name: "The Red Hat Enterprise Linux operating system SSH server must be configured to use only FIPS-validated key exchange algorithms."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040712, V-255925, SV-255925r880749_rule, CAT II. CCI-001453."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i kex /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^KexAlgorithms \"ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256\"" }
    rationale: &rat-acd535b9aa |
      The use of FIPS-validated cryptographic algorithms is enforced by enabling kernel FIPS mode. In the event that kernel FIPS mode is disabled, the use of nonvalidated cryptographic algorithms will be permitted systemwide. The SSH server configuration must manually define only FIPS-validated key exchange algorithms to prevent the use of nonvalidated algorithms.
    remediation: &rem-d3ce695009 |
      Configure the SSH server to use only FIPS-validated key exchange algorithms by adding or modifying the following line in "/etc/ssh/sshd_config":

           KexAlgorithms ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256

      Restart the "sshd" service for changes to take effect:

           $ sudo systemctl restart sshd
  - id: "STIG-RHEL-07-040730-xorgs-x11-server"
    name: "Must not have a graphical display manager installed unless approved."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040730, V-204624, SV-204624r646847_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet xorgs-x11-server
    expect: false
    rationale: &rat-75e40b17ad |
      Internet services that are not required for system or application processes must not be active to decrease the attack surface of the system. Graphical display managers have a long history of security vulnerabilities and must not be used unless approved and documented.
    remediation: &rem-be1c0b0369 |
      Document the requirement for a graphical user interface with the ISSO or reinstall the operating system without the graphical user interface. If reinstallation is not feasible, then continue with the following procedure:

      Open an SSH session and enter the following commands:

      $ sudo systemctl set-default multi-user.target

      $ sudo yum remove xorg-x11-server-Xorg xorg-x11-server-common xorg-x11-server-utils

      A reboot is required for the changes to take effect.
  - id: "STIG-RHEL-07-040740-net.ipv4.ip_forward"
    name: "Must not be performing packet forwarding unless the system is a router."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040740, V-204625, SV-204625r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv4.ip_forward
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-be3a273c9d |
      Routing protocol daemons are typically used on routers to exchange network topology information with other routers. If this software is used when not required, system network information may be unnecessarily transmitted across the network.
    remediation: &rem-4dd882100f |
      Set the system to the required kernel parameter by adding the following line to "/etc/sysctl.conf" or a configuration file in the /etc/sysctl.d/ directory (or modify the line to have the required value):

           net.ipv4.ip_forward = 0

      Issue the following command to make the changes take effect:

           # sysctl --system
  - id: "STIG-RHEL-07-040750-nfs_using_auth"
    name: "Must be configured so that the Network File System (NFS) is configured to use RPCSEC_GSS."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040750, V-204626, SV-204626r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -E "nfs|nfs*sec" /etc/fstab | grep -v "krb5:krb5i:krb5p" | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 0" }
    rationale: &rat-28c13f694e |
      When an NFS server is configured to use RPCSEC_SYS, a selected userid and groupid are used to handle requests from the remote user. The userid and groupid could mistakenly or maliciously be set incorrectly. The RPCSEC_GSS method of authentication uses certificates on the server and client systems to more securely authenticate the remote mount request.
    remediation: &rem-004d216f7d |
      Update the "/etc/fstab" file so the option "sec" is defined for each NFS mounted file system and the "sec" option does not have the "sys" setting.

      Ensure the "sec" option is defined as "krb5:krb5i:krb5p".
  - id: "STIG-RHEL-07-040810-firewall_default_zone"
    name: "The Red Hat Enterprise Linux operating system access control program must be configured to grant or deny system access to specific hosts and services."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040810, V-204628, SV-204628r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      echo "Manual Check Required"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Manual Check Required" }
    rationale: &rat-46cae083af |
      If the systems access control program is not configured with appropriate rules for allowing and denying access to system network resources, services may be accessible to unauthorized hosts.
    remediation: &rem-21bb12f986 |
      If "firewalld" is installed and active on the system, configure rules for allowing specific services and hosts.

      If "firewalld" is not "active", enable "tcpwrappers" by configuring "/etc/hosts.allow" and "/etc/hosts.deny" to allow or deny access to specific hosts.
  - id: "STIG-RHEL-07-040820-libreswan"
    name: "The Red Hat Enterprise Linux operating system must not have unauthorized IP tunnels configured."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040820, V-204629, SV-204629r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet libreswan
    expect: false
    rationale: &rat-8e9a0c13b7 |
      IP tunneling mechanisms can be used to bypass network filtering. If tunneling is required, it must be documented with the Information System Security Officer (ISSO).
    remediation: &rem-68c04c625a |
      Remove all unapproved tunnels from the system, or document them with the ISSO.
  - id: "STIG-RHEL-07-040830-net.ipv6.conf.all.accept_source_route"
    name: "Must not forward IPv6 source-routed packets."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040830, V-204630, SV-204630r880827_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv6.conf.all.accept_source_route
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-a6a40fccd2 |
      Source-routed packets allow the source of the packet to suggest that routers forward the packet along a different path than configured on the router, which can be used to bypass network security measures. This requirement applies only to the forwarding of source-routed traffic, such as when IPv6 forwarding is enabled and the system is functioning as a router.
    remediation: &rem-1bbcc6260b |
      Set the system to the required kernel parameter, if IPv6 is enabled, by adding the following line to "/etc/sysctl.conf" or a configuration file in the /etc/sysctl.d/ directory (or modify the line to have the required value):

           net.ipv6.conf.all.accept_source_route = 0

      Issue the following command to make the changes take effect:

           # sysctl --system
  - id: "STIG-RHEL-07-041001-pam_pkcs11"
    name: "The Red Hat Enterprise Linux operating system must have the required packages for multifactor authentication installed."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-041001, V-204631, SV-204631r603261_rule, CAT II. CCI-001953, CCI-001954, CCI-001948."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet pam_pkcs11
    expect: true
    rationale: &rat-a7f8640947 |
      Using an authentication device, such as a CAC or token that is separate from the information system, ensures that even if the information system is compromised, that compromise will not affect credentials stored on the authentication device.

      Multifactor solutions that require devices separate from information systems gaining access include, for example, hardware tokens providing time-based or challenge-response authenticators and smart cards such as the U.S. Government Personal Identity Verification card and the DoD Common Access Card.

      A privileged account is defined as an information system account with authorizations of a privileged user.

      Remote access is access to DoD nonpublic information systems by an authorized user (or an information system) communicating through an external, non-organization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      This requirement only applies to components where this is specific to the function of the device or has the concept of an organizational user (e.g., VPN, proxy capability). This does not apply to authentication for the purpose of configuring the device itself (management).
    remediation: &rem-dbd7969bf2 |
      Configure the operating system to implement multifactor authentication by installing the required packages.

      Install the pam_pkcs11 package with the following command:

      # yum install pam_pkcs11
  - id: "STIG-RHEL-07-041002-sssd_pam"
    name: "The Red Hat Enterprise Linux operating system must implement multifactor authentication for access to privileged accounts via pluggable authentication modules (PAM)."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-041002, V-204632, SV-204632r603261_rule, CAT II. CCI-001948, CCI-001954, CCI-001953."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep services /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^services =*pam*" }
    rationale: *rat-a7f8640947
    remediation: &rem-d3570e7601 |
      Configure the operating system to implement multifactor authentication for remote access to privileged accounts via pluggable authentication modules (PAM).

      Modify all of the services lines in "/etc/sssd/sssd.conf" or in configuration files found under "/etc/sssd/conf.d" to include pam.
  - id: "STIG-RHEL-07-041003-cert_policy_pam_pkcs11_conf"
    name: "The Red Hat Enterprise Linux operating system must implement certificate status checking for PKI authentication."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-041003, V-204633, SV-204633r603261_rule, CAT II. CCI-001954, CCI-001953, CCI-001948."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i cert_policy /etc/pam_pkcs11/pam_pkcs11.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s+cert_policy = *ocsp_on*" }
    rationale: *rat-a7f8640947
    remediation: &rem-e84a1130ef |
      Configure the operating system to do certificate status checking for PKI authentication.

      Modify all of the "cert_policy" lines in "/etc/pam_pkcs11/pam_pkcs11.conf" to include "ocsp_on".
  - id: "STIG-RHEL-07-041010-wireless_enabled"
    name: "The Red Hat Enterprise Linux operating system must be configured so that all wireless network adapters are disabled."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-041010, V-204634, SV-204634r603261_rule, CAT II. CCI-001443, CCI-001444, CCI-002418."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      nmcli device | grep -i wifi
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-873c5ba9a0 |
      The use of wireless networking can introduce many different attack vectors into the organization's network. Common attack vectors such as malicious association and ad hoc networks will allow an attacker to spoof a wireless access point (AP), allowing validated systems to connect to the malicious AP and enabling the attacker to monitor and record network traffic. These malicious APs can also serve to create a man-in-the-middle attack or be used to create a denial of service to valid network resources.
    remediation: &rem-b8388fc775 |
      Configure the system to disable all wireless network interfaces with the following command:

      #nmcli radio wifi off
  - id: "STIG-RHEL-07-910055-audit_logs_owner"
    name: "Must protect audit information from unauthorized read, modification, or deletion."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-910055, V-228564, SV-228564r606407_rule, CAT II. CCI-001314, CCI-000162, CCI-000163, CCI-000164."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      find /var/log/audit/ ! -user root -o ! -group root
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-2c4cfe008a |
      If audit information were to become compromised, then forensic analysis and discovery of the true source of potentially malicious system activity is impossible to achieve.

      To ensure the veracity of audit information, the operating system must protect audit information from unauthorized modification.

      Audit information includes all information (e.g., audit records, audit settings, audit reports) needed to successfully audit information system activity.
    remediation: &rem-76dfa22653 |
      Change the mode of the audit log files with the following command:

      # chmod 0600 [audit_file]

      Change the owner and group owner of the audit log files with the following command:

      # chown root:root [audit_file]
  - id: "STIG-RHEL-07-910055-audit_logs_perm"
    name: "Must protect audit information from unauthorized read, modification, or deletion."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-910055, V-228564, SV-228564r606407_rule, CAT II. CCI-001314, CCI-000162, CCI-000163, CCI-000164."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      find /var/log/audit/ -type f ! -perm 400 ! -perm 600
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: *rat-2c4cfe008a
    remediation: *rem-76dfa22653
  - id: "STIG-RHEL-07-010375-kernel.dmesg_restrict"
    name: "The Red Hat Enterprise Linux operating system must restrict access to the kernel message buffer."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010375, V-255927, SV-255927r880791_rule, CAT III. CCI-001090."
    tags: [stig, stig-rhel7, stig-cat-3]
    severity: low
    run: |
      sysctl -n kernel.dmesg_restrict
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-c46f0bcc85 |
      Restricting access to the kernel message buffer limits access only to root. This prevents attackers from gaining additional system information as a non-privileged user.
    remediation: &rem-1520c8a7a2 |
      Configure the operating system to restrict access to the kernel message buffer.

      Set the system to the required kernel parameter by adding or modifying the following line in /etc/sysctl.conf or a config file in the /etc/sysctl.d/ directory:

           kernel.dmesg_restrict = 1

      Remove any configurations that conflict with the above from the following locations:
           /run/sysctl.d/
           /etc/sysctl.d/
           /usr/local/lib/sysctl.d/
           /usr/lib/sysctl.d/
           /lib/sysctl.d/
           /etc/sysctl.conf

      Reload settings from all system configuration files with the following command:

           $ sudo sysctl --system
  - id: "STIG-RHEL-07-020200-clean_yum_conf"
    name: "Remove all software components after updated versions have been installed."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020200, V-204452, SV-204452r603261_rule, CAT III. CCI-002617."
    tags: [stig, stig-rhel7, stig-cat-3]
    severity: low
    run: |
      grep clean /etc/yum.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^clean_requirements_on_remove=1" }
      - { none: "~ ^clean_requirements_on_remove=0" }
    rationale: &rat-a08a21955f |
      Previous versions of software components that are not removed from the information system after updates have been installed may be exploited by adversaries. Some information technology products may remove older versions of software automatically from the information system.
    remediation: &rem-cc716b6d79 |
      Configure the operating system to remove all software components after updated versions have been installed.

      Set the "clean_requirements_on_remove" option to "1" in the "/etc/yum.conf" file:

      clean_requirements_on_remove=1
  - id: "STIG-RHEL-07-020300-gids_defined"
    name: "Must be configured so that all Group Identifiers (GIDs) referenced in the /etc/passwd file are defined in the /etc/group file."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020300, V-204461, SV-204461r603261_rule, CAT III. CCI-000764."
    tags: [stig, stig-rhel7, stig-cat-3]
    severity: low
    run: |
      pwck -r | grep 'no group' | awk '{ gsub("[:\47]",""); print $2}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-8b20ceb485 |
      If a user is assigned the GID of a group not existing on the system, and a group with the GID is subsequently created, the user may have unintended rights to any files associated with the group.
    remediation: &rem-78e530cad5 |
      Configure the system to define all GIDs found in the "/etc/passwd" file by modifying the "/etc/group" file to add any non-existent group referenced in the "/etc/passwd" file, or change the GIDs referenced in the "/etc/passwd" file to a group that exists in "/etc/group".
  - id: "STIG-RHEL-07-021024-dev_shm"
    name: "Must mount /dev/shm with secure options. (running)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021024, V-204486, SV-204486r603261_rule, CAT III. CCI-001764."
    tags: [stig, stig-rhel7, stig-cat-3]
    severity: low
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/dev/shm'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]noexec(,|$)"
      - "~ [ ,]nodev(,|$)"
      - "~ [ ,]nosuid(,|$)"
    rationale: &rat-cde874076e |
      The "noexec" mount option causes the system to not execute binary files. This option must be used for mounting any file system not containing approved binary files as they may be incompatible. Executing files from untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative access.

      The "nodev" mount option causes the system to not interpret character or block special devices. Executing character or block special devices from untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative access.

      The "nosuid" mount option causes the system to not execute "setuid" and "setgid" files with owner privileges. This option must be used for mounting any file system not containing approved "setuid" and "setguid" files. Executing files from untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative access.
    remediation: &rem-a5bcc6887e |
      Configure the system so that /dev/shm is mounted with the "nodev", "nosuid", and "noexec" options by adding /modifying the /etc/fstab with the following line:

      tmpfs /dev/shm tmpfs defaults,nodev,nosuid,noexec 0 0
  - id: "STIG-RHEL-07-021024-dev_shm_etc_fstab"
    name: "Must mount /dev/shm with secure options."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021024, V-204486, SV-204486r603261_rule, CAT III. CCI-001764."
    tags: [stig, stig-rhel7, stig-cat-3]
    severity: low
    run: |
      grep /dev/shm /etc/fstab
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ nodev" }
      - { some: "~ noexec" }
      - { some: "~ nosuid" }
    rationale: *rat-cde874076e
    remediation: *rem-a5bcc6887e
