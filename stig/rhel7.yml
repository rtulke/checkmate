    rationale: *rat-28912bbed1
    remediation: *rem-a5f17d8564
  - id: "STIG-RHEL-07-020240-umask_login_defs"
    name: "Must define default permissions for all authenticated users in such a way that the user can only read and modify their own files."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020240, V-204457, SV-204457r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i umask /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^UMASK 077" }
    rationale: &rat-4ee9105023 |
      Setting the most restrictive default permissions ensures that when new accounts are created, they do not have unnecessary access.
    remediation: &rem-b3ae2cfea3 |
      Configure the operating system to define default permissions for all authenticated users in such a way that the user can only read and modify their own files.

      Add or edit the line for the "UMASK" parameter in "/etc/login.defs" file to "077":

      UMASK  077
  - id: "STIG-RHEL-07-020260-security-updates"
    name: "security patches and updates must be installed and up to date."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020260, V-204459, SV-204459r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      yum check-update
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ \\[0-9\\]\\.\\* packages available" }
    rationale: &rat-2d5b3d6c09 |
      Timely patching is critical for maintaining the operational availability, confidentiality, and integrity of information technology (IT) systems. However, failure to keep operating system and application software patched is a common mistake made by IT professionals. New patches are released daily, and it is often difficult for even experienced System Administrators to keep abreast of all the new patches. When new weaknesses in an operating system exist, patches are usually made available by the vendor to resolve the problems. If the most recent security patches and updates are not installed, unauthorized users may take advantage of weaknesses in the unpatched software. The lack of prompt attention to patching could result in a system compromise.
    remediation: &rem-f15f3100dc |
      Install the operating system patches or updated packages available from Red Hat within 30 days or sooner as local policy dictates.
  - id: "STIG-RHEL-07-020270-passwd_unecc_accts"
    name: "Must not have unnecessary accounts."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020270, V-204460, SV-204460r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      cat /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ gopher" }
      - { none: "~ games" }
      - { none: "~ ftp" }
    rationale: &rat-2c770a563c |
      Accounts providing no operational purpose provide additional opportunities for system compromise. Unnecessary accounts include user accounts for individuals not requiring access to the system and application accounts for applications not installed on the system.
    remediation: &rem-174ebd8889 |
      Configure the system so all accounts on the system are assigned to an active system, application, or user account.

      Remove accounts that do not support approved system activities or that allow for a normal user to perform administrative-level actions.

      Document all authorized accounts on the system.
  - id: "STIG-RHEL-07-020320-unowned"
    name: "Must be configured so that all files and directories have a valid owner."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020320, V-204463, SV-204463r603261_rule, CAT II. CCI-002165."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nouser
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-ed18e5382d |
      Unowned files and directories may be unintentionally inherited if a user is assigned the same User Identifier "UID" as the UID of the un-owned files.
    remediation: &rem-a76d6b494b |
      Either remove all files and directories from the system that do not have a valid user, or assign a valid user to all unowned files and directories on the system with the "chown" command:

      # chown <user> <file>
  - id: "STIG-RHEL-07-020330-ungrouped"
    name: "Must be configured so that all files and directories have a valid group owner."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020330, V-204464, SV-204464r603261_rule, CAT II. CCI-002165."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nogroup
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-e622316cc5 |
      Files without a valid group owner may be unintentionally inherited if a group is assigned the same Group Identifier (GID) as the GID of the files without a valid group owner.
    remediation: &rem-fb7c056a78 |
      Either remove all files and directories from the system that do not have a valid group, or assign a valid group to all files and directories on the system with the "chgrp" command:

      # chgrp <group> <file>
  - id: "STIG-RHEL-07-020610-create_homelogin_defs"
    name: "Must be configured so that all local interactive user accounts, upon creation, are assigned a home directory."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020610, V-204466, SV-204466r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i create_home /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^CREATE_HOME yes" }
      - { none: "~ ^CREATE_HOME no" }
    rationale: &rat-f470f87766 |
      If local interactive users are not assigned a valid home directory, there is no place for the storage and control of files they should own.
    remediation: &rem-e8b2c536b3 |
      Configure the operating system to assign home directories to all new local interactive users by setting the "CREATE_HOME" parameter in "/etc/login.defs" to "yes" as follows.

      CREATE_HOME yes
  - id: "STIG-RHEL-07-020620-homedirs_exists"
    name: "Must be configured so that all local interactive users have a home directory assigned and defined in the /etc/passwd file."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020620, V-204467, SV-204467r991589_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      for user in `awk -F: '($3>=1000)&&($7 !~ /nologin/){print $6}' /etc/passwd`; do if [ `stat -c %F $user` != 'directory' ]; then echo $user Directory_missing; fi; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-48f6f2d931 |
      If local interactive users are not assigned a valid home directory, there is no place for the storage and control of files they should own.

      In addition, if a local interactive user has a home directory defined that does not exist, the user may be given access to the / directory as the current working directory upon logon. This could create a Denial of Service because the user would not be able to access their logon configuration files, and it may give them visibility to system files they normally would not be able to access.
    remediation: &rem-ca99b1d0d9 |
      Create home directories to all local interactive users that currently do not have a home directory assigned. Use the following commands to create the user home directory assigned in "/etc/ passwd":

      Note: The example will be for the user smithj, who has a home directory of "/home/smithj", a UID of "smithj", and a Group Identifier (GID) of "users" assigned in "/etc/passwd".

      # mkdir /home/smithj
      # chown smithj /home/smithj
      # chgrp users /home/smithj
      # chmod 0750 /home/smithj
  - id: "STIG-RHEL-07-020630-homedirs_perms"
    name: "Must be configured so that all local interactive user home directories have mode 0750 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020630, V-204468, SV-204468r603828_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      for i in `getent passwd {1000..60000} |  awk '{split($0,a,":");print a[6]}'`; do stat -c "%a %n" $i ; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 7[0,5]0\\s" }
    rationale: &rat-c8d6f7441c |
      Excessive permissions on local interactive user home directories may allow unauthorized access to user files by other users.
    remediation: &rem-3fcb58f386 |
      Change the mode of interactive user's home directories to "0750". To change the mode of a local interactive user's home directory, use the following command:

      Note: The example will be for the user "smithj".

      # chmod 0750 /home/smithj
  - id: "STIG-RHEL-07-020640-user_homedirs"
    name: "Must be configured so that all local interactive user home directories are owned by their respective users."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020640, V-204469, SV-204469r603830_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      getent passwd {1000..60000} |  awk -F: '{ print $1  " "  $6 }' | while read user dir; do if [ $user != 'ftpd' ]; then owner=$(stat -L -c "%U" "$dir"); if [ "$owner" != "$user" ]; then echo "home dir for $user owned by $owner"; fi; fi; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-764b3ea5bb |
      If a local interactive user does not own their home directory, unauthorized users could access or modify the user's files, and the users may not be able to access their own files.
    remediation: &rem-455c25949b |
      Change the owner of a local interactive user's home directories to that owner. To change the owner of a local interactive user's home directory, use the following command:

      Note: The example will be for the user smithj, who has a home directory of "/home/smithj".

      # chown smithj /home/smithj
  - id: "STIG-RHEL-07-020650-group_homedirs"
    name: "Must be configured so that all local interactive user home directories are group-owned by the home directory owners primary group."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020650, V-204470, SV-204470r880764_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      find /home -maxdepth 1 -type d  -exec stat -c '%U %G' {} \; | while IFS=" " read -r user group; do if [ `id -gn $user` != $group ]; then echo Incorrect $user $group home dir; else echo home_group_ok;fi; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ home_group_ok" }
      - { none: "~ ^Incorrect" }
    rationale: &rat-e346ac8dd9 |
      If the Group Identifier (GID) of a local interactive user's home directory is not the same as the primary GID of the user, this would allow unauthorized access to the user's files, and users that share the same group may not be able to access files that they legitimately should.
    remediation: &rem-7d6c964775 |
      Change the group owner of a local interactive user's home directory to the group found in "/etc/passwd". To change the group owner of a local interactive user's home directory, use the following command:

      Note: The example will be for the user "smithj", who has a home directory of "/home/smithj", and has a primary group of users.

           # chgrp users /home/smithj
  - id: "STIG-RHEL-07-020660-home_files_owner"
    name: "The Red Hat Enterprise Linux operating system must be configured so that all files and directories contained in local interactive user home directories have a valid owner."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020660, V-204471, SV-204471r744105_rule, CAT II. CCI-000366."
