  - id: "STIG-RHEL-07-010250-login_defs_pass_max_defs"
    name: "Must be configured so that passwords for new users are restricted to a 60-day maximum lifetime."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010250, V-204420, SV-204420r603261_rule, CAT II. CCI-000199."
