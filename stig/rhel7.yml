           # chmod 0740 /home/smithj/.[^.]*
  - id: "STIG-RHEL-07-020720-home_init_files"
    name: "Must be configured so that all local interactive user initialization files executable search paths contain only paths that resolve to the users home directory."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020720, V-204477, SV-204477r792828_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      for i in `find /home/*/.*/ -maxdepth 1 -type f -print|xargs file|grep ASCII|cut -d: -f1` ; do grep ^PATH $i | grep -v 'PATH=$PATH:$HOME/.local/bin:$HOME/bin$' ; done
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-17a43ea76c |
      The executable search path (typically the PATH environment variable) contains a list of directories for the shell to search to find executables. If this path includes the current working directory (other than the user's home directory), executables in these directories may be executed instead of system commands. This variable is formatted as a colon-separated list of directories. If there is an empty entry, such as a leading or trailing colon or two consecutive colons, this is interpreted as the current working directory. If deviations from the default system search path for the local interactive user are required, they must be documented with the Information System Security Officer (ISSO).
    remediation: &rem-3362aa4c7b |
      Edit the local interactive user initialization files to change any PATH variable statements that reference directories other than their home directory.

      If a local interactive user requires path variables to reference a directory owned by the application, it must be documented with the ISSO.
  - id: "STIG-RHEL-07-020730-worldwriteable_files"
    name: "Must be configured so that local initialization files do not execute world-writable programs"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020730, V-204478, SV-204478r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      find / -xdev -perm -002 -type f -exec ls -ld {} \;
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-0a83a191c6 |
      If user start-up files execute world-writable programs, especially in unprotected directories, they could be maliciously modified to destroy user files or otherwise compromise the system at the user level. If the system is compromised at the user level, it is easier to elevate privileges to eventually compromise the system at the root and network level.
    remediation: &rem-28599ac922 |
      Set the mode on files being executed by the local initialization files with the following command:

      # chmod 0755 <file>
  - id: "STIG-RHEL-07-020900-dev_file_perms_1"
    name: "Must be configured so that all system device files are correctly labeled to prevent unauthorized modification."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020900, V-204479, SV-204479r603261_rule, CAT II. CCI-000368, CCI-001813, CCI-001814, CCI-001812, CCI-000318."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      find /dev -context *:device_t:* \( -type c -o -type b \) -printf "%p %Z\n"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-e158bac301 |
      If an unauthorized or modified device is allowed to exist on the system, there is the possibility the system may perform unintended or unauthorized operations.
    remediation: &rem-5f530d1555 |
      Run the following command to determine which package owns the device file:

      # rpm -qf <filename>

      The package can be reinstalled from a yum repository using the command:

      # sudo yum reinstall <packagename>

      Alternatively, the package can be reinstalled from trusted media using the command:

      # sudo rpm -Uvh <packagename>
  - id: "STIG-RHEL-07-020900-dev_file_perms_2"
    name: "Must be configured so that all system device files are correctly labeled to prevent unauthorized modification."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020900, V-204479, SV-204479r603261_rule, CAT II. CCI-000368, CCI-001813, CCI-001814, CCI-001812, CCI-000318."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      find /dev -context *:unlabeled_t:* \( -type c -o -type b \) -printf "%p %Z\n"
