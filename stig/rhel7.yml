           net.ipv4.icmp_echo_ignore_broadcasts = 1

      Issue the following command to make the changes take effect:

           # sysctl --system
  - id: "STIG-RHEL-07-040640-net.ipv4.conf.default.accept_redirects"
    name: "Must prevent Internet Protocol version 4 (IPv4) Internet Control Message Protocol (ICMP) redirect messages from being accepted."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040640, V-204614, SV-204614r880812_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.default.accept_redirects
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-1c77eb3372 |
      ICMP redirect messages are used by routers to inform hosts that a more direct route exists for a particular destination. These messages modify the host's route table and are unauthenticated. An illicit ICMP redirect message could result in a man-in-the-middle attack.
    remediation: &rem-0eedfe9d4a |
      Set the system to not accept IPv4 ICMP redirect messages by adding the following line to "/etc/sysctl.conf" or a configuration file in the /etc/sysctl.d/ directory (or modify the line to have the required value):

           net.ipv4.conf.default.accept_redirects = 0

      Issue the following command to make the changes take effect:

           # sysctl --system
