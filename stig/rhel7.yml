  - id: "STIG-RHEL-07-040630-net.ipv4.icmp_echo_ignore_broadcasts"
    name: "Must not respond to Internet Protocol version 4 (IPv4) Internet Control Message Protocol (ICMP) echoes sent to a broadcast address."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040630, V-204613, SV-204613r880809_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv4.icmp_echo_ignore_broadcasts
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
