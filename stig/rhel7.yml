  - id: "STIG-RHEL-07-030630-password_auditd_rules"
    name: "The Red Hat Enterprise Linux operating system must audit all uses of the passwd command. (config)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030630, V-204542, SV-204542r833121_rule, CAT II. CCI-000172, CCI-000135, CCI-002884."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i semanage /etc/audit/rules.d/99_auditd.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^-a always,exit -F path=/usr/sbin/passwd -F auid\u003e=1000 -F auid!=(4294967295|unset) -k privileged-passwd" }
    rationale: &rat-3e45092b87 |
      Reconstruction of harmful events or forensic analysis is not possible if audit records do not contain enough information.

      At a minimum, the organization must audit the full-text recording of privileged password commands. The organization must maintain audit trails in sufficient detail to reconstruct events to determine the cause and impact of compromise.

      When a user logs on, the auid is set to the uid of the account that is being authenticated. Daemons are not user sessions and have the loginuid set to -1. The auid representation is an unsigned 32-bit integer, which equals 4294967295. The audit system interprets -1, 4294967295, and "unset" in the same way.
    remediation: &rem-e2a45ddbee |
      Configure the operating system to generate audit records when successful/unsuccessful attempts to use the "passwd" command occur.

      Add or update the following rule in "/etc/audit/rules.d/audit.rules":

      -a always,exit -F path=/usr/bin/passwd -F perm=x -F auid>=1000 -F auid!=unset -k privileged-passwd

      The audit daemon must be restarted for the changes to take effect.
