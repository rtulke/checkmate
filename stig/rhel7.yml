      - { none: "~ ^install usb-storage /bin/true" }
    rationale: *rat-0e5f4c06fb
    remediation: *rem-defa61ba1b
  - id: "STIG-RHEL-07-020100-usb_storage_blacklist"
    name: "Must be configured to disable USB mass storage."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020100, V-204449, SV-204449r942894_rule, CAT II. CCI-001958, CCI-000778, CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
