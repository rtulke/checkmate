    remediation: *rem-afaefde1d4
  - id: "STIG-RHEL-07-040100-firewall_services"
    name: "Must be configured to prohibit or restrict the use of functions, ports, protocols, and/or services, as defined in the Ports, Protocols, and Services Management Component Local Service Assessment (PPSM CLSA) and vulnerability assessments."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040100, V-204577, SV-204577r603261_rule, CAT II. CCI-000382, CCI-002314."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      echo "Manual Check Required"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Manual Check Required" }
    rationale: &rat-013fd232c7 |
      In order to prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized tunneling (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary physical and logical ports/protocols on information systems.

      Operating systems are capable of providing a wide variety of functions and services. Some of the functions and services provided by default may not be necessary to support essential organizational operations. Additionally, it is sometimes convenient to provide multiple services from a single component (e.g., VPN and IPS); however, doing so increases risk over limiting the services provided by any one component.

      To support the requirements and principles of least functionality, the operating system must support the organizational requirements, providing only essential capabilities and limiting the use of ports, protocols, and/or services to only those required, authorized, and approved to conduct official business or to address authorized quality of life issues.
    remediation: &rem-c6d92c317f |
      Update the host's firewall settings and/or running services to comply with the PPSM CLSA for the site or program and the PPSM CAL.
  - id: "STIG-RHEL-07-040110-ciphers_sshd_config_dod"
    name: "must implement DoD-approved encryption to protect the confidentiality of SSH connections."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040110, V-204578, SV-204578r744116_rule, CAT II. CCI-000366, CCI-000803, CCI-000068."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i ciphers /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Ciphers aes256-ctr,aes192-ctr,aes128-ctr" }
    rationale: &rat-b9c31a778f |
      Unapproved mechanisms that are used for authentication to the cryptographic module are not verified and therefore cannot be relied upon to provide confidentiality or integrity, and DoD data may be compromised.

      Operating systems utilizing encryption are required to use FIPS-compliant mechanisms for authenticating to cryptographic modules.

      FIPS 140-2 is the current standard for validating that mechanisms used to access cryptographic modules utilize authentication that meets DoD requirements. This allows for Security Levels 1, 2, 3, or 4 for use on a general purpose computing system.

      The system will attempt to use the first cipher presented by the client that matches the server list. Listing the values "strongest to weakest" is a method to ensure the use of the strongest cipher available to secure the SSH connection.
    remediation: &rem-528b030744 |
      Configure SSH to use FIPS 140-2 approved cryptographic algorithms.

      Add the following line (or modify the line to have the required value) to the "/etc/ssh/sshd_config" file (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor).

      Ciphers aes256-ctr,aes192-ctr,aes128-ctr

      The SSH service must be restarted for changes to take effect.
  - id: "STIG-RHEL-07-040160-session_timeout"
    name: "Must be configured so that all network connections associated with a communication session are terminated at the end of the session or after 15 minutes of inactivity from the user at a command prompt, except to fulfill documented and validated mission requirements."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040160, V-204579, SV-204579r861070_rule, CAT II. CCI-001133, CCI-002361."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i tmout /etc/profile.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ \\/etc\\/profile.d\\/.*:declare -xr TMOUT=600" }
      - { none: "~ ^[^#] TMOUT=" }
      - { some: "~ TMOUT=([1-8][0-9]{0,2}|900)" }
    rationale: &rat-46eb095c07 |
      Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel to take control of a management session enabled on the console or console port that has been left unattended. In addition, quickly terminating an idle session will also free up resources committed by the managed network element.

      Terminating network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port pairs at the operating system level and de-allocating networking assignments at the application level if multiple application sessions are using a single operating system-level network connection. This does not mean that the operating system terminates all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
    remediation: &rem-3c7b52f96a |
      Configure the operating system to terminate all network connections associated with a communications session at the end of the session or after a period of inactivity.

      Create a script to enforce the inactivity timeout (for example /etc/profile.d/tmout.sh) such as:

      #!/bin/bash

      declare -xr TMOUT=900
  - id: "STIG-RHEL-07-040170-banner_shd_config"
    name: "Must display the Standard Mandatory DoD Notice and Consent Banner immediately prior to, or as part of, remote access logon prompts."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040170, V-204580, SV-204580r603261_rule, CAT II. CCI-001384, CCI-001385, CCI-001386, CCI-001387, CCI-001388, CCI-000048, CCI-000050."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i banner /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(?i)banner /etc/issue" }
      - { none: "~ ^(?i)#banner*" }
    rationale: &rat-3528224287 |
      Display of a standardized and approved use notification before granting access to the publicly accessible operating system ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies, regulations, standards, and guidance.

      System use notifications are required only for access via logon interfaces with human users and are not required when such human interfaces do not exist.

      The banner must be formatted in accordance with applicable DoD policy. Use the following verbiage for operating systems that can accommodate banners of 1300 characters:

      "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.

      By using this IS (which includes any device attached to this IS), you consent to the following conditions:

      -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.

      -At any time, the USG may inspect and seize data stored on this IS.

      -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.

      -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.

      -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details."
    remediation: &rem-6034f3c4df |
      Configure the operating system to display the Standard Mandatory DoD Notice and Consent Banner before granting access to the system via the ssh.

      Edit the "/etc/ssh/sshd_config" file to uncomment the banner keyword and configure it to point to a file that will contain the logon banner (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor). An example configuration line is:

      banner /etc/issue

      Either create the file containing the banner or replace the text in the file with the Standard Mandatory DoD Notice and Consent Banner. The DoD required text is:

      "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.

      By using this IS (which includes any device attached to this IS), you consent to the following conditions:

      -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.

      -At any time, the USG may inspect and seize data stored on this IS.

      -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.

      -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.

      -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details."

      The SSH service must be restarted for changes to take effect.
