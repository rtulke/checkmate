  - id: "STIG-RHEL-07-010230-login_defs_pass_min_days"
    name: "Must be configured so that passwords for new users are restricted to a 24 hours/1 day minimum lifetime."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010230, V-204418, SV-204418r603261_rule, CAT II. CCI-000198."
