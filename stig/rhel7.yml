      - { none: "~ ." }
    rationale: *rat-e158bac301
    remediation: *rem-5f530d1555
  - id: "STIG-RHEL-07-021000-home"
    name: "Must be configured so that file systems containing user home directories are mounted to prevent files with the setuid and setgid bit set from being executed. (Running)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021000, V-204480, SV-204480r603838_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/home'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nosuid(,|$)"
    rationale: &rat-1ecc4766e1 |
      The "nosuid" mount option causes the system to not execute setuid and setgid files with owner privileges. This option must be used for mounting any file system not containing approved setuid and setguid files. Executing files from untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative access.
    remediation: &rem-3e80ef3015 |
      Configure the "/etc/fstab" to use the "nosuid" option on file systems that contain user home directories.
  - id: "STIG-RHEL-07-021000-home_fstab"
    name: "Must be configured so that file systems containing user home directories are mounted to prevent files with the setuid and setgid bit set from being executed. (fstab config)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021000, V-204480, SV-204480r603838_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -w /home /etc/fstab
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (.*\\/home.*nosuid)" }
    rationale: *rat-1ecc4766e1
    remediation: *rem-3e80ef3015
  - id: "STIG-RHEL-07-021010-check_mnt_fstab_nosuid"
    name: "Must prevent files with the setuid and setgid bit set from being executed on file systems that are used with removable media."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021010, V-204481, SV-204481r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      MNT=`grep -Ec "^[^#].*(mnt|mount|media|usb)" /etc/fstab` && NOSUID=`grep -E "^[^#].*(mnt|mount|media|usb)" /etc/fstab | grep -c nosuid`; if [ $MNT != $NOSUID ]; then echo "Removable mounts without nosuid found"; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-17c6134ff0 |
      The "nosuid" mount option causes the system to not execute "setuid" and "setgid" files with owner privileges. This option must be used for mounting any file system not containing approved "setuid" and "setguid" files. Executing files from untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative access.
    remediation: &rem-849c1b0bb0 |
      Configure the "/etc/fstab" to use the "nosuid" option on file systems that are associated with removable media.
  - id: "STIG-RHEL-07-021020-nfs_nosuid"
    name: "Must prevent files with the setuid and setgid bit set from being executed on file systems that are being imported via Network File System (NFS)."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021020, V-204482, SV-204481r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      mount | grep "nfs" | grep -v nosuid
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: *rat-17c6134ff0
    remediation: &rem-48e9e9e42c |
      Configure the "/etc/fstab" to use the "nosuid" option on file systems that are being imported via NFS.
  - id: "STIG-RHEL-07-021021-nfs_noexec"
    name: "Must prevent binary files from being executed on file systems that are being imported via Network File System (NFS)."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021021, V-204483, SV-204483r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      mount | grep "nfs" | grep -v noexec
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-9ca3c463d5 |
      The "noexec" mount option causes the system to not execute binary files. This option must be used for mounting any file system not containing approved binary files as they may be incompatible. Executing files from untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative access.
    remediation: &rem-bf26d97f56 |
      Configure the "/etc/fstab" to use the "noexec" option on file systems that are being imported via NFS.
  - id: "STIG-RHEL-07-021030-ww_dirs_group_owned"
    name: "Must be configured so that all world-writable directories are group-owned by root, sys, bin, or an application group."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021030, V-204487, SV-204487r744106_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      find `df --local -P | awk {'if (NR!=1) print $6'}` -xdev -type d -perm -0002 -gid +999 -print
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-8e79c489f2 |
      If a world-writable directory is not group-owned by root, sys, bin, or an application Group Identifier (GID), unauthorized users may be able to modify files created by others.

      The only authorized public directories are those temporary directories supplied with the system or those designed to be temporary file repositories. The setting is normally reserved for directories used by the system and by users for temporary file storage, (e.g., /tmp), and for directories requiring global read/write access.
    remediation: &rem-d20a303cbe |
      All directories in local partitions which are world-writable should be group-owned by root or another system account. If any world-writable directories are not group-owned by a system account, this should be investigated. Following this, the directories should be deleted or assigned to an appropriate group.
  - id: "STIG-RHEL-07-021031-ww_dirs_root_owned"
    name: "Must be configured so that all world-writable directories are owned by root, sys, bin, or an application user."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021031, V-228563, SV-228563r744119_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      find `df --local -P | awk {'if (NR!=1) print $6'}` -xdev -type d -perm -0002 -gid +999 -print
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-919d46ba31 |
      If a world-writable directory is not owned by root, sys, bin, or an application User Identifier (UID), unauthorized users may be able to modify files created by others.

      The only authorized public directories are those temporary directories supplied with the system or those designed to be temporary file repositories. The setting is normally reserved for directories used by the system and by users for temporary file storage, (e.g., /tmp), and for directories requiring global read/write access.
    remediation: &rem-4f6f4d3c87 |
      All directories in local partitions which are world-writable should be owned by root or another system account. If any world-writable directories are not owned by a system account, this should be investigated. Following this, the files should be deleted or assigned to an appropriate group.
  - id: "STIG-RHEL-07-021040-home_dir_umask"
    name: "The Red Hat Enterprise Linux operating system must set the umask value to 077 for all local interactive user accounts"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021040, V-204488, SV-204488r861006_rule, CAT II. CCI-000318, CCI-000368, CCI-001813, CCI-001814, CCI-001812."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i 'umask [0:7][0:7][0:7]' /home/*/.* 2> /dev/null
    allow_rc: any
    expect:
      - { rc: "== 2" }
      - { none: "~ ." }
      - { none: "~ umask [0:2][0:2][0:2]" }
    rationale: &rat-9dd62b6d02 |
      The umask controls the default access mode assigned to newly created files. A umask of 077 limits new files to mode 700 or less permissive. Although umask can be represented as a four-digit number, the first digit representing special access modes is typically ignored or required to be "0". This requirement applies to the globally configured system defaults and the local interactive user defaults for each account on the system.
    remediation: &rem-2ecbdef71f |
      Remove the umask statement from all local interactive user's initialization files.

      If the account is for an application, the requirement for a umask less restrictive than "077" can be documented with the Information System Security Officer, but the user agreement for access to the account must specify that the local interactive user must log on to their account first and then switch the user to the application account with the correct option to gain the account's environment variables.
  - id: "STIG-RHEL-07-021100-cron_syslog"
    name: "must have cron logging implemented."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021100, V-204489, SV-204489r744109_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep  "cron.* /var/log/cron" /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*:cron.\\*\\s+/var/log/cron" }
    rationale: &rat-20a9cd9810 |
      Cron logging can be used to trace the successful or unsuccessful execution of cron jobs. It can also be used to spot intrusions into the use of the cron facility by unauthorized and malicious users.
    remediation: &rem-0fed695521 |
      Configure "rsyslog" to log all cron messages by adding or updating the following line to "/etc/rsyslog.conf" or a configuration file in the /etc/rsyslog.d/ directory:

      cron.* /var/log/cron

      The rsyslog daemon must be restarted for the changes to take effect:
      $ sudo systemctl restart rsyslog.service
  - id: "STIG-RHEL-07-021110-cron.allow"
    name: "Must be configured so that the cron.allow file, if it exists, is owned by root. \nRHEL-07-021120 (Must be configured so that the cron.allow file, if it exists, is grou…)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021110, V-204490, SV-204490r991589_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      if [ -f /etc/cron.allow ]; then stat -c "%G %U" /etc/.cron.allow; else echo 'No File'; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (root root|No File)" }
    rationale: &rat-a350c41f9e |
      If the owner of the "cron.allow" file is not set to root, the possibility exists for an unauthorized user to view or to edit sensitive information.
    remediation: &rem-3e94435c5f |
      Set the owner on the "/etc/cron.allow" file to root with the following command:

      # chown root /etc/cron.allow
  - id: "STIG-RHEL-07-021300-kdump-enabled"
    name: "Must disable Kernel core dumps unless needed. (Service kdump is not enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021300, V-204492, SV-204492r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState kdump | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-7b1d43b72c |
      Kernel core dumps may contain the full contents of system memory at the time of the crash. Kernel core dumps may consume a considerable amount of disk space and may result in denial of service by exhausting the available space on the target file system partition.
    remediation: &rem-b9ada3893b |
      If kernel core dumps are not required, disable the "kdump" service with the following command:

      # systemctl disable kdump.service

      If kernel core dumps are required, document the need with the ISSO.
  - id: "STIG-RHEL-07-021300-kdump-running"
    name: "Must disable Kernel core dumps unless needed. (Service kdump is not running)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021300, V-204492, SV-204492r603261_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState kdump | cut -d= -f2
    expect: "!= active"
    rationale: *rat-7b1d43b72c
    remediation: *rem-b9ada3893b
  - id: "STIG-RHEL-07-021620-aide_fips"
    name: "Must use a file integrity tool that is configured to use FIPS 140-2 approved cryptographic hashes for validating file contents and directories."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021620, V-204500, SV-204500r991589_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet aide
    expect: true
    rationale: &rat-105b036338 |
      File integrity tools use cryptographic hashes for verifying file contents and directories have not been altered. These hashes must be FIPS 140-2 approved cryptographic hashes.

      Red Hat Enterprise Linux operating system installation media ships with an optional file integrity tool called Advanced Intrusion Detection Environment (AIDE). AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file is under the "/etc" directory.
    remediation: &rem-3e3d9138c5 |
      Configure the file integrity tool to use FIPS 140-2 cryptographic hashes for validating file and directory contents.

      If AIDE is installed, ensure the "sha512" rule is present on all uncommented file and directory selection lists. Exclude any log files, or files expected to change frequently, to reduce unnecessary notifications.
  - id: "STIG-RHEL-07-021620-sha512_aide_conf"
    name: "Must use a file integrity tool that is configured to use FIPS 140-2 approved cryptographic hashes for validating file contents and directories."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021620, V-204500, SV-204500r991589_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -Ei "sha512|content_ex" /etc/aide.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^FIPSR = p\\+i\\+n\\+u\\+g\\+s\\+m\\+S\\+acl\\+selinux\\+xattrs\\+sha512" }
      - { some: "~ ^CONTENT_EX = FIPSR" }
      - { some: "~ ^\\/bin/\\s+CONTENT_EX" }
      - { some: "~ \\/sbin/\\s+CONTENT_EX" }
      - { some: "~ ^[^#].*\\+sha512.*$" }
    rationale: *rat-105b036338
    remediation: *rem-3e3d9138c5
  - id: "STIG-RHEL-07-030000-auditd-enabled"
    name: "must be configured so that auditing is configured to produce records containing information to establish what type of events occurred, where the events occurred, the source of the events, and the outcome of the events. These audit records must also identify individual identities of group account users. (Service auditd is enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030000, V-204503, SV-204503r603261_rule, CAT II. CCI-000126, CCI-000131."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState auditd | cut -d= -f2
    expect: "~ ^enabled"
    rationale: &rat-9bd9813920 |
      Without establishing what type of events occurred, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack.

      Audit record content that may be necessary to satisfy this requirement includes, for example, time stamps, source and destination addresses, user/process identifiers, event descriptions, success/fail indications, filenames involved, and access control or flow control rules invoked.

      Associating event types with detected events in the operating system audit logs provides a means of investigating an attack; recognizing resource utilization or capacity thresholds; or identifying an improperly configured operating system.
    remediation: &rem-e0b5841314 |
      Configure the operating system to produce audit records containing information to establish when (date and time) the events occurred.

      Enable the auditd service with the following command:

      # systemctl start auditd.service
  - id: "STIG-RHEL-07-030000-auditd-running"
    name: "must be configured so that auditing is configured to produce records containing information to establish what type of events occurred, where the events occurred, the source of the events, and the outcome of the events. These audit records must also identify individual identities of group account users. (Service auditd is running)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030000, V-204503, SV-204503r603261_rule, CAT II. CCI-000126, CCI-000131."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState auditd | cut -d= -f2
    expect: "== active"
    rationale: *rat-9bd9813920
    remediation: *rem-e0b5841314
  - id: "STIG-RHEL-07-030010-auditctl_fips"
    name: "must shut down upon audit processing failure, unless availability is an overriding concern. If availability is a concern, the system must alert the designated staff (System Administrator [SA] and Information System Security Officer [ISSO] at a minimum) in the event of an audit processing failure."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030010, V-204504, SV-204504r603261_rule, CAT II. CCI-000139."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      auditctl -s | grep fail
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^failure [1-2]" }
    rationale: &rat-9132161237 |
      It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs as required. Without this notification, the security personnel may be unaware of an impending failure of the audit capability, and system operation may be adversely affected.

      Audit processing failures include software/hardware errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded.

      This requirement applies to each audit data storage repository (i.e., distinct information system component where audit records are stored), the centralized audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both.
    remediation: &rem-8d9d56cbe6 |
      Configure the operating system to shut down in the event of an audit processing failure.

      Add or correct the option to shut down the operating system with the following command:

           # auditctl -f 2

      Edit the "/etc/audit/rules.d/audit.rules" file and add the following line:

           -f 2

      If availability has been determined to be more important, and this decision is documented with the ISSO, configure the operating system to notify system administration staff and ISSO staff in the event of an audit processing failure with the following command:

           # auditctl -f 1

      Edit the "/etc/audit/rules.d/audit.rules" file and add the following line:

           -f 1

      Kernel log monitoring must also be configured to properly alert designated staff.

      The audit daemon must be restarted for the changes to take effect.
  - id: "STIG-RHEL-07-030201-etc_audisp_plugins.d_au-remote.conf-attrs"
    name: "Must be configured to off-load audit logs onto a different system or storage media from the system being audited. (/etc/audisp/plugins.d/au-remote.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030201, V-204506, SV-204506r861009_rule, CAT II. CCI-001851."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audisp/plugins.d/au-remote.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-76bdd694c1 |
      Information stored in one location is vulnerable to accidental or incidental deletion or alteration.

      Off-loading is a common process in information systems with limited audit storage capacity.

      One method of off-loading audit logs in Red Hat Enterprise Linux is with the use of the audisp-remote dameon.  Without the configuration of the "au-remote" plugin, the audisp-remote daemon will not off load the logs from the system being audited.
    remediation: &rem-4ef54aa28e |
      Edit the /etc/audisp/plugins.d/au-remote.conf file and add or update the following values:

      active = yes
      direction = out
      path = /sbin/audisp-remote
      type = always

      The audit daemon must be restarted for changes to take effect:

      # service auditd restart
  - id: "STIG-RHEL-07-030201-etc_audisp_plugins.d_au-remote.conf-content"
    name: "Must be configured to off-load audit logs onto a different system or storage media from the system being audited. (/etc/audisp/plugins.d/au-remote.conf has the expected content (5 rule…)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030201, V-204506, SV-204506r861009_rule, CAT II. CCI-001851."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/audisp/plugins.d/au-remote.conf'
    allow_rc: any
    expect:
      - { some: "~ ^active = yes" }
      - { some: "~ ^direction = out" }
      - { some: "~ ^path = /sbin/audisp-remote" }
      - { some: "~ ^type = always" }
      - { some: "~ ^format = string" }
    rationale: *rat-76bdd694c1
    remediation: *rem-4ef54aa28e
  - id: "STIG-RHEL-07-030210-overflow_action_audispd_conf"
    name: "Must take appropriate action when the remote logging buffer is full."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030210, V-204507, SV-204507r603261_rule, CAT II. CCI-001851."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep overflow_action /etc/audisp/audispd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^overflow_action = syslog" }
    rationale: &rat-31ba745430 |
      Information stored in one location is vulnerable to accidental or incidental deletion or alteration.

      Off-loading is a common process in information systems with limited audit storage capacity.

      One method of off-loading audit logs in Red Hat Enterprise Linux is with the use of the audisp-remote dameon.  When the remote buffer is full, audit logs will not be collected and sent to the central log server.
    remediation: &rem-ba5ec28eba |
      Edit the /etc/audisp/audispd.conf file and add or update the "overflow_action" option:

      overflow_action = syslog

      The audit daemon must be restarted for changes to take effect:

      # service auditd restart
  - id: "STIG-RHEL-07-030211-name_format_audispd_conf"
    name: "Must label all off-loaded audit logs before sending them to the central log server."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030211, V-204508, SV-204508r603261_rule, CAT II. CCI-001851."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep name_format /etc/audisp/audispd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^name_format = (hostname|fqdn|numeric)" }
    rationale: &rat-998c9d8d23 |
      Information stored in one location is vulnerable to accidental or incidental deletion or alteration.

      Off-loading is a common process in information systems with limited audit storage capacity.

      One method of off-loading audit logs in Red Hat Enterprise Linux is with the use of the audisp-remote dameon.  When audit logs are not labeled before they are sent to a central log server, the audit data will not be able to be analyzed and tied back to the correct system.
    remediation: &rem-352cfe7677 |
      Edit the /etc/audisp/audispd.conf file and add or update the "name_format" option:

      name_format = hostname

      The audit daemon must be restarted for changes to take effect:

      # service auditd restart
  - id: "STIG-RHEL-07-030300-server_audisp_remote"
    name: "Must off-load audit records onto a different system or media from the system being audited."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030300, V-204509, SV-204509r603261_rule, CAT II. CCI-001851."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep remote_server /etc/audisp/audisp-remote.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^remote_server = 10.10.10.10" }
    rationale: &rat-ab23497f3c |
      Information stored in one location is vulnerable to accidental or incidental deletion or alteration.

      Off-loading is a common process in information systems with limited audit storage capacity.
    remediation: &rem-af1e7538f9 |
      Configure the operating system to off-load audit records onto a different system or media from the system being audited.

      Set the remote server option in "/etc/audisp/audisp-remote.conf" with the IP address of the log aggregation server.
  - id: "STIG-RHEL-07-030310-krb5_audisp_remote"
    name: "Must encrypt the transfer of audit records off-loaded onto a different system or media from the system being audited."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030310, V-204510, SV-204510r603261_rule, CAT II. CCI-001851."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep enable_krb5 /etc/audisp/audisp-remote.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^enable_krb5 = yes" }
      - { none: "~ ^enable_krb5*(no|false)" }
    rationale: *rat-ab23497f3c
    remediation: &rem-0b9b2a3796 |
      Configure the operating system to encrypt the transfer of off-loaded audit records onto a different system or media from the system being audited.

      Uncomment the "enable_krb5" option in "/etc/audisp/audisp-remote.conf" and set it with the following line:

      enable_krb5 = yes
  - id: "STIG-RHEL-07-030320-disk_full_audisp_remote"
    name: "Must be configured so that the audit system takes appropriate action when the audit storage volume is full."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030320, V-204511, SV-204511r603261_rule, CAT II. CCI-001851."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep disk_full_action /etc/audisp/audisp-remote.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^disk_full_action = syslog" }
      - { some: "~ ^disk_full_action = (single|syslog|halt)" }
    rationale: &rat-ecb86e2ce5 |
      Taking appropriate action in case of a filled audit storage volume will minimize the possibility of losing audit records.
      One method of off-loading audit logs in Red Hat Enterprise Linux is with the use of the audisp-remote dameon.
    remediation: &rem-fe8dad02ac |
      Configure the action the operating system takes if the disk the audit records are written to becomes full.

      Uncomment or edit the "disk_full_action" option in "/etc/audisp/audisp-remote.conf" and set it to "syslog", "single", or "halt", such as the following line:

      disk_full_action = single
  - id: "STIG-RHEL-07-030321-network_fail_audisp_remote"
    name: "Must be configured so that the audit system takes appropriate action when there is an error sending audit records to a remote system."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030321, V-204512, SV-204512r603261_rule, CAT II. CCI-001851."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i network_failure /etc/audisp/audisp-remote.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^network_failure_action = syslog" }
      - { some: "~ ^network_failure_action = (syslog|single|halt)" }
    rationale: &rat-d1b3b5e9a3 |
      Taking appropriate action when there is an error sending audit records to a remote system will minimize the possibility of losing audit records.
      One method of off-loading audit logs in Red Hat Enterprise Linux is with the use of the audisp-remote dameon.
    remediation: &rem-710136db18 |
      Configure the action the operating system takes if there is an error sending audit records to a remote system.

      Uncomment the "network_failure_action" option in "/etc/audisp/audisp-remote.conf" and set it to "syslog", "single", or "halt".

      network_failure_action = syslog
  - id: "STIG-RHEL-07-030330-space_left_auditd_conf"
    name: "Must initiate an action to notify the System Administrator (SA) and Information System Security Officer ISSO, at a minimum, when allocated audit record storage volume reaches 75% of the repository maximum audit record storage capacity"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030330, V-204513, SV-204513r744112_rule, CAT II. CCI-001855."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i space_left /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^space_left = 25%" }
      - { none: "~ ^space_left = ([1-9]|1[0-9]|2[0-4])%$" }
    rationale: &rat-2ba573c91a |
      If security personnel are not notified immediately when storage volume reaches 75 percent utilization, they are unable to plan for audit record storage capacity expansion.
    remediation: &rem-5e99b264a8 |
      Configure the operating system to initiate an action to notify the SA and ISSO (at a minimum) when allocated audit record storage volume reaches 75 percent of the repository maximum audit record storage capacity.

      Set the value of the "space_left" keyword in "/etc/audit/auditd.conf" to 25 percent of the partition size.
      space_left = 25%
      Reload the auditd daemon to apply changes made to the "/etc/audit/auditd.conf" file.
  - id: "STIG-RHEL-07-030340-space_left_action_audit"
    name: "Must immediately notify the System Administrator (SA) and Information System Security Officer (ISSO) (at a minimum) via email when the threshold for the repository maximum audit record storage capacity is reached."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030340, V-204514, SV-204514r603261_rule, CAT II. CCI-001855."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i space_left_action /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^space_left_action = email" }
    rationale: &rat-5af51a0db0 |
      If security personnel are not notified immediately when the threshold for the repository maximum audit record storage capacity is reached, they are unable to expand the audit record storage capacity before records are lost.
    remediation: &rem-d6747c898b |
      Configure the operating system to immediately notify the SA and ISSO (at a minimum) when the threshold for the repository maximum audit record storage capacity is reached.

      Uncomment or edit the "space_left_action" keyword in "/etc/audit/auditd.conf" and set it to "email".

      space_left_action = email
  - id: "STIG-RHEL-07-030350-action_mail_audit"
    name: "Must immediately notify the System Administrator (SA) and Information System Security Officer (ISSO) (at a minimum) when the threshold for the repository maximum audit record storage capacity is reached."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030350, V-204515, SV-204515r603261_rule, CAT II. CCI-001855."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i action_mail /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^action_mail_acct = root" }
    rationale: *rat-5af51a0db0
    remediation: &rem-b8f76c111d |
      Configure the operating system to immediately notify the SA and ISSO (at a minimum) when the threshold for the repository maximum audit record storage capacity is reached.

      Uncomment or edit the "action_mail_acct" keyword in "/etc/audit/auditd.conf" and set it to root and any other accounts associated with security personnel.

      action_mail_acct = root
  - id: "STIG-RHEL-07-030360-auditd_priv_running"
    name: "Must audit all executions of privileged functions. (running)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030360, V-204516, SV-204516r603261_rule, CAT II. CCI-002234."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      auditctl -l | grep -E "setuid|setgid"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^-a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -F key=setuid" }
      - { some: "~ ^-a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -F key=setuid" }
      - { some: "~ ^-a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -F key=setgid" }
