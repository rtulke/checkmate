    severity: medium
    timeout: 120000ms
    run: |
      find /home/ -exec stat -c '%U %G' {} \; | while IFS=" " read -r user group; do if [ `id -Gn $user | grep -c $group` != 1 ]; then echo Incorrect $user $group home files; else echo home_files_ok;fi; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ home_files_ok" }
      - { none: "~ ^Incorrect" }
    rationale: &rat-fad5add19c |
      If a local interactive user's files are group-owned by a group of which the user is not a member, unintended users may be able to access them.
    remediation: &rem-0bcec0ac04 |
      Change the group of a local interactive user's files and directories to a group that the interactive user is a member of. To change the group owner of a local interactive user's files and directories, use the following command:

      Note: The example will be for the user smithj, who has a home directory of "/home/smithj" and is a member of the users group.

      # chgrp users /home/smithj/<file>
  - id: "STIG-RHEL-07-020680-home_files"
    name: "Must be configured so that all files and directories contained in local interactive user home directories have a mode of 0750 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020680, V-204473, SV-204473r603261_rule, CAT II. CCI-000366."
