      Note: The example will be for the user smithj, who has a home directory of "/home/smithj".

      $ sudo chown smithj /home/smithj/<file or directory>
  - id: "STIG-RHEL-07-020670-group_home_files"
    name: "Must be configured so that all files and directories contained in local interactive user home directories are group-owned by a group of which the home directory owner is a member."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020670, V-204472, SV-204472r603261_rule, CAT II. CCI-000366."
