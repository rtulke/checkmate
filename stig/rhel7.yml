  - id: "STIG-RHEL-07-020690-home_init_owned"
    name: "Must be configured so that all local initialization files for interactive users are owned by the home directory user or root."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020690, V-204474, SV-204474r603834_rule, CAT II. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      find /home -maxdepth 1 -type d  -exec stat -c '%U' {} \; | grep -v root | while IFS=" " read -r user; do find /home/$user/.[^.]* -type f -exec stat -c '%a %U %G' {} \; | grep -v $user; done
