      - { some: "~ ^-a always,exit -F arch=b64 -S (unlink|unlinkat|rename|renameat|rmdir),(unlink|unlinkat|rename|renameat|rmdir),(unlink|unlinkat|rename|renameat|rmdir),(unlink|unlinkat|rename|renameat|rmdir),(unlink|unlinkat|rename|renameat|rmdir) -F auid\u003e=1000 -F auid!=(4294967295|unset) -k delete" }
