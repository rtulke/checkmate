  - id: "STIG-RHEL-07-040000-maxlogins_limits_conf"
    name: "Must limit the number of concurrent sessions to 10 for all accounts and/or account types."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040000, V-204576, SV-204576r603261_rule, CAT III. CCI-000054."
    tags: [stig, stig-rhel7, stig-cat-3]
    severity: low
    run: |
      grep maxlogins /etc/security/limits.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ \\*\\s+hard\\s+maxlogins\\s+([1-9]|10)$" }
      - { none: "~ ^#\\s+\\*\\s+hard\\s+maxlogins\\s+10" }
    rationale: &rat-f2b8d3b936 |
      Operating system management includes the ability to control the number of users and user sessions that utilize an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the risks related to DoS attacks.

      This requirement addresses concurrent sessions for information system accounts and does not address concurrent sessions by single users via multiple system accounts. The maximum number of concurrent sessions should be defined based on mission needs and the operational environment for each system.
    remediation: &rem-7bcac156fb |
      Configure the operating system to limit the number of concurrent sessions to "10" for all accounts and/or account types.

      Add the following line to the top of the /etc/security/limits.conf or in a ".conf" file defined in /etc/security/limits.d/ :

      * hard maxlogins 10
  - id: "STIG-RHEL-07-040530-session_postlogin"
    name: "Must display the date and time of the last successful account logon upon logon."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040530, V-204605, SV-204605r858478_rule, CAT III. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-3]
    severity: low
    run: |
      grep session /etc/pam.d/postlogin
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^session\\s+required pam_lastlog.so.*showfailed" }
    rationale: &rat-27984bf4ab |
      Providing users with feedback on when account accesses last occurred facilitates user recognition and reporting of unauthorized account use.
    remediation: &rem-7c9137b171 |
      Configure the operating system to provide users with feedback on when account accesses last occurred by setting the required configuration options in "/etc/pam.d/postlogin".

      Add the following line to the top of "/etc/pam.d/postlogin":

      session required pam_lastlog.so showfailed
  - id: "STIG-RHEL-07-040600-etc_resolv.conf-attrs"
    name: "Using DNS resolution, at least two name servers must be configured. (/etc/resolv.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040600, V-204608, SV-204608r603261_rule, CAT III. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-3]
    severity: low
    run: |
      f='/etc/resolv.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1b3a1af3d9 |
      To provide availability for name resolution services, multiple redundant name servers are mandated. A failure in name resolution could lead to the failure of security functions requiring name resolution, which may include time synchronization, centralized authentication, and remote system logging.
    remediation: &rem-45e8e5f396 |
      Configure the operating system to use two or more name servers for DNS resolution.

      Edit the "/etc/resolv.conf" file to uncomment or add the two or more "nameserver" option lines with the IP address of local authoritative name servers. If local host resolution is being performed, the "/etc/resolv.conf" file must be empty. An empty "/etc/resolv.conf" file can be created as follows:

      # echo -n > /etc/resolv.conf

      And then make the file immutable with the following command:

      # chattr +i /etc/resolv.conf

      If the "/etc/resolv.conf" file must be mutable, the required configuration must be documented with the Information System Security Officer (ISSO) and the file must be verified by the system file integrity tool.
  - id: "STIG-RHEL-07-040600-etc_resolv.conf-content"
    name: "Using DNS resolution, at least two name servers must be configured. (/etc/resolv.conf has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040600, V-204608, SV-204608r603261_rule, CAT III. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-3]
    severity: low
    run: |
      cat '/etc/resolv.conf'
    allow_rc: any
    expect:
      - { some: "~ nameserver 10\\.0\\.2\\.3" }
      - { some: "~ nameserver 9\\.9\\.9\\.9" }
    rationale: *rat-1b3a1af3d9
    remediation: *rem-45e8e5f396
