  - id: "STIG-RHEL-07-030910-audit_unlink_running"
    name: "Must audit all uses of the unlink syscall. (running)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030910, V-204572, SV-204572r603261_rule, CAT II. CCI-000172, CCI-002884."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      auditctl -l | grep -w "unlink"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^-a always,exit -F arch=b32 -S (unlink|unlinkat|rename|renameat|rmdir),(unlink|unlinkat|rename|renameat|rmdir),(unlink|unlinkat|rename|renameat|rmdir),(unlink|unlinkat|rename|renameat|rmdir),(unlink|unlinkat|rename|renameat|rmdir) -F auid\u003e=1000 -F auid!=(4294967295|unset|-1) -F key=delete" }
      - { some: "~ ^-a always,exit -F arch=b64 -S (unlink|unlinkat|rename|renameat|rmdir),(unlink|unlinkat|rename|renameat|rmdir),(unlink|unlinkat|rename|renameat|rmdir),(unlink|unlinkat|rename|renameat|rmdir),(unlink|unlinkat|rename|renameat|rmdir) -F auid\u003e=1000 -F auid!=(4294967295|unset|-1) -F key=delete" }
    rationale: &rat-8c6e7e1358 |
      If the system is not configured to audit certain activities and write them to an audit log, it is more difficult to detect and track system compromises and damages incurred during a system compromise.

      When a user logs on, the auid is set to the uid of the account that is being authenticated. Daemons are not user sessions and have the loginuid set to -1. The auid representation is an unsigned 32-bit integer, which equals 4294967295. The audit system interprets -1, 4294967295, and "unset" in the same way.

      The system call rules are loaded into a matching engine that intercepts each syscall made by all programs on the system. Therefore, it is very important to use syscall rules only when absolutely necessary since these affect performance. The more rules, the bigger the performance hit. The performance can be helped, however, by combining syscalls into one rule whenever possible.
    remediation: &rem-afaefde1d4 |
      Configure the operating system to generate audit records upon successful/unsuccessful attempts to use the "unlink", "unlinkat", "rename", "renameat", and "rmdir" syscalls.

      Add the following rules in "/etc/audit/rules.d/audit.rules":

      -a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat,rmdir -F auid>=1000 -F auid!=unset -k delete

      -a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat,rmdir -F auid>=1000 -F auid!=unset -k delete

      The audit daemon must be restarted for the changes to take effect.
  - id: "STIG-RHEL-07-030910-unlink_auditd.rules"
    name: "Must audit all uses of the unlink syscall. (config)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-030910, V-204572, SV-204572r603261_rule, CAT II. CCI-000172, CCI-002884."
    tags: [stig, stig-rhel7, stig-cat-2]
