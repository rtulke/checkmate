# Generated by tools/cis-import from ansible-lockdown/RHEL7-STIG-Audit (MIT license).
# Do not edit by hand; regenerate with `make stig-import`. See stig/NOTICE.
name: DISA STIG Red Hat Enterprise Linux 7
version: "3.14"
description: >
  Automated checks for 214 rules of the DISA Security Technical
  Implementation Guide for Red Hat Enterprise Linux 7 (version 3.14), converted from the goss
  audit content of the ansible-lockdown project. Severity follows the STIG
  category: CAT I high, CAT II medium, CAT III low. Rationale and fix
  texts are taken from the DISA STIG V3R15 (24 Jul 2024). Select categories
  with tags, e.g. `--tags stig-cat-1`.

defaults:
  when: "(facts.distro == \"rhel\" or \"rhel\" in facts.distro_like) and facts.version_major == 7"
  timeout: 120s

checks:
  - id: "STIG-RHEL-07-010010-system_file_perms"
    name: "System files match vendor package values"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010010, V-204392, SV-204392r880752_rule, CAT I. CCI-001494, CCI-001496, CCI-002165, CCI-002235."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    timeout: 120000ms
    run: |
      for i in `rpm -Va | egrep -i '^\.[M|U|G|.]{8}' | cut -d " " -f 4,5`;do for j in `rpm -qf $i`;do rpm -ql $j --dump | cut -d " " -f 1,5,6,7 | grep $i;done;done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-e1962d7a3c |
      Discretionary access control is weakened if a user or group has access permissions to system files and directories greater than the default.
    remediation: &rem-66e3286678 |
      Run the following command to determine which package owns the file:

           # rpm -qf <filename>

      Reset the user and group ownership of files within a package with the following command:

           # rpm --setugids <packagename>

      Reset the permissions of files within a package with the following command:

           # rpm --setperms <packagename>
  - id: "STIG-RHEL-07-010020-rpm_check"
    name: "Must be configured so that the cryptographic hash of system files and commands matches vendor values."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010020, V-214799, SV-214799r603261_rule, CAT I. CCI-001749."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    timeout: 120000ms
    run: |
      rpm -Va --noconfig | grep '^..5' > /tmp/stig_rpmcheck; grep -cvw c /tmp/stig_rpmcheck
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ 0" }
    rationale: &rat-7e3676e1d9 |
      Without cryptographic integrity protections, system command and files can be altered by unauthorized users without detection.

      Cryptographic mechanisms used for protecting the integrity of information include, for example, signed hash functions using asymmetric cryptography enabling distribution of the public key to verify the hash information while maintaining the confidentiality of the key used to generate the hash.
    remediation: &rem-cdaaab9bc2 |
      Run the following command to determine which package owns the file:

      # rpm -qf <filename>

      The package can be reinstalled from a yum repository using the command:

      # sudo yum reinstall <packagename>

      Alternatively, the package can be reinstalled from trusted media using the command:

      # sudo rpm -Uvh <packagename>
  - id: "STIG-RHEL-07-010290-check_nullok_pam"
    name: "The Red Hat Enterprise Linux operating system must not allow accounts configured with blank or null passwords."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010290, V-204424, SV-204424r880839_rule, CAT I. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      grep nullok /etc/pam.d/system-auth /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-050a0575c0 |
      If an account has an empty password, anyone could log on and run commands with the privileges of that account. Accounts with empty passwords should never be used in operational environments.
    remediation: &rem-394f59a820 |
      If an account is configured for password authentication but does not have an assigned password, it may be possible to log on to the account without authenticating.

      Remove any instances of the "nullok" option in "/etc/pam.d/system-auth" and "/etc/pam.d/password-auth" to prevent logons with empty passwords.

      Note: Per requirement RHEL-07-010199, RHEL 7 must be configured to not overwrite custom authentication configuration settings while using the authconfig utility, otherwise manual changes to the listed files will be overwritten whenever the authconfig utility is used.
  - id: "STIG-RHEL-07-010291-check_nullok_shadow"
    name: "The Red Hat Enterprise Linux operating system must not have accounts configured with blank or null passwords."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010291, V-251702, SV-251702r809220_rule, CAT I. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      awk -F: '!$2 {print $1}' /etc/shadow
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: *rat-050a0575c0
    remediation: &rem-4935a4aee1 |
      Configure all accounts on the system to have a password or lock the account with the following commands:

      Perform a password reset:
      $ sudo passwd [username]
      Lock an account:
      $ sudo passwd -l [username]
  - id: "STIG-RHEL-07-010300-sshd_config_empty_passwd"
    name: "Must be configured so that the SSH daemon does not allow authentication using an empty password."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010300, V-204425, SV-204425r603261_rule, CAT I. CCI-000766."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      grep -i emptypasswords /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ PermitEmptyPasswords.*no" }
      - { none: "~ PermitEmptyPasswords.*yes" }
    rationale: &rat-20ce5e0cb6 |
      Configuring this setting for the SSH daemon provides additional assurance that remote logon via SSH will require a password, even in the event of misconfiguration elsewhere.
    remediation: &rem-93861d943f |
      To explicitly disallow remote logon from accounts with empty passwords, add or correct the following line in "/etc/ssh/sshd_config":

      PermitEmptyPasswords no

      The SSH service must be restarted for changes to take effect.  Any accounts with empty passwords should be disabled immediately, and PAM configuration should prevent users from being able to assign themselves empty passwords.
  - id: "STIG-RHEL-07-010482-boot_grub2_user.cfg-attrs"
    name: "Require authentication upon booting into single-user and maintenance modes. (/boot/grub2/user.cfg: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010482, V-204438, SV-204438r744095_rule, CAT I. CCI-000213."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      f='/boot/grub2/user.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-11c9d6583a |
      If the system does not require valid authentication before it boots into single-user or maintenance mode, anyone who invokes single-user or maintenance mode is granted privileged access to all files on the system. GRUB 2 is the default boot loader for RHEL 7 and is designed to require a password to boot into single-user mode or make modifications to the boot menu.
    remediation: &rem-4c09048a5c |
      Configure the system to encrypt the boot password for the grub superusers account with the grub2-setpassword command, which creates/overwrites the /boot/grub2/user.cfg file.

      Generate an encrypted grub2 password for the grub superusers account with the following command:

      $ sudo grub2-setpassword
      Enter password:
      Confirm password:
  - id: "STIG-RHEL-07-010482-boot_grub2_user.cfg-content"
    name: "Require authentication upon booting into single-user and maintenance modes. (/boot/grub2/user.cfg has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010482, V-204438, SV-204438r744095_rule, CAT I. CCI-000213."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      cat '/boot/grub2/user.cfg'
    allow_rc: any
    expect: { some: "~ ^GRUB2_PASSWORD=grub.pbkdf2.sha512.*" }
    rationale: *rat-11c9d6583a
    remediation: *rem-4c09048a5c
  - id: "STIG-RHEL-07-020000-rsh-server"
    name: "Must not have the rsh-server package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020000, V-204442, SV-204442r603261_rule, CAT I. CCI-000381."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet rsh-server
    expect: false
    rationale: &rat-13a679dcb7 |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      Operating systems are capable of providing a wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary to support essential organizational operations (e.g., key missions, functions).

      The rsh-server service provides an unencrypted remote access service that does not provide for the confidentiality and integrity of user passwords or the remote session and has very weak authentication.

      If a privileged user were to log on using this service, the privileged user password could be compromised.
    remediation: &rem-fb14202b88 |
      Configure the operating system to disable non-essential capabilities by removing the rsh-server package from the system with the following command:

      # yum remove rsh-server
  - id: "STIG-RHEL-07-020010-ypserv"
    name: "The Red Hat Enterprise Linux operating system must not have the ypserv package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020010, V-204443, SV-204443r603261_rule, CAT I. CCI-000381."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet ypserv
    expect: false
    rationale: &rat-ac39302f72 |
      Removing the "ypserv" package decreases the risk of the accidental (or intentional) activation of NIS or NIS+ services.
    remediation: &rem-15ef75f782 |
      Configure the operating system to disable non-essential capabilities by removing the "ypserv" package from the system with the following command:

      # yum remove ypserv
  - id: "STIG-RHEL-07-020050-yum_conf_gpgcheck"
    name: "Must prevent the installation of software, patches, service packs, device drivers, or operating system components from a repository without verification"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020050, V-204447, SV-204447r603261_rule, CAT I. CCI-001749."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      grep gpgcheck /etc/yum.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^gpgcheck=1" }
      - { none: "~ ^gpgcheck=0" }
    rationale: &rat-6555d35ad2 |
      Changes to any software components can have significant effects on the overall security of the operating system. This requirement ensures the software has not been tampered with and that it has been provided by a trusted vendor.

      Accordingly, patches, service packs, device drivers, or operating system components must be signed with a certificate recognized and approved by the organization.

      Verifying the authenticity of the software prior to installation validates the integrity of the patch or upgrade received from a vendor. This verifies the software has not been tampered with and that it has been provided by a trusted vendor. Self-signed certificates are disallowed by this requirement. The operating system should not have to verify the software again. This requirement does not mandate DoD certificates for this purpose; however, the certificate used to verify the software must be from an approved CA.
    remediation: &rem-645bfe8366 |
      Configure the operating system to verify the signature of packages from a repository prior to install by setting the following option in the "/etc/yum.conf" file:

      gpgcheck=1
  - id: "STIG-RHEL-07-020060-yum_conf_localpkg_gpg"
    name: "Must prevent the installation of software, patches, service packs, device drivers, or operating system components from a repository without verification"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020060, V-204448, SV-204448r603261_rule, CAT I. CCI-001749."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      grep localpkg_gpgcheck /etc/yum.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^localpkg_gpgcheck=1" }
      - { none: "~ ^localpkg_gpgcheck=0" }
    rationale: *rat-6555d35ad2
    remediation: &rem-f239add3fc |
      Configure the operating system to verify the signature of local packages prior to install by setting the following option in the "/etc/yum.conf" file:

      localpkg_gpgcheck=1
  - id: "STIG-RHEL-07-020230-ctrl-alt-del-enabled"
    name: "System must be configured so that the x86 Ctrl-Alt-Delete key sequence is disabled on the command line. (Service ctrl-alt-del is not enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020230, V-204455, SV-204455r928574_rule, CAT I. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      systemctl show -p UnitFileState ctrl-alt-del | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-35670b38b2 |
      A locally logged-on user who presses Ctrl-Alt-Delete, when at the console, can reboot the system. If accidentally pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term loss of availability of systems due to unintentional reboot. In the GNOME graphical environment, risk of unintentional reboot from the Ctrl-Alt-Delete sequence is reduced because the user will be prompted before any action is taken.
    remediation: &rem-a8ae1f957d |
      Configure the system to disable the Ctrl-Alt-Delete sequence for the command line with the following commands:

           # systemctl disable ctrl-alt-del.target

           # systemctl mask ctrl-alt-del.target
  - id: "STIG-RHEL-07-020230-ctrl-alt-del-running"
    name: "System must be configured so that the x86 Ctrl-Alt-Delete key sequence is disabled on the command line. (Service ctrl-alt-del is not running)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020230, V-204455, SV-204455r928574_rule, CAT I. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      systemctl show -p ActiveState ctrl-alt-del | cut -d= -f2
    expect: "!= active"
    rationale: *rat-35670b38b2
    remediation: *rem-a8ae1f957d
  - id: "STIG-RHEL-07-020230-etc_systemd_system_ctrl-alt-del.service-attrs"
    name: "System must be configured so that the x86 Ctrl-Alt-Delete key sequence is disabled on the command line. (masked)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020230, V-204455, SV-204455r833106_rule, CAT I. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      f='/etc/systemd/system/ctrl-alt-del.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: *rat-35670b38b2
    remediation: *rem-a8ae1f957d
  - id: "STIG-RHEL-07-020310-uid_0_check"
    name: "Must be configured so that the root account must be the only account having unrestricted access to the system."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020310, V-204462, SV-204462r603261_rule, CAT I. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      awk -F: '($3 == 0) { print $1 }' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root" }
    rationale: &rat-a5861790d4 |
      If an account other than root also has a User Identifier (UID) of "0", it has root authority, giving that account unrestricted access to the entire operating system. Multiple accounts with a UID of "0" afford an opportunity for potential intruders to guess a password for a privileged account.
    remediation: &rem-5be607ea69 |
      Change the UID of any account on the system, other than root, that has a UID of "0".

      If the account is associated with system commands or applications, the UID should be changed to one greater than "0" but less than "1000". Otherwise, assign a UID of greater than "1000" that has not already been assigned.
  - id: "STIG-RHEL-07-021350-dracut-fips"
    name: "Verify the operating system implements DoD-approved encryption to protect the confidentiality of remote access sessions."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021350, V-204497, SV-204497r603261_rule, CAT I. CCI-001199, CCI-000068, CCI-002450, CCI-002476."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet dracut-fips
    expect: true
    rationale: &rat-e0c658c449 |
      Use of weak or untested encryption algorithms undermines the purposes of using encryption to protect data. The operating system must implement cryptographic modules adhering to the higher standards approved by the federal government since this provides assurance they have been tested and validated.
    remediation: &rem-a2d5aa2fb8 |
      Configure the operating system to implement DoD-approved encryption by installing the dracut-fips package.

      To enable strict FIPS compliance, the fips=1 kernel option needs to be added to the kernel command line during system installation so key generation is done with FIPS-approved algorithms and continuous monitoring tests in place.

      Configure the operating system to implement DoD-approved encryption by following the steps below:

      The fips=1 kernel option needs to be added to the kernel command line during system installation so that key generation is done with FIPS-approved algorithms and continuous monitoring tests in place. Users should also ensure that the system has plenty of entropy during the installation process by moving the mouse around, or if no mouse is available, ensuring that many keystrokes are typed. The recommended amount of keystrokes is 256 and more. Less than 256 keystrokes may generate a non-unique key.

      Install the dracut-fips package with the following command:

      # yum install dracut-fips

      Recreate the "initramfs" file with the following command:

      Note: This command will overwrite the existing "initramfs" file.

      # dracut -f

      Modify the kernel command line of the current kernel in the "grub.cfg" file by adding the following option to the GRUB_CMDLINE_LINUX key in the "/etc/default/grub" file and then rebuild the "grub.cfg" file:

      fips=1

      Changes to "/etc/default/grub" require rebuilding the "grub.cfg" file as follows:

      On BIOS-based machines, use the following command:

      # grub2-mkconfig -o /boot/grub2/grub.cfg

      On UEFI-based machines, use the following command:

      # grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg

      If /boot or /boot/efi reside on separate partitions, the kernel parameter boot=<partition of /boot or /boot/efi> must be added to the kernel command line. You can identify a partition by running the df /boot or df /boot/efi command:

      # df /boot
      Filesystem 1K-blocks Used Available Use% Mounted on
      /dev/sda1 495844 53780 416464 12% /boot

      To ensure the "boot=" configuration option will work even if device naming changes occur between boots, identify the universally unique identifier (UUID) of the partition with the following command:

      # blkid /dev/sda1
      /dev/sda1: UUID="05c000f1-a213-759e-c7a2-f11b7424c797" TYPE="ext4"

      For the example above, append the following string to the kernel command line:

      boot=UUID=05c000f1-a213-759e-c7a2-f11b7424c797

      If the file /etc/system-fips does not exists, recreate it:

      # touch /etc/ system-fips

      Reboot the system for the changes to take effect.
  - id: "STIG-RHEL-07-021350-etc_system-fips-attrs"
    name: "Verify the operating system implements DoD-approved encryption to protect the confidentiality of remote access sessions."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021350, V-204497, SV-204497r603261_rule, CAT I. CCI-001199, CCI-000068, CCI-002450, CCI-002476."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      f='/etc/system-fips'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: *rat-e0c658c449
    remediation: *rem-a2d5aa2fb8
  - id: "STIG-RHEL-07-021710-telnet-server"
    name: "Must not have the telnet-server package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-021710, V-204502, SV-204502r603261_rule, CAT I. CCI-000381."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet telnet-server
    expect: false
    rationale: &rat-3601bb8532 |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      Operating systems are capable of providing a wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary to support essential organizational operations (e.g., key missions, functions).

      Examples of non-essential capabilities include, but are not limited to, games, software packages, tools, and demonstration software not related to requirements or providing a wide array of functionality not required for every mission, but which cannot be disabled.
    remediation: &rem-5004d353cc |
      Configure the operating system to disable non-essential capabilities by removing the telnet-server package from the system with the following command:

      # yum remove telnet-server
  - id: "STIG-RHEL-07-040390-sshd_config_protocol"
    name: "Must be configured so that the SSH daemon is configured to only use the SSHv2 protocol. (\u003c= 7.3)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040390, V-204594, SV-204594r603261_rule, CAT I. CCI-000366, CCI-000197."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      grep -i protocol /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Protocol 2" }
      - { none: "~ ^Protocol 1" }
    rationale: &rat-84aed023e8 |
      SSHv1 is an insecure implementation of the SSH protocol and has many well-known vulnerability exploits. Exploits of the SSH daemon could provide immediate root access to the system.
    remediation: &rem-8e066955e8 |
      Remove all Protocol lines that reference version "1" in "/etc/ssh/sshd_config" (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor). The "Protocol" line must be as follows:

      Protocol 2

      The SSH service must be restarted for changes to take effect.
  - id: "STIG-RHEL-07-040540-check_.shosts"
    name: "Must not contain shosts files."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040540, V-204606, SV-204606r603261_rule, CAT I. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    timeout: 120000ms
    run: |
      find / -name '*.shosts'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-949a1d5846 |
      The .shosts files are used to configure host-based authentication for individual users or the system via SSH. Host-based authentication is not sufficient for preventing unauthorized access to the system, as it does not require interactive identification and authentication of a connection request, or for the use of two-factor authentication.
    remediation: &rem-ba5391b354 |
      Remove any found ".shosts" files from the system.

      # rm /[path]/[to]/[file]/.shosts
  - id: "STIG-RHEL-07-040550-check_.shosts.equiv"
    name: "Must not contain shosts.equiv files."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040550, V-204607, SV-204607r603261_rule, CAT I. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    timeout: 120000ms
    run: |
      find / -name shosts.equiv
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-bb21e787aa |
      The shosts.equiv files are used to configure host-based authentication for the system via SSH. Host-based authentication is not sufficient for preventing unauthorized access to the system, as it does not require interactive identification and authentication of a connection request, or for the use of two-factor authentication.
    remediation: &rem-78669ccd50 |
      Remove any found "shosts.equiv" files from the system.

      # rm /[path]/[to]/[file]/shosts.equiv
  - id: "STIG-RHEL-07-040690-vsftpd"
    name: "Must not have a File Transfer Protocol (FTP) server package installed unless needed."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040690, V-204620, SV-204620r603261_rule, CAT I. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet vsftpd
    expect: false
    rationale: &rat-aa7827d3b4 |
      The FTP service provides an unencrypted remote access that does not provide for the confidentiality and integrity of user passwords or the remote session. If a privileged user were to log on using this service, the privileged user password could be compromised. SSH or other encrypted file transfer methods must be used in place of this service.
    remediation: &rem-29dd886a95 |
      Document the "vsftpd" package with the ISSO as an operational requirement or remove it from the system with the following command:

      # yum remove vsftpd
  - id: "STIG-RHEL-07-040700-tftp-server"
    name: "Must not have the Trivial File Transfer Protocol (TFTP) server package installed if not required for operational support."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040700, V-204621, SV-204621r603261_rule, CAT I. CCI-000368, CCI-001813, CCI-001814, CCI-001812, CCI-000318."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet tftp-server
    expect: false
    rationale: &rat-e9a6e4f0c0 |
      If TFTP is required for operational support (such as the transmission of router configurations) its use must be documented with the Information System Security Officer (ISSO), restricted to only authorized personnel, and have access control rules established.
    remediation: &rem-302e07aefc |
      Remove the TFTP package from the system with the following command:

      # yum remove tftp-server
  - id: "STIG-RHEL-07-040800-etc_snmp_snmpd.conf-attrs"
    name: "SNMP community strings on the Red Hat Enterprise Linux operating system must be changed from the default. (/etc/snmp/snmpd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040800, V-204627, SV-204627r603261_rule, CAT I. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      f='/etc/snmp/snmpd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d557cf688a |
      Whether active or not, default Simple Network Management Protocol (SNMP) community strings must be changed to maintain security. If the service is running with the default authenticators, anyone can gather data about the system and the network and use the information to potentially compromise the integrity of the system or network(s). It is highly recommended that SNMP version 3 user authentication and message encryption be used in place of the version 2 community strings.
    remediation: &rem-3fb2258d8d |
      If the "/etc/snmp/snmpd.conf" file exists, modify any lines that contain a community string value of "public" or "private" to another string value.
  - id: "STIG-RHEL-07-040800-etc_snmp_snmpd.conf-content"
    name: "SNMP community strings on the Red Hat Enterprise Linux operating system must be changed from the default. (/etc/snmp/snmpd.conf has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-040800, V-204627, SV-204627r603261_rule, CAT I. CCI-000366."
    tags: [stig, stig-rhel7, stig-cat-1]
    severity: high
    run: |
      cat '/etc/snmp/snmpd.conf'
    allow_rc: any
    expect:
      - { none: "~ ^%\\ssnmp.*public.*$" }
      - { none: "~ ^%\\ssnmp.*private.*$" }
    rationale: *rat-d557cf688a
    remediation: *rem-3fb2258d8d
  - id: "STIG-RHEL-07-010050-etc_issue-attrs"
    name: "Must display the Standard Mandatory DoD Notice and Consent Banner before granting local or remote access to the system via a command line user logon. (/etc/issue: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010050, V-204395, SV-204395r603261_rule, CAT II. CCI-000048."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f6b34c1342 |
      Display of a standardized and approved use notification before granting access to the operating system ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies, regulations, standards, and guidance.

      System use notifications are required only for access via logon interfaces with human users and are not required when such human interfaces do not exist.

      The banner must be formatted in accordance with applicable DoD policy. Use the following verbiage for operating systems that can accommodate banners of 1300 characters:

      "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.

      By using this IS (which includes any device attached to this IS), you consent to the following conditions:

      -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.

      -At any time, the USG may inspect and seize data stored on this IS.

      -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.

      -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.

      -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details."
    remediation: &rem-547b35acab |
      Configure the operating system to display the Standard Mandatory DoD Notice and Consent Banner before granting access to the system via the command line by editing the "/etc/issue" file.

      Replace the default text with the Standard Mandatory DoD Notice and Consent Banner. The DoD required text is:
      "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.

      By using this IS (which includes any device attached to this IS), you consent to the following conditions:

      -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.

      -At any time, the USG may inspect and seize data stored on this IS.

      -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.

      -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.

      -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants.  Such communications and work product are private and confidential.  See User Agreement for details."
  - id: "STIG-RHEL-07-010050-etc_issue-content"
    name: "Must display the Standard Mandatory DoD Notice and Consent Banner before granting local or remote access to the system via a command line user logon. (/etc/issue has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010050, V-204395, SV-204395r603261_rule, CAT II. CCI-000048."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/issue'
    allow_rc: any
    expect: { some: "~ [You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only. By using this IS (which includes any device attached to this IS), you consent to the following conditions: -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations. -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose. -This IS includes security measures (e.g., authentication and access controls) to protect USG interests\\--not for your personal benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details.]" }
    rationale: *rat-f6b34c1342
    remediation: *rem-547b35acab
  - id: "STIG-RHEL-07-010090-screen"
    name: "The Red Hat Enterprise Linux operating system must have the screen package installed. (screen package)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-010090, V-255926, SV-255926r880779_rule, CAT II. CCI-000057."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet screen
    expect: true
    rationale: &rat-53d73c96a7 |
      A session time-out lock is a temporary action taken when a user stops work and moves away from the immediate physical vicinity of the information system but does not log out because of the temporary nature of the absence. Rather than relying on the user to manually lock their operating system session prior to vacating the vicinity, operating systems need to be able to identify when a user's session has idled and take action to initiate the session lock.

      The screen and tmux packages allow for a session lock to be implemented and configured.
    remediation: &rem-77c04252db |
      Install the screen package to allow the initiation of a session lock after a 15-minute period of inactivity.

      Install the screen program (if it is not on the system) with the following command:

           # yum install screen

      OR

      Install the tmux program (if it is not on the system) with the following command:

           # yum install tmux
