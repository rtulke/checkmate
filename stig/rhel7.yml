    remediation: *rem-94079a12eb
  - id: "STIG-RHEL-07-020110-autofs-enabled"
    name: "Must disable the file system automounter unless required. (Service autofs is not enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020110, V-204451, SV-204451r603261_rule, CAT II. CCI-001958, CCI-000366, CCI-000778."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState autofs | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-ad2f94b96c |
      Automatically mounting file systems permits easy introduction of unknown devices, thereby facilitating malicious activity.
    remediation: &rem-25fe28387c |
      Configure the operating system to disable the ability to automount devices.

      Turn off the automount service with the following commands:

      # systemctl stop autofs
      # systemctl disable autofs

      If "autofs" is required for Network File System (NFS), it must be documented with the ISSO.
  - id: "STIG-RHEL-07-020110-autofs-running"
    name: "Must disable the file system automounter unless required. (Service autofs is not running)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020110, V-204451, SV-204451r603261_rule, CAT II. CCI-001958, CCI-000366, CCI-000778."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState autofs | cut -d= -f2
    expect: "!= active"
    rationale: *rat-ad2f94b96c
    remediation: *rem-25fe28387c
  - id: "STIG-RHEL-07-020210-getenforce"
    name: "The Red Hat Enterprise Linux operating system must enable SELinux."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020210, V-204453, SV-204453r942900_rule, CAT II. CCI-002696, CCI-002165."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      getenforce
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ Enforcing" }
    rationale: &rat-28912bbed1 |
      Without verification of the security functions, security functions may not operate correctly and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.

      This requirement applies to operating systems performing security function verification/testing and/or systems and environments that require this functionality.
    remediation: &rem-07671eac97 |
      Configure the operating system to verify correct operation of all security functions.

      Set the "SELinux" status and the "Enforcing" mode by modifying the "/etc/selinux/config" file to have the following line:

           SELINUX=enforcing

      A reboot is required for the changes to take effect.
  - id: "STIG-RHEL-07-020210-selinux_config_enforcing"
    name: "The Red Hat Enterprise Linux operating system must enable SELinux."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020210, V-204453, SV-204453r942900_rule, CAT II. CCI-002696, CCI-002165."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i selinux /etc/selinux/config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^SELINUX=enforcing" }
      - { none: "~ /\\^SELINUX=disabled" }
      - { none: "~ ^SELINUXTYPE=permissive" }
    rationale: *rat-28912bbed1
    remediation: *rem-07671eac97
  - id: "STIG-RHEL-07-020220-selinux_config_targeted"
    name: "Must enable the SELinux targeted policy."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020220, V-204454, SV-204454r754748_rule, CAT II. CCI-002165, CCI-002696."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      grep -i selinuxtype /etc/selinux/config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^SELINUXTYPE=targeted" }
      - { none: "~ ^SELINUXTYPE=minimal" }
    rationale: *rat-28912bbed1
    remediation: &rem-a5f17d8564 |
      Configure the operating system to verify correct operation of all security functions.

      Set the "SELinuxtype" to the "targeted" policy by modifying the "/etc/selinux/config" file to have the following line:

           SELINUXTYPE=targeted

      A reboot is required for the changes to take effect.
  - id: "STIG-RHEL-07-020220-sestatus"
    name: "The Red Hat Enterprise Linux operating system must enable the SELinux targeted policy. (running)"
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020220, V-204454, SV-204454r754748_rule, CAT II. CCI-002165, CCI-002696."
    tags: [stig, stig-rhel7, stig-cat-2]
    severity: medium
    run: |
      sestatus
    allow_rc: any
    expect:
      - { rc: "== 0" }
