  - id: "STIG-RHEL-07-020101-modprobe_dccp_module"
    name: "Must be configured so that the Datagram Congestion Control Protocol (DCCP) kernel module is disabled unless required."
    description: "DISA STIG for Red Hat Enterprise Linux 7, RHEL-07-020101, V-204450, SV-204450r942897_rule, CAT II. CCI-001958."
