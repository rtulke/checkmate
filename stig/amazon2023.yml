  - id: "STIG-AZLX-23-002415-azlx_23_002415_temporary_user_accounts_c"
    name: "MEDIUM (Amazon Linux 2023 must automatically remove or disable temporary user…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002415, V-274146, SV-274146r1120426_rule, CAT II. CCI-000016. NIST SP 800-53 Rev. 4: AC-2."
