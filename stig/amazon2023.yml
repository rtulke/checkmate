  - id: "STIG-AZLX-23-000320-gssproxy"
    name: "MEDIUM (Amazon Linux 2023 must not have the gssproxy package installed.)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-000320, V-274011, SV-274011r1184000_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
