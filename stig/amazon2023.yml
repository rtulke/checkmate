  - id: "STIG-AZLX-23-002435-azlx_23_002435_temporary_accounts_check"
    name: "MEDIUM (Amazon Linux 2023 must automatically expire temporary accounts within…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002435, V-274150, SV-274150r1120438_rule, CAT II. CCI-001682. NIST SP 800-53 Rev. 4: AC-2."
