  - id: "STIG-AZLX-23-002565-azlx_23_002565_check_chrony_interval-attrs"
    name: "MEDIUM (/etc/chrony.conf: exists)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002565, V-274175, SV-274175r1261426_rule, CAT II. CCI-001890, CCI-004922, CCI-004923, CCI-004926. NIST SP 800-53 Rev. 4: AU-8."
