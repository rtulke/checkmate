  - id: "STIG-AZLX-23-002235-azlx_23_002235_file"
    name: "MEDIUM (Amazon Linux 2023 audit logs file must have mode \"0600\" or less permi…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002235, V-274110, SV-274110r1120318_rule, CAT II. CCI-000162, CCI-000163, CCI-000164, CCI-001314. NIST SP 800-53 Rev. 4: AU-9, SI-11."
