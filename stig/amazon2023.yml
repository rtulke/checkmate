    rationale: *rat-93e50bcce6
    remediation: *rem-612f8a61c9
  - id: "STIG-AZLX-23-001075-firewalld"
    name: "MEDIUM (Amazon Linux 2023 must have the firewalld package installed.)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001075, V-274027, SV-274027r1120069_rule, CAT II. CCI-000382, CCI-002314, CCI-002322, CCI-000366, CCI-000015. NIST SP 800-53 Rev. 4: CM-7, AC-17, CM-6, AC-2."
