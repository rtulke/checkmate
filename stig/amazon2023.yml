  - id: "STIG-AZLX-23-002595-azlx_23_002595_pcscd_socket"
    name: "MEDIUM (Amazon Linux 2023 must ensure the pcscd socket is active.)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002595, V-274181, SV-274181r1208251_rule, CAT II. CCI-004046. NIST SP 800-53 Rev. 4: Na."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      systemctl is-active pcscd.socket
    allow_rc: any
    expect:
      - { rc: "in [0, 3, 4]" }
      - { some: "~ ^active$" }
    rationale: &rat-d5cfc74fcc |
      The information system ensures that even if the information system is compromised, that compromise will not affect credentials stored on the authentication device.

      The daemon program for pcsc-lite and the MuscleCard framework is pcscd. It is a resource manager that coordinates communications with smart card readers and smart cards and cryptographic tokens that are connected to the system.
    remediation: &rem-c43fbf242c |
      Configure Amazon Linux 2023 so that the pcscd socket is active with the following command:

      $ sudo systemctl enable --now pcscd.socket
  - id: "STIG-AZLX-23-002600-azlx_23_002600_check_automount_function-enabled"
    name: "MEDIUM (Service autofs is not enabled)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002600, V-274182, SV-274182r1261388_rule, CAT II. CCI-001958. NIST SP 800-53 Rev. 4: IA-3."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState autofs | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-fc30c6f6d5 |
      Without authenticating devices, unidentified or unknown devices may be introduced, thereby facilitating malicious activity.

      Peripherals include, but are not limited to, such devices as flash drives, external storage, and printers.
    remediation: &rem-8e586ac404 |
      Configure Amazon Linux 2023 to disable the ability to automount devices.

      The autofs service can be disabled with the following command:

      $ sudo systemctl mask --now autofs.service
  - id: "STIG-AZLX-23-002600-azlx_23_002600_check_automount_function-running"
    name: "MEDIUM (Service autofs is not running)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002600, V-274182, SV-274182r1261388_rule, CAT II. CCI-001958. NIST SP 800-53 Rev. 4: IA-3."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState autofs | cut -d= -f2
    expect: "!= active"
    rationale: *rat-fc30c6f6d5
    remediation: *rem-8e586ac404
  - id: "STIG-AZLX-23-002600-azlx_23_002600_check_automount_function_"
    name: "MEDIUM (Amazon Linux 2023 file system automount function must be disabled.)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002600, V-274182, SV-274182r1261388_rule, CAT II. CCI-001958. NIST SP 800-53 Rev. 4: IA-3."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      systemctl is-enabled autofs 2>&1 || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(masked|disabled|not-found)$|Failed to get unit file state for autofs\\.service" }
    rationale: *rat-fc30c6f6d5
    remediation: *rem-8e586ac404
  - id: "STIG-AZLX-23-002605-azlx_23_002605_check_rate_limiting_measu"
    name: "MEDIUM (Amazon Linux 2023 must protect against or limit the effects of denial…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002605, V-274183, SV-274183r1120714_rule, CAT II. CCI-002385. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      echo "Manual audit check required"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-6c7b1e1822 |
      DoS is a condition when a resource is not available for legitimate users. When this occurs, the organization either cannot accomplish its mission or must operate at degraded capacity.

      This requirement addresses the configuration of Amazon Linux 2023 to mitigate the impact of DoS attacks that have occurred or are ongoing on system availability. For each system, known and potential DoS attacks must be identified and solutions for each type implemented. A variety of technologies exist to limit or, in some cases, eliminate the effects of DoS attacks (e.g., limiting processes or establishing memory partitions). Employing increased capacity and bandwidth, combined with service redundancy, may reduce the susceptibility to some DoS attacks.
    remediation: &rem-80a3dbfdfb |
      Configure Amazon Linux 2023 to use the AWS ALB rate limiting feature using its built-in rate limiting capabilities. This allows the user to set rate limits at the ALB level, which will apply to all traffic passing through the load balancer.
  - id: "STIG-AZLX-23-002610-azlx_23_002610_check_nonexecutable_data"
    name: "MEDIUM (Amazon Linux 2023 must implement nonexecutable data to protect its me…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002610, V-274184, SV-274184r1120540_rule, CAT II. CCI-002824. NIST SP 800-53 Rev. 4: SI-16."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      dmesg | grep -i "execute disable"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ NX \\(Execute Disable\\) protection: active" }
    rationale: &rat-134bacc5f3 |
      The no-execute (NX) feature uses the segmentation feature on all x86 systems to prevent execution in memory higher than a certain address. It writes an address as a limit in the code segment descriptor, to control where code can be executed, on a per-process basis. When the kernel places a process's memory regions such as the stack and heap higher than this address, the hardware prevents execution in that address range. This is enabled by default on the latest Red Hat and Fedora systems if supported by the hardware.
    remediation: &rem-02dc810dfd |
      Configure Amazon Linux 2023 NX support to be enabled by opening a support case via the AWS Console to investigate why NX support is not detected.
  - id: "STIG-AZLX-23-002615-azlx_23_002615_config-attrs"
    name: "MEDIUM (/etc/dnf/dnf.conf: exists)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002615, V-274185, SV-274185r1120543_rule, CAT II. CCI-002617. NIST SP 800-53 Rev. 4: SI-2."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      f='/etc/dnf/dnf.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-0c6c7c1ec4 |
      Previous versions of software components that are not removed from the information system after updates have been installed may be exploited by some adversaries.
    remediation: &rem-6cac468415 |
      Configure Amazon Linux 2023 to remove all software components after updated versions have been installed.

      Set the "clean_requirements_on_remove" option to "1" in the "/etc/dnf/dnf.conf" file:

      clean_requirements_on_remove=1
  - id: "STIG-AZLX-23-002615-azlx_23_002615_config-content"
    name: "MEDIUM (/etc/dnf/dnf.conf has the expected content (2 rules))"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002615, V-274185, SV-274185r1120543_rule, CAT II. CCI-002617. NIST SP 800-53 Rev. 4: SI-2."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/dnf/dnf.conf'
    allow_rc: any
    expect:
      - { some: "~ (?i)^clean_requirements_on_remove\\s*=\\s*(1|true|yes|on)$" }
      - { none: "~ (?i)^clean_requirements_on_remove\\s*=\\s*(0|false|no|off)$" }
    rationale: *rat-0c6c7c1ec4
    remediation: *rem-6cac468415
  - id: "STIG-AZLX-23-002620-azlx_23_002620_check_pam_faillock_system-attrs"
    name: "MEDIUM (/etc/pam.d/system-auth: exists)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002620, V-274186, SV-274186r1120546_rule, CAT II. CCI-000044. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      f='/etc/pam.d/system-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-c90cf4fd22 |
      If the pam_faillock.so module is not loaded, the system will not correctly lockout accounts to prevent password guessing attacks.
    remediation: &rem-cbd7ce4300 |
      Configure Amazon Linux 2023 to include the use of the pam_faillock.so module in the /etc/pam.d/system-auth file.

      Add/modify the appropriate sections of the "/etc/pam.d/system-auth" file to match the following lines:
      Note: The "preauth" line must be listed before pam_unix.so.

      auth required pam_faillock.so preauth
      auth required pam_faillock.so authfail
      account required pam_faillock.so
  - id: "STIG-AZLX-23-002620-azlx_23_002620_check_pam_faillock_system-content"
    name: "MEDIUM (/etc/pam.d/system-auth has the expected content (3 rules))"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002620, V-274186, SV-274186r1120546_rule, CAT II. CCI-000044. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/pam.d/system-auth'
    allow_rc: any
    expect:
      - { some: "~ ^auth\\s+required\\s+pam_faillock.so preauth" }
      - { some: "~ ^auth\\s+required\\s+pam_faillock.so authfail" }
      - { some: "~ ^account\\s+required\\s+pam_faillock.so" }
    rationale: *rat-c90cf4fd22
    remediation: *rem-cbd7ce4300
  - id: "STIG-AZLX-23-005000-azlx_23_005000_audit_rules_live"
    name: "MEDIUM (Amazon Linux 2023 audit system must protect logon user identifiers (U…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-005000, V-274187, SV-274187r1120715_rule, CAT II. CCI-000172, CCI-000162, CCI-000163, CCI-000164. NIST SP 800-53 Rev. 4: AU-9, AU-12."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      grep -i immutable /etc/audit/audit.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ --loginuid-immutable" }
    rationale: &rat-9982bbaa3e |
      If modification of login UIDs is not prevented, they can be changed by nonprivileged users and make auditing complicated or impossible.
    remediation: &rem-b90e148ade |
      Configure Amazon Linux 2023 auditing to prevent modification of login UIDs once they are set by adding the following line to /etc/audit/rules.d/audit.rules:

      --loginuid-immutable

      To load the rules to the kernel immediately, use the following command:

      $ sudo augenrules --load
  - id: "STIG-AZLX-23-002020-azlx_23_002020_check_audit_data_path"
    name: "LOW (Amazon Linux 2023 must use a separate file system for the system audi…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002020, V-274068, SV-274068r1120192_rule, CAT III. CCI-001849. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-amazon2023, stig-cat-3]
    severity: low
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/var/log/audit'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: &rat-9e762e5b57 |
      Placing "/var/log/audit" in its own partition enables better separation between audit files and other system files and helps ensure that auditing cannot be halted due to the partition running out of space.
    remediation: &rem-ba4fb9c336 |
      Configure Amazon Linux 2023 to have a separate file system/partition for the system audit data path.

      Migrate the system audit data path onto a separate partition.
  - id: "STIG-AZLX-23-002080-azlx_23_002080_check_syslog_upload-attrs"
    name: "LOW (/etc/systemd/journal-upload.conf: exists)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002080, V-274080, SV-274080r1120228_rule, CAT III. CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-amazon2023, stig-cat-3]
    severity: low
    run: |
      f='/etc/systemd/journal-upload.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: *rat-0bb253af2a
    remediation: &rem-99bc318be8 |
      Configure Amazon Linux 2023 to off-load audit records onto a different system or media from the system being audited.

      If using systemd-journal-upload:
      Edit "/etc/systemd/journal-upload.conf" with the appropriate configuration:

      [Upload]
      URL=https://[server.domain]:[port]
  - id: "STIG-AZLX-23-002080-azlx_23_002080_check_syslog_upload-content"
    name: "LOW (/etc/systemd/journal-upload.conf has the expected content (4 rules))"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002080, V-274080, SV-274080r1120228_rule, CAT III. CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-amazon2023, stig-cat-3]
    severity: low
    run: |
      cat '/etc/systemd/journal-upload.conf'
    allow_rc: any
    expect:
      - { some: "~ TrustedCertificateFile=/etc/ssl/ca/trusted.pem" }
      - { some: "~ ServerCertificateFile=/etc/ssl/certs/syslog.pem" }
      - { some: "~ ServerKeyFile=/etc/ssl/private/syslog.pem" }
      - { some: "~ URL=syslog+tcp://127.0.0.1:514" }
    rationale: *rat-0bb253af2a
    remediation: *rem-99bc318be8
  - id: "STIG-AZLX-23-002395-azlx_23_002395_maxlogins_security"
    name: "LOW (Amazon Linux 2023 must limit the number of concurrent sessions to ten…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002395, V-274141, SV-274141r1120411_rule, CAT III. CCI-000054. NIST SP 800-53 Rev. 4: AC-10."
    tags: [stig, stig-amazon2023, stig-cat-3]
    severity: low
    run: |
      grep -r -s '^[^#].*maxlogins' /etc/security/limits.conf /etc/security/limits.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*:\\* hard maxlogins (10|[1-9])" }
    rationale: &rat-eaba9cbabd |
      Operating system management includes the ability to control the number of users and user sessions that utilize an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the risks related to denial-of-service (DoS) attacks.

      This requirement addresses concurrent sessions for information system accounts and does not address concurrent sessions by single users via multiple system accounts. The maximum number of concurrent sessions should be defined based on mission needs and the operational environment for each system.
    remediation: &rem-c04090c43d |
      Configure Amazon Linux 2023 to limit the number of concurrent sessions to "10" for all accounts and/or account types.

      Add the following line to the top of the /etc/security/limits.conf or in a ".conf" file defined in /etc/security/limits.d/:

      * hard maxlogins 10
