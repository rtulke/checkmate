    severity: medium
    run: |
      f='/var/log/audit'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -d "$f" ] || echo "$f is not a directory"
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
    expect: empty
    rationale: *rat-99e43cda38
    remediation: &rem-c93c731b71 |
