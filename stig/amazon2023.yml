  - id: "STIG-AZLX-23-001286-bind_installed_check"
    name: "HIGH (Amazon Linux 2023 must implement DoW-approved encryption in the bind …)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001286, V-283440, SV-283440r1261408_rule, CAT I. CCI-002418. NIST SP 800-53 Rev. 4: SC-8."
    tags: [stig, stig-amazon2023, stig-cat-1]
