  - id: "STIG-AZLX-23-001215-azlx_23_001215_config"
    name: "MEDIUM (Amazon Linux 2023 SSH daemon must not allow Generic Security Service …)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001215, V-274044, SV-274044r1120120_rule, CAT II. CCI-001813. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      grep -E "GSSAPIAuthentication" /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ GSSAPIAuthentication no" }
      - { none: "~ (?i)^GSSAPIAuthentication yes" }
    rationale: &rat-07736a7884 |
      GSSAPI authentication is used to provide additional authentication mechanisms to applications. Allowing GSSAPI authentication through SSH exposes the system's GSSAPI to remote hosts, increasing the attack surface of the system.
    remediation: &rem-1fe18c0ff5 |
      Configure Amazon Linux 2023 so that the SSH daemon does not allow GSSAPI authentication.

      Add or uncomment the following line to "/etc/ssh/sshd_config" or to a file in "/etc/ssh/sshd_config.d" and set the value to "no":

      GSSAPIAuthentication no

      The SSH service must be restarted for changes to take effect:

      $ sudo systemctl restart sshd.service
  - id: "STIG-AZLX-23-001220-azlx_23_001220_config"
    name: "MEDIUM (Amazon Linux 2023 SSH daemon must not allow Kerberos authentication.)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001220, V-274045, SV-274045r1120123_rule, CAT II. CCI-001813. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      grep -i Kerberos  /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:KerberosAuthentication no" }
      - { none: "~ (^?i)KerberosAuthentication yes" }
    rationale: &rat-0d0464f6ba |
      Kerberos authentication for SSH is often implemented using Generic Security Service Application Program Interface (GSSAPI). If Kerberos is enabled through SSH, the SSH daemon provides a means of access to the system's Kerberos implementation. Vulnerabilities in the system's Kerberos implementations may be subject to exploitation.
    remediation: &rem-9bead8c62f |
      Configure Amazon Linux 2023 so that the SSH daemon does not allow Kerberos authentication.

      Add the following line in "/etc/ssh/sshd_config" or to a file in "/etc/ssh/sshd_config.d" or uncomment the line and set the value to "no":

      KerberosAuthentication no

      The SSH service must be restarted for changes to take effect:

      $ sudo systemctl restart sshd.service
  - id: "STIG-AZLX-23-001230-azlx_23_001230_config"
    name: "MEDIUM (Amazon Linux 2023 SSHD must accept public key authentication.)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001230, V-274047, SV-274047r1261407_rule, CAT II. CCI-000765, CCI-000766. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      grep -i PubkeyAuthentication /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*:PubkeyAuthentication yes" }
      - { none: "~ (?i)^PubkeyAuthentication no" }
    rationale: &rat-39f8c7d3fc |
      Without the use of multifactor authentication, the ease of access to privileged functions is greatly increased.

      Multifactor authentication requires using two or more factors to achieve authentication.

      Factors include:
      1. Something a user knows (e.g., password/PIN);
      2. Something a user has (e.g., cryptographic identification device, token); and
      3. Something a user is (e.g., biometric).

      A privileged account is defined as an information system account with authorizations of a privileged user.

      Network access is defined as access to an information system by a user (or a process acting on behalf of a user) communicating through a network (e.g., local area network, wide area network, or the internet).

      The DoW common access card (CAC) with DoW-approved PKI is an example of multifactor authentication.
    remediation: &rem-d0460d792e |
      Configure Amazon Linux 2023 to use public key authentication for SSHD by adding or modifying the following line in "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d".

      PubkeyAuthentication yes

      Restart the SSH daemon for the settings to take effect:

      $ sudo systemctl restart sshd.service
  - id: "STIG-AZLX-23-001235-azlx_23_001235_config"
    name: "MEDIUM (Amazon Linux 2023 SSHD must not allow blank passwords.)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001235, V-274048, SV-274048r1120132_rule, CAT II. CCI-000766, CCI-000366. NIST SP 800-53 Rev. 4: CM-6, IA-2."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      grep -E "PermitEmptyPasswords" /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*:PermitEmptyPasswords no" }
      - { none: "~ (?i)^PermitEmptyPasswords yes" }
    rationale: &rat-e26e5054d0 |
      If an account has an empty password, anyone could log on and run commands with the privileges of that account. Accounts with empty passwords must never be used in operational environments.
    remediation: &rem-4f29c79551 |
      Configure Amazon Linux 2023 to prevent SSH users from logging on with blank passwords.

      Edit the following line in "etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d":

      PermitEmptyPasswords no

      Restart the SSH daemon for the settings to take effect:

      $ sudo systemctl restart sshd.service
  - id: "STIG-AZLX-23-001240-azlx_23_001240_config"
    name: "MEDIUM (Amazon Linux 2023 must not permit direct logons to the root account u…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001240, V-274049, SV-274049r1120747_rule, CAT II. CCI-004045. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      grep -E "PermitRootLogin" /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*:PermitRootLogin no" }
      - { none: "~ (?i)^PermitRootLogin yes" }
    rationale: &rat-d76afa31e3 |
      To ensure individual accountability and prevent unauthorized access, organizational users must be individually identified and authenticated. Additionally, an additional layer of security is gained by extending the policy of not logging directly on as root, even though the communications channel may be encrypted.

      A group authenticator is a generic account used by multiple individuals. Use of a group authenticator alone does not uniquely identify individual users. Examples of the group authenticator are the Unix OS "root" user account, the Windows "Administrator" account, the "sa" account, or a "helpdesk" account.

      For example, the Unix and Windows operating systems offer a "switch user" capability allowing users to authenticate with their individual credentials and, when needed, switch" to the administrator role. This method provides for unique individual authentication prior to using a group authenticator.

      Users (and any processes acting on behalf of users) need to be uniquely identified and authenticated for all accesses other than those accesses explicitly identified and documented by the organization, which outlines specific user actions that can be performed on Amazon Linux 2023 without identification or authentication.

      Requiring individuals to be authenticated with an individual authenticator prior to using a group authenticator allows for traceability of actions, as well as adding an additional level of protection of the actions that can be taken with group account knowledge.
    remediation: &rem-e99b31f721 |
      Configure Amazon Linux 2023 to prevent SSH users from logging on directly as root add or modify the following line in "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d".

      PermitRootLogin no

      Restart the SSH daemon for the settings to take effect:

      $ sudo systemctl restart sshd.service
  - id: "STIG-AZLX-23-001245-azlx_23_001245_config"
    name: "MEDIUM (Amazon Linux 2023 must be configured so that all network connections …)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001245, V-274050, SV-274050r1120138_rule, CAT II. CCI-001133, CCI-002361, CCI-002891. NIST SP 800-53 Rev. 4: SC-10, AC-12, MA-4."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      grep -i ClientAliveInterval /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:ClientAliveInterval (600|[1-5][0-9]{2,}|[3-5][0-9])" }
      - { none: "~ (?i)^ClientAliveInterval ([1-5][0-9]{2,}|[3-5][0-9])" }
    rationale: &rat-d3373c21d1 |
      Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel to take control of a management session enabled on the console or console port that has been left unattended. In addition, quickly terminating an idle session will also free up resources committed by the managed network element.

      Terminating network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port pairs at Amazon Linux 2023 level, and de-allocating networking assignments at the application level if multiple application sessions are using a single operating system-level network connection. This does not mean that Amazon Linux 2023 terminates all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
    remediation: &rem-1549f2c3ce |
      Configure Amazon Linux 2023 SSH server to terminate a user session automatically after the SSH client has been unresponsive for 10 minutes.

      Note: This setting must be applied in conjunction with "ClientAliveCountMax 1" to function correctly.

      Modify or append the following lines in the "/etc/ssh/sshd_config" or a dropfile in "/etc/ssh/sshd_config.d" file:

      ClientAliveInterval 600

      For the changes to take effect, the SSH daemon must be restarted.

      $ sudo systemctl restart sshd.service
  - id: "STIG-AZLX-23-001250-azlx_23_001250_config"
    name: "MEDIUM (Amazon Linux 2023 must be configured so that all network connections …)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001250, V-274051, SV-274051r1120141_rule, CAT II. CCI-001133, CCI-002361. NIST SP 800-53 Rev. 4: SC-10, AC-12."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      grep -i "ClientAliveCountMax" /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:ClientAliveCountMax (1|[2-9]|[1-9][0-9])" }
      - { none: "~ (?i)ClientAliveCountMax ([2-9]|[1-9][0-9])$" }
    rationale: *rat-d3373c21d1
    remediation: &rem-2d1f285a05 |
      Configure Amazon Linux 2023 SSHD to terminate a user session automatically after the SSH client has become unresponsive.

      Note: This setting must be applied in conjunction with AZLX-23-000820 to function correctly.

      Modify or append the following lines in the "/etc/ssh/sshd_config" file or a dropfile in "/etc/ssh/sshd_config.d":

      ClientAliveCountMax 1

      For the changes to take effect, the SSH daemon must be restarted.

      $ sudo systemctl restart sshd.service
  - id: "STIG-AZLX-23-001290-azlx_23_001290_check"
    name: "MEDIUM (Amazon Linux 2023 must enable certificate-based smart card authentica…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001290, V-274059, SV-274059r1261409_rule, CAT II. CCI-004046, CCI-004047. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      grep -ir pam_cert_auth /etc/sssd/sssd.conf /etc/sssd/conf.d/
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:pam_cert_auth = True" }
      - { none: "~ (?i)^pam_cert_auth = False" }
    rationale: *rat-053efa3888
    remediation: &rem-6d2e9a2efe |
      Configure Amazon Linux 2023 to have smart cards enabled in SSSD.

      Edit the file "/etc/sssd/sssd.conf" or a configuration file in "/etc/sssd/conf.d" and add or edit the following line:

      pam_cert_auth = True
  - id: "STIG-AZLX-23-001295-azlx_23_001295_check"
    name: "MEDIUM (Amazon Linux 2023 must map the authenticated identity to the user or …)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001295, V-274060, SV-274060r1120168_rule, CAT II. CCI-000187. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      grep -ir ldap_user_certificate /etc/sssd/sssd.conf /etc/sssd/conf.d/
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ldap_user_certificate" }
    rationale: &rat-331e61680e |
      Without mapping the certificate used to authenticate to the user account, the ability to determine the identity of the individual user or group will not be available for forensic analysis.
    remediation: &rem-c9cde76dbb |
      Configure Amazon Linux 2023 to map the authenticated identity to the user or group account by adding or modifying the certmap section of the "/etc/sssd/sssd.conf file based on the following example:

      [certmap/testing.test/rule_name]
      matchrule =<SAN>.*EDIPI@mil
      maprule = (userCertificate;binary={cert!bin})
      domains = testing.test

      The "sssd" service must be restarted for the changes to take effect. To restart the "sssd" service, run the following command:

      $ sudo systemctl restart sssd.service
  - id: "STIG-AZLX-23-001300-azlx_23_001300_config"
    name: "MEDIUM (Amazon Linux 2023 must implement certificate status checking for mult…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001300, V-274061, SV-274061r1261411_rule, CAT II. CCI-001954, CCI-004046. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      grep -ir certificate_verification /etc/sssd/sssd.conf /etc/sssd/conf.d/ | grep -v "^#"
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^certificate_verification = ocsp_dgst=sha512" }
    rationale: &rat-8fe568db94 |
      Using an authentication device, such as a DoW common access card (CAC) or token that is separate from the information system, ensures that even if the information system is compromised, credentials stored on the authentication device will not be affected.

      Multifactor solutions that require devices separate from information systems gaining access include, for example, hardware tokens providing time-based or challenge-response authenticators and smart cards such as the U.S. Government Personal Identity Verification (PIV) card and the DoW CAC.

      Amazon Linux 2023 includes multiple options for configuring certificate status checking, but for this requirement focuses on the System Security Services Daemon (SSSD). By default, SSSD performs Online Certificate Status Protocol (OCSP) checking and certificate verification using a sha256 digest function.
    remediation: &rem-04ce8cd641 |
      Configure Amazon Linux 2023 to implement certificate status checking for multifactor authentication.

      Review the "/etc/sssd/conf.d/certificate_verification.conf" file to determine if the system is configured to prevent OCSP or certificate verification.

      Add the following line to the "/etc/sssd/conf.d/certificate_verification.conf" file:

      certificate_verification = ocsp_dgst=sha512

      Set the correct ownership and permissions on the "/etc/sssd/conf.d/certificate_verification.conf" file by running these commands:

      $ sudo chown root:root "/etc/sssd/conf.d/certificate_verification.conf"
      $ sudo chmod 600 "/etc/sssd/conf.d/certificate_verification.conf"

      The "sssd" service must be restarted for the changes to take effect. To restart the "sssd" service, run the following command:

      $ sudo systemctl restart sssd.service
  - id: "STIG-AZLX-23-001305-azlx_23_001305_config"
    name: "MEDIUM (Amazon Linux 2023 must prohibit the use of cached authenticators afte…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001305, V-274062, SV-274062r1120174_rule, CAT II. CCI-002007. NIST SP 800-53 Rev. 4: NIST800_53R4_IA-5."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      grep -ir _credentials /etc/sssd/sssd.conf /etc/sssd/conf.d/ | grep -v "^#"
    allow_rc: any
