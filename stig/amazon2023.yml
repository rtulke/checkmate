  - id: "STIG-AZLX-23-001060-aide"
    name: "MEDIUM (Amazon Linux 2023 must have the Advanced Intrusion Detection Environm…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001060, V-274024, SV-274024r1190697_rule, CAT II. CCI-001744, CCI-002696, CCI-001889. NIST SP 800-53 Rev. 4: CM-3, SI-6, AU-8."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet aide
    expect: true
    rationale: &rat-f61b52e9d5 |
      If security functions are not verified, they may not operate correctly and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.
    remediation: &rem-68582f7caf |
      Configure Amazon Linux 2023 to have the AIDE package installed.

      Install AIDE:

      $ sudo dnf install -y aide

      Initialize AIDE:

      $ sudo /usr/sbin/aide --init

      The new database must be renamed to be read by AIDE:

      $ sudo mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz

      Perform a manual check:

      $ sudo /usr/sbin/aide --check
      Example output:

      2023-06-05 10:16:08 -0600 (AIDE 0.16)
      AIDE found NO differences between database and filesystem. Looks okay!!
  - id: "STIG-AZLX-23-001065-azlx_23_001065_config-attrs"
    name: "MEDIUM (/etc/cron.d/aide: exists)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001065, V-274025, SV-274025r1192649_rule, CAT II. CCI-001744, CCI-002699, CCI-002702. NIST SP 800-53 Rev. 4: CM-3, SI-6, AU-8."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      f='/etc/cron.d/aide'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-5fb5882999 |
      Unauthorized changes to the baseline configuration could make the system vulnerable to various attacks or allow unauthorized access to Amazon Linux 2023. Changes to operating system configurations can have unintended side effects, some of which may be relevant to security.

      Detecting such changes and providing an automated response can help avoid unintended, negative consequences that could ultimately affect the security state of Amazon Linux 2023. Amazon Linux 2023's information management officer (IMO)/information system security officer (ISSO), and SAs must be notified via email and/or monitoring system trap when there is an unauthorized modification of a configuration item.

      Notifications provided by information systems include messages to local computer consoles and/or hardware indications, such as lights.

      This must account for operational requirements for availability for selecting an appropriate response. The organization may choose to shut down or restart the information system upon detecting a security function anomaly.

      In Amazon Linux 2023, cronie is not included by default. Therefore, support for crontab is no longer provided by default. AWS recommends migrating to systemd timers for this functionality.
    remediation: &rem-574d7e4c7c |
      Configure Amazon Linux 2023 so the file integrity tool runs automatically on the system at least weekly and notifies designated personnel if baseline configurations are changed in an unauthorized manner. The AIDE tool can be configured to email designated personnel using either the crond service or systemd timers.

      If using cron, ensure the cronie package is installed and enabled:

      $ sudo dnf install cronie
      $ sudo systemctl enable crond
      $ sudo systemctl start crond

      The following example output is generic. It will set cron to run AIDE daily and to send an email upon completion of the analysis:

      $ sudo more /etc/cron.daily/aide
      #!/bin/bash
      /usr/sbin/aide --check | /bin/mail -s "$HOSTNAME - Daily aide integrity check run" root@sysname.mil

      If using systemd timers, create the file "/etc/systemd/system/aid.service" to run the "aide --check" command:

      [Unit]
      Description=Aide Check
      [Service]
      Type=simple
      ExecStart=/usr/sbin/aide --check | /bin/mail -s "$HOSTNAME - Daily aide integrity check run"
      [Install]
      WantedBy=multi-user.target

      Create the file "/etc/systemd/system/aide.timer" to run the AIDE check service at a specified time. The example below runs "aide --check" at 1:00 a.m. every day:

      [Unit]
      Description=Aide check every day at 1AM
      [Timer]
      OnCalendar=*-*-* 01:00:00
      Unit=aide.service
      [Install]
      WantedBy=timers.target

      Reload systemd:

      $ sudo systemctl daemon-reload

      Enabling the service will ensure the "aide --check" service will also start at boot time:

      $ sudo systemctl enable aide.service

      Start the timer:

      $ sudo systemctl --now enable aide.timer
  - id: "STIG-AZLX-23-001065-azlx_23_001065_config-content"
    name: "MEDIUM (/etc/cron.d/aide has the expected content (1 rule))"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001065, V-274025, SV-274025r1192649_rule, CAT II. CCI-001744, CCI-002699, CCI-002702. NIST SP 800-53 Rev. 4: CM-3, SI-6, AU-8."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/cron.d/aide'
    allow_rc: any
    expect: { some: "~ ^\\/usr\\/sbin\\/aide --check \\| \\/bin\\/mail -s \\\"\\$HOSTNAME - Daily aide integrity check run\\\" .*@.*" }
    rationale: *rat-5fb5882999
    remediation: *rem-574d7e4c7c
  - id: "STIG-AZLX-23-001065-azlx_23_001065_check"
    name: "MEDIUM (Amazon Linux 2023 must routinely check the baseline configuration for…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001065, V-274025, SV-274025r1192649_rule, CAT II. CCI-001744, CCI-002699, CCI-002702. NIST SP 800-53 Rev. 4: CM-3, SI-6."
