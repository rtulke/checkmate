  - id: "STIG-AZLX-23-002225-azlx_23_002225_file-attrs"
    name: "MEDIUM (Amazon Linux 2023 audit logs must be group-owned by root or by a rest…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002225, V-274108, SV-274108r1120312_rule, CAT II. CCI-000162, CCI-000163, CCI-000164, CCI-001314. NIST SP 800-53 Rev. 4: AU-9, SI-11."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      f='/var/log/audit/audit.log'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-99e43cda38 |
      Unauthorized disclosure of audit records can reveal system and configuration data to attackers, thus compromising its confidentiality.

      Audit information includes all information (e.g., audit records, audit settings, audit reports) needed to successfully audit operating system activity.
    remediation: &rem-6962664c8a |
      Configure Amazon Linux 2023 so that audit logs are group-owned by "root" or a restricted logging group.

      Change the group of the directory of "/var/log/audit" to be owned by a correct group.

      Identify the group that is configured to own audit log:

      $ sudo grep -P '^[ ]*log_group[ ]+=.*$' /etc/audit/auditd.conf

      Change the ownership to that group:

      $ sudo chgrp ${GROUP} /var/log/audit
  - id: "STIG-AZLX-23-002230-azlx_23_002230_file-attrs"
