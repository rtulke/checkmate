    name: "HIGH (Amazon Linux 2023 local disk partitions must implement cryptographic …)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-000100, V-273994, SV-273994r1119970_rule, CAT I. CCI-001199, CCI-002475, CCI-002476. NIST SP 800-53 Rev. 4: SC-28."
