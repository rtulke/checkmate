  - id: "STIG-AZLX-23-000050-fips_enabled_000050"
    name: "HIGH (Amazon Linux 2023 must enable FIPS mode.)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-000050, V-283441, SV-283441r1192638_rule, CAT I. CCI-000068. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-amazon2023, stig-cat-1]
    severity: high
    run: |
      fips-mode-setup --check
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ FIPS mode is enabled." }
      - { none: "~ FIPS mode is disabled." }
      - { none: "~ Inconsistent state detected." }
    rationale: &rat-2e4890efb8 |
      Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data. The operating system must implement cryptographic modules adhering to the higher standards approved by the federal government since this provides assurance they have been tested and validated. This includes NIST FIPS-validated cryptography for the following: Provisioning digital signatures, generating cryptographic hashes, and to protect data requiring data-at-rest protections in accordance with applicable federal laws, Executive Orders, directives, policies, regulations, and standards.
    remediation: &rem-a49befe3f9 |
      Configure the Amazon Linux 2023 to implement FIPS mode with the following command:

      $ sudo fips-mode-setup --enable

      To ensure the kernel enables FIPS mode for early boot, "fips=1" must be added to the grub config:
      $ sudo grubby --update-kernel=ALL --args="fips=1"

      Verify the setting with the following command:
      $ cat /proc/cmdline
      BOOT_IMAGE=(hd0,gpt2)/vmlinuz-5.14.0-570.21.1.el9_6.x86_64 root=/dev/mapper/rhel-root ro resume=/dev/mapper/rhel-swap rd.luks.uuid=luks-cd37eb8d-a2c3-4671-96ee-1e6a3a681561 rd.lvm.lv=rhel/root rd.lvm.lv=rhel/swap rhgb quiet fips=1 boot=UUID=acbbb4ee-adc0-4cb2-9546-afab857b8849 audit_backlog_limit=8192 crashkernel=1G-4G:192M,4G-64G:256M,64G-:512M

      Reboot the system for the changes to take effect.
