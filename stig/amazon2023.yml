  - id: "STIG-AZLX-23-002110-azlx_23_002110_audit_rules_conf"
    name: "MEDIUM (Amazon Linux 2023 must audit uses of the \"execve\" system call.)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-002110, V-274086, SV-274086r1120246_rule, CAT II. CCI-002233, CCI-002234. NIST SP 800-53 Rev. 4: AC-6, AC-7."
