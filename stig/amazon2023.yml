  - id: "STIG-AZLX-23-001310-azlx_23_001310_check"
    name: "MEDIUM (Amazon Linux 2023, for PKI-based authentication, must validate certif…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001310, V-274063, SV-274063r1261413_rule, CAT II. CCI-000185, CCI-002470, CCI-004068, CCI-004909. NIST SP 800-53 Rev. 4: IA-5, SC-23."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      openssl x509 -text -in /etc/sssd/pki/sssd_auth_ca_db.pem
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ True" }
    rationale: &rat-4a3db436c8 |
      Without path validation, an informed trust decision by the relying party cannot be made when presented with any certificate not already explicitly trusted.

      A trust anchor is an authoritative entity represented via a public key and associated data. It is used in the context of public key infrastructures, X.509 digital certificates, and DNSSEC.

      When there is a chain of trust, usually the top entity to be trusted becomes the trust anchor; it can be, for example, a certification authority (CA). A certification path starts with the subject certificate and proceeds through a number of intermediate certificates up to a trusted root certificate, typically issued by a trusted CA.

      This requirement verifies that a certification path to an accepted trust anchor is used for certificate validation and that the path includes status information. Path validation is necessary for a relying party to make an informed trust decision when presented with any certificate not already explicitly trusted. Status information for certification paths includes certificate revocation lists or online certificate status protocol responses. Validation of the certificate status information is out of scope for this requirement.
    remediation: &rem-70fd185fca |
      Configure Amazon Linux 2023 to have valid certificates by using AWS Certificate Manager (ACM) or another certificate manager to manage SSL/TLS certificates.

      In the AWS Management Console, request or import the necessary SSL/TLS certificates into ACM.

      ACM will handle the certificate lifecycle management, including validation and trust chain establishment.
  - id: "STIG-AZLX-23-001315-azlx_23_001315_check"
    name: "MEDIUM (Amazon Linux 2023, for PKI-based authentication, must enforce authori…)"
    description: "DISA STIG for Amazon Linux 2023, AZLX-23-001315, V-274064, SV-274064r1120180_rule, CAT II. CCI-000186. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-amazon2023, stig-cat-2]
    severity: medium
    run: |
      error_found=0
      while IFS= read -r -d '' keyfile; do
        if output=$(ssh-keygen -y -P "" -f "$keyfile" 2>/dev/null) && [ -n "$output" ]; then
          echo "ERROR: Unprotected private key found: $keyfile" >&2
          error_found=1
        fi
      done < <(find /home/*/.ssh /root/.ssh /etc/ssh -type f ! -name "*.pub" ! -name "known_hosts" ! -name "authorized_keys" ! -name "config" ! -name "*.bak" -print0 2>/dev/null)
      exit $error_found
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ERROR: Unprotected private key found: " }
    rationale: &rat-1804dd3ce2 |
      If the private key is discovered, an attacker can use the key to authenticate as an authorized user and gain access to the network infrastructure.

      The cornerstone of the PKI is the private key used to encrypt or digitally sign information.

      If the private key is stolen, this will lead to the compromise of the authentication and nonrepudiation gained through PKI because the attacker can use the private key to digitally sign documents and pretend to be the authorized user.

      Both the holders of a digital certificate and the issuing authority must protect the computers, storage devices, or whatever they use to keep the private keys.
    remediation: &rem-e08f7837ac |
      Configure Amazon Linux 2023 SSH private key files to have a passcode.

      Create a new private and public key pair that utilizes a passcode with the following command:

      $ sudo ssh-keygen -n [passphrase]
