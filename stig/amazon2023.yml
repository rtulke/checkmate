    allow_rc: any
    expect:
      - { some: "~ \\/usr\\/sbin\\/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512" }
      - { some: "~ \\/usr\\/sbin\\/auditd p+i+n+u+g+s+b+acl+xattrs+sha512" }
      - { some: "~ \\/usr\\/sbin\\/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512" }
