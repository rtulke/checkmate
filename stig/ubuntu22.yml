    remediation: *rem-9ae82d7eb9
  - id: "STIG-UBTU-22-612025-ocsp_on_pki_required"
    name: "Ubuntu 22.04 LTS must electronically verify personal identity verification (PIV) credentials."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-612025, V-260576, SV-260576r1268244_rule, CAT II. CCI-001954. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      awk '/pkcs11_module opensc {/,/}/' /etc/pam_pkcs11/pam_pkcs11.conf | grep -E '^\s*cert_policy\s*=' | awk '{ print ($0 ~ /=[ \t]*([^;#]*,)?[ \t]*ocsp_on[ \t]*(,|;)/ ? "ocsp_on_present " : "ocsp_on_missing ") $0 }'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^ocsp_on_present " }
      - { none: "~ ^ocsp_on_missing " }
    rationale: *rat-70178fccee
    remediation: &rem-ce89b97a60 |
      Configure Ubuntu 22.04 LTS to do certificate status checking for multifactor authentication.

      Add or modify all "cert_policy" lines in the "/etc/pam_pkcs11/pam_pkcs11.conf" file with the following:

      ocsp_on
  - id: "STIG-UBTU-22-612030-ca_pki_required"
    name: "Ubuntu 22.04 LTS, for PKI-based authentication, must validate certificates by constructing a certification path (which includes status information) to an accepted trust anchor."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-612030, V-260577, SV-260577r1069112_rule, CAT II. CCI-000185, CCI-004909. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      grep use_pkcs11_module /etc/pam_pkcs11/pam_pkcs11.conf | awk '/pkcs11_module opensc {/,/}/' /etc/pam_pkcs11/pam_pkcs11.conf | grep cert_policy | grep ca
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^\\s*cert_policy\\s*=\\s*([^;#]*,)?ca(,[^;]*)?;" }
    rationale: *rat-4a3db436c8
    remediation: &rem-f4118610fb |
      Configure Ubuntu 22.04 LTS, for PKI-based authentication, to validate certificates by constructing a certification path to an accepted trust anchor.

      Add or modify all "cert_policy" lines in the "/etc/pam_pkcs11/pam_pkcs11.conf" file with the following:

      cert_policy = ca,signature,ocsp_on;

      Note: If the system is missing an "/etc/pam_pkcs11/" directory and an "/etc/pam_pkcs11/pam_pkcs11.conf", find an example to copy into place and modify accordingly at "/usr/share/doc/libpam-pkcs11/examples/pam_pkcs11.conf.example.gz".
  - id: "STIG-UBTU-22-612035-crl_pki_required"
    name: "Ubuntu 22.04 LTS for PKI-based authentication, must implement a local cache of revocation data in case of the inability to access revocation information via the network."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-612035, V-260578, SV-260578r1015021_rule, CAT II. CCI-001991, CCI-004068. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      grep cert_policy /etc/pam_pkcs11/pam_pkcs11.conf | grep -E -- 'crl_auto|crl_offline'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^\\s*cert_policy\\s*=\\s*([^;#]*,)?crl_(auto|offline)(,[^;]*)?;" }
    rationale: &rat-c7fca717fc |
      Without configuring a local cache of revocation data, there is the potential to allow access to users who are no longer authorized (users with revoked certificates).
    remediation: &rem-3eae3dba42 |
      Configure Ubuntu 22.04 LTS, for PKI-based authentication, to use local revocation data when unable to access the network to obtain it remotely.

      Add or update the "cert_policy" option in "/etc/pam_pkcs11/pam_pkcs11.conf" to include "crl_auto" or "crl_offline".

      cert_policy = ca,signature,ocsp_on, crl_auto;

      If the system is missing an "/etc/pam_pkcs11/" directory and an "/etc/pam_pkcs11/pam_pkcs11.conf", find an example to copy into place and modify accordingly at "/usr/share/doc/libpam-pkcs11/examples/pam_pkcs11.conf.example.gz".
  - id: "STIG-UBTU-22-631010-dod_certs"
    name: "Ubuntu 22.04 LTS must use DoW PKI-established certificate authorities for verification of the establishment of protected sessions."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-631010, V-260580, SV-260580r1268247_rule, CAT II. CCI-002470. NIST SP 800-53 Rev. 4: SC-23."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      ls /etc/ssl/certs | grep -iE 'dod|(^|[^a-z])dow([^a-z]|$)'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (?i)(dod|(^|[^a-z])dow([^a-z]|$))" }
    rationale: &rat-f6bc788227 |
      Untrusted certificate authorities (CA) can issue certificates, but they may be issued by organizations or individuals that seek to compromise DoW systems or by organizations with insufficient security controls. If the CA used for verifying the certificate is not a DoW-approved CA, trust of this CA has not been established.

      The DoW will only accept PKI-certificates obtained from a DoW-approved internal or external certificate authority. Reliance on CAs for the establishment of secure sessions includes, for example, the use of SSL/TLS certificates.
    remediation: &rem-6c11ac5b9c |
      Configure Ubuntu 22.04 LTS to use of DoW PKI-established certificate authorities for verification of the establishment of protected sessions.

      Add at least one DoW certificate authority to the "/usr/share/ca-certificates" directory in the CRT format.

      Update the "/etc/ssl/certs" directory by using the following command:

           $ sudo dpkg-reconfigure ca-certificates
  - id: "STIG-UBTU-22-651010-aide_installed"
    name: "Ubuntu 22.04 LTS must use a file integrity tool to verify correct operation of all security functions."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-651010, V-260582, SV-260582r958944_rule, CAT II. CCI-002696. NIST SP 800-53 Rev. 4: SI-6."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' aide 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-9adf3f0002 |
      Without verification of the security functions, security functions may not operate correctly and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.

      This requirement applies to Ubuntu 22.04 LTS performing security function verification/testing and/or systems and environments that require this functionality.
    remediation: &rem-970dc1484b |
      Install the "aide" package:

           $ sudo apt install aide
  - id: "STIG-UBTU-22-651020-aide_silentreports-attrs"
    name: "Ubuntu 22.04 LTS must notify designated personnel if baseline configurations are changed in an unauthorized manner. The file integrity tool must notify the system administrator when changes to the baseline configuration or anomalies in the operation of any security functions are discovered. (/etc/default/aide: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-651020, V-260584, SV-260584r958794_rule, CAT II. CCI-001744, CCI-002702. NIST SP 800-53 Rev. 4: CM-3, SI-6."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      f='/etc/default/aide'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e2e8e4abfe |
      Unauthorized changes to the baseline configuration could make the system vulnerable to various attacks or allow unauthorized access to the operating system. Changes to operating system configurations can have unintended side effects, some of which may be relevant to security.

      Detecting such changes and providing an automated response can help avoid unintended, negative consequences that could ultimately affect the security state of the operating system. The operating system's IMO/ISSO and SAs must be notified via email and/or monitoring system trap when there is an unauthorized modification of a configuration item.
    remediation: &rem-6954661909 |
      Configure AIDE to notify designated personnel if baseline configurations are changed in an unauthorized manner.

      Add or modify the following line in the "/etc/default/aide" file:

      SILENTREPORTS=no
  - id: "STIG-UBTU-22-651020-aide_silentreports-content"
    name: "Ubuntu 22.04 LTS must notify designated personnel if baseline configurations are changed in an unauthorized manner. The file integrity tool must notify the system administrator when changes to the baseline configuration or anomalies in the operation of any security functions are discovered. (/etc/default/aide has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-651020, V-260584, SV-260584r958794_rule, CAT II. CCI-001744, CCI-002702. NIST SP 800-53 Rev. 4: CM-3, SI-6."
