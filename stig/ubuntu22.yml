  - id: "STIG-UBTU-22-232145-sticky_bit_WW_dirs"
    name: "Ubuntu 22.04 LTS must set a sticky bit on all public directories to prevent unauthorized and unintended information transferred via shared system resources."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-232145, V-260513, SV-260513r1268233_rule, CAT II. CCI-001090. NIST SP 800-53 Rev. 4: SC-4."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $7}' | xargs -I '{}' find '{}' -xdev -type d \( -perm -0002 -a ! -perm -1000 \) 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-71a930bc07 |
      Preventing unauthorized information transfers mitigates the risk of information, including encrypted representations of information, produced by the actions of prior users/roles (or the actions of processes acting on behalf of prior users/roles) from being available to any current users/roles (or current processes) that obtain access to shared system resources (e.g., registers, main memory, hard disks) after those resources have been released back to information systems. The control of information in shared resources is also commonly referred to as object reuse and residual information protection.

      This requirement generally applies to the design of an information technology product, but it can also apply to the configuration of particular information system components that are, or use, such products. This can be verified by acceptance/validation processes in DoW or other government agencies.

      There may be shared resources with configurable protections (e.g., files in storage) that may be assessed on specific information system components.
    remediation: &rem-1842186aad |
      Configure all public directories to have the sticky bit set to prevent unauthorized and unintended information transferred via shared system resources.

      Set the sticky bit on all public directories using the following command, replacing "<public_directory_name>" with any directory path missing the sticky bit:

           $ sudo chmod +t  <public_directory_name>
  - id: "STIG-UBTU-22-251010-ufw_pkg"
    name: "Ubuntu 22.04 LTS must have an application firewall installed in order to control remote access methods."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-251010, V-260514, SV-260514r1268238_rule, CAT II. CCI-002314. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' ufw 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-5c944b1482 |
      Remote access services, such as those providing remote access to network devices and information systems, which lack automated control capabilities, increase risk and make remote user access management difficult at best.

      Remote access is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      Ubuntu 22.04 LTS functionality (e.g., RDP) must be capable of taking enforcement action if the audit reveals unauthorized activity. Automated control of remote access sessions allows organizations to ensure ongoing compliance with remote access policies by enforcing connection rules of remote access applications on a variety of information system components (e.g., servers, workstations, notebook computers, smartphones, and tablets).
    remediation: &rem-0645e7ae16 |
      Install the Uncomplicated Firewall by using the following command:

           $ sudo apt-get install ufw
  - id: "STIG-UBTU-22-251015-ufw_service-running"
    name: "Ubuntu 22.04 LTS must enable and run the Uncomplicated Firewall (ufw)."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-251015, V-260515, SV-260515r1268238_rule, CAT II. CCI-002314. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState ufw | cut -d= -f2
    expect: "== active"
    rationale: *rat-5c944b1482
    remediation: &rem-43e4e66770 |
      Enable the ufw by using the following command:

           $ sudo ufw enable
  - id: "STIG-UBTU-22-251020-ufw_enabled-enabled"
    name: "Ubuntu 22.04 LTS must have an application firewall enabled."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-251020, V-260516, SV-260516r1184061_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-ubuntu22, stig-cat-2]
