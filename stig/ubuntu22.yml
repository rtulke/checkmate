      - { none: "~ ^\\s*INACTIVE\\s*=\\s*-1" }
    rationale: *rat-27643871b5
    remediation: *rem-19a3c00d13
  - id: "STIG-UBTU-22-412025-vlock"
    name: "Ubuntu 22.04 LTS must allow users to directly initiate a session lock for all connection types."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-412025, V-260553, SV-260553r1015010_rule, CAT II. CCI-000057, CCI-000058, CCI-000060. NIST SP 800-53 Rev. 4: AC-11."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' vlock 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-b048249d1c |
      A session lock is a temporary action taken when a user stops work and moves away from the immediate physical vicinity of the information system but does not want to log out because of the temporary nature of the absence.

      The session lock is implemented at the point where session activity can be determined. Rather than be forced to wait for a period of time to expire before the user session can be locked, Ubuntu 22.04 LTS need to provide users with the ability to manually invoke a session lock so users may secure their session if they need to temporarily vacate the immediate physical vicinity.
    remediation: &rem-cd2de07de9 |
      Install the "vlock" package by using the following command:

           $ sudo apt-get install vlock
  - id: "STIG-UBTU-22-412030-TMOUT_setting"
    name: "Ubuntu 22.04 LTS must automatically exit interactive command shell user sessions after 15 minutes of inactivity."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-412030, V-260554, SV-260554r958636_rule, CAT II. CCI-002361. NIST SP 800-53 Rev. 4: AC-12."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      grep -E "\bTMOUT=[0-9]+" /etc/bash.bashrc /etc/profile.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^[^:]+:\\s*(export\\s+|readonly\\s+|declare\\s+-[a-z]*\\s+)*TMOUT=([1-9][0-9]?|[1-8][0-9]{2}|900)\\b" }
      - { none: "~ ^[^:]+:\\s*(export\\s+|readonly\\s+|declare\\s+-[a-z]*\\s+)*TMOUT=(0+|90[1-9]|9[1-9][0-9]|[1-9][0-9]{3,})\\b" }
    rationale: &rat-ba669b8e1a |
      Terminating an idle interactive command shell user session within a short time period reduces the window of opportunity for unauthorized personnel to take control of it when left unattended in a virtual terminal or physical console.
    remediation: &rem-0d573997f5 |
      Configure Ubuntu 22.04 LTS to exit interactive command shell user sessions after 15 minutes of inactivity.

      Create and/or append a custom file under "/etc/profile.d/" by using the following command:

           $ sudo su -c "echo TMOUT=900 >> /etc/profile.d/99-terminal_tmout.sh"

      This will set a timeout value of 15 minutes for all future sessions.

      To set the timeout for the current sessions, execute the following command over the terminal session:

           $ export TMOUT=900
  - id: "STIG-UBTU-22-412035-umask_login_defs-attrs"
    name: "Ubuntu 22.04 LTS default filesystem permissions must be defined in such a way that all authenticated users can read and modify only their own files. (/etc/login.defs: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-412035, V-260555, SV-260555r991590_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
