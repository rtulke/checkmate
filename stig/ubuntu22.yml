      systemctl show -p UnitFileState ufw | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-7f1c5b853f |
      Firewalls protect computers from network attacks by blocking or limiting access to open network ports. Application firewalls limit which applications are allowed to communicate over the network.
    remediation: &rem-2158d19d7a |
      Enable the ufw by using the following command:

          $ sudo ufw enable

      Note: Enabling the firewall will potentially disrupt ssh sessions.
  - id: "STIG-UBTU-22-253010-net.ipv4.tcp_syncookies"
    name: "Ubuntu 22.04 LTS must be configured to use TCP syncookies."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-253010, V-260522, SV-260522r1069097_rule, CAT II. CCI-001095. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv4.tcp_syncookies
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-fad7104d85 |
      DoS is a condition when a resource is not available for legitimate users. When this occurs, the organization either cannot accomplish its mission or must operate at degraded capacity.

      Managing excess capacity ensures that sufficient capacity is available to counter flooding attacks. Employing increased capacity and service redundancy may reduce the susceptibility to some DoS attacks. Managing excess capacity may include, for example, establishing selected usage priorities, quotas, or partitioning.
    remediation: &rem-90e97c551a |
      Configure Ubuntu 22.04 LTS to use TCP syncookies by using the following command:

           $ sudo sysctl -w net.ipv4.tcp_syncookies=1

      If "1" is not the system's default value, add or update the following line in "/etc/sysctl.conf":

           net.ipv4.tcp_syncookies = 1
  - id: "STIG-UBTU-22-253010-syncookies_enabled_1"
    name: "Ubuntu 22.04 LTS must be configured to use TCP syncookies."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-253010, V-260522, SV-260522r1069097_rule, CAT II. CCI-001095. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      grep "net\.ipv4\.tcp_syncookies" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^*.conf:net.ipv4.tcp_syncookies\\s*=\\s*1" }
      - { none: "~ ^*.conf:net.ipv4.tcp_syncookies\\s*=\\s*0" }
    rationale: *rat-fad7104d85
    remediation: *rem-90e97c551a
  - id: "STIG-UBTU-22-254010-sssd_pkg"
    name: "Ubuntu 22.04 LTS must have the \"SSSD\" package installed."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-254010, V-274864, SV-274864r1261449_rule, CAT II. CCI-000765, CCI-000766, CCI-004046, CCI-004047. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' sssd 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-a398081fe8 |
      Without the use of multifactor authentication, the ease of access to privileged functions is greatly increased.

      Multifactor authentication requires using two or more factors to achieve authentication.

      Factors include:
      1) Something a user knows (e.g., password/PIN);
      2) Something a user has (e.g., cryptographic identification device, token); and
      3) Something a user is (e.g., biometric).

      A privileged account is defined as an information system account with authorizations of a privileged user.

      Network access is defined as access to an information system by a user (or a process acting on behalf of a user) communicating through a network (e.g., local area network, wide area network, or the internet).

      The DoW common access card (CAC) with DoW-approved PKI is an example of multifactor authentication.
    remediation: &rem-5bb235c5d9 |
      Install the sssd.service and the required pam packages with the following commands:

      $ sudo apt install sssd

      $ sudo apt install libpam-sss

      $ sudo apt install libnss-sss
  - id: "STIG-UBTU-22-254015-sssd_started-enabled"
    name: "Ubuntu 22.04 LTS must use the \"SSSD\" package for multifactor authentication services. (Service sssd is enabled)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-254015, V-274866, SV-274866r1261450_rule, CAT II. CCI-000765, CCI-000766, CCI-004046, CCI-004047. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState sssd | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-a398081fe8
    remediation: &rem-a4ea23548f |
      Enable the "sssd.service to start automatically on reboot with the following command:

      $ sudo systemctl enable sssd.service

