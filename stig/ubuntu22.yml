    rationale: &rat-331e61680e |
      Without mapping the certificate used to authenticate to the user account, the ability to determine the identity of the individual user or group will not be available for forensic analysis.
    remediation: &rem-344d2fb58f |
      Set "use_mappers=pwent" in "/etc/pam_pkcs11/pam_pkcs11.conf" or, if there is already a comma-separated list of mappers, add it to the list, separated by comma, and before the null mapper.

      If the system is missing an "/etc/pam_pkcs11/" directory and an "/etc/pam_pkcs11/pam_pkcs11.conf", find an example to copy into place and modify accordingly at "/usr/share/doc/libpam-pkcs11/examples/pam_pkcs11.conf.example.gz".
  - id: "STIG-UBTU-22-671010-fips_enabled-attrs"
    name: "Ubuntu 22.04 LTS must implement NIST FIPS-validated cryptography to protect classified information and for the following: To provision digital signatures, to generate cryptographic hashes, and to protect unclassified information requiring confidentiality and cryptographic protection in accordance with applicable federal laws, Executive Orders, directives, policies, regulations, and standards. (/proc/sys/crypto/fips_enabled: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-671010, V-260650, SV-260650r987791_rule, CAT I. CCI-002450. NIST SP 800-53 Rev. 4: SC-13."
    tags: [stig, stig-ubuntu22, stig-cat-1]
    severity: high
    run: |
      f='/proc/sys/crypto/fips_enabled'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-07e1f3cc42 |
      Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data. The operating system must implement cryptographic modules adhering to the higher standards approved by the federal government since this provides assurance they have been tested and validated.
    remediation: &rem-2612394295 |
      Configure Ubuntu 22.04 LTS to run in FIPS mode. Add "fips=1" to the kernel parameter during Ubuntu 22.04 LTS install.

      Enabling a FIPS mode on a pre-existing system involves a number of modifications to Ubuntu 22.04 LTS. Refer to the Ubuntu Pro security certification documentation for instructions.

      A subscription to the "Ubuntu Pro" plan is required to obtain the FIPS Kernel cryptographic modules and enable FIPS.

      Note: Ubuntu Pro security certification instructions can be found at: https://ubuntu.com/security/certifications/docs/fips-enablement
  - id: "STIG-UBTU-22-671010-fips_enabled-content"
    name: "Ubuntu 22.04 LTS must implement NIST FIPS-validated cryptography to protect classified information and for the following: To provision digital signatures, to generate cryptographic hashes, and to protect unclassified information requiring confidentiality and cryptographic protection in accordance with applicable federal laws, Executive Orders, directives, policies, regulations, and standards. (/proc/sys/crypto/fips_enabled has the expected content (2 rules))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-671010, V-260650, SV-260650r987791_rule, CAT I. CCI-002450. NIST SP 800-53 Rev. 4: SC-13."
    tags: [stig, stig-ubuntu22, stig-cat-1]
    severity: high
    run: |
      cat '/proc/sys/crypto/fips_enabled'
    allow_rc: any
    expect:
      - { some: "~ 1" }
      - { none: "~ 0" }
    rationale: *rat-07e1f3cc42
    remediation: *rem-2612394295
  - id: "STIG-UBTU-22-212015-default_grub_audit-attrs"
    name: "Ubuntu 22.04 LTS must initiate session audits at system startup. (/etc/default/grub: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-212015, V-260471, SV-260471r1155214_rule, CAT II. CCI-001464. NIST SP 800-53 Rev. 4: AU-14."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-4f20585534 |
      If auditing is enabled late in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state information only available if auditing is enabled before a given process is created.
    remediation: &rem-ef0ab4fa44 |
      Configure Ubuntu 22.04 LTS to produce audit records at system startup.

      Edit the "/etc/default/grub" file and add "audit=1" to the "GRUB_CMDLINE_LINUX" option and to the "GRUB_CMDLINE_LINUX_DEFAULT" option.

      GRUB_CMDLINE_LINUX_DEFAULT="audit=1"
      GRUB_CMDLINE_LINUX="audit=1"

      To update the grub config file, run:

      $ sudo update-grub
  - id: "STIG-UBTU-22-212015-default_grub_audit-content"
    name: "Ubuntu 22.04 LTS must initiate session audits at system startup. (/etc/default/grub has the expected content (2 rules))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-212015, V-260471, SV-260471r1155214_rule, CAT II. CCI-001464. NIST SP 800-53 Rev. 4: AU-14."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect:
      - { some: "~ ^GRUB_CMDLINE_LINUX=\".*audit=1.*\"" }
      - { none: "~ ^GRUB_CMDLINE_LINUX=\".*audit=(0|[2-9]$|[1-9]\\d+)\"" }
    rationale: *rat-4f20585534
    remediation: *rem-ef0ab4fa44
  - id: "STIG-UBTU-22-212015-grub_audit_enabled-attrs"
    name: "Ubuntu 22.04 LTS must initiate session audits at system startup. (/boot/grub/grub.cfg: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-212015, V-260471, SV-260471r1155214_rule, CAT II. CCI-001464. NIST SP 800-53 Rev. 4: AU-14."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      f='/boot/grub/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: *rat-4f20585534
    remediation: *rem-ef0ab4fa44
  - id: "STIG-UBTU-22-212015-grub_audit_enabled-content"
    name: "Ubuntu 22.04 LTS must initiate session audits at system startup. (/boot/grub/grub.cfg has the expected content (2 rules))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-212015, V-260471, SV-260471r1155214_rule, CAT II. CCI-001464. NIST SP 800-53 Rev. 4: AU-14."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      cat '/boot/grub/grub.cfg'
    allow_rc: any
    expect:
      - { some: "~ ^\\s*linux\\s*\\/vmlinuz-.*root=/dev/mapper.*audit=1.*" }
      - { none: "~ ^\\s*linux\\s*\\/vmlinuz-.*root=/dev/mapper.*audit=0.*" }
    rationale: *rat-4f20585534
    remediation: *rem-ef0ab4fa44
  - id: "STIG-UBTU-22-213015-kdump_disable-enabled"
    name: "Ubuntu 22.04 LTS must disable kernel core dumps so that it can fail to a secure state if system initialization fails, shutdown fails or aborts fail. (Service kdump-tools is not enabled)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-213015, V-260473, SV-260473r1155207_rule, CAT II. CCI-001190. NIST SP 800-53 Rev. 4: SC-24."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState kdump-tools | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-7b1d43b72c |
      Kernel core dumps may contain the full contents of system memory at the time of the crash. Kernel core dumps may consume a considerable amount of disk space and may result in denial of service by exhausting the available space on the target file system partition.
    remediation: &rem-68b880c40f |
      If kernel core dumps are not required, disable and mask "kdump-tools.service" by using the following command:

      $ sudo systemctl mask kdump-tools --now

      If kernel core dumps are required, document the need with the ISSO.
  - id: "STIG-UBTU-22-213015-kdump_disable-running"
    name: "Ubuntu 22.04 LTS must disable kernel core dumps so that it can fail to a secure state if system initialization fails, shutdown fails or aborts fail. (Service kdump-tools is not running)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-213015, V-260473, SV-260473r1155207_rule, CAT II. CCI-001190. NIST SP 800-53 Rev. 4: SC-24."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState kdump-tools | cut -d= -f2
    expect: "!= active"
    rationale: *rat-7b1d43b72c
    remediation: *rem-68b880c40f
  - id: "STIG-UBTU-22-213015-kdump_masked"
    name: "Ubuntu 22.04 LTS must disable kernel core dumps so that it can fail to a secure state if system initialization fails, shutdown fails or aborts fail."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-213015, V-260473, SV-260473r1155207_rule, CAT II. CCI-001190. NIST SP 800-53 Rev. 4: SC-24."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      if dpkg-query -W -f='${Status}' kdump-tools 2>/dev/null | grep 'ok installed' >/dev/null; \
      then echo "kdump-tools.service -> $(readlink /etc/systemd/system/kdump-tools.service)"; \
      else echo "kdump-tools not installed"; \
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(kdump-tools\\.service -\u003e \\/dev\\/null|kdump-tools not installed)$" }
    rationale: *rat-7b1d43b72c
    remediation: *rem-68b880c40f
  - id: "STIG-UBTU-22-213020-kernel.randomize_va_space"
    name: "Ubuntu 22.04 LTS must implement address space layout randomization to protect its memory from unauthorized code execution."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-213020, V-260474, SV-260474r958928_rule, CAT II. CCI-002824. NIST SP 800-53 Rev. 4: SC-24."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      sysctl -n kernel.randomize_va_space
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 2"
    rationale: &rat-1cb62fd6bb |
      Some adversaries launch attacks with the intent of executing code in nonexecutable regions of memory or in prohibited memory locations. Security safeguards employed to protect memory include, for example, data execution prevention and address space layout randomization. Data execution prevention safeguards can either be hardware-enforced or software-enforced with hardware providing the greater strength of mechanism.

      Examples of attacks are buffer overflow attacks.
    remediation: &rem-b0fd519e65 |
      Remove the "kernel.randomize_va_space" entry found in the "/etc/sysctl.conf" file or any file located in the "/etc/sysctl.d/" directory.

      Reload the system configuration files for the changes to take effect by using the following command:

           $ sudo sysctl --system
  - id: "STIG-UBTU-22-213020-aslr_enabled_2"
    name: "Ubuntu 22.04 LTS must implement address space layout randomization to protect its memory from unauthorized code execution."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-213020, V-260474, SV-260474r958928_rule, CAT II. CCI-002824. NIST SP 800-53 Rev. 4: SC-24."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      grep "kernel\.randomize_va_space" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^*.conf:kernel.randomize_va_space\\s*=\\s*2" }
      - { none: "~ ^*.conf:kernel.randomize_va_space\\s*=\\s*[0,1]" }
    rationale: *rat-1cb62fd6bb
    remediation: *rem-b0fd519e65
  - id: "STIG-UBTU-22-213025-NX_cpu_capable"
    name: "Ubuntu 22.04 LTS must implement nonexecutable data to protect its memory from unauthorized code execution."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-213025, V-260475, SV-260475r958928_rule, CAT II. CCI-002824. NIST SP 800-53 Rev. 4: SI-16."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      grep flags /proc/cpuinfo | grep -o nx | sort -u
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ nx" }
    rationale: &rat-26a5633906 |
      Some adversaries launch attacks with the intent of executing code in nonexecutable regions of memory or in memory locations that are prohibited. Security safeguards employed to protect memory include, for example, data execution prevention and address space layout randomization. Data execution prevention safeguards can either be hardware-enforced or software-enforced with hardware providing the greater strength of mechanism.

      Examples of attacks are buffer overflow attacks.
    remediation: &rem-563866d902 |
      Configure Ubuntu 22.04 LTS to enable NX.

      If the installed CPU is hardware capable of NX protection, check if the system's BIOS/UEFI setup configuration permits toggling the "NX bit" or "no execution bit", and set it to "enabled".
  - id: "STIG-UBTU-22-213025-NX_setting"
    name: "Ubuntu 22.04 LTS must implement nonexecutable data to protect its memory from unauthorized code execution."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-213025, V-260475, SV-260475r958928_rule, CAT II. CCI-002824. NIST SP 800-53 Rev. 4: SI-16."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      dmesg | grep -i "execute disable"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ NX \\(Execute Disable\\) protection: active" }
    rationale: *rat-26a5633906
    remediation: *rem-563866d902
  - id: "STIG-UBTU-22-214015-apt_remove_settings"
    name: "Ubuntu 22.04 LTS must be configured so that the Advance Package Tool (APT) removes all software components after updated versions have been installed."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-214015, V-260477, SV-260477r1044773_rule, CAT II. CCI-002617. NIST SP 800-53 Rev. 4: SI-2."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      apt-config dump | grep Remove-Unused
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ Unattended-Upgrade::Remove-Unused-Kernel-Packages \"true\";" }
      - { some: "~ Unattended-Upgrade::Remove-Unused-Dependencies \"true\";" }
    rationale: &rat-a08a21955f |
      Previous versions of software components that are not removed from the information system after updates have been installed may be exploited by adversaries. Some information technology products may remove older versions of software automatically from the information system.
    remediation: &rem-f49be0034b |
      Configure APT to remove all software components after updated versions have been installed.

      Add or modify the following lines in the "/etc/apt/apt.conf.d/50unattended-upgrades" file:

      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
  - id: "STIG-UBTU-22-215010-pam_pwquality_pkg"
    name: "Ubuntu 22.04 LTS must have the \"libpam-pwquality\" package installed."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-215010, V-260478, SV-260478r991587_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' libpam-pwquality 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-8c2b3e1db6 |
      Use of a complex password helps to increase the time and resources required to compromise the password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks. "pwquality" enforces complex password construction configuration and has the ability to limit brute-force attacks on the system.
    remediation: &rem-5a71eb1c06 |
      Install the "pam_pwquality" package by using the following command:

           $ sudo apt-get install libpam-pwquality
  - id: "STIG-UBTU-22-215040-nfs_kernel_server"
    name: "Ubuntu 22.04 LTS must not have the nfs-kernel-server package installed. (nfs-kernel-server)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-215040, V-279937, SV-279937r1208676_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' nfs-kernel-server 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: &rat-18f09151cc |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      Operating systems are capable of providing a wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary to support essential organizational operations (e.g., key missions, functions).

      Examples of nonessential capabilities include, but are not limited to, games, software packages, tools, and demonstration software not related to requirements or providing a wide array of functionality not required for every mission but that cannot be disabled.
    remediation: &rem-8ebb84a3e3 |
      Configure the Ubuntu operating system to disable nonessential capabilities by removing the nfs-kernel-server package from the system with the following commands:

      Remove packages if present:
      $ sudo apt purge --yes nfs-kernel-server

      Remove any unneeded dependencies:
      $ sudo apt autoremove --yes

      Verify that NFS services are gone:
      $ sudo systemctl list-units --type=service | grep nfs
  - id: "STIG-UBTU-22-232010-sys_cmd_dirs_perms"
    name: "Ubuntu 22.04 LTS must have directories that contain system commands set to a mode of \"755\" or less permissive."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-232010, V-260485, SV-260485r991559_rule, CAT II. CCI-001495. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      SYS_CMD_DIRS_PERM=$(find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin -perm /022 -type d -printf '.' | wc -c); \
      if [ "$SYS_CMD_DIRS_PERM" -eq 0 ]; \
      then echo "OK - No files or Directories found"; \
      else echo "FAIL - Files found"; \
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK - No files or Directories found" }
    rationale: &rat-986221e0ba |
      Protecting audit information also includes identifying and protecting the tools used to view and manipulate log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information.

      Operating systems providing tools to interface with audit information will leverage user permissions and roles identifying the user accessing the tools and the corresponding rights the user has in order to make access decisions regarding the deletion of audit tools.

      Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.
    remediation: &rem-3d0b65ca74 |
      Configure Ubuntu 22.04 LTS commands directories to be protected from unauthorized access. Run the following command:

           $ sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin -perm /022 -type d -exec chmod -R 755 '{}' \;
  - id: "STIG-UBTU-22-232015-sys_cmd_file_perms"
    name: "Ubuntu 22.04 LTS must have system commands set to a mode of \"755\" or less permissive."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-232015, V-260486, SV-260486r991560_rule, CAT II. CCI-001499. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      SYS_CMD_FILE_PERM=$(find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin -perm /022 -type f -printf '.' | wc -c); \
      if [ "$SYS_CMD_FILE_PERM" -eq 0 ]; \
        then echo "OK - No files or Directories found"; \
      else echo "FAIL - Files found"; \
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK - No files or Directories found" }
    rationale: &rat-cc428ca7a3 |
      If Ubuntu 22.04 LTS were to allow any user to make changes to software libraries, then those changes might be implemented without undergoing the appropriate testing and approvals that are part of a robust change management process.

      This requirement applies to Ubuntu 22.04 LTS with software libraries that are accessible and configurable, as in the case of interpreted languages. Software libraries also include privileged programs that execute with escalated privileges. Only qualified and authorized individuals must be allowed to obtain access to information system components for purposes of initiating changes, including upgrades and modifications.
    remediation: &rem-3d31e4a6d1 |
      Configure Ubuntu 22.04 LTS commands to be protected from unauthorized access. Run the following command:

           $ sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin -perm /022 -type f -exec chmod 755 '{}' \;
  - id: "STIG-UBTU-22-232020-library_file_perms"
    name: "Ubuntu 22.04 LTS library files must have mode \"755\" or less permissive."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-232020, V-260487, SV-260487r1107262_rule, CAT II. CCI-001499. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      LIB_FILE_PERM=$(find /lib /lib64 /usr/lib /usr/lib64 -perm /022 -type f -printf '.' | wc -c); \
      if [ "$LIB_FILE_PERM" -eq 0 ]; \
      then echo "OK - No files or Directories found"; \
      else echo "FAIL - Files found"; \
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK - No files or Directories found" }
    rationale: &rat-a7dcbabd23 |
      If the operating system were to allow any user to make changes to software libraries, then those changes might be implemented without undergoing the appropriate testing and approvals that are part of a robust change management process.

      This requirement applies to operating systems with software libraries that are accessible and configurable, as in the case of interpreted languages. Software libraries also include privileged programs that execute with escalated privileges. Only qualified and authorized individuals must be allowed to obtain access to information system components for purposes of initiating changes, including upgrades and modifications.
    remediation: &rem-9507e5e993 |
      Configure the systemwide shared library files contained in the directories "/lib", "/lib64", "/usr/lib", and "/usr/lib64" to have mode 0755 or less permissive with the following command:

      $ sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' -perm /022 -exec chmod go-w {} +
  - id: "STIG-UBTU-22-232025-var_log_dir_perms-attrs"
    name: "Ubuntu 22.04 LTS must configure the \"/var/log\" directory to have mode \"755\" or less permissive."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-232025, V-260488, SV-260488r958566_rule, CAT II. CCI-001314. NIST SP 800-53 Rev. 4: SI-11."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      f='/var/log'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -d "$f" ] || echo "$f is not a directory"
    expect: empty
    rationale: &rat-6e6243f4c2 |
      Only authorized personnel should be aware of errors and the details of the errors. Error messages are an indicator of an organization's operational state or can identify the operating system or platform. Additionally, personally identifiable information (PII) and operational information must not be revealed through error messages to unauthorized personnel or their designated representatives.

      The structure and content of error messages must be carefully considered by the organization and development team. The extent to which the information system is able to identify and handle error conditions is guided by organizational policy and operational requirements.
    remediation: &rem-3ad722fb26 |
      Configure the "/var/log" directory to have permissions of "0755" by using the following command:

           $ sudo chmod 0755 /var/log
  - id: "STIG-UBTU-22-232026-var_log_file_perms"
    name: "Ubuntu 22.04 LTS must generate error messages that provide information necessary for corrective actions without revealing information that could be exploited by adversaries."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-232026, V-260489, SV-260489r1134796_rule, CAT II. CCI-001312. NIST SP 800-53 Rev. 4: SI-11."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      LOG_FILE_PERM=$(find /var/log -perm /137 ! -name '*[bw]tmp' ! -name '*lastlog' ! -name 'history.log' ! -name 'eipp.log.xz' -type f -exec stat -c "%n" {} \; | wc -c); \
      if [ "$LOG_FILE_PERM" -eq 0 ]; \
      then echo "OK - No files or Directories found"; \
      else echo "FAIL - Files found"; \
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK - No files or Directories found" }
    rationale: &rat-7fe38b54a7 |
      Any operating system providing too much information in error messages risks compromising the data and security of the structure, and organizations must carefully consider the content and structure of error messages.

      The extent to which information systems are able to identify and handle error conditions is guided by organizational policy and operational requirements. Information that could be exploited by adversaries includes, for example, erroneous logon attempts with passwords entered by mistake as the username, mission/business information that can be derived from (if not stated explicitly by) information recorded, and personal information, such as account numbers, Social Security numbers, and credit card numbers.

      The /var/log/btmp, /var/log/wtmp, and /var/log/lastlog files have group write and global read permissions to allow for the lastlog function to perform. Limiting the permissions beyond this configuration will result in the failure of functions that rely on the lastlog database.
    remediation: &rem-4995b22dcf |
      Configure Ubuntu 22.04 LTS to set permissions of all log files under the "/var/log" directory to "640" or more restricted by using the following command:

      Note: The btmp, wtmp, and lastlog files are excluded. Refer to the Discussion for details.

           $ sudo find /var/log -perm /137 ! -name '*[bw]tmp' ! -name '*lastlog' -type f -exec chmod 640 '{}' \;
