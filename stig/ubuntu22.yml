  - id: "STIG-UBTU-22-255045-sshd_ciphers-attrs"
    name: "Ubuntu 22.04 LTS SSH daemon must prevent remote hosts from connecting to the proxy display. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-255045, V-260530, SV-260530r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
