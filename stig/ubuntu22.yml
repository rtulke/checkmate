  - id: "STIG-UBTU-22-612020-ssh_pubkeyauth-content"
    name: "Ubuntu 22.04 LTS must implement smart card logins for multifactor authentication for local and network access to privileged and nonprivileged accounts. (/etc/ssh/sshd_config has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-612020, V-260575, SV-260575r1268228_rule, CAT II. CCI-000765, CCI-000766, CCI-000767, CCI-000768, CCI-004047. NIST SP 800-53 Rev. 4: IA-2."
