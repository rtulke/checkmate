  - id: "STIG-UBTU-22-654230-execve_module_cnf"
    name: "Ubuntu 22.04 LTS must prevent all software from executing at higher privilege levels than users executing the software and the audit system must be configured to audit the execution of privileged functions."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-654230, V-260648, SV-260648r958730_rule, CAT II. CCI-002233, CCI-002234. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      grep execve /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (.*:|)-a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv" }
      - { some: "~ (.*:|)-a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv" }
      - { some: "~ (.*:|)-a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv" }
      - { some: "~ (.*:|)-a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k execpriv" }
    rationale: &rat-0f28a90041 |
      In certain situations, software applications/programs need to execute with elevated privileges to perform required functions. However, if the privileges required for execution are at a higher level than the privileges assigned to organizational users invoking such applications/programs, those users are indirectly provided with greater privileges than assigned by the organizations.

      Some programs and processes are required to operate at a higher privilege level and therefore should be excluded from the organization-defined software list after review.
    remediation: &rem-8b137f9d36 |
      Configure Ubuntu 22.04 LTS to audit the execution of all privileged functions.

      Add or modify the following lines in the "/etc/audit/rules.d/stig.rules" file:

      -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv
      -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv
      -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv
      -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k execpriv

      To reload the rules file, issue the following command:

           $ sudo augenrules --load

      Note: The "-k <keyname>" at the end of the line gives the rule a unique meaning to help during an audit investigation. The <keyname> does not need to match the example above.
