  - id: "STIG-UBTU-22-271020-gsettings_lock_enabled"
    name: "Ubuntu 22.04 LTS must retain a user's session lock until that user reestablishes access using established identification and authentication procedures."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-271020, V-260537, SV-260537r1069101_rule, CAT II. CCI-000056. NIST SP 800-53 Rev. 4: AC-11."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      gsettings get org.gnome.desktop.screensaver lock-enabled
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^true" }
    rationale: &rat-df2cf1e880 |
      A session lock is a temporary action taken when a user stops work and moves away from the immediate physical vicinity of the information system but does not want to log out because of the temporary nature of the absence.

      The session lock is implemented at the point where session activity can be determined.

      Regardless of where the session lock is determined and implemented, once invoked, a session lock of Ubuntu 22.04 LTS must remain in place until the user reauthenticates. No other activity aside from reauthentication must unlock the system.
    remediation: &rem-6df142195e |
      Configure Ubuntu 22.04 LTS to allow a user to lock the current graphical user interface session.

      Create or edit a file named /etc/dconf/db/local.d/00-screensaver with the following contents:

      [org/gnome/desktop/screensaver]
      lock-enabled=true
  - id: "STIG-UBTU-22-271025-gsettings_lock_inactivity"
    name: "Ubuntu 22.04 LTS must initiate a graphical session lock after 10 minutes of inactivity."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-271025, V-260538, SV-260538r1208695_rule, CAT II. CCI-000057. NIST SP 800-53 Rev. 4: AC-11."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      echo "lock-enabled $(gsettings get org.gnome.desktop.screensaver lock-enabled)"; echo "lock-delay $(gsettings get org.gnome.desktop.screensaver lock-delay)"; echo "idle-delay $(gsettings get org.gnome.desktop.session idle-delay)"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^lock-enabled true$" }
      - { some: "~ ^lock-delay uint32 0$" }
      - { some: "~ ^idle-delay uint32 ([1-9][0-9]?|[1-5][0-9]{2}|600)$" }
    rationale: *rat-df2cf1e880
    remediation: &rem-72f0ef5ace |
      Configure Ubuntu 22.04 LTS to lock the current graphical user interface session after 10 minutes of inactivity.

      Create or edit a file named "/etc/dconf/db/local.d/00-screensaver" with the following contents:

      [org/gnome/desktop/screensaver]
      lock-enabled=true
      lock-delay=0

      [org/gnome/desktop/session]
      idle-delay=600
  - id: "STIG-UBTU-22-291010-usb-storage_blacklist"
    name: "Ubuntu 22.04 LTS must disable automatic mounting of Universal Serial Bus (USB) mass storage driver."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-291010, V-260540, SV-260540r986276_rule, CAT II. CCI-001958, CCI-003959. NIST SP 800-53 Rev. 4: IA-3."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      grep -r usb-storage /etc/modprobe.conf /etc/modprobe.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^.*:install usb-storage \\/bin\\/(false|true)" }
      - { some: "~ ^.*:blacklist usb-storage" }
    rationale: &rat-fc30c6f6d5 |
      Without authenticating devices, unidentified or unknown devices may be introduced, thereby facilitating malicious activity.

      Peripherals include, but are not limited to, such devices as flash drives, external storage, and printers.
    remediation: &rem-296573cf6e |
      Configure Ubuntu 22.04 LTS to disable using the USB storage kernel module.

      Create and/or append a custom file under "/etc/modprobe.d/" to contain the following:

           $ sudo su -c "echo install usb-storage /bin/false >> /etc/modprobe.d/stig.conf"

      Configure Ubuntu 22.04 LTS to disable the ability to use USB mass storage devices.

           $ sudo su -c "echo blacklist usb-storage >> /etc/modprobe.d/stig.conf"
  - id: "STIG-UBTU-22-291015-wireless_disabled"
    name: "Ubuntu 22.04 LTS must disable all wireless network adapters."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-291015, V-260541, SV-260541r1268254_rule, CAT II. CCI-002418. NIST SP 800-53 Rev. 4: SC-8."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      if [ `find /sys/class/net/*/ -type d -name wireless -printf '.' | wc -c` -eq 0 ]; then echo "PASS - No Wireless adapters"; else echo "Manual Test - Plese check wireless adapters are disabled"; fi
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ PASS" }
    rationale: &rat-22da894e6d |
      Without protection of communications with wireless peripherals, confidentiality and integrity may be compromised because unprotected communications can be intercepted and either read, altered, or used to compromise the operating system.

      This requirement applies to wireless peripheral technologies (e.g., wireless mice, keyboards, displays, etc.) used with an operating system. Wireless peripherals (e.g., Wi-Fi/Bluetooth/IR Keyboards, Mice, and Pointing Devices and Near Field Communications [NFC]) present a unique challenge by creating an open, unsecured port on a computer. Wireless peripherals must meet DoW requirements for wireless data transmission and be approved for use by the AO. Even though some wireless peripherals, such as mice and pointing devices, do not ordinarily carry information that need to be protected, modification of communications with these wireless peripherals may be used to compromise the operating system. Communication paths outside the physical protection of a controlled boundary are exposed to the possibility of interception and modification.

      Protecting the confidentiality and integrity of communications with wireless peripherals can be accomplished by physical means (e.g., employing physical barriers to wireless radio frequencies) or by logical means (e.g., employing cryptographic techniques). If physical means of protection are employed, then logical means (cryptography) do not have to be employed, and vice versa. If the wireless peripheral is only passing telemetry data, encryption of the data may not be required.
    remediation: &rem-38049591db |
      Disable all wireless network interfaces by using the following command:

           $ sudo ifdown <wireless_interface_name>

      For each interface listed, find their respective module by using the following command:

           $ basename $(readlink -f /sys/class/net/<wireless_interface_name>/device/driver)

      where <wireless_interface_name> must be substituted by the actual interface name.

      Create and/or append a custom file under "/etc/modprobe.d/" by using the following command:

           $ sudo su -c "echo install <module_name> /bin/false >> /etc/modprobe.d/stig.conf"

      where <module_name> must be substituted by the actual module name.

      For each module from the system, execute the following command to remove it:

           $ sudo modprobe -r <module_name>
  - id: "STIG-UBTU-22-411010-root_acct_locked"
    name: "Ubuntu 22.04 LTS must prevent direct login into the root account."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-411010, V-260542, SV-260542r1015006_rule, CAT II. CCI-000770, CCI-004045. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      passwd -S root
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^root L" }
    rationale: &rat-f9870e5eef |
      To ensure individual accountability and prevent unauthorized access, organizational users must be individually identified and authenticated.

      A group authenticator is a generic account used by multiple individuals. Use of a group authenticator alone does not uniquely identify individual users. Examples of the group authenticator is the Unix OS "root" user account, the Windows "Administrator" account, the "sa" account, or a "helpdesk" account.

      For example, the Unix and Windows operating systems offer a "switch user" capability allowing users to authenticate with their individual credentials and, when needed, "switch" to the administrator role. This method provides for unique individual authentication prior to using a group authenticator.

      Users (and any processes acting on behalf of users) must be uniquely identified and authenticated for all accesses other than those accesses explicitly identified and documented by the organization, which outlines specific user actions that can be performed on the operating system without identification or authentication.

      Requiring individuals to be authenticated with an individual authenticator prior to using a group authenticator allows for traceability of actions, as well as adding an additional level of protection of the actions that can be taken with group account knowledge.
    remediation: &rem-d6af139ce5 |
      Configure Ubuntu 22.04 LTS to prevent direct logins to the root account by using the following command:

           $ sudo passwd -l root
  - id: "STIG-UBTU-22-411015-unique_userID"
    name: "Ubuntu 22.04 LTS must uniquely identify interactive users."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-411015, V-260543, SV-260543r958482_rule, CAT II. CCI-000764, CCI-000804. NIST SP 800-53 Rev. 4: IA-2, IA-8."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      awk -F ":" 'list[$3]++{print $1, $3}' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-ee325bd246 |
      To ensure accountability and prevent unauthenticated access, organizational users must be identified and authenticated to prevent potential misuse and compromise of the system.

      Organizational users include organizational employees or individuals the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and processes acting on behalf of users) must be uniquely identified and authenticated to all accesses, except for the following:

      1. Accesses explicitly identified and documented by the organization. Organizations document specific user actions that can be performed on the information system without identification or authentication; and

      2. Accesses that occur through authorized use of group authenticators without individual authentication. Organizations may require unique identification of individuals in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity.
    remediation: &rem-246c2fe0c5 |
      Edit the file "/etc/passwd" and provide each interactive user account that has a duplicate UID with a unique UID.
  - id: "STIG-UBTU-22-411025-PASS_MIN_DAYS-attrs"
    name: "Ubuntu 22.04 LTS must enforce 24 hours/one day as the minimum password lifetime. Passwords for new users must have a 24 hours/one day minimum password lifetime restriction. (/etc/login.defs: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-411025, V-260545, SV-260545r1015007_rule, CAT II. CCI-000198, CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-8420b4ddad |
      Enforcing a minimum password lifetime helps to prevent repeated password changes to defeat the password reuse or history enforcement requirement. If users are allowed to immediately and continually change their password, then the password could be repeatedly changed in a short period of time to defeat the organization's policy regarding password reuse.
    remediation: &rem-fd81ab0408 |
      Configure Ubuntu 22.04 LTS to enforce a 24 hours/one day minimum password lifetime.

      Add or modify the following line in the "/etc/login.defs" file:

      PASS_MIN_DAYS    1
  - id: "STIG-UBTU-22-411025-PASS_MIN_DAYS-content"
    name: "Ubuntu 22.04 LTS must enforce 24 hours/one day as the minimum password lifetime. Passwords for new users must have a 24 hours/one day minimum password lifetime restriction. (/etc/login.defs has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-411025, V-260545, SV-260545r1015007_rule, CAT II. CCI-000198, CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect: { some: "~ ^PASS_MIN_DAYS 1" }
    rationale: *rat-8420b4ddad
    remediation: *rem-fd81ab0408
  - id: "STIG-UBTU-22-411030-PASS_MAX_DAYS-attrs"
    name: "Ubuntu 22.04 LTS must be able to enforce a 180-day maximum password lifetime restriction. (/etc/login.defs: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-411030, V-260546, SV-260546r1273631_rule, CAT II. CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-bf7843330f |
      Any password, no matter how complex, can eventually be cracked. Therefore, passwords need to be changed periodically. If Ubuntu 22.04 LTS does not limit the lifetime of passwords and force users to change their passwords, there is the risk that Ubuntu 22.04 LTS passwords could be compromised.
    remediation: &rem-7280b78abe |
      Configure Ubuntu 22.04 LTS to enforce a 180-day maximum password lifetime.

      Add or modify the following line in the "/etc/login.defs" file:

      PASS_MAX_DAYS    180
  - id: "STIG-UBTU-22-411030-PASS_MAX_DAYS-content"
    name: "Ubuntu 22.04 LTS must be able to enforce a 180-day maximum password lifetime restriction. (/etc/login.defs has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-411030, V-260546, SV-260546r1273631_rule, CAT II. CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect: { some: "~ ^PASS_MAX_DAYS\\s+([1-9]|[1-9][0-9]|1[0-7][0-9]|180)\\s*$" }
    rationale: *rat-bf7843330f
    remediation: *rem-7280b78abe
  - id: "STIG-UBTU-22-411035-user_inactive-attrs"
    name: "Ubuntu 22.04 LTS must disable account identifiers (individuals, groups, roles, and devices) after 35 days of inactivity. (/etc/default/useradd: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-411035, V-260547, SV-260547r1261463_rule, CAT II. CCI-000795, CCI-003627, CCI-003628. NIST SP 800-53 Rev. 4: IA-4."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      f='/etc/default/useradd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-27643871b5 |
      Inactive identifiers pose a risk to systems and applications because attackers may exploit an inactive identifier and potentially obtain undetected access to the system. Owners of inactive accounts will not notice if unauthorized access to their user account has been obtained.

      Operating systems need to track periods of inactivity and disable application identifiers after 35 days of inactivity.
    remediation: &rem-19a3c00d13 |
      Configure Ubuntu 22.04 LTS to disable account identifiers after 35 days of inactivity after the password expiration.

      Run the following command to change the configuration for adduser:

           $ sudo useradd -D -f 35

      Note: DoW recommendation is 35 days, but a lower value is acceptable. The value "0" will disable the account immediately after the password expires.
  - id: "STIG-UBTU-22-411035-user_inactive-content"
    name: "Ubuntu 22.04 LTS must disable account identifiers (individuals, groups, roles, and devices) after 35 days of inactivity. (/etc/default/useradd has the expected content (2 rules))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-411035, V-260547, SV-260547r1261463_rule, CAT II. CCI-000795, CCI-003627, CCI-003628. NIST SP 800-53 Rev. 4: IA-4."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/default/useradd'
    allow_rc: any
