  - id: "STIG-UBTU-22-252010-chrony_servers"
    name: "Ubuntu 22.04 LTS must, for networked systems, compare internal information system clocks at least every 24 hours with a server synchronized to one of the redundant United States Naval Observatory (USNO) time servers, or a time server designated for the appropriate DoW network (NIPRNet/SIPRNet), and/or the Global Positioning System (GPS)."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-252010, V-260519, SV-260519r1261448_rule, CAT III. CCI-001891, CCI-004923. NIST SP 800-53 Rev. 4: AU-8."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      grep maxpoll -ir /etc/chrony*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ server tick\\.usno\\.navy\\.mil" }
      - { some: "~ maxpoll ([1-9]|1[0-6])$" }
      - { some: "~ server tock\\.usno\\.navy\\.mil" }
      - { some: "~ maxpoll ([1-9]|1[0-6])$" }
      - { some: "~ server ntp2\\.usno\\.navy\\.mil" }
      - { some: "~ maxpoll ([1-9]|1[0-6])$" }
    rationale: &rat-b7ede5bfb2 |
      Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events. Sources outside the configured acceptable allowance (drift) may be inaccurate.

      Synchronizing internal information system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected over a network.

      Organizations should consider endpoints that may not have regular access to the authoritative time server (e.g., mobile, teleworking, and tactical endpoints).

      Note that USNO offers authenticated NTP service to DoW and U.S. Government agencies operating on the NIPR and SIPR networks. Visit https://www.usno.navy.mil/USNO/time/ntp/DoW-customers for more information.
    remediation: &rem-ac9af22948 |
      Configure Ubuntu 22.04 LTS to compare the system clock at least every 24 hours to the authoritative time source.

      Add or modify the following line in the "/etc/chrony/chrony.conf" file:

      server [source] iburst maxpoll = 16

      Restart "chrony.service" for the changes to take effect by using the following command:

           $ sudo systemctl restart chrony.service
  - id: "STIG-UBTU-22-252015-chrony_step"
    name: "Ubuntu 22.04 LTS must synchronize internal information system clocks to the authoritative time source when the time difference is greater than one second."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-252015, V-260520, SV-260520r1044776_rule, CAT III. CCI-002046, CCI-004926. NIST SP 800-53 Rev. 4: Au-8."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      grep -ir makestep /etc/chrony*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*:makestep 1 -1" }
    rationale: &rat-a4ead36c06 |
      Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events.

      Synchronizing internal information system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected over a network. Organizations should consider setting time periods for different types of systems (e.g., financial, legal, or mission-critical systems).

      Organizations should also consider endpoints that may not have regular access to the authoritative time server (e.g., mobile, teleworking, and tactical endpoints). This requirement is related to the comparison done every 24 hours in SRG-OS-000355 because a comparison must be done to determine the time difference.
    remediation: &rem-16b1807efc |
      Configure chrony to synchronize the internal system clocks to the authoritative source when the time difference is greater than one second by doing the following:

      Edit the "/etc/chrony/chrony.conf" file and add:

           makestep 1 -1

      Restart the chrony service:

           $ sudo systemctl restart chrony.service
  - id: "STIG-UBTU-22-252020-timezone"
    name: "Ubuntu 22.04 LTS must record time stamps for audit records that can be mapped to Coordinated Universal Time (UTC)."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-252020, V-260521, SV-260521r958788_rule, CAT III. CCI-001890. NIST SP 800-53 Rev. 4: AU-8."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      timedatectl status | grep -i "time zone"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^\\s+Time zone: Etc\\/UTC \\(UTC, \\+0000\\)" }
    rationale: &rat-d8b26f8a9f |
      If time stamps are not consistently applied and there is no common time reference, it is difficult to perform forensic analysis.

      Time stamps generated by the operating system include date and time. Time is commonly expressed in UTC or local time with an offset from UTC.
    remediation: &rem-4f825bd77d |
      To Configure Ubuntu 22.04 LTS time zone to use UTC, run the following command:

           $ sudo timedatectl set-timezone Etc/UTC
