    rationale: *rat-f3d1015236
    remediation: *rem-072d800cb7
  - id: "STIG-UBTU-22-611040-passwd_difok-attrs"
    name: "Ubuntu 22.04 LTS must require the change of at least eight characters when passwords are changed. (/etc/security/pwquality.conf: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-611040, V-260566, SV-260566r1015017_rule, CAT II. CCI-000195, CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      f='/etc/security/pwquality.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1b9e0c99ca |
      If the operating system allows the user to consecutively reuse extensive portions of passwords, this increases the chances of password compromise by increasing the window of opportunity for attempts at guessing and brute-force attacks.

      The number of changed characters refers to the number of changes required with respect to the total number of positions in the current password. In other words, characters may be the same within the two passwords; however, the positions of the like characters must be different.

      If the password length is an odd number then number of changed characters must be rounded up. For example, a password length of 15 characters must require the change of at least eight characters.
    remediation: &rem-fc4cda4d81 |
      Configure Ubuntu 22.04 LTS to require the change of at least eight characters when passwords are changed.

      Add or modify the following line in the "/etc/security/pwquality.conf" file:

      difok = 8
  - id: "STIG-UBTU-22-611040-passwd_difok-content"
    name: "Ubuntu 22.04 LTS must require the change of at least eight characters when passwords are changed. (/etc/security/pwquality.conf has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-611040, V-260566, SV-260566r1015017_rule, CAT II. CCI-000195, CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/security/pwquality.conf'
    allow_rc: any
    expect: { some: "~ ^difok\\s*=\\s*([8-9]|[1-5][0-9])" }
    rationale: *rat-1b9e0c99ca
    remediation: *rem-fc4cda4d81
  - id: "STIG-UBTU-22-611045-common-password-retry-attrs"
