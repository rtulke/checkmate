    severity: medium
    run: |
      cat '/etc/default/aide'
    allow_rc: any
    expect: { some: "~ (?i)^SILENTREPORTS\\s*=\\s*no" }
    rationale: *rat-e2e8e4abfe
    remediation: *rem-6954661909
  - id: "STIG-UBTU-22-651025-aide_cron_sha"
    name: "Ubuntu 22.04 LTS must be configured so that the script that runs each 30 days or less to check file integrity is the default."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-651025, V-260585, SV-260585r958946_rule, CAT II. CCI-002699. NIST SP 800-53 Rev. 4: SI-6."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      sha1sum /etc/cron.daily/aide /etc/cron.monthly/aide 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ b71bb2cafaedf15ec3ac2f566f209d3260a37af0\\s*\\/etc\\/cron\\.(daily|monthly)\\/aide" }
    rationale: &rat-ab4af4fd58 |
      Without verification of the security functions, security functions may not operate correctly and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.

      Notifications provided by information systems include, for example, electronic alerts to system administrators, messages to local computer consoles, and/or hardware indications, such as lights.

      This requirement applies to Ubuntu 22.04 LTS performing security function verification/testing and/or systems and environments that require this functionality.
    remediation: &rem-e69f6c3954 |
      The cron file for AIDE is fairly complex as it creates the report. This file is installed with the "aide-common" package, and the default can be restored by copying it from the package:

      Extract the aide script from the "aide-common" package to its original place:

           $ dpkg-deb --fsys-tarfile /tmp/aide-common_*.deb | sudo tar -x ./usr/share/aide/config/cron.daily/aide -C /

      Copy it to the cron.daily directory:

           $  sudo cp -f /usr/share/aide/config/cron.daily/aide /etc/cron.daily/aide
  - id: "STIG-UBTU-22-651030-audit_bin_crypto"
    name: "Ubuntu 22.04 LTS must use cryptographic mechanisms to protect the integrity of audit tools."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-651030, V-260586, SV-260586r1069107_rule, CAT II. CCI-001496. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      grep -E '^\s*/sbin/(audit|au)' /etc/aide/aide.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ /sbin/auditctl p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/auditd p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/ausearch p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/aureport p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/autrace p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/augenrules p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
    rationale: &rat-312f139220 |
      Protecting the integrity of the tools used for auditing purposes is a critical step toward ensuring the integrity of audit information. Audit information includes all information (e.g., audit records, audit settings, and audit reports) needed to successfully audit information system activity.

      Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.

      It is not uncommon for attackers to replace the audit tools or inject code into the existing tools with the purpose of providing the capability to hide or erase system activity from the audit logs.

      To address this risk, audit tools must be cryptographically signed in order to provide the capability to identify when the audit tools have been modified, manipulated, or replaced. An example is a checksum hash of the file or files.
    remediation: &rem-68d0b17206 |
      Configure AIDE to protect the integrity of audit tools:

      Add or modify the following lines in the "/etc/aide/aide.conf" file:

      # Audit Tools
      /sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
      /sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
      /sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
      /sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
      /sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
      /sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512
  - id: "STIG-UBTU-22-652010-rsyslog_installed"
    name: "Ubuntu 22.04 LTS must be configured to preserve log records from failure events."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-652010, V-260588, SV-260588r991562_rule, CAT II. CCI-001665. NIST SP 800-53 Rev. 4: SC-24."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' rsyslog 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-c30acd83c8 |
      Failure to a known state can address safety or security in accordance with the mission/business needs of the organization. Failure to a known secure state helps prevent a loss of confidentiality, integrity, or availability in the event of a failure of the information system or a component of the system.

      Preserving operating system state information helps to facilitate operating system restart and return to the operational mode of the organization with least disruption to mission/business processes.
    remediation: &rem-30d23f4c14 |
      Install the log service by using the following command:

           $ sudo apt-get install rsyslog

      Enable and activate the log service by using the following command:

           $ sudo systemctl enable rsyslog.service --now
