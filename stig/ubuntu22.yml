    name: "Ubuntu 22.04 LTS SSH server must be configured to use only FIPS-validated key exchange algorithms. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-255060, V-260533, SV-260533r1268222_rule, CAT II. CCI-000068. NIST SP 800-53 Rev. 4: AC-17."
