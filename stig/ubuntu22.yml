  - id: "STIG-UBTU-22-611055-common-password-sha-attrs"
    name: "Ubuntu 22.04 LTS must store only encrypted representations of passwords. (/etc/pam.d/common-password: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-611055, V-260569, SV-260569r1101736_rule, CAT II. CCI-000196, CCI-004062. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      f='/etc/pam.d/common-password'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-0abe86111f |
      Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks. If the information system or application allows the user to consecutively reuse their password when that password has exceeded its defined lifetime, the end result is a password that is not changed as per policy requirements.
    remediation: &rem-7b24ea1c13 |
      Configure Ubuntu 22.04 LTS to store encrypted representations of passwords.

      Add or modify the following line in the "/etc/pam.d/common-password" file:

      password [success=1 default=ignore] pam_unix.so obscure sha512 shadow rounds=100000
  - id: "STIG-UBTU-22-611055-common-password-sha-content"
    name: "Ubuntu 22.04 LTS must store only encrypted representations of passwords. (/etc/pam.d/common-password has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-611055, V-260569, SV-260569r1101736_rule, CAT II. CCI-000196, CCI-004062. NIST SP 800-53 Rev. 4: IA-5."
