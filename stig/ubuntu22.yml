  - id: "STIG-UBTU-22-654235-sudo.log_module_cnf"
    name: "Ubuntu 22.04 LTS must generate audit records for privileged activities, nonlocal maintenance, diagnostic sessions and other system-level access."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-654235, V-260649, SV-260649r986298_rule, CAT II. CCI-000172, CCI-002884, CCI-004188. NIST SP 800-53 Rev. 4: AU-12, MA-4."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      grep sudo.log /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (.*:|)-w /var/log/sudo.log -p wa -k maintenance" }
    rationale: &rat-de27a7f2d8 |
      If events associated with nonlocal administrative access or diagnostic sessions are not logged, a major tool for assessing and investigating attacks would not be available.

      This requirement addresses auditing-related issues associated with maintenance tools used specifically for diagnostic and repair actions on organizational information systems.

      Nonlocal maintenance and diagnostic activities are those activities conducted by individuals communicating through a network, either an external network (e.g., the internet) or an internal network. Local maintenance and diagnostic activities are those activities carried out by individuals physically present at the information system or information system component and not communicating across a network connection.

      This requirement applies to hardware/software diagnostic test equipment or tools. This requirement does not cover hardware/software components that may support information system maintenance, yet are a part of the system, for example, the software implementing "ping," "ls," "ipconfig," or the hardware and software implementing the monitoring port of an Ethernet switch.
    remediation: &rem-56a4ad94fc |
      Configure Ubuntu 22.04 LTS to audit activities performed during nonlocal maintenance and diagnostic sessions.

      Add or modify the following line in the "/etc/audit/rules.d/stig.rules" file:

      -w /var/log/sudo.log -p wa -k maintenance

      To reload the rules file, issue the following command:

           $ sudo augenrules --load

      Note: The "-k <keyname>" at the end of the line gives the rule a unique meaning to help during an audit investigation. The <keyname> does not need to match the example above.
  - id: "STIG-UBTU-22-654235-sudo.log_module_live"
    name: "Ubuntu 22.04 LTS must generate audit records for privileged activities, nonlocal maintenance, diagnostic sessions and other system-level access."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-654235, V-260649, SV-260649r986298_rule, CAT II. CCI-000172, CCI-002884, CCI-004188. NIST SP 800-53 Rev. 4: AU-12, MA-4."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      auditctl -l | grep sudo.log
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /var/log/sudo\\.log -p wa -k maintenance" }
    rationale: *rat-de27a7f2d8
    remediation: *rem-56a4ad94fc
  - id: "STIG-UBTU-22-654240-protect_rules_module_cnf"
    name: "Ubuntu 24.04 LTS audit system must protect auditing rules from unauthorized change. (Config)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-654240, V-288816, SV-288816r1261438_rule, CAT II. CCI-000163. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      grep -HE '^-e 2' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^/etc/audit/rules\\.d/[^:]+\\.rules:-e 2\\s*$" }
    rationale: &rat-0586656be5 |
      Unauthorized disclosure of audit records can reveal system and configuration data to attackers, thus compromising its confidentiality. Audit information includes all information (e.g., audit records, audit settings, audit reports) needed to successfully audit Ubuntu 24.04 LTS system activity. In immutable mode, unauthorized users cannot execute changes to the audit system to potentially hide malicious activity and then put the audit rules back. A system reboot would be noticeable, and a system administrator could then investigate the unauthorized changes.
    remediation: &rem-0048dd8c95 |
      Configure the audit system to set the audit rules to be immutable by performing the following steps:

      Create or edit a finalized rules file (e.g., "/etc/audit/rules.d/99-finalize.rules") and append the following option as the absolute last line:

      -e 2

      Compile and load the new rules into the active kernel:

      $ sudo augenrules --load

      Note: Once this rule is active, further changes to the audit configuration will be blocked. A system reboot will be required to apply any future audit rule modifications.
  - id: "STIG-UBTU-22-654240-protect_rules_module_live"
    name: "Ubuntu 24.04 LTS audit system must protect auditing rules from unauthorized change. (Live)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-654240, V-288816, SV-288816r1261438_rule, CAT II. CCI-000163. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      auditctl -s
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^enabled 2$" }
    rationale: *rat-0586656be5
    remediation: *rem-0048dd8c95
  - id: "STIG-UBTU-22-411045-pam_acct_faillock-attrs"
    name: "Ubuntu 22.04 LTS must automatically lock an account until the locked account is released by an administrator when three unsuccessful logon attempts have been made. (/etc/pam.d/common-account: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-411045, V-260549, SV-260549r958388_rule, CAT III. CCI-000044, CCI-002238. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      f='/etc/pam.d/common-account'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-c7aa300a3e |
      By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing, otherwise known as brute-forcing, is reduced. Limits are imposed by locking the account.
    remediation: &rem-3909f88308 |
      Configure Ubuntu 22.04 LTS to utilize the "pam_faillock" module.

      Add or modify the following lines in the "/etc/pam.d/common-auth" file, below the "auth" definition for "pam_unix.so":

      auth     [default=die]  pam_faillock.so authfail
      auth     sufficient          pam_faillock.so authsucc

      Configure the "pam_faillock" module to use the following options.

      Add or modify the following lines in the "/etc/security/faillock.conf" file:

      audit
      silent
      deny = 3
      fail_interval = 900
      unlock_time = 0
  - id: "STIG-UBTU-22-411045-pam_acct_faillock-content"
    name: "Ubuntu 22.04 LTS must automatically lock an account until the locked account is released by an administrator when three unsuccessful logon attempts have been made. (/etc/pam.d/common-account has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-411045, V-260549, SV-260549r958388_rule, CAT III. CCI-000044, CCI-002238. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      cat '/etc/pam.d/common-account'
    allow_rc: any
    expect: { some: "~ ^account\\s+required\\s+pam_faillock.so" }
    rationale: *rat-c7aa300a3e
    remediation: *rem-3909f88308
  - id: "STIG-UBTU-22-411045-pam_auth_faillock-attrs"
    name: "Ubuntu 22.04 LTS must automatically lock an account until the locked account is released by an administrator when three unsuccessful logon attempts have been made. (/etc/pam.d/common-auth: exists)"
