    name: "Ubuntu 22.04 LTS must configure audit tools with a mode of \"755\" or less permissive."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-232035, V-260492, SV-260492r991557_rule, CAT II. CCI-001493, CCI-001494. NIST SP 800-53 Rev. 4: SI-11."
