  - id: "STIG-UBTU-22-255025-ssh_permit-attrs"
    name: "Ubuntu 22.04 LTS must not allow unattended or automatic login via SSH. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-255025, V-260526, SV-260526r1208678_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
