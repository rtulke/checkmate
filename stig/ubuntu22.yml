  - id: "STIG-UBTU-22-412010-pam_auth_faildelay-attrs"
    name: "Ubuntu 22.04 LTS must enforce a delay of at least four seconds between logon prompts following a failed logon attempt. (/etc/pam.d/common-auth: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-412010, V-260550, SV-260550r991588_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      f='/etc/pam.d/common-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-0484a13ea4 |
      Limiting the number of logon attempts over a certain time interval reduces the chances that an unauthorized user may gain access to an account.
    remediation: &rem-f15741ab1c |
      Configure Ubuntu 22.04 LTS to enforce a delay of at least four seconds between logon prompts following a failed logon attempt.

      Add or modify the following line in the "/etc/pam.d/common-auth" file:

      auth     required     pam_faildelay.so     delay=4000000
  - id: "STIG-UBTU-22-412010-pam_auth_faildelay-content"
    name: "Ubuntu 22.04 LTS must enforce a delay of at least four seconds between logon prompts following a failed logon attempt. (/etc/pam.d/common-auth has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-412010, V-260550, SV-260550r991588_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
