  - id: "STIG-UBTU-22-211015-ctrl-alt-del_disabled-enabled"
    name: "Ubuntu 22.04 LTS must disable the x86 Ctrl-Alt-Delete key sequence."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-211015, V-260469, SV-260469r1268251_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
