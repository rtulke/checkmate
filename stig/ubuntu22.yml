    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-611035, V-260565, SV-260565r1015016_rule, CAT II. CCI-000205, CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
