  - id: "STIG-UBTU-22-211000-supported_OS_version-attrs"
    name: "Ubuntu 22.04 LTS must be a vendor-supported release. (/etc/lsb-release: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-211000, V-278951, SV-278951r1268251_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu22, stig-cat-1]
    severity: high
    run: |
