  - id: "STIG-UBTU-22-412040-system_accts_no_interactive_shell"
    name: "Ubuntu 22.04 LTS must not assign an interactive login shell for system accounts."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-412040, V-288817, SV-288817r1261441_rule, CAT II. CCI-002696. NIST SP 800-53 Rev. 4: SI-6."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      awk -F: '(($3 > 0 && $3 < 1000) && $1 !~ /^(halt|sync|shutdown)$/ && $7 !~ /(nologin|false)$/) {print $1 ":" $3 ":" $7}' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-3f6ca1e596 |
      Ensuring shells are not given to system accounts upon login makes it more difficult for attackers to use system accounts.
    remediation: &rem-fcee2a0b54 |
      Configure Ubuntu 22.04 LTS so that all noninteractive accounts on the system do not have an interactive shell assigned to them.

      If the system account needs a shell assigned for mission operations, document the need with the information system security officer (ISSO).

      Run the following command to disable the interactive shell for a specific noninteractive user account:

      $ sudo usermod -s /usr/sbin/nologin <user>
  - id: "STIG-UBTU-22-431010-apparmor"
    name: "Ubuntu 22.04 LTS must have the \"apparmor\" package installed."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-431010, V-260556, SV-260556r958702_rule, CAT II. CCI-001764, CCI-001774, CCI-002165. NIST SP 800-53 Rev. 4: CM-7, AC-3."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' apparmor 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-e9f7f59278 |
      Control of program execution is a mechanism used to prevent execution of unauthorized programs. Some operating systems may provide a capability that runs counter to the mission or provides users with functionality that exceeds mission requirements. This includes functions and services installed at the operating system level.

      Some of the programs, installed by default, may be harmful or may not be necessary to support essential organizational operations (e.g., key missions, functions). Removal of executable programs is not always possible; therefore, establishing a method of preventing program execution is critical to maintaining a secure system baseline.

      Methods for complying with this requirement include restricting execution of programs in certain environments, while preventing execution in other environments; or limiting execution of certain program functionality based on organization-defined criteria (e.g., privileges, subnets, sandboxed environments, or roles).
    remediation: &rem-29d5382f49 |
      Install the "appArmor" package by using the following command:

           $ sudo apt-get install apparmor
  - id: "STIG-UBTU-22-431015-apparmor-enabled"
    name: "Ubuntu 22.04 LTS must be configured to use AppArmor. (Service apparmor is enabled)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-431015, V-260557, SV-260557r958804_rule, CAT II. CCI-001764, CCI-001774, CCI-002235. NIST SP 800-53 Rev. 4: CM-7, AC-6."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState apparmor | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-e9f7f59278
    remediation: &rem-7942528ea3 |
      Enable and start "apparmor.service" by using the following command:

           $ sudo systemctl enable apparmor.service --now

      Note: AppArmor must have properly configured profiles for applications and home directories. All configurations will be based on the actual system setup and organization and normally are on a per role basis. See the AppArmor documentation for more information on configuring profiles.
  - id: "STIG-UBTU-22-431015-apparmor-running"
    name: "Ubuntu 22.04 LTS must be configured to use AppArmor. (Service apparmor is running)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-431015, V-260557, SV-260557r958804_rule, CAT II. CCI-001764, CCI-001774, CCI-002235. NIST SP 800-53 Rev. 4: CM-7, AC-6."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState apparmor | cut -d= -f2
    expect: "== active"
    rationale: *rat-e9f7f59278
    remediation: *rem-7942528ea3
  - id: "STIG-UBTU-22-432010-sudo_reauth"
    name: "Ubuntu 22.04 LTS must require users to reauthenticate for privilege escalation or when changing roles."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-432010, V-260558, SV-260558r1208696_rule, CAT II. CCI-002038, CCI-004895. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      grep -Ei '!authenticate' /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-9214489f7c |
      Without reauthentication, users may access resources or perform tasks for which they do not have authorization.

      When operating systems provide the capability to escalate a functional capability, it is critical the user reauthenticate.
    remediation: &rem-c8fe0126fb |
      Remove any occurrence of "!authenticate" found in "/etc/sudoers" file or files in the "/etc/sudoers.d" directory.
  - id: "STIG-UBTU-22-432011-sudo_nopasswd"
    name: "Ubuntu 22.04 LTS must require users to provide a password for privilege escalation."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-432011, V-274860, SV-274860r1155210_rule, CAT II. CCI-002038, CCI-004895. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      grep -Ei 'nopasswd' /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-a7bf9120f6 |
      Without reauthentication, users may access resources or perform tasks for which they do not have authorization.

      When operating systems provide the capability to escalate a functional capability, it is critical that the user reauthenticate.
    remediation: &rem-4b36d4425d |
      Configure the operating system to not allow users to execute privileged actions without authenticating with a password.

      Remove any occurrence of "NOPASSWD" found in "/etc/sudoers" file or files in the "/etc/sudoers.d" directory.

      $ sudo find /etc/sudoers /etc/sudoers.d -type f -exec sed -i '/NOPASSWD/ s/^/# /g' {} \;
  - id: "STIG-UBTU-22-611010-passwd_uppercase-attrs"
    name: "Ubuntu 22.04 LTS must enforce password complexity by requiring at least one uppercase character be used. (/etc/security/pwquality.conf: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-611010, V-260560, SV-260560r1015012_rule, CAT II. CCI-000192, CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu22, stig-cat-2]
