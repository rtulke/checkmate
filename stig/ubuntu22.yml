  - id: "STIG-UBTU-22-612010-libpam-pkcs11"
    name: "Ubuntu 22.04 LTS must implement multifactor authentication for remote access to privileged accounts in such a way that one of the factors is provided by a device separate from the system gaining access."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-612010, V-260573, SV-260573r1268242_rule, CAT II. CCI-000765, CCI-000766, CCI-000767, CCI-000768, CCI-001948, CCI-004046, CCI-004047. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' libpam-pkcs11 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-1a2bf9d880 |
      Using an authentication device, such as a CAC or token separate from the information system, ensures that even if the information system is compromised, that compromise will not affect credentials stored on the authentication device.

      Multifactor solutions that require devices separate from information systems gaining access include, for example, hardware tokens providing time-based or challenge-response authenticators and smart cards such as the U.S. Government personal identity verification card and the DoW common access card.

      A privileged account is defined as an information system account with authorizations of a privileged user.

      Remote access is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      This requirement only applies to components where this is specific to the function of the device or has the concept of an organizational user (e.g., VPN, proxy capability). This does not apply to authentication for the purpose of configuring the device itself (management).
    remediation: &rem-14c76eaad8 |
      Install the "libpam-pkcs11" package by using the following command:

           $ sudo apt-get install libpam-pkcs11
  - id: "STIG-UBTU-22-612015-opensc-pkcs11"
    name: "Ubuntu 22.04 LTS must accept personal identity verification (PIV) credentials."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-612015, V-260574, SV-260574r1268243_rule, CAT II. CCI-001953. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' opensc-pkcs11 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-70178fccee |
      The use of PIV credentials facilitates standardization and reduces the risk of unauthorized access.

      DoW has mandated the use of the common access card (CAC) to support identity management and personal authentication for systems covered under Homeland Security Presidential Directive (HSPD) 12, as well as making the CAC a primary component of layered protection for national security systems.
    remediation: &rem-be4c5eb3c4 |
      Install the "opensc-pkcs11" package by using the following command:

           $ sudo apt-get install opensc-pkcs11
  - id: "STIG-UBTU-22-612020-common-auth-pkcs-attrs"
    name: "Ubuntu 22.04 LTS must implement smart card logins for multifactor authentication for local and network access to privileged and nonprivileged accounts. (/etc/pam.d/common-auth: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-612020, V-260575, SV-260575r1268228_rule, CAT II. CCI-000765, CCI-000766, CCI-000767, CCI-000768, CCI-004047. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      f='/etc/pam.d/common-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
