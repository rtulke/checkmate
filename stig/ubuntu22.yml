    rationale: *rat-0484a13ea4
    remediation: *rem-f15741ab1c
  - id: "STIG-UBTU-22-412020-maxlogins_security"
    name: "Ubuntu 22.04 LTS must limit the number of concurrent sessions to ten for all accounts and/or account types."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-412020, V-260552, SV-260552r958398_rule, CAT III. CCI-000054. NIST SP 800-53 Rev. 4: AC-10."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      grep -r -s '^[^#].*maxlogins' /etc/security/limits.conf /etc/security/limits.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*:\\* hard maxlogins (10|[1-9])" }
    rationale: &rat-c7a76750c2 |
      Ubuntu 22.04 LTS management includes the ability to control the number of users and user sessions that utilize an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the risks related to denial-of-service (DoS) attacks.

      This requirement addresses concurrent sessions for information system accounts and does not address concurrent sessions by single users via multiple system accounts. The maximum number of concurrent sessions should be defined based upon mission needs and the operational environment for each system.
    remediation: &rem-38bdccd707 |
      Configure Ubuntu 22.04 LTS to limit the number of concurrent sessions to 10 for all accounts and/or account types.

      Add or modify the following line at the top of the "/etc/security/limits.conf" file:

      * hard maxlogins 10
  - id: "STIG-UBTU-22-631015-sssd_offline_cred_cache"
    name: "Ubuntu 22.04 LTS must be configured such that Pluggable Authentication Module (PAM) prohibits the use of cached authentications after one day."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-631015, V-260581, SV-260581r1155206_rule, CAT III. CCI-002007. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      grep -ih '^\s*offline_credentials_expiration' /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^\\s*offline_credentials_expiration\\s*=\\s*1\\s*$" }
      - { none: "~ ^\\s*offline_credentials_expiration\\s*=\\s*([02-9]|1[0-9])" }
    rationale: &rat-14bf699e12 |
      If cached authentication information is out-of-date, the validity of the authentication information may be questionable.
    remediation: &rem-a16d37d1f4 |
      Configure PAM to prohibit the use of cached authentications after one day.

      Add or modify the following line in the "/etc/sssd/sssd.conf" file, just below the line "[pam]":

      offline_credentials_expiration = 1

      Note: It is valid for this configuration to be in a file with a name that ends with ".conf" and does not begin with a "." in the "/etc/sssd/conf.d/" directory instead of the "/etc/sssd/sssd.conf" file.
  - id: "STIG-UBTU-22-651035-crontab_offload_audit_logs"
    name: "Ubuntu 22.04 LTS must have a crontab script running weekly to offload audit events of standalone systems."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-651035, V-260587, SV-260587r959008_rule, CAT III. CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      grep -i audit /etc/cron.weekly/*
    expect: { rc: "== 0" }
    rationale: &rat-562377e795 |
      Information stored in one location is vulnerable to accidental or incidental deletion or alteration.

      Offloading is a common process in information systems with limited audit storage capacity.
    remediation: &rem-b61d2e62a2 |
      Create a script that offloads audit logs to external media and runs weekly.

      The script must be located in the "/etc/cron.weekly" directory.
  - id: "STIG-UBTU-22-653020-audispd_installed"
    name: "Ubuntu 22.04 LTS audit event multiplexor must be configured to offload audit logs onto a different system from the system being audited."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-653020, V-260592, SV-260592r1101709_rule, CAT III. CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      dpkg-query -W -f='${Status}' audispd-plugins 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-41c0330fb5 |
      Information stored in one location is vulnerable to accidental or incidental deletion or alteration.

      Offloading is a common process in information systems with limited audit storage capacity.

      The auditd service does not include the ability to send audit records to a centralized server for management directly. However, it can use a plug-in for audit event multiplexor to pass audit records to a remote server.
    remediation: &rem-7a1c1c06e2 |
      Configure the audit event multiplexor to offload audit records to a different system from the system being audited.

      Install the "audispd-plugins" package by using the following command:

           $ sudo apt-get install audispd-plugins

      Set the audisp-remote plugin as active by editing the "/etc/audit/plugins.d/au-remote.conf" file:

           $ sudo sed -i -E 's/active\s*=\s*no/active = yes/' /etc/audit/plugins.d/au-remote.conf

      Set the IP address of the remote system by editing the "/etc/audit/audisp-remote.conf" file:

           $ sudo sed -i -E 's/(remote_server\s*=).*/\1 <remote_server_ip_address>/' /etc/audit/audisp-remote.conf

      Restart the "auditd.service" for the changes to take effect:

           $ sudo systemctl restart auditd.service
  - id: "STIG-UBTU-22-653025-audit_mail_acct-attrs"
    name: "Ubuntu 22.04 LTS must alert the information system security officer (ISSO) and system administrator (SA) in the event of an audit processing failure. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-653025, V-260593, SV-260593r958424_rule, CAT III. CCI-000139. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-9132161237 |
      It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs as required. Without this notification, the security personnel may be unaware of an impending failure of the audit capability, and system operation may be adversely affected.

      Audit processing failures include software/hardware errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded.

      This requirement applies to each audit data storage repository (i.e., distinct information system component where audit records are stored), the centralized audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both.
    remediation: &rem-a93a3e857e |
      Configure "auditd" service to notify the SA and ISSO in the event of an audit processing failure.

      Add or modify the following line in the "/etc/audit/auditd.conf " file:

      action_mail_acct = <administrator_email_account>

      Note: Change "administrator_email_account" to the email address of the SA and/or ISSO.

      Restart the "auditd" service for the changes take effect:

           $ sudo systemctl restart auditd.service
  - id: "STIG-UBTU-22-653025-audit_mail_acct-content"
    name: "Ubuntu 22.04 LTS must alert the information system security officer (ISSO) and system administrator (SA) in the event of an audit processing failure. (/etc/audit/auditd.conf has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-653025, V-260593, SV-260593r958424_rule, CAT III. CCI-000139. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect: { some: "~ ^action_mail_acct\\s*=\\s*root" }
    rationale: *rat-9132161237
    remediation: *rem-a93a3e857e
  - id: "STIG-UBTU-22-653035-audit_disk_space_adequate_manual"
    name: "Ubuntu 22.04 LTS must allocate audit record storage capacity to store at least one weeks' worth of audit records, when audit records are not immediately sent to a central audit record storage facility."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-653035, V-260595, SV-260595r958752_rule, CAT III. CCI-001849. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      echo -e "MANUAL - Ensure the disk space is sufficient for 1 week of audit logs\n`df -h /var/log/audit`"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-e2f9122e9b |
      To ensure operating systems have a sufficient storage capacity in which to write the audit logs, operating systems must be able to allocate audit record storage capacity.

      The task of allocating audit record storage capacity is usually performed during initial installation of the operating system.
    remediation: &rem-b9fc79f14c |
      Allocate enough storage capacity for at least one week's worth of audit records when audit records are not immediately sent to a central audit record storage facility.

      If audit records are stored on a partition made specifically for audit records, use the "parted" program to resize the partition with sufficient space to contain one week's worth of audit records.

      If audit records are not stored on a partition made specifically for audit records, a new partition with sufficient amount of space will need be to be created.

      Set the auditd server to point to the mount point where the audit records must be located:

           $ sudo sed -i -E 's@^(log_file\s*=\s*).*@\1 <audit_partition_mountpoint>/audit.log@' /etc/audit/auditd.conf

      where <audit_partition_mountpoint> is the aforementioned mount point.
  - id: "STIG-UBTU-22-653040-audit_space_left-attrs"
    name: "Ubuntu 22.04 LTS must immediately notify the system administrator (SA) and information system security officer (ISSO) when the audit record storage volume reaches 25 percent remaining of the allocated capacity. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-653040, V-260596, SV-260596r971542_rule, CAT III. CCI-001855. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-2e890833cd |
      If security personnel are not notified immediately when storage volume reaches 25 percent remaining of the allocated capacity, they are unable to plan for audit record storage capacity expansion.
    remediation: &rem-4fc54c3555 |
      Configure Ubuntu 22.04 LTS to notify the SA and ISSO when the audit record storage volume reaches 25 percent remaining of the allocated capacity.

      Add or modify the following lines in the "/etc/audit/auditd.conf " file:

      space_left = 25%
      space_left_action = email

      Restart the "auditd" service for the changes to take effect:

           $ sudo systemctl restart auditd.service

      Note: If the "space_left_action" parameter is set to "exec", ensure the command being executed notifies the SA and ISSO.
  - id: "STIG-UBTU-22-653040-audit_space_left-content"
    name: "Ubuntu 22.04 LTS must immediately notify the system administrator (SA) and information system security officer (ISSO) when the audit record storage volume reaches 25 percent remaining of the allocated capacity. (/etc/audit/auditd.conf has the expected content (2 rules))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-653040, V-260596, SV-260596r971542_rule, CAT III. CCI-001855. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect:
      - { some: "~ ^space_left\\s*=\\s*(2[5-9]|[3-6][0-9])%" }
      - { some: "~ (?i)^space_left_action\\s*=\\s*email" }
    rationale: *rat-2e890833cd
    remediation: *rem-4fc54c3555
  - id: "STIG-UBTU-22-213010-kernel.dmesg_restrict"
    name: "Ubuntu 22.04 LTS must restrict access to the kernel message buffer."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-213010, V-260472, SV-260472r1268233_rule, CAT III. CCI-001090. NIST SP 800-53 Rev. 4: SC-4."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      sysctl -n kernel.dmesg_restrict
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-521b9a29b0 |
      Restricting access to the kernel message buffer limits access only to root. This prevents attackers from gaining additional system information as a nonprivileged user.
    remediation: &rem-52661611df |
      Configure Ubuntu 22.04 LTS to restrict access to the kernel message buffer.

      Add or modify the following line in the "/etc/sysctl.conf" file:

      kernel.dmesg_restrict = 1

      Remove any configurations that conflict with the above from the following locations:

      /run/sysctl.d/
      /etc/sysctl.d/
      /usr/local/lib/sysctl.d/
      /usr/lib/sysctl.d/
      /lib/sysctl.d/
      /etc/sysctl.conf

      Reload settings from all system configuration files by using the following command:

           $ sudo sysctl --system
  - id: "STIG-UBTU-22-213010-dmesg_restrict_1"
    name: "Ubuntu 22.04 LTS must restrict access to the kernel message buffer."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-213010, V-260472, SV-260472r1268233_rule, CAT III. CCI-001090. NIST SP 800-53 Rev. 4: SC-4."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      grep "kernel\.dmesg_restrict" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^*.conf:kernel.dmesg_restrict\\s*=\\s*1" }
      - { none: "~ ^*.conf:kernel.dmesg_restrict\\s*=\\s*0" }
    rationale: *rat-521b9a29b0
    remediation: *rem-52661611df
  - id: "STIG-UBTU-22-214010-auth_apt"
    name: "Ubuntu 22.04 LTS must be configured so that the Advance Package Tool (APT) prevents the installation of patches, service packs, device drivers, or operating system components without verification they have been digitally signed using a certificate that is recognized and approved by the organization."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-214010, V-260476, SV-260476r1268241_rule, CAT III. CCI-001749, CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      grep -i allowunauthenticated /etc/apt/apt.conf.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*:APT::Get::AllowUnauthenticated \"false\"" }
      - { none: "~ (?i)^.*:APT::Get::AllowUnauthenticated \"true\"" }
    rationale: &rat-85e8923a38 |
      Changes to any software components can have significant effects on the overall security of the operating system. This requirement ensures the software has not been tampered with and that it has been provided by a trusted vendor.

      Accordingly, patches, service packs, device drivers, or operating system components must be signed with a certificate recognized and approved by the organization.

      Verifying the authenticity of the software prior to installation validates the integrity of the patch or upgrade received from a vendor. This ensures the software has not been tampered with and that it has been provided by a trusted vendor. Self-signed certificates are disallowed by this requirement. The operating system should not have to verify the software again. This requirement does not mandate DoW certificates for this purpose; however, the certificate used to verify the software must be from an approved certificate authority (CA).
    remediation: &rem-23fba24a05 |
      Configure APT to prevent the installation of patches, service packs, device drivers, or Ubuntu operating system components without verification they have been digitally signed using a certificate that is recognized and approved by the organization.

      Add or modify the following line in any file under the "/etc/apt/apt.conf.d/" directory:

      APT::Get::AllowUnauthenticated "false";
  - id: "STIG-UBTU-22-215015-chrony_installed"
    name: "Ubuntu 22.04 LTS must have the \"chrony\" package installed."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-215015, V-260479, SV-260479r1268251_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu22, stig-cat-3]
    severity: low
    run: |
      dpkg-query -W -f='${Status}' chrony 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-866c7c0a47 |
      Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events. Sources outside the configured acceptable allowance (drift) may be inaccurate.

      Organizations must consider endpoints that may not have regular access to the authoritative time server (e.g., mobile, teleworking, and tactical endpoints).
    remediation: &rem-b707b0bb40 |
      Install the "chrony" network time protocol package using the following command:

           $ sudo apt-get install chrony
  - id: "STIG-UBTU-22-215020-timesyncd_not_installed"
    name: "Ubuntu 22.04 LTS must not have the \"systemd-timesyncd\" package installed."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-215020, V-260480, SV-260480r1268251_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu22, stig-cat-3]
