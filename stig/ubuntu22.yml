  - id: "STIG-UBTU-22-231010-disks_encrypted"
    name: "Ubuntu 22.04 LTS must implement cryptographic mechanisms to prevent unauthorized disclosure and modification of all information that requires protection at rest."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-231010, V-260484, SV-260484r1261427_rule, CAT I. CCI-001199, CCI-002475, CCI-002476. NIST SP 800-53 Rev. 4: SC-28."
    tags: [stig, stig-ubuntu22, stig-cat-1]
    severity: high
    run: |
      for part in `lsblk -l -o NAME,TYPE -n | grep part | awk '{print $1}'`; do grep $part /etc/crypttab 2>&1 /dev/null; if [ "$echo $?" -eq '0' ]; then export ENCRYPTED="Partitions are Encrypted"; else export ENCRYPTED="UnEncrypted partition(s) found"; fi; done; echo $ENCRYPTED
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ Partitions are Encrypted" }
    rationale: &rat-a38b57af20 |
      Operating systems handling data requiring "data at rest" protections must employ cryptographic mechanisms to prevent unauthorized disclosure and modification of the information at rest.

      Selection of a cryptographic mechanism is based on the need to protect the integrity of organizational information. The strength of the mechanism is commensurate with the security category and/or classification of the information. Organizations have the flexibility to either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific data structures (e.g., files, records, or fields).
    remediation: &rem-e88990508f |
      To encrypt an entire partition, dedicate a partition for encryption in the partition layout.

      Note: Encrypting a partition in an already-installed system is more difficult because it will need to be resized and existing partitions changed.
  - id: "STIG-UBTU-22-255010-ssh-client_present"
    name: "Ubuntu 22.04 LTS must have SSH installed."
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-255010, V-260523, SV-260523r958908_rule, CAT I. CCI-002418, CCI-002420, CCI-002422. NIST SP 800-53 Rev. 4: SC-8."
    tags: [stig, stig-ubuntu22, stig-cat-1]
    severity: high
    run: |
      dpkg-query -W -f='${Status}' openssh-client 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-26164c6453 |
      Without protection of the transmitted information, confidentiality and integrity may be compromised because unprotected communications can be intercepted and either read or altered.

      This requirement applies to both internal and external networks and all types of information system components from which information can be transmitted (e.g., servers, mobile devices, notebook computers, printers, copiers, scanners, and facsimile machines). Communication paths outside the physical protection of a controlled boundary are exposed to the possibility of interception and modification.

      Protecting the confidentiality and integrity of organizational information can be accomplished by physical means (e.g., employing physical distribution systems) or by logical means (e.g., employing cryptographic techniques). If physical means of protection are employed, then logical means (cryptography) do not have to be employed, and vice versa.
    remediation: &rem-9ab4d4cb5d |
      Install the "ssh" meta-package by using the following command:

           $ sudo apt install ssh
