    remediation: *rem-7b24ea1c13
  - id: "STIG-UBTU-22-611070-login_defs_encryption-attrs"
    name: "Ubuntu 22.04 LTS must encrypt all stored passwords with a FIPS 140-3-approved cryptographic hashing algorithm. (/etc/login.defs: exists)"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-611070, V-260572, SV-260572r1268232_rule, CAT II. CCI-000803. NIST SP 800-53 Rev. 4: IA-7."
    tags: [stig, stig-ubuntu22, stig-cat-2]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-02d8e626cf |
      Passwords need to be protected at all times, and encryption is the standard method for protecting passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised.
    remediation: &rem-4a79285e7a |
      Configure Ubuntu 22.04 LTS to encrypt all stored passwords.

      Add or modify the following line in the "/etc/login.defs" file:

      ENCRYPT_METHOD SHA512
  - id: "STIG-UBTU-22-611070-login_defs_encryption-content"
