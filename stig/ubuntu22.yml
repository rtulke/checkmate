  - id: "STIG-UBTU-22-411045-security_faillock-content"
    name: "Ubuntu 22.04 LTS must automatically lock an account until the locked account is released by an administrator when three unsuccessful logon attempts have been made. (/etc/security/faillock.conf has the expected content (5 rules))"
    description: "DISA STIG for Ubuntu 22.04 LTS, UBTU-22-411045, V-260549, SV-260549r958388_rule, CAT III. CCI-000044, CCI-002238. NIST SP 800-53 Rev. 4: AC-7."
