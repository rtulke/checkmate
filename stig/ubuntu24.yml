    rationale: *rat-ab14f84847
    remediation: *rem-ba0adba01b
  - id: "STIG-UBTU-24-300029-journal_module_cnf"
    name: "Ubuntu 24.04 LTS must generate audit records for all events that affect the systemd journal files. (Config)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300029, V-270715, SV-270715r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      grep journal /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (.*:|)-w /var/log/journal -p wa -k systemd_journal" }
    rationale: &rat-0cd2cf6773 |
      Once an attacker establishes access to a system, the attacker often attempts to create a persistent method of reestablishing access. One way to accomplish this is for the attacker to modify system level binaries and their operation. Auditing the systemd journal files provides logging that can be used for forensic purposes.

      To address access requirements, many operating systems may be integrated with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy requirements.
    remediation: &rem-428f6a1ddb |
      Configure Ubuntu 24.04 LTS to generate audit records for events that affect "/var/log/journal".

      Add or update the following rule to "/etc/audit/rules.d/stig.rules":

      -w /var/log/journal -p wa -k systemd_journal

      To reload the rules file, issue the following command:

      $ sudo augenrules --load
  - id: "STIG-UBTU-24-300029-journal_module_live"
    name: "Ubuntu 24.04 LTS must generate audit records for all events that affect the systemd journal files. (Live)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300029, V-270715, SV-270715r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      auditctl -l | grep journal
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /var/log/journal -p wa -k systemd_journal" }
    rationale: *rat-0cd2cf6773
    remediation: *rem-428f6a1ddb
  - id: "STIG-UBTU-24-300030-umask_login_defs-attrs"
    name: "Ubuntu 24.04 LTS default filesystem permissions must be defined in such a way that all authenticated users can read and modify only their own files. (/etc/login.defs: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300030, V-270716, SV-270716r1066637_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-4ee9105023 |
      Setting the most restrictive default permissions ensures that when new accounts are created, they do not have unnecessary access.
    remediation: &rem-b070c1af07 |
      Configure the system to define the default permissions for all authenticated users in such a way that the user can read and modify only their own files.

      Edit the "UMASK" parameter in the "/etc/login.defs" file to match the example below:

      UMASK 077
  - id: "STIG-UBTU-24-300030-umask_login_defs-content"
    name: "Ubuntu 24.04 LTS default filesystem permissions must be defined in such a way that all authenticated users can read and modify only their own files. (/etc/login.defs has the expected content (2 rules))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300030, V-270716, SV-270716r1066637_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^\\s*UMASK\\s+0?077\\s*$" }
      - { none: "~ ^\\s*UMASK\\s+0?[0-7]([0-6][0-7]|[0-7][0-6])\\s*$" }
    rationale: *rat-4ee9105023
    remediation: *rem-b070c1af07
  - id: "STIG-UBTU-24-300039-usb-storage_blacklist"
    name: "Ubuntu 24.04 LTS must disable automatic mounting of Universal Serial Bus (USB) mass storage driver."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300039, V-270718, SV-270718r1134811_rule, CAT II. CCI-001958, CCI-003959. NIST SP 800-53 Rev. 4: IA-3."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      grep -r usb-storage /etc/modprobe.conf /etc/modprobe.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^.*:install usb-storage \\/bin\\/(false|true)" }
      - { some: "~ ^.*:blacklist usb-storage" }
    rationale: &rat-d9086bbafc |
      Without authenticating devices, unidentified or unknown devices may be introduced, thereby facilitating malicious activity.

      Peripherals include, but are not limited to, devices such as flash drives, external storage, and printers.
    remediation: &rem-aaf0ddd079 |
      Configure Ubuntu 24.04 LTS to disable using the USB storage kernel module with the following command:

      $ sudo su -c "echo install usb-storage /bin/false >> /etc/modprobe.d/DISASTIG.conf"

      Configure Ubuntu 24.04 LTS to disable the ability to use USB mass storage devices with the following command:

      $ sudo su -c "echo blacklist usb-storage >> /etc/modprobe.d/DISASTIG.conf"
  - id: "STIG-UBTU-24-400000-unique_userID"
    name: "Ubuntu 24.04 LTS must uniquely identify interactive users."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400000, V-270720, SV-270720r1066649_rule, CAT II. CCI-000764, CCI-000804. NIST SP 800-53 Rev. 4: IA-2, IA-8."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      awk -F ":" 'list[$3]++{print $1, $3}' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-0c353c6263 |
      To ensure accountability and prevent unauthenticated access, organizational users must be identified and authenticated to prevent potential misuse and compromise of the system.

      Organizational users include organizational employees or individuals the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and processes acting on behalf of users) must be uniquely identified and authenticated to all accesses, except for the following:

      1) Accesses explicitly identified and documented by the organization. Organizations document specific user actions that can be performed on the information system without identification or authentication; and

      2) Accesses that occur through authorized use of group authenticators without individual authentication. Organizations may require unique identification of individuals in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity.
    remediation: &rem-246c2fe0c5 |
      Edit the file "/etc/passwd" and provide each interactive user account that has a duplicate UID with a unique UID.
  - id: "STIG-UBTU-24-400030-ssh_pubkeyauth-attrs"
    name: "Ubuntu 24.04 LTS must implement smart card logins for multifactor authentication for local and network access to privileged and nonprivileged accounts over SSH. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400030, V-270722, SV-270722r1268228_rule, CAT II. CCI-000765, CCI-000766. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-a398081fe8 |
      Without the use of multifactor authentication, the ease of access to privileged functions is greatly increased.

      Multifactor authentication requires using two or more factors to achieve authentication.

      Factors include:
      1) Something a user knows (e.g., password/PIN);
      2) Something a user has (e.g., cryptographic identification device, token); and
      3) Something a user is (e.g., biometric).

      A privileged account is defined as an information system account with authorizations of a privileged user.

      Network access is defined as access to an information system by a user (or a process acting on behalf of a user) communicating through a network (e.g., local area network, wide area network, or the internet).

      The DoW common access card (CAC) with DoW-approved PKI is an example of multifactor authentication.
    remediation: &rem-a8b86a1f5a |
      Configure Ubuntu 24.04 LTS to use multifactor authentication for access to accounts.

      Set the sshd option "PubkeyAuthentication" to "yes" in the "/etc/ssh/sshd_config" file.

      PubkeyAuthentication yes
  - id: "STIG-UBTU-24-400030-ssh_pubkeyauth-content"
    name: "Ubuntu 24.04 LTS must implement smart card logins for multifactor authentication for local and network access to privileged and nonprivileged accounts over SSH. (/etc/ssh/sshd_config has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400030, V-270722, SV-270722r1268228_rule, CAT II. CCI-000765, CCI-000766. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect: { some: "~ ^PubkeyAuthentication yes" }
    rationale: *rat-a398081fe8
    remediation: *rem-a8b86a1f5a
  - id: "STIG-UBTU-24-400030-ssh_pubkeyauth_live"
    name: "Ubuntu 24.04 LTS must implement smart card logins for multifactor authentication for local and network access to privileged and nonprivileged accounts over SSH."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400030, V-270722, SV-270722r1268228_rule, CAT II. CCI-000765, CCI-000766. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      sshd -T | grep -i pubkeyauthentication
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^pubkeyauthentication yes" }
    rationale: *rat-a398081fe8
    remediation: *rem-a8b86a1f5a
  - id: "STIG-UBTU-24-400110-root_acct_locked"
    name: "Ubuntu 24.04 LTS must prevent direct login to the root account."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400110, V-270724, SV-270724r1066661_rule, CAT II. CCI-004045. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      passwd -S root
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^root L" }
    rationale: &rat-da91312e98 |
      To ensure individual accountability and prevent unauthorized access, organizational users must be individually identified and authenticated.

      A group authenticator is a generic account used by multiple individuals. Use of a group authenticator alone does not uniquely identify individual users. Examples of the group authenticator are the Unix OS "root" user account, the Windows "Administrator" account, the "sa" account, or a "helpdesk" account.

      For example, the Unix and Windows operating systems offer a "switch user" capability allowing users to authenticate with their individual credentials and, when needed, switch to the administrator role. This method provides for unique individual authentication prior to using a group authenticator.

      Users (and any processes acting on behalf of users) need to be uniquely identified and authenticated for all accesses other than those accesses explicitly identified and documented by the organization, which outlines specific user actions that can be performed on Ubuntu 24.04 LTS without identification or authentication.

      Requiring individuals to be authenticated with an individual authenticator prior to using a group authenticator allows for traceability of actions, as well as adding an additional level of protection of the actions that can be taken with group account knowledge.
    remediation: &rem-8b6e5b82cb |
      Configure Ubuntu 24.04 LTS to prevent direct logins to the root account by performing the following operations:

      $ sudo passwd -l root
  - id: "STIG-UBTU-24-400220-common-password-sha-attrs"
    name: "Ubuntu 24.04 LTS must store only encrypted representations of passwords. (/etc/pam.d/common-password: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400220, V-270725, SV-270725r1101789_rule, CAT II. CCI-004062. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/pam.d/common-password'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-a0ec2c90b0 |
      Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks. If the information system or application allows the user to consecutively reuse their password when that password has exceeded its defined lifetime, the end result is a password that is not changed per policy requirements.
    remediation: &rem-44fef827a1 |
      Configure Ubuntu 24.04 LTS to store encrypted representations of passwords.

      Add or modify the "sha512" parameter value to the following line in "/etc/pam.d/common-password" file:

      password [success=1 default=ignore] pam_unix.so obscure sha512 shadow rounds=100000
  - id: "STIG-UBTU-24-400220-common-password-sha-content"
    name: "Ubuntu 24.04 LTS must store only encrypted representations of passwords. (/etc/pam.d/common-password has the expected content (2 rules))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400220, V-270725, SV-270725r1101789_rule, CAT II. CCI-004062. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/pam.d/common-password'
    allow_rc: any
    expect:
      - { some: "~ ^password.*pam_unix.so.*sha512" }
      - { some: "~ ^password.*pam_unix\\.so.*rounds=[1-9][0-9]{5,}" }
    rationale: *rat-a0ec2c90b0
    remediation: *rem-44fef827a1
  - id: "STIG-UBTU-24-400260-passwd_uppercase-attrs"
    name: "Ubuntu 24.04 LTS must enforce password complexity by requiring that at least one uppercase character be used. (/etc/security/pwquality.conf: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400260, V-270726, SV-270726r1066667_rule, CAT II. CCI-004065, CCI-004066. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/security/pwquality.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-2c9c8f2cfc |
      Use of a complex password helps to increase the time and resources required to compromise the password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks.

      Password complexity is one factor of several that determines how long it takes to crack a password. The more complex the password, the greater the number of possible combinations that need to be tested before the password is compromised.
    remediation: &rem-9d12eec574 |
      Configure Ubuntu 24.04 LTS to enforce password complexity by requiring that at least one uppercase character be used.

      Add or update the "/etc/security/pwquality.conf" file to contain the "ucredit" parameter:

      ucredit=-1
  - id: "STIG-UBTU-24-400260-passwd_uppercase-content"
    name: "Ubuntu 24.04 LTS must enforce password complexity by requiring that at least one uppercase character be used. (/etc/security/pwquality.conf has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400260, V-270726, SV-270726r1066667_rule, CAT II. CCI-004065, CCI-004066. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
