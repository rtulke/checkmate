name: DISA STIG Ubuntu 24.04 LTS
version: "1.7.0"
description: >
  Automated checks for 176 rules of the DISA Security Technical
  Implementation Guide for Ubuntu 24.04 LTS (version 1.7.0), converted from the goss
  audit content of the ansible-lockdown project. Severity follows the STIG
  category: CAT I high, CAT II medium, CAT III low. Rationale and fix
  texts are taken from the DISA STIG V1R7 (30 Sep 2026). Select categories
  with tags, e.g. `--tags stig-cat-1`.

defaults:
  when: "facts.distro == \"ubuntu\" and facts.version_major == 24"
  timeout: 120s

checks:
  - id: "STIG-UBTU-24-100030-telnet_absent"
    name: "Ubuntu 24.04 LTS must not have the telnet package installed."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100030, V-270647, SV-270647r1261506_rule, CAT I. CCI-000197. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu24, stig-cat-1]
    severity: high
    run: |
      dpkg-query -W -f='${Status}' telnetd 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: &rat-dbfade3edb |
      Remote access services, such as those providing remote access to network devices and information systems, which lack automated control capabilities, increase risk and make remote user access management difficult at best.

      Remote access is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      Ubuntu 24.04 LTS functionality (e.g., RDP) must be capable of taking enforcement action if the audit reveals unauthorized activity. Automated control of remote access sessions allows organizations to ensure ongoing compliance with remote access policies by enforcing connection rules of remote access applications on a variety of information system components (e.g., servers, workstations, notebook computers, smartphones, and tablets).
    remediation: &rem-f1fe8436af |
      Remove the telnet package from Ubuntu 24.04 LTS with the following command:

      $ sudo apt remove telnetd
  - id: "STIG-UBTU-24-100040-rsh-server_absent"
    name: "Ubuntu 24.04 LTS must not have the rsh-server package installed."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100040, V-270648, SV-270648r1066433_rule, CAT I. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-ubuntu24, stig-cat-1]
    severity: high
    run: |
      dpkg-query -W -f='${Status}' rsh-server 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: &rat-2c99b59937 |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore, may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      Operating systems are capable of providing a wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary to support essential organizational operations (e.g., key missions, functions).

      Examples of nonessential capabilities include, but are not limited to, games, software packages, tools, and demonstration software, not related to requirements or providing a wide array of functionality not required for every mission, but which cannot be disabled.
    remediation: &rem-dffa7f0033 |
      Configure Ubuntu 24.04 LTS to disable nonessential capabilities by removing the rsh-server package from the system with the following command:

      $ sudo apt remove rsh-server
  - id: "STIG-UBTU-24-100050-nfs-kernel-server_absent"
    name: "Ubuntu 24.04 LTS must not have the nfs-kernel-server package installed."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100050, V-279938, SV-279938r1261502_rule, CAT I. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-ubuntu24, stig-cat-1]
    severity: high
    run: |
      dpkg-query -W -f='${Status}' nfs-kernel-server 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: &rat-42cd3bad80 |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      Operating systems are capable of providing a wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary to support essential organizational operations (e.g., key missions, functions).

      Examples of nonessential capabilities include, but are not limited to, games, software packages, tools, and demonstration software, not related to requirements or providing a wide array of functionality not required for every mission, but which cannot be disabled.
