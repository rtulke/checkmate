  - id: "STIG-UBTU-24-300006-library_file_perms"
    name: "Ubuntu 24.04 LTS library files must have mode 0755 or less permissive."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300006, V-270696, SV-270696r1107306_rule, CAT II. CCI-001499. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      LIB_FILE_PERM=$(find /lib /lib64 /usr/lib /usr/lib64 -perm /022 -type f -printf '.' | wc -c); \
      if [ "$LIB_FILE_PERM" -eq 0 ]; \
      then echo "OK - No files or Directories found"; \
      else echo "FAIL - Files found"; \
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK - No files or Directories found" }
    rationale: &rat-37aa20252c |
      If Ubuntu 24.04 LTS were to allow any user to make changes to software libraries, then those changes might be implemented without undergoing the appropriate testing and approvals that are part of a robust change management process.

      This requirement applies to operating systems with software libraries that are accessible and configurable, as in the case of interpreted languages. Software libraries also include privileged programs that execute with escalated privileges. Only qualified and authorized individuals must be allowed to obtain access to information system components for purposes of initiating changes, including upgrades and modifications.
    remediation: &rem-9507e5e993 |
      Configure the systemwide shared library files contained in the directories "/lib", "/lib64", "/usr/lib", and "/usr/lib64" to have mode 0755 or less permissive with the following command:

      $ sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' -perm /022 -exec chmod go-w {} +
