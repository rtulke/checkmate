  - id: "STIG-UBTU-24-300014-passwd_dictcheck-attrs"
    name: "Ubuntu 24.04 LTS must prevent the use of dictionary words for passwords. (/etc/security/pwquality.conf: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300014, V-270704, SV-270704r1066601_rule, CAT II. CCI-004061. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/security/pwquality.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-a47d1ce59c |
      Password-based authentication applies to passwords regardless of whether they are used in single-factor or multifactor authentication. Long passwords or passphrases are preferable over shorter passwords. Enforced composition rules provide marginal security benefits while decreasing usability. However, organizations may choose to establish certain rules for password generation (e.g., minimum character length for long passwords) under certain circumstances and can enforce this requirement in IA-5(1)(h). Account recovery can occur, for example, in situations when a password is forgotten. Cryptographically protected passwords include salted one-way cryptographic hashes of passwords. The list of commonly used, compromised, or expected passwords includes passwords obtained from previous breach corpuses, dictionary words, and repetitive or sequential characters. The list includes context-specific words, such as the name of the service, username, and derivatives thereof.
    remediation: &rem-4ddcd807b9 |
      Configure Ubuntu 24.04 LTS to prevent the use of dictionary words for passwords.

      Add or update the following line in the "/etc/security/pwquality.conf" file to include the "dictcheck=1" parameter:

      dictcheck=1
  - id: "STIG-UBTU-24-300014-passwd_dictcheck-content"
    name: "Ubuntu 24.04 LTS must prevent the use of dictionary words for passwords. (/etc/security/pwquality.conf has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300014, V-270704, SV-270704r1066601_rule, CAT II. CCI-004061. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/security/pwquality.conf'
    allow_rc: any
    expect: { some: "~ ^dictcheck\\s*=\\s*1$" }
    rationale: *rat-a47d1ce59c
    remediation: *rem-4ddcd807b9
  - id: "STIG-UBTU-24-300016-common-password-retry-attrs"
    name: "Ubuntu 24.04 LTS must be configured so that when passwords are changed or new passwords are established, pwquality must be used. (/etc/pam.d/common-password: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300016, V-270705, SV-270705r1066604_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/pam.d/common-password'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-8c2b3e1db6 |
      Use of a complex password helps to increase the time and resources required to compromise the password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks. "pwquality" enforces complex password construction configuration and has the ability to limit brute-force attacks on the system.
    remediation: &rem-b793177a91 |
      Configure Ubuntu 24.04 LTS to use "pwquality" to enforce password complexity rules.

      Add the following line to "/etc/security/pwquality.conf" (or modify the line to have the required value):

      enforcing = 1

      Add the following line to "/etc/pam.d/common-password" (or modify the line to have the required value):

      password requisite pam_pwquality.so retry=3

      Note: Ensure the value of "retry" is between "1" and "3".
