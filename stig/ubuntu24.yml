      - { some: "~ ^silent" }
      - { some: "~ ^deny\\s*=\\s*[1-3]" }
      - { some: "~ ^fail_interval\\s*=\\s*(900|[1-8][0-9]{1,2}|[1-9][0-9])" }
      - { some: "~ ^unlock_time\\s*=\\s*0" }
    rationale: *rat-c7aa300a3e
    remediation: *rem-6e147b80e0
  - id: "STIG-UBTU-24-300001-auth_apt"
    name: "Ubuntu 24.04 LTS Advance Package Tool (APT) must be configured to prevent the installation of patches, service packs, device drivers, or Ubuntu 24.04 LTS components without verification they have been digitally signed using a certificate that is recognized and approved by the organization."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300001, V-270695, SV-270695r1268241_rule, CAT III. CCI-003992. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      grep -i allowunauthenticated /etc/apt/apt.conf.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*:APT::Get::AllowUnauthenticated \"false\"" }
      - { none: "~ (?i)^.*:APT::Get::AllowUnauthenticated \"true\"" }
    rationale: &rat-5b9f99ef83 |
      Changes to any software components can have significant effects on the overall security of Ubuntu 24.04 LTS. This requirement ensures the software has not been tampered with and that it has been provided by a trusted vendor.

      Accordingly, patches, service packs, device drivers, or operating system components must be signed with a certificate recognized and approved by the organization.

      Verifying the authenticity of the software prior to installation validates the integrity of the patch or upgrade received from a vendor. This ensures the software has not been tampered with and that it has been provided by a trusted vendor. Self-signed certificates are disallowed by this requirement. Ubuntu 24.04 LTS will not have to verify the software again. This requirement does not mandate DoW certificates for this purpose; however, the certificate used to verify the software must be from an approved CA.
    remediation: &rem-ece07f1748 |
      Configure APT to prevent the installation of patches, service packs, device drivers, or Ubuntu 24.04 LTS components without verification they have been digitally signed using a certificate recognized and approved by the organization.

      Remove/update any APT configuration files that contain the variable "AllowUnauthenticated" to "false" or remove "AllowUnauthenticated" entirely from each file. Below is an example of setting the "AllowUnauthenticated" variable to "false":

      APT::Get::AllowUnauthenticated "false";
  - id: "STIG-UBTU-24-300017-pam_auth_faildelay-attrs"
    name: "Ubuntu 24.04 LTS must enforce a delay of at least four seconds between logon prompts following a failed logon attempt. (/etc/pam.d/common-auth: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300017, V-270706, SV-270706r1068361_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      f='/etc/pam.d/common-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f17edf59db |
      Limiting the number of logon attempts over a certain time interval reduces the chances that an unauthorized user may gain access to an account.

      The delay option is set in microseconds.
    remediation: &rem-09fd093342 |
      Configure Ubuntu 24.04 LTS to enforce a delay of at least four seconds between logon prompts following a failed logon attempt.

      Edit the file "/etc/pam.d/common-auth" and set the parameter "pam_faildelay" to a value of "4000000" or greater:

      auth    required    pam_faildelay.so    delay=4000000
  - id: "STIG-UBTU-24-300017-pam_auth_faildelay-content"
    name: "Ubuntu 24.04 LTS must enforce a delay of at least four seconds between logon prompts following a failed logon attempt. (/etc/pam.d/common-auth has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300017, V-270706, SV-270706r1068361_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      cat '/etc/pam.d/common-auth'
    allow_rc: any
    expect: { some: "~ ^auth\\s+required\\s+pam_faildelay.so\\s+delay=4000000" }
    rationale: *rat-f17edf59db
    remediation: *rem-09fd093342
  - id: "STIG-UBTU-24-400340-sssd_offline_cred_cache"
    name: "Ubuntu 24.04 LTS must be configured such that Pluggable Authentication Module (PAM) prohibits the use of cached authentications after one day."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400340, V-270734, SV-270734r1155240_rule, CAT III. CCI-002007. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      grep -i '^\s*offline_credentials_expiration' /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^offline_credentials_expiration\\s*=\\s*1" }
      - { none: "~ ^offline_credentials_expiration\\s*=\\s*[^1]" }
    rationale: &rat-14bf699e12 |
      If cached authentication information is out-of-date, the validity of the authentication information may be questionable.
    remediation: &rem-880e9bb0c1 |
      Configure PAM to prohibit the use of cached authentications after one day. Add or change the following line in "/etc/sssd/sssd.conf" just below the line "[pam]":

      offline_credentials_expiration = 1

      Note: It is valid for this configuration to be in a file with a name that ends with ".conf" and does not begin with a "." in the "/etc/sssd/conf.d/" directory instead of the "/etc/sssd/sssd.conf" file.
  - id: "STIG-UBTU-24-600140-kernel.dmesg_restrict"
    name: "Ubuntu 24.04 LTS must restrict access to the kernel message buffer."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600140, V-270749, SV-270749r1268233_rule, CAT III. CCI-001090. NIST SP 800-53 Rev. 4: SC-4."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      sysctl -n kernel.dmesg_restrict
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-521b9a29b0 |
      Restricting access to the kernel message buffer limits access only to root. This prevents attackers from gaining additional system information as a nonprivileged user.
    remediation: &rem-ae89fa138f |
      Configure Ubuntu 24.04 LTS to restrict access to the kernel message buffer.

      Set the system to the required kernel parameter by adding or modifying the following line in /etc/sysctl.conf or a config file in the /etc/sysctl.d/ directory:

           kernel.dmesg_restrict = 1

      Remove any configurations that conflict with the above from the following locations:
           /run/sysctl.d/
           /etc/sysctl.d/
           /usr/local/lib/sysctl.d/
           /usr/lib/sysctl.d/
           /lib/sysctl.d/
           /etc/sysctl.conf

      Reload settings from all system configuration files with the following command:

           $ sudo sysctl --system
  - id: "STIG-UBTU-24-600140-dmesg_restrict_1"
    name: "Ubuntu 24.04 LTS must restrict access to the kernel message buffer. (conf)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600140, V-270749, SV-270749r1268233_rule, CAT III. CCI-001090. NIST SP 800-53 Rev. 4: SC-4."
    tags: [stig, stig-ubuntu24, stig-cat-3]
