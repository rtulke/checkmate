    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-9214489f7c |
      Without reauthentication, users may access resources or perform tasks for which they do not have authorization.

      When operating systems provide the capability to escalate a functional capability, it is critical the user reauthenticate.
    remediation: &rem-c8fe0126fb |
      Remove any occurrence of "!authenticate" found in "/etc/sudoers" file or files in the "/etc/sudoers.d" directory.
  - id: "STIG-UBTU-24-300023-sshd_ciphers-attrs"
    name: "Ubuntu 24.04 LTS SSH daemon must prevent remote hosts from connecting to the proxy display. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300023, V-270709, SV-270709r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ab14f84847 |
      When X11 forwarding is enabled, there may be additional exposure to the server and client displays if the sshd proxy display is configured to listen on the wildcard address. By default, sshd binds the forwarding server to the loopback address and sets the hostname part of the DISPLAY environment variable to localhost. This prevents remote hosts from connecting to the proxy display.
    remediation: &rem-ba0adba01b |
      Configure the SSH daemon to prevent remote hosts from connecting to the proxy display.

      Edit the "/etc/ssh/sshd_config" file to uncomment or add the line for the "X11UseLocalhost" keyword and set its value to "yes" (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor):

      X11UseLocalhost yes

      Restart SSH for the changes to take effect:

      $ sudo systemctl restart ssh
  - id: "STIG-UBTU-24-300023-sshd_ciphers-content"
    name: "Ubuntu 24.04 LTS SSH daemon must prevent remote hosts from connecting to the proxy display. (/etc/ssh/sshd_config has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300023, V-270709, SV-270709r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
