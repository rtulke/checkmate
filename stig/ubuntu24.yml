  - id: "STIG-UBTU-24-600090-disks_encrypted"
    name: "Ubuntu 24.04 LTS handling data requiring data-at-rest protections must employ cryptographic mechanisms to prevent unauthorized disclosure and modification of the information at rest."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600090, V-270747, SV-270747r1261473_rule, CAT I. CCI-001199, CCI-002475, CCI-002476, CCI-004910. NIST SP 800-53 Rev. 4: SC-28."
    tags: [stig, stig-ubuntu24, stig-cat-1]
    severity: high
    run: |
      for part in `lsblk -l -o NAME,TYPE -n | grep part | awk '{print $1}'`; do grep $part /etc/crypttab 2>&1 /dev/null; if [ "$echo $?" -eq '0' ]; then export ENCRYPTED="Partitions are Encrypted"; else export ENCRYPTED="UnEncrypted partition(s) found"; fi; done; echo $ENCRYPTED
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ Partitions are Encrypted" }
    rationale: &rat-e8d57ca4a8 |
      Information at rest refers to the state of information when it is located on a secondary storage device (e.g., disk drive and tape drive, when used for backups) within an operating system.

      This requirement addresses protection of user-generated data, as well as operating system-specific configuration data. Organizations may choose to employ different mechanisms to achieve confidentiality and integrity protections, as appropriate, in accordance with the security category and/or classification of the information.
    remediation: &rem-e88990508f |
      To encrypt an entire partition, dedicate a partition for encryption in the partition layout.

      Note: Encrypting a partition in an already-installed system is more difficult because it will need to be resized and existing partitions changed.
  - id: "STIG-UBTU-24-600130-sudo_group_users"
    name: "Ubuntu 24.04 LTS must ensure only users who need access to security functions are part of sudo group."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600130, V-270748, SV-270748r1066733_rule, CAT I. CCI-001084. NIST SP 800-53 Rev. 4: SC-3."
    tags: [stig, stig-ubuntu24, stig-cat-1]
    severity: high
    run: |
      grep sudo /etc/group | awk -F: '{print $NF}'
    expect: { rc: "in [0, 1]" }
    rationale: &rat-d6a0db8fe1 |
      An isolation boundary provides access control and protects the integrity of the hardware, software, and firmware that perform security functions.

      Security functions are the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection is based. Operating systems implement code separation (i.e., separation of security functions from nonsecurity functions) in a number of ways, including through the provision of security kernels via processor rings or processor modes. For nonkernel code, security function isolation is often achieved through file system protections that serve to protect the code on disk and address space protections that protect executing code.

      Developers and implementers can increase the assurance in security functions by employing well-defined security policy models; structured, disciplined, and rigorous hardware and software development techniques; and sound system/security engineering principles. Implementation may include isolation of memory space and libraries.

      Ubuntu 24.04 LTS restricts access to security functions through the use of access control mechanisms and by implementing least privilege capabilities.
    remediation: &rem-1eb279e471 |
      Configure the sudo group with only members requiring access to security functions.

      To remove a user from the sudo group, run:

      $ sudo gpasswd -d <username> sudo
  - id: "STIG-UBTU-24-700400-vendor_supported_release"
    name: "Ubuntu 24.04 LTS must be a vendor-supported release."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-700400, V-278917, SV-278917r1268251_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-1]
    severity: high
    run: |
      end_of_standard_support=$(date -d '2029-06-01' '+%s')
      now=$(date '+%s')
      if [ "$now" -lt "$end_of_standard_support" ]; then
        echo "OK - Ubuntu 24.04 LTS is within Canonical standard support window"
      else
        echo "FAIL - Ubuntu 24.04 LTS standard support has ended"
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^OK" }
    rationale: &rat-e4e42e8792 |
      An operating system release is considered "supported" if the vendor continues to provide security patches for the product. With an unsupported release, it will not be possible to resolve security issues discovered in the system software.

      The support status of the OS depends on its subscription status.

      End Of Life dates for Ubuntu 24.04 releases are as follows:
      Standard Support: April 2029
      Extended Security Maintenance (ESM): April 2036

      ESM is available via an Ubuntu Pro subscription.
    remediation: &rem-cd5d853aa2 |
      Upgrade to a supported version of Ubuntu 24.04 LTS.
  - id: "STIG-UBTU-24-100100-aide_installed"
    name: "Ubuntu 24.04 LTS must use a file integrity tool to verify correct operation of all security functions."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100100, V-270649, SV-270649r1067136_rule, CAT II. CCI-002696. NIST SP 800-53 Rev. 4: SI-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' aide 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-735cbffb0b |
      Without verification, security functions may not operate correctly and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.

      This requirement applies to Ubuntu 24.04 LTS performing security function verification/testing and/or systems and environments that require this functionality.
    remediation: &rem-3983d229c2 |
      Install the "AIDE" file integrity package:

      $ sudo apt install -y aide
  - id: "STIG-UBTU-24-100110-ubtu24stig_allow_aide_check"
    name: "Ubuntu 24.04 LTS must configure AIDE to perform file integrity checking on the file system if installed."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100110, V-270650, SV-270650r1155241_rule, CAT II. CCI-002696. NIST SP 800-53 Rev. 4: SI-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      echo "Aide Check to be run manually due to system impact"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Aide Check to be run manually due to system impact!!" }
    rationale: *rat-735cbffb0b
    remediation: &rem-3b9f75eaef |
      Initialize the AIDE package (this may take a few minutes):
      $ sudo aideinit
      Running aide --init...

      The new database will need to be renamed to be read by AIDE:
      $ sudo cp -p /var/lib/aide/aide.db.new /var/lib/aide/aide.db

      Perform a manual check:
      $ sudo aide -c /etc/aide/aide.conf --check

      Example output:
      ...
      Start timestamp: 2024-10-30 14:22:38 -0400 (AIDE 0.18.6)
      AIDE found differences between database and filesystem!!
      ...

      Done.
  - id: "STIG-UBTU-24-100120-aide_cron_sha"
    name: "Ubuntu 24.04 LTS must be configured so that the script which runs each 30 days or less to check file integrity is the default one."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100120, V-270651, SV-270651r1068395_rule, CAT II. CCI-002699. NIST SP 800-53 Rev. 4: SI-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      grep -r aide /etc/cron* /etc/crontab && systemctl list-timers | grep aide
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ SCRIPT=\"/usr/share/aide/bin/dailyaidecheck\"" }
      - { some: "~ .*- dailyaidecheck.timer         dailyaidecheck.service" }
    rationale: &rat-8f1619efda |
      Without verification, security functions may not operate correctly and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.

      Notifications provided by information systems include, for example, electronic alerts to system administrators, messages to local computer consoles, and/or hardware indications, such as lights.

      This requirement applies to Ubuntu 24.04 LTS performing security function verification/testing and/or systems and environments that require this functionality.
    remediation: &rem-1dff34be9f |
      The cron file for AIDE is fairly complex as it creates the report. This file is installed with the "aide-common" package, and the default can be restored by copying it from the package:

      Download the original package to the /tmp dir:

      $ cd /tmp; apt download aide-common

      Extract the aide script to its original place:

      $ dpkg-deb --fsys-tarfile /tmp/aide-common_*.deb | sudo tar -x --wildcards ./usr/share/aide/config/cron.daily/dailyaidecheck* -C /

      Copy it to the cron.daily directory:

      $  sudo cp -f /usr/share/aide/config/cron.daily/aide /etc/cron.daily/dailyaidecheck*
  - id: "STIG-UBTU-24-100130-aide_silentreports-attrs"
    name: "Ubuntu 24.04 LTS must notify designated personnel if baseline configurations are changed in an unauthorized manner. The file integrity tool must notify the system administrator (SA) when changes to the baseline configuration or anomalies in the operation of any security functions are discovered. (/etc/default/aide: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100130, V-270652, SV-270652r1067138_rule, CAT II. CCI-001744, CCI-002702. NIST SP 800-53 Rev. 4: CM-3, SI-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/default/aide'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-9e6c11cda1 |
      Unauthorized changes to the baseline configuration could make the system vulnerable to various attacks or allow unauthorized access to Ubuntu 24.04 LTS. Changes to Ubuntu 24.04 LTS configurations can have unintended side effects, some of which may be relevant to security.

      Detecting such changes and providing an automated response can help avoid unintended, negative consequences that could ultimately affect the security state of Ubuntu 24.04 LTS. Ubuntu 24.04 LTS' IMO/information system security officer (ISSO) and SAs must be notified via email and/or monitoring system trap when there is an unauthorized modification of a configuration item.
    remediation: &rem-7d1e14622e |
      Configure Ubuntu 24.04 LTS to notify designated personnel if baseline configurations are changed in an unauthorized manner.

      Modify the "SILENTREPORTS" parameter in the "/etc/default/aide" file with a value of "no" if it does not already exist as follows:

      SILENTREPORTS=no
  - id: "STIG-UBTU-24-100130-aide_silentreports-content"
    name: "Ubuntu 24.04 LTS must notify designated personnel if baseline configurations are changed in an unauthorized manner. The file integrity tool must notify the system administrator (SA) when changes to the baseline configuration or anomalies in the operation of any security functions are discovered. (/etc/default/aide has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100130, V-270652, SV-270652r1067138_rule, CAT II. CCI-001744, CCI-002702. NIST SP 800-53 Rev. 4: CM-3, SI-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/default/aide'
    allow_rc: any
    expect: { some: "~ (?i)^SILENTREPORTS\\s*=\\s*no" }
    rationale: *rat-9e6c11cda1
    remediation: *rem-7d1e14622e
  - id: "STIG-UBTU-24-100200-rsyslog_installed"
    name: "Ubuntu 24.04 LTS must be configured to preserve log records from failure events."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100200, V-270653, SV-270653r1067141_rule, CAT II. CCI-001665. NIST SP 800-53 Rev. 4: SC-24."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' rsyslog 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-c30acd83c8 |
      Failure to a known state can address safety or security in accordance with the mission/business needs of the organization. Failure to a known secure state helps prevent a loss of confidentiality, integrity, or availability in the event of a failure of the information system or a component of the system.

      Preserving operating system state information helps to facilitate operating system restart and return to the operational mode of the organization with least disruption to mission/business processes.
    remediation: &rem-f142655ca5 |
      Configure the log service to collect failure events.

      Install the log service (if the log service is not already installed) with the following command:

      $ sudo apt install -y rsyslog

      Enable the log service with the following command:

      $ sudo systemctl enable --now rsyslog
  - id: "STIG-UBTU-24-100200-rsyslog_running-enabled"
    name: "Ubuntu 24.04 LTS must be configured to preserve log records from failure events. (Service rsyslog is enabled)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100200, V-270653, SV-270653r1067141_rule, CAT II. CCI-001665. NIST SP 800-53 Rev. 4: SC-24."
