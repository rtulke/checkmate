  - id: "STIG-UBTU-24-100500-apparmor"
    name: "Ubuntu 24.04 LTS must have AppArmor installed."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100500, V-270659, SV-270659r1066466_rule, CAT II. CCI-001764, CCI-001774, CCI-002165. NIST SP 800-53 Rev. 4: CM-7, AC-3."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' apparmor 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-82d1499f29 |
      Control of program execution is a mechanism used to prevent execution of unauthorized programs. Some operating systems may provide a capability that runs counter to the mission or provides users with functionality that exceeds mission requirements. This includes functions and services installed at Ubuntu 24.04 LTS-level.

      Some of the programs, installed by default, may be harmful or may not be necessary to support essential organizational operations (e.g., key missions, functions). Removal of executable programs is not always possible; therefore, establishing a method of preventing program execution is critical to maintaining a secure system baseline.

      Methods for complying with this requirement include restricting execution of programs in certain environments, while preventing execution in other environments; or limiting execution of certain program functionality based on organization-defined criteria (e.g., privileges, subnets, sandboxed environments, or roles).
    remediation: &rem-c057bbbe89 |
      Install "AppArmor" with the following command:

      $ sudo apt install apparmor

      Note: AppArmor must have properly configured profiles for applications and home directories. All configurations will be based on the actual system setup and organization and normally are on a per role basis. Refer to the AppArmor documentation for more information on configuring profiles.
  - id: "STIG-UBTU-24-100510-apparmor-enabled"
    name: "Ubuntu 24.04 LTS must be configured to use AppArmor. (Service apparmor is enabled)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100510, V-270660, SV-270660r1066469_rule, CAT II. CCI-001764, CCI-001774, CCI-002235. NIST SP 800-53 Rev. 4: CM-7, AC-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState apparmor | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-82d1499f29
    remediation: &rem-c1995f7080 |
      Enable "apparmor" with the following command:

      $ sudo systemctl enable apparmor.service

      Start "apparmor" with the following command:

      $ sudo systemctl start apparmor.service

      Note: AppArmor must have properly configured profiles for applications and home directories. All configurations will be based on the actual system setup and organization and normally are on a per role basis. Refer to the AppArmor documentation for more information on configuring profiles.
  - id: "STIG-UBTU-24-100510-apparmor-running"
    name: "Ubuntu 24.04 LTS must be configured to use AppArmor. (Service apparmor is running)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100510, V-270660, SV-270660r1066469_rule, CAT II. CCI-001764, CCI-001774, CCI-002235. NIST SP 800-53 Rev. 4: CM-7, AC-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState apparmor | cut -d= -f2
    expect: "== active"
    rationale: *rat-82d1499f29
    remediation: *rem-c1995f7080
  - id: "STIG-UBTU-24-100820-sshd_ciphers_conf-attrs"
    name: "Ubuntu 24.04 LTS must configure the SSH daemon to use FIPS 140-3 approved ciphers to prevent the unauthorized disclosure of information and/or detect changes to information during transmission. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100820, V-270667, SV-270667r1268222_rule, CAT II. CCI-000068, CCI-002421, CCI-003123. NIST SP 800-53 Rev. 4: AC-17, SC-8, MA-4."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-9e0ac1863b |
      Without cryptographic integrity protections, information can be altered by unauthorized users without detection.

      Remote access (e.g., RDP) is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      Nonlocal maintenance and diagnostic activities are those activities conducted by individuals communicating through a network, either an external network (e.g., the internet) or an internal network.

      Local maintenance and diagnostic activities are those activities carried out by individuals physically present at the information system or information system component and not communicating across a network connection.

      Encrypting information for transmission protects information from unauthorized disclosure and modification. Cryptographic mechanisms implemented to protect information integrity include, for example, cryptographic hash functions that have common application in digital signatures, checksums, and message authentication codes.
    remediation: &rem-5765c256c0 |
      Configure Ubuntu 24.04 LTS to allow the SSH daemon to only implement FIPS-approved algorithms.

      Add the following line (or modify the line to have the required value) to the "/etc/ssh/sshd_config" file (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor):

      Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr

      Restart the "sshd" service for changes to take effect:

      $ sudo systemctl restart sshd
  - id: "STIG-UBTU-24-100820-sshd_ciphers_conf-content"
    name: "Ubuntu 24.04 LTS must configure the SSH daemon to use FIPS 140-3 approved ciphers to prevent the unauthorized disclosure of information and/or detect changes to information during transmission. (/etc/ssh/sshd_config has the expected content (1 rule))"
