  - id: "STIG-UBTU-24-200280-etc_passwd_module_cnf"
    name: "Ubuntu 24.04 LTS must generate audit records for all account creations, modifications, disabling, and termination events that affect /etc/passwd. (Config)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-200280, V-270684, SV-270684r1066541_rule, CAT II. CCI-000018, CCI-000172, CCI-001403, CCI-001404, CCI-001405, CCI-002130. NIST SP 800-53 Rev. 4: AC-2, AU-12."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      grep passwd /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (.*:|)-w /etc/passwd -p wa -k usergroup_modification" }
    rationale: &rat-b47becde3d |
      Once an attacker establishes access to a system, the attacker often attempts to create a persistent method of reestablishing access. One way to accomplish this is for the attacker to create an account. Auditing account creation actions provides logging that can be used for forensic purposes.

      To address access requirements, many operating systems may be integrated with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy requirements.
    remediation: &rem-a55b5b4867 |
      Configure Ubuntu 24.04 LTS to generate audit records for all account creations, modifications, disabling, and termination events that affect "/etc/passwd".

      Add or update the following rule to "/etc/audit/rules.d/stig.rules":

      -w /etc/passwd -p wa -k usergroup_modification

      To reload the rules file, issue the following command:

      $ sudo augenrules --load
