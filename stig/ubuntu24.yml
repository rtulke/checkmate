  - id: "STIG-UBTU-24-901380-auditd_log_dir_perms-attrs"
    name: "Ubuntu 24.04 LTS must be configured so that the audit log directory is not write-accessible by unauthorized users."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-901380, V-270830, SV-270830r1068397_rule, CAT II. CCI-000164. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/var/log/audit'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-239b7ff7a1 |
      If audit information were to become compromised, then forensic analysis and discovery of the true source of potentially malicious system activity is impossible to achieve.

      To ensure the veracity of audit information, Ubuntu 24.04 LTS must protect audit information from unauthorized deletion. This requirement can be achieved through multiple methods, which will depend upon system architecture and design.

      Audit information includes all information (e.g., audit records, audit settings, audit reports) needed to successfully audit information system activity.
    remediation: &rem-e18423a570 |
      Configure the audit log directory to have a mode of "0750" or less permissive.

      Determine where the audit logs are stored with the following command:

      $ sudo grep -iw ^log_file /etc/audit/auditd.conf

      log_file = /var/log/audit/audit.log

      Using the path of the directory containing the audit logs, configure the audit log directory to have a mode of "0750" or less permissive by using the following command:

      $ sudo chmod -R  750 /var/log/audit
  - id: "STIG-UBTU-24-909000-protect_rules_module_cnf"
    name: "Ubuntu 24.04 LTS audit system must protect auditing rules from unauthorized change. (Config)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-909000, V-270832, SV-270832r1261488_rule, CAT II. CCI-000163. NIST SP 800-53 Rev. 4: AU-12."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      grep -HE '^-e 2' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^/etc/audit/rules\\.d/[^:]+\\.rules:-e 2\\s*$" }
    rationale: &rat-0586656be5 |
      Unauthorized disclosure of audit records can reveal system and configuration data to attackers, thus compromising its confidentiality. Audit information includes all information (e.g., audit records, audit settings, audit reports) needed to successfully audit Ubuntu 24.04 LTS system activity. In immutable mode, unauthorized users cannot execute changes to the audit system to potentially hide malicious activity and then put the audit rules back. A system reboot would be noticeable, and a system administrator could then investigate the unauthorized changes.
    remediation: &rem-0048dd8c95 |
      Configure the audit system to set the audit rules to be immutable by performing the following steps:

      Create or edit a finalized rules file (e.g., "/etc/audit/rules.d/99-finalize.rules") and append the following option as the absolute last line:

      -e 2

      Compile and load the new rules into the active kernel:

      $ sudo augenrules --load

      Note: Once this rule is active, further changes to the audit configuration will be blocked. A system reboot will be required to apply any future audit rule modifications.
  - id: "STIG-UBTU-24-909000-protect_rules_module_live"
    name: "Ubuntu 24.04 LTS audit system must protect auditing rules from unauthorized change. (Live)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-909000, V-270832, SV-270832r1261488_rule, CAT II. CCI-000163. NIST SP 800-53 Rev. 4: AU-12."
