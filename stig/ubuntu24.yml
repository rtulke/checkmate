  - id: "STIG-UBTU-24-300022-ssh_X11-attrs"
    name: "Ubuntu 24.04 LTS must be configured so that remote X connections are disabled, unless to fulfill documented and validated mission requirements. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300022, V-270708, SV-270708r1268251_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-1]
    severity: high
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-efbc105d05 |
      The security risk of using X11 forwarding is that the client's X11 display server may be exposed to attack when the SSH client requests forwarding. A system administrator (SA) must protect clients that may expose themselves to attack by unwittingly requesting X11 forwarding, which can warrant a ''no'' setting.

      X11 forwarding must be enabled with caution. Users with the ability to bypass file permissions on the remote host (for the user's X11 authorization database) can access the local X11 display through the forwarded connection. An attacker may then be able to perform activities such as keystroke monitoring if the ForwardX11Trusted option is also enabled.

      If X11 services are not required for the system's intended function, they must be disabled or restricted as appropriate to the system's needs.
    remediation: &rem-a614d517d7 |
      Edit the "/etc/ssh/sshd_config" file to uncomment or add the line for the "X11Forwarding" keyword and set its value to "no" (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor):

      X11Forwarding no

      Restart SSH for the changes to take effect:

      $ sudo systemctl restart ssh
  - id: "STIG-UBTU-24-300022-ssh_X11-content"
    name: "Ubuntu 24.04 LTS must be configured so that remote X connections are disabled, unless to fulfill documented and validated mission requirements. (/etc/ssh/sshd_config has the expected content (2 rules))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300022, V-270708, SV-270708r1268251_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-1]
