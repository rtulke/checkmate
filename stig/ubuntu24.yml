  - id: "STIG-UBTU-24-101000-vlock"
    name: "Ubuntu 24.04 LTS must allow users to directly initiate a session lock for all connection types."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-101000, V-270674, SV-270674r1067167_rule, CAT II. CCI-000057, CCI-000060. NIST SP 800-53 Rev. 4: AC-11."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' vlock 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-fd1dbea233 |
      A session lock is a temporary action taken when a user stops work and moves away from the immediate physical vicinity of the information system but does not want to log out because of the temporary nature of the absence.

      The session lock is implemented at the point where session activity can be determined. Rather than be forced to wait for a period of time to expire before the user session can be locked, Ubuntu 24.04 LTSs need to provide users with the ability to manually invoke a session lock so users may secure their session if they need to temporarily vacate the immediate physical vicinity.
    remediation: &rem-a3283589a1 |
      Install the "vlock" package (if it is not already installed) by running the following command:

      $ sudo apt install -y vlock
  - id: "STIG-UBTU-24-101100-system_accts_no_interactive_shell"
    name: "Ubuntu 24.04 LTS must not assign an interactive login shell for system accounts."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-101100, V-288819, SV-288819r1261505_rule, CAT II. CCI-002696. NIST SP 800-53 Rev. 4: SI-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      awk -F: '(($3 > 0 && $3 < 1000) && $1 !~ /^(halt|sync|shutdown)$/ && $7 !~ /(nologin|false)$/) {print $1 ":" $3 ":" $7}' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-3f6ca1e596 |
      Ensuring shells are not given to system accounts upon login makes it more difficult for attackers to use system accounts.
    remediation: &rem-b974e694c2 |
      Configure Ubuntu 24.04 LTS so that all noninteractive accounts on the system do not have an interactive shell assigned to them.

      If the system account needs a shell assigned for mission operations, document the need with the information system security officer (ISSO).

      Run the following command to disable the interactive shell for a specific noninteractive user account:

      $ sudo usermod -s /usr/sbin/nologin <user>
  - id: "STIG-UBTU-24-102010-default_grub_audit-attrs"
    name: "Ubuntu 24.04 LTS must initiate session audits at system startup. (/etc/default/grub: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-102010, V-270676, SV-270676r1155245_rule, CAT II. CCI-001464. NIST SP 800-53 Rev. 4: AU-14."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-4f20585534 |
      If auditing is enabled late in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state information only available if auditing is enabled before a given process is created.
    remediation: &rem-00baff752d |
      Configure Ubuntu 24.04 LTS to produce audit records at system startup.

      Edit the "/etc/default/grub" file and add "audit=1" to the "GRUB_CMDLINE_LINUX" option and to the "GRUB_CMDLINE_LINUX_DEFAULT" option.

      GRUB_CMDLINE_LINUX_DEFAULT="audit=1"
      GRUB_CMDLINE_LINUX="audit=1"

      To update the grub config file, run:

      $ sudo update-grub
  - id: "STIG-UBTU-24-102010-default_grub_audit-content"
