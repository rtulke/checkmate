    severity: medium
    run: |
      auditctl -s
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^enabled 2$" }
    rationale: *rat-0586656be5
    remediation: *rem-0048dd8c95
  - id: "STIG-UBTU-24-909890-audit_bin_crypto"
    name: "Ubuntu 24.04 LTS must use cryptographic mechanisms to protect the integrity of audit tools."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-909890, V-270831, SV-270831r1261485_rule, CAT II. CCI-001496. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      find /etc/aide/aide.conf /etc/aide/aide.conf.d/ -type f -exec grep -h -E '^(/usr)?/sbin/au(ditctl|ditd|search|report|trace|genrules)[[:space:]]' {} +
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^/usr/sbin/auditctl\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^/usr/sbin/auditd\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^/usr/sbin/ausearch\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^/usr/sbin/aureport\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^/usr/sbin/autrace\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^/usr/sbin/augenrules\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^/sbin/auditctl\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^/sbin/auditd\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^/sbin/ausearch\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^/sbin/aureport\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^/sbin/autrace\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^/sbin/augenrules\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
    rationale: &rat-8f123a44ab |
      Protecting the integrity of the tools used for auditing purposes is a critical step toward ensuring the integrity of audit information. Audit information includes all information (e.g., audit records, audit settings, and audit reports) needed to successfully audit information system activity.

      Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.

      It is not uncommon for attackers to replace the audit tools or inject code into the existing tools with the purpose of providing the capability to hide or erase system activity from the audit logs.

      To address this risk, audit tools must be cryptographically signed to provide the capability to identify when the audit tools have been modified, manipulated, or replaced. An example is a checksum hash of the file or files.
    remediation: &rem-bba6e7783a |
      Configure AIDE to protect the integrity of the audit tools by performing the following steps:

      Create a dedicated configuration file inside AIDE's sub-configuration directory:
      $ sudo nano /etc/aide/aide.conf.d/90-stig_audit_tools

      Add configuration rules:

      # Modern Canonical Paths
      /usr/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512

      # Legacy Paths
      /sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
      /sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
      /sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
      /sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
      /sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
      /sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512

      If the legacy "/sbin/" paths are defined inside the main "/etc/aide/aide.conf" file, edit "/etc/aide/aide.conf" and comment those lines out using a "#" to prevent duplicate definition conflicts.

      Validate the modified AIDE configuration to ensure no syntax warnings or errors are present:
      $ sudo aide -c /etc/aide/aide.conf --config-check

      This command should return no output.

      Initialize the updated baseline database (this may take a few minutes):
      $ sudo aideinit

      Copy the newly generated database into the production directory:
      $ sudo cp -p /var/lib/aide/aide.db.new /var/lib/aide/aide.db
  - id: "STIG-UBTU-24-100010-timesyncd_not_installed"
    name: "Ubuntu 24.04 LTS must not have the \"systemd-timesyncd\" package installed."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100010, V-270645, SV-270645r1268251_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      dpkg-query -W -f='${Status}' systemd-timesyncd 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: &rat-866c7c0a47 |
      Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events. Sources outside the configured acceptable allowance (drift) may be inaccurate.

      Organizations must consider endpoints that may not have regular access to the authoritative time server (e.g., mobile, teleworking, and tactical endpoints).
    remediation: &rem-ec0f0c9928 |
      The "systemd-timesyncd" package will be uninstalled as part of the "chrony" package install. Purge the remaining configuration files for "systemd-timesyncd" from Ubuntu 24.04 LTS:

      $ sudo apt-get purge systemd-timesyncd
  - id: "STIG-UBTU-24-100020-ntp_not_installed"
    name: "Ubuntu 24.04 LTS must not have the \"ntp\" package installed."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100020, V-270646, SV-270646r1268251_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      dpkg-query -W -f='${Status}' ntp 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: *rat-866c7c0a47
    remediation: &rem-1315a43c1b |
      Uninstall the "ntp" package using the following command:

      $ sudo apt remove ntp

      If there are additional configuration files on the system that must be removed, the following command can be used instead:

      $ sudo apt-get purge ntp
  - id: "STIG-UBTU-24-100450-audispd_installed"
    name: "Ubuntu 24.04 LTS audit event multiplexor must be configured to offload audit logs onto a different system or storage media from the system being audited."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100450, V-270658, SV-270658r1067151_rule, CAT III. CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      dpkg-query -W -f='${Status}' audispd-plugins 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-562377e795 |
      Information stored in one location is vulnerable to accidental or incidental deletion or alteration.

      Offloading is a common process in information systems with limited audit storage capacity.
    remediation: &rem-853beb4d9e |
      Configure the audit event multiplexor to offload audit records to a different system or storage media from the system being audited.

      Install the audisp-remote plugin:

      $ sudo apt install -y audispd-plugins

      Set the audisp-remote plugin as active by editing the "/etc/audit/plugins.d/au-remote.conf" file:

      $ sudo sed -i -E 's/active\s*=\s*no/active = yes/' /etc/audit/plugins.d/au-remote.conf

      Set the address of the remote machine by editing the "/etc/audit/audisp-remote.conf" file:

      $ sudo sed -i -E 's/(remote_server\s*=).*/\1 <remote addr>/' /etc/audit/audisp-remote.conf

      where <remote addr> must be substituted by the address of the remote server receiving the audit log.

      Make the audit service reload its configuration files:

      $ sudo systemctl restart auditd.service
  - id: "STIG-UBTU-24-100700-chrony_installed"
    name: "Ubuntu 24.04 LTS must have the \"chrony\" package installed."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100700, V-270664, SV-270664r1268251_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      dpkg-query -W -f='${Status}' chrony 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: *rat-866c7c0a47
    remediation: &rem-19b86c0e4f |
      Install the "chrony" network time protocol package using the following command:

      $ sudo apt install -y chrony
  - id: "STIG-UBTU-24-200000-maxlogins_security"
    name: "Ubuntu 24.04 LTS must limit the number of concurrent sessions to 10 for all accounts and/or account types."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-200000, V-270677, SV-270677r1101774_rule, CAT III. CCI-000054. NIST SP 800-53 Rev. 4: AC-10."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      grep -rhs '^[^#]*maxlogins' /etc/security/limits.conf /etc/security/limits.d/
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^\\*\\s+hard\\s+maxlogins\\s+([1-9]|10)\\s*$" }
      - { none: "~ ^\\S+\\s+\\S+\\s+maxlogins\\s+(0*1[1-9]|0*[2-9][0-9]|0*[1-9][0-9]{2,})\\s*$" }
    rationale: &rat-a209a35310 |
      Ubuntu 24.04 LTS management includes the ability to control the number of users and user sessions that utilize an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the risks related to denial-of-service (DoS) attacks.

      This requirement addresses concurrent sessions for information system accounts and does not address concurrent sessions by single users via multiple system accounts. The maximum number of concurrent sessions must be defined based upon mission needs and the operational environment for each system.
    remediation: &rem-ddf3ffe9ca |
      Configure Ubuntu 24.04 LTS to limit the number of concurrent sessions to 10 for all accounts and/or account types.

      Add the following line to the top of the /etc/security/limits.conf or in a ".conf" file defined in /etc/security/limits.d/:

      * hard maxlogins 10
  - id: "STIG-UBTU-24-200610-pam_auth_faillock-attrs"
    name: "Ubuntu 24.04 LTS must automatically lock an account until the locked account is released by an administrator when three unsuccessful logon attempts have been made. (/etc/pam.d/common-auth: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-200610, V-270690, SV-270690r1067126_rule, CAT III. CCI-000044, CCI-002238. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      f='/etc/pam.d/common-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-c7aa300a3e |
      By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing, otherwise known as brute-forcing, is reduced. Limits are imposed by locking the account.
    remediation: &rem-6e147b80e0 |
      Configure Ubuntu 24.04 LTS to utilize the "pam_faillock" module.

      Edit the /etc/pam.d/common-auth file to add the following lines below the "auth" definition for pam_unix.so:
      auth     [default=die]  pam_faillock.so authfail
      auth     sufficient     pam_faillock.so authsucc

      Configure the "pam_faillock" module to use the following options:

      Edit the /etc/security/faillock.conf file and add/update the following keywords and values:
      audit
      silent
      deny = 3
      fail_interval = 900
      unlock_time = 0
  - id: "STIG-UBTU-24-200610-pam_auth_faillock-content"
    name: "Ubuntu 24.04 LTS must automatically lock an account until the locked account is released by an administrator when three unsuccessful logon attempts have been made. (/etc/pam.d/common-auth has the expected content (2 rules))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-200610, V-270690, SV-270690r1067126_rule, CAT III. CCI-000044, CCI-002238. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      cat '/etc/pam.d/common-auth'
    allow_rc: any
    expect:
      - { some: "~ ^auth\\s+\\[default=die\\]\\s+pam_faillock.so\\s+authfail" }
      - { some: "~ ^auth\\s+sufficient\\s+pam_faillock.so\\s+authsucc" }
    rationale: *rat-c7aa300a3e
    remediation: *rem-6e147b80e0
  - id: "STIG-UBTU-24-200610-security_faillock-attrs"
    name: "Ubuntu 24.04 LTS must automatically lock an account until the locked account is released by an administrator when three unsuccessful logon attempts have been made. (/etc/security/faillock.conf: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-200610, V-270690, SV-270690r1067126_rule, CAT III. CCI-000044, CCI-002238. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: *rat-c7aa300a3e
    remediation: *rem-6e147b80e0
  - id: "STIG-UBTU-24-200610-security_faillock-content"
    name: "Ubuntu 24.04 LTS must automatically lock an account until the locked account is released by an administrator when three unsuccessful logon attempts have been made. (/etc/security/faillock.conf has the expected content (5 rules))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-200610, V-270690, SV-270690r1067126_rule, CAT III. CCI-000044, CCI-002238. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      cat '/etc/security/faillock.conf'
