  - id: "STIG-UBTU-24-901350-auditd_log_group-attrs"
    name: "Ubuntu 24.04 LTS must permit only authorized groups ownership of the audit log files. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-901350, V-270829, SV-270829r1066976_rule, CAT II. CCI-000162, CCI-000163, CCI-000164. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: *rat-99e43cda38
    remediation: &rem-848e922116 |
      Configure the audit log directory and its underlying files to be owned by "root" group.

      Set the "log_group" parameter of the audit configuration file to the "root" value so when a new log file is created, its group owner is properly set:

      $ sudo sed -i '/^log_group/D' /etc/audit/auditd.conf
      $ sudo sed -i /^log_file/a'log_group = root' /etc/audit/auditd.conf

      Signal the audit daemon to reload the configuration file to update the group owners of existing files:

      $ sudo systemctl kill auditd -s SIGHUP
