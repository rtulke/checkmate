      f='/etc/systemd/system/kdump-tools.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: *rat-7b1d43b72c
    remediation: *rem-59e743a078
  - id: "STIG-UBTU-24-600150-sticky_bit_WW_dirs"
    name: "Ubuntu 24.04 LTS must set a sticky bit on all public directories to prevent unauthorized and unintended information transferred via shared system resources."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600150, V-270750, SV-270750r1268233_rule, CAT II. CCI-001090. NIST SP 800-53 Rev. 4: SC-4."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $7}' | xargs -I '{}' find '{}' -xdev -type d \( -perm -0002 -a ! -perm -1000 \) 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-71a930bc07 |
      Preventing unauthorized information transfers mitigates the risk of information, including encrypted representations of information, produced by the actions of prior users/roles (or the actions of processes acting on behalf of prior users/roles) from being available to any current users/roles (or current processes) that obtain access to shared system resources (e.g., registers, main memory, hard disks) after those resources have been released back to information systems. The control of information in shared resources is also commonly referred to as object reuse and residual information protection.

      This requirement generally applies to the design of an information technology product, but it can also apply to the configuration of particular information system components that are, or use, such products. This can be verified by acceptance/validation processes in DoW or other government agencies.

      There may be shared resources with configurable protections (e.g., files in storage) that may be assessed on specific information system components.
    remediation: &rem-1269dde743 |
      Configure all public directories to have the sticky bit set to prevent unauthorized and unintended information transferred via shared system resources.

      Set the sticky bit on all public directories using the following command, replacing "[Public Directory]" with any directory path missing the sticky bit:

      $ sudo chmod +t  [Public Directory]
  - id: "STIG-UBTU-24-600190-net.ipv4.tcp_syncookies"
    name: "Ubuntu 24.04 LTS must be configured to use TCP syncookies."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600190, V-270753, SV-270753r1066748_rule, CAT II. CCI-001095. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv4.tcp_syncookies
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-c1001b492b |
      Denial of service (DoS) occurs when a resource is not available for legitimate users, resulting in the organization not being able to accomplish its mission or causing it to operate at degraded capacity.

      Managing excess capacity ensures sufficient capacity is available to counter flooding attacks. Employing increased capacity and service redundancy may reduce the susceptibility to some DoS attacks. Managing excess capacity may include, for example, establishing selected usage priorities, quotas, or partitioning.
    remediation: &rem-b79aa8a651 |
      Configure Ubuntu 24.04 LTS to use TCP syncookies with the following command:

      $ sudo sysctl -w net.ipv4.tcp_syncookies=1

      If "1" is not the system's default value, add or update the following line in "/etc/sysctl.conf":

      net.ipv4.tcp_syncookies = 1
  - id: "STIG-UBTU-24-600190-syncookies_enabled_1"
    name: "Ubuntu 24.04 LTS must be configured to use TCP syncookies. (conf)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600190, V-270753, SV-270753r1066748_rule, CAT II. CCI-001095. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      grep "net\.ipv4\.tcp_syncookies" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^*.conf:net.ipv4.tcp_syncookies\\s*=\\s*1" }
      - { none: "~ ^*.conf:net.ipv4.tcp_syncookies\\s*=\\s*0" }
    rationale: *rat-c1001b492b
    remediation: *rem-b79aa8a651
  - id: "STIG-UBTU-24-600230-wireless_disabled"
    name: "Ubuntu 24.04 LTS must disable all wireless network adapters."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600230, V-270755, SV-270755r1268254_rule, CAT II. CCI-002418. NIST SP 800-53 Rev. 4: SC-8."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      if [ `find /sys/class/net/*/ -type d -name wireless -printf '.' | wc -c` -eq 0 ]; then echo "PASS - No Wireless adapters"; else echo "Manual Test - Plese check wireless adapters are disabled"; fi
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ PASS" }
    rationale: &rat-8a559ddc09 |
      Without protection of communications with wireless peripherals, confidentiality and integrity may be compromised because unprotected communications can be intercepted and either read, altered, or used to compromise Ubuntu 24.04 LTS.

      This requirement applies to wireless peripheral technologies (e.g., wireless mice, keyboards, displays, etc.) used with an operating system. Wireless peripherals (e.g., Wi-Fi/Bluetooth/IR Keyboards, Mice, and Pointing Devices and Near Field Communications [NFC]) present a unique challenge by creating an open, unsecured port on a computer. Wireless peripherals must meet DoW requirements for wireless data transmission and be approved for use by the approving authority (AO). Even though some wireless peripherals, such as mice and pointing devices, do not ordinarily carry information that need to be protected, modification of communications with these wireless peripherals may be used to compromise Ubuntu 24.04 LTS. Communication paths outside the physical protection of a controlled boundary are exposed to the possibility of interception and modification.

      Protecting the confidentiality and integrity of communications with wireless peripherals can be accomplished by physical means (e.g., employing physical barriers to wireless radio frequencies) or by logical means (e.g., employing cryptographic techniques). If physical means of protection are employed, then logical means (cryptography) do not have to be employed, and vice versa. If the wireless peripheral is only passing telemetry data, encryption of the data may not be required.
    remediation: &rem-29a3ff3482 |
      List all the wireless interfaces with the following command:

      $ ls -L -d /sys/class/net/*/wireless | xargs dirname | xargs basename

      For each interface, configure the system to disable wireless network interfaces with the following command:

      $ sudo ifdown <interface name>

      For each interface listed, find their respective module with the following command:

      $ basename $(readlink -f /sys/class/net/<interface name>/device/driver)

      where <interface name> must be substituted by the actual interface name.

      Create a file in the "/etc/modprobe.d" directory and for each module, add the following line:

      install <module name> /bin/true

      For each module from the system, execute the following command to remove it:

      $ sudo modprobe -r <module name>
  - id: "STIG-UBTU-24-700010-var_log_file_perms"
    name: "Ubuntu 24.04 LTS must generate error messages that provide information necessary for corrective actions without revealing information that could be exploited by adversaries."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-700010, V-270756, SV-270756r1134814_rule, CAT II. CCI-001312. NIST SP 800-53 Rev. 4: SI-11."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      LOG_FILE_PERM=$(find /var/log -perm /137 ! -name '*[bw]tmp' ! -name '*lastlog' ! -name 'history.log' ! -name 'eipp.log.xz' -type f | wc -l); \
      if [ "$LOG_FILE_PERM" -eq 0 ]; \
      then echo "OK - No files or Directories found"; \
      else echo "FAIL - Files found"; \
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK - No files or Directories found" }
    rationale: &rat-38c22ff33b |
      Any operating system providing too much information in error messages risks compromising the data and security of the structure, and organizations must carefully consider the content and structure of error messages.

      The extent to which information systems are able to identify and handle error conditions is guided by organizational policy and operational requirements. Information that could be exploited by adversaries includes, for example, erroneous logon attempts with passwords entered by mistake as the username, mission/business information that can be derived from (if not stated explicitly by) information recorded, and personal information, such as account numbers, Social Security numbers, and credit card numbers.

      The /var/log/btmp, /var/log/wtmp, and /var/log/lastlog files have group write and global read permissions to allow for the lastlog function to perform. Limiting the permissions beyond this configuration will result in the failure of functions that rely on the lastlog database. Additionally, Canonical recommends excluding the history.log and eipp.log.xz from consideration in this check.
    remediation: &rem-2ad3a89965 |
      Configure Ubuntu 24.04 LTS to set permissions of all log files under the /var/log directory to "640" or more restricted by using the following command:

      Note: The btmp, wtmp, lastlog, history, and eipp.log.xz files are excluded. Refer to the Discussion for details.

      $ sudo find /var/log -perm /137 ! -name '*[bw]tmp' ! -name '*lastlog' -type f -exec chmod 640 '{}' \;
  - id: "STIG-UBTU-24-700020-journal_file_perms"
    name: "Ubuntu 24.04 LTS must generate system journal entries without revealing information that could be exploited by adversaries."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-700020, V-270757, SV-270757r1261493_rule, CAT II. CCI-001312. NIST SP 800-53 Rev. 4: SI-11."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      JOURNAL_DIR_PERM=$(find /run/log/journal /var/log/journal -type d -perm /5022 -printf '.' 2>/dev/null | wc -c); \
      JOURNAL_FILE_PERM=$(find /run/log/journal /var/log/journal -type f -perm /7137 -printf '.' 2>/dev/null | wc -c); \
      if [ "$JOURNAL_DIR_PERM" -eq 0 ] && [ "$JOURNAL_FILE_PERM" -eq 0 ]; \
      then echo "OK - No files or Directories found"; \
      else echo "FAIL - Files found"; \
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK - No files or Directories found" }
    rationale: &rat-dc6304dbf8 |
      Any operating system providing too much information in error messages risks compromising the data and security of the structure, and content of error messages must be carefully considered by the organization.

      Organizations carefully consider the structure/content of error messages. The extent to which information systems are able to identify and handle error conditions is guided by organizational policy and operational requirements. Information that could be exploited by adversaries includes, for example, erroneous logon attempts with passwords entered by mistake as the username, mission/business information that can be derived from (if not stated explicitly by) information recorded, and personal information, such as account numbers, social security numbers, and credit card numbers.
    remediation: &rem-5ac7c1e6fc |
      Configure the system to set the appropriate permissions to the files and directories used by the systemd journal.

      Create a drop-in file if it does not already exist with the following command:

      $ sudo vi /etc/tmpfiles.d/zzz-systemd-stig.conf

      Add or modify the following lines in the "/usr/lib/tmpfiles.d/zzz-systemd-stig.conf" file:

      z /run/log/journal 2755 root systemd-journal - -
      Z /run/log/journal/%m ~2750 root systemd-journal - -
      z /var/log/journal 2755 root systemd-journal - -
      z /var/log/journal/%m 2755 root systemd-journal - -
      z /var/log/journal/%m/system.journal 0640 root systemd-journal - -

      Note: Restart the system for these settings to take effect.
  - id: "STIG-UBTU-24-700020-journal_file_perms_conf"
    name: "Ubuntu 24.04 LTS must generate system journal entries without revealing information that could be exploited by adversaries. (tmpfiles)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-700020, V-270757, SV-270757r1261493_rule, CAT II. CCI-001312. NIST SP 800-53 Rev. 4: SI-11."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      systemd-tmpfiles --cat-config 2>/dev/null | awk '$1 ~ /^[zZ]$/ && $2 ~ /^\/(run|var)\/log\/journal(\/%m(\/system\.journal)?)?$/ {l[$2]=$1" "$2" "$3" "$4" "$5} END {for (p in l) print l[p]}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^z /run/log/journal 2755 root systemd-journal$" }
      - { some: "~ ^Z /run/log/journal/%m ~2750 root systemd-journal$" }
      - { some: "~ ^z /var/log/journal 2755 root systemd-journal$" }
      - { some: "~ ^z /var/log/journal/%m 2755 root systemd-journal$" }
      - { some: "~ ^z /var/log/journal/%m/system\\.journal 0640 root systemd-journal$" }
    rationale: *rat-dc6304dbf8
    remediation: *rem-5ac7c1e6fc
  - id: "STIG-UBTU-24-700030-journaldctl_perms-attrs"
    name: "Ubuntu 24.04 LTS must be configured so that the \"journalctl\" command is not accessible by unauthorized users."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-700030, V-270758, SV-270758r1066763_rule, CAT II. CCI-001312. NIST SP 800-53 Rev. 4: SI-11."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/usr/bin/journalctl'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7037)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
    expect: empty
    rationale: *rat-dc6304dbf8
    remediation: &rem-9e4f39e972 |
      Configure journalctl to have a permission set of "740":

      $ sudo chmod 740 /usr/bin/journalctl
  - id: "STIG-UBTU-24-700040-journaldctl_owner-attrs"
    name: "Ubuntu 24.04 LTS must be configured so that the \"journalctl\" command is owned by \"root\"."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-700040, V-270759, SV-270759r1068367_rule, CAT II. CCI-001314. NIST SP 800-53 Rev. 4: SI-11."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/usr/bin/journalctl'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
    expect: empty
    rationale: &rat-a949b4f534 |
      Only authorized personnel are to be made aware of errors and the details of the errors. Error messages are an indicator of an organization's operational state or can identify Ubuntu 24.04 LTS or platform. Additionally, Personally Identifiable Information (PII) and operational information must not be revealed through error messages to unauthorized personnel or their designated representatives.

      The structure and content of error messages must be carefully considered by the organization and development team. The extent to which the information system is able to identify and handle error conditions is guided by organizational policy and operational requirements.
    remediation: &rem-69845683c5 |
      Configure journalctl to be owned by "root":

      $ sudo chown root /usr/bin/journalctl
  - id: "STIG-UBTU-24-700050-journaldctl_group-attrs"
    name: "Ubuntu 24.04 LTS must be configured so that the \"journalctl\" command is group-owned by \"root\"."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-700050, V-270760, SV-270760r1066769_rule, CAT II. CCI-001314. NIST SP 800-53 Rev. 4: SI-11."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
