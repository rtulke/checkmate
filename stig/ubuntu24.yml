  - id: "STIG-UBTU-24-100300-ufw_pkg"
    name: "Ubuntu 24.04 LTS must have an application firewall installed in order to control remote access methods."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100300, V-270654, SV-270654r1268238_rule, CAT II. CCI-002314. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' ufw 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-0635bc8f4b |
      Remote access services, such as those providing remote access to network devices and information systems, which lack automated control capabilities, increase risk, and make remote user access management difficult at best.

      Remote access is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      Ubuntu 24.04 LTS functionality (e.g., RDP) must be capable of taking enforcement action if the audit reveals unauthorized activity. Automated control of remote access sessions allows organizations to ensure ongoing compliance with remote access policies by enforcing connection rules of remote access applications on a variety of information system components (e.g., servers, workstations, notebook computers, smartphones, and tablets).
    remediation: &rem-22ffcb7605 |
      Install the ufw by using the following command:

      $ sudo apt install -y ufw
  - id: "STIG-UBTU-24-100310-ufw_service-enabled"
    name: "Ubuntu 24.04 LTS must enable and run the Uncomplicated Firewall (ufw). (Service ufw is enabled)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100310, V-270655, SV-270655r1268238_rule, CAT II. CCI-002314. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState ufw | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-0635bc8f4b
    remediation: &rem-e15fd8cac4 |
      Enable the ufw by using the following command:

      $ sudo ufw enable

      Note: Enabling the firewall will potentially disrupt ssh sessions.
  - id: "STIG-UBTU-24-100310-ufw_service-running"
    name: "Ubuntu 24.04 LTS must enable and run the Uncomplicated Firewall (ufw). (Service ufw is running)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100310, V-270655, SV-270655r1268238_rule, CAT II. CCI-002314. NIST SP 800-53 Rev. 4: AC-17."
