    name: "Ubuntu 24.04 LTS must enforce a delay of at least four seconds between logon prompts following a failed logon attempt. (/etc/pam.d/common-auth has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300017, V-270706, SV-270706r1068361_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
