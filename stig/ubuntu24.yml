  - id: "STIG-UBTU-24-200060-TMOUT_setting"
    name: "Ubuntu 24.04 LTS must automatically terminate a user session after inactivity timeouts have expired."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-200060, V-270680, SV-270680r1066529_rule, CAT II. CCI-002361. NIST SP 800-53 Rev. 4: AC-12."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      grep -E "\bTMOUT=[0-9]+" /etc/bash.bashrc /etc/profile.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^[^:]+:\\s*(export\\s+|readonly\\s+|declare\\s+-[a-z]*\\s+)*TMOUT=0*[1-9][0-9]*\\s*$" }
      - { none: "~ ^[^:]+:\\s*(export\\s+|readonly\\s+|declare\\s+-[a-z]*\\s+)*TMOUT=0+\\s*$" }
    rationale: &rat-49af9e16b3 |
      Automatic session termination addresses the termination of user-initiated logical sessions in contrast to the termination of network connections associated with communications sessions (i.e., network disconnect). A logical session (for local, network, and remote access) is initiated whenever a user (or process acting on behalf of a user) accesses an organizational information system. Such user sessions can be terminated (and thus terminate user access) without terminating network sessions.

      Session termination terminates all processes associated with a user's logical session except those processes specifically created by the user (i.e., session owner) to continue after the session is terminated.

      Conditions or trigger events requiring automatic session termination can include, for example, organization-defined periods of user inactivity, targeted responses to certain types of incidents, and time-of-day restrictions on information system use.

      This capability is typically reserved for specific operating system functionality where the system owner, data owner, or organization requires additional assurance.
    remediation: &rem-da5c6f976b |
      Configure Ubuntu 24.04 LTS to automatically terminate a user session after inactivity timeouts have expired or at shutdown.

      Create the file "/etc/profile.d/99-terminal_tmout.sh" file if it does not exist.

      Modify or append the following line in the "/etc/profile.d/99-terminal_tmout.sh " file:

      TMOUT=600

      This will set a timeout value of 10 minutes for all future sessions.

      To set the timeout for the current sessions, execute the following command over the terminal session:

      $ export TMOUT=600
  - id: "STIG-UBTU-24-200090-rsyslog_remote_access_logged"
    name: "Ubuntu 24.04 LTS must monitor remote access methods."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-200090, V-270681, SV-270681r1268219_rule, CAT II. CCI-000067. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      grep -Er '^(auth.*,authpriv.*|daemon.*)' /etc/rsyslog.*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*:auth\\.\\*,authpriv\\.\\*\\s*\\/var\\/log\\/secure" }
      - { some: "~ .*:daemon\\.\\*\\s*\\/var\\/log\\/messages" }
    rationale: &rat-5241e9fd8e |
      Remote access services, such as those providing remote access to network devices and information systems, which lack automated monitoring capabilities, increase risk, and make remote user access management difficult at best.

      Remote access is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      Automated monitoring of remote access sessions allows organizations to detect cyberattacks and also ensure ongoing compliance with remote access policies by auditing connection activities of remote access capabilities, such as Remote Desktop Protocol (RDP), on a variety of information system components (e.g., servers, workstations, notebook computers, smartphones, and tablets).
    remediation: &rem-e854a441a5 |
      Configure Ubuntu 24.04 LTS to monitor all remote access methods by adding the following lines to the "/etc/rsyslog.d/50-default.conf" file:

      auth.*,authpriv.* /var/log/secure
      daemon.* /var/log/messages

      For the changes to take effect, restart the "rsyslog" service with the following command:

      $ sudo systemctl restart rsyslog.service
  - id: "STIG-UBTU-24-200260-user_inactive-attrs"
    name: "Ubuntu 24.04 LTS must disable account identifiers (individuals, groups, roles, and devices) after 35 days of inactivity. (/etc/default/useradd: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-200260, V-270683, SV-270683r1261521_rule, CAT II. CCI-003627, CCI-003628. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/default/useradd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-27643871b5 |
      Inactive identifiers pose a risk to systems and applications because attackers may exploit an inactive identifier and potentially obtain undetected access to the system. Owners of inactive accounts will not notice if unauthorized access to their user account has been obtained.

      Operating systems need to track periods of inactivity and disable application identifiers after 35 days of inactivity.
    remediation: &rem-b44bb065d2 |
      Configure Ubuntu 24.04 LTS to disable account identifiers after 35 days of inactivity after the password expiration.

      Run the following command to change the configuration for adduser:

      $ sudo useradd -D -f 35

      Note: DoW recommendation is 35 days, but a lower value is acceptable. The value "0" will disable the account immediately after the password expires.
  - id: "STIG-UBTU-24-200260-user_inactive-content"
    name: "Ubuntu 24.04 LTS must disable account identifiers (individuals, groups, roles, and devices) after 35 days of inactivity. (/etc/default/useradd has the expected content (2 rules))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-200260, V-270683, SV-270683r1261521_rule, CAT II. CCI-003627, CCI-003628. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/default/useradd'
    allow_rc: any
    expect:
      - { some: "~ ^INACTIVE\\s*=\\s*([1-9]|[1-2][0-9]|3[0-5])\\s*$" }
      - { none: "~ ^INACTIVE\\s*=\\s*(-1|0|0*(3[6-9]|[4-9][0-9]|[1-9][0-9]{2,}))\\s*$" }
    rationale: *rat-27643871b5
    remediation: *rem-b44bb065d2
  - id: "STIG-UBTU-24-200270-auditctl_cron_jobs_conf-attrs"
    name: "Ubuntu 24.04 LTS must audit any script or executable called by cron as root or by any privileged user. (/etc/audit/rules.d/stig.rules: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-200270, V-274870, SV-274870r1261490_rule, CAT II. CCI-000172. NIST SP 800-53 Rev. 4: AU-12."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/rules.d/stig.rules'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-bb261c5468 |
      Any script or executable called by cron as root or by any privileged user must be owned by that user, must have the permissions 755 or more restrictive, and should have no extended rights that allow any nonprivileged user to modify the script or executable.
    remediation: &rem-d89cfc09b7 |
      Configure Ubuntu 24.04 LTS to audit the execution of any system call made by cron as root or as any privileged user.

      Add or update the following file system rules to "/etc/audit/rules.d/stig.rules":
      -w /etc/cron.d/ -p wa -k cronjobs
      -w /var/spool/cron/ -p wa -k cronjobs

      To load the rules to the kernel immediately, use the following command:

      $ sudo augenrules --load
