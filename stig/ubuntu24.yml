      grep "kernel\.dmesg_restrict" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^*.conf:kernel.dmesg_restrict\\s*=\\s*1" }
      - { none: "~ ^*.conf:kernel.dmesg_restrict\\s*=\\s*0" }
    rationale: *rat-521b9a29b0
    remediation: *rem-ae89fa138f
  - id: "STIG-UBTU-24-600160-chrony_servers"
    name: "Ubuntu 24.04 LTS must compare internal information system clocks at least every 24 hours with an authoritative time server."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600160, V-270751, SV-270751r1261540_rule, CAT III. CCI-004922, CCI-004923. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      grep maxpoll -ir /etc/chrony*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ server tick\\.usno\\.navy\\.mil" }
      - { some: "~ maxpoll ([1-9]|1[0-6])$" }
      - { some: "~ server tock\\.usno\\.navy\\.mil" }
      - { some: "~ maxpoll ([1-9]|1[0-6])$" }
      - { some: "~ server ntp2\\.usno\\.navy\\.mil" }
      - { some: "~ maxpoll ([1-9]|1[0-6])$" }
    rationale: &rat-e9704b2936 |
      Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events. Sources outside the configured acceptable allowance (drift) may be inaccurate.

      Synchronizing internal information system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected over a network.

      Organizations must consider endpoints that may not have regular access to the authoritative time server (e.g., mobile, teleworking, and tactical endpoints).
    remediation: &rem-bd27a662f9 |
      To configure the system clock to compare to the authoritative time source at least every 24 hours, edit the "/etc/chrony/chrony.conf" file. Add or correct the following lines, by replacing "[source]" in the following line with an authoritative time source:

      server [source] iburst maxpoll 16

      If the "chrony" service was running and the value of "maxpoll" or "server" was updated, the service must be restarted using the following command:

      $ sudo systemctl restart chrony.service
  - id: "STIG-UBTU-24-600180-chrony_step"
    name: "Ubuntu 24.04 LTS must synchronize internal information system clocks to the authoritative time source when the time difference is greater than one second."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600180, V-270752, SV-270752r1068365_rule, CAT III. CCI-004926. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      grep -ir makestep /etc/chrony*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*:makestep 1 1" }
    rationale: &rat-e65a6ad64e |
      Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events.

      Synchronizing internal information system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected over a network. Organizations must consider setting time periods for different types of systems (e.g., financial, legal, or mission-critical systems).

      Organizations must also consider endpoints that may not have regular access to the authoritative time server (e.g., mobile, teleworking, and tactical endpoints). This requirement is related to the comparison done every 24 hours in SRG-OS-000355 because a comparison must be done to determine the time difference.
    remediation: &rem-f071c2ee3d |
      Configure chrony to synchronize the internal system clocks to the authoritative source when the time difference is greater than one second by doing the following:

      Edit the "/etc/chrony/chrony.conf" file and add:

      makestep 1 -1

      Restart the chrony service:

      $ sudo systemctl restart chrony.service
  - id: "STIG-UBTU-24-900920-audit_disk_space_adequate_manual"
    name: "Ubuntu 24.04 LTS must allocate audit record storage capacity to store at least one week's worth of audit records, when audit records are not immediately sent to a central audit record storage facility. (Manual)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-900920, V-270816, SV-270816r1066937_rule, CAT III. CCI-001849. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      echo -e "MANUAL - Ensure the disk space is sufficient for 1 week of audit logs\n`df -h /var/log/audit`"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-8cde38dc56 |
      To ensure operating systems have a sufficient storage capacity in which to write the audit logs, operating systems must be able to allocate audit record storage capacity.

      The task of allocating audit record storage capacity is usually performed during initial installation of Ubuntu 24.04 LTS.
    remediation: &rem-90b2f747e4 |
      Allocate enough storage capacity for at least one week's worth of audit records when audit records are not immediately sent to a central audit record storage facility.

      If audit records are stored on a partition made specifically for audit records, use the "parted" program to resize the partition with sufficient space to contain one week's worth of audit records.

      If audit records are not stored on a partition made specifically for audit records, a new partition with sufficient amount of space will need be to be created.

      Set the auditd server to point to the mount point where the audit records must be located:

      $ sudo sed -i -E 's@^(log_file\s*=\s*).*@\1 <log mountpoint>/audit.log@' /etc/audit/auditd.conf

      where <log mountpoint> is the aforementioned mount point.
  - id: "STIG-UBTU-24-900950-crontab_offload_audit_logs"
    name: "Ubuntu 24.04 LTS must have a crontab script running weekly to offload audit events of standalone systems."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-900950, V-270817, SV-270817r1066940_rule, CAT III. CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      grep -i audit /etc/cron.weekly/*
    expect: { rc: "== 0" }
    rationale: *rat-562377e795
    remediation: &rem-b61d2e62a2 |
      Create a script that offloads audit logs to external media and runs weekly.

      The script must be located in the "/etc/cron.weekly" directory.
  - id: "STIG-UBTU-24-900960-audit_space_left-attrs"
    name: "Ubuntu 24.04 LTS must immediately notify the system administrator (SA) and information system security officer (ISSO) (at a minimum) when allocated audit record storage volume reaches 75 percent of the repository maximum audit record storage capacity. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-900960, V-270818, SV-270818r1066943_rule, CAT III. CCI-001855. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-2ba573c91a |
      If security personnel are not notified immediately when storage volume reaches 75 percent utilization, they are unable to plan for audit record storage capacity expansion.
    remediation: &rem-040f2eb7b2 |
      Edit "/etc/audit/auditd.conf" and set the "space_left_action" parameter to "exec" or "email".

      If the "space_left_action" parameter is set to "email", set the "action_mail_acct" parameter to an email address for the SA and ISSO.

      If the "space_left_action" parameter is set to "exec", ensure the command being executed notifies the SA and ISSO.

      Edit "/etc/audit/auditd.conf" and set the "space_left" parameter to be at least 25 percent of the repository maximum audit record storage capacity.
  - id: "STIG-UBTU-24-900960-audit_space_left-content"
    name: "Ubuntu 24.04 LTS must immediately notify the system administrator (SA) and information system security officer (ISSO) (at a minimum) when allocated audit record storage volume reaches 75 percent of the repository maximum audit record storage capacity. (/etc/audit/auditd.conf has the expected content (2 rules))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-900960, V-270818, SV-270818r1066943_rule, CAT III. CCI-001855. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect:
      - { some: "~ ^space_left\\s*=\\s*(2[5-9]|[3-6][0-9])%" }
      - { some: "~ (?i)^space_left_action\\s*=\\s*(email|exec)" }
    rationale: *rat-2ba573c91a
    remediation: *rem-040f2eb7b2
  - id: "STIG-UBTU-24-900980-audit_mail_acct-attrs"
    name: "Ubuntu 24.04 LTS must alert the system administrator (SA) and information system security officer (ISSO) (at a minimum) in the event of an audit processing failure. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-900980, V-270819, SV-270819r1068390_rule, CAT III. CCI-000139. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-9132161237 |
      It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs as required. Without this notification, the security personnel may be unaware of an impending failure of the audit capability, and system operation may be adversely affected.

      Audit processing failures include software/hardware errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded.

      This requirement applies to each audit data storage repository (i.e., distinct information system component where audit records are stored), the centralized audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both.
    remediation: &rem-ec9b131309 |
      Configure "auditd" service to notify the SA and ISSO in the event of an audit processing failure.

      Edit the following line in "/etc/audit/auditd.conf" to ensure administrators are notified via email for those situations:

      action_mail_acct = <administrator_account>

      Note: Change "administrator_account" to an account for security personnel.

      Restart the "auditd" service so the changes take effect:

      $ sudo systemctl restart auditd.service
  - id: "STIG-UBTU-24-900980-audit_mail_acct-content"
    name: "Ubuntu 24.04 LTS must alert the system administrator (SA) and information system security officer (ISSO) (at a minimum) in the event of an audit processing failure. (/etc/audit/auditd.conf has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-900980, V-270819, SV-270819r1068390_rule, CAT III. CCI-000139. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect: { some: "~ ^action_mail_acct\\s*=\\s*root" }
    rationale: *rat-9132161237
    remediation: *rem-ec9b131309
  - id: "STIG-UBTU-24-901220-timezone"
    name: "Ubuntu 24.04 LTS must record time stamps for audit records that can be mapped to Coordinated Universal Time (UTC) or Greenwich Mean Time (GMT)."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-901220, V-270820, SV-270820r1066949_rule, CAT III. CCI-001890. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      timedatectl status | grep -i "time zone"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^\\s*Time zone: Etc\\/UTC \\(UTC, \\+0000\\)" }
    rationale: &rat-130dd9899d |
      If time stamps are not consistently applied and there is no common time reference, it is difficult to perform forensic analysis.

      Time stamps generated by Ubuntu 24.04 LTS include date and time. Time is commonly expressed in Coordinated Universal Time (UTC), a modern continuation of Greenwich Mean Time (GMT), or local time with an offset from UTC.
    remediation: &rem-a521c5460a |
      To configure the system time zone to use UTC or GMT, run the following command, replacing [ZONE] with UTC or GMT:

      $ sudo timedatectl set-timezone [ZONE]
