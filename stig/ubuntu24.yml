  - id: "STIG-UBTU-24-300027-black_shadow_passwd"
    name: "Ubuntu 24.04 LTS must not have accounts configured with blank or null passwords."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300027, V-270713, SV-270713r1268251_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
