    remediation: *rem-e15fd8cac4
  - id: "STIG-UBTU-24-100400-auditd_installed"
    name: "Ubuntu 24.04 LTS must have the \"auditd\" package installed."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100400, V-270656, SV-270656r1067148_rule, CAT II. CCI-000130, CCI-000131, CCI-000132, CCI-000133, CCI-000134, CCI-000135, CCI-000154, CCI-000158, CCI-000169, CCI-000172, CCI-001875, CCI-001876, CCI-001877, CCI-001878, CCI-001879, CCI-001880, CCI-001881, CCI-001882, CCI-001914, CCI-003938. NIST SP 800-53 Rev. 4: AU-3, AU-6, AU-7, AU-12."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' auditd 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-6c064b56dd |
      Without establishing the when, where, type, source, and outcome of events that occurred, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack.

      Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.

      Audit record content that may be necessary to satisfy this requirement includes, for example, time stamps, source and destination addresses, user/process identifiers, event descriptions, success/fail indications, filenames involved, and access control or flow control rules invoked.

      Reconstruction of harmful events or forensic analysis is not possible if audit records do not contain enough information.

      Successful incident response and auditing relies on timely, accurate system information and analysis to allow the organization to identify and respond to potential incidents in a proficient manner. If Ubuntu 24.04 LTS does not provide the ability to centrally review Ubuntu 24.04 LTS logs, forensic analysis is negatively impacted.

      Associating event types with detected events in Ubuntu 24.04 LTS audit logs provides a means of investigating an attack; recognizing resource utilization or capacity thresholds; or identifying an improperly configured operating system.
    remediation: &rem-40ab3877fa |
      Configure the audit service to produce audit records containing the information needed to establish when (date and time) an event occurred.

      Install the audit service (if the audit service is not already installed) with the following command:

      $ sudo apt install -y auditd
  - id: "STIG-UBTU-24-100410-auditd_running-enabled"
    name: "Ubuntu 24.04 LTS must produce audit records and reports containing information to establish when, where, what type, the source, and the outcome for all DoW-defined auditable events and actions in near real time. (Service auditd is enabled)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100410, V-270657, SV-270657r1261509_rule, CAT II. CCI-000130, CCI-000131, CCI-000132, CCI-000133, CCI-000134, CCI-000135, CCI-000154, CCI-000158, CCI-000169, CCI-000172, CCI-001875, CCI-001876, CCI-001877, CCI-001878, CCI-001879, CCI-001880, CCI-001881, CCI-001882, CCI-001914, CCI-003938. NIST SP 800-53 Rev. 4: AU-3, AU-6, AU-7, AU-12."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState auditd | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-6c064b56dd
    remediation: &rem-fa74fcee65 |
      Configure the audit service to produce audit records containing the information needed to establish when (date and time) an event occurred.

      Enable the audit service with the following command:

      $ sudo systemctl enable auditd.service

      To reload the rules file, issue the following command:

