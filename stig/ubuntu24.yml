  - id: "STIG-UBTU-24-300026-ctrl-alt-del_disabled-enabled"
    name: "Ubuntu 24.04 LTS must disable the x86 Ctrl-Alt-Delete key sequence. (service)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300026, V-270712, SV-270712r1268251_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-1]
