  - id: "STIG-UBTU-24-700320-apt_remove_settings"
    name: "Ubuntu 24.04 LTS must be configured so that Advance Package Tool (APT) removes all software components after updated versions have been installed."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-700320, V-270773, SV-270773r1066808_rule, CAT II. CCI-002617. NIST SP 800-53 Rev. 4: SI-2."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      apt-config dump | grep Remove-Unused
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ Unattended-Upgrade::Remove-Unused-Kernel-Packages \"true\";" }
      - { some: "~ Unattended-Upgrade::Remove-Unused-Dependencies \"true\";" }
    rationale: &rat-a08a21955f |
      Previous versions of software components that are not removed from the information system after updates have been installed may be exploited by adversaries. Some information technology products may remove older versions of software automatically from the information system.
    remediation: &rem-b20f7e1d02 |
      Configure APT to remove all software components after updated versions have been installed.

      Add or update the following options to the "/etc/apt/apt.conf.d/50unattended-upgrades" file:

      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
  - id: "STIG-UBTU-24-900040-auditd_conf_files_perms"
    name: "Ubuntu 24.04 LTS must be configured so that audit configuration files are not write-accessible by unauthorized users."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-900040, V-270775, SV-270775r1068369_rule, CAT II. CCI-000171. NIST SP 800-53 Rev. 4: AU-12."
