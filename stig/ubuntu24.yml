  - id: "STIG-UBTU-24-901230-audit_bin_perms"
    name: "Ubuntu 24.04 LTS must configure audit tools with a mode of \"0755\" or less permissive."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-901230, V-270821, SV-270821r1134818_rule, CAT II. CCI-001494, CCI-001493. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      AUDIT_BINS_PERM="OK - No files or Directories found"; for audit_bin in /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules; do find $audit_bin -perm /022 -exec export AUDIT_BINS_PERM="FAIL - Audit Binaries Permissions" {} \;; done; echo $AUDIT_BINS_PERM
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK - No files or Directories found" }
    rationale: &rat-2c2d4886cc |
      Protecting audit information also includes identifying and protecting the tools used to view and manipulate log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information.

      Operating systems providing tools to interface with audit information will leverage user permissions, roles identifying the user accessing the tools, and the corresponding user rights to make decisions regarding access to audit tools.

      Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.
    remediation: &rem-9c339605dc |
      Configure the audit tools on Ubuntu 24.04 LTS to be protected from unauthorized access by setting the correct permissive mode using the following command:

      $ sudo chmod 0755 [audit_tool]

      Replace "[audit_tool]" with the audit tool that does not have the correct permissions.
