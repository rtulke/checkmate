  - id: "STIG-UBTU-24-400290-passwd_difok-attrs"
    name: "Ubuntu 24.04 LTS must require the change of at least eight characters when passwords are changed. (/etc/security/pwquality.conf: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400290, V-270729, SV-270729r1066676_rule, CAT II. CCI-004065, CCI-004066. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/security/pwquality.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-b304995f39 |
      If Ubuntu 24.04 LTS allows the user to consecutively reuse extensive portions of passwords, this increases the chances of password compromise by increasing the window of opportunity for attempts at guessing and brute-force attacks.

      The number of changed characters refers to the number of changes required with respect to the total number of positions in the current password. In other words, characters may be the same within the two passwords; however, the positions of the like characters must be different.

      If the password length is an odd number, then number of changed characters must be rounded up. For example, a password length of 15 characters must require the change of at least eight characters.
    remediation: &rem-98cc1367be |
      Configure Ubuntu 24.04 LTS to require the change of at least eight characters when passwords are changed.

      Add or update the "/etc/security/pwquality.conf" file to include the "difok=8" parameter:

      difok=8
  - id: "STIG-UBTU-24-400290-passwd_difok-content"
    name: "Ubuntu 24.04 LTS must require the change of at least eight characters when passwords are changed. (/etc/security/pwquality.conf has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400290, V-270729, SV-270729r1066676_rule, CAT II. CCI-004065, CCI-004066. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/security/pwquality.conf'
    allow_rc: any
    expect: { some: "~ ^difok\\s*=\\s*([8-9]|[1-5][0-9])" }
    rationale: *rat-b304995f39
    remediation: *rem-98cc1367be
  - id: "STIG-UBTU-24-400300-PASS_MIN_DAYS-attrs"
    name: "Ubuntu 24.04 LTS must enforce 24 hours/1 day as the minimum password lifetime. Passwords for new users must have a 24 hours/1 day minimum password lifetime restriction. (/etc/login.defs: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400300, V-270730, SV-270730r1066679_rule, CAT II. CCI-004065, CCI-004066. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-8420b4ddad |
      Enforcing a minimum password lifetime helps to prevent repeated password changes to defeat the password reuse or history enforcement requirement. If users are allowed to immediately and continually change their password, then the password could be repeatedly changed in a short period of time to defeat the organization's policy regarding password reuse.
    remediation: &rem-7bafd8b236 |
      Configure Ubuntu 24.04 LTS to enforce a 24 hours/1 day minimum password lifetime.

      Add or modify the following line in the "/etc/login.defs" file:

      PASS_MIN_DAYS    1
  - id: "STIG-UBTU-24-400300-PASS_MIN_DAYS-content"
    name: "Ubuntu 24.04 LTS must enforce 24 hours/1 day as the minimum password lifetime. Passwords for new users must have a 24 hours/1 day minimum password lifetime restriction. (/etc/login.defs has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400300, V-270730, SV-270730r1066679_rule, CAT II. CCI-004065, CCI-004066. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
