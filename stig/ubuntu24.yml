  - id: "STIG-UBTU-24-300019-sudo_noALL"
    name: "Ubuntu 24.04 LTS must restrict privilege elevation to authorized personnel."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300019, V-274869, SV-274869r1107312_rule, CAT II. CCI-002038, CCI-004895. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      grep -iwR 'ALL' /etc/sudoers /etc/sudoers.d/ | grep -v '#'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ALL ALL=(ALL) ALL" }
      - { none: "~ ALL ALL=(ALL:ALL) ALL" }
    rationale: &rat-288dd7a5b9 |
      If the "sudoers" file is not configured correctly, any user defined on the system can initiate privileged actions on the target system.
    remediation: &rem-0a5bfc26e8 |
      Configure the operating system to restrict privilege elevation to authorized personnel.

      Remove the following entries from the /etc/sudoers file or any configuration file under /etc/sudoers.d/:

      ALL     ALL=(ALL) ALL
      ALL     ALL=(ALL:ALL) ALL
  - id: "STIG-UBTU-24-300020-sudo_nopasswd"
    name: "Ubuntu 24.04 LTS must require users to provide a password for privilege escalation."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300020, V-274868, SV-274868r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      grep -Ei 'nopasswd' /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-a7bf9120f6 |
      Without reauthentication, users may access resources or perform tasks for which they do not have authorization.

      When operating systems provide the capability to escalate a functional capability, it is critical that the user reauthenticate.
    remediation: &rem-4b36d4425d |
      Configure the operating system to not allow users to execute privileged actions without authenticating with a password.

      Remove any occurrence of "NOPASSWD" found in "/etc/sudoers" file or files in the "/etc/sudoers.d" directory.

      $ sudo find /etc/sudoers /etc/sudoers.d -type f -exec sed -i '/NOPASSWD/ s/^/# /g' {} \;
