  - id: "STIG-UBTU-24-400360-sssd_pki_cert_path"
    name: "Ubuntu 24.04 LTS, for PKI-based authentication, SSSD must validate certificates by constructing a certification path (which includes status information) to an accepted trust anchor."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400360, V-270735, SV-270735r1066694_rule, CAT II. CCI-000185, CCI-004909. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      if [ -f /etc/sssd/sssd.conf ]; then
        grep -Eq '^services\s*=.*pam' /etc/sssd/sssd.conf && \
        grep -Eq '^pam_cert_auth\s*=\s*True' /etc/sssd/sssd.conf && \
        echo "OK"
      else
        echo "OK - sssd.conf not present; PKI-via-SSSD not configured"
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^OK" }
    rationale: &rat-4a3db436c8 |
      Without path validation, an informed trust decision by the relying party cannot be made when presented with any certificate not already explicitly trusted.

      A trust anchor is an authoritative entity represented via a public key and associated data. It is used in the context of public key infrastructures, X.509 digital certificates, and DNSSEC.

      When there is a chain of trust, usually the top entity to be trusted becomes the trust anchor; it can be, for example, a certification authority (CA). A certification path starts with the subject certificate and proceeds through a number of intermediate certificates up to a trusted root certificate, typically issued by a trusted CA.

      This requirement verifies that a certification path to an accepted trust anchor is used for certificate validation and that the path includes status information. Path validation is necessary for a relying party to make an informed trust decision when presented with any certificate not already explicitly trusted. Status information for certification paths includes certificate revocation lists or online certificate status protocol responses. Validation of the certificate status information is out of scope for this requirement.
    remediation: &rem-3f79b45f4c |
      Configure Ubuntu 24.04 LTS, for PKI-based authentication, to validate certificates by constructing a certification path to an accepted trust anchor.

      Add or update the /etc/sssd/sssd.conf so that the following entries are in the correct sections of the file:

      $ sudo vi /etc/sssd/sssd.conf

      [sssd]
      services = nss,pam,ssh
      config_file_version = 2

      [pam]
      pam_cert_auth = True

      [domain/example.com]
      ldap_user_certificate = usercertificate;binary
      certificate_verification = ca_cert,ocsp
      ca_cert = /etc/ssl/certs/ca-certificates.crt
  - id: "STIG-UBTU-24-400400-login_defs_encryption-attrs"
    name: "Ubuntu 24.04 LTS must encrypt all stored passwords with a FIPS 140-3 approved cryptographic hashing algorithm. (/etc/login.defs: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400400, V-270739, SV-270739r1268232_rule, CAT II. CCI-000803. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-02d8e626cf |
      Passwords need to be protected at all times, and encryption is the standard method for protecting passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised.
    remediation: &rem-6b20e832d7 |
      Configure Ubuntu 24.04 LTS to encrypt all stored passwords.

      Edit/modify the following line in the "/etc/login.defs" file and set "ENCRYPT_METHOD" to SHA512:

      ENCRYPT_METHOD SHA512
  - id: "STIG-UBTU-24-400400-login_defs_encryption-content"
    name: "Ubuntu 24.04 LTS must encrypt all stored passwords with a FIPS 140-3 approved cryptographic hashing algorithm. (/etc/login.defs has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400400, V-270739, SV-270739r1268232_rule, CAT II. CCI-000803. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect: { some: "~ (?i)^ENCRYPT_METHOD sha512" }
    rationale: *rat-02d8e626cf
    remediation: *rem-6b20e832d7
  - id: "STIG-UBTU-24-500010-sudo.log_module_cnf"
    name: "Ubuntu 24.04 LTS must generate audit records for privileged activities, nonlocal maintenance, diagnostic sessions, and other system-level access. (Config)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-500010, V-270740, SV-270740r1066709_rule, CAT II. CCI-000172, CCI-002884. NIST SP 800-53 Rev. 4: AU-12, MA-4."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      grep sudo.log /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (.*:|)-w /var/log/sudo.log -p wa -k maintenance" }
    rationale: &rat-de27a7f2d8 |
      If events associated with nonlocal administrative access or diagnostic sessions are not logged, a major tool for assessing and investigating attacks would not be available.

      This requirement addresses auditing-related issues associated with maintenance tools used specifically for diagnostic and repair actions on organizational information systems.

      Nonlocal maintenance and diagnostic activities are those activities conducted by individuals communicating through a network, either an external network (e.g., the internet) or an internal network. Local maintenance and diagnostic activities are those activities carried out by individuals physically present at the information system or information system component and not communicating across a network connection.

      This requirement applies to hardware/software diagnostic test equipment or tools. This requirement does not cover hardware/software components that may support information system maintenance, yet are a part of the system, for example, the software implementing "ping," "ls," "ipconfig," or the hardware and software implementing the monitoring port of an Ethernet switch.
    remediation: &rem-34725270ab |
      Configure Ubuntu 24.04 LTS to audit activities performed during nonlocal maintenance and diagnostic sessions.

      Add or update the following rules in the "/etc/audit/rules.d/stig.rules" file:

      -w /var/log/sudo.log -p wa -k maintenance

      To reload the rules file, issue the following command:

      $ sudo augenrules --load
  - id: "STIG-UBTU-24-500010-sudo.log_module_live"
    name: "Ubuntu 24.04 LTS must generate audit records for privileged activities, nonlocal maintenance, diagnostic sessions, and other system-level access. (Live)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-500010, V-270740, SV-270740r1066709_rule, CAT II. CCI-000172, CCI-002884. NIST SP 800-53 Rev. 4: AU-12, MA-4."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      auditctl -l | grep sudo.log
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /var/log/sudo\\.log -p wa -k maintenance" }
    rationale: *rat-de27a7f2d8
    remediation: *rem-34725270ab
  - id: "STIG-UBTU-24-500050-sshd_pam_conf-attrs"
    name: "Ubuntu 24.04 LTS must use strong authenticators in establishing nonlocal maintenance and diagnostic sessions. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-500050, V-270741, SV-270741r1066712_rule, CAT II. CCI-000877. NIST SP 800-53 Rev. 4: MA-4."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-4d84d2dbe9 |
      Nonlocal maintenance and diagnostic activities are those activities conducted by individuals communicating through a network, either an external network (e.g., the internet) or an internal network. Local maintenance and diagnostic activities are those activities carried out by individuals physically present at the information system or information system component and not communicating across a network connection. Typically, strong authentication requires authenticators that are resistant to replay attacks and employ multifactor authentication. Strong authenticators include, for example, PKI where certificates are stored on a token protected by a password, passphrase, or biometric.
    remediation: &rem-544b0aa4bf |
      Configure Ubuntu 24.04 LTS to use strong authentication when establishing nonlocal maintenance and diagnostic sessions.

      Add or modify the following line to /etc/ssh/sshd_config:

      UsePAM yes
  - id: "STIG-UBTU-24-500050-sshd_pam_conf-content"
    name: "Ubuntu 24.04 LTS must use strong authenticators in establishing nonlocal maintenance and diagnostic sessions. (/etc/ssh/sshd_config has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-500050, V-270741, SV-270741r1066712_rule, CAT II. CCI-000877. NIST SP 800-53 Rev. 4: MA-4."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect: { some: "~ ^UsePAM yes" }
    rationale: *rat-4d84d2dbe9
    remediation: *rem-544b0aa4bf
  - id: "STIG-UBTU-24-500050-sshd_pam_running"
    name: "Ubuntu 24.04 LTS must use strong authenticators in establishing nonlocal maintenance and diagnostic sessions. (running)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-500050, V-270741, SV-270741r1066712_rule, CAT II. CCI-000877. NIST SP 800-53 Rev. 4: MA-4."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      sshd -T | grep -i usepam
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^usepam yes" }
    rationale: *rat-4d84d2dbe9
    remediation: *rem-544b0aa4bf
  - id: "STIG-UBTU-24-600000-sshd_alivemax-attrs"
    name: "Ubuntu 24.04 LTS must immediately terminate all network connections associated with SSH traffic after a period of inactivity. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600000, V-270742, SV-270742r1066715_rule, CAT II. CCI-001133. NIST SP 800-53 Rev. 4: SC-10."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d32ddfccf0 |
      Automatic session termination addresses the termination of user-initiated logical sessions in contrast to the termination of network connections that are associated with communications sessions (i.e., network disconnect). A logical session (for local, network, and remote access) is initiated whenever a user (or process acting on behalf of a user) accesses an organizational information system. Such user sessions can be terminated (and thus terminate user access) without terminating network sessions.

      Session termination terminates all processes associated with a user's logical session except those processes that are specifically created by the user (i.e., session owner) to continue after the session is terminated.

      Conditions or trigger events requiring automatic session termination can include, for example, organization-defined periods of user inactivity, targeted responses to certain types of incidents, and time-of-day restrictions on information system use.

      This capability is typically reserved for specific Ubuntu 24.04 LTS functionality where the system owner, data owner, or organization requires additional assurance.
    remediation: &rem-5bf94d8792 |
      Configure Ubuntu 24.04 LTS to automatically terminate inactive SSH sessions after a period of inactivity.

      Modify or append the following line in the "/etc/ssh/sshd_config" file, replacing "[Count]" with a value of 1:

      ClientAliveCountMax 1

      Restart the SSH daemon for the changes to take effect:

      $ sudo systemctl restart ssh.service
  - id: "STIG-UBTU-24-600000-sshd_alivemax-content"
    name: "Ubuntu 24.04 LTS must immediately terminate all network connections associated with SSH traffic after a period of inactivity. (/etc/ssh/sshd_config has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600000, V-270742, SV-270742r1066715_rule, CAT II. CCI-001133. NIST SP 800-53 Rev. 4: SC-10."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect: { some: "~ ^ClientAliveCountMax 1" }
    rationale: *rat-d32ddfccf0
    remediation: *rem-5bf94d8792
  - id: "STIG-UBTU-24-600010-sshd_aliveinterval-attrs"
    name: "Ubuntu 24.04 LTS must immediately terminate all network connections associated with SSH traffic at the end of the session or after 10 minutes of inactivity. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600010, V-270743, SV-270743r1208702_rule, CAT II. CCI-001133. NIST SP 800-53 Rev. 4: SC-10."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-c4ff0a4674 |
      Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel to take control of a management session enabled on the console or console port that has been left unattended. In addition, quickly terminating an idle session will also free up resources committed by the managed network element.

      Terminating network connections associated with communications sessions includes, for example, deallocating associated TCP/IP address/port pairs at the Ubuntu 24.04 LTS level and deallocating networking assignments at the application level if multiple application sessions are using a single operating system-level network connection. This does not mean that Ubuntu 24.04 LTS terminates all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
    remediation: &rem-2f0ec05648 |
      Configure Ubuntu 24.04 LTS to automatically terminate all network connections associated with SSH traffic at the end of a session or after a 10-minute period of inactivity.

      In the file "/etc/ssh/sshd_config", set "ClientAliveInterval" to a value of "600" or less:

      ClientAliveInterval 600

      Restart SSH for the changes to take effect:

      $ sudo systemctl restart ssh
  - id: "STIG-UBTU-24-600010-sshd_aliveinterval-content"
    name: "Ubuntu 24.04 LTS must immediately terminate all network connections associated with SSH traffic at the end of the session or after 10 minutes of inactivity. (/etc/ssh/sshd_config has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600010, V-270743, SV-270743r1208702_rule, CAT II. CCI-001133. NIST SP 800-53 Rev. 4: SC-10."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect: { some: "~ ^ClientAliveInterval (600|[1-5][0-9]{2,}|[3-9][0-9])$" }
    rationale: *rat-c4ff0a4674
    remediation: *rem-2f0ec05648
  - id: "STIG-UBTU-24-600060-dod_certs"
    name: "Ubuntu 24.04 LTS must use DoW PKI-established certificate authorities (CAs) for verification of the establishment of protected sessions."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600060, V-270745, SV-270745r1268247_rule, CAT II. CCI-002470. NIST SP 800-53 Rev. 4: SC-23."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      ls /etc/ssl/certs | grep -iE 'dod|(^|[^a-z])dow([^a-z]|$)'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (?i)(dod|(^|[^a-z])dow([^a-z]|$))" }
    rationale: &rat-980d6c2927 |
      Untrusted CAs can issue certificates, but they may be issued by organizations or individuals that seek to compromise DoW systems or by organizations with insufficient security controls. If the CA used for verifying the certificate is not a DoW-approved CA, trust of this CA has not been established.

      The DoW will only accept PKI-certificates obtained from a DoW-approved internal or external certificate authority. Reliance on CAs for the establishment of secure sessions includes, for example, the use of SSL/TLS certificates.
    remediation: &rem-00641fdd4e |
      Configure Ubuntu 24.04 LTS to use of DoW PKI-established CAs for verification of the establishment of protected sessions.

      Edit the "/etc/ca-certificates.conf" file, adding the character "!" to the beginning of all uncommented lines that do not start with the "!" character with the following command:

      $ sudo sed -i -E 's/^([^!#]+)/!\1/' /etc/ca-certificates.conf

      Add at least one CA to the "/usr/local/share/ca-certificates" directory in the PEM format.

      Update the "/etc/ssl/certs" directory with the following command:

      $ sudo update-ca-certificates
  - id: "STIG-UBTU-24-600070-kdump_disable-enabled"
    name: "Ubuntu 24.04 LTS must disable kernel core dumps. (Service kdump-tools is not enabled)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600070, V-270746, SV-270746r1155242_rule, CAT II. CCI-001190. NIST SP 800-53 Rev. 4: SC-24."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState kdump-tools | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-7b1d43b72c |
      Kernel core dumps may contain the full contents of system memory at the time of the crash. Kernel core dumps may consume a considerable amount of disk space and may result in denial of service by exhausting the available space on the target file system partition.
    remediation: &rem-59e743a078 |
      If kernel core dumps are not required, disable the "kdump-tools" service with the following command:

      $ sudo systemctl disable kdump-tools.service

      If kernel core dumps are required, document the need with the ISSO.
  - id: "STIG-UBTU-24-600070-kdump_disable-running"
    name: "Ubuntu 24.04 LTS must disable kernel core dumps. (Service kdump-tools is not running)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600070, V-270746, SV-270746r1155242_rule, CAT II. CCI-001190. NIST SP 800-53 Rev. 4: SC-24."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState kdump-tools | cut -d= -f2
    expect: "!= active"
    rationale: *rat-7b1d43b72c
    remediation: *rem-59e743a078
  - id: "STIG-UBTU-24-600070-kdump_masked-attrs"
    name: "Ubuntu 24.04 LTS must disable kernel core dumps."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600070, V-270746, SV-270746r1155242_rule, CAT II. CCI-001190. NIST SP 800-53 Rev. 4: SC-24."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
