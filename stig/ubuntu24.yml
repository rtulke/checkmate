    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-901310, V-270828, SV-270828r1066973_rule, CAT II. CCI-000162, CCI-000163, CCI-000164. NIST SP 800-53 Rev. 4: AU-9."
