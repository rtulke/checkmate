  - id: "STIG-UBTU-24-901300-audit_logs_perms"
    name: "Ubuntu 24.04 LTS must be configured so that audit log files are not read or write-accessible by unauthorized users."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-901300, V-270827, SV-270827r1066970_rule, CAT II. CCI-000162, CCI-000163. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
