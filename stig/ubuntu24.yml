    remediation: *rem-7bafd8b236
  - id: "STIG-UBTU-24-400310-PASS_MAX_DAYS-attrs"
    name: "Ubuntu 24.04 LTS must be able to enforce a 180-day maximum password lifetime restriction. (/etc/login.defs: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400310, V-270731, SV-270731r1273634_rule, CAT II. CCI-004066. NIST SP 800-53 Rev. 4: NA."
