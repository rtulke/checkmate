  - id: "STIG-UBTU-24-400340-sssd_offline_cred_cache"
    name: "Ubuntu 24.04 LTS must be configured such that Pluggable Authentication Module (PAM) prohibits the use of cached authentications after one day."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400340, V-270734, SV-270734r1155240_rule, CAT III. CCI-002007. NIST SP 800-53 Rev. 4: IA-5."
