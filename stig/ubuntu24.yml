  - id: "STIG-UBTU-24-600030-fips_enabled-attrs"
    name: "Ubuntu 24.04 LTS must implement NIST FIPS-validated cryptography to protect classified information and for the following: To provision digital signatures, to generate cryptographic hashes, and to protect unclassified information requiring confidentiality and cryptographic protection in accordance with applicable federal laws, Executive Orders, directives, policies, regulations, and standards. (/proc/sys/crypto/fips_enabled: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-600030, V-270744, SV-270744r1137699_rule, CAT I. CCI-002450. NIST SP 800-53 Rev. 4: SC-13."
    tags: [stig, stig-ubuntu24, stig-cat-1]
    severity: high
