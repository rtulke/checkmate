    rationale: *rat-05c046008b
    remediation: *rem-75761cc9af
  - id: "STIG-UBTU-24-400320-passwd_minlength-attrs"
    name: "Ubuntu 24.04 LTS must enforce a minimum 15-character password length. (/etc/security/pwquality.conf: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400320, V-270732, SV-270732r1066685_rule, CAT II. CCI-004065, CCI-004066. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/security/pwquality.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f3d1015236 |
      The shorter the password, the lower the number of possible combinations that need to be tested before the password is compromised.

      Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks. Password length is one factor of several that helps to determine strength and how long it takes to crack a password. Use of more characters in a password helps to exponentially increase the time and/or resources required to compromise the password.
    remediation: &rem-d5caef19e4 |
      Configure Ubuntu 24.04 LTS to enforce a minimum 15-character password length.

      Add or modify the "minlen" parameter value to the "/etc/security/pwquality.conf" file:

      minlen=15
  - id: "STIG-UBTU-24-400320-passwd_minlength-content"
    name: "Ubuntu 24.04 LTS must enforce a minimum 15-character password length. (/etc/security/pwquality.conf has the expected content (1 rule))"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400320, V-270732, SV-270732r1066685_rule, CAT II. CCI-004065, CCI-004066. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/security/pwquality.conf'
    allow_rc: any
    expect: { some: "~ ^minlen\\s*=\\s*(1[5-9]|[2-5][0-9])" }
    rationale: *rat-f3d1015236
    remediation: *rem-d5caef19e4
  - id: "STIG-UBTU-24-400330-passwd_special-attrs"
    name: "Ubuntu 24.04 LTS must enforce password complexity by requiring that at least one special character be used. (/etc/security/pwquality.conf: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-400330, V-270733, SV-270733r1066688_rule, CAT II. CCI-004065, CCI-004066. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      f='/etc/security/pwquality.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e860e47be7 |
      Use of a complex password helps to increase the time and resources required to compromise the password. Password complexity or strength is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks.

      Password complexity is one factor in determining how long it takes to crack a password. The more complex the password, the greater the number of possible combinations that need to be tested before the password is compromised.

      Special characters are those characters that are not alphanumeric. Examples include: ~ ! @ # $ % ^ *.
    remediation: &rem-c3c62c5c16 |
      Configure Ubuntu 24.04 LTS to enforce password complexity by requiring that at least one special character be used.

      Add or update the following line in the "/etc/security/pwquality.conf" file to include the "ocredit=-1" parameter:

      ocredit=-1
  - id: "STIG-UBTU-24-400330-passwd_special-content"
