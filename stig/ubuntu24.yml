      Remove any instances of the "nullok" option in "/etc/pam.d/common-password" and "/etc/pam.d/common-auth" to prevent logons with empty passwords.
  - id: "STIG-UBTU-24-300031-ssh_permit-attrs"
    name: "Ubuntu 24.04 LTS must not allow unattended or automatic login via SSH. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300031, V-270717, SV-270717r1208700_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
