    severity: medium
    run: |
      systemd-tmpfiles --cat-config 2>/dev/null | awk '$1 ~ /^[zZ]$/ && $2 ~ /^\/(run|var)\/log\/journal(\/%m(\/system\.journal)?)?$/ {l[$2]=$1" "$2" "$3" "$4" "$5} END {for (p in l) print l[p]}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^z /run/log/journal 2755 \\S+ systemd-journal$" }
      - { some: "~ ^z /var/log/journal 2755 \\S+ systemd-journal$" }
