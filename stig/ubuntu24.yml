  - id: "STIG-UBTU-24-700010-var_log_file_perms"
    name: "Ubuntu 24.04 LTS must generate error messages that provide information necessary for corrective actions without revealing information that could be exploited by adversaries."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-700010, V-270756, SV-270756r1134814_rule, CAT II. CCI-001312. NIST SP 800-53 Rev. 4: SI-11."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      LOG_FILE_PERM=$(find /var/log -perm /137 ! -name '*[bw]tmp' ! -name '*lastlog' ! -name 'history.log' ! -name 'eipp.log.xz' -type f | wc -l); \
      if [ "$LOG_FILE_PERM" -eq 0 ]; \
      then echo "OK - No files or Directories found"; \
      else echo "FAIL - Files found"; \
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK - No files or Directories found" }
  - id: "STIG-UBTU-24-700020-journal_file_perms"
    name: "Ubuntu 24.04 LTS must generate system journal entries without revealing information that could be exploited by adversaries."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-700020, V-270757, SV-270757r1261493_rule, CAT II. CCI-001312. NIST SP 800-53 Rev. 4: SI-11."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      JOURNAL_DIR_PERM=$(find /run/log/journal /var/log/journal -type d -perm /5022 -printf '.' 2>/dev/null | wc -c); \
      JOURNAL_FILE_PERM=$(find /run/log/journal /var/log/journal -type f -perm /7137 -printf '.' 2>/dev/null | wc -c); \
      if [ "$JOURNAL_DIR_PERM" -eq 0 ] && [ "$JOURNAL_FILE_PERM" -eq 0 ]; \
      then echo "OK - No files or Directories found"; \
      else echo "FAIL - Files found"; \
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK - No files or Directories found" }
  - id: "STIG-UBTU-24-700020-journal_file_perms_conf"
    name: "Ubuntu 24.04 LTS must generate system journal entries without revealing information that could be exploited by adversaries. (tmpfiles)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-700020, V-270757, SV-270757r1261493_rule, CAT II. CCI-001312. NIST SP 800-53 Rev. 4: SI-11."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      systemd-tmpfiles --cat-config 2>/dev/null | awk '$1 ~ /^[zZ]$/ && $2 ~ /^\/(run|var)\/log\/journal(\/%m(\/system\.journal)?)?$/ {l[$2]=$1" "$2" "$3" "$4" "$5} END {for (p in l) print l[p]}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^z /run/log/journal 2755 root systemd-journal$" }
      - { some: "~ ^Z /run/log/journal/%m ~2750 root systemd-journal$" }
      - { some: "~ ^z /var/log/journal 2755 root systemd-journal$" }
      - { some: "~ ^z /var/log/journal/%m 2755 root systemd-journal$" }
      - { some: "~ ^z /var/log/journal/%m/system\\.journal 0640 root systemd-journal$" }
