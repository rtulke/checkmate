    allow_rc: any
    expect:
      - { some: "~ ^audit" }
      - { some: "~ ^silent" }
      - { some: "~ ^deny\\s*=\\s*[1-3]" }
      - { some: "~ ^fail_interval\\s*=\\s*(900|[1-8][0-9]{1,2}|[1-9][0-9])" }
      - { some: "~ ^unlock_time\\s*=\\s*0" }
  - id: "STIG-UBTU-24-300001-auth_apt"
    name: "Ubuntu 24.04 LTS Advance Package Tool (APT) must be configured to prevent the installation of patches, service packs, device drivers, or Ubuntu 24.04 LTS components without verification they have been digitally signed using a certificate that is recognized and approved by the organization."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-300001, V-270695, SV-270695r1268241_rule, CAT III. CCI-003992. NIST SP 800-53 Rev. 4: NA."
    tags: [stig, stig-ubuntu24, stig-cat-3]
    severity: low
    run: |
      grep -i allowunauthenticated /etc/apt/apt.conf.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*:APT::Get::AllowUnauthenticated \"false\"" }
      - { none: "~ (?i)^.*:APT::Get::AllowUnauthenticated \"true\"" }
