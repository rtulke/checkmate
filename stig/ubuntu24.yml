  - id: "STIG-UBTU-24-200580-execve_module_cnf"
    name: "Ubuntu 24.04 LTS must prevent all software from executing at higher privilege levels than users executing the software and the audit system must be configured to audit the execution of privileged functions. (Config)"
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-200580, V-270689, SV-270689r1066556_rule, CAT II. CCI-002233, CCI-002234, CCI-004188. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-ubuntu24, stig-cat-2]
    severity: medium
    run: |
      grep execve /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (.*:|)-a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -F key=execpriv" }
      - { some: "~ (.*:|)-a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -F key=execpriv" }
      - { some: "~ (.*:|)-a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -F key=execpriv" }
      - { some: "~ (.*:|)-a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -F key=execpriv" }
    rationale: &rat-f7e98c6b81 |
      In certain situations, software applications/programs need to execute with elevated privileges to perform required functions. However, if the privileges required for execution are at a higher level than the privileges assigned to organizational users invoking such applications/programs, those users are indirectly provided with greater privileges than assigned by the organizations.

      Some programs and processes are required to operate at a higher privilege level and therefore, must be excluded from the organization-defined software list after review.
    remediation: &rem-f772432d51 |
      Configure Ubuntu 24.04 LTS to audit the execution of all privileged functions.

      Add or update the following rules in the "/etc/audit/rules.d/stig.rules" file:

      -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -F key=execpriv
      -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -F key=execpriv
      -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -F key=execpriv
      -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -F key=execpriv

      Notes: For 32-bit architectures, only the 32-bit specific entries are required.

      To reload the rules file, issue the following command:

      $ sudo augenrules --load
