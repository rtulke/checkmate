      - { rc: "== 0" }
      - { some: "~ (.*:|)-a always,exit -F arch=b32 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid\u003e=1000 -F auid!=(unset|-1) -k perm_mod" }
      - { some: "~ (.*:|)-a always,exit -F arch=b32 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid=0 -k perm_mod" }
      - { some: "~ (.*:|)-a always,exit -F arch=b64 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid\u003e=1000 -F auid!=(unset|-1) -k perm_mod" }
      - { some: "~ (.*:|)-a always,exit -F arch=b64 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid=0 -k perm_mod" }
    rationale: &rat-8e047dd10d |
      Without generating audit records specific to the security and mission needs of the organization, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.

      Audit records can be generated from various components within the information system (e.g., module or policy filter).

      The system call rules are loaded into a matching engine that intercepts each syscall that all programs on the system makes. Therefore, it is very important to only use syscall rules when absolutely necessary since these affect performance. The more rules, the bigger the performance hit. The performance is helped, though, by combining syscalls into one rule whenever possible.
