    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-100810, V-270666, SV-270666r1066487_rule, CAT I. CCI-002418, CCI-002420, CCI-002422. NIST SP 800-53 Rev. 4: SC-8."
