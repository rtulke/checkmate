    name: "Ubuntu 24.04 LTS must configure the files used by the system journal to be group-owned by \"systemd-journal\"."
    description: "DISA STIG for Ubuntu 24.04 LTS, UBTU-24-700070, V-270762, SV-270762r1184076_rule, CAT II. CCI-001314. NIST SP 800-53 Rev. 4: SI-11."
