  - id: "STIG-RHEL-08-010570-home_nosuid"
    name: "RHEL 8 must prevent files with the setuid and setgid bit set from being executed on file systems that contain user home directories."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010570, V-230299, SV-230299r1017109_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/home'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nosuid(,|$)"
    rationale: &rat-d2e27efe86 |
      The "nosuid" mount option causes the system not to execute "setuid" and "setgid" files with owner privileges. This option must be used for mounting any file system not containing approved "setuid" and "setguid" files. Executing files from untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative access.
    remediation: &rem-39e9e1efb0 |
      Configure the "/etc/fstab" to use the "nosuid" option on file systems that contain user home directories for interactive users.
