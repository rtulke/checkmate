    rationale: *rat-726293edf1
    remediation: *rem-25e455a7c7
  - id: "STIG-RHEL-08-010390-openssl-pkcs11"
    name: "RHEL 8 must have the packages required for multifactor authentication installed. (pkg openssl-pkcs11)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010390, V-230273, SV-230273r1262203_rule, CAT II. CCI-001948. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet openssl-pkcs11
    expect: true
    rationale: &rat-5016683900 |
      Using an authentication device, such as a DoW common access card (CAC) or token that is separate from the information system, ensures that even if the information system is compromised, credentials stored on the authentication device will not be affected.

      Multifactor solutions that require devices separate from information systems gaining access include, for example, hardware tokens providing time-based or challenge-response authenticators and smart cards such as the U.S. Government Personal Identity Verification (PIV) card and the DoW CAC.

      A privileged account is defined as an information system account with authorizations of a privileged user.

      Remote access is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      This requirement only applies to components where this is specific to the function of the device or has the concept of an organizational user (e.g., VPN, proxy capability). This does not apply to authentication for the purpose of configuring the device itself (management).
    remediation: &rem-0b28d1930f |
      Configure the operating system to implement multifactor authentication by installing the required package with the following command:

      $ sudo yum install openssl-pkcs11
  - id: "STIG-RHEL-08-010400-check_cert_mfa"
    name: "RHEL 8 must implement certificate status checking for multifactor authentication."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010400, V-230274, SV-230274r1262204_rule, CAT II. CCI-001948. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      for file in `ls /etc/sssd/sssd.conf /etc/sssd/conf.d/*`; do awk '/\[/{prefix=$0; next} $1{print prefix $0}' $file | grep '\[sssd\]certificate_verification'; done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^[sssd]certificate_verification = ocsp_dgst=sha1" }
    rationale: &rat-6e00f482c6 |
      Using an authentication device, such as a DoW common access card (CAC) or token that is separate from the information system, ensures that even if the information system is compromised, credentials stored on the authentication device will not be affected.

      Multifactor solutions that require devices separate from information systems gaining access include, for example, hardware tokens providing time-based or challenge-response authenticators and smart cards such as the U.S. Government Personal Identity Verification (PIV) card and the DoW CAC.

      RHEL 8 includes multiple options for configuring certificate status checking, but for this requirement focuses on the System Security Services Daemon (SSSD). By default, sssd performs Online Certificate Status Protocol (OCSP) checking and certificate verification using a sha256 digest function.
    remediation: &rem-6f1632bd70 |
      Configure the operating system to implement certificate status checking for multifactor authentication.

      Review the "/etc/sssd/sssd.conf" file to determine if the system is configured to prevent OCSP or certificate verification.

      Add the following line to the [sssd] section of the "/etc/sssd/sssd.conf" file:

      certificate_verification = ocsp_dgst=sha1

      The "sssd" service must be restarted for the changes to take effect. To restart the "sssd" service, run the following command:

      $ sudo systemctl restart sssd.service
  - id: "STIG-RHEL-08-010410-opensc"
    name: "RHEL 8 must accept Personal Identity Verification (PIV) credentials."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010410, V-230275, SV-230275r1262205_rule, CAT II. CCI-001953. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet opensc
    expect: true
    rationale: &rat-aaf84024a0 |
      The use of PIV credentials facilitates standardization and reduces the risk of unauthorized access.

      The DoW has mandated the use of the common access card (CAC) to support identity management and personal authentication for systems covered under Homeland Security Presidential Directive (HSPD) 12, as well as making the CAC a primary component of layered protection for national security systems.
    remediation: &rem-33574e78b7 |
      Configure RHEL 8 to accept PIV credentials.

      Install the "opensc" package using the following command:

      $ sudo yum install opensc
  - id: "STIG-RHEL-08-010410-piv_driver_check"
    name: "RHEL 8 must accept Personal Identity Verification (PIV) credentials. (check piv driver loaded)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010410, V-230275, SV-230275r1262205_rule, CAT II. CCI-001953. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      opensc-tool --list-drivers | grep -i piv
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ PIV-II\\s*Personal Identity Verification Card" }
    rationale: *rat-aaf84024a0
    remediation: *rem-33574e78b7
  - id: "STIG-RHEL-08-010420-nx_active_check"
    name: "RHEL 8 must implement non-executable data to protect its memory from unauthorized code execution. (nx active check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010420, V-230276, SV-230276r958928_rule, CAT II. CCI-001953. NIST SP 800-53 Rev. 4: SI-16."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      dmesg | grep -c '.*NX.*protection: active'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 1" }
    rationale: &rat-79a2bad8ae |
      Some adversaries launch attacks with the intent of executing code in non-executable regions of memory or in memory locations that are prohibited. Security safeguards employed to protect memory include, for example, data execution prevention and address space layout randomization. Data execution prevention safeguards can be either hardware-enforced or software-enforced with hardware providing the greater strength of mechanism.

      Examples of attacks are buffer overflow attacks.
    remediation: &rem-a5e26272b6 |
      The NX bit execute protection must be enabled in the system BIOS.
  - id: "STIG-RHEL-08-010420-nx_cpu_check"
    name: "RHEL 8 must implement non-executable data to protect its memory from unauthorized code execution. (cpu nx abilty)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010420, V-230276, SV-230276r958928_rule, CAT II. CCI-001953. NIST SP 800-53 Rev. 4: SI-16."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -w 'flags' /proc/cpuinfo | grep -v nx
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: *rat-79a2bad8ae
    remediation: *rem-a5e26272b6
  - id: "STIG-RHEL-08-010421-default_grub_poison"
    name: "RHEL 8 must clear the page allocator to prevent use-after-free attacks. (default grub check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010421, V-230277, SV-230277r1017090_rule, CAT II. CCI-001084. NIST SP 800-53 Rev. 4: SC-3."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep page_poison /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^[^#].*=.*\\spage_poison=1\\s" }
    rationale: &rat-2265949669 |
      Some adversaries launch attacks with the intent of executing code in non-executable regions of memory or in memory locations that are prohibited. Security safeguards employed to protect memory include, for example, data execution prevention and address space layout randomization. Data execution prevention safeguards can be either hardware-enforced or software-enforced with hardware providing the greater strength of mechanism.

      Poisoning writes an arbitrary value to freed pages, so any modification or reference to that page after being freed or before being initialized will be detected and prevented. This prevents many types of use-after-free vulnerabilities at little performance cost. Also prevents leak of data and detection of corrupted memory.
    remediation: &rem-c1401eb373 |
      Configure RHEL 8 to enable page poisoning with the following commands:

      $ sudo grubby --update-kernel=ALL --args="page_poison=1"

      Add or modify the following line in "/etc/default/grub" to ensure the configuration survives kernel updates:

      GRUB_CMDLINE_LINUX="page_poison=1"
  - id: "STIG-RHEL-08-010421-grub_page_poison_chk"
