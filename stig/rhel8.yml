      - { some: "~ kernel\\.core_pattern = \\|/bin/false" }
      - { none: "~ kernel.core_pattern = /|\\/bin\\/true" }
    rationale: *rat-4b33b56339
    remediation: *rem-ce01b32876
  - id: "STIG-RHEL-08-010672-systemd-coredump.socket-enabled"
    name: "RHEL 8 must disable acquiring, saving, and processing core dumps. (Service systemd-coredump.socket is not enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010672, V-230312, SV-230312r1134877_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-coredump.socket | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-f64b42d91a |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      A core dump includes a memory image taken at the time the operating system terminates an application. The memory image could contain sensitive data and is generally useful only for developers trying to debug problems.

      When the kernel invokes systemd-coredumpt to handle a core dump, it runs in privileged mode, and will connect to the socket created by the systemd-coredump.socket unit. This, in turn,  will spawn an unprivileged systemd-coredump@.service instance to process the core dump.
    remediation: &rem-c469782b68 |
      Configure the system to disable the systemd-coredump.socket with the following commands:

      $ sudo systemctl disable --now systemd-coredump.socket

      $ sudo systemctl mask systemd-coredump.socket

      Created symlink /etc/systemd/system/systemd-coredump.socket -> /dev/null

      Reload the daemon for this change to take effect.

      $ sudo systemctl daemon-reload
  - id: "STIG-RHEL-08-010672-systemd-coredump.socket-running"
    name: "RHEL 8 must disable acquiring, saving, and processing core dumps. (Service systemd-coredump.socket is not running)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010672, V-230312, SV-230312r1134877_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
