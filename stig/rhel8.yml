    name: "Successful/unsuccessful uses of the truncate, ftruncate, creat, open, openat, and open_by_handle_at system calls in RHEL 8 must generate an audit record. (config check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030420, V-230449, SV-230449r1017249_rule, CAT II. CCI-000169. NIST SP 800-53 Rev. 4: AU-12."
