    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^FIPS$" }
  - id: "STIG-RHEL-08-010030-cryptsetup"
    name: "All RHEL 8 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection. (pkg installed)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010030, V-230224, SV-230224r1044787_rule, CAT I. CCI-001199. NIST SP 800-53 Rev. 4: SC-28."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet cryptsetup
    expect: true
  - id: "STIG-RHEL-08-010030-check_encrypted_disks"
    name: "All RHEL 8 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection. (disks encrypted)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010030, V-230224, SV-230224r1044787_rule, CAT I. CCI-001199. NIST SP 800-53 Rev. 4: SC-28."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      if [ `dmsetup status | awk '{print $NF}' | grep -cv crypt` -ge 1 ] ; then echo "Fail - unencrypted disks"; else echo "OK - System disks encrypted"; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK - System disks encrypted" }
      - { none: "~ Fail - unencrypted disks" }
