  - id: "STIG-RHEL-08-020035-stopidle_logind.conf-content"
    name: "RHEL 8.7 and higher must terminate idle user sessions. (/etc/systemd/logind.conf has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020035, V-257258, SV-257258r1069328_rule, CAT II. CCI-001133. NIST SP 800-53 Rev. 4: SC-10."
