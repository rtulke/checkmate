# Do not edit by hand; regenerate with `make stig-import`. See stig/NOTICE.
name: DISA STIG Red Hat Enterprise Linux 8
version: "2.9.0"
description: >
  Automated checks for 343 rules of the DISA Security Technical
  Implementation Guide for Red Hat Enterprise Linux 8 (version 2.9.0), converted from the goss
  audit content of the ansible-lockdown project. Severity follows the STIG
  category: CAT I high, CAT II medium, CAT III low. Rationale and fix
  texts are taken from the DISA STIG V2R9 (30 Sep 2026). Select categories
  with tags, e.g. `--tags stig-cat-1`.

defaults:
  when: "(facts.distro == \"rhel\" or \"rhel\" in facts.distro_like) and facts.version_major == 8"
  timeout: 120s

checks:
  - id: "STIG-RHEL-08-010000-etc_redhat-release-attrs"
    name: "RHEL 8 must be a vendor-supported release. (/etc/redhat-release: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010000, V-230221, SV-230221r1262181_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      f='/etc/redhat-release'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-255db04ade |
      An operating system release is considered supported if the vendor continues to provide security patches for the product. With an unsupported release, it will not be possible to resolve security issues discovered in the system software.

      Red Hat offers the Extended Update Support (EUS) add-on to a Red Hat Enterprise Linux subscription, for a fee, for those customers who wish to standardize on a specific minor release for an extended period. The RHEL 8 minor releases eligible for EUS are 8.1, 8.2, 8.4, 8.6, and 8.8. Each RHEL 8 EUS stream is available for 24 months from the availability of the minor release. RHEL 8.10 will be the final minor release overall. For more details on the Red Hat Enterprise Linux Life Cycle  visit https://access.redhat.com/support/policy/updates/errata/.
      Note: The life-cycle time spans and dates are subject to adjustment.

      The version is still supported but has been superseded and must be removed from the enclave network or upgraded to a supported version.

      Red Hat Enterprise Linux 8
      General Availability: May 7, 2019
      Full Support: May 7, 2019 to May 31, 2024
      Maintenance Support: Jun 1, 2024 to May 31, 2029
      Extended Life Cycle (ELC): Jun 1, 2029 to May 31, 2033
      Long-Life Add-On: Jun 1, 2033 to Ongoing
      Final Minor Release: 8.10
    remediation: &rem-623eeac62a |
      Upgrade to a supported version of RHEL 8.
  - id: "STIG-RHEL-08-010000-etc_redhat-release-content"
    name: "RHEL 8 must be a vendor-supported release. (/etc/redhat-release has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010000, V-230221, SV-230221r1262181_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      cat '/etc/redhat-release'
    allow_rc: any
    expect: { some: "~ .* 8.10" }
    rationale: *rat-255db04ade
    remediation: *rem-623eeac62a
  - id: "STIG-RHEL-08-010015-crypto-policies"
    name: "RHEL 8 must have the crypto-policies package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010015, V-279933, SV-279933r1156352_rule, CAT I. CCI-002450. NIST SP 800-53 Rev. 4: SC-13."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet crypto-policies
    expect: true
    rationale: &rat-d9cd3cc736 |
      Centralized cryptographic policies simplify applying secure ciphers across an operating system and the applications that run on that operating system. Use of weak or untested encryption algorithms undermines the purposes of using encryption to protect data.
    remediation: &rem-e68bda2dc0 |
      Install the crypto-policies package (if the package is not already installed) with the following command:

      $ sudo dnf -y install crypto-policies
  - id: "STIG-RHEL-08-010020-crypto_policy_current"
    name: "RHEL 8 must implement a FIPS 140-3-compliant systemwide cryptographic policy. (CURRENT.pol hash and min_rsa_size)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010020, V-230223, SV-230223r1262171_rule, CAT I. CCI-000068. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      grep -E 'rsa_size|hash' /etc/crypto-policies/state/CURRENT.pol
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ hash.*SHA2-256.*SHA2-384.*SHA2-512" }
      - { some: "~ min_rsa_size\\s*=\\s*2048" }
    rationale: *rat-d9cd3cc736
    remediation: &rem-a9c5c9a354 |
      Configure RHEL 8 to use a FIPS 140-3-compliant systemwide cryptographic policy.

      Set the systemwide crypto-policy to FIPS with the following command:

      $ sudo update-crypto-policies --set FIPS
      Setting system policy to FIPS

      Note: Systemwide crypto-policies are applied on application startup. It is recommended to restart the system for the change of policies to fully take place.
  - id: "STIG-RHEL-08-010020-crypto_policy_show"
    name: "RHEL 8 must implement a FIPS 140-3-compliant systemwide cryptographic policy. (update-crypto-policies --show)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010020, V-230223, SV-230223r1262171_rule, CAT I. CCI-000068. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      update-crypto-policies --show
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^FIPS$" }
    rationale: *rat-d9cd3cc736
    remediation: *rem-a9c5c9a354
  - id: "STIG-RHEL-08-010030-cryptsetup"
    name: "All RHEL 8 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection. (pkg installed)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010030, V-230224, SV-230224r1044787_rule, CAT I. CCI-001199. NIST SP 800-53 Rev. 4: SC-28."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet cryptsetup
    expect: true
    rationale: &rat-846da3a36a |
      RHEL 8 systems handling data requiring "data at rest" protections must employ cryptographic mechanisms to prevent unauthorized disclosure and modification of the information at rest.

      Selection of a cryptographic mechanism is based on the need to protect the integrity of organizational information. The strength of the mechanism is commensurate with the security category and/or classification of the information. Organizations have the flexibility to either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific data structures (e.g., files, records, or fields).
    remediation: &rem-c86df38c4a |
      Configure RHEL 8 to prevent unauthorized modification of all information at rest by using disk encryption.

      Encrypting a partition in an already installed system is more difficult, because existing partitions will need to be resized and changed. To encrypt an entire partition, dedicate a partition for encryption in the partition layout.
  - id: "STIG-RHEL-08-010030-check_encrypted_disks"
    name: "All RHEL 8 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection. (disks encrypted)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010030, V-230224, SV-230224r1044787_rule, CAT I. CCI-001199. NIST SP 800-53 Rev. 4: SC-28."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      if [ `dmsetup status | awk '{print $NF}' | grep -cv crypt` -ge 1 ] ; then echo "Fail - unencrypted disks"; else echo "OK - System disks encrypted"; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK - System disks encrypted" }
      - { none: "~ Fail - unencrypted disks" }
    rationale: *rat-846da3a36a
    remediation: *rem-c86df38c4a
  - id: "STIG-RHEL-08-010121-no_blank_passwds"
    name: "The RHEL 8 operating system must not have accounts configured with blank or null passwords."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010121, V-251706, SV-251706r1017359_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      cut -d ':' -f1,2 /etc/shadow | grep -Ei "(:\$|\s+)"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-050a0575c0 |
      If an account has an empty password, anyone could log on and run commands with the privileges of that account. Accounts with empty passwords should never be used in operational environments.
    remediation: &rem-4935a4aee1 |
      Configure all accounts on the system to have a password or lock the account with the following commands:

      Perform a password reset:
      $ sudo passwd [username]
      Lock an account:
      $ sudo passwd -l [username]
  - id: "STIG-RHEL-08-010150-grub_user_password_bios-attrs"
    name: "RHEL 8 operating systems booted with a BIOS must require authentication upon booting into single-user and maintenance modes. (/boot/grub2//user.cfg: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010150, V-230235, SV-230235r1137691_rule, CAT I. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      f='/boot/grub2//user.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-8dbd77095f |
      If the system does not require valid authentication before it boots into single-user or maintenance mode, anyone who invokes single-user or maintenance mode is granted privileged access to all files on the system. GRUB 2 is the default boot loader for RHEL 8 and is designed to require a password to boot into single-user mode or make modifications to the boot menu.
    remediation: &rem-c4d883dbe2 |
      Configure the system to require a grub bootloader password for the grub superusers account with the grub2-setpassword command, which creates/overwrites the /boot/grub2/user.cfg file.

      Generate an encrypted grub2 password for the grub superusers account with the following command:

      $ sudo grub2-setpassword
      Enter password:
      Confirm password:
  - id: "STIG-RHEL-08-010150-grub_user_password_bios-content"
    name: "RHEL 8 operating systems booted with a BIOS must require authentication upon booting into single-user and maintenance modes. (/boot/grub2//user.cfg has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010150, V-230235, SV-230235r1137691_rule, CAT I. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      cat '/boot/grub2//user.cfg'
    allow_rc: any
    expect: { some: "~ ^GRUB2_PASSWORD=grub.pbkdf2.sha512.changeme" }
    rationale: *rat-8dbd77095f
    remediation: *rem-c4d883dbe2
  - id: "STIG-RHEL-08-010270-crypto_policy_applied"
    name: "RHEL 8 cryptographic policy must not be overridden. (check policy is applied)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010270, V-279932, SV-279932r1156349_rule, CAT I. CCI-002450. NIST SP 800-53 Rev. 4: SC-13."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      update-crypto-policies --is-applied
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ The configured policy.*is applied" }
    rationale: *rat-d9cd3cc736
    remediation: &rem-e2104712bd |
      Configure RHEL 8 to correctly implement the systemwide cryptographic policies by reinstalling the crypto-policies package contents.

      Reinstall crypto-policies with the following command:

      $ sudo dnf -y reinstall crypto-policies

      Set the crypto-policy to FIPS with the following command:

      $ sudo update-crypto-policies --set FIPS

      Setting system policy to FIPS

      Note: Systemwide crypto policies are applied on application startup. It is recommended to restart the system for the change of policies to fully take place.
  - id: "STIG-RHEL-08-010275-bind_crypto_policy"
    name: "RHEL 8 must implement DoW-approved encryption in the bind package. (check crypto-policies backend)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010275, V-279931, SV-279931r1262194_rule, CAT I. CCI-002418. NIST SP 800-53 Rev. 4: SC-8."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      grep -r crypto-policies /etc/named.conf 2>/dev/null || echo "bind not installed or not configured"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ crypto-policies\\/back-ends\\/bind.config|bind not installed" }
    rationale: &rat-109db73521 |
      Without cryptographic integrity protections, information can be altered by unauthorized users without detection.

      Cryptographic mechanisms used for protecting the integrity of information include, for example, signed hash functions using asymmetric cryptography enabling distribution of the public key to verify the hash information while maintaining the confidentiality of the secret key used to generate the hash.

      RHEL 8 incorporates systemwide crypto policies by default. The employed algorithms can be viewed in the /etc/crypto-policies/back-ends/ directory.
    remediation: &rem-52fb729a76 |
      Configure BIND to use the system crypto policy.

      Add the following line to the "options" section in "/etc/named.conf":

      include "/etc/crypto-policies/back-ends/bind.config";
  - id: "STIG-RHEL-08-010280-libreswan_crypto_policy"
    name: "RHEL 8 IP tunnels must use FIPS 140-3-approved cryptographic algorithms. (check crypto-policies backend)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010280, V-279930, SV-279930r1184239_rule, CAT I. CCI-000068. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      grep -r crypto-policies /etc/ipsec.conf 2>/dev/null || echo "libreswan not installed or not configured"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ crypto-policies\\/back-ends\\/libreswan.config|libreswan not installed" }
    rationale: &rat-b663c306ef |
      Overriding the system crypto policy makes the behavior of the Libreswan service violate expectations and makes system configuration more fragmented.
    remediation: &rem-459df70992 |
      Configure Libreswan to use the system cryptographic policy.

      Add the following line to "/etc/ipsec.conf":

      include /etc/crypto-policies/back-ends/libreswan.config
  - id: "STIG-RHEL-08-010287-sshd_crypto_policy_not_overridden"
    name: "The RHEL 8 SSH daemon must be configured to use systemwide crypto policies."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010287, V-288830, SV-288830r1261891_rule, CAT I. CCI-001453. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      grep -s CRYPTO_POLICY /etc/sysconfig/sshd
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^\\s*CRYPTO_POLICY=" }
    rationale: &rat-f14c88ff61 |
      Without cryptographic integrity protections, information can be altered by unauthorized users without detection.

      Remote access (e.g., RDP) is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      Cryptographic mechanisms used for protecting the integrity of information include, for example, signed hash functions using asymmetric cryptography enabling distribution of the public key to verify the hash information while maintaining the confidentiality of the secret key used to generate the hash.

      RHEL 8 incorporates systemwide crypto policies by default. The SSH configuration file has no effect on the ciphers, MACs, or algorithms unless specifically defined in the /etc/sysconfig/sshd file. The employed algorithms can be viewed in the /etc/crypto-policies/back-ends/ directory.
    remediation: &rem-91e4c2e307 |
      Configure the RHEL 8 SSH daemon to use systemwide crypto policies by adding the following line to /etc/sysconfig/sshd:

      # CRYPTO_POLICY=

      Restart the sshd service:
      $ sudo systemctl restart sshd
  - id: "STIG-RHEL-08-010290-crypto_policies_openssh_server_macs"
    name: "The RHEL 8 SSH server must be configured to use only Message Authentication Codes (MACs) employing FIPS 140-3-validated cryptographic hash algorithms to protect the confidentiality of SSH server connections. (crypto-policies - ssh_server)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010290, V-230251, SV-230251r1262195_rule, CAT I. CCI-001453. NIST SP 800-53 Rev. 4: AC-17."
