           $ sudo yum install mailx
  - id: "STIG-RHEL-08-010359-aide"
    name: "The RHEL 8 operating system must use a file integrity tool to verify correct operation of all security functions."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010359, V-251710, SV-251710r958944_rule, CAT II. CCI-002696. NIST SP 800-53 Rev. 4: SI-4."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet aide
    expect: true
    rationale: &rat-4e789666fd |
      Without verification of the security functions, security functions may not operate correctly, and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.

      This requirement applies to the RHEL 8 operating system performing security function verification/testing and/or systems and environments that require this functionality.
    remediation: &rem-c50a9ef27a |
      Install AIDE, initialize it, and perform a manual check.

      Install AIDE:
           $ sudo yum install aide

      Initialize it:
           $ sudo /usr/sbin/aide --init

      Example output:
           Number of entries:      48623

           ---------------------------------------------------
           The attributes of the (uncompressed) database(s):
           ---------------------------------------------------

           /var/lib/aide/aide.db.new.gz
             SHA1     : LTAVQ8tFJthsrf4m9gfRpnf1vyc=
             SHA256   : NJ9+uzRQKSwmLQ8A6IpKNvYjVKGbhSjt
                        BeJBVcmOVrI=
             SHA512   : 7d8I/F6A1b07E4ZuGeilZjefRgJJ/F20
                        eC2xoag1OsOVpctt3Mi7Jjjf3vFW4xoY
                        5mdS6/ImQpm0xtlTLOPeQQ==

           End timestamp: 2022-10-20 10:50:52 -0700 (run time: 0m 46s)

      The new database will need to be renamed to be read by AIDE:
           $ sudo mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz

      Perform a manual check:
           $ sudo /usr/sbin/aide --check

      Example output:
           Start timestamp: 2022-10-20 11:03:16 -0700 (AIDE 0.16)
           AIDE found differences between database and filesystem!!
           ...

      Done.
