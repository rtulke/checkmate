  - id: "STIG-RHEL-08-010372-kernel.kexec_load_disabled"
    name: "RHEL 8 must prevent the loading of a new kernel for later execution. (live systcl check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010372, V-230266, SV-230266r1184246_rule, CAT II. CCI-001749. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      sysctl -n kernel.kexec_load_disabled
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-2d436c2426 |
      Changes to any software components can have significant effects on the overall security of the operating system. This requirement ensures the software has not been tampered with and that it has been provided by a trusted vendor.

      Disabling kexec_load prevents an unsigned kernel image (that could be a windows kernel or modified vulnerable kernel) from being loaded. Kexec can be used subvert the entire secureboot process and should be avoided at all costs especially since it can load unsigned kernel images.

      The sysctl --system command will load settings from all system configuration files. All configuration files are sorted by their filename in lexicographic order, regardless of which of the directories they reside in. If multiple files specify the same option, the entry in the file with the lexicographically latest name will take precedence. Files are read from directories in the following list from top to bottom. Once a file of a given filename is loaded, any file of the same name in subsequent directories is ignored.
      /etc/sysctl.d/*.conf
      /run/sysctl.d/*.conf
      /usr/local/lib/sysctl.d/*.conf
      /usr/lib/sysctl.d/*.conf
      /lib/sysctl.d/*.conf
      /etc/sysctl.conf
    remediation: &rem-1c8133d29a |
      Configure RHEL 8 to disable kernel image loading.

      Create a drop-in if it does not already exist:

      $ sudo vi /etc/sysctl.d/99-kernel_kexec_load_disabled.conf

      Add the following to the file:
      kernel.kexec_load_disabled = 1

      Reload settings from all system configuration files with the following command:

      $ sudo sysctl --system
  - id: "STIG-RHEL-08-010372-kernel_disable_new_kern"
    name: "RHEL 8 must prevent the loading of a new kernel for later execution. (file check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010372, V-230266, SV-230266r1184246_rule, CAT II. CCI-001749. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -iR kernel.kexec_load_disabled /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf /etc/sysctl.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:(\\s|)kernel.kexec_load_disabled( |)=( |)1" }
      - { none: "~ .*:(\\s|)kernel.kexec_load_disabled( |)=( |)0" }
    rationale: *rat-2d436c2426
    remediation: *rem-1c8133d29a
  - id: "STIG-RHEL-08-010373-fs.protected_symlinks"
