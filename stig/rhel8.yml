  - id: "STIG-RHEL-08-040286-net.core.bpf_jit_harden"
    name: "RHEL 8 must enable hardening for the Berkeley Packet Filter Just-in-time compiler. (Live_check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040286, V-244554, SV-244554r1210517_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
