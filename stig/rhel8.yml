      - { some: "~ ^kernelopts=.*\\sinit_on_free=1\\s.*$" }
      - { none: "~ ^kernelopts=.*\\sinit_on_free=1\\s.*$" }
    rationale: *rat-0cb21bc308
    remediation: *rem-52c8ff16cb
  - id: "STIG-RHEL-08-010430-kernel.randomize_va_space"
    name: "RHEL 8 must implement address space layout randomization (ASLR) to protect its memory from unauthorized code execution. (Live check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010430, V-230280, SV-230280r1208745_rule, CAT II. CCI-002824. NIST SP 800-53 Rev. 4: SI-16."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      sysctl -n kernel.randomize_va_space
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 2"
    rationale: &rat-72c1810e35 |
      Some adversaries launch attacks with the intent of executing code in nonexecutable regions of memory or in memory locations that are prohibited. Security safeguards employed to protect memory include, for example, data execution prevention and address space layout randomization. Data execution prevention safeguards can be either hardware-enforced or software-enforced, with hardware providing the greater strength of mechanism.

      Examples of attacks are buffer overflow attacks.

      The sysctl --system command will load settings from all system configuration files. All configuration files are sorted by their filename in lexicographic order, regardless of which of the directories they reside in. If multiple files specify the same option, the entry in the file with the lexicographically latest name will take precedence. Files are read from directories in the following list from top to bottom. Once a file of a given filename is loaded, any file of the same name in subsequent directories is ignored.

      /etc/sysctl.d/*.conf
      /run/sysctl.d/*.conf
      /usr/local/lib/sysctl.d/*.conf
      /usr/lib/sysctl.d/*.conf
      /lib/sysctl.d/*.conf
      /etc/sysctl.conf
    remediation: &rem-14fc563fb6 |
      Configure RHEL 8 to implement virtual address space randomization.

      $ echo 'kernel.randomize_va_space = 2' | sudo tee /etc/sysctl.d/99-kernel_randomize_va_space.conf

      Remove any configurations that conflict with the above from the following locations:

      /run/sysctl.d/*.conf
      /usr/local/lib/sysctl.d/*.conf
      /usr/lib/sysctl.d/*.conf
      /lib/sysctl.d/*.conf
      /etc/sysctl.conf
      /etc/sysctl.d/*.conf

      Issue the following command to make the changes take effect:

      $ sudo sysctl --system
  - id: "STIG-RHEL-08-010430-check_randomize"
    name: "RHEL 8 must implement address space layout randomization (ASLR) to protect its memory from unauthorized code execution. (file)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010430, V-230280, SV-230280r1208745_rule, CAT II. CCI-002824. NIST SP 800-53 Rev. 4: SI-16."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -iR kernel.randomize_va_space /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf /etc/sysctl.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^.*:kernel.randomize_va_space\\s*=\\s*2" }
      - { none: "~ ^.*:kernel.randomize_va_space\\s*=\\s*(1|[3-9])" }
    rationale: *rat-72c1810e35
    remediation: *rem-14fc563fb6
  - id: "STIG-RHEL-08-010450-selinux_config_targeted"
