    remediation: *rem-23b0f5e08f
  - id: "STIG-RHEL-08-040161-sshd_config_rekeylimit"
    name: "RHEL 8 must force a frequent session key renegotiation for SSH connections to the server."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040161, V-230527, SV-230527r1017288_rule, CAT II. CCI-000068. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i rekey /etc/ssh/sshd_config /etc/sshd/conf.d
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:RekeyLimit 1G 1h" }
    rationale: &rat-db211420f8 |
      Without protection of the transmitted information, confidentiality and integrity may be compromised because unprotected communications can be intercepted and either read or altered.

      This requirement applies to both internal and external networks and all types of information system components from which information can be transmitted (e.g., servers, mobile devices, notebook computers, printers, copiers, scanners, and facsimile machines). Communication paths outside the physical protection of a controlled boundary are exposed to the possibility of interception and modification.

      Protecting the confidentiality and integrity of organizational information can be accomplished by physical means (e.g., employing physical distribution systems) or by logical means (e.g., employing cryptographic techniques). If physical means of protection are employed, then logical means (cryptography) do not have to be employed, and vice versa.

      Session key regeneration limits the chances of a session key becoming compromised.
    remediation: &rem-8b82df9e46 |
      Configure the system to force a frequent session key renegotiation for SSH connections to the server by add or modifying the following line in the "/etc/ssh/sshd_config" file:

      RekeyLimit 1G 1h

      Restart the SSH daemon for the settings to take effect.

      $ sudo systemctl restart sshd.service
  - id: "STIG-RHEL-08-040180-debug-shell-enabled"
    name: "The debug-shell systemd service must be disabled on RHEL 8. (Service debug-shell is not enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040180, V-230532, SV-230532r1017294_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState debug-shell | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-ee96b7199c |
      The debug-shell requires no authentication and provides root privileges to anyone who has physical access to the machine.  While this feature is disabled by default, masking it adds an additional layer of assurance that it will not be enabled via a dependency in systemd.  This also prevents attackers with physical access from trivially bypassing security on the machine through valid troubleshooting configurations and gaining root access when the system is rebooted.
    remediation: &rem-38a86f9f96 |
      Configure the system to mask the debug-shell systemd service with the following command:

      $ sudo systemctl mask debug-shell.service

      Created symlink /etc/systemd/system/debug-shell.service -> /dev/null

      Reload the daemon to take effect.

      $ sudo systemctl daemon-reload
  - id: "STIG-RHEL-08-040180-debug-shell-running"
    name: "The debug-shell systemd service must be disabled on RHEL 8. (Service debug-shell is not running)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040180, V-230532, SV-230532r1017294_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
