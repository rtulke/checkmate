      cat '/etc/sudoers'
    allow_rc: any
    expect: { some: "~ ^#includedir /etc/sudoers.d" }
    rationale: *rat-681aeddbef
    remediation: *rem-fe283e9f09
  - id: "STIG-RHEL-08-010380-sudo_nopwd_chk"
    name: "RHEL 8 must require users to provide a password for privilege escalation."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010380, V-230271, SV-230271r1101896_rule, CAT II. CCI-002038. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i nopasswd /etc/sudoers /etc/sudoers.d/* | grep -v '.*\:#'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-9214489f7c |
      Without reauthentication, users may access resources or perform tasks for which they do not have authorization.

      When operating systems provide the capability to escalate a functional capability, it is critical the user reauthenticate.
    remediation: &rem-670d6fc50a |
      Remove any occurrence of "NOPASSWD" found in "/etc/sudoers" file or files in the "/etc/sudoers.d" directory.
  - id: "STIG-RHEL-08-010381-sudo_not_auth"
    name: "RHEL 8 must require users to reauthenticate for privilege escalation."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010381, V-230272, SV-230272r1101898_rule, CAT II. CCI-002038. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i !authenticate /etc/sudoers /etc/sudoers.d/* | grep -v '.*\:#'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: *rat-9214489f7c
    remediation: &rem-c8fe0126fb |
      Remove any occurrence of "!authenticate" found in "/etc/sudoers" file or files in the "/etc/sudoers.d" directory.
  - id: "STIG-RHEL-08-010382-sudo_all_chk"
    name: "RHEL 8 must restrict privilege elevation to authorized personnel."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010382, V-237641, SV-237641r1101904_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -iw 'ALL' /etc/sudoers /etc/sudoers.d/* | grep -v '.*\:#'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ALL ALL=(ALL) ALL" }
      - { none: "~ ALL ALL=(ALL\\:ALL) ALL" }
    rationale: &rat-899f987ec4 |
      The sudo command allows a user to execute programs with elevated (administrator) privileges. It prompts the user for their password and confirms your request to execute a command by checking a file, called sudoers. If the "sudoers" file is not configured correctly, any user defined on the system can initiate privileged actions on the target system.
    remediation: &rem-4b7eb366ef |
      Remove the following entries from the sudoers file:
      ALL     ALL=(ALL) ALL
      ALL     ALL=(ALL:ALL) ALL
  - id: "STIG-RHEL-08-010383-sudo_defaults_set"
    name: "RHEL 8 must use the invoking user's password for privilege escalation when using sudo."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010383, V-237642, SV-237642r991589_rule, CAT II. CCI-002227. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      egrep -i '(!rootpw|!targetpw|!runaspw)' /etc/sudoers /etc/sudoers.d/* | grep -v '.*\:#'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^\\/etc\\/sudoers:Defaults !targetpw" }
      - { some: "~ ^\\/etc\\/sudoers:Defaults !rootpw" }
      - { some: "~ ^\\/etc\\/sudoers:Defaults !runaspw" }
      - { none: "~ ^\\/etc\\/sudoers.d/.*:Defaults !targetpw" }
      - { none: "~ ^\\/etc\\/sudoers.d/.*:Defaults !rootpw" }
      - { none: "~ ^\\/etc\\/sudoers.d/.*:Defaults !runaspw" }
    rationale: &rat-5b35797596 |
      The sudoers security policy requires that users authenticate themselves before they can use sudo. When sudoers requires authentication, it validates the invoking user's credentials. If the rootpw, targetpw, or runaspw flags are defined and not disabled, by default the operating system will prompt the invoking user for the "root" user password.
      For more information on each of the listed configurations, reference the sudoers(5) manual page.
    remediation: &rem-9c862cf3a5 |
      Define the following in the Defaults section of the /etc/sudoers file or a configuration file in the /etc/sudoers.d/ directory:
           Defaults !targetpw
           Defaults !rootpw
           Defaults !runaspw

      Remove any configurations that conflict with the above from the following locations:
           /etc/sudoers
           /etc/sudoers.d/
  - id: "STIG-RHEL-08-010384-sudo_defaults_timeout"
    name: "RHEL 8 must require re-authentication when using the sudo command."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010384, V-237643, SV-237643r1262533_rule, CAT II. CCI-002038. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^\\/etc\\/sudoer.*:Defaults.*timestamp_timeout=([0-9]|10)" }
      - { none: "~ ^\\/etc\\/sudoer.*:Defaults.*timestamp_timeout.*-\\d" }
    rationale: &rat-004ba451a3 |
      Without re-authentication, users may access resources or perform tasks for which they do not have authorization.

      When operating systems provide the capability to escalate a functional capability, it is critical the organization requires the user to re-authenticate when using the "sudo" command.

      If the value is set to an integer less than 0, the user's time stamp will not expire and the user will not have to re-authenticate for privileged actions until the user's session is terminated.
    remediation: &rem-1fca264474 |
      Configure the OS to reauthenticate every invocation of the "sudo" command.

      Add the following line to "/etc/sudoers" or a file in "/etc/sudoers.d":

      Defaults timestamp_timeout=0

      Remove any duplicate definitions.
  - id: "STIG-RHEL-08-010385-etc_pam.d_sudo-attrs"
    name: "The RHEL 8 operating system must not be configured to bypass password requirements for privilege escalation. (/etc/pam.d/sudo: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010385, V-251712, SV-251712r1050789_rule, CAT II. CCI-002038. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
