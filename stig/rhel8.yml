    allow_rc: any
    expect: { some: "~ blacklist uvcvideo" }
    rationale: *rat-b8d074bf92
    remediation: *rem-0715103687
  - id: "STIG-RHEL-08-040020-uvcvideo_modprobe"
    name: "RHEL 8 must cover or disable the built-in or attached camera when not in use. (modprobe.conf)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040020, V-230493, SV-230493r1262162_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
