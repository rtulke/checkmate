  - id: "STIG-RHEL-08-040137-etc_fapolicyd_fapolicyd.conf-attrs"
    name: "The RHEL 8 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs. (/etc/fapolicyd/fapolicyd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040137, V-244546, SV-244546r1208752_rule, CAT II. CCI-001764. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/fapolicyd/fapolicyd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e4a6de40c7 |
      The organization must identify authorized software programs and permit execution of authorized software. The process used to identify software programs that are authorized to execute on organizational information systems is commonly referred to as allow listing.

      Utilizing an allow list provides a configuration management method for allowing the execution of only authorized software. Using only authorized software decreases risk by limiting the number of potential vulnerabilities. Verification of allow listed software occurs prior to execution or at system startup.

      User home directories/folders may contain information of a sensitive nature. Nonprivileged users should coordinate any sharing of information with an SA through shared resources.

      RHEL 8 ships with many optional packages. One such package is a file access policy daemon called "fapolicyd". "fapolicyd" is a userspace daemon that determines access rights to files based on attributes of the process and file. It can be used to either deny list or allow list processes or file access.

      Proceed with caution with enforcing the use of this daemon. Improper configuration may render the system nonfunctional. The "fapolicyd" API is not namespace aware and can cause issues when launching or running containers.
    remediation: &rem-6f4d834c41 |
      Configure RHEL 8 to employ a deny-all, permit-by-exception application allow listing policy with "fapolicyd".

      With the "fapolicyd" installed and enabled, configure the daemon to function in permissive mode until the allow list is built correctly to avoid system lockout. Do this by editing the "/etc/fapolicyd/fapolicyd.conf" file with the following line:

      permissive = 1

      Build the allow list in a file within the "/etc/fapolicyd/rules.d" directory, ensuring the last rule implements a deny-all policy, such as "deny perm=any all : all".

      Once it is determined the allow list is built correctly, set the "fapolicyd" to enforcing mode by editing the "permissive" line in the /etc/fapolicyd/fapolicyd.conf file.

      permissive = 0
  - id: "STIG-RHEL-08-040137-etc_fapolicyd_fapolicyd.conf-content"
    name: "The RHEL 8 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs. (/etc/fapolicyd/fapolicyd.conf has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040137, V-244546, SV-244546r1208752_rule, CAT II. CCI-001764. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/fapolicyd/fapolicyd.conf'
    allow_rc: any
    expect:
      - { some: "~ ^permissive = 0" }
      - { none: "~ ^permissive*=*1" }
    rationale: *rat-e4a6de40c7
    remediation: *rem-6f4d834c41
  - id: "STIG-RHEL-08-040137-fapolicy_deny_rule_84"
