  - id: "STIG-RHEL-08-040150-etc_firewalld_firewalld.conf-attrs"
    name: "A firewall must be able to protect against or limit the effects of Denial of Service (DoS) attacks by ensuring RHEL 8 can implement rate-limiting measures on impacted network interfaces. (/etc/firewalld/firewalld.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040150, V-230525, SV-230525r958902_rule, CAT II. CCI-002385. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/firewalld/firewalld.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-65be6c641f |
      DoS is a condition when a resource is not available for legitimate users. When this occurs, the organization either cannot accomplish its mission or must operate at degraded capacity.

      This requirement addresses the configuration of RHEL 8 to mitigate the impact of DoS attacks that have occurred or are ongoing on system availability. For each system, known and potential DoS attacks must be identified and solutions for each type implemented. A variety of technologies exists to limit or, in some cases, eliminate the effects of DoS attacks (e.g., limiting processes or establishing memory partitions). Employing increased capacity and bandwidth, combined with service redundancy, may reduce the susceptibility to some DoS attacks.

      Since version 0.6.0, "firewalld" has incorporated "nftables" as its backend support. Utilizing the limit statement in "nftables" can help to mitigate DoS attacks.
    remediation: &rem-bf0c6af582 |
      Configure "nftables" to be the default "firewallbackend" for "firewalld" by adding or editing the following line in "/etc/firewalld/firewalld.conf":

      FirewallBackend=nftables

      Establish rate-limiting rules based on organization-defined types of DoS attacks on impacted network interfaces.
  - id: "STIG-RHEL-08-040150-etc_firewalld_firewalld.conf-content"
    name: "A firewall must be able to protect against or limit the effects of Denial of Service (DoS) attacks by ensuring RHEL 8 can implement rate-limiting measures on impacted network interfaces. (/etc/firewalld/firewalld.conf has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040150, V-230525, SV-230525r958902_rule, CAT II. CCI-002385. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/firewalld/firewalld.conf'
    allow_rc: any
    expect:
      - { some: "~ ^FirewallBackend=nftables" }
      - { none: "~ ^FirewallBackend=iptables" }
    rationale: *rat-65be6c641f
    remediation: *rem-bf0c6af582
  - id: "STIG-RHEL-08-040159-openssh-server"
    name: "All RHEL 8 networked systems must have SSH installed."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040159, V-244549, SV-244549r958908_rule, CAT II. CCI-002418. NIST SP 800-53 Rev. 4: SC-8."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet openssh-server
    expect: true
    rationale: &rat-26164c6453 |
      Without protection of the transmitted information, confidentiality and integrity may be compromised because unprotected communications can be intercepted and either read or altered.

      This requirement applies to both internal and external networks and all types of information system components from which information can be transmitted (e.g., servers, mobile devices, notebook computers, printers, copiers, scanners, and facsimile machines). Communication paths outside the physical protection of a controlled boundary are exposed to the possibility of interception and modification.

      Protecting the confidentiality and integrity of organizational information can be accomplished by physical means (e.g., employing physical distribution systems) or by logical means (e.g., employing cryptographic techniques). If physical means of protection are employed, then logical means (cryptography) do not have to be employed, and vice versa.
    remediation: &rem-013b879207 |
      Install SSH packages onto the host with the following command:

      $ sudo yum install openssh-server.x86_64
  - id: "STIG-RHEL-08-040160-sshd-enabled"
    name: "All RHEL 8 networked systems must have and implement SSH to protect the confidentiality and integrity of transmitted and received information, as well as information during preparation for transmission. (Service sshd is enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040160, V-230526, SV-230526r958908_rule, CAT II. CCI-002418. NIST SP 800-53 Rev. 4: SC-8."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState sshd | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-26164c6453
    remediation: &rem-23b0f5e08f |
      Configure the SSH service to automatically start after reboot with the following command:

      $ sudo systemctl enable sshd.service
  - id: "STIG-RHEL-08-040160-sshd-running"
    name: "All RHEL 8 networked systems must have and implement SSH to protect the confidentiality and integrity of transmitted and received information, as well as information during preparation for transmission. (Service sshd is running)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040160, V-230526, SV-230526r958908_rule, CAT II. CCI-002418. NIST SP 800-53 Rev. 4: SC-8."
