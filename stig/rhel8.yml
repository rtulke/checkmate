  - id: "STIG-RHEL-08-040290-postfix_restricted"
    name: "RHEL 8 must be configured to prevent unrestricted mail relaying."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040290, V-230550, SV-230550r1017312_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      postconf -n smtpd_client_restrictions
    allow_rc: any
    expect:
      - { rc: "in [0, 127]" }
      - { some: "~ ^smtpd_client_restrictions = permit_mynetworks, reject$" }
    rationale: &rat-a0224f2a94 |
      If unrestricted mail relaying is permitted, unauthorized senders could use this host as a mail relay for the purpose of sending spam or other unauthorized activity.
    remediation: &rem-7d3c22b2e5 |
      If "postfix" is installed, modify the "/etc/postfix/main.cf" file to restrict client connections to the local network with the following command:

      $ sudo postconf -e 'smtpd_client_restrictions = permit_mynetworks,reject'
  - id: "STIG-RHEL-08-040320-check_xorgs"
    name: "The graphical display manager must not be installed on RHEL 8 unless approved."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040320, V-230553, SV-230553r1017315_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      rpm-qa | grep xorg | grep -c server
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^0$" }
    rationale: &rat-e6b554ea0c |
      Internet services that are not required for system or application processes must not be active to decrease the attack surface of the system. Graphical display managers have a long history of security vulnerabilities and must not be used, unless approved and documented.
    remediation: &rem-6d71dcc275 |
      Document the requirement for a graphical user interface with the ISSO or reinstall the operating system without the graphical user interface. If reinstallation is not feasible, then continue with the following procedure:

      Open an SSH session and enter the following commands:

      $ sudo yum remove xorg-x11-server-Xorg xorg-x11-server-common xorg-x11-server-utils xorg-x11-server-Xwayland

      A reboot is required for the changes to take effect.
  - id: "STIG-RHEL-08-040321-check_multiuser"
    name: "The graphical display manager must not be the default target on RHEL 8 unless approved."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040321, V-251718, SV-251718r1017371_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
