  - id: "STIG-RHEL-08-030741-chrony_disable_server"
    name: "RHEL 8 must disable the chrony daemon from acting as a server."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030741, V-230485, SV-230485r1262218_rule, CAT III. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel8, stig-cat-3]
    severity: low
    run: |
      grep port /etc/chrony.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^port 0" }
      - { none: "~ /\\^port \\[1-9\\]\\{1,9\\}" }
    rationale: &rat-587a60c217 |
      Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events. Sources outside the configured acceptable allowance (drift) may be inaccurate.

      Minimizing the exposure of the server functionality of the chrony daemon diminishes the attack surface.

      RHEL 8 utilizes the "timedatectl" command to view the status of the "systemd-timesyncd.service". The "timedatectl" status will display the local time, Coordinated Universal Time (UTC), and the offset from UTC.

      Note that USNO offers authenticated NTP service to DoW and U.S. Government agencies operating on the NIPR and SIPR networks. Visit https://www.usno.navy.mil/USNO/time/ntp/DoW-customers for more information.
    remediation: &rem-878353d856 |
      Configure the operating system to disable the chrony daemon from acting as a server by adding or modifying the following line in the "/etc/chrony.conf" file:

      port 0
  - id: "STIG-RHEL-08-030742-chrony_disable_network_daemon"
