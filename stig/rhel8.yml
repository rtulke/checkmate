  - id: "STIG-RHEL-08-010300-root_sys_cmds_perms"
    name: "RHEL 8 system commands must have mode 755 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010300, V-230257, SV-230257r1017077_rule, CAT II. CCI-001499. NIST SP 800-53 Rev. 4: CM-5."
