  - id: "STIG-RHEL-08-020024-hard_maxlogins"
    name: "RHEL 8 must limit the number of concurrent sessions to ten for all accounts and/or account types."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020024, V-230346, SV-230346r1069306_rule, CAT III. CCI-000054. NIST SP 800-53 Rev. 4: AC-10."
    tags: [stig, stig-rhel8, stig-cat-3]
    severity: low
    run: |
      grep -r -s '^[^#].*maxlogins' /etc/security/limits.conf /etc/security/limits.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^/etc/security/limits.conf:\\*\\s+hard\\s+maxlogins\\s+([1-9]|10)" }
      - { none: "~ ^.*\\s+hard\\s+maxlogins\\s+(1[1-9]|[2-9]{2,9})$" }
    rationale: &rat-f2b8d3b936 |
      Operating system management includes the ability to control the number of users and user sessions that utilize an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the risks related to DoS attacks.

      This requirement addresses concurrent sessions for information system accounts and does not address concurrent sessions by single users via multiple system accounts. The maximum number of concurrent sessions should be defined based on mission needs and the operational environment for each system.
    remediation: &rem-673b9142f5 |
      Configure the operating system to limit the number of concurrent sessions to "10" for all accounts and/or account types.

      Add the following line to the top of the /etc/security/limits.conf or in a ".conf" file defined in /etc/security/limits.d/:

      * hard maxlogins 10
  - id: "STIG-RHEL-08-030063-auditd_conf_log_format"
    name: "RHEL 8 must resolve audit information before writing to disk."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030063, V-230395, SV-230395r1017201_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-3]
    severity: low
    run: |
      grep -i log_format /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^log_format = ENRICHED" }
      - { none: "~ ^log_format.*RAW" }
    rationale: &rat-34aa6cb2b2 |
      Without establishing what type of events occurred, the source of events, where events occurred, and the outcome of events, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack.

      Audit record content that may be necessary to satisfy this requirement includes, for example, time stamps, source and destination addresses, user/process identifiers, event descriptions, success/fail indications, filenames involved, and access control or flow control rules invoked.

      Enriched logging aids in making sense of who, what, and when events occur on a system.  Without this, determining root cause of an event will be much more difficult.
    remediation: &rem-b49efab47c |
      Edit the /etc/audit/auditd.conf file and add or update the "log_format" option:

      log_format = ENRICHED

      The audit daemon must be restarted for changes to take effect.
  - id: "STIG-RHEL-08-030601-default_grub_audit"
    name: "RHEL 8 must enable auditing of processes that start prior to the audit daemon. (config)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030601, V-230468, SV-230468r1262215_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: AU-12."
    tags: [stig, stig-rhel8, stig-cat-3]
    severity: low
    run: |
      grep -i audit= /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX=.*audit=1.*" }
      - { none: "~ ^GRUB_CMDLINE_LINUX=.*audit=0.*" }
    rationale: &rat-0c51a10851 |
      Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.

      If auditing is enabled late in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state information only available if auditing is enabled before a given process is created.

      Audit records can be generated from various components within the information system (e.g., module or policy filter).

      The list of audited events is the set of events for which audits are to be generated. This set of events is typically a subset of the list of all events for which the system is capable of generating audit records.

      DoW has defined the list of events for which RHEL 8 will provide an audit record generation capability as the following:

      1) Successful and unsuccessful attempts to access, modify, or delete privileges, security objects, security levels, or categories of information (e.g., classification levels);

      2) Access actions, such as successful and unsuccessful logon attempts, privileged activities or other system-level access, starting and ending time for user access to the system, concurrent logons from different workstations, successful and unsuccessful accesses to objects, all program initiations, and all direct access to the information system;

      3) All account creations, modifications, disabling, and terminations; and

      4) All kernel module load, unload, and restart actions.
    remediation: &rem-7d475bd400 |
      Configure RHEL 8 to audit processes that start prior to the audit daemon with the following command:

      $ sudo grubby --update-kernel=ALL --args="audit=1"

      Add or modify the following line in "/etc/default/grub" to ensure the configuration survives kernel updates:

      GRUB_CMDLINE_LINUX="audit=1"
  - id: "STIG-RHEL-08-030601-grub_audit_check"
    name: "RHEL 8 must enable auditing of processes that start prior to the audit daemon. (running grub)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030601, V-230468, SV-230468r1262215_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: AU-12."
    tags: [stig, stig-rhel8, stig-cat-3]
