    remediation: *rem-4b7634b40f
  - id: "STIG-RHEL-08-040110-wifi_turn_off"
    name: "RHEL 8 wireless network adapters must be disabled."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040110, V-230506, SV-230506r1262223_rule, CAT II. CCI-001444. NIST SP 800-53 Rev. 4: AC-18."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      nmcli radio wifi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^disabled" }
      - { none: "~ enabled" }
    rationale: &rat-f9515a77b9 |
      Without protection of communications with wireless peripherals, confidentiality and integrity may be compromised because unprotected communications can be intercepted and either read, altered, or used to compromise the RHEL 8 operating system.

      This requirement applies to wireless peripheral technologies (e.g., wireless mice, keyboards, displays, etc.) used with RHEL 8 systems. Wireless peripherals (e.g., Wi-Fi/Bluetooth/IR Keyboards, Mice, and Pointing Devices and Near Field Communications [NFC]) present a unique challenge by creating an open, unsecured port on a computer. Wireless peripherals must meet DoW requirements for wireless data transmission and be approved for use by the authorizing official (AO). Even though some wireless peripherals, such as mice and pointing devices, do not ordinarily carry information that need to be protected, modification of communications with these wireless peripherals may be used to compromise the RHEL 8 operating system. Communication paths outside the physical protection of a controlled boundary are exposed to the possibility of interception and modification.

      Protecting the confidentiality and integrity of communications with wireless peripherals can be accomplished by physical means (e.g., employing physical barriers to wireless radio frequencies) or by logical means (e.g., employing cryptographic techniques). If physical means of protection are employed, then logical means (cryptography) do not have to be employed, and vice versa. If the wireless peripheral is only passing telemetry data, encryption of the data may not be required.
    remediation: &rem-ab979a4540 |
      Configure the system to disable all wireless network interfaces with the following command:

      $ sudo nmcli radio all off
  - id: "STIG-RHEL-08-040111-disable_bluetooth"
    name: "RHEL 8 Bluetooth must be disabled."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040111, V-230507, SV-230507r1262224_rule, CAT II. CCI-001443. NIST SP 800-53 Rev. 4: AC-18."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -ri bluetooth /etc/modprobe.d/* | grep -v '#'
    allow_rc: any
    expect:
