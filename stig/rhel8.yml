      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-029cf0cc72 |
      Without cryptographic integrity protections, information can be altered by unauthorized users without detection.

      Remote access (e.g., RDP) is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      Cryptographic mechanisms used for protecting the integrity of information include, for example, signed hash functions using asymmetric cryptography, enabling distribution of the public key to verify the hash information while maintaining the confidentiality of the secret key used to generate the hash.

      RHEL 8 incorporates systemwide crypto policies by default. The SSH configuration file has no effect on the ciphers, MACs, or algorithms unless specifically defined in the /etc/sysconfig/sshd file. The employed algorithms can be viewed in the /etc/crypto-policies/back-ends/openssh.config file.
    remediation: &rem-28e88e7a41 |
      Configure the RHEL 8 SSH client to use only MACs employing FIPS 140-3-approved algorithms.

      Reinstall crypto-policies with the following command:

      $ sudo dnf -y reinstall crypto-policies

      Set the crypto-policy to FIPS with the following command:

      $ sudo update-crypto-policies --set FIPS
      Setting system policy to FIPS

      Note: Systemwide crypto policies are applied on application startup. It is recommended to restart the system for the change of policies to fully take place.
  - id: "STIG-RHEL-08-010296-crypto_policies_openssh_macs-content"
    name: "The RHEL 8 SSH client must be configured to use only DoW-approved Message Authentication Codes (MACs) employing FIPS 140-3-validated cryptographic hash algorithms to protect the confidentiality of SSH client connections. (/etc/crypto-policies/back-ends/openssh.config has the expected conten…)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010296, V-272482, SV-272482r1262197_rule, CAT I. CCI-001453. NIST SP 800-53 Rev. 4: AC-17."
