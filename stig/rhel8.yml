  - id: "STIG-RHEL-08-030720-netstream_driver_auth"
    name: "RHEL 8 must authenticate the remote logging server for off-loading audit logs."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030720, V-230482, SV-230482r1069330_rule, CAT II. CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
