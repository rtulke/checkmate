  - id: "STIG-RHEL-08-030740-chrony_server"
    name: "RHEL 8 must securely compare internal information system clocks at least every 24 hours with a server synchronized to an authoritative time source, such as the United States Naval Observatory (USNO) time servers, or a time server designated for the appropriate DoW network (NIPRNet/SIPRNet), and/or the Global Positioning System (GPS)."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030740, V-230484, SV-230484r1262217_rule, CAT II. CCI-000189. NIST SP 800-53 Rev. 4: AU-8."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep server /etc/chrony.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^server 0.us.pool.ntp.mil iburst maxpoll ([0-9]|1[0-6])" }
    rationale: &rat-40e8244ad0 |
      Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events. Sources outside the configured acceptable allowance (drift) may be inaccurate.

      Synchronizing internal information system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected over a network.

      Organizations should consider endpoints that may not have regular access to the authoritative time server (e.g., mobile, teleworking, and tactical endpoints).

      If time stamps are not consistently applied and there is no common time reference, it is difficult to perform forensic analysis.

      Time stamps generated by the operating system include date and time. Time is commonly expressed in Coordinated Universal Time (UTC), a modern continuation of Greenwich Mean Time (GMT), or local time with an offset from UTC.

      RHEL 8 utilizes the "timedatectl" command to view the status of the "systemd-timesyncd.service". The "timedatectl" status will display the local time, UTC, and the offset from UTC.

      Note that USNO offers authenticated NTP service to DoW and U.S. Government agencies operating on the NIPR and SIPR networks. Visit https://www.usno.navy.mil/USNO/time/ntp/DoW-customers for more information.
    remediation: &rem-c7edb75ab3 |
      Configure the operating system to securely compare internal information system clocks at least every 24 hours with an NTP server by adding/modifying the following line in the /etc/chrony.conf file.

      server [ntp.server.name] iburst maxpoll 16
  - id: "STIG-RHEL-08-040001-bug_tools_absent"
    name: "RHEL 8 must not have any automated bug reporting tools installed."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040001, V-230488, SV-230488r1017272_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      yum list installed abrt*
    expect: { rc: "== 1" }
    rationale: &rat-bbf84906a2 |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      Operating systems are capable of providing a wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary to support essential organizational operations (e.g., key missions, functions).

      Examples of non-essential capabilities include, but are not limited to, games, software packages, tools, and demonstration software not related to requirements or providing a wide array of functionality not required for every mission, but which cannot be disabled.

      Verify the operating system is configured to disable non-essential capabilities. The most secure way of ensuring a non-essential capability is disabled is to not have the capability installed.
    remediation: &rem-20502c88cd |
      Configure the operating system to disable non-essential capabilities by removing automated bug reporting packages from the system with the following command:

      $ sudo yum remove abrt*
  - id: "STIG-RHEL-08-040002-sendmail"
    name: "RHEL 8 must not have the sendmail package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040002, V-230489, SV-230489r1017273_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet sendmail
    expect: false
    rationale: *rat-bbf84906a2
    remediation: &rem-dc4738e478 |
      Configure the operating system to disable non-essential capabilities by removing the sendmail package from the system with the following command:

      $ sudo yum remove sendmail
  - id: "STIG-RHEL-08-040010-no_epel_repo"
    name: "RHEL 8 must not install packages from the Extra Packages for Enterprise Linux (EPEL) repository."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040010, V-230492, SV-230492r1184277_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      sh -c '! dnf repolist 2>/dev/null | grep -qi epel'
    expect: { rc: "== 0" }
    rationale: &rat-3e0b2ca8f7 |
      The EPEL is a repository of high-quality open-source packages for enterprise-class Linux distributions such as RHEL, CentOS, AlmaLinux, Rocky Linux, and Oracle Linux. These packages are not part of the official distribution but are built using the same Fedora build system to ensure compatibility and maintain quality standards.
    remediation: &rem-8dbf6c365c |
      The repo package can be manually removed with the following command:

      $ sudo dnf remove epel-release

      Configure the operating system to disable use of the EPEL repository with the following command:

      $ sudo dnf config-manager --set-disabled epel
  - id: "STIG-RHEL-08-040020-etc_modprobe.d_blacklist.conf-attrs"
    name: "RHEL 8 must cover or disable the built-in or attached camera when not in use. (/etc/modprobe.d/blacklist.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040020, V-230493, SV-230493r1262162_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/modprobe.d/blacklist.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-b8d074bf92 |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      Failing to disconnect from collaborative computing devices (i.e., cameras) can result in subsequent compromises of organizational information. Providing easy methods to physically disconnect from such devices after a collaborative computing session helps to ensure participants actually carry out the disconnect activity without having to go through complex and tedious procedures.
    remediation: &rem-0715103687 |
      Configure the operating system to disable the built-in or attached camera when not in use.

      Add or update the following lines in the "/etc/modprobe.d/blacklist.conf" file:

           install uvcvideo /bin/false
           blacklist uvcvideo

      Reboot the system for the settings to take effect.
  - id: "STIG-RHEL-08-040020-etc_modprobe.d_blacklist.conf-content"
    name: "RHEL 8 must cover or disable the built-in or attached camera when not in use. (/etc/modprobe.d/blacklist.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040020, V-230493, SV-230493r1262162_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
