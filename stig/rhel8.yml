    rationale: *rat-c762483818
    remediation: *rem-86193c7c4c
  - id: "STIG-RHEL-08-020360-tmout_profile"
    name: "RHEL 8 must automatically exit interactive command shell user sessions after 10 minutes of inactivity. (TMOUT setting)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020360, V-279929, SV-279929r1156340_rule, CAT II. CCI-001133. NIST SP 800-53 Rev. 4: SC-10."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -r TMOUT /etc/profile.d/ 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ TMOUT=600" }
    rationale: &rat-ba669b8e1a |
      Terminating an idle interactive command shell user session within a short time period reduces the window of opportunity for unauthorized personnel to take control of it when left unattended in a virtual terminal or physical console.
    remediation: &rem-6379fa78ea |
      Configure RHEL 8 to exit interactive command shell user sessions after 10 minutes of inactivity.

      Add or edit the following line in "/etc/profile.d/tmout.sh":

      #!/bin/bash

      declare -xr TMOUT=600
  - id: "STIG-RHEL-08-030000-audit_rules_execpriv"
    name: "The RHEL 8 audit system must be configured to audit the execution of privileged functions and prevent all software from executing at higher privilege levels than users executing the software. (config check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030000, V-230386, SV-230386r958730_rule, CAT II. CCI-002233. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep execpriv /etc/audit/audit.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv" }
      - { some: "~ -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv" }
      - { some: "~ -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k execpriv" }
      - { some: "~ -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv" }
    rationale: &rat-ec762cf3b5 |
      Misuse of privileged functions, either intentionally or unintentionally by authorized users, or by unauthorized external entities that have compromised information system accounts, is a serious and ongoing concern and can have significant adverse impacts on organizations. Auditing the use of privileged functions is one way to detect such misuse and identify the risk from insider threats and the advanced persistent threat.
    remediation: &rem-e2b90c0646 |
      Configure RHEL 8 to audit the execution of the "execve" system call.

      Add or update the following file system rules to "/etc/audit/rules.d/audit.rules":

      -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv
      -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv

      -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k execpriv
      -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv

      The audit daemon must be restarted for the changes to take effect.
  - id: "STIG-RHEL-08-030000-auditd_execpriv_live"
    name: "The RHEL 8 audit system must be configured to audit the execution of privileged functions and prevent all software from executing at higher privilege levels than users executing the software. (live_check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030000, V-230386, SV-230386r958730_rule, CAT II. CCI-002233. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      auditctl -l | grep execpriv
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -F key=execpriv" }
      - { some: "~ -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -F key=execpriv" }
      - { some: "~ -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -F key=execpriv" }
      - { some: "~ -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -F key=execpriv" }
    rationale: *rat-ec762cf3b5
    remediation: *rem-e2b90c0646
  - id: "STIG-RHEL-08-030010-cron_logging"
    name: "Cron logging must be implemented in RHEL 8."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030010, V-230387, SV-230387r1017195_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -s cron /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ \\/etc\\/rsyslog.conf\\:\\*.info;mail.none;authpriv.none;cron.none\\s+\\/var\\/log\\/messages" }
      - { some: "~ \\/etc\\/rsyslog.conf\\:cron.*\\s+\\/var\\/log\\/cron" }
    rationale: &rat-20a9cd9810 |
      Cron logging can be used to trace the successful or unsuccessful execution of cron jobs. It can also be used to spot intrusions into the use of the cron facility by unauthorized and malicious users.
    remediation: &rem-0fed695521 |
      Configure "rsyslog" to log all cron messages by adding or updating the following line to "/etc/rsyslog.conf" or a configuration file in the /etc/rsyslog.d/ directory:

      cron.* /var/log/cron

      The rsyslog daemon must be restarted for the changes to take effect:
      $ sudo systemctl restart rsyslog.service
  - id: "STIG-RHEL-08-030020-auditd_conf_action_mail_acct"
    name: "The RHEL 8 System Administrator (SA) and Information System Security Officer (ISSO) (at a minimum) must be alerted of an audit processing failure event."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030020, V-230388, SV-230388r1017196_rule, CAT II. CCI-000139. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i action_mail_acct /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^action_mail_acct.*=.*root" }
    rationale: &rat-9132161237 |
      It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs as required. Without this notification, the security personnel may be unaware of an impending failure of the audit capability, and system operation may be adversely affected.

      Audit processing failures include software/hardware errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded.

      This requirement applies to each audit data storage repository (i.e., distinct information system component where audit records are stored), the centralized audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both.
    remediation: &rem-ef79485ab9 |
      Configure "auditd" service to notify the SA and ISSO in the event of an audit processing failure.

      Edit the following line in "/etc/audit/auditd.conf" to ensure that administrators are notified via email for those situations:

      action_mail_acct = root
  - id: "STIG-RHEL-08-030030-etc_aliases-attrs"
    name: "The RHEL 8 Information System Security Officer (ISSO) and System Administrator (SA) (at a minimum) must have mail aliases to be notified of an audit processing failure. (/etc/aliases: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030030, V-230389, SV-230389r1017197_rule, CAT II. CCI-000139. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/aliases'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: *rat-9132161237
    remediation: &rem-a350c24809 |
      Configure RHEL 8 to notify administrators in the event of an audit processing failure.

      Add/update the following line in "/etc/aliases":

      postmaster: root
  - id: "STIG-RHEL-08-030030-etc_aliases-content"
    name: "The RHEL 8 Information System Security Officer (ISSO) and System Administrator (SA) (at a minimum) must have mail aliases to be notified of an audit processing failure. (/etc/aliases has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030030, V-230389, SV-230389r1017197_rule, CAT II. CCI-000139. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
