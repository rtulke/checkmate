  - id: "STIG-RHEL-08-010090-etc_sssd_pki_sssd_auth_ca_db.pem-attrs"
    name: "RHEL 8, for PKI-based authentication, must validate certificates by constructing a certification path (which includes status information) to an accepted trust anchor. (pem file exists in correct place)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010090, V-230229, SV-230229r1262186_rule, CAT II. CCI-000048. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/sssd/pki/sssd_auth_ca_db.pem'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e658c5b36f |
      Without path validation, an informed trust decision by the relying party cannot be made when presented with any certificate not already explicitly trusted.

      A trust anchor is an authoritative entity represented via a public key and associated data. It is used in the context of public key infrastructures, X.509 digital certificates, and DNSSEC.

      When there is a chain of trust, usually the top entity to be trusted becomes the trust anchor; it can be, for example, a Certification Authority (CA). A certification path starts with the subject certificate and proceeds through a number of intermediate certificates up to a trusted root certificate, typically issued by a trusted CA.

      This requirement verifies that a certification path to an accepted trust anchor is used for certificate validation and that the path includes status information. Path validation is necessary for a relying party to make an informed trust decision when presented with any certificate not already explicitly trusted. Status information for certification paths includes certificate revocation lists or online certificate status protocol responses. Validation of the certificate status information is out of scope for this requirement.
    remediation: &rem-12f3829443 |
      Configure RHEL 8, for PKI-based authentication, to validate certificates by constructing a certification path (which includes status information) to an accepted trust anchor.

      Obtain a valid copy of the DoW root CA file from the PKI CA certificate bundle at cyber.mil and copy into the following file:

      /etc/sssd/pki/sssd_auth_ca_db.pem
  - id: "STIG-RHEL-08-010090-pem_file_cert_chk"
    name: "RHEL 8, for PKI-based authentication, must validate certificates by constructing a certification path (which includes status information) to an accepted trust anchor. (pem cert check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010090, V-230229, SV-230229r1262186_rule, CAT II. CCI-000048. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      openssl x509 -text -in /etc/sssd/pki/sssd_auth_ca_db.pem
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ Issuer: C = US, O = U\\.S\\. Government, OU = DoD, OU = PKI, CN = DoD Root CA 3" }
      - { some: "~ Not After : Dec 30 18:46:41 2029 GMT" }
      - { some: "~ Signature Algorithm: sha256WithRSAEncryption" }
      - { some: "~ fOs/QbP1b0s6Xq5vk3aY0vGZnUXEjnI=" }
    rationale: *rat-e658c5b36f
    remediation: *rem-12f3829443
  - id: "STIG-RHEL-08-010100-prv_ssh_keys_have_passwd"
    name: "RHEL 8, for certificate-based authentication, must enforce authorized access to the corresponding private key. (user keys)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010100, V-230230, SV-230230r1069287_rule, CAT II. CCI-000186. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      for key in /home/*/.ssh/*_rsa; do if [ -f ${key} ]; then ssh-keygen -y -P '' -f $key; else exit 0; fi; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^ssh-rsa" }
    rationale: &rat-3f47e2a0ef |
      If an unauthorized user obtains access to a private key without a passcode, that user would have unauthorized access to any system where the associated public key has been installed.
    remediation: &rem-59cffedf39 |
      Create a new private and public key pair that utilizes a passcode with the following command:

      $ sudo ssh-keygen -p -f /path/to/file
  - id: "STIG-RHEL-08-010110-login_defs_sha512"
    name: "RHEL 8 must encrypt all stored passwords with a FIPS 140-2 approved cryptographic hashing algorithm."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010110, V-230231, SV-230231r1262187_rule, CAT II. CCI-000196. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i sha512 /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^ENCRYPT_METHOD(DES|MD5|SHA256)" }
      - { some: "~ ^ENCRYPT_METHOD SHA512" }
    rationale: &rat-e5282b9c09 |
      Passwords need to be protected at all times, and encryption is the standard method for protecting passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised.

      Unapproved mechanisms that are used for authentication to the cryptographic module are not verified and therefore cannot be relied upon to provide confidentiality or integrity, and DoW data may be compromised.

      FIPS 140-2 is the current standard for validating that mechanisms used to access cryptographic modules utilize authentication that meets DoW requirements.
    remediation: &rem-0b10eb7a29 |
      Configure RHEL 8 to encrypt all stored passwords.

      Edit/Modify the following line in the "/etc/login.defs" file and set "[ENCRYPT_METHOD]" to SHA512.

      ENCRYPT_METHOD SHA512
  - id: "STIG-RHEL-08-010120-pwds_are_sha512"
    name: "RHEL 8 must employ FIPS 140-3-approved cryptographic hashing algorithms for all stored passwords."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010120, V-230232, SV-230232r1208739_rule, CAT II. CCI-000196. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      for user in `cat /etc/passwd | awk -v MIN_UID=1000 -v MAX_UID=65000 -F':'  '$3 >= MIN_UID && $3 < MAX_UID { print $0}' | cut -d':' -f1`; do grep $user /etc/shadow | grep -cv '\$6\$.*'; done
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ ^0" }
      - { none: "~ ^[1-9]" }
    rationale: &rat-80db04cfee |
      The system must use a strong hashing algorithm to store the password.

      Passwords need to be protected at all times, and encryption is the standard method for protecting passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised.
    remediation: &rem-99deea72b4 |
      Lock all interactive user accounts not using SHA-512 hashing until the passwords can be regenerated with SHA-512.
  - id: "STIG-RHEL-08-010130-logins_def_sha_crypt"
    name: "The RHEL 8 shadow password suite must be configured to use a sufficient number of hashing rounds."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010130, V-230233, SV-230233r1044790_rule, CAT II. CCI-000196. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i sha_crypt /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^SHA_CRYPT_M(A|I)(N|X)_ROUNDS ([1-9][0-9]{4,})" }
      - { none: "~ ^SHA_CRYPT_M(A|I)(N|X)_ROUNDS ([1-9][0-9]{0,4}$)" }
    rationale: &rat-db5594e3c8 |
      The system must use a strong hashing algorithm to store the password. The system must use a sufficient number of hashing rounds to ensure the required level of entropy.

      Passwords need to be protected at all times, and encryption is the standard method for protecting passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised.
    remediation: &rem-333f86f77c |
      Configure RHEL 8 to encrypt all stored passwords with a strong cryptographic hash.

      Edit/modify the following line in the "/etc/login.defs" file and set "SHA_CRYPT_MIN_ROUNDS" to a value no lower than "100000":

      SHA_CRYPT_MIN_ROUNDS 100000
  - id: "STIG-RHEL-08-010149-etc_grub.d_01_users-attrs"
    name: "RHEL 8 operating systems booted with a BIOS must require a unique superusers name upon booting into single-user and maintenance modes. (/etc/grub.d/01_users: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010149, V-244522, SV-244522r1137691_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/grub.d/01_users'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-73ef6a8377 |
      If the system does not require valid authentication before it boots into single-user or maintenance mode, anyone who invokes single-user or maintenance mode is granted privileged access to all files on the system. GRUB 2 is the default boot loader for RHEL 8 and is designed to require a password to boot into single-user mode or make modifications to the boot menu.

      The GRUB 2 superuser account is an account of last resort. Establishing a unique username for this account hardens the boot loader against brute force attacks. Due to the nature of the superuser account database being distinct from the OS account database, this allows the use of a username that is not among those within the OS account database. Examples of non-unique superusers names are root, superuser, unlock, etc.
    remediation: &rem-8e06d5497f |
      Configure the system to have a unique name for the grub superusers account.

      Edit the /etc/grub.d/01_users file and add or modify the following lines:

      set superusers="[someuniquestringhere]"
      export superusers
      password_pbkdf2 [someuniquestringhere] ${GRUB2_PASSWORD}

      Generate a new grub.cfg file with the following command:

      $ sudo grub2-mkconfig -o /boot/grub2/grub.cfg
  - id: "STIG-RHEL-08-010149-etc_grub.d_01_users-content"
    name: "RHEL 8 operating systems booted with a BIOS must require a unique superusers name upon booting into single-user and maintenance modes. (/etc/grub.d/01_users has the expected content (3 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010149, V-244522, SV-244522r1137691_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/grub.d/01_users'
    allow_rc: any
    expect:
