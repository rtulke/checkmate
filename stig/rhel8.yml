  - id: "STIG-RHEL-08-010680-etc_nsswitch.conf-attrs"
    name: "For RHEL 8 systems using Domain Name Servers (DNS) resolution, at least two name servers must be configured. (/etc/nsswitch.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010680, V-230316, SV-230316r1044801_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/nsswitch.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1b3a1af3d9 |
      To provide availability for name resolution services, multiple redundant name servers are mandated. A failure in name resolution could lead to the failure of security functions requiring name resolution, which may include time synchronization, centralized authentication, and remote system logging.
    remediation: &rem-ad71c50a36 |
      Configure the operating system to use two or more name servers for DNS resolution.

      By default, "NetworkManager" on RHEL 8 dynamically updates the /etc/resolv.conf file with the DNS settings from active "NetworkManager" connection profiles. However, this feature can be disabled to allow manual configurations.

      If manually configuring DNS, edit the "/etc/resolv.conf" file to uncomment or add the two or more "nameserver" option lines with the IP address of local authoritative name servers. If local host resolution is being performed, the "/etc/resolv.conf" file must be empty. An empty "/etc/resolv.conf" file can be created as follows:

      $ sudo echo -n > /etc/resolv.conf
  - id: "STIG-RHEL-08-010680-etc_nsswitch.conf-content"
    name: "For RHEL 8 systems using Domain Name Servers (DNS) resolution, at least two name servers must be configured. (/etc/nsswitch.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010680, V-230316, SV-230316r1044801_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/nsswitch.conf'
    allow_rc: any
    expect: { some: "~ hosts\\:\\s*.*dns" }
    rationale: *rat-1b3a1af3d9
    remediation: *rem-ad71c50a36
  - id: "STIG-RHEL-08-010680-more_then_2_nameservers"
    name: "For RHEL 8 systems using Domain Name Servers (DNS) resolution, at least two name servers must be configured. (resolv 2+ nameservers)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010680, V-230316, SV-230316r1044801_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -c '^nameserver' /etc/resolv.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ [2-9]" }
      - { none: "~ [0-1]" }
    rationale: *rat-1b3a1af3d9
    remediation: *rem-ad71c50a36
  - id: "STIG-RHEL-08-010690-init_paths_sys_dirs"
    name: "Executable search paths within the initialization files of all local interactive RHEL 8 users must only contain paths that resolve to the system default or the users home directory."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010690, V-230317, SV-230317r1069320_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -r PATH= /home/*/.[^.]*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ PATH=\"\\$HOME/.local/bin:\\$HOME/bin:\\$PATH\"$" }
      - { none: "~ export PATH" }
      - { none: "~ PATH=\"\\/.*" }
    rationale: &rat-17a43ea76c |
      The executable search path (typically the PATH environment variable) contains a list of directories for the shell to search to find executables. If this path includes the current working directory (other than the user's home directory), executables in these directories may be executed instead of system commands. This variable is formatted as a colon-separated list of directories. If there is an empty entry, such as a leading or trailing colon or two consecutive colons, this is interpreted as the current working directory. If deviations from the default system search path for the local interactive user are required, they must be documented with the Information System Security Officer (ISSO).
    remediation: &rem-3362aa4c7b |
      Edit the local interactive user initialization files to change any PATH variable statements that reference directories other than their home directory.

      If a local interactive user requires path variables to reference a directory owned by the application, it must be documented with the ISSO.
  - id: "STIG-RHEL-08-010700-ww_dirs_not_root"
    name: "All RHEL 8 world-writable directories must be owned by root, sys, bin, or an application user."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010700, V-230318, SV-230318r1155352_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      find / -mount -xdev -type d -perm -0002 -uid +999 -print
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-919d46ba31 |
      If a world-writable directory is not owned by root, sys, bin, or an application User Identifier (UID), unauthorized users may be able to modify files created by others.

      The only authorized public directories are those temporary directories supplied with the system or those designed to be temporary file repositories. The setting is normally reserved for directories used by the system and by users for temporary file storage, (e.g., /tmp), and for directories requiring global read/write access.
    remediation: &rem-8f85a3c1c9 |
      Configure all RHEL 8 public directories to be owned by root or a system account to prevent unauthorized and unintended information transferred via shared system resources.

      Use the following command template to set ownership of public directories to root or a system account:

      $ sudo chown [root or system account] [Public Directory]
  - id: "STIG-RHEL-08-010710-ww_dirs_group_root"
    name: "All RHEL 8 world-writable directories must be group-owned by root, sys, bin, or an application group."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010710, V-230319, SV-230319r1017130_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      find / -mount -xdev -type d -perm -0002 -gid +999 -print
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-8e79c489f2 |
      If a world-writable directory is not group-owned by root, sys, bin, or an application Group Identifier (GID), unauthorized users may be able to modify files created by others.

      The only authorized public directories are those temporary directories supplied with the system or those designed to be temporary file repositories. The setting is normally reserved for directories used by the system and by users for temporary file storage, (e.g., /tmp), and for directories requiring global read/write access.
    remediation: &rem-c1a32f3975 |
      All directories in local partitions which are world-writable must be group-owned by root or another system account.  If any world-writable directories are not group-owned by a system account, this must be investigated.  Following this, the directories must be deleted or assigned to an appropriate group.
  - id: "STIG-RHEL-08-010720-user_home_dir_passwd"
    name: "All RHEL 8 local interactive users must have a home directory assigned in the /etc/passwd file."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010720, V-230320, SV-230320r1017131_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      for user in `awk -F: '($3>=1000)&&($7 !~ /nologin/){print $6}' /etc/passwd`; do if [ `stat -c %F $user` != 'directory' ]; then echo $user Directory_missing; fi; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-f470f87766 |
      If local interactive users are not assigned a valid home directory, there is no place for the storage and control of files they should own.
    remediation: &rem-8d51ac44b5 |
      Assign home directories to all local interactive users on RHEL 8 that currently do not have a home directory assigned.
  - id: "STIG-RHEL-08-010730-home_dir_750"
    name: "All RHEL 8 local interactive user home directories must have mode 0750 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010730, V-230321, SV-230321r1017132_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      for home_dir in `awk -F: '($3>=1000)&&($7 !~ /nologin/){print $6}' /etc/passwd`; do if [[ `stat -c %a $home_dir` != 7[0,5]0 ]]; then echo $home_dir home_dir_perms_incorrect;fi done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-c8d6f7441c |
      Excessive permissions on local interactive user home directories may allow unauthorized access to user files by other users.
    remediation: &rem-d63ca08793 |
      Change the mode of interactive user’s home directories to "0750". To change the mode of a local interactive user’s home directory, use the following command:

      Note: The example will be for the user "smithj".

      $ sudo chmod 0750 /home/smithj
  - id: "STIG-RHEL-08-010731-home_dir_file_750"
    name: "All RHEL 8 local interactive user home directory files must have mode 0750 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010731, V-244531, SV-244531r1017338_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      find /home/*/ -name "*" -type f -exec stat -c '%n %a' {} \; | grep -v "[6|7][0|4|5][0]" | grep -Ev ".(ba|c|z)sh(_profile|rc|_logout)"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: *rat-c8d6f7441c
    remediation: &rem-d4b57d856a |
      Set the mode on files and directories in the local interactive user home directory with the following command:

      Note: The example will be for the user smithj, who has a home directory of "/home/smithj" and is a member of the users group.

      $ sudo chmod 0750 /home/smithj/<file or directory>
  - id: "STIG-RHEL-08-010740-home_dir_group"
    name: "All RHEL 8 local interactive user home directories must be group-owned by the home directory owner’s primary group."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010740, V-230322, SV-230322r1017133_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      for home_dir in `awk -F: '($3>=1000)&&($7 !~ /nologin/){print $6}' /etc/passwd`; do HOME_UID=`stat -c %u $home_dir`; HOME_GID=`stat -c %g $home_dir`; if [ ${HOME_UID} != ${HOME_GID} ]; then echo $home_dir group_ownership incorrect; fi; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-4d8f2494aa |
      If the Group Identifier (GID) of a local interactive user’s home directory is not the same as the primary GID of the user, this would allow unauthorized access to the user’s files, and users that share the same group may not be able to access files that they legitimately should.
    remediation: &rem-45b67975d3 |
      Change the group owner of a local interactive user’s home directory to the group found in "/etc/passwd". To change the group owner of a local interactive user’s home directory, use the following command:

      Note: The example will be for the user "smithj", who has a home directory of "/home/smithj", and has a primary group of users.

           $ sudo chgrp users /home/smithj
  - id: "STIG-RHEL-08-010741-home_dir_750_group"
    name: "RHEL 8 must be configured so that all files and directories contained in local interactive user home directories are group-owned by a group of which the home directory owner is a member."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010741, V-244532, SV-244532r1101906_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      for dir in `ls /home`; do export home_group=`stat --printf='%G' /home/$dir` && find /home/$dir -not -group $home_group; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-fad5add19c |
      If a local interactive user's files are group-owned by a group of which the user is not a member, unintended users may be able to access them.
    remediation: &rem-1854ddcd12 |
      Change the group of a local interactive user's files and directories to a group that the interactive user is a member. To change the group owner of a local interactive user's files and directories, use the following command:

      Note: The example will be for the user smithj, who has a home directory of "/home/smithj" and is a member of the users group.

      $ sudo chgrp smithj /home/smithj/<file or directory>
  - id: "STIG-RHEL-08-010750-home_dir_defined"
    name: "All RHEL 8 local interactive user home directories defined in the /etc/passwd file must exist."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010750, V-230323, SV-230323r1017134_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      ls -ld $(awk -F: '($3>=1000)&&($7 !~ /nologin/){print $6}' /etc/passwd)
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { stderr: "!~ cannot access" }
    rationale: &rat-a8b2f54ef6 |
      If a local interactive user has a home directory defined that does not exist, the user may be given access to the "/" directory as the current working directory upon logon. This could create a denial of service because the user would not be able to access their logon configuration files, and it may give them visibility to system files they normally would not be able to access.
    remediation: &rem-21137a8e65 |
      Create home directories to all local interactive users that currently do not have a home directory assigned. Use the following commands to create the user home directory assigned in "/etc/ passwd":

      Note: The example will be for the user smithj, who has a home directory of "/home/smithj", a UID of "smithj", and a Group Identifier (GID) of "users assigned" in "/etc/passwd".

      $ sudo mkdir /home/smithj
      $ sudo chown smithj /home/smithj
      $ sudo chgrp users /home/smithj
      $ sudo chmod 0750 /home/smithj
  - id: "STIG-RHEL-08-010760-login_defs_create_home"
    name: "All RHEL 8 local interactive user accounts must be assigned a home directory upon creation."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010760, V-230324, SV-230324r1017135_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i create_home /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^CREATE_HOME\\s+yes" }
      - { none: "~ ^CREATE_HOME\\s+no" }
    rationale: *rat-f470f87766
    remediation: &rem-d559632823 |
      Configure RHEL 8 to assign home directories to all new local interactive users by setting the "CREATE_HOME" parameter in "/etc/login.defs" to "yes" as follows.

      CREATE_HOME yes
  - id: "STIG-RHEL-08-010770-init_file_740_less"
    name: "All RHEL 8 local initialization files must have mode 0740 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010770, V-230325, SV-230325r1017136_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      for file_init in `find /home/* -maxdepth 1 -type f -name ".*" -exec ls {} \;`; do stat -c '%a %n' $file_init; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^[0-7][0,1,2,4,5]0" }
    rationale: &rat-62a8c7fef3 |
      Local initialization files are used to configure the user's shell environment upon logon. Malicious modification of these files could compromise accounts upon logon.
    remediation: &rem-477f1b72d9 |
      Set the mode of the local initialization files to "0740" with the following command:

      Note: The example will be for the smithj user, who has a home directory of "/home/smithj".

           $ sudo chmod 0740 /home/smithj/.<INIT_FILE>
  - id: "STIG-RHEL-08-010780-file_dir_nouser"
    name: "All RHEL 8 local files and directories must have a valid owner."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010780, V-230326, SV-230326r1069284_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      find / -mount -xdev -nouser
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-ed18e5382d |
      Unowned files and directories may be unintentionally inherited if a user is assigned the same User Identifier "UID" as the UID of the un-owned files.
    remediation: &rem-7aac6aa16f |
      Either remove all files and directories from the system that do not have a valid user, or assign a valid user to all unowned files and directories on RHEL 8 with the "chown" command:

      $ sudo chown <user> <file>
  - id: "STIG-RHEL-08-010790-file_dir_nogroup"
    name: "All RHEL 8 local files and directories must have a valid group owner."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010790, V-230327, SV-230327r1069285_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      find / -mount -xdev -nogroup
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-e622316cc5 |
      Files without a valid group owner may be unintentionally inherited if a group is assigned the same Group Identifier (GID) as the GID of the files without a valid group owner.
    remediation: &rem-17ad7f19b7 |
      Either remove all files and directories from RHEL 8 that do not have a valid group, or assign a valid group to all files and directories on the system with the "chgrp" command:

      $ sudo chgrp <group> <file>
  - id: "STIG-RHEL-08-010800-home"
    name: "A separate RHEL 8 filesystem must be used for user home directories (such as /home or an equivalent)."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010800, V-230328, SV-230328r1155410_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/home'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: *rat-f25f99e47f
    remediation: &rem-41f97546a7 |
      Migrate the "/home" directory onto a separate file system.
  - id: "STIG-RHEL-08-010830-sshd_config_permit_userenv"
    name: "RHEL 8 must not allow users to override SSH environment variables."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010830, V-230330, SV-230330r1069305_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep PermitUser /etc/ssh/sshd_config /etc/sshd/conf.d
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ (?i).*:PermitUserEnvironment no" }
      - { none: "~ (?i).*:PermitUserEnvironment yes" }
    rationale: &rat-5cc6e7086b |
      SSH environment options potentially allow users to bypass access restriction in some configurations.
    remediation: &rem-0686014bd0 |
      Configure RHEL 8 to allow the SSH daemon to not allow unattended or automatic logon to the system.

      Add or edit the following line in the "/etc/ssh/sshd_config" file:

      PermitUserEnvironment no

      The SSH daemon must be restarted for the changes to take effect. To restart the SSH daemon, run the following command:

      $ sudo systemctl restart sshd.service
  - id: "STIG-RHEL-08-020011-faillock_conf_lock"
    name: "RHEL 8 must automatically lock an account when three unsuccessful logon attempts occur. (OS_ver \u003e= 8.2 passwd-auth)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020011, V-230333, SV-230333r1017145_rule, CAT II. CCI-000044. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep deny /etc/security/faillock.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^deny\\s+=\\s+[1-3]$" }
    rationale: &rat-7b132183b6 |
      By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing, otherwise known as brute-force attacks, is reduced. Limits are imposed by locking the account.

      In RHEL 8.2 the "/etc/security/faillock.conf" file was incorporated to centralize the configuration of the pam_faillock.so module.  Also introduced is a "local_users_only" option that will only track failed user authentication attempts for local users in /etc/passwd and ignore centralized (AD, IdM, LDAP, etc.) users to allow the centralized platform to solely manage user lockout.

      From "faillock.conf" man pages: Note that the default directory that "pam_faillock" uses is usually cleared on system boot so the access will be reenabled after system reboot. If that is undesirable a different tally directory must be set with the "dir" option.
    remediation: &rem-6b6d44b60e |
      Configure the operating system to lock an account when three unsuccessful logon attempts occur.

      Add/Modify the "/etc/security/faillock.conf" file to match the following line:

      deny = 3
  - id: "STIG-RHEL-08-020013-faillock_conf_fail_interval"
    name: "RHEL 8 must automatically lock an account when three unsuccessful logon attempts occur during a 15-minute time period. (OS_ver \u003e= 8.2)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020013, V-230335, SV-230335r1017147_rule, CAT II. CCI-000044. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep fail_interval /etc/security/faillock.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^fail_interval = (^[1-8][0-9]{0,2}|900)" }
      - { none: "~ ^fail_interval = ^(0|90[1-9]|9[1-9]{1,9})" }
    rationale: *rat-7b132183b6
    remediation: &rem-70e9be554e |
      Configure the operating system to lock an account when three unsuccessful logon attempts occur in 15 minutes.

      Add/Modify the "/etc/security/faillock.conf" file to match the following line:

      fail_interval = 900
  - id: "STIG-RHEL-08-020017-faillock_conf_persist"
    name: "RHEL 8 must ensure account lockouts persist. (OS_ver \u003e= 8.2)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020017, V-230339, SV-230339r1017151_rule, CAT II. CCI-000044. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep dir /etc/security/faillock.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^dir(\\s|)=(\\s|)\\/.*" }
      - { some: "~ ^dir(\\s|)=(\\s|)\\/var\\/log\\/faillock" }
    rationale: *rat-7b132183b6
    remediation: &rem-363c0ae9de |
      Configure the operating system maintain the contents of the faillock directory after a reboot.

      Add/Modify the "/etc/security/faillock.conf" file to match the following line:

      dir = /var/log/faillock
  - id: "STIG-RHEL-08-020019-faillock_conf_silence_system_msg"
    name: "RHEL 8 must prevent system messages from being presented when three unsuccessful logon attempts occur. (OS_ver \u003e= 8.2)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020019, V-230341, SV-230341r1017153_rule, CAT II. CCI-000044. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i silent /etc/security/faillock.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^silent" }
    rationale: *rat-7b132183b6
    remediation: &rem-d73ef8f76d |
      Configure the operating system to prevent informative messages from being presented at logon attempts.

      Add/Modify the "/etc/security/faillock.conf" file to match the following line:

      silent
  - id: "STIG-RHEL-08-020021-faillock_conf_log_username"
    name: "RHEL 8 must log user name information when unsuccessful logon attempts occur. (OS_ver \u003e= 8.2 faillock)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020021, V-230343, SV-230343r1017155_rule, CAT II. CCI-000044. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep audit /etc/security/faillock.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^audit" }
    rationale: *rat-7b132183b6
    remediation: &rem-df0462ea64 |
      Configure the operating system to log user name information when unsuccessful logon attempts occur.

      Add/Modify the "/etc/security/faillock.conf" file to match the following line:

      audit
  - id: "STIG-RHEL-08-020023-faillock_conf_deny_root"
    name: "RHEL 8 must include root when automatically locking an account until the locked account is released by an administrator when three unsuccessful logon attempts occur during a 15-minute time period. (OS_ver \u003e= 8.2 faillock)"
