  - id: "STIG-RHEL-08-010670-kdump.service-enabled"
    name: "RHEL 8 must disable kernel dumps unless needed. (Service kdump.service is not enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010670, V-230310, SV-230310r1155383_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState kdump.service | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-962df5f582 |
      Kernel core dumps may contain the full contents of system memory at the time of the crash. Kernel core dumps may consume a considerable amount of disk space and may result in denial of service by exhausting the available space on the target file system partition.

      RHEL 8 installation media presents the option to enable or disable the kdump service at the time of system installation.
    remediation: &rem-b9ada3893b |
      If kernel core dumps are not required, disable the "kdump" service with the following command:

      # systemctl disable kdump.service

      If kernel core dumps are required, document the need with the ISSO.
