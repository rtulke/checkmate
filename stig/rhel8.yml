  - id: "STIG-RHEL-08-020110-pwquality_conf_ucredit"
    name: "RHEL 8 must enforce password complexity by requiring that at least one uppercase character be used."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020110, V-230357, SV-230357r1017169_rule, CAT II. CCI-000192. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -iR ucredit /etc/security/pwquality.conf*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*:(\\s|)ucredit = -1" }
      - { none: "~ .*:(\\s|)ucredit = [0-9]" }
    rationale: &rat-9eff313d2b |
      Use of a complex password helps to increase the time and resources required to compromise the password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks.

      Password complexity is one factor of several that determines how long it takes to crack a password. The more complex the password, the greater the number of possible combinations that need to be tested before the password is compromised.

      RHEL 8 utilizes pwquality as a mechanism to enforce password complexity. Note that in order to require uppercase characters, without degrading the "minlen" value, the credit value must be expressed as a negative number in "/etc/security/pwquality.conf".
    remediation: &rem-e4911a623a |
      Configure the operating system to enforce password complexity by requiring that at least one uppercase character be used by setting the "ucredit" option.

      Add the following line to /etc/security/pwquality.conf (or modify the line to have the required value):

      ucredit = -1

      Remove any configurations that conflict with the above value.
