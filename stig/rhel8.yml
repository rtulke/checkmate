  - id: "STIG-RHEL-08-010422-default_grub_syscall"
    name: "RHEL 8 must disable virtual syscalls. (default vsyscall grub check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010422, V-230278, SV-230278r1017091_rule, CAT II. CCI-001084. NIST SP 800-53 Rev. 4: SC-3."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep syscall /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX=.*\\svsyscall=none\\s.*" }
      - { none: "~ ^#GRUB_CMDLINE_LINUX=.*\\svsyscall=.*" }
    rationale: &rat-bb2ee7cff0 |
      Syscalls are special routines in the Linux kernel, which userspace applications ask to do privileged tasks.  Invoking a system call is an expensive operation because the processor must interrupt the currently executing task and switch context to kernel mode and then back to userspace after the system call completes.  Virtual Syscalls map into user space a page that contains some variables and the implementation of some system calls.  This allows the system calls to be executed in userspace to alleviate the context switching expense.

      Virtual Syscalls provide an opportunity of attack for a user who has control of the return instruction pointer.  Disabling vsyscalls help to prevent return oriented programming (ROP) attacks via buffer overflows and overruns. If the system intends to run containers based on RHEL 6 components, then virtual syscalls will need enabled so the components function properly.
    remediation: &rem-4d342f93c0 |
      Document the use of vsyscalls with the ISSO as an operational requirement or disable them with the following command:

      $ sudo grubby --update-kernel=ALL --args="vsyscall=none"

      Add or modify the following line in "/etc/default/grub" to ensure the configuration survives kernel updates:

      GRUB_CMDLINE_LINUX="vsyscall=none"
  - id: "STIG-RHEL-08-010422-grub_vsyscall_chk"
    name: "RHEL 8 must disable virtual syscalls. (live vsyscall grub check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010422, V-230278, SV-230278r1017091_rule, CAT II. CCI-001084. NIST SP 800-53 Rev. 4: SC-3."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grub2-editenv list | grep vsyscall
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^kernelopts=.*\\svsyscall=\\s.emulated*$" }
      - { some: "~ ^kernelopts=.*\\svsyscall=none\\s.*$" }
    rationale: *rat-bb2ee7cff0
    remediation: *rem-4d342f93c0
  - id: "STIG-RHEL-08-010423-default_grub_slub"
    name: "RHEL 8 must clear memory when it is freed to prevent use-after-free attacks. (conf check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010423, V-230279, SV-230279r1069286_rule, CAT II. CCI-001084. NIST SP 800-53 Rev. 4: SC-3."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i slub /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX*=.*\\sinit_on_free=1\\s.*$" }
    rationale: &rat-0cb21bc308 |
      Some adversaries launch attacks with the intent of executing code in nonexecutable regions of memory or in memory locations that are prohibited. Security safeguards employed to protect memory include, for example, data execution prevention and address space layout randomization. Data execution prevention safeguards can be either hardware-enforced or software-enforced with hardware providing the greater strength of mechanism.

      Poisoning writes an arbitrary value to freed pages, so any modification or reference to that page after being freed or before being initialized will be detected and prevented. This prevents many types of use-after-free vulnerabilities at little performance cost. Also prevents leak of data and detection of corrupted memory.

      init_on_free is a Linux kernel boot parameter that enhances security by initializing memory regions when they are freed, preventing data leakage. This process ensures that stale data in freed memory cannot be accessed by malicious programs.

      SLUB canaries add a randomized value (canary) at the end of SLUB-allocated objects to detect memory corruption caused by buffer overflows or underflows. Redzoning adds padding (red zones) around SLUB-allocated objects to detect overflows or underflows by triggering a fault when adjacent memory is accessed. SLUB canaries are often more efficient and provide stronger detection against buffer overflows compared to redzoning. SLUB canaries are supported in hardened Linux kernels like the ones provided by Linux-hardened.

      SLAB objects are blocks of physically contiguous memory. SLUB is the unqueued SLAB allocator.
    remediation: &rem-52c8ff16cb |
      Configure RHEL 8 to enable init_on_free with the following command:
      $ sudo grubby --update-kernel=ALL --args="init_on_free=1"

      Regenerate the GRUB configuration:
      $ sudo grub2-mkconfig -o /boot/grub2/grub.cfg

      Reboot the system:
      $ sudo reboot
  - id: "STIG-RHEL-08-010423-grub_slub_chk"
    name: "RHEL 8 must clear memory when it is freed to prevent use-after-free attacks. (live check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010423, V-230279, SV-230279r1069286_rule, CAT II. NIST SP 800-53 Rev. 4: SC-3."
    tags: [stig, stig-rhel8, stig-cat-2]
