  - id: "STIG-RHEL-08-010358-mailx"
    name: "RHEL 8 must be configured to allow sending email notifications of unauthorized configuration changes to designated personnel."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010358, V-256974, SV-256974r1069321_rule, CAT II. CCI-001744. NIST SP 800-53 Rev. 4: CM-3."
