  - id: "STIG-RHEL-08-040285-net.ipv4.conf.all.rp_filter"
    name: "RHEL 8 must use reverse path filtering on all IPv4 interfaces. (Live_check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040285, V-230549, SV-230549r1208761_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.all.rp_filter
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-5749665384 |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore, may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      The sysctl --system command will load settings from all system configuration files. All configuration files are sorted by their filename in lexicographical order, regardless of which of the directories they reside in. If multiple files specify the same option, the entry in the file with the lexicographically latest name will take precedence. Files are read from directories in the following list from top to bottom. Once a file of a given filename is loaded, any file of the same name in subsequent directories is ignored.

      /etc/sysctl.d/*.conf
      /run/sysctl.d/*.conf
      /usr/local/lib/sysctl.d/*.conf
      /usr/lib/sysctl.d/*.conf
      /lib/sysctl.d/*.conf
      /etc/sysctl.conf
    remediation: &rem-c15e93b9a0 |
      Configure RHEL 8 to use reverse path filtering on all IPv4 interfaces.

      Create a configuration file if it does not already exist:

      $ sudo vi /etc/sysctl.d/ipv4_rp_filter.conf

      Add the following line to the file:

      net.ipv4.conf.all.rp_filter = 1

      Reload settings from all system configuration files with the following command:

      $ sudo sysctl --system
