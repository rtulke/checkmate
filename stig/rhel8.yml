    rationale: *rat-e4a6de40c7
    remediation: *rem-6f4d834c41
  - id: "STIG-RHEL-08-040137-fapolicy_mounts"
    name: "The RHEL 8 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs. (mounts)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040137, V-244546, SV-244546r1208752_rule, CAT II. CCI-001764. NIST SP 800-53 Rev. 4: CM-7."
