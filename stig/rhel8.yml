    rationale: *rat-7bc360e78a
    remediation: *rem-6f855219f0
  - id: "STIG-RHEL-08-020090-pki_auth_sssd"
    name: "RHEL 8 must map the authenticated identity to the user or group account for PKI-based authentication."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020090, V-230355, SV-230355r1017168_rule, CAT II. CCI-000187. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      cat /etc/sssd/sssd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^[sssd]" }
      - { some: "~ ^config_file_version = 2" }
      - { some: "~ ^services = pam, sudo, ssh" }
      - { some: "~ ^domains = .*" }
      - { some: "~ ^[pam]" }
      - { some: "~ ^pam_cert_auth = True" }
      - { some: "~ ^[domain/.*]" }
      - { some: "~ ^id_provider = ldap" }
      - { some: "~ ^[certmap/.*/rule_name]" }
      - { some: "~ /\\^matchrule =,SAN\\.\\.\\*EDIPI@mil" }
      - { some: "~ ^maprule = (userCertificate;binary={cert!bin})" }
      - { some: "~ domains = .*" }
    rationale: &rat-bdd8d366a7 |
      Without mapping the certificate used to authenticate to the user account, the ability to determine the identity of the individual user or group will not be available for forensic analysis.

      There are various methods of mapping certificates to user/group accounts for RHEL 8. For the purposes of this requirement, the check and fix will account for Active Directory mapping. Some of the other possible methods include joining the system to a domain and utilizing a Red Hat idM server, or a local system mapping, where the system is not part of a domain.
    remediation: &rem-3c9e99150c |
      Configure the operating system to map the authenticated identity to the user or group account by adding or modifying the certmap section of the "/etc/sssd/sssd.conf file based on the following example:

      [certmap/testing.test/rule_name]
      matchrule =<SAN>.*EDIPI@mil
      maprule = (userCertificate;binary={cert!bin})
      domains = testing.test

      The "sssd" service must be restarted for the changes to take effect. To restart the "sssd" service, run the following command:

      $ sudo systemctl restart sssd.service
  - id: "STIG-RHEL-08-020100-password_auth_pwquality"
    name: "RHEL 8 must ensure the password complexity module is enabled in the password-auth file. (passwd-auth)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020100, V-230356, SV-230356r982195_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i pwquality /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^password\\s+requisite\\s+pam_pwquality.so" }
    rationale: &rat-648ca91223 |
      Use of a complex password helps to increase the time and resources required to compromise the password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks. "pwquality" enforces complex password construction configuration and has the ability to limit brute-force attacks on the system.

      RHEL 8 utilizes "pwquality" as a mechanism to enforce password complexity. This is set in both:
      /etc/pam.d/password-auth
      /etc/pam.d/system-auth
    remediation: &rem-ba73f7bca3 |
      Configure the operating system to use "pwquality" to enforce password complexity rules.

      Add the following line to the "/etc/pam.d/password-auth" file (or modify the line to have the required value):

           password requisite pam_pwquality.so
