  - id: "STIG-RHEL-08-010151-usr_lib_systemd_system_rescue.service-attrs"
    name: "RHEL 8 operating systems must require authentication upon booting into rescue mode. (/usr/lib/systemd/system/rescue.service: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010151, V-230236, SV-230236r1137691_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
