  - id: "STIG-RHEL-08-040080-usb_storage_modprobe"
    name: "RHEL 8 must be configured to disable USB mass storage."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040080, V-230503, SV-230503r1069316_rule, CAT II. CCI-000778. NIST SP 800-53 Rev. 4: IA-3."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -ri usb-storage /etc/modprobe.d/* | grep -v '#'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^.*:install usb-storage \\/bin\\/false" }
      - { some: "~ (?i)^.*:blacklist usb-storage" }
      - { none: "~ (?i)^.*:install usb-storage \\/bin\\/true" }
    rationale: &rat-0e5f4c06fb |
      USB mass storage permits easy introduction of unknown devices, thereby facilitating malicious activity.
    remediation: &rem-35dab5cb4b |
      Configure the operating system to disable the ability to use the USB Storage kernel module and the ability to use USB mass storage devices.

      Add or update the following lines in the file "/etc/modprobe.d/blacklist.conf":

           install usb-storage /bin/false
           blacklist usb-storage

      Reboot the system for the settings to take effect.
  - id: "STIG-RHEL-08-040090-check_firewall_deny_manually"
    name: "A RHEL 8 firewall must employ a deny-all, allow-by-exception policy for allowing connections to other systems. (Manual Check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040090, V-230504, SV-230504r1262220_rule, CAT II. CCI-002314. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      echo "Please investigate firewall is configured as expected"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Please investigate firewall is configured as expected" }
    rationale: &rat-b2c1ab3738 |
      Failure to restrict network connectivity only to authorized systems permits inbound connections from malicious systems. It also permits outbound connections that may facilitate exfiltration of DoW data.

      RHEL 8 incorporates the "firewalld" daemon, which allows for many different configurations. One of these configurations is zones. Zones can be utilized to a deny-all, allow-by-exception approach. The default "drop" zone will drop all incoming network packets unless it is explicitly allowed by the configuration file or is related to an outgoing network connection.
    remediation: &rem-a3a0bee725 |
      Configure the "firewalld" daemon to employ a deny-all, allow-by-exception with the following commands:

           $ sudo firewall-cmd --permanent --new-zone=[custom]

           $ sudo cp /usr/lib/firewalld/zones/drop.xml /etc/firewalld/zones/[custom].xml

      This will provide a clean configuration file to work with that employs a deny-all approach.

      Note: Add the exceptions that are required for mission functionality and update the short title in the xml file to match the [custom] zone name.

      Reload the firewall rules to make the new [custom] zone available to load:
           $ sudo firewall-cmd --reload

      Set the default zone to the new [custom] zone:
           $ sudo firewall-cmd --set-default-zone=[custom]

      Note: This is a runtime and permanent change.
      Add any interfaces to the new [custom] zone:
           $ sudo firewall-cmd --permanent --zone=[custom] --change-interface=ens33

      Reload the firewall rules for changes to take effect:
           $ sudo firewall-cmd --reload
  - id: "STIG-RHEL-08-040100-firewalld"
    name: "A firewall must be installed on RHEL 8."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040100, V-230505, SV-230505r1262221_rule, CAT II. CCI-002314. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet firewalld
    expect: true
    rationale: &rat-5a3aa60bfb |
      "Firewalld" provides an easy and effective way to block/limit remote access to the system via ports, services, and protocols.

      Remote access services, such as those providing remote access to network devices and information systems, which lack automated control capabilities, increase risk and make remote user access management difficult at best.

      Remote access is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      RHEL 8 functionality (e.g., RDP) must be capable of taking enforcement action if the audit reveals unauthorized activity. Automated control of remote access sessions allows organizations to ensure ongoing compliance with remote access policies by enforcing connection rules of remote access applications on a variety of information system components (e.g., servers, workstations, notebook computers, smartphones, and tablets).
    remediation: &rem-5c6e3a377b |
      Install "firewalld" with the following command:

      $ sudo yum install firewalld.noarch
  - id: "STIG-RHEL-08-040101-firewalld-enabled"
    name: "A firewall must be active on RHEL 8. (Service firewalld is enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040101, V-244544, SV-244544r1262222_rule, CAT II. CCI-002314. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState firewalld | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-5a3aa60bfb
    remediation: &rem-4b7634b40f |
      Configure "firewalld" to protect the operating system with the following command:

      $ sudo systemctl enable firewalld
  - id: "STIG-RHEL-08-040101-firewalld-running"
    name: "A firewall must be active on RHEL 8. (Service firewalld is running)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040101, V-244544, SV-244544r1262222_rule, CAT II. CCI-002314. NIST SP 800-53 Rev. 4: AC-17."
