      - { none: "~ ^\\/etc\\/modprobe.d/.*:install uvcvideo \\/bin\\/true" }
    rationale: *rat-b8d074bf92
    remediation: *rem-0715103687
  - id: "STIG-RHEL-08-040030-check_firewall_manually"
    name: "RHEL 8 must be configured to prohibit or restrict the use of functions, ports, protocols, and/or services, as defined in the Ports, Protocols, and Services Management (PPSM) Category Assignments List (CAL) and vulnerability assessments. (Manual Check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040030, V-230500, SV-230500r1101900_rule, CAT II. CCI-000382. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      echo "Please investigate firewall is configured as expected"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Please investigate firewall is configured as expected" }
    rationale: &rat-f716aa86c6 |
      To prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized tunneling (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary physical and logical ports/protocols on information systems.

      Operating systems are capable of providing a wide variety of functions and services. Some of the functions and services provided by default may not be necessary to support essential organizational operations. Additionally, it is sometimes convenient to provide multiple services from a single component (e.g., VPN and IPS); however, doing so increases risk over limiting the services provided by any one component.

      To support the requirements and principles of least functionality, the operating system must support the organizational requirements, providing only essential capabilities and limiting the use of ports, protocols, and/or services to only those required, authorized, and approved to conduct official business or to address authorized quality-of-life issues.
    remediation: &rem-d7142730ab |
      Update the host's firewall settings and/or running services to comply with the PPSM Component Local Service Assessment (CLSA) for the site or program and the PPSM CAL.
  - id: "STIG-RHEL-08-040070-autofs"
    name: "The RHEL 8 file system automounter must be disabled. (package)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040070, V-230502, SV-230502r1155393_rule, CAT II. CCI-000778. NIST SP 800-53 Rev. 4: IA-3."
