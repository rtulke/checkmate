  - id: "STIG-RHEL-08-010370-dnf_conf_gpgcheck"
    name: "RHEL 8 must prevent the installation of software, patches, service packs, device drivers, or operating system components from a repository without verification they have been digitally signed using a certificate that is issued by a Certificate Authority (CA) that is recognized and approved by the organization. (dnf_conf)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010370, V-230264, SV-230264r1262199_rule, CAT I. CCI-001749. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      grep -i ^gpgcheck /etc/dnf/dnf.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^gpgcheck.*1" }
      - { none: "~ ^gpgcheck.*0" }
    rationale: &rat-22309dab7f |
      Changes to any software components can have significant effects on the overall security of the operating system. This requirement ensures the software has not been tampered with and that it has been provided by a trusted vendor.

      Accordingly, patches, service packs, device drivers, or operating system components must be signed with a certificate recognized and approved by the organization.

      Verifying the authenticity of the software prior to installation validates the integrity of the patch or upgrade received from a vendor. This verifies the software has not been tampered with and that it has been provided by a trusted vendor. Self-signed certificates are disallowed by this requirement. The operating system should not have to verify the software again. This requirement does not mandate DoW certificates for this purpose; however, the certificate used to verify the software must be from an approved CA.
    remediation: &rem-6df586d1fd |
      Configure the operating system to verify the signature of packages from a repository prior to install by setting the following option in the "/etc/yum.repos.d/[your_repo_name].repo" file:

           gpgcheck=1
  - id: "STIG-RHEL-08-010370-gpg_check_default"
    name: "RHEL 8 must prevent the installation of software, patches, service packs, device drivers, or operating system components from a repository without verification they have been digitally signed using a certificate that is issued by a Certificate Authority (CA) that is recognized and approved by the organization. (dnf_running)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010370, V-230264, SV-230264r1262199_rule, CAT I. CCI-001749. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    timeout: 120000ms
    run: |
      dnf config-manager --dump | grep gpgcheck
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^gpgcheck.*1" }
      - { none: "~ ^gpgcheck.*0" }
    rationale: *rat-22309dab7f
    remediation: *rem-6df586d1fd
  - id: "STIG-RHEL-08-010370-gpg_check_repos"
    name: "RHEL 8 must prevent the installation of software, patches, service packs, device drivers, or operating system components from a repository without verification they have been digitally signed using a certificate that is issued by a Certificate Authority (CA) that is recognized and approved by the organization. (repo_check)"
