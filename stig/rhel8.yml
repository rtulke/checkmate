  - id: "STIG-RHEL-08-010293-openssl_cnf_crypto_policy_include-attrs"
    name: "RHEL 8 must implement DoW-approved encryption in the OpenSSL package. (/etc/pki/tls/openssl.cnf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010293, V-288829, SV-288829r1261888_rule, CAT I. CCI-001453. NIST SP 800-53 Rev. 4: AC-17."
