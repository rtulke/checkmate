      grub2-editenv list | grep audit
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^kernelopts.*\\saudit=1\\s.*" }
      - { none: "~ ^kernelopts=.*\\saudit=0\\s.*" }
    rationale: *rat-0c51a10851
    remediation: *rem-7d475bd400
  - id: "STIG-RHEL-08-030602-default_grub_audit_backlog"
    name: "RHEL 8 must allocate an audit_backlog_limit of sufficient size to capture processes that start prior to the audit daemon. (config)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030602, V-230469, SV-230469r958752_rule, CAT III. CCI-001849. NIST SP 800-53 Rev. 4: AU-4."
