    remediation: *rem-8e9fdd756e
  - id: "STIG-RHEL-08-030590-audit_rules_faillock"
    name: "Successful/unsuccessful modifications to the faillock log file in RHEL 8 must generate an audit record. (config check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030590, V-230466, SV-230466r1262213_rule, CAT II. CCI-000169. NIST SP 800-53 Rev. 4: AU-12."
