      Use of a complex password helps to increase the time and resources required to compromise the password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks.

      Password complexity is one factor of several that determines how long it takes to crack a password. The more complex the password, the greater the number of possible combinations that need to be tested before the password is compromised.

      RHEL 8 utilizes "pwquality" as a mechanism to enforce password complexity. The "minclass" option sets the minimum number of required classes of characters for the new password (digits, uppercase, lowercase, others).
    remediation: &rem-e28ebfacbb |
      Configure the operating system to require the change of at least four character classes when passwords are changed by setting the "minclass" option.

      Add the following line to "/etc/security/pwquality.conf conf" (or modify the line to have the required value):

      minclass = 4

      Remove any configurations that conflict with the above value.
  - id: "STIG-RHEL-08-020170-pwquality_conf_difok"
    name: "RHEL 8 must require the change of at least 8 characters when passwords are changed."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020170, V-230363, SV-230363r1017175_rule, CAT II. CCI-000195. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -iR difok /etc/security/pwquality.conf*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*:(\\s|)difok = ([8-9]|1[0-9])$" }
      - { none: "~ .*:(\\s|)difok = [1-7]$" }
    rationale: &rat-8c41ded92a |
      Use of a complex password helps to increase the time and resources required to compromise the password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks.

      Password complexity is one factor of several that determines how long it takes to crack a password. The more complex the password, the greater the number of possible combinations that need to be tested before the password is compromised.

      RHEL 8 utilizes "pwquality" as a mechanism to enforce password complexity. The "difok" option sets the number of characters in a password that must not be present in the old password.
    remediation: &rem-816a111ccf |
      Configure the operating system to require the change of at least eight of the total number of characters when passwords are changed by setting the "difok" option.

      Add the following line to "/etc/security/pwquality.conf" (or modify the line to have the required value):

      difok = 8

      Remove any configurations that conflict with the above value.
  - id: "STIG-RHEL-08-020180-min_pw_lifetime"
    name: "RHEL 8 passwords must have a 24 hours/1 day minimum password lifetime restriction in /etc/shadow."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020180, V-230364, SV-230364r1017176_rule, CAT II. CCI-000198. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      for user in `awk -F: '($3>=1000)&&($7 !~ /nologin/){print $1}' /etc/passwd`; do grep $user /etc/shadow | awk -F : '$4 < 1{print $1 " " $4}'; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-49171d3c83 |
      Enforcing a minimum password lifetime helps to prevent repeated password changes to defeat the password reuse or history enforcement requirement. If users are allowed to immediately and continually change their password, the password could be repeatedly changed in a short period of time to defeat the organization's policy regarding password reuse.
    remediation: &rem-f1bd47941d |
      Configure non-compliant accounts to enforce a 24 hours/1 day minimum password lifetime:

      $ sudo chage -m 1 [user]
  - id: "STIG-RHEL-08-020190-login_defs_pass_min_days"
    name: "RHEL 8 passwords for new users or password changes must have a 24 hours/1 day minimum password lifetime restriction in /etc/login.defs."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020190, V-230365, SV-230365r1017177_rule, CAT II. CCI-000198. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i pass_min_days /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS_MIN_DAYS 1$" }
      - { none: "~ ^PASS_MIN_DAYS (0[2-9]|[1-9][0-9])$" }
    rationale: *rat-49171d3c83
    remediation: &rem-ec0b87c5d1 |
      Configure the operating system to enforce 24 hours/1 day as the minimum password lifetime.

      Add the following line in "/etc/login.defs" (or modify the line to have the required value):

      PASS_MIN_DAYS 1
  - id: "STIG-RHEL-08-020200-login_defs_pass_max"
    name: "RHEL 8 user account passwords must have a 180-day maximum password lifetime restriction."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020200, V-230366, SV-230366r1262169_rule, CAT II. CCI-000199. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i pass_max /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS_MAX_DAYS ([1-9]|[1-9][0-9]|1[0-7][0-9]|180)$" }
      - { none: "~ ^PASS_MAX_DAYS (18[1-9]|19[0-9]|[2-9][0-9][0-9]|[0-9]{4,})$" }
    rationale: &rat-08c83e567b |
      Any password, no matter how complex, can eventually be cracked. Therefore, passwords need to be changed periodically. If RHEL 8 does not limit the lifetime of passwords and force users to change their passwords, there is the risk that RHEL 8 passwords could be compromised.
    remediation: &rem-18c6d86c53 |
      Configure RHEL 8 to enforce a 180-day maximum password lifetime.

      Add, or modify the following line in the "/etc/login.defs" file:

      PASS_MAX_DAYS 180
  - id: "STIG-RHEL-08-020210-max_60day_max"
    name: "RHEL 8 user account passwords must be configured so that existing passwords are restricted to a 180-day maximum lifetime."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020210, V-230367, SV-230367r1262170_rule, CAT II. CCI-000199. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      for user in `awk -F: '($3>=1000)&&($7 !~ /nologin/){print $1}' /etc/passwd`; do grep $user /etc/shadow | awk -F : '{print $5}'; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^([1-9]|[1-9][0-9]|1[0-7][0-9]|180)$" }
      - { none: "~ ^(0|-[0-9]+|18[1-9]|19[0-9]|[2-9][0-9][0-9]|[0-9]{4,})$" }
    rationale: *rat-08c83e567b
    remediation: &rem-95f9f84f65 |
      Configure noncompliant accounts to enforce a 180-day maximum password lifetime restriction.

      $ sudo chage -M 180 [user]
  - id: "STIG-RHEL-08-020230-pwquality_conf_minlength"
    name: "RHEL 8 passwords must have a minimum of 15 characters."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020230, V-230369, SV-230369r1262207_rule, CAT II. CCI-000205. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -iR minlen /etc/security/pwquality.conf*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*:(\\s|)minlen = (1[5-9]|2[0-9])$" }
      - { none: "~ .*:(\\s|)minlen = ([0-9]|1[0-4])$" }
    rationale: &rat-a51c99f8e6 |
      The shorter the password, the lower the number of possible combinations that need to be tested before the password is compromised.

      Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks. Password length is one factor of several that helps to determine strength and how long it takes to crack a password. Use of more characters in a password helps to increase exponentially the time and/or resources required to compromise the password.

      RHEL 8 utilizes "pwquality" as a mechanism to enforce password complexity. Configurations are set in the "etc/security/pwquality.conf" file.

      The "minlen", sometimes noted as minimum length, acts as a "score" of complexity based on the credit components of the "pwquality" module. By setting the credit components to a negative value, not only will those components be required, they will not count towards the total "score" of "minlen". This will enable "minlen" to require a 15-character minimum.

      The DoW minimum password requirement is 15 characters.
    remediation: &rem-cc8673b26a |
      Configure operating system to enforce a minimum 15-character password length.

      Add the following line to "/etc/security/pwquality.conf" (or modify the line to have the required value):

      minlen = 15

      Remove any configurations that conflict with the above value.
  - id: "STIG-RHEL-08-020231-login_defs_pass_min_len"
    name: "RHEL 8 passwords for new users must have a minimum of 15 characters."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020231, V-230370, SV-230370r1262208_rule, CAT II. CCI-000205. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i pass_min_len /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS_MIN_LEN (1[5-9]|2[0-9])$" }
      - { none: "~ ^PASS_MIN_LEN ([0-9]|1[0-4])$" }
    rationale: &rat-6b2db0d199 |
      The shorter the password, the lower the number of possible combinations that need to be tested before the password is compromised.

      Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks. Password length is one factor of several that helps to determine strength and how long it takes to crack a password. Use of more characters in a password helps to increase exponentially the time and/or resources required to compromise the password.

      The DoW minimum password requirement is 15 characters.
    remediation: &rem-e305dcdaf1 |
      Configure operating system to enforce a minimum 15-character password length for new user accounts.

      Add, or modify the following line in the "/etc/login.defs" file:

      PASS_MIN_LEN 15
  - id: "STIG-RHEL-08-020240-no_dup_uid"
    name: "RHEL 8 duplicate User IDs (UIDs) must not exist for interactive users."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020240, V-230371, SV-230371r1017183_rule, CAT II. CCI-000764. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      awk -F ':' 'list[$3]++{print $1, $3}' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-30782a2f8f |
      To ensure accountability and prevent unauthenticated access, interactive users must be identified and authenticated to prevent potential misuse and compromise of the system.

      Interactive users include organizational employees or individuals the organization deems to have equivalent status of employees (e.g., contractors). Interactive users (and processes acting on behalf of users) must be uniquely identified and authenticated to all accesses, except for the following:

      1) Accesses explicitly identified and documented by the organization. Organizations document specific user actions that can be performed on the information system without identification or authentication; and

      2) Accesses that occur through authorized use of group authenticators without individual authentication. Organizations may require unique identification of individuals in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity.
    remediation: &rem-40b5cde452 |
      Edit the file "/etc/passwd" and provide each interactive user account that has a duplicate User ID (UID) with a unique UID.
  - id: "STIG-RHEL-08-020250-etc_pam.d_smartcard-auth-attrs"
    name: "RHEL 8 must implement smart card logon for multifactor authentication for access to interactive accounts. (/etc/pam.d/smartcard-auth: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020250, V-230372, SV-230372r1262209_rule, CAT II. CCI-000765. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/pam.d/smartcard-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-53f107cdcc |
      Using an authentication device, such as a common access Ccard (CAC) or token that is separate from the information system, ensures that even if the information system is compromised, that compromise will not affect credentials stored on the authentication device.

      Multifactor solutions that require devices separate from information systems gaining access include, for example, hardware tokens providing time-based or challenge-response authenticators and smart cards such as the U.S. Government Personal Identity Verification card and the DoW CAC.

      There are various methods of implementing multifactor authentication for RHEL 8. Some methods include a local system multifactor account mapping or joining the system to a domain and utilizing a Red Hat idM server or Microsoft Windows Active Directory server. Any of these methods will require that the client operating system handle the multifactor authentication correctly.
    remediation: &rem-9044df2ca3 |
      Configure RHEL 8 to use multifactor authentication for local access to accounts.

      Add or update the "pam_cert_auth" setting in the "/etc/sssd/sssd.conf" file to match the following line:

           [pam]
           pam_cert_auth = True

      Add or update "pam_sss.so" with "try_cert_auth" or "require_cert_auth" in the "/etc/pam.d/system-auth" and "/etc/pam.d/smartcard-auth" files based on the following examples:

           /etc/pam.d/smartcard-auth:auth   sufficient   pam_sss.so try_cert_auth

           /etc/pam.d/system-auth:auth   [success=done authinfo_unavail=ignore ignore=ignore default=die]   pam_sss.so try_cert_auth

      The "sssd" service must be restarted for the changes to take effect. To restart the "sssd" service, run the following command:

           $ sudo systemctl restart sssd.service
  - id: "STIG-RHEL-08-020250-etc_pam.d_smartcard-auth-content"
    name: "RHEL 8 must implement smart card logon for multifactor authentication for access to interactive accounts. (/etc/pam.d/smartcard-auth has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020250, V-230372, SV-230372r1262209_rule, CAT II. CCI-000765. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/pam.d/smartcard-auth'
    allow_rc: any
    expect: { some: "~ ^auth sufficient\\s+pam_sss.so [try_cert_auth|require_cert_auth]" }
    rationale: *rat-53f107cdcc
    remediation: *rem-9044df2ca3
  - id: "STIG-RHEL-08-020250-etc_pam.d_system-auth-attrs"
    name: "RHEL 8 must implement smart card logon for multifactor authentication for access to interactive accounts. (/etc/pam.d/system-auth: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020250, V-230372, SV-230372r1262209_rule, CAT II. CCI-000765. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/pam.d/system-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: *rat-53f107cdcc
    remediation: *rem-9044df2ca3
  - id: "STIG-RHEL-08-020250-etc_pam.d_system-auth-content"
    name: "RHEL 8 must implement smart card logon for multifactor authentication for access to interactive accounts. (/etc/pam.d/system-auth has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020250, V-230372, SV-230372r1262209_rule, CAT II. CCI-000765. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/pam.d/system-auth'
    allow_rc: any
    expect: { some: "~ ^auth.*\\spam_sss.so [try_cert_auth|require_cert_auth]" }
    rationale: *rat-53f107cdcc
    remediation: *rem-9044df2ca3
  - id: "STIG-RHEL-08-020250-sssd_smart_card-attrs"
    name: "RHEL 8 must implement smart card logon for multifactor authentication for access to interactive accounts. (/etc/sssd/sssd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020250, V-230372, SV-230372r1262209_rule, CAT II. CCI-000765. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/sssd/sssd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: *rat-53f107cdcc
    remediation: *rem-9044df2ca3
  - id: "STIG-RHEL-08-020250-sssd_smart_card-content"
    name: "RHEL 8 must implement smart card logon for multifactor authentication for access to interactive accounts. (/etc/sssd/sssd.conf has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020250, V-230372, SV-230372r1262209_rule, CAT II. CCI-000765. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/sssd/sssd.conf'
    allow_rc: any
    expect:
      - { some: "~ ^pam_cert_auth = [tT]rue" }
      - { none: "~ ^pam_cert_auth = [fF]alse" }
    rationale: *rat-53f107cdcc
    remediation: *rem-9044df2ca3
  - id: "STIG-RHEL-08-020260-etc_default_useradd-attrs"
    name: "RHEL 8 account identifiers (individuals, groups, roles, and devices) must be disabled after 35 days of inactivity. (/etc/default/useradd: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020260, V-230373, SV-230373r1262210_rule, CAT II. CCI-000795. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/default/useradd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-49c60be448 |
      Inactive identifiers pose a risk to systems and applications because attackers may exploit an inactive identifier and potentially obtain undetected access to the system. Owners of inactive accounts will not notice if unauthorized access to their user account has been obtained.

      RHEL 8 needs to track periods of inactivity and disable application identifiers after 35 days of inactivity.
    remediation: &rem-dbdd25cc47 |
      Configure RHEL 8 to disable account identifiers after 35 days of inactivity after the password expiration.

      Run the following command to change the configuration for useradd:

      $ sudo useradd -D -f 35

      DoW recommendation is 35 days, but a lower value is acceptable. The value "-1" will disable this feature, and "0" will disable the account immediately after the password expires.
  - id: "STIG-RHEL-08-020260-etc_default_useradd-content"
    name: "RHEL 8 account identifiers (individuals, groups, roles, and devices) must be disabled after 35 days of inactivity. (/etc/default/useradd has the expected content (3 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020260, V-230373, SV-230373r1262210_rule, CAT II. CCI-000795. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/default/useradd'
    allow_rc: any
    expect:
      - { some: "~ ^INACTIVE=([1-9]|[1-2][0-9]|3[0-5])$" }
      - { none: "~ ^INACTIVE.*-" }
      - { none: "~ ^INACTIVE=(3[6-9]|[4-9][0-9]|[1-9][0-9]{2,9})" }
    rationale: *rat-49c60be448
    remediation: *rem-dbdd25cc47
  - id: "STIG-RHEL-08-020270-emergency_user_72"
    name: "RHEL 8 must automatically expire temporary accounts within 72 hours."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020270, V-230374, SV-230374r1069293_rule, CAT II. CCI-001682. NIST SP 800-53 Rev. 4: AC-2."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      echo "Please check for Temporary accounts"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Please check for Temporary accounts" }
    rationale: &rat-11aaeaabd1 |
      Temporary accounts are privileged or nonprivileged accounts that are established during pressing circumstances, such as new software or hardware configuration or an incident response, where the need for prompt account activation requires bypassing normal account authorization procedures. If any inactive temporary accounts are left enabled on the system and are not either manually removed or automatically expired within 72 hours, the security posture of the system will be degraded and exposed to exploitation by unauthorized users or insider threat actors.

      Temporary accounts are different from emergency accounts. Emergency accounts, also known as "last resort" or "break glass" accounts, are local logon accounts enabled on the system for emergency use by authorized system administrators to manage a system when standard logon methods are failing or not available. Emergency accounts are not subject to manual removal or scheduled expiration requirements.

      The automatic expiration of temporary accounts may be extended as needed by the circumstances but it must not be extended indefinitely. A documented permanent account should be established for privileged users who need long-term maintenance accounts.
    remediation: &rem-c02bbdb450 |
      Configure the operating system to expire temporary accounts after 72 hours with the following command:

           $ sudo chage -E $(date -d +3days +%Y-%m-%d) <temporary_account_name>
  - id: "STIG-RHEL-08-020280-pwquality_conf_ocredit"
    name: "All RHEL 8 passwords must contain at least one special character."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020280, V-230375, SV-230375r1017187_rule, CAT II. CCI-001619. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -iR ocredit /etc/security/pwquality.conf*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*:(\\s|)ocredit = -1$" }
      - { none: "~ .*:(\\s|)ocredit = \\d.*" }
    rationale: &rat-2f4a038086 |
      Use of a complex password helps to increase the time and resources required to compromise the password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks.

      Password complexity is one factor of several that determines how long it takes to crack a password. The more complex the password, the greater the number of possible combinations that need to be tested before the password is compromised.

      RHEL 8 utilizes "pwquality" as a mechanism to enforce password complexity. Note that to require special characters without degrading the "minlen" value, the credit value must be expressed as a negative number in "/etc/security/pwquality.conf".
    remediation: &rem-0276b855b0 |
      Configure the operating system to enforce password complexity by requiring that at least one special character be used by setting the "ocredit" option.

      Add the following line to /etc/security/pwquality.conf (or modify the line to have the required value):

      ocredit = -1

      Remove any configurations that conflict with the above value.
  - id: "STIG-RHEL-08-020290-sssd_limit_cache-attrs"
    name: "RHEL 8 must prohibit the use of cached authentications after one day. (/etc/sssd/sssd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020290, V-230376, SV-230376r1069307_rule, CAT II. CCI-002007. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/sssd/sssd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d35ae3a08b |
      If cached authentication information is out-of-date, the validity of the authentication information may be questionable.

      RHEL 8 includes multiple options for configuring authentication, but this requirement will be focus on the System Security Services Daemon (SSSD). By default sssd does not cache credentials.
    remediation: &rem-3f951c1d09 |
      Configure the SSSD to prohibit the use of cached authentications after one day.

      Add or change the following line in "/etc/sssd/sssd.conf" just below the line "[pam]".

           offline_credentials_expiration = 1
  - id: "STIG-RHEL-08-020290-sssd_limit_cache-content"
    name: "RHEL 8 must prohibit the use of cached authentications after one day. (/etc/sssd/sssd.conf has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020290, V-230376, SV-230376r1069307_rule, CAT II. CCI-002007. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/sssd/sssd.conf'
    allow_rc: any
    expect:
      - { some: "~ ^cache_credentials = [Tt]rue.*offline_credentials_expiration = 1" }
      - { some: "~ ^cache_credentials = [Ff]alse$" }
    rationale: *rat-d35ae3a08b
    remediation: *rem-3f951c1d09
  - id: "STIG-RHEL-08-020300-pwquality_conf_dictcheck"
    name: "RHEL 8 must prevent the use of dictionary words for passwords."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020300, V-230377, SV-230377r1017188_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -iR dictcheck /etc/security/pwquality.conf*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*:(\\s|)dictcheck(.=.|=)1$" }
      - { none: "~ .*:(\\s|)dictcheck(.=.|=)0$" }
    rationale: &rat-398d2982cb |
      If RHEL 8 allows the user to select passwords based on dictionary words, this increases the chances of password compromise by increasing the opportunity for successful guesses, and brute-force attacks.
    remediation: &rem-8e949e22d8 |
      Configure RHEL 8 to prevent the use of dictionary words for passwords.

      Add or update the following line in the "/etc/security/pwquality.conf" file or a configuration file in the /etc/pwquality.conf.d/ directory to contain the "dictcheck" parameter:

      dictcheck=1

      Remove any configurations that conflict with the above value.
  - id: "STIG-RHEL-08-020310-login_defs_fail_delay"
    name: "RHEL 8 must enforce a delay of at least four seconds between logon prompts following a failed logon attempt."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020310, V-230378, SV-230378r1262211_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i fail_delay /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^FAIL_DELAY [4-5]$" }
      - { none: "~ ^FAIL_DELAY [0-3]$" }
    rationale: &rat-994d4e607e |
      Configuring the operating system to implement organization-wide security implementation guides and security checklists verifies compliance with federal standards and establishes a common security baseline across the DoW that reflects the most restrictive security posture consistent with operational requirements.

      Configuration settings are the set of parameters that can be changed in hardware, software, or firmware components of the system that affect the security posture and/or functionality of the system. Security-related parameters are those parameters impacting the security state of the system, including the parameters required to satisfy other security control requirements. Security-related parameters include, for example, registry settings; account, file, and directory permission settings; and settings for functions, ports, protocols, services, and remote connections.
    remediation: &rem-45e1dbea67 |
      Configure the operating system to enforce a delay of at least four seconds between logon prompts following a failed console logon attempt.

      Modify the "/etc/login.defs" file to set the "FAIL_DELAY" parameter to "4" or greater:

      FAIL_DELAY 4
  - id: "STIG-RHEL-08-020320-validate_sys_acct"
    name: "RHEL 8 must not have unnecessary accounts. (example games acct)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020320, V-230379, SV-230379r1017190_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      awk -F : '{print $1 }' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^games" }
    rationale: &rat-2c770a563c |
      Accounts providing no operational purpose provide additional opportunities for system compromise. Unnecessary accounts include user accounts for individuals not requiring access to the system and application accounts for applications not installed on the system.
    remediation: &rem-ebd1ae02cc |
      Remove unauthorized local interactive user accounts with the following command where <unauthorized_user> is the unauthorized account:

      $ sudo userdel <unauthorized_user>
  - id: "STIG-RHEL-08-020320-validate_sys_acct_echo"
    name: "RHEL 8 must not have unnecessary accounts. (manual check required)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020320, V-230379, SV-230379r1017190_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      echo "Please validate system accounts"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Please validate system accounts" }
    rationale: *rat-2c770a563c
    remediation: *rem-ebd1ae02cc
  - id: "STIG-RHEL-08-020350-sshd_config_printlastlog"
    name: "RHEL 8 must display the date and time of the last successful account logon upon an SSH logon."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020350, V-230382, SV-230382r1069309_rule, CAT II. CCI-000052. NIST SP 800-53 Rev. 4: AC-9."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i printlastlog /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^PrintLastLog yes" }
      - { none: "~ (?i)^PrintLastLog no" }
    rationale: &rat-fa32a5bedc |
      Providing users with feedback on when account accesses via SSH last occurred facilitates user recognition and reporting of unauthorized account use.
    remediation: &rem-18fa6d8e29 |
      Configure SSH to provide users with feedback on when account accesses last occurred by setting the required configuration options in "/etc/pam.d/sshd" or in the "sshd_config" file used by the system ("/etc/ssh/sshd_config" will be used in the example) (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor).

      Modify the "PrintLastLog" line in "/etc/ssh/sshd_config" to match the following:

      PrintLastLog yes

      The SSH service must be restarted for changes to "sshd_config" to take effect.
  - id: "STIG-RHEL-08-020351-login_defs_umask"
    name: "RHEL 8 must define default permissions for all authenticated users in such a way that the user can only read and modify their own files."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020351, V-230383, SV-230383r1017192_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i umask /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^UMASK\\s+077$" }
      - { none: "~ ^UMASK [1-7][0-7][0-7]$" }
    rationale: &rat-4ee9105023 |
      Setting the most restrictive default permissions ensures that when new accounts are created, they do not have unnecessary access.
    remediation: &rem-5fa436333a |
      Configure the operating system to define default permissions for all authenticated users in such a way that the user can only read and modify their own files.

      Add or edit the line for the "UMASK" parameter in "/etc/login.defs" file to "077":

      UMASK 077
  - id: "STIG-RHEL-08-020352-validate_unnecessary_echo"
    name: "RHEL 8 must set the umask value to 077 for all local interactive user accounts."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020352, V-230384, SV-230384r1017193_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -ir umask /home/*.* | grep -v '.bash_history'
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ ^.*" }
    rationale: &rat-c762483818 |
      The umask controls the default access mode assigned to newly created files. A umask of 077 limits new files to mode 600 or less permissive. Although umask can be represented as a four-digit number, the first digit representing special access modes is typically ignored or required to be "0". This requirement applies to the globally configured system defaults and the local interactive user defaults for each account on the system.
    remediation: &rem-2ecbdef71f |
      Remove the umask statement from all local interactive user's initialization files.

      If the account is for an application, the requirement for a umask less restrictive than "077" can be documented with the Information System Security Officer, but the user agreement for access to the account must specify that the local interactive user must log on to their account first and then switch the user to the application account with the correct option to gain the account's environment variables.
  - id: "STIG-RHEL-08-020353-etc_bashrc-attrs"
    name: "RHEL 8 must define default permissions for logon and non-logon shells. (/etc/bashrc: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020353, V-230385, SV-230385r1017194_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
