      grep -i ^localpkg_gpgcheck /etc/dnf/dnf.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^localpkg_gpgcheck.*(1|[tT]rue|yes)" }
      - { none: "~ ^localpkg_gpgcheck.*(0|[fF]alse|no)" }
    rationale: *rat-22309dab7f
    remediation: &rem-99a7a71a3a |
      Configure the operating system to remove all software components after updated versions have been installed.

      Set the "localpkg_gpgcheck" option to "True" in the "/etc/dnf/dnf.conf" file:

      localpkg_gpgcheck=1
  - id: "STIG-RHEL-08-010371-localpkg_gpg_check_default"
    name: "RHEL 8 must prevent the installation of software, patches, service packs, device drivers, or operating system components of local packages without verification they have been digitally signed using a certificate that is issued by a Certificate Authority (CA) that is recognized and approved by the organization. (dnf_running)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010371, V-230265, SV-230265r1262200_rule, CAT I. CCI-001749. NIST SP 800-53 Rev. 4: CM-5."
