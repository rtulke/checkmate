  - id: "STIG-RHEL-08-010360-aide_cron_job"
    name: "The RHEL 8 file integrity tool must notify the system administrator when changes to the baseline configuration or anomalies in the operation of any security functions are discovered within an organizationally defined frequency. (cron job)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010360, V-230263, SV-230263r1017083_rule, CAT II. CCI-001744. NIST SP 800-53 Rev. 4: CM-3."
