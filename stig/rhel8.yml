  - id: "STIG-RHEL-08-020140-pwquality_conf_maxclassrepeat"
    name: "RHEL 8 must require the maximum number of repeating characters of the same character class be limited to four when passwords are changed."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020140, V-230360, SV-230360r1017172_rule, CAT II. CCI-000195. NIST SP 800-53 Rev. 4: IA-5."
