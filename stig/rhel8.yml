  - id: "STIG-RHEL-08-030610-auditd_conf_perms"
    name: "RHEL 8 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030610, V-230471, SV-230471r1262175_rule, CAT II. CCI-000171. NIST SP 800-53 Rev. 4: AU-12."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      stat -c "%a"  /etc/audit/rules.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ map\\[le:600\\]" }
    rationale: &rat-c58ed3c65f |
      Without the capability to restrict the roles and individuals that can select which events are audited, unauthorized personnel may be able to prevent the auditing of critical events. Misconfigured audits may degrade the system's performance by overwhelming the audit log. Misconfigured audits may also make it more difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.
    remediation: &rem-95e36e759a |
      Configure the rules files in the directory /etc/audit/rules.d/, the /etc/audit/audit.rules file, and the /etc/audit/auditd.conf file to have a mode of 0600 with the following commands:

      $ sudo find /etc/audit/rules.d/ -type f -name "*.rules" -exec chmod 0600 {} +

      $ sudo chmod 0600 /etc/audit/audit.rules

      $ sudo chmod 0600 /etc/audit/auditd.conf
  - id: "STIG-RHEL-08-030610-auditd_rule_d_perms"
    name: "RHEL 8 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030610, V-230471, SV-230471r1262175_rule, CAT II. CCI-000171. NIST SP 800-53 Rev. 4: AU-12."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      for file in `find /etc/audit/rules.d/ -type f`; do stat -c '%a %n' $file; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^[46]00" }
    rationale: *rat-c58ed3c65f
    remediation: *rem-95e36e759a
  - id: "STIG-RHEL-08-030620-auditd_tools_perms"
    name: "RHEL 8 audit tools must have a mode of 0755 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030620, V-230472, SV-230472r1017263_rule, CAT II. CCI-001493. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      stat -c "%a %n" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/rsyslogd /sbin/augenrules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^7[0,5][0,5]" }
      - { none: "~ ^7[6,7][0-9]" }
    rationale: &rat-934fba6272 |
      Protecting audit information also includes identifying and protecting the tools used to view and manipulate log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information.

      RHEL 8 systems providing tools to interface with audit information will leverage user permissions and roles identifying the user accessing the tools, and the corresponding rights the user enjoys, to make access decisions regarding the access to audit tools.

      Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.
    remediation: &rem-12022d7c73 |
      Configure the audit tools to be protected from unauthorized access by setting the correct permissive mode using the following command:

      $ sudo chmod 0755 [audit_tool]

      Replace "[audit_tool]" with the audit tool that does not have the correct permissive mode.
  - id: "STIG-RHEL-08-030630-auditd_tools_owner"
    name: "RHEL 8 audit tools must be owned by root."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030630, V-230473, SV-230473r1017264_rule, CAT II. CCI-001493. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      stat -c "%U %n" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/rsyslogd /sbin/augenrules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^root" }
    rationale: *rat-934fba6272
    remediation: &rem-251e415fcf |
      Configure the audit tools to be owned by "root", by running the following command:

      $ sudo chown root [audit_tool]

      Replace "[audit_tool]" with each audit tool not owned by "root".
  - id: "STIG-RHEL-08-030640-auditd_tools_group"
    name: "RHEL 8 audit tools must be group-owned by root."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030640, V-230474, SV-230474r1017265_rule, CAT II. CCI-001493. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      stat -c "%G %n" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/rsyslogd /sbin/augenrules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^root" }
    rationale: *rat-934fba6272
    remediation: &rem-dfe4f6c07b |
      Configure the audit tools to be group-owned by "root", by running the following command:

      $ sudo chgrp root [audit_tool]

      Replace "[audit_tool]" with each audit tool not group-owned by "root".
  - id: "STIG-RHEL-08-030650-aide_conf_crypto"
    name: "RHEL 8 must use cryptographic mechanisms to protect the integrity of audit tools."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030650, V-230475, SV-230475r1017266_rule, CAT II. CCI-001496. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -E '(\/usr\/sbin\/(audit|au|rsys))' /etc/aide.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ /usr/sbin/auditctl p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/auditd p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/ausearch p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/aureport p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/autrace p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/rsyslogd p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/augenrules p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
    rationale: &rat-8f123a44ab |
      Protecting the integrity of the tools used for auditing purposes is a critical step toward ensuring the integrity of audit information. Audit information includes all information (e.g., audit records, audit settings, and audit reports) needed to successfully audit information system activity.

      Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.

      It is not uncommon for attackers to replace the audit tools or inject code into the existing tools with the purpose of providing the capability to hide or erase system activity from the audit logs.

      To address this risk, audit tools must be cryptographically signed to provide the capability to identify when the audit tools have been modified, manipulated, or replaced. An example is a checksum hash of the file or files.
    remediation: &rem-dd38335b3e |
      Add or update the following lines to "/etc/aide.conf", to protect the integrity of the audit tools.

      # Audit Tools
      /usr/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/rsyslogd p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512
  - id: "STIG-RHEL-08-030655-cron_audit_rules"
    name: "RHEL 8 must audit any script or executable called by cron as root or by any privileged user. (audit rules for cron directories)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030655, V-274877, SV-274877r1155381_rule, CAT II. CCI-000172. NIST SP 800-53 Rev. 4: AU-12."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      auditctl -l | grep cronjobs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*\\/etc\\/cron\\.d.*-p wa.*-k cronjobs" }
      - { some: "~ .*\\/var\\/spool\\/cron.*-p wa.*-k cronjobs" }
    rationale: &rat-42665d48da |
      Any script or executable called by cron as root or by any privileged user must be owned by that user, must have the permissions set to 755 or more restrictive, and have no extended rights that allow a nonprivileged user to modify the script or executable.
    remediation: &rem-99b7d14a00 |
      Configure RHEL 8 to audit the execution of any system call made by cron as root or as any privileged user.

      Add or update the following file system rules to "/etc/audit/rules.d/audit.rules":
      -w /etc/cron.d/ -p wa -k cronjobs
      -w /var/spool/cron/ -p wa -k cronjobs

      To load the rules to the kernel immediately, use the following command:

      $ sudo augenrules --load
  - id: "STIG-RHEL-08-030660-audit_log_filesystem_manual"
    name: "RHEL 8 must allocate audit record storage capacity to store at least one week of audit records, when audit records are not immediately sent to a central audit record storage facility. (manual check required)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030660, V-230476, SV-230476r958752_rule, CAT II. CCI-001849. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      echo "Please check audit log configuration manually"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Please check audit log configuration manually" }
    rationale: &rat-10c3f306e9 |
      To ensure RHEL 8 systems have a sufficient storage capacity in which to write the audit logs, RHEL 8 needs to be able to allocate audit record storage capacity.

      The task of allocating audit record storage capacity is usually performed during initial installation of RHEL 8.
    remediation: &rem-538e3159a8 |
      Allocate enough storage capacity for at least one week of audit records when audit records are not immediately sent to a central audit record storage facility.

      If audit records are stored on a partition made specifically for audit records, resize the partition with sufficient space to contain one week of audit records.

      If audit records are not stored on a partition made specifically for audit records, a new partition with sufficient space will need be to be created.
  - id: "STIG-RHEL-08-030660-audit_log_filesystem_size"
    name: "RHEL 8 must allocate audit record storage capacity to store at least one week of audit records, when audit records are not immediately sent to a central audit record storage facility. (check filesystem size)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-030660, V-230476, SV-230476r958752_rule, CAT II. CCI-001849. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      audit_log=`grep -w 'log_file =' /etc/audit/auditd.conf | awk '{ print $3}'`; if [ `df -k $audit_log | tail -1 | awk '{print $2}'` -lt '10000000000' ]; then echo "Audit log filesystem less than 10G"; fi
    allow_rc: any
