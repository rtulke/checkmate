  - id: "STIG-RHEL-08-010159-system_auth_pam_unix"
    name: "The RHEL 8 pam_unix.so module must be configured in the system-auth file to use a FIPS 140-2 approved cryptographic hashing algorithm for system authentication."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010159, V-244524, SV-244524r1262188_rule, CAT II. CCI-000803. NIST SP 800-53 Rev. 4: IA-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i pam_unix /etc/pam.d/system-auth
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^password\\s+sufficient\\s+pam_unix.so.*\\ssha512" }
    rationale: &rat-2ab54820a7 |
      Unapproved mechanisms used for authentication to the cryptographic module are not verified and therefore, cannot be relied upon to provide confidentiality or integrity, and DoW data may be compromised.

      RHEL 8 systems utilizing encryption are required to use FIPS-compliant mechanisms for authenticating to cryptographic modules.

      FIPS 140-2 is the current standard for validating that mechanisms used to access cryptographic modules utilize authentication that meets DoW requirements. This allows for Security Levels 1, 2, 3, or 4 for use on a general-purpose computing system.
    remediation: &rem-22d3b92223 |
      Configure RHEL 8 to use a FIPS 140-2 approved cryptographic hashing algorithm for system authentication.

      Edit/modify the following line in the "/etc/pam.d/system-auth" file to include the sha512 option for pam_unix.so:

      password sufficient pam_unix.so sha512
  - id: "STIG-RHEL-08-010160-password_auth_pam_unix"
    name: "The RHEL 8 pam_unix.so module must be configured in the password-auth file to use a FIPS 140-2 approved cryptographic hashing algorithm for system authentication."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010160, V-230237, SV-230237r1262189_rule, CAT II. CCI-000803. NIST SP 800-53 Rev. 4: IA-7."
