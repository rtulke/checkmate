name: DISA STIG Red Hat Enterprise Linux 8
version: "2.9.0"
description: >
  Automated checks for 344 rules of the DISA Security Technical
  Implementation Guide for Red Hat Enterprise Linux 8 (version 2.9.0), converted from the goss
  audit content of the ansible-lockdown project. Severity follows the STIG
  category: CAT I high, CAT II medium, CAT III low. Select categories with
  tags, e.g. `--tags stig-cat-1`.

defaults:
  when: "(facts.distro == \"rhel\" or \"rhel\" in facts.distro_like) and facts.version_major == 8"
  timeout: 120s

checks:
  - id: "STIG-RHEL-08-010000-etc_redhat-release-attrs"
    name: "RHEL 8 must be a vendor-supported release. (/etc/redhat-release: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010000, V-230221, SV-230221r1262181_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      f='/etc/redhat-release'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
  - id: "STIG-RHEL-08-010000-etc_redhat-release-content"
    name: "RHEL 8 must be a vendor-supported release. (/etc/redhat-release has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010000, V-230221, SV-230221r1262181_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      cat '/etc/redhat-release'
    allow_rc: any
    expect: { some: "~ .* 8.10" }
  - id: "STIG-RHEL-08-010015-crypto-policies"
    name: "RHEL 8 must have the crypto-policies package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010015, V-279933, SV-279933r1156352_rule, CAT I. CCI-002450. NIST SP 800-53 Rev. 4: SC-13."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet crypto-policies
    expect: true
  - id: "STIG-RHEL-08-010020-crypto_policy_current"
    name: "RHEL 8 must implement a FIPS 140-3-compliant systemwide cryptographic policy. (CURRENT.pol hash and min_rsa_size)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010020, V-230223, SV-230223r1262171_rule, CAT I. CCI-000068. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      grep -E 'rsa_size|hash' /etc/crypto-policies/state/CURRENT.pol
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ hash.*SHA2-256.*SHA2-384.*SHA2-512" }
      - { some: "~ min_rsa_size\\s*=\\s*2048" }
  - id: "STIG-RHEL-08-010020-crypto_policy_show"
    name: "RHEL 8 must implement a FIPS 140-3-compliant systemwide cryptographic policy. (update-crypto-policies --show)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010020, V-230223, SV-230223r1262171_rule, CAT I. CCI-000068. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
