  - id: "STIG-RHEL-08-040270-net.ipv4.conf.default.send_redirects"
    name: "RHEL 8 must not allow interfaces to perform Internet Control Message Protocol (ICMP) redirects by default. (live_check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040270, V-230543, SV-230543r1017305_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
