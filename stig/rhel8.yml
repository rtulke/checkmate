      - { some: "~ ^localpkg_gpgcheck.*(1|[tT]rue|yes)" }
      - { none: "~ ^localpkg_gpgcheck.*(0|[fF]alse|no)" }
    rationale: *rat-22309dab7f
    remediation: *rem-99a7a71a3a
  - id: "STIG-RHEL-08-010460-shosts_equiv_check"
    name: "There must be no shosts.equiv files on the RHEL 8 operating system."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010460, V-230283, SV-230283r1017094_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    timeout: 120000ms
    run: |
      find / -name shosts.equiv
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-4acff0f014 |
      The "shosts.equiv" files are used to configure host-based authentication for the system via SSH. Host-based authentication is not sufficient for preventing unauthorized access to the system, as it does not require interactive identification and authentication of a connection request, or for the use of two-factor authentication.
    remediation: &rem-85678b18a6 |
      Remove any found "shosts.equiv" files from the system.

      $ sudo rm /etc/ssh/shosts.equiv
  - id: "STIG-RHEL-08-010470-shosts_check"
    name: "There must be no .shosts files on the RHEL 8 operating system."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010470, V-230284, SV-230284r1017095_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    timeout: 120000ms
    run: |
      find / -name "*.shosts"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-cca815f945 |
      The ".shosts" files are used to configure host-based authentication for individual users or the system via SSH. Host-based authentication is not sufficient for preventing unauthorized access to the system, as it does not require interactive identification and authentication of a connection request, or for the use of two-factor authentication.
    remediation: &rem-c61e619c1c |
      Remove any found ".shosts" files from the system.

      $ sudo rm /[path]/[to]/[file]/.shosts
  - id: "STIG-RHEL-08-020330-sshd_config_empty_passwd"
    name: "RHEL 8 must not allow accounts configured with blank or null passwords."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020330, V-230380, SV-230380r1069308_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      grep -i emptypasswords /etc/ssh/sshd_config /etc/ssh/ssh_config.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:PermitEmptyPasswords.*no" }
      - { none: "~ .*:PermitEmptyPasswords.*yes" }
    rationale: *rat-050a0575c0
    remediation: &rem-957cf1ec6a |
      Edit the following line in "etc/ssh/sshd_config" to prevent logons with empty passwords.

      PermitEmptyPasswords no

      The SSH daemon must be restarted for the changes to take effect. To restart the SSH daemon, run the following command:

      $ sudo systemctl restart sshd.service
  - id: "STIG-RHEL-08-020331-system_auth_nullok"
    name: "RHEL 8 must not allow blank or null passwords in the system-auth file."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020331, V-268322, SV-268322r1017568_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      grep -i nullok /etc/pam.d/system-auth
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: *rat-050a0575c0
    remediation: &rem-0050bdb6c2 |
      Remove any instances of the "nullok" option in the "/etc/pam.d/system-auth" file to prevent logons with empty passwords.

      Note: Manual changes to the listed file may be overwritten by the "authselect" program.
  - id: "STIG-RHEL-08-020332-password_auth_nullok"
    name: "RHEL 8 must not allow blank or null passwords in the password-auth file."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-020332, V-244541, SV-244541r1017347_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      grep -i nullok /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: *rat-050a0575c0
    remediation: &rem-a6284a84cd |
      Remove any instances of the "nullok" option in the "/etc/pam.d/password-auth" file to prevent logons with empty passwords.

      Note: Manual changes to the listed file may be overwritten by the "authselect" program.
  - id: "STIG-RHEL-08-040000-telnet-server"
    name: "RHEL 8 must not have the telnet-server package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040000, V-230487, SV-230487r1017271_rule, CAT I. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet telnet-server
    expect: false
    rationale: &rat-c3c6ece09f |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      Operating systems are capable of providing a wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary to support essential organizational operations (e.g., key missions, functions).

      Examples of non-essential capabilities include, but are not limited to, games, software packages, tools, and demonstration software not related to requirements or providing a wide array of functionality not required for every mission, but which cannot be disabled.

      Verify the operating system is configured to disable non-essential capabilities. The most secure way of ensuring a non-essential capability is disabled is to not have the capability installed.

      The telnet service provides an unencrypted remote access service that does not provide for the confidentiality and integrity of user passwords or the remote session.

      If a privileged user were to log on using this service, the privileged user password could be compromised.
    remediation: &rem-a9cbb1affa |
      Configure the operating system to disable non-essential capabilities by removing the telnet-server package from the system with the following command:

      $ sudo yum remove telnet-server
  - id: "STIG-RHEL-08-040170-ctrl_alt_del"
    name: "The x86 Ctrl-Alt-Delete key sequence must be disabled on RHEL 8."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040170, V-230529, SV-230529r1017289_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      systemctl status ctrl-alt-del.target
    allow_rc: any
    expect:
      - { rc: "== 3" }
      - { some: "~ \\s*Loaded.*masked*" }
    rationale: &rat-a3d43e95b7 |
      A locally logged-on user, who presses Ctrl-Alt-Delete when at the console, can reboot the system. If accidentally pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term loss of availability of systems due to unintentional reboot. In a graphical user environment, risk of unintentional reboot from the Ctrl-Alt-Delete sequence is reduced because the user will be prompted before any action is taken.
    remediation: &rem-7b85d24445 |
      Configure the system to disable the Ctrl-Alt-Delete sequence for the command line with the following commands:

      $ sudo systemctl disable ctrl-alt-del.target

      $ sudo systemctl mask ctrl-alt-del.target

      Created symlink /etc/systemd/system/ctrl-alt-del.target -> /dev/null

      Reload the daemon for this change to take effect.

      $ sudo systemctl daemon-reload
  - id: "STIG-RHEL-08-040172-etc_systemd_system.conf.d_55-CtrlAltDel--attrs"
    name: "The systemd Ctrl-Alt-Delete burst key sequence in RHEL 8 must be disabled. (/etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040172, V-230531, SV-230531r1262161_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      f='/etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d0d038d026 |
      A locally logged-on user who presses Ctrl-Alt-Delete when at the console can reboot the system. If accidentally pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term loss of availability of systems due to unintentional reboot. In a graphical user environment, risk of unintentional reboot from the Ctrl-Alt-Delete sequence is reduced because the user will be prompted before any action is taken.
    remediation: &rem-605a469513 |
      Configure RHEL 8 to disable the CtrlAltDelBurstAction by adding it to a drop file in a "/etc/systemd/system.conf.d/" configuration file:

      If no drop file exists, create one with the following command:

      $ sudo mkdir -p /etc/systemd/system.conf.d && sudo vi /etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.conf

      Edit the file to contain the setting by adding the following text:

      [Manager]
      CtrlAltDelBurstAction=none

      Reload the daemon for this change to take effect.

      $ sudo systemctl daemon-reload
  - id: "STIG-RHEL-08-040172-etc_systemd_system.conf.d_55-CtrlAltDel--content"
    name: "The systemd Ctrl-Alt-Delete burst key sequence in RHEL 8 must be disabled. (/etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.conf has the exp…)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040172, V-230531, SV-230531r1262161_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      cat '/etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.conf'
    allow_rc: any
    expect: { some: "~ ^CtrlAltDelBurstAction=none" }
    rationale: *rat-d0d038d026
    remediation: *rem-605a469513
  - id: "STIG-RHEL-08-040190-tftp-server"
    name: "The Trivial File Transfer Protocol (TFTP) server package must not be installed if not required for RHEL 8 operational support."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040190, V-230533, SV-230533r1017295_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet tftp-server
    expect: false
    rationale: &rat-e9a6e4f0c0 |
      If TFTP is required for operational support (such as the transmission of router configurations) its use must be documented with the Information System Security Officer (ISSO), restricted to only authorized personnel, and have access control rules established.
    remediation: &rem-295bbba87a |
      Remove the TFTP package from the system with the following command:

      $ sudo yum remove tftp-server
  - id: "STIG-RHEL-08-040200-root_only_uid"
    name: "The root account must be the only account having unrestricted access to the RHEL 8 system."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040200, V-230534, SV-230534r1017296_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      awk -F: '$3 == 0 {print $1}' /etc/passwd | grep -v root
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ .*" }
    rationale: &rat-a5861790d4 |
      If an account other than root also has a User Identifier (UID) of "0", it has root authority, giving that account unrestricted access to the entire operating system. Multiple accounts with a UID of "0" afford an opportunity for potential intruders to guess a password for a privileged account.
    remediation: &rem-5be607ea69 |
      Change the UID of any account on the system, other than root, that has a UID of "0".

      If the account is associated with system commands or applications, the UID should be changed to one greater than "0" but less than "1000". Otherwise, assign a UID of greater than "1000" that has not already been assigned.
  - id: "STIG-RHEL-08-040360-vsftpd"
    name: "A File Transfer Protocol (FTP) server package must not be installed unless mission essential on RHEL 8."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040360, V-230558, SV-230558r1017320_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet vsftpd
    expect: false
    rationale: &rat-aa7827d3b4 |
      The FTP service provides an unencrypted remote access that does not provide for the confidentiality and integrity of user passwords or the remote session. If a privileged user were to log on using this service, the privileged user password could be compromised. SSH or other encrypted file transfer methods must be used in place of this service.
    remediation: &rem-8fa491e901 |
      Document the FTP server package with the ISSO as an operational requirement or remove it from the system with the following command:

      $ sudo yum remove vsftpd
  - id: "STIG-RHEL-08-010010-dnf_check_updates"
    name: "RHEL 8 vendor packaged system security patches and updates must be installed and up to date."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010010, V-230222, SV-230222r1184233_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      dnf check-update | grep -v Last | grep -cE "\.noarch|\.x86_64|\.386"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^0" }
      - { none: "~ ^[1-9]" }
    rationale: &rat-2d5b3d6c09 |
      Timely patching is critical for maintaining the operational availability, confidentiality, and integrity of information technology (IT) systems. However, failure to keep operating system and application software patched is a common mistake made by IT professionals. New patches are released daily, and it is often difficult for even experienced System Administrators to keep abreast of all the new patches. When new weaknesses in an operating system exist, patches are usually made available by the vendor to resolve the problems. If the most recent security patches and updates are not installed, unauthorized users may take advantage of weaknesses in the unpatched software. The lack of prompt attention to patching could result in a system compromise.
    remediation: &rem-f15f3100dc |
      Install the operating system patches or updated packages available from Red Hat within 30 days or sooner as local policy dictates.
  - id: "STIG-RHEL-08-010040-check_login_banner-attrs"
    name: "RHEL 8 must display the Standard Mandatory DoW Notice and Consent Banner before granting local or remote access to the system via a ssh logon. (/etc/issue: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010040, V-230225, SV-230225r1262182_rule, CAT II. CCI-000048. NIST SP 800-53 Rev. 4: AC-8."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-fadba4df7d |
      Display of a standardized and approved use notification before granting access to the operating system ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies, regulations, standards, and guidance.

      System use notifications are required only for access via logon interfaces with human users and are not required when such human interfaces do not exist.

      The banner must be formatted in accordance with applicable DoW policy. Use the following verbiage for operating systems that can accommodate banners of 1300 characters:

      "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.

      By using this IS (which includes any device attached to this IS), you consent to the following conditions:

      -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.

      -At any time, the USG may inspect and seize data stored on this IS.

      -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.

      -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.

      -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details."

      Use the following verbiage for operating systems that have severe limitations on the number of characters that can be displayed in the banner:

      "I've read & consent to terms in IS user agreem't."
    remediation: &rem-81bcfe1b78 |
      Configure the operating system to display the Standard Mandatory DoW Notice and Consent Banner before granting access to the system via the ssh.

      Edit the "/etc/ssh/sshd_config" file to uncomment the banner keyword and configure it to point to a file that will contain the logon banner (this file may be named differently or be in a different location if using a version of SSH that is provided by a third-party vendor). An example configuration line is:

      banner /etc/issue

      Either create the file containing the banner or replace the text in the file with the Standard Mandatory DoW Notice and Consent Banner. The DoW-required text is:

      "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.

      By using this IS (which includes any device attached to this IS), you consent to the following conditions:

      -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.

      -At any time, the USG may inspect and seize data stored on this IS.

      -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.

      -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.

      -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details."

      The SSH service must be restarted for changes to take effect.
