  - id: "STIG-RHEL-08-010297-crypto_policies_openssh_config_ciphers-content"
    name: "The RHEL 8 SSH client must be configured to use only DoW-approved encryption ciphers employing FIPS 140-3-validated cryptographic hash algorithms to protect the confidentiality of SSH client connections. (/etc/crypto-policies/back-ends/openssh.config has the expected conten…)"
