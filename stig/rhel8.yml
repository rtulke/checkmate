      - { none: "~ .*[1-9][0-9]*$" }
    rationale: *rat-22309dab7f
    remediation: *rem-6df586d1fd
  - id: "STIG-RHEL-08-010371-dnf_conf_localpkg"
    name: "RHEL 8 must prevent the installation of software, patches, service packs, device drivers, or operating system components of local packages without verification they have been digitally signed using a certificate that is issued by a Certificate Authority (CA) that is recognized and approved by the organization. (dnf_conf)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010371, V-230265, SV-230265r1262200_rule, CAT I. CCI-001749. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel8, stig-cat-1]
