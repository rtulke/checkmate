    severity: medium
    run: |
      systemctl show -p ActiveState debug-shell | cut -d= -f2
    expect: "!= active"
    rationale: *rat-ee96b7199c
    remediation: *rem-38a86f9f96
  - id: "STIG-RHEL-08-040180-etc_systemd_system_debug-shell.service-attrs"
    name: "The debug-shell systemd service must be disabled on RHEL 8. (service masked)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040180, V-230532, SV-230532r1017294_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/systemd/system/debug-shell.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: *rat-ee96b7199c
    remediation: *rem-38a86f9f96
  - id: "STIG-RHEL-08-040209-net.ipv4.conf.default.accept_redirects"
    name: "RHEL 8 must prevent IPv4 Internet Control Message Protocol (ICMP) redirect messages from being accepted. (live_check)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040209, V-244550, SV-244550r1017350_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.default.accept_redirects
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-9bf1388d9b |
      ICMP redirect messages are used by routers to inform hosts that a more direct route exists for a particular destination. These messages modify the host's route table and are unauthenticated. An illicit ICMP redirect message could result in a man-in-the-middle attack.

