  - id: "STIG-RHEL-08-040300-etc_aide_conf_extended_attrib"
    name: "The RHEL 8 file integrity tool must be configured to verify extended attributes."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040300, V-230551, SV-230551r1017313_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-3]
    severity: low
    run: |
      grep -Ei 'xattrs|FIPSR' /etc/aide.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(ALL|FIPSR)( |)=.*\\+xattr.*" }
      - { some: "~ ^(\\/bin All|EVERYTHING = FIPSR)" }
      - { some: "~ ^(\\/sbin All|EVERYTHING = FIPSR)" }
    rationale: &rat-39ecf7b15b |
      Extended attributes in file systems are used to contain arbitrary data and file metadata with security implications.

      RHEL 8 installation media come with a file integrity tool, Advanced Intrusion Detection Environment (AIDE).
    remediation: &rem-7a5e79fdd1 |
      Configure the file integrity tool to check file and directory extended attributes.

      If AIDE is installed, ensure the "xattrs" rule is present on all uncommented file and directory selection lists.
  - id: "STIG-RHEL-08-040310-aide_conf_acl"
    name: "The RHEL 8 file integrity tool must be configured to verify Access Control Lists (ACLs)."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040310, V-230552, SV-230552r1101902_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-3]
    severity: low
    run: |
      grep -i acl /etc/aide.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^[^#].*=.*\\+acl.*" }
      - { none: "~ ^[^#].*=.*-acl.*" }
    rationale: &rat-99ed26d721 |
      ACLs can provide permissions beyond those permitted through the file mode and must be verified by file integrity tools.

      Selection lines in the aide.conf file determine which files and directories AIDE will monitor for changes. They follow this format:

      <path> <rules>

      The <path> specifies a file, directory or wildcard pattern to monitor.
      The <rules>define which attributes (hashes, permissions, timestamps, etc.) to check.

      RHEL 8 installation media come with a file integrity tool, Advanced Intrusion Detection Environment (AIDE).
    remediation: &rem-c9b6513ef2 |
      Configure the file integrity tool to check file and directory ACLs.

      If AIDE is installed, ensure the "acl" rule is present on all file and directory selection lists.
