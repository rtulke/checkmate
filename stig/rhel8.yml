  - id: "STIG-RHEL-08-040004-default_grub_pti"
    name: "RHEL 8 must enable mitigations against processor-based vulnerabilities. (config)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040004, V-230491, SV-230491r1017274_rule, CAT III. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel8, stig-cat-3]
    severity: low
    run: |
      grep pti /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX=.*pti=on.*" }
      - { none: "~ ^GRUB_CMDLINE_LINUX=.*pti=off.*" }
    rationale: &rat-eb8acc7ac3 |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      Operating systems are capable of providing a wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary to support essential organizational operations (e.g., key missions, functions).

      Examples of non-essential capabilities include, but are not limited to, games, software packages, tools, and demonstration software not related to requirements or providing a wide array of functionality not required for every mission, but which cannot be disabled.

      Verify the operating system is configured to disable non-essential capabilities. The most secure way of ensuring a non-essential capability is disabled is to not have the capability installed.

      Kernel page-table isolation is a kernel feature that mitigates the Meltdown security vulnerability and hardens the kernel against attempts to bypass kernel address space layout randomization (KASLR).
    remediation: &rem-a7ecfb05cc |
      Configure RHEL 8 to enable kernel page-table isolation with the following command:

      $ sudo grubby --update-kernel=ALL --args="pti=on"

      Add or modify the following line in "/etc/default/grub" to ensure the configuration survives kernel updates:

      GRUB_CMDLINE_LINUX="pti=on"
  - id: "STIG-RHEL-08-040004-grub_pti_check"
    name: "RHEL 8 must enable mitigations against processor-based vulnerabilities. (running grub)"
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040004, V-230491, SV-230491r1017274_rule, CAT III. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel8, stig-cat-3]
    severity: low
    run: |
      grub2-editenv list | grep pti
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^kernelopts.*\\spti=on.*" }
      - { none: "~ ^kernelopts=.*\\spti=off.*" }
    rationale: *rat-eb8acc7ac3
    remediation: *rem-a7ecfb05cc
  - id: "STIG-RHEL-08-040021-ATM_modprobe"
    name: "RHEL 8 must disable the asynchronous transfer mode (ATM) protocol."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-040021, V-230494, SV-230494r1069310_rule, CAT III. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel8, stig-cat-3]
    severity: low
    run: |
      grep -ri atm /etc/modprobe.d/* | grep -v '#'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^.*:install atm \\/bin\\/false" }
      - { some: "~ (?i)^.*:blacklist atm" }
      - { none: "~ (?i)^.*:install atm \\/bin\\/true" }
    rationale: &rat-4937fc1630 |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      Failing to disconnect unused protocols can result in a system compromise.

      The Asynchronous Transfer Mode (ATM) is a protocol operating on network, data link, and physical layers, based on virtual circuits and virtual paths. Disabling ATM protects the system against exploitation of any laws in its implementation.
    remediation: &rem-8c2f56efdc |
      Configure the operating system to disable the ability to use the ATM protocol kernel module.

      Add or update the following lines in the file "/etc/modprobe.d/blacklist.conf":

           install atm /bin/false
           blacklist atm

      Reboot the system for the settings to take effect.
