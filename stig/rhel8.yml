      password sufficient pam_unix.so sha512
  - id: "STIG-RHEL-08-010161-nodaemons_using_krb5"
    name: "RHEL 8 must prevent system daemons from using Kerberos for authentication."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010161, V-230238, SV-230238r1262190_rule, CAT II. CCI-000803. NIST SP 800-53 Rev. 4: IA-7."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      find /etc -name *.keytab
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-7d3a9ef7fd |
      Unapproved mechanisms used for authentication to the cryptographic module are not verified and therefore, cannot be relied upon to provide confidentiality or integrity, and DoW data may be compromised.

      RHEL 8 systems utilizing encryption are required to use FIPS-compliant mechanisms for authenticating to cryptographic modules.

      The key derivation function (KDF) in Kerberos is not FIPS compatible.  Ensuring the system does not have any keytab files present prevents system daemons from using Kerberos for authentication.  A keytab is a file containing pairs of Kerberos principals and encrypted keys.

      FIPS 140-2 is the current standard for validating that mechanisms used to access cryptographic modules utilize authentication that meets DoW requirements. This allows for Security Levels 1, 2, 3, or 4 for use on a general-purpose computing system.
    remediation: &rem-c7af367626 |
      Configure RHEL 8 to prevent system daemons from using Kerberos for authentication.

      Remove any files with the .keytab extension from the operating system.
  - id: "STIG-RHEL-08-010162-krb5-workstation"
