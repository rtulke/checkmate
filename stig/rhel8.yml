  - id: "STIG-RHEL-08-010672-etc_systemd_system_systemd-coredump.sock-attrs"
    name: "RHEL 8 must disable acquiring, saving, and processing core dumps."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010672, V-230312, SV-230312r1134877_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      f='/etc/systemd/system/systemd-coredump.socket'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: *rat-f64b42d91a
    remediation: *rem-c469782b68
  - id: "STIG-RHEL-08-010673-hard_core_check"
    name: "RHEL 8 must disable core dumps for all users."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010673, V-230313, SV-230313r1155379_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -r -s '^[^#].*core' /etc/security/limits.conf /etc/security/limits.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^.*\\:\\*\\s+hard\\s+core\\s+0" }
      - { none: "~ ^.*\\:\\* hard core [1-9][0-9]{2,6}" }
    rationale: &rat-a113095994 |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore, may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      A core dump includes a memory image taken at the time the operating system terminates an application. The memory image could contain sensitive data and is generally useful only for developers trying to debug problems.
    remediation: &rem-5c2d7ccfd1 |
      Configure the operating system to disable core dumps for all users.

      Add the following line to the top of the /etc/security/limits.conf or in a single ".conf" file defined in /etc/security/limits.d/:

      * hard core 0

      Remove or comment out any entries for users or groups with a value set to anything other than "0".
  - id: "STIG-RHEL-08-010674-coredump_conf_storage"
    name: "RHEL 8 must disable storing core dumps."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010674, V-230314, SV-230314r1134881_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel8, stig-cat-2]
    severity: medium
    run: |
      grep -i storage /etc/systemd/coredump.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Storage(=|.=.)none" }
      - { none: "~ [^#]Storage=none" }
      - { some: "~ ^Storage(.=.|)[^none]" }
    rationale: &rat-ee487cfe1a |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      A core dump includes a memory image taken at the time the operating system terminates an application. The memory image could contain sensitive data and is generally useful only for developers trying to debug problems.
    remediation: &rem-72fa7e6d0c |
      Configure the operating system to disable storing core dumps for all users.

      Add or modify the following line in /etc/systemd/coredump.conf:

      Storage=none
  - id: "STIG-RHEL-08-010675-coredump_conf_process_max_size"
    name: "RHEL 8 must disable core dump backtraces."
    description: "DISA STIG for Red Hat Enterprise Linux 8, RHEL-08-010675, V-230315, SV-230315r1134883_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
