    name: "RHEL 9 must audit all uses of the kmod command. (/etc/audit/rules.d/audit.rules has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-654105, V-258195, SV-258195r1045370_rule, CAT II. CCI-000130, CCI-000135, CCI-000169, CCI-000172, CCI-002884. NIST SP 800-53 Rev. 4: AU-3, AU-12, MA-4."
