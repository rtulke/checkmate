      $ sudo chgrp root [cron config file]
  - id: "STIG-RHEL-09-232240-worldwrite_dirs_owned"
    name: "All RHEL 9 world-writable directories must be owned by root, sys, bin, or an application user."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232240, V-257928, SV-257928r1268251_rule, CAT II. CCI-001090. NIST SP 800-53 Rev. 4: SC-4."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -type d -perm -0002 -uid +999
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-ce74c4fbcb |
      If a world-writable directory is not owned by root, sys, bin, or an application user identifier (UID), unauthorized users may be able to modify files created by others.

      The only authorized public directories are those temporary directories supplied with the system or those designed to be temporary file repositories. The setting is normally reserved for directories used by the system and by users for temporary file storage, (e.g., /tmp), and for directories requiring global read/write access.
    remediation: &rem-e1d3e2c153 |
      Configure all RHEL 9 public directories to be owned by root or a system account to prevent unauthorized and unintended information transferred via shared system resources.

      Use the following command template to set ownership of public directories to root or a system account:

      $ sudo chown [root or system account] [Public Directory]
  - id: "STIG-RHEL-09-232245-stickybit_public_dirs"
    name: "A sticky bit must be set on all RHEL 9 public directories."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232245, V-257929, SV-257929r1268233_rule, CAT II. CCI-001090. NIST SP 800-53 Rev. 4: SC-4."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -type d -perm -0002 -a ! -perm -1000 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-b0676d35bd |
      Preventing unauthorized information transfers mitigates the risk of information, including encrypted representations of information, produced by the actions of prior users/roles (or the actions of processes acting on behalf of prior users/roles) from being available to any current users/roles (or current processes) that obtain access to shared system resources (e.g., registers, main memory, hard disks) after those resources have been released back to information systems. The control of information in shared resources is also commonly referred to as object reuse and residual information protection.

      This requirement generally applies to the design of an information technology product, but it can also apply to the configuration of particular information system components that are, or use, such products. This can be verified by acceptance/validation processes in DoW or other government agencies.
    remediation: &rem-f282b5461e |
      Configure all world-writable directories to have the sticky bit set to prevent unauthorized and unintended information transferred via shared system resources.

      Set the sticky bit on all world-writable directories using the command, replace "[World-Writable Directory]" with any directory path missing the sticky bit:

      $ chmod a+t [World-Writable Directory]
  - id: "STIG-RHEL-09-232250-all_files_group_owned"
    name: "All RHEL 9 local files and directories must have a valid group owner."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232250, V-257930, SV-257930r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk {'if (NR!=1) print $6'} |  xargs -I '{}' find "{}" -xdev -nogroup
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-e622316cc5 |
      Files without a valid group owner may be unintentionally inherited if a group is assigned the same Group Identifier (GID) as the GID of the files without a valid group owner.
    remediation: &rem-7822a13dba |
      Either remove all files and directories from RHEL 9 that do not have a valid group, or assign a valid group to all files and directories on the system with the "chgrp" command:

      $ sudo chgrp <group> <file>
  - id: "STIG-RHEL-09-232255-all_files_owned"
    name: "All RHEL 9 local files and directories must have a valid owner."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232255, V-257931, SV-257931r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk {'if (NR!=1) print $6'} |  xargs -I '{}' find "{}" -xdev -nouser
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-22238ea2c9 |
      Unowned files and directories may be unintentionally inherited if a user is assigned the same user identifier "UID" as the UID of the unowned files.
    remediation: &rem-495ac8ec1b |
      Either remove all files and directories from the system that do not have a valid user, or assign a valid user to all unowned files and directories on RHEL 9 with the "chown" command:

      $ sudo chown <user> <file>
  - id: "STIG-RHEL-09-232260-device_files_labelled"
    name: "RHEL 9 must be configured so that all system device files are correctly labeled to prevent unauthorized modification."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232260, V-257932, SV-257932r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      find / -context *:unlabeled_t:* \( -type c -o -type b \) -printf "%p %Z\n"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-e158bac301 |
      If an unauthorized or modified device is allowed to exist on the system, there is the possibility the system may perform unintended or unauthorized operations.
    remediation: &rem-13d60fa9b0 |
      Restore the SELinux policy for the affected device file from the system policy database using the following command:

      $ sudo restorecon -v <device_path>

      Substitute "<device_path>" with the path to the affected device file (from the output of the previous commands). An example device file path would be "/dev/ttyUSB0". If the output of the above command does not indicate that the device was relabeled to a more specific SELinux type label, then the SELinux policy of the system must be updated with more specific policy for the device class specified. If a package was used to install support for a device class, that package could be reinstalled using the following command:

      $ sudo dnf reinstall <package_name>

      If a package was not used to install the SELinux policy for a given device class, then it must be generated manually and provide specific type labels.
  - id: "STIG-RHEL-09-232270-shadow_file_perms-attrs"
    name: "RHEL 9 /etc/shadow file must have mode 0000 to prevent unauthorized access."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232270, V-257934, SV-257934r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/shadow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7777)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
    expect: empty
    rationale: *rat-c672b85dd1
    remediation: &rem-160bcdb489 |
      Change the mode of the file "/etc/shadow" to "0000" by running the following command:

      $ sudo chmod 0000 /etc/shadow
  - id: "STIG-RHEL-09-251010-firewalld"
    name: "RHEL 9 must have the firewalld package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-251010, V-257935, SV-257935r1262137_rule, CAT II. CCI-000382, CCI-002314, CCI-002322. NIST SP 800-53 Rev. 4: CM-7, AC-17."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet firewalld
    expect: true
    rationale: &rat-6a28e83f9c |
      "Firewalld" provides an easy and effective way to block/limit remote access to the system via ports, services, and protocols.

      Remote access services, such as those providing remote access to network devices and information systems, which lack automated control capabilities, increase risk and make remote user access management difficult at best.

      Remote access is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      RHEL 9 functionality (e.g., SSH) must be capable of taking enforcement action if the audit reveals unauthorized activity. Automated control of remote access sessions allows organizations to ensure ongoing compliance with remote access policies by enforcing connection rules of remote access applications on a variety of information system components (e.g., servers, workstations, notebook computers, smartphones, and tablets).
    remediation: &rem-55e8001998 |
      To install the "firewalld" package run the following command:

      $ sudo dnf install firewalld
  - id: "STIG-RHEL-09-251015-firewalld-enabled"
    name: "The firewalld service on RHEL 9 must be active. (Service firewalld is enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-251015, V-257936, SV-257936r1262138_rule, CAT II. CCI-000382, CCI-002314. NIST SP 800-53 Rev. 4: CM-7, AC-17."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState firewalld | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-c7bf1d415d |
      "Firewalld" provides an easy and effective way to block/limit remote access to the system via ports, services, and protocols.

      Remote access services, such as those providing remote access to network devices and information systems, which lack automated control capabilities, increase risk and make remote user access management difficult at best.

      Remote access is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, non-organization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      RHEL 9 functionality (e.g., RDP) must be capable of taking enforcement action if the audit reveals unauthorized activity. Automated control of remote access sessions allows organizations to ensure ongoing compliance with remote access policies by enforcing connection rules of remote access applications on a variety of information system components (e.g., servers, workstations, notebook computers, smartphones, and tablets).
    remediation: &rem-f1b1c1b627 |
      To enable the firewalld service run the following command:

      $ sudo systemctl enable --now firewalld
  - id: "STIG-RHEL-09-251015-firewalld-running"
    name: "The firewalld service on RHEL 9 must be active. (Service firewalld is running)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-251015, V-257936, SV-257936r1262138_rule, CAT II. CCI-000382, CCI-002314. NIST SP 800-53 Rev. 4: CM-7, AC-17."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState firewalld | cut -d= -f2
    expect: "== active"
    rationale: *rat-c7bf1d415d
    remediation: *rem-f1b1c1b627
  - id: "STIG-RHEL-09-251020-firewalld_zone_service"
    name: "The RHEL 9 firewall must employ a deny-all, allow-by-exception policy for allowing connections to other systems."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-251020, V-257937, SV-257937r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      firewall-cmd --state && zone_list=`firewall-cmd --get-active-zones | head -1` && for zone in $zone_list; do firewall-cmd --permanent --info-zone=$zone | grep "target:"; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ target: DROP" }
      - { none: "~ target: [^D][^R][^O][^P]" }
    rationale: &rat-844049f630 |
      Failure to restrict network connectivity only to authorized systems permits inbound connections from malicious systems. It also permits outbound connections that may facilitate exfiltration of DoW data.

      RHEL 9 incorporates the "firewalld" daemon, which allows for many different configurations. One of these configurations is zones. Zones can be utilized to a deny-all, allow-by-exception approach. The default "drop" zone will drop all incoming network packets unless it is explicitly allowed by the configuration file or is related to an outgoing network connection.
    remediation: &rem-686cb71e1b |
      Configure the "firewalld" daemon to employ a deny-all, allow-by-exception policy with the following commands:

      Start by adding the exceptions that are required for mission functionality to the "drop" zone. If SSH access on port 22 is needed, for example, run the following: "sudo firewall-cmd --permanent --add-service=ssh --zone=drop"

      Reload the firewall rules to update the runtime configuration from the "--permanent" changes made above:
      $ sudo firewall-cmd --reload

      Set the default zone to the drop zone:
      $ sudo firewall-cmd --set-default-zone=drop
      Note: This is a runtime and permanent change.

      Add any interfaces to the newly modified "drop" zone:
      $ sudo firewall-cmd --permanent --zone=drop --change-interface=ens192

      Reload the firewall rules for changes to take effect:
      $ sudo firewall-cmd --reload
  - id: "STIG-RHEL-09-251030-firewalld_backend-attrs"
    name: "RHEL 9 must protect against or limit the effects of denial-of-service (DoS) attacks by ensuring rate-limiting measures on impacted network interfaces are implemented. (/etc/firewalld/firewalld.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-251030, V-257939, SV-257939r1044997_rule, CAT II. CCI-002385. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/firewalld/firewalld.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-971fbc32b0 |
      DoS is a condition when a resource is not available for legitimate users. When this occurs, the organization either cannot accomplish its mission or must operate at degraded capacity.

      This requirement addresses the configuration of RHEL 9 to mitigate the impact of DoS attacks that have occurred or are ongoing on system availability. For each system, known and potential DoS attacks must be identified and solutions for each type implemented. A variety of technologies exists to limit or, in some cases, eliminate the effects of DoS attacks (e.g., limiting processes or establishing memory partitions). Employing increased capacity and bandwidth, combined with service redundancy, may reduce the susceptibility to some DoS attacks.
    remediation: &rem-bf0c6af582 |
      Configure "nftables" to be the default "firewallbackend" for "firewalld" by adding or editing the following line in "/etc/firewalld/firewalld.conf":

      FirewallBackend=nftables

      Establish rate-limiting rules based on organization-defined types of DoS attacks on impacted network interfaces.
  - id: "STIG-RHEL-09-251030-firewalld_backend-content"
    name: "RHEL 9 must protect against or limit the effects of denial-of-service (DoS) attacks by ensuring rate-limiting measures on impacted network interfaces are implemented. (/etc/firewalld/firewalld.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-251030, V-257939, SV-257939r1044997_rule, CAT II. CCI-002385. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/firewalld/firewalld.conf'
    allow_rc: any
    expect: { some: "~ FirewallBackend\\s*=\\s*nftables" }
    rationale: *rat-971fbc32b0
    remediation: *rem-bf0c6af582
  - id: "STIG-RHEL-09-251035-firewalld_prohibit_manual"
    name: "RHEL 9 must be configured to prohibit or restrict the use of functions, ports, protocols, and/or services, as defined in the Ports, Protocols, and Services Management (PPSM) Category Assignments List (CAL) and vulnerability assessments. (Manual)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-251035, V-257940, SV-257940r1106312_rule, CAT II. CCI-000382. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      echo "MANUAL - Investigation required - Firewalld RHEL-09-251035"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ /MANUAL" }
    rationale: &rat-ce55bef2a9 |
      To prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized tunneling (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary ports, protocols, and services on information systems.
    remediation: &rem-69869de92b |
      Update the host's firewall settings and/or running services to comply with the PPSM CLSA for the site or program and the PPSM CAL.

      Then run the following command to load the newly created rule(s):

      $ sudo firewall-cmd --reload
  - id: "STIG-RHEL-09-251040-network_promicuous"
    name: "RHEL 9 network interfaces must not be in promiscuous mode."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-251040, V-257941, SV-257941r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      ip link | grep -i promisc
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-02384c25e3 |
      Network interfaces in promiscuous mode allow for the capture of all network traffic visible to the system. If unauthorized individuals can access these applications, it may allow them to collect information such as logon IDs, passwords, and key exchanges between systems.

      If the system is being used to perform a network troubleshooting function, the use of these tools must be documented with the information systems security officer (ISSO) and restricted to only authorized personnel.
    remediation: &rem-068ce873a4 |
      Configure network interfaces to turn off promiscuous mode unless approved by the ISSO and documented.

      Set the promiscuous mode of an interface to off with the following command:

      $ sudo ip link set dev <devicename> multicast off promisc off
  - id: "STIG-RHEL-09-251045-berkley_pkt_filter_live"
    name: "RHEL 9 must enable hardening for the Berkeley Packet Filter just-in-time compiler. (live)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-251045, V-257942, SV-257942r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.core.bpf_jit_harden
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 2"
    rationale: &rat-151d004cd8 |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      Enabling hardening for the Berkeley Packet Filter (BPF) Just-in-time (JIT) compiler aids in mitigating JIT spraying attacks. Setting the value to "2" enables JIT hardening for all users.

      The sysctl --system command will load settings from all system configuration files. All configuration files are sorted by their filename in lexicographical order, regardless of the directories in which they reside. If multiple files specify the same option, the entry in the file with the lexicographically latest name will take precedence. Files are read from directories in the following list from top to bottom. Once a file of a given filename is loaded, any file of the same name in subsequent directories is ignored.

      /etc/sysctl.d/*.conf
      /run/sysctl.d/*.conf
      /usr/local/lib/sysctl.d/*.conf
      /usr/lib/sysctl.d/*.conf
      /lib/sysctl.d/*.conf
      /etc/sysctl.conf
    remediation: &rem-2f31bcc48c |
      Configure RHEL 9 to enable hardening for the BPF JIT compiler.

      Create the drop-in file if it does not already exist:

      $ sudo vi /etc/sysctl.d/99-net_core-bpf_jit_harden.conf

      Add the following line to the file:
      net.core.bpf_jit_harden = 2

      Reload settings from all system configuration files with the following command:

      $ sudo sysctl --system
  - id: "STIG-RHEL-09-251045-berkley_pkt_filter_conf"
    name: "RHEL 9 must enable hardening for the Berkeley Packet Filter just-in-time compiler. (conf)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-251045, V-257942, SV-257942r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep net.core.bpf_jit_harden /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^.*conf:net.core.bpf_jit_harden\\s*=\\s*2" }
      - { none: "~ ^.*conf:net.core.bpf_jit_harden\\s*=\\s*[0-1]" }
    rationale: *rat-151d004cd8
    remediation: *rem-2f31bcc48c
  - id: "STIG-RHEL-09-252010-chrony"
    name: "RHEL 9 must have the chrony package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-252010, V-257943, SV-257943r1045001_rule, CAT II. CCI-001891, CCI-004923. NIST SP 800-53 Rev. 4: AU-8."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet chrony
    expect: true
    rationale: &rat-cca230321c |
      Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events. Sources outside the configured acceptable allowance (drift) may be inaccurate.
    remediation: &rem-ec408cf1e5 |
      The chrony package can be installed with the following command:

      $ sudo dnf install chrony
  - id: "STIG-RHEL-09-252015-chronyd-enabled"
    name: "RHEL 9 chronyd service must be enabled. (Service chronyd is enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-252015, V-257944, SV-257944r1038944_rule, CAT II. CCI-001891, CCI-004923. NIST SP 800-53 Rev. 4: AU-8."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState chronyd | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-2a7f887ac5 |
      Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events. Sources outside the configured acceptable allowance (drift) may be inaccurate.

      Synchronizing internal information system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected over a network.
    remediation: &rem-77f031631d |
      To enable the chronyd service run the following command:

      $ sudo systemctl enable --now chronyd
  - id: "STIG-RHEL-09-252015-chronyd-running"
    name: "RHEL 9 chronyd service must be enabled. (Service chronyd is running)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-252015, V-257944, SV-257944r1038944_rule, CAT II. CCI-001891, CCI-004923. NIST SP 800-53 Rev. 4: AU-8."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState chronyd | cut -d= -f2
    expect: "== active"
    rationale: *rat-2a7f887ac5
    remediation: *rem-77f031631d
  - id: "STIG-RHEL-09-252020-chrony_time_check-attrs"
    name: "RHEL 9 must securely compare internal information system clocks at least every 24 hours. (/etc/chrony.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-252020, V-257945, SV-257945r1262140_rule, CAT II. CCI-001890, CCI-001891, CCI-002046, CCI-004923, CCI-004926. NIST SP 800-53 Rev. 4: AU-8."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/chrony.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-cb3af98261 |
      Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events. Sources outside the configured acceptable allowance (drift) may be inaccurate.

      Synchronizing internal information system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected over a network.

      Depending on the infrastructure being used the "pool" directive may not be supported.

      Authoritative time sources include the United States Naval Observatory (USNO) time servers, a time server designated for the appropriate DoW network (NIPRNet/SIPRNet), and/or the Global Positioning System (GPS).
    remediation: &rem-452d87a8a1 |
      Configure RHEL 9 to securely compare internal information system clocks at least every 24 hours with an NTP server by adding/modifying the following line in the /etc/chrony.conf file.

      server [ntp.server.name] iburst maxpoll 16
  - id: "STIG-RHEL-09-252020-chrony_time_check-content"
    name: "RHEL 9 must securely compare internal information system clocks at least every 24 hours. (/etc/chrony.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-252020, V-257945, SV-257945r1262140_rule, CAT II. CCI-001890, CCI-001891, CCI-002046, CCI-004923, CCI-004926. NIST SP 800-53 Rev. 4: AU-8."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/chrony.conf'
    allow_rc: any
    expect: { some: "~ ^server.*maxpoll\\s(1[0-6]|[1-9])\\b" }
    rationale: *rat-cb3af98261
    remediation: *rem-452d87a8a1
  - id: "STIG-RHEL-09-252035-dns_name_servers"
    name: "RHEL 9 systems using Domain Name Servers (DNS) resolution must have at least two name servers configured."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-252035, V-257948, SV-257948r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      r=$(grep -Ei '^nameserver[[:space:]]+' /etc/resolv.conf 2>/dev/null | grep -vcE '127\.0\.0\.53'); s=$(cat /etc/systemd/resolved.conf /etc/systemd/resolved.conf.d/*.conf 2>/dev/null | grep -iE '^[[:space:]]*DNS=' | sed 's/^[^=]*=//' | tr ' ' '\n' | grep -cE '[0-9a-fA-F.:]'); [ "$s" -gt "$r" ] && echo "$s" || echo "$r"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^([2-9]|[1-9][0-9]+)$" }
    rationale: &rat-1b3a1af3d9 |
      To provide availability for name resolution services, multiple redundant name servers are mandated. A failure in name resolution could lead to the failure of security functions requiring name resolution, which may include time synchronization, centralized authentication, and remote system logging.
    remediation: &rem-1bbff92e2e |
      Configure the operating system to use two or more name servers for DNS resolution based on the DNS mode of the system.

      If the NetworkManager DNS mode is set to "none", add the following lines to "/etc/resolv.conf":

      nameserver [name server 1]
      nameserver [name server 2]

      Replace [name server 1] and [name server 2] with the IPs of two different DNS resolvers.

      If the NetworkManager DNS mode is set to "default", add two DNS servers to a NetworkManager connection using the following command:

      $ nmcli connection modify [connection name] ipv4.dns [name server 1],[name server 2]

      Replace [name server 1] and [name server 2] with the IPs of two different DNS resolvers. Replace [connection name] with a valid NetworkManager connection name on the system. Replace ipv4 with ipv6 if IPv6 DNS servers are used.
  - id: "STIG-RHEL-09-252040-Networkmgr_DNS"
    name: "RHEL 9 must configure a DNS processing mode in Network Manager."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-252040, V-257949, SV-257949r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      NetworkManager --print-config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^dns\\s*=\\s*(none|default|systemd-resolved)" }
    rationale: &rat-6f69b0f9bf |
      To ensure that DNS resolver settings are respected, a DNS mode in Network Manager must be configured. The following are common DNS values in NetworkManager.conf [main]:

      - default: NetworkManager will update /etc/resolv.conf to reflect the nameservers provided by currently active connections.
      - none: NetworkManager will not modify /etc/resolv.conf. Used when DNS is managed manually or by another service.
      - systemd-resolved: Uses systemd-resolved to manage DNS.
      - dnsmasq: Enables the internal dnsmasq plugin.
    remediation: &rem-6c71824cf3 |
      Configure NetworkManager in RHEL 9 to use a DNS mode.

      In "/etc/NetworkManager/NetworkManager.conf", add the following line in the "[main]" section:

      dns = <dns processing mode>

      Where <dns processing mode> is default, none, or systemd-resolved.

      NetworkManager must be reloaded for the change to take effect.

      $ sudo systemctl reload NetworkManager
  - id: "STIG-RHEL-09-252045-ipsec_tunnel"
    name: "RHEL 9 must not have unauthorized IP tunnels configured."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-252045, V-257950, SV-257950r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl status ipsec | grep ": active" > /dev/null && grep -rni conn /etc/ipsec.conf /etc/ipsec.d/
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-934bbaf912 |
      IP tunneling mechanisms can be used to bypass network filtering. If tunneling is required, it must be documented with the information system security officer (ISSO).
    remediation: &rem-68c04c625a |
      Remove all unapproved tunnels from the system, or document them with the ISSO.
  - id: "STIG-RHEL-09-252050-postfix_prevent"
    name: "RHEL 9 must be configured to prevent unrestricted mail relaying."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-252050, V-257951, SV-257951r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      if command -v postconf; then postconf -n smtpd_client_restrictions; else echo 'OK postgres is not installed.';  fi
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ smtpd_client_restrictions = permit_mynetworks,reject" }
    rationale: &rat-a0224f2a94 |
      If unrestricted mail relaying is permitted, unauthorized senders could use this host as a mail relay for the purpose of sending spam or other unauthorized activity.
    remediation: &rem-124bb61e56 |
      Modify the postfix configuration file to restrict client connections to the local network with the following command:

      $ sudo postconf -e 'smtpd_client_restrictions = permit_mynetworks,reject'
  - id: "STIG-RHEL-09-252060-postmaster_alias-attrs"
    name: "RHEL 9 must forward mail from postmaster to the root account using a postfix alias. (/etc/aliases: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-252060, V-257953, SV-257953r958424_rule, CAT II. CCI-000139. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/aliases'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-efc72725ee |
      It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs as required. Without this notification, the security personnel may be unaware of an impending failure of the audit capability, and system operation may be adversely affected.

      Audit processing failures include software/hardware errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded.
    remediation: &rem-520ba3963e |
      Configure a valid email address as an alias for the root account.

      Append the following line to "/etc/aliases":

      postmaster: root

      Then, run the following command:

      $ sudo newaliases
  - id: "STIG-RHEL-09-252060-postmaster_alias-content"
    name: "RHEL 9 must forward mail from postmaster to the root account using a postfix alias. (/etc/aliases has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-252060, V-257953, SV-257953r958424_rule, CAT II. CCI-000139. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/aliases'
    allow_rc: any
    expect: { some: "~ ^postmaster:\\s*root" }
    rationale: *rat-efc72725ee
    remediation: *rem-520ba3963e
  - id: "STIG-RHEL-09-252065-libreswan_installed"
    name: "RHEL 9 libreswan package must be installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-252065, V-257954, SV-257954r1268251_rule, CAT II. CCI-000803. NIST SP 800-53 Rev. 4: IA-7."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet libreswan
    expect: true
    rationale: &rat-d1c7e6073b |
      Providing the ability for remote users or systems to initiate a secure VPN connection protects information when it is transmitted over a wide area network.
    remediation: &rem-fd92fa00f3 |
      Install the libreswan service (if it is not already installed) with the following command:

      $ sudo dnf install libreswan
  - id: "STIG-RHEL-09-253010-tcp_syncookie"
    name: "RHEL 9 must be configured to use TCP syncookies. (live)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-253010, V-257957, SV-257957r1268251_rule, CAT II. CCI-001095, CCI-002385. NIST SP 800-53 Rev. 4: SC-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      sysctl -n net.ipv4.tcp_syncookies
    allow_rc: any
    expect:
      - { rc: "== 0" }
