  - id: "STIG-RHEL-09-291025-usbguard_audit_logging-attrs"
    name: "RHEL 9 must enable Linux audit logging for the USBGuard daemon. (/etc/usbguard/usbguard-daemon.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-291025, V-258037, SV-258037r1268225_rule, CAT III. CCI-000169. NIST SP 800-53 Rev. 4: AU-12."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      f='/etc/usbguard/usbguard-daemon.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-eda03f7bc6 |
      Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.

      If auditing is enabled late in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state information only available if auditing is enabled before a given process is created.

      Audit records can be generated from various components within the information system (e.g., module or policy filter).

      The list of audited events is the set of events for which audits are to be generated. This set of events is typically a subset of the list of all events for which the system is capable of generating audit records.

      DoW has defined the list of events for which RHEL 9 will provide an audit record generation capability as the following:

      1) Successful and unsuccessful attempts to access, modify, or delete privileges, security objects, security levels, or categories of information (e.g., classification levels);

      2) Access actions, such as successful and unsuccessful logon attempts, privileged activities or other system-level access, starting and ending time for user access to the system, concurrent logons from different workstations, successful and unsuccessful accesses to objects, all program initiations, and all direct access to the information system;

      3) All account creations, modifications, disabling, and terminations; and

      4) All kernel module load, unload, and restart actions.
    remediation: &rem-f9304a50f6 |
      Configure RHEL 9 USBGuard AuditBackend to use the audit system.

      Add or edit the following line in /etc/usbguard/usbguard-daemon.conf

      AuditBackend=LinuxAudit
  - id: "STIG-RHEL-09-291025-usbguard_audit_logging-content"
    name: "RHEL 9 must enable Linux audit logging for the USBGuard daemon. (/etc/usbguard/usbguard-daemon.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-291025, V-258037, SV-258037r1268225_rule, CAT III. CCI-000169. NIST SP 800-53 Rev. 4: AU-12."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      cat '/etc/usbguard/usbguard-daemon.conf'
    allow_rc: any
    expect: { some: "~ ^AuditBackend=LinuxAudit" }
    rationale: *rat-eda03f7bc6
    remediation: *rem-f9304a50f6
  - id: "STIG-RHEL-09-412040-maxlogins_limits-attrs"
    name: "RHEL 9 must limit the number of concurrent sessions to ten for all accounts and/or account types. (/etc/security/limits.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-412040, V-258069, SV-258069r958398_rule, CAT III. CCI-000054. NIST SP 800-53 Rev. 4: SC-10, AC-11."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      f='/etc/security/limits.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-a181a74a9b |
      Operating system management includes the ability to control the number of users and user sessions that utilize an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the risks related to denial-of-service (DoS) attacks.

      This requirement addresses concurrent sessions for information system accounts and does not address concurrent sessions by single users via multiple system accounts. The maximum number of concurrent sessions must be defined based on mission needs and the operational environment for each system.
    remediation: &rem-428d31c416 |
      Configure RHEL 9 to limit the number of concurrent sessions to "10" for all accounts and/or account types.

      Add the following line to the top of the /etc/security/limits.conf or in a ".conf" file defined in /etc/security/limits.d/:

      * hard maxlogins 10
  - id: "STIG-RHEL-09-412040-maxlogins_limits-content"
    name: "RHEL 9 must limit the number of concurrent sessions to ten for all accounts and/or account types. (/etc/security/limits.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-412040, V-258069, SV-258069r958398_rule, CAT III. CCI-000054. NIST SP 800-53 Rev. 4: SC-10, AC-11."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      cat '/etc/security/limits.conf'
    allow_rc: any
    expect: { some: "~ \\* hard maxlogins ([1-9]|10)" }
    rationale: *rat-a181a74a9b
    remediation: *rem-428d31c416
  - id: "STIG-RHEL-09-651030-aide_all_acl-attrs"
    name: "RHEL 9 must be configured so that the file integrity tool verifies Access Control Lists (ACLs). (/etc/aide.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-651030, V-258138, SV-258138r1268251_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      f='/etc/aide.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d39ada7a15 |
      RHEL 9 installation media ships with an optional file integrity tool called Advanced Intrusion Detection Environment (AIDE). AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file is under the "/etc" directory.

      ACLs can provide permissions beyond those permitted through the file mode and must be verified by the file integrity tools.
    remediation: &rem-0d84071645 |
      Configure the file integrity tool to check file and directory ACLs.

      If AIDE is installed, ensure the "acl" rule is present on all uncommented file and directory selection lists.
  - id: "STIG-RHEL-09-651030-aide_all_acl-content"
    name: "RHEL 9 must be configured so that the file integrity tool verifies Access Control Lists (ACLs). (/etc/aide.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-651030, V-258138, SV-258138r1268251_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      cat '/etc/aide.conf'
    allow_rc: any
    expect: { some: "~ (?i)^\\s*all\\s*=.*\\+acl" }
    rationale: *rat-d39ada7a15
    remediation: *rem-0d84071645
  - id: "STIG-RHEL-09-651035-aide_all_xattrs-attrs"
    name: "RHEL 9 must be configured so that the file integrity tool verifies extended attributes. (/etc/aide.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-651035, V-258139, SV-258139r1268251_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      f='/etc/aide.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e31e12f3dc |
      RHEL 9 installation media ships with an optional file integrity tool called Advanced Intrusion Detection Environment (AIDE). AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file is under the "/etc" directory.

      Extended attributes in file systems are used to contain arbitrary data and file metadata with security implications.
    remediation: &rem-7a5e79fdd1 |
      Configure the file integrity tool to check file and directory extended attributes.

      If AIDE is installed, ensure the "xattrs" rule is present on all uncommented file and directory selection lists.
  - id: "STIG-RHEL-09-651035-aide_all_xattrs-content"
    name: "RHEL 9 must be configured so that the file integrity tool verifies extended attributes. (/etc/aide.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-651035, V-258139, SV-258139r1268251_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      cat '/etc/aide.conf'
    allow_rc: any
    expect: { some: "~ (?i)^\\s*all\\s*=.*\\+xattrs" }
    rationale: *rat-e31e12f3dc
    remediation: *rem-7a5e79fdd1
  - id: "STIG-RHEL-09-653120-grub_audit_backlog-attrs"
    name: "RHEL 9 must allocate an audit_backlog_limit of sufficient size to capture processes that start prior to the audit daemon. (/etc/default/grub: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653120, V-258173, SV-258173r1101933_rule, CAT III. CCI-001464, CCI-001849. NIST SP 800-53 Rev. 4: AU-4, AU-14."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-af940d17cf |
      Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.

      If auditing is enabled late in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state information only available if auditing is enabled before a given process is created.

      Audit records can be generated from various components within the information system (e.g., module or policy filter).

      Allocating an audit_backlog_limit of sufficient size is critical in maintaining a stable boot process. With an insufficient limit allocated, the system is susceptible to boot failures and crashes.
    remediation: &rem-cceef45770 |
      Configure RHEL 9 to allocate sufficient audit_backlog_limit to capture processes that start prior to the audit daemon with the following command:

      $ sudo grubby --update-kernel=ALL --args=audit_backlog_limit=8192
  - id: "STIG-RHEL-09-653120-grub_audit_backlog-content"
    name: "RHEL 9 must allocate an audit_backlog_limit of sufficient size to capture processes that start prior to the audit daemon. (/etc/default/grub has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653120, V-258173, SV-258173r1101933_rule, CAT III. CCI-001464, CCI-001849. NIST SP 800-53 Rev. 4: AU-4, AU-14."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect: { some: "~ ^GRUB_CMDLINE_LINUX=\".*audit_backlog_limit=8192" }
    rationale: *rat-af940d17cf
    remediation: *rem-cceef45770
