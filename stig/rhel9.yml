  - id: "STIG-RHEL-09-214010-gpg_crypto_keys"
    name: "RHEL 9 must ensure cryptographic verification of vendor software packages."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-214010, V-257819, SV-257819r1268241_rule, CAT II. CCI-001749, CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      gpg -q --keyid-format short --with-fingerprint /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ release key 2" }
      - { some: "~ 567E 347A D004 4ADE 55BA  8A5F 199E 2F91 FD43 1D51" }
      - { some: "~ auxiliary key" }
      - { some: "~ 6A6A A7C9 7C88 90AE C6AE  BFE2 F76F 66C3 D409 2792" }
    rationale: &rat-ae40b992c5 |
      Cryptographic verification of vendor software packages ensures that all software packages are obtained from a valid source and protects against spoofing that could lead to installation of malware on the system. Red Hat cryptographically signs all software packages, which includes updates, with a GPG key to verify that they are valid.
    remediation: &rem-2cc92938a5 |
      Install Red Hat package-signing keys on the system and verify their fingerprints match vendor values.

      Insert RHEL 9 installation disc or attach RHEL 9 installation image to the system. Mount the disc or image to make the contents accessible inside the system.

      Assuming the mounted location is "/media/cdrom", use the following command to copy Red Hat GPG key file onto the system:

      $ sudo cp /media/cdrom/RPM-GPG-KEY-redhat-release /etc/pki/rpm-gpg/

      Import Red Hat GPG keys from key file into system keyring:

      $ sudo rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release

      Using the steps listed in the Check Text, confirm the newly imported keys show as installed on the system and verify their fingerprints match vendor values.
  - id: "STIG-RHEL-09-214030-pkg_crypto_hash"
    name: "RHEL 9 must be configured so that the cryptographic hashes of system files match vendor values."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-214030, V-257823, SV-257823r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      PKG_CRYPTO=`rpm -Va --noconfig | awk '$1 ~ /..5/ && $2 != "c"'`; if [ -n "$PKG_CRYPTO" ]; then echo "FAIL - PKG Hashes dont match vendor values"; else echo PASS; fi
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^PASS" }
      - { none: "~ ^FAIL" }
    rationale: &rat-c50a5f7119 |
      The hashes of important files such as system executables should match the information given by the RPM database. Executables with erroneous hashes could be a sign of nefarious activity on the system.
      If the Check Text command returns results from third-party software vendors, it is an indication that the vendor is not implementing their rpm packages correctly and this must be corrected by the software vendor.
    remediation: &rem-27b63bda3c |
      Configure RHEL 9 so that the cryptographic hashes of system files match vendor values.

      Given output from the check command, identify the package that provides the output and reinstall it. The following trimmed example output shows a package that has failed verification, been identified, and been reinstalled:

      $ sudo rpm -Va --noconfig | awk '$1 ~ /..5/ && $2 != "c"'
      S.5....T.    /usr/bin/znew

      $ sudo dnf provides /usr/bin/znew
      [...]
      gzip-1.10-8.el9.x86_64 : The GNU data compression program
      [...]

      $ sudo dnf -y reinstall gzip
      [...]

      $ sudo rpm -Va --noconfig | awk '$1 ~ /..5/ && $2 != "c"'
      [no output]
  - id: "STIG-RHEL-09-215010-subscription-manager"
    name: "RHEL 9 subscription-manager package must be installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-215010, V-257825, SV-257825r1268241_rule, CAT II. CCI-001749, CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet subscription-manager
    expect: true
    rationale: &rat-8f814ccc70 |
      The Red Hat Subscription Manager application manages software subscriptions and software repositories for installed software products on the local system. It communicates with backend servers, such as the Red Hat Customer Portal or an on-premise instance of Subscription Asset Manager, to register the local system and grant access to software resources determined by the subscription entitlement.
    remediation: &rem-245b8255ce |
      The  subscription-manager package can be installed with the following command:

      $ sudo dnf install subscription-manager
  - id: "STIG-RHEL-09-215020-sendmail"
    name: "RHEL 9 must not have the sendmail package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-215020, V-257827, SV-257827r1268251_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet sendmail
    expect: false
    rationale: &rat-ec45d62f29 |
      The sendmail software was not developed with security in mind, and its design prevents it from being effectively contained by SELinux. Postfix must be used instead.
    remediation: &rem-1fd73bbdb1 |
      Remove the sendmail package with the following command:

      $ sudo dnf remove sendmail
  - id: "STIG-RHEL-09-215025-nfs-utils"
    name: "RHEL 9 must not have the nfs-utils package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-215025, V-257828, SV-257828r1044894_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet nfs-utils
    expect: false
    rationale: &rat-f2ecc13d64 |
      "nfs-utils" provides a daemon for the kernel NFS server and related tools. This package also contains the "showmount" program. "showmount" queries the mount daemon on a remote host for information about the Network File System (NFS) server on the remote host. For example, "showmount" can display the clients that are mounted on that host.
    remediation: &rem-3fbc803450 |
      Remove the nfs-utils package with the following command:

      $ sudo dnf remove nfs-utils
  - id: "STIG-RHEL-09-215035-epel-release"
    name: "RHEL 9 must not install packages from the Extra Packages for Enterprise Linux (EPEL) repository."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-215035, V-257830, SV-257830r1134906_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet epel-release
    expect: false
    rationale: &rat-3e0b2ca8f7 |
      The EPEL is a repository of high-quality open-source packages for enterprise-class Linux distributions such as RHEL, CentOS, AlmaLinux, Rocky Linux, and Oracle Linux. These packages are not part of the official distribution but are built using the same Fedora build system to ensure compatibility and maintain quality standards.
    remediation: &rem-8dbf6c365c |
      The repo package can be manually removed with the following command:

      $ sudo dnf remove epel-release

      Configure the operating system to disable use of the EPEL repository with the following command:

      $ sudo dnf config-manager --set-disabled epel
  - id: "STIG-RHEL-09-215040-telnet-server"
    name: "RHEL 9 must not have the telnet-server package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-215040, V-257831, SV-257831r1044898_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet telnet-server
    expect: false
    rationale: &rat-6adbfeb8ca |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities are often overlooked and therefore, may remain unsecure. They increase the risk to the platform by providing additional attack vectors.

      The telnet service provides an unencrypted remote access service, which does not provide for the confidentiality and integrity of user passwords or the remote session. If a privileged user were to login using this service, the privileged user password could be compromised.

      Removing the "telnet-server" package decreases the risk of accidental (or intentional) activation of the telnet service.
    remediation: &rem-1468a29682 |
      Remove the telnet-server package with the following command:

      $ sudo dnf remove telnet-server
  - id: "STIG-RHEL-09-215045-gssproxy"
    name: "RHEL 9 must not have the gssproxy package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-215045, V-257832, SV-257832r1155653_rule, CAT II. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet gssproxy
    expect: false
    rationale: &rat-fe680f13aa |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore, may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      Operating systems are capable of providing a wide variety of functions and services. Some of the functions and services provided by default may not be necessary to support essential organizational operations (e.g., key missions, functions).

      The gssproxy package is a proxy for GSS API credential handling and could expose secrets on some networks. It is not needed for normal function of the OS.
    remediation: &rem-d569c2f864 |
      Remove the gssproxy package with the following command:

      $ sudo dnf remove gssproxy
  - id: "STIG-RHEL-09-215050-iprutils"
