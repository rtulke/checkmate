    name: "RHEL 9 must initiate a session lock for graphical user interfaces when the screensaver is activated. (/etc/dconf/db/local.d/00-screensaver: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-271075, V-258025, SV-258025r958402_rule, CAT II. CCI-000057. NIST SP 800-53 Rev. 4: AC-11."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/dconf/db/local.d/00-screensaver'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f74f242776 |
      A session lock is a temporary action taken when a user stops work and moves away from the immediate physical vicinity of the information system but does not want to logout because of the temporary nature of the absence.
    remediation: &rem-eafe3e3394 |
      Configure RHEL 9 to initiate a session lock for graphical user interfaces when a screensaver is activated.

      Create a database to contain the system-wide screensaver settings (if it does not already exist) with the following command:

      Note: The example below is using the database "local" for the system, so if the system is using another database in "/etc/dconf/profile/user", the file should be created under the appropriate subdirectory.

      $ sudo touch /etc/dconf/db/local.d/00-screensaver

      [org/gnome/desktop/screensaver]
      lock-delay=uint32 5

      The "uint32" must be included along with the integer key values as shown.

      Update the system databases:

      $ sudo dconf update
  - id: "STIG-RHEL-09-271075-gui_screensaver_activate-content"
