  - id: "STIG-RHEL-09-653070-audit_action_mail_acct-attrs"
    name: "RHEL 9 System Administrator (SA) and/or information system security officer (ISSO) (at a minimum) must be alerted of an audit processing failure event. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653070, V-258163, SV-258163r958424_rule, CAT II. CCI-000139, CCI-001855. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-9132161237 |
      It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs as required. Without this notification, the security personnel may be unaware of an impending failure of the audit capability, and system operation may be adversely affected.

      Audit processing failures include software/hardware errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded.

      This requirement applies to each audit data storage repository (i.e., distinct information system component where audit records are stored), the centralized audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both.
    remediation: &rem-c7a16fdbf8 |
      Configure "auditd" service to notify the SA and ISSO in the event of an audit processing failure.

      Edit the following line in "/etc/audit/auditd.conf" to ensure that administrators are notified via email for those situations:

      action_mail_acct = root

      The audit daemon must be restarted for changes to take effect.
  - id: "STIG-RHEL-09-653070-audit_action_mail_acct-content"
    name: "RHEL 9 System Administrator (SA) and/or information system security officer (ISSO) (at a minimum) must be alerted of an audit processing failure event. (/etc/audit/auditd.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653070, V-258163, SV-258163r958424_rule, CAT II. CCI-000139, CCI-001855. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect: { some: "~ ^action_mail_acct = root" }
    rationale: *rat-9132161237
    remediation: *rem-c7a16fdbf8
  - id: "STIG-RHEL-09-653075-audit_local_events-attrs"
    name: "RHEL 9 audit system must audit local events. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653075, V-258164, SV-258164r1268225_rule, CAT II. CCI-000169. NIST SP 800-53 Rev. 4: AU-12."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-6dbbc3bcf5 |
      Without establishing what type of events occurred, the source of events, where events occurred, and the outcome of events, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack.

      If option "local_events" isn't set to "yes" only events from network will be aggregated.
    remediation: &rem-3952542f52 |
      Configure RHEL 9 to generate audit records for local events by adding or updating the following line in "/etc/audit/auditd.conf":

      local_events = yes

      The audit daemon must be restarted for the changes to take effect.
  - id: "STIG-RHEL-09-653075-audit_local_events-content"
    name: "RHEL 9 audit system must audit local events. (/etc/audit/auditd.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653075, V-258164, SV-258164r1268225_rule, CAT II. CCI-000169. NIST SP 800-53 Rev. 4: AU-12."
