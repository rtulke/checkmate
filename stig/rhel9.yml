  - id: "STIG-RHEL-09-611060-password_enforce_for_root-attrs"
    name: "RHEL 9 must enforce password complexity rules for the root account. (/etc/security/pwquality.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-611060, V-258101, SV-258101r1045204_rule, CAT II. CCI-000192, CCI-000193, CCI-000194, CCI-000195, CCI-000205, CCI-001619, CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
