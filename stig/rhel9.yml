    severity: medium
    run: |
      stat -c "%U" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/rsyslogd /sbin/augenrules | uniq | tr -d '\n'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root" }
    rationale: *rat-c0b147aeea
    remediation: &rem-aa268f5c4a |
      Configure the audit tools to be owned by "root" by running the following command:

      $ sudo chown root [audit_tool]

      Replace "[audit_tool]" with each audit tool not owned by "root".
  - id: "STIG-RHEL-09-232225-audit_bins_root_group"
    name: "RHEL 9 audit tools must be group-owned by root."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232225, V-257925, SV-257925r991557_rule, CAT II. CCI-001493. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      stat -c "%G" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/rsyslogd /sbin/augenrules | uniq | tr -d '\n'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root" }
    rationale: &rat-9e0e6c7d36 |
      Protecting audit information also includes identifying and protecting the tools used to view and manipulate log data; therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information.

      RHEL 9 systems providing tools to interface with audit information will leverage user permissions and roles identifying the user accessing the tools, and the corresponding rights the user enjoys, to make access decisions regarding the access to audit tools.

      Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.
    remediation: &rem-02682d82f6 |
      Configure the audit tools to be group-owned by "root" by running the following command:

      $ sudo chgrp root [audit_tool]

      Replace "[audit_tool]" with each audit tool not group-owned by "root".
  - id: "STIG-RHEL-09-232230-cron_conf_dirs_owned"
