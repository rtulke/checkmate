  - id: "STIG-RHEL-09-255050-sshd_use_pam-attrs"
    name: "RHEL 9 must enable the Pluggable Authentication Module (PAM) interface for SSHD. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-255050, V-257986, SV-257986r1045030_rule, CAT I. CCI-000877. NIST SP 800-53 Rev. 4: MA-4."
