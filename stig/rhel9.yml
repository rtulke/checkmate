  - id: "STIG-RHEL-09-611135-libcrypt_sha512-attrs"
    name: "RHEL 9 must be configured so that user and group account administration utilities are configured to store only encrypted representations of passwords. (/etc/libuser.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-611135, V-258116, SV-258116r1262116_rule, CAT II. CCI-000196, CCI-004062. NIST SP 800-53 Rev. 4: IA-5."
