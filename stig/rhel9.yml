  - id: "STIG-RHEL-09-654270-audit_conf_login_immut-attrs"
    name: "RHEL 9 audit system must protect logon UIDs from unauthorized change. (/etc/audit/rules.d/audit.rules: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-654270, V-258228, SV-258228r991572_rule, CAT II. CCI-000162, CCI-000163, CCI-000164, CCI-000172. NIST SP 800-53 Rev. 4: AU-9, AU-12."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/rules.d/audit.rules'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1afc9bc304 |
      If modification of login user identifiers (UIDs) is not prevented, they can be changed by nonprivileged users and make auditing complicated or impossible.
    remediation: &rem-0efcd4c854 |
      Configure RHEL 9 auditing to prevent modification of login UIDs once they are set by adding the following line to /etc/audit/rules.d/audit.rules:

      --loginuid-immutable

      The audit daemon must be restarted for the changes to take effect.
