    allow_rc: any
    expect: { some: "~ ^local_events = yes" }
    rationale: *rat-6dbbc3bcf5
    remediation: *rem-3952542f52
  - id: "STIG-RHEL-09-653080-audit_log_group-attrs"
    name: "RHEL 9 audit logs must be group-owned by root or by a restricted logging group to prevent unauthorized read access."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653080, V-258165, SV-258165r958434_rule, CAT II. CCI-000162, CCI-000163, CCI-000164, CCI-001314. NIST SP 800-53 Rev. 4: AU-9, SI-11."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-4c35fc7aee |
      Unauthorized disclosure of audit records can reveal system and configuration data to attackers, thus compromising its confidentiality.
    remediation: &rem-21a0cbcbb9 |
      Change the group of the directory of "/var/log/audit" to be owned by a correct group.

      Identify the group that is configured to own audit log:

      $ sudo grep -P '^[ ]*log_group[ ]+=.*$' /etc/audit/auditd.conf

      Change the ownership to that group:

      $ sudo chgrp ${GROUP} /var/log/audit
  - id: "STIG-RHEL-09-653085-audit_log_owner-attrs"
    name: "RHEL 9 audit log directory must be owned by root to prevent unauthorized read access."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653085, V-258166, SV-258166r1045303_rule, CAT II. CCI-000162, CCI-000163, CCI-000164, CCI-001314. NIST SP 800-53 Rev. 4: AU-9, SI-11."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
    expect: empty
    rationale: *rat-4c35fc7aee
    remediation: &rem-89b59ac923 |
      Configure the audit log to be protected from unauthorized read access by setting the correct owner as "root" with the following command:

      $ sudo chown root /var/log/audit
  - id: "STIG-RHEL-09-653090-audit_log_perms-attrs"
    name: "RHEL 9 audit logs file must have mode 0600 or less permissive to prevent unauthorized access to the audit log."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653090, V-258167, SV-258167r1155630_rule, CAT II. CCI-000162, CCI-000163, CCI-000164, CCI-001314. NIST SP 800-53 Rev. 4: AU-9, SI-11."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/var/log/audit/audit.log'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
    expect: empty
    rationale: &rat-e29b2e277e |
      Only authorized personnel should be aware of errors and the details of the errors. Error messages are an indicator of an organization's operational state or can identify the RHEL 9 system or platform. Additionally, Personally Identifiable Information (PII) and operational information must not be revealed through error messages to unauthorized personnel or their designated representatives.

      The structure and content of error messages must be carefully considered by the organization and development team. The extent to which the information system is able to identify and handle error conditions is guided by organizational policy and operational requirements.
    remediation: &rem-1b8add7365 |
      Configure the audit logs to have a mode of "0600" with the following command:

      Replace "[audit_log_file]" with the path to each audit log file. By default, these logs are located in "/var/log/audit/.

      $ sudo chmod 0600 /var/log/audit/[audit_log_file]

      Check the group that owns the system audit logs:

      $ sudo grep -iw log_group /etc/audit/auditd.conf

      If log_group is set to a user other than root, configure the permissions the following way:

      $ sudo chmod 0640 $log_file
      $ sudo chmod 0440 $log_file.*

      Otherwise, configure the permissions the following way:

      $ sudo chmod 0600 $log_file
      $ sudo chmod 0400 $log_file.*
  - id: "STIG-RHEL-09-653090-audit_all_logs_perms"
    name: "RHEL 9 audit logs file must have mode 0600 or less permissive to prevent unauthorized access to the audit log. (all logs)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653090, V-258167, SV-258167r1155630_rule, CAT II. CCI-000162, CCI-000163, CCI-000164, CCI-001314. NIST SP 800-53 Rev. 4: AU-9, SI-11."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      find /var/log/audit/ -type f -exec stat -c '%a %n' {} \;
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ [4,6]00" }
    rationale: *rat-e29b2e277e
    remediation: *rem-1b8add7365
  - id: "STIG-RHEL-09-653095-audit_frequency-attrs"
    name: "RHEL 9 must periodically flush audit records to disk to prevent the loss of audit records. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653095, V-258168, SV-258168r958428_rule, CAT II. CCI-000154. NIST SP 800-53 Rev. 4: AU-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-5b5fe6676a |
      If option "freq" is not set to a value that requires audit records being written to disk after a threshold number is reached, then audit records may be lost.
    remediation: &rem-4d57756331 |
      Configure RHEL 9 to flush audit to disk by adding or updating the following rule in "/etc/audit/auditd.conf":

      freq = 100

      The audit daemon must be restarted for the changes to take effect.
  - id: "STIG-RHEL-09-653095-audit_frequency-content"
    name: "RHEL 9 must periodically flush audit records to disk to prevent the loss of audit records. (/etc/audit/auditd.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653095, V-258168, SV-258168r958428_rule, CAT II. CCI-000154. NIST SP 800-53 Rev. 4: AU-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect: { some: "~ ^freq = 100" }
    rationale: *rat-5b5fe6676a
    remediation: *rem-4d57756331
  - id: "STIG-RHEL-09-653100-audit_log_format-attrs"
    name: "RHEL 9 must produce audit records containing information to establish the identity of any individual or process associated with the event. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653100, V-258169, SV-258169r991556_rule, CAT II. CCI-000366, CCI-001487. NIST SP 800-53 Rev. 4: AU-3, CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-fbd5830845 |
      Without establishing what type of events occurred, the source of events, where events occurred, and the outcome of events, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack.

      Audit record content that may be necessary to satisfy this requirement includes, for example, time stamps, source and destination addresses, user/process identifiers, event descriptions, success/fail indications, filenames involved, and access control or flow control rules invoked.

      Enriched logging aids in making sense of who, what, and when events occur on a system. Without this, determining root cause of an event will be much more difficult.
    remediation: &rem-b49efab47c |
      Edit the /etc/audit/auditd.conf file and add or update the "log_format" option:

      log_format = ENRICHED

      The audit daemon must be restarted for changes to take effect.
  - id: "STIG-RHEL-09-653100-audit_log_format-content"
    name: "RHEL 9 must produce audit records containing information to establish the identity of any individual or process associated with the event. (/etc/audit/auditd.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653100, V-258169, SV-258169r991556_rule, CAT II. CCI-000366, CCI-001487. NIST SP 800-53 Rev. 4: AU-3, CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect: { some: "~ ^log_format = ENRICHED" }
    rationale: *rat-fbd5830845
    remediation: *rem-b49efab47c
  - id: "STIG-RHEL-09-653105-audit_write_logs-attrs"
    name: "RHEL 9 must write audit records to disk. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653105, V-258170, SV-258170r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e67cc84549 |
      Audit data should be synchronously written to disk to ensure log integrity. This setting assures that all audit event data is written disk.
    remediation: &rem-943bc38c51 |
      Configure the audit system to write log files to the disk.

      Edit the /etc/audit/auditd.conf file and add or update the "write_logs" option to "yes":

      write_logs = yes

      The audit daemon must be restarted for changes to take effect.
  - id: "STIG-RHEL-09-653105-audit_write_logs-content"
    name: "RHEL 9 must write audit records to disk. (/etc/audit/auditd.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653105, V-258170, SV-258170r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect: { some: "~ ^write_logs = yes" }
    rationale: *rat-e67cc84549
    remediation: *rem-943bc38c51
  - id: "STIG-RHEL-09-653110-audit_rules_perms"
    name: "RHEL 9 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653110, V-258171, SV-258171r1262122_rule, CAT II. CCI-000171. NIST SP 800-53 Rev. 4: AU-12."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      find /etc/audit/rules.d/ /etc/audit/audit.rules /etc/audit/auditd.conf -type f -exec stat -c '%a' {} \;
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ [4,6]00" }
    rationale: &rat-c58ed3c65f |
      Without the capability to restrict the roles and individuals that can select which events are audited, unauthorized personnel may be able to prevent the auditing of critical events. Misconfigured audits may degrade the system's performance by overwhelming the audit log. Misconfigured audits may also make it more difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.
    remediation: &rem-15142cd5ad |
      Configure the rules files in the directory "/etc/audit/rules.d/", the "/etc/audit/audit.rules" file, and the "/etc/audit/auditd.conf" file to have a mode of "0600" with the following commands:

      $ sudo find /etc/audit/rules.d/ -type f -name "*.rules" -exec chmod 0600 {} +

      $ sudo chmod 0600 /etc/audit/audit.rules

      $ sudo chmod 0600 /etc/audit/auditd.conf
  - id: "STIG-RHEL-09-653125-root_aliases-attrs"
    name: "RHEL 9 must have mail aliases to notify the information system security officer (ISSO) and system administrator (SA) (at a minimum) in the event of an audit processing failure. (/etc/aliases: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653125, V-258174, SV-258174r958424_rule, CAT II. CCI-000139. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/aliases'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: *rat-9132161237
    remediation: &rem-9b5e00593b |
      Edit the aliases map file (by default /etc/aliases) used by Postfix and configure a root alias (using the user ISSO as an example):

      root:    ISSO

      and then update the aliases database with the command:

      $ sudo newaliases
  - id: "STIG-RHEL-09-653125-root_aliases-content"
    name: "RHEL 9 must have mail aliases to notify the information system security officer (ISSO) and system administrator (SA) (at a minimum) in the event of an audit processing failure. (/etc/aliases has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653125, V-258174, SV-258174r958424_rule, CAT II. CCI-000139. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/aliases'
    allow_rc: any
    expect: { some: "~ ^root:\\s*ISSO" }
    rationale: *rat-9132161237
    remediation: *rem-9b5e00593b
  - id: "STIG-RHEL-09-653130-audispd_installed"
    name: "RHEL 9 audispd-plugins package must be installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653130, V-258175, SV-258175r1045310_rule, CAT II. CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet audispd-plugins
    expect: true
    rationale: &rat-477dfbaaa0 |
      "audispd-plugins" provides plugins for the real-time interface to the audit subsystem, "audispd". These plugins can do things like relay events to remote machines or analyze events for suspicious behavior.
    remediation: &rem-39201a39e1 |
      The audispd-plugins package can be installed with the following command:

      $ sudo dnf install audispd-plugins
  - id: "STIG-RHEL-09-654010-audit_conf_execve-attrs"
    name: "RHEL 9 must audit uses of the execve system call. (/etc/audit/rules.d/audit.rules: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-654010, V-258176, SV-258176r1155595_rule, CAT II. CCI-002233, CCI-002234. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/rules.d/audit.rules'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ec762cf3b5 |
      Misuse of privileged functions, either intentionally or unintentionally by authorized users, or by unauthorized external entities that have compromised information system accounts, is a serious and ongoing concern and can have significant adverse impacts on organizations. Auditing the use of privileged functions is one way to detect such misuse and identify the risk from insider threats and the advanced persistent threat.
    remediation: &rem-80e8ae5cc4 |
      Configure RHEL 9 to audit the execution of the "execve" system call.

      Add or update the following file system rules to "/etc/audit/rules.d/audit.rules":

      -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv
      -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv
      -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k execpriv
      -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv

      To load the rules to the kernel immediately, use the following command:

      $ sudo augenrules --load
  - id: "STIG-RHEL-09-654010-audit_conf_execve-content"
    name: "RHEL 9 must audit uses of the execve system call. (/etc/audit/rules.d/audit.rules has the expected content (4 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-654010, V-258176, SV-258176r1155595_rule, CAT II. CCI-002233, CCI-002234. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/audit/rules.d/audit.rules'
    allow_rc: any
    expect:
      - { some: "~ ^-a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv" }
      - { some: "~ ^-a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv" }
      - { some: "~ ^-a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k execpriv" }
