  - id: "STIG-RHEL-09-611050-password-auth_rounds-attrs"
    name: "RHEL 9 password-auth must be configured to use a sufficient number of hashing rounds. (/etc/pam.d/password-auth: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-611050, V-258099, SV-258099r1045198_rule, CAT II. CCI-000196, CCI-000803, CCI-004062. NIST SP 800-53 Rev. 4: IA-5, IA-7."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/pam.d/password-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-c938ea23cf |
      Passwords need to be protected at all times, and encryption is the standard method for protecting passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Passwords that are encrypted with a weak algorithm are no more protected than if they are kept in plain text.

      Using more hashing rounds makes password cracking attacks more difficult.
    remediation: &rem-2be46b04b8 |
      Configure RHEL 9 to use 100000 hashing rounds for hashing passwords.

      Add or modify the following line in "/etc/pam.d/password-auth" and set "rounds" to "100000".

      password sufficient pam_unix.so sha512 rounds=100000

      Note: Running authselect will overwrite this value unless a custom authselect policy is created.
  - id: "STIG-RHEL-09-611050-password-auth_rounds-content"
    name: "RHEL 9 password-auth must be configured to use a sufficient number of hashing rounds. (/etc/pam.d/password-auth has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-611050, V-258099, SV-258099r1045198_rule, CAT II. CCI-000196, CCI-000803, CCI-004062. NIST SP 800-53 Rev. 4: IA-5, IA-7."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/pam.d/password-auth'
    allow_rc: any
    expect: { some: "~ ^password\\s+sufficient\\s+pam_unix.so.*rounds=([5-9][0-9]{3,}).*$" }
    rationale: *rat-c938ea23cf
    remediation: *rem-2be46b04b8
