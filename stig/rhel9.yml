    expect: "!~ ^enabled"
    rationale: *rat-d0d038d026
    remediation: &rem-6d9d897da1 |
      Configure RHEL 9 to disable the ctrl-alt-del.target with the following command:

      $ sudo systemctl disable --now ctrl-alt-del.target
      $ sudo systemctl mask --now ctrl-alt-del.target
  - id: "STIG-RHEL-09-211050-ctrl-alt-del.target-running"
    name: "The x86 Ctrl-Alt-Delete key sequence must be disabled on RHEL 9. (Service ctrl-alt-del.target is not running)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-211050, V-257785, SV-257785r1044833_rule, CAT I. CCI-002235. NIST SP 800-53 Rev. 4: AC-6."
