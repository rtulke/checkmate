  - id: "STIG-RHEL-09-611025-nullok_password-auth-attrs"
    name: "RHEL 9 must not allow blank or null passwords. (/etc/pam.d/password-auth: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-611025, V-258094, SV-258094r1268251_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
