  - id: "STIG-RHEL-09-231040-autofs_masked-attrs"
    name: "The RHEL 9 file system automounter must be disabled."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-231040, V-257849, SV-257849r1262109_rule, CAT II. CCI-000778, CCI-001958. NIST SP 800-53 Rev. 4: IA-3."
