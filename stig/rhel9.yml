  - id: "STIG-RHEL-09-432010-sudo_installed"
    name: "RHEL 9 must have the sudo package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-432010, V-258083, SV-258083r1045168_rule, CAT II. CCI-002235. NIST SP 800-53 Rev. 4: AC-6."
