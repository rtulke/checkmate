  - id: "STIG-RHEL-09-212050-grub_pti-attrs"
    name: "RHEL 9 must enable mitigations against processor-based vulnerabilities. (/etc/default/grub: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-212050, V-257795, SV-257795r1044845_rule, CAT III. CCI-000381, CCI-002824. NIST SP 800-53 Rev. 4: CM-7, SI-16."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-c524769d13 |
      Kernel page-table isolation is a kernel feature that mitigates the Meltdown security vulnerability and hardens the kernel against attempts to bypass kernel address space layout randomization (KASLR).
    remediation: &rem-3cb8776c31 |
      Configure RHEL 9 to enable kernel page-table isolation with the following command:

      $ sudo grubby --update-kernel=ALL --args="pti=on"

      Add or modify the following line in "/etc/default/grub" to ensure the configuration survives kernel updates:

      GRUB_CMDLINE_LINUX="pti=on"
  - id: "STIG-RHEL-09-212050-grub_pti-content"
    name: "RHEL 9 must enable mitigations against processor-based vulnerabilities. (/etc/default/grub has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-212050, V-257795, SV-257795r1044845_rule, CAT III. CCI-000381, CCI-002824. NIST SP 800-53 Rev. 4: CM-7, SI-16."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect:
      - { some: "~ ^GRUB_CMDLINE_LINUX=\".*pti=on" }
      - { none: "~ ^GRUB_CMDLINE_LINUX=\".*pti=off" }
    rationale: *rat-c524769d13
    remediation: *rem-3cb8776c31
  - id: "STIG-RHEL-09-212055-grub_audit-attrs"
    name: "RHEL 9 must enable auditing of processes that start prior to the audit daemon. (/etc/default/grub: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-212055, V-257796, SV-257796r1044847_rule, CAT III. CCI-000130, CCI-000135, CCI-000169, CCI-000172, CCI-001464, CCI-002884. NIST SP 800-53 Rev. 4: AU-3, AU-12, AU-14, MA-4."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-9901de7216 |
      Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.

      If auditing is enabled late in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state information only available if auditing is enabled before a given process is created.
    remediation: &rem-9a5d65e54c |
      Enable auditing of processes that start prior to the audit daemon with the following command:

      $ sudo grubby --update-kernel=ALL --args="audit=1"

      Add or modify the following line in "/etc/default/grub" to ensure the configuration survives kernel updates:

      GRUB_CMDLINE_LINUX="audit=1"
  - id: "STIG-RHEL-09-212055-grub_audit-content"
    name: "RHEL 9 must enable auditing of processes that start prior to the audit daemon. (/etc/default/grub has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-212055, V-257796, SV-257796r1044847_rule, CAT III. CCI-000130, CCI-000135, CCI-000169, CCI-000172, CCI-001464, CCI-002884. NIST SP 800-53 Rev. 4: AU-3, AU-12, AU-14, MA-4."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect:
      - { some: "~ ^GRUB_CMDLINE_LINUX=\".*audit=1" }
      - { none: "~ ^GRUB_CMDLINE_LINUX=\".*audit=0" }
    rationale: *rat-9901de7216
    remediation: *rem-9a5d65e54c
  - id: "STIG-RHEL-09-214035-dnf_clean_reqs-attrs"
    name: "RHEL 9 must remove all software components after updated versions have been installed. (/etc/dnf/dnf.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-214035, V-257824, SV-257824r1286932_rule, CAT III. CCI-002617. NIST SP 800-53 Rev. 4: SI-2."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      f='/etc/dnf/dnf.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-0c6c7c1ec4 |
      Previous versions of software components that are not removed from the information system after updates have been installed may be exploited by some adversaries.
    remediation: &rem-80c3246036 |
      Configure RHEL 9 to remove all software components after updated versions have been installed.

      Edit the file "/etc/dnf/dnf.conf" by adding or editing the following line:

       clean_requirements_on_remove=True

      Note: Any of the following are acceptable: "1", "true", or "yes" (keywords containing letters are case insensitive).
  - id: "STIG-RHEL-09-214035-dnf_clean_reqs-content"
    name: "RHEL 9 must remove all software components after updated versions have been installed. (/etc/dnf/dnf.conf has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-214035, V-257824, SV-257824r1286932_rule, CAT III. CCI-002617. NIST SP 800-53 Rev. 4: SI-2."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      cat '/etc/dnf/dnf.conf'
    allow_rc: any
    expect:
      - { some: "~ ^clean_requirements_on_remove\\s*=\\s*1" }
      - { none: "~ ^clean_requirements_on_remove\\s*=\\s*[^1]" }
    rationale: *rat-0c6c7c1ec4
    remediation: *rem-80c3246036
  - id: "STIG-RHEL-09-231020-var_exists"
    name: "RHEL 9 must use a separate file system for /var."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-231020, V-257845, SV-257845r1268251_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/var'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: &rat-61970d2236 |
      Ensuring that "/var" is mounted on its own partition enables the setting of more restrictive mount options. This helps protect system services such as daemons or other programs which use it. It is not uncommon for the "/var" directory to contain world-writable directories installed by other software packages.
    remediation: &rem-fa7a0f5090 |
      Migrate the "/var" path onto a separate file system.
  - id: "STIG-RHEL-09-231025-var_log_exists"
    name: "RHEL 9 must use a separate file system for /var/log."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-231025, V-257846, SV-257846r1268251_rule, CAT III. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/var/log'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: &rat-1dacd76ab5 |
      Placing "/var/log" in its own partition enables better separation between log files and other files in "/var/".
    remediation: &rem-97c72055d4 |
      Migrate the "/var/log" path onto a separate file system.
  - id: "STIG-RHEL-09-231030-var_log_audit_exists"
    name: "RHEL 9 must use a separate file system for the system audit data path."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-231030, V-257847, SV-257847r1044924_rule, CAT III. CCI-001849. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/var/log/audit'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: &rat-2150817a90 |
      Placing "/var/log/audit" in its own partition enables better separation between audit files and other system files, and helps ensure that auditing cannot be halted due to the partition running out of space.
    remediation: &rem-922c8a5750 |
      Migrate the system audit data path onto a separate file system.
  - id: "STIG-RHEL-09-231195-cramfs_blacklist"
    name: "RHEL 9 must disable mounting of cramfs."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-231195, V-257880, SV-257880r1044951_rule, CAT III. CCI-000381. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      cat /etc/modprobe.conf /etc/modprobe.d/* 2>/dev/null | grep cramfs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^install cramfs /bin/false" }
      - { some: "~ ^blacklist cramfs" }
    rationale: &rat-1a18af8a6b |
      It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.

      Removing support for unneeded filesystem types reduces the local attack surface of the server.

      Compressed ROM/RAM file system (or cramfs) is a read-only file system designed for simplicity and space-efficiency. It is mainly used in embedded and small-footprint systems.
    remediation: &rem-1b9d279ee5 |
      To configure the system to prevent the cramfs kernel module from being loaded, add the following lines to the file /etc/modprobe.d/blacklist.conf (or create blacklist.conf if it does not exist):

      install cramfs /bin/false
      blacklist cramfs
  - id: "STIG-RHEL-09-252025-chrony_port-attrs"
