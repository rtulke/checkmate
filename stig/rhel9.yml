  - id: "STIG-RHEL-09-653060-audit_name_format-attrs"
    name: "RHEL 9 must label all offloaded audit logs before sending them to the central log server. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653060, V-258161, SV-258161r958416_rule, CAT II. CCI-000132, CCI-001851. NIST SP 800-53 Rev. 4: AU-3, AU-4."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-582b210710 |
      Enriched logging is needed to determine who, what, and when events occur on a system. Without this, determining root cause of an event will be much more difficult.

      When audit logs are not labeled before they are sent to a central log server, the audit data will not be able to be analyzed and tied back to the correct system.
    remediation: &rem-38171388cb |
      Edit the /etc/audit/auditd.conf file and add or update the "name_format" option:

      name_format = hostname

      The audit daemon must be restarted for changes to take effect.
  - id: "STIG-RHEL-09-653060-audit_name_format-content"
    name: "RHEL 9 must label all offloaded audit logs before sending them to the central log server. (/etc/audit/auditd.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653060, V-258161, SV-258161r958416_rule, CAT II. CCI-000132, CCI-001851. NIST SP 800-53 Rev. 4: AU-3, AU-4."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect: { some: "~ ^name_format = hostname" }
    rationale: *rat-582b210710
    remediation: *rem-38171388cb
  - id: "STIG-RHEL-09-653065-audit_overflow_action-attrs"
    name: "RHEL 9 must take appropriate action when the internal event queue is full. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653065, V-258162, SV-258162r1184331_rule, CAT II. CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-eb04933bfe |
      The audit system should have an action setup in the event the internal event queue becomes full so that no data is lost.  Information stored in one location is vulnerable to accidental or incidental deletion or alteration.

      Offloading is a common process in information systems with limited audit storage capacity.
    remediation: &rem-d747c3e466 |
      Edit the /etc/audit/auditd.conf file and add or update the "overflow_action" option:

      overflow_action = syslog

      The audit daemon must be restarted for changes to take effect.
