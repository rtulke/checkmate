  - id: "STIG-RHEL-09-653045-audit_admin_space_left-attrs"
    name: "RHEL 9 must take action when allocated audit record storage volume reaches 95 percent of the audit record storage capacity. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653045, V-258158, SV-258158r1263516_rule, CAT II. CCI-001855. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-615079a01b |
      If action is not taken when storage volume reaches 95 percent utilization, the auditing system may fail when the storage volume reaches capacity.

      While "%" is fully compliant for auditd.conf, you must account for how auditd processes it. The percentage-to-megabyte conversion occurs only when the audit daemon starts. If you dynamically resize the underlying logical volume/partition where /var/log/audit resides while the system is running, the daemon will not automatically know. You must reload it to trigger a recalculation.
    remediation: &rem-34bcf5e9a1 |
      Configure RHEL 9 to initiate an action when allocated audit record storage volume reaches 95 percent of the repository maximum audit record storage capacity by adding/modifying the following line in the /etc/audit/auditd.conf file.

      admin_space_left  = 5%
  - id: "STIG-RHEL-09-653045-audit_admin_space_left-content"
    name: "RHEL 9 must take action when allocated audit record storage volume reaches 95 percent of the audit record storage capacity. (/etc/audit/auditd.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653045, V-258158, SV-258158r1263516_rule, CAT II. CCI-001855. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect: { some: "~ ^admin_space_left = 5" }
    rationale: *rat-615079a01b
    remediation: *rem-34bcf5e9a1
  - id: "STIG-RHEL-09-653050-audit_admin_space_left_action-attrs"
    name: "RHEL 9 must take action when allocated audit record storage volume reaches 95 percent of the repository maximum audit record storage capacity. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653050, V-258159, SV-258159r971542_rule, CAT II. CCI-001855. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e14ac0f2ab |
      If action is not taken when storage volume reaches 95 percent utilization, the auditing system may fail when the storage volume reaches capacity.
    remediation: &rem-67047fceb8 |
      Configure "auditd" service  to take action in the event of allocated audit record storage volume reaches 95 percent of the repository maximum audit record storage capacity.

      Edit the following line in "/etc/audit/auditd.conf" to ensure that the system is forced into single user mode in the event the audit record storage volume is about to reach maximum capacity:

      admin_space_left_action = single

      The audit daemon must be restarted for changes to take effect.
  - id: "STIG-RHEL-09-653050-audit_admin_space_left_action-content"
    name: "RHEL 9 must take action when allocated audit record storage volume reaches 95 percent of the repository maximum audit record storage capacity. (/etc/audit/auditd.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653050, V-258159, SV-258159r971542_rule, CAT II. CCI-001855. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect: { some: "~ ^admin_space_left_action = single" }
    rationale: *rat-e14ac0f2ab
    remediation: *rem-67047fceb8
  - id: "STIG-RHEL-09-653055-audit_max_log_file_action-attrs"
    name: "RHEL 9 audit system must take appropriate action when the audit files have reached maximum size. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653055, V-258160, SV-258160r1038966_rule, CAT II. CCI-000140. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: *rat-bce1ecb987
    remediation: &rem-f3309d3c12 |
      Configure RHEL 9 to rotate the audit log when it reaches maximum size.

      Add or update the following line in "/etc/audit/auditd.conf" file:

      max_log_file_action = ROTATE
  - id: "STIG-RHEL-09-653055-audit_max_log_file_action-content"
    name: "RHEL 9 audit system must take appropriate action when the audit files have reached maximum size. (/etc/audit/auditd.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653055, V-258160, SV-258160r1038966_rule, CAT II. CCI-000140. NIST SP 800-53 Rev. 4: AU-5."
