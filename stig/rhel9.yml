  - id: "STIG-RHEL-09-255040-sshd_blank_passwd-attrs"
    name: "RHEL 9 SSHD must not allow blank passwords. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-255040, V-257984, SV-257984r1268229_rule, CAT I. CCI-000766. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-050a0575c0 |
      If an account has an empty password, anyone could log on and run commands with the privileges of that account. Accounts with empty passwords should never be used in operational environments.
    remediation: &rem-abfba32028 |
      To configure the system to prevent SSH users from logging on with blank passwords edit the following line in "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d":

      PermitEmptyPasswords no

      Restart the SSH daemon for the settings to take effect:

      $ sudo systemctl restart sshd.service
