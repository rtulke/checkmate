  - id: "STIG-RHEL-09-255035-ssh_config_pubkeyauth-attrs"
    name: "RHEL 9 SSHD must accept public key authentication. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-255035, V-257983, SV-257983r1268228_rule, CAT II. CCI-000765, CCI-000766, CCI-000767, CCI-000768. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e9c2549993 |
      Without the use of multifactor authentication, the ease of access to privileged functions is greatly increased. Multifactor authentication requires using two or more factors to achieve authentication. A privileged account is defined as an information system account with authorizations of a privileged user. A DoW common access card (CAC) with DoW-approved PKI is an example of multifactor authentication.
    remediation: &rem-b9c3612bbb |
      To configure the system, add or modify the following line in "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d".

