      ALL     ALL=(ALL) ALL
      ALL     ALL=(ALL:ALL) ALL
  - id: "STIG-RHEL-09-432035-pam_whell_su-attrs"
    name: "RHEL 9 must restrict the use of the su command. (/etc/pam.d/su: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-432035, V-258088, SV-258088r1155643_rule, CAT II. CCI-002038, CCI-002165, CCI-004895. NIST SP 800-53 Rev. 4: AC-3, IA-11."
    tags: [stig, stig-rhel9, stig-cat-2]
