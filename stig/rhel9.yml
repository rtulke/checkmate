  - id: "STIG-RHEL-09-653010-audit_installed"
    name: "RHEL 9 audit package must be installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653010, V-258151, SV-258151r1268225_rule, CAT II. CCI-000130, CCI-000131, CCI-000132, CCI-000133, CCI-000134, CCI-000135, CCI-000154, CCI-000158, CCI-000159, CCI-000169, CCI-000172, CCI-001464, CCI-001487, CCI-001814, CCI-001875, CCI-001876, CCI-001877, CCI-001878, CCI-001879, CCI-001880, CCI-001881, CCI-001882, CCI-001889, CCI-001914, CCI-002884, CCI-003938. NIST SP 800-53 Rev. 4: AU-3, AU-6, AU-7, AU-8, AU-12, AU-14, MA-4, CM-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet audit
    expect: true
    rationale: &rat-dfa84bde74 |
      Without establishing what type of events occurred, the source of events, where events occurred, and the outcome of events, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack.

      Audit record content that may be necessary to satisfy this requirement includes, for example, time stamps, source and destination addresses, user/process identifiers, event descriptions, success/fail indications, filenames involved, and access control or flow control rules invoked.

      Associating event types with detected events in audit logs provides a means of investigating an attack, recognizing resource utilization or capacity thresholds, or identifying an improperly configured RHEL 9 system.
    remediation: &rem-4d56f856da |
      Install the audit service package (if the audit service is not already installed) with the following command:

      $ sudo dnf install audit
  - id: "STIG-RHEL-09-653015-audit_enabled-enabled"
    name: "RHEL 9 audit service must be enabled. (Service auditd is enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653015, V-258152, SV-258152r1268225_rule, CAT II. CCI-000130, CCI-000131, CCI-000132, CCI-000133, CCI-000134, CCI-000135, CCI-000154, CCI-000158, CCI-000169, CCI-000172, CCI-001464, CCI-001487, CCI-001814, CCI-001875, CCI-001876, CCI-001877, CCI-001878, CCI-001879, CCI-001880, CCI-001881, CCI-001882, CCI-001889, CCI-001914, CCI-002884, CCI-003938, CCI-004188. NIST SP 800-53 Rev. 4: AU-3, AU-6, AU-7, AU-8, AU-12, AU-14, MA-4, CM-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState auditd | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-c0db7221fa |
      Without establishing what type of events occurred, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack. Ensuring the "auditd" service is active ensures audit records generated by the kernel are appropriately recorded.

      Additionally, a properly configured audit subsystem ensures that actions of individual system users can be uniquely traced to those users so they can be held accountable for their actions.
    remediation: &rem-476590a595 |
      To enable the auditd service run the following command:

      $ sudo systemctl enable --now auditd
  - id: "STIG-RHEL-09-653015-audit_enabled-running"
    name: "RHEL 9 audit service must be enabled. (Service auditd is running)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653015, V-258152, SV-258152r1268225_rule, CAT II. CCI-000130, CCI-000131, CCI-000132, CCI-000133, CCI-000134, CCI-000135, CCI-000154, CCI-000158, CCI-000169, CCI-000172, CCI-001464, CCI-001487, CCI-001814, CCI-001875, CCI-001876, CCI-001877, CCI-001878, CCI-001879, CCI-001880, CCI-001881, CCI-001882, CCI-001889, CCI-001914, CCI-002884, CCI-003938, CCI-004188. NIST SP 800-53 Rev. 4: AU-3, AU-6, AU-7, AU-8, AU-12, AU-14, MA-4, CM-5."
