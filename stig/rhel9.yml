  - id: "STIG-RHEL-09-271055-gui_session"
    name: "RHEL 9 must enable a user session lock until that user re-establishes access using established identification and authentication procedures for graphical user sessions."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-271055, V-258021, SV-258021r1015088_rule, CAT II. CCI-000056, CCI-000057, CCI-000058. NIST SP 800-53 Rev. 4: AC-11."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      gsettings get org.gnome.desktop.screensaver lock-enabled
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^true" }
      - { none: "~ ^false" }
    rationale: &rat-66bb3ce7e1 |
      A session lock is a temporary action taken when a user stops work and moves away from the immediate physical vicinity of the information system but does not want to log out because of the temporary nature of the absence.

      The session lock is implemented at the point where session activity can be determined.

      Regardless of where the session lock is determined and implemented, once invoked, the session lock must remain in place until the user reauthenticates. No other activity aside from reauthentication must unlock the system.
    remediation: &rem-2e3b02f2e8 |
      Configure RHEL 9 to enable a user's session lock until that user re-establishes access using established identification and authentication procedures.

      Create a database to contain the system-wide screensaver settings (if it does not already exist) with the following example:

      $ sudo vi /etc/dconf/db/local.d/00-screensaver

      Edit the "[org/gnome/desktop/screensaver]" section of the database file and add or update the following lines:

      # Set this to true to lock the screen when the screensaver activates
      lock-enabled=true

      Update the system databases:

      $ sudo dconf update
  - id: "STIG-RHEL-09-271060-gui_session_lock"
    name: "RHEL 9 must prevent a user from overriding the screensaver lock-enabled setting for the graphical user interface."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-271060, V-258022, SV-258022r1045097_rule, CAT II. CCI-000056, CCI-000057, CCI-000058. NIST SP 800-53 Rev. 4: AC-11."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      gsettings writable org.gnome.desktop.screensaver lock-enabled
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^false" }
      - { none: "~ ^true" }
    rationale: &rat-fdda3760ed |
      A session time-out lock is a temporary action taken when a user stops work and moves away from the immediate physical vicinity of the information system but does not log out because of the temporary nature of the absence. Rather than relying on the user to manually lock their operating system session prior to vacating the vicinity, operating systems need to be able to identify when a user's session has idled and take action to initiate the session lock.

      The session lock is implemented at the point where session activity can be determined and/or controlled.

      Implementing session settings will have little value if a user is able to manipulate these settings from the defaults prescribed in the other requirements of this implementation guide.
    remediation: &rem-1245ead33f |
      Configure RHEL 9 to prevent a user from overriding settings for graphical user interfaces.

      Create a database to contain the systemwide screensaver settings (if it does not already exist) with the following command:

      Note: The example below is using the database "local" for the system. If the system is using another database in "/etc/dconf/profile/user", the file should be created under the appropriate subdirectory.

      $ sudo touch /etc/dconf/db/local.d/locks/session

      Add the following setting to prevent nonprivileged users from modifying it:

      /org/gnome/desktop/screensaver/lock-enabled

      Run the following command to update the database:

      $ sudo dconf update
  - id: "STIG-RHEL-09-271065-gui_screensaver_timeout-attrs"
    name: "RHEL 9 must automatically lock graphical user sessions after 10 minutes of inactivity. (/etc/dconf/db/local.d/00-screensaver: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-271065, V-258023, SV-258023r1155656_rule, CAT II. CCI-000057, CCI-000060. NIST SP 800-53 Rev. 4: AC-11."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/dconf/db/local.d/00-screensaver'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d74ddcb9ee |
      A session time-out lock is a temporary action taken when a user stops work and moves away from the immediate physical vicinity of the information system but does not logout because of the temporary nature of the absence. Rather than relying on the user to manually lock their operating system session prior to vacating the vicinity, the GNOME desktop can be configured to identify when a user's session has idled and take action to initiate a session lock.
    remediation: &rem-10f82f76d5 |
      Configure RHEL 9 to initiate a screensaver after a 10-minute period of inactivity for graphical user interfaces.

      Create a database to contain the systemwide screensaver settings (if it does not already exist) with the following command:

      $ sudo touch /etc/dconf/db/local.d/00-screensaver

