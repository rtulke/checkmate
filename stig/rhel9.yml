  - id: "STIG-RHEL-09-411100-root_only_0"
    name: "The root account must be the only account having unrestricted access to RHEL 9 system."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411100, V-258059, SV-258059r1268251_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      awk -F: '$3 == 0 {print $1}' /etc/passwd | grep -wv root
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-238701a5c0 |
      An account has root authority if it has a user identifier (UID) of "0". Multiple accounts with a UID of "0" afford more opportunity for potential intruders to guess a password for a privileged account. Proper configuration of sudo is recommended to afford multiple system administrators access to root privileges in an accountable manner.
    remediation: &rem-5be607ea69 |
      Change the UID of any account on the system, other than root, that has a UID of "0".

      If the account is associated with system commands or applications, the UID should be changed to one greater than "0" but less than "1000". Otherwise, assign a UID of greater than "1000" that has not already been assigned.
  - id: "STIG-RHEL-09-431010-selinux_enforce-attrs"
    name: "RHEL 9 must use a Linux Security Module configured to enforce limits on system services. (/etc/selinux/config: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-431010, V-258078, SV-258078r958944_rule, CAT I. CCI-001084, CCI-002696. NIST SP 800-53 Rev. 4: SC-3, SI-6."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      f='/etc/selinux/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-28912bbed1 |
      Without verification of the security functions, security functions may not operate correctly and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.

      This requirement applies to operating systems performing security function verification/testing and/or systems and environments that require this functionality.
    remediation: &rem-21cb4f44aa |
      Configure RHEL 9 to verify correct operation of security functions.

      Edit the file "/etc/selinux/config" and add or modify the following line:

       SELINUX=enforcing

      A reboot is required for the changes to take effect.
  - id: "STIG-RHEL-09-431010-selinux_enforce-content"
    name: "RHEL 9 must use a Linux Security Module configured to enforce limits on system services. (/etc/selinux/config has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-431010, V-258078, SV-258078r958944_rule, CAT I. CCI-001084, CCI-002696. NIST SP 800-53 Rev. 4: SC-3, SI-6."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      cat '/etc/selinux/config'
    allow_rc: any
    expect:
      - { some: "~ (?i)^SELINUX\\s*=\\s*enforcing" }
      - { none: "~ (?i)^SELINUX\\s*=\\s*(disabled|permissive).*" }
    rationale: *rat-28912bbed1
    remediation: *rem-21cb4f44aa
  - id: "STIG-RHEL-09-431010-selinux_getenforce"
    name: "RHEL 9 must use a Linux Security Module configured to enforce limits on system services."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-431010, V-258078, SV-258078r958944_rule, CAT I. CCI-001084, CCI-002696. NIST SP 800-53 Rev. 4: SC-3, SI-6."
