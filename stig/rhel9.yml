      $ sudo dconf update
  - id: "STIG-RHEL-09-271115-gui_no_user_list"
    name: "RHEL 9 must disable the user list at logon for graphical user interfaces."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-271115, V-258033, SV-258033r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
