  - id: "STIG-RHEL-09-255175-ssh_config_x11uselocal-attrs"
    name: "RHEL 9 SSH daemon must prevent remote hosts from connecting to the proxy display. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-255175, V-258011, SV-258011r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-6b305598dd |
      When X11 forwarding is enabled, there may be additional exposure to the server and client displays if the sshd proxy display is configured to listen on the wildcard address. By default, sshd binds the forwarding server to the loopback address and sets the hostname part of the "DISPLAY" environment variable to localhost. This prevents remote hosts from connecting to the proxy display.
    remediation: &rem-e0501d2326 |
      Configure the SSH daemon to prevent remote hosts from connecting to the proxy display.

      Add the following line to "/etc/ssh/sshd_config" or to a file in "/etc/ssh/sshd_config.d", or uncomment the line and set the value to "yes":

      X11UseLocalhost yes

      The SSH service must be restarted for changes to take effect:

      $ sudo systemctl restart sshd.service
