    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-611075, V-258104, SV-258104r1015104_rule, CAT II. CCI-000198, CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_MIN_DAYS [1-9]" }
      - { none: "~ ^PASS_MIN_DAYS 0" }
    rationale: *rat-f07f69b149
    remediation: *rem-8985708ab6
  - id: "STIG-RHEL-09-611080-users_24hr_minpasswd_restrict"
    name: "RHEL 9 passwords must have a 24 hours minimum password lifetime restriction in /etc/shadow."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-611080, V-258105, SV-258105r1045212_rule, CAT II. CCI-000198, CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      awk -F: '$2 ~ /^\$/ && $4 < 1 {print $1 " " $4}' /etc/shadow
    expect: empty
    rationale: &rat-49171d3c83 |
      Enforcing a minimum password lifetime helps to prevent repeated password changes to defeat the password reuse or history enforcement requirement. If users are allowed to immediately and continually change their password, the password could be repeatedly changed in a short period of time to defeat the organization's policy regarding password reuse.
    remediation: &rem-78d4291c73 |
      Configure noncompliant accounts to enforce a 24 hour minimum password lifetime:

      $ sudo passwd -n 1 [user]
  - id: "STIG-RHEL-09-611085-sudoers_nopasswd"
    name: "RHEL 9 must require users to provide a password for privilege escalation."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-611085, V-258106, SV-258106r1102061_rule, CAT II. CCI-002038, CCI-004895. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep -rhiE '^[^#]*NOPASSWD' /etc/sudoers /etc/sudoers.d 2>/dev/null || true
    expect: empty
    rationale: *rat-a7bf9120f6
    remediation: &rem-7d530bed68 |
      Configure RHEL 9 to not allow users to execute privileged actions without authenticating with a password.

      Remove any occurrence of "NOPASSWD" found in "/etc/sudoers" file or files in the "/etc/sudoers.d" directory.

      $ sudo find /etc/sudoers /etc/sudoers.d -type f -exec sed -i '/NOPASSWD/ s/^/# /g' {} \;
  - id: "STIG-RHEL-09-611090-pwquality_minlen-attrs"
    name: "RHEL 9 passwords must be created with a minimum of 15 characters. (/etc/security/pwquality.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-611090, V-258107, SV-258107r1262152_rule, CAT II. CCI-000205, CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/security/pwquality.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d8ce1d3652 |
      The shorter the password, the lower the number of possible combinations that need to be tested before the password is compromised.

      Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks. Password length is one factor of several that helps to determine strength and how long it takes to crack a password. Use of more characters in a password helps to increase exponentially the time and/or resources required to compromise the password.

      RHEL 9 uses "pwquality" as a mechanism to enforce password complexity. Configurations are set in the "etc/security/pwquality.conf" file.

      The "minlen", sometimes noted as minimum length, acts as a "score" of complexity based on the credit components of the "pwquality" module. By setting the credit components to a negative value, not only will those components be required, but they will not count toward the total "score" of "minlen". This will enable "minlen" to require a 15-character minimum.

      The DoW minimum password requirement is 15 characters.
    remediation: &rem-1d716c826b |
      Configure RHEL 9 to enforce a minimum 15-character password length.

      Add or update the following line in the "/etc/security/pwquality.conf" file or a configuration file in the "/etc/security/pwquality.conf.d/" directory to contain the "minlen" parameter:

      minlen = 15
