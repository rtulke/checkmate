    name: "The RHEL 9 SSH client must be configured to use only DoW-approved encryption ciphers employing FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH client connections. (/etc/crypto-policies/back-ends/openssh.config has the expected conten…)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-255064, V-270177, SV-270177r1268237_rule, CAT I. CCI-001453. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      cat '/etc/crypto-policies/back-ends/openssh.config'
    allow_rc: any
    expect:
      - { some: "~ ^Ciphers .*aes256-gcm@openssh.com" }
      - { some: "~ ^Ciphers .*aes256-ctr" }
      - { some: "~ ^Ciphers .*aes128-gcm@openssh.com" }
