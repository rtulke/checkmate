  - id: "STIG-RHEL-09-412080-term_idle_session-attrs"
    name: "RHEL 9 must terminate idle user sessions. (/etc/systemd/logind.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-412080, V-258077, SV-258077r1262114_rule, CAT II. CCI-001133. NIST SP 800-53 Rev. 4: SC-10."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/systemd/logind.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-7bc360e78a |
      Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel to take control of a management session enabled on the console or console port that has been left unattended.
    remediation: &rem-96f226fbab |
      Configure RHEL 9 to log out idle sessions.

      Create the directory if necessary:

      $ mkdir -p /etc/systemd/logind.conf.d/

      Create a *.conf file in /etc/systemd/logind.conf.d/ with the following content:

      [Login]
      StopIdleSessionSec=600
      KillUserProcesses=no

      Restart systemd-logind:

      $ systemctl restart systemd-logind
