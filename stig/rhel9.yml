  - id: "STIG-RHEL-09-651010-aide_db_moved-attrs"
    name: "RHEL 9 must have the AIDE package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-651010, V-258134, SV-258134r1262119_rule, CAT II. CCI-001744, CCI-002696. NIST SP 800-53 Rev. 4: CM-3, SI-6."
