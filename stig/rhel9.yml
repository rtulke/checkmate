  - id: "STIG-RHEL-09-671010-fips_enabled"
    name: "RHEL 9 must enable FIPS mode."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-671010, V-258230, SV-258230r1268222_rule, CAT I. CCI-000068, CCI-000877, CCI-002418, CCI-002450. NIST SP 800-53 Rev. 4: AC-17, MA-4, SC-8, SC-13."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    timeout: 120000ms
    run: |
      fips-mode-setup --check
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ FIPS mode is enabled." }
      - { none: "~ FIPS mode is disabled." }
      - { none: "~ Inconsistent state detected." }
    rationale: &rat-1fca8aeead |
      Use of weak or untested encryption algorithms undermines the purposes of using encryption to protect data. The operating system must implement cryptographic modules adhering to the higher standards approved by the federal government because this provides assurance they have been tested and validated.
    remediation: &rem-28140bc252 |
      Configure RHEL 9 to implement FIPS mode.

      If this check fails on an installed system, it is a permanent finding until the system is reinstalled with "fips=1" during installation.
  - id: "STIG-RHEL-09-671020-ipsec_libreswan-attrs"
    name: "RHEL 9 IP tunnels must use FIPS 140-3 approved cryptographic algorithms. (/etc/ipsec.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-671020, V-258232, SV-258232r1268222_rule, CAT I. CCI-000068. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      f='/etc/ipsec.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f44529530e |
      Overriding the system crypto policy makes the behavior of the Libreswan service violate expectations, and makes system configuration more fragmented.
    remediation: &rem-459df70992 |
      Configure Libreswan to use the system cryptographic policy.

      Add the following line to "/etc/ipsec.conf":

      include /etc/crypto-policies/back-ends/libreswan.config
  - id: "STIG-RHEL-09-671020-ipsec_libreswan-content"
    name: "RHEL 9 IP tunnels must use FIPS 140-3 approved cryptographic algorithms. (/etc/ipsec.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-671020, V-258232, SV-258232r1268222_rule, CAT I. CCI-000068. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      cat '/etc/ipsec.conf'
    allow_rc: any
    expect: { some: "~ ^include /etc/crypto-policies/back-ends/libreswan.config" }
    rationale: *rat-f44529530e
    remediation: *rem-459df70992
  - id: "STIG-RHEL-09-672020-crypto_policy_fips"
    name: "RHEL 9 cryptographic policy must not be overridden."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-672020, V-258236, SV-258236r1101920_rule, CAT I. CCI-002450, CCI-002890, CCI-003123. NIST SP 800-53 Rev. 4: MA-4, SC-13."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    timeout: 120000ms
    run: |
      update-crypto-policies --check
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^The configured policy matches the generated policy$" }
    rationale: *rat-d9cd3cc736
    remediation: &rem-9c9e7747f8 |
      Configure RHEL 9 to correctly implement the systemwide cryptographic policies by reinstalling the crypto-policies package contents.

      Reinstall crypto-policies with the following command:

      $ sudo dnf -y reinstall crypto-policies

      Set the crypto-policy to FIPS with the following command:

      $ sudo update-crypto-policies --set FIPS

      Setting system policy to FIPS

      Note: Systemwide crypto policies are applied on application startup. It is recommended to restart the system for the change of policies to fully take place.
  - id: "STIG-RHEL-09-672020-crypto_policy_fips_backends"
    name: "RHEL 9 cryptographic policy must not be overridden. (back-ends link to the FIPS policy)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-672020, V-258236, SV-258236r1101920_rule, CAT I. CCI-002450, CCI-002890, CCI-003123. NIST SP 800-53 Rev. 4: MA-4, SC-13."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    timeout: 120000ms
    run: |
      ls -l /etc/crypto-policies/back-ends/
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~  bind[.]config -\u003e /usr/share/crypto-policies/FIPS/bind[.]txt$" }
      - { some: "~  gnutls[.]config -\u003e /usr/share/crypto-policies/FIPS/gnutls[.]txt$" }
      - { some: "~  java[.]config -\u003e /usr/share/crypto-policies/FIPS/java[.]txt$" }
      - { some: "~  javasystem[.]config -\u003e /usr/share/crypto-policies/FIPS/javasystem[.]txt$" }
      - { some: "~  krb5[.]config -\u003e /usr/share/crypto-policies/FIPS/krb5[.]txt$" }
      - { some: "~  libreswan[.]config -\u003e /usr/share/crypto-policies/FIPS/libreswan[.]txt$" }
      - { some: "~  libssh[.]config -\u003e /usr/share/crypto-policies/FIPS/libssh[.]txt$" }
      - { some: "~  openssh[.]config -\u003e /usr/share/crypto-policies/FIPS/openssh[.]txt$" }
      - { some: "~  opensshserver[.]config -\u003e /usr/share/crypto-policies/FIPS/opensshserver[.]txt$" }
      - { some: "~  opensslcnf[.]config -\u003e /usr/share/crypto-policies/FIPS/opensslcnf[.]txt$" }
      - { some: "~  openssl[.]config -\u003e /usr/share/crypto-policies/FIPS/openssl[.]txt$" }
      - { some: "~  openssl_fips[.]config -\u003e /usr/share/crypto-policies/FIPS/openssl_fips[.]txt$" }
      - { some: "~ ^-.* nss[.]config$" }
    rationale: *rat-d9cd3cc736
    remediation: *rem-9c9e7747f8
  - id: "STIG-RHEL-09-672050-crypto-policies_bind-attrs"
    name: "RHEL 9 must implement DoW-approved encryption in the bind package. (/etc/named.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-672050, V-258242, SV-258242r1262158_rule, CAT I. CCI-002418, CCI-002422. NIST SP 800-53 Rev. 4: SC-8."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      f='/etc/named.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-5323b5fbef |
      Without cryptographic integrity protections, information can be altered by unauthorized users without detection.

      Cryptographic mechanisms used for protecting the integrity of information include, for example, signed hash functions using asymmetric cryptography enabling distribution of the public key to verify the hash information while maintaining the confidentiality of the secret key used to generate the hash.

      RHEL 9 incorporates system-wide crypto policies by default. The employed algorithms can be viewed in the /etc/crypto-policies/back-ends/ directory.
    remediation: &rem-52fb729a76 |
      Configure BIND to use the system crypto policy.

      Add the following line to the "options" section in "/etc/named.conf":

      include "/etc/crypto-policies/back-ends/bind.config";
  - id: "STIG-RHEL-09-672050-crypto-policies_bind-content"
    name: "RHEL 9 must implement DoW-approved encryption in the bind package. (/etc/named.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-672050, V-258242, SV-258242r1262158_rule, CAT I. CCI-002418, CCI-002422. NIST SP 800-53 Rev. 4: SC-8."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      cat '/etc/named.conf'
    allow_rc: any
    expect: { some: "~ ^include \"\\/etc\\/crypto-policies\\/back-ends\\/bind.config\";." }
    rationale: *rat-5323b5fbef
    remediation: *rem-52fb729a76
  - id: "STIG-RHEL-09-672055-openssl_cnf_crypto_policy_include-attrs"
    name: "RHEL 9 must implement DoW-approved encryption in the OpenSSL package. (/etc/pki/tls/openssl.cnf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-672055, V-288833, SV-288833r1268237_rule, CAT I. CCI-001453. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      f='/etc/pki/tls/openssl.cnf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-8034674a0f |
      Without cryptographic integrity protections, information can be altered by unauthorized users without detection.

      Remote access (e.g., RDP) is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      Cryptographic mechanisms used for protecting the integrity of information include, for example, signed hash functions using asymmetric cryptography enabling distribution of the public key to verify the hash information while maintaining the confidentiality of the secret key used to generate the hash.

      The employed algorithms can be viewed in the "/etc/crypto-policies/back-ends/openssl.config" file.
    remediation: &rem-b9dabe3e8b |
      Configure the RHEL 9 OpenSSL library to use the systemwide cryptographic policy.

      Edit the "/etc/pki/tls/openssl.cnf" and add or modify the following line:

      .include = /etc/crypto-policies/back-ends/opensslcnf.config
  - id: "STIG-RHEL-09-672055-openssl_cnf_crypto_policy_include-content"
    name: "RHEL 9 must implement DoW-approved encryption in the OpenSSL package. (/etc/pki/tls/openssl.cnf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-672055, V-288833, SV-288833r1268237_rule, CAT I. CCI-001453. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      cat '/etc/pki/tls/openssl.cnf'
    allow_rc: any
    expect: { some: "~ ^\\s*\\.include\\s*=?\\s*\\/etc\\/crypto-policies\\/back-ends\\/opensslcnf\\.config\\s*$" }
    rationale: *rat-8034674a0f
    remediation: *rem-b9dabe3e8b
  - id: "STIG-RHEL-09-211015-dnf_check_updates"
    name: "RHEL 9 vendor packaged system security patches and updates must be installed and up to date."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-211015, V-257778, SV-257778r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      dnf check-update | grep -v Last | grep -cE "\.noarch|\.x86_64|\.386"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^0" }
      - { none: "~ ^[1-9]" }
    rationale: &rat-88d7f03073 |
      Installing software updates is a fundamental mitigation against the exploitation of publicly known vulnerabilities. If the most recent security patches and updates are not installed, unauthorized users may take advantage of weaknesses in the unpatched software. The lack of prompt attention to patching could result in a system compromise.
    remediation: &rem-ca4c629d74 |
      Install RHEL 9 security patches and updates at the organizationally defined frequency. If system updates are installed via a centralized repository that is configured on the system, all updates can be installed with the following command:

      $ sudo dnf update
  - id: "STIG-RHEL-09-211020-check_login_banner-attrs"
    name: "RHEL 9 must display the Standard Mandatory DoW Notice and Consent Banner before granting local or remote access to the system via a command line user logon. (/etc/issue: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-211020, V-257779, SV-257779r1268215_rule, CAT II. CCI-000048, CCI-001384, CCI-001385, CCI-001386, CCI-001387, CCI-001388. NIST SP 800-53 Rev. 4: AC-8."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-0ec6edd523 |
      Display of a standardized and approved use notification before granting access to the operating system ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies, regulations, standards, and guidance.

      System use notifications are required only for access via login interfaces with human users and are not required when such human interfaces do not exist.
    remediation: &rem-dca9034bbe |
      Configure RHEL 9 to display the Standard Mandatory DoW Notice and Consent Banner before granting access to the system via command line logon.

      Edit the "/etc/issue" file to replace the default text with the Standard Mandatory DoW Notice and Consent Banner. The DoW-required text is:

      "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.

      By using this IS (which includes any device attached to this IS), you consent to the following conditions:

      -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.

      -At any time, the USG may inspect and seize data stored on this IS.

      -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.

      -This IS includes security measures (e.g., authentication and access controls) to protect USG interests -- not for your personal benefit or privacy.

      -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details."
  - id: "STIG-RHEL-09-211020-check_login_banner-content"
    name: "RHEL 9 must display the Standard Mandatory DoW Notice and Consent Banner before granting local or remote access to the system via a command line user logon. (/etc/issue has the expected content (7 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-211020, V-257779, SV-257779r1268215_rule, CAT II. CCI-000048, CCI-001384, CCI-001385, CCI-001386, CCI-001387, CCI-001388. NIST SP 800-53 Rev. 4: AC-8."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/issue'
    allow_rc: any
    expect:
      - { some: "~ You are accessing a U\\.S\\. Government \\(USG\\) Information System \\(IS\\) that is provided for USG-authorized use only\\." }
      - { some: "~ By using this IS \\(which includes any device attached to this IS\\), you consent to the following conditions" }
      - { some: "~ -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct \\(PM\\), law enforcement \\(LE\\), and counterintelligence \\(CI\\) investigations\\." }
      - { some: "~ -At any time, the USG may inspect and seize data stored on this IS\\." }
      - { some: "~ -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose\\." }
      - { some: "~ -This IS includes security measures \\(e\\.g\\., authentication and access controls\\) to protect USG interests--not for your personal benefit or privacy\\." }
      - { some: "~ -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants\\. Such communications and work product are private and confidential\\. See User Agreement for details\\." }
    rationale: *rat-0ec6edd523
    remediation: *rem-dca9034bbe
  - id: "STIG-RHEL-09-211030-check_multiuser"
    name: "The graphical display manager must not be the default target on RHEL 9 unless approved."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-211030, V-257781, SV-257781r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl get-default
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ multi-user\\.target" }
    rationale: &rat-a5aa75d6a7 |
      Unnecessary service packages must not be installed to decrease the attack surface of the system. Graphical display managers have a long history of security vulnerabilities and must not be used, unless approved and documented.
    remediation: &rem-8d0bb6315c |
      Document the requirement for a graphical user interface with the ISSO or set the default target to multi-user with the following command:

      $ sudo systemctl set-default multi-user.target
  - id: "STIG-RHEL-09-211040-systemd-journald-enabled"
    name: "RHEL 9 systemd-journald service must be enabled. (Service systemd-journald is enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-211040, V-257783, SV-257783r991562_rule, CAT II. CCI-001665. NIST SP 800-53 Rev. 4: SC-24."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journald | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-ae2acc3813 |
      In the event of a system failure, RHEL 9 must preserve any information necessary to determine cause of failure and any information necessary to return to operations with least disruption to system processes.
    remediation: &rem-2609c5df0b |
      To enable the systemd-journald service, run the following command:

      $ sudo systemctl enable --now systemd-journald
  - id: "STIG-RHEL-09-211040-systemd-journald-running"
    name: "RHEL 9 systemd-journald service must be enabled. (Service systemd-journald is running)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-211040, V-257783, SV-257783r991562_rule, CAT II. CCI-001665. NIST SP 800-53 Rev. 4: SC-24."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journald | cut -d= -f2
    expect: "== active"
    rationale: *rat-ae2acc3813
    remediation: *rem-2609c5df0b
  - id: "STIG-RHEL-09-211055-debug-shell-enabled"
    name: "RHEL 9 debug-shell systemd service must be disabled. (Service debug-shell.service is not enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-211055, V-257786, SV-257786r1044834_rule, CAT II. CCI-002235. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState debug-shell.service | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-16ee4d891c |
      The debug-shell requires no authentication and provides root privileges to anyone who has physical access to the machine. While this feature is disabled by default, masking it adds an additional layer of assurance that it will not be enabled via a dependency in systemd. This also prevents attackers with physical access from trivially bypassing security on the machine through valid troubleshooting configurations and gaining root access when the system is rebooted.
    remediation: &rem-b9538149ea |
      Configure RHEL 9 to mask the debug-shell systemd service with the following command:

      $ sudo systemctl disable --now debug-shell.service
      $ sudo systemctl mask --now debug-shell.service
  - id: "STIG-RHEL-09-211055-debug-shell-running"
    name: "RHEL 9 debug-shell systemd service must be disabled. (Service debug-shell.service is not running)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-211055, V-257786, SV-257786r1044834_rule, CAT II. CCI-002235. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState debug-shell.service | cut -d= -f2
    expect: "!= active"
    rationale: *rat-16ee4d891c
    remediation: *rem-b9538149ea
  - id: "STIG-RHEL-09-211055-debug_shell_masked-attrs"
    name: "RHEL 9 debug-shell systemd service must be disabled."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-211055, V-257786, SV-257786r1044834_rule, CAT II. CCI-002235. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/systemd/system/debug-shell.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: *rat-16ee4d891c
    remediation: *rem-b9538149ea
  - id: "STIG-RHEL-09-212010-grub_superusers-attrs"
    name: "RHEL 9 must require authentication upon booting into single-user and maintenance modes. (/etc/grub2.cfg: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-212010, V-257787, SV-257787r1268226_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/grub2.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-eb5d5df920 |
      To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates by DoW-approved PKIs, all DoW systems (e.g., web servers and web portals) must be properly configured to incorporate access control methods that do not rely solely on the possession of a certificate for access. Successful authentication must not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use access control policies and enforcement mechanisms to implement this requirement.

      Password protection on the boot loader configuration ensures users with physical access cannot trivially alter important bootloader settings. These include which kernel to use, and whether to enter single-user mode.
    remediation: &rem-4e232156e6 |
      Configure RHEL 9 to require a grub bootloader password for the grub superuser account.

      Generate an encrypted grub2 password for the grub superuser account with the following command:

      $ sudo grub2-setpassword
      Enter password:
      Confirm password:
  - id: "STIG-RHEL-09-212010-grub_superusers-content"
    name: "RHEL 9 must require authentication upon booting into single-user and maintenance modes. (/etc/grub2.cfg has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-212010, V-257787, SV-257787r1268226_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/grub2.cfg'
    allow_rc: any
    expect: { some: "~ password_pbkdf2\\s+root\\s+\\${GRUB2_PASSWORD}" }
    rationale: *rat-eb5d5df920
    remediation: *rem-4e232156e6
  - id: "STIG-RHEL-09-212010-grub_users_password-attrs"
    name: "RHEL 9 must require authentication upon booting into single-user and maintenance modes. (/boot/grub2/user.cfg: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-212010, V-257787, SV-257787r1268226_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/boot/grub2/user.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: *rat-eb5d5df920
    remediation: *rem-4e232156e6
  - id: "STIG-RHEL-09-212010-grub_users_password-content"
    name: "RHEL 9 must require authentication upon booting into single-user and maintenance modes. (/boot/grub2/user.cfg has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-212010, V-257787, SV-257787r1268226_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
