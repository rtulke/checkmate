    name: "RHEL 9 must notify the system administrator (SA) and information system security officer (ISSO) (at a minimum) when allocated audit record storage volume reaches 75 percent utilization. (/etc/audit/auditd.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653040, V-258157, SV-258157r1134932_rule, CAT II. CCI-001855. NIST SP 800-53 Rev. 4: AU-5."
