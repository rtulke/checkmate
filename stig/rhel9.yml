  - id: "STIG-RHEL-09-212035-default_grub_vsyscall-attrs"
    name: "RHEL 9 must disable virtual system calls. (/etc/default/grub: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-212035, V-257792, SV-257792r1268251_rule, CAT II. CCI-001084. NIST SP 800-53 Rev. 4: SC-3."
