  - id: "STIG-RHEL-09-213085-backtrace_coredump-attrs"
    name: "RHEL 9 must disable core dump backtraces. (/etc/systemd/coredump.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-213085, V-257812, SV-257812r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
