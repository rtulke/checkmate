    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-412035, V-258068, SV-258068r1101950_rule, CAT II. CCI-000057, CCI-001133. NIST SP 800-53 Rev. 4: SC-10, AC-11."
