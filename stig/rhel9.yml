    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ Permissions Incorrect.*" }
    rationale: *rat-3ffc80c188
    remediation: &rem-7c317c115e |
      Configure the systemwide shared library files contained in the directories "/lib", "/lib64", "/usr/lib", and "/usr/lib64" to have mode 0755 or less permissive with the following command.

      $ sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' -perm /022 -exec chmod go-w {} +
  - id: "STIG-RHEL-09-232025-var_log_dir_perms-attrs"
    name: "RHEL 9 /var/log directory must have mode 0755 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232025, V-257885, SV-257885r1044953_rule, CAT II. CCI-001314. NIST SP 800-53 Rev. 4: SI-11."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/var/log'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -d "$f" ] || echo "$f is not a directory"
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7022)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
    expect: empty
    rationale: &rat-250b77ae0f |
      Only authorized personnel should be aware of errors and the details of the errors. Error messages are an indicator of an organization's operational state or can identify the RHEL 9 system or platform. Additionally, personally identifiable information (PII) and operational information must not be revealed through error messages to unauthorized personnel or their designated representatives.

      The structure and content of error messages must be carefully considered by the organization and development team. The extent to which the information system is able to identify and handle error conditions is guided by organizational policy and operational requirements.
    remediation: &rem-80d75e5cf6 |
      Configure the "/var/log" directory to a mode of "0755" by running the following command:

      $ sudo chmod 0755 /var/log
  - id: "STIG-RHEL-09-232030-var_log_msgs_perms-attrs"
    name: "RHEL 9 /var/log/messages file must have mode 0640 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232030, V-257886, SV-257886r1044955_rule, CAT II. CCI-001314. NIST SP 800-53 Rev. 4: SI-11."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/var/log/messages'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -f "$f" ] || echo "$f is not a regular file"
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7137)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
    expect: empty
    rationale: *rat-250b77ae0f
    remediation: &rem-478f104007 |
      Configure the "/var/log/messages" file to have a mode of "0640" by running the following command:

      $ sudo chmod 0640 /var/log/messages
  - id: "STIG-RHEL-09-232035-audit_tools_perms"
    name: "RHEL 9 audit tools must have a mode of 0755 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232035, V-257887, SV-257887r991557_rule, CAT II. CCI-001493. NIST SP 800-53 Rev. 4: AU-9."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      stat -c "%n_%a" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules /sbin/rsyslogd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_7(0|5)(0|5)$" }
    rationale: &rat-c0b147aeea |
      Protecting audit information also includes identifying and protecting the tools used to view and manipulate log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information.

      RHEL 9 systems providing tools to interface with audit information will leverage user permissions and roles identifying the user accessing the tools, and the corresponding rights the user enjoys, to make access decisions regarding the access to audit tools.

      Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.
    remediation: &rem-64eb5a1c19 |
      Configure the audit tools to have a mode of "0755" by running the following command:

      $ sudo chmod 0755 [audit_tool]

      Replace "[audit_tool]" with each audit tool that has a more permissive mode than 0755.
  - id: "STIG-RHEL-09-232040-crondirs_perms"
    name: "RHEL 9 permissions of cron configuration files and directories must not be modified from the operating system defaults."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232040, V-257888, SV-257888r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      find /etc -type d -name  cron.* ! -perm 755
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-25c86f8be6 |
      If the permissions of cron configuration files or directories are modified from the operating system defaults, it may be possible for individuals to insert unauthorized cron jobs that perform unauthorized actions, including potentially escalating privileges.
    remediation: &rem-b4d93a6709 |
      Run the following commands to restore the permissions of cron configuration files and directories to the operating system defaults:

      $ sudo dnf reinstall cronie crontabs
      $ rpm --setugids cronie crontabs
      $ rpm --setperms cronie crontabs
  - id: "STIG-RHEL-09-232040-cronfiles_perms"
    name: "RHEL 9 permissions of cron configuration files and directories must not be modified from the operating system defaults."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232040, V-257888, SV-257888r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      for file in /etc/crontab /etc/cron.allow /etc/cron.deny /etc/cron.d/0hourly; do stat -c "%a" $file 2> /dev/null | grep -v 644; done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: *rat-25c86f8be6
    remediation: *rem-b4d93a6709
  - id: "STIG-RHEL-09-232045-user_initiate_files"
    name: "All RHEL 9 local initialization files must have mode 0740 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232045, V-257889, SV-257889r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      find /home/ -name "\.*" -perm /g+wx,o+wx
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-62a8c7fef3 |
      Local initialization files are used to configure the user's shell environment upon logon. Malicious modification of these files could compromise accounts upon logon.
    remediation: &rem-acf4955fbc |
      Set the mode of the local initialization files to "0740" with the following command:

      Note: The example will be for the disauser user, who has a home directory of "/home/disauser".

      $ sudo chmod 0740 /home/disauser/.<INIT_FILE>
  - id: "STIG-RHEL-09-232050-home_dirs_perms"
    name: "All RHEL 9 local interactive user home directories must have mode 0750 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232050, V-257890, SV-257890r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      awk -F: '($3>=1000)&&($7 !~ /nologin/){print $6}' /etc/passwd | while read -r d; do
        if [ -d "$d" ]; then find "$d" -maxdepth 0 -perm /027 -printf '%m %p\n'; fi
      done
    expect: empty
    rationale: &rat-c8d6f7441c |
      Excessive permissions on local interactive user home directories may allow unauthorized access to user files by other users.
    remediation: &rem-3bbd9621bd |
      Change the mode of interactive user's home directories to "0750" using the following command:

      Note: The example will be for the user "disauser".

      $ sudo chmod 0750 /home/disauser
