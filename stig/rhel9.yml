name: DISA STIG Red Hat Enterprise Linux 9
version: "2.10.0"
description: >
  Automated checks for 426 rules of the DISA Security Technical
  Implementation Guide for Red Hat Enterprise Linux 9 (version 2.10.0), converted from the goss
  audit content of the ansible-lockdown project. Severity follows the STIG
  category: CAT I high, CAT II medium, CAT III low. Rationale and fix
  texts are taken from the DISA STIG V2R10 (30 Sep 2026). Select categories
  with tags, e.g. `--tags stig-cat-1`.

defaults:
  when: "(facts.distro == \"rhel\" or \"rhel\" in facts.distro_like) and facts.version_major == 9"
  timeout: 120s

checks:
  - id: "STIG-RHEL-09-211010-rhel_version_supported-attrs"
    name: "RHEL 9 must be a vendor-supported release. (/etc/redhat-release: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-211010, V-257777, SV-257777r1268251_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      f='/etc/redhat-release'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-db321c04b3 |
      An operating system release is considered "supported" if the vendor continues to provide security patches for the product. With an unsupported release, it will not be possible to resolve security issues discovered in the system software.

      End Of Life dates for Red Hat Linux 9 releases are as follows:
      Current end of Full Support for Red Hat Linux 9 is 31 May 2027.
      Current end of Maintenance Support for Red Hat Linux 9 is 31 May 3032.
      Current end of Extended Life Cycle Support (ELS) for Red Hat Linux 9 is 31 May 2035.
    remediation: &rem-a5b42f3a59 |
      Upgrade to a supported version of RHEL 9.
  - id: "STIG-RHEL-09-211010-rhel_version_supported-content"
    name: "RHEL 9 must be a vendor-supported release. (/etc/redhat-release has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-211010, V-257777, SV-257777r1268251_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      cat '/etc/redhat-release'
    allow_rc: any
    expect: { some: "~ .*9.[6-9]" }
    rationale: *rat-db321c04b3
    remediation: *rem-a5b42f3a59
  - id: "STIG-RHEL-09-211045-ctrl_alt_del"
    name: "The systemd Ctrl-Alt-Delete burst key sequence in RHEL 9 must be disabled."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-211045, V-257784, SV-257784r1262100_rule, CAT I. CCI-002235. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      grep -hs '^[[:space:]]*CtrlAltDelBurstAction[[:space:]]*=' /etc/systemd/system.conf /etc/systemd/system.conf.d/*.conf || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^[[:space:]]*CtrlAltDelBurstAction[[:space:]]*=[[:space:]]*none" }
      - { none: "~ ^[[:space:]]*CtrlAltDelBurstAction[[:space:]]*=[[:space:]]*(reboot.*|poweroff.*)" }
    rationale: &rat-d0d038d026 |
      A locally logged-on user who presses Ctrl-Alt-Delete when at the console can reboot the system. If accidentally pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term loss of availability of systems due to unintentional reboot. In a graphical user environment, risk of unintentional reboot from the Ctrl-Alt-Delete sequence is reduced because the user will be prompted before any action is taken.
    remediation: &rem-324f40f8ed |
      Configure RHEL 9 to disable the CtrlAltDelBurstAction by adding it to a drop file in a "/etc/systemd/system.conf.d/" configuration file:

      If no drop file exists, create one with the following command:

      $ sudo mkdir -p /etc/systemd/system.conf.d && sudo vi /etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.conf

      Edit the file to contain the setting by adding the following text:

      [Manager]
      CtrlAltDelBurstAction=none

      Reload the daemon for this change to take effect.

      $ sudo systemctl daemon-reload
  - id: "STIG-RHEL-09-211050-ctrl-alt-del.target-enabled"
    name: "The x86 Ctrl-Alt-Delete key sequence must be disabled on RHEL 9. (Service ctrl-alt-del.target is not enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-211050, V-257785, SV-257785r1044833_rule, CAT I. CCI-002235. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
