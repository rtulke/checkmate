    run: |
      rpm -q --quiet sudo
    expect: true
    rationale: &rat-d89f5f6c9f |
      "sudo" is a program designed to allow a system administrator to give limited root privileges to users and log root activity. The basic philosophy is to give as few privileges as possible but still allow system users to get their work done.
    remediation: &rem-80ee61ccda |
      The  sudo  package can be installed with the following command:

      $ sudo dnf install sudo
  - id: "STIG-RHEL-09-432015-sudo_reauth"
    name: "RHEL 9 must require reauthentication when using the sudo command."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-432015, V-258084, SV-258084r1262115_rule, CAT II. CCI-002038, CCI-004895. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep -i 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^.*:Defaults timestamp_timeout=0" }
      - { none: "~ ^.*:Defaults timestamp_timeout\\s*=\\s*-\\d" }
    rationale: &rat-48548628bc |
      Without reauthentication, users may access resources or perform tasks for which they do not have authorization.

      When operating systems provide the capability to escalate a functional capability, it is critical the organization requires the user to reauthenticate when using the "sudo" command.

      If the value is set to an integer less than "0", the user's time stamp will not expire and the user will not have to reauthenticate for privileged actions until the user's session is terminated.
    remediation: &rem-b959de8177 |
      Configure RHEL 9 to reauthenticate every invocation of the "sudo" command.

      Add the following line to "/etc/sudoers" or a file in "/etc/sudoers.d":

      Defaults timestamp_timeout=0

      Remove any duplicate definitions.
  - id: "STIG-RHEL-09-432020-sudo_password_required"
    name: "RHEL 9 must use the invoking user's password for privilege escalation when using sudo."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-432020, V-258085, SV-258085r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep -Ei '(!rootpw|!targetpw|!runaspw)' /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^.*:Defaults !targetpw" }
      - { some: "~ ^.*:Defaults !rootpw" }
      - { some: "~ ^.*:Defaults !runaspw" }
    rationale: &rat-44bc1ef72d |
      If the rootpw, targetpw, or runaspw flags are defined and not disabled, by default the operating system will prompt the invoking user for the "root" user password.
    remediation: &rem-dca5b75550 |
      Define the following in the Defaults section of the /etc/sudoers file or a single configuration file in the /etc/sudoers.d/ directory:

      Defaults !targetpw
      Defaults !rootpw
      Defaults !runaspw
  - id: "STIG-RHEL-09-432025-sudo_password_reauth_escalate"
    name: "RHEL 9 must require users to reauthenticate for privilege escalation."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-432025, V-258086, SV-258086r1102063_rule, CAT II. CCI-002038, CCI-004895. NIST SP 800-53 Rev. 4: IA-11."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep -i '!authenticate' /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ ^.*:Defaults !authenticate" }
    rationale: &rat-a7bf9120f6 |
      Without reauthentication, users may access resources or perform tasks for which they do not have authorization.

      When operating systems provide the capability to escalate a functional capability, it is critical that the user reauthenticate.
    remediation: &rem-619e943a0d |
      Configure RHEL 9 to not allow users to execute privileged actions without authenticating.

      Remove any occurrence of "!authenticate" found in "/etc/sudoers" file or files in the "/etc/sudoers.d" directory.

      $ sudo sed -i '/\!authenticate/ s/^/# /g' /etc/sudoers /etc/sudoers.d/*
  - id: "STIG-RHEL-09-432030-sudo_password_restrict_elevate"
    name: "RHEL 9 must restrict privilege elevation to authorized personnel."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-432030, V-258087, SV-258087r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      sh -c 'grep -iwR ALL /etc/sudoers /etc/sudoers.d/*'
    allow_rc: any
    expect:
