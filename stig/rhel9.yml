  - id: "STIG-RHEL-09-255025-ssh_config_banner-attrs"
    name: "RHEL 9 must display the Standard Mandatory DoW Notice and Consent Banner before granting local or remote access to the system via a SSH logon. (/etc/ssh/sshd_config: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-255025, V-257981, SV-257981r1268215_rule, CAT II. CCI-000048, CCI-001384, CCI-001385, CCI-001386, CCI-001387, CCI-001388. NIST SP 800-53 Rev. 4: AC-8."
