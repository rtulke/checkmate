  - id: "STIG-RHEL-09-232010-sys_commands_perms"
    name: "RHEL 9 system commands must have mode 755 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232010, V-257882, SV-257882r991560_rule, CAT II. CCI-001499. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec /usr/local/bin /usr/local/sbin -perm /022 -type f -exec ls -l {} \; | awk '{ print "Permissions Incorrect on " $NF }'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ Permissions Incorrect.*" }
    rationale: &rat-3ffc80c188 |
      If RHEL 9 allowed any user to make changes to software libraries, then those changes might be implemented without undergoing the appropriate testing and approvals that are part of a robust change management process.

      This requirement applies to RHEL 9 with software libraries that are accessible and configurable, as in the case of interpreted languages. Software libraries also include privileged programs that execute with escalated privileges.
    remediation: &rem-b62395689f |
      Configure the system commands to be protected from unauthorized access.

      Run the following command, replacing "[FILE]" with any system command with a mode more permissive than "755".

      $ sudo chmod 755 [FILE]
  - id: "STIG-RHEL-09-232015-lib_dirs_perms"
    name: "RHEL 9 library directories must have mode 755 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232015, V-257883, SV-257883r991560_rule, CAT II. CCI-001499. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
