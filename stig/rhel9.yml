  - id: "STIG-RHEL-09-651015-aide_cron-attrs"
    name: "RHEL 9 must routinely check the baseline configuration for unauthorized changes and notify the system administrator when anomalies in the operation of any security functions are discovered. (/etc/cron.daily/aide: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-651015, V-258135, SV-258135r1045267_rule, CAT II. CCI-001744, CCI-002699, CCI-002702. NIST SP 800-53 Rev. 4: CM-3, SI-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/cron.daily/aide'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d38fa16eb2 |
      Unauthorized changes to the baseline configuration could make the system vulnerable to various attacks or allow unauthorized access to the operating system. Changes to operating system configurations can have unintended side effects, some of which may be relevant to security.

      Detecting such changes and providing an automated response can help avoid unintended, negative consequences that could ultimately affect the security state of the operating system. The operating system's information management officer (IMO)/information system security officer (ISSO) and system administrators (SAs) must be notified via email and/or monitoring system trap when there is an unauthorized modification of a configuration item.

      Notifications provided by information systems include messages to local computer consoles, and/or hardware indications, such as lights.

      This capability must take into account operational requirements for availability for selecting an appropriate response. The organization may choose to shut down or restart the information system upon security function anomaly detection.
    remediation: &rem-2fc22894db |
      Configure the file integrity tool to run automatically on the system at least weekly and to notify designated personnel if baseline configurations are changed in an unauthorized manner. The AIDE tool can be configured to email designated personnel with the use of the cron system.

      The following example output is generic. It will set cron to run AIDE daily and to send email at the completion of the analysis

      $ sudo more /etc/cron.daily/aide

      #!/bin/bash
      /usr/sbin/aide --check | /bin/mail -s "$HOSTNAME - Daily aide integrity check run" root@sysname.mil
  - id: "STIG-RHEL-09-651015-aide_cron-content"
    name: "RHEL 9 must routinely check the baseline configuration for unauthorized changes and notify the system administrator when anomalies in the operation of any security functions are discovered. (/etc/cron.daily/aide has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-651015, V-258135, SV-258135r1045267_rule, CAT II. CCI-001744, CCI-002699, CCI-002702. NIST SP 800-53 Rev. 4: CM-3, SI-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/cron.daily/aide'
    allow_rc: any
    expect: { some: "~ 30 4 \\* \\* \\* root /usr/sbin/aide --check \\| /bin/mail -s \"\\$HOSTNAME - Daily aide integrity check run\" root@sysname\\.mil" }
    rationale: *rat-d38fa16eb2
    remediation: *rem-2fc22894db
  - id: "STIG-RHEL-09-651020-aide_hashing-attrs"
    name: "RHEL 9 must use a file integrity tool that is configured to use FIPS 140-3-approved cryptographic hashes for validating file contents and directories. (/etc/aide.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-651020, V-258136, SV-258136r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/aide.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-70d9b8d011 |
      RHEL 9 installation media ships with an optional file integrity tool called Advanced Intrusion Detection Environment (AIDE). AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file is under the "/etc" directory.

      File integrity tools use cryptographic hashes for verifying file contents and directories have not been altered. These hashes must be FIPS 140-3-approved cryptographic hashes.
    remediation: &rem-9fe7850cc2 |
      Configure the file integrity tool to use FIPS 140-3 cryptographic hashes for validating file and directory contents.

      If AIDE is installed, ensure the "sha512" rule is present on all uncommented file and directory selection lists. Exclude any log files, or files expected to change frequently, to reduce unnecessary notifications.
  - id: "STIG-RHEL-09-651020-aide_hashing-content"
    name: "RHEL 9 must use a file integrity tool that is configured to use FIPS 140-3-approved cryptographic hashes for validating file contents and directories. (/etc/aide.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-651020, V-258136, SV-258136r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/aide.conf'
    allow_rc: any
    expect: { some: "~ (?i)^\\s*(all|fipsr)\\s*=.*\\+sha512" }
    rationale: *rat-70d9b8d011
    remediation: *rem-9fe7850cc2
  - id: "STIG-RHEL-09-651025-aide_conf_crypto"
    name: "RHEL 9 must use cryptographic mechanisms to protect the integrity of audit tools."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-651025, V-258137, SV-258137r1102081_rule, CAT II. CCI-001493, CCI-001494, CCI-001495, CCI-001496."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep -E '(\/usr\/sbin\/(audit|au|rsys))' /etc/aide.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ /usr/sbin/auditctl p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/auditd p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/ausearch p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/aureport p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/autrace p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /usr/sbin/augenrules p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
    rationale: &rat-93e50bcce6 |
      Protecting the integrity of the tools used for auditing purposes is a critical step toward ensuring the integrity of audit information. Audit information includes all information (e.g., audit records, audit settings, and audit reports) needed to successfully audit information system activity.

      Audit tools include, but are not limited to, vendor-provided and open-source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.

      It is not uncommon for attackers to replace the audit tools or inject code into the existing tools to provide the capability to hide or erase system activity from the audit logs.

      To address this risk, audit tools must be cryptographically signed to provide the capability to identify when the audit tools have been modified, manipulated, or replaced. An example is a checksum hash of the file or files.
    remediation: &rem-89259442db |
      Add or update the following lines to "/etc/aide.conf", to protect the integrity of the audit tools.

      /usr/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512
  - id: "STIG-RHEL-09-652010-rsyslog_installed"
    name: "RHEL 9 must have the rsyslog package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-652010, V-258140, SV-258140r1106460_rule, CAT II. CCI-000154, CCI-001851. NIST SP 800-53 Rev. 4: AU-6, AU-4."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet rsyslog
    expect: true
    rationale: &rat-c06eec9842 |
      rsyslogd is a system utility providing support for message logging. Support for both internet and Unix domain sockets enables this utility to support both local and remote logging. Couple this utility with "gnutls" (which is a secure communications library implementing the SSL, TLS, and DTLS protocols), to create a method to securely encrypt and offload auditing.
    remediation: &rem-da31f99ef3 |
      Install the rsyslog package with the following command:

      $ sudo dnf install rsyslog
  - id: "STIG-RHEL-09-652015-rsyslog-gnutils_installed"
    name: "RHEL 9 must have the packages required for encrypting offloaded audit logs installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-652015, V-258141, SV-258141r1268251_rule, CAT II. CCI-000803. NIST SP 800-53 Rev. 4: IA-7."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet rsyslog-gnutls
    expect: true
    rationale: &rat-20b6092ebd |
      The rsyslog-gnutls package provides Transport Layer Security (TLS) support for the rsyslog daemon, which enables secure remote logging.
    remediation: &rem-27d3559488 |
      The  rsyslog-gnutls package can be installed with the following command:

      $ sudo dnf install rsyslog-gnutls
  - id: "STIG-RHEL-09-652020-rsyslog_running-enabled"
    name: "The rsyslog service on RHEL 9 must be active. (Service rsyslog is enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-652020, V-258142, SV-258142r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState rsyslog | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-83cf1d7b2a |
      The "rsyslog" service must be running to provide logging services, which are essential to system administration.
    remediation: &rem-f86129f8ed |
      To enable the rsyslog service, run the following command:

      $ sudo systemctl enable --now rsyslog
  - id: "STIG-RHEL-09-652020-rsyslog_running-running"
    name: "The rsyslog service on RHEL 9 must be active. (Service rsyslog is running)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-652020, V-258142, SV-258142r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState rsyslog | cut -d= -f2
    expect: "== active"
    rationale: *rat-83cf1d7b2a
    remediation: *rem-f86129f8ed
  - id: "STIG-RHEL-09-652025-rsyslog_not_accept_incoming"
    name: "RHEL 9 must be configured so that the rsyslog daemon does not accept log messages from other servers unless the server is being used for log aggregation."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-652025, V-258143, SV-258143r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep -E 'InputTCPServerRun | UDPServerRun | RELPServerRun | imtcp | imudp | imrelp' /etc/rsyslog.conf /etc/rsyslog.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ ^#.*" }
    rationale: &rat-a5d3a9b2c1 |
      Unintentionally running a rsyslog server accepting remote messages puts the system at increased risk. Malicious rsyslog messages sent to the server could exploit vulnerabilities in the server software itself, could introduce misleading information into the system's logs, or could fill the system's storage leading to a denial of service.

      If the system is intended to be a log aggregation server, its use must be documented with the information system security officer (ISSO).
    remediation: &rem-bb016e992c |
      Configure RHEL 9 to not receive remote logs using rsyslog.

      Remove the lines in /etc/rsyslog.conf and any files in the /etc/rsyslog.d directory that match any of the following:
      InputTCPServerRun
      UDPServerRun
      RELPServerRun
      module(load="imtcp")
      module(load="imudp")
      module(load="imrelp")
      input(type="imudp" port="514")
      input(type="imtcp" port="514")
      input(type="imrelp" port="514")

      The rsyslog daemon must be restarted for the changes to take effect:

      $ sudo systemctl restart rsyslog.service
  - id: "STIG-RHEL-09-652030-rsyslog_monitor_remote"
    name: "All RHEL 9 remote access methods must be monitored."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-652030, V-258144, SV-258144r1268219_rule, CAT II. CCI-000067. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep -rE '(auth.\*|authpriv.\*|daemon.\*)' /etc/rsyslog.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^auth.*;authpriv.*;daemon.* /var/log/secure" }
    rationale: &rat-79afef30ec |
      Logging remote access methods can be used to trace the decrease in the risks associated with remote user access management. It can also be used to spot cyberattacks and ensure ongoing compliance with organizational policies surrounding the use of remote access methods.
    remediation: &rem-d63182b37c |
      Add or update the following lines to the "/etc/rsyslog.conf" file or a file in "/etc/rsyslog.d":

      auth.*;authpriv.*;daemon.* /var/log/secure

      The "rsyslog" service must be restarted for the changes to take effect with the following command:

      $ sudo systemctl restart rsyslog.service
  - id: "STIG-RHEL-09-652040-rsyslog_auth_remote"
    name: "RHEL 9 must authenticate the remote logging server for offloading audit logs via rsyslog."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-652040, V-258146, SV-258146r1045288_rule, CAT II. CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep -iE "^\$ActionSendStreamDriverAuthMode" /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^.*:$ActionSendStreamDriverAuthMode x509\\/.*" }
    rationale: &rat-57e83e22bd |
      Information stored in one location is vulnerable to accidental or incidental deletion or alteration.

      Offloading is a common process in information systems with limited audit storage capacity.

      RHEL 9 installation media provides "rsyslogd", a system utility providing support for message logging. Support for both internet and Unix domain sockets enables this utility to support both local and remote logging. Coupling this utility with "gnutls" (a secure communications library implementing the SSL, TLS and DTLS protocols) creates a method to securely encrypt and offload auditing.

      "Rsyslog" supported authentication modes include:
      anon - anonymous authentication
      x509/fingerprint - certificate fingerprint authentication
      x509/certvalid - certificate validation only
      x509/name - certificate validation and subject name authentication
    remediation: &rem-5ac41235df |
      Configure RHEL 9 to authenticate the remote logging server for offloading audit logs by setting the following option in "/etc/rsyslog.conf" or "/etc/rsyslog.d/[customfile].conf":

      $ActionSendStreamDriverAuthMode x509/name
  - id: "STIG-RHEL-09-652045-rsyslog_encrypt_remote"
    name: "RHEL 9 must encrypt the transfer of audit records offloaded onto a different system or media from the system being audited via rsyslog."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-652045, V-258147, SV-258147r1045290_rule, CAT II. CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep -iE "^\$ActionSendStreamDriverMode" /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^.*:$ActionSendStreamDriverMode 1" }
    rationale: *rat-57e83e22bd
    remediation: &rem-8608684c10 |
      Configure RHEL 9 to encrypt offloaded audit records via rsyslog by setting the following options in "/etc/rsyslog.conf" or "/etc/rsyslog.d/[customfile].conf":

      $ActionSendStreamDriverMode 1
  - id: "STIG-RHEL-09-652050-rsyslog_netstream_driver"
    name: "RHEL 9 must encrypt via the gtls driver the transfer of audit records offloaded onto a different system or media from the system being audited via rsyslog."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-652050, V-258148, SV-258148r1045292_rule, CAT II. CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep -iE "^\$DefaultNetstreamDriver" /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^.*:$DefaultNetstreamDriver gtls" }
    rationale: &rat-6bfc564513 |
      Information stored in one location is vulnerable to accidental or incidental deletion or alteration.

      Offloading is a common process in information systems with limited audit storage capacity.

      RHEL 9 installation media provides "rsyslogd", a system utility providing support for message logging. Support for both internet and Unix domain sockets enables this utility to support both local and remote logging. Coupling this utility with "gnutls" (a secure communications library implementing the SSL, TLS and DTLS protocols) creates a method to securely encrypt and offload auditing.
    remediation: &rem-2739239d4f |
      Configure RHEL 9 to use the gtls driver to encrypt offloaded audit records by setting the following options in "/etc/rsyslog.conf" or "/etc/rsyslog.d/[customfile].conf":

      $DefaultNetstreamDriver gtls
  - id: "STIG-RHEL-09-652055-rsyslog_remote_server_config"
    name: "RHEL 9 must be configured to forward audit records via TCP to a different system or media from the system being audited via rsyslog."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-652055, V-258149, SV-258149r1155580_rule, CAT II. CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep '@@' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^.*:*.* @@\\[10.10.10.10\\]:\\[9999\\]" }
    rationale: &rat-f0ff40b002 |
      Information stored in one location is vulnerable to accidental or incidental deletion or alteration.

      Off-loading is a common process in information systems with limited audit storage capacity.

      RHEL 9 installation media provides "rsyslogd", a system utility providing support for message logging. Support for both internet and Unix domain sockets enables this utility to support both local and remote logging. Coupling this utility with "gnutls" (a secure communications library implementing the SSL, TLS and DTLS protocols) creates a method to securely encrypt and off-load auditing.

      Rsyslog provides three ways to forward message: the traditional UDP transport, which is extremely lossy but standard; the plain TCP based transport, which loses messages only during certain situations but is widely available; and the RELP transport, which does not lose messages but is currently available only as part of the rsyslogd 3.15.0 and above.

      Examples of each configuration:
      UDP *.* @remotesystemname
      TCP *.* @@remotesystemname
      RELP *.* :omrelp:remotesystemname:2514
      Note that a port number was given as there is no standard port for RELP.
    remediation: &rem-5bf3c0c2c5 |
      Configure RHEL 9 to off-load audit records onto a different system or media from the system being audited via TCP using rsyslog by specifying the remote logging server in "/etc/rsyslog.conf" or "/etc/rsyslog.d/[customfile].conf" with the name or IP address of the log aggregation server. The following are examples of the configuration for the legacy syntax and for the newer Rainer script. Only one should be used.

      Using legacy '@host:port" syntax example:
      *.* @@[remoteloggingserver]:[port]

      Using Rainer script example:
      action(
          type="omfwd"
          target="logserver.example.com"
          port="514"
          protocol="tcp"
          action.resumeRetryCount="-1"
          queue.type="linkedList"
          que.size="10000"
      )

      Note: The Rainer Script above does not contain the required encryption settings.
  - id: "STIG-RHEL-09-652060-rsyslog_cron_logging-attrs"
    name: "RHEL 9 must use cron logging. (/etc/rsyslog.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-652060, V-258150, SV-258150r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/rsyslog.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-20a9cd9810 |
      Cron logging can be used to trace the successful or unsuccessful execution of cron jobs. It can also be used to spot intrusions into the use of the cron facility by unauthorized and malicious users.
    remediation: &rem-cba5e2863d |
      Configure "rsyslog" to log all cron messages by adding or updating the following line to "/etc/rsyslog.conf" or a configuration file in the "/etc/rsyslog.d/" directory:

      cron.* /var/log/cron

      Restart the rsyslog daemon for the changes to take effect:

      $ sudo systemctl restart rsyslog.service
  - id: "STIG-RHEL-09-652060-rsyslog_cron_logging-content"
    name: "RHEL 9 must use cron logging. (/etc/rsyslog.conf has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-652060, V-258150, SV-258150r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/rsyslog.conf'
    allow_rc: any
    expect: { some: "~ ^cron\\.\\*\\s+/var/log/cron" }
    rationale: *rat-20a9cd9810
    remediation: *rem-cba5e2863d
  - id: "STIG-RHEL-09-671015-shadow_hash_algo"
    name: "RHEL 9 must employ FIPS 140-3-approved cryptographic hashing algorithms for all stored passwords."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-671015, V-258231, SV-258231r1208790_rule, CAT II. CCI-000196, CCI-000803, CCI-004062. NIST SP 800-53 Rev. 4: IA-5, IA-7."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat /etc/shadow | grep -v "*" | grep -v "!" | grep -v ":$6$" | cut -f1 -d:
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-80db04cfee |
      The system must use a strong hashing algorithm to store the password.

      Passwords need to be protected at all times, and encryption is the standard method for protecting passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised.
    remediation: &rem-99deea72b4 |
      Lock all interactive user accounts not using SHA-512 hashing until the passwords can be regenerated with SHA-512.
  - id: "STIG-RHEL-09-671025-pam_password_hashing-attrs"
    name: "RHEL 9 pam_unix.so module must be configured in the password-auth file to use a FIPS 140-3 approved cryptographic hashing algorithm for system authentication. (/etc/pam.d/password-auth: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-671025, V-258233, SV-258233r1262157_rule, CAT II. CCI-000196, CCI-004062. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/pam.d/password-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d75f4bb510 |
      Unapproved mechanisms that are used for authentication to the cryptographic module are not verified and; therefore, cannot be relied upon to provide confidentiality or integrity, and DoW data may be compromised.

      RHEL 9 systems utilizing encryption are required to use FIPS-compliant mechanisms for authenticating to cryptographic modules.

      FIPS 140-3 is the current standard for validating that mechanisms used to access cryptographic modules utilize authentication that meets DoW requirements. This allows for Security Levels 1, 2, 3, or 4 for use on a general-purpose computing system.
    remediation: &rem-d6b2b9f938 |
      Configure RHEL 9 to use a FIPS 140-3 approved cryptographic hashing algorithm for system authentication.

      Edit/modify the following line in the "/etc/pam.d/password-auth" file to include the sha512 option for pam_unix.so:

      password sufficient pam_unix.so sha512
  - id: "STIG-RHEL-09-671025-pam_password_hashing-content"
    name: "RHEL 9 pam_unix.so module must be configured in the password-auth file to use a FIPS 140-3 approved cryptographic hashing algorithm for system authentication. (/etc/pam.d/password-auth has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-671025, V-258233, SV-258233r1262157_rule, CAT II. CCI-000196, CCI-004062. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/pam.d/password-auth'
    allow_rc: any
    expect: { some: "~ ^password.*pam_unix.so.*sha512" }
    rationale: *rat-d75f4bb510
    remediation: *rem-d6b2b9f938
  - id: "STIG-RHEL-09-411010-pass_max_days_login-attrs"
    name: "RHEL 9 user account passwords for new users or password changes must have a 180-day maximum password lifetime restriction in /etc/login.defs. (/etc/login.defs: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411010, V-258041, SV-258041r1268211_rule, CAT II. CCI-000199, CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-2d67cf5d44 |
      Any password, no matter how complex, can eventually be cracked; therefore, passwords need to be changed periodically. If the operating system does not limit the lifetime of passwords and force users to change their passwords, there is the risk that the operating system passwords could be compromised.

      Setting the password maximum age ensures users are required to periodically change their passwords. Requiring shorter password lifetimes increases the risk of users writing down the password in a convenient location subject to physical compromise.
    remediation: &rem-6f98beb831 |
      Configure RHEL 9 to enforce a 180-day maximum password lifetime.

      Add or modify the following line in the "/etc/login.defs" file:

      PASS_MAX_DAYS 180
  - id: "STIG-RHEL-09-411010-pass_max_days_login-content"
    name: "RHEL 9 user account passwords for new users or password changes must have a 180-day maximum password lifetime restriction in /etc/login.defs. (/etc/login.defs has the expected content (1 rule))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411010, V-258041, SV-258041r1268211_rule, CAT II. CCI-000199, CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect: { some: "~ ^PASS_MAX_DAYS\\s*([1-9]|[0-5][0-9]|60)" }
    rationale: *rat-2d67cf5d44
    remediation: *rem-6f98beb831
  - id: "STIG-RHEL-09-411015-60days_max_passwd_lifetime"
    name: "RHEL 9 user account passwords must have a 180-day maximum password lifetime restriction."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411015, V-258042, SV-258042r1268211_rule, CAT II. CCI-000199, CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      INT_UID=`awk -F: '$3 >= 1000 { print $1 }' /etc/passwd | grep -v nobody`; for name in $INT_UID; do grep $name /etc/shadow | awk -F: '$5 > 60 || $5 <= 0 {print $1}'; done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-ac3455bd8a |
      Any password, no matter how complex, can eventually be cracked; therefore, passwords need to be changed periodically. If RHEL 9 does not limit the lifetime of passwords and force users to change their passwords, there is the risk that RHEL 9 passwords could be compromised.
    remediation: &rem-30e1ee1364 |
      Configure noncompliant accounts to enforce a 180-day maximum password lifetime restriction.

      $ sudo passwd -x 180 [user]
  - id: "STIG-RHEL-09-411020-create_home_login-attrs"
    name: "All RHEL 9 local interactive user accounts must be assigned a home directory upon creation. (/etc/login.defs: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411020, V-258043, SV-258043r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f470f87766 |
      If local interactive users are not assigned a valid home directory, there is no place for the storage and control of files they should own.
    remediation: &rem-2461081a2f |
      Configure RHEL 9 to assign home directories to all new local interactive users by setting the "CREATE_HOME" parameter in "/etc/login.defs" to "yes" as follows.

      CREATE_HOME yes
  - id: "STIG-RHEL-09-411020-create_home_login-content"
    name: "All RHEL 9 local interactive user accounts must be assigned a home directory upon creation. (/etc/login.defs has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411020, V-258043, SV-258043r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^CREATE_HOME yes" }
      - { none: "~ ^CREATE_HOME no" }
    rationale: *rat-f470f87766
    remediation: *rem-2461081a2f
  - id: "STIG-RHEL-09-411025-home_umask_077"
    name: "RHEL 9 must set the umask value to 077 for all local interactive user accounts."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411025, V-258044, SV-258044r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      find /home -maxdepth 2 -type f -name ".[^.]*" -exec grep -iH -d skip --exclude=.bash_history umask {} \;
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { any: [{ some: "~ (?i)umask\\s*077" }] }
    rationale: &rat-c762483818 |
      The umask controls the default access mode assigned to newly created files. A umask of 077 limits new files to mode 600 or less permissive. Although umask can be represented as a four-digit number, the first digit representing special access modes is typically ignored or required to be "0". This requirement applies to the globally configured system defaults and the local interactive user defaults for each account on the system.
    remediation: &rem-2d621865b6 |
      Remove the umask statement from all local interactive user's initialization files.

      If the account is for an application, the requirement for a umask less restrictive than "077" can be documented with the information system security officer, but the user agreement for access to the account must specify that the local interactive user must log on to their account first and then switch the user to the application account with the correct option to gain the account's environment variables.
  - id: "STIG-RHEL-09-411030-duplicate_UIDs"
    name: "RHEL 9 duplicate User IDs (UIDs) must not exist for interactive users."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411030, V-258045, SV-258045r958482_rule, CAT II. CCI-000135, CCI-000764, CCI-000804. NIST SP 800-53 Rev. 4: AU-3, IA-2, IA-8."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      cat /etc/passwd | awk -F: '{ print $3}' | sort -n | uniq -d
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-2498efe430 |
      To ensure accountability and prevent unauthenticated access, interactive users must be identified and authenticated to prevent potential misuse and compromise of the system.
    remediation: &rem-246c2fe0c5 |
      Edit the file "/etc/passwd" and provide each interactive user account that has a duplicate UID with a unique UID.
  - id: "STIG-RHEL-09-411035-system_acct_no_shell"
    name: "RHEL 9 system accounts must not have an interactive login shell."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411035, V-258046, SV-258046r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: Cm-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    timeout: 120000ms
    run: |
      awk -F: '($3<1000){print $1 ":" $7}' /etc/passwd | grep -vE "nologin|sync|shutdown|halt|false|root"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-faa4ae182a |
      Ensuring shells are not given to system accounts upon login makes it more difficult for attackers to make use of system accounts.
    remediation: &rem-074c34a44b |
      Configure RHEL 9 so that all noninteractive accounts on the system do not have an interactive shell assigned to them.

      If the system account needs a shell assigned for mission operations, document the need with the information system security officer (ISSO).

      Run the following command to disable the interactive shell for a specific noninteractive user account:

      $ sudo usermod --shell /usr/sbin/nologin <user>
  - id: "STIG-RHEL-09-411040-temp_accts_manual"
    name: "RHEL 9 must automatically expire temporary accounts within 72 hours. (Manual)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411040, V-258047, SV-258047r1101951_rule, CAT II. CCI-000016, CCI-001682. NIST SP 800-53 Rev. 4: AC-2."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      echo "MANUAL - check for temporary accounts ensure 72hr expiry"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^MANUAL" }
    rationale: &rat-11aaeaabd1 |
      Temporary accounts are privileged or nonprivileged accounts that are established during pressing circumstances, such as new software or hardware configuration or an incident response, where the need for prompt account activation requires bypassing normal account authorization procedures. If any inactive temporary accounts are left enabled on the system and are not either manually removed or automatically expired within 72 hours, the security posture of the system will be degraded and exposed to exploitation by unauthorized users or insider threat actors.

      Temporary accounts are different from emergency accounts. Emergency accounts, also known as "last resort" or "break glass" accounts, are local logon accounts enabled on the system for emergency use by authorized system administrators to manage a system when standard logon methods are failing or not available. Emergency accounts are not subject to manual removal or scheduled expiration requirements.

      The automatic expiration of temporary accounts may be extended as needed by the circumstances but it must not be extended indefinitely. A documented permanent account should be established for privileged users who need long-term maintenance accounts.
    remediation: &rem-67900775cd |
      Configure the operating system to expire temporary accounts after 72 hours with the following command:

      $ sudo chage -E $(date -d +3days +%Y-%m-%d) <temporary_account_name>
  - id: "STIG-RHEL-09-411045-primary_group_exists"
    name: "All RHEL 9 interactive users must have a primary group that exists."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411045, V-258048, SV-258048r1069380_rule, CAT II. CCI-000764. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      pwck -r | grep group
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-722ba8f31e |
      If a user is assigned the Group Identifier (GID) of a group that does not exist on the system, and a group with the GID is subsequently created, the user may have unintended rights to any files associated with the group.
    remediation: &rem-c483ff1bbf |
      Configure the system so that all GIDs are referenced in "/etc/passwd" are defined in "/etc/group".

      Edit the file "/etc/passwd" and ensure that every user's GID is a valid GID.
  - id: "STIG-RHEL-09-411050-useradd_inactive-attrs"
    name: "RHEL 9 must disable account identifiers (individuals, groups, roles, and devices) after 35 days of inactivity. (/etc/default/useradd: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411050, V-258049, SV-258049r1015092_rule, CAT II. CCI-000795, CCI-003627, CCI-003628. NIST SP 800-53 Rev. 4: IA-4."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/default/useradd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d53453f083 |
      Inactive identifiers pose a risk to systems and applications because attackers may exploit an inactive identifier and potentially obtain undetected access to the system.

      Disabling inactive accounts ensures that accounts which may not have been responsibly removed are not available to attackers who may have compromised their credentials.

      Owners of inactive accounts will not notice if unauthorized access to their user account has been obtained.
    remediation: &rem-323b165801 |
      Configure RHEL 9 to disable account identifiers after 35 days of inactivity after the password expiration.

      Run the following command to change the configuration for useradd:

      $ sudo useradd -D -f 35

      The recommendation is 35 days, but a lower value is acceptable.
  - id: "STIG-RHEL-09-411050-useradd_inactive-content"
    name: "RHEL 9 must disable account identifiers (individuals, groups, roles, and devices) after 35 days of inactivity. (/etc/default/useradd has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411050, V-258049, SV-258049r1015092_rule, CAT II. CCI-000795, CCI-003627, CCI-003628. NIST SP 800-53 Rev. 4: IA-4."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/default/useradd'
    allow_rc: any
    expect:
      - { some: "~ ^INACTIVE=\\s*([1-9]|[0-2][0-9]|3[0-5])$" }
      - { none: "~ ^INACTIVE=\\s*(-1|3[6-9]|[4-9][0-9])$" }
    rationale: *rat-d53453f083
    remediation: *rem-323b165801
  - id: "STIG-RHEL-09-411055-user_initiate_PATH"
    name: "Executable search paths within the initialization files of all local interactive RHEL 9 users must only contain paths that resolve to the system default or the users home directory."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411055, V-258050, SV-258050r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep -ri "^\s*PATH" /home/*/.[^.]*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^.*:PATH=\\$PATH:\\$HOME\\/.local\\/bin:\\$HOME\\/bin\\s*" }
    rationale: &rat-8945c237ab |
      The executable search path (typically the PATH environment variable) contains a list of directories for the shell to search to find executables. If this path includes the current working directory (other than the users home directory), executables in these directories may be executed instead of system commands.

      This variable is formatted as a colon-separated list of directories. If there is an empty entry, such as a leading or trailing colon or two consecutive colons, this is interpreted as the current working directory. If deviations from the default system search path for the local interactive user are required, they must be documented with the information system security officer (ISSO).
    remediation: &rem-3362aa4c7b |
      Edit the local interactive user initialization files to change any PATH variable statements that reference directories other than their home directory.

      If a local interactive user requires path variables to reference a directory owned by the application, it must be documented with the ISSO.
  - id: "STIG-RHEL-09-411065-home_dirs_exists"
    name: "All RHEL 9 local interactive user home directories defined in the /etc/passwd file must exist."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411065, V-258052, SV-258052r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      pwck -r
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-98624d28b0 |
      If a local interactive user has a home directory defined that does not exist, the user may be given access to the / directory as the current working directory upon logon. This could create a denial of service because the user would not be able to access their logon configuration files, and it may give them visibility to system files they normally would not be able to access.
    remediation: &rem-605c0c65d8 |
      Create home directories to all local interactive users that currently do not have a home directory assigned. Use the following commands to create the user home directory assigned in "/etc/ passwd":

      Note: The example will be for the user disauser, who has a home directory of "/home/disauser", a user identifier (UID) of "disauser", and a group identifier (GID) of "users assigned" in "/etc/passwd".

      $ sudo mkdir /home/disauser
      $ sudo chown disauser /home/disauser
      $ sudo chgrp users /home/disauser
      $ sudo chmod 0750 /home/disauser
  - id: "STIG-RHEL-09-411070-primary_group_set_manual"
    name: "All RHEL 9 local interactive user home directories must be group-owned by the home directory owner's primary group. (Manual)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411070, V-258053, SV-258053r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      echo "MANUAL - Validate users primary groups are set as expected"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-76d9e3ae7f |
      If the Group Identifier (GID) of a local interactive users home directory is not the same as the primary GID of the user, this would allow unauthorized access to the users files, and users that share the same group may not be able to access files that they legitimately should.
    remediation: &rem-f932fcafa7 |
      Change the group owner of a local interactive user's home directory to the group found in "/etc/passwd". To change the group owner of a local interactive user's home directory, use the following command:

      Note: The example will be for the user "disauser", who has a home directory of "/home/disauser", and has a primary group of users.

      $ sudo chgrp users /home/disauser
  - id: "STIG-RHEL-09-411075-faillock_deny-attrs"
    name: "RHEL 9 must automatically lock an account when three unsuccessful logon attempts occur. (/etc/security/faillock.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411075, V-258054, SV-258054r958736_rule, CAT II. CCI-000044, CCI-002238. NIST SP 800-53 Rev. 4: AC-7."
