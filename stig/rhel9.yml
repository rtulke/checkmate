    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-252025, V-257946, SV-257946r1184307_rule, CAT III. CCI-000381, CCI-000382. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel9, stig-cat-3]
    severity: low
    run: |
      f='/etc/chrony.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-b48f32b15b |
      Minimizing the exposure of the server functionality of the chrony daemon diminishes the attack surface.
    remediation: &rem-8b5218ef74 |
      Configure RHEL 9 to disable the chrony daemon from acting as a server by adding/modifying the following line in the /etc/chrony.conf file:

      port 0
