  - id: "STIG-RHEL-09-214025-gpg_check_repos"
    name: "RHEL 9 must have GPG signature verification enabled for all software repositories."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-214025, V-257822, SV-257822r1286929_rule, CAT I. CCI-001749, CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    timeout: 120000ms
    run: |
      grep -cR '.*gpgcheck.*=0' /etc/yum.repos.d/*.repo
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*[1-9][0-9]*$" }
    rationale: *rat-c183b72e07
    remediation: &rem-fed8c3efbd |
      Configure RHEL 9 software repositories defined in "/etc/yum.repos.d/" to have "gpgcheck" enabled with the following command:

      $ sudo sed -i 's/gpgcheck\s*=.*/gpgcheck=1/g' /etc/yum.repos.d/*

      Note: Any of the following are acceptable: "1", "true", or "yes" (keywords containing letters are case insensitive).
  - id: "STIG-RHEL-09-215015-vsftpd"
    name: "RHEL 9 must not have a File Transfer Protocol (FTP) server package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-215015, V-257826, SV-257826r1208770_rule, CAT I. CCI-000197, CCI-000381. NIST SP 800-53 Rev. 4: IA-5, CM-7."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet vsftpd
    expect: false
    rationale: &rat-05bc019a39 |
      The FTP service provides an unencrypted remote access that does not provide for the confidentiality and integrity of user passwords or the remote session. If a privileged user were to log on using this service, the privileged user password could be compromised. SSH or other encrypted file transfer methods must be used in place of this service.

      Removing the "vsftpd" package decreases the risk of accidental activation.

      If FTP is required for operational support (such as transmission of router configurations), its use must be documented with the information systems security manager (ISSM), restricted to only authorized personnel, and have access control rules established.
    remediation: &rem-2789f0cb10 |
      Remove the vsftpd package with the following command:

      $ sudo dnf remove vsftpd
  - id: "STIG-RHEL-09-215060-tftp"
    name: "The Trivial File Transfer Protocol (TFTP) server must not be installed unless it is required, and if required, the RHEL 9 TFTP daemon must be configured to operate in secure mode."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-215060, V-257835, SV-257835r1268251_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet tftp-server
    expect: false
    rationale: &rat-8696559029 |
      Removing the "tftp-server" package decreases the risk of the accidental (or intentional) activation of tftp services.

      If TFTP is required for operational support (such as transmission of router configurations), its use must be documented with the information systems security manager (ISSM), restricted to only authorized personnel, and have access control rules established.

      Restricting TFTP to a specific directory prevents remote users from copying, transferring, or overwriting system files.
    remediation: &rem-2774b1d4b9 |
      Configure RHEL 9 so that TFTP operates in secure mode if installed.

      If TFTP server is not required, remove it with the following command:
      $ sudo dnf -y remove tftp-server

      Configure the TFTP daemon to operate in secure mode with the following command:
      $ sudo systemctl edit tftp.service

      In the editor, enter:
      [Service]
      ExecStart=/usr/sbin/in.tftpd -s /var/lib/tftpboot

      After making changes, reload the systemd daemon and restart the TFTP service as follows:

      $ sudo systemctl daemon-reload
      $ sudo systemctl restart tftp.service

      If the "-s" option is not present in the "ExecStart" line or if the line is missing, this is a finding.
  - id: "STIG-RHEL-09-215100-crypto_policies_pkg"
    name: "RHEL 9 must have the crypto-policies package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-215100, V-258234, SV-258234r1184292_rule, CAT I. CCI-002450, CCI-002890, CCI-003123. NIST SP 800-53 Rev. 4: CS-13, MA-4."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet crypto-policies
    expect: true
    rationale: &rat-d9cd3cc736 |
      Centralized cryptographic policies simplify applying secure ciphers across an operating system and the applications that run on that operating system. Use of weak or untested encryption algorithms undermines the purposes of using encryption to protect data.
    remediation: &rem-e68bda2dc0 |
      Install the crypto-policies package (if the package is not already installed) with the following command:

      $ sudo dnf -y install crypto-policies
  - id: "STIG-RHEL-09-215105-systemwide_cryptographic_policy"
    name: "RHEL 9 must implement a FIPS 140-3-compliant systemwide cryptographic policy."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-215105, V-258241, SV-258241r1262108_rule, CAT I. CCI-002450, CCI-002890, CCI-003123. NIST SP 800-53 Rev. 4: SC-13, MA-4."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      update-crypto-policies --show
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^FIPS$" }
    rationale: *rat-d9cd3cc736
    remediation: &rem-ae0bb386db |
      Configure RHEL 9 to use a FIPS 140-3-compliant systemwide cryptographic policy.

      Set the systemwide crypto-policy to FIPS with the following command:

      $ sudo update-crypto-policies --set FIPS
      Setting system policy to FIPS

      Note: Systemwide crypto-policies are applied on application startup. It is recommended to restart the system for the change of policies to fully take place.
  - id: "STIG-RHEL-09-215105-systemwide_cryptographic_policy_hash_rsa"
    name: "RHEL 9 must implement a FIPS 140-3-compliant systemwide cryptographic policy. (hash and min_rsa_size)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-215105, V-258241, SV-258241r1262108_rule, CAT I. CCI-002450, CCI-002890, CCI-003123. NIST SP 800-53 Rev. 4: SC-13, MA-4."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      grep -E 'rsa_size|hash' /etc/crypto-policies/state/CURRENT.pol
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^hash = .*SHA2-256" }
      - { some: "~ ^hash = .*SHA2-384" }
      - { some: "~ ^hash = .*SHA2-512" }
      - { some: "~ ^hash = .*SHA2-224" }
      - { some: "~ ^hash = .*SHA3-256" }
      - { some: "~ ^hash = .*SHA3-384" }
      - { some: "~ ^hash = .*SHA3-512" }
      - { some: "~ ^hash = .*SHAKE-256" }
      - { none: "~ ^hash = .*SHA1" }
      - { some: "~ ^min_rsa_size = (204[89]|20[5-9][0-9]|2[1-9][0-9]{2}|[3-9][0-9]{3}|[1-9][0-9]{4,})$" }
    rationale: *rat-d9cd3cc736
    remediation: *rem-ae0bb386db
  - id: "STIG-RHEL-09-231190-cryptsetup"
    name: "RHEL 9 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-231190, V-257879, SV-257879r1045454_rule, CAT I. CCI-001199, CCI-002475, CCI-002476. NIST SP 800-53 Rev. 4: SC-28."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      rpm -q --quiet cryptsetup
    expect: true
    rationale: &rat-7b681af898 |
      RHEL 9 systems handling data requiring "data at rest" protections must employ cryptographic mechanisms to prevent unauthorized disclosure and modification of the information at rest.

      Selection of a cryptographic mechanism is based on the need to protect the integrity of organizational information. The strength of the mechanism is commensurate with the security category and/or classification of the information. Organizations have the flexibility to either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific data structures (e.g., files, records, or fields).
    remediation: &rem-18ab76eeb8 |
      Configure RHEL 9 to prevent unauthorized modification of all information at rest by using disk encryption.

      Encrypting a partition in an already installed system is more difficult, because existing partitions will need to be resized and changed.

      To encrypt an entire partition, dedicate a partition for encryption in the partition layout.
  - id: "STIG-RHEL-09-231190-check_encrypted_disks"
    name: "RHEL 9 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection. (disks encrypted)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-231190, V-257879, SV-257879r1045454_rule, CAT I. CCI-001199, CCI-002475, CCI-002476. NIST SP 800-53 Rev. 4: SC-28."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      if [ `dmsetup status | awk '{print $NF}' | grep -cv crypt` -ge 1 ] ; then echo "Fail - unencrypted disks"; else echo "OK - System disks encrypted"; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK - System disks encrypted" }
      - { none: "~ Fail - unencrypted disks" }
    rationale: *rat-7b681af898
    remediation: *rem-18ab76eeb8
  - id: "STIG-RHEL-09-252070-shosts_equiv_check"
    name: "There must be no shosts.equiv files on RHEL 9."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-252070, V-257955, SV-257955r1268251_rule, CAT I. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    timeout: 120000ms
    run: |
      find / -name shosts.equiv
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-bb21e787aa |
      The shosts.equiv files are used to configure host-based authentication for the system via SSH. Host-based authentication is not sufficient for preventing unauthorized access to the system, as it does not require interactive identification and authentication of a connection request, or for the use of two-factor authentication.
    remediation: &rem-ba7eb8108a |
      Remove any found "shosts.equiv" files from the system.

      $ sudo rm /[path]/[to]/[file]/shosts.equiv
  - id: "STIG-RHEL-09-252075-shosts_check"
