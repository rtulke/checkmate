  - id: "STIG-RHEL-09-653030-audit_disk_space_adequate_manual"
    name: "RHEL 9 must allocate audit record storage capacity to store at least one week's worth of audit records. (Manual)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653030, V-258155, SV-258155r1045300_rule, CAT II. CCI-001849, CCI-001851. NIST SP 800-53 Rev. 4: AU-4."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      echo -e "MANUAL - Ensure the disk space is sufficient for 1 week of audit logs\n`df -h /var/log/audit`"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-56b58b54b1 |
      To ensure RHEL 9 systems have a sufficient storage capacity in which to write the audit logs, RHEL 9 needs to be able to allocate audit record storage capacity.

      The task of allocating audit record storage capacity is usually performed during initial installation of RHEL 9.
    remediation: &rem-538e3159a8 |
      Allocate enough storage capacity for at least one week of audit records when audit records are not immediately sent to a central audit record storage facility.

      If audit records are stored on a partition made specifically for audit records, resize the partition with sufficient space to contain one week of audit records.

      If audit records are not stored on a partition made specifically for audit records, a new partition with sufficient space will need be to be created.
  - id: "STIG-RHEL-09-653035-audit_space_left-attrs"
    name: "RHEL 9 must take action when allocated audit record storage volume reaches 75 percent of the repository maximum audit record storage capacity. (/etc/audit/auditd.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-653035, V-258156, SV-258156r1106364_rule, CAT II. CCI-001855. NIST SP 800-53 Rev. 4: AU-5."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-5a9db461ad |
      If security personnel are not notified immediately when storage volume reaches a maximum of 75 percent utilization, they are unable to plan for audit record storage capacity expansion. The notification can be set to trigger at lower utilization thresholds at the information system security officer's (ISSO's) discretion.
    remediation: &rem-0b6cd6e62f |
      Configure RHEL 9 to initiate an action to notify the SA and ISSO (at a minimum) when allocated audit record storage volume reaches (at most) 75 percent of the repository maximum audit record storage capacity by adding/modifying the following line in the /etc/audit/auditd.conf file.

      space_left  = 25%
  - id: "STIG-RHEL-09-653035-audit_space_left-content"
