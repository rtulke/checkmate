  - id: "STIG-RHEL-09-611065-pwquality_lcredit-attrs"
    name: "RHEL 9 must enforce password complexity by requiring that at least one lowercase character be used. (/etc/security/pwquality.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-611065, V-258102, SV-258102r1045207_rule, CAT II. CCI-000193, CCI-004066. NIST SP 800-53 Rev. 4: IA-5."
    tags: [stig, stig-rhel9, stig-cat-2]
