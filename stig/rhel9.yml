    remediation: &rem-a2ef057f09 |
      Configure RHEL 9 dnf to always check the GPG signature of local software packages before installation.

      Add or update the following line in the [main] section of the "/etc/dnf/dnf.conf" file:

      localpkg_gpgcheck=1

      Note: Any of the following are acceptable: "1", "true", or "yes" (keywords containing letters are case insensitive).
  - id: "STIG-RHEL-09-214020-localgpg_check_conf-content"
    name: "RHEL 9 must check the GPG signature of locally installed software packages before installation. (/etc/dnf/dnf.conf has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-214020, V-257821, SV-257821r1286926_rule, CAT I. CCI-001749, CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
