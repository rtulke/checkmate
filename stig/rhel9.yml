  - id: "STIG-RHEL-09-232220-audit_bins_root_owned"
    name: "RHEL 9 audit tools must be owned by root."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232220, V-257924, SV-257924r991557_rule, CAT II. CCI-001493. NIST SP 800-53 Rev. 4: AU-9."
