  - id: "STIG-RHEL-09-411105-faillock_directory-attrs"
    name: "RHEL 9 must ensure account lockouts persist. (/etc/security/faillock.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-411105, V-258060, SV-258060r1045150_rule, CAT II. CCI-000044. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-91e1621e9d |
      Having lockouts persist across reboots ensures that account is only unlocked by an administrator. If the lockouts did not persist across reboots, an attacker could simply reboot the system to continue brute force attacks against the accounts on the system.
    remediation: &rem-1525c51bf6 |
      Configure RHEL 9 maintain the contents of the faillock directory after a reboot.

      Add/modify the "/etc/security/faillock.conf" file to match the following line:

      dir = /var/log/faillock
