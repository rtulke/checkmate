  - id: "STIG-RHEL-09-271085-gui_screensaver_no_pic"
    name: "RHEL 9 must conceal, via the session lock, information previously visible on the display with a publicly viewable image."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-271085, V-258027, SV-258027r1045106_rule, CAT II. CCI-000060. NIST SP 800-53 Rev. 4: AC-11."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      gsettings writable org.gnome.desktop.screensaver picture-uri
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^false" }
      - { none: "~ ^true" }
    rationale: &rat-d782768167 |
      Setting the screensaver mode to blank-only conceals the contents of the display from passersby.
    remediation: &rem-441068b772 |
      Configure RHEL 9 to prevent a user from overriding the picture-uri setting for graphical user interfaces.

      In the file "/etc/dconf/db/local.d/00-security-settings", add or update the following lines:

      [org/gnome/desktop/screensaver]
      picture-uri=''

      Prevent user modification by adding the following line to "/etc/dconf/db/local.d/locks/00-security-settings-lock":

      /org/gnome/desktop/screensaver/picture-uri

      Update the dconf system databases:

      $ sudo dconf update
  - id: "STIG-RHEL-09-271090-dconf_policy"
    name: "RHEL 9 effective dconf policy must match the policy keyfiles."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-271090, V-258028, SV-258028r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      'function dconf_needs_update
      { for db in $(find /etc/dconf/db -maxdepth 1 -type f);
        do db_mtime=$(stat -c %Y "$db");
          keyfile_mtime=$(stat -c %Y "$db".d/* | sort -n | tail -1);
          if [ -n "$db_mtime" ] && [ -n "$keyfile_mtime" ] && [ "$db_mtime" -lt "$keyfile_mtime" ];
            then echo "$db needs update"; return 1;
          fi;
        done;
      };
      dconf_needs_update'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ /\\.\\*needs update" }
    rationale: &rat-b30803faab |
      Unlike text-based keyfiles, the binary database is impossible to check through most automated and all manual means; therefore, in order to evaluate dconf configuration, both have to be true at the same time - configuration files have to be compliant, and the database needs to be more recent than those keyfiles, which gives confidence that it reflects them.
    remediation: &rem-42785c1f35 |
      Update the dconf databases by running the following command:

      $ sudo dconf update
  - id: "STIG-RHEL-09-271095-gui_screensaver_no_reboot"
    name: "RHEL 9 must disable the ability of a user to restart the system from the login screen."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-271095, V-258029, SV-258029r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      gsettings get org.gnome.login-screen disable-restart-buttons
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^true" }
      - { none: "~ ^false" }
    rationale: &rat-c85538d38d |
      A user who is at the console can reboot the system at the login screen. If restart or shutdown buttons are pressed at the login screen, this can create the risk of short-term loss of availability of systems due to reboot.
    remediation: &rem-f7af5a52aa |
      Configure RHEL 9 to disable a user's ability to restart the system.

      $ gsettings set org.gnome.login-screen disable-restart-buttons true

      Update the dconf system databases:

      $ sudo dconf update
  - id: "STIG-RHEL-09-271100-gui_screensaver_reboot_lock"
    name: "RHEL 9 must prevent a user from overriding the disable-restart-buttons setting for the graphical user interface."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-271100, V-258030, SV-258030r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      gsettings writable org.gnome.login-screen disable-restart-buttons
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^false" }
      - { none: "~ ^true" }
    rationale: *rat-c85538d38d
    remediation: &rem-0611721a1b |
      Configure RHEL 9 to prevent a user from overriding the disable-restart-buttons setting for graphical user interfaces.

      Create a database to contain the systemwide graphical user logon settings (if it does not already exist) with the following command:

      $ sudo touch /etc/dconf/db/local.d/locks/session

      Add the following line to prevent nonprivileged users from modifying it:

      /org/gnome/login-screen/disable-restart-buttons

      Run the following command to update the database:

      $ sudo dconf update
  - id: "STIG-RHEL-09-271105-gui_disable_ctrl-alt-del"
    name: "RHEL 9 must disable the ability of a user to accidentally press Ctrl-Alt-Del and cause a system to shut down or reboot."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-271105, V-258031, SV-258031r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      gsettings get org.gnome.settings-daemon.plugins.media-keys logout
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ \"\\[\"\\]\"" }
    rationale: &rat-7172da770e |
      A locally logged-in user who presses Ctrl-Alt-Del, when at the console, can reboot the system. If accidentally pressed, as could happen in the case of mixed OS environment, this can create the risk of short-term loss of availability of systems due to unintentional reboot.
    remediation: &rem-15b767e8f1 |
      Configure RHEL 9 to ignore the Ctrl-Alt-Del sequence in the GNOME desktop.

      Run the following command to set the media-keys logout setting:

      $ gsettings set org.gnome.settings-daemon.plugins.media-keys logout "['']"

      Run the following command to update the database:

      $ sudo dconf update
  - id: "STIG-RHEL-09-271110-gui_disable_ctrl-alt-del_lock"
    name: "RHEL 9 must prevent a user from overriding the Ctrl-Alt-Del sequence settings for the graphical user interface."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-271110, V-258032, SV-258032r1268251_rule, CAT II. CCI-000366. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
