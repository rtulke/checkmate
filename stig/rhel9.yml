  - id: "STIG-RHEL-09-611190-private_keys_password"
    name: "RHEL 9, for PKI-based authentication, must enforce authorized access to the corresponding private key. (Manual)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-611190, V-258127, SV-258127r1155648_rule, CAT II. CCI-000186. NIST SP 800-53 Rev. 4: IA-2."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      echo "MANUAL - Please validate all private keys have a password set"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-1804dd3ce2 |
      If the private key is discovered, an attacker can use the key to authenticate as an authorized user and gain access to the network infrastructure.

      The cornerstone of the PKI is the private key used to encrypt or digitally sign information.

      If the private key is stolen, this will lead to the compromise of the authentication and nonrepudiation gained through PKI because the attacker can use the private key to digitally sign documents and pretend to be the authorized user.

      Both the holders of a digital certificate and the issuing authority must protect the computers, storage devices, or whatever they use to keep the private keys.
    remediation: &rem-d31fda743f |
      Create a new private and public key pair that utilizes a passcode with the following command:

      $ sudo ssh-keygen -N [passphrase]
  - id: "STIG-RHEL-09-611195-authenticate_emergency_mode"
    name: "RHEL 9 must require authentication to access emergency mode."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-611195, V-258128, SV-258128r1268226_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat /usr/lib/systemd/system/emergency.service /etc/systemd/system/emergency.service.d/*.conf 2>/dev/null | grep '^ExecStart=-/usr/lib/systemd/systemd-sulogin-shell emergency'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ systemd-sulogin-shell emergency" }
    rationale: &rat-01d04c7f8b |
      To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates by DoW-approved PKIs, all DoW systems (e.g., web servers and web portals) must be properly configured to incorporate access control methods that do not rely solely on the possession of a certificate for access. Successful authentication must not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use access control policies and enforcement mechanisms to implement this requirement.

      This requirement prevents attackers with physical access from trivially bypassing security on the machine and gaining root access. Such accesses are further prevented by configuring the bootloader password.
    remediation: &rem-2711b34e96 |
      Configure RHEL 9 to require authentication for emergency mode.

      Create a directory for supplementary configuration files:

      $ sudo mkdir /etc/systemd/system/emergency.service.d/

      Create a new file:

      $ sudo vi /etc/systemd/system/emergency.service.d/emergency.service.conf

      Add these lines to the new file:

      [Service]
      ExecStart=
      ExecStart=-/usr/lib/systemd/systemd-sulogin-shell emergency

      Apply changes to unit files without rebooting the system:

      $ sudo systemctl daemon-reload
  - id: "STIG-RHEL-09-611200-authenticate_rescue_mode"
    name: "RHEL 9 must require authentication to access single-user mode."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-611200, V-258129, SV-258129r1268226_rule, CAT II. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat /usr/lib/systemd/system/rescue.service /etc/systemd/system/rescue.service.d/*.conf 2>/dev/null | grep '^ExecStart=-/usr/lib/systemd/systemd-sulogin-shell rescue'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ systemd-sulogin-shell rescue" }
    rationale: &rat-58399c667c |
      To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates by DoW-approved PKIs, all DoW systems (e.g., web servers and web portals) must be properly configured to incorporate access control methods that do not rely solely on the possession of a certificate for access. Successful authentication must not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use access control policies and enforcement mechanisms to implement this requirement.

      This requirement prevents attackers with physical access from trivially bypassing security on the machine and gaining root access. Such accesses are further prevented by configuring the bootloader password.

      To modify properties, such as dependencies or timeouts, of a service that is handled by a SysV initscript, do not modify the initscript itself. Instead, create a systemd drop-in configuration file for the service. Then manage this service in the same way as a normal systemd service.

      For example, to extend the configuration of the network service, do not modify the /etc/rc.d/init.d/network initscript file. Instead, create new directory /etc/systemd/system/network.service.d/ and a systemd drop-in file /etc/systemd/system/network.service.d/my_config.conf. Then, put the modified values into the drop-in file. Note: systemd knows the network service as network.service, which is why the created directory must be called "network.service.d".
    remediation: &rem-a46c805434 |
      Configure RHEL 9 to require authentication for single-user mode.

      Create a directory for supplementary configuration files:

      $ sudo mkdir /etc/systemd/system/rescue.service.d/

      Create a new file:

      $ sudo vi etc/systemd/system/rescue.service.d/rescue.service.conf

      Add these lines to the new file:

      [Service]
      ExecStart=
      ExecStart=-/usr/lib/systemd/systemd-sulogin-shell rescue

      Apply changes to unit files without rebooting the system:

      $ sudo systemctl daemon-reload
  - id: "STIG-RHEL-09-651010-aide_installed"
    name: "RHEL 9 must have the AIDE package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-651010, V-258134, SV-258134r1262119_rule, CAT II. CCI-001744, CCI-002696. NIST SP 800-53 Rev. 4: CM-3, SI-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet aide
    expect: true
    rationale: &rat-1280e25e1e |
      Without verification of the security functions, security functions may not operate correctly, and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.

      Selection lines in the aide.conf file determine which files and directories AIDE will monitor for changes. They follow this format:

      <path> <rules>

      The <path> specifies a file, directory or wildcard pattern to monitor.
      The <rules>define which attributes (hashes, permissions, timestamps, etc.) to check.
    remediation: &rem-cdcbba4636 |
      Install AIDE, initialize it, and perform a manual check.

      Install AIDE:

      $ sudo dnf install aide
      Initialize AIDE:

      $ sudo /usr/sbin/aide --init
