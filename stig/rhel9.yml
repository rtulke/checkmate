    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ Permissions Incorrect.*" }
    rationale: *rat-3ffc80c188
    remediation: &rem-4156db5fb6 |
      Configure the system-wide shared library directories (/lib, /lib64, /usr/lib and /usr/lib64) to be protected from unauthorized access.

      Run the following command, replacing "[DIRECTORY]" with any library directory with a mode more permissive than 755.

      $ sudo chmod 755 [DIRECTORY]
  - id: "STIG-RHEL-09-232020-lib_file_perms"
    name: "RHEL 9 library files must have mode 755 or less permissive."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-232020, V-257884, SV-257884r1106306_rule, CAT II. CCI-001499. NIST SP 800-53 Rev. 4: CM-6."
    tags: [stig, stig-rhel9, stig-cat-2]
