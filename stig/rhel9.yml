    expect: empty
    rationale: *rat-d0d038d026
    remediation: *rem-6d9d897da1
  - id: "STIG-RHEL-09-212020-grub_superuser_config-attrs"
    name: "RHEL 9 must require a unique superusers name upon booting into single-user and maintenance modes. (/etc/grub.d/01_users: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-212020, V-257789, SV-257789r1268226_rule, CAT I. CCI-000213. NIST SP 800-53 Rev. 4: AC-3."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      f='/etc/grub.d/01_users'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-fe5023890a |
      Having a nondefault grub superuser username makes password-guessing attacks less effective.
    remediation: &rem-87b5b30bba |
      Configure RHEL 9 to have a unique username for the grub superuser account.

      Edit the "/etc/grub.d/01_users" file and add or modify the following lines with a nondefault username for the superuser account:

      set superusers="<accountname>"
      export superusers

      Once the superuser account has been added, update the grub.cfg file by running:

      In RHEL 9.0, 9.1 and 9.2:
      sudo grub2-mkconfig -o /boot/grub2/grub.cfg

      In RHEL 9.3 and later:
      sudo grub2-mkconfig -o /boot/grub2/grub.cfg --update-bls-cmdline
  - id: "STIG-RHEL-09-212020-grub_superuser_config-content"
