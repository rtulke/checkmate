  - id: "STIG-RHEL-09-214015-gpg_checkdnf_conf-attrs"
    name: "RHEL 9 must check the GPG signature of software packages originating from external software repositories before installation. (/etc/dnf/dnf.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-214015, V-257820, SV-257820r1286923_rule, CAT I. CCI-001749, CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      f='/etc/dnf/dnf.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-c183b72e07 |
      Changes to any software components can have significant effects on the overall security of the operating system. This requirement ensures the software has not been tampered with and that it has been provided by a trusted vendor.

      All software packages must be signed with a cryptographic key recognized and approved by the organization.

      Verifying the authenticity of software prior to installation validates the integrity of the software package received from a vendor. This verifies the software has not been tampered with and that it has been provided by a trusted vendor.
    remediation: &rem-073350c0af |
      Configure RHEL 9 dnf to always check the GPG signature of software packages originating from external software repositories before installation.

      Add or update the following line in the [main] section of the "/etc/dnf/dnf.conf" file:

      gpgcheck=1

      Note: Any of the following are acceptable: "1", "true", or "yes" (keywords containing letters are case insensitive).
  - id: "STIG-RHEL-09-214015-gpg_checkdnf_conf-content"
    name: "RHEL 9 must check the GPG signature of software packages originating from external software repositories before installation. (/etc/dnf/dnf.conf has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-214015, V-257820, SV-257820r1286923_rule, CAT I. CCI-001749, CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
