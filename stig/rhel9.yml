  - id: "STIG-RHEL-09-255064-ssh_config_ciphers_client-attrs"
    name: "The RHEL 9 SSH client must be configured to use only DoW-approved encryption ciphers employing FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH client connections. (/etc/crypto-policies/back-ends/openssh.config: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-255064, V-270177, SV-270177r1268237_rule, CAT I. CCI-001453. NIST SP 800-53 Rev. 4: AC-17."
    tags: [stig, stig-rhel9, stig-cat-1]
    severity: high
    run: |
      f='/etc/crypto-policies/back-ends/openssh.config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-4474e9f939 |
      Without cryptographic integrity protections, information can be altered by unauthorized users without detection.

      Remote access (e.g., RDP) is access to DoW nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

      Cryptographic mechanisms used for protecting the integrity of information include, for example, signed hash functions using asymmetric cryptography, enabling distribution of the public key to verify the hash information while maintaining the confidentiality of the secret key used to generate the hash.

      RHEL 9 incorporates systemwide crypto policies by default. The SSH configuration file has no effect on the ciphers, MACs, or algorithms unless specifically defined in the /etc/sysconfig/sshd file. The employed algorithms can be viewed in the /etc/crypto-policies/back-ends/openssh.config file.
    remediation: &rem-d72d14226e |
      Configure the SSH client to use only ciphers employing FIPS 140-3 approved algorithms.

      Reinstall crypto-policies with the following command:

      $ sudo dnf -y reinstall crypto-policies

      Set the crypto-policy to FIPS with the following command:

      $ sudo update-crypto-policies --set FIPS

      Setting system policy to FIPS

      Note: Systemwide crypto policies are applied on application startup. It is recommended to restart the system for the change of policies to fully take place.
