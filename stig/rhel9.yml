    rationale: &rat-ee668e7b5b |
      Leaving the user list enabled is a security risk since it allows anyone with physical access to the system to enumerate known user accounts without authenticated access to the system.
    remediation: &rem-b9b7d0115a |
      Configure RHEL 9 to disable the user list at logon for graphical user interfaces.

      Create a database to contain the systemwide screensaver settings (if it does not already exist) with the following command:
      Note: The example below is using the database "local" for the system. If the system is using another database in "/etc/dconf/profile/user", the file should be created under the appropriate subdirectory.

      $ sudo touch /etc/dconf/db/local.d/02-login-screen

      [org/gnome/login-screen]
      disable-user-list=true

      Update the system databases:

      $ sudo dconf update
  - id: "STIG-RHEL-09-291010-usb-storage_blacklist"
    name: "RHEL 9 must be configured to disable USB mass storage."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-291010, V-258034, SV-258034r1051267_rule, CAT II. CCI-000778, CCI-001958, CCI-003959. NIST SP 800-53 Rev. 4: IA-3."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep -r usb-storage /etc/modprobe.conf /etc/modprobe.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^.*:install usb-storage \\/bin\\/false" }
      - { some: "~ ^.*:blacklist usb-storage" }
    rationale: &rat-0e5f4c06fb |
      USB mass storage permits easy introduction of unknown devices, thereby facilitating malicious activity.
    remediation: &rem-4c2b2db94a |
      To configure the system to prevent the usb-storage kernel module from being loaded, add the following lines to the file "/etc/modprobe.d/usb-storage.conf" (or create "usb-storage.conf" if it does not exist):

      install usb-storage /bin/false
      blacklist usb-storage
  - id: "STIG-RHEL-09-291015-usbguard_pkg"
    name: "RHEL 9 must have the USBGuard package installed."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-291015, V-258035, SV-258035r1045125_rule, CAT II. CCI-001958, CCI-003959. NIST SP 800-53 Rev. 4: IA-3."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      rpm -q --quiet usbguard
    expect: true
    rationale: &rat-0b9ac1b051 |
      The USBguard-daemon is the main component of the USBGuard software framework. It runs as a service in the background and enforces the USB device authorization policy for all USB devices. The policy is defined by a set of rules using a rule language described in the usbguard-rules.conf file. The policy and the authorization state of USB devices can be modified during runtime using the usbguard tool.

      The system administrator (SA) must work with the site information system security officer (ISSO) to determine a list of authorized peripherals and establish rules within the USBGuard software framework to allow only authorized devices.
    remediation: &rem-24cc26e9f0 |
      Install the usbguard package with the following command:

      $ sudo dnf install usbguard

      Enable the service to start on boot and then start it with the following commands:
      $ sudo systemctl enable usbguard
      $ sudo systemctl start usbguard

      Verify the status of the service with the following command:
      $ sudo systemctl status usbguard

      Note: usbguard will need to be configured to allow authorized devices once it is enabled on RHEL 9.
  - id: "STIG-RHEL-09-291020-usbguard_enabled-enabled"
    name: "RHEL 9 must have the USBGuard package enabled. (Service usbguard is enabled)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-291020, V-258036, SV-258036r1014861_rule, CAT II. CCI-001958, CCI-003959. NIST SP 800-53 Rev. 4: IA-3."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p UnitFileState usbguard | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-0b9ac1b051
    remediation: &rem-99d0711f08 |
      To enable the USBGuard service run the following command:

      $ sudo systemctl enable --now usbguard
  - id: "STIG-RHEL-09-291020-usbguard_enabled-running"
    name: "RHEL 9 must have the USBGuard package enabled. (Service usbguard is running)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-291020, V-258036, SV-258036r1014861_rule, CAT II. CCI-001958, CCI-003959. NIST SP 800-53 Rev. 4: IA-3."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      systemctl show -p ActiveState usbguard | cut -d= -f2
    expect: "== active"
    rationale: *rat-0b9ac1b051
    remediation: *rem-99d0711f08
  - id: "STIG-RHEL-09-291030-usbguard_rules"
    name: "RHEL 9 must block unauthorized peripherals before establishing a connection."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-291030, V-258038, SV-258038r1045128_rule, CAT II. CCI-001958. NIST SP 800-53 Rev. 4: IA-3."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      usbguard list-rules
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^(allow|deny) id .*" }
    rationale: *rat-0b9ac1b051
    remediation: &rem-51c5eac106 |
      Configure the operating system to enable the blocking of unauthorized peripherals with the following command:

      Note: This command must be run from a root shell and will create an allow list for any usb devices currently connected to the system.

      # usbguard generate-policy --no-hash > /etc/usbguard/rules.conf

      Note: Enabling and starting usbguard without properly configuring it for an individual system will immediately prevent any access over a usb device such as a keyboard or mouse.
  - id: "STIG-RHEL-09-291035-bluetooth_blacklist"
    name: "RHEL 9 Bluetooth must be disabled."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-291035, V-258039, SV-258039r1262150_rule, CAT II. CCI-000381, CCI-001443. NIST SP 800-53 Rev. 4: CM-7, AC-18."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep -r bluetooth /etc/modprobe.conf /etc/modprobe.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^.*:install bluetooth \\/bin\\/false" }
      - { some: "~ ^.*:blacklist bluetooth" }
    rationale: &rat-f8e581d47a |
      This requirement applies to wireless peripheral technologies (e.g., wireless mice, keyboards, displays, etc.) used with RHEL 9 systems. Wireless peripherals (e.g., Wi-Fi/Bluetooth/IR keyboards, mice and pointing devices, and near field communications [NFC]) present a unique challenge by creating an open, unsecured port on a computer. Wireless peripherals must meet DoW requirements for wireless data transmission and be approved for use by the Authorizing Official (AO). Even though some wireless peripherals, such as mice and pointing devices, do not ordinarily carry information that need to be protected, modification of communications with these wireless peripherals may be used to compromise the RHEL 9 operating system.
    remediation: &rem-e1a093306d |
      Configure RHEL 9 to disable the Bluetooth adapter when not in use.

      Create or modify the "/etc/modprobe.d/bluetooth.conf" file with the following lines:

      install bluetooth /bin/false
      blacklist bluetooth

      Reboot the system for the settings to take effect.
  - id: "STIG-RHEL-09-291040-wireless_disabled"
    name: "RHEL 9 wireless network adapters must be disabled."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-291040, V-258040, SV-258040r1262151_rule, CAT II. CCI-001443, CCI-001444, CCI-002418, CCI-002421. NIST SP 800-53 Rev. 4: SC-8, AC-18."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      nmcli connection show | grep -i wifi
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: *rat-f8e581d47a
    remediation: &rem-35b40a3d91 |
      Configure the system to disable all wireless network interfaces with the following command:

      $ nmcli radio all off
  - id: "STIG-RHEL-09-431015-selinux_sepolicy-attrs"
    name: "RHEL 9 must enable the SELinux targeted policy. (/etc/selinux/config: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-431015, V-258079, SV-258079r1045159_rule, CAT II. CCI-002696. NIST SP 800-53 Rev. 4: SI-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/selinux/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-c98c83fc70 |
      Setting the SELinux policy to "targeted" or a more specialized policy ensures the system will confine processes that are likely to be targeted for exploitation, such as network or system services.

      Note: During the development or debugging of SELinux modules, it is common to temporarily place nonproduction systems in "permissive" mode. In such temporary cases, SELinux policies should be developed, and once work is completed, the system should be reconfigured to "targeted".
    remediation: &rem-f2a8ea624a |
      Configure RHEL 9 to use the targetd SELINUX policy.

      Edit the file "/etc/selinux/config" and add or modify the following line:

       SELINUXTYPE=targeted

      A reboot is required for the changes to take effect.
  - id: "STIG-RHEL-09-431015-selinux_sepolicy-content"
    name: "RHEL 9 must enable the SELinux targeted policy. (/etc/selinux/config has the expected content (2 rules))"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-431015, V-258079, SV-258079r1045159_rule, CAT II. CCI-002696. NIST SP 800-53 Rev. 4: SI-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      cat '/etc/selinux/config'
    allow_rc: any
    expect:
      - { some: "~ ^SELINUXTYPE=targeted" }
      - { none: "~ ^SELINUXTYPE=(minimum|mls|permissive)" }
    rationale: *rat-c98c83fc70
    remediation: *rem-f2a8ea624a
  - id: "STIG-RHEL-09-431015-selinux_getpolicy"
    name: "RHEL 9 must enable the SELinux targeted policy."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-431015, V-258079, SV-258079r1045159_rule, CAT II. CCI-002696. NIST SP 800-53 Rev. 4: SI-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      sestatus | grep "policy name"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Loaded policy name:\\s+targeted" }
      - { none: "~ ^Loaded policy name:\\s+(minimum|mls)" }
    rationale: *rat-c98c83fc70
    remediation: *rem-f2a8ea624a
  - id: "STIG-RHEL-09-431016-elevated_secontext"
    name: "RHEL 9 must elevate the SELinux context when an administrator calls the sudo command."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-431016, V-272496, SV-272496r1155582_rule, CAT II. CCI-002235. NIST SP 800-53 Rev. 4: AC-6."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      grep -r sysadm_r /etc/sudoers /etc/sudoers.d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*:.*ALL=(ALL) TYPE=sysadm_t ROLE=sysadm_r ALL" }
    rationale: &rat-27df2df798 |
      Without verification of the security functions, security functions may not operate correctly and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.

      This requirement applies to operating systems performing security function verification/testing and/or systems and environments that require this functionality.

      Preventing nonprivileged users from executing privileged functions mitigates the risk that unauthorized individuals or processes may gain unnecessary access to information or privileges.

      Privileged functions include, for example, establishing accounts, performing system integrity checks, or administering cryptographic key management activities. Nonprivileged users are individuals who do not possess appropriate authorizations. Circumventing intrusion detection and prevention mechanisms or malicious code protection mechanisms are examples of privileged functions that require protection from nonprivileged users.
    remediation: &rem-6d58009f55 |
      Configure RHEL 9 to elevate the SELinux context when an administrator calls the sudo command.

      Edit a file in the "/etc/sudoers.d" directory with the following command:

      $ sudo visudo -f /etc/sudoers.d/<customfile>

      Use the following example to build the <customfile> in the /etc/sudoers.d directory to allow any administrator belonging to a designated sudoers admin group to elevate their SELinux context with the use of the sudo command:

      %{designated_group_or_user_name} ALL=(ALL) TYPE=sysadm_t ROLE=sysadm_r ALL

      Remove any configurations that conflict with the above from the following locations:

      /etc/sudoers
      /etc/sudoers.d/
  - id: "STIG-RHEL-09-431020-faillock_dir-attrs"
    name: "RHEL 9 must configure SELinux context type to allow the use of a nondefault faillock tally directory. (/etc/security/faillock.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-431020, V-258080, SV-258080r1045162_rule, CAT II. CCI-000044. NIST SP 800-53 Rev. 4: AC-7."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-26b9b15314 |
      Not having the correct SELinux context on the faillock directory may lead to unauthorized access to the directory.
    remediation: &rem-980dfaaef0 |
      Configure RHEL 9 to allow the use of a nondefault faillock tally directory while SELinux enforces a targeted policy.

      First enable the feature using the following command:

      $ sudo authselect enable-feature with-faillock

      Create a nondefault faillock tally directory (if it does not already exist) with the following example:

      $ sudo mkdir /var/log/faillock

      Then add/modify the "/etc/security/faillock.conf" file to match the following line:

      dir = /var/log/faillock

