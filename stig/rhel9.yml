  - id: "STIG-RHEL-09-231045-home_nodev"
    name: "RHEL 9 must prevent device files from being interpreted on file systems that contain user home directories."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-231045, V-257850, SV-257850r1044930_rule, CAT II. CCI-001764. NIST SP 800-53 Rev. 4: CM-7."
    tags: [stig, stig-rhel9, stig-cat-2]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/home'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nodev(,|$)"
    rationale: &rat-5962780ff4 |
      The "nodev" mount option causes the system to not interpret character or block special devices. Executing character or block special devices from untrusted file systems increases the opportunity for nonprivileged users to attain unauthorized administrative access.

      The only legitimate location for device files is the "/dev" directory located on the root partition, with the exception of chroot jails if implemented.
    remediation: &rem-42d881730d |
      Modify "/etc/fstab" to use the "nodev" option on the "/home" directory.
  - id: "STIG-RHEL-09-231050-home_nosuid"
    name: "RHEL 9 must prevent files with the setuid and setgid bit set from being executed on file systems that contain user home directories."
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-231050, V-257851, SV-257851r1044932_rule, CAT II. CCI-001764. NIST SP 800-53 Rev. 4: CM-7."
