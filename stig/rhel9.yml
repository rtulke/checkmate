      - { none: "~ ^gpgcheck\\s*=\\s*0" }
    rationale: *rat-c183b72e07
    remediation: *rem-073350c0af
  - id: "STIG-RHEL-09-214020-localgpg_check_conf-attrs"
    name: "RHEL 9 must check the GPG signature of locally installed software packages before installation. (/etc/dnf/dnf.conf: exists)"
    description: "DISA STIG for Red Hat Enterprise Linux 9, RHEL-09-214020, V-257821, SV-257821r1286926_rule, CAT I. CCI-001749, CCI-003992. NIST SP 800-53 Rev. 4: CM-5."
