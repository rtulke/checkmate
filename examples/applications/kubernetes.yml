name: Kubernetes cluster
version: 1.0.0
description: >
  Cluster-wide checks with kubectl and jq from an admin workstation or a
  CI job: node health, failing pods, privileged workloads, cluster-admin
  bindings and the API server version.

vars:
  min_kubernetes: "1.29"
  allowed_cluster_admins: ["Group:system:masters", "User:kubernetes-admin"]

checks:
  - id: K8S-001
    name: All nodes are Ready
    tags: [applications, kubernetes]
    severity: critical
    only_if: kubectl version --request-timeout=5s >/dev/null 2>&1
    run: |
      kubectl get nodes --no-headers | awk '$2 != "Ready" {print $1 " " $2}'
    expect: empty
    rationale: A node that is not Ready takes no new pods and reduces the capacity and redundancy of the cluster.
    remediation: Inspect the node with `kubectl describe node <node>` and check the kubelet on it.

  - id: K8S-002
    name: No pod is crash-looping or failing to pull its image
    tags: [applications, kubernetes]
    severity: high
    only_if: kubectl version --request-timeout=5s >/dev/null 2>&1
    run: |
      kubectl get pods -A --no-headers | awk '$4 ~ /CrashLoopBackOff|ImagePullBackOff|ErrImagePull|Error/ {print $1 "/" $2 " " $4}'
    expect: empty
    rationale: A pod in one of these states is not serving, and the workload behind it runs degraded or not at all.
    remediation: Inspect the pod with `kubectl describe pod` and `kubectl logs --previous`, then fix the image reference or the cause of the crash.

  - id: K8S-003
    name: No privileged containers
    tags: [applications, kubernetes]
    severity: critical
    only_if: kubectl version --request-timeout=5s >/dev/null 2>&1
    run: |
      kubectl get pods -A -o json | jq -r '
        .items[]
        | select(.metadata.namespace | test("^kube-") | not)
        | select(any(.spec.containers[]; .securityContext.privileged == true))
        | .metadata.namespace + "/" + .metadata.name'
    expect: empty
    rationale: A privileged container has full access to the node and can take it over.
    remediation: Remove privileged from the securityContext of the listed pods and enforce the baseline Pod Security Standard on their namespaces.

  - id: K8S-004
    name: No pods share the host PID or network namespace
    tags: [applications, kubernetes]
    severity: high
    only_if: kubectl version --request-timeout=5s >/dev/null 2>&1
    run: |
      kubectl get pods -A -o json | jq -r '
        .items[]
        | select(.metadata.namespace | test("^kube-") | not)
        | select(.spec.hostPID == true or .spec.hostNetwork == true)
        | .metadata.namespace + "/" + .metadata.name'
    expect: empty
    rationale: A pod in the host PID or network namespace sees the processes of the node or reaches services bound to its localhost.
    remediation: Remove hostPID and hostNetwork from the specification of the listed pods.

  - id: K8S-005
    name: Only approved subjects are cluster-admin
    tags: [applications, kubernetes, rbac]
    severity: critical
    only_if: kubectl version --request-timeout=5s >/dev/null 2>&1
    run: |
      kubectl get clusterrolebindings -o json |
        jq -r '.items[] | select(.roleRef.name == "cluster-admin") | .subjects[]? | .kind + ":" + .name' |
        sort -u | grep -vxF {% for s in allowed_cluster_admins %}-e '{{ s }}' {% endfor %}
    allow_rc: [0, 1]
    expect: empty
    rationale: cluster-admin grants every action on every resource, including reading all secrets.
    remediation: Delete the binding or remove the subject from it, or add the subject to allowed_cluster_admins.

  - id: K8S-006
    name: Nothing but the API service runs in the default namespace
    tags: [applications, kubernetes]
    severity: low
    only_if: kubectl version --request-timeout=5s >/dev/null 2>&1
    run: |
      kubectl get all -n default --no-headers 2>/dev/null | grep -v '^service/kubernetes '
    allow_rc: [0, 1]
    expect: empty
    rationale: Workloads in the default namespace miss the quotas, network policies and role bindings that are set up per namespace.
    remediation: Move the listed resources to a dedicated namespace.

  - id: K8S-007
    name: "API server is version {{ min_kubernetes }} or newer"
    tags: [applications, kubernetes, updates]
    only_if: kubectl version --request-timeout=5s >/dev/null 2>&1
    run: |
      kubectl version -o json | jq -r '.serverVersion.gitVersion | ltrimstr("v") | split("-")[0]'
    as: version
    expect: ">= {{ min_kubernetes }}"
    rationale: Kubernetes maintains only the newest minor releases, so an older API server gets no security fixes.
    remediation: Upgrade the control plane, one minor version at a time.
