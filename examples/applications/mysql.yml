name: MySQL and MariaDB
version: 1.0.0
description: >
  Server settings, accounts and file permissions for MySQL and MariaDB.
  Queries run through a snippet with the client of the local root account
  (socket authentication), so no password is stored in the policy.

vars:
  min_version: "8.0"

snippets:
  # Runs the SQL in {{ arg }} and prints the bare result.
  sql: mysql --batch --skip-column-names -e "{{ arg }}"

defaults:
  # Shell commands for Unix-like systems.
  when: facts.os != "windows"

checks:
  - id: MYSQL-001
    name: The server answers
    tags: [applications, mysql]
    severity: critical
    only_if: command -v mysqladmin
    run: mysqladmin ping
    expect: "~ alive"
    rationale: Applications fail when the database does not answer, and the other checks of this policy need a running server.
    remediation: Start the database service and read its error log if it does not come up.

  - id: MYSQL-002
    name: No anonymous accounts
    tags: [applications, mysql, accounts]
    severity: critical
    only_if: command -v mysqladmin && mysqladmin ping >/dev/null 2>&1
    run: { use: sql, arg: "SELECT CONCAT(user, '@', host) FROM mysql.user WHERE user = ''" }
    expect: empty
    rationale: An anonymous account lets anyone connect without a user name.
    remediation: Drop the listed accounts with `DROP USER ''@'<host>'`.

  - id: MYSQL-003
    name: root can only log in locally
    tags: [applications, mysql, accounts]
    severity: high
    only_if: command -v mysqladmin && mysqladmin ping >/dev/null 2>&1
    run: { use: sql, arg: "SELECT host FROM mysql.user WHERE user = 'root'" }
    expect: { each: "in [localhost, 127.0.0.1, '::1']" }
    rationale: A root account that accepts remote logins exposes full control of the server to password guessing over the network.
    remediation: Drop the remote root accounts with `DROP USER 'root'@'<host>'`.

  - id: MYSQL-004
    name: No account accepts connections from any host
    tags: [applications, mysql, accounts]
    severity: high
    only_if: command -v mysqladmin && mysqladmin ping >/dev/null 2>&1
    run: { use: sql, arg: "SELECT CONCAT(user, '@', host) FROM mysql.user WHERE host = '%'" }
    expect: empty
    rationale: An account with host % can log in from every address that reaches the server.
    remediation: Limit the listed accounts to the hosts of the application, for example with `RENAME USER 'app'@'%' TO 'app'@'10.0.0.%'`.

  - id: "MYSQL-VAR-{{ item.key }}"
    name: "{{ item.key }} {{ item.value }}"
    tags: [applications, mysql]
    only_if: command -v mysqladmin && mysqladmin ping >/dev/null 2>&1
    loop:
      local_infile: "in [OFF, 0]"
      skip_symbolic_links: "in [ON, YES, 1]"
      require_secure_transport: "in [ON, 1]"
      log_error: "!empty"
      sql_mode: "~ STRICT_(TRANS|ALL)_TABLES"
    run: { use: sql, arg: "SELECT @@{{ item.key }}" }
    expect: "{{ item.value }}"
    rationale: "Another value of {{ item.key }} gives clients access to files through the server, allows unencrypted connections or lets faulty data and errors pass unnoticed."
    remediation: "Set the option for {{ item.key }} in the [mysqld] section of the option file so that the variable satisfies `{{ item.value }}`, and restart the server. skip_symbolic_links is set with `symbolic-links=0`."

  - id: MYSQL-005
    name: "Server version {{ min_version }} or newer"
    tags: [applications, mysql, updates]
    only_if: command -v mysqladmin && mysqladmin ping >/dev/null 2>&1
    run: { use: sql, arg: "SELECT VERSION()" }
    as: version
    expect: ">= {{ min_version }}"
    rationale: Old release series no longer get security fixes.
    remediation: Upgrade the server to a supported release.

  - id: MYSQL-006
    name: The data directory is only accessible by mysql
    tags: [applications, mysql, permissions]
    severity: high
    only_if: test -d /var/lib/mysql
    run: find /var/lib/mysql -maxdepth 0 \( -perm /o+rwx -o ! -user mysql \)
    expect: empty
    rationale: Whoever can read the data directory can copy every table without logging in.
    remediation: chown mysql /var/lib/mysql && chmod 750 /var/lib/mysql

  - id: MYSQL-007
    name: No credentials in world-readable option files
    tags: [applications, mysql, credentials]
    severity: high
    run: |
      for f in /etc/my.cnf /etc/mysql/my.cnf /etc/my.cnf.d/*.cnf /etc/mysql/conf.d/*.cnf /root/.my.cnf; do
        [ -f "$f" ] || continue
        if grep -qiE '^[[:space:]]*password[[:space:]]*=' "$f" && [ -n "$(find "$f" -perm /o+r)" ]; then echo "$f"; fi
      done
    expect: empty
    rationale: A password in a world-readable option file is available to every local user.
    remediation: Move the password to a separate option file that only its owner can read (`chmod 600 <file>`).
