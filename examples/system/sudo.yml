name: sudo
version: 1.0.0
description: >
  sudo configuration: syntax, file permissions, dangerous rules, logging
  and an allowlist of approved sudoers files by SHA-256 checksum.

defaults:
  # Shell commands for Unix-like systems.
  when: facts.os != "windows"

checks:
  - id: SUDO-001
    name: sudoers syntax is valid
    tags: [system, sudo]
    severity: high
    when: facts.is_root
    run: visudo -c -q
    expect: true
    rationale: sudo refuses to work with a syntax error in sudoers, which locks administrators out.
    remediation: Run `visudo -c` to see the error and correct the reported file with `visudo -f <file>`.

  - id: SUDO-002
    name: /etc/sudoers is read-only and owned by root
    tags: [system, sudo, files]
    severity: high
    run:
      linux: stat -c '%a %U' /etc/sudoers
      macos: stat -f '%Lp %Su' /etc/sudoers
    expect: "in [440 root, 400 root]"
    rationale: Whoever can write /etc/sudoers can grant themselves root.
    remediation: chown root /etc/sudoers && chmod 440 /etc/sudoers

  - id: SUDO-003
    name: Drop-in files are owned by root and not accessible by others
    tags: [system, sudo, files]
    severity: high
    run: |
      find /etc/sudoers.d -type f \( ! -user root -o -perm /o+rwx -o -perm /g+w \) 2>/dev/null
    allow_rc: [0, 1]
    expect: empty
    rationale: A writable drop-in lets its owner grant root rights, and a readable one reveals who may run what.
    remediation: chown root /etc/sudoers.d/<file> && chmod 440 /etc/sudoers.d/<file>

  - id: SUDO-004
    name: No rule grants passwordless root for everything
    tags: [system, sudo]
    severity: high
    when: facts.is_root
    run: |
      grep -rhE '^[^#]*NOPASSWD:[[:space:]]*ALL[[:space:]]*$' /etc/sudoers /etc/sudoers.d 2>/dev/null
    allow_rc: [0, 1]
    expect: empty
    rationale: With NOPASSWD on ALL a hijacked session of that user is a root session.
    remediation: Remove NOPASSWD from the listed rules or limit them to specific commands.

  - id: SUDO-005
    name: No rule disables authentication
    tags: [system, sudo]
    severity: high
    when: facts.is_root
    run: |
      grep -rhE '^[^#]*!authenticate' /etc/sudoers /etc/sudoers.d 2>/dev/null
    allow_rc: [0, 1]
    expect: empty
    rationale: A rule with !authenticate lets the user run commands as root without entering a password.
    remediation: Remove the !authenticate entries from the listed rules with `visudo`.

  - id: SUDO-006
    name: sudo runs commands in a pseudo terminal
    tags: [system, sudo]
    severity: low
    when: facts.is_root
    run: |
      grep -rhE '^[[:space:]]*Defaults([[:space:]]+|.*[[:space:],])use_pty([[:space:],]|$)' /etc/sudoers /etc/sudoers.d 2>/dev/null
    allow_rc: [0, 1]
    expect: { lines: ">= 1" }
    rationale: Without a pseudo terminal a program started through sudo can leave a background process on the user's terminal after it exits.
    remediation: Add `Defaults use_pty` to /etc/sudoers with `visudo`.

  - id: SUDO-007
    name: sudo writes its own log file
    tags: [system, sudo, logging]
    severity: low
    when: facts.is_root
    run: |
      grep -rhE '^[[:space:]]*Defaults[[:space:]].*logfile=' /etc/sudoers /etc/sudoers.d 2>/dev/null
    allow_rc: [0, 1]
    expect: { lines: ">= 1" }
    rationale: A dedicated log file keeps the record of privileged commands apart from the general syslog stream.
    remediation: Add `Defaults logfile=/var/log/sudo.log` to /etc/sudoers with `visudo`.

  # Allowlist: every sudoers file must match a checksum in
  # trusted-sudoers.sha256 (lines as printed by `sha256sum <file>`).
  # Unlike comment-stripping approaches, this compares exact content, so
  # nothing can be hidden in lines that look like comments.
  - id: SUDO-008
    name: Only approved sudoers files are present
    tags: [system, sudo, integrity]
    severity: critical
    when: facts.os == "linux" and facts.is_root
    run: |
      sha256sum /etc/sudoers /etc/sudoers.d/* 2>/dev/null | grep -vxFf trusted-sudoers.sha256
    allow_rc: [0, 1]
    expect: empty
    rationale: A changed or added sudoers file is a common way to gain or keep root access.
    remediation: >
      Review the listed files. To approve a file, append the output of
      `sha256sum <file>` to trusted-sudoers.sha256.
