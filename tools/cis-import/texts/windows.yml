# Rationale and remediation texts of the Windows CIS checks, written for
# checkmate (CIS benchmark text is not used). One entry per concept: the registry value, security setting, user right, audit subcategory, service or firewall setting a check reads.
# A text is a string, or one per platform family (only all).
# tools/cis-import adds them to the generated policies; the remediation is
# only used where the converter cannot generate one. See cis/README.md.

SystemAccess.PasswordHistorySize:
  rationale: |-
    Remembering a long history of previous passwords stops users from cycling back to an old password right after a forced change. Without it, password expiry provides little protection, because a password that may already have been exposed can be reused immediately. A history of 24 passwords, combined with a minimum password age, makes reuse impractical.
SystemAccess.MaximumPasswordAge:
  rationale: |-
    A maximum password age limits how long a stolen or guessed password remains usable. Passwords that never expire give an attacker unlimited time to crack captured hashes or to keep using leaked credentials. A limit of at most 365 days, but never 0 (which means passwords never expire), balances this risk against the tendency of users to choose weak passwords when forced to change them too often.
SystemAccess.MinimumPasswordAge:
  rationale: |-
    A minimum password age prevents users from changing their password several times in a row to get back to a favourite old one, which would defeat the password history. Requiring at least one day between changes keeps the history setting effective.
SystemAccess.MinimumPasswordLength:
  rationale: |-
    Password length is the main factor in resistance to brute-force and dictionary attacks against both online logons and captured password hashes. Short passwords can be cracked quickly with modern hardware. Requiring at least 14 characters greatly enlarges the search space and encourages the use of passphrases.
SystemAccess.PasswordComplexity:
  rationale: |-
    Complexity rules require passwords to mix character classes and not contain the account name, which rules out the most predictable choices such as plain dictionary words or the user name. This raises the effort needed for guessing and dictionary attacks. The check expects the policy to be enabled.
HKLM\SYSTEM\CurrentControlSet\Control\SAM\RelaxMinimumPasswordLengthLimits:
  rationale: |-
    By default Windows cannot enforce a minimum password length above 14 characters, regardless of the configured value. Setting RelaxMinimumPasswordLengthLimits to 1 lifts this legacy limit so that longer minimum lengths can be enforced and the password length policy is applied as configured.
SystemAccess.ClearTextPassword:
  rationale: |-
    Storing passwords with reversible encryption is essentially equivalent to storing them in clear text: anyone who obtains the account database can recover the actual passwords. It is only needed by a few legacy protocols such as CHAP or HTTP Digest. Keeping the setting disabled ensures that only one-way password hashes are stored.
SystemAccess.LockoutDuration:
  rationale: |-
    Locking an account for a period after repeated failed logons slows down online password guessing considerably. A lockout duration of 15 minutes or more makes brute-force attacks impractical while still letting legitimate users regain access automatically. A value of 0 would require an administrator to unlock each account manually.
SystemAccess.LockoutBadCount:
  rationale: |-
    An account lockout threshold limits how many passwords an attacker can try against an account before it is locked. Without a threshold, online brute-force and password-spraying attacks can continue indefinitely. A threshold of 1 to 5 attempts stops guessing early; the trade-off is that attackers or misconfigured clients can deliberately lock accounts out.
SystemAccess.AllowAdministratorLockout:
  rationale: |-
    Historically the built-in Administrator account was exempt from account lockout, which made it an ideal target for unlimited password guessing over the network. Enabling administrator lockout applies the lockout policy to this account as well, closing that gap. Local console logon remains possible for recovery.
SystemAccess.ResetLockoutCount:
  rationale: |-
    This setting defines after how many minutes the failed-logon counter is reset. If it resets too quickly, an attacker can stay just below the lockout threshold and keep guessing at a steady rate. A reset period of 15 minutes or more keeps the number of possible guesses per hour low.
PrivilegeRights.SeTrustedCredManAccessPrivilege:
  rationale: |-
    The right to access Credential Manager as a trusted caller is used only by the operating system during backup and restore of stored credentials. Any account holding it could read the saved credentials of other users. No account or group should hold this right.
PrivilegeRights.SeNetworkLogonRight:
  rationale: |-
    This right determines who can connect to the computer over the network, for example to file shares, RPC or remote administration interfaces. Restricting it to the expected groups reduces the number of accounts that can be used for lateral movement or remote attacks. The allowed set differs by role: workstations allow Administrators and Remote Desktop Users, member servers Authenticated Users and Administrators, and domain controllers additionally ENTERPRISE DOMAIN CONTROLLERS for replication.
PrivilegeRights.SeTcbPrivilege:
  rationale: |-
    Act as part of the operating system lets a process assume the identity of any user without authentication and thus gain full control of the system. Services running as Local System have this privilege implicitly, so no account or group needs to be assigned it explicitly. Any assignment is a strong privilege escalation risk.
PrivilegeRights.SeIncreaseQuotaPrivilege:
  rationale: |-
    Adjusting the memory quotas of a process can be abused to starve other processes of memory and cause a denial of service. Only the service accounts that need it (LOCAL SERVICE, NETWORK SERVICE) and Administrators should hold this right.
PrivilegeRights.SeInteractiveLogonRight:
  rationale: |-
    This right determines who can log on at the console of the computer. Limiting it to the expected groups prevents unprivileged or service accounts from logging on locally, where they could exploit local vulnerabilities or access cached data. Workstations allow Administrators and Users; servers allow Administrators only, plus ENTERPRISE DOMAIN CONTROLLERS on domain controllers.
PrivilegeRights.SeRemoteInteractiveLogonRight:
  rationale: |-
    This right determines who can log on through Remote Desktop Services. Remote Desktop is a frequent target for password guessing and lateral movement, so the right should be held only by Administrators and, where remote access by non-administrators is intended, the Remote Desktop Users group. On domain controllers it is limited to Administrators.
PrivilegeRights.SeBackupPrivilege:
  rationale: |-
    The backup right allows reading any file regardless of its permissions, including registry hives and the Active Directory database that contain password hashes. Restricting it to Administrators prevents other accounts from bypassing file system access control to steal sensitive data.
PrivilegeRights.SeSystemTimePrivilege:
  rationale: |-
    Changing the system time can undermine Kerberos authentication, which depends on synchronised clocks, and can falsify event log timestamps to hide an attacker's activity. Only LOCAL SERVICE (used by the time service) and Administrators should hold this right.
PrivilegeRights.SeTimeZonePrivilege:
  rationale: |-
    Changing the time zone does not alter the system clock, but it affects how timestamps are displayed and can cause confusion when correlating events. The right is limited to LOCAL SERVICE and Administrators, plus Users on workstations where mobile users legitimately need to adjust the time zone.
PrivilegeRights.SeCreatePagefilePrivilege:
  rationale: |-
    The right to create or resize the page file can be abused to exhaust disk space or degrade performance, and the page file may contain sensitive memory content. Only Administrators should hold this right.
PrivilegeRights.SeCreateTokenPrivilege:
  rationale: |-
    Create a token object allows building arbitrary access tokens, including tokens with any group membership and privilege, which amounts to full control of the system. Only the Local Security Authority needs it, and it has it implicitly. No account or group should be assigned this right.
PrivilegeRights.SeCreateGlobalPrivilege:
  rationale: |-
    Create global objects allows a process to create objects visible in all sessions, such as shared memory sections. A malicious process holding it could create objects used by processes of other users and interfere with or spoof them. The right is limited to the service identities and Administrators that need it.
PrivilegeRights.SeCreatePermanentPrivilege:
  rationale: |-
    Create permanent shared objects allows creating kernel objects that persist after the creating process exits, which could be used to expose sensitive data or interfere with other components. Kernel-mode components already have this capability, so no account or group should be assigned it.
PrivilegeRights.SeCreateSymbolicLinkPrivilege:
  rationale: |-
    Symbolic links can redirect file operations of privileged programs to unexpected locations, a common building block for privilege escalation. The right should be held only by Administrators. Where Hyper-V is installed, NT VIRTUAL MACHINE\Virtual Machines may also need it; the check accepts this group except on domain controllers.
PrivilegeRights.SeDebugPrivilege:
  rationale: |-
    Debug programs allows attaching to and reading the memory of any process, including the LSASS process that holds credentials. It is the privilege most credential-dumping tools rely on. Only Administrators should hold it, and ideally only when debugging is actually required.
PrivilegeRights.SeDenyNetworkLogonRight:
  rationale: |-
    Denying network logon to Guests prevents anonymous-style access to the system over the network. On workstations and member servers, also denying local accounts (Local account, or local accounts in the Administrators group on member servers) blocks the reuse of shared local administrator passwords or hashes for lateral movement. Domain controllers only require Guests, since they have no ordinary local accounts.
PrivilegeRights.SeDenyBatchLogonRight:
  rationale: |-
    Denying batch logon to Guests prevents the guest account from being used to run scheduled tasks or other batch jobs. This removes a way for an unauthenticated or low-trust identity to execute code on the system.
PrivilegeRights.SeDenyServiceLogonRight:
  rationale: |-
    Denying service logon to Guests ensures that the guest account cannot be used as the identity of a service. This prevents low-trust accounts from running persistent background code on the system.
PrivilegeRights.SeDenyInteractiveLogonRight:
  rationale: |-
    Denying local logon to Guests ensures that the guest account cannot be used to log on at the console, even if it is accidentally enabled. This removes an access path that requires no individual credentials.
PrivilegeRights.SeDenyRemoteInteractiveLogonRight:
  rationale: |-
    Denying Remote Desktop logon to Guests and to local accounts forces remote interactive access to use domain accounts, which are centrally managed and audited. Blocking local accounts prevents shared local administrator passwords from being used to move between systems via RDP. On domain controllers only Guests are required.
PrivilegeRights.SeEnableDelegationPrivilege:
  rationale: |-
    This right allows marking user and computer accounts as trusted for delegation, which lets them impersonate other users towards other services. Misused delegation is a well-known path to domain compromise. It is meaningful only on domain controllers, where only Administrators should hold it; on all other systems no one should.
PrivilegeRights.SeRemoteShutdownPrivilege:
  rationale: |-
    Force shutdown from a remote system allows shutting down the computer over the network, which can be used for denial of service. Only Administrators should hold this right.
PrivilegeRights.SeAuditPrivilege:
  rationale: |-
    Generate security audits allows writing entries to the Security event log. An attacker holding it could flood the log to hide activity or to trigger log overwrites. Only the LOCAL SERVICE and NETWORK SERVICE identities should hold it; on Windows Server 2025 an additional built-in service SID is expected.
PrivilegeRights.SeImpersonatePrivilege:
  rationale: |-
    Impersonate a client after authentication lets a process act with the security context of clients that connect to it. Many local privilege escalation techniques abuse this privilege to obtain SYSTEM rights. It is limited to the service identities and Administrators that need it, optionally IIS_IUSRS where IIS is installed (not on domain controllers).
PrivilegeRights.SeIncreaseBasePriorityPrivilege:
  rationale: |-
    Increasing the scheduling priority of processes can be used to starve other processes of CPU time and cause a denial of service. Only Administrators and the Window Manager Group, which needs it for the desktop, should hold this right.
PrivilegeRights.SeLoadDriverPrivilege:
  rationale: |-
    Loading device drivers means running code in the kernel, which bypasses all user-mode security boundaries; vulnerable signed drivers are commonly abused this way. Only Administrators should hold this right.
PrivilegeRights.SeLockMemoryPrivilege:
  rationale: |-
    Lock pages in memory lets a process keep data in physical memory and prevent it from being paged out. Abuse can exhaust physical memory and degrade or stop the system. Unless a specific application such as a database server requires it, no account should hold this right.
PrivilegeRights.SeBatchLogonRight:
  rationale: |-
    Log on as a batch job allows an account to run scheduled tasks without an interactive logon. Restricting it to Administrators reduces the accounts that can establish persistence or run code through the task scheduler.
PrivilegeRights.SeServiceLogonRight:
  rationale: |-
    Log on as a service allows an account to run as a Windows service, which gives persistent background execution. On workstations no account needs to be assigned this right explicitly, as built-in services use their own identities. Applications that install services under dedicated accounts may add entries, which should then be reviewed.
PrivilegeRights.SeSecurityPrivilege:
  rationale: |-
    Manage auditing and security log allows configuring object access auditing and viewing or clearing the Security event log. An attacker holding it could erase evidence or disable auditing. Only Administrators should hold it; on domain controllers with Exchange, the Exchange Servers group may also need it.
PrivilegeRights.SeRelabelPrivilege:
  rationale: |-
    Modify an object label allows changing the integrity level of objects owned by other users, which can defeat Mandatory Integrity Control protections. No account or group should hold this right.
PrivilegeRights.SeSystemEnvironmentPrivilege:
  rationale: |-
    This right allows modifying firmware environment variables, such as UEFI boot settings. Misuse can make the system unbootable or alter the boot process to load untrusted code. Only Administrators should hold it.
PrivilegeRights.SeManageVolumePrivilege:
  rationale: |-
    Perform volume maintenance tasks allows low-level operations on volumes, such as defragmentation, and can be used to read deleted data or bypass file permissions. Only Administrators should hold this right.
PrivilegeRights.SeProfileSingleProcessPrivilege:
  rationale: |-
    Profiling a single process exposes performance data of other processes, which can leak information useful for attacks. Only Administrators should hold this right.
PrivilegeRights.SeSystemProfilePrivilege:
  rationale: |-
    Profiling system performance gives access to detailed kernel performance data that may reveal information about system activity. Only Administrators and the WdiServiceHost service, which needs it for diagnostics, should hold this right.
PrivilegeRights.SeAssignPrimaryTokenPrivilege:
  rationale: |-
    Replace a process level token allows starting processes with a different access token, which can be abused to run code under another identity. Only the LOCAL SERVICE and NETWORK SERVICE identities, which the system needs for this purpose, should hold it.
PrivilegeRights.SeRestorePrivilege:
  rationale: |-
    The restore right allows writing any file and changing file ownership regardless of permissions, so it can be used to replace system binaries or security-relevant configuration. Only Administrators should hold this right.
PrivilegeRights.SeShutdownPrivilege:
  rationale: |-
    This right determines who can shut down the system when logged on locally. On servers, restricting it to Administrators prevents users from disrupting services. Workstations also allow Users, since shutting down one's own computer is a normal task.
PrivilegeRights.SeTakeOwnershipPrivilege:
  rationale: |-
    Take ownership allows an account to become the owner of any object, after which it can change the permissions and gain full access. Only Administrators should hold this right.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\NoConnectedUser:
  rationale: |-
    Allowing Microsoft accounts to be added or used for logon on managed systems lets users link personal cloud identities to company devices, outside central account management and auditing. A value of 3 prevents users from adding Microsoft accounts and from logging on with them.
SystemAccess.EnableGuestAccount:
  rationale: |-
    The built-in Guest account allows logon without individual credentials and makes activity impossible to attribute to a person. Keeping it disabled removes an anonymous access path to the system and its network shares.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\LimitBlankPasswordUse:
  rationale: |-
    Local accounts with a blank password are trivial to abuse if they can be used over the network. With this value set to 1, accounts with empty passwords can only log on at the physical console, not through network logons, Remote Desktop or other remote services.
SystemAccess.NewAdministratorName:
  rationale: |-
    The built-in Administrator account has a well-known name (and a well-known SID), making it the first target of password-guessing attacks. Renaming it means an attacker must first discover the account name, which stops simple automated attacks. The check passes when the account name is not Administrator.
SystemAccess.NewGuestName:
  rationale: |-
    The built-in Guest account has a well-known name that attackers try first. Renaming it removes an easily guessable target, in addition to keeping the account disabled. The check passes when the account name is not Guest.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\SCENoApplyLegacyAuditPolicy:
  rationale: |-
    Windows supports both the nine legacy audit categories and the more granular advanced audit subcategories. If both are configured, the legacy settings can override the subcategory settings and audit coverage becomes unpredictable. Setting this value to 1 forces the advanced subcategory settings to take precedence.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\CrashOnAuditFail:
  rationale: |-
    When enabled, Windows halts the system if it cannot write security audit events, for example because the Security log is full. An attacker could exploit this to cause a denial of service by flooding the log. Setting the value to 0 keeps the system running; log capacity and forwarding should be managed separately.
HKLM\SYSTEM\CurrentControlSet\Control\Print\Providers\Lanman Print Services\Servers\AddPrinterDrivers:
  rationale: |-
    Printer drivers run with high privileges in the print spooler, and malicious or vulnerable drivers have repeatedly been used for privilege escalation. Setting this value to 1 restricts the installation of printer drivers for shared printers to administrators.
HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\RequireSignOrSeal:
  rationale: |-
    The Netlogon secure channel between a domain member and a domain controller carries authentication traffic and machine account password changes. Requiring that all secure channel traffic is signed or encrypted protects it against tampering and man-in-the-middle attacks. A value of 1 refuses unprotected secure channels.
HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\SealSecureChannel:
  rationale: |-
    Encrypting (sealing) the Netlogon secure channel whenever possible protects the confidentiality of authentication data exchanged with domain controllers against eavesdropping. A value of 1 makes the domain member request encryption for secure channel traffic.
HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\SignSecureChannel:
  rationale: |-
    Signing the Netlogon secure channel whenever possible protects authentication data exchanged with domain controllers against modification in transit. A value of 1 makes the domain member request signing for secure channel traffic.
HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\DisablePasswordChange:
  rationale: |-
    Domain members regularly change their machine account password, which limits how long a stolen machine credential remains useful. Disabling these changes would leave the computer account password static indefinitely. The value 0 keeps automatic machine password changes enabled.
HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\MaximumPasswordAge:
  rationale: |-
    This value sets how often a domain member changes its machine account password. Shorter intervals reduce the time a captured machine credential can be used to impersonate the computer. The check expects 30 days.
HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\RequireStrongKey:
  rationale: |-
    Requiring a strong session key ensures that the Netlogon secure channel is protected with 128-bit keys rather than weak legacy keys. This protects domain authentication traffic against cryptographic attacks. All supported domain controllers support strong keys.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableCAD:
  rationale: |-
    Requiring Ctrl+Alt+Del before logon uses a key sequence that only Windows can intercept, so the user is guaranteed to enter credentials into the genuine logon screen and not into a program that imitates it. The value 0 means the key sequence is required.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DontDisplayLastUserName:
  rationale: |-
    If the logon screen shows the name of the last user, anyone with physical or remote console access learns a valid account name, which is half of what is needed to guess credentials. A value of 1 hides the last signed-in user name.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\InactivityTimeoutSecs:
  rationale: |-
    An unattended unlocked session gives anyone passing by access to the user's data and privileges. A machine inactivity limit locks the session automatically after the configured idle time, independently of per-user screen saver settings. The check expects 900 seconds (15 minutes).
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LegalNoticeText:
  rationale: |-
    A logon banner informs users before logon that the system is for authorised use only and that activity may be monitored. This supports legal action against misuse and makes clear that unauthorised access is not permitted. The check expects the text of a specific government banner; organisations should use the wording their legal department requires.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LegalNoticeCaption:
  rationale: |-
    The caption is the title of the logon banner shown before logon. Together with the banner text, it makes users acknowledge the terms of use before accessing the system. The check expects a specific government banner title; organisations should use the wording their legal department requires.
HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\CachedLogonsCount:
  rationale: |-
    Windows caches credentials of recent domain logons so that users can log on when no domain controller is reachable. These cached verifiers are stored on the local disk and can be extracted and attacked offline. Limiting the number of cached logons reduces the credentials exposed on a stolen or compromised device; the check expects a value of 1.
HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\PasswordExpiryWarning:
  rationale: |-
    Warning users some days before their password expires gives them time to choose a new strong password in advance, instead of being forced to pick one under time pressure or getting locked out. The check expects a warning period of 14 days.
HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\ScRemoveOption:
  rationale: |-
    When smart cards are used for logon, removing the card should end access to the session. A value of "1" locks the workstation when the smart card is removed, so users who walk away with their card do not leave an open session behind.
HKLM\SYSTEM\CurrentControlSet\Services\Lanmanworkstation\Parameters\RequireSecuritySignature:
  rationale: |-
    SMB signing protects file share traffic against tampering and relay attacks by adding a cryptographic signature to each packet. Requiring signing on the SMB client means it refuses to communicate with servers that do not sign. The value 1 enforces client-side signing.
HKLM\SYSTEM\CurrentControlSet\Services\Lanmanworkstation\Parameters\EnableSecuritySignature:
  rationale: |-
    With this value set to 1, the SMB client signs traffic whenever the server agrees to it. This protects file share traffic against modification and relay attacks with servers that support signing, even where signing is not strictly required.
HKLM\SYSTEM\CurrentControlSet\Services\Lanmanworkstation\Parameters\EnablePlainTextPassword:
  rationale: |-
    Some legacy SMB servers do not support password encryption and ask the client to send the password in plain text. Allowing this would expose credentials to anyone able to observe network traffic. The value 0 prevents the SMB client from sending unencrypted passwords.
HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\AutoDisconnect:
  rationale: |-
    Idle SMB sessions consume server resources and keep authenticated connections open longer than necessary. Disconnecting sessions after a period of inactivity frees resources and limits the use of stale sessions; clients reconnect transparently when needed. The check expects 15 minutes.
HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\RequireSecuritySignature:
  rationale: |-
    Requiring SMB signing on the server ensures that every SMB session is signed, protecting file share traffic against tampering and NTLM relay attacks. Clients that cannot sign will be refused. The value 1 enforces server-side signing.
HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\EnableSecuritySignature:
  rationale: |-
    With this value set to 1, the SMB server signs traffic whenever the client agrees to it. This protects file share traffic against modification and relay attacks with clients that support signing.
HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\EnableForcedLogoff:
  rationale: |-
    With this value set to 1, the SMB server disconnects client sessions when the user's logon hours expire. This enforces logon hour restrictions also for network sessions, so access to shares ends when the permitted time window ends.
HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\SMBServerNameHardeningLevel:
  rationale: |-
    SMB server name hardening validates the target name (SPN) supplied by the client during authentication. This helps prevent relay attacks in which a client's authentication is forwarded to a different server. A value of 1 accepts the connection if the client provides a valid target name.
SystemAccess.LSAAnonymousNameLookup:
  rationale: |-
    Anonymous SID/name translation lets unauthenticated users resolve security identifiers to account names, for example to find the real name of the built-in Administrator account even after it has been renamed. Disabling it prevents this kind of anonymous account enumeration.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RestrictAnonymousSAM:
  rationale: |-
    Anonymous users should not be able to list the local or domain accounts of a system, because a list of valid account names makes password guessing much easier. A value of 1 blocks anonymous enumeration of SAM accounts.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RestrictAnonymous:
  rationale: |-
    Anonymous enumeration of accounts and shares reveals valid user names and available resources to unauthenticated attackers. A value of 1 blocks anonymous enumeration of both SAM accounts and network shares.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\DisableDomainCreds:
  rationale: |-
    Credential Manager can store passwords for network resources, which may be extracted by malware or by anyone who gains access to the user session. A value of 1 prevents the storage of passwords and credentials for network authentication on the system.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\EveryoneIncludesAnonymous:
  rationale: |-
    If the Everyone group includes anonymous users, every resource permitted to Everyone becomes accessible without authentication. A value of 0 keeps anonymous connections out of the Everyone group, so they receive only the permissions explicitly granted to Anonymous Logon.
HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\NullSessionPipes:
  rationale: |-
    Named pipes listed here can be accessed over anonymous (null) sessions, which exposes the RPC interfaces behind them to unauthenticated users. On workstations and member servers the list should be empty. Domain controllers need LSARPC, NETLOGON and SAMR for compatibility with domain operations, and the check expects exactly these.
HKLM\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedExactPaths\Machine:
  rationale: |-
    The remote registry service normally restricts remote access to authorised users, but the paths listed here remain remotely readable regardless of the winreg key permissions. Limiting the list to the few paths Windows needs for product and version information prevents remote read access to other parts of the registry.
HKLM\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedPaths\Machine:
  rationale: |-
    Registry paths listed here, including their subkeys, remain remotely accessible even when access to the winreg key is restricted. Keeping the list to the default paths required by printing, event logging and similar functions prevents exposing additional registry areas to remote readers.
HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\RestrictNullSessAccess:
  rationale: |-
    With this value set to 1, anonymous (null session) access to named pipes and shares is denied unless they are explicitly listed as allowed. This blocks unauthenticated access to SMB resources and the information they could leak.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RestrictRemoteSAM:
  rationale: |-
    Remote calls to the Security Account Manager allow enumerating local users and groups, which attackers use for reconnaissance before lateral movement. The security descriptor O:BAG:BAD:(A;;RC;;;BA) allows such remote calls only for members of the local Administrators group.
HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\NullSessionShares:
  rationale: |-
    Shares listed here can be accessed anonymously over null sessions, without any authentication. Keeping the list empty ensures that no share is reachable by unauthenticated users.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\ForceGuest:
  rationale: |-
    In the Guest only sharing model, all network logons with local accounts are mapped to the Guest account, which removes individual accountability and access control. The value 0 selects the Classic model, in which local users authenticate as themselves.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\UseMachineId:
  rationale: |-
    When services running as Local System use NTLM, they can either authenticate with the computer's identity or fall back to an anonymous null session. A value of 1 makes them use the computer identity, which avoids null sessions and allows proper signing and access control.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Msv1_0\AllowNullSessionFallback:
  rationale: |-
    If NTLM falls back to a null session, the session keys used for signing and encryption provide no real protection. A value of 0 prevents Local System from falling back to null sessions.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Pku2U\AllowOnlineID:
  rationale: |-
    PKU2U allows peer-to-peer authentication using online identities such as Microsoft accounts, outside the organisation's domain authentication and auditing. A value of 0 prevents online identities from authenticating to this computer through PKU2U.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters\SupportedEncryptionTypes:
  rationale: |-
    Kerberos can use several encryption types, of which DES and RC4 are weak and allow offline cracking of tickets and keys, for example in Kerberoasting attacks. The value 2147483640 permits only AES128, AES256 and future encryption types. Systems or services that still depend on RC4 must be updated first.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\NoLMHash:
  rationale: |-
    The LAN Manager hash is a very weak password hash that can be cracked in a short time once the account database is obtained. A value of 1 prevents Windows from storing LM hashes when passwords are changed. Existing LM hashes disappear only after the next password change.
SystemAccess.ForceLogoffWhenHourExpire:
  rationale: |-
    When logon hours are restricted for accounts, existing network sessions should end once the permitted time is over. Enabling this setting disconnects SMB sessions when logon hours expire, so restrictions are actually enforced and not only at the time of logon.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\LMCompatibilityLevel:
  rationale: |-
    LM and NTLMv1 authentication responses are easy to crack or relay. The value 5 makes the system send only NTLMv2 responses and refuse LM and NTLM; on domain controllers it also rejects LM and NTLMv1 authentication. Very old clients or devices that cannot use NTLMv2 will no longer be able to authenticate.
HKLM\SYSTEM\CurrentControlSet\Services\Ldap\LDAPClientIntegrity:
  rationale: |-
    Unsigned LDAP traffic can be modified in transit or relayed, allowing an attacker to manipulate directory queries and responses. The value 1 makes the LDAP client negotiate signing with servers that support it.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Msv1_0\NTLMMinClientSec:
  rationale: |-
    This value sets the minimum session security for NTLM connections made by the system as a client. The value 537395200 requires NTLMv2 session security and 128-bit encryption, protecting NTLM-based sessions against downgrade and decryption.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Msv1_0\NTLMMinServerSec:
  rationale: |-
    This value sets the minimum session security for NTLM connections the system accepts as a server. The value 537395200 requires NTLMv2 session security and 128-bit encryption from clients, protecting NTLM-based sessions against downgrade and decryption.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Msv1_0\AuditReceivingNTLMTraffic:
  rationale: |-
    Auditing incoming NTLM traffic records which clients and accounts still use NTLM to authenticate to this system. This visibility is needed to plan the reduction of NTLM, a protocol that is vulnerable to relay and pass-the-hash attacks. The value 2 enables auditing for all accounts.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Msv1_0\RestrictSendingNTLMTraffic:
  rationale: |-
    Outgoing NTLM authentication can be captured or relayed by a malicious server. The value 1 audits all outgoing NTLM traffic to remote servers without blocking it, providing the information needed to restrict NTLM later without breaking applications.
HKLM\SOFTWARE\Policies\Microsoft\Cryptography\ForceKeyProtection:
  rationale: |-
    Private keys stored on the computer, such as those for user certificates, can be used silently by any process running in the user's context. The value 1 makes Windows prompt the user when a protected key is first used, so misuse of the key by malware becomes noticeable.
HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Kernel\ObCaseInsensitive:
  rationale: |-
    Windows treats object names case-insensitively, but subsystems could otherwise create objects whose names differ only in case. This could be used to confuse or spoof objects used by other processes. The value 1 enforces case insensitivity for all subsystems.
HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\ProtectionMode:
  rationale: |-
    Shared kernel objects such as DOS device names have default permissions. The value 1 strengthens these defaults so that non-administrative users can read but not modify shared objects created by other users, preventing tampering with system-wide objects.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\FilterAdministratorToken:
  rationale: |-
    By default the built-in Administrator account runs every program with full administrative rights, without User Account Control prompts. The value 1 enables Admin Approval Mode for this account, so it also runs with a filtered token and must confirm elevation, which limits silent abuse by malware.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ConsentPromptBehaviorAdmin:
  rationale: |-
    This value controls how administrators are asked to confirm elevation. The value 2 prompts for consent on the secure desktop for every elevation, so a program cannot obtain administrative rights silently and the prompt cannot be manipulated by other user processes.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ConsentPromptBehaviorUser:
  rationale: |-
    Standard users who are prompted for administrator credentials may be tricked into entering them into a fake prompt, or may share them. The value 0 automatically denies elevation requests for standard users; administrators must perform elevated tasks from their own session.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableInstallerDetection:
  rationale: |-
    Installer detection makes Windows recognise installation programs heuristically and ask for elevation for them. With the value 1, setup programs that need administrative rights trigger a UAC prompt instead of failing or running unexpectedly.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableSecureUIAPaths:
  rationale: |-
    Accessibility (UIAccess) applications can interact with elevated windows and the secure desktop. With the value 1, only UIAccess applications installed in secure locations such as Program Files or System32 are allowed elevated access, which prevents malware from abusing this mechanism from user-writable folders.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA:
  rationale: |-
    This value turns User Account Control as a whole on or off. With UAC disabled, administrators run all programs with full rights and many protections that depend on it, including protected mode in browsers, are lost. The value 1 keeps UAC enabled; changing it requires a reboot.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\PromptOnSecureDesktop:
  rationale: |-
    Showing elevation prompts on the secure desktop isolates them from other programs running in the user session. With the value 1, malware cannot read, spoof or click the UAC prompt on the user's behalf.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableVirtualization:
  rationale: |-
    Legacy applications that try to write to protected system locations would fail under UAC. With the value 1, such writes are redirected to per-user locations, which keeps those applications working without granting them administrative rights.
Service.BTAGService:
  rationale: |-
    The Bluetooth Audio Gateway service supports hands-free and headset profiles over Bluetooth. Bluetooth is a wireless attack surface that has seen numerous remotely exploitable vulnerabilities, and it can be used to pair unmanaged devices. On systems that do not need Bluetooth audio, the service should be disabled or not installed.
Service.bthserv:
  rationale: |-
    The Bluetooth Support Service enables discovery and pairing of Bluetooth devices. Bluetooth exposes a wireless attack surface and allows unmanaged devices to connect, which can be used for data exfiltration or exploitation. Disabling the service turns off Bluetooth functionality, so it suits only systems that do not use Bluetooth peripherals.
Service.Browser:
  rationale: |-
    The Computer Browser service maintains a list of computers on the network and depends on the obsolete SMBv1 protocol. It broadcasts information about the network and has no purpose in modern environments. It should be disabled or not installed.
Service.MapsBroker:
  rationale: |-
    The Downloaded Maps Manager lets applications access downloaded offline maps and contacts Microsoft services to update them. On managed business systems this function is rarely needed and creates unnecessary network traffic and attack surface, so the service should be disabled or not installed.
Service.lfsvc:
  rationale: |-
    The Geolocation Service determines the physical location of the device and provides it to applications. Location data is privacy sensitive and can reveal where users and devices are. Where location services are not required, the service should be disabled or not installed.
Service.iisadmin:
  rationale: |-
    The IIS Admin Service belongs to the legacy IIS 6 management compatibility components. A web server management service on a workstation is an unnecessary network-facing component with a history of vulnerabilities. It should be disabled or not installed unless the system deliberately hosts IIS.
Service.irmon:
  rationale: |-
    The Infrared monitor service detects and connects to devices over infrared. Infrared file transfer can be used to bring in or carry out data without network controls. Few modern systems need it, so it should be disabled or not installed.
Service.lltdsvc:
  rationale: |-
    The Link-Layer Topology Discovery Mapper discovers devices on the local network and builds a network map. This reveals information about the network to anyone on it and adds a protocol that is not needed on managed systems. It should be disabled or not installed.
Service.LxssManager:
  rationale: |-
    The LxssManager service supports the Windows Subsystem for Linux, which can run Linux binaries outside the reach of some Windows security tools and monitoring. On systems where WSL is not required for development work, the service should be disabled or the feature not installed.
Service.FTPSVC:
  rationale: |-
    The Microsoft FTP Service turns the system into an FTP server. FTP usually transmits credentials and data unencrypted and exposes the file system to the network. Workstations should not run an FTP server, so the service should be disabled or not installed.
Service.MSiSCSI:
  rationale: |-
    The Microsoft iSCSI Initiator Service connects the system to remote iSCSI storage. iSCSI connections are often unauthenticated or weakly authenticated and expose block storage over the network. Systems that do not use iSCSI storage should have the service disabled or not installed.
Service.sshd:
  rationale: |-
    The OpenSSH SSH Server allows remote command-line access to the system. An SSH server on a workstation is an additional remote access path that is often not monitored or managed like other administrative interfaces. Unless remote SSH access is a deliberate requirement, the service should be disabled or not installed.
Service.PNRPsvc:
  rationale: |-
    The Peer Name Resolution Protocol service provides serverless name resolution for peer-to-peer applications. Peer-to-peer networking bypasses central name services and can be used to communicate with other hosts outside managed channels. It should be disabled or not installed.
Service.p2psvc:
  rationale: |-
    The Peer Networking Grouping service supports multi-party peer-to-peer communication. Peer-to-peer groups enable direct communication between hosts outside centrally controlled channels and add network attack surface. The service should be disabled or not installed.
Service.p2pimsvc:
  rationale: |-
    The Peer Networking Identity Manager provides identity services for peer-to-peer networking. Without a need for peer-to-peer applications it only adds attack surface, so the service should be disabled or not installed.
Service.PNRPAutoReg:
  rationale: |-
    The PNRP Machine Name Publication Service publishes the computer's name via the Peer Name Resolution Protocol. This announces the system to peer-to-peer networks and is not needed on managed systems, so the service should be disabled or not installed.
Service.Spooler:
  rationale: |-
    The Print Spooler runs with SYSTEM privileges and has been the source of several critical vulnerabilities, such as PrintNightmare, which allowed remote code execution and privilege escalation. Systems that do not need to print or share printers, in particular domain controllers and many servers, should have the service disabled. Disabling it prevents all local and remote printing from the system.
Service.wercplsupport:
  rationale: |-
    The Problem Reports and Solutions Control Panel Support service manages viewing, sending and deleting system-level problem reports. Error reports can contain sensitive memory content and are sent to external services. Where error reporting is not used, the service should be disabled or not installed.
Service.RasAuto:
  rationale: |-
    The Remote Access Auto Connection Manager automatically dials or establishes remote connections when a program references a remote resource. Automatic connections can create unexpected network paths outside the control of the corporate network. The service should be disabled or not installed.
Service.SessionEnv:
  rationale: |-
    The Remote Desktop Configuration service handles configuration and session maintenance for Remote Desktop. If systems are not meant to accept Remote Desktop connections, this supporting service is unnecessary and should be disabled or not installed.
Service.TermService:
  rationale: |-
    Remote Desktop Services allows users to connect interactively to the system over the network. RDP is a frequent target for brute-force attacks and has had critical remotely exploitable vulnerabilities. Workstations that do not need to accept remote desktop connections should have the service disabled.
Service.UmRdpService:
  rationale: |-
    The Remote Desktop Services UserMode Port Redirector redirects printers, drives and ports into RDP sessions. Device redirection can be used to move data into or out of a system. Where Remote Desktop is not used, the service should be disabled or not installed.
Service.RpcLocator:
  rationale: |-
    The RPC Locator service is a legacy name service for RPC applications that is no longer needed by current Windows versions. It only adds network attack surface and should be disabled or not installed.
Service.RemoteRegistry:
  rationale: |-
    The Remote Registry service allows remote users to read and modify the registry of the system. Attackers use it for reconnaissance and to change configuration remotely. Unless a management tool depends on it, the service should be disabled.
Service.RemoteAccess:
  rationale: |-
    Routing and Remote Access turns the system into a router or VPN/dial-up server. A workstation acting as a router can bridge networks and bypass network security controls. The service should be disabled or not installed.
Service.LanmanServer:
  rationale: |-
    The Server service provides file and printer sharing over SMB. Workstations that do not need to share resources should not expose SMB, a protocol frequently used for lateral movement and worm propagation. Disabling it stops all inbound file and printer sharing as well as remote administration that relies on administrative shares.
Service.simptcp:
  rationale: |-
    Simple TCP/IP Services provide legacy protocols such as Echo, Discard, Character Generator, Daytime and Quote of the Day. They have no practical use and can be abused for denial-of-service amplification. They should be disabled or not installed.
Service.SNMP:
  rationale: |-
    The SNMP service allows remote monitoring and, depending on configuration, modification of the system. Older SNMP versions use community strings sent in clear text that are often left at default values. Unless SNMP monitoring is required, the service should be disabled or not installed.
Service.sacsvr:
  rationale: |-
    The Special Administration Console Helper provides remote management through the Emergency Management Services console. On systems that do not use EMS, it is an unnecessary management interface and should be disabled or not installed.
Service.SSDPSRV:
  rationale: |-
    The SSDP Discovery service discovers UPnP devices on the network. UPnP discovery exposes the system to local network protocols that have a history of vulnerabilities and are not needed on managed systems. The service should be disabled or not installed.
Service.upnphost:
  rationale: |-
    The UPnP Device Host allows the system to act as a UPnP device and be discovered and controlled by other hosts. This adds network attack surface without benefit on managed systems, so the service should be disabled or not installed.
Service.WMSvc:
  rationale: |-
    The Web Management Service enables remote management of IIS. A remote web server management interface should not run on workstations, as it adds an unnecessary network-facing component. It should be disabled or not installed.
Service.WerSvc:
  rationale: |-
    The Windows Error Reporting Service collects crash and hang data and can send it to Microsoft. Error reports may include memory contents with sensitive data. Where error reporting is not needed or is handled centrally, the service should be disabled.
Service.Wecsvc:
  rationale: |-
    The Windows Event Collector service receives forwarded events from other systems. A workstation should not act as an event collector, and the service adds network-facing functionality. It should be disabled unless the system is a designated collector.
Service.WMPNetworkSvc:
  rationale: |-
    The Windows Media Player Network Sharing Service shares media libraries with other devices on the network using UPnP. Media sharing exposes data and adds network attack surface on business systems, so the service should be disabled or not installed.
Service.icssvc:
  rationale: |-
    The Windows Mobile Hotspot Service lets the device share its network connection with other devices. A hotspot can bridge the corporate network to unmanaged devices and bypass network controls. The service should be disabled or not installed.
Service.WpnService:
  rationale: |-
    The Windows Push Notifications System Service connects to Microsoft's notification service to deliver tile and toast notifications. This creates an outbound connection to an external cloud service that may carry information about the device. Disabling it stops push notifications for applications.
Service.PushToInstall:
  rationale: |-
    The Windows PushToInstall service allows remote installation of Microsoft Store applications triggered from the cloud. Software installation on managed systems should go through controlled channels, so the service should be disabled or not installed.
Service.WinRM:
  rationale: |-
    Windows Remote Management provides the WS-Management interface used by PowerShell remoting and many management tools. It is a powerful remote execution channel that attackers use for lateral movement. Workstations that are not managed via WinRM should have the service disabled; check management tooling before doing so.
Service.W3SVC:
  rationale: |-
    The World Wide Web Publishing Service is the IIS web server. Running a web server on a workstation exposes an unnecessary network service that could be exploited or leak data. It should be disabled or not installed.
Service.XboxGipSvc:
  rationale: |-
    The Xbox Accessory Management Service manages Xbox accessories. Gaming components are not needed on business systems and only add attack surface, so the service should be disabled or not installed.
Service.XblAuthManager:
  rationale: |-
    The Xbox Live Auth Manager provides authentication for Xbox Live. Consumer gaming services are not needed on business systems and connect to external cloud services, so the service should be disabled or not installed.
Service.XblGameSave:
  rationale: |-
    The Xbox Live Game Save service synchronises game save data with Xbox Live. It connects to external cloud services and has no business purpose, so it should be disabled or not installed.
Service.XboxNetApiSvc:
  rationale: |-
    The Xbox Live Networking Service supports Xbox Live network features. It is not needed on business systems and adds network attack surface, so it should be disabled or not installed.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\EnableFirewall:
  rationale: |-
    A host-based firewall limits which network services of the system can be reached and contains the spread of malware between hosts. This check covers the domain profile, which applies when the computer is connected to its corporate domain network. The value 1 set by policy turns the firewall on for this profile.
Firewall.Domain.Enabled:
  rationale: |-
    A host-based firewall limits which network services of the system can be reached and contains the spread of malware between hosts. This check covers the domain profile, which applies when the computer is connected to its corporate domain network. It verifies that the firewall is actually active for this profile, regardless of whether the setting comes from policy or local configuration.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\DefaultInboundAction:
  rationale: |-
    Blocking unsolicited inbound connections by default means that only explicitly allowed services are reachable from the network, so a newly installed or vulnerable service is not exposed by accident. This check covers the domain profile, which applies when the computer is connected to its corporate domain network. The value 1 sets the default inbound action to block via policy.
Firewall.Domain.DefaultInboundAction:
  rationale: |-
    Blocking unsolicited inbound connections by default means that only explicitly allowed services are reachable from the network, so a newly installed or vulnerable service is not exposed by accident. This check covers the domain profile, which applies when the computer is connected to its corporate domain network. It verifies that the effective default inbound action of the profile is Block.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\DisableNotifications:
  rationale: |-
    When a program is blocked, Windows can ask the user whether to allow it. Users often accept such prompts without understanding them, effectively opening the firewall. The value 1 suppresses these notifications for the domain profile, which applies when the computer is connected to its corporate domain network, so firewall exceptions are managed centrally.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\Logging\LogFilePath:
  rationale: |-
    Firewall logs are an important source for investigating attacks and troubleshooting connectivity. A dedicated log file per profile, here domainfw.log under %SystemRoot%\System32\logfiles\firewall, keeps the records of the domain profile separate and in a known location for collection.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\Logging\LogFileSize:
  rationale: |-
    The default firewall log size is small, so older entries are overwritten quickly and evidence may be lost before it is reviewed. Setting the maximum size to 16384 KB for the domain profile keeps a longer history of firewall events.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\Logging\LogDroppedPackets:
  rationale: |-
    Logging dropped packets records blocked connection attempts, which reveals scanning, attack attempts and misconfigured applications. The value 1 enables this logging for the domain profile.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\Logging\LogSuccessfulConnections:
  rationale: |-
    Logging successful connections provides a record of which connections were allowed, which is needed to reconstruct communication during incident investigation. The value 1 enables this logging for the domain profile.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\EnableFirewall:
  rationale: |-
    A host-based firewall limits which network services of the system can be reached and contains the spread of malware between hosts. This check covers the private profile, which applies on networks the user has marked as trusted, such as a home network. The value 1 set by policy turns the firewall on for this profile.
Firewall.Private.Enabled:
  rationale: |-
    A host-based firewall limits which network services of the system can be reached and contains the spread of malware between hosts. This check covers the private profile, which applies on networks the user has marked as trusted, such as a home network. It verifies that the firewall is actually active for this profile, regardless of whether the setting comes from policy or local configuration.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\DefaultInboundAction:
  rationale: |-
    Blocking unsolicited inbound connections by default means that only explicitly allowed services are reachable from the network, so a newly installed or vulnerable service is not exposed by accident. This check covers the private profile, which applies on networks the user has marked as trusted, such as a home network. The value 1 sets the default inbound action to block via policy.
Firewall.Private.DefaultInboundAction:
  rationale: |-
    Blocking unsolicited inbound connections by default means that only explicitly allowed services are reachable from the network, so a newly installed or vulnerable service is not exposed by accident. This check covers the private profile, which applies on networks the user has marked as trusted, such as a home network. It verifies that the effective default inbound action of the profile is Block.
