  rationale: |-
    When a program is blocked, Windows can ask the user whether to allow it. Users often accept such prompts without understanding them, effectively opening the firewall. The value 1 suppresses these notifications for the private profile, which applies on networks the user has marked as trusted, such as a home network, so firewall exceptions are managed centrally.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\Logging\LogFilePath:
  rationale: |-
    Firewall logs are an important source for investigating attacks and troubleshooting connectivity. A dedicated log file per profile, here privatefw.log under %SystemRoot%\System32\logfiles\firewall, keeps the records of the private profile separate and in a known location for collection.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\Logging\LogFileSize:
  rationale: |-
    The default firewall log size is small, so older entries are overwritten quickly and evidence may be lost before it is reviewed. Setting the maximum size to 16384 KB for the private profile keeps a longer history of firewall events.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\Logging\LogDroppedPackets:
  rationale: |-
    Logging dropped packets records blocked connection attempts, which reveals scanning, attack attempts and misconfigured applications. The value 1 enables this logging for the private profile.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\Logging\LogSuccessfulConnections:
  rationale: |-
    Logging successful connections provides a record of which connections were allowed, which is needed to reconstruct communication during incident investigation. The value 1 enables this logging for the private profile.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\EnableFirewall:
  rationale: |-
    A host-based firewall limits which network services of the system can be reached and contains the spread of malware between hosts. This check covers the public profile, which applies on untrusted networks such as hotels, airports or cafes. The value 1 set by policy turns the firewall on for this profile.
Firewall.Public.Enabled:
  rationale: |-
    A host-based firewall limits which network services of the system can be reached and contains the spread of malware between hosts. This check covers the public profile, which applies on untrusted networks such as hotels, airports or cafes. It verifies that the firewall is actually active for this profile, regardless of whether the setting comes from policy or local configuration.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\DefaultInboundAction:
  rationale: |-
    Blocking unsolicited inbound connections by default means that only explicitly allowed services are reachable from the network, so a newly installed or vulnerable service is not exposed by accident. This check covers the public profile, which applies on untrusted networks such as hotels, airports or cafes. The value 1 sets the default inbound action to block via policy.
Firewall.Public.DefaultInboundAction:
  rationale: |-
    Blocking unsolicited inbound connections by default means that only explicitly allowed services are reachable from the network, so a newly installed or vulnerable service is not exposed by accident. This check covers the public profile, which applies on untrusted networks such as hotels, airports or cafes. It verifies that the effective default inbound action of the profile is Block.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\DisableNotifications:
  rationale: |-
    When a program is blocked, Windows can ask the user whether to allow it. Users often accept such prompts without understanding them, effectively opening the firewall. The value 1 suppresses these notifications for the public profile, which applies on untrusted networks such as hotels, airports or cafes, so firewall exceptions are managed centrally.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\AllowLocalPolicyMerge:
  rationale: |-
    On untrusted public networks, firewall rules created locally by users or applications could open ports that the central policy does not intend. The value 0 makes the public profile ignore local firewall rules and apply only rules distributed by Group Policy. Applications that add their own rules may need them deployed centrally instead.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\AllowLocalIPsecPolicyMerge:
  rationale: |-
    On untrusted public networks, locally defined connection security (IPsec) rules could weaken or bypass the centrally intended configuration. The value 0 makes the public profile apply only connection security rules distributed by Group Policy.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\Logging\LogFilePath:
  rationale: |-
    Firewall logs are an important source for investigating attacks and troubleshooting connectivity. A dedicated log file per profile, here publicfw.log under %SystemRoot%\System32\logfiles\firewall, keeps the records of the public profile separate and in a known location for collection.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\Logging\LogFileSize:
  rationale: |-
    The default firewall log size is small, so older entries are overwritten quickly and evidence may be lost before it is reviewed. Setting the maximum size to 16384 KB for the public profile keeps a longer history of firewall events.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\Logging\LogDroppedPackets:
  rationale: |-
    Logging dropped packets records blocked connection attempts, which reveals scanning, attack attempts and misconfigured applications. The value 1 enables this logging for the public profile.
HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\Logging\LogSuccessfulConnections:
  rationale: |-
    Logging successful connections provides a record of which connections were allowed, which is needed to reconstruct communication during incident investigation. The value 1 enables this logging for the public profile.
AuditPolicy.Credential Validation:
  rationale: |-
    Credential validation events record the outcome of authentication attempts against account credentials, for example NTLM validation of local or domain accounts. Failures reveal password guessing and spraying; successes help trace the use of compromised accounts. The check requires auditing of both success and failure.
AuditPolicy.Application Group Management:
  rationale: |-
    Application group management events record the creation, change and deletion of application groups, as used by Authorization Manager. Such changes affect who can access applications and should be traceable. The check requires auditing of both success and failure.
AuditPolicy.Security Group Management:
  rationale: |-
    Security group management events record the creation and deletion of groups and changes to their membership. Adding an account to a privileged group is a typical step in privilege escalation and persistence, so these changes must be traceable. The check requires success auditing; failure auditing may be enabled as well.
AuditPolicy.User Account Management:
  rationale: |-
    User account management events record the creation, change, enabling, disabling and deletion of accounts and password resets. These events reveal attackers creating backdoor accounts or taking over existing ones. The check requires auditing of both success and failure.
AuditPolicy.Plug and Play Events:
  rationale: |-
    Plug and Play events record when external devices such as USB storage are connected. This helps detect the use of unauthorised devices for data exfiltration or malware introduction. The check requires success auditing; failure auditing may be enabled as well.
AuditPolicy.Process Creation:
  rationale: |-
    Process creation events record every new process with its creator, which is essential for detecting malware execution and reconstructing attacker activity on a host. The check requires success auditing; failure auditing may be enabled as well.
AuditPolicy.Account Lockout:
  rationale: |-
    Account lockout events record logon failures caused by locked accounts. They point to password guessing attacks or to clients repeatedly using outdated credentials. The check requires failure auditing; success auditing may be enabled as well.
AuditPolicy.Group Membership:
  rationale: |-
    Group membership events record the groups an account belongs to at logon time. This helps determine with which privileges a session ran when investigating an incident. The check requires success auditing; failure auditing may be enabled as well.
AuditPolicy.Logoff:
  rationale: |-
    Logoff events record when sessions end. Together with logon events they show how long accounts were active, which is needed to reconstruct user and attacker activity. The check requires success auditing; failure auditing may be enabled as well.
AuditPolicy.Logon:
  rationale: |-
    Logon events record successful and failed logons, including the logon type and source. They are the primary source for detecting password attacks, lateral movement and the misuse of accounts. The check requires auditing of both success and failure.
AuditPolicy.Other Logon/Logoff Events:
  rationale: |-
    This subcategory covers events such as session reconnects and disconnects of Remote Desktop, workstation lock and unlock, and screen saver events. They complete the picture of user session activity during investigations. The check requires auditing of both success and failure.
AuditPolicy.Special Logon:
  rationale: |-
    Special logon events record logons with administrator-equivalent privileges. They highlight the use of powerful accounts, which is important both for accountability and for detecting abuse. The check requires success auditing; failure auditing may be enabled as well.
AuditPolicy.Detailed File Share:
  rationale: |-
    Detailed file share events record each access to files and folders on network shares. Failed access attempts can reveal reconnaissance or attempts to reach data without permission. The check requires failure auditing; success auditing may be enabled as well.
AuditPolicy.File Share:
  rationale: |-
    File share events record access to network shares themselves. They show which hosts and accounts connect to shares, which helps detect lateral movement and data collection. The check requires auditing of both success and failure.
AuditPolicy.Other Object Access Events:
  rationale: |-
    This subcategory covers events for scheduled task changes and COM+ catalog objects, among others. Scheduled tasks are a common persistence mechanism, so their creation and modification should be recorded. The check requires auditing of both success and failure.
AuditPolicy.Removable Storage:
  rationale: |-
    Removable storage events record access to files and folders on removable media. This allows tracing data copied to or from USB drives and similar devices. The check requires auditing of both success and failure.
AuditPolicy.Audit Policy Change:
  rationale: |-
    Audit policy change events record modifications of the audit configuration itself. Attackers often weaken auditing to cover their tracks, so such changes must be logged. The check requires success auditing; failure auditing may be enabled as well.
AuditPolicy.Authentication Policy Change:
  rationale: |-
    Authentication policy change events record changes to domain trust relationships, Kerberos policy and the granting of logon rights. Such changes can weaken authentication and need to be traceable. The check requires success auditing; failure auditing may be enabled as well.
AuditPolicy.Authorization Policy Change:
  rationale: |-
    Authorization policy change events record the assignment and removal of user rights and similar changes to authorization policy. Granting powerful privileges is a typical escalation step and should be recorded. The check requires success auditing; failure auditing may be enabled as well.
AuditPolicy.MPSSVC Rule-Level Policy Change:
  rationale: |-
    This subcategory records changes to Windows Firewall rules and settings. Attackers may add firewall rules to open remote access or disable protections, so these changes should be logged. The check requires auditing of both success and failure.
AuditPolicy.Other Policy Change Events:
  rationale: |-
    This subcategory covers events such as changes to encryption, trusted platform module and other policy settings not covered elsewhere. Failures in particular may indicate tampering attempts with security configuration. The check requires failure auditing; success auditing may be enabled as well.
AuditPolicy.Sensitive Privilege Use:
  rationale: |-
    Sensitive privilege use events record the use of powerful privileges such as acting as part of the operating system, debugging programs or taking ownership. They reveal attempts to bypass access controls. The check requires auditing of both success and failure.
AuditPolicy.IPsec Driver:
  rationale: |-
    IPsec driver events record problems in the IPsec driver, such as dropped packets due to integrity check failures. They can indicate network attacks or misconfiguration of connection security. The check requires auditing of both success and failure.
AuditPolicy.Other System Events:
  rationale: |-
    This subcategory covers events such as startup and shutdown of the Windows Firewall service and cryptographic key operations. Failures can reveal attempts to disable protections or tamper with keys. The check requires auditing of both success and failure.
AuditPolicy.Security State Change:
  rationale: |-
    Security state change events record system startup and shutdown and changes of the system time. These are needed to understand gaps in logging and to detect time manipulation. The check requires success auditing; failure auditing may be enabled as well.
AuditPolicy.Security System Extension:
  rationale: |-
    Security system extension events record the loading of authentication packages and the installation of services. Malicious authentication providers and services are common persistence techniques. The check requires success auditing; failure auditing may be enabled as well.
AuditPolicy.System Integrity:
  rationale: |-
    System integrity events record problems with the integrity of the security subsystem, such as failed code integrity checks, dropped audit events or a full audit log. These may indicate tampering or loss of audit data. The check requires auditing of both success and failure.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization\NoLockScreenCamera:
  rationale: |-
    Allowing the camera to be activated from the lock screen gives anyone with physical access the ability to use a device function without signing in. The value 1 prevents the camera from being invoked on the lock screen.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization\NoLockScreenSlideshow:
  rationale: |-
    A lock screen slide show displays pictures from the user's folders while the device is locked, which can expose personal or confidential images to anyone nearby. The value 1 disables the lock screen slide show.
HKLM\SOFTWARE\Policies\Microsoft\InputPersonalization\AllowInputPersonalization:
  rationale: |-
    Online speech recognition and input personalization send voice, inking and typing data to cloud services to improve recognition. This can transfer sensitive content outside the organisation. The value 0 disables these online services.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\AllowOnlineTips:
  rationale: |-
    The Settings app can retrieve tips and help content from Microsoft online services. Disabling this with the value 0 avoids unnecessary connections to external services and the information they may disclose about the device.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LocalAccountTokenFilterPolicy:
  rationale: |-
    By default, local administrator accounts that connect over the network receive a filtered token without administrative rights. Setting LocalAccountTokenFilterPolicy to 1 would give them full rights remotely, which enables pass-the-hash attacks with shared local administrator credentials. The value 0 keeps UAC remote restrictions in place.
HKLM\SYSTEM\CurrentControlSet\Control\Print\RpcAuthnLevelPrivacyEnabled:
  rationale: |-
    The print spooler accepts RPC connections from clients. With the value 1, the spooler requires RPC packet privacy (encryption) for incoming connections, which mitigates attacks that relied on lower RPC authentication levels against the print service.
HKLM\SYSTEM\CurrentControlSet\Services\mrxsmb10\Start:
  rationale: |-
    SMBv1 is an obsolete protocol version with serious security weaknesses that were exploited by worms such as WannaCry. Setting the Start value of the SMBv1 client driver to 4 disables it, so the system no longer connects to servers using SMBv1. Very old devices that only speak SMBv1 will no longer be reachable.
HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\SMB1:
  rationale: |-
    SMBv1 is an obsolete protocol version without modern protections and with a history of critical remotely exploitable vulnerabilities. The value 0 disables SMBv1 on the server side, so clients can only connect with SMB 2 or later.
HKLM\SOFTWARE\Microsoft\Cryptography\Wintrust\Config\EnableCertPaddingCheck:
  rationale: |-
    Windows Authenticode verification historically ignored extra data appended to signed files, which allowed attackers to modify signed executables without invalidating the signature. The value 1 enables strict padding checks so such tampered files fail signature verification.
HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel\DisableExceptionChainValidation:
  rationale: |-
    Structured Exception Handling Overwrite Protection (SEHOP) blocks a common exploitation technique that overwrites exception handler records on the stack. The value 0 keeps SEHOP enabled for all processes.
HKLM\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\NodeType:
  rationale: |-
    NetBIOS name resolution by broadcast allows any host on the local network to answer name queries and redirect traffic, a technique used to capture credentials. The value 2 sets the P-node type, which resolves NetBIOS names only through a WINS server and never by broadcast.
HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\Wdigest\UseLogonCredential:
  rationale: |-
    When WDigest authentication is enabled, Windows keeps the user's password in memory in a reversible form, where credential dumping tools can read it in clear text. The value 0 prevents WDigest from storing these credentials.
HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\AutoAdminLogon:
  rationale: |-
    Automatic logon stores the password of an account in the registry and signs in without user interaction, so anyone with physical access gets an open session and the stored password can be read. The value "0" disables automatic logon.
HKLM\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters\DisableIPSourceRouting:
  rationale: |-
    Source routing lets the sender of an IPv6 packet specify the route it takes, which can be used to bypass network controls or spoof traffic. The value 2 makes the system drop all source-routed IPv6 packets.
HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\DisableIPSourceRouting:
  rationale: |-
    Source routing lets the sender of an IPv4 packet specify the route it takes, which can be used to bypass network controls or spoof traffic. The value 2 makes the system drop all source-routed IPv4 packets.
HKLM\SYSTEM\CurrentControlSet\Services\RasMan\Parameters\DisableSavePassword:
  rationale: |-
    Saved dial-up and VPN passwords can be extracted by anyone who gains access to the user's session or profile. The value 1 prevents Windows from saving these passwords, so they have to be entered for each connection.
HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\EnableICMPRedirect:
  rationale: |-
    ICMP redirect messages can change the host's routing table, allowing an attacker on the local network to divert traffic through a system under their control. The value 0 makes the system ignore ICMP redirects.
HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\KeepAliveTime:
  rationale: |-
    TCP keep-alive packets detect dead connections so that their resources can be released. A shorter interval than the default two hours limits how long stale or half-open connections hold resources. The check expects 300000 milliseconds (5 minutes).
HKLM\SYSTEM\CurrentControlSet\Services\Netbt\Parameters\NoNameReleaseOnDemand:
  rationale: |-
    An attacker can send NetBIOS name release requests to make a system give up its name, disrupting name resolution and allowing the attacker to claim the name. The value 1 makes the system ignore such requests unless they come from a WINS server.
HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\PerformRouterDiscovery:
  rationale: |-
    The ICMP Router Discovery Protocol lets hosts configure default gateways from router advertisements, which an attacker on the local network could forge to redirect traffic. The value 0 disables IRDP.
HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\SafeDllSearchMode:
  rationale: |-
    When a program loads a DLL without a full path, Windows searches several directories. Safe DLL search mode searches the system directories before the current directory, which makes it harder to plant a malicious DLL that gets loaded instead of the legitimate one. The value 1 enables it.
HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\ScreenSaverGracePeriod:
  rationale: |-
    After the screen saver starts, there is a grace period during which the session can be resumed without a password. A long grace period lets someone resume an unattended session. The check expects 5 seconds.
HKLM\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters\TcpMaxDataRetransmissions:
  rationale: |-
    This value limits how often TCP retransmits unacknowledged data over IPv6 before aborting the connection. A low limit frees resources held by dead or deliberately stalled connections sooner, which reduces the impact of resource-exhaustion attacks. The check expects 3 retransmissions.
HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\TcpMaxDataRetransmissions:
  rationale: |-
    This value limits how often TCP retransmits unacknowledged data over IPv4 before aborting the connection. A low limit frees resources held by dead or deliberately stalled connections sooner, which reduces the impact of resource-exhaustion attacks. The check expects 3 retransmissions.
HKLM\SYSTEM\CurrentControlSet\Services\Eventlog\Security\WarningLevel:
  rationale: |-
    If the Security event log fills up, new events may be lost or old ones overwritten. With a warning threshold, Windows writes an event when the log reaches the configured percentage of its maximum size, giving administrators time to react. The check expects 90 percent.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient\DoHPolicy:
  rationale: |-
    Classic DNS queries are sent unencrypted and can be observed or manipulated on the network. DNS over HTTPS encrypts name resolution with servers that support it. The value 2 allows the DNS client to use DoH where configured servers support it.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient\EnableNetbios:
  rationale: |-
    NetBIOS name resolution uses broadcasts that any host on the local network can answer, which is used to spoof names and capture credentials. The value 2 disables NetBIOS name resolution on networks classified as public, where untrusted hosts are most likely.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient\EnableMulticast:
  rationale: |-
    Link-Local Multicast Name Resolution (LLMNR) asks the local network to resolve names that DNS cannot. Any host can answer, so attackers use it to redirect connections and capture credential hashes. The value 0 turns off LLMNR.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\EnableFontProviders:
  rationale: |-
    Windows can download fonts from an online font provider on demand. This creates connections to external services and adds a path for processing untrusted font files, which have been a source of vulnerabilities. The value 0 disables online font providers.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Lanmanworkstation\AllowInsecureGuestAuth:
  rationale: |-
    Insecure guest logons let the SMB client connect to servers as an unauthenticated guest, without signing or encryption. A malicious server could use this to serve manipulated content. The value 0 prevents the client from using guest access to SMB servers.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Lltd\AllowLLTDIOOnPublicNet:
  rationale: |-
    The Link-Layer Topology Discovery protocol maps devices on the local network. Its mapper (LLTDIO) and responder components reveal the system and network topology to other hosts and are not needed on managed systems. As part of turning off the mapper, the value 0 prevents its use on public networks.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Lltd\AllowLLTDIOOndomain:
  rationale: |-
    The Link-Layer Topology Discovery protocol maps devices on the local network. Its mapper (LLTDIO) and responder components reveal the system and network topology to other hosts and are not needed on managed systems. As part of turning off the mapper, the value 0 prevents its use on domain networks.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Lltd\EnableLLTDIO:
  rationale: |-
    The Link-Layer Topology Discovery protocol maps devices on the local network. Its mapper (LLTDIO) and responder components reveal the system and network topology to other hosts and are not needed on managed systems. The value 0 turns off the mapper I/O driver.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Lltd\ProhibitLLTDIOOnPrivateNet:
  rationale: |-
    The Link-Layer Topology Discovery protocol maps devices on the local network. Its mapper (LLTDIO) and responder components reveal the system and network topology to other hosts and are not needed on managed systems. The value 0 is part of the configuration written when the mapper policy is set to disabled.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Lltd\AllowRspndrOnDomain:
  rationale: |-
    The Link-Layer Topology Discovery protocol maps devices on the local network. Its mapper (LLTDIO) and responder components reveal the system and network topology to other hosts and are not needed on managed systems. As part of turning off the responder, the value 0 prevents it from answering on domain networks.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Lltd\AllowRspndrOnPublicNet:
  rationale: |-
    The Link-Layer Topology Discovery protocol maps devices on the local network. Its mapper (LLTDIO) and responder components reveal the system and network topology to other hosts and are not needed on managed systems. As part of turning off the responder, the value 0 prevents it from answering on public networks.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Lltd\EnableRspndr:
  rationale: |-
    The Link-Layer Topology Discovery protocol maps devices on the local network. Its mapper (LLTDIO) and responder components reveal the system and network topology to other hosts and are not needed on managed systems. The value 0 turns off the responder driver, so the system does not announce itself to topology discovery.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Lltd\ProhibitRspndrOnPrivateNet:
  rationale: |-
    The Link-Layer Topology Discovery protocol maps devices on the local network. Its mapper (LLTDIO) and responder components reveal the system and network topology to other hosts and are not needed on managed systems. The value 0 is part of the configuration written when the responder policy is set to disabled.
HKLM\SOFTWARE\Policies\Microsoft\Peernet\Disabled:
  rationale: |-
    Microsoft Peer-to-Peer Networking Services allow applications to communicate directly with other hosts, bypassing central services. This adds network attack surface and paths outside managed channels. The value 1 turns off these services.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Network Connections\NC_AllowNetBridge_NLA:
  rationale: |-
    A network bridge connects two network segments through the computer, which can link the corporate network to an untrusted network and bypass perimeter controls. The value 0 prevents users from installing and configuring a network bridge on the domain network.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Network Connections\NC_ShowSharedAccessUI:
  rationale: |-
    Internet Connection Sharing lets a computer share its network connection with other devices, which can open the corporate network to unmanaged devices. The value 0 prevents users from enabling Internet Connection Sharing on the domain network.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Network Connections\NC_StdDomainUserSetLocation:
  rationale: |-
    The network location (public, private) determines which firewall profile applies. If users could change it freely, they might mark an untrusted network as private and loosen the firewall. The value 1 requires domain users to elevate when setting a network location.
HKLM\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths\\\*\NETLOGON:
  rationale: |-
    Domain members download Group Policy settings and logon scripts from the NETLOGON share on domain controllers. Without hardening, an attacker on the network could impersonate the server or modify this traffic and inject malicious policies or scripts. Requiring mutual authentication, integrity and privacy for \\*\NETLOGON protects this path.
HKLM\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths\\\*\SYSVOL:
  rationale: |-
    Domain members download Group Policy settings and logon scripts from the SYSVOL share on domain controllers. Without hardening, an attacker on the network could impersonate the server or modify this traffic and inject malicious policies or scripts. Requiring mutual authentication, integrity and privacy for \\*\SYSVOL protects this path.
HKLM\SYSTEM\CurrentControlSet\Services\TCPIP6\Parameters\DisabledComponents:
  rationale: |-
    If IPv6 is not used in the environment, an enabled but unmanaged IPv6 stack offers an attack surface that is often not covered by firewalls and monitoring, for example rogue router advertisements or tunnelling. The value 255 disables all IPv6 components except the loopback interface. Some Windows features expect IPv6, so this should be tested before use.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Wcn\Registrars\DisableFlashConfigRegistrar:
  rationale: |-
    Windows Connect Now (WCN) configures wireless settings through mechanisms such as push-button or PIN setup, which can be used to add devices or networks without proper authorisation. This value is part of the configuration written when the WCN registrar policy is disabled; together with EnableRegistrars set to 0 it turns off WCN configuration.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Wcn\Registrars\DisableInBand802DOT11Registrar:
  rationale: |-
    Windows Connect Now (WCN) configures wireless settings through mechanisms such as push-button or PIN setup, which can be used to add devices or networks without proper authorisation. This value is part of the configuration written when the WCN registrar policy is disabled; together with EnableRegistrars set to 0 it turns off WCN configuration.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Wcn\Registrars\DisableUPnPRegistrar:
  rationale: |-
    Windows Connect Now (WCN) configures wireless settings through mechanisms such as push-button or PIN setup, which can be used to add devices or networks without proper authorisation. This value is part of the configuration written when the WCN registrar policy is disabled; together with EnableRegistrars set to 0 it turns off WCN configuration.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Wcn\Registrars\DisableWPDRegistrar:
  rationale: |-
    Windows Connect Now (WCN) configures wireless settings through mechanisms such as push-button or PIN setup, which can be used to add devices or networks without proper authorisation. This value is part of the configuration written when the WCN registrar policy is disabled; together with EnableRegistrars set to 0 it turns off WCN configuration.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Wcn\Registrars\EnableRegistrars:
  rationale: |-
    Windows Connect Now (WCN) configures wireless settings through mechanisms such as push-button or PIN setup, which can be used to add devices or networks without proper authorisation. The value 0 disables the WCN registrars, so wireless settings cannot be configured this way.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Wcn\Ui\DisableWcnUi:
  rationale: |-
    The Windows Connect Now wizards let users configure wireless devices and networks in ways that bypass central network management. The value 1 prohibits access to the WCN wizards.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Wcmsvc\Grouppolicy\fMinimizeConnections:
  rationale: |-
    A computer connected to the corporate wired network and a wireless network at the same time can act as a bridge between a trusted and an untrusted network. The value 3 prevents Wi-Fi connections while the computer is connected via Ethernet.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Wcmsvc\Grouppolicy\fBlockNonDomain:
  rationale: |-
    Simultaneous connections to the domain network and to non-domain networks can create a path from untrusted networks into the corporate network. The value 1 prohibits connecting to non-domain networks while connected to an authenticated domain network.
HKLM\SOFTWARE\Microsoft\WcmSvc\wifinetworkmanager\config\AutoConnectAllowedOEM:
  rationale: |-
    Windows can automatically connect to suggested open hotspots and networks shared by contacts. Such networks are untrusted and can be used to intercept traffic. The value 0 turns off automatic connection to these networks.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RegisterSpoolerRemoteRpcEndPoint:
  rationale: |-
    If the print spooler accepts client connections over the network, its large attack surface, which has seen remote code execution vulnerabilities, is exposed to remote attackers. The value 2 stops the spooler from accepting remote client connections; local printing still works, but the system can no longer share printers.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RedirectionguardPolicy:
  rationale: |-
    Redirection Guard prevents the print spooler from following file system redirections such as junctions and symbolic links that were created by unprivileged users. This blocks a class of privilege escalation attacks against the spooler. The value 1 enables it.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC\RpcUseNamedPipeProtocol:
  rationale: |-
    Outgoing RPC connections to print servers can use named pipes over SMB or TCP. The value 0 makes the client use RPC over TCP, which supports stronger authentication and allows the use of hardened RPC settings for printing.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC\RpcAuthentication:
  rationale: |-
    This value sets the authentication protocol for outgoing printer RPC connections. The value 0 selects the default (Negotiate), which prefers Kerberos and falls back to NTLM only where Kerberos is not available, ensuring printer connections are authenticated.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC\RpcProtocols:
  rationale: |-
    This value controls which protocols the print spooler accepts for incoming RPC connections. The value 5 allows only RPC over TCP and not named pipes, which reduces exposure of the spooler over SMB.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC\ForceKerberosForRpc:
  rationale: |-
    This value sets the authentication protocol accepted for incoming printer RPC connections. The value 0 selects Negotiate, which uses Kerberos where possible while keeping compatibility with clients that need NTLM.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC\RpcTcpPort:
  rationale: |-
    This value sets the TCP port the print spooler uses for RPC over TCP. The value 0 selects dynamic port allocation through the RPC endpoint mapper, the expected default configuration.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint\RestrictDriverInstallationToAdministrators:
  rationale: |-
    Point and Print lets users install printer drivers from print servers, which attackers abused (for example in PrintNightmare) to load malicious drivers with SYSTEM privileges. The value 1 restricts printer driver installation to administrators.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\CopyFilesPolicy:
  rationale: |-
    Printer drivers can specify additional queue-specific files to copy to clients, a mechanism that has been abused to load malicious code into the spooler. The value 1 limits such files to color profiles.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint\NoWarningNoElevationOnInstall:
  rationale: |-
    Point and Print can be configured to install printer drivers without warning or elevation, which lets malicious print servers deliver drivers silently. The value 0 ensures that installing drivers for a new printer connection shows a warning and requires elevation.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint\UpdatePromptSettings:
  rationale: |-
    Point and Print can be configured to update existing printer drivers without warning or elevation, which lets a malicious or compromised print server push code silently. The value 0 ensures driver updates show a warning and require elevation.
HKLM\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications\NoCloudApplicationNotification:
  rationale: |-
    Cloud-based application notifications are delivered through the Windows Push Notification Service and require a connection to external servers. The value 1 turns off network usage for notifications, avoiding this external connection and the data it carries.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer\HideRecommendedPersonalizedSites:
  rationale: |-
    The Start menu can show recommended websites based on the user's browsing activity. This displays personal browsing information on screen and relies on activity data processed by cloud services. The value 1 removes personalized website recommendations from the Start menu.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit\ProcessCreationIncludeCmdLine_Enabled:
  rationale: |-
    Process creation events normally show only the program name. Including the command line reveals how the program was invoked, which is essential for detecting malicious use of legitimate tools such as PowerShell. Command lines can contain sensitive data such as passwords, so access to the Security log should be restricted.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters\AllowEncryptionOracle:
  rationale: |-
    Older CredSSP implementations, used by Remote Desktop and other services, were vulnerable to an attack that allowed remote code execution through manipulated authentication. The value 0 (Force Updated Clients) prevents connections to and from unpatched CredSSP implementations.
HKLM\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation\AllowProtectedCreds:
  rationale: |-
    When users connect to a remote host, their credentials may be delegated to it and could be stolen if the host is compromised. The value 1 lets the remote host accept non-exportable credentials, as used by Restricted Admin mode and Remote Credential Guard, so no reusable credentials are left on the remote system.
HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\EnableVirtualizationBasedSecurity:
  rationale: |-
    Virtualization-based security uses the hypervisor to create an isolated environment protected from the normal operating system, even from code running in the kernel. It is the foundation for Credential Guard and memory integrity protection. The value 1 turns on VBS; it requires compatible hardware and firmware.
HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\RequirePlatformSecurityFeatures:
  rationale: |-
    Virtualization-based security is stronger when backed by platform features. The value 3 requires both Secure Boot and DMA protection, so that the boot chain is verified and devices cannot read or modify memory directly to bypass VBS.
HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\HypervisorEnforcedCodeIntegrity:
  rationale: |-
    Hypervisor-enforced code integrity (memory integrity) checks kernel-mode drivers and binaries within the isolated VBS environment before they run, preventing unsigned or tampered code from executing in the kernel. The value 1 enables it with a UEFI lock, so it cannot be turned off remotely without physical access. Incompatible drivers may fail to load.
HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\HVCIMATRequired:
  rationale: |-
    The UEFI Memory Attributes Table lets the hypervisor apply proper memory protections to firmware runtime code. The value 1 requires this table for memory integrity, closing gaps where firmware memory regions could be both writable and executable.
HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\LsaCfgFlags:
  rationale: |-
    Credential Guard isolates secrets such as NTLM hashes and Kerberos tickets in a virtualization-protected environment, so credential dumping tools running on the system cannot read them. The value 1 enables Credential Guard with a UEFI lock, preventing remote disabling.
HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\ConfigureSystemGuardLaunch:
  rationale: |-
    System Guard Secure Launch uses dynamic root of trust measurement to start the system from a verified state, protecting virtualization-based security against compromised firmware. The value 1 enables Secure Launch on supported hardware.
HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\ConfigureKernelShadowStacksLaunch:
  rationale: |-
    Kernel-mode hardware-enforced stack protection uses CPU shadow stacks to detect manipulated return addresses in kernel code, blocking return-oriented programming exploits. The value 1 enables it in enforcement mode on supported hardware; incompatible drivers can cause problems.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Device Metadata\PreventDeviceMetadataFromNetwork:
  rationale: |-
    Windows can download device metadata such as icons and manufacturer information from the internet when devices are connected. The value 1 prevents these downloads, avoiding unnecessary external connections and the processing of content from external sources.
HKLM\SYSTEM\CurrentControlSet\Policies\Earlylaunch\DriverLoadPolicy:
  rationale: |-
    Early Launch Antimalware classifies boot-start drivers before they load. The value 3 allows good, unknown and bad-but-boot-critical drivers, so drivers known to be malicious and not needed for boot are blocked while the system can still start.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378Eac-683F-11D2-A89A-00C04Fbbcfa2}\NoBackgroundPolicy:
  rationale: |-
    Registry-based (administrative template) policy settings should be refreshed regularly while the system is running, not only at startup or logon. If background processing is disabled, local changes to these settings persist until the next reboot or logon. The value 0 keeps background refresh enabled.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378Eac-683F-11D2-A89A-00C04Fbbcfa2}\NoGPOListChanges:
  rationale: |-
    Group Policy normally reapplies registry-based (administrative template) settings only when the policy objects have changed. If settings are changed locally, for example by malware or a user with admin rights, they remain altered until the next change. The value 0 makes Windows reprocess these settings at every refresh, even if the Group Policy objects have not changed.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{827D319E-6EAC-11D2-A4EA-00C04F79F83A}\NoBackgroundPolicy:
  rationale: |-
    Security policy settings should be refreshed regularly while the system is running, not only at startup. If background processing is disabled, local changes to security settings persist until the next reboot. The value 0 keeps background refresh of security policy enabled.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{827D319E-6EAC-11D2-A4EA-00C04F79F83A}\NoGPOListChanges:
  rationale: |-
    Group Policy normally reapplies security settings only when the policy objects have changed. If settings are changed locally, for example by malware or a user with admin rights, they remain altered until the next change. The value 0 makes Windows reprocess security policy at every refresh, even if the Group Policy objects have not changed.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\EnableCdp:
  rationale: |-
    Continue experiences (Connected Devices Platform) lets the device discover, pair with and hand off activities to other devices signed in with the same account. Each such channel is an additional network-reachable service and a path for data to leave the managed device. Turning it off reduces the attack surface and keeps user activity on the corporate system.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableBkGndGroupPolicy:
  rationale: |-
    When the background refresh of Group Policy is turned off, policies are only applied at startup or logon, so a machine that stays up for weeks keeps stale or locally tampered settings. Leaving this value unset keeps the periodic refresh active, so security settings are re-applied regularly and drift is corrected automatically.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableBkGndGroupPolicy\:
  rationale: |-
    Background Group Policy refresh should not be disabled, otherwise security settings are only re-applied at startup or logon and local changes persist on long-running machines. This variant looks for a registry key with the name of the policy value; such a key is not normally created by Windows, so its absence is expected.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer\NoUseStoreOpenWith:
  rationale: |-
    When Windows cannot find a program for a file type it can offer to search the Microsoft Store. Blocking this prevents users from being steered to installing unvetted Store apps from the Open With dialog and avoids a needless call to an Internet service.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\DisableWebPnPDownload:
  rationale: |-
    Windows can download printer drivers over HTTP from the Internet when a printer is added. Drivers run with high privileges, and fetching them over an unauthenticated, unencrypted channel opens the door to malicious or tampered drivers. Blocking these downloads keeps driver installation limited to vetted sources.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Tabletpc\PreventHandwritingDataSharing:
  rationale: |-
    Handwriting recognition personalization can send samples of a user's handwriting to Microsoft. Such samples may contain confidential content from documents or notes. Preventing the sharing keeps this data on the device.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Handwritingerrorreports\PreventHandwritingErrorReports:
  rationale: |-
    Handwriting recognition error reports can be sent to Microsoft and may include the text the user was writing. Disabling these reports prevents potentially sensitive content from leaving the organization.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Internet Connection Wizard\ExitOnMSICW:
  rationale: |-
    The legacy Internet Connection Wizard can contact Microsoft to download a list of Internet service providers. On managed systems this connection is unnecessary and leaks information to an outside service; exiting the wizard when it refers to Microsoft prevents it.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoWebServices:
  rationale: |-
    The Web publishing and online ordering wizards download lists of service providers from Microsoft. This outbound connection is not needed on managed systems and could be used to direct users to untrusted services. Disabling the download removes that dependency and data flow.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\DisableHTTPPrinting:
  rationale: |-
    Printing over HTTP lets the client send print jobs to Internet print servers. Documents may be transmitted over the Internet unencrypted and to servers outside the organization's control. Disabling it keeps printing on managed print infrastructure.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Registration Wizard Control\NoRegistration:
  rationale: |-
    The product registration wizard sends registration information to Microsoft. Suppressing it avoids an unnecessary outbound data transfer and prevents users from being prompted to register managed systems.
HKLM\SOFTWARE\Policies\Microsoft\Searchcompanion\DisableContentFileUpdates:
  rationale: |-
    Search Companion can download content updates from Microsoft during searches. This outbound connection is unnecessary on managed systems and reveals information about search activity. Disabling it removes the data flow.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoOnlinePrintsWizard:
  rationale: |-
    The Online Prints wizard uploads pictures to commercial printing services over the Internet. This allows company images and documents to be sent to third parties outside any control. Disabling the wizard closes this data channel.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoPublishingWizard:
  rationale: |-
    The Web Publishing wizard lets users publish files to online services from Explorer. This is a convenient way to move company data to uncontrolled third-party storage. Removing the wizard reduces the risk of data leakage.
HKLM\SOFTWARE\Policies\Microsoft\Messenger\Client\CEIP:
  rationale: |-
    The legacy Windows Messenger client can take part in the Customer Experience Improvement Program and send usage data to Microsoft. Turning this off prevents uncontrolled telemetry from managed systems.
HKLM\SOFTWARE\Policies\Microsoft\Sqmclient\Windows\CEIPEnable:
  rationale: |-
    The Customer Experience Improvement Program collects information about system configuration and usage and sends it to Microsoft. On managed systems this is an unneeded outbound data flow that may reveal details about the environment. Disabling CEIP keeps this information internal.
HKLM\SOFTWARE\Policies\Microsoft\PCHealth\ErrorReporting\DoReport:
  rationale: |-
    Windows Error Reporting sends details of application crashes, which can include memory contents and file paths, to Microsoft. Disabling reporting through this policy prevents potentially sensitive data from leaving the organization.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting\Disabled:
  rationale: |-
    Windows Error Reporting uploads crash data to Microsoft; crash dumps can contain parts of process memory such as credentials, keys or document content. Disabling WER prevents this data from leaving the system without review. Organizations that rely on crash data for support should use an internal collection mechanism instead.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters\DevicePKInitBehavior:
  rationale: |-
    Device authentication with certificates (PKINIT) lets a domain-joined computer authenticate to a domain controller with its certificate rather than only its password-derived key. Setting the behavior to automatic makes the device use certificate-based authentication when available, which is stronger and supports features such as credential protection and claims.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters\DevicePKInitEnabled:
  rationale: |-
    Enabling Kerberos device authentication with certificates lets a domain-joined computer authenticate to domain controllers using its certificate. Certificate-based device authentication is more resistant to theft and replay of the machine password than password-derived keys.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\AllowCustomSSPsAPs:
  rationale: |-
    Security Support Providers and Authentication Packages are DLLs loaded into LSASS, the process that holds credentials. Attackers abuse custom SSPs to capture passwords in clear text and to gain persistence. Blocking custom SSPs and APs from loading into LSASS removes this technique.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RunAsPPL:
  rationale: |-
    Running LSASS as a protected process prevents non-protected processes, including those with administrator rights, from reading its memory or injecting code into it. This blocks common credential dumping tools. The value 1 enables the protection with a UEFI lock, so it cannot be turned off simply by editing the registry.
HKLM\SOFTWARE\Policies\Microsoft\Control Panel\International\BlockUserInputMethodsForSignIn:
  rationale: |-
    Without this setting, input methods configured by a user can be copied to the system account used on the sign-in screen. A malicious or vulnerable input method would then run in a privileged context before anyone logs on. Blocking the copy keeps the sign-in environment free of user-installed components.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\BlockUserFromShowingAccountDetailsOnSignin:
  rationale: |-
    Showing account details such as the email address on the sign-in screen reveals valid account names to anyone with physical access. Blocking this display deprives an attacker of information useful for password guessing and phishing.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\DontDisplayNetworkSelectionUI:
  rationale: |-
    The network selection UI on the sign-in screen lets anyone change network connectivity without logging on. That can be used to connect the machine to a rogue network or disconnect it from monitoring. Hiding the UI restricts network changes to authenticated users.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\DontEnumerateConnectedUsers:
  rationale: |-
    Listing connected users on the sign-in screen of a domain-joined computer reveals valid account names to anyone with physical access. Disabling the enumeration makes it harder to target accounts for password guessing or social engineering.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\EnumerateLocalUsers:
  rationale: |-
    If local users are enumerated on the sign-in screen of a domain-joined computer, anyone at the console learns valid local account names. Turning this off removes information useful for brute-force and targeted attacks.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\DisableLockScreenAppNotifications:
  rationale: |-
    App notifications on the lock screen can display message previews, calendar entries and other content to anyone near the device. Disabling them prevents information disclosure while the device is locked.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\BlockDomainPicturePassword:
  rationale: |-
    Picture password sign-in relies on gestures on an image, which can be observed or reconstructed from smudges on a touchscreen and offers less entropy than a strong password. Blocking picture password for domain users keeps sign-in limited to stronger methods.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\AllowDomainPINLogon:
  rationale: |-
    A convenience PIN for domain users is a short secret that is not protected like Windows Hello for Business keys and weakens domain authentication. Disabling convenience PIN sign-in ensures domain accounts use their password or a properly configured strong authenticator.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\AllowCrossDeviceClipboard:
  rationale: |-
    Clipboard history synchronization copies clipboard contents to the cloud and to other devices of the user. Clipboards frequently contain passwords, confidential text and screenshots. Disabling cross-device sync prevents this data from leaving the managed device.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\UploadUserActivities:
  rationale: |-
    Uploading user activities sends the activity history (applications used, files and web pages opened) to the cloud. This exposes detailed usage information outside the organization. Disabling the upload keeps activity history local.
HKLM\SOFTWARE\Policies\Microsoft\Power\PowerSettings\f15576e8-98b7-4186-b944-eafa664402d9\DCSettingIndex:
  rationale: |-
    Allowing standby states (S1-S3) while on battery keeps memory contents, including encryption keys and credentials, powered and present in RAM while the device sleeps. A lost or stolen sleeping device is therefore exposed to memory attacks and BitLocker key extraction. Disabling standby forces hibernation or shutdown instead.
HKLM\SOFTWARE\Policies\Microsoft\Power\PowerSettings\f15576e8-98b7-4186-b944-eafa664402d9\ACSettingIndex:
  rationale: |-
    Allowing standby states (S1-S3) while plugged in keeps memory contents, including encryption keys and credentials, powered and present in RAM while the device sleeps. Such a device is exposed to memory attacks and BitLocker key extraction if it is stolen or accessed physically. Disabling standby avoids this state.
HKLM\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51\DCSettingIndex:
  rationale: |-
    If no password is required when a computer resumes from sleep on battery, anyone who picks up the device gets access to the logged-on session. Requiring a password on wake ensures the session remains protected.
HKLM\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51\ACSettingIndex:
  rationale: |-
    If no password is required when a computer resumes from sleep while plugged in, anyone with physical access gets the logged-on session. Requiring a password on wake protects the session while the user is away.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fAllowUnsolicited:
  rationale: |-
    Offer (unsolicited) Remote Assistance lets helpers initiate a remote session to a user's computer without the user asking for it. This can be abused for social engineering and unauthorized access. Disabling it ensures remote help is only provided through approved, explicitly requested channels.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fAllowToGetHelp:
  rationale: |-
    Solicited Remote Assistance lets users invite others, potentially outside the organization, to view or control their desktop. Attackers use fake support calls to obtain such invitations. Disabling it removes this remote access path; organizations should use a managed remote support tool instead.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Rpc\EnableAuthEpResolution:
  rationale: |-
    RPC clients normally query the Endpoint Mapper anonymously. When RPC is restricted to authenticated clients, clients must authenticate to the Endpoint Mapper as well, otherwise their calls fail. Enabling authenticated endpoint resolution makes RPC endpoint lookups work in a hardened configuration and removes anonymous access.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Rpc\RestrictRemoteClients:
  rationale: |-
    Unauthenticated RPC calls to the RPC server are a classic avenue for remote exploitation and information gathering. Restricting unauthenticated RPC clients makes the RPC runtime reject anonymous calls to interfaces that do not explicitly allow them, reducing the remotely reachable attack surface.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Scripteddiagnosticsprovider\Policy\DisableQueryRemoteServer:
  rationale: |-
    The Microsoft Support Diagnostic Tool can exchange diagnostic data with the support provider and download troubleshooting content. MSDT has been abused for remote code execution, and its data uploads may reveal system details. Disabling interactive communication with the support provider removes this outbound channel.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Wdi\{9C5A40Da-B965-4Fc3-8781-88Dd50A6299D}\ScenarioExecutionEnabled:
  rationale: |-
    PerfTrack collects responsiveness data and sends it to Microsoft. This is an unneeded outbound data flow from managed systems. Disabling the scenario stops the collection.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Advertisinginfo\DisabledByGroupPolicy:
  rationale: |-
    The advertising ID lets apps track a user across applications to deliver targeted advertising. On managed systems this is a privacy risk and has no business purpose. Disabling it prevents cross-app profiling.
HKLM\SOFTWARE\Policies\Microsoft\W32Time\Timeproviders\Ntpclient\Enabled:
  rationale: |-
    Accurate time is essential for Kerberos authentication, certificate validation and the correlation of log entries across systems. Enabling the Windows NTP client ensures the clock is synchronized with a trusted time source.
HKLM\SOFTWARE\Policies\Microsoft\W32Time\Timeproviders\Ntpserver\Enabled:
  rationale: |-
    The Windows NTP server component lets the system act as a time source for other machines. Unless the host is intended to provide time, this service only adds a listening network port. Disabling it reduces the attack surface; domain controllers and designated time servers are the exception.
HKLM\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\Appmodel\Statemanager\AllowSharedLocalAppData:
  rationale: |-
    Shared local app data lets Windows apps share data between users of the same device. Data written by one user could be read or manipulated by another. Disabling it keeps app data isolated per user.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Appx\BlockNonAdminUserInstall:
  rationale: |-
    Allowing standard users to install packaged Windows apps lets them introduce unvetted software, which may be malicious or unlicensed. Blocking non-administrator installation keeps software deployment under administrative control.
HKLM\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy\LetAppsActivateWithVoiceAboveLock:
  rationale: |-
    Voice activation of apps while the device is locked allows voice assistants to act and possibly reveal information without authentication. Forcing a deny prevents apps from being activated by voice above the lock screen.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\MSAOptional:
  rationale: |-
    Some modern apps require a Microsoft account to sign in. Making Microsoft accounts optional lets these apps use enterprise credentials instead, avoiding the use of personal consumer accounts and the transfer of corporate data to them.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\BlockHostedAppAccessWinRT:
  rationale: |-
    Hosted content in Universal Windows apps can be web content loaded from external sources. If such content can call Windows Runtime APIs, a compromised web page gains access to device capabilities. Blocking this access limits the impact of malicious hosted content.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer\NoAutoplayfornonVolume:
  rationale: |-
    AutoPlay for non-volume devices (such as cameras and phones using MTP) automatically launches applications when the device is connected. Malicious devices or content can exploit this behavior. Disabling it requires users to open such content deliberately.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoAutorun:
  rationale: |-
    Autorun commands from removable media and network drives were a major malware propagation vector. Setting the default AutoRun behavior to not execute any autorun commands prevents code from running automatically when media is inserted.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoDriveTypeAutoRun:
  rationale: |-
    AutoPlay starts reading and acting on content as soon as media is inserted, which malware has used to spread via USB drives and CDs. Disabling AutoPlay for all drive types (value 255) ensures nothing is launched automatically from any drive.
HKLM\SOFTWARE\Policies\Microsoft\Biometrics\Facialfeatures\EnhancedAntiSpoofing:
  rationale: |-
    Facial recognition without enhanced anti-spoofing can be fooled by photos or videos of the authorized user. Enabling enhanced anti-spoofing requires the additional checks that compatible hardware supports, making Windows Hello face sign-in harder to bypass.
HKLM\SOFTWARE\Policies\Microsoft\Camera\AllowCamera:
  rationale: |-
    A camera that can be used by any app may be abused by malware to record users or their surroundings. Disabling camera use is appropriate where no business process needs it; where video conferencing is required this must be weighed against that need.
HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent\DisableConsumerAccountStateContent:
  rationale: |-
    Cloud consumer account state content shows promotional and account-related content from Microsoft in Explorer and other experiences. On managed systems this adds outbound calls and distractions without business value. Disabling it limits cloud-driven content.
HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent\DisableCloudOptimizedContent:
  rationale: |-
    Cloud optimized content makes Windows download and display content such as tips and suggestions from Microsoft. Disabling it reduces outbound data flows and unexpected changes to the user interface on managed systems.
HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent\DisableWindowsConsumerFeatures:
  rationale: |-
    Windows consumer features automatically install suggested apps and show promotional content from the Store. This places unvetted software on managed systems. Turning these features off keeps the software inventory under administrative control.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Connect\RequirePinForPairing:
  rationale: |-
    Wireless projection to the device (Miracast) without pairing confirmation lets nearby devices connect and project content or attempt attacks. Requiring a PIN for the first pairing ensures only users present at the device can approve a connection.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Credui\DisablePasswordReveal:
  rationale: |-
    The password reveal button lets anyone who sees the screen display the password just typed. It also simplifies shoulder surfing and attacks that rely on a briefly unattended sign-in prompt. Disabling the button keeps entered passwords hidden.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Credui\EnumerateAdministrators:
  rationale: |-
    When elevation prompts list administrator accounts, a standard user learns the names of privileged accounts and can try to guess their passwords. Disabling enumeration requires the user to type both name and password, which hides privileged account names.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\NoLocalPasswordResetQuestions:
  rationale: |-
    Security questions for local accounts are easy to research or guess and provide a password reset path that bypasses the password. Disabling them removes this weak recovery mechanism.
HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection\AllowTelemetry:
  rationale: |-
    Windows diagnostic data (telemetry) sends information about system configuration and usage to Microsoft. Limiting it to the required level minimizes the amount of potentially sensitive information leaving the organization while keeping the data needed to keep Windows secure and up to date.
HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection\DisableEnterpriseAuthProxy:
  rationale: |-
    The telemetry service can use the authenticated enterprise proxy and thus the credentials of the logged-on user to reach Microsoft. Disabling authenticated proxy usage prevents the service from sending data with user credentials and allows the organization to control telemetry traffic at the proxy.
HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection\DisableOneSettingsDownloads:
  rationale: |-
    OneSettings lets Microsoft download configuration settings that change the behavior of diagnostic data collection. Disabling these downloads keeps the device's diagnostic behavior determined by the organization's own policy.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Datacollection\DoNotShowFeedbackNotifications:
  rationale: |-
    Feedback notifications prompt users to send feedback, which may include screenshots and logs, to Microsoft. Disabling them prevents unsolicited data sharing and interruption of users on managed systems.
HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection\EnableOneSettingsAuditing:
  rationale: |-
    Enabling OneSettings auditing logs changes downloaded from the OneSettings service to the event log. This makes cloud-driven changes to diagnostic settings visible and auditable.
HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection\LimitDiagnosticLogCollection:
  rationale: |-
    Additional diagnostic logs may be collected and sent to Microsoft when more troubleshooting information is requested. Limiting this collection reduces the amount of system information that leaves the organization.
HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection\LimitDumpCollection:
  rationale: |-
    Memory dumps collected for diagnostics can contain credentials, keys and confidential data from process memory. Limiting dump collection prevents such data from being sent to Microsoft as part of diagnostic data.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Previewbuilds\AllowBuildPreview:
  rationale: |-
    Users who can enroll in Windows Insider preview builds run pre-release code that is less tested and may contain security defects. Removing the user's control over preview builds keeps the device on supported production releases.
HKLM\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization\DODownloadMode:
  rationale: |-
    Delivery Optimization can download update content from peers, including peers on the Internet. Restricting peering to the local network (value 1) prevents the device from exchanging content with unknown Internet hosts and limits exposed bandwidth and network traffic to trusted peers.
HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableAppInstaller:
  rationale: |-
    App Installer and the Windows Package Manager (winget) let users install software from configured sources, including public repositories. On managed systems this bypasses software approval processes. Disabling App Installer keeps software installation under administrative control.
HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableExperimentalFeatures:
  rationale: |-
    Experimental features of App Installer and winget are not production-ready and may have security weaknesses. Disabling them keeps the package manager limited to supported functionality.
HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableHashOverride:
  rationale: |-
    The hash override option lets winget install a package even if its hash does not match the manifest. This defeats the integrity check that protects against tampered installers. Disabling the override keeps hash verification mandatory.
HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableMSAppInstallerProtocol:
  rationale: |-
    The ms-appinstaller URI scheme allows web pages to trigger installation of app packages directly. It has been abused to distribute malware through fake download sites. Disabling the protocol prevents web-initiated package installation.
HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application\Retention:
  rationale: |-
    If the Application log stops recording when it reaches its maximum size, new events are lost and attackers can fill the log to hide later activity. Setting retention so that old events are overwritten when needed keeps logging active; the log size and central collection must be sufficient to keep events long enough.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Eventlog\Application\MaxSize:
  rationale: |-
    A small Application log is overwritten quickly, so evidence of errors and attacks may be gone before anyone looks at it. Setting the maximum size to 32,768 KB keeps a reasonable history on the system.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Eventlog\Security\Retention:
  rationale: |-
    If the Security log stops recording when full, new security events are lost and an attacker can flood the log to cover their tracks. Overwriting old events when needed keeps auditing active; the log must be large enough or forwarded centrally so events are kept as long as required.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Eventlog\Security\MaxSize:
  rationale: |-
    The Security log receives a high volume of audit events. If it is too small, logon, privilege use and policy change events are overwritten within hours. A maximum size of 196,608 KB keeps a meaningful audit history for investigations.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Eventlog\Setup\Retention:
  rationale: |-
    If the Setup log stops recording when full, events about installations and updates are lost. Letting it overwrite old events keeps logging active so the most recent changes remain traceable.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Eventlog\Setup\MaxSize:
  rationale: |-
    A small Setup log quickly loses records of component installations and updates. A maximum size of 32,768 KB keeps a useful history for troubleshooting and investigation.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Eventlog\System\Retention:
  rationale: |-
    If the System log stops recording when full, events from drivers and services are lost, including signs of tampering. Overwriting old events when needed keeps logging active.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Eventlog\System\MaxSize:
  rationale: |-
    A small System log is overwritten quickly and loses records of service, driver and system events needed for troubleshooting and incident investigation. A maximum size of 32,768 KB keeps a reasonable history.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer\DisableGraphRecentItems:
  rationale: |-
    Explorer can show recent files from the user's Microsoft 365 cloud account in Quick Access. This pulls cloud data into the local interface and may expose information on shared screens. Disabling it keeps Quick Access limited to local items.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer\NoDataExecutionPrevention:
  rationale: |-
    Data Execution Prevention stops code from running in memory regions meant for data, a basic defense against many memory corruption exploits. Turning DEP off for Explorer would let exploits of Explorer and its extensions run code more easily. The check ensures DEP stays enabled for Explorer.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer\NoHeapTerminationOnCorruption:
  rationale: |-
    When heap corruption is detected, Explorer normally terminates instead of continuing in an undefined state that an exploit could use. Keeping heap termination on corruption enabled prevents attackers from exploiting corrupted heap structures in Explorer.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\PreXPSP2ShellProtocolBehavior:
  rationale: |-
    The shell protocol protected mode restricts what the shell: protocol can open, so it cannot be used to launch arbitrary files from web pages or documents. Keeping the pre-Windows XP SP2 behavior turned off keeps this restriction in place.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Locationandsensors\DisableLocation:
  rationale: |-
    Location services allow apps and Windows features to determine the device's physical position. This is a privacy risk and can reveal where staff and assets are. Disabling location is appropriate when no business application requires it.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Messaging\AllowMessageSync:
  rationale: |-
    Message sync backs up text messages to the cloud. This moves communication content to a service outside organizational control. Disabling it keeps messages on the device.
HKLM\SOFTWARE\Policies\Microsoft\MicrosoftAccount\DisableUserAuth:
  rationale: |-
    Consumer Microsoft accounts are personal identities outside the organization's control. Allowing them for authentication in apps and services leads to corporate data being tied to personal accounts. Blocking consumer account authentication keeps access tied to managed identities.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet\LocalSettingOverrideSpynetReporting:
  rationale: |-
    If local administrators can override the reporting setting for Microsoft MAPS, the centrally configured cloud protection policy can be changed on the device. Disabling the local override ensures the organization's setting applies consistently.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet\SpynetReporting:
  rationale: |-
    Joining Microsoft MAPS sends information about detected and suspicious files, which can include file samples and paths, to Microsoft. Disabling it keeps this data in the organization; the trade-off is losing cloud-delivered protection, which many organizations consider valuable.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\ExploitGuard_ASR_Rules:
  rationale: |-
    Attack surface reduction rules block behaviors typical of malware, such as Office macros spawning processes or scripts launching downloaded executables. Enabling the ASR rules policy is the prerequisite for the individual rules to take effect.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules\26190899-1602-49e8-8b27-eb1d0a1ce869
: rationale: |-
    Office communication applications such as Outlook are a common entry point for malicious attachments and links. Blocking them from creating child processes stops many exploits and malicious documents from launching payloads like command shells or PowerShell. The rule is set to block mode.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules\3b576869-a4ec-4529-8536-b80a7769e899
: rationale: |-
    Malicious Office documents often write executable files to disk as a first stage. Blocking Office applications from creating executable content stops this technique and prevents droppers from persisting payloads. The rule is set to block mode.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules\56a863a9-875e-4185-98a7-b882c64b5ce5
: rationale: |-
    Attackers load legitimately signed but vulnerable drivers to gain kernel access and disable security tools. This rule blocks known vulnerable signed drivers from being written to disk and used. It is set to block mode.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules\5beb7efe-fd9a-4556-801d-275e5ffc04cc
: rationale: |-
    Malware frequently hides malicious scripts through obfuscation to evade detection. This rule detects and blocks scripts that appear obfuscated, reducing the success of script-based attacks. It is set to block mode.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules\75668c1f-73b5-4cf0-bb93-3ecf5cb7cc84
: rationale: |-
    Malicious Office documents may inject code into other running processes to hide activity and evade defenses. Blocking Office applications from injecting code into other processes stops this technique. The rule is set to block mode.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules\7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c
: rationale: |-
    PDF files are a common attack vector, and exploits in Adobe Reader typically launch additional processes to run their payload. Blocking Adobe Reader from creating child processes stops this behavior. The rule is set to block mode.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules\92e97fa1-2edf-4476-bdd6-9dd0b4dddc7b
: rationale: |-
    Office VBA macros can call Win32 APIs directly to load shellcode and run malicious code in memory. Blocking Win32 API calls from macros prevents this class of macro malware. The rule is set to block mode.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules\9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2
: rationale: |-
    Credential theft tools read the memory of LSASS to extract passwords and hashes. This rule blocks untrusted processes from opening LSASS for memory access, which defeats many credential dumping techniques. It is set to block mode.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules\b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4
: rationale: |-
    Removable USB drives are used to bring in malware and to run unauthorized tools. Blocking untrusted and unsigned processes started from USB media prevents such code from executing while still allowing signed, trusted software. The rule is set to block mode.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules\be9ba2d9-53ea-4cdc-84e5-9b1eeee46550
: rationale: |-
    Email and webmail are a primary delivery channel for malware. Blocking executable files and scripts launched from email clients and webmail stops users from running malicious attachments directly. The rule is set to block mode.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules\d3e037e1-3eb8-44c8-a917-57927947596d
: rationale: |-
    Script-based downloaders written in JavaScript or VBScript fetch and run malware from the Internet. Blocking these scripts from launching downloaded executable content interrupts this common infection chain. The rule is set to block mode.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules\d4f940ab-401b-4efc-aadc-ad5f3c50688a
: rationale: |-
    Malicious Office documents commonly spawn processes such as cmd.exe or PowerShell to run their payload. Blocking all Office applications from creating child processes prevents macro and exploit payloads from launching. The rule is set to block mode.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules\e6db77e5-3df2-4cf1-b95a-636979351e5b
: rationale: |-
    WMI event subscriptions let attackers run code persistently and stealthily without files in startup locations. Blocking persistence through WMI event subscriptions removes this technique. The rule is set to block mode.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Network Protection\EnableNetworkProtection
: rationale: |-
    Network protection blocks connections from any process to malicious domains, IP addresses and phishing sites using Microsoft Defender's reputation data. Setting it to block mode prevents malware from reaching command-and-control servers and users from opening harmful sites.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine\EnableFileHashComputation:
  rationale: |-
    With file hash computation enabled, Microsoft Defender computes hashes for scanned executable files. This allows file indicators (allow or block by hash) to be enforced and makes investigations more precise.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection\DisableIOAVProtection:
  rationale: |-
    Scanning all downloaded files and attachments catches malware at the moment it arrives through browsers and email clients. Keeping this protection enabled stops many infections before the file is opened.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection\DisableRealtimeMonitoring:
  rationale: |-
    Real-time protection scans files and processes as they are accessed and is the main defense of Microsoft Defender Antivirus. Turning it off leaves the system unprotected against malware between scheduled scans. The check ensures it is not disabled by policy.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection\DisableBehaviorMonitoring:
  rationale: |-
    Behavior monitoring detects malware by its actions, such as process injection or mass file encryption, even when no signature exists yet. Keeping it enabled protects against new and fileless threats.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection\DisableScriptScanning:
  rationale: |-
    Script scanning inspects PowerShell, JavaScript and other scripts at runtime, including obfuscated and fileless attacks via the Antimalware Scan Interface. Keeping it enabled is important because many modern attacks are script-based.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Reporting\DisableGenericRePorts:
  rationale: |-
    Watson events are crash and error reports from Microsoft Defender that are sent to Microsoft. Disabling them prevents diagnostic information about the device from being transmitted without need.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan\DisablePackedExeScanning:
  rationale: |-
    Malware is often packed or compressed to evade detection. Scanning packed executables lets Defender unpack and inspect them. Keeping this scanning enabled closes an easy evasion route.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan\DisableRemovableDriveScanning:
  rationale: |-
    Removable drives are a common way for malware to enter an environment. Including removable drives in full scans ensures their contents are inspected for threats.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan\DisableEmailScanning:
  rationale: |-
    Email messages and mailbox files can contain malicious attachments. Enabling email scanning lets Defender inspect mail files and their attachments, catching threats that may otherwise remain dormant in mailboxes.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\PUAProtection:
  rationale: |-
    Potentially unwanted applications such as adware, bundled software and certain tools can degrade security and track users. Blocking them prevents their installation and execution on managed systems.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\DisableAntiSpyware:
  rationale: |-
    Turning off Microsoft Defender Antivirus by policy leaves the system without the built-in antimalware protection. The check ensures the antivirus is not disabled; if a third-party product is used, Defender switches to passive mode automatically instead.
HKLM\SOFTWARE\Policies\Microsoft\AppHVSI\AuditApplicationGuard:
  rationale: |-
    Microsoft Defender Application Guard runs untrusted browsing in an isolated container. Enabling auditing records events from within the container, which provides visibility for investigations of attacks that were contained.
HKLM\SOFTWARE\Policies\Microsoft\AppHVSI\AllowCameraMicrophoneRedirection:
  rationale: |-
    Camera and microphone access from the Application Guard container would let untrusted web content record audio and video. Disabling this redirection preserves the isolation of the container.
HKLM\SOFTWARE\Policies\Microsoft\AppHVSI\AllowPersistence:
  rationale: |-
    Data persistence in Application Guard keeps cookies, downloads and other data from the isolated browser across sessions. Persisted data can carry malware or tracking state forward. Disabling persistence ensures each container session starts clean.
HKLM\SOFTWARE\Policies\Microsoft\AppHVSI\SaveFilesToHost:
  rationale: |-
    Allowing files to be saved from the Application Guard container to the host lets potentially malicious downloads escape the isolation. Disabling this keeps untrusted content inside the container.
HKLM\SOFTWARE\Policies\Microsoft\AppHVSI\AppHVSIClipboardSettings:
  rationale: |-
    Clipboard operations between the Application Guard container and the host can transfer malicious content into the trusted environment. Allowing copy only from the isolated session to the host (value 1) prevents host data from being pasted into untrusted sites while restricting what can be moved.
HKLM\SOFTWARE\Policies\Microsoft\AppHVSI\AllowAppHVSI_ProviderSet:
  rationale: |-
    Application Guard isolates untrusted websites in a hardware-isolated container so that exploits cannot reach the host. Turning it on in managed mode for Microsoft Edge (value 1) protects users browsing untrusted sites.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Feeds\EnableFeeds:
  rationale: |-
    News and interests (Widgets feed) fetch content from Microsoft services and show it on the taskbar. This adds outbound traffic, user tracking and a channel for unwanted content without business value. Disabling the feed removes it.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Onedrive\DisableFileSyncNGSC:
  rationale: |-
    The OneDrive sync client lets users synchronize files with personal or unmanaged cloud storage. This can lead to data leakage outside the organization. Preventing its use is appropriate where OneDrive is not the approved storage solution.
HKLM\SOFTWARE\Policies\Microsoft\PushToInstall\DisablePushToInstall:
  rationale: |-
    Push to install lets apps purchased on another device or the Store web site be installed remotely on the device. This bypasses local software controls. Disabling it keeps software installation managed.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\Client\DisableCloudClipboardIntegration:
  rationale: |-
    Cloud clipboard integration in the Remote Desktop client can transfer clipboard contents from the remote session to the cloud clipboard and other devices. This can leak data from protected servers. Disabling it keeps remote session data out of cloud sync.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\DisablePasswordSaving:
  rationale: |-
    Saving passwords in the Remote Desktop client stores credentials on the client, from where malware or other users of the device can retrieve them. Disabling password saving forces users to enter credentials for each connection.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fDenyTSConnections:
  rationale: |-
    Remote Desktop exposes an interactive logon service over the network that is a frequent target of brute-force attacks and exploits. Denying Remote Desktop connections removes this attack surface on workstations that do not need to be administered via RDP.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\EnableUiaRedirection:
  rationale: |-
    UI Automation redirection allows applications in a remote session to control the client via UI Automation. A compromised server could use this to interact with the user's local desktop. Disabling the redirection maintains separation between server and client.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fDisableCcm:
  rationale: |-
    COM port redirection maps serial ports of the client into the remote session. This allows data transfer and device access across the session boundary. Disabling it reduces data leakage and attack paths from compromised servers or clients.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fDisableCdm:
  rationale: |-
    Drive redirection maps the client's local drives into the remote session. This allows files to be copied out of protected servers and malware to be introduced into them. Disabling it closes this data transfer channel.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fDisableLocationRedir:
  rationale: |-
    Location redirection passes the client's physical location to applications in the remote session. This is unnecessary for most server workloads and discloses information about users. Disabling it protects privacy.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fDisableLPT:
  rationale: |-
    LPT port redirection maps the client's parallel ports into the remote session, enabling data transfer and device access across the session boundary. Disabling it reduces this rarely needed channel.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fDisablePNPRedir:
  rationale: |-
    Plug and Play device redirection makes supported client devices such as phones and media players available in the remote session. This opens a path for data transfer and device-based attacks. Disabling it restricts the session to necessary resources.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fDisableWebAuthn:
  rationale: |-
    WebAuthn redirection lets the remote session use authenticators attached to the client, such as security keys and Windows Hello. A compromised server could abuse these requests. Disabling it is appropriate where users do not need to authenticate to web services from within the session.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fPromptForPassword:
  rationale: |-
    If saved credentials are accepted automatically, anyone with access to the client device can connect to the server. Always prompting for the password on connection ensures the user authenticates interactively each time.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fEncryptRPCTraffic:
  rationale: |-
    Requiring secure RPC communication ensures the Remote Desktop server only accepts encrypted and authenticated RPC traffic from clients. This protects session management traffic from eavesdropping and tampering.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\SecurityLayer:
  rationale: |-
    The legacy RDP security layer does not authenticate the server and uses weaker encryption, which allows man-in-the-middle attacks. Requiring the SSL/TLS security layer (value 2) authenticates the server with a certificate and protects the connection with TLS.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\UserAuthentication:
  rationale: |-
    Network Level Authentication requires users to authenticate before a full Remote Desktop session is created. This protects the server from resource exhaustion and pre-authentication exploits and hides the logon screen from unauthenticated users.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\MinEncryptionLevel:
  rationale: |-
    Remote Desktop traffic carries keystrokes, including passwords, and screen contents. Setting the client connection encryption level to High (value 3) ensures strong encryption is used for all data between client and server.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\MaxIdleTime:
  rationale: |-
    Idle Remote Desktop sessions keep a logged-on session available on the server, which an attacker with access to the client could use. Limiting active but idle sessions to 15 minutes reduces this exposure and frees resources.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\MaxDisconnectionTime:
  rationale: |-
    Disconnected Remote Desktop sessions continue to run with the user's credentials and open applications and can be hijacked or reconnected. Ending disconnected sessions after one minute limits this exposure.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\DeleteTempDirsOnExit:
  rationale: |-
    Temporary folders of Remote Desktop sessions can contain copies of sensitive documents and data. Deleting them when the session ends prevents this data from remaining on the server.
HKLM\SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds\DisableEnclosureDownload:
  rationale: |-
    RSS feed enclosures are files attached to feed items that can be downloaded automatically. Automatic downloads of untrusted content can introduce malware. Preventing enclosure downloads requires users to obtain such files deliberately.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\AllowCloudSearch:
  rationale: |-
    Cloud search includes content from the user's cloud accounts in Windows Search and sends search queries to cloud services. Disabling it prevents mixing of cloud and local data and keeps search queries internal.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\AllowCortana:
  rationale: |-
    Cortana processes voice and typed requests in Microsoft cloud services and can access user data such as calendar and email. Disabling it reduces data sharing and the attack surface on managed systems.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\AllowCortanaAboveLock:
  rationale: |-
    Cortana above the lock screen lets anyone interact with the assistant without unlocking the device, which can disclose information or trigger actions. Disabling it requires authentication first.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\AllowIndexingEncryptedStoresOrItems:
  rationale: |-
    Indexing encrypted files stores their content in the search index, which may not be protected the same way as the encrypted files. Disallowing indexing of encrypted items prevents sensitive content from leaking through the index.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\AllowSearchToUseLocation:
  rationale: |-
    Allowing search to use location sends the device's location to search services. This is unnecessary and discloses information about the user's whereabouts. Disabling it protects privacy.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\EnableDynamicContentInWSB:
  rationale: |-
    Search highlights display dynamic content from Microsoft services in the search box and search home. This adds outbound connections and content not controlled by the organization. Disabling it keeps the search interface local.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\CurrentVersion\Software Protection Platform\NoGenTicket:
  rationale: |-
    The KMS client online validation (AVS) sends activation data to Microsoft. Turning it off prevents this unnecessary data transfer from managed systems.
HKLM\SOFTWARE\Policies\Microsoft\WindowsStore\DisableStoreApps:
  rationale: |-
    Store apps can introduce unvetted software and data flows on managed systems. This value configures the policy so that apps from the Microsoft Store are disabled from running on the device, keeping the application landscape under administrative control.
HKLM\SOFTWARE\Policies\Microsoft\WindowsStore\RequirePrivateStoreOnly:
  rationale: |-
    Restricting the Store to the private store shows only apps approved by the organization. This prevents users from installing arbitrary public Store apps while still allowing distribution of vetted applications.
HKLM\SOFTWARE\Policies\Microsoft\WindowsStore\AutoDownload:
  rationale: |-
    Store apps must receive updates to fix security issues. Keeping automatic download and installation of Store app updates on (value 4) ensures installed apps stay patched.
HKLM\SOFTWARE\Policies\Microsoft\WindowsStore\DisableOSUpgrade:
  rationale: |-
    The Store can offer upgrades to the latest Windows version. On managed systems, operating system upgrades should be planned and tested. Turning off the offer prevents uncontrolled upgrades by users.
HKLM\SOFTWARE\Policies\Microsoft\WindowsStore\RemoveWindowsStore:
  rationale: |-
    Removing the Store application prevents users from installing apps from the public Microsoft Store. This keeps the software inventory under administrative control and reduces exposure to unvetted applications.
HKLM\SOFTWARE\Policies\Microsoft\Dsh\AllowNewsAndInterests:
  rationale: |-
    Widgets (news and interests) fetch content from Microsoft services and display it on the device. This adds outbound connections, tracking and content outside organizational control without business value. Disabling it removes the feature.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WTDS\Components\CaptureThreatWindow:
  rationale: |-
    Enhanced Phishing Protection can capture information about a detected phishing attempt, such as the window content, for analysis. Enabling automatic data collection helps security teams investigate and respond to credential phishing.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WTDS\Components\NotifyMalicious:
  rationale: |-
    Enhanced Phishing Protection detects when a user enters their Windows password on a malicious site or app. Notifying the user immediately allows them to change the password before it is abused.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WTDS\Components\NotifyPasswordReuse:
  rationale: |-
    Reusing the Windows password on other sites means a breach elsewhere exposes the corporate account. Notifying the user when password reuse is detected encourages them to use unique passwords.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WTDS\Components\NotifyUnsafeApp:
  rationale: |-
    Typing passwords into unsafe apps such as text editors leaves them in files that can be stolen. Warning users when they type their password into such apps reduces this exposure.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WTDS\Components\ServiceEnabled:
  rationale: |-
    Enhanced Phishing Protection in Microsoft Defender SmartScreen watches for the Windows password being entered in phishing sites and unsafe places. Enabling the service is the prerequisite for its warnings and reports.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\EnableSmartScreen:
  rationale: |-
    Windows Defender SmartScreen checks downloaded files and applications against reputation data and warns or blocks before unknown or malicious software runs. Enabling it in Explorer provides protection against malware delivered through downloads.
HKLM\SOFTWARE\Policies\Microsoft\Windows\System\ShellSmartScreenLevel:
  rationale: |-
    If SmartScreen only warns, users can bypass the warning and run a malicious program. Setting the level to Block (warn and prevent bypass) ensures that files identified as malicious or unrecognized cannot be started from the warning.
HKLM\SOFTWARE\Policies\Microsoft\Windows\GameDVR\AllowGameDVR:
  rationale: |-
    Game recording and broadcasting captures screen content and can transmit it. On managed systems this feature has no business purpose and could record or leak sensitive information. Disabling it removes this capability.
HKLM\SOFTWARE\Microsoft\Policies\PassportForWork\Biometrics\EnableESSwithSupportedPeripherals:
  rationale: |-
    Enhanced Sign-in Security isolates biometric data and matching in virtualization-based security. Enabling it for supported peripherals ensures only secure biometric devices are used for Windows Hello, protecting against tampering with biometric sign-in.
HKLM\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace\AllowSuggestedAppsInWindowsInkWorkspace:
  rationale: |-
    Suggested apps in Windows Ink Workspace promote Store apps to users. Disabling the suggestions prevents users from being guided to install unvetted software.
HKLM\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace\AllowWindowsInkWorkspace:
  rationale: |-
    Windows Ink Workspace can be launched from the lock screen. Allowing it only after sign-in (value 1) prevents unauthenticated users from accessing it while keeping the feature for logged-on users.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Installer\EnableUserControl:
  rationale: |-
    User control over installs lets users change installation options normally reserved for administrators, including bypassing some security restrictions of Windows Installer. Disabling it keeps installations within the administrator-defined limits.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Installer\AlwaysInstallElevated:
  rationale: |-
    When AlwaysInstallElevated is enabled, any user can install an MSI package with SYSTEM privileges, a well-known privilege escalation path. Keeping it disabled ensures installation packages run with the user's own rights.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Installer\SafeForScripting:
  rationale: |-
    Windows Installer scripts started from Internet Explorer normally trigger a security prompt. Suppressing that prompt allows web pages to start installations without user awareness. Keeping the prompt enabled preserves the warning.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableMPR:
  rationale: |-
    Multiple Provider Router notifications send the user's credentials to registered network providers at logon. A malicious network provider DLL can capture passwords in clear text this way. Disabling MPR notifications prevents this credential exposure.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableAutomaticRestartSignOn:
  rationale: |-
    Automatic restart sign-on uses stored credentials to sign in and lock the last user after a restart, for example after updates. The credentials are kept in a form that can potentially be recovered, and the machine is signed in without the user being present. Disabling it prevents this.
HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging\EnableScriptBlockLogging:
  rationale: |-
    PowerShell script block logging records the code of scripts as they are executed, including deobfuscated content. This gives defenders visibility into malicious PowerShell use, which is common in attacks. The log may contain sensitive data and must be protected accordingly.
HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription\EnableTranscripting:
  rationale: |-
    PowerShell transcription records the input and output of PowerShell sessions to text files. This creates an audit trail of administrative and malicious activity. Transcript files must be protected because they may contain sensitive information.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Winrm\Client\AllowBasic:
  rationale: |-
    Basic authentication sends credentials in an easily decoded form. Disabling it for the WinRM client prevents credentials from being exposed when connecting to remote systems.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Winrm\Client\AllowUnencryptedTraffic:
  rationale: |-
    Unencrypted WinRM traffic exposes commands, output and possibly credentials to eavesdroppers. Disabling unencrypted traffic for the WinRM client ensures remote management sessions are encrypted.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Winrm\Client\AllowDigest:
  rationale: |-
    Digest authentication is weaker than Kerberos or NTLM and susceptible to offline attacks. Disabling Digest for the WinRM client forces the use of stronger authentication protocols.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Winrm\Service\AllowBasic:
  rationale: |-
    Basic authentication sends credentials in an easily decoded form. Disabling it for the WinRM service prevents clients from authenticating with exposed credentials.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Winrm\Service\AllowAutoConfig:
  rationale: |-
    Automatic configuration of WinRM listeners makes the remote management service listen for requests, enlarging the remote attack surface. Disabling it ensures WinRM is only enabled where it is deliberately configured.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Winrm\Service\AllowUnencryptedTraffic:
  rationale: |-
    Unencrypted WinRM traffic exposes commands, output and possibly credentials to eavesdroppers. Disabling unencrypted traffic for the WinRM service ensures it only accepts encrypted sessions.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Winrm\Service\DisableRunAs:
  rationale: |-
    RunAs credentials let WinRM plug-ins store user credentials and run with them. Stored credentials can be extracted or misused. Disallowing WinRM from storing RunAs credentials removes this risk.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Winrm\Service\Winrs\AllowRemoteShellAccess:
  rationale: |-
    Remote shell access (WinRS) lets remote users run commands on the system. Unless it is needed for administration, this provides an attack path for lateral movement. Disabling it removes remote command shells via WinRM.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Sandbox\AllowClipboardRedirection:
  rationale: |-
    Clipboard sharing with Windows Sandbox can move malicious content from the sandbox to the host or leak host data into the sandbox. Disabling clipboard redirection keeps the sandbox isolated.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Sandbox\AllowNetworking:
  rationale: |-
    Networking in Windows Sandbox lets untrusted code in the sandbox reach the network and possibly the internal network. Disabling it prevents code under test from communicating or spreading.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender Security Center\App and Browser protection\DisallowExploitProtectionOverride
: rationale: |-
    Exploit protection settings define mitigations for processes. If users can change them in Windows Security, they can weaken protections. Preventing users from modifying the settings keeps the centrally defined mitigations in place.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU\NoAutoRebootWithLoggedOnUsers:
  rationale: |-
    If automatic restarts are suppressed while users are logged on, installed updates may never be activated on machines that are rarely logged off. Allowing the restart ensures security updates take effect in a timely manner.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU\NoAutoUpdate:
  rationale: |-
    Automatic Updates keeps the system supplied with security fixes. Disabling it leaves known vulnerabilities unpatched. The check ensures Automatic Updates is not turned off by policy.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU\ScheduledInstallDay:
  rationale: |-
    Scheduling update installation for every day (value 0) means updates are installed as soon as possible after release instead of waiting for a weekly slot. This shortens the window during which known vulnerabilities remain exploitable.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AllowTemporaryEnterpriseFeatureControl:
  rationale: |-
    Features introduced in servicing updates that are off by default have not yet been broadly released and tested. Keeping them disabled reduces the risk of introducing untested functionality and new vulnerabilities on managed systems.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\SetDisablePauseUXAccess:
  rationale: |-
    Users who can pause Windows updates can delay security fixes for weeks. Removing access to the pause option ensures updates continue to be installed on schedule.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\ManagePreviewBuildsPolicyValue:
  rationale: |-
    Preview builds are pre-release versions of Windows that are less tested and may contain security issues. Managing preview builds so that devices do not receive them keeps systems on supported production releases.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\DeferFeatureUpdates:
  rationale: |-
    Deferring feature updates gives administrators time to test new Windows versions before they are deployed. Enabling the deferral policy prevents untested feature updates from being installed immediately on managed systems.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\DeferQualityUpdates:
  rationale: |-
    This policy controls how long quality updates are deferred. It is enabled so the deferral period is defined centrally; combined with a deferral of 0 days, security fixes are installed without delay.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\DeferQualityUpdatesPeriodInDays:
  rationale: |-
    Quality updates contain security fixes. A deferral period of 0 days ensures they are installed as soon as they are offered, minimizing the time known vulnerabilities remain exploitable.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AllowOptionalContent:
  rationale: |-
    Optional updates contain non-security fixes and features that are not yet broadly released. This value must not be present so that optional content is not automatically received and devices stay on the tested, generally available update level.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\SetAllowOptionalContent:
  rationale: |-
    Optional updates contain preview fixes and features that have not been broadly validated. Setting the policy so that optional updates are not installed automatically keeps managed devices on the tested update level.
HKU\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications\NoToastApplicationNotificationOnLockScreen:
  rationale: |-
    Toast notifications on the lock screen can display message content, calendar entries and other information to anyone near the device. Turning them off for every user prevents information disclosure while the device is locked. The check verifies the per-user policy in all loaded user profiles.
HKU\SOFTWARE\Policies\Microsoft\Assistance\Client\1.0\NoImplicitFeedback:
  rationale: |-
    The Help Experience Improvement Program collects information about how users use Windows Help and sends it to Microsoft. Turning it off for every user prevents this unnecessary data transfer. The check verifies the per-user policy in all loaded user profiles.
HKU\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\SaveZoneInformation:
  rationale: |-
    Windows records the zone an attachment came from (for example the Internet) so that later warnings and protections such as Mark of the Web apply. If users could remove this information, downloaded files would be treated as trusted. Keeping zone information preserved (value 2) maintains these protections for every loaded profile.
HKU\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\ScanWithAntiVirus:
  rationale: |-
    Attachment Manager can call the registered antivirus program to scan files when they are opened from email or the Internet. Enabling this for every user (value 3) ensures attachments are scanned before they are opened. The check verifies the per-user policy in all loaded profiles.
HKU\SOFTWARE\Policies\Microsoft\Windows\CloudContent\ConfigureWindowsSpotlight:
  rationale: |-
    Windows Spotlight downloads images, suggestions and promotional content from Microsoft to the lock screen and desktop. Turning it off (value 2) for every user removes this cloud-driven content and its outbound connections. The check verifies all loaded user profiles.
HKU\SOFTWARE\Policies\Microsoft\Windows\CloudContent\DisableThirdPartySuggestions:
  rationale: |-
    Third-party suggestions in Windows Spotlight show content and app recommendations from other publishers. These can steer users to unvetted software. Disabling them for every user keeps the interface free of external promotions.
HKU\SOFTWARE\Policies\Microsoft\Windows\CloudContent\DisableTailoredExperiencesWithDiagnosticData:
  rationale: |-
    Tailored experiences use diagnostic data to personalize tips, ads and recommendations. This implies profiling based on usage data. Disabling tailored experiences for every user limits how diagnostic data is used.
HKU\SOFTWARE\Policies\Microsoft\Windows\CloudContent\DisableWindowsSpotlightFeatures:
  rationale: |-
    Windows Spotlight features display content and suggestions from Microsoft on the lock screen, in Action Center and in other places. Turning all Spotlight features off for every user prevents this cloud-driven content and its data flows.
HKU\SOFTWARE\Policies\Microsoft\Windows\CloudContent\DisableSpotlightCollectionOnDesktop:
  rationale: |-
    Spotlight collection on the desktop downloads background images and information from Microsoft and links to web content. Disabling it for every user removes this outbound content and keeps the desktop under administrative control.
HKU\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoInplaceSharing:
  rationale: |-
    In-place sharing lets users share files from their profile with other users directly in Explorer, which can expose confidential documents to colleagues without authorization. Preventing it for every user keeps file sharing under controlled mechanisms.
HKU\SOFTWARE\Policies\Microsoft\Windows\WindowsCopilot\TurnOffWindowsCopilot:
  rationale: |-
    Windows Copilot processes user prompts and possibly on-screen and document content in cloud AI services. This can move confidential information outside the organization. Turning it off for every user is appropriate until its use has been approved and governed.
HKU\SOFTWARE\Policies\Microsoft\Windows\Installer\AlwaysInstallElevated:
  rationale: |-
    When AlwaysInstallElevated is enabled, any user can install MSI packages with SYSTEM privileges, a well-known privilege escalation path. The per-user value must be 0 in every loaded profile; the escalation only works when both the per-user and the computer value are enabled, and both are checked.
HKU\SOFTWARE\Policies\Microsoft\WindowsMediaPlayer\PreventCodecDownload:
  rationale: |-
    Windows Media Player can automatically download codecs from the Internet. Codecs are executable components; automatic downloads may install untested or malicious code. Preventing codec downloads for every user keeps such installations under administrative control.
PrivilegeRights.SeReLabelPrivilege:
  rationale: |-
    Modify an object label lets the holder change the integrity level of objects owned by others, for example to lower protections on files or processes. Nobody needs this right in normal operation; leaving it unassigned prevents its misuse to undermine Mandatory Integrity Control.
HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\RequireSecuritySignature:
  rationale: |-
    SMB signing protects SMB traffic against tampering and relay attacks. Requiring signing on the SMB client ensures it only communicates with servers that sign packets, preventing man-in-the-middle and NTLM relay attacks.
HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\EnableSecuritySignature:
  rationale: |-
    Enabling SMB signing on the client makes it sign packets whenever the server agrees. This protects SMB sessions against tampering and relay attacks where signing cannot yet be required.
HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\EnablePlainTextPassword:
  rationale: |-
    Sending unencrypted passwords to third-party SMB servers exposes credentials in clear text on the network. Disabling this makes the client refuse to fall back to plaintext password authentication.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0\AuditReceivingNTLMTraffic:
  rationale: |-
    Auditing incoming NTLM traffic records which clients and accounts still authenticate with NTLM. This visibility is needed to reduce NTLM use, which is vulnerable to relay and pass-the-hash attacks. Value 2 enables auditing for all accounts.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0\RestrictSendingNTLMTraffic:
  rationale: |-
    Auditing outgoing NTLM traffic logs connections where the system authenticates to remote servers with NTLM. This identifies dependencies on NTLM before it is restricted and helps detect misuse. Value 1 audits all outgoing NTLM authentication.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ShutdownWithoutLogon:
  rationale: |-
    If the shutdown button is available on the sign-in screen, anyone with physical access can shut down the system without authenticating, causing a denial of service for a server. Disabling it restricts shutdown to logged-on users with the necessary right.
HKLM\SOFTWARE\Wow6432Node\Microsoft\Cryptography\Wintrust\Config\EnableCertPaddingCheck:
  rationale: |-
    Without the certificate padding check, Windows accepts Authenticode signatures with extra data appended to signed files, letting attackers modify signed executables without invalidating the signature. Enabling strict validation closes this loophole (CVE-2013-3900). This value covers 32-bit applications on 64-bit Windows.
HKLM\SYSTEM\CurrentControlSet\Services\TCPIP6\Parameters\DisableIPSourceRouting:
  rationale: |-
    IP source routing lets the sender specify the route of a packet, which can be used to bypass network controls and spoof traffic. Setting the highest protection (value 2) makes the system drop all source-routed IPv6 packets.
HKLM\SYSTEM\CurrentControlSet\Services\TCPIP6\Parameters\TcpMaxDataRetransmissions:
  rationale: |-
    TCP retransmissions for unacknowledged data keep resources tied up for connections that are not progressing. Limiting the number of retransmissions to 3 reduces the time half-dead IPv6 connections persist, lessening the impact of some denial-of-service conditions.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient\EnableMDNS:
  rationale: |-
    Multicast DNS answers name queries on the local network without authentication. Attackers on the same network can respond to such queries and redirect connections to capture credentials. Disabling mDNS removes this spoofing vector.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient\DisableIPv6DefaultDnsServers:
  rationale: |-
    Windows can fall back to well-known site-local IPv6 DNS server addresses when no DNS server is configured. An attacker on the local network could claim these addresses and answer DNS queries. Disabling the default IPv6 DNS servers prevents this kind of DNS spoofing.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation\AllowInsecureGuestAuth:
  rationale: |-
    Insecure guest logons let the SMB client connect to servers with a guest account without authentication. Such connections are not signed or authenticated and can be spoofed by an attacker. Disabling them makes the client refuse unauthenticated SMB guest access.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD\AllowLLTDIOOnDomain:
  rationale: |-
    The Link-Layer Topology Discovery mapper discovers devices and network topology. Allowing it to operate on domain networks exposes topology information and an additional network protocol. Disabling it reduces the attack surface.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD\AllowLLTDIOOnPublicNet:
  rationale: |-
    The Link-Layer Topology Discovery mapper discovers devices and network topology. Operating it on public networks exposes the device to untrusted hosts. Disabling it reduces the attack surface.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD\EnableLLTDIO:
  rationale: |-
    The LLTD mapper I/O driver discovers other devices and the network topology. It is rarely needed on servers and adds a network protocol that can be misused for reconnaissance. Turning it off reduces the attack surface.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD\ProhibitLLTDIOOnPrivateNet:
  rationale: |-
    This value is part of the configuration that turns off the LLTD mapper I/O driver. Together with the other LLTD values it ensures the topology discovery protocol is not used on any network type, reducing network reconnaissance and attack surface.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD\AllowRspndrOnDomain:
  rationale: |-
    The LLTD responder lets the computer be discovered and appear in network maps. Allowing it on domain networks discloses the device and its properties. Disabling it reduces information available for reconnaissance.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD\AllowRspndrOnPublicNet:
  rationale: |-
    The LLTD responder lets the computer be discovered and appear in network maps. Allowing it on public networks discloses the device to untrusted hosts. Disabling it reduces the attack surface.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD\EnableRspndr:
  rationale: |-
    The LLTD responder answers topology discovery requests from other computers. It is rarely needed on servers and discloses information about the device. Turning it off reduces network reconnaissance and attack surface.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD\ProhibitRspndrOnPrivateNet:
  rationale: |-
    This value is part of the configuration that turns off the LLTD responder. Together with the other LLTD values it ensures the system does not answer topology discovery requests on any network type.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Kernel DMA Protection\DeviceEnumerationPolicy:
  rationale: |-
    External devices with direct memory access, such as Thunderbolt peripherals, can read and modify system memory to steal keys or bypass sign-in. Blocking devices that are incompatible with Kernel DMA Protection (value 0) prevents them from operating until DMA remapping can protect the system.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI\EnumerateAdministrators:
  rationale: |-
    When elevation prompts list administrator accounts, a standard user learns the names of privileged accounts and can try to guess their passwords. Disabling enumeration requires the user to type both name and password, which hides privileged account names.
HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableLocalArchiveMalwareScanOverride:
  rationale: |-
    The local archive malware scan override lets winget install packages from local archives without a malware scan. Disabling the override ensures archives are scanned before installation.
HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableBypassCertificatePinningForMicrosoftStore:
  rationale: |-
    Certificate pinning for the Microsoft Store source protects winget against man-in-the-middle attacks on the package source. Disallowing the bypass keeps the pinning check active.
HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableWindowsPackageManagerCommandLineInterfaces:
  rationale: |-
    The Windows Package Manager command line interfaces let users and scripts install software from configured sources. On servers this bypasses software approval and change control. Disabling them keeps software installation under administrative control.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer\DisableMotWOnInsecurePathCopy:
  rationale: |-
    Mark of the Web marks files from untrusted sources so that SmartScreen, Office Protected View and other protections apply. If the mark is not applied to files copied from insecure locations, such files escape these checks. Keeping it applied (value 0) preserves the protections.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Features\PassiveRemediation:
  rationale: |-
    EDR in block mode lets Microsoft Defender for Endpoint remediate malicious artifacts detected by behavioral sensors even when Defender Antivirus runs in passive mode or the primary antivirus misses them. Enabling it adds a second line of defense.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\NIS\EnableConvertWarnToBlock:
  rationale: |-
    Network protection may only warn users about suspicious network destinations, and users can ignore the warning. Converting warn verdicts to block prevents connections to such destinations entirely.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection\OobeEnableRtpAndSigUpdate:
  rationale: |-
    During the out-of-box experience the system may be online before protection is fully configured. Enabling real-time protection and security intelligence updates during OOBE protects the system from the first moments of operation.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Brute Force Protection\BruteForceProtectionAggressiveness
: rationale: |-
    Brute-force protection in Microsoft Defender detects and blocks repeated authentication attempts against network services such as RDP and SMB. Setting the aggressiveness to medium (value 1) balances detection of password guessing with avoiding blocks of legitimate clients.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Brute Force Protection\BruteForceProtectionConfiguredState
: rationale: |-
    Brute-force protection in Microsoft Defender detects repeated failed authentication attempts over the network and blocks the offending sources. Setting it to block mode (value 1) actively stops password guessing attacks rather than only reporting them.
? HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Remote Encryption Protection\RemoteEncryptionProtectionAggressiveness
: rationale: |-
    Remote encryption protection detects attempts by a remote compromised host to encrypt files on the system's shares, as ransomware does, and blocks the attacking source. Setting the aggressiveness to medium (value 1) enables this protection with balanced sensitivity.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan\QuickScanIncludeExclusions:
  rationale: |-
    Files and folders excluded from real-time scanning are a favorite hiding place for malware. Including exclusions in quick scans ensures these locations are still checked periodically.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan\DaysUntilAggressiveCatchupQuickScan:
  rationale: |-
    If scheduled quick scans are missed, for example because the system was busy or offline, threats may remain undetected. Forcing a catch-up quick scan after seven days ensures the system is scanned at least that often.
HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\HideExclusionsFromLocalUsers:
  rationale: |-
    Antivirus exclusions tell an attacker exactly where malware will not be scanned. Hiding the exclusion list from local users, including local administrators, removes this information from easy reach.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fSingleSessionPerUser:
  rationale: |-
    Allowing multiple Remote Desktop sessions per user makes it harder to track activity and leaves forgotten sessions running. Restricting each user to a single session simplifies auditing and reduces abandoned sessions.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\PerSessionTempDir:
  rationale: |-
    Without per-session temporary folders, temporary files of different Remote Desktop sessions could be shared and accessed by other users. Separate temporary folders per session keep each user's temporary data isolated.
HKLM\SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds\AllowBasicAuthInClear:
  rationale: |-
    Basic authentication over HTTP sends credentials in a reversible form without encryption. Disallowing it for RSS feeds prevents credentials from being exposed when feeds are fetched.
HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\ManagePreviewBuilds:
  rationale: |-
    Preview builds are pre-release versions of Windows that are less tested and may contain security issues. Enabling the management of preview builds lets policy prevent devices from receiving them.
HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\ForceUnlockLogon:
  rationale: |-
    Cached credentials allow a domain member to be unlocked without contacting a domain controller, so a disabled or changed account may still unlock a locked session. Requiring domain controller authentication to unlock ensures the account status is checked. The check applies only to member servers.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\BackupDirectory:
  rationale: |-
    Windows LAPS manages unique, regularly rotated passwords for the local administrator account, preventing a single shared password from enabling lateral movement. This value defines where passwords are backed up; the check expects value 1. It applies only to member servers.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\PasswordExpirationProtectionEnabled:
  rationale: |-
    If the local password expiration can be set longer than the policy allows, managed passwords may remain unchanged far beyond their intended lifetime. Enabling expiration protection enforces the configured maximum password age for LAPS-managed accounts. Applies to member servers.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\ADPasswordEncryptionEnabled:
  rationale: |-
    LAPS passwords stored in Active Directory are readable by anyone with access to the attribute. Encrypting them ensures only authorized principals can decrypt the local administrator password. Applies to member servers.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\PasswordComplexity:
  rationale: |-
    Complex passwords are much harder to guess or brute-force. Requiring uppercase, lowercase, numbers and special characters (value 4) for LAPS-generated passwords maximizes their strength. Applies to member servers.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\PasswordLength:
  rationale: |-
    Password length is the most important factor for resistance against brute-force attacks. Requiring LAPS-generated passwords of 15 characters makes guessing or cracking the local administrator password impractical. Applies to member servers.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\PasswordAgeDays:
  rationale: |-
    Regularly rotating the local administrator password limits how long a disclosed password can be used. A maximum age of 30 days for LAPS-managed passwords keeps the exposure window short. Applies to member servers.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\PostAuthenticationResetDelay:
  rationale: |-
    After someone uses the LAPS-managed account, its password is known to that person or may have been captured. The grace period of 8 hours defines when the post-authentication action, such as a password reset, is carried out. Applies to member servers.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\PostAuthenticationActions:
  rationale: |-
    Once the LAPS-managed account has been used, the password should be changed and the session ended so the known password cannot be reused. Value 3 resets the password and logs off the managed account after the grace period. Applies to member servers.
PrivilegeRights.SeMachineAccountPrivilege:
  rationale: |-
    Add workstations to domain lets the holder join computers to the domain and thus create computer accounts. By default authenticated users may add a limited number of machines, which attackers use to create accounts for relay and delegation attacks. Restricting the right to Administrators on domain controllers prevents this.
PrivilegeRights.SeSyncAgentPrivilege:
  rationale: |-
    Synchronize directory service data allows reading all directory data regardless of permissions, which is the basis of attacks that copy password hashes from a domain controller. Nobody needs this right by default; leaving it unassigned on domain controllers prevents its misuse.
HKLM\SYSTEM\CurrentControlSet\Control\Lsa\SubmitControl:
  rationale: |-
    Allowing Server Operators to schedule tasks on domain controllers lets members of that group run code as SYSTEM, effectively granting domain admin privileges. Disabling it closes this privilege escalation path.
HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\VulnerableChannelAllowList:
  rationale: |-
    The allow list for vulnerable Netlogon secure channel connections exempts listed accounts from the secure RPC enforcement introduced against Zerologon (CVE-2020-1472). Exempted accounts can be used to take over the domain. Leaving the allow list unconfigured keeps all connections protected.
HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters\LdapEnforceChannelBinding:
  rationale: |-
    LDAP channel binding ties LDAP authentication over TLS to the TLS channel, preventing attackers from relaying credentials into LDAPS sessions. Requiring it always (value 2) on domain controllers blocks such relay attacks; older clients that do not support channel binding must be updated first.
HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters\LDAPServerIntegrity:
  rationale: |-
    Unsigned LDAP binds can be intercepted and modified or relayed by an attacker on the network. Requiring LDAP signing on domain controllers (value 2) rejects unsigned simple and SASL binds that are not protected by TLS.
HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\RefusePasswordChange:
  rationale: |-
    Computer account passwords are rotated automatically to limit the use of a compromised machine credential. If domain controllers refuse machine account password changes, those passwords never change. Keeping the setting disabled allows regular rotation.
HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\AuditNTLMInDomain:
  rationale: |-
    Auditing NTLM authentication in the domain records which servers and accounts still use NTLM. This information is needed to reduce NTLM, which is vulnerable to relay and pass-the-hash attacks. Value 7 enables auditing for all accounts on domain controllers.
AuditPolicy.Kerberos Authentication Service:
  rationale: |-
    Kerberos ticket-granting ticket requests show which accounts authenticate and from where, and failures reveal password guessing and attacks such as AS-REP roasting. Auditing success and failure of the Kerberos Authentication Service on domain controllers provides this visibility.
AuditPolicy.Kerberos Service Ticket Operations:
  rationale: |-
    Kerberos service ticket requests reveal which services accounts access. Their audit trail helps detect attacks such as Kerberoasting and the use of forged tickets. Auditing success and failure on domain controllers provides this visibility.
AuditPolicy.Computer Account Management:
  rationale: |-
    Creating, changing or deleting computer accounts can be used to add rogue machines or prepare delegation attacks. Auditing successful computer account management on domain controllers records these changes.
AuditPolicy.Distribution Group Management:
  rationale: |-
    Changes to distribution groups can be used to receive mail intended for others or to alter group membership unnoticed. Auditing successful distribution group management on domain controllers records these changes.
AuditPolicy.Other Account Management Events:
  rationale: |-
    Other account management events include access to password hashes and changes to password policy. Auditing successful events in this subcategory on domain controllers helps detect credential theft and policy tampering.
AuditPolicy.Directory Service Access:
  rationale: |-
    Directory Service Access auditing records access to Active Directory objects that have audit entries configured. Failed access attempts can indicate reconnaissance or attempts to read protected data. Auditing failures (success is optional) on domain controllers provides this visibility.
AuditPolicy.Directory Service Changes:
  rationale: |-
    Directory Service Changes auditing records creations, modifications and deletions of Active Directory objects, including old and new values. Auditing successful changes on domain controllers creates the trail needed to detect unauthorized modifications such as added privileges.
HKLM\SYSTEM\CurrentControlSet\Services\Ldap\LDAPClientConfidentiality:
  rationale: |-
    LDAP traffic that is not encrypted exposes directory queries and results to eavesdroppers. Configuring the LDAP client to negotiate sealing (value 1) makes it encrypt LDAP sessions whenever the server supports it.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanServer\MinSmb2Dialect:
  rationale: |-
    Older SMB dialects lack modern protections such as pre-authentication integrity and strong encryption. Requiring at least SMB 3.1.1 (value 785, 0x311) on the SMB server rejects connections using older, weaker dialects; older clients will no longer be able to connect.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation\RequireEncryption:
  rationale: |-
    Unencrypted SMB traffic exposes file content and metadata to eavesdroppers. Requiring encryption on the SMB client ensures it only connects to servers that encrypt the session; servers that do not support SMB encryption become unreachable.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\SAM\SamNGCKeyROCAValidation:
  rationale: |-
    Some TPMs generated weak RSA keys (ROCA, CVE-2017-15361) whose private key can be computed from the public key. Validating Windows Hello for Business keys against this weakness on domain controllers detects (value 1, audit) authentication with such vulnerable keys.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanServer\AuditClientDoesNotSupportEncryption:
  rationale: |-
    Auditing clients that do not support SMB encryption shows which systems would be affected when encryption is required. This information is needed to plan stricter SMB settings without breaking access.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanServer\AuditClientDoesNotSupportSigning:
  rationale: |-
    Auditing clients that do not support SMB signing identifies systems that are vulnerable to relay and tampering attacks. This is needed to enforce signing without disrupting legitimate access.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanServer\AuditInsecureGuestLogon:
  rationale: |-
    Insecure guest logons to SMB are unauthenticated and can be abused. Auditing them on the SMB server shows where such logons still occur so that they can be eliminated.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanServer\EnableAuthRateLimiter:
  rationale: |-
    Without rate limiting, attackers can make rapid password guesses against SMB. The authentication rate limiter delays responses after failed NTLM or PKU2U authentications, greatly slowing brute-force attacks.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Bowser\EnableMailslots:
  rationale: |-
    Remote mailslots are a legacy, unauthenticated communication mechanism used by the Computer Browser service and old applications. They are rarely needed and add an attack surface. Disabling them removes this legacy protocol.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanServer\InvalidAuthenticationDelayTimeInMs:
  rationale: |-
    The delay applied after an invalid SMB authentication attempt slows down password guessing. A delay of 2000 milliseconds makes large-scale brute-force attacks impractical while barely affecting legitimate users who mistype a password.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation\AuditInsecureGuestLogon:
  rationale: |-
    Insecure guest logons from the SMB client to servers are unauthenticated and susceptible to spoofing. Auditing them on the client shows where such connections still occur so they can be eliminated.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation\AuditServerDoesNotSupportEncryption:
  rationale: |-
    Auditing servers that do not support SMB encryption shows which file servers would become unreachable when the client requires encryption. This information is needed to tighten SMB settings safely.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation\AuditServerDoesNotSupportSigning:
  rationale: |-
    Auditing servers that do not support SMB signing identifies connections that are vulnerable to tampering and relay attacks. This helps plan enforcement of signing on the client.
HKLM\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\EnableMailslots:
  rationale: |-
    Mailslots are a legacy, unauthenticated communication mechanism. Disabling them in the network provider removes this outdated protocol and its attack surface; very old applications that rely on mailslots may stop working.
HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation\MinSmb2Dialect:
  rationale: |-
    Older SMB dialects lack modern protections such as pre-authentication integrity and strong encryption. Requiring at least SMB 3.1.1 (value 785, 0x311) on the SMB client prevents downgrade to weaker dialects; servers that do not support SMB 3.1.1 become unreachable.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\WPP\WindowsProtectedPrintGroupPolicyState:
  rationale: |-
    The print spooler and third-party printer drivers have been a frequent source of privilege escalation and remote code execution. Windows protected print mode allows only modern inbox print drivers and runs printing with reduced privileges, shrinking this attack surface.
HKLM\SOFTWARE\Policies\Microsoft\Netlogon\Parameters\BlockNetbiosDiscovery:
  rationale: |-
    NetBIOS-based domain controller discovery relies on unauthenticated broadcast name resolution that can be spoofed by an attacker on the local network. Blocking it makes the DC locator use DNS only.
HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\SAM\SamrChangeUserPasswordApiPolicy:
  rationale: |-
    The legacy SamrChangeUserPassword RPC method changes passwords with weak cryptographic protection (RC4-based). Restricting this method prevents password changes over the weak protocol. The expected value depends on the server role: value 1 on standalone and member servers, value 2 on domain controllers.
HKLM\SOFTWARE\Policies\Microsoft\Windows\Appx\DisablePerUserUnsignedPackagesByDefault:
  rationale: |-
    Unsigned app packages have no verified publisher and may be tampered with. Disallowing per-user installation of unsigned packages by default prevents users from installing such packages without explicit approval.
HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\SCClipLevel:
  rationale: |-
    Clipboard transfer from the Remote Desktop server to the client allows data to be copied out of protected servers. Disabling clipboard transfer from server to client (value 0) prevents this data leakage channel.
HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters\LDAPServerForceIntegrity:
  rationale: |-
    LDAP signing protects binds against interception and relay. Enforcing LDAP server signing on domain controllers makes the signing requirement apply regardless of other LDAP signing configuration, so unsigned binds are rejected.
