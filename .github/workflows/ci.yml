name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        if: runner.os == 'Linux'
        run: make lint
      - name: Test
        run: go test ./...
      - name: Example pages are up to date
        if: runner.os == 'Linux'
        run: |
          go run ./tools/gendocs
          git diff --exit-code -- docs/examples mkdocs.yml

  linux-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run all examples in Linux containers
        run: test/linux/run.sh
