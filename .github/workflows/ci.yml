name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        if: runner.os == 'Linux'
        run: make lint
      - name: Test
        run: go test ./...
      - name: Example pages are up to date
        if: runner.os == 'Linux'
        run: |
          go run ./tools/gendocs
          git diff --exit-code -- docs/examples docs/cis mkdocs.yml

  linux-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run all examples in Linux containers
        run: test/linux/run.sh

  cis-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run every CIS policy in a container of its platform
        run: test/linux/run-cis.sh
      - name: Run the PostgreSQL policy against hardened servers
        run: test/linux/cis-postgres.sh
      - name: Run the Apache policy against hardened servers
        run: test/linux/cis-apache.sh
      - name: Detect planted ATT&CK artifacts
        run: test/linux/attack-sim.sh
      - name: Run the service policies against real and hardened services
        run: test/linux/services.sh
      - name: Validate the export formats with OpenSCAP, promtool and rsyslog
        run: test/linux/exports.sh

  windows-cis:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        # The shell of the checks. powershell is Windows PowerShell 5.1, all
        # a default server has; for it pwsh is taken off PATH below. The
        # steps themselves always run in pwsh.
        ps: [pwsh, powershell]
        include:
          - os: windows-2022
            policy: cis/win2022.yml
          - os: windows-2025
            policy: cis/win2025.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run the CIS policy of the runner's Windows version
        shell: pwsh
        run: |
          go build -o checkmate.exe ./cmd/checkmate
          if ('${{ matrix.ps }}' -eq 'powershell') { . ./test/windows/without-pwsh.ps1 }
          ./checkmate.exe facts
          ./checkmate.exe run ${{ matrix.policy }} -q --format json --export json -o report.json | Out-Null
          python test/windows/analyze.py report.json
      - name: Detect planted ATT&CK artifacts
        shell: pwsh
        run: |
          if ('${{ matrix.ps }}' -eq 'powershell') { . ./test/windows/without-pwsh.ps1 }
          ./test/windows/attack-sim.ps1
