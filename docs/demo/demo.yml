name: Demo baseline
vars:
  etc: /tmp/checkmate-demo
  services: [sshd, chronyd, auditd]

checks:
  - id: SSH-ROOT
    name: Root login over SSH is disabled
    severity: critical
    run: awk '$1 == "PermitRootLogin" {print $2}' {{ etc }}/sshd_config
    expect: "== no"
    rationale: A stolen root password gives full control in one step.
    remediation: Set PermitRootLogin no and reload sshd.

  - id: SSH-CIPHERS
    name: No weak SSH ciphers
    severity: high
    run: grep '^Ciphers' {{ etc }}/sshd_config
    expect: "!~ (cbc|3des|arcfour)"

  - id: "SVC-{{ item }}"
    name: "{{ item }} is enabled"
    loop: "{{ services }}"
    run: grep -qx {{ item }} {{ etc }}/enabled-services
    expect: true

  - id: "DISK-{{ item }}"                    # one check per line of loop_run
    name: "File system {{ item }} is below 90 %"
    loop_run: awk '{print $1}' {{ etc }}/df
    run: awk -v fs="$CHECKMATE_ITEM" '$1 == fs {print $2}' {{ etc }}/df
    expect: "< 90"
    remediation: "Free space on {{ item }} or enlarge it."

  - id: TIME
    name: Clock offset is below 0.5 s
    severity: low
    run: cat {{ etc }}/clock-offset
    expect: "< 0.5"

  - id: SELINUX
    name: SELinux is enforcing
    only_if: command -v getenforce
    run: getenforce
    expect: "== Enforcing"
