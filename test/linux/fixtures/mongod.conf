# Hardened example configuration used by the container tests.
storage:
  dbPath: /var/lib/mongo
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
net:
  port: 27017
  bindIp: 127.0.0.1,::1
  tls:
    mode: requireTLS
security:
  authorization: enabled
  javascriptEnabled: false
