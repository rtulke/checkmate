# Hardened settings used by test/linux/cis-apache.sh.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 10
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 15
LimitRequestLine 512
LimitRequestFields 100
LimitRequestFieldSize 1024
LimitRequestBody 102400
LogLevel notice core:info
FileETag None
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!MD5
SSLHonorCipherOrder on
SSLInsecureRenegotiation off
SSLCompression off
SSLUseStapling on
SSLStaplingCache "shmcb:/tmp/ssl_stapling(32768)"
Header always append X-Frame-Options SAMEORIGIN
Header always set Strict-Transport-Security "max-age=600"
RewriteEngine On
RewriteCond %{THE_REQUEST} !HTTP/1\.1$
RewriteRule .* - [F]
RewriteCond %{HTTP_HOST} !^www\.example\.com [NC]
RewriteRule .* - [F]
<FilesMatch "^.*$">
    Require all denied
</FilesMatch>
<FilesMatch "^.*\.(css|html?|js|png|jpe?g|gif|ico|txt)$">
    Require all granted
</FilesMatch>
<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>
<Directory /var/www/html>
    Options None
    AllowOverride None
    <LimitExcept GET POST OPTIONS>
        Require all denied
    </LimitExcept>
</Directory>
