name: CIS Apple macOS 26 Tahoe
version: "Tahoe Guidance, Revision 3.0"
description: >
  Checks for the recommendations of the CIS Apple macOS 26 benchmark, taken
  from the rules of the macOS Security Compliance Project (mSCP). Many rules
  verify settings delivered by configuration profiles (MDM), as mSCP does.
  The checks need root, like mSCP itself: run with sudo. Select levels
  with `--tags cis-level-1` or `--tags cis-level-2`.

defaults:
  when:
    - "facts.distro == \"macos\" and facts.version_major == 26"
    - facts.is_root
  shell: zsh
  timeout: 60s

checks:
  - id: "CIS-MACOS26-1.1-system_settings_softwareupdate_current"
    name: "Ensure Software Update is Updated and Current"
    description: "CIS Apple macOS 26 benchmark recommendation 1.1 (level 1); mSCP rule system_settings_softwareupdate_current. NIST SP 800-53 Rev. 5: SI-2. DISA STIG: APPL-26-999999."
    tags: [cis, cis-macos26, cis-section-1, cis-level-1, cis-level-2, disa-stig, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1]
    severity: medium
    run: |
      softwareupdate_date_epoch=$(/bin/date -j -f "%Y-%m-%d" "$(/usr/bin/defaults read /Library/Preferences/com.apple.SoftwareUpdate.plist LastFullSuccessfulDate | /usr/bin/awk '{print $1}')" "+%s")
      thirty_days_epoch=$(/bin/date -v -30d "+%s")
      if [[ $softwareupdate_date_epoch -lt $thirty_days_epoch ]]; then
        /bin/echo "0"
      else
        /bin/echo "1"
      fi
    allow_rc: any
    expect: "== 1"
    rationale: |
      Make sure Software Update is updated and current.

      Update macOS on Mac (https://support.apple.com/en-us/108382) or if enrolled in an MDM consult your MDM's documentation for automated methods.
    remediation: |
      NOTE: See discussion on how to install software updates.
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_softwareupdate_current.yaml"
  - id: "CIS-MACOS26-1.2-system_settings_software_update_download_enforce"
    name: "Enforce Software Update Downloads Updates Automatically"
    description: "CIS Apple macOS 26 benchmark recommendation 1.2 (level 1); mSCP rule system_settings_software_update_download_enforce."
    tags: [cis, cis-macos26, cis-section-1, cis-level-1, cis-level-2]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdate')\
      .objectForKey('AutomaticDownload').js
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      Software Update MUST be configured to enforce automatic downloads of updates is enabled.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.SoftwareUpdate: AutomaticDownload = true

      With declarative device management instead: com.apple.configuration.softwareupdate.settings: AutomaticActions > Download = AlwaysOn
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_software_update_download_enforce.yaml"
  - id: "CIS-MACOS26-1.3-system_settings_install_macos_updates_enforce"
    name: "Enforce macOS Updates are Automatically Installed"
    description: "CIS Apple macOS 26 benchmark recommendation 1.3 (level 1); mSCP rule system_settings_install_macos_updates_enforce."
    tags: [cis, cis-macos26, cis-section-1, cis-level-1, cis-level-2]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdate')\
      .objectForKey('AutomaticallyInstallMacOSUpdates').js
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      Software Update MUST be configured to enforce automatic installation of macOS updates is enabled.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.SoftwareUpdate: AutomaticallyInstallMacOSUpdates = true

      With declarative device management instead: com.apple.configuration.softwareupdate.settings: AutomaticActions > InstallOSUpdates = AlwaysOn
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_install_macos_updates_enforce.yaml"
  - id: "CIS-MACOS26-1.4-os_software_update_app_update_enforce"
    name: "Enforce Software Update App Update Updates Automatically"
    description: "CIS Apple macOS 26 benchmark recommendation 1.4 (level 1); mSCP rule os_software_update_app_update_enforce."
    tags: [cis, cis-macos26, cis-section-1, cis-level-1, cis-level-2]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdate')\
