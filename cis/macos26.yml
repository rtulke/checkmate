      Configuration profile settings (payload type: key = value):
      com.apple.systempolicy.control: EnableAssessment = true
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_gatekeeper_enable.yaml"
  - id: "CIS-MACOS26-2.6.6-system_settings_filevault_enforce"
    name: "Enforce FileVault"
    description: "CIS Apple macOS 26 benchmark recommendation 2.6.6 (level 1); mSCP rule system_settings_filevault_enforce. NIST SP 800-53 Rev. 5: SC-28, SC-28(1). DISA STIG: APPL-26-005020."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: high
    run: |
      dontAllowDisable=$(/usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.MCX')\
      .objectForKey('dontAllowFDEDisable').js
      EOS
      )
      fileVault=$(/usr/bin/fdesetup status | /usr/bin/grep -c "FileVault is On.")
      if [[ "$dontAllowDisable" == "true" ]] && [[ "$fileVault" == 1 ]]; then
        echo "1"
      else
        echo "0"
      fi
    allow_rc: any
    expect: "== 1"
    rationale: |
      FileVault MUST be enforced.

      The information system implements cryptographic mechanisms to protect the confidentiality and integrity of information stored on digital media during transport outside of controlled areas.

      NOTE: See the FileVault supplemental to implement this rule.
    remediation: |
      NOTE: See the FileVault supplemental to implement this rule.
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_filevault_enforce.yaml"
  - id: "CIS-MACOS26-2.6.8-system_settings_system_wide_preferences_configure"
    name: "Require Administrator Password to Modify System-Wide Preferences"
    description: "CIS Apple macOS 26 benchmark recommendation 2.6.8 (level 1); mSCP rule system_settings_system_wide_preferences_configure. NIST SP 800-53 Rev. 5: AC-6, AC-6(2), AC-6(1). DISA STIG: APPL-26-002069."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: high
    run: |
      authDBs=("system.preferences" "system.preferences.energysaver" "system.preferences.network" "system.preferences.printing" "system.preferences.sharing" "system.preferences.softwareupdate" "system.preferences.startupdisk" "system.preferences.timemachine")
      result="1"
      for section in ${authDBs[@]}; do
        if [[ $(/usr/bin/security -q authorizationdb read "$section" | /usr/bin/xmllint -xpath 'name(//*[contains(text(), "shared")]/following-sibling::*[1])' -) != "false" ]]; then
          result="0"
        fi
        if [[ $(/usr/bin/security -q authorizationdb read "$section" | /usr/bin/xmllint -xpath '//*[contains(text(), "group")]/following-sibling::*[1]/text()' - ) != "admin" ]]; then
          result="0"
        fi
        if [[ $(/usr/bin/security -q authorizationdb read "$section" | /usr/bin/xmllint -xpath 'name(//*[contains(text(), "authenticate-user")]/following-sibling::*[1])' -) != "true" ]]; then
          result="0"
        fi
        if [[ $(/usr/bin/security -q authorizationdb read "$section" | /usr/bin/xmllint -xpath 'name(//*[contains(text(), "session-owner")]/following-sibling::*[1])' -) != "false" ]]; then
          result="0"
        fi
      done
      echo $result
    allow_rc: any
    expect: "== 1"
    rationale: |
      The system MUST be configured to require an administrator password in order to modify the system-wide preferences in System Settings.

      Some Preference Panes in System Settings contain settings that affect the entire system. Requiring a password to unlock these system-wide settings reduces the risk of a non-authorized user modifying system configurations.
    remediation: |
      authDBs=("system.preferences" "system.preferences.energysaver" "system.preferences.network" "system.preferences.printing" "system.preferences.sharing" "system.preferences.softwareupdate" "system.preferences.startupdisk" "system.preferences.timemachine")

      for section in ${authDBs[@]}; do
        /usr/bin/security -q authorizationdb read "$section" > "/tmp/$section.plist"

        class_key_value=$(/usr/libexec/PlistBuddy -c "Print :class" "/tmp/$section.plist" 2>&1)
        if [[ "$class_key_value" == *"Does Not Exist"* ]]; then
          /usr/libexec/PlistBuddy -c "Add :class string user" "/tmp/$section.plist"
        else
          /usr/libexec/PlistBuddy -c "Set :class user" "/tmp/$section.plist"
        fi

        key_value=$(/usr/libexec/PlistBuddy -c "Print :shared" "/tmp/$section.plist" 2>&1)
        if [[ "$key_value" == *"Does Not Exist"* ]]; then
          /usr/libexec/PlistBuddy -c "Add :shared bool false" "/tmp/$section.plist"
        else
          /usr/libexec/PlistBuddy -c "Set :shared false" "/tmp/$section.plist"
        fi

        auth_user_key=$(/usr/libexec/PlistBuddy -c "Print :authenticate-user" "/tmp/$section.plist" 2>&1)
        if [[ "$auth_user_key" == *"Does Not Exist"* ]]; then
          /usr/libexec/PlistBuddy -c "Add :authenticate-user bool true" "/tmp/$section.plist"
        else
          /usr/libexec/PlistBuddy -c "Set :authenticate-user true" "/tmp/$section.plist"
        fi

        session_owner_key=$(/usr/libexec/PlistBuddy -c "Print :session-owner" "/tmp/$section.plist" 2>&1)
        if [[ "$session_owner_key" == *"Does Not Exist"* ]]; then
          /usr/libexec/PlistBuddy -c "Add :session-owner bool false" "/tmp/$section.plist"
        else
          /usr/libexec/PlistBuddy -c "Set :session-owner false" "/tmp/$section.plist"
        fi

        group_key=$(/usr/libexec/PlistBuddy -c "Print :group" "/tmp/$section.plist" 2>&1)
        if [[ "$group_key" == *"Does Not Exist"* ]]; then
          /usr/libexec/PlistBuddy -c "Add :group string admin" "/tmp/$section.plist"
        else
          /usr/libexec/PlistBuddy -c "Set :group admin" "/tmp/$section.plist"
        fi

        /usr/bin/security -q authorizationdb write "$section" < "/tmp/$section.plist"
      done
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_system_wide_preferences_configure.yaml"
  - id: "CIS-MACOS26-2.7.1-system_settings_hot_corners_secure"
    name: "Secure Hot Corners"
    description: "CIS Apple macOS 26 benchmark recommendation 2.7.1 (level 1); mSCP rule system_settings_hot_corners_secure. NIST SP 800-53 Rev. 5: AC-11(1)."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, cmmc-level-2]
    severity: medium
    run: |
      CURRENT_USER=$(/usr/bin/defaults read /Library/Preferences/com.apple.loginwindow lastUserName)
      bl_corner="$(/usr/bin/defaults read /Users/"$CURRENT_USER"/Library/Preferences/com.apple.dock wvous-bl-corner 2>/dev/null)"
      tl_corner="$(/usr/bin/defaults read /Users/"$CURRENT_USER"/Library/Preferences/com.apple.dock wvous-tl-corner 2>/dev/null)"
      tr_corner="$(/usr/bin/defaults read /Users/"$CURRENT_USER"/Library/Preferences/com.apple.dock wvous-tr-corner 2>/dev/null)"
      br_corner="$(/usr/bin/defaults read /Users/"$CURRENT_USER"/Library/Preferences/com.apple.dock wvous-br-corner 2>/dev/null)"
      
      if [[ "$bl_corner" != "6" ]] && [[ "$tl_corner" != "6" ]] && [[ "$tr_corner" != "6" ]] && [[ "$br_corner" != "6" ]]; then
        echo "0"
      fi
    allow_rc: any
    expect: "== 0"
    rationale: |
      Hot corners MUST be secured.

      The information system conceals, via the session lock, information previously visible on the display with a publicly viewable image. Although hot comers can be used to initiate a session lock or to launch useful applications, they can also be configured to disable an automatic session lock from initiating. Such a configuration introduces the risk that a user might forget to manually lock the screen before stepping away from the computer.

      NOTE: The check and fix are for the last logged in user. To get the last logged in user, run the following.
      CURRENT_USER=$( /usr/bin/defaults read /Library/Preferences/com.apple.loginwindow lastUserName )
    remediation: |
      /usr/bin/sudo -u "$CURRENT_USER" /usr/bin/defaults delete /Users/"$CURRENT_USER"/Library/Preferences/com.apple.dock wvous-bl-corner 2>/dev/null
      /usr/bin/sudo -u "$CURRENT_USER" /usr/bin/defaults delete /Users/"$CURRENT_USER"/Library/Preferences/com.apple.dock wvous-tl-corner 2>/dev/null
      /usr/bin/sudo -u "$CURRENT_USER" /usr/bin/defaults delete /Users/"$CURRENT_USER"/Library/Preferences/com.apple.dock wvous-tr-corner 2>/dev/null
      /usr/bin/sudo -u "$CURRENT_USER" /usr/bin/defaults delete /Users/"$CURRENT_USER"/Library/Preferences/com.apple.dock wvous-br-corner 2>/dev/null
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_hot_corners_secure.yaml"
  - id: "CIS-MACOS26-2.9.1-system_settings_improve_search_disable"
