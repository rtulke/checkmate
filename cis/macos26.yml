    description: "CIS Apple macOS 26 benchmark recommendation 3.5 (level 1); mSCP rule audit_acls_folders_configure. NIST SP 800-53 Rev. 5: AU-9. DISA STIG: APPL-26-000031."
    tags: [cis, cis-macos26, cis-section-3, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
