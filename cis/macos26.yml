      /usr/bin/pmset -g custom | /usr/bin/awk '/womp/ { sum+=$2 } END {print sum}'
    allow_rc: any
    expect: "== 0"
    rationale: |
      Wake for network access MUST be disabled.
    remediation: |
      /usr/bin/pmset -a womp 0
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_wake_network_access_disable.yaml"
  - id: "CIS-MACOS26-2.11.1-system_settings_screensaver_timeout_enforce"
    name: "Enforce Screen Saver Timeout"
    description: "CIS Apple macOS 26 benchmark recommendation 2.11.1 (level 1); mSCP rule system_settings_screensaver_timeout_enforce. NIST SP 800-53 Rev. 5: AC-11, IA-11. DISA STIG: APPL-26-000070."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-53r5-low, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      function run() {
        let timeout = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.screensaver')\
      .objectForKey('idleTime'))
        if ( timeout <= 900 ) {
          return("true")
        } else {
          return("false")
        }
      }
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      The screen saver timeout MUST be set to 900 seconds or a shorter length of time.

      This rule ensures that a full session lock is triggered within no more than 900 seconds of inactivity.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.screensaver: idleTime = 900
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_screensaver_timeout_enforce.yaml"
  - id: "CIS-MACOS26-2.11.2-system_settings_screensaver_ask_for_password_delay_enforce"
    name: "Enforce Session Lock After Screen Saver is Started"
    description: "CIS Apple macOS 26 benchmark recommendation 2.11.2 (level 1); mSCP rule system_settings_screensaver_ask_for_password_delay_enforce. NIST SP 800-53 Rev. 5: AC-11. DISA STIG: APPL-26-000003."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      function run() {
        let delay = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.screensaver')\
      .objectForKey('askForPasswordDelay'))
        if ( delay <= 5 ) {
          return("true")
        } else {
          return("false")
        }
      }
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      A screen saver MUST be enabled and the system MUST be configured to require a password to unlock once the screensaver has been on for a maximum of 5 seconds.

      An unattended system with an excessive grace period is vulnerable to a malicious user.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.screensaver: askForPasswordDelay = 5
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_screensaver_ask_for_password_delay_enforce.yaml"
  - id: "CIS-MACOS26-2.11.2-system_settings_screensaver_password_enforce"
    name: "Enforce Screen Saver Password"
    description: "CIS Apple macOS 26 benchmark recommendation 2.11.2 (level 1); mSCP rule system_settings_screensaver_password_enforce. NIST SP 800-53 Rev. 5: AC-11. DISA STIG: APPL-26-000002."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.screensaver')\
      .objectForKey('askForPassword').js
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      Users MUST authenticate when unlocking the screen saver.

      The screen saver acts as a session lock and prevents unauthorized users from accessing the current user's account.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.screensaver: askForPassword = true
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_screensaver_password_enforce.yaml"
  - id: "CIS-MACOS26-2.11.4-system_settings_loginwindow_prompt_username_password_enforce"
    name: "Configure Login Window to Prompt for Username and Password"
    description: "CIS Apple macOS 26 benchmark recommendation 2.11.4 (level 1); mSCP rule system_settings_loginwindow_prompt_username_password_enforce. NIST SP 800-53 Rev. 5: IA-2. DISA STIG: APPL-26-005052."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.loginwindow')\
      .objectForKey('SHOWFULLNAME').js
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      The login window MUST be configured to prompt all users for both a username and a password.

      By default, the system displays a list of known users on the login window, which can make it easier for a malicious user to gain access to someone else's account. Requiring users to type in both their username and password mitigates the risk of unauthorized users gaining access to the information system.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.loginwindow: SHOWFULLNAME = true
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_loginwindow_prompt_username_password_enforce.yaml"
  - id: "CIS-MACOS26-2.11.5-system_settings_password_hints_disable"
    name: "Disable Password Hints"
    description: "CIS Apple macOS 26 benchmark recommendation 2.11.5 (level 1); mSCP rule system_settings_password_hints_disable. NIST SP 800-53 Rev. 5: IA-6. DISA STIG: APPL-26-003012."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.loginwindow')\
      .objectForKey('RetriesUntilHint').js
      EOS
    allow_rc: any
    expect: "== 0"
    rationale: |
      Password hints MUST be disabled.

      Password hints leak information about passwords that are currently in use and can lead to loss of confidentiality.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.loginwindow: RetriesUntilHint = 0
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_password_hints_disable.yaml"
  - id: "CIS-MACOS26-2.12.1-os_password_hint_remove"
    name: "Remove Password Hint From User Accounts"
    description: "CIS Apple macOS 26 benchmark recommendation 2.12.1 (level 1); mSCP rule os_password_hint_remove. NIST SP 800-53 Rev. 5: IA-6. DISA STIG: APPL-26-003014."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      HINT=$(/usr/bin/dscl . -list /Users hint | /usr/bin/awk '{ print $2 }')
      
      if [ -z "$HINT" ]; then
        echo "PASS"
      else
        echo "FAIL"
      fi
    allow_rc: any
    expect: "== PASS"
    rationale: |
      User accounts MUST not contain password hints.
    remediation: |
      for u in $(/usr/bin/dscl . -list /Users UniqueID | /usr/bin/awk '$2 > 500 {print $1}'); do
        /usr/bin/dscl . -delete /Users/$u hint
      done
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_password_hint_remove.yaml"
  - id: "CIS-MACOS26-2.13.1-system_settings_guest_account_disable"
    name: "Disable the Guest Account"
    description: "CIS Apple macOS 26 benchmark recommendation 2.13.1 (level 1); mSCP rule system_settings_guest_account_disable. NIST SP 800-53 Rev. 5: AC-2, AC-2(9). DISA STIG: APPL-26-002063."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      function run() {
        let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.MCX')\
      .objectForKey('DisableGuestAccount'))
        let pref2 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.MCX')\
      .objectForKey('EnableGuestAccount'))
        if ( pref1 == true && pref2 == false ) {
          return("true")
        } else {
          return("false")
        }
      }
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      Guest access MUST be disabled.

      Turning off guest access prevents anonymous users from accessing files.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.MCX: DisableGuestAccount = true
      com.apple.MCX: EnableGuestAccount = false
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_guest_account_disable.yaml"
  - id: "CIS-MACOS26-2.13.2-system_settings_guest_access_smb_disable"
    name: "Disable Guest Access to Shared SMB Folders"
    description: "CIS Apple macOS 26 benchmark recommendation 2.13.2 (level 1); mSCP rule system_settings_guest_access_smb_disable. NIST SP 800-53 Rev. 5: AC-2(9), AC-2."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1]
    severity: medium
    run: |
      /usr/sbin/sysadminctl -smbGuestAccess status 2>&1 | /usr/bin/grep -c "SMB guest access disabled"
    allow_rc: any
    expect: "== 1"
    rationale: |
      Guest access to shared Server Message Block (SMB) folders MUST be disabled.

      Turning off guest access prevents anonymous users from accessing files shared via SMB.
    remediation: |
      /usr/sbin/sysadminctl -smbGuestAccess off
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_guest_access_smb_disable.yaml"
  - id: "CIS-MACOS26-2.13.3-system_settings_automatic_login_disable"
    name: "Disable Unattended or Automatic Logon to the System"
    description: "CIS Apple macOS 26 benchmark recommendation 2.13.3 (level 1); mSCP rule system_settings_automatic_login_disable. NIST SP 800-53 Rev. 5: IA-2, IA-5(13). DISA STIG: APPL-26-002066."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.loginwindow')\
      .objectForKey('com.apple.login.mcx.DisableAutoLoginClient').js
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      Automatic logon MUST be disabled.

      When automatic logons are enabled, the default user account is automatically logged on at boot time without prompting the user for a password. Even if the screen is later locked, a malicious user would be able to reboot the computer and find it already logged in. Disabling automatic logons mitigates this risk.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.loginwindow: com.apple.login.mcx.DisableAutoLoginClient = true
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_automatic_login_disable.yaml"
  - id: "CIS-MACOS26-2.18.1-os_on_device_dictation_enforce"
    name: "Enforce On Device Dictation"
    description: "CIS Apple macOS 26 benchmark recommendation 2.18.1 (level 1); mSCP rule os_on_device_dictation_enforce. NIST SP 800-53 Rev. 5: AC-20, CM-7, CM-7(1), SC-7(10). DISA STIG: APPL-26-002220."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\
      .objectForKey('forceOnDeviceOnlyDictation').js
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      Dictation MUST be restricted to on device only to prevent potential data exfiltration.

      The information system MUST be configured to provide only essential capabilities.

      IMPORTANT: This rule only applies to Apple Silicon devices.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.applicationaccess: forceOnDeviceOnlyDictation = true

      With declarative device management instead: com.apple.configuration.intelligence.settings: ForceOnDeviceOnlyTranslation = true
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_on_device_dictation_enforce.yaml"
  - id: "CIS-MACOS26-3.1-audit_auditd_enabled"
    name: "Enable Security Auditing"
    description: "CIS Apple macOS 26 benchmark recommendation 3.1 (level 1); mSCP rule audit_auditd_enabled. NIST SP 800-53 Rev. 5: AU-3, AU-3(1), AU-8, AU-12, AU-12(1), AU-12(3), AU-14(1), MA-4(1), CM-5(1). DISA STIG: APPL-26-001003."
    tags: [cis, cis-macos26, cis-section-3, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      LAUNCHD_RUNNING=$(/bin/launchctl print system | /usr/bin/grep -c -E '\tcom.apple.auditd')
      AUDITD_RUNNING=$(/usr/sbin/audit -c | /usr/bin/grep -c "AUC_AUDITING")
      if [[ $LAUNCHD_RUNNING == 1 ]] && [[ -e /etc/security/audit_control ]] && [[ $AUDITD_RUNNING == 1 ]]; then
        echo "pass"
      else
        echo "fail"
      fi
    allow_rc: any
    expect: "== pass"
    rationale: |
      The information system MUST be configured to generate audit records.

      Audit records establish what types of events have occurred, when they occurred, and which users were involved. These records aid an organization in their efforts to establish, correlate, and investigate the events leading up to an outage or attack.

      The content required to be captured in an audit record varies based on the impact level of an organization's system. Content that may be necessary to satisfy this requirement includes, for example, time stamps, source addresses, destination addresses, user identifiers, event descriptions, success/fail indications, filenames involved, and access or flow control rules invoked.

      The information system initiates session audits at system start-up.

      NOTE: Security auditing is NOT enabled by default on macOS Tahoe.
    remediation: |
      if [[ ! -e /etc/security/audit_control ]] && [[ -e /etc/security/audit_control.example ]];then
        /bin/cp /etc/security/audit_control.example /etc/security/audit_control
      fi

      /bin/launchctl enable system/com.apple.auditd
      /bin/launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.auditd.plist
      /usr/sbin/audit -i
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_auditd_enabled.yaml"
  - id: "CIS-MACOS26-3.2-audit_flags_aa_configure"
    name: "Configure System to Audit All Authorization and Authentication Events"
    description: "CIS Apple macOS 26 benchmark recommendation 3.2 (level 2); mSCP rule audit_flags_aa_configure. NIST SP 800-53 Rev. 5: AC-2(12), AU-12, AU-2, MA-4(1), CM-5(1). DISA STIG: APPL-26-001044."
    tags: [cis, cis-macos26, cis-section-3, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/awk -F':' '/^flags/ { print $NF }' /etc/security/audit_control | /usr/bin/tr ',' '\n' | /usr/bin/grep -Ec 'aa'
    allow_rc: any
    expect: "== 1"
    rationale: |
      The auditing system MUST be configured to flag authorization and authentication (aa) events.

      Authentication events contain information about the identity of a user, server, or client. Authorization events contain information about permissions, rights, and rules. If audit records do not include aa events, it is difficult to identify incidents and to correlate incidents to subsequent events.

      Audit records can be generated from various components within the information system (e.g., via a module or policy filter).
    remediation: |
      /usr/bin/grep -qE "^flags.*[^-]aa" /etc/security/audit_control || /usr/bin/sed -i.bak '/^flags/ s/$/,aa/' /etc/security/audit_control; /usr/sbin/audit -s
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_flags_aa_configure.yaml"
  - id: "CIS-MACOS26-3.2-audit_flags_ad_configure"
    name: "Configure System to Audit All Administrative Action Events"
    description: "CIS Apple macOS 26 benchmark recommendation 3.2 (level 2); mSCP rule audit_flags_ad_configure. NIST SP 800-53 Rev. 5: AC-2(12), AC-6(9), AU-12, AC-2(4), AU-2, MA-4(1), CM-5(1). DISA STIG: APPL-26-001001."
    tags: [cis, cis-macos26, cis-section-3, cis-level-2, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-53r5-low, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/awk -F':' '/^flags/ { print $NF }' /etc/security/audit_control | /usr/bin/tr ',' '\n' | /usr/bin/grep -Ec 'ad'
    allow_rc: any
    expect: "== 1"
    rationale: |
      The auditing system MUST be configured to flag administrative action (ad) events.

      Administrative action events include changes made to the system (e.g. modifying authentication policies). If audit records do not include ad events, it is difficult to identify incidents and to correlate incidents to subsequent events.

      Audit records can be generated from various components within the information system (e.g., via a module or policy filter).

      The information system audits the execution of privileged functions.

      NOTE: We recommend changing the line "43127:AUE_MAC_SYSCALL:mac_syscall(2):ad" to "43127:AUE_MAC_SYSCALL:mac_syscall(2):zz" in the file /etc/security/audit_event. This will prevent sandbox violations from being audited by the ad flag.
    remediation: |
      /usr/bin/grep -qE "^flags.*[^-]ad" /etc/security/audit_control || /usr/bin/sed -i.bak '/^flags/ s/$/,ad/' /etc/security/audit_control; /usr/sbin/audit -s
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_flags_ad_configure.yaml"
  - id: "CIS-MACOS26-3.2-audit_flags_ex_configure"
    name: "Configure System to Audit All Failed Program Execution on the System"
    description: "CIS Apple macOS 26 benchmark recommendation 3.2 (level 2); mSCP rule audit_flags_ex_configure. NIST SP 800-53 Rev. 5: AC-2(12), AU-12, AU-2, CM-5(1). DISA STIG: APPL-26-001024."
    tags: [cis, cis-macos26, cis-section-3, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/awk -F':' '/^flags/ { print $NF }' /etc/security/audit_control | /usr/bin/tr ',' '\n' | /usr/bin/grep -Ec '\-ex'
    allow_rc: any
    expect: "== 1"
    rationale: |
      The audit system MUST be configured to record enforcement actions of access restrictions, including failed program execute (-ex) attempts.

      Enforcement actions are the methods or mechanisms used to prevent unauthorized access and/or changes to configuration settings. One common and effective enforcement action method is using program execution restrictions (e.g., denying users access to execute certain processes).

      This configuration ensures that audit lists include events in which program execution has failed.
      Without auditing the enforcement of program execution, it is difficult to identify attempted attacks, as there is no audit trail available for forensic investigation.
    remediation: |
      /usr/bin/grep -qE "^flags.*-ex" /etc/security/audit_control || /usr/bin/sed -i.bak '/^flags/ s/$/,-ex/' /etc/security/audit_control; /usr/sbin/audit -s
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_flags_ex_configure.yaml"
  - id: "CIS-MACOS26-3.2-audit_flags_fm_failed_configure"
    name: "Configure System to Audit All Failed Change of Object Attributes"
    description: "CIS Apple macOS 26 benchmark recommendation 3.2 (level 2); mSCP rule audit_flags_fm_failed_configure. NIST SP 800-53 Rev. 5: AC-2(12), AU-12, AU-2, AU-9, CM-5(1), MA-4(1)."
    tags: [cis, cis-macos26, cis-section-3, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2]
    severity: medium
    run: |
      /usr/bin/awk -F':' '/^flags/ { print $NF }' /etc/security/audit_control | /usr/bin/tr ',' '\n' | /usr/bin/grep -Ec '\-fm'
    allow_rc: any
    expect: "== 1"
    rationale: |
      The audit system MUST be configured to record enforcement actions of failed attempts to modify file attributes (-fm).

      Enforcement actions are the methods or mechanisms used to prevent unauthorized changes to configuration settings. One common and effective enforcement action method is using access restrictions (i.e., denying modifications to a file by applying file permissions).

      This configuration ensures that audit lists include events in which enforcement actions prevent attempts to modify a file.

      Without auditing the enforcement of access restrictions, it is difficult to identify attempted attacks, as there is no audit trail available for forensic investigation.
    remediation: |
      /usr/bin/grep -qE "^flags.*,\s*-fm" /etc/security/audit_control || /usr/bin/sed -i.bak '/^flags/ s/$/,-fm/' /etc/security/audit_control;/usr/sbin/audit -s
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_flags_fm_failed_configure.yaml"
  - id: "CIS-MACOS26-3.2-audit_flags_fr_configure"
    name: "Configure System to Audit All Failed Read Actions on the System"
    description: "CIS Apple macOS 26 benchmark recommendation 3.2 (level 2); mSCP rule audit_flags_fr_configure. NIST SP 800-53 Rev. 5: AC-2(12), AU-12, AU-2, AU-9, CM-5(1), MA-4(1). DISA STIG: APPL-26-001022."
    tags: [cis, cis-macos26, cis-section-3, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/awk -F':' '/^flags/ { print $NF }' /etc/security/audit_control | /usr/bin/tr ',' '\n' | /usr/bin/grep -Ec '\-fr'
    allow_rc: any
    expect: "== 1"
    rationale: |
      The audit system MUST be configured to record enforcement actions of access restrictions, including failed file read (-fr) attempts.

      Enforcement actions are the methods or mechanisms used to prevent unauthorized access and/or changes to configuration settings. One common and effective enforcement action method is using access restrictions (e.g., denying access to a file by applying file permissions).

      This configuration ensures that audit lists include events in which enforcement actions prevent attempts to read a file.

      Without auditing the enforcement of access restrictions, it is difficult to identify attempted attacks, as there is no audit trail available for forensic investigation.
    remediation: |
      /usr/bin/grep -qE "^flags.*-fr" /etc/security/audit_control || /usr/bin/sed -i.bak '/^flags/ s/$/,-fr/' /etc/security/audit_control;/usr/sbin/audit -s
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_flags_fr_configure.yaml"
  - id: "CIS-MACOS26-3.2-audit_flags_fw_configure"
    name: "Configure System to Audit All Failed Write Actions on the System"
    description: "CIS Apple macOS 26 benchmark recommendation 3.2 (level 2); mSCP rule audit_flags_fw_configure. NIST SP 800-53 Rev. 5: AC-2(12), AU-12, AU-2, AU-9, CM-5(1), MA-4(1). DISA STIG: APPL-26-001023."
    tags: [cis, cis-macos26, cis-section-3, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/awk -F':' '/^flags/ { print $NF }' /etc/security/audit_control | /usr/bin/tr ',' '\n' | /usr/bin/grep -Ec '\-fw'
    allow_rc: any
    expect: "== 1"
    rationale: |
      The audit system MUST be configured to record enforcement actions of access restrictions, including failed file write (-fw) attempts.

      Enforcement actions are the methods or mechanisms used to prevent unauthorized access and/or changes to configuration settings. One common and effective enforcement action method is using access restrictions (e.g., denying users access to edit a file by applying file permissions).

      This configuration ensures that audit lists include events in which enforcement actions prevent attempts to change a file.

      Without auditing the enforcement of access restrictions, it is difficult to identify attempted attacks, as there is no audit trail available for forensic investigation.
    remediation: |
      /usr/bin/grep -qE "^flags.*-fw" /etc/security/audit_control || /usr/bin/sed -i.bak '/^flags/ s/$/,-fw/' /etc/security/audit_control;/usr/sbin/audit -s
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_flags_fw_configure.yaml"
  - id: "CIS-MACOS26-3.2-audit_flags_lo_configure"
    name: "Configure System to Audit All Log In and Log Out Events"
    description: "CIS Apple macOS 26 benchmark recommendation 3.2 (level 2); mSCP rule audit_flags_lo_configure. NIST SP 800-53 Rev. 5: AC-2(12), AU-12, AC-17(1), AU-2, MA-4(1). DISA STIG: APPL-26-001002."
    tags: [cis, cis-macos26, cis-section-3, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/awk -F':' '/^flags/ { print $NF }' /etc/security/audit_control | /usr/bin/tr ',' '\n' | /usr/bin/grep -Ec '^lo'
    allow_rc: any
    expect: "== 1"
    rationale: |
      The audit system MUST be configured to record all attempts to log in and out of the system (lo).

      Frequently, an attacker that successfully gains access to a system has only gained access to an account with limited privileges, such as a guest account or a service account. The attacker must attempt to change to another user account with normal or elevated privileges in order to proceed. Auditing both successful and unsuccessful attempts to switch to another user account (by way of monitoring login and logout events) mitigates this risk.

      The information system monitors login and logout events.
    remediation: |
      /usr/bin/grep -qE "^flags.*[^-]lo" /etc/security/audit_control || /usr/bin/sed -i.bak '/^flags/ s/$/,lo/' /etc/security/audit_control; /usr/sbin/audit -s
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_flags_lo_configure.yaml"
  - id: "CIS-MACOS26-3.3-os_install_log_retention_configure"
    name: "Configure Install.log Retention to 365"
    description: "CIS Apple macOS 26 benchmark recommendation 3.3 (level 1); mSCP rule os_install_log_retention_configure. NIST SP 800-53 Rev. 5: AU-11, AU-4. DISA STIG: APPL-26-004050."
    tags: [cis, cis-macos26, cis-section-3, cis-level-1, cis-level-2, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/sbin/aslmanager -dd 2>&1 | /usr/bin/awk '/\/var\/log\/install.log$/ {count++} /Processing module com.apple.install/,/Finished/ { for (i=1;i<=NR;i++) { if ($i == "TTL" && $(i+2) >= 365) { ttl="True" }; if ($i == "MAX") {max="True"}}} END{if (count > 1) { print "Multiple config files for /var/log/install, manually remove the extra files"} else if (max == "True") { print "all_max setting is configured, must be removed" } if (ttl != "True") { print "TTL not configured" } else { print "Yes" }}' 
    allow_rc: any
    expect: "== Yes"
    rationale: |
      The install.log MUST be configured to require records be kept for a organizational defined value before deletion, unless the system uses a central audit record storage facility.
    remediation: |
      /usr/bin/sed -i '' "s/\* file \/var\/log\/install.log.*/\* file \/var\/log\/install.log format='\$\(\(Time\)\(JZ\)\) \$Host \$\(Sender\)\[\$\(PID\\)\]: \$Message' rotate=utc compress file_max=50M size_only ttl=365/g" /etc/asl/com.apple.install

      NOTE: If there are multiple configuration files in /etc/asl that are set to process the file /var/log/install.log, these files will have to be manually removed.
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_install_log_retention_configure.yaml"
  - id: "CIS-MACOS26-3.4-audit_retention_configure"
    name: "Configure Audit Retention to 30d"
    description: "CIS Apple macOS 26 benchmark recommendation 3.4 (level 1); mSCP rule audit_retention_configure. NIST SP 800-53 Rev. 5: AU-11, AU-4. DISA STIG: APPL-26-001029."
    tags: [cis, cis-macos26, cis-section-3, cis-level-1, cis-level-2, nist-800-171, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, cmmc-level-2, disa-stig]
    severity: low
    run: |
      /usr/bin/awk -F: '/expire-after/{print $2}' /etc/security/audit_control
    allow_rc: any
    expect: "== 30d"
    rationale: |
      The audit service MUST be configured to require records be kept for a organizational defined value before deletion, unless the system uses a central audit record storage facility.

      When "expire-after" is set to "30d", the audit service will not delete audit logs until the log data criteria is met.
    remediation: |
      /usr/bin/sed -i.bak 's/^expire-after.*/expire-after:30d/' /etc/security/audit_control; /usr/sbin/audit -s
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_retention_configure.yaml"
  - id: "CIS-MACOS26-3.5-audit_acls_files_configure"
    name: "Configure Audit Log Files to Not Contain Access Control Lists"
    description: "CIS Apple macOS 26 benchmark recommendation 3.5 (level 1); mSCP rule audit_acls_files_configure. NIST SP 800-53 Rev. 5: AU-9. DISA STIG: APPL-26-000030."
    tags: [cis, cis-macos26, cis-section-3, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /bin/ls -le $(/usr/bin/grep '^dir' /etc/security/audit_control | /usr/bin/awk -F: '{print $2}') | /usr/bin/awk '{print $1}' | /usr/bin/grep -c ":"
    allow_rc: any
    expect: "== 0"
    rationale: |
      The audit log files MUST not contain access control lists (ACLs).

      This rule ensures that audit information and audit files are configured to be readable and writable only by system administrators, thereby preventing unauthorized access, modification, and deletion of files.
    remediation: |
      /bin/chmod -RN /var/audit
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_acls_files_configure.yaml"
  - id: "CIS-MACOS26-3.5-audit_acls_folders_configure"
