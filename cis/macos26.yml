    description: "CIS Apple macOS 26 benchmark recommendation 3.5 (level 1); mSCP rule audit_files_owner_configure. NIST SP 800-53 Rev. 5: AU-9. DISA STIG: APPL-26-001012."
    tags: [cis, cis-macos26, cis-section-3, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /bin/ls -n $(/usr/bin/grep '^dir' /etc/security/audit_control | /usr/bin/awk -F: '{print $2}') | /usr/bin/awk '{s+=$3} END {print s}'
    allow_rc: any
