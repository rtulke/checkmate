    remediation: |
      /usr/sbin/chown -R root /var/audit/*
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_files_owner_configure.yaml"
  - id: "CIS-MACOS26-3.5-audit_folder_group_configure"
    name: "Configure Audit Log Folders Group to Wheel"
    description: "CIS Apple macOS 26 benchmark recommendation 3.5 (level 1); mSCP rule audit_folder_group_configure. NIST SP 800-53 Rev. 5: AU-9. DISA STIG: APPL-26-001015."
    tags: [cis, cis-macos26, cis-section-3, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /bin/ls -dn $(/usr/bin/grep '^dir' /etc/security/audit_control | /usr/bin/awk -F: '{print $2}') | /usr/bin/awk '{print $4}'
    allow_rc: any
    expect: "== 0"
    rationale: |
