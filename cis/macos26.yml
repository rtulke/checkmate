  - id: "CIS-MACOS26-4.1-os_bonjour_disable"
    name: "Disable Bonjour Multicast"
    description: "CIS Apple macOS 26 benchmark recommendation 4.1 (level 2); mSCP rule os_bonjour_disable. NIST SP 800-53 Rev. 5: CM-7, CM-7(1). DISA STIG: APPL-26-002005."
    tags: [cis, cis-macos26, cis-section-4, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.mDNSResponder')\
      .objectForKey('NoMulticastAdvertisements').js
      EOS
    allow_rc: any
    expect: "== true"
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_bonjour_disable.yaml"
  - id: "CIS-MACOS26-4.2-os_httpd_disable"
    name: "Disable the Built-in Web Server"
    description: "CIS Apple macOS 26 benchmark recommendation 4.2 (level 1); mSCP rule os_httpd_disable. NIST SP 800-53 Rev. 5: AC-3, AC-17. DISA STIG: APPL-26-002008."
    tags: [cis, cis-macos26, cis-section-4, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      result="FAIL"
      enabled=$(/bin/launchctl print-disabled system | /usr/bin/grep '"org.apache.httpd" => enabled')
      running=$(/bin/launchctl print system/org.apache.httpd 2>/dev/null)
      
      if [[ -z "$running" ]] && [[ -z "$enabled" ]]; then
        result="PASS"
      elif [[ -n "$running" ]]; then
        result=result+" RUNNING"
      elif [[ -n "$enabled" ]]; then
        result=result+" ENABLED"
      fi
      echo $result
    allow_rc: any
    expect: "== PASS"
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_httpd_disable.yaml"
  - id: "CIS-MACOS26-4.3-os_nfsd_disable"
    name: "Disable Network File System Service"
    description: "CIS Apple macOS 26 benchmark recommendation 4.3 (level 1); mSCP rule os_nfsd_disable. NIST SP 800-53 Rev. 5: AC-3, AC-17. DISA STIG: APPL-26-002003."
    tags: [cis, cis-macos26, cis-section-4, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      isDisabled=$(/sbin/nfsd status | /usr/bin/awk '/nfsd service/ {print $NF}')   
      if [[ "$isDisabled" == "disabled" ]] && [[ -z $(/usr/bin/pgrep nfsd) ]]; then
        echo "pass"
      else
        echo "fail"
      fi
    allow_rc: any
    expect: "== pass"
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_nfsd_disable.yaml"
