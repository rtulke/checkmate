  - id: "CIS-MACOS26-2.10.1.2-os_sleep_and_display_sleep_apple_silicon_enable"
    name: "Ensure Sleep and Display Sleep Is Enabled on Apple Silicon Devices"
    description: "CIS Apple macOS 26 benchmark recommendation 2.10.1.2 (level 2); mSCP rule os_sleep_and_display_sleep_apple_silicon_enable."
    tags: [cis, cis-macos26, cis-section-2, cis-level-2]
    severity: low
    run: |
      error_count=0
      if /usr/sbin/system_profiler SPHardwareDataType 2>/dev/null  | /usr/bin/grep -Ei "MacBook|Mac[0-9]" > /dev/null ; then
        cpuType=$(/usr/sbin/sysctl -n machdep.cpu.brand_string)
        if echo "$cpuType" | grep "Apple" >/dev/null; then
          sleepMode=$(/usr/bin/pmset -b -g | /usr/bin/grep '^\s*sleep' 2>&1 | /usr/bin/awk '{print $2}')
          displaysleepMode=$(/usr/bin/pmset -b -g | /usr/bin/grep displaysleep 2>&1 | /usr/bin/awk '{print $2}')
          if [[ "$sleepMode" == "" ]] || [[ "$sleepMode" -gt 15 ]]; then
            ((error_count++))
          fi
          if [[ "$displaysleepMode" == "" ]] || [[ "$displaysleepMode" -gt 10 ]] || [[ "$displaysleepMode" -gt "$sleepMode" ]]; then
            ((error_count++))
          fi
        fi
      fi
      echo "$error_count"
    allow_rc: any
    expect: "== 0"
    rationale: |
      Apple Silicon MacBooks should set sleep timeout to 15 minutes (900 seconds) or less and the display sleep timeout should be 10 minutes (600 seconds) or less but less than the sleep setting.
    remediation: |
      /usr/bin/pmset -a sleep 15
      /usr/bin/pmset -a displaysleep 10
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_sleep_and_display_sleep_apple_silicon_enable.yaml"
  - id: "CIS-MACOS26-2.10.2-os_power_nap_disable"
    name: "Disable Power Nap"
    description: "CIS Apple macOS 26 benchmark recommendation 2.10.2 (level 1); mSCP rule os_power_nap_disable. NIST SP 800-53 Rev. 5: CM-7, CM-7(1)."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, cmmc-level-2]
    severity: medium
    run: |
      /usr/bin/pmset -g custom | /usr/bin/awk '/powernap/ { sum+=$2 } END {print sum}'
    allow_rc: any
    expect: "== 0"
    rationale: |
      Power Nap MUST be disabled.

      NOTE: Power Nap allows your Mac to perform actions while a Mac is asleep. This can interfere with USB power and may cause devices such as smartcards to stop functioning until a reboot and must therefore be disabled on all applicable systems.

      The following Macs support Power Nap:

      - MacBook (Early 2015 and later)
      - MacBook Air (Late 2010 and later)
      - MacBook Pro (all models with Retina display)
      - Mac mini (Late 2012 and later)
      - iMac (Late 2012 and later)
      - Mac Pro (Late 2013 and later)
    remediation: |
      /usr/bin/pmset -a powernap 0
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_power_nap_disable.yaml"
  - id: "CIS-MACOS26-2.10.3-system_settings_wake_network_access_disable"
    name: "Ensure Wake for Network Access Is Disabled"
    description: "CIS Apple macOS 26 benchmark recommendation 2.10.3 (level 1); mSCP rule system_settings_wake_network_access_disable."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2]
    severity: medium
