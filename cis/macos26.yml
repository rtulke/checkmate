      Configuration profile settings (payload type: key = value):
      com.apple.MCX: forceInternetSharingOff = true
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_internet_sharing_disable.yaml"
  - id: "CIS-MACOS26-2.3.3.8-system_settings_content_caching_disable"
    name: "Disable Content Caching Service"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.3.8 (level 2); mSCP rule system_settings_content_caching_disable. NIST SP 800-53 Rev. 5: CM-7, CM-7(1). DISA STIG: APPL-26-002140."
    tags: [cis, cis-macos26, cis-section-2, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\
      .objectForKey('allowContentCaching').js
      EOS
    allow_rc: any
    expect: "== false"
    rationale: |
      Content caching MUST be disabled.

      Content caching is a macOS service that helps reduce Internet data usage and speed up software installation on Mac computers. It is not recommended for devices furnished to employees to act as a caching server.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.applicationaccess: allowContentCaching = false
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_content_caching_disable.yaml"
  - id: "CIS-MACOS26-2.3.3.9-system_settings_media_sharing_disabled"
    name: "Disable Media Sharing"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.3.9 (level 2); mSCP rule system_settings_media_sharing_disabled. NIST SP 800-53 Rev. 5: AC-3, AC-17. DISA STIG: APPL-26-002100."
    tags: [cis, cis-macos26, cis-section-2, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      function run() {
        let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\
      .objectForKey('allowMediaSharing'))
        let pref2 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\
      .objectForKey('allowMediaSharingModification'))
        if ( pref1 == false && pref2 == false ) {
          return("true")
        } else {
          return("false")
        }
      }
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      Media sharing MUST be disabled.

      When Media Sharing is enabled, the computer starts a network listening service that shares the contents of the user's music collection with other users in the same subnet.

      The information system MUST be configured to provide only essential capabilities. Disabling Media Sharing helps prevent the unauthorized connection of devices and the unauthorized transfer of information. Disabling Media Sharing mitigates this risk.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.applicationaccess: allowMediaSharing = false
      com.apple.applicationaccess: allowMediaSharingModification = false
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_media_sharing_disabled.yaml"
  - id: "CIS-MACOS26-2.3.3.10-system_settings_bluetooth_sharing_disable"
    name: "Disable Bluetooth Sharing"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.3.10 (level 1); mSCP rule system_settings_bluetooth_sharing_disable. NIST SP 800-53 Rev. 5: AC-3, AC-18(4), CM-7, CM-7(1). DISA STIG: APPL-26-002110."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      CURRENT_USER=$(/usr/bin/defaults read /Library/Preferences/com.apple.loginwindow lastUserName)
      /usr/bin/sudo -u "$CURRENT_USER" /usr/bin/defaults -currentHost read com.apple.Bluetooth PrefKeyServicesEnabled
    allow_rc: any
    expect: "in [false, 0]"
    rationale: |
      Bluetooth Sharing MUST be disabled.

      Bluetooth Sharing allows users to wirelessly transmit files between the macOS and Bluetooth-enabled devices, including personally owned cellphones and tablets. A malicious user might introduce viruses or malware onto the system or extract sensitive files via Bluetooth Sharing. When Bluetooth Sharing is disabled, this risk is mitigated.

      NOTE: The check and fix are for the last logged in user. To get the last logged in user, run the following.
      CURRENT_USER=$( /usr/bin/defaults read /Library/Preferences/com.apple.loginwindow lastUserName )
    remediation: |
      /usr/bin/sudo -u "$CURRENT_USER" /usr/bin/defaults -currentHost write com.apple.Bluetooth PrefKeyServicesEnabled -bool false
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_bluetooth_sharing_disable.yaml"
