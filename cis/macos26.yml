  - id: "CIS-MACOS26-3.5-audit_files_group_configure"
    name: "Configure Audit Log Files Group to Wheel"
    description: "CIS Apple macOS 26 benchmark recommendation 3.5 (level 1); mSCP rule audit_files_group_configure. NIST SP 800-53 Rev. 5: AU-9. DISA STIG: APPL-26-001014."
    tags: [cis, cis-macos26, cis-section-3, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /bin/ls -n $(/usr/bin/grep '^dir' /etc/security/audit_control | /usr/bin/awk -F: '{print $2}') | /usr/bin/awk '{s+=$4} END {print s}'
    allow_rc: any
    expect: "== 0"
    rationale: |
      Audit log files MUST have the group set to wheel.

      The audit service MUST be configured to create log files with the correct group ownership to prevent normal users from reading audit logs.

      Audit logs contain sensitive data about the system and users. If log files are set to be readable and writable only by system administrators, the risk is mitigated.
    remediation: |
      /usr/bin/chgrp -R wheel /var/audit/*
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_files_group_configure.yaml"
  - id: "CIS-MACOS26-3.5-audit_files_mode_configure"
    name: "Configure Audit Log Files to Mode 440 or Less Permissive"
    description: "CIS Apple macOS 26 benchmark recommendation 3.5 (level 1); mSCP rule audit_files_mode_configure. NIST SP 800-53 Rev. 5: AU-9. DISA STIG: APPL-26-001016."
    tags: [cis, cis-macos26, cis-section-3, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /bin/ls -l $(/usr/bin/grep '^dir' /etc/security/audit_control | /usr/bin/awk -F: '{print $2}') | /usr/bin/awk '!/-r--r-----|current|total/{print $1}' | /usr/bin/wc -l | /usr/bin/tr -d ' '
    allow_rc: any
    expect: "== 0"
    rationale: |
      The audit service MUST be configured to create log files that are readable only by the root user and group wheel. To achieve this, audit log files MUST be configured to mode 440 or less permissive; thereby preventing normal users from reading, modifying or deleting audit logs.
    remediation: |
      /bin/chmod 440 /var/audit/*
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_files_mode_configure.yaml"
