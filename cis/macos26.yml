name: CIS Apple macOS 26 Tahoe
version: "Tahoe Guidance, Revision 3.0"
description: >
  Checks for the recommendations of the CIS Apple macOS 26 benchmark, taken
  from the rules of the macOS Security Compliance Project (mSCP). Many rules
  verify settings delivered by configuration profiles (MDM), as mSCP does.
  The checks need root, like mSCP itself: run with sudo. Select levels
  with `--tags cis-level-1` or `--tags cis-level-2`.

defaults:
  when:
    - "facts.distro == \"macos\" and facts.version_major == 26"
    - facts.is_root
  shell: zsh
  timeout: 60s

checks:
  - id: "CIS-MACOS26-1.1-system_settings_softwareupdate_current"
    name: "Ensure Software Update is Updated and Current"
    description: "CIS Apple macOS 26 benchmark recommendation 1.1 (level 1); mSCP rule system_settings_softwareupdate_current. NIST SP 800-53 Rev. 5: SI-2. DISA STIG: APPL-26-999999."
    tags: [cis, cis-macos26, cis-section-1, cis-level-1, cis-level-2, disa-stig, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1]
    severity: medium
    run: |
      softwareupdate_date_epoch=$(/bin/date -j -f "%Y-%m-%d" "$(/usr/bin/defaults read /Library/Preferences/com.apple.SoftwareUpdate.plist LastFullSuccessfulDate | /usr/bin/awk '{print $1}')" "+%s")
      thirty_days_epoch=$(/bin/date -v -30d "+%s")
      if [[ $softwareupdate_date_epoch -lt $thirty_days_epoch ]]; then
        /bin/echo "0"
      else
        /bin/echo "1"
      fi
    allow_rc: any
    expect: "== 1"
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_softwareupdate_current.yaml"
  - id: "CIS-MACOS26-1.2-system_settings_software_update_download_enforce"
