  - id: "CIS-MACOS26-5.3.1-os_internal_apfs_volumes_encrypted"
    name: "Ensure All Internal User Storage APFS Volumes Are Encrypted"
    description: "CIS Apple macOS 26 benchmark recommendation 5.3.1 (level 1); mSCP rule os_internal_apfs_volumes_encrypted. NIST SP 800-53 Rev. 5: N/A. DISA STIG: N/A."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2]
    severity: medium
    run: |
      fail=$(/usr/sbin/diskutil list internal | /usr/bin/grep "APFS Volume" | /usr/bin/awk '{print $NF}' | /usr/bin/xargs -n1 /usr/sbin/diskutil info 2>/dev/null | /usr/bin/awk '
        /Volume Name:/{name=$0; sub(/^[ \t]*Volume Name:[ \t]*/,"",name)}
        /FileVault:/{
          if ($2=="No" && name !~ /^(Preboot|Recovery|VM)$/) {
            if (list=="") list=name; else list=list ", " name
          }
        }
        END{print list}')
      if [ -z "$fail" ]; then
        /bin/echo "Yes"
      else
        /bin/echo "Unencrypted internal user APFS volumes: $fail"
      fi
    allow_rc: any
    expect: "== Yes"
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_internal_apfs_volumes_encrypted.yaml"
  - id: "CIS-MACOS26-5.3.2-os_external_apfs_hfs_volumes_encrypted"
    name: "Ensure All APFS and HFS+ External User Storage Volumes Are Encrypted"
    description: "CIS Apple macOS 26 benchmark recommendation 5.3.2 (level 1); mSCP rule os_external_apfs_hfs_volumes_encrypted. NIST SP 800-53 Rev. 5: N/A. DISA STIG: N/A."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2]
    severity: medium
    run: |
      fail=$(/usr/sbin/diskutil list external | /usr/bin/grep -E "APFS Volume|Apple_HFS|Logical Volume" | /usr/bin/awk '{print $NF}' | /usr/bin/xargs -n1 /usr/sbin/diskutil info 2>/dev/null | /usr/bin/awk '
        /Volume Name:/{name=$0; sub(/^[ \t]*Volume Name:[ \t]*/,"",name)}
        /FileVault:/{
          if ($2=="No") {
            if (list=="") list=name; else list=list ", " name
          }
        }
        END{print list}')
      if [ -z "$fail" ]; then
        /bin/echo "Yes"
      else
        /bin/echo "Unencrypted external volumes: $fail"
      fi
    allow_rc: any
    expect: "== Yes"
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_external_apfs_hfs_volumes_encrypted.yaml"
