      com.apple.SoftwareUpdate: AutomaticallyInstallAppUpdates = true
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_software_update_app_update_enforce.yaml"
  - id: "CIS-MACOS26-1.5-os_config_data_install_enforce"
    name: "Enforce Installation of XProtect Remediator and Gatekeeper Updates Automatically"
    description: "CIS Apple macOS 26 benchmark recommendation 1.5 (level 1); mSCP rule os_config_data_install_enforce. NIST SP 800-53 Rev. 5: SI-3, SI-2(5). DISA STIG: APPL-26-005130."
    tags: [cis, cis-macos26, cis-section-1, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdate')\
      .objectForKey('ConfigDataInstall').js
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      Software Update MUST be configured to update XProtect Remediator and Gatekeeper automatically.

      This setting enforces definition updates for XProtect Remediator and Gatekeeper; with this setting in place, new malware and adware that Apple has added to the list of malware or untrusted software will not execute. These updates do not require the computer to be restarted.

      https://support.apple.com/en-us/HT207005

      NOTE: Software update will automatically update XProtect Remediator and Gatekeeper by default in the macOS.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.SoftwareUpdate: ConfigDataInstall = true
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_config_data_install_enforce.yaml"
  - id: "CIS-MACOS26-1.5-system_settings_critical_update_install_enforce"
    name: "Enforce Critical Security Updates to be Installed"
    description: "CIS Apple macOS 26 benchmark recommendation 1.5 (level 1); mSCP rule system_settings_critical_update_install_enforce. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-macos26, cis-section-1, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, cmmc-level-2, cmmc-level-1]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdate')\
      .objectForKey('CriticalUpdateInstall').js
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      Ensure that security updates are installed as soon as they are available from Apple.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.SoftwareUpdate: CriticalUpdateInstall = true

      With declarative device management instead: com.apple.configuration.softwareupdate.settings: AutomaticActions > InstallSecurityUpdates = AlwaysOn
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_critical_update_install_enforce.yaml"
  - id: "CIS-MACOS26-1.6-os_software_update_deferral"
    name: "Ensure Software Update Deferment Is Less Than or Equal to 30 Days"
    description: "CIS Apple macOS 26 benchmark recommendation 1.6 (level 1); mSCP rule os_software_update_deferral."
    tags: [cis, cis-macos26, cis-section-1, cis-level-1, cis-level-2]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      function run() {
        let timeout = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\
      .objectForKey('enforcedSoftwareUpdateDelay')) || 0
        if ( timeout <= 30 ) {
          return("true")
        } else {
          return("false")
        }
      }
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      Software updates MUST be deferred for 30 days or less.

      If you need to defer software updates, create a Restrictions profile using the com.apple.applicationaccess domain and the key enforcedSoftwareUpdateDelay.
    remediation: |
      This is implemented by a Configuration Profile.
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_software_update_deferral.yaml"
  - id: "CIS-MACOS26-2.1.1.3-icloud_sync_disable"
    name: "Disable iCloud Desktop and Document Folder Sync"
    description: "CIS Apple macOS 26 benchmark recommendation 2.1.1.3 (level 2); mSCP rule icloud_sync_disable. NIST SP 800-53 Rev. 5: AC-20, AC-20(1), CM-7, CM-7(1), SC-7(10). DISA STIG: APPL-26-002150."
    tags: [cis, cis-macos26, cis-section-2, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\
      .objectForKey('allowCloudDesktopAndDocuments').js
      EOS
    allow_rc: any
    expect: "== false"
    rationale: |
      The macOS system's ability to automatically synchronize a user's desktop and documents folder to their iCloud Drive MUST be disabled.

      Apple's iCloud service does not provide an organization with enough control over the storage and access of data and, therefore, automated file synchronization MUST be controlled by an organization approved service.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.applicationaccess: allowCloudDesktopAndDocuments = false
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/icloud/icloud_sync_disable.yaml"
  - id: "CIS-MACOS26-2.2.1-system_settings_firewall_enable"
    name: "Enable macOS Application Firewall"
    description: "CIS Apple macOS 26 benchmark recommendation 2.2.1 (level 1); mSCP rule system_settings_firewall_enable. NIST SP 800-53 Rev. 5: AC-4, SC-7(12), CM-7, CM-7(1), SC-7. DISA STIG: APPL-26-005050."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.security.firewall')\
      .objectForKey('EnableFirewall').js
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      The macOS Application Firewall is the built-in firewall that comes with macOS, and it MUST be enabled.

      When the macOS Application Firewall is enabled, the flow of information within the information system and between interconnected systems will be controlled by approved authorizations.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.security.firewall: EnableFirewall = true
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_firewall_enable.yaml"
  - id: "CIS-MACOS26-2.2.2-system_settings_firewall_stealth_mode_enable"
    name: "Enable Firewall Stealth Mode"
    description: "CIS Apple macOS 26 benchmark recommendation 2.2.2 (level 1); mSCP rule system_settings_firewall_stealth_mode_enable. NIST SP 800-53 Rev. 5: CM-7, CM-7(1), SC-7(16), SC-7."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.security.firewall')\
      .objectForKey('EnableStealthMode').js
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      Firewall Stealth Mode MUST be enabled.

      When stealth mode is enabled, the Mac will not respond to any probing requests, and only requests from authorized applications will still be authorized.

      IMPORTANT: Enabling firewall stealth mode may prevent certain remote mechanisms used for maintenance and compliance scanning from properly functioning. Information System Security Officers (ISSOs) are advised to first fully weigh the potential risks posed to their organization before opting not to enable stealth mode.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.security.firewall: EnableStealthMode = true
      com.apple.security.firewall: EnableFirewall = true
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_firewall_stealth_mode_enable.yaml"
  - id: "CIS-MACOS26-2.3.1.1-os_airdrop_disable"
    name: "Disable AirDrop"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.1.1 (level 1); mSCP rule os_airdrop_disable. NIST SP 800-53 Rev. 5: AC-3, AC-20, CM-7, CM-7(1). DISA STIG: APPL-26-002009."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\
      .objectForKey('allowAirDrop').js
      EOS
    allow_rc: any
    expect: "== false"
    rationale: |
      AirDrop MUST be disabled to prevent file transfers to or from unauthorized devices.
      AirDrop allows users to share and receive files from other nearby Apple devices.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.applicationaccess: allowAirDrop = false
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_airdrop_disable.yaml"
  - id: "CIS-MACOS26-2.3.1.2-system_settings_airplay_receiver_disable"
    name: "Disable Airplay Receiver"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.1.2 (level 1); mSCP rule system_settings_airplay_receiver_disable. NIST SP 800-53 Rev. 5: CM-7, CM-7(1). DISA STIG: APPL-26-002080."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\
      .objectForKey('allowAirPlayIncomingRequests').js
      EOS
    allow_rc: any
    expect: "== false"
    rationale: |
      Airplay Receiver allows you to send content from another Apple device to be displayed on the screen as it's being played from your other device.

      Support for Airplay Receiver is non-essential and MUST be disabled.

      The information system MUST be configured to provide only essential capabilities.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.applicationaccess: allowAirPlayIncomingRequests = false
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_airplay_receiver_disable.yaml"
  - id: "CIS-MACOS26-2.3.2.1-system_settings_time_server_configure"
    name: "Configure macOS to Use an Authorized Time Server"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.2.1 (level 1); mSCP rule system_settings_time_server_configure. NIST SP 800-53 Rev. 5: AU-12(1), SC-45(1). DISA STIG: APPL-26-000170."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-171, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.MCX')\
      .objectForKey('timeServer').js
      EOS
    allow_rc: any
    expect: "== time.apple.com"
    rationale: |
      Approved time server MUST be the only server configured for use. As of macOS 10.13 only one time server is supported.

      This rule ensures the uniformity of time stamps for information systems with multiple system clocks and systems connected over a network.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.MCX: timeServer = time.apple.com
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_time_server_configure.yaml"
  - id: "CIS-MACOS26-2.3.2.1-system_settings_time_server_enforce"
    name: "Enforce macOS Time Synchronization"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.2.1 (level 1); mSCP rule system_settings_time_server_enforce. NIST SP 800-53 Rev. 5: AU-12(1), SC-45(1). DISA STIG: APPL-26-000014."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-171, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.timed')\
      .objectForKey('TMAutomaticTimeOnlyEnabled').js
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      Time synchronization MUST be enforced on all networked systems.

      This rule ensures the uniformity of time stamps for information systems with multiple system clocks and systems connected over a network.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.ManagedClient.preferences: com.apple.timed > TMAutomaticTimeOnlyEnabled = true
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_time_server_enforce.yaml"
  - id: "CIS-MACOS26-2.3.2.2-os_time_server_enabled"
    name: "Enable Time Synchronization Daemon"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.2.2 (level 1); mSCP rule os_time_server_enabled. NIST SP 800-53 Rev. 5: AU-12(1), SC-45(1). DISA STIG: APPL-26-000180."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-171, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /bin/launchctl print system | /usr/bin/grep -c -E '\tcom.apple.timed'
    allow_rc: any
    expect: "== 1"
    rationale: |
      The macOS time synchronization daemon (timed) MUST be enabled for proper time synchronization to an authorized time server.

      NOTE: The time synchronization daemon is enabled by default on macOS.
    remediation: |
      /bin/launchctl load -w /System/Library/LaunchDaemons/com.apple.timed.plist

      NOTE: The service "timed" cannot be unloaded or loaded while System Integrity Protection (SIP) is enabled.
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_time_server_enabled.yaml"
  - id: "CIS-MACOS26-2.3.3.1-system_settings_screen_sharing_disable"
    name: "Disable Screen Sharing and Apple Remote Desktop"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.3.1 (level 1); mSCP rule system_settings_screen_sharing_disable. NIST SP 800-53 Rev. 5: AC-3, AC-17. DISA STIG: APPL-26-002050."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      result="FAIL"
      enabled=$(/bin/launchctl print-disabled system | /usr/bin/grep '"com.apple.screensharing" => enabled')
      running=$(/bin/launchctl print system/com.apple.screensharing 2>/dev/null)
      
      if [[ -z "$running" ]] && [[ -z "$enabled" ]]; then
        result="PASS"
      elif [[ -n "$running" ]]; then
        result=result+" RUNNING"
      elif [[ -n "$enabled" ]]; then
        result=result+" ENABLED"
      fi
      echo $result
    allow_rc: any
    expect: "== PASS"
    rationale: |
      Support for both Screen Sharing and Apple Remote Desktop (ARD) is non-essential and MUST be disabled.

      The information system MUST be configured to provide only essential capabilities. Disabling screen sharing and ARD helps prevent the unauthorized connection of devices, the unauthorized transfer of information, and unauthorized tunneling.
    remediation: |
      /bin/launchctl bootout system/com.apple.screensharing
      /bin/launchctl disable system/com.apple.screensharing
      NOTE - This will apply to the whole system
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_screen_sharing_disable.yaml"
  - id: "CIS-MACOS26-2.3.3.2-system_settings_smbd_disable"
    name: "Disable Server Message Block Sharing"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.3.2 (level 1); mSCP rule system_settings_smbd_disable. NIST SP 800-53 Rev. 5: AC-3, AC-17. DISA STIG: APPL-26-002001."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      /bin/launchctl print-disabled system | /usr/bin/grep -c '"com.apple.smbd" => disabled'
    allow_rc: any
    expect: "== 1"
    rationale: |
      Support for Server Message Block (SMB) file sharing is non-essential and MUST be disabled.

      The information system MUST be configured to provide only essential capabilities.
    remediation: |
      /bin/launchctl disable system/com.apple.smbd
      The system may need to be restarted for the update to take effect.
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_smbd_disable.yaml"
  - id: "CIS-MACOS26-2.3.3.3-system_settings_printer_sharing_disable"
    name: "Disable Printer Sharing"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.3.3 (level 1); mSCP rule system_settings_printer_sharing_disable. NIST SP 800-53 Rev. 5: CM-7, CM-7(1). DISA STIG: APPL-26-002240."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/sbin/cupsctl | /usr/bin/grep -c "_share_printers=0"
    allow_rc: any
    expect: "in [true, 1]"
    rationale: |
      Printer Sharing MUST be disabled.
    remediation: |
      /usr/sbin/cupsctl --no-share-printers
      /usr/bin/lpstat -p | awk '{print $2}'| /usr/bin/xargs -I{} lpadmin -p {} -o printer-is-shared=false
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_printer_sharing_disable.yaml"
  - id: "CIS-MACOS26-2.3.3.4-system_settings_ssh_disable"
    name: "Disable SSH Server for Remote Access Sessions"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.3.4 (level 1); mSCP rule system_settings_ssh_disable. NIST SP 800-53 Rev. 5: CM-7, CM-7(1), AC-17."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1]
    severity: high
    run: |
      result="FAIL"
      enabled=$(/bin/launchctl print-disabled system | /usr/bin/grep '"com.openssh.sshd" => enabled')
      running=$(/bin/launchctl print system/com.openssh.sshd 2>/dev/null)
      
      if [[ -z "$running" ]] && [[ -z "$enabled" ]]; then
        result="PASS"
      elif [[ -n "$running" ]]; then
        result=result+" RUNNING"
      elif [[ -n "$enabled" ]]; then
        result=result+" ENABLED"
      fi
      echo $result
    allow_rc: any
    expect: "== PASS"
    rationale: |
      SSH service MUST be disabled for remote access.
    remediation: |
      /usr/sbin/systemsetup -f -setremotelogin off >/dev/null
      /bin/launchctl disable system/com.openssh.sshd
      NOTE: Systemsetup with -setremotelogin flag will fail unless you grant Full Disk Access to systemsetup or its parent process. Requires supervision.
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_ssh_disable.yaml"
  - id: "CIS-MACOS26-2.3.3.5-system_settings_remote_management_disable"
    name: "Disable Remote Management"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.3.5 (level 1); mSCP rule system_settings_remote_management_disable. NIST SP 800-53 Rev. 5: CM-7, CM-7(1). DISA STIG: APPL-26-002250."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/libexec/mdmclient QuerySecurityInfo 2>/dev/null | /usr/bin/grep -c "RemoteDesktopEnabled = 0"
    allow_rc: any
    expect: "== 1"
    rationale: |
      Remote Management MUST be disabled.
    remediation: |
      /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -deactivate -stop
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_remote_management_disable.yaml"
  - id: "CIS-MACOS26-2.3.3.6-system_settings_rae_disable"
    name: "Disable Remote Apple Events"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.3.6 (level 1); mSCP rule system_settings_rae_disable. NIST SP 800-53 Rev. 5: AC-3, AC-17. DISA STIG: APPL-26-002022."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      /bin/launchctl print-disabled system | /usr/bin/grep -c '"com.apple.AEServer" => disabled'
    allow_rc: any
    expect: "== 1"
    rationale: |
      If the system does not require Remote Apple Events, support for Apple Remote Events is non-essential and MUST be disabled.

      The information system MUST be configured to provide only essential capabilities. Disabling Remote Apple Events helps prevent the unauthorized connection of devices, the unauthorized transfer of information, and unauthorized tunneling.
    remediation: |
      /usr/sbin/systemsetup -setremoteappleevents off
      /bin/launchctl disable system/com.apple.AEServer
      NOTE: Systemsetup with -setremoteappleevents flag will fail unless you grant Full Disk Access to systemsetup or its parent process. Requires supervision.
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/system_settings/system_settings_rae_disable.yaml"
  - id: "CIS-MACOS26-2.3.3.7-system_settings_internet_sharing_disable"
