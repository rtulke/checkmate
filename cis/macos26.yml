  - id: "CIS-MACOS26-2.3.4.2-system_settings_time_machine_encrypted_configure"
    name: "Ensure Time Machine Volumes are Encrypted"
    description: "CIS Apple macOS 26 benchmark recommendation 2.3.4.2 (level 1); mSCP rule system_settings_time_machine_encrypted_configure."
    tags: [cis, cis-macos26, cis-section-2, cis-level-1, cis-level-2]
    severity: medium
    run: |
      /usr/bin/sudo /usr/bin/defaults read /Library/Preferences/com.apple.TimeMachine.plist | grep -c NotEncrypted
