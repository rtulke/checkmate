      Audit log folders MUST be owned by root.

      The audit service MUST be configured to create log folders with the correct ownership to prevent normal users from reading audit logs.

      Audit logs contain sensitive data about the system and users. If log folders are set to only be readable and writable by system administrators, the risk is mitigated.
    remediation: |
      /usr/sbin/chown root /var/audit
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_folder_owner_configure.yaml"
  - id: "CIS-MACOS26-3.5-audit_folders_mode_configure"
    name: "Configure Audit Log Folders to Mode 700 or Less Permissive"
    description: "CIS Apple macOS 26 benchmark recommendation 3.5 (level 1); mSCP rule audit_folders_mode_configure. NIST SP 800-53 Rev. 5: AU-9. DISA STIG: APPL-26-001017."
    tags: [cis, cis-macos26, cis-section-3, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/stat -f %A $(/usr/bin/grep '^dir' /etc/security/audit_control | /usr/bin/awk -F: '{print $2}')
    allow_rc: any
    expect: "== 700"
    rationale: |
      The audit log folder MUST be configured to mode 700 or less permissive so that only the root user is able to read, write, and execute changes to folders.

      Because audit logs contain sensitive data about the system and users, the audit service MUST be configured to mode 700 or less permissive; thereby preventing normal users from reading, modifying or deleting audit logs.
    remediation: |
      /bin/chmod 700 /var/audit
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/audit/audit_folders_mode_configure.yaml"
  - id: "CIS-MACOS26-4.1-os_bonjour_disable"
    name: "Disable Bonjour Multicast"
    description: "CIS Apple macOS 26 benchmark recommendation 4.1 (level 2); mSCP rule os_bonjour_disable. NIST SP 800-53 Rev. 5: CM-7, CM-7(1). DISA STIG: APPL-26-002005."
    tags: [cis, cis-macos26, cis-section-4, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/osascript -l JavaScript << EOS
      $.NSUserDefaults.alloc.initWithSuiteName('com.apple.mDNSResponder')\
      .objectForKey('NoMulticastAdvertisements').js
      EOS
    allow_rc: any
    expect: "== true"
    rationale: |
      Bonjour multicast advertising MUST be disabled to prevent the system from broadcasting its presence and available services over network interfaces.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.mDNSResponder: NoMulticastAdvertisements = true
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_bonjour_disable.yaml"
  - id: "CIS-MACOS26-4.2-os_httpd_disable"
    name: "Disable the Built-in Web Server"
    description: "CIS Apple macOS 26 benchmark recommendation 4.2 (level 1); mSCP rule os_httpd_disable. NIST SP 800-53 Rev. 5: AC-3, AC-17. DISA STIG: APPL-26-002008."
    tags: [cis, cis-macos26, cis-section-4, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      result="FAIL"
      enabled=$(/bin/launchctl print-disabled system | /usr/bin/grep '"org.apache.httpd" => enabled')
      running=$(/bin/launchctl print system/org.apache.httpd 2>/dev/null)
      
      if [[ -z "$running" ]] && [[ -z "$enabled" ]]; then
        result="PASS"
      elif [[ -n "$running" ]]; then
        result=result+" RUNNING"
      elif [[ -n "$enabled" ]]; then
        result=result+" ENABLED"
      fi
      echo $result
    allow_rc: any
    expect: "== PASS"
    rationale: |
      The built-in web server which is managed by launchd is a non-essential service built into macOS and MUST be disabled and not running.

      NOTE: The built in web server service is disabled at startup by default macOS.
    remediation: |
      /usr/sbin/apachectl stop 2>/dev/null
      /bin/launchctl disable system/org.apache.httpd
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_httpd_disable.yaml"
  - id: "CIS-MACOS26-4.3-os_nfsd_disable"
    name: "Disable Network File System Service"
    description: "CIS Apple macOS 26 benchmark recommendation 4.3 (level 1); mSCP rule os_nfsd_disable. NIST SP 800-53 Rev. 5: AC-3, AC-17. DISA STIG: APPL-26-002003."
    tags: [cis, cis-macos26, cis-section-4, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      isDisabled=$(/sbin/nfsd status | /usr/bin/awk '/nfsd service/ {print $NF}')   
      if [[ "$isDisabled" == "disabled" ]] && [[ -z $(/usr/bin/pgrep nfsd) ]]; then
        echo "pass"
      else
        echo "fail"
      fi
    allow_rc: any
    expect: "== pass"
    rationale: |
      Support for Network File Systems (NFS) services is non-essential and, therefore, MUST be disabled.
    remediation: |
      /bin/launchctl disable system/com.apple.nfsd
      /bin/rm -rf /etc/exports
      The system may need to be restarted for the update to take effect.
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_nfsd_disable.yaml"
  - id: "CIS-MACOS26-5.1.1-os_home_folders_secure"
    name: "Secure User's Home Folders"
    description: "CIS Apple macOS 26 benchmark recommendation 5.1.1 (level 1); mSCP rule os_home_folders_secure. NIST SP 800-53 Rev. 5: AC-6. DISA STIG: APPL-26-002068."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      /usr/bin/find /System/Volumes/Data/Users -mindepth 1 -maxdepth 1 -type d ! \( -perm 700 -o -perm 711 \) | /usr/bin/grep -v "Shared" | /usr/bin/grep -v "Guest" | /usr/bin/wc -l | /usr/bin/xargs
    allow_rc: any
    expect: "== 0"
    rationale: |
      The system MUST be configured to prevent access to other user's home folders.

      The default behavior of macOS is to allow all valid users access to the top level of every other user's home folder while restricting access only to the Apple default folders within.
    remediation: |
      IFS=$'\n'
      for userDirs in $( /usr/bin/find /System/Volumes/Data/Users -mindepth 1 -maxdepth 1 -type d ! \( -perm 700 -o -perm 711 \) | /usr/bin/grep -v "Shared" | /usr/bin/grep -v "Guest" ); do
        /bin/chmod og-rwx "$userDirs"
      done
      unset IFS
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_home_folders_secure.yaml"
  - id: "CIS-MACOS26-5.1.2-os_sip_enable"
    name: "Ensure System Integrity Protection is Enabled"
    description: "CIS Apple macOS 26 benchmark recommendation 5.1.2 (level 1); mSCP rule os_sip_enable. NIST SP 800-53 Rev. 5: AC-3, AU-9, AU-9(3), CM-5, CM-5(6), SC-4, SI-2, SI-7. DISA STIG: APPL-26-005001."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: high
    run: |
      /usr/bin/csrutil status | /usr/bin/grep -c 'System Integrity Protection status: enabled.'
    allow_rc: any
    expect: "== 1"
    rationale: |
      System Integrity Protection (SIP) MUST be enabled.

      SIP is vital to protecting the integrity of the system as it prevents malicious users and software from making unauthorized and/or unintended modifications to protected files and folders; ensures the presence of an audit record generation capability for defined auditable events for all operating system components; protects audit tools from unauthorized access, modification, and deletion; restricts the root user account and limits the actions that the root user can perform on protected parts of the macOS; and prevents non-privileged users from granting other users direct access to the contents of their home directories and folders.

      NOTE: SIP is enabled by default in macOS.
    remediation: |
      /usr/bin/csrutil enable
      NOTE: To re-enable "System Integrity Protection", boot the affected system into "Recovery" mode, launch "Terminal" from the "Utilities" menu, and run the command.
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_sip_enable.yaml"
  - id: "CIS-MACOS26-5.1.3-os_mobile_file_integrity_enable"
    name: "Enable Apple Mobile File Integrity"
    description: "CIS Apple macOS 26 benchmark recommendation 5.1.3 (level 1); mSCP rule os_mobile_file_integrity_enable."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2]
    severity: medium
    run: |
      /usr/sbin/nvram -p | /usr/bin/grep -c "amfi_get_out_of_my_way=1"
    allow_rc: any
    expect: "== 0"
    rationale: |
      Mobile file integrity MUST be enabled.
    remediation: |
      /usr/sbin/nvram boot-args=""
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_mobile_file_integrity_enable.yaml"
  - id: "CIS-MACOS26-5.1.4-os_authenticated_root_enable"
    name: "Enable Authenticated Root"
    description: "CIS Apple macOS 26 benchmark recommendation 5.1.4 (level 1); mSCP rule os_authenticated_root_enable. NIST SP 800-53 Rev. 5: AC-3, CM-5, SC-34, SI-7(6), SI-7, MA-4(1). DISA STIG: APPL-26-005070."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      /sbin/mount | /usr/bin/grep ' / ' | /usr/bin/grep -o 'sealed'
    allow_rc: any
    expect: "== sealed"
    rationale: |
      Authenticated Root MUST be enabled.

      When Authenticated Root is enabled the macOS is booted from a signed volume that is cryptographically protected to prevent tampering with the system volume.

      NOTE: Authenticated Root is enabled by default on macOS systems.

      WARNING: If more than one partition with macOS is detected, the csrutil command will hang awaiting input.
    remediation: |
      /usr/bin/csrutil authenticated-root enable
      NOTE: To re-enable "Authenticated Root", boot the affected system into "Recovery" mode, launch "Terminal" from the "Utilities" menu, and run the command.
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_authenticated_root_enable.yaml"
  - id: "CIS-MACOS26-5.1.5-os_system_wide_applications_configure"
    name: "Ensure Appropriate Permissions Are Enabled for System Wide Applications"
    description: "CIS Apple macOS 26 benchmark recommendation 5.1.5 (level 1); mSCP rule os_system_wide_applications_configure."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2]
    severity: medium
    run: |
      /usr/bin/find /Applications -iname "*\.app" -type d -perm -2 -ls | /usr/bin/wc -l | /usr/bin/xargs
    allow_rc: any
    expect: "== 0"
    rationale: |
      Applications in the System Applications Directory (/Applications) MUST not be world-writable.
    remediation: |
      IFS=$'\n'
      for apps in $( /usr/bin/find /Applications -iname "*\.app" -type d -perm -2 ); do
        /bin/chmod -R o-w "$apps"
      done
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_system_wide_applications_configure.yaml"
  - id: "CIS-MACOS26-5.1.6-os_world_writable_system_folder_configure"
    name: "Ensure No World Writable Files Exist in the System Folder"
    description: "CIS Apple macOS 26 benchmark recommendation 5.1.6 (level 1); mSCP rule os_world_writable_system_folder_configure."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2]
    severity: medium
    run: |
      /usr/bin/find /System/Volumes/Data/System -type d -perm -2 -ls | /usr/bin/grep -vE "downloadDir|locks" | /usr/bin/wc -l | /usr/bin/xargs
    allow_rc: any
    expect: "== 0"
    rationale: |
      Folders in /System/Volumes/Data/System MUST not be world-writable.
    remediation: |
      IFS=$'\n'
      for sysPermissions in $( /usr/bin/find /System/Volumes/Data/System -type d -perm -2 | /usr/bin/grep -vE "downloadDir|locks" ); do
        /bin/chmod -R o-w "$sysPermissions"
      done
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_world_writable_system_folder_configure.yaml"
  - id: "CIS-MACOS26-5.1.7-os_world_writable_library_folder_configure"
    name: "Ensure No World Writable Files Exist in the Library Folder"
    description: "CIS Apple macOS 26 benchmark recommendation 5.1.7 (level 2); mSCP rule os_world_writable_library_folder_configure."
    tags: [cis, cis-macos26, cis-section-5, cis-level-2]
    severity: low
    run: |
      /usr/bin/find /Library -type d -perm -002 ! -perm -1000 ! -xattrname com.apple.rootless 2>/dev/null | /usr/bin/grep -vE "/Library/AppStore" | /usr/bin/wc -l | /usr/bin/xargs
    allow_rc: any
    expect: "== 0"
    rationale: |
      Folders in /System/Volumes/Data/Library MUST not be world-writable.

      NOTE: Some vendors are known to create world-writable folders to the System Library folder. You may need to add more exclusions to this check and fix to match your environment.
    remediation: |
      IFS=$'\n'
      for libPermissions in $(/usr/bin/find /Library -type d -perm -002 ! -perm -1000 ! -xattrname com.apple.rootless 2>/dev/null); do
        /bin/chmod -R o-w "$libPermissions"
      done
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_world_writable_library_folder_configure.yaml"
  - id: "CIS-MACOS26-5.2.1-pwpolicy_account_lockout_enforce"
    name: "Limit Consecutive Failed Login Attempts to 5"
    description: "CIS Apple macOS 26 benchmark recommendation 5.2.1 (level 1); mSCP rule pwpolicy_account_lockout_enforce. NIST SP 800-53 Rev. 5: AC-7. DISA STIG: APPL-26-000022."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2, nist-800-171, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null | /usr/bin/tail +2 | /usr/bin/xmllint --xpath '//dict/key[text()="policyAttributeMaximumFailedAuthentications"]/following-sibling::integer[1]/text()' - | /usr/bin/awk '{ if ($1 <= 5) {print "pass"} else {print "fail"}}' | /usr/bin/uniq
    allow_rc: any
    expect: "== pass"
    rationale: |
      The macOS MUST be configured to limit the number of failed login attempts to a maximum of 5. When the maximum number of failed attempts is reached, the account MUST be locked for a period of time after.

      This rule protects against malicious users attempting to gain access to the system via brute-force hacking methods.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.mobiledevice.passwordpolicy: maxFailedAttempts = 5

      With declarative device management instead: com.apple.configuration.passcode.settings: MaximumFailedAttempts = 5
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/pwpolicy/pwpolicy_account_lockout_enforce.yaml"
  - id: "CIS-MACOS26-5.2.1-pwpolicy_account_lockout_timeout_enforce"
    name: "Set Account Lockout Time to 15 Minutes"
    description: "CIS Apple macOS 26 benchmark recommendation 5.2.1 (level 1); mSCP rule pwpolicy_account_lockout_timeout_enforce. NIST SP 800-53 Rev. 5: AC-7. DISA STIG: APPL-26-000060."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2, nist-800-171, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null | /usr/bin/tail +2 | /usr/bin/xmllint --xpath '//dict/key[text()="autoEnableInSeconds"]/following-sibling::integer[1]/text()' - | /usr/bin/awk '{ if ($1/60 >= 15 ) {print "pass"} else {print "fail"}}' | /usr/bin/uniq
    allow_rc: any
    expect: "== pass"
    rationale: |
      The macOS MUST be configured to enforce a lockout time period of at least 15 minutes when the maximum number of failed logon attempts is reached.

      This rule protects against malicious users attempting to gain access to the system via brute-force hacking methods.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.mobiledevice.passwordpolicy: minutesUntilFailedLoginReset = 15

      With declarative device management instead: com.apple.configuration.passcode.settings: MaximumGracePeriodInMinutes = 15
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/pwpolicy/pwpolicy_account_lockout_timeout_enforce.yaml"
  - id: "CIS-MACOS26-5.2.2-pwpolicy_minimum_length_enforce"
    name: "Require a Minimum Password Length of 15 Characters"
    description: "CIS Apple macOS 26 benchmark recommendation 5.2.2 (level 1); mSCP rule pwpolicy_minimum_length_enforce. NIST SP 800-53 Rev. 5: IA-5(1). DISA STIG: APPL-26-003010."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2, nist-800-171, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/pwpolicy -getaccountpolicies 2>/dev/null | tail +2 | grep -oE "policyAttributePassword matches '.\{[0-9]+," | awk -F'[{,]' -v ODV=15 '{if ($2 > max) max=$2} END {print (max >= ODV) ? "pass" : "fail"}'
    allow_rc: any
    expect: "== pass"
    rationale: |
      The macOS MUST be configured to require a minimum of 15 characters be used when a password is created.

      This rule enforces password complexity by requiring users to set passwords that are less vulnerable to malicious users.

      NOTE: To comply with Executive Order 14028, “Improving the Nation's Cybersecurity”, OMB M-22-09, “Moving the U.S. Government Toward Zero Trust Cybersecurity Principles”, and NIST SP-800-63b, “Digital Identity Guidelines: Authentication and Lifecycle Management” federal, military, and intelligence communities must adopt the following configuration settings. Password policies must not require the use of complexity policies such as upper characters, lower characters, or special characters. Password policies must also not require the use of regular rotation. Password policies should define a minimum length. Multifactor authentication should be used where ever possible.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.mobiledevice.passwordpolicy: minLength = 15

      With declarative device management instead: com.apple.configuration.passcode.settings: MinimumLength = 15
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/pwpolicy/pwpolicy_minimum_length_enforce.yaml"
  - id: "CIS-MACOS26-5.2.3-pwpolicy_alpha_numeric_enforce"
    name: "Require Passwords Contain a Minimum of One Numeric Character"
    description: "CIS Apple macOS 26 benchmark recommendation 5.2.3 (level 2); mSCP rule pwpolicy_alpha_numeric_enforce. NIST SP 800-53 Rev. 5: IA-5(1). DISA STIG: APPL-26-003007."
    tags: [cis, cis-macos26, cis-section-5, cis-level-2, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null | /usr/bin/tail +2 | /usr/bin/xmllint --xpath '//dict/key[text()="policyIdentifier"]/following-sibling::*[1]/text()' - | /usr/bin/grep "requireAlphanumeric" -c
    allow_rc: any
    expect: "== 1"
    rationale: |
      The macOS MUST be configured to require at least one numeric character be used when a password is created.

      This rule enforces password complexity by requiring users to set passwords that are less vulnerable to malicious users.

      NOTE: To comply with Executive Order 14028, “Improving the Nation's Cybersecurity”, OMB M-22-09, “Moving the U.S. Government Toward Zero Trust Cybersecurity Principles”, and NIST SP-800-63b, “Digital Identity Guidelines: Authentication and Lifecycle Management” federal, military, and intelligence communities must adopt the following configuration settings. Password policies must not require the use of complexity policies such as upper characters, lower characters, or special characters. Password policies must also not require the use of regular rotation. Password policies should define a minimum length. Multifactor authentication should be used where ever possible.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.mobiledevice.passwordpolicy: requireAlphanumeric = true

      With declarative device management instead: com.apple.configuration.passcode.settings: RequireAlphanumericPasscode = true
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/pwpolicy/pwpolicy_alpha_numeric_enforce.yaml"
  - id: "CIS-MACOS26-5.2.5-pwpolicy_special_character_enforce"
    name: "Require Passwords Contain a Minimum of One Special Character"
    description: "CIS Apple macOS 26 benchmark recommendation 5.2.5 (level 2); mSCP rule pwpolicy_special_character_enforce. NIST SP 800-53 Rev. 5: IA-5(1). DISA STIG: APPL-26-003011."
    tags: [cis, cis-macos26, cis-section-5, cis-level-2, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/pwpolicy -getaccountpolicies 2>/dev/null | /usr/bin/tail -n +2 | /usr/bin/xmllint --xpath "//string[contains(text(), \"policyAttributePassword matches '(.*[^a-zA-Z0-9].*){\")]" - 2>/dev/null | /usr/bin/awk -F"{|}" '{if ($2 >= 1) {print "pass"} else {print "fail"}}'
    allow_rc: any
    expect: "== pass"
    rationale: |
      The macOS MUST be configured to require at least one special character be used when a password is created.

      Special characters are those characters that are not alphanumeric. Examples include: ~ ! @ # $ % ^ *.

      This rule enforces password complexity by requiring users to set passwords that are less vulnerable to malicious users.

      NOTE: To comply with Executive Order 14028, “Improving the Nation's Cybersecurity”, OMB M-22-09, “Moving the U.S. Government Toward Zero Trust Cybersecurity Principles”, and NIST SP-800-63b, “Digital Identity Guidelines: Authentication and Lifecycle Management” federal, military, and intelligence communities must adopt the following configuration settings. Password policies must not require the use of complexity policies such as upper characters, lower characters, or special characters. Password policies must also not require the use of regular rotation. Password policies should define a minimum length. Multifactor authentication should be used where ever possible.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.mobiledevice.passwordpolicy: minComplexChars = 1

      With declarative device management instead: com.apple.configuration.passcode.settings: MinimumComplexCharacters = 1
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/pwpolicy/pwpolicy_special_character_enforce.yaml"
  - id: "CIS-MACOS26-5.2.6-pwpolicy_custom_regex_enforce"
    name: "Require Passwords to Match the Defined Custom Regular Expression"
    description: "CIS Apple macOS 26 benchmark recommendation 5.2.6 (level 2); mSCP rule pwpolicy_custom_regex_enforce. NIST SP 800-53 Rev. 5: IA-5(1). DISA STIG: APPL-26-003060."
    tags: [cis, cis-macos26, cis-section-5, cis-level-2, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null | /usr/bin/tail +2 | /usr/bin/xmllint --xpath 'boolean(//*[contains(text(),"policyAttributePassword matches '\''^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).*$'\''")])' -
    allow_rc: any
    expect: "== true"
    rationale: |
      The macOS MUST be configured to meet complexity requirements defined in ^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).*$.

      This rule enforces password complexity by requiring users to set passwords that are less vulnerable to malicious users.

      NOTE: To comply with Executive Order 14028, “Improving the Nation's Cybersecurity”, OMB M-22-09, “Moving the U.S. Government Toward Zero Trust Cybersecurity Principles”, and NIST SP-800-63b, “Digital Identity Guidelines: Authentication and Lifecycle Management” federal, military, and intelligence communities must adopt the following configuration settings. Password policies must not require the use of complexity policies such as upper characters, lower characters, or special characters. Password policies must also not require the use of regular rotation. Password policies should define a minimum length. Multifactor authentication should be used where ever possible.

      NOTE: The configuration profile generated must be installed from an MDM server.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.mobiledevice.passwordpolicy: customRegex > passwordContentRegex = ^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).*$
      com.apple.mobiledevice.passwordpolicy: customRegex > passwordContentDescription > default = Password must match custom regex.

      With declarative device management instead: com.apple.configuration.passcode.settings: CustomRegex > Regex = ^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).*$, CustomRegex > Description = Password must match custom regex.
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/pwpolicy/pwpolicy_custom_regex_enforce.yaml"
  - id: "CIS-MACOS26-5.2.7-pwpolicy_max_lifetime_enforce"
    name: "Restrict Maximum Password Lifetime to 365 Days"
    description: "CIS Apple macOS 26 benchmark recommendation 5.2.7 (level 1); mSCP rule pwpolicy_max_lifetime_enforce. NIST SP 800-53 Rev. 5: IA-5. DISA STIG: APPL-26-003008."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null | /usr/bin/tail +2 | /usr/bin/xmllint --xpath '//dict/key[text()="policyAttributeExpiresEveryNDays"]/following-sibling::*[1]/text()' - | /usr/bin/awk '{ if ($1 <= 365 ) {print "pass"} else {print "fail"}}' | /usr/bin/uniq
    allow_rc: any
    expect: "== pass"
    rationale: |
      The macOS MUST be configured to enforce a maximum password lifetime limit of at least 365 days.

      This rule ensures that users are forced to change their passwords frequently enough to prevent malicious users from gaining and maintaining access to the system.

      NOTE: To comply with Executive Order 14028, “Improving the Nation's Cybersecurity”, OMB M-22-09, “Moving the U.S. Government Toward Zero Trust Cybersecurity Principles”, and NIST SP-800-63b, “Digital Identity Guidelines: Authentication and Lifecycle Management” federal, military, and intelligence communities must adopt the following configuration settings. Password policies must not require the use of complexity policies such as upper characters, lower characters, or special characters. Password policies must also not require the use of regular rotation. Password policies should define a minimum length. Multifactor authentication should be used where ever possible.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.mobiledevice.passwordpolicy: maxPINAgeInDays = 365

      With declarative device management instead: com.apple.configuration.passcode.settings: MaximumPasscodeAgeInDays = 365
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/pwpolicy/pwpolicy_max_lifetime_enforce.yaml"
  - id: "CIS-MACOS26-5.2.8-pwpolicy_history_enforce"
    name: "Prohibit Password Reuse for a Minimum of 24 Generations"
    description: "CIS Apple macOS 26 benchmark recommendation 5.2.8 (level 1); mSCP rule pwpolicy_history_enforce. NIST SP 800-53 Rev. 5: IA-5(1). DISA STIG: APPL-15-003009."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2, nist-800-171, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, cmmc-level-2]
    severity: medium
    run: |
      /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null | /usr/bin/tail +2 | /usr/bin/xmllint --xpath '//dict/key[text()="policyAttributePasswordHistoryDepth"]/following-sibling::*[1]/text()' - | /usr/bin/awk '{ if ($1 >= 24 ) {print "pass"} else {print "fail"}}' | /usr/bin/uniq
    allow_rc: any
    expect: "== pass"
    rationale: |
      The macOS MUST be configured to enforce a password history of at least 24 previous passwords when a password is created.

      This rule ensures that users are  not allowed to reuse a password that was used in any of the 24 previous password generations.

      Limiting password reuse protects against malicious users attempting to gain access to the system via brute-force hacking methods.

      NOTE: The guidance for password based authentication in NIST 800-53 (Rev 5) and NIST 800-63B state that complexity rules should be organizationally defined. The values defined are based off of common complexity values. But your organization may define its own password complexity rules.
    remediation: |
      This is implemented by a Configuration Profile.

      Configuration profile settings (payload type: key = value):
      com.apple.mobiledevice.passwordpolicy: pinHistory = 24

      With declarative device management instead: com.apple.configuration.passcode.settings: PasscodeReuseLimit = 24
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/pwpolicy/pwpolicy_history_enforce.yaml"
  - id: "CIS-MACOS26-5.3.1-os_internal_apfs_volumes_encrypted"
    name: "Ensure All Internal User Storage APFS Volumes Are Encrypted"
    description: "CIS Apple macOS 26 benchmark recommendation 5.3.1 (level 1); mSCP rule os_internal_apfs_volumes_encrypted."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2]
    severity: medium
    run: |
      fail=$(/usr/sbin/diskutil list internal | /usr/bin/grep "APFS Volume" | /usr/bin/awk '{print $NF}' | /usr/bin/xargs -n1 /usr/sbin/diskutil info 2>/dev/null | /usr/bin/awk '
        /Volume Name:/{name=$0; sub(/^[ \t]*Volume Name:[ \t]*/,"",name)}
        /FileVault:/{
          if ($2=="No" && name !~ /^(Preboot|Recovery|VM)$/) {
            if (list=="") list=name; else list=list ", " name
          }
        }
        END{print list}')
      if [ -z "$fail" ]; then
        /bin/echo "Yes"
      else
        /bin/echo "Unencrypted internal user APFS volumes: $fail"
      fi
    allow_rc: any
    expect: "== Yes"
    rationale: |
      All internal user storage APFS volumes MUST be encrypted.

      While FileVault protects the boot volume, data may be copied to other attached internal storage and reduce the protection afforded by FileVault. All internal APFS volumes that carry user data and do not have a specific role (Preboot, Recovery, VM) MUST be encrypted to protect user data from loss or tampering.
    remediation: |
      Use Disk Utility to erase a user disk and format as APFS (Encrypted).

      NOTE: APFS Encrypted disks will be described as "FileVault" whether they are the boot volume or not.
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_internal_apfs_volumes_encrypted.yaml"
  - id: "CIS-MACOS26-5.3.2-os_external_apfs_hfs_volumes_encrypted"
    name: "Ensure All APFS and HFS+ External User Storage Volumes Are Encrypted"
    description: "CIS Apple macOS 26 benchmark recommendation 5.3.2 (level 1); mSCP rule os_external_apfs_hfs_volumes_encrypted."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2]
    severity: medium
    run: |
      fail=$(/usr/sbin/diskutil list external | /usr/bin/grep -E "APFS Volume|Apple_HFS|Logical Volume" | /usr/bin/awk '{print $NF}' | /usr/bin/xargs -n1 /usr/sbin/diskutil info 2>/dev/null | /usr/bin/awk '
        /Volume Name:/{name=$0; sub(/^[ \t]*Volume Name:[ \t]*/,"",name)}
        /FileVault:/{
          if ($2=="No") {
            if (list=="") list=name; else list=list ", " name
          }
        }
        END{print list}')
      if [ -z "$fail" ]; then
        /bin/echo "Yes"
      else
        /bin/echo "Unencrypted external volumes: $fail"
      fi
    allow_rc: any
    expect: "== Yes"
    rationale: |
      All APFS and HFS+ external user storage volumes MUST be encrypted.

      While FileVault protects the boot volume, data may be copied to attached external storage and reduce the protection afforded by FileVault. All external user data volumes (APFS or HFS+) MUST be encrypted to protect user data from loss or tampering. CoreStorage has been deprecated and replaced with APFS for volume encryption.
    remediation: |
      Use Disk Utility to erase a user disk and format as APFS (Encrypted).

      NOTE: It is recommended using APFS over HFS+ where possible. If you do need to use an HFS+/CoreStorage external drive for compatibility reasons, you need to format the drive to MacOS Extended (Journaled) (or MacOS Extended (Case-Sensitive, Journaled) if Case-Sensitive is required).
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_external_apfs_hfs_volumes_encrypted.yaml"
  - id: "CIS-MACOS26-5.4-os_sudo_timeout_configure"
    name: "Configure Sudo Timeout Period to 0"
    description: "CIS Apple macOS 26 benchmark recommendation 5.4 (level 1); mSCP rule os_sudo_timeout_configure. DISA STIG: APPL-26-004022."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, disa-stig]
    severity: medium
    run: |
      /usr/bin/sudo /usr/bin/sudo -V | /usr/bin/grep -c "Authentication timestamp timeout: 0.0 minutes"
    allow_rc: any
    expect: "== 1"
    rationale: |
      The file /etc/sudoers MUST include a timestamp_timeout of 0.
    remediation: |
      /usr/bin/find /etc/sudoers* -type f -exec sed -i '' '/timestamp_timeout/d' '{}' \;
      /bin/echo "Defaults timestamp_timeout=0" >> /etc/sudoers.d/mscp
      /bin/chmod 440 /etc/sudoers.d/mscp
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_sudo_timeout_configure.yaml"
  - id: "CIS-MACOS26-5.5-os_sudoers_timestamp_type_configure"
    name: "Configure Sudoers Timestamp Type"
    description: "CIS Apple macOS 26 benchmark recommendation 5.5 (level 1); mSCP rule os_sudoers_timestamp_type_configure. NIST SP 800-53 Rev. 5: CM-5(1), IA-11. DISA STIG: APPL-26-004060."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2, nist-800-171, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, disa-stig]
    severity: medium
    run: |
      /usr/bin/sudo /usr/bin/sudo -V | /usr/bin/awk -F": " '/Type of authentication timestamp record/{print $2}'
    allow_rc: any
    expect: "== tty"
    rationale: |
      The file /etc/sudoers MUST be configured to not include a timestamp_type of global or ppid and be configured for timestamp record types of tty.

      This rule ensures that the "sudo" command will prompt for the administrator's password at least once in each newly opened terminal window. This prevents a malicious user from taking advantage of an unlocked computer or an abandoned logon session by bypassing the normal password prompt requirement.
    remediation: |
      /usr/bin/find /etc/sudoers* -type f -exec sed -i '' '/timestamp_type/d; /!tty_tickets/d' '{}' \;
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_sudoers_timestamp_type_configure.yaml"
  - id: "CIS-MACOS26-5.6-os_root_disable"
    name: "Disable Root Login"
    description: "CIS Apple macOS 26 benchmark recommendation 5.6 (level 1); mSCP rule os_root_disable. NIST SP 800-53 Rev. 5: IA-2, IA-2(5). DISA STIG: APPL-26-000100."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      /usr/bin/dscl '/Local/Default' read '/Users/root' AuthenticationAuthority 2>/dev/null | /usr/bin/grep -c 'AuthenticationAuthority'
    allow_rc: any
    expect: "== 0"
    rationale: |
      To assure individual accountability and prevent unauthorized access, logging in as root at the login window MUST be disabled.

      The macOS system MUST require individuals to be authenticated with an individual authenticator prior to using a group authenticator, and administrator users MUST never log in directly as root.
    remediation: |
      /usr/bin/fdesetup remove -user root
      /usr/bin/dscl '/Local/Default' delete '/Users/root' AuthenticationAuthority
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_root_disable.yaml"
  - id: "CIS-MACOS26-5.7-os_unlock_active_user_session_disable"
    name: "Disable Login to Other User's Active and Locked Sessions"
    description: "CIS Apple macOS 26 benchmark recommendation 5.7 (level 1); mSCP rule os_unlock_active_user_session_disable. NIST SP 800-53 Rev. 5: IA-2, IA-2(5). DISA STIG: APPL-26-000090."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, cmmc-level-1, disa-stig]
    severity: medium
    run: |
      RESULT="FAIL"
      SS_RULE=$(/usr/bin/security -q authorizationdb read system.login.screensaver  2>&1 | /usr/bin/xmllint --xpath "//dict/key[.='rule']/following-sibling::array[1]/string/text()" -)
      
      if [[ "${SS_RULE}" == "authenticate-session-owner" ]]; then
          RESULT="PASS"
      else
          PSSO_CHECK=$(/usr/bin/security -q authorizationdb read "$SS_RULE"  2>&1 | /usr/bin/xmllint --xpath '//key[.="rule"]/following-sibling::array[1]/string/text()' -)
          if /usr/bin/grep -Fxq "authenticate-session-owner" <<<"$PSSO_CHECK"; then
              RESULT="PASS"
          fi
      fi
      
      echo $RESULT
    allow_rc: any
    expect: "== PASS"
    rationale: |
      The ability to log in to another user's active or locked session MUST be disabled.

      macOS has a privilege that can be granted to any user that will allow that user to unlock active user's sessions. Disabling the admins and/or user's ability to log into another user's active and locked session prevents unauthorized persons from viewing potentially sensitive and/or personal information.

      NOTE: Configuring this setting will change the user experience and disable TouchID from unlocking the screensaver. A configuration profile will be generated to include the setting that restores the expected behavior. You can also apply the settings using "/usr/bin/sudo /usr/bin/defaults write /Library/Preferences/com.apple.loginwindow screenUnlockMode -int 1".

      WARNING: Do not apply this rule if your organization uses smartcards and Platform Single Sign-On (PSSO).
    remediation: |
      SS_RULE=$(/usr/bin/security -q authorizationdb read system.login.screensaver 2>&1 | /usr/bin/xmllint --xpath "//dict/key[.='rule']/following-sibling::array[1]/string/text()" -)

      if [[ "$SS_RULE" == *psso* ]]; then
          /usr/bin/security -q authorizationdb read psso-screensaver > "/tmp/psso-screensaver-mscp.plist"
          /usr/bin/sed -i.bak 's/<string>authenticate-session-owner-or-admin<\/string>/<string>authenticate-session-owner<\/string>/' /tmp/psso-screensaver-mscp.plist
          /usr/bin/security -q authorizationdb write psso-screensaver-mscp < /tmp/psso-screensaver-mscp.plist
          /usr/bin/security -q authorizationdb write system.login.screensaver psso-screensaver-mscp 2>&1
      else
          /usr/bin/security -q authorizationdb write system.login.screensaver "authenticate-session-owner" 2>&1
      fi
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_unlock_active_user_session_disable.yaml"
  - id: "CIS-MACOS26-5.8-os_policy_banner_loginwindow_enforce"
    name: "Display Policy Banner at Login Window"
    description: "CIS Apple macOS 26 benchmark recommendation 5.8 (level 2); mSCP rule os_policy_banner_loginwindow_enforce. NIST SP 800-53 Rev. 5: AC-8. DISA STIG: APPL-26-000025."
    tags: [cis, cis-macos26, cis-section-5, cis-level-2, nist-800-53r5-low, nist-800-53r5-moderate, nist-800-53r5-high, nist-800-171, cmmc-level-2, disa-stig]
    severity: medium
    run: |
      /bin/ls -ld /Library/Security/PolicyBanner.rtf* | /usr/bin/wc -l | /usr/bin/tr -d ' '
    allow_rc: any
    expect: "== 1"
    rationale: |
      Displaying a standardized and approved use notification before granting access to the operating system ensures that users are provided with privacy and security notification verbiage that is consistent with applicable federal laws, Executive Orders, directives, policies, regulations, standards, and guidance.

      System use notifications are required only for access via login interfaces with human users and are not required when such human interfaces do not exist.

      The policy banner will show if a "PolicyBanner.rtf" or "PolicyBanner.rtfd" exists in the "/Library/Security" folder.

      The banner text of the document MUST read:

      Center for Internet Security Test Message
    remediation: |
      bannerText="Center for Internet Security Test Message"
      /bin/mkdir /Library/Security/PolicyBanner.rtfd
      /usr/bin/textutil -convert rtf -output /Library/Security/PolicyBanner.rtfd/TXT.rtf -stdin <<EOF
      $bannerText
      EOF
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_policy_banner_loginwindow_enforce.yaml"
  - id: "CIS-MACOS26-5.9-os_guest_folder_removed"
    name: "Remove Guest Folder if Present"
    description: "CIS Apple macOS 26 benchmark recommendation 5.9 (level 1); mSCP rule os_guest_folder_removed."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2]
    severity: medium
    run: |
      /bin/ls /Users/ | /usr/bin/grep -c "Guest"
    allow_rc: any
    expect: "== 0"
    rationale: |
      The guest folder MUST be deleted if present.
    remediation: |
      /bin/rm -Rf /Users/Guest
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_guest_folder_removed.yaml"
  - id: "CIS-MACOS26-5.10-os_anti_virus_installed"
    name: "Must Use an Approved Antivirus Program"
    description: "CIS Apple macOS 26 benchmark recommendation 5.10 (level 1); mSCP rule os_anti_virus_installed."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2]
    severity: high
    run: |
      /usr/bin/xprotect status | /usr/bin/grep -cE "(launch scans: enabled|background scans: enabled)"
    allow_rc: any
    expect: "== 2"
    rationale: |
      An approved antivirus product MUST be installed and configured to run.

      Malicious software can establish a base on individual desktops and servers. Employing an automated mechanism to detect this type of software will aid in elimination of the software from the operating system.'
    remediation: |
      /bin/launchctl load -w /Library/Apple/System/Library/LaunchDaemons/com.apple.XProtect.daemon.scan.plist
      /bin/launchctl load -w /Library/Apple/System/Library/LaunchDaemons/com.apple.XprotectFramework.PluginService.plist

      NOTE: These services cannot be unloaded or loaded while System Integrity Protection (SIP) is enabled.
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_anti_virus_installed.yaml"
  - id: "CIS-MACOS26-5.11-os_sudo_log_enforce"
    name: "Configure Sudo To Log Events"
    description: "CIS Apple macOS 26 benchmark recommendation 5.11 (level 1); mSCP rule os_sudo_log_enforce. NIST SP 800-53 Rev. 5: AC-6(9). DISA STIG: APPL-26-000190."
    tags: [cis, cis-macos26, cis-section-5, cis-level-1, cis-level-2, nist-800-53r5-moderate, nist-800-53r5-high, disa-stig, cmmc-level-2, nist-800-171]
    severity: medium
    run: |
      /usr/bin/sudo /usr/bin/sudo -V | /usr/bin/grep -c "Log when a command is allowed by sudoers"
    allow_rc: any
    expect: "== 1"
    rationale: |
      Sudo MUST be configured to log privilege escalation.
    remediation: |
      /usr/bin/find /etc/sudoers* -type f -exec sed -i '' '/^Defaults[[:blank:]]*\!log_allowed/s/^/# /' '{}' \;
      /bin/echo "Defaults log_allowed" >> /etc/sudoers.d/mscp
    reference: "https://github.com/usnistgov/macos_security/blob/tahoe/rules/os/os_sudo_log_enforce.yaml"
  - id: "CIS-MACOS26-6.3.1-os_safari_open_safe_downloads_disable"
    name: "Disable Automatic Opening of Safe Files in Safari"
    description: "CIS Apple macOS 26 benchmark recommendation 6.3.1 (level 1); mSCP rule os_safari_open_safe_downloads_disable."
    tags: [cis, cis-macos26, cis-section-6, cis-level-1, cis-level-2]
    severity: medium
    run: |
      /usr/bin/profiles -P -o stdout | /usr/bin/grep -c 'AutoOpenSafeDownloads = 0' | /usr/bin/awk '{ if ($1 >= 1) {print "1"} else {print "0"}}'
    allow_rc: any
    expect: "== 1"
    rationale: |
      Open "safe" files after downloading MUST be disabled in Safari.
    remediation: |
      This is implemented by a Configuration Profile.

