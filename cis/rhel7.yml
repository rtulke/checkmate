  - id: "CIS-RHEL7-1.1.22-sticky_bit"
    name: "sticky bit: df --local -P 2\u003e /dev/null | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev …"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.1.22. CIS Controls v8: 3.3, 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      df --local -P 2> /dev/null | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type d \( -perm -0002 -a ! -perm -1000 \) 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-efff70ba56 |
      In a world-writable directory without the sticky bit, any user can delete or rename files owned by others, enabling denial of service and attacks such as swapping a file another process is about to use. The sticky bit limits removal and renaming to the file owner, the directory owner and root, as is standard for /tmp.
    remediation: &rem-2801f3f799 |
      Review each directory reported by the check. Set the sticky bit if it must remain world-writable, otherwise remove the write permission for others.

      chmod a+t DIR
      chmod o-w DIR
  - id: "CIS-RHEL7-1.1.23-autofs-enabled"
    name: "Service autofs is not enabled"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.1.23. CIS Controls v8: 10.3."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState autofs | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-be672be210 |
      autofs mounts file systems, including removable media and network shares, automatically on access. This lets users without privileges bring in media with malicious content or trigger mounts of untrusted sources. Unless automatic mounting is needed, the service should be disabled.
    remediation: &rem-7661f5c35e |
      Disable the service autofs, unless the system needs it:

      systemctl disable autofs

      To keep other units from starting it, mask it instead: systemctl mask autofs
  - id: "CIS-RHEL7-1.1.23-autofs-running"
    name: "Service autofs is not running"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.1.23. CIS Controls v8: 10.3."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState autofs | cut -d= -f2
    expect: "!= active"
    rationale: *rat-be672be210
    remediation: &rem-07a8398219 |
      Stop the service autofs, unless the system needs it:

      systemctl stop autofs
  - id: "CIS-RHEL7-1.1.24-cramfs"
    name: "cramfs: modprobe -n -v usb-storage | grep -E '(usb-storage|install)'"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.1.24. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v usb-storage | grep -E '(usb-storage|install)'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /(usr/)?bin/(true|false)" }
    rationale: *rat-9425c177af
    remediation: *rem-473336823d
  - id: "CIS-RHEL7-1.2.1-gpg_keys"
    name: "gpg keys: rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --\u003e %{summary}"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.2.1. CIS Controls v8: 7.3, 7.4."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --> %{summary}
      '
    expect: { rc: "== 0" }
    rationale: &rat-4781e33879 |
      Package signatures are only meaningful if the keys used to verify them are the right ones. An unexpected or attacker-supplied key in the package manager's keyring lets packages signed with it install without warning. Reviewing the imported keys ensures that only vendor and approved repository keys are trusted.
    remediation: &rem-e2da82e641 |
      Import the distribution vendor's package signing key and remove any key that does not belong to an approved repository. List the installed keys first.

      rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --> %{summary}\n'
      rpm --import /etc/pki/rpm-gpg/KEYFILE
      rpm -e gpg-pubkey-VERSION-RELEASE

      The vendor keys ship in /etc/pki/rpm-gpg/, for example RPM-GPG-KEY-redhat-release on RHEL, RPM-GPG-KEY-amazon-linux-2 on Amazon Linux 2 and RPM-GPG-KEY-amazon-linux-2023 on Amazon Linux 2023. On Amazon Linux 2027 the check expects the Amazon Linux key with the fingerprint 37ce7c3833e5a33c4a1e4b0d5408eaa4b1e92e3d.
  - id: "CIS-RHEL7-1.2.2-repos_configured"
    name: "repos configured: yum repolist"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.2.2. CIS Controls v8: 7.3, 7.4."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      yum repolist
    expect: { rc: "== 0" }
    rationale: &rat-70d1c99f9e |
      Systems should get packages and security fixes only from known, approved repositories. A missing or broken repository configuration prevents patching, while unknown repositories can introduce untrusted software. Depending on the platform the check verifies that the repository list can be read, that expected repositories are present, or asks for a manual review.
    remediation: &rem-f181846f51 |
      Make sure the system has working repositories from approved sources so that the repository listing succeeds. Review the configured repositories, enable the required ones and fix errors such as unreachable mirrors, proxy settings or a missing subscription.

      dnf repolist all
      dnf config-manager --set-enabled REPO
      subscription-manager register

      On RHEL 7 and Amazon Linux 2 use yum repolist all and yum-config-manager --enable REPO; subscription-manager is only used on RHEL. On Amazon Linux 2 the check expects the amzn2-core and amzn2extra-docker repositories (amazon-linux-extras enable docker). On RHEL 8 it expects the BaseOS and AppStream repositories.
  - id: "CIS-RHEL7-1.2.3-gpg_check_global"
    name: "gpg check global: if [ `grep -c -E '^\\s*gpgcheck.*0' /etc/yum.conf` -ge 1 ]; then echo FAIL; elif [ `grep -…"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.2.3. CIS Controls v8: 7.3."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      if [ `grep -c -E '^\s*gpgcheck.*0' /etc/yum.conf` -ge 1 ]; then echo FAIL; elif [ `grep -c -E '^\s*gpgcheck.*1' /etc/yum.conf` -ge 1 ]; then echo Passed_Check;fi
    expect: { rc: "== 0" }
    rationale: &rat-b9d4a35c8e |
      Package signature verification ensures that only packages signed by a trusted vendor key are installed. With gpgcheck disabled, a compromised mirror, a man-in-the-middle on the download path or a tampered local file could deliver modified packages that run code as root during installation. Enabling it globally covers every repository that does not explicitly override it.
    remediation: &rem-fd953dd28c |
      Enable package signature checking in the [main] section of the package manager configuration and remove any gpgcheck=0 setting.

      sed -i --follow-symlinks 's/^\s*gpgcheck\s*=.*/gpgcheck=1/' /etc/dnf/dnf.conf
      grep -q '^\s*gpgcheck' /etc/dnf/dnf.conf || sed -i --follow-symlinks '/^\[main\]/a gpgcheck=1' /etc/dnf/dnf.conf

      On RHEL 7 and Amazon Linux 2023 the check reads /etc/yum.conf: run the same commands on that file (on Amazon Linux 2023 it normally links to /etc/dnf/dnf.conf).
  - id: "CIS-RHEL7-1.2.3-gpg_check_repo"
    name: "gpg check repo: if [ `grep -c -E '^\\s*gpgcheck.*0' /etc/yum.repos.d/*.repo` -ge 1 ]; then echo FAIL; elif…"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.2.3. CIS Controls v8: 7.3."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      if [ `grep -c -E '^\s*gpgcheck.*0' /etc/yum.repos.d/*.repo` -ge 1 ]; then echo FAIL; elif [ `grep -c -E '^\s*gpgcheck.*1' /etc/yum.repos.d/*.repo` -ge 1 ]; then echo Passed_Check;fi
    expect: { rc: "== 0" }
    rationale: &rat-b0f4f69ff9 |
      A repository definition can override the global setting and turn signature checking off for its packages. Any repository with gpgcheck disabled lets unsigned or tampered packages be installed silently, so signature checking needs to stay enabled for every configured repository.
    remediation: &rem-4675487d5a |
      Enable package signature checking in every repository definition: find the repositories that disable it and set gpgcheck=1 in each listed FILE.

      grep -RniwE '(pkg_)?gpgcheck\s*=\s*(0|false|no)' /etc/yum.repos.d/ /etc/distro.repos.d/ /etc/dnf/repos.override.d/ 2>/dev/null
      sed -i -E 's/^(\s*)(pkg_)?gpgcheck\s*=\s*(0|false|no)\b/\1\2gpgcheck=1/I' FILE

      Amazon Linux 2 also flags commented-out gpgcheck=0 lines; delete those too. Make sure the repository's signing key (gpgkey=) is available, otherwise installations from it fail.
  - id: "CIS-RHEL7-1.2.4-subscription"
    name: "subscription: subscription-manager list --consumed | grep -A4 'Roles:\\s*Red Hat Enterprise Linux Server'"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.2.4. CIS Controls v8: 7.3."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      subscription-manager list --consumed | grep -A4 'Roles:\s*Red Hat Enterprise Linux Server'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ Subscription is current" }
    rationale: &rat-5be311cac7 |
      A Red Hat system needs an active subscription to receive security errata and updates from Red Hat repositories. Without it, known vulnerabilities stay unpatched. The check verifies that a Red Hat Enterprise Linux Server subscription is consumed and current.
    remediation: &rem-b74100841e |
      Register the system and attach a current Red Hat Enterprise Linux Server subscription, then verify it:

      subscription-manager register
      subscription-manager attach --auto
      subscription-manager list --consumed

      With Simple Content Access no subscriptions are listed as consumed and this check cannot pass; then verify repository access with subscription-manager status instead.
  - id: "CIS-RHEL7-1.2.5-rhnsd-enabled"
    name: "Service rhnsd is not enabled"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.2.5. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState rhnsd | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-f97ae1efb3 |
      rhnsd is the daemon of the legacy Red Hat Network / Satellite 5 management. Where systems are managed by subscription-manager or Satellite 6 it is not needed, but it still runs periodically with root privileges and contacts remote servers. Disabling it removes an unnecessary privileged network client.
    remediation: &rem-6b2d44b217 |
      Disable the service rhnsd, unless the system needs it:

      systemctl disable rhnsd

      To keep other units from starting it, mask it instead: systemctl mask rhnsd
  - id: "CIS-RHEL7-1.2.5-rhnsd-running"
    name: "Service rhnsd is not running"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.2.5. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState rhnsd | cut -d= -f2
    expect: "!= active"
    rationale: *rat-f97ae1efb3
    remediation: &rem-86f9931ae6 |
      Stop the service rhnsd, unless the system needs it:

      systemctl stop rhnsd
  - id: "CIS-RHEL7-1.3.1-aide"
    name: "Package aide is installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.3.1. CIS Controls v8: 3.14."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet aide
    expect: true
    rationale: &rat-24b82fc810 |
      AIDE is a file integrity checker that records a baseline of files and later reports changes. It detects unauthorised modifications of binaries and configuration files that could indicate a compromise.
    remediation: &rem-e06a562748 |
      Install the package aide:

      yum install aide
  - id: "CIS-RHEL7-1.3.2-aide_cron"
    name: "aide cron: grep -rs aide /etc/cron.* /etc/crontab /var/spool/cron/*"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.3.2. CIS Controls v8: 3.14."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -rs aide /etc/cron.* /etc/crontab /var/spool/cron/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { none: "~ ^#" }
    rationale: &rat-86b8cfeaea |
      A file integrity baseline is only useful if it is compared regularly. Scheduling AIDE checks ensures that unexpected changes to system files are reported automatically instead of remaining unnoticed until someone runs the check by hand.
    remediation: &rem-586580ed0b |
      Schedule a regular AIDE check with cron, for example daily in /etc/cron.d, after the AIDE database has been initialised (aide --init and moving aide.db.new.gz to aide.db.gz).

      echo '0 5 * * * root /usr/sbin/aide --check' > /etc/cron.d/aide
      chmod 0644 /etc/cron.d/aide

      A systemd timer would work as well, but this check only looks at cron files.
  - id: "CIS-RHEL7-1.4.1-boot_grub2_user.cfg-attrs"
    name: "/boot/grub2/user.cfg: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.4.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/boot/grub2/user.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-3605508323 |
      /boot/grub2/user.cfg holds the hash of the GRUB boot loader password. Readable by other users it allows offline cracking, writable it allows removing boot protection. Restricting it to root with mode 0600 keeps the boot loader password effective.
    remediation: &rem-60591daf30 |
      Create /boot/grub2/user.cfg if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/boot/grub2/user.cfg'
      chmod u-xs,g-rwxs,o-rwx,a-t '/boot/grub2/user.cfg'
  - id: "CIS-RHEL7-1.4.2-boot_grub2_grub.cfg-attrs"
    name: "/boot/grub2/grub.cfg: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.4.2. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/boot/grub2/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-841f0e4891 |
      The GRUB configuration contains the kernel command line and, if set, the boot loader password hash. If other users can read or modify it they can learn boot parameters, attack the password hash offline or add options that disable security features such as SELinux or auditing on the next boot. Restricting it to root prevents this.
    remediation: &rem-9e6da05721 |
      Create /boot/grub2/grub.cfg if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/boot/grub2/grub.cfg'
      chmod u-xs,g-rwxs,o-rwx,a-t '/boot/grub2/grub.cfg'
  - id: "CIS-RHEL7-1.4.3-single_user_1"
    name: "single user 1: grep /sbin/sulogin /usr/lib/systemd/system/rescue.service"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.4.3. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep /sbin/sulogin /usr/lib/systemd/system/rescue.service
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^ExecStart=-/bin/sh -c \"/sbin/sulogin; /usr/bin/systemctl --fail --no-block default" }
    rationale: &rat-dc3114c2e3 |
      Rescue and emergency mode give a root shell for system repair. If the rescue unit does not run sulogin, anyone with console access can boot into that mode and get root without a password. Requiring the root password via sulogin closes this gap.
    remediation: &rem-6e501cbbff |
      Make the ExecStart line of /usr/lib/systemd/system/rescue.service run /sbin/sulogin exactly as the check expects, then reload systemd:

      sed -i 's|^ExecStart=.*|ExecStart=-/bin/sh -c "/sbin/sulogin; /usr/bin/systemctl --fail --no-block default"|' /usr/lib/systemd/system/rescue.service
      systemctl daemon-reload

      The check reads the vendor unit file, so a systemd package update can restore the original line; re-check after updates.
  - id: "CIS-RHEL7-1.4.3-single_user_2"
    name: "single user 2: grep /sbin/sulogin /usr/lib/systemd/system/emergency.service"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.4.3. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep /sbin/sulogin /usr/lib/systemd/system/emergency.service
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^ExecStart=-/bin/sh -c \"/sbin/sulogin; /usr/bin/systemctl --fail --no-block default" }
    rationale: &rat-49573b0ec5 |
      Rescue and emergency mode give a root shell for system repair. If the emergency unit does not run sulogin, anyone with console access can boot into that mode and get root without a password. Requiring the root password via sulogin closes this gap.
    remediation: &rem-759de77d21 |
      Make the ExecStart line of /usr/lib/systemd/system/emergency.service run /sbin/sulogin exactly as the check expects, then reload systemd:

      sed -i 's|^ExecStart=.*|ExecStart=-/bin/sh -c "/sbin/sulogin; /usr/bin/systemctl --fail --no-block default"|' /usr/lib/systemd/system/emergency.service
      systemctl daemon-reload

      The check reads the vendor unit file, so a systemd package update can restore the original line; re-check after updates.
  - id: "CIS-RHEL7-1.5.1-fs.suid_dumpable"
    name: "Kernel parameter fs.suid_dumpable is 0"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.5.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n fs.suid_dumpable
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-e7d91ef8bc |
      fs.suid_dumpable controls whether processes that changed privileges, such as setuid programs, may produce core dumps. A core dump of such a process can contain passwords, keys or other secrets from privileged memory and may be readable by the invoking user. Setting it to 0 disables these dumps. This check verifies the value in the running kernel.
    remediation: &rem-789aaadb7b |
      Set the kernel parameter fs.suid_dumpable to 0, now and at boot:

      sysctl -w 'fs.suid_dumpable=0'
      printf '%s\n' 'fs.suid_dumpable = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of fs.suid_dumpable from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-RHEL7-1.5.1-coredump-enabled"
    name: "Service coredump is not enabled"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.5.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState coredump | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-7c182ccdb3 |
      Core dumps can contain passwords, keys and other sensitive memory content of crashed processes. Disabling the core dump handling service keeps such data from being collected and stored.
    remediation: &rem-be15d1d09f |
      Disable the service coredump, unless the system needs it:

      systemctl disable coredump

      To keep other units from starting it, mask it instead: systemctl mask coredump
  - id: "CIS-RHEL7-1.5.1-coredump-running"
    name: "Service coredump is not running"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.5.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState coredump | cut -d= -f2
    expect: "!= active"
    rationale: *rat-7c182ccdb3
    remediation: &rem-e90c3ca41f |
      Stop the service coredump, unless the system needs it:

      systemctl stop coredump
  - id: "CIS-RHEL7-1.5.1-etc_systemd_coredump.conf-attrs"
    name: "/etc/systemd/coredump.conf: exists"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.5.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/coredump.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-a93a26cf65 |
      Core dumps can contain passwords, keys and other sensitive memory content. Storage=none keeps systemd-coredump from saving them to disk and ProcessSizeMax=0 stops it from processing dumps at all, so crashing processes do not leave memory images behind.
    remediation: &rem-38adbe4ae3 |
      Create /etc/systemd/coredump.conf.
  - id: "CIS-RHEL7-1.5.1-etc_systemd_coredump.conf-content"
    name: "/etc/systemd/coredump.conf has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.5.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/systemd/coredump.conf'
    allow_rc: any
    expect:
      - { some: "~ ^Storage=none" }
      - { some: "~ ^ProcessSizeMax=0" }
    rationale: *rat-a93a26cf65
    remediation: &rem-95cbb4733e |
      Edit /etc/systemd/coredump.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^Storage=none
      - a line matches ^ProcessSizeMax=0
  - id: "CIS-RHEL7-1.5.1-core_dumps_limits"
    name: "core dumps limits: grep -E \"\\*.*hard.*core.*0\" /etc/security/limits.conf /etc/security/limits.d/*"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.5.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "\*.*hard.*core.*0" /etc/security/limits.conf /etc/security/limits.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\/*.*\\shard.*core.*0" }
    rationale: &rat-f0b293c191 |
      Core dumps write a process's memory to disk and can contain passwords, keys and other sensitive data. A hard core size limit of 0 in the PAM limits configuration prevents user processes from producing core files, and users cannot raise a hard limit themselves.
    remediation: &rem-7e22a0850b |
      Set a hard core file size limit of 0 for all users in a file under /etc/security/limits.d/ and remove entries elsewhere that allow a larger hard limit:

      printf '%s\n' '* hard core 0' > /etc/security/limits.d/60-coredump.conf

      The limit applies to new login sessions.
  - id: "CIS-RHEL7-1.5.1-suid_dumpable_2"
    name: "suid dumpable 2: grep \"fs\\.suid_dumpable\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.5.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "fs\.suid_dumpable" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ fs\\.suid_dumpable=0" }
    rationale: &rat-5352269d27 |
      fs.suid_dumpable controls whether setuid and other privilege-changing programs may write core dumps. Such dumps can contain memory of a privileged process, including credentials. A value of 0 prevents them. The check reads the persistent sysctl configuration files.
    remediation: &rem-e7880bb15a |
      Set fs.suid_dumpable=0, written without spaces as the check expects, in a file under /etc/sysctl.d/ and apply it:

      printf '%s\n' 'fs.suid_dumpable=0' > /etc/sysctl.d/60-fs_suid_dumpable.conf
      sysctl -w fs.suid_dumpable=0

      Delete or correct other fs.suid_dumpable lines in /etc/sysctl.conf and /etc/sysctl.d/; the Ubuntu 22.04 and 24.04 variants fail if any of them sets another value.
  - id: "CIS-RHEL7-1.5.2-kernel_nx"
    name: "kernel nx: journalctl | grep 'protection: active'"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.5.2. CIS Controls v8: 10.5."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      journalctl | grep 'protection: active'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ kernel: NX \\(Execute Disable\\) protection: active" }
    rationale: &rat-d4c9adfb2f |
      The NX (No-eXecute, also XD or Execute Disable) CPU feature lets the kernel mark memory regions such as the stack and heap as non-executable. This blocks a large class of buffer overflow exploits that inject and run code in data memory. The check confirms from the boot messages that the kernel activated NX protection.
    remediation: &rem-d099efaf03 |
      Enable the NX/XD (Execute Disable) feature in the system firmware (BIOS/UEFI), or for virtual machines expose it in the hypervisor's CPU configuration, then reboot and verify:

      journalctl -k -b | grep 'protection: active'

      On 32-bit x86 a PAE-capable kernel is required. The check searches the journal, so the boot messages must still be present (persistent journal or not yet rotated).
  - id: "CIS-RHEL7-1.5.3-kernel.randomize_va_space"
    name: "Kernel parameter kernel.randomize_va_space is 2"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.5.3. CIS Controls v8: 10.5."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.randomize_va_space
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 2"
    rationale: &rat-5597c48019 |
      Address space layout randomization places the stack, heap, shared libraries and other memory regions at random addresses. This makes memory corruption exploits much harder because an attacker cannot predict where code or data is located. The value 2 enables full randomization, including the heap.
    remediation: &rem-a6e5efe9f8 |
      Set the kernel parameter kernel.randomize_va_space to 2, now and at boot:

      sysctl -w 'kernel.randomize_va_space=2'
      printf '%s\n' 'kernel.randomize_va_space = 2' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.randomize_va_space from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-RHEL7-1.5.3-aslr_enabled_2"
    name: "aslr enabled 2: grep \"kernel\\.randomize_va_space\" /etc/sysctl.conf /etc/sysctl.d/* | cut -d \":\" -f2"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.5.3. CIS Controls v8: 10.5."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "kernel\.randomize_va_space" /etc/sysctl.conf /etc/sysctl.d/* | cut -d ":" -f2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^kernel.randomize_va_space=2" }
    rationale: &rat-2872b53691 |
      Address space layout randomization places the stack, heap, shared libraries and other memory regions at random addresses, which makes memory corruption exploits much harder. The value 2 enables full randomization. Setting it in a sysctl configuration file ensures it is applied at every boot and not only at runtime.
    remediation: &rem-b364909f96 |
      Set kernel.randomize_va_space to 2 in a sysctl configuration file so it is applied at every boot, and apply it now. Write the line without spaces around the equals sign; some of the checks require that.

      printf '%s\n' 'kernel.randomize_va_space=2' > /etc/sysctl.d/60-kernel_sysctl.conf
      sysctl -w kernel.randomize_va_space=2

      Remove or correct any other kernel.randomize_va_space line in /etc/sysctl.conf and /etc/sysctl.d/.
  - id: "CIS-RHEL7-1.5.4-prelink"
    name: "Package prelink is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.5.4. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet prelink
    expect: false
    rationale: &rat-18deabdd17 |
      prelink rewrites binaries and libraries to speed up loading. These modifications interfere with file integrity tools such as AIDE and with package verification, and a compromised prelink could alter binaries system-wide. With address space randomization in place it brings little benefit.
    remediation: &rem-05965addce |
      Remove the package prelink, unless the system needs it:

      yum remove prelink
  - id: "CIS-RHEL7-1.6.1.1-libselinux"
    name: "Package libselinux is installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.6.1.1. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet libselinux
    expect: true
    rationale: &rat-d13f41f770 |
      libselinux provides the interfaces through which programs and tools interact with SELinux. Without it SELinux cannot be managed or work as intended, losing the mandatory access control layer that confines services even after they are compromised.
    remediation: &rem-2d7c2dc29c |
      Install the package libselinux:

      yum install libselinux
  - id: "CIS-RHEL7-1.6.1.5-selinux_config_enforcing"
    name: "selinux config enforcing: grep -Ei \"^\\s*SELINUX=[Ee]nforcing\" /etc/selinux/config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.6.1.5. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^\s*SELINUX=[Ee]nforcing" /etc/selinux/config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ SELINUX=enforcing" }
    rationale: &rat-3f8c235be5 |
      In enforcing mode SELinux actually blocks actions that its policy does not allow, confining compromised services, while permissive mode only logs violations. Configuring enforcing mode in /etc/selinux/config ensures the protection is active after every boot. Custom applications may need policy adjustments, which can be prepared by reviewing denials in permissive mode first.
    remediation: &rem-822cbbb529 |
      Set SELinux to enforcing in /etc/selinux/config and switch the running system to enforcing.

      sed -i 's/^\s*SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config
      setenforce 1

      If SELinux was disabled before, run touch /.autorelabel and reboot instead of setenforce. Review denials (ausearch -m AVC) before switching production systems.
  - id: "CIS-RHEL7-1.6.1.4-selinux_config_mode"
    name: "selinux config mode: grep -Ei \"^\\s*SELINUX=(enforcing|permissive)\" /etc/selinux/config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.6.1.4. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^\s*SELINUX=(enforcing|permissive)" /etc/selinux/config
    expect: { rc: "== 0" }
    rationale: &rat-71af9f258a |
      SELinux enforces mandatory access control that confines services and limits the damage of a compromised process. If it is disabled in /etc/selinux/config it is not active after boot at all. The check accepts enforcing or permissive; permissive only logs violations and should be a transitional state.
    remediation: &rem-d80887a4ad |
      Set SELINUX=enforcing in /etc/selinux/config and reboot:

      sed -i 's/^SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config
      reboot

      If SELinux was disabled before, run touch /.autorelabel before the reboot so the file systems are relabeled; consider starting with SELINUX=permissive to find denials first.
  - id: "CIS-RHEL7-1.6.1.2-selinux_disabled_boot"
    name: "selinux disabled boot: grep \"^\\s*linux\" /boot/grub2/grub.cfg | grep -E \"(selinux=0|enforcing=0)\""
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.6.1.2. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "^\s*linux" /boot/grub2/grub.cfg | grep -E "(selinux=0|enforcing=0)"
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-09e36f9185 |
      SELinux can be switched off or set to permissive from the kernel command line with selinux=0 or enforcing=0. Such boot parameters override the configuration file and remove mandatory access control for all processes without it being obvious. Keeping them out of the boot configuration ensures SELinux starts as configured.
    remediation: &rem-2c0e091618 |
      Remove selinux=0 and enforcing=0 from the kernel command line of all boot entries and from the defaults used for new kernels, then regenerate the GRUB configuration.

      grubby --update-kernel=ALL --remove-args='selinux=0 enforcing=0'
      sed -i -E 's/[[:space:]]*\b(selinux|enforcing)=0\b//g' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      On Amazon Linux 2027 also remove these parameters from /etc/kernel/cmdline if that file exists. If SELinux was disabled until now, run touch /.autorelabel before rebooting so that files get correct labels.
  - id: "CIS-RHEL7-1.6.1.3-selinux_policy"
    name: "selinux policy: grep SELINUXTYPE= /etc/selinux/config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.6.1.3. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep SELINUXTYPE= /etc/selinux/config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ SELINUXTYPE=targeted" }
    rationale: &rat-2fe59c1dc8 |
      The SELinux policy defines what each confined process may access. The targeted policy confines system and network-facing services; MLS adds multi-level security where required. Configuring a supported, maintained policy type ensures that a meaningful policy is loaded at boot.
    remediation: &rem-bcf47677ad |
      Configure the targeted SELinux policy in /etc/selinux/config and make sure the policy package is installed.

      dnf install selinux-policy-targeted
      sed -i -E 's/^\s*SELINUXTYPE\s*=.*/SELINUXTYPE=targeted/' /etc/selinux/config
      grep -q '^SELINUXTYPE=' /etc/selinux/config || echo 'SELINUXTYPE=targeted' >> /etc/selinux/config

      Use yum on Amazon Linux 2 and RHEL 7. Amazon Linux 2023 and RHEL 10 also accept mls. Changing the policy type requires a relabel (touch /.autorelabel) and a reboot.
  - id: "CIS-RHEL7-1.6.1.5-selinux_run_enforcing"
    name: "selinux run enforcing: getenforce"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.6.1.5. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      getenforce
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ Enforcing" }
    rationale: &rat-1ae7dcb016 |
      This check verifies that SELinux is enforcing at runtime. In permissive mode violations are only logged, so a compromised service would not be contained. Enforcing mode actually denies operations outside the policy.
    remediation: &rem-58c05c7e0f |
      Switch SELinux to enforcing now and in the configuration. Review recent denials first, since enforcing mode blocks what permissive mode only logged.

      ausearch -m avc -ts today
      setenforce 1
      sed -i -E 's/^\s*SELINUX\s*=.*/SELINUX=enforcing/' /etc/selinux/config

      If getenforce reports Disabled, setenforce has no effect: remove selinux=0 from the kernel command line, run touch /.autorelabel and reboot.
  - id: "CIS-RHEL7-1.6.1.4-selinux_running_mode"
    name: "selinux running mode: getenforce"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.6.1.4. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      getenforce
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ \\[Dd\\]isabled" }
    rationale: &rat-02dc949b67 |
      When SELinux is disabled it provides no protection and cannot be activated without a reboot and relabeling. In permissive or enforcing mode the kernel keeps security contexts up to date, and in enforcing mode it blocks policy violations, containing compromised services.
    remediation: &rem-09ac3cac9a |
      Enable SELinux in /etc/selinux/config (enforcing, or permissive while reviewing denials), remove boot parameters that disable it, relabel the file system and reboot. A disabled SELinux cannot be switched on at runtime.

      sed -i -E 's/^\s*SELINUX\s*=.*/SELINUX=enforcing/' /etc/selinux/config
      grubby --update-kernel=ALL --remove-args='selinux=0'
      touch /.autorelabel
      reboot
  - id: "CIS-RHEL7-1.6.1.3-selinux_sestatus"
    name: "selinux sestatus: sestatus | grep 'Loaded policy'"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.6.1.3. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sestatus | grep 'Loaded policy'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ Loaded policy name:             targeted" }
    rationale: &rat-bb1f5e169d |
      This check confirms that SELinux is active and has actually loaded the expected policy, rather than only being configured. Without a loaded policy, services run without mandatory access control and the compromise of one service is not contained.
    remediation: &rem-22a711895d |
      Enable SELinux with the targeted policy and reboot so that the policy gets loaded.

      dnf install selinux-policy-targeted
      sed -i -E 's/^\s*SELINUX\s*=.*/SELINUX=enforcing/; s/^\s*SELINUXTYPE\s*=.*/SELINUXTYPE=targeted/' /etc/selinux/config
      grubby --update-kernel=ALL --remove-args='selinux=0 enforcing=0'
      touch /.autorelabel
      reboot

      Use yum on Amazon Linux 2 and RHEL 7. RHEL 10 also accepts the mls policy. Relabeling can take long on large file systems; SELINUX=permissive for the first boot lets you review denials before enforcing.
  - id: "CIS-RHEL7-1.6.1.6-selinux_unconfined"
    name: "selinux unconfined: ps -eZ | grep unconfined_service_t"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.6.1.6. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      ps -eZ | grep unconfined_service_t
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-a60d4dcb76 |
      Processes in the unconfined_service_t domain are services for which no SELinux policy applies, typically software installed outside the distribution packages. They run without SELinux restrictions, so a compromise of such a service is not contained. Every service should run in a confined domain or be reviewed and approved as an exception.
    remediation: &rem-491577d017 |
      Each listed process runs as an unconfined service. Identify its executable and give it a confined SELinux domain: restore the file context if a distribution service binary is mislabeled, or create and install a policy module for third-party software, then restart the service.

      ps -eZ | grep unconfined_service_t
      ls -Z BINARY
      restorecon -v BINARY
      sepolicy generate --init BINARY

      sepolicy generate (package policycoreutils-devel) creates a policy skeleton and a setup script; refine the module in permissive mode before enforcing it. Software that cannot be confined needs a documented exception.
  - id: "CIS-RHEL7-1.6.1.8-mcstrans"
    name: "Package mcstrans is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.6.1.8. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet mcstrans
    expect: false
    rationale: &rat-f702f7174c |
      mcstrans translates SELinux MCS/MLS security levels into readable names. Most systems do not need it, and like any unnecessary daemon it adds privileged code and attack surface. Removing it keeps the system minimal.
    remediation: &rem-1948db82b4 |
      Remove the package mcstrans, unless the system needs it:

      yum remove mcstrans
  - id: "CIS-RHEL7-1.6.1.7-setroubleshoot"
    name: "Package setroubleshoot is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.6.1.7. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet setroubleshoot
    expect: false
    rationale: &rat-d9369ee205 |
      setroubleshoot analyses SELinux denials and presents them to users, mainly on desktops. On servers it is not needed, runs additional privileged code and can expose information about denials to unprivileged users. Denials remain available in the audit log without it.
    remediation: &rem-927ef0f80f |
      Remove the package setroubleshoot, unless the system needs it:

      yum remove setroubleshoot
  - id: "CIS-RHEL7-1.7.2-etc_issue-attrs"
    name: "/etc/issue: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.7.2. CIS Controls v8: 3.3, 4.8."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-4d2717dc87 |
      /etc/issue is shown before local logins. It should present a usage or legal warning and not reveal operating system names, versions or architecture that help attackers. The file should be owned by root and not writable by others, so the message cannot be altered.
    remediation: &rem-683e1f474b |
      Create /etc/issue if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue'
  - id: "CIS-RHEL7-1.7.2-etc_issue-content"
    name: "/etc/issue has the expected content (5 rules)"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.7.2. CIS Controls v8: 3.3, 4.8."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/issue'
    allow_rc: any
    expect:
      - { none: "~ \\[Cc\\]ent\\[Oo\\]\\[Ss\\]" }
      - { none: "~ \\[Rr\\]hel" }
      - { none: "~ \\[Rr\\]ed\\[Hh\\]at" }
      - { none: "~ x86_64" }
      - { none: "~ \\[Ll\\]inux" }
    rationale: *rat-4d2717dc87
    remediation: &rem-b3f89f8d30 |
      Edit /etc/issue so that its lines meet these conditions (regular expressions):

      - no line matches \[Cc\]ent\[Oo\]\[Ss\]
      - no line matches \[Rr\]hel
      - no line matches \[Rr\]ed\[Hh\]at
      - no line matches x86_64
      - no line matches \[Ll\]inux
  - id: "CIS-RHEL7-1.7.3-etc_issue.net-attrs"
    name: "/etc/issue.net: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.7.3. CIS Controls v8: 3.3, 4.8."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue.net'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-e92ea8bf7a |
      /etc/issue.net is shown before remote logins, for example as the SSH banner. It should present a usage or legal warning and not reveal operating system names, versions or architecture that help attackers. The file should be owned by root and not writable by others, so the message cannot be altered.
    remediation: &rem-eb0556c5ea |
      Create /etc/issue.net if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue.net'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue.net'
  - id: "CIS-RHEL7-1.7.3-etc_issue.net-content"
    name: "/etc/issue.net has the expected content (5 rules)"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.7.3. CIS Controls v8: 3.3, 4.8."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/issue.net'
    allow_rc: any
    expect:
      - { none: "~ \\[Cc\\]ent\\[Oo\\]\\[Ss\\]" }
      - { none: "~ \\[Rr\\]hel" }
      - { none: "~ \\[Rr\\]ed\\[Hh\\]at" }
      - { none: "~ x86_64" }
      - { none: "~ \\[Ll\\]inux" }
    rationale: *rat-e92ea8bf7a
    remediation: &rem-3e504f9fcf |
      Edit /etc/issue.net so that its lines meet these conditions (regular expressions):

      - no line matches \[Cc\]ent\[Oo\]\[Ss\]
      - no line matches \[Rr\]hel
      - no line matches \[Rr\]ed\[Hh\]at
      - no line matches x86_64
      - no line matches \[Ll\]inux
  - id: "CIS-RHEL7-1.7.1-etc_motd-attrs"
    name: "/etc/motd: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.7.1. CIS Controls v8: 3.3, 4.8."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/motd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-a5eb4a65f8 |
      The message of the day is shown to every user after login. It should be owned by root and not writable by others, so nobody can plant misleading messages, and it should not reveal operating system name, release or architecture, which helps attackers pick matching exploits.
    remediation: &rem-cc50883ec8 |
      Create /etc/motd if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/motd'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/motd'
  - id: "CIS-RHEL7-1.7.1-etc_motd-content"
    name: "/etc/motd has the expected content (5 rules)"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.7.1. CIS Controls v8: 3.3, 4.8."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/motd'
    allow_rc: any
    expect:
      - { none: "~ \\[Cc\\]ent\\[Oo\\]\\[Ss\\]" }
      - { none: "~ \\[Rr\\]hel" }
      - { none: "~ \\[Rr\\]ed\\[Hh\\]at" }
      - { none: "~ x86_64" }
      - { none: "~ \\[Ll\\]inux" }
    rationale: *rat-a5eb4a65f8
    remediation: &rem-b9eecd3bd8 |
      Edit /etc/motd so that its lines meet these conditions (regular expressions):

      - no line matches \[Cc\]ent\[Oo\]\[Ss\]
      - no line matches \[Rr\]hel
      - no line matches \[Rr\]ed\[Hh\]at
      - no line matches x86_64
      - no line matches \[Ll\]inux
  - id: "CIS-RHEL7-1.8.1-gdm"
    name: "Package gdm is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.8.1. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      rpm -q --quiet gdm
    expect: false
    rationale: &rat-d3c9c18d1b |
      gdm is the GNOME display manager that provides a graphical login. Servers rarely need a graphical environment, which adds a large amount of software and potential vulnerabilities. Removing it reduces the attack surface; desktops are the exception.
    remediation: &rem-4b9f7714b4 |
      Remove the package gdm, unless the system needs it:

      yum remove gdm
  - id: "CIS-RHEL7-1.9-security-updates"
    name: "security updates: yum check-update"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.9. CIS Controls v8: 7.3, 7.4."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      yum check-update
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ \\[0-9\\]\\.\\* packages available" }
    rationale: &rat-7cc1d8773a |
      Unpatched software is one of the most common ways systems are compromised. Installing available updates closes publicly known vulnerabilities before they can be exploited. The check reports a failure while updates are pending; on most platforms this includes non-security updates.
    remediation: &rem-bcb4a0c358 |
      Install all pending package updates; the check fails as long as any update is available, not only security updates.

      dnf upgrade

      On Amazon Linux 2 and RHEL 7 use yum update. Reboot if the kernel or core libraries were updated. On Amazon Linux 2023 dnf may also announce a newer release, which counts as pending; apply it with dnf upgrade --releasever=latest after testing.
  - id: "CIS-RHEL7-2.1.1-xinetd"
    name: "Package xinetd is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.1.1. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet xinetd
    expect: false
    rationale: &rat-11ba7684f1 |
      xinetd is a super-server that starts legacy network services on demand, many of which (telnet, rsh, tftp) are insecure. If it is not needed, removing it eliminates a way to expose such services unnoticed.
    remediation: &rem-4aadc3d9d3 |
      Remove the package xinetd, unless the system needs it:

      yum remove xinetd
  - id: "CIS-RHEL7-2.2.2-xorgs-x11-servers"
    name: "Package xorgs-x11-servers is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.2. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet xorgs-x11-servers
    expect: false
    rationale: &rat-5b2ffe2158 |
      A graphical X server adds a large amount of complex, historically vulnerable code and usually brings further desktop packages with it. Servers are administered remotely and do not need a local display server, so leaving it off reduces the attack surface and patching effort. Workstations that need a GUI are the exception.
    remediation: &rem-9513712415 |
      Remove the package xorgs-x11-servers, unless the system needs it:

      yum remove xorgs-x11-servers
  - id: "CIS-RHEL7-2.2.3-avahi"
    name: "Package avahi is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.3. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet avahi
    expect: false
    rationale: &rat-6dd3f1442b |
      Avahi implements mDNS/DNS-SD zero-configuration networking, announcing the host and its services on the local network and listening for multicast traffic. Servers do not need automatic service discovery, and the daemon both leaks information about the system and exposes a network listener that has had vulnerabilities. Removing it avoids both.
    remediation: &rem-761b7c8fdd |
      Remove the package avahi, unless the system needs it:

      yum remove avahi
  - id: "CIS-RHEL7-2.2.4-cups"
    name: "Package cups is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.4. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet cups
    expect: false
    rationale: &rat-5fd2f513f0 |
      CUPS provides printing services and can listen on the network (port 631), offer a web interface and browse for remote printers. Systems that do not print gain nothing from it but carry an extra network service with a history of security fixes. Remove it unless the host prints or acts as a print server.
    remediation: &rem-079c782c8f |
      Remove the package cups, unless the system needs it:

      yum remove cups
  - id: "CIS-RHEL7-2.2.5-dhcp"
    name: "Package dhcp is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.5. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet dhcp
    expect: false
    rationale: &rat-76febf12e3 |
      The dhcp package provides a DHCP server. An unintended DHCP server can hand out wrong addresses, gateways or DNS servers to other machines, and the daemon is network-facing code that must be patched. Only hosts that are designated DHCP servers should have it installed.
    remediation: &rem-439ddd1408 |
      Remove the package dhcp, unless the system needs it:

      yum remove dhcp
  - id: "CIS-RHEL7-2.2.6-openldap-servers"
    name: "Package openldap-servers is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.6. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet openldap-servers
    expect: false
    rationale: &rat-089e9d21be |
      openldap-servers provides the slapd LDAP directory server. Unless the system is a directory server, an LDAP service exposes a network port and may hold sensitive identity data that needs careful protection. Removing it reduces the attack surface.
    remediation: &rem-7e1cf0a06c |
      Remove the package openldap-servers, unless the system needs it:

      yum remove openldap-servers
  - id: "CIS-RHEL7-2.2.7-bind"
    name: "Package bind is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.7. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet bind
    expect: false
    rationale: &rat-68a563d1d3 |
      BIND provides a DNS server. Running a name server where none is needed exposes a complex network service, can be abused for amplification attacks if misconfigured, and may disclose internal names. Only designated DNS servers should have it installed; the client tools are in a separate package.
    remediation: &rem-1771801b5f |
      Remove the package bind, unless the system needs it:

      yum remove bind
  - id: "CIS-RHEL7-2.2.8-vsftpd"
    name: "Package vsftpd is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.8. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet vsftpd
    expect: false
    rationale: &rat-436c2763bd |
      vsftpd is an FTP server. FTP transfers credentials and data unencrypted unless TLS is configured carefully, and an FTP service is a frequent target for brute-force attacks and data leaks. Use SFTP or another encrypted transfer method and keep the FTP server off systems that do not explicitly provide it.
    remediation: &rem-84d4312427 |
      Remove the package vsftpd, unless the system needs it:

      yum remove vsftpd
  - id: "CIS-RHEL7-2.2.9-httpd"
    name: "Package httpd is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.9. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet httpd
    expect: false
    rationale: &rat-363beaff7b |
      The Apache HTTP server opens a network service with a large attack surface through its modules and the content it serves. If the host is not meant to be a web server, removing it avoids accidental exposure of files and the patching burden of an unused service.
    remediation: &rem-d6f4485c12 |
      Remove the package httpd, unless the system needs it:

      yum remove httpd
  - id: "CIS-RHEL7-2.2.10-dovecot"
    name: "Package dovecot is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.10. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet dovecot
    expect: false
    rationale: &rat-22557fc45d |
      Dovecot is an IMAP and POP3 server that accepts user logins over the network. On systems that are not mail servers it is an unnecessary authentication endpoint and network service, and should be removed.
    remediation: &rem-ebe89aaafd |
      Remove the package dovecot, unless the system needs it:

      yum remove dovecot
  - id: "CIS-RHEL7-2.2.11-samba"
    name: "Package samba is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.11. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet samba
    expect: false
    rationale: &rat-d7ad1732cb |
      Samba provides SMB/CIFS file and print sharing. The SMB protocol and its implementations have a long history of critical vulnerabilities, and shares can expose data if misconfigured. Install the server only on hosts that must share files with Windows clients; client-only use does not need the server package.
    remediation: &rem-9c5ef70778 |
      Remove the package samba, unless the system needs it:

      yum remove samba
  - id: "CIS-RHEL7-2.2.12-squid"
    name: "Package squid is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.12. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet squid
    expect: false
    rationale: &rat-04d3922e1d |
      Squid is an HTTP caching proxy. An unneeded or misconfigured proxy can be abused to relay traffic, bypass network controls or reach internal systems, and it is network-facing code that requires patching. Remove it unless the host is a designated proxy server.
    remediation: &rem-6d72ca030d |
      Remove the package squid, unless the system needs it:

      yum remove squid
  - id: "CIS-RHEL7-2.2.13-net-snmp"
    name: "Package net-snmp is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.13. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet net-snmp
    expect: false
    rationale: &rat-7e8efdc0ad |
      net-snmp provides an SNMP agent. SNMP v1 and v2c send community strings in clear text and can disclose detailed system information or, with write access, allow configuration changes. Run an SNMP agent only where monitoring requires it, and then prefer SNMPv3 with authentication and encryption.
    remediation: &rem-f1f7acdde0 |
      Remove the package net-snmp, unless the system needs it:

      yum remove net-snmp
  - id: "CIS-RHEL7-2.2.14-ypserver"
    name: "Package ypserver is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.14. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet ypserver
    expect: false
    rationale: &rat-235f84ca9a |
      The NIS server distributes account and host maps over the network without encryption and with weak authentication, so any host on the segment can read password hashes or impersonate the server. A system that does not act as a NIS server has no reason to carry this software, and removing it eliminates an unneeded network service.
    remediation: &rem-274924be0c |
      Remove the package ypserver, unless the system needs it:

      yum remove ypserver
  - id: "CIS-RHEL7-2.2.15-telnet-server"
    name: "Package telnet-server is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.15. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet telnet-server
    expect: false
    rationale: &rat-c93a56c245 |
      Telnet sends user names, passwords and the whole session in clear text, so anyone able to observe the network can capture credentials. SSH provides the same remote access securely, so a telnet server should not be installed.
    remediation: &rem-0ced57e116 |
      Remove the package telnet-server, unless the system needs it:

      yum remove telnet-server
  - id: "CIS-RHEL7-2.2.16-mta_installed"
    name: "mta installed: ss -lntu | grep -E \":25\\s\" | grep -E -v \"\\s(127.0.0.1|\\[?::1\\]?):25\\s\""
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.16. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      ss -lntu | grep -E ":25\s" | grep -E -v "\s(127.0.0.1|\[?::1\]?):25\s"
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-9517b0fc0d |
      A mail transfer agent that listens on external interfaces accepts SMTP connections from the network, which exposes a complex service to attack and can turn the host into a spam relay if misconfigured. Most systems only need to deliver locally generated mail, which works with the MTA bound to the loopback interface.
    remediation: &rem-957d67671c |
      Bind the mail transfer agent to the loopback interface only (or remove it if the host sends no mail), then restart it.

      postconf -e 'inet_interfaces = loopback-only'
      systemctl restart postfix
      ss -lntu | grep ':25\s'

      For other MTAs such as sendmail or exim, restrict the listening address in their own configuration. Hosts that are mail relays by design are an exception.
  - id: "CIS-RHEL7-2.2.1.1-chrony"
    name: "Package chrony is installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.1.1. CIS Controls v8: 8.4."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet chrony
    expect: true
    rationale: &rat-a0cc2c0b8d |
      Accurate, synchronized time is required for log correlation, Kerberos, certificate validation and time-based one-time passwords. A system should run exactly one time synchronization client. Depending on the platform the check expects chrony to be installed or, where systemd-timesyncd is the chosen client, not installed, to avoid competing daemons.
    remediation: &rem-65033820a3 |
      Install the package chrony:

      yum install chrony
  - id: "CIS-RHEL7-2.2.1.2-chronyd-enabled"
    name: "Service chronyd is enabled"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.1.2. CIS Controls v8: 8.4."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState chronyd | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-487a3e248c |
      chronyd keeps the system clock synchronized with reliable time sources. Correct time is needed for log correlation, Kerberos, certificate validation and one-time passwords. The service has to be enabled to start at boot and active now.
    remediation: &rem-f78265882f |
      Enable the service chronyd:

      systemctl enable chronyd
  - id: "CIS-RHEL7-2.2.1.2-chronyd-running"
    name: "Service chronyd is running"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.1.2. CIS Controls v8: 8.4."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState chronyd | cut -d= -f2
    expect: "== active"
    rationale: *rat-487a3e248c
    remediation: &rem-c06e819daf |
      Start the service chronyd:

      systemctl start chronyd
  - id: "CIS-RHEL7-2.2.1.2-etc_chrony.conf-attrs"
    name: "/etc/chrony.conf: exists"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.2.1.2. CIS Controls v8: 8.4."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
