# Do not edit by hand; regenerate with `make cis-import`. See cis/NOTICE.
name: CIS Red Hat Enterprise Linux 7
version: "3.1.1"
description: >
  Automated checks for 193 recommendations of the CIS Red Hat Enterprise Linux 7 benchmark
  (version 3.1.1), converted from the goss audit content of the
  ansible-lockdown project. Check names describe what is verified; the
  recommendation number is in the ID and the description. Select profiles
  with tags, e.g. `--tags cis-level-1+cis-server`.

defaults:
  when: "(facts.distro == \"rhel\" or \"rhel\" in facts.distro_like) and facts.version_major == 7"
  timeout: 120s

checks:
  - id: "CIS-RHEL7-1.1.1.1-cramfs"
    name: "cramfs: modprobe -n -v cramfs | grep -E '(cramfs|install)'"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.1.1.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v cramfs | grep -E '(cramfs|install)'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /(usr/)?bin/(true|false)" }
    rationale: &rat-9425c177af |
      cramfs is a legacy compressed read-only file system mainly used on embedded devices. Rarely used file system drivers are a common source of kernel vulnerabilities that can be reached simply by mounting a crafted image. Mapping the module to /bin/false makes every load attempt fail, including explicit modprobe calls, so the code never runs on this system.
    remediation: &rem-473336823d |
      Make every attempt to load cramfs run /bin/false instead, blacklist it, and unload it if it is currently loaded.

      printf '%s\n' 'install cramfs /bin/false' 'blacklist cramfs' > /etc/modprobe.d/cramfs.conf
      modprobe -r cramfs

      Use /bin/false rather than /usr/bin/false: the SUSE checks only accept that path. If the module is in use, unmount the file system first or reboot. The RHEL 7 and Ubuntu 18.04 variant of this check queries usb-storage instead of cramfs; add 'install usb-storage /bin/false' as well if that variant must pass.
  - id: "CIS-RHEL7-1.1.1.2-squashfs"
    name: "squashfs: modprobe -n -v squashfs | grep -E '(squashfs|install)'"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.1.1.2. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      modprobe -n -v squashfs | grep -E '(squashfs|install)'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /(usr/)?bin/(true|false)" }
    rationale: &rat-52574c203d |
      squashfs is a compressed read-only file system driver. Rarely used file system drivers are a common source of kernel vulnerabilities that can be reached simply by mounting a crafted image. Mapping the module to /bin/false makes every load attempt fail, including explicit modprobe calls, so the code never runs on this system. It is required by snap packages on Ubuntu and by some live or appliance images, so check for such use before disabling it.
    remediation: &rem-2c427c1266 |
      Make every attempt to load squashfs run /bin/false instead, blacklist it, and unload it if it is currently loaded.

      printf '%s\n' 'install squashfs /bin/false' 'blacklist squashfs' > /etc/modprobe.d/squashfs.conf
      modprobe -r squashfs

      Use /bin/false rather than /usr/bin/false: the SUSE checks only accept that path. If the module is in use, unmount the file system first or reboot.
  - id: "CIS-RHEL7-1.1.1.3-udf"
    name: "udf: modprobe -n -v udf | grep -E '(udf|install)'"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.1.1.3. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v udf | grep -E '(udf|install)'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /(usr/)?bin/(true|false)" }
    rationale: &rat-7e9e65387a |
      udf is the driver for the Universal Disk Format used on DVDs and other optical or removable media. Rarely used file system drivers are a common source of kernel vulnerabilities that can be reached simply by mounting a crafted image. Mapping the module to /bin/false makes every load attempt fail, including explicit modprobe calls, so the code never runs on this system. Some cloud platforms, notably Azure, deliver provisioning data on UDF media, so verify the platform does not need it.
    remediation: &rem-38e4b65803 |
      Make every attempt to load udf run /bin/false instead, blacklist it, and unload it if it is currently loaded.

      printf '%s\n' 'install udf /bin/false' 'blacklist udf' > /etc/modprobe.d/udf.conf
      modprobe -r udf

      Use /bin/false rather than /usr/bin/false: the SUSE checks only accept that path. If the module is in use, unmount the file system first or reboot.
  - id: "CIS-RHEL7-1.1.6-dev_shm"
    name: "/dev/shm is a separate mount with noexec, nodev, nosuid"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.1.6. CIS Controls v8: 3.3, 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/dev/shm'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]noexec(,|$)"
      - "~ [ ,]nodev(,|$)"
      - "~ [ ,]nosuid(,|$)"
    rationale: &rat-0516adab10 |
      /dev/shm is a world-writable shared memory file system. Mounting it separately with noexec, nodev and nosuid prevents it from being used to run dropped programs, create device files or abuse setuid binaries. On Ubuntu 18.04 the variants check that it is a separate mount and each option individually.
    remediation: &rem-3a8b57a23e |
      Mount /dev/shm with the options noexec,nodev,nosuid: add them to the options of /dev/shm in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/dev/shm'

      If /dev/shm is not a separate file system yet, create one first.
  - id: "CIS-RHEL7-1.1.18-home"
    name: "/home is a separate mount with nodev"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.1.18. CIS Controls v8: 3.3, 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/home'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nodev(,|$)"
    rationale: &rat-562407ef6d |
      /home holds user data that users can write freely. Mounting it with nodev prevents users from creating device files there to access hardware directly. On a separate file system user data also cannot fill the root file system.
    remediation: &rem-df8c1696fc |
      Mount /home with the option nodev: add it to the options of /home in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/home'

      If /home is not a separate file system yet, create one first.
  - id: "CIS-RHEL7-1.1.17-home_2"
    name: "/home is a separate mount"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.1.17. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/home'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: &rat-fcb7ec167d |
      Keeping /home on a separate file system prevents users from filling the root file system with their data and allows mount options such as nodev to be applied to user-writable storage. It also simplifies backup and reinstallation.
    remediation: &rem-702e477e3a |
      Put /home on a separate file system (partition or logical volume) and mount it there with an entry in /etc/fstab or a systemd mount unit. This needs a new file system and moving the existing data.
  - id: "CIS-RHEL7-1.1.2-tmp"
    name: "/tmp is a separate mount with noexec, nodev, nosuid"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.1.2. CIS Controls v8: 3.3, 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/tmp'
    allow_rc: any
