  - id: "CIS-RHEL7-3.3.7-net.ipv4.conf.all.rp_filter"
    name: "Kernel parameter net.ipv4.conf.all.rp_filter is 1"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.3.7. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.all.rp_filter
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-870a4c4d2d |
      Reverse path filtering drops packets whose source address would not be routed back through the interface they arrived on. This blocks many spoofed packets used in denial of service and other attacks. Strict mode can break asymmetric routing setups. The 'all' setting applies to all current interfaces.
    remediation: &rem-962e8f645b |
      Set the kernel parameter net.ipv4.conf.all.rp_filter to 1, now and at boot:

      sysctl -w 'net.ipv4.conf.all.rp_filter=1'
      printf '%s\n' 'net.ipv4.conf.all.rp_filter = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.conf.all.rp_filter from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
