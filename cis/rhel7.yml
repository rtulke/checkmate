  - id: "CIS-RHEL7-4.1.6-auditd_MAC_cnf"
    name: "auditd MAC cnf: grep MAC-policy /etc/audit/rules.d/*.rules"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.6. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep MAC-policy /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /etc/selinux/ -p wa -k MAC-policy" }
      - { some: "~ -w /usr/share/selinux/ -p wa -k MAC-policy" }
    rationale: &rat-bc0edc531e |
      SELinux or AppArmor policies enforce mandatory access control beyond normal file permissions. Changes to their configuration can weaken or disable this protection, so they should be recorded. This check verifies that the watches are part of the persistent audit configuration.
    remediation: &rem-cec0f162e9 |
      Watch the mandatory access control (SELinux or AppArmor) configuration for changes: add the rules for your release to /etc/audit/rules.d/50-MAC-policy.rules and load them.

      Amazon Linux 2, RHEL 7 and RHEL 8:
      -w /etc/selinux/ -p wa -k MAC-policy
      -w /usr/share/selinux/ -p wa -k MAC-policy

      Amazon Linux 2023 and RHEL 9:
      -w /etc/selinux -p wa -k MAC-policy
      -w /usr/share/selinux -p wa -k MAC-policy

      RHEL 10:
      -a always,exit -F arch=b64 -S all -F path=/etc/selinux -F perm=wa -F key=MAC-policy
      -a always,exit -F arch=b64 -S all -F path=/usr/share/selinux -F perm=wa -F key=MAC-policy

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
  - id: "CIS-RHEL7-4.1.6-auditd_MAC_live"
    name: "auditd MAC live: auditctl -l | grep MAC-policy"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.6. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      auditctl -l | grep MAC-policy
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /etc/selinux -p wa -k MAC-policy" }
      - { some: "~ -w /usr/share/selinux -p wa -k MAC-policy" }
    rationale: &rat-1c393a39f9 |
      SELinux or AppArmor policies enforce mandatory access control beyond normal file permissions. Changes to their configuration can weaken or disable this protection, so they should be recorded. This check verifies that the watches are loaded in the running kernel.
    remediation: *rem-cec0f162e9
  - id: "CIS-RHEL7-4.1.7-auditd_logins_cnf"
    name: "auditd logins cnf: grep logins /etc/audit/rules.d/*.rules"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.7. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep logins /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /var/log/faillog -p wa -k logins" }
      - { some: "~ -w /var/log/lastlog -p wa -k logins" }
      - { some: "~ -w /var/run/faillock/ -p wa -k logins" }
    rationale: &rat-7b52877a11 |
      The lastlog and faillock (or faillog/tallylog) records store the last successful logins and failed authentication attempts. Watching them reveals brute-force attempts, account lockouts and tampering with login records. This check verifies the persistent audit configuration.
    remediation: &rem-e70647a6f5 |
      Watch the login and failed-login records: add the rules for your release to /etc/audit/rules.d/50-login.rules and load them.

      Amazon Linux 2, Amazon Linux 2023, RHEL 8 and RHEL 9:
      -w /var/log/lastlog -p wa -k logins
      -w /var/run/faillock -p wa -k logins

      RHEL 7:
      -w /var/log/lastlog -p wa -k logins
      -w /var/run/faillock/ -p wa -k logins
      -w /var/log/faillog -p wa -k logins

      RHEL 10:
      -a always,exit -F arch=b64 -S all -F path=/var/log/lastlog -F perm=wa -F key=logins
      -a always,exit -F arch=b64 -S all -F path=/var/run/faillock -F perm=wa -F key=logins

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
