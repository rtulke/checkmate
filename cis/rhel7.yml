  - id: "CIS-RHEL7-5.1.8-etc_cron.allow-attrs"
    name: "/etc/cron.allow: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.1.8. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/cron.allow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-67db008abb |
      cron.allow lists the users permitted to create cron jobs. An allow list means new or unused accounts cannot schedule jobs, which limits a common way to keep persistence. The file itself must belong to root and not be writable by others, so users cannot grant themselves access.
    remediation: &rem-2f79d5f392 |
      Create /etc/cron.allow if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

