      - { rc: "== 0" }
      - "~ [ ,]noexec(,|$)"
      - "~ [ ,]nodev(,|$)"
      - "~ [ ,]nosuid(,|$)"
    rationale: &rat-be51b66bde |
      /tmp is writable by every user. A separate file system for it, mounted with noexec, nodev and nosuid, keeps users from filling the root file system and blocks common attack steps such as running dropped tools, creating device files or using planted setuid programs.
    remediation: &rem-4cf67dd4df |
      Mount /tmp with the options noexec,nodev,nosuid: add them to the options of /tmp in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/tmp'

      If /tmp is not a separate file system yet, create one first.
  - id: "CIS-RHEL7-1.1.10-var"
    name: "/var is a separate mount"
