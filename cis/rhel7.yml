      - "== 1"
    rationale: &rat-0689f2df27 |
      Answering ICMP echo requests sent to broadcast or multicast addresses lets an attacker use the host in Smurf-style amplification attacks, in which many hosts flood a spoofed victim with replies. Ignoring such requests prevents this abuse and avoids revealing which hosts are alive.
    remediation: &rem-f91d41be74 |
      Set the kernel parameter net.ipv4.icmp_echo_ignore_broadcasts to 1, now and at boot:

      sysctl -w 'net.ipv4.icmp_echo_ignore_broadcasts=1'
      printf '%s\n' 'net.ipv4.icmp_echo_ignore_broadcasts = 1' >> /etc/sysctl.d/60-hardening.conf

