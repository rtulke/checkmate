    name: "/etc/rsyslog.conf has the expected content (16 rules)"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.2.1.4. CIS Controls v8: 8.2."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
