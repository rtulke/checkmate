  - id: "CIS-RHEL7-1.1.20-cdrom_nodev"
    name: "cdrom nodev: if [ `grep -c -i cdrom /etc/fstab` = 1 ] ; then if [ `grep -c -E 'cdrom.*nodev' /etc/fsta…"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 1.1.20. CIS Controls v8: 3.3, 4.1."
    tags: [cis, cis-rhel7, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
