    severity: low
    run: |
      auditctl -l | grep mounts
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S mount -F auid\u003e=1000 -F auid!=-1 -F key=mounts" }
      - { some: "~ -a always,exit -F arch=b32 -S mount -F auid\u003e=1000 -F auid!=-1 -F key=mounts" }
    rationale: &rat-1ce78a2357 |
      Mounting file systems can be used to bring in unauthorised software or to copy data to removable media. Auditing mount calls by regular users makes such activity visible. This check verifies that the rules are loaded in the running kernel.
    remediation: *rem-8df5e9a769
  - id: "CIS-RHEL7-4.1.13-auditd_delete_cnf"
    name: "auditd delete cnf: grep delete /etc/audit/rules.d/*.rules"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.13. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep delete /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S unlink -S unlinkat -S rename -S renameat -F auid\u003e=1000 -F auid!=4294967295 -k delete|-a always,exit -F arch=b64 -S rmdir,unlink,unlinkat,rename -S renameat -F auid\u003e=1000 -F auid!=4294967295 -F key=delete" }
      - { some: "~ -a always,exit -F arch=b32 -S unlink -S unlinkat -S rename -S renameat -F auid\u003e=1000 -F auid!=4294967295 -k delete|-a always,exit -F arch=b32 -S rmdir,unlink,unlinkat,rename -S renameat -F auid\u003e=1000 -F auid!=4294967295 -F key=delete" }
    rationale: &rat-4bfa181df2 |
      Deleting or renaming files is a common way to destroy data or hide traces of an attack. Auditing these operations for regular users makes it possible to find out who removed or moved files. This check verifies the persistent audit configuration.
    remediation: &rem-e7f23b2b9d |
      Record file deletions and renames by users: add the rules for your release to /etc/audit/rules.d/50-delete.rules and load them.

      Amazon Linux 2:
      -a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -F key=delete
      -a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -F key=delete

      Amazon Linux 2023:
      -a always,exit -F arch=b64 -S rename,unlink,unlinkat,renameat -F auid>=1000 -F auid!=unset -F key=delete
      -a always,exit -F arch=b32 -S rename,unlink,unlinkat,renameat -F auid>=1000 -F auid!=unset -F key=delete

      RHEL 7:
      -a always,exit -F arch=b64 -S unlink -S unlinkat -S rename -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
      -a always,exit -F arch=b32 -S unlink -S unlinkat -S rename -S renameat -F auid>=1000 -F auid!=4294967295 -k delete

      RHEL 8 and RHEL 9:
      -a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -k delete
      -a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -k delete

      RHEL 10:
      -a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -k delete
      -a always,exit -F arch=b64 -S delete_module -F auid>=1000 -F auid!=unset -k kernel_modules

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
  - id: "CIS-RHEL7-4.1.13-auditd_delete_live"
