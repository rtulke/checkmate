    remediation: *rem-962e8f645b
  - id: "CIS-RHEL7-3.3.8-net.ipv4.tcp_syncookies"
    name: "Kernel parameter net.ipv4.tcp_syncookies is 1"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.3.8. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.tcp_syncookies
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-59ba1f79a7 |
      In a SYN flood an attacker sends many connection requests without completing the handshake, filling the connection backlog and blocking legitimate clients. SYN cookies let the kernel accept new connections without keeping state once the backlog is full, keeping services reachable during such an attack.
    remediation: &rem-8326186a4f |
      Set the kernel parameter net.ipv4.tcp_syncookies to 1, now and at boot:

      sysctl -w 'net.ipv4.tcp_syncookies=1'
      printf '%s\n' 'net.ipv4.tcp_syncookies = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.tcp_syncookies from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-RHEL7-3.4.1-modprobe_dccp"
    name: "modprobe dccp: modprobe -n -v dccp"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.4.1. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      modprobe -n -v dccp
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /(usr/)?bin/(true|false)" }
    rationale: &rat-41ef8e8fab |
      DCCP is a rarely used datagram transport protocol. Its kernel module has had several serious vulnerabilities that can be triggered by local users or from the network. Preventing the module from loading removes this attack surface on systems that do not use the protocol.
    remediation: &rem-66ee3312a3 |
      Keep the dccp module from being loaded: add an install override and a blacklist entry for it in /etc/modprobe.d/, then unload it if it is currently loaded.

      printf '%s\n' 'install dccp /bin/false' 'blacklist dccp' > /etc/modprobe.d/dccp.conf
      modprobe -r dccp

      modprobe -r reports an error if the module is not loaded, which is harmless; if sockets of this protocol are open, the module stays loaded until reboot.
  - id: "CIS-RHEL7-3.4.2-modprobe_sctp"
    name: "modprobe sctp: modprobe -n -v sctp"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.4.2. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      modprobe -n -v sctp
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /(usr/)?bin/(true|false)" }
    rationale: &rat-be5bf6712f |
      SCTP is a message-oriented transport protocol used mainly in telecommunications. Its kernel module adds network-reachable code that most systems never use. Preventing the module from loading removes this attack surface on systems that do not use the protocol. Some telecom and clustering software needs SCTP.
    remediation: &rem-40e3047e72 |
      Keep the sctp module from being loaded: add an install override and a blacklist entry for it in /etc/modprobe.d/, then unload it if it is currently loaded.

      printf '%s\n' 'install sctp /bin/false' 'blacklist sctp' > /etc/modprobe.d/sctp.conf
      modprobe -r sctp

      modprobe -r reports an error if the module is not loaded, which is harmless; if sockets of this protocol are open, the module stays loaded until reboot.
  - id: "CIS-RHEL7-3.5.1.1-firewalld"
    name: "Package firewalld is installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.5.1.1. CIS Controls v8: 4.4."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet firewalld
    expect: true
    rationale: &rat-9a34f07397 |
      A host-based firewall limits which network services are reachable even if a service is accidentally exposed or a perimeter firewall is misconfigured. firewalld must be installed, enabled at boot and running for its zone rules to be enforced, and on newer releases it should use the nftables backend rather than the deprecated iptables backend.
    remediation: &rem-45b06fcae8 |
      Install the package firewalld:

      yum install firewalld
  - id: "CIS-RHEL7-3.5.1.1-iptables"
    name: "Package iptables is installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.5.1.1. CIS Controls v8: 4.4."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet iptables
    expect: true
    rationale: &rat-eb1c6ff1b1 |
      iptables provides the tools to define and load rules for the kernel packet filter. Where iptables is the chosen firewall, the package must be installed for the rules to be configured and applied.
    remediation: &rem-02f37054b7 |
      Install the package iptables:

      yum install iptables
  - id: "CIS-RHEL7-3.5.1.2-iptables-services"
    name: "Package iptables-services is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.5.1.2. CIS Controls v8: 4.4, 4.8."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet iptables-services
    expect: false
    rationale: &rat-cf1a8d2a6b |
      iptables-services provides the legacy iptables and ip6tables services that load static rule sets at boot. Running them alongside firewalld or nftables leads to competing rule sets, making the effective filtering unpredictable and possibly opening ports unintentionally. Use a single firewall management tool.
    remediation: &rem-0fe01202f1 |
      Remove the package iptables-services, unless the system needs it:

      yum remove iptables-services
  - id: "CIS-RHEL7-3.5.1.3-nftables"
    name: "Package nftables is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.5.1.3. CIS Controls v8: 4.4, 4.8."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet nftables
    expect: false
    rationale: &rat-059df58fe1 |
      Exactly one tool should manage the host firewall. Where nftables is the chosen firewall, its package has to be installed and its service enabled and running so the rule set is loaded at boot. Where firewalld is used instead, the nftables service must not run alongside it. The expected state therefore depends on the platform.
    remediation: &rem-25c4c62ffc |
      Remove the package nftables, unless the system needs it:

      yum remove nftables
  - id: "CIS-RHEL7-3.5.1.4-firewalld-enabled"
    name: "Service firewalld is enabled"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.5.1.4. CIS Controls v8: 4.4."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState firewalld | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-9a34f07397
    remediation: &rem-446eda8ec3 |
      Enable the service firewalld:

      systemctl enable firewalld
  - id: "CIS-RHEL7-3.5.1.4-firewalld-running"
    name: "Service firewalld is running"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.5.1.4. CIS Controls v8: 4.4."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState firewalld | cut -d= -f2
    expect: "== active"
    rationale: *rat-9a34f07397
    remediation: &rem-a5044d0b79 |
      Start the service firewalld:

      systemctl start firewalld
  - id: "CIS-RHEL7-3.5.1.3-nftables-enabled"
    name: "Service nftables is not enabled"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.5.1.3. CIS Controls v8: 4.4, 4.8."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState nftables | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: *rat-059df58fe1
    remediation: &rem-7b07e6f2bd |
      Disable the service nftables, unless the system needs it:

      systemctl disable nftables

      To keep other units from starting it, mask it instead: systemctl mask nftables
  - id: "CIS-RHEL7-3.5.1.3-nftables-running"
    name: "Service nftables is not running"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.5.1.3. CIS Controls v8: 4.4, 4.8."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState nftables | cut -d= -f2
    expect: "!= active"
    rationale: *rat-059df58fe1
    remediation: &rem-dee61180b5 |
      Stop the service nftables, unless the system needs it:

      systemctl stop nftables
  - id: "CIS-RHEL7-3.5.1.5-default_zone"
    name: "default zone: firewall-cmd --get-default-zone"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.5.1.5. CIS Controls v8: 4.4."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      firewall-cmd --get-default-zone
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ public" }
    rationale: &rat-0dee2fbee6 |
      firewalld applies the default zone to every interface that is not explicitly assigned to another zone. A permissive default such as trusted would allow all traffic on new interfaces. Using a restrictive zone like public ensures that new interfaces only expose explicitly allowed services.
    remediation: &rem-c563573046 |
      Set the firewalld default zone to public.

      firewall-cmd --set-default-zone=public
      firewall-cmd --get-default-zone

      Review the services and ports allowed in that zone with firewall-cmd --list-all.
  - id: "CIS-RHEL7-3.5.1.6-nic_assigned"
    name: "nic assigned: nmcli -t connection show | awk -F ':' '{if($4){print $4}}' | while read INT; do firewall-…"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.5.1.6. CIS Controls v8: 4.4."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      nmcli -t connection show | awk -F ':' '{if($4){print $4}}' | while read INT; do firewall-cmd --get-active-zones | grep -B1 $INT; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ens224" }
      - { some: "~ ens192" }
    rationale: &rat-511f4b2399 |
      firewalld applies rules per zone, and an interface that is not assigned to a zone may fall back to an unintended default zone with different rules. Assigning every network interface explicitly to the correct zone ensures the intended policy is applied to all traffic.
    remediation: &rem-a95df6371f |
      Assign each network interface to the appropriate firewalld zone, permanently and at runtime, and verify the result.

      firewall-cmd --permanent --zone=ZONE --change-interface=INTERFACE
      firewall-cmd --reload
      firewall-cmd --get-active-zones

      For interfaces managed by NetworkManager the zone can also be stored in the connection: nmcli connection modify CONNECTION connection.zone ZONE.
  - id: "CIS-RHEL7-4.1.1.1-audit"
    name: "Package audit is installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.1.1. CIS Controls v8: 8.2."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      rpm -q --quiet audit
    expect: true
    rationale: &rat-5d5d992283 |
      The Linux audit framework records security-relevant events such as logins, privilege use, file access and configuration changes in a tamper-resistant trail. Without the audit user-space tools (audit on RPM systems, auditd on Debian and Ubuntu), these events cannot be collected, which makes detecting and investigating incidents far harder.
    remediation: &rem-dfea94a4a1 |
      Install the package audit:

      yum install audit
  - id: "CIS-RHEL7-4.1.1.1-audit-libs"
    name: "Package audit-libs is installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.1.1. CIS Controls v8: 8.2."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      rpm -q --quiet audit-libs
    expect: true
    rationale: &rat-5f843a11e3 |
      audit-libs provides the libraries through which PAM, sshd, sudo and other programs send audit events to the kernel. If it is missing, those components cannot emit their user-space audit records, leaving gaps in the audit trail.
    remediation: &rem-4689ce868c |
      Install the package audit-libs:

      yum install audit-libs
  - id: "CIS-RHEL7-4.1.1.2-auditd-enabled"
    name: "Service auditd is enabled"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.1.2. CIS Controls v8: 8.2."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p UnitFileState auditd | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-f809f26f23 |
      auditd is the daemon that receives audit events from the kernel and writes them to disk. If it is not installed, enabled and running, audit rules have no effect on the persistent trail, and security events go unrecorded.
    remediation: &rem-5d15604058 |
      Enable the service auditd:

      systemctl enable auditd
  - id: "CIS-RHEL7-4.1.1.2-auditd-running"
    name: "Service auditd is running"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.1.2. CIS Controls v8: 8.2."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p ActiveState auditd | cut -d= -f2
    expect: "== active"
    rationale: *rat-f809f26f23
    remediation: &rem-ce273a00c5 |
      Start the service auditd:

      systemctl start auditd
  - id: "CIS-RHEL7-4.1.1.3-auditd_grub"
    name: "auditd grub: grep \"^\\s*linux\" /boot/grub2/grub.cfg | grep -Evc \"(audit=1|rescue)\""
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.1.3. CIS Controls v8: 8.2."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep "^\s*linux" /boot/grub2/grub.cfg | grep -Evc "(audit=1|rescue)"
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ 0" }
    rationale: &rat-962eefef95 |
      Processes started before the audit daemon are not audited unless auditing is enabled in the kernel from the start. The audit=1 kernel parameter turns on auditing at boot, so that early activity is recorded and processes can be audited throughout their life.
    remediation: &rem-4623efe68b |
      Add audit=1 to GRUB_CMDLINE_LINUX in /etc/default/grub (unless it is already there) and regenerate the GRUB configuration so that every linux entry except rescue entries carries it.

      sed -ri 's/^(GRUB_CMDLINE_LINUX=")/\1audit=1 /' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      On UEFI systems write the configuration to /boot/efi/EFI/redhat/grub.cfg instead. A reboot is required.
  - id: "CIS-RHEL7-4.1.2.1-auditd_max_log"
    name: "auditd max log: grep max_log_file /etc/audit/auditd.conf"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.2.1. CIS Controls v8: 8.3."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep max_log_file /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ max_log_file = /\\\\d/" }
    rationale: &rat-854fd9e30c |
      auditd rotates or acts on its log file once it reaches max_log_file megabytes. An explicit, adequately sized value according to site policy ensures enough audit history is kept and that log rotation behaves predictably instead of depending on defaults.
    remediation: &rem-13fa52c336 |
      Set max_log_file in /etc/audit/auditd.conf to the size in megabytes required by site policy (for example 32) and restart auditd.

      sed -ri 's/^\s*max_log_file\s*=.*/max_log_file = 32/' /etc/audit/auditd.conf
      grep -q '^max_log_file\s*=' /etc/audit/auditd.conf || echo 'max_log_file = 32' >> /etc/audit/auditd.conf
      service auditd restart
  - id: "CIS-RHEL7-4.1.2.2-auditd_max_log_action"
    name: "auditd max log action: grep max_log_file_action /etc/audit/auditd.conf"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.2.2. CIS Controls v8: 8.3."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep max_log_file_action /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ max_log_file_action = keep_logs" }
    rationale: &rat-cf0277f2a2 |
      max_log_file_action defines what auditd does when the log file reaches its maximum size. With keep_logs, logs are rotated but never deleted automatically, so no audit records are lost; disk usage then has to be monitored.
    remediation: &rem-ca1a3f989b |
      Set max_log_file_action to keep_logs in /etc/audit/auditd.conf, then make auditd re-read its configuration.

      sed -i -E 's/^\s*#?\s*max_log_file_action\s*=.*/max_log_file_action = keep_logs/' /etc/audit/auditd.conf
      grep -q '^max_log_file_action = keep_logs' /etc/audit/auditd.conf || echo 'max_log_file_action = keep_logs' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      With keep_logs auditd never deletes old logs; monitor the free space of the audit log partition.
  - id: "CIS-RHEL7-4.1.2.3-audit_logs_full_action"
    name: "audit logs full action: grep -E \"(space_left|action_mail_acct)\" /etc/audit/auditd.conf"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.2.3. CIS Controls v8: 8.2, 8.3."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E "(space_left|action_mail_acct)" /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ space_left_action = email" }
      - { some: "~ action_mail_acct = root" }
      - { some: "~ ^admin_space_left_action = halt" }
    rationale: &rat-97a539604a |
      If the audit log partition fills up, new events can be lost silently. Mailing root when space runs low gives administrators time to react, and halting the system when space becomes critical ensures that no activity takes place unaudited. Halting affects availability, which must be weighed for each system.
    remediation: &rem-0301a43d70 |
      Set the following values in /etc/audit/auditd.conf (add any line that is missing) and restart auditd.

      sed -ri 's/^\s*space_left_action\s*=.*/space_left_action = email/' /etc/audit/auditd.conf
      sed -ri 's/^\s*action_mail_acct\s*=.*/action_mail_acct = root/' /etc/audit/auditd.conf
      sed -ri 's/^\s*admin_space_left_action\s*=.*/admin_space_left_action = halt/' /etc/audit/auditd.conf
      service auditd restart

      Email notification requires a working local mail transfer agent.
  - id: "CIS-RHEL7-4.1.2.1-audit_grub_backlog"
    name: "audit grub backlog: grep audit_backlog_limit /etc/default/grub"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.2.1. CIS Controls v8: 8.2, 8.3."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep audit_backlog_limit /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ GRUB_CMDLINE_LINUX=\".*audit_backlog_limit=8192" }
    rationale: &rat-a422c11b15 |
      Audit events generated during boot, before auditd runs, are held in a kernel backlog buffer. If the buffer is too small, events are lost. audit_backlog_limit=8192 on the kernel command line provides enough room for early boot events.
    remediation: &rem-ae5aa44611 |
      Add audit_backlog_limit=8192 to GRUB_CMDLINE_LINUX in /etc/default/grub, replacing any existing value, and regenerate the GRUB configuration.

      sed -ri 's/\s*audit_backlog_limit=[0-9]+//' /etc/default/grub
      sed -ri 's/^(GRUB_CMDLINE_LINUX=".*)"/\1 audit_backlog_limit=8192"/' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      On UEFI systems write the configuration to /boot/efi/EFI/redhat/grub.cfg instead. A reboot is required.
  - id: "CIS-RHEL7-4.1.3-auditd_time_cnf"
    name: "auditd time cnf: grep time-change /etc/audit/rules.d/*.rules"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.3. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep time-change /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change" }
      - { some: "~ -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k time-change" }
      - { some: "~ -a always,exit -F arch=b64 -S clock_settime -k time-change" }
      - { some: "~ -a always,exit -F arch=b32 -S clock_settime -k time-change" }
      - { some: "~ -w /etc/localtime -p wa -k time-change" }
    rationale: &rat-1630928119 |
      Reliable timestamps are essential for correlating log entries and reconstructing events. Auditing changes to the system clock and the local time zone reveals attempts to manipulate time in order to confuse log analysis or bypass time-based controls. This check verifies the persistent audit configuration.
    remediation: &rem-813d6fbc7a |
      Record changes to the system time and time zone: add the rules for your release to /etc/audit/rules.d/50-time-change.rules and load them.

      Amazon Linux 2 and Amazon Linux 2023:
      -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time-change
      -a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime -k time-change
      -w /etc/localtime -p wa -k time-change

      RHEL 7:
      -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change
      -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k time-change
      -a always,exit -F arch=b64 -S clock_settime -k time-change
      -a always,exit -F arch=b32 -S clock_settime -k time-change
      -w /etc/localtime -p wa -k time-change

      RHEL 8 and RHEL 9:
      -a always,exit -F arch=b64 -S adjtimex,settimeofday -k time-change
      -a always,exit -F arch=b32 -S adjtimex,settimeofday -k time-change
      -a always,exit -F arch=b64 -S clock_settime -F a0=0x0 -k time-change
      -a always,exit -F arch=b32 -S clock_settime -F a0=0x0 -k time-change
      -w /etc/localtime -p wa -k time-change

      RHEL 10:
      -a always,exit -F arch=b64 -S adjtimex,settimeofday -F key=time-change
      -a always,exit -F arch=b64 -S clock_settime -F a0=0x0 -F key=time-change
      -a always,exit -F arch=b64 -S all -F path=/etc/localtime -F perm=wa -F key=time-change
      -w /etc/localtime -p wa -k time-change

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
