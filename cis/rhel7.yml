  - id: "CIS-RHEL7-3.2.1-net.ipv4.ip_forward"
    name: "Kernel parameter net.ipv4.ip_forward is 0"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.2.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
