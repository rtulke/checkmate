      - { some: "~ -a always,exit -F arch=b32 -S chmod -S fchmod -S fchmodat -F auid\u003e=1000 -F auid!=4294967295 -k perm_mod" }
      - { some: "~ -a always,exit -F arch=b64 -S chown -S fchown -S fchownat -S lchown -F auid\u003e=1000 -F auid!=4294967295 -k perm_mod" }
      - { some: "~ -a always,exit -F arch=b32 -S chown -S fchown -S fchownat -S lchown -F auid\u003e=1000 -F auid!=4294967295 -k perm_mod" }
      - { some: "~ -a always,exit -F arch=b64 -S setxattr -S lsetxattr -S fsetxattr -S removexattr -S lremovexattr -S fremovexattr -F auid\u003e=1000 -F auid!=4294967295 -k perm_mod" }
      - { some: "~ -a always,exit -F arch=b32 -S setxattr -S lsetxattr -S fsetxattr -S removexattr -S lremovexattr -S fremovexattr -F auid\u003e=1000 -F auid!=4294967295 -k perm_mod" }
    rationale: &rat-742e92c607 |
      Changing permissions, ownership or extended attributes of files can expose data or prepare privilege escalation, for example by making a file writable or executable. Auditing these system calls for regular users makes such changes traceable. This check verifies the persistent audit configuration.
    remediation: &rem-17b2aea4e1 |
