  - id: "CIS-RHEL7-3.1.1-ipv6_boot_grub"
    name: "ipv6 boot grub: grep \"^\\s*linux\" /boot/grub2/grub.cfg | grep -v ipv6.disable=1"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.1.1. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep "^\s*linux" /boot/grub2/grub.cfg | grep -v ipv6.disable=1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-c04ee3736e |
      Where IPv6 is not used, leaving it enabled creates a second network stack that is often not covered by firewall rules and monitoring. Disabling it with the ipv6.disable=1 kernel parameter on every boot entry removes it entirely. Hosts or applications that need IPv6, including some local services, must keep it enabled.
    remediation: &rem-f5ab6c1ee5 |
      Add ipv6.disable=1 to the kernel command line in /etc/default/grub (unless it is already there) and regenerate the GRUB configuration so that every linux entry carries it.

      sed -ri 's/^(GRUB_CMDLINE_LINUX=")/\1ipv6.disable=1 /' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      On UEFI systems write the configuration to /boot/efi/EFI/redhat/grub.cfg instead. A reboot is required.
  - id: "CIS-RHEL7-3.1.1-ipv6_default_grub"
