      chown root:root '/etc/at.allow'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/at.allow'
  - id: "CIS-RHEL7-5.1.9-etc_at.deny-absent"
    name: "/etc/at.deny does not exist"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.1.9. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      test -e '/etc/at.deny' || test -L '/etc/at.deny'
    expect: false
    rationale: &rat-5230675a36 |
      When at access is controlled with at.allow, an at.deny file is at best ignored and at worst creates the impression that only listed users are blocked. Removing it leaves the allow list as the single, clear control.
    remediation: &rem-d7950be1a0 |
      Remove /etc/at.deny, unless the system needs it:

      rm '/etc/at.deny'
  - id: "CIS-RHEL7-5.2.1-sudo"
    name: "Package sudo is installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.2.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet sudo
    expect: true
    rationale: &rat-f5f9e1cba7 |
      sudo lets administrators run privileged commands with their own credentials instead of a shared root password. That gives individual accountability, fine-grained permissions and a log of every privileged command.
    remediation: &rem-f70c9e3150 |
      Install the package sudo:

      yum install sudo
  - id: "CIS-RHEL7-5.2.2-pty_sudoers_d"
    name: "pty sudoers d: ls -1 /etc/sudoers.d/* \u003e /dev/null 2\u003e\u00261; if [ '$?' = '0' ]; then grep -c '^Defaults.*\\sus…"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.2.2. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      ls -1 /etc/sudoers.d/* > /dev/null 2>&1; if [ '$?' = '0' ]; then grep -c '^Defaults.*\suse_pty' /etc/sudoers.d/*; else echo 99;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ [0-99]" }
    rationale: &rat-63218cca98 |
      With use_pty, sudo runs commands in a separate pseudo-terminal. A malicious program started through sudo then cannot inject input into the user's terminal or keep access to it after sudo exits. It also makes I/O logging complete.
    remediation: &rem-bf550576ff |
      Enable use_pty with a line of its own in a file under /etc/sudoers.d/, remove any Defaults !use_pty setting and validate the syntax.

      echo 'Defaults use_pty' > /etc/sudoers.d/50-use_pty
      chmod 0440 /etc/sudoers.d/50-use_pty
      grep -rnE '^\s*Defaults.*!use_pty' /etc/sudoers /etc/sudoers.d/
      visudo -c

      sudo ignores files in /etc/sudoers.d/ whose names contain a dot or end with ~.
  - id: "CIS-RHEL7-5.2.2-sudoers_pty"
    name: "sudoers pty: grep use_pty /etc/sudoers"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.2.2. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep use_pty /etc/sudoers
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Defaults.*\\suse_pty" }
    rationale: *rat-63218cca98
    remediation: &rem-b42deb2388 |
      Add Defaults use_pty to /etc/sudoers itself (the check does not look at /etc/sudoers.d/) and validate the syntax.

      echo 'Defaults use_pty' >> /etc/sudoers
      visudo -c

      If visudo -c reports an error, correct it at once with visudo, otherwise sudo stops working.
  - id: "CIS-RHEL7-5.2.3-log_sudoers_d"
    name: "log sudoers d: grep -c '^Defaults logfile=/var/log/*.log' /etc/sudoers.d/.*/"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.2.3. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -c '^Defaults logfile=/var/log/*.log' /etc/sudoers.d/.*/
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ [1:99]" }
    rationale: &rat-73ffb83e75 |
      A dedicated sudo log file records every sudo invocation with user, terminal, working directory and command. That makes privileged activity easy to review and keeps the record separate from general system logs.
    remediation: &rem-b7aaa6ded0 |
      Configure a dedicated sudo log file under /var/log in a Defaults line of its own and validate the syntax.

      echo 'Defaults logfile="/var/log/sudo.log"' > /etc/sudoers.d/50-logfile
      chmod 0440 /etc/sudoers.d/50-logfile
      visudo -c
  - id: "CIS-RHEL7-5.2.3-sudoers_log"
    name: "sudoers log: grep logfile /etc/sudoers"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.2.3. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep logfile /etc/sudoers
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Defaults\\s+logfile=\"/var/log/sudo.log\"" }
    rationale: &rat-1251782ada |
      A dedicated sudo log file records every command run through sudo, who ran it and when, in one place. This makes privileged activity easier to review and preserves evidence even if the general system log is noisy or rotated quickly.
    remediation: &rem-52d7be875a |
      Configure sudo to log to /var/log/sudo.log in /etc/sudoers and validate the syntax.

      echo 'Defaults logfile="/var/log/sudo.log"' >> /etc/sudoers
      visudo -c

      The check reads only /etc/sudoers, so a setting in /etc/sudoers.d/ does not satisfy it. If visudo -c reports an error, fix it immediately with visudo.
  - id: "CIS-RHEL7-5.3.1-etc_ssh_sshd_config-attrs"
    name: "/etc/ssh/sshd_config: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.1. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-0cee72fb44 |
      The SSH daemon configuration controls who may log in remotely and how. If it is writable or readable by non-root users, they can weaken authentication or learn about the access setup. The content rules make sure the file exists and contains hardened settings such as adequate logging, disabled X11 forwarding, a low MaxAuthTries and ignored rhosts files.
    remediation: &rem-714a840007 |
      Create /etc/ssh/sshd_config if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/ssh/sshd_config'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/ssh/sshd_config'
  - id: "CIS-RHEL7-5.3.2-etc_ssh_ssh_host_prv_key_group"
    name: "/etc/ssh/ssh host prv key group: groupkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -group root ); echo $groupkeys"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.2. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      groupkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -group root ); echo $groupkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-5ef33206e2 |
      SSH host private keys prove the server's identity to clients. Anyone who can read a host key can impersonate the server and intercept sessions in a man-in-the-middle attack. Keeping the key files in the root group (or the dedicated ssh_keys group on Red Hat systems) ensures that any group read permission does not extend to ordinary users.
    remediation: &rem-369ef6a077 |
      Change the group of each private host key reported by the check to root.

      chgrp root FILE

      On RHEL 9 the group ssh_keys is also accepted by the check.
  - id: "CIS-RHEL7-5.3.2-etc_ssh_ssh_host_prv_key_perms"
    name: "/etc/ssh/ssh host prv key perms: keyperms=$(sudo find /etc/ssh/ -name *_key -type f -perm /137 ); echo $keyperms"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.2. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      keyperms=$(sudo find /etc/ssh/ -name *_key -type f -perm /137 ); echo $keyperms
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-7f190524e0 |
      A host private key that other users can read or modify lets them impersonate the SSH server or replace its identity, which enables interception of administrator sessions. Restricting the files to owner read and write keeps the key usable only by sshd. OpenSSH also ignores private keys with overly open permissions, so tight modes avoid unexpected start-up failures.
    remediation: &rem-6abc4b4be2 |
      Remove execute, group write/execute and all permissions for others from each private host key reported by the check. Mode 0600 satisfies every variant.

      chmod 0600 FILE

      Debian 13, and Debian 11 and Ubuntu 22.04/24.04 for keys in the root group, do not accept group read, so do not use 0640 there.
  - id: "CIS-RHEL7-5.2.3-etc_ssh_ssh_host_prv_key_user"
    name: "/etc/ssh/ssh host prv key user: userkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -user root ); echo $userkeys"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.2.3. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      userkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -user root ); echo $userkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-fbdc35f7c9 |
      If a host private key is owned by an account other than root, that account can read, alter or replace the server's identity key, allowing impersonation of the server or a denial of service. Root ownership ensures that only administrators control the key material.
    remediation: &rem-3a33d707b3 |
      Make root the owner of each private host key reported by the check.

      chown root FILE
  - id: "CIS-RHEL7-5.3.3-etc_ssh_ssh_host_pub_key_group"
    name: "/etc/ssh/ssh host pub key group: groupkeys=$(sudo find /etc/ssh/ -name *_key.pub -type f ! -group root ); echo $groupkeys"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.3. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      groupkeys=$(sudo find /etc/ssh/ -name *_key.pub -type f ! -group root ); echo $groupkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-7b474e6437 |
      Public host keys are not secret, but they represent the server's identity that clients verify and that key management or monitoring relies on. If a non-root group can modify them, local users could replace the published key material. Root group ownership keeps changes to the server identity limited to administrators.
    remediation: &rem-4bb93212a2 |
      Change the group of each public host key reported by the check to root.

      chgrp root FILE
  - id: "CIS-RHEL7-5.3.3-etc_ssh_ssh_host_pub_key_perms"
    name: "/etc/ssh/ssh host pub key perms: keysperm=$(sudo find /etc/ssh/ -name *_key.pub -type f  -perm /137 ); echo $keyperms"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.3. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      keysperm=$(sudo find /etc/ssh/ -name *_key.pub -type f  -perm /137 ); echo $keyperms
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-33bc1e4eae |
      Public host keys may be world-readable, but write access for group or others would let local users replace them, and the execute bit serves no purpose. Limiting them to mode 0644 or stricter ensures that only root can change the server's published identity.
    remediation: &rem-78675bfedc |
      Remove execute and group/other write permissions from each public host key reported by the check (mode 0644 or stricter).

      chmod u-x,go-wx FILE
  - id: "CIS-RHEL7-5.3.3-etc_ssh_ssh_host_pub_key_user"
    name: "/etc/ssh/ssh host pub key user: userkeys=$(sudo find /etc/ssh/ -name *_key.pub -type f ! -user root ); echo $userkeys"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.3. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      userkeys=$(sudo find /etc/ssh/ -name *_key.pub -type f ! -user root ); echo $userkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-e69d03c157 |
      If a public host key is owned by a non-root account, that user can replace it and mislead or disrupt clients that verify the server's identity. Root ownership keeps the published host identity under administrative control.
    remediation: &rem-35eb98c235 |
      Make root the owner of each public host key reported by the check.

      chown root FILE
  - id: "CIS-RHEL7-5.3.5-ssh_loglevel"
    name: "ssh loglevel: grep -E \"^LogLevel\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.5. CIS Controls v8: 8.2, 8.5."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "^LogLevel" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ LogLevel (VERBOSE|INFO)" }
    rationale: &rat-210132db63 |
      At INFO level sshd records logins and logouts, and VERBOSE additionally records the fingerprint of the key used, which is valuable for investigations. Lower levels hide attacks, while DEBUG levels can log sensitive details and flood the logs. INFO or VERBOSE gives a useful audit trail.
    remediation: &rem-44ccef0bbc |
      Set LogLevel VERBOSE (INFO is also accepted) and remove any LogLevel DEBUG line.

      echo 'LogLevel VERBOSE' > /etc/ssh/sshd_config.d/01-loglevel.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i loglevel

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-RHEL7-5.3.6-ssh_x11"
    name: "ssh x11: grep -Ei \"X11forwarding\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.6. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "X11forwarding" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^(?i)X11forwarding no" }
      - { none: "~ ^(\\s+|)x11forwarding yes" }
    rationale: &rat-c56d4e2fbf |
      X11 forwarding tunnels graphical applications over SSH but also gives the remote side access to the client's X display, which a compromised server can abuse to capture keystrokes or screen content. Servers rarely need it, so disabling it removes this exposure.
    remediation: &rem-6181321e5d |
      Set X11Forwarding no in /etc/ssh/sshd_config (replace an existing setting, otherwise add it at the top of the file so that it is not inside a Match block) and reload sshd.

      sed -ri 's/^\s*X11Forwarding\s+\S+/X11Forwarding no/I' /etc/ssh/sshd_config
      grep -qi '^X11Forwarding no' /etc/ssh/sshd_config || sed -i '1i X11Forwarding no' /etc/ssh/sshd_config
      sshd -t && systemctl reload sshd
  - id: "CIS-RHEL7-5.3.7-sshd_authtries"
    name: "sshd authtries: grep -Ei \"maxauthtries\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.7. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "maxauthtries" /etc/ssh/sshd_config
    expect: { rc: "in [0, 1]" }
    rationale: &rat-7ebfd780b6 |
      MaxAuthTries caps the number of authentication attempts per connection. A low limit slows down online password guessing, because attackers must reconnect frequently, and failures are logged sooner. Four attempts is enough for normal use.
    remediation: &rem-64bb4487b3 |
      Set MaxAuthTries to 4 or less and remove lines with higher values.

      echo 'MaxAuthTries 4' > /etc/ssh/sshd_config.d/01-maxauthtries.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i maxauthtries

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh. On Debian 12, Ubuntu 20.04 and 22.04 and SUSE 15 the check also counts commented lines, so delete the commented default as well: sed -i -E '/^\s*#\s*MaxAuthTries\s/Id' /etc/ssh/sshd_config
  - id: "CIS-RHEL7-5.3.8-ssh_rhosts"
    name: "ssh rhosts: grep -Ei \"Ignorerhosts\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.8. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "Ignorerhosts" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^(?i)Ignorerhosts yes" }
      - { none: "~ ^(?i)Ignorerhosts no" }
    rationale: &rat-037db005cf |
      Legacy .rhosts and .shosts files let users grant password-less access to their account from other hosts, outside of any central control. IgnoreRhosts makes sshd disregard these files, so such per-user trust relationships cannot be used to log in.
    remediation: &rem-0ad83b2018 |
      Set IgnoreRhosts yes in the SSH server configuration and remove any IgnoreRhosts no line.

      echo 'IgnoreRhosts yes' > /etc/ssh/sshd_config.d/01-ignorerhosts.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i ignorerhosts

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-RHEL7-5.3.9-ssh_hostbased_auth"
    name: "ssh hostbased auth: grep -Ei \"HostBasedAuth\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.9. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "HostBasedAuth" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^(?i)HostbasedAuthentication no" }
      - { none: "~ ^(?i)HostbasedAuthentication yes" }
    rationale: &rat-ad0dd2cb95 |
      Host-based authentication trusts a client because of the machine it connects from rather than authenticating the individual user. A compromised or spoofed trusted host then grants access to accounts on this server without any user credential. Disabling it ensures every login is authenticated per user.
    remediation: &rem-620aa5f782 |
      Set HostbasedAuthentication no in the SSH server configuration and remove any HostbasedAuthentication yes line.

      echo 'HostbasedAuthentication no' > /etc/ssh/sshd_config.d/01-hostbasedauthentication.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i hostbasedauthentication

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-RHEL7-5.3.10-ssh_permit_root"
    name: "ssh permit root: grep -Ei \"permitrootlogin\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.10. CIS Controls v8: 5.4."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "permitrootlogin" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^(?i)PermitRootLogin no" }
      - { none: "~ ^(?i)PermitRootLogin yes" }
    rationale: &rat-47fd7571af |
      Direct root logins over SSH expose the most powerful account to password guessing and leave no record of which administrator acted. Requiring personal accounts with escalation through sudo or su adds accountability and an extra barrier. Automation that needs root can use dedicated accounts with restricted sudo rules.
    remediation: &rem-49bd30d8bb |
      Set PermitRootLogin no and remove any PermitRootLogin yes line. Make sure an administrative account with sudo access works before reloading sshd.

      echo 'PermitRootLogin no' > /etc/ssh/sshd_config.d/01-permitrootlogin.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i permitrootlogin

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-RHEL7-5.3.11-ssh_empty_passwd"
    name: "ssh empty passwd: grep -Ei \"permitemptypasswords\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.11. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "permitemptypasswords" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^(?i)PermitEmptyPasswords no" }
      - { none: "~ ^(?i)PermitEmptyPasswords yes" }
    rationale: &rat-861378e10c |
      If an account has an empty password and sshd accepts it, anyone can log in to that account remotely without a credential. PermitEmptyPasswords no makes sshd refuse such logins regardless of how the account is configured.
    remediation: &rem-0c40a7ec4d |
      Set PermitEmptyPasswords no and remove any PermitEmptyPasswords yes line.

      echo 'PermitEmptyPasswords no' > /etc/ssh/sshd_config.d/01-permitemptypasswords.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i permitemptypasswords

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-RHEL7-5.3.12-ssh_userenv"
    name: "ssh userenv: grep -Ei \"PermitUserEnvironment\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.12. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "PermitUserEnvironment" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^(?i)PermitUserEnvironment no" }
      - { none: "~ ^(?i)PermitUserEnvironment yes" }
    rationale: &rat-a46f1c4dfd |
      PermitUserEnvironment lets users pass environment variables through ~/.ssh/environment or authorized_keys options. Variables such as LD_PRELOAD or PATH can bypass restrictions like forced commands or restricted shells and run attacker-chosen code. Disabling it keeps the session environment under administrative control.
    remediation: &rem-b672df6f9a |
      Set PermitUserEnvironment no and remove any PermitUserEnvironment yes line.

      echo 'PermitUserEnvironment no' > /etc/ssh/sshd_config.d/01-permituserenvironment.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i permituserenvironment

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-RHEL7-5.3.13-sshd_ciphers"
    name: "sshd ciphers: grep -Ei \"^Ciphers\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.13. CIS Controls v8: 3.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^Ciphers" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ Ciphers chacha20-poly1305@openssh\\.com,aes256-gcm@openssh\\.com,aes128-gcm@openssh\\.com,aes256-ctr,aes192-ctr,aes128-ctr" }
    rationale: &rat-020e874b5b |
      Ciphers protect the confidentiality of SSH sessions. Outdated algorithms such as CBC modes, 3DES, Blowfish or RC4 are vulnerable to known attacks, and chacha20-poly1305 is exposed to the Terrapin attack when clients lack the fix. Restricting the server to strong ciphers keeps clients from negotiating a weak one.
    remediation: &rem-12141a0feb |
      Configure the list of strong ciphers in the global section of /etc/ssh/sshd_config (the RHEL 7 check reads only this file), then validate and reload.

      sed -i -E '/^\s*Ciphers\s/Id' /etc/ssh/sshd_config
      sed -i '1i Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr' /etc/ssh/sshd_config
      sshd -t
      systemctl reload sshd
  - id: "CIS-RHEL7-5.3.14-sshd_MACS"
    name: "sshd MACS: grep -Ei \"^MACs\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.14. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^MACs" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ MACs hmac-sha2-512-etm@openssh\\.com,hmac-sha2-256-etm@openssh\\.com,hmac-sha2-512,hmac-sha2-256" }
    rationale: &rat-a16db2eaa8 |
      Message authentication codes protect SSH traffic against tampering. MD5, RIPEMD-160, truncated 96-bit and 64-bit UMAC algorithms provide weak or reduced integrity protection and may allow forgery or downgrade attacks. Limiting sshd to SHA-2 based MACs keeps integrity protection strong; very old clients may need an upgrade.
    remediation: &rem-2dabf46517 |
      Put the explicit list at the top of /etc/ssh/sshd_config (the RHEL 7 check reads only that file) and remove other MACs lines.

      sed -i '1i MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256' /etc/ssh/sshd_config
      sshd -t && systemctl reload sshd
  - id: "CIS-RHEL7-5.3.15-sshd_KEX"
    name: "sshd KEX: grep -Ei \"^KEX\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.15. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^KEX" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ KexAlgorithms curve25519-sha256,curve25519-sha256@libssh\\.org,diffie-hellman-group14-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256" }
    rationale: &rat-4e0cce0b15 |
      The key exchange establishes the keys that protect the whole SSH session. Methods based on SHA-1 or the 1024-bit group 1 are considered too weak and could let a well-resourced attacker break or downgrade session security. Restricting key exchange to elliptic-curve and large-group SHA-2 methods keeps connections confidential; very old clients that only support legacy methods will no longer connect.
    remediation: &rem-1e6f42f532 |
      Put the explicit list at the top of /etc/ssh/sshd_config (the RHEL 7 check reads only that file) and remove other KexAlgorithms lines.

      sed -i '1i KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group14-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256' /etc/ssh/sshd_config
      sshd -t && systemctl reload sshd
  - id: "CIS-RHEL7-5.3.16-sshd_clientalive"
    name: "sshd clientalive: grep -Ei \"^ClientAlive\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.16. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^ClientAlive" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ClientAliveInterval 300" }
      - { some: "~ ClientAliveCountMax 3" }
    rationale: &rat-3cc59b4363 |
      SSH connections whose client has crashed or lost the network can stay open indefinitely, holding resources and leaving a session that might be resumed or hijacked. ClientAliveInterval and ClientAliveCountMax make sshd send keepalive probes through the encrypted channel and disconnect when the client stops answering. This does not end sessions of an idle client that is still connected.
    remediation: &rem-bf78185fc2 |
      Set ClientAliveInterval 300 and ClientAliveCountMax 3 and remove conflicting ClientAlive lines. RHEL 7 expects exactly these values; RHEL 8 to 10 accept an interval of 1 to 900 seconds and a count of 1 to 4.

      printf '%s\n' 'ClientAliveInterval 300' 'ClientAliveCountMax 3' > /etc/ssh/sshd_config.d/01-clientalive.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i clientalive

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config.
  - id: "CIS-RHEL7-5.3.17-ssh_logingrace"
    name: "ssh logingrace: grep -Ei \"^logingrace\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.17. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^logingrace" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^(?i)LoginGraceTime ([1-9]|[1-5][0-9]|60)$" }
    rationale: &rat-a9975bf989 |
      LoginGraceTime limits how long an unauthenticated connection may stay open. A long grace period lets attackers hold many pending connections, exhausting the startup slots and locking out legitimate users, and gives more time for each guessing attempt. One minute or less is ample for real logins.
    remediation: &rem-888f194a5f |
      Set LoginGraceTime to 60 seconds or less, written as a plain number (for example 60, not 1m), and remove conflicting lines.

      echo 'LoginGraceTime 60' > /etc/ssh/sshd_config.d/01-logingracetime.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i logingracetime

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-RHEL7-5.3.19-ssh_usepam"
    name: "ssh usepam: grep -Ei \"^usepam\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.19. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^usepam" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ UsePAM yes" }
      - { none: "~ ^UsePAM no" }
    rationale: &rat-20d91b73a4 |
      With UsePAM enabled, sshd runs the PAM account and session stacks, so lockout after failed logins, password expiry, access restrictions and session limits configured in PAM also apply to SSH logins. Without it these controls are bypassed for remote access.
    remediation: &rem-5c14f62bd4 |
      Set UsePAM yes and remove any UsePAM no line.

      echo 'UsePAM yes' > /etc/ssh/sshd_config.d/01-usepam.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i usepam

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-RHEL7-5.3.20-sshd_tcpforwarding"
    name: "sshd tcpforwarding: grep -Ei \"^allowtcpforward\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.20. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^allowtcpforward" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ AllowTcpForwarding no" }
      - { none: "~ ^AllowTcpForwarding yes" }
    rationale: &rat-66bf0a21cb |
      TCP forwarding lets SSH users tunnel arbitrary connections through the server, bypassing network firewalls and monitoring, for example to reach internal services. Disabling it prevents the SSH server from being used as a pivot. Users who legitimately need tunnels lose that ability.
    remediation: &rem-3461142921 |
      Set AllowTcpForwarding no in /etc/ssh/sshd_config (replace an existing setting, otherwise add it at the top of the file so that it is not inside a Match block) and reload sshd.

      sed -ri 's/^\s*AllowTcpForwarding\s+\S+/AllowTcpForwarding no/I' /etc/ssh/sshd_config
      grep -q '^AllowTcpForwarding no' /etc/ssh/sshd_config || sed -i '1i AllowTcpForwarding no' /etc/ssh/sshd_config
      sshd -t && systemctl reload sshd
  - id: "CIS-RHEL7-5.3.21-ssh_maxstartups"
    name: "ssh maxstartups: grep -Ei \"^MaxStartups\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.21. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^MaxStartups" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ MaxStartups 10:30:60" }
    rationale: &rat-32a21f45bb |
      MaxStartups controls how many unauthenticated connections sshd accepts at the same time. With 10:30:60, sshd starts refusing new unauthenticated connections at random once 10 are pending, with rising probability up to a hard limit of 60. This blunts connection floods and brute-force tools while legitimate users still get through.
    remediation: &rem-36fe032f0c |
      Set MaxStartups 10:30:60 and remove conflicting MaxStartups lines.

      echo 'MaxStartups 10:30:60' > /etc/ssh/sshd_config.d/01-maxstartups.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i maxstartups

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-RHEL7-5.3.22-ssh_maxsessions"
    name: "ssh maxsessions: grep -Ei \"^MaxSessions\" /etc/ssh/sshd_config"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.3.22. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^MaxSessions" /etc/ssh/sshd_config
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^(?i)MaxSessions ([2-9]|10)" }
      - { none: "~ ^MaxSessions (1[1-9]|[2-9][0-9]|[1-9]{3,})" }
    rationale: &rat-5de57ba7dd |
      MaxSessions limits how many shell, login or subsystem sessions can be multiplexed over one SSH connection. Without a cap, a single authenticated connection could open a large number of sessions and exhaust server resources. A limit of 10 still accommodates normal multiplexing.
    remediation: &rem-d4bf1cc141 |
      Set MaxSessions to 10 or less and remove lines with higher values.

      echo 'MaxSessions 10' > /etc/ssh/sshd_config.d/01-maxsessions.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i maxsessions

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-RHEL7-5.4.1-etc_security_pwquality.conf-attrs"
    name: "/etc/security/pwquality.conf: exists"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.4.1. CIS Controls v8: 5.2."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/security/pwquality.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ba567ff3a5 |
      pwquality.conf defines the strength requirements that pam_pwquality enforces when users change passwords. Requiring a minimum length and several character classes makes passwords much harder to guess or crack offline if hashes are stolen.
    remediation: &rem-042dbf9aee |
      Create /etc/security/pwquality.conf.
  - id: "CIS-RHEL7-5.4.1-etc_security_pwquality.conf-content"
    name: "/etc/security/pwquality.conf has the expected content (1 rule)"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.4.1. CIS Controls v8: 5.2."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/security/pwquality.conf'
    allow_rc: any
    expect: { some: "~ minclass = 4" }
    rationale: *rat-ba567ff3a5
    remediation: &rem-36af42e4db |
      Edit /etc/security/pwquality.conf so that its lines meet these conditions (regular expressions):

      - a line matches minclass = 4
  - id: "CIS-RHEL7-5.4.2-password_auth_accountlock"
    name: "password auth accountlock: grep -E \"account\\s+required\" /etc/pam.d/password-auth"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.4.2. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "account\s+required" /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^account\\s*required\\s*pam_faillock.so" }
    rationale: &rat-7f31568d1a |
      pam_faillock counts failed logins and locks the account after the configured number of failures. Its account entry is what actually denies access to a locked account and resets the counter after a successful login, so without it the lockout is not enforced.
    remediation: &rem-e3b480dab0 |
      Enable pam_faillock with authconfig, which adds the auth and account entries, including 'account required pam_faillock.so', to password-auth and system-auth.

      authconfig --enablefaillock --faillockargs="deny=5 unlock_time=900" --update
      grep -E '^account\s+required\s+pam_faillock.so' /etc/pam.d/password-auth

      On RHEL 7 /etc/pam.d/password-auth and system-auth are usually symlinks to the *-ac files, which authconfig regenerates; repeat the change after running authconfig.
  - id: "CIS-RHEL7-5.4.3-password_auth_sha"
    name: "password auth sha: grep sha512 /etc/pam.d/password-auth"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.4.3. CIS Controls v8: 3.11."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep sha512 /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^password sufficient pam_unix.so sha512" }
      - { none: "~ ^password sufficient pam_unix.so md5" }
    rationale: &rat-c11cede67b |
      pam_unix hashes newly set passwords with the algorithm given on its password line. SHA-512 produces salted, iterated hashes that are far more resistant to offline cracking than MD5, so stolen hashes are much harder to turn back into passwords.
    remediation: &rem-4e77cf9e53 |
      Configure SHA-512 hashing with authconfig, then make sure the pam_unix password line in /etc/pam.d/password-auth reads exactly 'password sufficient pam_unix.so sha512 ...' with single spaces, as the check expects.

      authconfig --passalgo=sha512 --update
      sed --follow-symlinks -ri 's/^password\s+sufficient\s+pam_unix\.so\s+/password sufficient pam_unix.so /' /etc/pam.d/password-auth
      grep '^password sufficient pam_unix.so' /etc/pam.d/password-auth

      The setting applies to passwords changed afterwards; existing hashes remain until users change their passwords. On RHEL 7 /etc/pam.d/password-auth and system-auth are usually symlinks to the *-ac files, which authconfig regenerates; repeat the change after running authconfig.
  - id: "CIS-RHEL7-5.4.4-password_auth_remember"
    name: "password auth remember: grep remember /etc/pam.d/password-auth"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.4.4. CIS Controls v8: 5.2."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep remember /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^password.*required.*pam_pwhistory.so.*remember=\\b(?:[1-5]\\d+|5)\\b" }
    rationale: &rat-c8a47a7c11 |
      Remembering previous passwords prevents users from reusing an old, possibly compromised password when a change is required. pam_pwhistory with remember=5 or more in /etc/pam.d/password-auth rejects the most recent passwords.
    remediation: &rem-bf1243f283 |
      Add a pam_pwhistory line with remember=5 (or 10 to 59) directly before the pam_unix password line in /etc/pam.d/password-auth. If a pam_pwhistory line already exists, change its remember= value instead.

      sed --follow-symlinks -ri '/^password\s+sufficient\s+pam_unix\.so/i password    required      pam_pwhistory.so use_authtok remember=5 retry=3' /etc/pam.d/password-auth
      grep pam_pwhistory /etc/pam.d/password-auth

      On RHEL 7 /etc/pam.d/password-auth and system-auth are usually symlinks to the *-ac files, which authconfig regenerates; repeat the change after running authconfig.
  - id: "CIS-RHEL7-5.4.4-system_auth_remember"
    name: "system auth remember: grep remember /etc/pam.d/system-auth"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.4.4. CIS Controls v8: 5.2."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep remember /etc/pam.d/system-auth
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^password.*required.*pam_pwhistory.so.*remember=\\b(?:[1-5]\\d+|5)\\b" }
    rationale: &rat-3709bc7454 |
      Remembering previous passwords prevents users from reusing an old, possibly compromised password when a change is required. pam_pwhistory with remember=5 or more in /etc/pam.d/system-auth rejects the most recent passwords.
    remediation: &rem-3cf4fafd74 |
      Add a pam_pwhistory line with remember=5 (or 10 to 59) directly before the pam_unix password line in /etc/pam.d/system-auth. If a pam_pwhistory line already exists, change its remember= value instead.

      sed --follow-symlinks -ri '/^password\s+sufficient\s+pam_unix\.so/i password    required      pam_pwhistory.so use_authtok remember=5 retry=3' /etc/pam.d/system-auth
      grep pam_pwhistory /etc/pam.d/system-auth

      On RHEL 7 /etc/pam.d/password-auth and system-auth are usually symlinks to the *-ac files, which authconfig regenerates; repeat the change after running authconfig.
  - id: "CIS-RHEL7-5.5.1.1-login_defs_max_days"
    name: "login defs max days: grep PASS_MAX_DAYS /etc/login.defs"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.5.1.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep PASS_MAX_DAYS /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS_MAX_DAYS\\s*365" }
      - { none: "~ ^PASS_MAX_DAYS\\s*(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9][0-9][0-9]|[1-9][0-9][0-9][0-9][0-9])" }
      - { none: "~ ^PASS_MAX_DAYS\\s*-1" }
    rationale: &rat-de28e65ea9 |
      A maximum password age limits how long a compromised password remains useful to an attacker who obtained it unnoticed. PASS_MAX_DAYS sets the default maximum for new passwords; 365 days or less forces periodic renewal without the counterproductive effects of very frequent changes.
    remediation: &rem-5638dc8f2e |
      Set PASS_MAX_DAYS to 365 in /etc/login.defs.

      sed -ri 's/^\s*PASS_MAX_DAYS\s+.*/PASS_MAX_DAYS 365/' /etc/login.defs
      grep -q '^PASS_MAX_DAYS' /etc/login.defs || echo 'PASS_MAX_DAYS 365' >> /etc/login.defs

      login.defs only applies to accounts created or passwords changed later; adjust existing accounts with chage.
  - id: "CIS-RHEL7-5.5.1.2-login_defs_min_days"
    name: "login defs min days: grep PASS_MIN_DAYS /etc/login.defs"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.5.1.2. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep PASS_MIN_DAYS /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS_MIN_DAYS\\s*1" }
      - { none: "~ ^PASS_MIN_DAYS\\s*([2-9]|[1-9][0-9][0-9]|[1-9][0-9][0-9][0-9]|[1-9][0-9][0-9][0-9][0-9])" }
    rationale: &rat-d3716bb90c |
      A minimum password age prevents users from changing their password several times in a row to get back to an old favourite, which would defeat password history. PASS_MIN_DAYS of at least one day sets this default for new passwords.
    remediation: &rem-5132065802 |
      Set PASS_MIN_DAYS to 1 in /etc/login.defs.

      sed -ri 's/^\s*PASS_MIN_DAYS\s+.*/PASS_MIN_DAYS 1/' /etc/login.defs
      grep -q '^PASS_MIN_DAYS' /etc/login.defs || echo 'PASS_MIN_DAYS 1' >> /etc/login.defs

      login.defs only applies to accounts created or passwords changed later; adjust existing accounts with chage.
  - id: "CIS-RHEL7-5.5.1.3-login_defs_warn_age"
    name: "login defs warn age: grep PASS_WARN_AGE /etc/login.defs"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.5.1.3. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep PASS_WARN_AGE /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS_WARN_AGE\\s*7" }
      - { none: "~ ^PASS_WARN_AGE\\s*[1-6]" }
    rationale: &rat-ca921e80d6 |
      Warning users several days before their password expires gives them time to choose a good new password instead of being forced into a hasty choice or being locked out. PASS_WARN_AGE sets the default warning period for new passwords.
    remediation: &rem-ce0575be3a |
      Set PASS_WARN_AGE to 7 in /etc/login.defs.

      sed -ri 's/^\s*PASS_WARN_AGE\s+.*/PASS_WARN_AGE 7/' /etc/login.defs
      grep -q '^PASS_WARN_AGE' /etc/login.defs || echo 'PASS_WARN_AGE 7' >> /etc/login.defs

      login.defs only applies to accounts created or passwords changed later; adjust existing accounts with chage.
  - id: "CIS-RHEL7-5.5.1.4-inactive_passwd"
    name: "inactive passwd: useradd -D | grep INACTIVE"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.5.1.4. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      useradd -D | grep INACTIVE
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^INACTIVE=[1-30]" }
    rationale: &rat-1b1499cc8f |
      The default INACTIVE value used by useradd defines how many days after password expiry an account is disabled. Disabling unused accounts automatically removes forgotten access paths that attackers like to exploit; a value of up to 30 or 45 days, depending on the policy, balances security and usability.
    remediation: &rem-728ced36b8 |
      Set the default password inactivity period for new accounts to 30 days and apply the same value to existing accounts that have a password.

      useradd -D -f 30
      useradd -D | grep INACTIVE
      chage --inactive 30 USER

      30 days satisfies every supported release; some releases also accept up to 45 days.
  - id: "CIS-RHEL7-5.5.1.4-inactive_users"
    name: "inactive users: grep -E ^[^:]+:[^\\!*] /etc/shadow | grep -vw root | cut -d : -f1,7"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.5.1.4. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E ^[^:]+:[^\!*] /etc/shadow | grep -vw root | cut -d : -f1,7
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-c4a4e8be14 |
      Accounts whose password has expired but which remain usable indefinitely are a common foothold for attackers because nobody notices their misuse. Setting a password inactivity period on every account with a password ensures that such accounts are disabled automatically after expiry.
    remediation: &rem-4e712889d3 |
      Set a password inactivity period of 30 days or less on every account that has a password, in particular on each account reported by the check.

      awk -F: '($2 ~ /^\$/) {print $1, $7}' /etc/shadow
      chage --inactive 30 USER

      Set the default for new accounts as well with useradd -D -f 30.
  - id: "CIS-RHEL7-5.5.1.5-passwd_chg_past"
    name: "No user has a last password change date in the future"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.5.1.5. CIS Controls v8: 5.2."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      now=$(date +%s)
      for usr in $(cut -d: -f1 /etc/shadow); do
        d=$(chage --list "$usr" 2>/dev/null | awk -F': ' '/^Last password change/ {print $2}')
        case "$d" in ""|never|*"must be changed"*) continue ;; esac
        t=$(date -d "$d" +%s 2>/dev/null) || { echo "$usr: cannot parse last password change '$d'"; continue; }
        if [ "$t" -gt "$now" ]; then echo "$usr: last password change $d is in the future"; fi
      done
    expect: empty
    rationale: &rat-eae9c8e6b4 |
      If the recorded date of the last password change lies in the future, password ageing does not work: the password never expires and the user cannot be forced to change it. Such dates usually result from a wrong system clock or manual edits and should be corrected.
    remediation: &rem-8950b282e3 |
      Check the system clock, then set the last password change of every listed user to today, or expire the password so it must be changed at the next login:

      chage --lastday "$(date +%Y-%m-%d)" USER
      chage --lastday 0 USER
  - id: "CIS-RHEL7-5.5.2-secure_system_LK"
    name: "secure system LK: /awk -F: '$3\u003c1000' /etc/passwd | egrep -wv 'root' | cut -d: -f1 | xargs -I '{}' passwd -S…"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.5.2. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      /awk -F: '$3<1000' /etc/passwd | egrep -wv 'root' | cut -d: -f1 | xargs -I '{}' passwd -S '{}' | egrep -cvw 'LK|L'/
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ 0" }
    rationale: &rat-fac0721bde |
      System accounts exist to own files and run services; they are not meant for interactive logins. Locking their passwords ensures that nobody can authenticate as such an account with a password, which removes a class of easily overlooked access paths.
    remediation: &rem-c1d7b7b88a |
      Lock the password of every system account (UID below 1000, except root) that is not locked yet.

      awk -F: '($3 < 1000 && $1 != "root") {print $1}' /etc/passwd | xargs -n 1 passwd -S
      usermod -L USER

      Locking disables password authentication only; services running under these accounts keep working.
  - id: "CIS-RHEL7-5.5.2-secure_system_accts"
    name: "secure system accts: /awk -F: '$3\u003c1000' /etc/passwd | egrep -v 'root|sync|halt|shutdown|/sbin/nologin|/bin/fal…"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.5.2. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      /awk -F: '$3<1000' /etc/passwd | egrep -v 'root|sync|halt|shutdown|/sbin/nologin|/bin/false'/
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-6f6bd67ce7 |
      System and service accounts do not need an interactive shell. If one of them has a valid login shell, a weakness in a service or a misconfigured password can give an attacker an interactive session under that account. Setting the shell to nologin prevents this.
    remediation: &rem-3badb6c42f |
      Set the login shell of every system account reported by the check to /sbin/nologin.

      awk -F: '($3 < 1000) {print $1, $7}' /etc/passwd
      usermod -s /sbin/nologin USER

      Accounts root, sync, shutdown and halt are exempt. Make sure no service needs an interactive shell for the account before changing it.
  - id: "CIS-RHEL7-5.5.3-root"
    name: "User root has UID 0 and GID 0"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.5.3. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      getent passwd root
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ ^root:[^:]*:0:0:"
    rationale: &rat-d7d4d06032 |
      Many system components, file ownerships and administrative procedures assume a root account with UID 0 exists. Its presence is a prerequisite for the other root-related checks, such as password and login restrictions, to be meaningful.
    remediation: &rem-f77400a1aa |
      Make GID 0 the primary group of root:

      usermod -g 0 root

      root must have the UID 0. A different UID means the account database was changed; compare /etc/passwd with a backup and correct the entry with vipw instead of renumbering files.
  - id: "CIS-RHEL7-5.5.4-etc_profile.d_tmout.sh-attrs"
    name: "/etc/profile.d/tmout.sh: exists"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.5.4. CIS Controls v8: 4.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/profile.d/tmout.sh'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f83d06fbd2 |
      Shell sessions left open on an unattended terminal can be misused by anyone passing by. Setting TMOUT to 900 seconds or less, read-only and exported, makes the shell terminate idle sessions automatically and prevents users from switching the timeout off.
    remediation: &rem-d92e4786c7 |
      Create /etc/profile.d/tmout.sh.
  - id: "CIS-RHEL7-5.5.4-etc_profile.d_tmout.sh-content"
    name: "/etc/profile.d/tmout.sh has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.5.4. CIS Controls v8: 4.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/profile.d/tmout.sh'
    allow_rc: any
    expect:
      - { some: "~ ^TMOUT=([1-8][0-9]{0,2}|900)" }
      - { some: "~ ^readonly TMOUT" }
    rationale: *rat-f83d06fbd2
    remediation: &rem-956f0d8575 |
      Edit /etc/profile.d/tmout.sh so that its lines meet these conditions (regular expressions):

      - a line matches ^TMOUT=([1-8][0-9]{0,2}|900)
      - a line matches ^readonly TMOUT
  - id: "CIS-RHEL7-5.5.5-etc_profile-attrs"
    name: "/etc/profile: exists"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.5.5. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/profile'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-77bded2eb5 |
      The default umask determines the permissions of files that users create. A restrictive umask such as 027 or 077 in /etc/profile prevents new files from being readable or writable by other users by default, reducing accidental data exposure.
    remediation: &rem-764ba5dedf |
      Create /etc/profile.
  - id: "CIS-RHEL7-5.5.5-etc_profile-content"
    name: "/etc/profile has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.5.5. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/profile'
    allow_rc: any
    expect:
      - { some: "~ ^\\s+umask\\s0(2|7)(2|7)" }
      - { none: "~ ^\\s+umask\\s[1-7][0-7][0-7]" }
    rationale: *rat-77bded2eb5
    remediation: &rem-755bb3ee75 |
      Edit /etc/profile so that its lines meet these conditions (regular expressions):

      - a line matches ^\s+umask\s0(2|7)(2|7)
      - no line matches ^\s+umask\s[1-7][0-7][0-7]
  - id: "CIS-RHEL7-5.7-etc_group-attrs"
    name: "/etc/group: exists"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.7. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/group'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-4582689d34 |
      The wheel group is used together with pam_wheel to decide who may become root with su. Its membership must be deliberate: every member is a potential path to root, and an unexpected member widens that path. The check verifies that the group exists with the expected membership.
    remediation: &rem-c6eedafd62 |
      Create /etc/group.
  - id: "CIS-RHEL7-5.7-etc_group-content"
    name: "/etc/group has the expected content (1 rule)"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.7. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/group'
    allow_rc: any
    expect: { some: "~ ^wheel:x:10:vagrant,root$" }
    rationale: *rat-4582689d34
    remediation: &rem-1a4ba66040 |
      Edit /etc/group so that its lines meet these conditions (regular expressions):

      - a line matches ^wheel:x:10:vagrant,root$
  - id: "CIS-RHEL7-5.7-etc_pam.d_su-attrs"
    name: "/etc/pam.d/su: exists"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.7. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/su'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-a589ec45f0 |
      Without a restriction, any user who knows the root password can use su to become root. Requiring membership in a dedicated group through pam_wheel limits su to approved administrators and makes shared root password use more accountable.
    remediation: &rem-d67efd69b0 |
      Create /etc/pam.d/su.
  - id: "CIS-RHEL7-5.7-etc_pam.d_su-content"
    name: "/etc/pam.d/su has the expected content (1 rule)"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.7. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/su'
    allow_rc: any
    expect: { some: "~ ^auth.*required.*pam_wheel.so\\suse_uid" }
    rationale: *rat-a589ec45f0
    remediation: &rem-f709ce6ec0 |
      Edit /etc/pam.d/su so that its lines meet these conditions (regular expressions):

      - a line matches ^auth.*required.*pam_wheel.so\suse_uid
  - id: "CIS-RHEL7-6.1.1-rpm_filecheck"
    name: "rpm filecheck: rpm -Va --nomtime --nosize --nomd5 --nolinkto \u003e /tmp/cis_rpmcheck | grep -vw c \u0026\u0026 cat /tm…"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.1.1. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    timeout: 30000ms
    run: |
      rpm -Va --nomtime --nosize --nomd5 --nolinkto > /tmp/cis_rpmcheck | grep -vw c && cat /tmp/cis_rpmcheck | wc -l
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ 0" }
    rationale: &rat-9f88d7b65b |
      Comparing installed files against the package database detects changed permissions, ownership or content of system files. Unexpected differences in files that are not configuration files can indicate tampering or a broken installation and should be investigated.
    remediation: &rem-582de1a1a5 |
      Review the package verification output and restore files that differ from the package without a legitimate reason: reset permissions and ownership, or reinstall the package if the content has changed.

      rpm -Va --nomtime --nosize --nomd5 --nolinkto | grep -vw c
      rpm -qf FILE
      rpm --setperms PACKAGE
      rpm --setugids PACKAGE
      yum reinstall PACKAGE

      Use dnf instead of yum on Amazon Linux 2023.
  - id: "CIS-RHEL7-6.1.2-passwd_perms"
    name: "passwd perms: stat -L -c \"%a %U %G\" /etc/passwd"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.1.2. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0,4][0,4] root root" }
    rationale: &rat-a167450576 |
      /etc/passwd lists all accounts and must be readable by everyone for name lookups, but only root may modify it. If others could write to it they could add accounts or change a user ID to 0 and gain root. Owner root, group root and mode 0644 provide this protection.
    remediation: &rem-6caf729613 |
      Set owner, group and permissions of /etc/passwd.

      chown root:root /etc/passwd
      chmod 0644 /etc/passwd
  - id: "CIS-RHEL7-6.1.3-passwd-_perms"
    name: "passwd perms: stat -L -c \"%a %U %G\" /etc/passwd-"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.1.3. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/passwd-
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0,4][0,4] root root" }
    rationale: &rat-b4ee6fc5d0 |
      /etc/passwd- is the backup copy of the account database written by tools like useradd and vipw. It holds the same information as /etc/passwd and could be used to restore a manipulated version, so it needs the same protection: owned by root:root and not writable by others.
    remediation: &rem-e0e293ff9d |
      Set owner, group and permissions of /etc/passwd-.

      chown root:root /etc/passwd-
      chmod 0644 /etc/passwd-

      Mode 0600 is accepted as well. The Ubuntu 22.04 and 26.04 variants check /etc/passwd instead; fix it the same way.
  - id: "CIS-RHEL7-6.1.4-shadow_perms"
    name: "shadow perms: stat -L -c \"%a %U %G\" /etc/shadow"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.1.4. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/shadow
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 0 root root" }
    rationale: &rat-1890aeb8b4 |
      /etc/shadow holds the password hashes and aging data of all accounts. Read access allows offline cracking of the hashes, and write access allows setting any password or unlocking accounts. Only root, and on Debian-like and SUSE systems the shadow group, may access it.
    remediation: &rem-5e2fff2c8a |
      Set owner, group and permissions of /etc/shadow.

      chown root:root /etc/shadow
      chmod 0000 /etc/shadow

      Mode 0000 is the distribution default; root can still read and write the file.
  - id: "CIS-RHEL7-6.1.5-shadow-_perms"
    name: "shadow perms: stat -L -c \"%a %U %G\" /etc/shadow-"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.1.5. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/shadow-
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 0 root root" }
    rationale: &rat-8b7a9c949b |
      /etc/shadow- is the backup of the shadow file and contains password hashes, often only slightly older than the current ones. It needs the same strict protection as /etc/shadow to prevent offline password cracking.
    remediation: &rem-6b304d3af9 |
      Set owner, group and permissions of /etc/shadow-.

      chown root:root /etc/shadow-
      chmod 0000 /etc/shadow-

      Mode 0000 is the distribution default; root can still read and write the file.
  - id: "CIS-RHEL7-6.1.6-gshadow-_perms"
    name: "gshadow perms: stat -L -c \"%a %U %G\" /etc/gshadow-"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.1.6. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/gshadow-
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 0 root root" }
    rationale: &rat-6f659e3db8 |
      /etc/gshadow- is the backup of the group shadow file and contains the same sensitive group password and administrator information. It needs the same strict ownership and permissions as /etc/gshadow.
    remediation: &rem-ac61f19423 |
      Set owner, group and permissions of /etc/gshadow-.

      chown root:root /etc/gshadow-
      chmod 0000 /etc/gshadow-

      Mode 0000 is the distribution default; root can still read and write the file.
  - id: "CIS-RHEL7-6.1.7-gshadow_perms"
    name: "gshadow perms: stat -L -c \"%a %U %G\" /etc/gshadow"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.1.7. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/gshadow
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 0 root root" }
    rationale: &rat-07f61f03b9 |
      /etc/gshadow contains group passwords and the lists of group administrators. Exposure allows cracking group passwords, and modification allows users to grant themselves group membership or administration rights. It must be restricted to root and, where used, the shadow group.
    remediation: &rem-f606d496c5 |
      Set owner, group and permissions of /etc/gshadow.

      chown root:root /etc/gshadow
      chmod 0000 /etc/gshadow

      Mode 0000 is the distribution default; root can still read and write the file.
  - id: "CIS-RHEL7-6.1.8-group_perms"
    name: "group perms: stat -L -c \"%a %U %G\" /etc/group"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.1.8. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/group
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0,4][0,4] root root" }
    rationale: &rat-63d76b0c8d |
      /etc/group defines group memberships, including administrative groups such as wheel. If non-root users could modify it they could add themselves to privileged groups. It must be owned by root:root with mode 0644 so it is readable but protected.
    remediation: &rem-bbf151425e |
      Set owner, group and permissions of /etc/group.

      chown root:root /etc/group
      chmod 0644 /etc/group
  - id: "CIS-RHEL7-6.1.9-group-_perms"
    name: "group perms: stat -L -c \"%a %U %G\" /etc/group-"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.1.9. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/group-
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0,4][0,4] root root" }
    rationale: &rat-46fe720062 |
      /etc/group- is the backup of the group database. It contains the same membership information as /etc/group and must be protected the same way, owned by root:root and not writable by others, so it cannot be used to plant manipulated group memberships.
    remediation: &rem-c35567da05 |
      Set owner, group and permissions of /etc/group-.

      chown root:root /etc/group-
      chmod 0644 /etc/group-

      Mode 0600 is accepted as well.
  - id: "CIS-RHEL7-6.1.10-world_writable"
    name: "world writable: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm…"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.1.10. CIS Controls v8: 3.3, 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -0002
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-9f0a5a248e |
      Files and directories that everyone can write to allow any user to alter data, plant malicious content or replace files that others rely on. World-writable directories without the sticky bit additionally let users delete or rename other users' files. Such permissions should be removed or justified.
    remediation: &rem-9b39034669 |
      Review each file and directory listed by the check. Remove world write access where it is not required, and set the sticky bit on directories that must stay world-writable so that users cannot delete each other's files.

      ls -ld PATH
      chmod o-w FILE
      chmod +t DIRECTORY

      Shared directories such as /tmp and /var/tmp need mode 1777; clarify with the owning application before changing other files.
  - id: "CIS-RHEL7-6.1.11-unowned"
    name: "unowned: df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nouser"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.1.11. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nouser
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-79b3e6f000 |
      Files without a valid owning user or group usually remain after an account was deleted. If a new account later receives the same UID or GID, it silently inherits those files and their data. Unowned files also hint at unpackaged software or tampering and should be reviewed.
    remediation: &rem-428f0b1787 |
      Review each listed file or directory and assign it to a valid user and group, or remove it once it is confirmed to be unneeded.

      ls -ld FILE
      chown USER:GROUP FILE

      Do not delete anything before checking what it is and whether it holds data still in use.
  - id: "CIS-RHEL7-6.1.12-ungrouped"
    name: "ungrouped: df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nogroup"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.1.12. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nogroup
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-4cd5398086 |
      Files whose group ID does not match any existing group are often left behind by deleted groups or extracted archives. If a new group is later created with the same GID, its members silently gain access to these files. Each such file should be assigned to a valid group.
    remediation: &rem-fb9565cddc |
      Run the check command to list files without a valid group, find out which group each file should belong to, and assign it.

      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -nogroup
      chgrp GROUP FILE

      Remove files only after confirming they are no longer needed.
  - id: "CIS-RHEL7-6.1.13-suid_executables"
    name: "suid executables: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm…"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.1.13. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -4000
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-e06547f452 |
      Programs with the SUID bit run with the privileges of their owner, usually root, and are a classic route to privilege escalation if vulnerable or planted by an attacker. Reviewing the list of SUID files reveals unexpected additions, and removing the bit where it is not needed reduces the attack surface.
    remediation: &rem-47fe2a5feb |
      Review each listed SUID file: confirm that it belongs to an installed package and that the SUID bit is needed, and remove the bit where it is not.

      rpm -qf FILE
      rpm -Vf FILE
      chmod u-s FILE

      The check lists every SUID file, including essential ones such as passwd, su, sudo or mount, so it usually cannot pass on a standard installation; removing the bit from those breaks them.
  - id: "CIS-RHEL7-6.1.14-sgid_executables"
    name: "sgid executables: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm…"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.1.14. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -2000
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-639403665a |
      Programs with the SGID bit run with the privileges of their group, so a vulnerable or planted SGID binary can be used to gain those group privileges. Knowing exactly which SGID files exist makes unexpected additions stand out, and removing the bit where it is not needed reduces escalation paths.
    remediation: &rem-75ef1a4a01 |
      Review each listed SGID file: confirm that it belongs to an installed package and that the SGID bit is needed, and remove the bit where it is not.

      rpm -qf FILE
      rpm -Vf FILE
      chmod g-s FILE

      The check lists every SGID file, including legitimate ones shipped by the distribution, so it usually cannot pass on a standard installation; removing the bit from such files can break them.
  - id: "CIS-RHEL7-6.2.1-etc_passwd-attrs"
    name: "/etc/passwd: exists"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.1. CIS Controls v8: 3.11."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/passwd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ace380baef |
      /etc/passwd is world-readable. Password hashes must therefore be kept in the shadow file, indicated by an 'x' in the password field; a hash stored in /etc/passwd could be copied by any local user and cracked offline.
    remediation: &rem-88dbdb7375 |
      Create /etc/passwd.
  - id: "CIS-RHEL7-6.2.1-etc_passwd-content"
    name: "/etc/passwd has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.1. CIS Controls v8: 3.11."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/passwd'
    allow_rc: any
    expect:
      - { some: "~ ^.*:x:*" }
      - { none: "~ /\\^\\.\\*:\\[a-w\\]\\[y-z\\]:\\.\\*" }
    rationale: *rat-ace380baef
    remediation: &rem-cd4dbdb5d2 |
      Edit /etc/passwd so that its lines meet these conditions (regular expressions):

      - a line matches ^.*:x:*
      - no line matches /\^\.\*:\[a-w\]\[y-z\]:\.\*
  - id: "CIS-RHEL7-6.2.2-etc_shadow-attrs"
    name: "/etc/shadow: exists"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.2. CIS Controls v8: 5.2."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/shadow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ef368ce717 |
      /etc/shadow holds the password hashes and aging data for all accounts. The content rules flag accounts whose password field indicates an unset or empty password, because such accounts can either be unlocked unnoticed or allow login without any password.
    remediation: &rem-098e77832a |
      Create /etc/shadow.
  - id: "CIS-RHEL7-6.2.2-etc_shadow-content"
    name: "/etc/shadow has the expected content (1 rule)"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.2. CIS Controls v8: 5.2."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/shadow'
    allow_rc: any
    expect: { none: "~ ^.*:\\!\\!:.*" }
    rationale: *rat-ef368ce717
    remediation: &rem-8b9ddeb1f0 |
      Edit /etc/shadow so that its lines meet these conditions (regular expressions):

      - no line matches ^.*:\!\!:.*
  - id: "CIS-RHEL7-6.2.3-passwd_group_exist"
    name: "passwd group exist: pwck -r | grep 'no group' | awk '{ gsub(\"[:\\47]\",\"\"); print $2}'"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.3. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pwck -r | grep 'no group' | awk '{ gsub("[:\47]",""); print $2}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-a6fe2c7421 |
      Every primary group referenced in /etc/passwd should exist in /etc/group. Undefined group IDs usually result from manual edits or deleted groups; if the ID is reused later, the new group's members gain access to the affected users' files.
    remediation: &rem-ac0bde3f41 |
      For every user reported by the check, create the missing group with the referenced GID or assign the user an existing primary group.

      grpck -r
      groupadd -g GID GROUP
      usermod -g GROUP USER

      Changing the primary group does not change the ownership of existing files; adjust them if necessary.
  - id: "CIS-RHEL7-6.2.4-shadow"
    name: "Group shadow does not exist"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.4. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      getent group shadow
    expect: false
    rationale: &rat-b2c3e08643 |
      On systems that use a shadow group, members can read /etc/shadow and thus every password hash. On RHEL 7 no such group is expected; its presence suggests a non-standard configuration that may grant hash access to additional users.
    remediation: &rem-03a8e4a4d2 |
      Remove the group shadow, unless the system needs it:

      groupdel shadow
  - id: "CIS-RHEL7-6.2.5-no_dup_username"
    name: "no dup username: cat /etc/passwd | cut -d: -f1 | uniq -d"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.5. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/passwd | cut -d: -f1 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-48bf65be3b |
      Duplicate user names in /etc/passwd make it unpredictable which entry is used for login and which UID a name resolves to. This can lead to wrong file ownership and confusing audit trails.
    remediation: &rem-e93b096dcd |
      Review the duplicate entries for every user name reported by the check and remove or rename the surplus entry in /etc/passwd and /etc/shadow with the locking editors.

      grep -n '^USER:' /etc/passwd
      pwck -r
      vipw
      vipw -s
  - id: "CIS-RHEL7-6.2.6-no_dup_groupname"
    name: "no dup groupname: cat /etc/group | cut -d: -f1 | uniq -d"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.6. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/group | cut -d: -f1 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-5dd470fed7 |
      Duplicate group names in /etc/group make it unpredictable which GID a group name resolves to. This can lead to wrong access rights when files or memberships are assigned by name.
    remediation: &rem-c9a5680ce7 |
      Review the duplicate entries for every group name reported by the check and remove or rename the surplus entry in /etc/group and /etc/gshadow with the locking editors.

      grep -n '^GROUP:' /etc/group
      grpck -r
      vigr
      vigr -s
  - id: "CIS-RHEL7-6.2.7-no_dup_uid"
    name: "no dup uid: cat /etc/passwd | cut -d: -f3 | uniq -d"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.7. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/passwd | cut -d: -f3 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-92a5e740a2 |
      The kernel identifies users by UID, not by name. Several accounts with the same UID share all file ownerships and privileges and cannot be told apart in logs, which undermines accountability.
    remediation: &rem-3997dd9dfb |
      Review every duplicate UID reported by the check, give each account its own UID and assign the files of the former shared UID deliberately.

      awk -F: '($3 == UID) {print $1}' /etc/passwd
      usermod -u NEWUID USER
      find / -xdev -user UID -ls

      usermod adjusts only the home directory; other files owned by the old UID stay with the account that keeps it.
  - id: "CIS-RHEL7-6.2.8-no_dup_gid"
    name: "no dup gid: cat /etc/group | cut -d: -f3 | uniq -d"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.8. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/group | cut -d: -f3 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-1c1a4afdb8 |
      Groups are identified by GID. Several groups with the same GID share all group permissions, so membership in one silently grants the access rights of the other.
    remediation: &rem-6a315abc33 |
      Review every duplicate GID reported by the check, give each group its own GID and assign the files of the former shared GID deliberately.

      awk -F: '($3 == GID) {print $1}' /etc/group
      groupmod -g NEWGID GROUP
      find / -xdev -group GID -ls

      Files owned by the old GID are not changed automatically; adjust them where they belong to the renumbered group.
  - id: "CIS-RHEL7-6.2.9-uid_0_check"
    name: "uid 0 check: awk -F: '($3 == 0) { print $1 }' /etc/passwd"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.9. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3 == 0) { print $1 }' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root" }
    rationale: &rat-90d4d66c1b |
      Any account with UID 0 has full root privileges, regardless of its name. Additional UID 0 accounts are a classic backdoor and make it impossible to attribute administrative actions; only root should have UID 0.
    remediation: &rem-5c4a8fc9e4 |
      Make sure that only root has UID 0. Find out what every other UID 0 account is used for, then give it a unique non-zero UID with vipw or remove it.

      awk -F: '($3 == 0) {print $1}' /etc/passwd
      vipw
      userdel USER

      usermod -u cannot be used here because the running root processes share UID 0. Also make sure that root itself has UID 0.
  - id: "CIS-RHEL7-6.2.10-root_path_check"
    name: "root path check: /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e…"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.10. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e 's/:/\n/g'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ \\\\." }
    rationale: &rat-ee503b897e |
      If root's PATH contains the current directory, empty entries, relative paths or directories that other users can write to, a malicious program placed there can be executed with root privileges when an administrator types a common command name. Root's PATH should contain only absolute, root-owned and non-writable directories.
    remediation: &rem-0afab9f1f3 |
      Remove the current directory (.), empty entries (leading, trailing or double colons), relative paths and non-existent directories from root's PATH, and make sure every remaining directory is owned by root and not writable by group or others. Look for PATH assignments in root's and the system-wide shell startup files.

      su - root -c 'echo "$PATH"'
      grep -sn 'PATH' /root/.bash_profile /root/.bashrc /root/.profile /etc/profile /etc/bashrc /etc/bash.bashrc /etc/environment /etc/profile.d/*.sh
      chown root DIRECTORY
      chmod go-w DIRECTORY
  - id: "CIS-RHEL7-6.2.11-home_dirs_exist"
    name: "home dirs exist: set -o pipefail; pwck -r | grep -P \"^user '(?P\u003cuser\u003e.*)': directory '(?P\u003cdir\u003e.*)' does no…"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.11. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      set -o pipefail; pwck -r | grep -P "^user '(?P<user>.*)': directory '(?P<dir>.*)' does not exist$"
    allow_rc: any
    expect:
      - { rc: "== 2" }
      - { none: "~ ." }
    rationale: &rat-93950236f2 |
      An account whose home directory does not exist gets / as its working directory at login, and some programs then try to create files in unexpected places. Missing home directories also indicate stale accounts. Every account, and in particular every interactive one, should have an existing home directory.
    remediation: &rem-16e7619e2c |
      Create the missing home directory for every account listed by the check with the correct owner and mode, or point the account to an existing directory if it does not need its own home. On several platforms the check also lists system accounts; for those, review whether the account is still needed and prefer usermod -d to an existing directory over creating new directories.

      mkdir -p HOMEDIR
      chown USER: HOMEDIR
      chmod 750 HOMEDIR
      usermod -d EXISTINGDIR USER

      On RHEL 7 the check also requires that home directories of users with UID 1000 to 60000 have mode 750 or 700. On Ubuntu 18.04 every finding of pwck -r fails the check, not only missing home directories.
  - id: "CIS-RHEL7-6.2.12-home_dirs_owned"
    name: "home dirs owned: getent passwd {1000..60000} |  awk -F: '{ print $1  \" \"  $6 }' | while read user dir; do …"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.12. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      getent passwd {1000..60000} |  awk -F: '{ print $1  " "  $6 }' | while read user dir; do if [ $user != 'ftpd' ]; then owner=$(stat -L -c "%U" "$dir"); if [ "$owner" != "$user" ]; then echo "home dir for $user owned by $owner"; fi; fi; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-d265418053 |
      A user should own their home directory. If another account owns it, that account controls the user's files, startup scripts and SSH keys and can manipulate them to run code as the user.
    remediation: &rem-9804bc2d06 |
      Make each listed user the owner of their home directory after confirming that the directory really belongs to that user.

      ls -ld HOMEDIR
      chown USER HOMEDIR
  - id: "CIS-RHEL7-6.2.13-home_dirs_exist"
    name: "home dirs exist: for i in `getent passwd {1000..60000} |  awk '{split($0,a,\":\");print a[6]}'`; do stat -c …"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.13. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      for i in `getent passwd {1000..60000} |  awk '{split($0,a,":");print a[6]}'`; do stat -c "%a %n" $i ; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 7[0,5]0\\s" }
    rationale: *rat-93950236f2
    remediation: *rem-16e7619e2c
  - id: "CIS-RHEL7-6.2.14-dot_file_perms"
    name: "dot file perms: find /home/ -name \"\\.*\" -perm /g+w,o+w"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.14. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      find /home/ -name "\.*" -perm /g+w,o+w
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-b99f900519 |
      Files such as .bashrc, .profile or .ssh are executed or trusted when the user logs in. If group or other users can write to them, they can insert commands that run with the victim's privileges at the next login.
    remediation: &rem-2ca3c0e9f1 |
      Remove write access for group and others from each dot file or directory listed by the check, after confirming that it is not intentionally shared.

      ls -ld FILE
      chmod go-w FILE
  - id: "CIS-RHEL7-6.2.15-dot_forward_files"
    name: "dot forward files: find /home/ -name .forward"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.15. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      find /home/ -name .forward
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-a3dc90d1e5 |
      .forward files in home directories redirect a user's mail or pipe it into arbitrary commands. They can be used to exfiltrate sensitive mail or to run commands whenever mail arrives, outside of central control.
    remediation: &rem-e97a50617e |
      List the .forward files, review each one with its owner, and remove those that are not needed.

      find /home/ -name .forward
      rm /home/USER/.forward

      Arrange mail forwarding centrally, for example through /etc/aliases, if it is required.
  - id: "CIS-RHEL7-6.2.16-dot_netrc_files"
    name: "dot netrc files: find /home/ -name .netrc"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.16. CIS Controls v8: 4.6."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      find /home/ -name .netrc
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-926265401c |
      .netrc files store login names and often plaintext passwords for FTP and other services. Anyone who obtains the file, or the backups containing it, gets these credentials.
    remediation: &rem-d8707d9e7f |
      List the .netrc files, review each one with its owner, and remove those that are not needed.

      find /home/ -name .netrc
      rm /home/USER/.netrc

      Credentials still needed should be moved to a protected credential store.
  - id: "CIS-RHEL7-6.2.17-dot_rhosts_files"
    name: "dot rhosts files: find /home/ -name .rhosts"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 6.2.17. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
    run: |
      find /home/ -name .rhosts
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-d0755f20b1 |
      .rhosts files grant password-less access through the legacy r-services to hosts and users listed in them, trusting only the source address. They allow easy lateral movement and should not exist.
    remediation: &rem-57790ac1dd |
      List the .rhosts files, review each one with its owner, and remove those that are not needed.

      find /home/ -name .rhosts
      rm /home/USER/.rhosts

      Use SSH keys for any required password-less access.
