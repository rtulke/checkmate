  - id: "CIS-RHEL7-3.3.6-net.ipv4.icmp_ignore_bogus_error_respons"
    name: "Kernel parameter net.ipv4.icmp_ignore_bogus_error_responses is 1"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.3.6. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
