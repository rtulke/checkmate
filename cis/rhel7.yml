      - { some: "~ -w /etc/shadow -p wa -k identity" }
      - { some: "~ -w /etc/security/opasswd -p wa -k identity" }
    rationale: &rat-a6ce975e6e |
      The files that define users, groups, passwords and the authentication stack control who can log in and with which privileges. Watching them for writes and attribute changes makes it possible to detect unauthorised account creation or privilege changes. This check verifies the rules loaded in the running kernel.
    remediation: *rem-549e959151
  - id: "CIS-RHEL7-4.1.5-auditd_locale_cnf"
    name: "auditd locale cnf: grep system-locale /etc/audit/rules.d/*.rules"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.5. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep system-locale /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S sethostname -S setdomainname -k system-locale" }
      - { some: "~ -a always,exit -F arch=b32 -S sethostname -S setdomainname -k system-locale" }
      - { some: "~ -w /etc/issue -p wa -k system-locale" }
      - { some: "~ -w /etc/issue\\.net -p wa -k system-locale" }
      - { some: "~ -w /etc/hosts -p wa -k system-locale" }
      - { some: "~ -w /etc/sysconfig/network -p wa -k system-locale" }
    rationale: &rat-eef6ac766d |
      Changes to the host name, domain name, login banners or network configuration can redirect traffic, disguise a system or prepare further attacks. Auditing them makes such modifications traceable. This check verifies that the rules are part of the persistent audit configuration.
    remediation: &rem-71eab26d13 |
      Record changes to the host name, domain name, login banners and network configuration: add the rules for your release to /etc/audit/rules.d/50-system_locale.rules and load them.

      Amazon Linux 2:
      -a always,exit -F arch=b64 -S sethostname,setdomainname -F key=system-locale
      -a always,exit -F arch=b32 -S sethostname,setdomainname -F key=system-locale
      -w /etc/issue -p wa -k system-locale
      -w /etc/issue.net -p wa -k system-locale
      -w /etc/hosts -p wa -k system-locale
      -w /etc/sysconfig/network -p wa -k system-locale

      Amazon Linux 2023:
      -a always,exit -F arch=b64 -S sethostname,setdomainname -F key=system-locale
      -a always,exit -F arch=b32 -S sethostname,setdomainname -F key=system-locale
      -w /etc/issue -p wa -k system-locale
      -w /etc/issue.net -p wa -k system-locale
      -w /etc/hosts -p wa -k system-locale
      -w /etc/sysconfig/network -p wa -k system-locale
      -w /etc/sysconfig/network-scripts -p wa -k system-locale

      RHEL 7:
      -a always,exit -F arch=b64 -S sethostname -S setdomainname -k system-locale
      -a always,exit -F arch=b32 -S sethostname -S setdomainname -k system-locale
      -w /etc/issue -p wa -k system-locale
      -w /etc/issue.net -p wa -k system-locale
      -w /etc/hosts -p wa -k system-locale
      -w /etc/sysconfig/network -p wa -k system-locale

      RHEL 8:
      -a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale
      -a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale
      -w /etc/issue -p wa -k system-locale
      -w /etc/issue.net -p wa -k system-locale
      -w /etc/hosts -p wa -k system-locale
      -w /etc/sysconfig/network -p wa -k system-locale
      -w /etc/sysconfig/network-scripts/ -p wa -k system-locale
      -w /etc/NetworkManager -p wa -k system-locale

      RHEL 9:
      -a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale
      -a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale
      -w /etc/issue -p wa -k system-locale
      -w /etc/issue.net -p wa -k system-locale
      -w /etc/hosts -p wa -k system-locale
      -w /etc/hostname -p wa -k system-locale
      -w /etc/sysconfig/network -p wa -k system-locale
      -w /etc/sysconfig/network-scripts -p wa -k system-locale
      -w /etc/NetworkManager -p wa -k system-locale

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
