  - id: "CIS-RHEL7-2.3.5-openldap-clients"
    name: "Package openldap-clients is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.3.5. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet openldap-clients
    expect: false
    rationale: &rat-ed14c6bd07 |
      The OpenLDAP client tools let users query and modify LDAP directories from the command line, which can be used to enumerate accounts and directory data, sometimes over unencrypted connections. Systems that do not need to administer a directory should not carry them. System authentication via SSSD does not require this package.
    remediation: &rem-1da4e4447e |
      Remove the package openldap-clients, unless the system needs it:

      yum remove openldap-clients
  - id: "CIS-RHEL7-2.3.2-rsh"
    name: "Package rsh is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.3.2. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet rsh
    expect: false
    rationale: &rat-86ba227c7a |
      The rsh client uses the legacy r-protocols, which transmit data, and in some configurations credentials, unencrypted and rely on host-based trust. Removing it prevents its use and the exposure of credentials; SSH is the secure replacement.
    remediation: &rem-857a602086 |
      Remove the package rsh, unless the system needs it:

      yum remove rsh
  - id: "CIS-RHEL7-2.3.3-talk"
    name: "Package talk is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.3.3. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet talk
    expect: false
    rationale: &rat-c19976dd5a |
      The talk client connects to the talk daemon over unencrypted network connections and is an obsolete chat tool. Keeping it installed adds software that nobody needs and that could be abused to reach other hosts, so it should be removed unless there is a documented use.
    remediation: &rem-97ad7e7ce6 |
      Remove the package talk, unless the system needs it:

      yum remove talk
  - id: "CIS-RHEL7-2.3.4-telnet"
    name: "Package telnet is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.3.4. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet telnet
    expect: false
    rationale: &rat-b00660eaf1 |
      The telnet client connects using an unencrypted protocol, so credentials and session data typed into it are exposed on the network. Removing it discourages insecure remote logins; use ssh for administration and tools such as nc or openssl s_client for port testing.
    remediation: &rem-386f22bac7 |
      Remove the package telnet, unless the system needs it:

      yum remove telnet
  - id: "CIS-RHEL7-2.3.1-ypbind"
    name: "Package ypbind is not installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 2.3.1. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
