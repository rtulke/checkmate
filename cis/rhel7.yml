  - id: "CIS-RHEL7-3.1.1-iwconfig"
    name: "iwconfig: iwconfig"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 3.1.1. CIS Controls v8: 4.8."
    tags: [cis, cis-rhel7, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      iwconfig
    expect: { rc: "== 127" }
    rationale: &rat-cdd85758db |
      Servers normally do not need wireless networking. An active wireless interface can connect the system to unauthorized networks or bridge around perimeter controls. The check treats a missing iwconfig command (no wireless tools installed) as an indication that wireless networking is not in use.
    remediation: &rem-b11e434d95 |
      The check passes when the iwconfig command is not available. Remove the wireless tools and turn off any wireless radios.

      yum remove wireless-tools
