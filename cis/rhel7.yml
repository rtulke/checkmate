      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-16b837c7a6 |
      Accurate time is needed to correlate logs across systems, to validate certificates and Kerberos tickets, and for time-based access controls. Configuring chrony with explicit time servers makes sure the clock is synchronised from known, approved sources instead of drifting or following an arbitrary peer.
    remediation: &rem-02262ccc8c |
