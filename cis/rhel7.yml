  - id: "CIS-RHEL7-4.1.14-auditd_admin_scope_cnf"
    name: "auditd admin scope cnf: grep scope /etc/audit/rules.d/*.rules"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.14. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep scope /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /etc/sudoers -p wa -k scope" }
      - { some: "~ -w /etc/sudoers\\.d/ -p wa -k scope" }
    rationale: &rat-7172c39fee |
      Changes to /etc/sudoers and /etc/sudoers.d alter who may run which commands with elevated privileges. Audit rules that record every write or attribute change to these files make unauthorised privilege grants detectable. This check verifies that the rules are part of the persistent audit configuration.
    remediation: &rem-944b9ef9b6 |
      Watch the sudoers configuration for changes: add the rules for your release to /etc/audit/rules.d/50-scope.rules and load them.

      Amazon Linux 2, RHEL 7 and RHEL 8:
      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d/ -p wa -k scope

      Amazon Linux 2023 and RHEL 9:
      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d -p wa -k scope

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
  - id: "CIS-RHEL7-4.1.14-auditd_admin_scope_live"
    name: "auditd admin scope live: auditctl -l | grep scope"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.14. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      auditctl -l | grep scope
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /etc/sudoers -p wa -k scope" }
      - { some: "~ -w /etc/sudoers\\.d -p wa -k scope" }
    rationale: &rat-6dc7f1b6de |
      Changes to /etc/sudoers and /etc/sudoers.d alter who may run which commands with elevated privileges. Audit rules that record every write or attribute change to these files make unauthorised privilege grants detectable. This check verifies that the rules are loaded in the running kernel.
    remediation: *rem-944b9ef9b6
  - id: "CIS-RHEL7-4.1.15-auditd_sudolog_cnf"
    name: "auditd sudolog cnf: grep actions /etc/audit/rules.d/*.rules"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.15. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep actions /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -C euid!=uid -F euid=0 -F auid\u003e=1000 -F auid!=4294967295 -S execve -k actions" }
      - { some: "~ -a always,exit -F arch=b32 -C euid!=uid -F euid=0 -F auid\u003e=1000 -F auid!=4294967295 -S execve -k actions" }
    rationale: &rat-42014c4b48 |
      The sudo log is the record of what was done with elevated privileges, so tampering with it can hide an attacker's actions. Watching the file for writes and attribute changes makes every modification visible in the audit trail. On RHEL 7 and Ubuntu 18.04 this check instead audits commands that regular users run with root privileges, which serves the same purpose of tracing privileged activity.
    remediation: &rem-b50b9df2ba |
      Add the rule for your release to a file in /etc/audit/rules.d/ and load it. On RHEL 9 and 10, sudo must log to that file (Defaults logfile="/var/log/sudo.log" in a file under /etc/sudoers.d/, edited with visudo).

      RHEL 9:
      echo '-w /var/log/sudo.log -p wa -k sudo_log_file' > /etc/audit/rules.d/50-sudo.rules

      RHEL 10:
      echo '-a always,exit -F arch=b64 -S all -F path=/var/log/sudo.log -F perm=wa -F key=sudo_log_file' > /etc/audit/rules.d/50-sudo.rules

      RHEL 7 (privileged commands):
      printf '%s\n' '-a always,exit -F arch=b64 -C euid!=uid -F euid=0 -F auid>=1000 -F auid!=4294967295 -S execve -k actions' '-a always,exit -F arch=b32 -C euid!=uid -F euid=0 -F auid>=1000 -F auid!=4294967295 -S execve -k actions' > /etc/audit/rules.d/50-actions.rules

      Then run augenrules --load. If the audit configuration is immutable (-e 2 in the rules), a reboot is needed before the new rules become active.
  - id: "CIS-RHEL7-4.1.15-auditd_sudolog_live"
    name: "auditd sudolog live: auditctl -l | grep actions"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.15. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      auditctl -l | grep actions
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -F auid\u003e=1000 -F auid!=-1 -F key=actions" }
      - { some: "~ -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -F auid\u003e=1000 -F auid!=-1 -F key=actions" }
    rationale: *rat-42014c4b48
    remediation: *rem-b50b9df2ba
  - id: "CIS-RHEL7-4.1.16-auditd_admin_module_live"
    name: "auditd admin module live: auditctl -l | grep modules"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.16. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      auditctl -l | grep modules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /sbin/insmod -p x -k modules" }
      - { some: "~ -w /sbin/rmmod -p x -k modules" }
      - { some: "~ -w /sbin/modprobe -p x -k modules" }
      - { some: "~ -a always,exit -F arch=b64 -S init_module,delete_module -F key=modules" }
    rationale: &rat-c0d0d59fdd |
      Loading a kernel module runs code with full kernel privileges and is a typical technique for rootkits. Auditing the module system calls and the module tools makes loading and unloading of modules traceable. This check verifies that the rules are loaded in the running kernel.
    remediation: &rem-46f8d5de10 |
      Record the loading and unloading of kernel modules: add the rules for your release to /etc/audit/rules.d/50-kernel_modules.rules and load them.

      Amazon Linux 2 and RHEL 8:
      -a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset -k kernel_modules
      -a always,exit -F arch=b64 -S init_module,finit_module,delete_module,create_module,query_module -F auid>=1000 -F auid!=unset -k kernel_modules
      -a always,exit -F arch=b32 -S init_module,finit_module,delete_module,create_module,query_module -F auid>=1000 -F auid!=unset -k kernel_modules

      Amazon Linux 2023 and RHEL 9:
      -a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset -k kernel_modules
      -a always,exit -F arch=b64 -S init_module,finit_module,delete_module,create_module,query_module -F auid>=1000 -F auid!=unset -k kernel_modules

      RHEL 7:
      -w /sbin/insmod -p x -k modules
      -w /sbin/rmmod -p x -k modules
      -w /sbin/modprobe -p x -k modules
      -a always,exit -F arch=b64 -S init_module -S delete_module -k modules

      augenrules --load

      create_module and query_module exist only on x86_64; leave them out on other architectures. If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
  - id: "CIS-RHEL7-4.1.16-auditd_module_cnf"
    name: "auditd module cnf: grep modules /etc/audit/rules.d/*.rules"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.16. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep modules /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /sbin/insmod -p x -k modules" }
      - { some: "~ -w /sbin/rmmod -p x -k modules" }
      - { some: "~ -w /sbin/modprobe -p x -k modules" }
      - { some: "~ -a always,exit -F arch=b64 -S init_module -S delete_module -k modules" }
    rationale: &rat-c8c09470ae |
      Loading a kernel module runs code with full kernel privileges and is a typical technique for rootkits. Auditing the module system calls and the module tools makes loading and unloading of modules traceable. This check verifies that the rules are part of the persistent audit configuration.
    remediation: *rem-46f8d5de10
  - id: "CIS-RHEL7-4.1.17-auditd_immutable"
    name: "auditd immutable: grep \"-e 2\" /etc/audit/rules.d/*.rules | cut -d \":\" -f2"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.1.17. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep "-e 2" /etc/audit/rules.d/*.rules | cut -d ":" -f2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -e 2" }
    rationale: &rat-3a8280a222 |
      With -e 2 as the last audit rule, the audit configuration becomes immutable until the next reboot. An attacker who gains root can then not silently remove or change audit rules to hide their actions; any change requires a reboot, which is itself noticeable.
    remediation: &rem-b5fe509082 |
      Make the audit configuration immutable by adding -e 2 as the last rule, in a file that sorts after all other rule files, and load the rules.

      echo '-e 2' > /etc/audit/rules.d/99-finalize.rules
      augenrules --load

      After loading, audit rules cannot be changed until the next reboot, so complete the rule set first. If -e 2 is already active, the change takes effect after a reboot.
  - id: "CIS-RHEL7-4.2.1.1-rsyslog"
    name: "Package rsyslog is installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.2.1.1. CIS Controls v8: 8.2."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet rsyslog
    expect: true
    rationale: &rat-ec4e2f2832 |
      rsyslog collects log messages from the kernel, services and applications, writes them to files and can forward them to a central log server. Without an installed, enabled and running syslog daemon, security-relevant events are not recorded in a durable way and incidents cannot be investigated.
    remediation: &rem-9f36b11ab3 |
      Install the package rsyslog:

      yum install rsyslog
  - id: "CIS-RHEL7-4.2.1.1-rsyslog-enabled"
    name: "Service rsyslog is enabled"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.2.1.1. CIS Controls v8: 8.2."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState rsyslog | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-ec4e2f2832
    remediation: &rem-092ce033e4 |
      Enable the service rsyslog:

      systemctl enable rsyslog
  - id: "CIS-RHEL7-4.2.1.1-rsyslog-running"
    name: "Service rsyslog is running"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.2.1.1. CIS Controls v8: 8.2."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState rsyslog | cut -d= -f2
    expect: "== active"
    rationale: *rat-ec4e2f2832
    remediation: &rem-e1b56d94f4 |
      Start the service rsyslog:

      systemctl start rsyslog
  - id: "CIS-RHEL7-4.2.1.3-rsyslog_d_perms"
    name: "rsyslog d perms: grep '\\$FileCreateMode' /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -cv '\\$FileCreateM…"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.2.1.3. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep '\$FileCreateMode' /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -cv '\$FileCreateMode 0[0,6][0,4]0'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ 0" }
      - { none: "~ [1-9]" }
    rationale: &rat-c65c0376cd |
      rsyslog creates new log files with the mode set by $FileCreateMode. Log files often contain sensitive information such as user names, IP addresses or application data, so they must not be created world-readable or writable by others. A mode of 0640 or stricter limits access to root and the log group.
    remediation: &rem-5d9c3dadc2 |
      List all $FileCreateMode directives, change every one that is more permissive to 0640 (or 0600), make sure /etc/rsyslog.conf sets it, and restart rsyslog.

      grep '\$FileCreateMode' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      grep -q '^\$FileCreateMode' /etc/rsyslog.conf || sed -i '1i $FileCreateMode 0640' /etc/rsyslog.conf
      systemctl restart rsyslog

      Existing log files keep their mode; correct them with chmod if needed.
  - id: "CIS-RHEL7-4.2.1.4-etc_rsyslog.conf-attrs"
    name: "/etc/rsyslog.conf: exists"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.2.1.4. CIS Controls v8: 8.2."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/rsyslog.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-863f7605c9 |
      rsyslog only records what its rules tell it to. Rules that route emergency, authentication, mail, news, cron, warning, critical and local facility messages into dedicated files make sure that security-relevant events are recorded and can be found quickly during an investigation. A restrictive file creation mode keeps the resulting log files from being readable by other users.
    remediation: &rem-d45052d244 |
      Create /etc/rsyslog.conf.
  - id: "CIS-RHEL7-4.2.1.4-etc_rsyslog.conf-content"
    name: "/etc/rsyslog.conf has the expected content (16 rules)"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.2.1.4. CIS Controls v8: 8.2."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/rsyslog.conf'
    allow_rc: any
    expect:
      - { some: "~ ^mail.*                                            -/var/log/mail" }
      - { some: "~ ^auth,authpriv.*\\s*                                 /var/log/secure" }
      - { some: "~ ^mail.info\\s*                                      -/var/log/mail.info" }
      - { some: "~ ^mail.warning\\s*                                   -/var/log/mail.warn" }
      - { some: "~ ^mail.err\\s*                                        /var/log/mail.err" }
      - { some: "~ ^news.err\\s*                                       -/var/log/news/news.err" }
      - { some: "~ ^news.crit\\s*                                      -/var/log/news/news.crit" }
      - { some: "~ ^news.notice\\s*                                    -/var/log/news/news.notice" }
      - { some: "~ ^*.=warning;\\*.=err\\s*                             -/var/log/warn" }
      - { some: "~ ^*.crit\\s*                                          /var/log/warn" }
      - { some: "~ ^*.*;mail.none;news.none\\s*                         /var/log/messages" }
      - { some: "~ ^local0,local1.\\*\\s*                               -/var/log/localmessages" }
      - { some: "~ ^local2,local3.\\*\\s*                               -/var/log/localmessages" }
      - { some: "~ ^local4,local5.\\*\\s*                               -/var/log/localmessages" }
      - { some: "~ ^local6,local7.\\*\\s*                               -/var/log/localmessages" }
      - { some: "~ ^*.emerg\\s*                                        :omusrmsg:*" }
    rationale: *rat-863f7605c9
    remediation: &rem-5c574bddff |
      Edit /etc/rsyslog.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^mail.*                                            -/var/log/mail
      - a line matches ^auth,authpriv.*\s*                                 /var/log/secure
      - a line matches ^mail.info\s*                                      -/var/log/mail.info
      - a line matches ^mail.warning\s*                                   -/var/log/mail.warn
      - a line matches ^mail.err\s*                                        /var/log/mail.err
      - a line matches ^news.err\s*                                       -/var/log/news/news.err
      - a line matches ^news.crit\s*                                      -/var/log/news/news.crit
      - a line matches ^news.notice\s*                                    -/var/log/news/news.notice
      - a line matches ^*.=warning;\*.=err\s*                             -/var/log/warn
      - a line matches ^*.crit\s*                                          /var/log/warn
      - a line matches ^*.*;mail.none;news.none\s*                         /var/log/messages
      - a line matches ^local0,local1.\*\s*                               -/var/log/localmessages
      - a line matches ^local2,local3.\*\s*                               -/var/log/localmessages
      - a line matches ^local4,local5.\*\s*                               -/var/log/localmessages
      - a line matches ^local6,local7.\*\s*                               -/var/log/localmessages
      - a line matches ^*.emerg\s*                                        :omusrmsg:*
  - id: "CIS-RHEL7-4.2.1.5-remote_syslog"
    name: "remote syslog: grep \"^*.*[^I][^I]*@\" /etc/rsyslog.conf /etc/rsyslog.d/*.conf"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.2.1.5. CIS Controls v8: 8.9."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "^*.*[^I][^I]*@" /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ \\*\\.\\* @@*." }
    rationale: &rat-de6c4769ee |
      Logs kept only on the host can be deleted or altered by an attacker who has gained control of it, and they are lost if the system fails. Forwarding messages to a central log server keeps an independent copy and allows correlation of events across systems.
    remediation: &rem-e4df08c340 |
      Forward all messages to the central log server over TCP with an rsyslog drop-in file and restart rsyslog. Replace LOGHOST with the name of your log server.

      Amazon Linux 2 and RHEL 9:
      echo '*.* action(type="omfwd" target="LOGHOST" port="514" protocol="tcp" action.resumeRetryCount="100" queue.type="LinkedList" queue.size="1000")' > /etc/rsyslog.d/60-remote.conf

      Amazon Linux 2023 and RHEL 7:
      echo '*.* @@LOGHOST:514' > /etc/rsyslog.d/60-remote.conf

      systemctl restart rsyslog

      On Amazon Linux 2 and RHEL 9 the check compares the target with a fixed example host name (loghost.example.com or logagg.example.com); the policy has to be adapted to the real log server.
  - id: "CIS-RHEL7-4.2.2.1-journald_fwd_syslog"
    name: "journald fwd syslog: grep -Ei \"^ForwardToSyslog\" /etc/systemd/journald.conf"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.2.2.1. CIS Controls v8: 8.9."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^ForwardToSyslog" /etc/systemd/journald.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ /\\^ForwardToSyslog=yes" }
      - { none: "~ ^ForwardToSyslog=[Nn][Oo]" }
    rationale: &rat-6e7a507c5a |
      Forwarding journal messages to rsyslog allows them to be written to traditional log files and sent to a central log server, where they are protected against local tampering and retained according to policy. Without forwarding, messages may exist only in the local journal.
    remediation: &rem-a9300d1d09 |
      Set ForwardToSyslog=yes in /etc/systemd/journald.conf (the check reads only this file, not drop-ins) and restart journald.

      sed -i '/^#\?ForwardToSyslog=/d' /etc/systemd/journald.conf
      echo 'ForwardToSyslog=yes' >> /etc/systemd/journald.conf
      systemctl restart systemd-journald
  - id: "CIS-RHEL7-4.2.2.2-journald_compress"
    name: "journald compress: grep -Ei \"^compress\" /etc/systemd/journald.conf"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.2.2.2. CIS Controls v8: 8.3."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^compress" /etc/systemd/journald.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ Compress=yes" }
      - { none: "~ Compress=[Nn][Oo]" }
    rationale: &rat-3fb044d452 |
      Compressing large journal entries reduces the disk space used by logs. This lowers the risk that the log partition fills up, which could cause loss of log data or affect system stability.
    remediation: &rem-ca63607059 |
      Enable compression in /etc/systemd/journald.conf, the file this check reads, and restart journald.

      sed -i -E 's/^#?\s*Compress=.*/Compress=yes/' /etc/systemd/journald.conf
      grep -q '^Compress=yes' /etc/systemd/journald.conf || echo 'Compress=yes' >> /etc/systemd/journald.conf
      systemctl restart systemd-journald
  - id: "CIS-RHEL7-4.2.2.3-journald_Storage"
    name: "journald Storage: grep -Ei \"^Storage\" /etc/systemd/journald.conf"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.2.2.3. CIS Controls v8: 8.2."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^Storage" /etc/systemd/journald.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ Storage=persistent" }
    rationale: &rat-3af4ba2e2c |
      With volatile or automatic storage the journal may be kept only in memory and is lost on reboot, together with evidence of what happened before a crash or attack. Storage=persistent writes the journal to disk so that it survives reboots.
    remediation: &rem-526da0aab3 |
      Set Storage=persistent in /etc/systemd/journald.conf (the check reads only this file) and restart journald.

      sed -i '/^#\?Storage=/d' /etc/systemd/journald.conf
      echo 'Storage=persistent' >> /etc/systemd/journald.conf
      systemctl restart systemd-journald
  - id: "CIS-RHEL7-4.2.3-logfile_configured"
    name: "logfile configured: find /var/log -type f -perm /g+wx,o+rwx -exec ls -l {} \\;"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 4.2.3. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /var/log -type f -perm /g+wx,o+rwx -exec ls -l {} \;
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-0de5450138 |
      Log files can contain sensitive data and are important evidence after a security incident. If they are writable or readable by unauthorised users, information leaks and logs can be altered or deleted to hide an attack. Access to files under /var/log should be limited to what each kind of log needs.
    remediation: &rem-42ace0ab21 |
      Review every file listed by the check and remove the excess permissions. General and authentication logs should be 0640 or stricter; lastlog, wtmp and btmp may keep group write (0664) for the utmp group.

      chmod u-x,g-wx,o-rwx FILE
      chmod g-x,o-wx /var/log/lastlog /var/log/wtmp /var/log/btmp

      Also adjust the creating service and the create directives in /etc/logrotate.conf and /etc/logrotate.d/, otherwise the permissions come back with the next rotation. On RHEL 7, Ubuntu 18.04 (and for lastlog on Amazon Linux 2023) the check also flags group write on these login records; remove it there with chmod g-w if accepted.
  - id: "CIS-RHEL7-5.1.1-cronie"
    name: "Package cronie is installed"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.1.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet cronie
    expect: true
    rationale: &rat-23118f0b06 |
      cron runs scheduled jobs, including maintenance tasks such as log rotation, updates and integrity checks. The cron daemon has to be installed for these security-relevant jobs to run.
    remediation: &rem-41f6e69f38 |
      Install the package cronie:

      yum install cronie
  - id: "CIS-RHEL7-5.1.1-crond-enabled"
    name: "Service crond is enabled"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.1.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState crond | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-f0cfc625ae |
      cron runs scheduled jobs, including maintenance tasks such as log rotation, updates and integrity checks. The crond service has to be enabled and running so that these jobs are executed.
    remediation: &rem-1303d7c1de |
      Enable the service crond:

      systemctl enable crond
  - id: "CIS-RHEL7-5.1.1-crond-running"
    name: "Service crond is running"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.1.1. CIS Controls v8: 4.1."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState crond | cut -d= -f2
    expect: "== active"
    rationale: *rat-f0cfc625ae
    remediation: &rem-fa8ef47cd9 |
      Start the service crond:

      systemctl start crond
  - id: "CIS-RHEL7-5.1.2-etc_crontab-attrs"
    name: "/etc/crontab: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.1.2. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/crontab'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-00e635bc3b |
      /etc/crontab defines system-wide jobs, many running as root. If unprivileged users could modify it they could run commands as root, and read access reveals what privileged jobs run when. Ownership by root and mode 0600 prevent both.
    remediation: &rem-59fd2ae0c5 |
      Create /etc/crontab if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/crontab'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/crontab'
  - id: "CIS-RHEL7-5.1.7-etc_cron.d-attrs"
    name: "/etc/cron.d: exists, mode 0700 or stricter, owner root, group root"
    description: "CIS Red Hat Enterprise Linux 7 benchmark recommendation 5.1.7. CIS Controls v8: 3.3."
    tags: [cis, cis-rhel7, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/cron.d'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7077)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-5cb8691ff6 |
      Files in /etc/cron.d define system jobs that can run as any user, including root. If unprivileged users could add or change files there they could run commands as root; read access reveals privileged jobs. Ownership by root and mode 0700 prevent this.
    remediation: &rem-33b07f66ca |
      Create /etc/cron.d if it is missing, then set owner root and group root and remove the permissions u-s,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/cron.d'
      chmod u-s,g-rwxs,o-rwx,a-t '/etc/cron.d'
