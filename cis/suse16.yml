  - id: "CIS-SUSE16-6.2.3.4-cis_6_2_3_4_cnf"
    name: "cis 6 2 3 4 cnf: grep -E -- 'time-change|/etc/localtime' /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.4. NIST SP 800-53 Rev. 5: AU-3, CM-6."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
