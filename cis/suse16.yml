  - id: "CIS-SUSE16-6.2.3.3-cis_6_2_3_3_cnf"
    name: "cis 6 2 3 3 cnf: grep -E -- 'sudo_log_file' /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.3."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
