  - id: "CIS-SUSE16-6.2.4.5-cis_6_2_4_5"
    name: "cis 6 2 4 5: find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\) -perm /0137 2\u003e/dev/null"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.4.5. NIST SP 800-53 Rev. 5: AU-9."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
