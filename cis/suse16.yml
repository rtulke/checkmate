  - id: "CIS-SUSE16-6.3.1-aide"
    name: "Package aide is installed"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.3.1. NIST SP 800-53 Rev. 5: AU-2."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
