      grep -E -- 'time-change|/etc/localtime' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -k time-change" }
      - { some: "~ path=\\/etc\\/localtime -F perm=wa -k time-change" }
    rationale: &rat-6fa46b9d8f |
      Changing the system clock can disrupt log correlation, invalidate time-based controls and help an attacker obscure the sequence of events. Auditing time-setting system calls and changes to /etc/localtime records who changed the time and when.
