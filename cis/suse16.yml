  - id: "CIS-SUSE16-4.1.2-cis_4_1_2"
    name: "cis 4 1 2: grep -Pi -- '^\\h*FirewallBackend\\h*=\\h*nftables\\b' /etc/firewalld/firewalld.conf"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 4.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Pi -- '^\h*FirewallBackend\h*=\h*nftables\b' /etc/firewalld/firewalld.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ FirewallBackend\\s*=\\s*nftables" }
    rationale: &rat-0c7b096335 |
      firewalld can use iptables or nftables as its backend. nftables is the maintained packet filtering framework; using it avoids mixing rule sets from different frameworks, which can lead to rules that are not applied as expected.
    remediation: &rem-16bd9f3c3e |
      Set FirewallBackend=nftables in /etc/firewalld/firewalld.conf and restart firewalld.

      [ -f /etc/firewalld/firewalld.conf ] || cp /usr/etc/firewalld/firewalld.conf /etc/firewalld/firewalld.conf
      sed -i -E 's/^[[:space:]]*#?[[:space:]]*FirewallBackend[[:space:]]*=.*/FirewallBackend=nftables/' /etc/firewalld/firewalld.conf
      grep -q '^FirewallBackend=nftables' /etc/firewalld/firewalld.conf || echo 'FirewallBackend=nftables' >> /etc/firewalld/firewalld.conf
      systemctl restart firewalld
