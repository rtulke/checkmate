  - id: "CIS-SUSE16-6.2.3.2-cis_6_2_3_2_cnf"
    name: "cis 6 2 3 2 cnf: grep -E -- 'user_emulation' /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.2. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E -- 'user_emulation' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -C euid!=uid -F auid!=unset -S execve -k user_emulation" }
    rationale: &rat-5c8eb61f92 |
      Commands run with sudo or other set-user-ID mechanisms execute with an effective user ID that differs from the real user. Auditing these executions records who ran which command with elevated or different privileges, which is essential for accountability and for detecting misuse of administrative rights.
    remediation: &rem-a5e1d53136 |
      Add the following rules to a file under /etc/audit/rules.d/ and load them:

      cat >> /etc/audit/rules.d/50-user_emulation.rules <<'EOF'
      -a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation
      -a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation
      EOF
      augenrules --load

      If the audit configuration is immutable (-e 2 in the rules), the new rules only take effect after a reboot.
