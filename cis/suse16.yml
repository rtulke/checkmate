  - id: "CIS-SUSE16-7.1.5-shadow_perms-attrs"
    name: "/etc/shadow: exists, mode 0640 or stricter, owner root, group root or shadow"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 7.1.5. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
