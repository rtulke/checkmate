  - id: "CIS-SUSE16-6.2.4.9-sbin_auditctl_mode-attrs"
    name: "/sbin/auditctl: exists, owner root"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.4.9. NIST SP 800-53 Rev. 5: AU-9."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/sbin/auditctl'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
    expect: empty
    rationale: &rat-792f95fba8 |
