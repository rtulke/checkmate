    name: "cis 6 2 3 21 cnf: grep -E -- 'path=/var/log/lastlog' /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.21. NIST SP 800-53 Rev. 5: AU-12."
