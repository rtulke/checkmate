    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ blacklist firewire-core" }
    rationale: &rat-af51c380b9 |
      FireWire (IEEE 1394) devices can access system memory directly through DMA, which allows attacks such as reading memory or bypassing a lock screen with a malicious device. On systems that do not use FireWire, preventing the firewire-core module from loading removes this attack surface.
    remediation: &rem-116195cd94 |
      Prevent the firewire-core module from loading with a blacklist entry and an install override, then unload it if it is loaded.

      printf 'blacklist firewire-core\ninstall firewire-core /bin/false\n' > /etc/modprobe.d/firewire-core.conf
      modprobe -r firewire-core

      If unloading fails because dependent modules (e.g. firewire_ohci, firewire_sbp2) use it, unload those first or reboot.
