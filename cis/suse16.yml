  - id: "CIS-SUSE16-6.2.1.1-audit_packages"
    name: "Package audit is installed"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12, SI-5."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      rpm -q --quiet audit
    expect: true
    rationale: &rat-7fcda27331 |
      The Linux audit framework records security-relevant events such as logins, privilege use, changes to critical files and administrative actions. Its user-space tools (auditd, auditctl, augenrules) must be installed for the kernel audit events to be collected, written to disk and reviewed.
    remediation: &rem-5230023cc7 |
      Install the package audit:

      zypper install audit
  - id: "CIS-SUSE16-6.2.1.2-auditd_service-enabled"
    name: "Service auditd.service is enabled"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p UnitFileState auditd.service | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-7fd0131f83 |
      The audit daemon writes kernel audit events to disk. If it is not enabled and running, audit rules have no lasting effect and security-relevant activity is not recorded, so incidents cannot be traced and accountability is lost.
    remediation: &rem-549f7ea979 |
      Enable the service auditd.service:

      systemctl enable auditd.service
  - id: "CIS-SUSE16-6.2.1.2-auditd_service-running"
    name: "Service auditd.service is running"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p ActiveState auditd.service | cut -d= -f2
    expect: "== active"
    rationale: *rat-7fd0131f83
    remediation: &rem-2ce522dc81 |
      Start the service auditd.service:

      systemctl start auditd.service
  - id: "CIS-SUSE16-6.2.1.3-audit_default_grub"
    name: "audit default grub: grep audit= /etc/default/grub"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep audit= /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX=.*[\\s\"]audit=1([\\s\"]|$)" }
    rationale: &rat-20bfb20320 |
      Processes started before auditd are not audited unless the kernel enables auditing at boot. With audit=1 on the kernel command line, every process gets an audit context from the start, so early activity, including possible tampering during boot, is recorded. Keeping the parameter in /etc/default/grub ensures it survives configuration regeneration and new kernels.
    remediation: &rem-75b50b20ca |
      Add audit=1 to GRUB_CMDLINE_LINUX in /etc/default/grub and regenerate the GRUB configuration.

      grep -q '^GRUB_CMDLINE_LINUX=.*audit=1' /etc/default/grub || sed -ri 's/^(GRUB_CMDLINE_LINUX="[^"]*)"/\1 audit=1"/' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      The change takes effect after a reboot. Remove conflicting values (e.g. audit=0) from the line if present.
  - id: "CIS-SUSE16-6.2.1.3-audit_running_grub"
    name: "audit running grub: grep audit= /proc/cmdline"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep audit= /proc/cmdline
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^BOOT_IMAGE=.*\\saudit=1" }
      - { none: "~ ^BOOT_IMAGE=.*\\saudit=0" }
    rationale: &rat-89a40fb296 |
      auditd starts relatively late in the boot process. Processes that start before it are not auditable unless the kernel's audit subsystem is enabled from the very beginning. Passing audit=1 on the kernel command line enables auditing at boot so that early activity is recorded as well.
    remediation: &rem-c2d14c1ce9 |
      Add audit=1 to the kernel command line (replacing any audit=0), update the boot loader configuration and reboot.

      sed -i -E '/^GRUB_CMDLINE_LINUX_DEFAULT=/{s/(["[:space:]])audit=[0-9]+/\1/g;s/"$/ audit=1"/}' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg
      reboot

      On systems that boot with grub2-bls or systemd-boot (BLS entries managed by sdbootutil), add audit=1 to /etc/kernel/cmdline instead and run sdbootutil update-all-entries.
  - id: "CIS-SUSE16-6.2.1.4-audit_backlog_default_grub"
    name: "audit backlog default grub: grep audit_backlog /etc/default/grub"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep audit_backlog /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX=.*[\\s\"]audit_backlog_limit=(819[2-9]|8[2-9][0-9]{2}|9[0-9]{3}|[1-9][0-9]{4,}).*" }
    rationale: &rat-6f061b7300 |
      During boot, audit events are queued in the kernel until auditd starts. If the backlog buffer is too small, events are lost or the kernel may react according to the failure setting. A backlog limit of at least 8192 gives enough room to keep early events. Keeping it in /etc/default/grub ensures it persists.
    remediation: &rem-d0361c3a31 |
      Add audit_backlog_limit=8192 to GRUB_CMDLINE_LINUX in /etc/default/grub and regenerate the GRUB configuration.

      grep -q '^GRUB_CMDLINE_LINUX=.*audit_backlog_limit=8192' /etc/default/grub || sed -ri 's/^(GRUB_CMDLINE_LINUX="[^"]*)"/\1 audit_backlog_limit=8192"/' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      The change takes effect after a reboot. Remove conflicting values (e.g. a smaller audit_backlog_limit) from the line if present.
  - id: "CIS-SUSE16-6.2.1.4-audit_backlog_running_grub"
    name: "audit backlog running grub: grep audit_backlog /proc/cmdline"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep audit_backlog /proc/cmdline
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^BOOT_IMAGE=.*\\saudit_backlog_limit=(819[2-9]|8[2-9][0-9]{2}|9[0-9]{3}|[1-9][0-9]{4,}).*" }
    rationale: &rat-70cb88fec3 |
      The kernel buffers audit records in a backlog queue until auditd reads them. If the queue is too small, records are lost during bursts of activity or early in boot before auditd runs. Setting audit_backlog_limit to at least 8192 on the kernel command line gives enough buffer space to avoid losing events.
    remediation: &rem-8bac06e343 |
      Add audit_backlog_limit=8192 (or a larger value) to the kernel command line, update the boot loader configuration and reboot.

      sed -i -E '/^GRUB_CMDLINE_LINUX_DEFAULT=/{s/(["[:space:]])audit_backlog_limit=[0-9]+/\1/g;s/"$/ audit_backlog_limit=8192"/}' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg
      reboot

      On systems that boot with grub2-bls or systemd-boot (BLS entries managed by sdbootutil), add the parameter to /etc/kernel/cmdline instead and run sdbootutil update-all-entries.
  - id: "CIS-SUSE16-6.2.2.1-auditd_log_size"
    name: "auditd log size: grep -Po -- '^\\h*max_log_file\\h*=\\h*\\d+\\b' /etc/audit/auditd.conf"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.2.1. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -Po -- '^\h*max_log_file\h*=\h*\d+\b' /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ max_log_file\\s*=\\s*\\d+" }
    rationale: &rat-1018c9d383 |
      auditd rotates its log when it reaches max_log_file megabytes. Without an explicit value suited to the system's audit volume and retention needs, logs may rotate so often that history is lost or grow so large that they fill the partition.
    remediation: &rem-727d9bf32b |
      Set max_log_file (in megabytes) in /etc/audit/auditd.conf according to site policy, then have auditd reread its configuration.

      grep -q '^\s*max_log_file\s*=' /etc/audit/auditd.conf && sed -ri 's/^\s*max_log_file\s*=.*/max_log_file = 8/' /etc/audit/auditd.conf || echo 'max_log_file = 8' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      8 MB is an example; choose a size that fits the audit volume and the space in /var/log/audit.
  - id: "CIS-SUSE16-6.2.2.2-max_log_action_auditd_conf"
    name: "max log action auditd conf: grep max_log_file_action /etc/audit/auditd.conf"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.2.2. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep max_log_file_action /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ max_log_file_action = keep_logs" }
    rationale: &rat-2c8c6634dd |
      When an audit log reaches its maximum size, the default action rotates and eventually deletes old logs, losing audit history. keep_logs rotates without deleting, so no audit records are discarded automatically. Disk usage must then be monitored, because logs accumulate until archived.
    remediation: &rem-604d9d4f57 |
      Set max_log_file_action to keep_logs in /etc/audit/auditd.conf.

      sed -ri 's/^\s*max_log_file_action\s*=.*/max_log_file_action = keep_logs/' /etc/audit/auditd.conf
      grep -q '^max_log_file_action = ' /etc/audit/auditd.conf || echo 'max_log_file_action = keep_logs' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      SIGHUP makes auditd reread its configuration. Archive old audit logs regularly to avoid filling the disk.
  - id: "CIS-SUSE16-6.2.2.3-logs_full_auditd_conf-attrs"
    name: "/etc/audit/auditd.conf: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.2.3. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-70577f0aa7 |
      If the audit log partition fills up or a disk error occurs, auditing can silently stop and later actions go unrecorded. Halting or switching to single-user mode on a full disk, and at least reporting disk errors, guarantees that the system does not keep running without an audit trail. The trade-off is reduced availability, so audit storage must be sized and monitored.
    remediation: &rem-fdf1d22c95 |
      Create /etc/audit/auditd.conf.
  - id: "CIS-SUSE16-6.2.2.3-logs_full_auditd_conf-content"
    name: "/etc/audit/auditd.conf has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.2.3. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect:
      - { some: "~ ^\\s*disk_full_action\\s*=\\s*(halt|single)" }
      - { some: "~ ^\\s*disk_error_action\\s*=\\s*(syslog|halt|single)" }
    rationale: *rat-70577f0aa7
    remediation: &rem-870b36f8c5 |
      Edit /etc/audit/auditd.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*disk_full_action\s*=\s*(halt|single)
      - a line matches ^\s*disk_error_action\s*=\s*(syslog|halt|single)
  - id: "CIS-SUSE16-6.2.2.4-logs_low_space_auditd_conf"
    name: "logs low space auditd conf: grep space_left_action /etc/audit/auditd.conf"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-8, AU-12, SI-5."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep space_left_action /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ space_left_action\\s*=\\s*(email|exec|single|halt)" }
      - { some: "~ admin_space_left_action\\s*=\\s*(halt|single)" }
    rationale: &rat-35cb8a9517 |
      Low disk space on the audit partition is the warning sign before audit records are lost. Notifying administrators when space_left is reached, and switching to single-user mode or halting at admin_space_left, ensures someone reacts before auditing fails. Halting affects availability, so monitoring and capacity planning matter.
    remediation: &rem-63eb66207c |
      Set space_left_action to email (or exec, single, halt) and admin_space_left_action to single (or halt) in /etc/audit/auditd.conf.

      sed -ri 's/^\s*space_left_action\s*=.*/space_left_action = email/' /etc/audit/auditd.conf
      grep -q '^space_left_action = ' /etc/audit/auditd.conf || echo 'space_left_action = email' >> /etc/audit/auditd.conf
      sed -ri 's/^\s*admin_space_left_action\s*=.*/admin_space_left_action = single/' /etc/audit/auditd.conf
      grep -q '^admin_space_left_action = ' /etc/audit/auditd.conf || echo 'admin_space_left_action = single' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      email needs a working local mail transfer agent and action_mail_acct; SIGHUP makes auditd reread its configuration.
  - id: "CIS-SUSE16-6.2.3.1-cis_6_2_3_1_cnf"
    name: "cis 6 2 3 1 cnf: grep -E -- 'path=/etc/sudoers|dir=/etc/sudoers.d' /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.1. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E -- 'path=/etc/sudoers|dir=/etc/sudoers.d' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ path=\\/etc\\/sudoers -F perm=wa -k scope" }
      - { some: "~ dir=\\/etc\\/sudoers.d\\/? -F perm=wa -k scope" }
    rationale: &rat-c5a129867f |
      The sudoers files define who can run commands with elevated privileges. Unauthorized changes can silently grant root access. Auditing writes and attribute changes to /etc/sudoers and /etc/sudoers.d/ records every change to the privilege scope.
    remediation: &rem-749d7f5a35 |
      Add the following rules to a file under /etc/audit/rules.d/ and load them:

      cat >> /etc/audit/rules.d/50-scope.rules <<'EOF'
      -a always,exit -F path=/etc/sudoers -F perm=wa -k scope
      -a always,exit -F dir=/etc/sudoers.d/ -F perm=wa -k scope
      EOF
      augenrules --load

      If the audit configuration is immutable (-e 2 in the rules), the new rules only take effect after a reboot.
