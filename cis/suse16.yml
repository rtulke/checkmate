  - id: "CIS-SUSE16-6.2.3.28-cis_6_2_3_28_cnf"
    name: "cis 6 2 3 28 cnf: grep -E -- 'path=/usr/sbin/usermod' /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.28. NIST SP 800-53 Rev. 5: AU-9, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E -- 'path=/usr/sbin/usermod' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ path=\\/usr\\/sbin\\/usermod -F perm=x.*-k usermod" }
    rationale: &rat-ee52d22db8 |
      usermod changes account properties such as group membership, shell, home directory or lock state. Logging every execution by regular users makes it possible to trace privilege changes made to accounts. This check looks for the rule in the persistent files under /etc/audit/rules.d/.
    remediation: &rem-ce86321033 |
      Add an execution audit rule for usermod (key usermod) and load it.

      cat > /etc/audit/rules.d/50-usermod.rules <<'EOF'
      -a always,exit -F path=/usr/sbin/usermod -F perm=x -F auid>=1000 -F auid!=unset -k usermod
      EOF
      augenrules --load

      Replace 1000 if UID_MIN on the system differs. If the audit configuration is already immutable (-e 2), the new rules only become active after a reboot.
