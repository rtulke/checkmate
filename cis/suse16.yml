      -a always,exit -F path=/usr/bin/setfacl -F perm=x -F auid>=1000 -F auid!=unset -k perm_chng
      -a always,exit -F path=/usr/bin/chacl -F perm=x -F auid>=1000 -F auid!=unset -k perm_chng
      EOF
      augenrules --load

      Replace 1000 if UID_MIN on the system differs. If the audit configuration is already immutable (-e 2), the new rules only become active after a reboot.
