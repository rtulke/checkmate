    expect:
      - { rc: "== 0" }
      - { some: "~ arch=b64.*mount.*-k mounts" }
    rationale: &rat-2c6563f1b4 |
      Mounting filesystems by regular users can be used to bring in setuid binaries or to copy data to removable media. Auditing the mount system call records who attached which filesystem. This check looks for the rule in the persistent files under /etc/audit/rules.d/.
