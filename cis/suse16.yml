  - id: "CIS-SUSE16-6.2.3.20-cis_6_2_3_20_cnf"
    name: "cis 6 2 3 20 cnf: grep -E -- 'path=/var/run/utmp' /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.20. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E -- 'path=/var/run/utmp' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ path=\\/var\\/run\\/utmp -F perm=wa -k session" }
    rationale: &rat-78f6bb9324 |
      /var/run/utmp records who is currently logged in. Watching writes to it, together with wtmp and btmp, gives an audit trail of session starts and ends and reveals attempts to hide sessions by editing these files. This check looks for the rule in the persistent files under /etc/audit/rules.d/.
    remediation: &rem-8cae0bd7b9 |
