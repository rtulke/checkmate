    rationale: &rat-97b1ca5bf2 |
      TIPC is a protocol for communication within clusters. Its kernel module is rarely needed and has had serious vulnerabilities, including remotely exploitable ones. Preventing the module from loading removes this attack surface on systems that do not use the protocol.
    remediation: &rem-afe7b7bedb |
      Keep the tipc module from being loaded: add an install override and a blacklist entry for it in /etc/modprobe.d/, then unload it if it is currently loaded.

      printf '%s\n' 'install tipc /bin/false' 'blacklist tipc' > /etc/modprobe.d/tipc.conf
      modprobe -r tipc

      modprobe -r reports an error if the module is not loaded, which is harmless; if sockets of this protocol are open, the module stays loaded until reboot.
  - id: "CIS-SUSE16-3.2.5-lsmod_rds"
    name: "lsmod rds: lsmod | grep -i rds"
