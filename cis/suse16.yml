  - id: "CIS-SUSE16-5.4.2.8-invalid_shell_lock_accts"
    name: "invalid shell lock accts: l_valid_shells=\"^($(awk -F\\/ '$NF != \"nologin\" {print}' /etc/shells | sed -rn '/^\\//{s,/,…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.2.8. NIST SP 800-53 Rev. 5: AC-2(5), AC-3, AC-11, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      l_valid_shells="^($(awk -F\/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\\\/,g;p}' | paste -s -d '|' - ))$";
      for user in `awk -v pat="$l_valid_shells" -F: '($1 != "root" && $(NF) !~ pat) {print $1}' /etc/passwd`;
      do passwd -S $user | awk '$2 != "L" {print $1" Not Locked"}' 2>&1 >> test;
      done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
