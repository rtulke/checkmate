  - id: "CIS-SUSE16-6.2.3.9-cis_6_2_3_9_cnf"
    name: "cis 6 2 3 9 cnf: grep -E -- '-k privileged' /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.9. NIST SP 800-53 Rev. 5: AU-9, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E -- '-k privileged' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -k privileged" }
    rationale: &rat-6564421db3 |
      Set-user-ID and set-group-ID programs run with elevated privileges and are a frequent target for privilege escalation. Auditing every execution of these programs by regular users records who used privileged commands and helps detect abuse.
    remediation: &rem-9ba61102c4 |
      Generate an audit rule for every SUID/SGID program on local file systems with the key privileged and load the rules.

      find / -xdev -type f -perm /6000 2>/dev/null | awk '{print "-a always,exit -F path=" $0 " -F perm=x -F auid>=1000 -F auid!=unset -k privileged"}' > /etc/audit/rules.d/50-privileged.rules
      augenrules --load

      find -xdev only covers the root file system; repeat for other local file systems mounted without nosuid and rerun the commands when SUID/SGID programs are added. If the audit configuration is immutable (-e 2 in the rules), the new rules only take effect after a reboot.
  - id: "CIS-SUSE16-6.2.3.9-cis_6_2_3_9_live"
    name: "cis 6 2 3 9 live: auditctl -l | grep -E -- 'key=privileged'"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.9. NIST SP 800-53 Rev. 5: AU-9, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      auditctl -l | grep -E -- 'key=privileged'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ key=privileged" }
    rationale: &rat-1e5ad598aa |
      Setuid and setgid programs run with elevated rights, so every execution by a regular user is a potential privilege escalation path. Auditing their use records who ran which privileged binary and when, which helps to detect misuse and to reconstruct incidents. This check verifies that the rule is actually loaded in the running kernel.
    remediation: &rem-663447a157 |
      Generate an execution audit rule for every setuid/setgid file on the local filesystems, write them to a rules file and load them.

      for m in $(findmnt -n -l -k -o TARGET -t btrfs,ext4,xfs | sort -u); do find "$m" -xdev \( -perm -4000 -o -perm -2000 \) -type f 2>/dev/null; done | sort -u | awk '{print "-a always,exit -F path=" $0 " -F perm=x -F auid>=1000 -F auid!=unset -k privileged"}' > /etc/audit/rules.d/50-privileged.rules
      augenrules --load

      Regenerate the file when packages add or remove setuid/setgid programs. Replace 1000 if UID_MIN on the system differs. If the audit configuration is already immutable (-e 2), the new rules only become active after a reboot.
  - id: "CIS-SUSE16-6.2.3.10-cis_6_2_3_10_cnf"
    name: "cis 6 2 3 10 cnf: grep -E -- 'arch=b64.*-k access' /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.10. NIST SP 800-53 Rev. 5: AU-9, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E -- 'arch=b64.*-k access' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ arch=b64.*-k access" }
    rationale: &rat-d1528e02ba |
      Repeated failed attempts to open or truncate files because of missing permissions often indicate a user or process probing for data it is not allowed to read or change. Logging calls that fail with EACCES or EPERM gives evidence of such attempts. This check looks for the rule in the persistent files under /etc/audit/rules.d/.
    remediation: &rem-0fedd9ba4e |
      Add audit rules for unsuccessful file access attempts (key access) and load them.

      cat > /etc/audit/rules.d/50-access.rules <<'EOF'
      -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access
      -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access
      -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access
      -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access
      EOF
      augenrules --load

      On aarch64 drop the b32 lines and the syscalls creat and open, which do not exist there. Replace 1000 if UID_MIN on the system differs. If the audit configuration is already immutable (-e 2), the new rules only become active after a reboot.
