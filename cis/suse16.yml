      - { none: "~ ^(|\\s+)LEGACY" }
    rationale: &rat-97d5e3099e |
      The system-wide crypto policy defines which protocols, ciphers, key sizes and hash algorithms libraries such as OpenSSL, GnuTLS, NSS and OpenSSH accept. The LEGACY policy re-enables weak algorithms like SHA-1 signatures and small keys that allow downgrade or forgery attacks. Using DEFAULT, FUTURE or FIPS keeps all applications on a consistent, acceptable baseline.
    remediation: &rem-1c3854f2aa |
      Select the DEFAULT system-wide crypto policy (FUTURE or FIPS are also accepted) instead of LEGACY.

      update-crypto-policies --set DEFAULT
      update-crypto-policies --show

      Restart services or reboot so that all applications pick up the new policy. Selecting FIPS here does not by itself enable FIPS mode.
  - id: "CIS-SUSE16-1.6.3-crypto_policies_not_in_sshd"
    name: "crypto policies not in sshd: grep -Pi '^\\h*CRYPTO_POLICY\\h*=' /etc/sysconfig/ssh"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.6.3. NIST SP 800-53 Rev. 5: SC-8, IA-5, AC-17."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Pi '^\h*CRYPTO_POLICY\h*=' /etc/sysconfig/ssh
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-2936e5206f |
      sshd normally follows the system-wide crypto policy. A CRYPTO_POLICY variable in the sshd sysconfig file overrides it and can re-enable weak ciphers, MACs or key exchange methods without this being visible in the central policy. Removing the override keeps SSH aligned with the system policy.
    remediation: &rem-de250f39d3 |
      Comment out any CRYPTO_POLICY line in /etc/sysconfig/ssh and restart sshd.

      sed -ri 's/^\s*(CRYPTO_POLICY\s*=)/# \1/I' /etc/sysconfig/ssh
      systemctl restart sshd
  - id: "CIS-SUSE16-1.6.4-crypto_policies_no_sha1_current-attrs"
    name: "/etc/crypto-policies/state/CURRENT.pol: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.6.4. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/crypto-policies/state/CURRENT.pol'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-16fe00de9a |
      SHA-1 is no longer collision resistant; practical chosen-prefix collisions allow forging signatures and certificates that rely on it. The system-wide crypto policy determines which algorithms TLS, SSH, Kerberos and other libraries accept. A policy that excludes SHA-1 for hashes and signatures prevents applications from negotiating or trusting SHA-1 based signatures.
    remediation: &rem-f645034cb6 |
      Create /etc/crypto-policies/state/CURRENT.pol.
  - id: "CIS-SUSE16-1.6.4-crypto_policies_no_sha1_current-content"
    name: "/etc/crypto-policies/state/CURRENT.pol has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.6.4. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/crypto-policies/state/CURRENT.pol'
    allow_rc: any
    expect:
      - { some: "~ ^sha1_in_certs\\s*=\\s*0" }
      - { none: "~ ^(hash|sign)\\s*=\\s*SHA1" }
    rationale: *rat-16fe00de9a
    remediation: &rem-37a2064b7e |
      Edit /etc/crypto-policies/state/CURRENT.pol so that its lines meet these conditions (regular expressions):

      - a line matches ^sha1_in_certs\s*=\s*0
      - no line matches ^(hash|sign)\s*=\s*SHA1
  - id: "CIS-SUSE16-1.6.5-crypto_policies_no_weakmacs-attrs"
    name: "/etc/crypto-policies/state/CURRENT.pol: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.6.5. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/crypto-policies/state/CURRENT.pol'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-08e25e2adb |
      Message authentication codes protect data in transit against tampering. MACs with short tags, such as 64-bit variants, can be forged with feasible effort and offer too little margin against collision attacks on long-lived connections. Excluding them from the system-wide crypto policy ensures that TLS, SSH and other libraries only negotiate MACs with adequate strength.
    remediation: *rem-f645034cb6
  - id: "CIS-SUSE16-1.6.5-crypto_policies_no_weakmacs-content"
    name: "/etc/crypto-policies/state/CURRENT.pol has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.6.5. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/crypto-policies/state/CURRENT.pol'
    allow_rc: any
    expect: { none: "~ ^mac\\s*=\\s*.*64" }
    rationale: *rat-08e25e2adb
    remediation: &rem-c2b12a0218 |
      Edit /etc/crypto-policies/state/CURRENT.pol so that its lines meet these conditions (regular expressions):

      - no line matches ^mac\s*=\s*.*64
  - id: "CIS-SUSE16-1.6.6-crypto_policies_no_ssh_cbc-attrs"
    name: "/etc/crypto-policies/state/CURRENT.pol: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.6.6. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/crypto-policies/state/CURRENT.pol'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-779955ae7a |
      CBC mode ciphers in SSH have a history of plaintext-recovery attacks and, combined with encrypt-then-MAC, are affected by the Terrapin prefix truncation attack. Modern counter and AEAD modes such as AES-CTR and AES-GCM avoid these problems. Disabling CBC ciphers for SSH in the system-wide crypto policy removes these weaker modes from both the SSH server and clients.
    remediation: *rem-f645034cb6
  - id: "CIS-SUSE16-1.6.6-crypto_policies_no_ssh_cbc-content"
    name: "/etc/crypto-policies/state/CURRENT.pol has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.6.6. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/crypto-policies/state/CURRENT.pol'
    allow_rc: any
    expect: { none: "~ ^cipher@(lib|open)ssh(-server|-client)?\\s*=\\s*([^#\\n\\r]+)?-CBC\\b" }
    rationale: *rat-779955ae7a
    remediation: &rem-250f8e56db |
      Edit /etc/crypto-policies/state/CURRENT.pol so that its lines meet these conditions (regular expressions):

      - no line matches ^cipher@(lib|open)ssh(-server|-client)?\s*=\s*([^#\n\r]+)?-CBC\b
  - id: "CIS-SUSE16-1.6.7-crypto_policies_no_ssh_chacha-poly1305-attrs"
    name: "/etc/crypto-policies/state/CURRENT.pol: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.6.7. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/crypto-policies/state/CURRENT.pol'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-565eae9272 |
      The chacha20-poly1305 cipher in SSH is affected by the Terrapin prefix-truncation attack (CVE-2023-48795) when the peer lacks strict key exchange. Checking the effective crypto policy confirms SSH will not negotiate this cipher.
    remediation: *rem-f645034cb6
  - id: "CIS-SUSE16-1.6.7-crypto_policies_no_ssh_chacha-poly1305-content"
    name: "/etc/crypto-policies/state/CURRENT.pol has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.6.7. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/crypto-policies/state/CURRENT.pol'
    allow_rc: any
    expect: { none: "~ (?i)^cipher@(lib|open)ssh(-server|-client)?\\s*=\\s*([^#\\n\\r]+)?-chacha20-poly1305\\b" }
    rationale: *rat-565eae9272
    remediation: &rem-3fd803df93 |
      Edit /etc/crypto-policies/state/CURRENT.pol so that its lines meet these conditions (regular expressions):

      - no line matches (?i)^cipher@(lib|open)ssh(-server|-client)?\s*=\s*([^#\n\r]+)?-chacha20-poly1305\b
  - id: "CIS-SUSE16-1.7.1-check_motd_files"
    name: "check motd files: grep -Eis \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.7.1. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/motd{,.d/*}
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-06adda8e6a |
      Login messages that reveal the operating system name, release or kernel version help attackers pick matching exploits. The getty escape sequences \m, \r, \s and \v insert exactly this information. Messages should contain only a site-approved notice.
    remediation: &rem-bc36052cf6 |
      Replace the message of the day with a site-approved notice that contains no OS name, version or escape sequences, and review the files in /etc/motd.d.

      echo 'Authorized users only. All activity may be monitored and reported.' > /etc/motd
      grep -Eis "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/motd /etc/motd.d/*

      Edit or remove listed files in /etc/motd.d after review.
  - id: "CIS-SUSE16-1.7.2-check_etc_issue"
    name: "check etc issue: grep -Eis \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.7.2. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/issue
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-6ca01e7c31 |
      /etc/issue is displayed before local logins. If it reveals the operating system name or release, directly or through the getty escape sequences \m, \r, \s and \v, it helps attackers choose matching exploits. It should contain only a site-approved legal notice.
    remediation: &rem-aa884c3ab5 |
      Replace /etc/issue with a site-approved notice that contains no OS name, version or escape sequences.

      echo 'Authorized users only. All activity may be monitored and reported.' > /etc/issue
  - id: "CIS-SUSE16-1.7.3-check_etc_issue_net"
    name: "check etc issue net: grep -Eis \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.7.3. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/issue.net
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-0d6114190c |
      /etc/issue.net is displayed to remote users before login, for example by SSH when a banner is configured. If it reveals the operating system name or release, it gives unauthenticated users information useful for choosing exploits. It should contain only a site-approved legal notice.
    remediation: &rem-16aee316b5 |
      Replace /etc/issue.net with a site-approved notice that contains no OS name, version or escape sequences.

      echo 'Authorized users only. All activity may be monitored and reported.' > /etc/issue.net
  - id: "CIS-SUSE16-1.7.4-pam_motd_configured"
    name: "pam motd configured: grep -Psi '^\\h*session\\h+(required|optional)\\h+pam_motd\\.so\\b.*\\bmotd=' \\"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.7.4. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi '^\h*session\h+(required|optional)\h+pam_motd\.so\b.*\bmotd=' \
        /etc/pam.d/sshd /etc/pam.d/login /etc/pam.d/su /etc/pam.d/gdm-password 2>/dev/null || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-9fac345b06 |
      The message of the day is shown to users at login. If it reveals the operating system name, version or kernel release, it gives attackers information for targeting known vulnerabilities. Login messages should be controlled and should not disclose system details.
    remediation: &rem-2af3e11df9 |
      Remove the motd= option from pam_motd lines in /etc/pam.d/sshd, login, su and gdm-password, so that pam_motd uses the static default message files, or remove pam_motd lines that are not wanted.

      grep -Psi '^\h*session\h+(required|optional)\h+pam_motd\.so\b.*\bmotd=' /etc/pam.d/sshd /etc/pam.d/login /etc/pam.d/su /etc/pam.d/gdm-password
      sed -i -E 's/[[:space:]]motd=[^[:space:]]+//' FILE

      Keep the message files themselves free of operating system and version information.
  - id: "CIS-SUSE16-1.7.5-sshd_banner_content"
    name: "sshd banner content: b=\"$(sshd -T 2\u003e/dev/null | awk '$1 == \"banner\" {print $2}')\""
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.7.5. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      b="$(sshd -T 2>/dev/null | awk '$1 == "banner" {print $2}')"
      [ -n "$b" ] && [ "$b" != none ] && [ -r "$b" ] || exit 0
      grep -Psi "(\\\\v|\\\\r|\\\\m|\\\\s|\b$(grep '^ID=' /etc/os-release | cut -d= -f2 | tr -d '\"')\b)" "$b" || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-d3f6ebea05 |
      A login banner states that access is restricted and monitored, which supports legal action against misuse. It must not reveal the operating system, release, kernel version or architecture: escape sequences such as \m, \r, \s and \v, or the distribution name, give attackers information for picking exploits before they have even authenticated.
    remediation: &rem-143d60166b |
      Replace the content of the file that the SSH Banner option points to with a site-approved warning that contains no escape sequences (\m, \r, \s, \v) and no operating system name.

      sshd -T | grep -i '^banner'
      echo 'Authorized users only. All activity may be monitored and reported.' > /etc/issue.net

      The example assumes the banner file is /etc/issue.net. On Amazon Linux the check also fails when no banner is configured (see the Banner setting).
  - id: "CIS-SUSE16-1.7.6-motd_access_configured"
    name: "motd access configured: find /etc/motd -maxdepth 0 \\( -perm /0133 -o ! -user root -o ! -group root \\) 2\u003e/dev/null…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.7.6. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /etc/motd -maxdepth 0 \( -perm /0133 -o ! -user root -o ! -group root \) 2>/dev/null || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-f59d2a4f4f |
      If /etc/motd is writable by non-root users, they can change the message shown to everyone at login, for example to mislead users or display false instructions. It should be owned by root and not writable by group or others.
    remediation: &rem-d68a2dc13e |
      Set owner and group root and mode 644 (or stricter) on /etc/motd.

      chown root:root /etc/motd
      chmod u-x,go-wx /etc/motd
  - id: "CIS-SUSE16-1.7.7-etc_issue_access-attrs"
    name: "/etc/issue: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.7.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-8411b36f91 |
      /etc/issue is displayed on local consoles before login. Only root should be able to change it; if other users could write to it, they could replace the warning text or insert misleading content shown to everyone who logs in. This check requires owner root, group root and a mode of 644 or stricter.
    remediation: &rem-683e1f474b |
      Create /etc/issue if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue'
  - id: "CIS-SUSE16-1.7.8-etc_issue_net_access-attrs"
    name: "/etc/issue.net: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.7.8. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue.net'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-050875a495 |
      /etc/issue.net is the pre-login banner for network logins. Only root should be able to change it; if other users could write to it, they could replace the warning text or insert misleading content shown to everyone who logs in. This check requires owner root, group root and a mode of 644 or stricter.
    remediation: &rem-eb0556c5ea |
      Create /etc/issue.net if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue.net'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue.net'
  - id: "CIS-SUSE16-1.7.9-sshd_banner_file_perms"
    name: "The SSH banner file is owned by root and not writable by others"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.7.9."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      b=$(sshd -T 2>/dev/null | awk 'tolower($1)=="banner" {print $2}')
      if [ -z "$b" ] || [ "$b" = none ]; then echo "no banner configured"; exit 0; fi
      stat -Lc '%a %U %G' "$b"
    expect: { any: [ { some: "~ ^no banner configured$" }, { some: "~ ^[0-6][04][04] root root$" } ] }
    rationale: &rat-a67d0de981 |
      The SSH banner is displayed to every client before authentication. If non-root users can modify the banner file, they can replace the legal notice or display misleading content. Root ownership and restrictive permissions keep the message under administrative control.
    remediation: &rem-c8f9735cb9 |
      Give the banner file named by the Banner setting of sshd owner and group root, and remove execute permission for the owner and write and execute permission for group and others:

      chown root:root FILE
      chmod u-x,go-wx FILE
  - id: "CIS-SUSE16-2.1.1-autofs_pkg"
    name: "Package autofs is not installed"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 2.1.1. NIST SP 800-53 Rev. 5: SI-3, MP-7."
    tags: [cis, cis-suse16, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet autofs
    expect: false
    rationale: &rat-66cc7255f3 |
