  - id: "CIS-SUSE16-6.2.3.33-cis_6_2_3_33_cnf"
    name: "cis 6 2 3 33 cnf: grep -Ph -- '^\\h*-c\\b' /etc/audit/rules.d/*.rules | tail -1"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.33. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -Ph -- '^\h*-c\b' /etc/audit/rules.d/*.rules | tail -1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^-c" }
    rationale: &rat-07ddefccea |
      By default, loading the audit rules stops at the first rule that fails, for example because a watched path does not exist, and every rule after it is silently missing. With -c the loader continues past such errors, so one broken line does not disable most of the audit coverage. Errors still need attention, because the failed rule itself is not active.
    remediation: &rem-168274ba25 |
      Add the -c option at the start of the audit rules so that loading continues after an error, then reload the rules.

      printf '%s\n' '-c' > /etc/audit/rules.d/01-continue.rules
      augenrules --load

      The line must start with -c without leading whitespace. Check the output of augenrules --load for rules that failed. If the audit configuration is already immutable (-e 2), the new rules only become active after a reboot.
  - id: "CIS-SUSE16-6.2.3.34-cis_6_2_3_34_cnf"
    name: "cis 6 2 3 34 cnf: grep -Ph -- '^\\h*-e\\h+2\\b' /etc/audit/rules.d/*.rules | tail -1"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.34. NIST SP 800-53 Rev. 5: AU-9."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -Ph -- '^\h*-e\h+2\b' /etc/audit/rules.d/*.rules | tail -1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -e\\s*2" }
    rationale: &rat-0969e146a7 |
      Without the immutable flag, anyone with root rights can delete or change audit rules at runtime and then act unobserved. Setting -e 2 locks the loaded rules until the next reboot, so tampering requires a restart, which is itself visible.
    remediation: &rem-744a32f285 |
      Add -e 2 as the last audit rule and load the rules.

      printf '%s\n' '-e 2' > /etc/audit/rules.d/99-finalize.rules
      augenrules --load

      Afterwards every change to the audit rules requires a reboot to take effect. If the rules are already immutable, reboot to activate the file.
  - id: "CIS-SUSE16-6.2.4.1-auditd_log_directory_mode"
    name: "auditd log directory mode: d=\"$(dirname \"$(awk -F= '/^\\s*log_file\\s*/{print $2}' /etc/audit/auditd.conf 2\u003e/dev/null …"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.4.1. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      d="$(dirname "$(awk -F= '/^\s*log_file\s*/{print $2}' /etc/audit/auditd.conf 2>/dev/null | xargs)")"
      [ -d "$d" ] || exit 0
      find "$d" -maxdepth 0 -perm /0027 2>/dev/null || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-02d8d709bb |
      Audit logs contain detailed records of user and system activity and are the main evidence after an incident. If the log directory is writable by the group or accessible by others, unprivileged users can read sensitive records or delete and replace log files. The directory should be 0750 or stricter.
    remediation: &rem-03905717a5 |
      Remove group write and all other permissions from the audit log directory (the directory of log_file in /etc/audit/auditd.conf, by default /var/log/audit).

      chmod g-w,o-rwx /var/log/audit
  - id: "CIS-SUSE16-6.2.4.1-auditd_log_group_configured"
    name: "auditd log group configured: grep -Psi -- '^\\h*log_group\\h*=\\h*(root|adm)\\b' /etc/audit/auditd.conf || true"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.4.1. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -Psi -- '^\h*log_group\h*=\h*(root|adm)\b' /etc/audit/auditd.conf || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^log_group\\s*=\\s*(root|adm)" }
    rationale: &rat-f4b31e264d |
      Audit logs contain detailed records of user and system activity and are the main evidence after an incident. The log_group setting decides which group may read the log files. Restricting it to root or a dedicated administrative group keeps ordinary users from reading audit data.
    remediation: &rem-fd3d22ee34 |
      Set log_group to root in /etc/audit/auditd.conf, align the group of the existing log files and make auditd re-read its configuration.

      sed -ri 's/^\s*log_group\s*=.*/log_group = root/I' /etc/audit/auditd.conf
      grep -q '^log_group' /etc/audit/auditd.conf || echo 'log_group = root' >> /etc/audit/auditd.conf
      chgrp root /var/log/audit/audit.log*
      pkill -HUP -x auditd

      root satisfies both log_group checks (root/adm and root/audit). The line must start at the beginning of the line.
  - id: "CIS-SUSE16-6.2.4.2-cis_6_2_4_2"
    name: "cis 6 2 4 2: [ -f /etc/audit/auditd.conf ] \u0026\u0026 find \"$(dirname \"$(awk -F= '/^\\s*log_file\\s*/{print $2}'…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.4.2. NIST SP 800-53 Rev. 5: AU-9."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      [ -f /etc/audit/auditd.conf ] && find "$(dirname "$(awk -F= '/^\s*log_file\s*/{print $2}' /etc/audit/auditd.conf | xargs)")" -type f -perm /0137 2>/dev/null || true
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .+" }
    rationale: &rat-3ae79d3d48 |
      Audit logs contain detailed records of user and system activity and are the main evidence after an incident. Log files that are writable by the group, readable by others or executable allow unprivileged users to read or falsify records. They should be 0640 or stricter.
    remediation: &rem-d34f88edee |
      Remove excess permissions from the files in the audit log directory (by default /var/log/audit; use the directory of log_file in /etc/audit/auditd.conf if it differs).

      find /var/log/audit -type f -perm /0137 -exec chmod u-x,g-wx,o-rwx {} +
  - id: "CIS-SUSE16-6.2.4.3-cis_6_2_4_3"
    name: "cis 6 2 4 3: [ -f /etc/audit/auditd.conf ] \u0026\u0026 find \"$(dirname \"$(awk -F= '/^\\s*log_file\\s*/{print $2}'…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.4.3. NIST SP 800-53 Rev. 5: AU-9."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      [ -f /etc/audit/auditd.conf ] && find "$(dirname "$(awk -F= '/^\s*log_file\s*/{print $2}' /etc/audit/auditd.conf | xargs)")" -type f ! -user root 2>/dev/null || true
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .+" }
    rationale: &rat-7b57120196 |
      Audit logs contain detailed records of user and system activity and are the main evidence after an incident. Log files owned by another user can be modified or deleted by that user, so all audit log files should be owned by root.
    remediation: &rem-0ea6ab0ea2 |
      Make root the owner of all files in the audit log directory (by default /var/log/audit; use the directory of log_file in /etc/audit/auditd.conf if it differs).

