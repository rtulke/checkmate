  - id: "CIS-SUSE16-6.2.3.30-cis_6_2_3_30_cnf"
    name: "cis 6 2 3 30 cnf: grep -E -- 'arch=b64.*init_module.*-k kernel_modules' /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.30. NIST SP 800-53 Rev. 5: AU-12, CM-7."
