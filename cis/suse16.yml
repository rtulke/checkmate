  - id: "CIS-SUSE16-2.1.21-mta_listening_port25"
    name: "mta listening port25: ss -lntu | grep -E \":25\\s\" | grep -E -v \"\\s(127.0.0.1|\\[?::1\\]?):25\\s\""
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 2.1.21. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      ss -lntu | grep -E ":25\s" | grep -E -v "\s(127.0.0.1|\[?::1\]?):25\s"
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-a12179a4ee |
      A mail transfer agent listening on external interfaces can be abused as a relay, attracts spam and exposes the MTA software to remote attacks. Most hosts only need to send local mail, which works with the MTA bound to the loopback interface. Only dedicated mail servers should accept SMTP connections from the network.
    remediation: &rem-130889d279 |
      Restrict the MTA to the loopback interface, or remove it if no local mail delivery is needed. For Postfix:

      postconf -e 'inet_interfaces = loopback-only'
      systemctl restart postfix
      ss -lntu | grep -E ':25\s'

      For Exim on Debian, set dc_local_interfaces='127.0.0.1 ; ::1' in /etc/exim4/update-exim4.conf.conf, then run update-exim4.conf and systemctl restart exim4.
  - id: "CIS-SUSE16-2.1.21-postfix_inet_interfaces"
    name: "postfix inet interfaces: if command -v postconf \u003e/dev/null 2\u003e\u00261; then postconf inet_interfaces; else echo 'postfix…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 2.1.21. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      if command -v postconf >/dev/null 2>&1; then postconf inet_interfaces; else echo 'postfix not installed'; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)(postfix not installed|^inet_interfaces\\s*=\\s*(loopback-only|localhost|127\\.0\\.0\\.1)\\s*$)" }
    rationale: &rat-30635944f9 |
      A mail transfer agent that listens on all network interfaces can be probed and attacked from the network, and a misconfiguration may turn it into an open relay. Systems that only send local mail should restrict the MTA to the loopback interface.
    remediation: &rem-312a3bf0c9 |
      Restrict Postfix to the loopback interface and restart it.

      postconf -e 'inet_interfaces = loopback-only'
      systemctl restart postfix

      Do not apply this on systems that receive mail from the network; the check also passes if Postfix is not installed.
