    run: |
      b=$(sshd -T 2>/dev/null | awk 'tolower($1)=="banner" {print $2}')
      if [ -z "$b" ] || [ "$b" = none ]; then echo "no banner configured"; exit 0; fi
      stat -Lc '%a %U %G' "$b"
    expect: { any: [ { some: "~ ^no banner configured$" }, { some: "~ ^[0-6][04][04] root root$" } ] }
    remediation: |
      Give the banner file named by the Banner setting of sshd owner and group root, and remove execute permission for the owner and write and execute permission for group and others:

