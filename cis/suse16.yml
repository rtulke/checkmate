  - id: "CIS-SUSE16-6.2.3.16-cis_6_2_3_16_cnf"
    name: "cis 6 2 3 16 cnf: grep -E -- 'arch=b64.*chmod.*-k perm_mod' /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.16. NIST SP 800-53 Rev. 5: AU-9, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E -- 'arch=b64.*chmod.*-k perm_mod' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ arch=b64.*chmod.*-k perm_mod" }
    rationale: &rat-caa78061e3 |
      Changing file permissions (chmod family) can expose protected data or prepare privilege escalation, for example by making a file world-writable or handing it to another user. Recording these system calls by regular users makes such changes traceable. This check looks for the rule in the persistent files under /etc/audit/rules.d/.
    remediation: &rem-1a2816fb41 |
      Add audit rules for permission, ownership and extended attribute changes (key perm_mod) and load them.

      cat > /etc/audit/rules.d/50-perm_mod.rules <<'EOF'
      -a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b64 -S chown,fchown,lchown,fchownat -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b32 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b32 -S chown,fchown,lchown,fchownat -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b32 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -k perm_mod
      EOF
      augenrules --load

      On aarch64 drop the b32 lines and the syscalls chmod, chown and lchown, which do not exist there (fchmodat and fchownat still match the check). Replace 1000 if UID_MIN on the system differs. If the audit configuration is already immutable (-e 2), the new rules only become active after a reboot.
