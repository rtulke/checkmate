  - id: "CIS-SUSE16-1.2.1.1-gpg_keys"
    name: "gpg keys: rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --\u003e %{summary}"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.2.1.1. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --> %{summary}
      '
    expect: { rc: "== 0" }
    rationale: &rat-4781e33879 |
      Package signatures are only meaningful if the keys used to verify them are the right ones. An unexpected or attacker-supplied key in the package manager's keyring lets packages signed with it install without warning. Reviewing the imported keys ensures that only vendor and approved repository keys are trusted.
    remediation: &rem-4f17d36d12 |
      Import the SUSE package signing keys and remove any key that does not belong to an approved repository. List the installed keys first.

      rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --> %{summary}\n'
      rpm --import /usr/lib/rpm/gnupg/keys/KEYFILE
      rpm -e gpg-pubkey-VERSION-RELEASE

      zypper refresh also offers to import the keys of newly added repositories after showing their fingerprints.
  - id: "CIS-SUSE16-1.2.1.2-gpg_check_global"
    name: "gpg check global: grep -Pis -- '^\\h*gpgcheck\\h*=\\h*(0|false|no|off)\\b' /etc/zypp/zypp.conf /usr/etc/zypp/zy…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.2.1.2. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      grep -Pis -- '^\h*gpgcheck\h*=\h*(0|false|no|off)\b' /etc/zypp/zypp.conf /usr/etc/zypp/zypp.conf /etc/zypp/zypp.conf.d/*.conf; grep -Pris -- '^\h*gpgcheck\h*=\h*(0|[2-9]|[1-9][0-9]+|false|no|off)\b' /etc/zypp/repos.d/; true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-b9d4a35c8e |
      Package signature verification ensures that only packages signed by a trusted vendor key are installed. With gpgcheck disabled, a compromised mirror, a man-in-the-middle on the download path or a tampered local file could deliver modified packages that run code as root during installation. Enabling it globally covers every repository that does not explicitly override it.
    remediation: &rem-3e8f836e8d |
      Make sure signature checking is not disabled in the zypper configuration or in any repository definition: set gpgcheck to on globally and to 1 in repository files.

      grep -Pris '^\h*gpgcheck\h*=' /etc/zypp/zypp.conf /usr/etc/zypp/zypp.conf /etc/zypp/zypp.conf.d/ /etc/zypp/repos.d/
      sed -ri 's/^\s*gpgcheck\s*=.*/gpgcheck = on/' /etc/zypp/zypp.conf
      sed -ri 's/^\s*gpgcheck\s*=.*/gpgcheck=1/' /etc/zypp/repos.d/*.repo

      Correct any disabling line found in /etc/zypp/zypp.conf.d/ the same way.
  - id: "CIS-SUSE16-1.2.1.3-repo_gpgcheck_global"
    name: "repo gpgcheck global: grep -E \"^repo_gpgcheck\" /etc/zypp/zypp.conf /etc/zypp/zypp.conf.d/*"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.2.1.3. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-suse16, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    timeout: 120000ms
    run: |
      grep -E "^repo_gpgcheck" /etc/zypp/zypp.conf /etc/zypp/zypp.conf.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^.*:repo_gpgcheck\\s*=\\s*(1|on)" }
      - { none: "~ ^.*:repo_gpgcheck\\s*=\\s*(0|false|off|no)" }
    rationale: &rat-a13f5fa04a |
      Package signatures protect individual packages, but not the repository metadata that tells the package manager which versions exist. Without metadata signature checking an attacker controlling a mirror or the network path can withhold security updates or offer outdated vulnerable packages that are still validly signed. Verifying metadata signatures closes that gap. Some repositories do not publish signed metadata, so enabling it globally may require per-repository exceptions.
    remediation: &rem-191f53a634 |
      Enable repository metadata signature checking in the [main] section of /etc/zypp/zypp.conf (on SUSE 16, copy /usr/etc/zypp/zypp.conf to /etc/zypp/zypp.conf first if it does not exist):

      [ -e /etc/zypp/zypp.conf ] || cp /usr/etc/zypp/zypp.conf /etc/zypp/zypp.conf
      sed -i -E '/^\s*repo_gpgcheck\s*=/d' /etc/zypp/zypp.conf
      sed -i '/^\[main\]/a repo_gpgcheck = on' /etc/zypp/zypp.conf
      zypper refresh

      Remove conflicting repo_gpgcheck settings from /etc/zypp/zypp.conf.d/ if that directory exists.
  - id: "CIS-SUSE16-1.2.1.3-repo_gpgcheck_repo"
    name: "repo gpgcheck repo: if [ `find /etc/zypp/repos.d/ -type f -exec grep 'repo_gpgcheck*' {} \\; | grep -v '1|on|t…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.2.1.3. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-suse16, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    timeout: 120000ms
    run: |
      if [ `find /etc/zypp/repos.d/ -type f -exec grep 'repo_gpgcheck*' {} \; | grep -v '1|on|true' | wc -l` -ne 0 ]; then echo FAIL; else echo OK; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK" }
    rationale: &rat-ede943bafc |
      Besides individual packages, the repository metadata (package lists and checksums) can be signed. Verifying it protects against an attacker who serves stale or manipulated metadata, for example to withhold security updates. Repositories should not explicitly disable this verification; enabling it requires that the repository publishes signed metadata.
    remediation: &rem-5189c1ff84 |
      Remove explicit repo_gpgcheck settings from the listed FILE; zypper then verifies signed repository metadata by default.

      grep -Rn 'repo_gpgcheck' /etc/zypp/repos.d/
      sed -i '/^\s*repo_gpgcheck\s*=/d' FILE
      zypper refresh

      On SUSE 16 the check flags every repo_gpgcheck line, even repo_gpgcheck=1, so delete the line instead of changing its value.
  - id: "CIS-SUSE16-1.2.1.4-repos_configured"
    name: "repos configured: zypper repos"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.2.1.4. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      zypper repos
    expect: { rc: "== 0" }
    rationale: &rat-70d1c99f9e |
      Systems should get packages and security fixes only from known, approved repositories. A missing or broken repository configuration prevents patching, while unknown repositories can introduce untrusted software. Depending on the platform the check verifies that the repository list can be read, that expected repositories are present, or asks for a manual review.
    remediation: &rem-f7e219a301 |
      zypper repos only succeeds when repositories are defined. Register the system (SCC, RMT or SUSE Manager) or add the approved repositories.

      zypper repos
      SUSEConnect -r REGCODE
      zypper addrepo URL ALIAS
  - id: "CIS-SUSE16-1.2.1.5-zypp_solver_only_requires-attrs"
    name: "/etc/zypp/zypp.conf: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.2.1.5. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/zypp/zypp.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d756857294 |
      By default the package solver may also install recommended packages, which pulls in software that was never explicitly requested. Restricting the solver to hard dependencies keeps the installed package set minimal, which reduces the attack surface and the number of components to patch.
    remediation: &rem-e485f39ce0 |
      Create /etc/zypp/zypp.conf.
  - id: "CIS-SUSE16-1.2.1.5-zypp_solver_only_requires-content"
    name: "/etc/zypp/zypp.conf has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.2.1.5. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/zypp/zypp.conf'
    allow_rc: any
    expect: { some: "~ ^\\s*solver\\.onlyRequires\\s*=\\s*true" }
    rationale: *rat-d756857294
    remediation: &rem-203c286ae4 |
      Edit /etc/zypp/zypp.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*solver\.onlyRequires\s*=\s*true
  - id: "CIS-SUSE16-1.2.2.1-package-updates"
    name: "package updates: zypper lu"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.2.2.1. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      zypper lu
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ No updates found\\." }
    rationale: &rat-424a5d1342 |
      Most successful attacks exploit known vulnerabilities for which updates already exist. Installing available updates promptly closes these holes. The check passes only when zypper reports no pending updates.
    remediation: &rem-f639d73e83 |
      Refresh the repositories and install all available updates.

      zypper refresh
      zypper update
      zypper lu

      Test updates according to change management first. A reboot is needed if the kernel or core libraries were updated.
  - id: "CIS-SUSE16-1.3.1.1-libselinux1_installed"
    name: "Package libselinux1 is installed"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.1. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet libselinux1
    expect: true
    rationale: &rat-b532dbc094 |
      SELinux enforces mandatory access control that confines services even when they run as root. The libselinux library provides the interfaces programs and tools use to work with SELinux labels and policy; without it, SELinux cannot be managed or used.
    remediation: &rem-cf06f21c0c |
      Install the package libselinux1:

      zypper install libselinux1
  - id: "CIS-SUSE16-1.3.1.2-grub_app_armor-attrs"
    name: "/etc/default/grub: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ecf938aaab |
      A mandatory access control module must be activated on the kernel command line so that it is active from early boot for every boot entry. Setting the parameters in /etc/default/grub makes this persistent across GRUB regenerations. On SUSE 16 the check expects SELinux (selinux=1 security=selinux) instead of AppArmor.
    remediation: &rem-2d1523887c |
      Create /etc/default/grub.
  - id: "CIS-SUSE16-1.3.1.2-grub_app_armor-content"
    name: "/etc/default/grub has the expected content (3 rules)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect:
      - { some: "~ ^GRUB_CMDLINE_LINUX.*selinux=1" }
      - { some: "~ ^GRUB_CMDLINE_LINUX.*security=selinux" }
      - { none: "~ selinux=0" }
    rationale: *rat-ecf938aaab
    remediation: &rem-a8bb0cea96 |
      Edit /etc/default/grub so that its lines meet these conditions (regular expressions):

      - a line matches ^GRUB_CMDLINE_LINUX.*selinux=1
      - a line matches ^GRUB_CMDLINE_LINUX.*security=selinux
      - no line matches selinux=0
  - id: "CIS-SUSE16-1.3.1.2-selinux_boot_grub-attrs"
    name: "/etc/default/grub: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-7c9adf7606 |
      SELinux can be disabled or replaced by another security module through kernel parameters. Setting selinux=1 security=selinux in the boot loader defaults, and making sure selinux=0 is absent, ensures SELinux is the active security module on every boot.
    remediation: *rem-2d1523887c
  - id: "CIS-SUSE16-1.3.1.2-selinux_boot_grub-content"
    name: "/etc/default/grub has the expected content (3 rules)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect:
      - { some: "~ selinux=1" }
      - { some: "~ security=selinux" }
      - { none: "~ selinux=0" }
    rationale: *rat-7c9adf7606
    remediation: &rem-73d3191e9e |
      Edit /etc/default/grub so that its lines meet these conditions (regular expressions):

      - a line matches selinux=1
      - a line matches security=selinux
      - no line matches selinux=0
  - id: "CIS-SUSE16-1.3.1.3-selinux_targeted-attrs"
    name: "/etc/selinux/config: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.3. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/selinux/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-75cbc7909d |
      SELinux needs a loaded policy to enforce anything. The targeted policy confines the most exposed services while leaving ordinary user sessions largely unconfined; MLS adds multi-level security. Configuring one of these supported policies makes sure the system boots with a maintained policy.
    remediation: &rem-3c32e23d79 |
      Create /etc/selinux/config.
  - id: "CIS-SUSE16-1.3.1.3-selinux_targeted-content"
    name: "/etc/selinux/config has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.3. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/selinux/config'
    allow_rc: any
    expect:
      - { some: "~ (?i)SELINUXTYPE=(targeted|mls)" }
      - { none: "~ (?i)SELINUXTYPE=(disabled|off|false)" }
    rationale: *rat-75cbc7909d
    remediation: &rem-a6eac24a6a |
      Edit /etc/selinux/config so that its lines meet these conditions (regular expressions):

      - a line matches (?i)SELINUXTYPE=(targeted|mls)
      - no line matches (?i)SELINUXTYPE=(disabled|off|false)
  - id: "CIS-SUSE16-1.3.1.4-mcstrans"
    name: "Package mcstrans is not installed"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.4. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet mcstrans
    expect: false
    rationale: &rat-f702f7174c |
      mcstrans translates SELinux MCS/MLS security levels into readable names. Most systems do not need it, and like any unnecessary daemon it adds privileged code and attack surface. Removing it keeps the system minimal.
    remediation: &rem-ce219a26c7 |
      Remove the package mcstrans, unless the system needs it:

      zypper remove mcstrans
  - id: "CIS-SUSE16-1.3.1.5-selinux_config_not_disabled-attrs"
    name: "/etc/selinux/config: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.5. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/selinux/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d4d8abc4ff |
      If SELinux is disabled in its configuration file, it is not initialised at boot and no file labels are maintained, so re-enabling it later requires a full relabel. Keeping it in enforcing or permissive mode preserves labels and allows protections to be enforced.
    remediation: *rem-3c32e23d79
  - id: "CIS-SUSE16-1.3.1.5-selinux_config_not_disabled-content"
    name: "/etc/selinux/config has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.5. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/selinux/config'
    allow_rc: any
    expect:
      - { some: "~ ^SELINUX=(enforcing|permissive)" }
      - { none: "~ ^SELINUX=disabled" }
    rationale: *rat-d4d8abc4ff
    remediation: &rem-227f8aa42b |
      Edit /etc/selinux/config so that its lines meet these conditions (regular expressions):

      - a line matches ^SELINUX=(enforcing|permissive)
      - no line matches ^SELINUX=disabled
  - id: "CIS-SUSE16-1.3.1.5-selinux_running_not_disabled"
    name: "selinux running not disabled: getenforce"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.5. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      getenforce
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(Enforcing|Permissive)$" }
    rationale: &rat-e39299edbe |
      SELinux confines processes according to policy and limits the damage a compromised service can do, even as root. If it is disabled at runtime, none of these controls apply. Enforcing or at least permissive mode keeps the policy loaded and file labels maintained.
    remediation: &rem-21b4c3ff66 |
      Enable SELinux in the boot parameters and in /etc/selinux/config, schedule a relabel and reboot.

      zypper install selinux-policy-targeted
      sed -i -E 's/^SELINUX=.*/SELINUX=permissive/' /etc/selinux/config
      sed -i -E '/^GRUB_CMDLINE_LINUX_DEFAULT=/{s/(["[:space:]])(selinux|security)=[^ "]*/\1/g;s/"$/ selinux=1 security=selinux"/}' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg
      touch /.autorelabel
      reboot

      Starting in permissive mode lets you review denials (ausearch -m avc) before switching to enforcing. On BLS-based boot setups, set the kernel parameters in /etc/kernel/cmdline and run sdbootutil update-all-entries.
  - id: "CIS-SUSE16-1.3.1.6-selinux_config_enforcing-attrs"
    name: "/etc/selinux/config: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.6. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/selinux/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-3f8c235be5 |
      In enforcing mode SELinux actually blocks actions that its policy does not allow, confining compromised services, while permissive mode only logs violations. Configuring enforcing mode in /etc/selinux/config ensures the protection is active after every boot. Custom applications may need policy adjustments, which can be prepared by reviewing denials in permissive mode first.
    remediation: *rem-3c32e23d79
  - id: "CIS-SUSE16-1.3.1.6-selinux_config_enforcing-content"
    name: "/etc/selinux/config has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.6. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/selinux/config'
    allow_rc: any
    expect: { some: "~ ^SELINUX=enforcing" }
    rationale: *rat-3f8c235be5
    remediation: &rem-9c17d23c97 |
      Edit /etc/selinux/config so that its lines meet these conditions (regular expressions):

      - a line matches ^SELINUX=enforcing
  - id: "CIS-SUSE16-1.3.1.6-selinux_running_enforcing"
    name: "selinux running enforcing: getenforce"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.6. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      getenforce
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Enforcing$" }
    rationale: &rat-b377b675df |
      In permissive mode SELinux only logs policy violations without blocking them, so a compromised service is not actually confined. Enforcing mode applies the policy and denies access that it does not allow.
    remediation: &rem-98c0d26015 |
      Switch SELinux to enforcing mode immediately and persistently.

      setenforce 1
      sed -i -E 's/^SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config

      Check for denials first (ausearch -m avc -ts recent) and fix labels or policy so that services keep working. If getenforce reports Disabled, SELinux must first be enabled at boot and the file system relabelled.
  - id: "CIS-SUSE16-1.3.1.7-setroubleshoot"
    name: "Package setroubleshoot is not installed"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.7. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet setroubleshoot
    expect: false
    rationale: &rat-d9369ee205 |
      setroubleshoot analyses SELinux denials and presents them to users, mainly on desktops. On servers it is not needed, runs additional privileged code and can expose information about denials to unprivileged users. Denials remain available in the audit log without it.
    remediation: &rem-7980b3cd4b |
      Remove the package setroubleshoot, unless the system needs it:

      zypper remove setroubleshoot
  - id: "CIS-SUSE16-1.3.1.8-selinux_no_unconfined_services"
    name: "selinux no unconfined services: ps -eZ | grep unconfined_service_t"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.3.1.8. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      ps -eZ | grep unconfined_service_t
    expect: { rc: "== 1" }
    rationale: &rat-e519bba1c3 |
      Services running in the unconfined_service_t domain are not restricted by SELinux policy, so a compromise of such a service gives the attacker the full rights of its user. Every service should run in a confined domain defined by policy.
    remediation: &rem-4bbcd07caf |
      Identify the processes running as unconfined_service_t and give them a confined domain: restore the default label of the executable, install a policy module for the service, or create one.

      ps -eZ | grep unconfined_service_t
      restorecon -v EXECUTABLE
      systemctl restart SERVICE

      Services usually end up unconfined because their binary is installed in a non-standard location or no policy exists for them; this needs individual review.
  - id: "CIS-SUSE16-1.4.2-grub_bootloaders_perms-attrs"
    name: "/boot/grub2/grub.cfg: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.4.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/boot/grub2/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-186ae958c2 |
      grub.cfg describes how the system boots, including kernel parameters and, if a boot password is set, its hash. Restricting it to root with mode 0600 or stricter prevents users from reading these details or altering the boot configuration.
    remediation: &rem-9e6da05721 |
      Create /boot/grub2/grub.cfg if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/boot/grub2/grub.cfg'
      chmod u-xs,g-rwxs,o-rwx,a-t '/boot/grub2/grub.cfg'
  - id: "CIS-SUSE16-1.5.1-fs_protected_hardlinks"
    name: "Kernel parameter fs.protected_hardlinks is 1"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n fs.protected_hardlinks
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-e66f773a8f |
      Without hard link protection, users can create hard links to files they do not own, for example to set-user-ID programs or files in world-writable directories, and exploit time-of-check to time-of-use races in privileged programs. Setting fs.protected_hardlinks to 1 only allows links to files the user owns or can read and write.
    remediation: &rem-dfb7dcb76a |
      Set the kernel parameter fs.protected_hardlinks to 1, now and at boot:

      sysctl -w 'fs.protected_hardlinks=1'
      printf '%s\n' 'fs.protected_hardlinks = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of fs.protected_hardlinks from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-SUSE16-1.5.1-fs_protected_hardlinks_conf"
    name: "fs protected hardlinks conf: grep \"fs.protected_hardlinks\" /etc/sysctl.conf /etc/sysctl.d/* 2\u003e/dev/null"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "fs.protected_hardlinks" /etc/sysctl.conf /etc/sysctl.d/* 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:fs.protected_hardlinks\\s*=\\s*1" }
    rationale: &rat-7590b85850 |
      Without hard link protection, users can create hard links to files they do not own and exploit race conditions in privileged programs. The setting must also be stored persistently so that fs.protected_hardlinks = 1 is applied again after every reboot.
    remediation: &rem-e014696463 |
      Set fs.protected_hardlinks = 1 in a file under /etc/sysctl.d/ and apply it. Remove or correct other settings of this parameter in /etc/sysctl.conf and /etc/sysctl.d/.

      printf '%s\n' 'fs.protected_hardlinks = 1' >> /etc/sysctl.d/60-fs_sysctl.conf
      sysctl -p /etc/sysctl.d/60-fs_sysctl.conf
  - id: "CIS-SUSE16-1.5.2-fs_protected_symlinks"
    name: "Kernel parameter fs.protected_symlinks is 1"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      sysctl -n fs.protected_symlinks
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-b0d754170a |
      In world-writable sticky directories such as /tmp, an attacker can plant a symbolic link that a privileged process later follows, redirecting writes to sensitive files. fs.protected_symlinks = 1 only lets a symlink there be followed when the follower or the directory owner owns it.
    remediation: &rem-1878740bd3 |
      Set the kernel parameter fs.protected_symlinks to 1, now and at boot:

      sysctl -w 'fs.protected_symlinks=1'
      printf '%s\n' 'fs.protected_symlinks = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of fs.protected_symlinks from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-SUSE16-1.5.2-fs_protected_symlinks_conf"
    name: "fs protected symlinks conf: grep \"fs.protected_symlinks\" /etc/sysctl.conf /etc/sysctl.d/* 2\u003e/dev/null"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep "fs.protected_symlinks" /etc/sysctl.conf /etc/sysctl.d/* 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:fs.protected_symlinks\\s*=\\s*1" }
    rationale: &rat-d05ff1918f |
      Symlink attacks in world-writable sticky directories can redirect privileged processes to sensitive files. Storing fs.protected_symlinks = 1 persistently ensures this protection is active after every reboot, not just until the next restart.
    remediation: &rem-1d93f68689 |
      Set fs.protected_symlinks = 1 in a file under /etc/sysctl.d/ and apply it. Remove or correct other settings of this parameter in /etc/sysctl.conf and /etc/sysctl.d/.

      printf '%s\n' 'fs.protected_symlinks = 1' >> /etc/sysctl.d/60-fs_sysctl.conf
      sysctl -p /etc/sysctl.d/60-fs_sysctl.conf
  - id: "CIS-SUSE16-1.5.3-fs_suid_dumpable"
    name: "Kernel parameter fs.suid_dumpable is 0"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.3. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n fs.suid_dumpable
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-b19e6b5b75 |
      Core dumps of setuid programs can contain sensitive data from a privileged process, such as password hashes or keys. With fs.suid_dumpable set to 0, the kernel does not write core dumps for processes that changed privileges.
    remediation: &rem-789aaadb7b |
      Set the kernel parameter fs.suid_dumpable to 0, now and at boot:

      sysctl -w 'fs.suid_dumpable=0'
      printf '%s\n' 'fs.suid_dumpable = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of fs.suid_dumpable from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-SUSE16-1.5.3-fs_suid_dumpable_conf"
    name: "fs suid dumpable conf: grep \"fs.suid_dumpable\" /etc/sysctl.conf /etc/sysctl.d/* 2\u003e/dev/null"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.3. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "fs.suid_dumpable" /etc/sysctl.conf /etc/sysctl.d/* 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:fs.suid_dumpable\\s*=\\s*0" }
      - { none: "~ .*:fs.suid_dumpable\\s*=\\s*[1-9]" }
    rationale: &rat-14db574821 |
      Core dumps of set-user-ID programs can contain privileged data such as password hashes or keys that the invoking user should not see. fs.suid_dumpable = 0 prevents such programs from dumping core; storing it persistently keeps the setting after reboots.
    remediation: &rem-a4da3fa274 |
      Set fs.suid_dumpable = 0 in a file under /etc/sysctl.d/ and apply it. Remove or correct any other setting of fs.suid_dumpable with a non-zero value in /etc/sysctl.conf and /etc/sysctl.d/, because the check fails if one exists.

      printf '%s\n' 'fs.suid_dumpable = 0' >> /etc/sysctl.d/60-fs_sysctl.conf
      sysctl -p /etc/sysctl.d/60-fs_sysctl.conf
  - id: "CIS-SUSE16-1.5.4-kernel_dmesg_restrict_running"
    name: "Kernel parameter kernel.dmesg_restrict is 1"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.4. NIST SP 800-53 Rev. 5: SC-2, SC-4."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.dmesg_restrict
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-df4b27d421 |
      The kernel log can reveal memory addresses, hardware details and other information useful for exploiting kernel vulnerabilities. kernel.dmesg_restrict = 1 limits reading it to privileged users.
    remediation: &rem-61b3baa50f |
      Set the kernel parameter kernel.dmesg_restrict to 1, now and at boot:

      sysctl -w 'kernel.dmesg_restrict=1'
      printf '%s\n' 'kernel.dmesg_restrict = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.dmesg_restrict from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-SUSE16-1.5.4-kernel_dmesg_restrict_conf"
    name: "kernel dmesg restrict conf: grep \"kernel\\.dmesg_restrict\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.4. NIST SP 800-53 Rev. 5: SC-2, SC-4."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "kernel\.dmesg_restrict" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^*.conf:kernel\\.dmesg_restrict\\s*=\\s*1" }
    rationale: &rat-6b41986a57 |
      The kernel log can leak addresses and system details that help with kernel exploits. Storing kernel.dmesg_restrict = 1 persistently keeps access limited to privileged users after every reboot.
    remediation: &rem-ce0d20764c |
      Set kernel.dmesg_restrict = 1 in a file under /etc/sysctl.d/ and apply it. Remove or correct other settings of this parameter in /etc/sysctl.conf and /etc/sysctl.d/.

      printf '%s\n' 'kernel.dmesg_restrict = 1' >> /etc/sysctl.d/60-kernel_sysctl.conf
      sysctl -p /etc/sysctl.d/60-kernel_sysctl.conf
  - id: "CIS-SUSE16-1.5.5-kernel_kptr_restrict_running"
    name: "Kernel parameter kernel.kptr_restrict is 1"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.5. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.kptr_restrict
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-eae8721348 |
      Kernel pointer addresses exposed through /proc and other interfaces make it easier to defeat kernel address randomisation and exploit memory corruption bugs. kernel.kptr_restrict hides these addresses from unprivileged users.
    remediation: &rem-f5cdfc9fd4 |
      Set the kernel parameter kernel.kptr_restrict to 1, now and at boot:

      sysctl -w 'kernel.kptr_restrict=1'
      printf '%s\n' 'kernel.kptr_restrict = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.kptr_restrict from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-SUSE16-1.5.5-kernel_kptr_restrict_conf"
    name: "kernel kptr restrict conf: grep \"kernel\\.kptr_restrict\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.5. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "kernel\.kptr_restrict" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^*.conf:kernel\\.kptr_restrict\\s*=\\s*(1|2)" }
    rationale: &rat-292196ee62 |
      Exposed kernel pointers help attackers bypass kernel address randomisation. Storing kernel.kptr_restrict = 1 (or 2) persistently ensures the addresses stay hidden after every reboot.
    remediation: &rem-0dac1df27b |
      Set kernel.kptr_restrict = 1 in a file under /etc/sysctl.d/ and apply it. Remove or correct other settings of this parameter in /etc/sysctl.conf and /etc/sysctl.d/.

      printf '%s\n' 'kernel.kptr_restrict = 1' >> /etc/sysctl.d/60-kernel_sysctl.conf
      sysctl -p /etc/sysctl.d/60-kernel_sysctl.conf
  - id: "CIS-SUSE16-1.5.6-kernel_randomize_va_space_running"
    name: "Kernel parameter kernel.randomize_va_space is 2"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.6. NIST SP 800-53 Rev. 5: SI-16."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.randomize_va_space
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 2"
    rationale: &rat-7e34d33024 |
      Address space layout randomisation places the stack, heap, libraries and memory mappings at unpredictable addresses, making memory corruption exploits much harder to write reliably. kernel.randomize_va_space = 2 enables full randomisation.
    remediation: &rem-a6e5efe9f8 |
      Set the kernel parameter kernel.randomize_va_space to 2, now and at boot:

      sysctl -w 'kernel.randomize_va_space=2'
      printf '%s\n' 'kernel.randomize_va_space = 2' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.randomize_va_space from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-SUSE16-1.5.6-kernel_randomize_va_space_conf"
    name: "kernel randomize va space conf: grep \"kernel\\.randomize_va_space\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.6. NIST SP 800-53 Rev. 5: SI-16."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "kernel\.randomize_va_space" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^*.conf:kernel\\.randomize_va_space\\s*=\\s*2" }
    rationale: &rat-dd3f0242fc |
      Full address space layout randomisation makes memory corruption exploits unreliable. Storing kernel.randomize_va_space = 2 persistently ensures it cannot silently revert after a reboot.
    remediation: &rem-2188ae10ec |
      Set kernel.randomize_va_space = 2 in a file under /etc/sysctl.d/ and apply it. Remove or correct other settings of this parameter in /etc/sysctl.conf and /etc/sysctl.d/.

      printf '%s\n' 'kernel.randomize_va_space = 2' >> /etc/sysctl.d/60-kernel_sysctl.conf
      sysctl -p /etc/sysctl.d/60-kernel_sysctl.conf
  - id: "CIS-SUSE16-1.5.7-kernel_yama_ptrace_scope_running"
    name: "Kernel parameter kernel.yama.ptrace_scope is 1"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.7. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.yama.ptrace_scope
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-a27f8cd2db |
      With unrestricted ptrace, any process can attach to other processes of the same user and read their memory, for example to steal credentials from an SSH agent or a browser. The Yama setting kernel.yama.ptrace_scope = 1 limits tracing to a process's own descendants.
    remediation: &rem-1ac1532a42 |
      Set the kernel parameter kernel.yama.ptrace_scope to 1, now and at boot:

      sysctl -w 'kernel.yama.ptrace_scope=1'
      printf '%s\n' 'kernel.yama.ptrace_scope = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.yama.ptrace_scope from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-SUSE16-1.5.7-kernel_yama_ptrace_scope_conf"
    name: "kernel yama ptrace scope conf: grep \"kernel\\.yama\\.ptrace_scope\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.7. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "kernel\.yama\.ptrace_scope" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^*.conf:kernel\\.yama\\.ptrace_scope\\s*=\\s*[1-3]" }
    rationale: &rat-9d39f0bf53 |
      Unrestricted ptrace lets a compromised process read the memory of other processes of the same user. Storing kernel.yama.ptrace_scope persistently (1 or higher) keeps tracing restricted after every reboot.
    remediation: &rem-4aa3cb6ccb |
      Set kernel.yama.ptrace_scope = 1 in a file under /etc/sysctl.d/ and apply it. Remove or correct other settings of this parameter in /etc/sysctl.conf and /etc/sysctl.d/.

      printf '%s\n' 'kernel.yama.ptrace_scope = 1' >> /etc/sysctl.d/60-kernel_sysctl.conf
      sysctl -p /etc/sysctl.d/60-kernel_sysctl.conf

      Values 2 and 3 are stricter and also pass the check, but may break debuggers.
  - id: "CIS-SUSE16-1.5.8-coredump_conf_d_processsizemax-attrs"
    name: "/etc/systemd/coredump.conf.d/60-cis.conf: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.8. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/coredump.conf.d/60-cis.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d27c7a5588 |
      Core dumps contain the memory of the crashed process, which may include passwords, keys and other sensitive data. Setting ProcessSizeMax=0 for systemd-coredump stops dumps from being processed, so this data is not written to disk.
    remediation: &rem-8f996c6f6d |
      Create /etc/systemd/coredump.conf.d/60-cis.conf.
  - id: "CIS-SUSE16-1.5.8-coredump_conf_d_processsizemax-content"
    name: "/etc/systemd/coredump.conf.d/60-cis.conf has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.8. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/systemd/coredump.conf.d/60-cis.conf'
    allow_rc: any
    expect: { some: "~ ^\\s*ProcessSizeMax\\s*=\\s*0" }
    rationale: *rat-d27c7a5588
    remediation: &rem-06cf8784ef |
      Edit /etc/systemd/coredump.conf.d/60-cis.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*ProcessSizeMax\s*=\s*0
  - id: "CIS-SUSE16-1.5.9-coredump_conf_d_storage-attrs"
    name: "/etc/systemd/coredump.conf.d/60-cis.conf: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.9. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/coredump.conf.d/60-cis.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-51fe5cc7a9 |
      Stored core dumps can expose sensitive memory contents of crashed processes to anyone who can read them. Setting Storage=none for systemd-coredump means dumps are logged but not kept on disk.
    remediation: *rem-8f996c6f6d
  - id: "CIS-SUSE16-1.5.9-coredump_conf_d_storage-content"
    name: "/etc/systemd/coredump.conf.d/60-cis.conf has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.5.9. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/systemd/coredump.conf.d/60-cis.conf'
    allow_rc: any
    expect: { some: "~ ^\\s*Storage\\s*=\\s*none" }
    rationale: *rat-51fe5cc7a9
    remediation: &rem-9e42d4a194 |
      Edit /etc/systemd/coredump.conf.d/60-cis.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*Storage\s*=\s*none
  - id: "CIS-SUSE16-1.6.1-crypto_pkg_installed"
    name: "Package crypto-policies-scripts is installed"
