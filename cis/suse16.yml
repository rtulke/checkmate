  - id: "CIS-SUSE16-2.3.1.1-timesync_masked-attrs"
    name: "/etc/systemd/system/systemd-timesyncd.service: exists, is a symbolic link, links to /dev/null"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 2.3.1.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-suse16, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/system/systemd-timesyncd.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: &rat-be779f8e0d |
      Running more than one time synchronisation daemon makes them compete for control of the clock. When chrony is used, masking systemd-timesyncd ensures it cannot be started, leaving a single, consistently configured time source.
    remediation: &rem-7b7223e681 |
      Create /etc/systemd/system/systemd-timesyncd.service if it is missing, then point the link to /dev/null:

      ln -sfn '/dev/null' '/etc/systemd/system/systemd-timesyncd.service'
  - id: "CIS-SUSE16-2.3.1.1-chrony_runs_as_chrony_user"
    name: "chrony runs as chrony user: grep -Es '^\\s*OPTIONS=' /etc/sysconfig/chronyd 2\u003e/dev/null || true"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 2.3.1.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-suse16, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Es '^\s*OPTIONS=' /etc/sysconfig/chronyd 2>/dev/null || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -u\\s+chrony" }
    rationale: &rat-d5c5f1387f |
      chronyd only needs root privileges briefly during start-up. Running it as the unprivileged chrony user afterwards means a vulnerability in the network-facing time daemon cannot be exploited to gain root access.
    remediation: &rem-838825dd95 |
      Make chronyd drop privileges to the chrony user by adding -u chrony to OPTIONS in /etc/sysconfig/chronyd (keep any other options already there), then restart the service.

      grep -q '^OPTIONS=' /etc/sysconfig/chronyd || echo 'OPTIONS=""' >> /etc/sysconfig/chronyd
      sed -i -E '/^OPTIONS=/{/-u[[:space:]]+chrony/!s/^OPTIONS="/OPTIONS="-u chrony /}' /etc/sysconfig/chronyd
      systemctl restart chronyd
  - id: "CIS-SUSE16-2.3.1.1-chrony_time_source"
    name: "chrony time source: grep -Ers '^\\s*(server|pool)\\s+\\S+' /etc/chrony.conf /etc/chrony.d/ 2\u003e/dev/null || true"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 2.3.1.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-suse16, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ers '^\s*(server|pool)\s+\S+' /etc/chrony.conf /etc/chrony.d/ 2>/dev/null || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*:?\\s*(server|pool)\\s+\\S+" }
    rationale: &rat-9f26bc9054 |
      Accurate time is required for correlating logs across systems, for Kerberos and certificate validation and for forensic timelines. chrony needs at least one configured server or pool to synchronise against; otherwise the clock drifts.
    remediation: &rem-59c8b0dc47 |
      Configure at least one time source for chrony, preferably your organisation's NTP servers, and restart chronyd.

      echo 'pool 2.suse.pool.ntp.org iburst' > /etc/chrony.d/50-timesource.conf
      systemctl restart chronyd

      Replace the pool with internal servers (server NAME iburst) where available. chronyc sources shows whether synchronisation works.
