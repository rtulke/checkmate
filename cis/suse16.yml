    severity: low
    run: |
      for z in $(firewall-cmd --get-active-zones 2>/dev/null | awk '!/^ /{print $1}'); do i=$(firewall-cmd --zone=$z --list-interfaces); echo "$i" | grep -Ex '(lo|virbr[^ ]+)?' >/dev/null && continue; t=$(firewall-cmd --permanent --zone=$z --get-target); case $t in ACCEPT|'') echo "$z target=$t interfaces=$i";; esac; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-193bb8103f |
      A firewall zone with the target ACCEPT lets all traffic through that is not explicitly blocked, so any listening service on its interfaces is exposed. Interfaces other than loopback should be in zones whose default handling rejects or drops unsolicited traffic.
    remediation: &rem-0e6e8a2f5f |
      For each zone the check reports, either move its interfaces to a restrictive zone or change the zone target, then reload firewalld.

      firewall-cmd --permanent --zone=public --change-interface=INTERFACE
      firewall-cmd --permanent --zone=ZONE --set-target=DROP
      firewall-cmd --reload

      Allow the services the host needs (e.g. ssh) in the target zone before moving interfaces, or remote access may be lost.
  - id: "CIS-SUSE16-4.1.5-cis_4_1_5_lo_zone"
    name: "cis 4 1 5 lo zone: firewall-cmd --get-zone-of-interface=lo"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 4.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      firewall-cmd --get-zone-of-interface=lo
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ trusted" }
    rationale: &rat-5529e09c77 |
      Loopback traffic is used by local services to talk to each other and must not be blocked. Assigning the lo interface to the trusted zone ensures local communication keeps working while restrictive zones protect the external interfaces.
    remediation: &rem-2867153451 |
      Assign the loopback interface to the trusted zone permanently and reload firewalld.

      firewall-cmd --permanent --zone=trusted --add-interface=lo
      firewall-cmd --reload
  - id: "CIS-SUSE16-4.1.6-cis_4_1_6_ipv4"
    name: "cis 4 1 6 ipv4: firewall-cmd --zone trusted --list-rich-rules"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 4.1.6. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      firewall-cmd --zone trusted --list-rich-rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ source address=\"127\\.0\\.0\\.1\" destination NOT address=\"127\\.0\\.0\\.1\" drop" }
    rationale: &rat-92ec2aaa54 |
      Packets claiming to come from 127.0.0.1 should only ever originate on the host itself. A rule that drops loopback-sourced traffic not destined for loopback stops spoofed packets that try to exploit services trusting localhost.
    remediation: &rem-ec7fb52778 |
      Add a rich rule to the trusted zone that drops IPv4 packets with source 127.0.0.1 and a non-loopback destination, then reload firewalld.

      firewall-cmd --permanent --zone=trusted --add-rich-rule='rule family="ipv4" source address="127.0.0.1" destination not address="127.0.0.1" drop'
      firewall-cmd --reload
  - id: "CIS-SUSE16-4.1.8-cis_4_1_8"
    name: "cis 4 1 8: firewall-cmd --get-default-zone"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 4.1.8. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      firewall-cmd --get-default-zone
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ drop" }
    rationale: &rat-4e8bdd6543 |
      The default zone applies to every interface that is not explicitly assigned to a zone, including interfaces added later. Making the drop zone the default means unsolicited incoming traffic on such interfaces is discarded unless explicitly allowed.
    remediation: &rem-cbaa3aefcc |
      Allow the services the host needs in the drop zone first, then make drop the default zone.

      firewall-cmd --permanent --zone=drop --add-service=ssh
      firewall-cmd --reload
      firewall-cmd --set-default-zone=drop

      Changing the default zone moves all unassigned interfaces into it immediately; without the ssh rule remote access is cut off.
  - id: "CIS-SUSE16-5.1.1-sshd_config_perms-attrs"
    name: "/etc/ssh/sshd_config: mode 0600 or stricter, owner root, group root"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-fc2827314f |
      sshd_config controls who may log in remotely and how. If unprivileged users could modify it they could enable root login or weaken authentication, and read access reveals details of the security configuration. It should be owned by root and accessible only by root.
    remediation: &rem-714a840007 |
      Create /etc/ssh/sshd_config if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/ssh/sshd_config'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/ssh/sshd_config'
  - id: "CIS-SUSE16-5.1.1-sshd_config_root_path_perms-attrs"
    name: "/usr/etc/ssh/sshd_config: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/usr/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-b095e68e3e |
      The SSH server configuration controls who may log in and how. If non-root users can modify it, or read it, they can weaken authentication or learn about access restrictions. The vendor configuration in /usr/etc/ssh should be owned by root and accessible only to root.
    remediation: &rem-1fff0426cd |
      Create /usr/etc/ssh/sshd_config if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/usr/etc/ssh/sshd_config'
      chmod u-xs,g-rwxs,o-rwx,a-t '/usr/etc/ssh/sshd_config'
  - id: "CIS-SUSE16-5.1.1-sshd_config_d_file"
    name: "sshd config d file: find /etc/ssh/sshd_config.d /usr/etc/ssh/sshd_config.d -xdev -type f -name '*.conf' \\( -p…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /etc/ssh/sshd_config.d /usr/etc/ssh/sshd_config.d -xdev -type f -name '*.conf' \( -perm /077 -o ! -user root -o ! -group root \) 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-67d4b8deae |
      Drop-in files in sshd_config.d override the main SSH server configuration. If they are not owned by root or are accessible to group or others, a non-root user could change authentication settings or read them. They should be owned by root:root and have mode 600.
    remediation: &rem-7294989ced |
      Set owner and group root and mode 600 on each drop-in file the check reports.

      chown root:root FILE
      chmod 600 FILE
  - id: "CIS-SUSE16-5.1.2-etc_ssh_ssh_host_prv_key_group"
    name: "/etc/ssh/ssh host prv key group: groupkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -group root ); echo $groupkeys"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      groupkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -group root ); echo $groupkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-5ef33206e2 |
      SSH host private keys prove the server's identity to clients. Anyone who can read a host key can impersonate the server and intercept sessions in a man-in-the-middle attack. Keeping the key files in the root group (or the dedicated ssh_keys group on Red Hat systems) ensures that any group read permission does not extend to ordinary users.
    remediation: &rem-369ef6a077 |
      Change the group of each private host key reported by the check to root.

      chgrp root FILE

      On RHEL 9 the group ssh_keys is also accepted by the check.
  - id: "CIS-SUSE16-5.1.2-etc_ssh_ssh_host_prv_key_perms"
    name: "/etc/ssh/ssh host prv key perms: keyperms=$(sudo find /etc/ssh/ -name *_key -type f -perm /137 ); echo $keyperms"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      keyperms=$(sudo find /etc/ssh/ -name *_key -type f -perm /137 ); echo $keyperms
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-7f190524e0 |
      A host private key that other users can read or modify lets them impersonate the SSH server or replace its identity, which enables interception of administrator sessions. Restricting the files to owner read and write keeps the key usable only by sshd. OpenSSH also ignores private keys with overly open permissions, so tight modes avoid unexpected start-up failures.
    remediation: &rem-6abc4b4be2 |
      Remove execute, group write/execute and all permissions for others from each private host key reported by the check. Mode 0600 satisfies every variant.

      chmod 0600 FILE

      Debian 13, and Debian 11 and Ubuntu 22.04/24.04 for keys in the root group, do not accept group read, so do not use 0640 there.
  - id: "CIS-SUSE16-5.1.2-etc_ssh_ssh_host_prv_key_user"
    name: "/etc/ssh/ssh host prv key user: userkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -user root ); echo $userkeys"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      userkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -user root ); echo $userkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-fbdc35f7c9 |
      If a host private key is owned by an account other than root, that account can read, alter or replace the server's identity key, allowing impersonation of the server or a denial of service. Root ownership ensures that only administrators control the key material.
    remediation: &rem-3a33d707b3 |
      Make root the owner of each private host key reported by the check.

      chown root FILE
  - id: "CIS-SUSE16-5.1.3-etc_ssh_ssh_host_pub_key_group"
    name: "/etc/ssh/ssh host pub key group: groupkeys=$(sudo find /etc/ssh/ -name *_key.pub -type f ! -group root ); echo $groupkeys"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      groupkeys=$(sudo find /etc/ssh/ -name *_key.pub -type f ! -group root ); echo $groupkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-7b474e6437 |
      Public host keys are not secret, but they represent the server's identity that clients verify and that key management or monitoring relies on. If a non-root group can modify them, local users could replace the published key material. Root group ownership keeps changes to the server identity limited to administrators.
    remediation: &rem-4bb93212a2 |
      Change the group of each public host key reported by the check to root.

      chgrp root FILE
  - id: "CIS-SUSE16-5.1.3-etc_ssh_ssh_host_pub_key_perms"
    name: "/etc/ssh/ssh host pub key perms: find /etc/ssh/ -name '*_key.pub' -type f -perm /133 || true"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /etc/ssh/ -name '*_key.pub' -type f -perm /133 || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-33bc1e4eae |
      Public host keys may be world-readable, but write access for group or others would let local users replace them, and the execute bit serves no purpose. Limiting them to mode 0644 or stricter ensures that only root can change the server's published identity.
    remediation: &rem-78675bfedc |
      Remove execute and group/other write permissions from each public host key reported by the check (mode 0644 or stricter).

      chmod u-x,go-wx FILE
  - id: "CIS-SUSE16-5.1.3-etc_ssh_ssh_host_pub_key_user"
    name: "/etc/ssh/ssh host pub key user: userkeys=$(sudo find /etc/ssh/ -name *_key.pub -type f ! -user root ); echo $userkeys"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      userkeys=$(sudo find /etc/ssh/ -name *_key.pub -type f ! -user root ); echo $userkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-e69d03c157 |
      If a public host key is owned by a non-root account, that user can replace it and mislead or disrupt clients that verify the server's identity. Root ownership keeps the published host identity under administrative control.
    remediation: &rem-35eb98c235 |
      Make root the owner of each public host key reported by the check.

      chown root FILE
  - id: "CIS-SUSE16-5.1.4-sshd_access_limited"
    name: "SSH access is limited with AllowUsers, AllowGroups, DenyUsers or DenyGroups"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(allow|deny)(users|groups) +[^ ]'
    allow_rc: any
    expect: { some: "~ ." }
    rationale: &rat-8e5700f652 |
      Restricting SSH logins to explicitly allowed users or groups ensures that only accounts with a need for remote access can log in, even if other accounts have valid credentials or weak passwords. It limits the impact of compromised, forgotten or service accounts.
    remediation: &rem-804a07286e |
      Restrict SSH logins to the users or groups that need them with AllowUsers, AllowGroups, DenyUsers or DenyGroups, according to site policy. Set the directive in the global section of the sshd configuration (in /etc/ssh/sshd_config before any Match block, or in a file in /etc/ssh/sshd_config.d/ where the distribution includes that directory), then validate and reload the SSH service.

      echo 'AllowGroups GROUP' > /etc/ssh/sshd_config.d/10-access.conf
      sshd -t

      When both AllowUsers and AllowGroups are set, a user must match both lists. Make sure your own administrative account is allowed before reloading.
  - id: "CIS-SUSE16-5.1.5-sshd_banner-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect:
      - { some: "~ ^Banner /etc/issue.net" }
      - { none: "~ ^Banner none" }
    rationale: &rat-d96adb0e0c |
      A login banner shown before authentication informs users that access is restricted and monitored, which supports legal action against misuse. Using /etc/issue.net keeps the text in one place, and the banner should not reveal operating system or version details.
    remediation: &rem-04bc3fa781 |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches ^Banner /etc/issue.net
      - no line matches ^Banner none
  - id: "CIS-SUSE16-5.1.5-ssh_configd_banner"
    name: "ssh configd banner: grep -Eis '^\\s*Banner\\s+\"?none\\b'/etc/ssh/sshd_config.d/*.conf"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis '^\s*Banner\s+"?none\b'/etc/ssh/sshd_config.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-c8f1dd710c |
      A pre-authentication banner shows the organisation's legal notice to everyone who connects, which supports action against unauthorised access and informs users about monitoring. A drop-in file with Banner none silently overrides a banner set in the main configuration, because sshd uses the first value it reads. Checking the drop-ins prevents such an override from removing the warning.
    remediation: &rem-d80aaaa50c |
      Remove every Banner none line from the files in /etc/ssh/sshd_config.d/ and configure a banner file instead; put the site's authorised-use notice into /etc/issue.net.

      grep -Eil '^\s*Banner\s+"?none\b' /etc/ssh/sshd_config.d/*.conf
      echo 'Banner /etc/issue.net' > /etc/ssh/sshd_config.d/01-banner.conf
      sshd -t && systemctl reload sshd

      On RHEL 8, which does not read sshd_config.d by default, set Banner in /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-SUSE16-5.1.6-no_weak_ssh_ciphers"
    name: "no weak ssh ciphers: sshd -T | grep -Pi -- '^ciphers\\h+\\\"?([^#\\n\\r]+,)?((3des|aes(128|192|256))-cbc)\\b'"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.6. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -Pi -- '^ciphers\h+\"?([^#\n\r]+,)?((3des|aes(128|192|256))-cbc)\b'
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ ." }
    rationale: &rat-77a6850889 |
      Ciphers such as 3DES, Blowfish, CAST128, RC4 (arcfour) and the CBC modes have known weaknesses that allow plaintext recovery or make traffic analysis easier. Offering them lets an attacker or an outdated client negotiate a weak session. Some variants also exclude chacha20-poly1305, which is affected by the Terrapin prefix truncation attack on unpatched peers.
    remediation: &rem-a819d29f5f |
      Configure an explicit list of strong ciphers for the SSH server.

      echo 'Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr' > /etc/ssh/sshd_config.d/00-ciphers.conf
      sshd -t && systemctl reload sshd

      sshd uses the first Ciphers value it reads; remove conflicting lines that are read earlier.
  - id: "CIS-SUSE16-5.1.7-sshd_clientalive_live"
    name: "sshd clientalive live: sshd -T | grep -i '^clientalive'"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.7. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -i '^clientalive'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^(?i)clientaliveinterval ([1-9]|[1-9][0-9]|[1-8][0-9][0-9]|900)" }
      - { some: "~ ^(?i)ClientAliveCountMax [1-4]" }
    rationale: &rat-87e45da1d2 |
      Idle or abandoned SSH sessions remain open indefinitely and can be taken over at an unattended terminal; dead connections also keep resources allocated. ClientAliveInterval makes the server probe the client regularly and ClientAliveCountMax ends the session after a limited number of unanswered probes, so broken or unresponsive sessions are closed.
    remediation: &rem-2064d83c5c |
      Set a client alive interval of 900 seconds or less and a count of 1 to 4.

      printf '%s\n' 'ClientAliveInterval 15' 'ClientAliveCountMax 3' > /etc/ssh/sshd_config.d/00-clientalive.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any ClientAlive* line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-SUSE16-5.1.8-ssh_disable_forward_live"
    name: "ssh disable forward live: sshd -T | grep -i '^disableforwarding'"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.8. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -i '^disableforwarding'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (?i)^disableforwarding yes" }
      - { none: "~ (?i)^disableforwarding no" }
    rationale: &rat-8b93e4836f |
      SSH forwarding (TCP port, agent, X11 and stream local forwarding) lets users tunnel arbitrary traffic through the server, bypassing firewalls and network monitoring, or expose their agent to a compromised host. DisableForwarding turns off all forwarding types at once. Systems where users legitimately need tunnels should handle this as a documented exception.
    remediation: &rem-e3a56c9870 |
      Disable all forwarding in the SSH server.

      echo 'DisableForwarding yes' > /etc/ssh/sshd_config.d/00-disableforwarding.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any DisableForwarding line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-SUSE16-5.1.9-ssh_gssapi_live"
    name: "ssh gssapi live: sshd -T | grep -i gssapiauthentication"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.9. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -i gssapiauthentication
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (?i)^gssapiauthentication no" }
      - { none: "~ (?i)^gssapiauthentication yes" }
    rationale: &rat-04dcf46ac5 |
      GSSAPI authentication is used for Kerberos single sign-on. When it is not needed, it adds code and complexity to the authentication path and an additional mechanism that has to be secured and monitored. Disabling it reduces the attack surface of the SSH server; hosts that rely on Kerberos logins are a legitimate exception.
    remediation: &rem-2f822456ce |
      Disable GSSAPI authentication in the SSH server.

      echo 'GSSAPIAuthentication no' > /etc/ssh/sshd_config.d/00-gssapi.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any GSSAPIAuthentication line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead. On RHEL the vendor drop-in 50-redhat.conf enables it, so the 00- file must sort before it.
  - id: "CIS-SUSE16-5.1.10-ssh_hostbased_auth_live"
    name: "ssh hostbased auth live: sshd -T | grep -i '^hostbasedauthentication'"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.10. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -i '^hostbasedauthentication'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (?i)^hostbasedauthentication no" }
      - { none: "~ (?i)^hostbasedauthentication yes" }
    rationale: &rat-10e0cd6826 |
      Host-based authentication trusts a user because of the client host they connect from, using .rhosts, shosts.equiv or known host keys. A single compromised or spoofed client host then grants access to accounts on the server without individual credentials. Disabling it forces each user to authenticate personally.
    remediation: &rem-5a00c40bd5 |
      Disable host-based authentication in the SSH server.

      echo 'HostbasedAuthentication no' > /etc/ssh/sshd_config.d/00-hostbasedauth.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any HostbasedAuthentication line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-SUSE16-5.1.11-ssh_rhosts_live"
    name: "ssh rhosts live: sshd -T | grep -i '^ignorerhosts'"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.11. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -i '^ignorerhosts'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (?i)^ignorerhosts yes" }
      - { none: "~ (?i)^ignorerhosts no" }
    rationale: &rat-208615ee5e |
      The legacy .rhosts and .shosts files let users grant password-less access to their account from other hosts. Such trust relationships are hard to audit and easy to abuse once one host is compromised. Setting IgnoreRhosts makes the SSH server disregard these files for authentication.
    remediation: &rem-be3c8ee8f7 |
      Make the SSH server ignore .rhosts and .shosts files.

      echo 'IgnoreRhosts yes' > /etc/ssh/sshd_config.d/00-ignorerhosts.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any IgnoreRhosts line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-SUSE16-5.1.12-no_weak_ssh_kex"
    name: "no weak ssh kex: sshd -T | grep -Pi -- 'kexalgorithms\\h+([^#\\n\\r]+,)?(diffie-hellman-group1-sha1|diffie-he…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.12. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -Pi -- 'kexalgorithms\h+([^#\n\r]+,)?(diffie-hellman-group1-sha1|diffie-hellman-group14-sha1|diffie-hellman-group-exchange-sha1)\b'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-feabaefb53 |
      Key exchange methods based on SHA-1 or on the 1024-bit Diffie-Hellman group 1 no longer provide adequate security: SHA-1 is vulnerable to collision attacks and small groups can be precomputed by well-resourced attackers. If the server offers them, a session key can be negotiated with a weak method, undermining the confidentiality of the whole connection.
    remediation: &rem-3358e7032b |
      Remove the SHA-1 key exchange methods from the SSH server.

      echo 'KexAlgorithms -diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1' > /etc/ssh/sshd_config.d/00-kexalgorithms.conf
      sshd -t && systemctl reload sshd

      The leading minus removes the methods from the default list. sshd uses the first KexAlgorithms value it reads; remove conflicting lines that are read earlier.
  - id: "CIS-SUSE16-5.1.13-ssh_logingrace_live"
    name: "ssh logingrace live: sshd -T | grep -i '^logingracetime'"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.13. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -i '^logingracetime'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (?i)^logingracetime ([1-9]|[1-5][0-9]|60)" }
      - { none: "~ (?i)^logingracetime (6[1-9]|[7-9][0-9]|[1-9][0-9]{2,})" }
    rationale: &rat-82827b7520 |
      LoginGraceTime limits how long an unauthenticated connection may stay open. A long grace period lets attackers hold many half-open connections and exhaust the server's connection slots, or spend more time on each guessing attempt. A limit of one minute or less still leaves enough time for legitimate logins.
    remediation: &rem-9451437f62 |
      Set the login grace time to 60 seconds or less.

      echo 'LoginGraceTime 60' > /etc/ssh/sshd_config.d/00-logingracetime.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any LoginGraceTime line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-SUSE16-5.1.14-ssh_loglevel_live"
    name: "ssh loglevel live: sshd -T | grep -i '^loglevel'"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.14. NIST SP 800-53 Rev. 5: AU-3, AU-12, SI-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -i '^loglevel'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (?i)^loglevel\\s(VERBOSE|INFO)" }
      - { none: "~ (?i)^loglevel DEBUG" }
    rationale: &rat-1456734810 |
      SSH logs are the primary record of who logged in, from where and with which key. INFO records logins and logouts, and VERBOSE additionally records the key fingerprint used, which is valuable for incident investigation. Lower levels lose this information, while DEBUG produces excessive output and may log sensitive details.
    remediation: &rem-27ea57d275 |
      Set the SSH server log level to VERBOSE (INFO is also accepted).

      echo 'LogLevel VERBOSE' > /etc/ssh/sshd_config.d/00-loglevel.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any LogLevel line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-SUSE16-5.1.15-no_weak_ssh_macs"
    name: "no weak ssh macs: sshd -T | grep -Pi -- 'macs\\h+([^#\\n\\r]+,)?(hmac-md5|hmac-md5-96|hmac-ripemd160|hmac-sha1…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.15. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -Pi -- 'macs\h+([^#\n\r]+,)?(hmac-md5|hmac-md5-96|hmac-ripemd160|hmac-sha1-96|umac-64@openssh\.com|hmac-md5-etm@openssh\.com|hmac-md5-96-etm@openssh\.com|hmac-ripemd160-etm@openssh\.com|hmac-sha1-96-etm@openssh\.com|umac-64-etm@openssh\.com|umac-128-etm@openssh\.com)\b'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-740cca9bb0 |
      Message authentication codes protect SSH traffic against tampering. MD5, RIPEMD-160, truncated SHA-1 (96-bit) and the 64-bit UMAC tags are weak or too short to resist forgery reliably. If the server offers them, a connection may be protected by a weak integrity check. Some variants also exclude umac-128-etm@openssh.com.
    remediation: &rem-b50c5b88e2 |
      Configure an explicit list of strong MACs for the SSH server.

      echo 'MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256' > /etc/ssh/sshd_config.d/00-macs.conf
      sshd -t && systemctl reload sshd

      sshd uses the first MACs value it reads; remove conflicting lines that are read earlier.
  - id: "CIS-SUSE16-5.1.16-sshd_authtries"
    name: "sshd authtries: sshd -T 2\u003e/dev/null | grep -i '^maxauthtries' || true"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.16. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i '^maxauthtries' || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)maxauthtries [1-4]" }
      - { none: "~ (?i)maxauthtries ([5-9]|[1-9]{2,})" }
    rationale: &rat-7ebfd780b6 |
      MaxAuthTries caps the number of authentication attempts per connection. A low limit slows down online password guessing, because attackers must reconnect frequently, and failures are logged sooner. Four attempts is enough for normal use.
    remediation: &rem-64bb4487b3 |
      Set MaxAuthTries to 4 or less and remove lines with higher values.

      echo 'MaxAuthTries 4' > /etc/ssh/sshd_config.d/01-maxauthtries.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i maxauthtries

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh. On Debian 12, Ubuntu 20.04 and 22.04 and SUSE 15 the check also counts commented lines, so delete the commented default as well: sed -i -E '/^\s*#\s*MaxAuthTries\s/Id' /etc/ssh/sshd_config
  - id: "CIS-SUSE16-5.1.17-ssh_maxstartups"
    name: "ssh maxstartups: sshd -T 2\u003e/dev/null | grep -i '^maxstartups' || true"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.17. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i '^maxstartups' || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ MaxStartups 10:30:60" }
    rationale: &rat-32a21f45bb |
      MaxStartups controls how many unauthenticated connections sshd accepts at the same time. With 10:30:60, sshd starts refusing new unauthenticated connections at random once 10 are pending, with rising probability up to a hard limit of 60. This blunts connection floods and brute-force tools while legitimate users still get through.
    remediation: &rem-36fe032f0c |
      Set MaxStartups 10:30:60 and remove conflicting MaxStartups lines.

      echo 'MaxStartups 10:30:60' > /etc/ssh/sshd_config.d/01-maxstartups.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i maxstartups

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-SUSE16-5.1.18-ssh_maxsessions"
    name: "ssh maxsessions: sshd -T 2\u003e/dev/null | grep -i '^maxsessions' || true"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.18. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i '^maxsessions' || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)MaxSessions ([1-9]|10)" }
      - { none: "~ (?i)MaxSessions (1[1-9]|[2-9][0-9]|[1-9]{3,})" }
    rationale: &rat-5de57ba7dd |
      MaxSessions limits how many shell, login or subsystem sessions can be multiplexed over one SSH connection. Without a cap, a single authenticated connection could open a large number of sessions and exhaust server resources. A limit of 10 still accommodates normal multiplexing.
    remediation: &rem-d4bf1cc141 |
      Set MaxSessions to 10 or less and remove lines with higher values.

      echo 'MaxSessions 10' > /etc/ssh/sshd_config.d/01-maxsessions.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i maxsessions

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-SUSE16-5.1.19-ssh_empty_passwd"
    name: "ssh empty passwd: sshd -T 2\u003e/dev/null | grep -i '^permitemptypasswords' || true"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.19. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i '^permitemptypasswords' || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)PermitEmptyPasswords no" }
      - { none: "~ (?i)PermitEmptyPasswords yes" }
    rationale: &rat-861378e10c |
      If an account has an empty password and sshd accepts it, anyone can log in to that account remotely without a credential. PermitEmptyPasswords no makes sshd refuse such logins regardless of how the account is configured.
    remediation: &rem-0c40a7ec4d |
      Set PermitEmptyPasswords no and remove any PermitEmptyPasswords yes line.

      echo 'PermitEmptyPasswords no' > /etc/ssh/sshd_config.d/01-permitemptypasswords.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i permitemptypasswords

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-SUSE16-5.1.20-ssh_permit_root"
    name: "ssh permit root: sshd -T 2\u003e/dev/null | grep -i '^permitrootlogin' || true"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.20. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i '^permitrootlogin' || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)PermitRootLogin no" }
      - { none: "~ (?i)PermitRootLogin yes" }
    rationale: &rat-47fd7571af |
      Direct root logins over SSH expose the most powerful account to password guessing and leave no record of which administrator acted. Requiring personal accounts with escalation through sudo or su adds accountability and an extra barrier. Automation that needs root can use dedicated accounts with restricted sudo rules.
    remediation: &rem-49bd30d8bb |
      Set PermitRootLogin no and remove any PermitRootLogin yes line. Make sure an administrative account with sudo access works before reloading sshd.

      echo 'PermitRootLogin no' > /etc/ssh/sshd_config.d/01-permitrootlogin.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i permitrootlogin

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-SUSE16-5.1.21-ssh_userenv"
    name: "ssh userenv: sshd -T 2\u003e/dev/null | grep -i '^permituserenvironment' || true"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.21. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i '^permituserenvironment' || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)PermitUserEnvironment no" }
      - { none: "~ (?i)PermitUserEnvironment yes" }
    rationale: &rat-a46f1c4dfd |
      PermitUserEnvironment lets users pass environment variables through ~/.ssh/environment or authorized_keys options. Variables such as LD_PRELOAD or PATH can bypass restrictions like forced commands or restricted shells and run attacker-chosen code. Disabling it keeps the session environment under administrative control.
    remediation: &rem-b672df6f9a |
      Set PermitUserEnvironment no and remove any PermitUserEnvironment yes line.

      echo 'PermitUserEnvironment no' > /etc/ssh/sshd_config.d/01-permituserenvironment.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i permituserenvironment

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-SUSE16-5.1.22-ssh_usepam"
    name: "ssh usepam: sshd -T 2\u003e/dev/null | grep -i '^usepam' || true"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.22. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i '^usepam' || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)UsePAM yes" }
      - { none: "~ (?i)UsePAM no" }
    rationale: &rat-20d91b73a4 |
      With UsePAM enabled, sshd runs the PAM account and session stacks, so lockout after failed logins, password expiry, access restrictions and session limits configured in PAM also apply to SSH logins. Without it these controls are bypassed for remote access.
    remediation: &rem-5c14f62bd4 |
      Set UsePAM yes and remove any UsePAM no line.

      echo 'UsePAM yes' > /etc/ssh/sshd_config.d/01-usepam.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i usepam

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-SUSE16-5.1.23-ssh_pq_kex_sntrup761"
    name: "ssh pq kex sntrup761: sshd -T | awk '(tolower($1)==\"kexalgorithms\" \u0026\u0026 $2~/sntrup761x25519-sha512/) {print $2}'"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.23."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | awk '(tolower($1)=="kexalgorithms" && $2~/sntrup761x25519-sha512/) {print $2}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ sntrup761x25519-sha512" }
    rationale: &rat-c60b7cbcc4 |
      Key exchanges based only on classical elliptic-curve or Diffie-Hellman methods can be recorded today and decrypted later once quantum computers are capable enough. The hybrid sntrup761x25519-sha512 key exchange combines a post-quantum algorithm with X25519, protecting session keys against such store-now-decrypt-later attacks.
    remediation: &rem-6f6e5b979b |
      Make sure the effective KexAlgorithms list of sshd includes sntrup761x25519-sha512. If KexAlgorithms is set explicitly, add the algorithm to it; sshd uses the first value it reads, so the drop-in must be read before other KexAlgorithms lines.

      echo 'KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256' > /etc/ssh/sshd_config.d/10-kex.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i ^kexalgorithms

      With OpenSSH 9.9 or later, mlkem768x25519-sha256 can be added at the front of the list as well. Clients that support none of the listed algorithms can no longer connect.
  - id: "CIS-SUSE16-5.1.24-ssh_listen_address"
    name: "ssh listen address: sshd -T | grep -i '^listenaddress'"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.1.24. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      sshd -T | grep -i '^listenaddress'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ (?i)^listenaddress 0\\.0\\.0\\.0" }
      - { none: "~ (?i)^listenaddress \\[?::\\]?(:|$)" }
    rationale: &rat-c071cd61c1 |
      By default sshd listens on all addresses, so it is reachable on every network the host is connected to, including management or public interfaces where SSH should not be offered. Binding it to specific addresses limits where the service is exposed.
    remediation: &rem-59466f7890 |
      Configure sshd to listen only on the specific address(es) intended for SSH access, test the configuration and reload.

      echo 'ListenAddress ADDRESS' > /etc/ssh/sshd_config.d/10-listenaddress.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i ^listenaddress

      Replace ADDRESS with an address configured on this host (add one line per address). If the address is not available when sshd starts, sshd fails to bind it; keep a console session open while testing.
  - id: "CIS-SUSE16-5.2.1-sudo_pkg"
    name: "Package sudo is installed"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.2.1. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet sudo
    expect: true
    rationale: &rat-9e2e0570f3 |
      sudo lets administrators run individual commands with elevated privileges under their own identity, with logging. This avoids shared root passwords and direct root logins, and provides an audit trail of privileged actions.
    remediation: &rem-cfb83c57ec |
      Install the package sudo:

      zypper install sudo
  - id: "CIS-SUSE16-5.2.2-pty_sudoers_d"
    name: "pty sudoers d: export PTY=`grep -q -Ei '^\\s*Defaults\\s+(\\[^#]+,\\s*)?use_pty' /etc/sudoers /etc/sudoers.d…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.2.2. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      export PTY=`grep -q -Ei '^\s*Defaults\s+(\[^#]+,\s*)?use_pty' /etc/sudoers /etc/sudoers.d/*; echo $?` && if [[ $PTY == 0 ]];then echo OK ;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK" }
    rationale: &rat-63218cca98 |
      With use_pty, sudo runs commands in a separate pseudo-terminal. A malicious program started through sudo then cannot inject input into the user's terminal or keep access to it after sudo exits. It also makes I/O logging complete.
    remediation: &rem-bf550576ff |
      Enable use_pty with a line of its own in a file under /etc/sudoers.d/, remove any Defaults !use_pty setting and validate the syntax.

      echo 'Defaults use_pty' > /etc/sudoers.d/50-use_pty
      chmod 0440 /etc/sudoers.d/50-use_pty
      grep -rnE '^\s*Defaults.*!use_pty' /etc/sudoers /etc/sudoers.d/
      visudo -c

      sudo ignores files in /etc/sudoers.d/ whose names contain a dot or end with ~.
  - id: "CIS-SUSE16-5.2.3-log_sudoers_d"
    name: "log sudoers d: export LOG=`grep -q -Esi '^\\s*Defaults\\s+([^#]+,\\s*)?logfile=' /etc/sudoers /etc/sudoers.…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.2.3. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      export LOG=`grep -q -Esi '^\s*Defaults\s+([^#]+,\s*)?logfile=' /etc/sudoers /etc/sudoers.d/*; echo $?` && if [[ $LOG == 0 ]];then echo OK ;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK" }
    rationale: &rat-73ffb83e75 |
      A dedicated sudo log file records every sudo invocation with user, terminal, working directory and command. That makes privileged activity easy to review and keeps the record separate from general system logs.
    remediation: &rem-b7aaa6ded0 |
      Configure a dedicated sudo log file under /var/log in a Defaults line of its own and validate the syntax.

      echo 'Defaults logfile="/var/log/sudo.log"' > /etc/sudoers.d/50-logfile
      chmod 0440 /etc/sudoers.d/50-logfile
      visudo -c
  - id: "CIS-SUSE16-5.2.4-nopasswd_sudoers_d"
    name: "nopasswd sudoers d: grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v '.*\\:#'"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.2.4. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-suse16, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v '.*\:#'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-eecb763928 |
      NOPASSWD lets users run commands with elevated privileges without entering their password. Anyone who gains access to such an account, or a process running as it, obtains root immediately. Requiring the password confirms the person and limits the impact of a hijacked session.
    remediation: &rem-a35cd5880e |
      Review every listed sudo rule with NOPASSWD and remove the tag (or the rule) unless a documented exception applies. Edit the files with visudo so syntax errors are caught.

      grep -rn NOPASSWD /etc/sudoers /etc/sudoers.d/
      visudo -f FILE

      Users who lose NOPASSWD need a password to use sudo. On cloud images the default user (for example via /etc/sudoers.d/90-cloud-init-users) often has none; set one first, or you may lose administrative access.
  - id: "CIS-SUSE16-5.2.5-authenticate_sudoers"
    name: "authenticate sudoers: grep -r \"^[^#].*\\!authenticate\" /etc/sudoers*"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.2.5. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -r "^[^#].*\!authenticate" /etc/sudoers*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-0aa92719bf |
      The !authenticate option lets sudo run commands without asking for the user's password. Anyone who gets hold of an unlocked session or a compromised account of such a user can then act with elevated privileges without any further barrier. Requiring re-authentication for sudo keeps privilege escalation tied to knowledge of the password.
    remediation: &rem-f4fb208b6d |
      Remove the !authenticate option from every sudoers rule and Defaults line reported by the check. Edit each file with visudo so that the syntax is validated before it is saved.

      grep -rn '!authenticate' /etc/sudoers /etc/sudoers.d/
      visudo -f /etc/sudoers
      visudo -f /etc/sudoers.d/FILE

      Affected users will be asked for their password again when they use sudo.
  - id: "CIS-SUSE16-5.2.6-sudo_timeout"
    name: "sudo timeout: grep -rP \"timestamp_timeout=\\K[0-9]*\" /etc/sudoers*"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.2.6. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -rP "timestamp_timeout=\K[0-9]*" /etc/sudoers*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ timestamp_timeout=(-1|1[6-9]|[2-9][0-9]|[1-9][0-9]{2,})" }
      - { some: "~ timestamp_timeout=([5-9]|1[0-5])" }
    rationale: &rat-14f3ec7a75 |
      After a successful authentication, sudo caches the credentials for a while so that further commands do not ask for the password again. A long or unlimited cache lets anyone with access to an unattended terminal run privileged commands. Keeping the timeout at 15 minutes or less limits that window while staying practical for administrators.
    remediation: &rem-391bdc9433 |
      Set the sudo credential cache timeout to 15 minutes or less in a sudoers drop-in file, and remove larger or negative timestamp_timeout values from all other sudoers files.

      grep -rn 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/
      echo 'Defaults timestamp_timeout=15' > /etc/sudoers.d/50-timestamp-timeout
      chmod 0440 /etc/sudoers.d/50-timestamp-timeout
      visudo -c

      Write the value without spaces around the equals sign; the check searches for timestamp_timeout=VALUE literally.
  - id: "CIS-SUSE16-5.2.7-restrict_su-attrs"
    name: "/etc/pam.d/su: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/su'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-43a7e69d11 |
      su lets any user who knows the root password, or another account's password, switch identity. Restricting su with pam_wheel to members of a dedicated (normally empty) group prevents switching to root through su and forces administrators to use sudo, where actions are attributed to individual accounts and logged.
    remediation: &rem-d67efd69b0 |
      Create /etc/pam.d/su.
  - id: "CIS-SUSE16-5.2.7-restrict_su-content"
    name: "/etc/pam.d/su has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/su'
    allow_rc: any
    expect: { some: "~ ^\\s*auth\\s+(required|requisite)\\s+pam_wheel\\.so\\s+(\\S+\\s+)*(use_uid\\s+(\\S+\\s+)*group=\\S+|group=\\S+\\s+(\\S+\\s+)*use_uid)(\\s|$)" }
    rationale: *rat-43a7e69d11
    remediation: &rem-ee23a5a1dd |
      Edit /etc/pam.d/su so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*auth\s+(required|requisite)\s+pam_wheel\.so\s+(\S+\s+)*(use_uid\s+(\S+\s+)*group=\S+|group=\S+\s+(\S+\s+)*use_uid)(\s|$)
  - id: "CIS-SUSE16-5.2.7-sugroup_etc_group"
    name: "The group that pam_wheel allows to use su has no members"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      g=$(sed -nE 's/^[[:space:]]*auth[[:space:]]+(required|requisite)[[:space:]]+pam_wheel\.so[[:space:]](.*[[:space:]])?group=([^[:space:]]+).*/\3/p' /etc/pam.d/su 2>/dev/null | sed -n 1p)
      if [ -z "$g" ]; then echo "pam_wheel in /etc/pam.d/su names no group"; exit 0; fi
      e=$(getent group "$g")
      if [ -z "$e" ]; then echo "group $g does not exist"; exit 0; fi
      echo "$e" | awk -F: '$4 != "" {print "group " $1 " has members: " $4}'
    allow_rc: any
    expect: empty
    rationale: &rat-575a3911d0 |
      Restricting su with pam_wheel to members of a dedicated group prevents ordinary users from switching to root or other accounts by guessing or knowing their passwords. Using an empty group makes su usable only by root, so administrators must use sudo, which is logged per user. The group must exist and have no members.
    remediation: &rem-80fba87223 |
      Create a group without members and restrict su to it with pam_wheel in /etc/pam.d/su. The group can have any name; sugroup is an example.

      groupadd sugroup
      gpasswd -M '' sugroup
      grep -Eq '^\s*auth\s+(required|requisite)\s+pam_wheel\.so\s.*group=' /etc/pam.d/su || sed -i '/^auth\s\+sufficient\s\+pam_rootok.so/a auth required pam_wheel.so use_uid group=sugroup' /etc/pam.d/su

      If pam_wheel already names a group, remove its members instead: gpasswd -M '' GROUP.
  - id: "CIS-SUSE16-5.3.1.1-pam_version"
    name: "Package pam is installed"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet pam
    expect: true
    rationale: &rat-7802ae6e55 |
      Several authentication controls, such as faillock.conf, pwhistory configuration files and fixes for known PAM vulnerabilities, depend on a sufficiently recent PAM package. An outdated PAM may silently ignore settings that are believed to be active or leave security fixes unapplied. Keeping PAM at the required version ensures the configured policies are actually enforced.
    remediation: &rem-d7039b64c8 |
      Install the package pam:

      zypper install pam
  - id: "CIS-SUSE16-5.3.1.1-pam_version-version"
    name: "Package pam version \u003e= 1.3.0-150000.6.71.2"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --qf '%{VERSION}-%{RELEASE}' pam
    allow_rc: any
    as: version
    expect:
      - { rc: "== 0" }
      - "\u003e= 1.3.0-150000.6.71.2"
    rationale: *rat-7802ae6e55
    remediation: &rem-9710a37e00 |
      Update the package pam to a version >= 1.3.0-150000.6.71.2:

      zypper update pam
  - id: "CIS-SUSE16-5.3.2.1.1-faillock_attempts_deny-attrs"
    name: "/etc/security/faillock.conf: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-241af1b0a8 |
      Locking an account after a small number of consecutive failed logins stops online password guessing against it. Without a limit, an attacker can try passwords indefinitely. A limit of five or fewer attempts keeps guessing impractical; the trade-off is that attackers can deliberately lock accounts, which the unlock time should balance.
    remediation: &rem-41697c6a61 |
      Create /etc/security/faillock.conf.
  - id: "CIS-SUSE16-5.3.2.1.1-faillock_attempts_deny-content"
    name: "/etc/security/faillock.conf has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/security/faillock.conf'
    allow_rc: any
    expect:
      - { some: "~ ^deny\\s*=\\s*[1-5]$" }
      - { none: "~ ^deny\\s*=\\s*([6-9]|[0-9]{2,})" }
    rationale: *rat-241af1b0a8
    remediation: &rem-ac54390737 |
      Edit /etc/security/faillock.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^deny\s*=\s*[1-5]$
      - no line matches ^deny\s*=\s*([6-9]|[0-9]{2,})
  - id: "CIS-SUSE16-5.3.2.1.2-faillock_unlock_time-attrs"
    name: "/etc/security/faillock.conf: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f655eb77df |
      The unlock time determines how long an account stays locked after too many failed logins. A short lock barely slows down automated guessing, while 0 keeps the account locked until an administrator intervenes. Variants differ in whether they favour long locks or a maximum of 15 minutes to limit denial of service.
    remediation: *rem-41697c6a61
  - id: "CIS-SUSE16-5.3.2.1.2-faillock_unlock_time-content"
    name: "/etc/security/faillock.conf has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/security/faillock.conf'
    allow_rc: any
    expect:
      - { some: "~ ^unlock_time\\s*=\\s*([1-9]|[1-9][0-9]|[1-8][0-9]{1,2}|900)$" }
      - { none: "~ ^unlock_time\\s*=\\s*(90[1-9]|9[1-9][0-9]|[1-9][0-9][0-9]{2,})" }
    rationale: *rat-f655eb77df
    remediation: &rem-aa192ec351 |
      Edit /etc/security/faillock.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^unlock_time\s*=\s*([1-9]|[1-9][0-9]|[1-8][0-9]{1,2}|900)$
      - no line matches ^unlock_time\s*=\s*(90[1-9]|9[1-9][0-9]|[1-9][0-9][0-9]{2,})
  - id: "CIS-SUSE16-5.3.2.1.3-faillock_root_unlock_time-attrs"
    name: "/etc/security/faillock.conf: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-455eda8837 |
      Without even_deny_root, root is exempt from faillock lockouts and can be guessed without limit. If root lockout is enabled with root_unlock_time, the value should be at least 60 seconds so that repeated guessing is actually slowed down.
    remediation: *rem-41697c6a61
  - id: "CIS-SUSE16-5.3.2.1.3-faillock_root_unlock_time-content"
    name: "/etc/security/faillock.conf has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/security/faillock.conf'
    allow_rc: any
    expect:
      - { some: "~ ^(even_deny_root|root_unlock_time\\s*=\\s*([6-9][0-9]|[1-9][0-9]{2,})$)" }
      - { none: "~ ^root_unlock_time\\s*=\\s*([0-9]|[1-5][0-9]|60)" }
    rationale: *rat-455eda8837
    remediation: &rem-1b110ec136 |
      Edit /etc/security/faillock.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^(even_deny_root|root_unlock_time\s*=\s*([6-9][0-9]|[1-9][0-9]{2,})$)
      - no line matches ^root_unlock_time\s*=\s*([0-9]|[1-5][0-9]|60)
  - id: "CIS-SUSE16-5.3.2.2.1-dict_check_not_pam"
    name: "dict check not pam: grep -Psi -- '^\\h*dictcheck\\h*=\\h*0\\b' /etc/security/pwquality.conf /etc/security/pwquali…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*dictcheck\h*=\h*0\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ ^.*" }
    rationale: &rat-d679dd5ce2 |
      Passwords based on dictionary words are among the first guesses in any password attack. The pwquality dictionary check rejects such passwords; setting dictcheck = 0 turns that protection off and should not be done.
    remediation: &rem-61a2b8c799 |
      Remove or comment out any dictcheck = 0 setting in the pwquality configuration.

      sed -ri 's/^\s*dictcheck\s*=\s*0\b/# &/I' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf

      The dictionary check is enabled by default when no dictcheck setting is present.
  - id: "CIS-SUSE16-5.3.2.2.2-difok_check_not_pam"
    name: "difok check not pam: grep -Psi -- '^\\h*difok\\h*=\\h*([2-9]|[1-9][0-9]+)\\b' /etc/security/pwquality.conf /etc/se…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.2.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*difok\h*=\h*([2-9]|[1-9][0-9]+)\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*:difok\\s*=\\s*([2-9]|1[0-9])" }
    rationale: &rat-58e70c0ec4 |
      If a new password may be almost identical to the old one, users tend to change just one character, so a leaked old password still reveals the new one. Requiring a minimum number of changed characters (difok of at least 2) forces a meaningfully different password.
    remediation: &rem-3379cef234 |
      Set difok to 2 or more in a pwquality drop-in file. Comment out conflicting entries in /etc/security/pwquality.conf and other files in /etc/security/pwquality.conf.d/.

      mkdir -p /etc/security/pwquality.conf.d
      printf '%s\n' 'difok = 2' > /etc/security/pwquality.conf.d/50-pwdifok.conf
  - id: "CIS-SUSE16-5.3.2.2.3-minlen_check_not_pam"
    name: "minlen check not pam: grep -Psi -- '^\\h*minlen\\h*=\\h*(1[4-9]|[2-9][0-9]|[1-9][0-9]{2,})\\b' /etc/security/pwqual…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.2.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*minlen\h*=\h*(1[4-9]|[2-9][0-9]|[1-9][0-9]{2,})\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*:minlen\\s*=\\s*(1[4-9]|[2-5][0-9])" }
      - { none: "~ .*:minlen\\s*=\\s*([1-9]|1[0-3])$" }
    rationale: &rat-ae6a8f1866 |
      Password length is the most important factor for resistance against brute-force attacks. Requiring at least 14 characters makes exhaustive guessing impractical and encourages the use of passphrases.
    remediation: &rem-896764ead6 |
      Set minlen to 14 or more in a pwquality drop-in file. Comment out conflicting entries in /etc/security/pwquality.conf and other files in /etc/security/pwquality.conf.d/.

      mkdir -p /etc/security/pwquality.conf.d
      printf '%s\n' 'minlen = 14' > /etc/security/pwquality.conf.d/50-pwlength.conf
  - id: "CIS-SUSE16-5.3.2.2.4-passwd_complex_check_not_pam"
    name: "passwd complex check not pam: grep -Psi -- '^\\h*(minclass|[dulo]credit)\\b' /etc/security/pwquality.conf /etc/security/p…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.2.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*(minclass|[dulo]credit)\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*:(dcredit\\s*=\\s*-1|minclass\\s*=\\s*4)" }
      - { some: "~ .*:(lcredit\\s*=\\s*-1|minclass\\s*=\\s*4)" }
      - { some: "~ .*:(ocredit\\s*=\\s*-1|minclass\\s*=\\s*4)" }
      - { some: "~ .*:(ucredit\\s*=\\s*-1|minclass\\s*=\\s*4)" }
    rationale: &rat-73818052ba |
      Passwords drawn from a small character set are faster to brute-force. Requiring digits, uppercase, lowercase and special characters increases the search space an attacker has to cover.
    remediation: &rem-1a07b257c6 |
      Require all four character classes in a pwquality drop-in file, either with minclass = 4 or with dcredit, ucredit, lcredit and ocredit each set to -1. Comment out conflicting entries in /etc/security/pwquality.conf and other files in /etc/security/pwquality.conf.d/.

      mkdir -p /etc/security/pwquality.conf.d
      printf '%s\n' 'minclass = 4' > /etc/security/pwquality.conf.d/50-pwcomplexity.conf

      The check accepts either minclass = 4 or each of the four credit settings at -1.
  - id: "CIS-SUSE16-5.3.2.2.5-maxrepeat_check_not_pam"
    name: "maxrepeat check not pam: grep 'maxrepeat' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.2.5. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep 'maxrepeat' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*:maxrepeat\\s*=\\s*[1-3]" }
      - { none: "~ .*:maxrepeat\\s*=\\s*(0|[4-9]|[1-9][0-9])" }
    rationale: &rat-a019840f1e |
      Passwords with long runs of the same character, such as aaaa1111, are weak and easy to guess. Limiting consecutive identical characters to 3 or fewer rejects such patterns.
    remediation: &rem-75c85962c3 |
      Set maxrepeat to a value between 1 and 3 in a pwquality drop-in file, and make sure no file sets it to 0 or 4 or more. Comment out conflicting entries in /etc/security/pwquality.conf and other files in /etc/security/pwquality.conf.d/.

      mkdir -p /etc/security/pwquality.conf.d
      printf '%s\n' 'maxrepeat = 3' > /etc/security/pwquality.conf.d/50-pwrepeat.conf
  - id: "CIS-SUSE16-5.3.2.2.6-maxsequence_check_not_pam"
    name: "maxsequence check not pam: grep 'maxsequence' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.2.6. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep 'maxsequence' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*:maxsequence\\s*=\\s*[1-3]" }
      - { none: "~ .*:maxsequence\\s*=\\s*(0|[4-9]|[1-9][0-9])" }
    rationale: &rat-e55d4f9017 |
      Monotonic sequences such as 12345 or abcde are among the first patterns attackers try. Limiting the length of such sequences to 3 or fewer rejects passwords built from them.
    remediation: &rem-2400f05861 |
      Set maxsequence to a value between 1 and 3 in a pwquality drop-in file, and make sure no file sets it to 0 or 4 or more. Comment out conflicting entries in /etc/security/pwquality.conf and other files in /etc/security/pwquality.conf.d/.

      mkdir -p /etc/security/pwquality.conf.d
      printf '%s\n' 'maxsequence = 3' > /etc/security/pwquality.conf.d/50-pwmaxsequence.conf
  - id: "CIS-SUSE16-5.3.2.2.7-enforce_for_root_check_not_pam"
    name: "enforce for root check not pam: grep 'enforce_for_root' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.2.7. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep 'enforce_for_root' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*:enforce_for_root" }
    rationale: &rat-ef5d433a62 |
      By default pwquality only warns root when a weak password is chosen and accepts it anyway. Enforcing the quality rules for root ensures that administrators, whose accounts are the most valuable targets, cannot set weak passwords.
    remediation: &rem-68c7a81160 |
      Add the enforce_for_root option to a pwquality drop-in file. Comment out conflicting entries in /etc/security/pwquality.conf and other files in /etc/security/pwquality.conf.d/.

      mkdir -p /etc/security/pwquality.conf.d
      printf '%s\n' 'enforce_for_root' > /etc/security/pwquality.conf.d/50-pwroot.conf
  - id: "CIS-SUSE16-5.3.2.3.1-pwhistory_remember_use_pam"
    name: "pwhistory remember use pam: pam-config --query --pwhistory --pwhistory-remember"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.3.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pam-config --query --pwhistory --pwhistory-remember
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ password:.*remember\\s*=\\s*(2[4-9])" }
    rationale: &rat-6e230f8014 |
      Remembering the last 24 passwords prevents users from returning to an earlier password soon after a forced change, which would make password expiry pointless and allow reuse of exposed passwords.
    remediation: &rem-8bac3cd2b6 |
      Enable pam_pwhistory with a history of 24 passwords and verify it.

      pam-config -a --pwhistory --pwhistory-remember=24
      pam-config --query --pwhistory

      pam-config writes /etc/pam.d/common-password-pc, which /etc/pam.d/common-password normally links to.
  - id: "CIS-SUSE16-5.3.2.3.2-pwhistory_remember_root_use_pam"
    name: "pwhistory remember root use pam: pam-config --query --pwhistory --pwhistory-enforce_for_root"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.3.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pam-config --query --pwhistory --pwhistory-enforce_for_root
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ password:.*enforce_for_root" }
    rationale: &rat-e684170f93 |
      Without enforce_for_root, the password history is not checked when root changes passwords, so old passwords can be reused through root. The option closes this gap.
    remediation: &rem-0bf19de6ec |
      Add enforce_for_root to pam_pwhistory and verify it.

      pam-config -a --pwhistory --pwhistory-enforce_for_root
      pam-config --query --pwhistory

      pam-config writes /etc/pam.d/common-password-pc, which /etc/pam.d/common-password normally links to.
  - id: "CIS-SUSE16-5.3.2.3.3-pwhistory_authtok_use_pam"
    name: "pwhistory authtok use pam: grep -P -- '^\\h*password\\h+([^#\\n\\r]+)\\h+pam_pwhistory\\.so\\h+([^#\\n\\r]+\\h+)?use_authtok\\b…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.3.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -P -- '^\h*password\h+([^#\n\r]+)\h+pam_pwhistory\.so\h+([^#\n\r]+\h+)?use_authtok\b' /etc/pam.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ etc\\/pam.d\\/common-password:password\\s*required\\s*pam_pwhistory.so.*use_authtok" }
      - { some: "~ etc\\/pam.d\\/common-password-pc:password\\s*required\\s*pam_pwhistory.so.*use_authtok" }
    rationale: &rat-0ce6985167 |
      With use_authtok, pam_pwhistory checks the new password already accepted by the strength checks instead of prompting again, so the password compared against the history is the one that will actually be stored.
    remediation: &rem-3dd6415744 |
      Add use_authtok to the pam_pwhistory line with pam-config and verify that common-password and common-password-pc contain 'password required pam_pwhistory.so ... use_authtok'.

      pam-config -a --pwhistory --pwhistory-use_authtok
      grep pam_pwhistory /etc/pam.d/common-password /etc/pam.d/common-password-pc

      If the line uses a control other than required, change it to required in /etc/pam.d/common-password-pc.
  - id: "CIS-SUSE16-5.3.2.4.1-pam_unix_nullok"
    name: "pam unix nullok: pam-config --query --unix --unix-nullok"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.4.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pam-config --query --unix --unix-nullok
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*nullok" }
    rationale: &rat-09c8500cf8 |
      The nullok option lets pam_unix accept accounts with an empty password field, so such accounts can log in without any password. Removing it ensures every account must authenticate with a password.
    remediation: &rem-d687f8c702 |
      Remove the nullok option from pam_unix with pam-config and verify it.

      pam-config -d --unix-nullok
      pam-config --query --unix

      Accounts with an empty password can no longer log in afterwards; set passwords or lock them first.
  - id: "CIS-SUSE16-5.3.2.4.2-pam_unix_remember_root"
    name: "pam unix remember root: grep -Pi '^\\h*password\\h+([^#\\n\\r]+\\h+)?pam_unix\\.so\\b' /etc/pam.d/* | grep -Pv '\\brememb…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.4.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Pi '^\h*password\h+([^#\n\r]+\h+)?pam_unix\.so\b' /etc/pam.d/* | grep -Pv '\bremember=\d\b'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*pam_unix.*remember" }
    rationale: &rat-f3b8ef5104 |
      The remember option of pam_unix keeps password history in /etc/security/opasswd in a legacy way. Password history should be handled only by pam_pwhistory, so that one consistent policy, including for root, is applied.
    remediation: &rem-e01462f612 |
      Remove remember= from every pam_unix password line the check lists and configure history with pam_pwhistory instead.

      grep -Pi '^\h*password\h+([^#\n\r]+\h+)?pam_unix\.so\b' /etc/pam.d/*
      sed -ri '/pam_unix\.so/s/\s+remember=[0-9]+//' /etc/pam.d/FILE

      For /etc/pam.d/common-password edit common-password-pc, the file it links to.
  - id: "CIS-SUSE16-5.3.2.4.3-pam_unix_password_use_pam"
    name: "pam unix password use pam: pam-config --query --unix --unix-sha512"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.4.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pam-config --query --unix --unix-sha512
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ auth: .*(sha512|yesencrypt)" }
      - { some: "~ account: .*(sha512|yesencrypt)" }
      - { some: "~ password: .*(sha512|yesencrypt)" }
      - { some: "~ session: .*(sha512|yesencrypt)" }
    rationale: &rat-5d7782df0e |
      Passwords stored with a weak or legacy hash can be cracked quickly once the shadow file is exposed. Configuring pam_unix to hash new passwords with SHA-512 makes offline brute-force and dictionary attacks against stolen hashes considerably more expensive.
    remediation: &rem-16aec5bf0f |
      Enable the SHA-512 option of pam_unix with pam-config, then confirm it with the query command.

      pam-config --add --unix-sha512
      pam-config --query --unix --unix-sha512

      Only passwords set after the change are stored as SHA-512; existing users keep their old hash until they change their password.
  - id: "CIS-SUSE16-5.3.2.4.4-pam_unix_authtok"
    name: "pam unix authtok: grep -P -- '^\\h*password\\h+([^#\\n\\r]+)\\h+pam_unix\\.so\\h+([^#\\n\\r]+\\h+)?use_authtok\\b' /et…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.3.2.4.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -P -- '^\h*password\h+([^#\n\r]+)\h+pam_unix\.so\h+([^#\n\r]+\h+)?use_authtok\b' /etc/pam.d/common*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ password:password\\s*required\\s*pam_unix.so.*use_authtok" }
      - { some: "~ password-pc:password\\s*required\\s*pam_unix.so.*use_authtok" }
    rationale: &rat-14986774d5 |
      When a password quality module such as pam_pwquality checks a new password, pam_unix should store exactly that password instead of prompting again. The use_authtok option forces this, so the complexity rules cannot be bypassed by entering a different password at a second prompt.
    remediation: &rem-f9ec3d0bbc |
      Make sure the pam_unix line of the password stack in /etc/pam.d/common-password-pc (common-password is a symlink to it) uses the control value required and contains use_authtok. pam-config adds use_authtok automatically when a password quality module is enabled:

      pam-config --add --pwquality
      grep -P '^\h*password\h+required\h+pam_unix\.so\b.*\buse_authtok\b' /etc/pam.d/common-password-pc

      If the line is still missing use_authtok, edit it to read, for example, "password required pam_unix.so use_authtok nullok shadow try_first_pass". Manual edits to the -pc files are overwritten the next time pam-config runs.
  - id: "CIS-SUSE16-5.4.1.1-login_defs_max_days-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-de28e65ea9 |
      A maximum password age limits how long a compromised password remains useful to an attacker who obtained it unnoticed. PASS_MAX_DAYS sets the default maximum for new passwords; 365 days or less forces periodic renewal without the counterproductive effects of very frequent changes.
    remediation: &rem-0b6bdc1798 |
      Create /etc/login.defs.
  - id: "CIS-SUSE16-5.4.1.1-login_defs_max_days-content"
    name: "/etc/login.defs has the expected content (3 rules)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_MAX_DAYS\\s+365" }
      - { none: "~ ^PASS_MAX_DAYS\\s+(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9][0-9][0-9]|[1-9][0-9][0-9][0-9][0-9])" }
      - { none: "~ ^PASS_MAX_DAYS\\s+-1" }
    rationale: *rat-de28e65ea9
    remediation: &rem-f1c03a2be4 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_MAX_DAYS\s+365
      - no line matches ^PASS_MAX_DAYS\s+(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9][0-9][0-9]|[1-9][0-9][0-9][0-9][0-9])
      - no line matches ^PASS_MAX_DAYS\s+-1
  - id: "CIS-SUSE16-5.4.1.1-check_user_expiry"
    name: "check user expiry: grep -E '^[^:]+:[^!*]' /etc/shadow | cut -d: -f1,5"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E '^[^:]+:[^!*]' /etc/shadow | cut -d: -f1,5
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*:([0-9]|[1-9][0-9]|[1-2][0-9][0-9]|3[1-5][0-9]|36[0-5])$" }
    rationale: &rat-ce451c4e8f |
      Passwords that never expire stay valid indefinitely after being disclosed, phished or cracked. A maximum password age of at most 365 days limits how long a compromised password can be used. The exact interval should follow site policy.
    remediation: &rem-995944b710 |
      Set the maximum password age to 365 days or less for new accounts and for each existing account with a password.

      sed -ri 's/^\s*PASS_MAX_DAYS\s+.*/PASS_MAX_DAYS 365/' /etc/login.defs
      chage --maxdays 365 USER

      List accounts and their current value with: awk -F: '$2 ~ /^[^!*]/ {print $1 ":" $5}' /etc/shadow. On SUSE 16, copy /usr/etc/login.defs to /etc/login.defs first if it does not exist.
  - id: "CIS-SUSE16-5.4.1.2-login_defs_min_days-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d3716bb90c |
      A minimum password age prevents users from changing their password several times in a row to get back to an old favourite, which would defeat password history. PASS_MIN_DAYS of at least one day sets this default for new passwords.
    remediation: *rem-0b6bdc1798
  - id: "CIS-SUSE16-5.4.1.2-login_defs_min_days-content"
    name: "/etc/login.defs has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_MIN_DAYS\\s[1-9]" }
      - { none: "~ ^PASS_MIN_DAYS\\s0" }
    rationale: *rat-d3716bb90c
    remediation: &rem-a762cb4ca6 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_MIN_DAYS\s[1-9]
      - no line matches ^PASS_MIN_DAYS\s0
  - id: "CIS-SUSE16-5.4.1.2-check_users_MIN_DAYS"
    name: "check users MIN DAYS: grep -E '^[^:]+:[^!*]' /etc/shadow | cut -d: -f1,4"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E '^[^:]+:[^!*]' /etc/shadow | cut -d: -f1,4
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*:1" }
    rationale: &rat-97fb70a127 |
      Without a minimum password age, a user forced to change a password can immediately change it several more times to cycle through the history and return to the old one. A minimum age of at least one day makes password history effective.
    remediation: &rem-3293cbd487 |
      Set a minimum password age of 1 day for new accounts and for each existing account with a password.

      [ -e /etc/login.defs ] || cp /usr/etc/login.defs /etc/login.defs
      sed -ri 's/^\s*PASS_MIN_DAYS\s+.*/PASS_MIN_DAYS 1/' /etc/login.defs
      chage --mindays 1 USER
  - id: "CIS-SUSE16-5.4.1.3-login_defs_warn_age-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ca921e80d6 |
      Warning users several days before their password expires gives them time to choose a good new password instead of being forced into a hasty choice or being locked out. PASS_WARN_AGE sets the default warning period for new passwords.
    remediation: *rem-0b6bdc1798
  - id: "CIS-SUSE16-5.4.1.3-login_defs_warn_age-content"
    name: "/etc/login.defs has the expected content (3 rules)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_WARN_AGE\\s+7$" }
      - { some: "~ ^PASS_WARN_AGE\\s+(7|[1-9][0-9]{1,3})$" }
      - { none: "~ ^PASS_WARN_AGE\\s+[1-6]$" }
    rationale: *rat-ca921e80d6
    remediation: &rem-b04f715e69 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_WARN_AGE\s+7$
      - a line matches ^PASS_WARN_AGE\s+(7|[1-9][0-9]{1,3})$
      - no line matches ^PASS_WARN_AGE\s+[1-6]$
  - id: "CIS-SUSE16-5.4.1.3-check_users_MAX_DAYS"
    name: "check users MAX DAYS: grep -E '^[^:]+:[^!*]' /etc/shadow | cut -d: -f1,6"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E '^[^:]+:[^!*]' /etc/shadow | cut -d: -f1,6
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*:([7-9]|[1-9][0-9]{1,})$" }
      - { none: "~ ^.*:[1-6]$" }
    rationale: &rat-ef3c15217c |
      Users should be warned several days before their password expires so they can change it in time instead of being locked out or choosing a weak replacement in a hurry. Most variants of this check verify a warning period of at least 7 days; the RHEL 8 variant verifies a maximum password age between 1 and 365 days, which limits how long a compromised password stays valid.
    remediation: &rem-1bd75905f9 |
      Set a password expiry warning of at least 7 days for new accounts and for each existing account with a password.

      [ -e /etc/login.defs ] || cp /usr/etc/login.defs /etc/login.defs
      sed -ri 's/^\s*PASS_WARN_AGE\s+.*/PASS_WARN_AGE 7/' /etc/login.defs
      chage --warndays 7 USER
  - id: "CIS-SUSE16-5.4.1.4-login_defs_hashing-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.1.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-281f6b805c |
      Password hashes in /etc/shadow are a prime target once an attacker gains read access. Strong, slow algorithms such as SHA-512 crypt or yescrypt make offline cracking far more expensive than legacy MD5 or DES hashes. ENCRYPT_METHOD sets the algorithm used by tools that read login.defs.
    remediation: *rem-0b6bdc1798
  - id: "CIS-SUSE16-5.4.1.4-login_defs_hashing-content"
    name: "/etc/login.defs has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.1.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect: { some: "~ ^ENCRYPT_METHOD (SHA512|YESCRYPT)" }
    rationale: *rat-281f6b805c
    remediation: &rem-87e3ee7c64 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^ENCRYPT_METHOD (SHA512|YESCRYPT)
  - id: "CIS-SUSE16-5.4.1.5-inactive_passwd"
    name: "inactive passwd: useradd -D | grep INACTIVE"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      useradd -D | grep INACTIVE
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^INACTIVE=([1-9]|[0-3][0-9]|4[0-5])" }
    rationale: &rat-1b1499cc8f |
      The default INACTIVE value used by useradd defines how many days after password expiry an account is disabled. Disabling unused accounts automatically removes forgotten access paths that attackers like to exploit; a value of up to 30 or 45 days, depending on the policy, balances security and usability.
    remediation: &rem-728ced36b8 |
      Set the default password inactivity period for new accounts to 30 days and apply the same value to existing accounts that have a password.

      useradd -D -f 30
      useradd -D | grep INACTIVE
      chage --inactive 30 USER

      30 days satisfies every supported release; some releases also accept up to 45 days.
  - id: "CIS-SUSE16-5.4.1.5-inactive_users"
    name: "inactive users: awk -F':' '($2~/^\\\\$.+\\\\$/) {if($7 \u003e 45 || $7 \u003c 0)print $1 }' /etc/shadow"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F':' '($2~/^\\$.+\\$/) {if($7 > 45 || $7 < 0)print $1 }' /etc/shadow
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-c4a4e8be14 |
      Accounts whose password has expired but which remain usable indefinitely are a common foothold for attackers because nobody notices their misuse. Setting a password inactivity period on every account with a password ensures that such accounts are disabled automatically after expiry.
    remediation: &rem-4e712889d3 |
      Set a password inactivity period of 30 days or less on every account that has a password, in particular on each account reported by the check.

      awk -F: '($2 ~ /^\$/) {print $1, $7}' /etc/shadow
      chage --inactive 30 USER

      Set the default for new accounts as well with useradd -D -f 30.
  - id: "CIS-SUSE16-5.4.1.6-passwd_chg_past"
    name: "No user has a last password change date in the future"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.1.6. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      now=$(date +%s)
      for usr in $(cut -d: -f1 /etc/shadow); do
        d=$(chage --list "$usr" 2>/dev/null | awk -F': ' '/^Last password change/ {print $2}')
        case "$d" in ""|never|*"must be changed"*) continue ;; esac
        t=$(date -d "$d" +%s 2>/dev/null) || { echo "$usr: cannot parse last password change '$d'"; continue; }
        if [ "$t" -gt "$now" ]; then echo "$usr: last password change $d is in the future"; fi
      done
    expect: empty
    rationale: &rat-eae9c8e6b4 |
      If the recorded date of the last password change lies in the future, password ageing does not work: the password never expires and the user cannot be forced to change it. Such dates usually result from a wrong system clock or manual edits and should be corrected.
    remediation: &rem-8950b282e3 |
      Check the system clock, then set the last password change of every listed user to today, or expire the password so it must be changed at the next login:

      chage --lastday "$(date +%Y-%m-%d)" USER
      chage --lastday 0 USER
  - id: "CIS-SUSE16-5.4.2.1-uid_0_check"
    name: "uid 0 check: awk -F: '($3 == 0) { print $1 }' /etc/passwd"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.2.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3 == 0) { print $1 }' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root" }
      - { none: "~ [^root]" }
    rationale: &rat-90d4d66c1b |
      Any account with UID 0 has full root privileges, regardless of its name. Additional UID 0 accounts are a classic backdoor and make it impossible to attribute administrative actions; only root should have UID 0.
    remediation: &rem-5c4a8fc9e4 |
      Make sure that only root has UID 0. Find out what every other UID 0 account is used for, then give it a unique non-zero UID with vipw or remove it.

      awk -F: '($3 == 0) {print $1}' /etc/passwd
      vipw
      userdel USER

      usermod -u cannot be used here because the running root processes share UID 0. Also make sure that root itself has UID 0.
  - id: "CIS-SUSE16-5.4.2.2-gid_0_check"
    name: "gid 0 check: awk -F: '($1 !~ /^(root|sync|shutdown|halt|operator)$/ \u0026\u0026 $4 == 0) {print $1}' /etc/passwd"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.2.2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($1 !~ /^(root|sync|shutdown|halt|operator)$/ && $4 == 0) {print $1}' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-86032dcad6 |
      Group ID 0 is the root group, which owns many sensitive files and directories. Any other account with primary group 0 can read or modify those resources with root-group rights, far beyond its role. Only root should have GID 0 as primary group, which keeps root-group access deliberate and auditable.
    remediation: &rem-d5614bed37 |
      Give every account reported by the check a different primary group and make sure root itself has primary group 0.

      usermod -g GROUP USER
      usermod -g 0 root

      Afterwards review files the account created with group 0: find / -xdev -user USER -group 0
  - id: "CIS-SUSE16-5.4.2.3-group_root_only_0"
    name: "group root only 0: awk -F: '$3=='0'{print $1\":\"$3}' /etc/group"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.2.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '$3=='0'{print $1":"$3}' /etc/group
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root:0" }
    rationale: &rat-e6e96aa117 |
      GID 0 is the root group, which owns many sensitive system files and directories. Any other group with GID 0 silently gives its members the same group access as root. Ensuring that only the group named root has GID 0 prevents such hidden privilege.
    remediation: &rem-481abd2b91 |
      Make sure the group root has GID 0 and give every other group that the check reports with GID 0 its own unused GID, or remove it if it is not needed.

      awk -F: '$3 == 0' /etc/group
      groupmod -g NEWGID GROUP

      Files keep GID 0 and therefore stay owned by the group root. Review the members of GROUP before changing it. If root itself does not have GID 0, fix it with groupmod -g 0 root after the other groups are moved.
  - id: "CIS-SUSE16-5.4.2.4-root_passwd_set"
    name: "root passwd set: passwd -S root | awk '$2 ~ /^P/ {print \"OK Password\"}'"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.2.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      passwd -S root | awk '$2 ~ /^P/ {print "OK Password"}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK Password" }
    rationale: &rat-dc1e5c0dc5 |
      If root has no password, anyone with local access, for example through the console or single-user mode, can become root without authentication. A set password, or a locked root account where administrators use sudo, ensures that root access requires a credential.
    remediation: &rem-c94fa31bf9 |
      Set a strong password for root.

      passwd root

      Where the check also accepts a locked account (status L), passwd -l root is an alternative if administrators use sudo.
  - id: "CIS-SUSE16-5.4.2.5-root_path_check"
    name: "root path check: /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.2.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e 's/:/\n/g'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^\\.$" }
      - { none: "~ ^$" }
    rationale: &rat-ee503b897e |
      If root's PATH contains the current directory, empty entries, relative paths or directories that other users can write to, a malicious program placed there can be executed with root privileges when an administrator types a common command name. Root's PATH should contain only absolute, root-owned and non-writable directories.
    remediation: &rem-0afab9f1f3 |
      Remove the current directory (.), empty entries (leading, trailing or double colons), relative paths and non-existent directories from root's PATH, and make sure every remaining directory is owned by root and not writable by group or others. Look for PATH assignments in root's and the system-wide shell startup files.

      su - root -c 'echo "$PATH"'
      grep -sn 'PATH' /root/.bash_profile /root/.bashrc /root/.profile /etc/profile /etc/bashrc /etc/bash.bashrc /etc/environment /etc/profile.d/*.sh
      chown root DIRECTORY
      chmod go-w DIRECTORY
  - id: "CIS-SUSE16-5.4.2.6-root_umask_bash_profile"
    name: "root umask bash profile: grep -i umask /root/.bash_profile /root/bashrc"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.2.6. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i umask /root/.bash_profile /root/bashrc
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*:umask 00(2|7)7" }
    rationale: &rat-623cb7f319 |
      The umask determines the permissions of files root creates. With a permissive umask, configuration files, scripts or logs written by root can end up readable or writable by other users, leaking secrets or allowing tampering. Setting umask 027 or 077 in root's shell startup files keeps new files private by default.
    remediation: &rem-25f34f55b9 |
      Add umask 0027 (or 0077) at the start of a line in both /root/.bashrc and /root/.bash_profile. If /root/.bash_profile does not exist yet, create it so that it still loads /root/.profile.

      echo 'umask 0027' >> /root/.bashrc
      [ -e /root/.bash_profile ] || echo '[ -f ~/.profile ] && . ~/.profile' > /root/.bash_profile
      echo 'umask 0027' >> /root/.bash_profile

      Several variants fail when one of the files is missing, and the line must not be indented. Debian 13 reads /root/.profile instead of /root/.bash_profile; add the line there as well (echo 'umask 0027' >> /root/.profile).
  - id: "CIS-SUSE16-5.4.2.7-secure_system_accts"
    name: "secure system accts: awk -F: '$3\u003c1000' /etc/passwd | grep -Ev 'root|sync|halt|shutdown|nfsnobody|/sbin/nologin…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.2.7. NIST SP 800-53 Rev. 5: AC-2(5), AC-3, AC-11, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '$3<1000' /etc/passwd | grep -Ev 'root|sync|halt|shutdown|nfsnobody|/sbin/nologin|/bin/false'
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-6f6bd67ce7 |
      System and service accounts do not need an interactive shell. If one of them has a valid login shell, a weakness in a service or a misconfigured password can give an attacker an interactive session under that account. Setting the shell to nologin prevents this.
    remediation: &rem-27c8a0da0c |
      Set the login shell of every system account reported by the check to /usr/sbin/nologin.

      awk -F: '($3 < 1000) {print $1, $7}' /etc/passwd
      usermod -s /usr/sbin/nologin USER

      Accounts root, sync, shutdown and halt are exempt. Make sure no service needs an interactive shell for the account before changing it.
  - id: "CIS-SUSE16-5.4.2.8-invalid_shell_lock_accts"
    name: "invalid shell lock accts: l_valid_shells=\"^($(awk -F\\/ '$NF != \"nologin\" {print}' /etc/shells | sed -rn '/^\\//{s,/,…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.2.8. NIST SP 800-53 Rev. 5: AC-2(5), AC-3, AC-11, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      l_valid_shells="^($(awk -F\/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\\\/,g;p}' | paste -s -d '|' - ))$";
      for user in `awk -v pat="$l_valid_shells" -F: '($1 != "root" && $(NF) !~ pat) {print $1}' /etc/passwd`;
      do passwd -S $user | awk '$2 != "L" {print $1" Not Locked"}' 2>&1 >> test;
      done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-33e08eca35 |
      Accounts without a valid login shell, typically service and system accounts, are not meant for interactive use. If such an account still has a usable password, it can be abused for authentication through services that do not depend on the shell, such as FTP or some PAM-based logins. Locking these accounts removes that path.
    remediation: &rem-21f9a32169 |
      Lock every non-root account whose shell is not a valid login shell (nologin, /bin/false or a shell not listed in /etc/shells). List the candidates, review them, and lock each one:

      awk -F: '$1 != "root" && $7 ~ /(nologin|false)$/ {print $1}' /etc/passwd | xargs -r -n1 passwd -S
      usermod -L USER

      passwd -S shows L in the second column for locked accounts.
  - id: "CIS-SUSE16-5.4.3.1-nologin_not_in_shells-attrs"
    name: "/etc/shells: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/shells'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1371eb889f |
      /etc/shells lists valid login shells. Some services, such as FTP daemons or chsh, allow access only for accounts with a shell listed there. If nologin is listed, accounts that are meant to be blocked may be treated as having a valid shell and gain access through such services.
    remediation: &rem-fa056f672c |
      Create /etc/shells.
  - id: "CIS-SUSE16-5.4.3.1-nologin_not_in_shells-content"
    name: "/etc/shells has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse16, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/shells'
    allow_rc: any
    expect: { none: "~ .*nologin" }
    rationale: *rat-1371eb889f
    remediation: &rem-852b96f5ad |
      Edit /etc/shells so that its lines meet these conditions (regular expressions):

      - no line matches .*nologin
  - id: "CIS-SUSE16-5.4.3.2-check_timeout"
    name: "check timeout: grep TMOUT /etc/profile.d/*.sh /etc/profile /etc/profile.d/*.sh| cut -d \":\" -f2"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.3.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep TMOUT /etc/profile.d/*.sh /etc/profile /etc/profile.d/*.sh| cut -d ":" -f2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(readonly |)TMOUT" }
      - { some: "~ TMOUT=([1-8][0-9]{0,2}|900)$" }
      - { some: "~ export TMOUT" }
    rationale: &rat-e92d54c805 |
      An interactive shell left open on an unattended terminal can be used by anyone passing by. TMOUT makes the shell exit automatically after a period of inactivity. Marking it readonly and exporting it prevents users from disabling the timeout in their own session; long-running interactive work may need to account for it.
    remediation: &rem-d216d7a191 |
      Set an idle timeout of 900 seconds or less in a profile script and make it readonly and exported.

      printf '%s\n' 'TMOUT=900' 'readonly TMOUT' 'export TMOUT' > /etc/profile.d/50-tmout.sh

      Remove other TMOUT settings with larger or zero values from /etc/profile, /etc/bashrc and /etc/profile.d. The timeout applies to new login shells.
  - id: "CIS-SUSE16-5.4.3.3-umask_profile_scripts"
    name: "umask profile scripts: grep -i \"^\\s*umask\" /etc/profile /etc/profile.d/*.sh /etc/login.defs /etc/default/login /…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.3.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i "^\s*umask" /etc/profile /etc/profile.d/*.sh /etc/login.defs /etc/default/login /etc/pam.d/postlogin 2>&1 | grep -i umask | cut -d ":" -f1,2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*(?i)umask\\s+0[2-7][7]" }
      - { none: "~ .*(?i)umask\\s+[7][0-1][0-6]" }
    rationale: &rat-0e0a7af57b |
      The umask set in shell profile scripts determines the permissions of files that users create. A permissive umask such as 022 makes new files readable by everyone, which can expose sensitive data. A system-wide umask of 027 or stricter removes access for other users by default.
    remediation: &rem-055c359aea |
      Set a system-wide umask of 027 in a profile script.

      echo 'umask 027' > /etc/profile.d/50-umask.sh

      The setting applies to new login shells.
  - id: "CIS-SUSE16-5.4.3.4-umask_profile_d"
    name: "umask profile d: grep -Pi -- '^\\h*umask\\h+0[2-7][7]\\b' /etc/profile.d/60-default_umask.sh"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 5.4.3.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Pi -- '^\h*umask\h+0[2-7][7]\b' /etc/profile.d/60-default_umask.sh
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ umask\\s+0[2-7][7]" }
    rationale: &rat-31a09a0f51 |
      The umask determines the default permissions of new files and directories. A permissive umask such as 022 makes user files readable by everyone. A default of 027 keeps new files private to the owner and group and inaccessible to others.
    remediation: &rem-89572aedca |
      Create /etc/profile.d/60-default_umask.sh with a umask of 027 (or stricter).

      printf '%s\n' 'umask 027' > /etc/profile.d/60-default_umask.sh

      The setting applies to new login shells. Check other startup files (/etc/profile, /etc/bash.bashrc, /etc/login.defs) for a less restrictive umask set later.
  - id: "CIS-SUSE16-6.1.1.1-systemd-journald-enabled"
    name: "Service systemd-journald is enabled"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journald | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-aa9c4cf1bc |
      systemd-journald collects kernel, service and user log messages and passes them to persistent storage or syslog. If it is not running, events from services and the kernel are lost, leaving gaps in the audit trail. It is a static unit that is always started by systemd.
    remediation: &rem-509c775265 |
      Enable the service systemd-journald:

      systemctl enable systemd-journald
  - id: "CIS-SUSE16-6.1.1.1-systemd-journald-running"
    name: "Service systemd-journald is running"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journald | cut -d= -f2
    expect: "== active"
    rationale: *rat-aa9c4cf1bc
    remediation: &rem-062cd16446 |
      Start the service systemd-journald:

      systemctl start systemd-journald
  - id: "CIS-SUSE16-6.1.1.2-systemd-journal-remote.service-enabled"
    name: "Service systemd-journal-remote.service is not enabled"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journal-remote.service | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-64ce008fa2 |
      systemd-journal-remote receives journal data from other hosts over the network. On a system that is not a central log collector, running it exposes an unneeded network service and lets other machines write data to local disk. Keeping it stopped and disabled reduces the attack surface.
    remediation: &rem-1e8349ef72 |
      Disable the service systemd-journal-remote.service, unless the system needs it:

      systemctl disable systemd-journal-remote.service

      To keep other units from starting it, mask it instead: systemctl mask systemd-journal-remote.service
  - id: "CIS-SUSE16-6.1.1.2-systemd-journal-remote.service-running"
    name: "Service systemd-journal-remote.service is not running"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journal-remote.service | cut -d= -f2
    expect: "!= active"
    rationale: *rat-64ce008fa2
    remediation: &rem-247935200f |
      Stop the service systemd-journal-remote.service, unless the system needs it:

      systemctl stop systemd-journal-remote.service
  - id: "CIS-SUSE16-6.1.1.2-systemd-journal-remote.socket-enabled"
    name: "Service systemd-journal-remote.socket is not enabled"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journal-remote.socket | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-87dd56fa7c |
      systemd-journal-remote.socket accepts journal data from other hosts over the network. Only a designated log collector should listen for it; on other systems it is an unnecessary network service that could receive forged logs or be used to fill the disk.
    remediation: &rem-6593464f6f |
      Disable the service systemd-journal-remote.socket, unless the system needs it:

      systemctl disable systemd-journal-remote.socket

      To keep other units from starting it, mask it instead: systemctl mask systemd-journal-remote.socket
  - id: "CIS-SUSE16-6.1.1.2-systemd-journal-remote.socket-running"
    name: "Service systemd-journal-remote.socket is not running"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journal-remote.socket | cut -d= -f2
    expect: "!= active"
    rationale: *rat-87dd56fa7c
    remediation: &rem-965b15f40c |
      Stop the service systemd-journal-remote.socket, unless the system needs it:

      systemctl stop systemd-journal-remote.socket
  - id: "CIS-SUSE16-6.1.1.2-journald_remote_service_masked"
    name: "journald remote service masked: systemctl is-enabled systemd-journal-remote.service"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl is-enabled systemd-journal-remote.service
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ ^masked" }
    rationale: &rat-54d8298e17 |
      systemd-journal-remote receives log data from other hosts over the network. On systems that are not central log collectors it only adds a listening service and a way for remote parties to fill the disk or inject log entries. Masking it prevents it from being started, even as a dependency.
    remediation: &rem-51e3cfb874 |
      Stop and mask both the systemd-journal-remote socket and service.

      systemctl stop systemd-journal-remote.socket systemd-journal-remote.service
      systemctl mask systemd-journal-remote.socket systemd-journal-remote.service

      Do not apply this on a host that is meant to collect journals from other systems.
  - id: "CIS-SUSE16-6.1.1.2-journald_remote_socket_masked"
    name: "journald remote socket masked: systemctl is-enabled systemd-journal-remote.socket"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl is-enabled systemd-journal-remote.socket
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ ^masked" }
    rationale: *rat-54d8298e17
    remediation: *rem-51e3cfb874
  - id: "CIS-SUSE16-6.1.1.3-journald_compress"
    name: "journald compress: grep -i compress /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.1.3. NIST SP 800-53 Rev. 5: AU-4."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i compress /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ (?i)^.*:Compress\\s*=\\s*yes" }
      - { none: "~ (?i)^.*:Compress\\s*=\\s*no" }
    rationale: &rat-3fb044d452 |
      Compressing large journal entries reduces the disk space used by logs. This lowers the risk that the log partition fills up, which could cause loss of log data or affect system stability.
    remediation: &rem-c6611d9f0f |
      Enable compression in a journald drop-in file and restart journald. Make sure no other journald configuration file sets Compress=no.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nCompress=yes\n' > /etc/systemd/journald.conf.d/60-compress.conf
      systemctl restart systemd-journald
  - id: "CIS-SUSE16-6.1.1.4-journald_storage"
    name: "journald storage: grep -i storage /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.1.4. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i storage /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ (?i)^.*:Storage\\s*=\\s*persistent" }
      - { none: "~ (?i)^.*:Storage\\s*=\\s*none" }
    rationale: &rat-9f7a35ef11 |
      With Storage=persistent, journald writes logs to /var/log/journal on disk instead of keeping them only in memory. Otherwise all journal entries are lost at reboot, including evidence of what happened before a crash or an attack.
    remediation: &rem-592966d732 |
      Make journald store logs persistently on disk with a drop-in file and restart journald. Make sure no other journald configuration file sets Storage=none.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nStorage=persistent\n' > /etc/systemd/journald.conf.d/60-storage.conf
      systemctl restart systemd-journald
  - id: "CIS-SUSE16-6.1.2.1-rsyslog"
    name: "Package rsyslog is installed"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.2.1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet rsyslog
    expect: true
    rationale: &rat-ec4e2f2832 |
      rsyslog collects log messages from the kernel, services and applications, writes them to files and can forward them to a central log server. Without an installed, enabled and running syslog daemon, security-relevant events are not recorded in a durable way and incidents cannot be investigated.
    remediation: &rem-3580819b11 |
      Install the package rsyslog:

      zypper install rsyslog
  - id: "CIS-SUSE16-6.1.2.2-rsyslog-enabled"
    name: "Service rsyslog is enabled"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.2.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState rsyslog | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-ec4e2f2832
    remediation: &rem-092ce033e4 |
      Enable the service rsyslog:

      systemctl enable rsyslog
  - id: "CIS-SUSE16-6.1.2.2-rsyslog-running"
    name: "Service rsyslog is running"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.2.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState rsyslog | cut -d= -f2
    expect: "== active"
    rationale: *rat-ec4e2f2832
    remediation: &rem-e1b56d94f4 |
      Start the service rsyslog:

      systemctl start rsyslog
  - id: "CIS-SUSE16-6.1.2.4-rsyslog_filecreatemode"
    name: "rsyslog filecreatemode: grep -P '^\\$FileCreateMode' /etc/rsyslog.conf /etc/rsyslog.d/*.conf"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.2.4. NIST SP 800-53 Rev. 5: AC-3, AC-6, MP-2."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -P '^\$FileCreateMode' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^\\$FileCreateMode\\s+0?640" }
    rationale: &rat-3874caf5b4 |
      rsyslog creates new log files with the mode set by $FileCreateMode. A permissive mode lets ordinary users read log files containing sensitive information. Setting it to 0640 or stricter restricts new log files to root and the log group.
    remediation: &rem-f775bc0005 |
      Set $FileCreateMode 0640 in the rsyslog configuration and restart rsyslog.

      printf '%s\n' '$FileCreateMode 0640' > /etc/rsyslog.d/00-filecreatemode.conf
      systemctl restart rsyslog

      The directive only applies to file actions defined after it, so it must be read before the log file rules (rsyslog.d files are usually included before them in /etc/rsyslog.conf).
  - id: "CIS-SUSE16-6.1.2.7-rsyslog_no_imtcp"
    name: "rsyslog no imtcp: grep -P '^\\s*\\$ModLoad\\s+imtcp|^\\s*\\$InputTCPServerRun' /etc/rsyslog.conf /etc/rsyslog.d/…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.2.7. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12, CM-6."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -P '^\s*\$ModLoad\s+imtcp|^\s*\$InputTCPServerRun' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    expect: { rc: "in [1, 2]" }
    rationale: &rat-46b942ef21 |
      Loading the rsyslog TCP input module makes the host accept log messages from the network. Unless the system is a designated log server, this is an unnecessary listening service that can be used to flood the disk or inject false log entries.
    remediation: &rem-49cab55fb2 |
      Remove or comment out the TCP input configuration in /etc/rsyslog.conf and /etc/rsyslog.d/*.conf, then restart rsyslog.

      grep -nE '^\s*(\$ModLoad\s+imtcp|\$InputTCPServerRun|module\(load="imtcp"|input\(type="imtcp")' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      sed -ri 's/^\s*(\$ModLoad\s+imtcp|\$InputTCPServerRun)/# &/' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      systemctl restart rsyslog

      Also comment out RainerScript forms (module(load="imtcp"), input(type="imtcp" ...)) found by the grep. Keep the module only on designated log servers.
  - id: "CIS-SUSE16-6.1.2.9-rsyslog-module-gtls"
    name: "Package rsyslog-module-gtls is installed"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.2.9."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      rpm -q --quiet rsyslog-module-gtls
    expect: true
    rationale: &rat-8f16a5c3c2 |
      Syslog over plain TCP or UDP sends log data unencrypted and unauthenticated, so it can be read or altered in transit and the receiver cannot verify its peer. The rsyslog GnuTLS module provides TLS encryption and certificate authentication for remote logging.
    remediation: &rem-2608caf72e |
      Install the package rsyslog-module-gtls:

      zypper install rsyslog-module-gtls
  - id: "CIS-SUSE16-6.1.2.10-rsyslog_gtls_configured"
    name: "rsyslog gtls configured: grep -P '^\\$DefaultNetstreamDriver\\s+gtls' /etc/rsyslog.conf /etc/rsyslog.d/*.conf"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.2.10."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -P '^\$DefaultNetstreamDriver\s+gtls' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^\\$DefaultNetstreamDriver\\s+gtls" }
    rationale: &rat-a702249d73 |
      Logs sent to a remote server in plain text can be intercepted or modified on the way and may reveal sensitive information. Using the gtls network stream driver encrypts the connection and lets both ends authenticate each other with certificates.
    remediation: &rem-660f93abd9 |
      Configure rsyslog to use the gtls stream driver for forwarding and restart it.

      cat > /etc/rsyslog.d/60-tls.conf <<'EOF'
      $DefaultNetstreamDriver gtls
      $DefaultNetstreamDriverCAFile /etc/rsyslog.d/tls/ca.pem
      $DefaultNetstreamDriverCertFile /etc/rsyslog.d/tls/cert.pem
      $DefaultNetstreamDriverKeyFile /etc/rsyslog.d/tls/key.pem
      $ActionSendStreamDriverMode 1
      $ActionSendStreamDriverAuthMode x509/name
      *.* @@LOGHOST:6514
      EOF
      systemctl restart rsyslog

      Requires the rsyslog-module-gtls package. Replace LOGHOST and the certificate paths with your own.
  - id: "CIS-SUSE16-6.1.3.1-logfile_permissions_cloud_init"
    name: "logfile permissions cloud init: find /var/log -type f -regextype posix-extended -regex '/var/log/(cloud-init\\.log.*|local…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.1.3.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /var/log -type f -regextype posix-extended -regex '/var/log/(cloud-init\.log.*|localmessages.*|waagent\.log.*)' -not -path '/var/log/apt/*' \( -perm /0133 -o \( -not -user root -a -not -user syslog \) -o \( -not -group root -a -not -group adm \) \) -ls
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .+" }
    rationale: &rat-2ac94bf3a9 |
      Log files contain authentication events, user names, addresses and sometimes sensitive data. If other users can read them, information leaks; if they can write them, attackers can hide or forge evidence. Each log file should have restrictive permissions and an appropriate owner and group.
    remediation: &rem-301842edc5 |
      For each cloud-init, localmessages or waagent log file the check reports, set mode 0644 or stricter, an owner of root or syslog and a group of root or adm.

      chmod u-x,go-wx FILE
      chown root:root FILE

      If the program or logrotate recreates the file with other permissions, also fix its configuration (e.g. the create directive in /etc/logrotate.d/).
