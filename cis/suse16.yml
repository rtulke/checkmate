  - id: "CIS-SUSE16-6.2.3.24-cis_6_2_3_24_cnf"
    name: "cis 6 2 3 24 cnf: grep -E -- 'path=/etc/selinux' /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.24. NIST SP 800-53 Rev. 5: AU-12, CM-6."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E -- 'path=/etc/selinux' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ path=\\/etc\\/selinux -F perm=wa -k MAC-policy" }
    rationale: &rat-e01fb973aa |
      The SELinux configuration under /etc/selinux defines the mandatory access control policy and its enforcement mode. Unauthorised changes can weaken or disable this protection layer, so writes to it should be audited. This check looks for the rule in the persistent files under /etc/audit/rules.d/.
    remediation: &rem-ac4825d8c6 |
      Add a write/attribute watch on /etc/selinux (key MAC-policy), written with -a always,exit -F path= as the check expects, and load it.

      cat > /etc/audit/rules.d/50-MAC-policy.rules <<'EOF'
      -a always,exit -F path=/etc/selinux -F perm=wa -k MAC-policy
      EOF
      augenrules --load

      The check expects a path= rule; a recursive rule -a always,exit -F dir=/etc/selinux/ -F perm=wa -k MAC-policy can be added in addition to cover files below the directory. If the audit configuration is already immutable (-e 2), the new rules only become active after a reboot.
