name: CIS SUSE Linux Enterprise 16
version: "1.0.0"
description: >
  Automated checks for 315 recommendations of the CIS SUSE Linux Enterprise 16 benchmark
  (version 1.0.0), converted from the goss audit content of the
  ansible-lockdown project. Check names describe what is verified; the
  recommendation number is in the ID and the description. Select profiles
  with tags, e.g. `--tags cis-level-1+cis-server`.

defaults:
  when: "(facts.distro in [\"sles\", \"sled\", \"opensuse-leap\"] or \"suse\" in facts.distro_like) and facts.version_major == 16"
  timeout: 120s

checks:
  - id: "CIS-SUSE16-1.1.1.1-blacklist_cramfs"
    name: "blacklist cramfs: grep cramfs /etc/modprobe.d/*.conf"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.1.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep cramfs /etc/modprobe.d/*.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ blacklist cramfs" }
    rationale: &rat-ccac826208 |
      cramfs is a legacy compressed read-only file system mainly used on embedded devices. File system drivers parse untrusted on-disk structures inside the kernel, so a crafted image on a USB stick or a mounted file can trigger driver bugs. A blacklist entry stops the module from being loaded automatically when such media appears, which shrinks the kernel attack surface.
    remediation: &rem-57e7bbe836 |
      Add a blacklist entry for cramfs to /etc/modprobe.d/blacklist.conf so the module is not loaded automatically.

      echo 'blacklist cramfs' >> /etc/modprobe.d/blacklist.conf

      The Amazon Linux 2023 check reads exactly /etc/modprobe.d/blacklist.conf; the other checks accept any /etc/modprobe.d/*.conf file.
  - id: "CIS-SUSE16-1.1.1.1-cramfs"
    name: "cramfs: modprobe -n -v cramfs | grep -E '(cramfs|install)'"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 1.1.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v cramfs | grep -E '(cramfs|install)'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /bin/(false|true)" }
    rationale: &rat-9425c177af |
      cramfs is a legacy compressed read-only file system mainly used on embedded devices. Rarely used file system drivers are a common source of kernel vulnerabilities that can be reached simply by mounting a crafted image. Mapping the module to /bin/false makes every load attempt fail, including explicit modprobe calls, so the code never runs on this system.
    remediation: &rem-473336823d |
      Make every attempt to load cramfs run /bin/false instead, blacklist it, and unload it if it is currently loaded.

      printf '%s\n' 'install cramfs /bin/false' 'blacklist cramfs' > /etc/modprobe.d/cramfs.conf
      modprobe -r cramfs

      Use /bin/false rather than /usr/bin/false: the SUSE checks only accept that path. If the module is in use, unmount the file system first or reboot. The RHEL 7 and Ubuntu 18.04 variant of this check queries usb-storage instead of cramfs; add 'install usb-storage /bin/false' as well if that variant must pass.
  - id: "CIS-SUSE16-1.1.1.2-blacklist_firewire_core"
    name: "blacklist firewire core: grep firewire-core /etc/modprobe.d/*.conf"
