    name: "/etc/at.allow: exists, mode 0640 or stricter, owner root, group root"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 2.4.2.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/at.allow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7137)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-2e3d2702a4 |
      at.allow lists the users permitted to schedule one-time jobs with at. An allow list means new or unused accounts cannot schedule jobs, which limits a way to run deferred commands. The file must belong to root and not be writable by others, so users cannot grant themselves access.
    remediation: &rem-3f50401f2b |
      Create /etc/at.allow if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-rwx,a-t:

      chown root:root '/etc/at.allow'
      chmod u-xs,g-wxs,o-rwx,a-t '/etc/at.allow'
  - id: "CIS-SUSE16-2.4.2.1-at_deny_absent-absent"
    name: "/etc/at.deny does not exist"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 2.4.2.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse16, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      test -e '/etc/at.deny' || test -L '/etc/at.deny'
    expect: false
    rationale: &rat-ccf5dc7561 |
      With an allow list, only explicitly listed users may schedule jobs with at, which is safer than a deny list that lets every new or forgotten account do so. Removing at.deny ensures at.allow is the only access control.
    remediation: &rem-d7950be1a0 |
      Remove /etc/at.deny, unless the system needs it:

      rm '/etc/at.deny'
  - id: "CIS-SUSE16-2.4.3.1-timer_unit_perms"
    name: "timer unit perms: find /run/systemd/system /etc/systemd/system /usr/lib/systemd/system -type f -name '*.tim…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 2.4.3.1. NIST SP 800-53 Rev. 5: CM-6, CM-5, AC-6."
    tags: [cis, cis-suse16, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /run/systemd/system /etc/systemd/system /usr/lib/systemd/system -type f -name '*.timer' \( ! -user root -o ! -group root -o -perm /133 \) 2>/dev/null || true
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-304e7a0db2 |
      systemd unit files define which commands run as which user, often as root. If a unit file is not owned by root or is writable by group or others, a non-root user could change the command it starts and gain root privileges at the next start or trigger.
    remediation: &rem-c8a0e2cd60 |
      Set owner and group root and remove execute permission for the owner and write and execute permission for group and others on each .timer file the check reports, then reload systemd.

      chown root:root FILE
      chmod u-x,go-wx FILE
      systemctl daemon-reload

      For files under /usr/lib/systemd/system that belong to a package, rpm --setugids PACKAGE and rpm --setperms PACKAGE restore the packaged ownership and mode.
  - id: "CIS-SUSE16-2.4.3.2-service_unit_perms"
    name: "service unit perms: find /run/systemd/system /etc/systemd/system /usr/lib/systemd/system -type f -name '*.ser…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 2.4.3.2. NIST SP 800-53 Rev. 5: CM-6, AC-6."
    tags: [cis, cis-suse16, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /run/systemd/system /etc/systemd/system /usr/lib/systemd/system -type f -name '*.service' \( ! -user root -o ! -group root -o -perm /133 \) 2>/dev/null || true
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: *rat-304e7a0db2
    remediation: &rem-f31e811d30 |
      Set owner and group root and remove execute permission for the owner and write and execute permission for group and others on each .service file the check reports, then reload systemd.

      chown root:root FILE
      chmod u-x,go-wx FILE
      systemctl daemon-reload

      For files under /usr/lib/systemd/system that belong to a package, rpm --setugids PACKAGE and rpm --setperms PACKAGE restore the packaged ownership and mode.
  - id: "CIS-SUSE16-2.4.3.3-systemd_dropin_dir_perms"
    name: "systemd dropin dir perms: find /run/systemd/system /etc/systemd/system /usr/lib/systemd/system -type d \\( ! -user r…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 2.4.3.3. NIST SP 800-53 Rev. 5: AC-6, CM-6."
    tags: [cis, cis-suse16, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /run/systemd/system /etc/systemd/system /usr/lib/systemd/system -type d \( ! -user root -o ! -group root -o -perm /022 -o -perm /7000 \) 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-5294010d6a |
      Directories under the systemd unit paths hold unit files and drop-in overrides. If such a directory is writable by non-root users, they can add an override that changes the command a root service runs. Directories should be owned by root, not writable by group or others, and carry no special mode bits.
    remediation: &rem-03bc520829 |
      Set owner and group root on each directory the check reports, remove group and other write permission and clear the setuid, setgid and sticky bits.

      chown root:root DIR
      chmod go-w,u-s,g-s,o-t DIR
      systemctl daemon-reload
  - id: "CIS-SUSE16-2.4.3.4-systemd_user_linger"
    name: "systemd user linger: loginctl list-users --no-legend | awk '$1 != 0 {print $2}' | xargs -r -I{} sh -c 'loginct…"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 2.4.3.4. NIST SP 800-53 Rev. 5: AC-6, CM-7."
    tags: [cis, cis-suse16, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      loginctl list-users --no-legend | awk '$1 != 0 {print $2}' | xargs -r -I{} sh -c 'loginctl show-user {} --property=Linger | grep "Linger=yes" >/dev/null && echo {} || true' 2>/dev/null || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-ddbf51c72f |
      With lingering enabled, a user's systemd user manager and its services keep running after the user logs out and start at boot without a login. This can be used to keep unattended processes or backdoors running outside of any session.
    remediation: &rem-2d526eca4f |
      Disable lingering for each user the check reports, unless that user has an approved need for persistent user services.

      loginctl disable-linger USER
  - id: "CIS-SUSE16-3.1.1-ipv6_disabled-attrs"
    name: "/etc/sysctl.d/60-disable_ipv6.conf: exists"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 3.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/sysctl.d/60-disable_ipv6.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-14ea3ba3bc |
      Where IPv6 is not used, an enabled IPv6 stack still configures addresses and accepts traffic that firewall rules and monitoring may not cover. Disabling it through sysctl for all and default interfaces removes this unmanaged exposure. Systems or applications that need IPv6 must keep it enabled.
    remediation: &rem-f577c3673a |
      Create /etc/sysctl.d/60-disable_ipv6.conf.
  - id: "CIS-SUSE16-3.1.1-ipv6_disabled-content"
    name: "/etc/sysctl.d/60-disable_ipv6.conf has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 3.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/sysctl.d/60-disable_ipv6.conf'
    allow_rc: any
    expect:
      - { some: "~ ^net.ipv6.conf.all.disable_ipv6\\s*=\\s*1" }
      - { some: "~ net.ipv6.conf.default.disable_ipv6\\s*=\\s*1" }
    rationale: *rat-14ea3ba3bc
    remediation: &rem-0b1fa5e477 |
      Edit /etc/sysctl.d/60-disable_ipv6.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^net.ipv6.conf.all.disable_ipv6\s*=\s*1
      - a line matches net.ipv6.conf.default.disable_ipv6\s*=\s*1
  - id: "CIS-SUSE16-3.1.2-wireless_disabled"
    name: "wireless disabled: if [ $(find /sys/class/net/*/ -type d -name wireless) ]; then echo MANUAL; else echo OK; …"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 3.1.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      if [ $(find /sys/class/net/*/ -type d -name wireless) ]; then echo MANUAL; else echo OK; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^OK" }
      - { none: "~ ^MANUAL" }
    rationale: &rat-0d79aa42e1 |
      Wireless interfaces open a network path that bypasses wired network controls such as firewalls and segmentation, and they expose the system to attackers within radio range. Servers rarely need them; turning off the radios or blocking their drivers removes this exposure.
    remediation: &rem-91e73f7d9d |
      Block the driver module of every wireless interface so that it is deny listed, cannot be loaded and is unloaded. Find each interface's driver, block it and unload it:

      basename "$(readlink -f /sys/class/net/IFACE/device/driver/module)"
      printf 'blacklist %s\ninstall %s /bin/false\n' MODULE MODULE >> /etc/modprobe.d/blacklist-wireless.conf
      modprobe -r MODULE

      Drivers built into the kernel cannot be blocked this way; such hardware has to be disabled in the firmware setup or removed.
  - id: "CIS-SUSE16-3.1.3-bluetooth_pkg"
    name: "Package bluez is not installed"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 3.1.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse16, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet bluez
    expect: false
    rationale: &rat-26028fd092 |
      Bluetooth gives devices in radio range a way to connect to the system and has a history of remotely exploitable vulnerabilities. Servers rarely need it, so removing the BlueZ stack removes this wireless attack surface.
    remediation: &rem-fedc70f857 |
      Remove the package bluez, unless the system needs it:

      zypper remove bluez
  - id: "CIS-SUSE16-3.2.1-lsmod_atm"
    name: "lsmod atm: lsmod | grep -i atm"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 3.2.1. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-suse16, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i atm
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-09db9f0366 |
      ATM (Asynchronous Transfer Mode) networking is obsolete on virtually all systems, yet its protocol module can be loaded on demand when a program opens an ATM socket, exposing rarely maintained kernel code to attackers. Preventing the module from loading removes this unnecessary attack surface.
    remediation: &rem-dfc0094ba7 |
      Prevent the atm module from being loaded and unload it if it is currently loaded.

      printf '%s\n' 'blacklist atm' 'install atm /bin/false' > /etc/modprobe.d/atm.conf
      modprobe -r atm

      lsmod | grep -i atm matches any module name containing "atm"; review the output before unloading anything else.
  - id: "CIS-SUSE16-3.2.1-modprobe_atm"
    name: "modprobe atm: modprobe -n -v atm"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 3.2.1. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-suse16, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v atm
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install \\/bin\\/(true|false)" }
    rationale: *rat-09db9f0366
    remediation: &rem-71b37645c4 |
      Prevent the atm module from being loaded and unload it if it is currently loaded.

      printf '%s\n' 'blacklist atm' 'install atm /bin/false' > /etc/modprobe.d/atm.conf
      modprobe -r atm

      The check expects exactly /bin/false or /bin/true.
  - id: "CIS-SUSE16-3.2.2-lsmod_can"
    name: "lsmod can: lsmod | grep -i can"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 3.2.2. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-suse16, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i can
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-3d05bbfd9e |
      The Controller Area Network protocol is used in vehicles and industrial equipment and is not needed on typical servers or workstations. Its socket family can be loaded automatically when a program requests it, exposing additional kernel code that has had vulnerabilities. Disabling the can module removes this attack surface where no CAN interfaces are used.
    remediation: &rem-58b62e9776 |
      Prevent the can module from being loaded and unload it if it is currently loaded.

      printf '%s\n' 'blacklist can' 'install can /bin/false' > /etc/modprobe.d/can.conf
      modprobe -r can

      If the module is in use, unload dependent modules such as can_raw or can_bcm first. lsmod | grep -i can matches any module name containing "can"; review the output.
  - id: "CIS-SUSE16-3.2.2-modprobe_can"
    name: "modprobe can: modprobe -n -v can"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 3.2.2. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-suse16, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v can
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install \\/bin\\/(true|false)" }
    rationale: *rat-3d05bbfd9e
    remediation: &rem-cf33684c1b |
      Prevent the can module from being loaded and unload it if it is currently loaded.

      printf '%s\n' 'blacklist can' 'install can /bin/false' > /etc/modprobe.d/can.conf
      modprobe -r can

      The check expects exactly /bin/false or /bin/true.
  - id: "CIS-SUSE16-3.2.3-lsmod_dccp"
    name: "lsmod dccp: lsmod | grep -i dccp"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 3.2.3. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-suse16, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i dccp
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-c5d39e1c4c |
      DCCP is a rarely used transport protocol whose kernel code has had serious vulnerabilities. Because unprivileged programs can trigger automatic loading of the module by opening a DCCP socket, an unused protocol still adds attack surface. The check verifies the module is not loaded.
    remediation: &rem-7463e2edd5 |
      Prevent the dccp module from loading and unload it if it is loaded.

      printf '%s\n' 'blacklist dccp' 'install dccp /bin/false' > /etc/modprobe.d/dccp.conf
      modprobe -r dccp

      If the module is in use, stop the application using it or reboot.
  - id: "CIS-SUSE16-3.2.3-modprobe_dccp"
    name: "modprobe dccp: modprobe -n -v dccp"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 3.2.3. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-suse16, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v dccp
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install \\/bin\\/(true|false)" }
    rationale: &rat-41ef8e8fab |
      DCCP is a rarely used datagram transport protocol. Its kernel module has had several serious vulnerabilities that can be triggered by local users or from the network. Preventing the module from loading removes this attack surface on systems that do not use the protocol.
    remediation: &rem-66ee3312a3 |
      Keep the dccp module from being loaded: add an install override and a blacklist entry for it in /etc/modprobe.d/, then unload it if it is currently loaded.

      printf '%s\n' 'install dccp /bin/false' 'blacklist dccp' > /etc/modprobe.d/dccp.conf
      modprobe -r dccp

      modprobe -r reports an error if the module is not loaded, which is harmless; if sockets of this protocol are open, the module stays loaded until reboot.
  - id: "CIS-SUSE16-3.2.4-lsmod_tipc"
    name: "lsmod tipc: lsmod | grep -i tipc"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 3.2.4. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-suse16, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i tipc
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-93a1fbf5b3 |
      TIPC is a cluster communication protocol that ordinary servers do not use. Its kernel module has had remotely exploitable vulnerabilities, and an unused protocol module that can be loaded on demand is unnecessary attack surface. The check confirms the module is not loaded.
    remediation: &rem-a6bb92cddf |
      Prevent the tipc module from being loaded and unload it.

      printf '%s\n' 'blacklist tipc' 'install tipc /bin/false' > /etc/modprobe.d/tipc.conf
      modprobe -r tipc

      If the module is in use and cannot be removed, the change takes effect after a reboot.
  - id: "CIS-SUSE16-3.2.4-modprobe_tipc"
    name: "modprobe tipc: modprobe -n -v tipc"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 3.2.4. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-suse16, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
