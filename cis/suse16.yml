  - id: "CIS-SUSE16-3.2.5-modprobe_rds"
    name: "modprobe rds: modprobe -n -v rds"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 3.2.5. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-suse16, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
