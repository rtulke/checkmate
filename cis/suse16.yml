  - id: "CIS-SUSE16-6.2.4.4-cis_6_2_4_4_conf"
    name: "cis 6 2 4 4 conf: grep -Pi -- '^\\h*log_group\\h*=\\h*(root|audit)\\b' /etc/audit/auditd.conf"
