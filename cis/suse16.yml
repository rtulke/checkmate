  - id: "CIS-SUSE16-6.2.3.29-cis_6_2_3_29_cnf"
    name: "cis 6 2 3 29 cnf: grep -E -- 'path=/usr/bin/kmod' /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.3.29. NIST SP 800-53 Rev. 5: AU-12, CM-7."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E -- 'path=/usr/bin/kmod' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ path=\\/usr\\/bin\\/kmod -F perm=x.*-k kernel_modules" }
    rationale: &rat-514cfab69b |
      kmod provides insmod, rmmod and modprobe for loading and unloading kernel modules, which run with full kernel privileges. Logging every execution by regular users makes it possible to trace who changed the running kernel and to detect rootkit installation. This check looks for the rule in the persistent files under /etc/audit/rules.d/.
    remediation: &rem-dc13c6c23f |
      Add audit rules for kernel module loading and unloading and for kmod executions (key kernel_modules) and load them.

      cat > /etc/audit/rules.d/50-kernel_modules.rules <<'EOF'
      -a always,exit -F arch=b64 -S init_module,finit_module,delete_module,create_module,query_module -F auid>=1000 -F auid!=unset -k kernel_modules
      -a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset -k kernel_modules
      EOF
      augenrules --load

      create_module and query_module only exist in the x86_64 syscall table; on aarch64 remove them from the line. Replace 1000 if UID_MIN on the system differs. If the audit configuration is already immutable (-e 2), the new rules only become active after a reboot.
