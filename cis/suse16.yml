  - id: "CIS-SUSE16-6.2.4.8-sbin_auditctl-attrs"
    name: "/sbin/auditctl: exists, mode 0755 or stricter"
    description: "CIS SUSE Linux Enterprise 16 benchmark recommendation 6.2.4.8. NIST SP 800-53 Rev. 5: AU-9."
    tags: [cis, cis-suse16, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/sbin/auditctl'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7022)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
    expect: empty
    rationale: &rat-328f12e6dc |
      The audit tools control and read the audit subsystem. If /sbin/auditctl is writable by group or others or carries setuid/setgid bits, an unprivileged user could replace or abuse it to hide activity or tamper with audit data. Mode 0755 or stricter prevents this.
    remediation: &rem-2d04b74260 |
      Create /sbin/auditctl if it is missing, then remove the permissions u-s,g-ws,o-w,a-t:

      chmod u-s,g-ws,o-w,a-t '/sbin/auditctl'
