    rationale: &rat-649fef3e9c |
      A maximum password age limits how long a stolen or guessed password remains usable. Passwords that never expire give an attacker unlimited time to crack captured hashes or to keep using leaked credentials. A limit of at most 365 days, but never 0 (which means passwords never expire), balances this risk against the tendency of users to choose weak passwords when forced to change them too often.
    remediation: &rem-076e411f34 |
      Set the security policy setting "Maximum password age" (MaximumPasswordAge) to 365 or less, but not 0 days.

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Account Policies\Password Policy\Maximum password age
