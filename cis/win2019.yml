  - id: "CIS-WIN2019-2.2.22-sedenynetworklogonright"
    name: "User right SeDenyNetworkLogonRight is assigned only as required"
    description: "CIS Microsoft Windows Server 2019 benchmark recommendation 2.2.22. NIST SP 800-53 Rev. 5: AC-2, AC-3, AC-6, AC-6(1), AC-6(7), AU-9(4)."
    tags: [cis, cis-win2019, cis-section-2, cis-level-1, cis-level-2, cis-member-server, cis-level1-member-server, cis-level2-member-server]
    severity: medium
    when: "cis_windows_role in [\"member\"]"
    run: |
      $inf = Join-Path $env:TEMP ('checkmate-' + [guid]::NewGuid().ToString() + '.inf')
      try {
        & secedit.exe /export /areas USER_RIGHTS /cfg $inf /quiet | Out-Null
        if (-not (Test-Path -LiteralPath $inf)) { throw 'secedit /export failed; checkmate must run as administrator' }
        $lines = Get-Content -LiteralPath $inf
      } finally {
        Remove-Item -LiteralPath $inf -Force -ErrorAction SilentlyContinue
      }
      $members = @()
      foreach ($line in $lines) {
        if ($line -match '^\s*SeDenyNetworkLogonRight\s*=\s*(.*)$') {
          $members = @($Matches[1].Split(',') | Where-Object { $_.Trim() -ne '' } | ForEach-Object {
            $t = $_.Trim().TrimStart('*')
            if ($t -like 'S-1-*') { $t } else {
              try { (New-Object System.Security.Principal.NTAccount($t)).Translate([System.Security.Principal.SecurityIdentifier]).Value }
              catch { "UNRESOLVED=$t" }
            }
          } | Sort-Object -Unique)
        }
      }
      if ($members.Count -eq 0) { 'NONE' } else { $members -join ',' }
    expect:
      - { some: "~ ^(.*,)?S-1-5-114(,.*)?$" }
      - { some: "~ ^(.*,)?S-1-5-32-546(,.*)?$" }
    rationale: &rat-a01654ad6f |
      Denying network logon to Guests prevents anonymous-style access to the system over the network. On workstations and member servers, also denying local accounts (Local account, or local accounts in the Administrators group on member servers) blocks the reuse of shared local administrator passwords or hashes for lateral movement. Domain controllers only require Guests, since they have no ordinary local accounts.
    remediation: &rem-10a1131c87 |
      Add Local account and member of Administrators group (S-1-5-114) and Guests (S-1-5-32-546) to the user right "Deny access to this computer from the network" (SeDenyNetworkLogonRight); other accounts and groups may hold it as well.

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\User Rights Assignment\Deny access to this computer from the network
      On a single computer: Local Security Policy (secpol.msc).

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
  - id: "CIS-WIN2019-2.2.27-sedenyremoteinteractivelogonright"
    name: "User right SeDenyRemoteInteractiveLogonRight is assigned only as required"
    description: "CIS Microsoft Windows Server 2019 benchmark recommendation 2.2.27. NIST SP 800-53 Rev. 5: AC-2, AC-3, AC-6, AC-6(1), AC-6(7), AU-9(4)."
    tags: [cis, cis-win2019, cis-section-2, cis-level-1, cis-level-2, cis-member-server, cis-level1-member-server, cis-level2-member-server]
    severity: medium
    when: "cis_windows_role in [\"member\"]"
    run: |
      $inf = Join-Path $env:TEMP ('checkmate-' + [guid]::NewGuid().ToString() + '.inf')
      try {
        & secedit.exe /export /areas USER_RIGHTS /cfg $inf /quiet | Out-Null
        if (-not (Test-Path -LiteralPath $inf)) { throw 'secedit /export failed; checkmate must run as administrator' }
        $lines = Get-Content -LiteralPath $inf
      } finally {
        Remove-Item -LiteralPath $inf -Force -ErrorAction SilentlyContinue
      }
      $members = @()
      foreach ($line in $lines) {
        if ($line -match '^\s*SeDenyRemoteInteractiveLogonRight\s*=\s*(.*)$') {
          $members = @($Matches[1].Split(',') | Where-Object { $_.Trim() -ne '' } | ForEach-Object {
            $t = $_.Trim().TrimStart('*')
            if ($t -like 'S-1-*') { $t } else {
              try { (New-Object System.Security.Principal.NTAccount($t)).Translate([System.Security.Principal.SecurityIdentifier]).Value }
              catch { "UNRESOLVED=$t" }
            }
          } | Sort-Object -Unique)
        }
      }
      if ($members.Count -eq 0) { 'NONE' } else { $members -join ',' }
    expect: { some: "~ ^S-1-5-113,S-1-5-32-546$" }
    rationale: &rat-6b6150cb44 |
      Denying Remote Desktop logon to Guests and to local accounts forces remote interactive access to use domain accounts, which are centrally managed and audited. Blocking local accounts prevents shared local administrator passwords from being used to move between systems via RDP. On domain controllers only Guests are required.
    remediation: &rem-bd9d749708 |
      Assign the user right "Deny log on through Remote Desktop Services" (SeDenyRemoteInteractiveLogonRight) to exactly Local account (S-1-5-113), Guests (S-1-5-32-546); remove all other accounts and groups.

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\User Rights Assignment\Deny log on through Remote Desktop Services
      On a single computer: Local Security Policy (secpol.msc).

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
  - id: "CIS-WIN2019-2.3.6.1-RequireSignOrSeal"
    name: "Registry value RequireSignOrSeal is 1 (HKLM\\SYSTEM\\CurrentControlSet\\Services\\Netlogon\\Parameters)"
    description: "CIS Microsoft Windows Server 2019 benchmark recommendation 2.3.6.1. NIST SP 800-53 Rev. 5: AC-17(2), IA-5, IA-5(1), SC-8, SC-8(1)."
    tags: [cis, cis-win2019, cis-section-2, cis-level-1, cis-level-2, cis-member-server, cis-level1-member-server, cis-level2-member-server, cis-domain-controller, cis-level1-domain-controller, cis-level2-domain-controller]
    severity: medium
    when: "cis_windows_role in [\"member\", \"dc\"]"
    run: |
      $k = Get-Item -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters' -ErrorAction SilentlyContinue
      $n = 'RequireSignOrSeal'
      if ($null -eq $k -or $null -eq $k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) { 'ABSENT' }
      else { '{0}={1}' -f $k.GetValueKind($n), (@($k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) -join '|') }
    expect: "== DWord=1"
    rationale: &rat-3ac88d0d3d |
      The Netlogon secure channel between a domain member and a domain controller carries authentication traffic and machine account password changes. Requiring that all secure channel traffic is signed or encrypted protects it against tampering and man-in-the-middle attacks. A value of 1 refuses unprotected secure channels.
    remediation: &rem-3ab1120a93 |
      Set the registry value RequireSignOrSeal in HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters to 1 (REG_DWORD):

      $k = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      if (-not (Test-Path -LiteralPath $k)) { New-Item -Path $k -Force | Out-Null }
      New-ItemProperty -LiteralPath $k -Name 'RequireSignOrSeal' -PropertyType DWord -Value 1 -Force | Out-Null

