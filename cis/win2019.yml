  - id: "CIS-WIN2019-19.7.44.1-per_user_policy"
    name: "Per-user policy AlwaysInstallElevated is set in every loaded profile"
    description: "CIS Microsoft Windows Server 2019 benchmark recommendation 19.7.44.1. NIST SP 800-53 Rev. 5: AC-2(9)."
    tags: [cis, cis-win2019, cis-section-19, cis-level-1, cis-level-2, cis-member-server, cis-level1-member-server, cis-level2-member-server, cis-domain-controller, cis-level1-domain-controller, cis-level2-domain-controller]
    severity: medium
    run: |
      $sids = @(Get-ChildItem -LiteralPath 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue |
        Where-Object { $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notmatch '_Classes$' } |
        Select-Object -ExpandProperty PSChildName)
      if ($sids.Count -eq 0) { 'NONCOMPLIANT no_user_hives_loaded'; return }
      $bad = @()
      foreach ($sid in $sids) {
        $actual = (Get-ItemProperty -LiteralPath ('Registry::HKEY_USERS\' + $sid + '\' + 'SOFTWARE\Policies\Microsoft\Windows\Installer') -Name 'AlwaysInstallElevated' -ErrorAction SilentlyContinue).AlwaysInstallElevated
        if ($null -eq $actual) { $bad += "$sid=absent" } elseif ("$actual" -ne '0') { $bad += "$sid=$actual" }
      }
      if ($bad.Count -eq 0) { "COMPLIANT profiles=$($sids.Count)" } else { 'NONCOMPLIANT ' + ($bad -join ' ') }
    expect: { some: "~ ^COMPLIANT profiles=[1-9][0-9]*$" }
    rationale: &rat-7b1089d8dd |
      When AlwaysInstallElevated is enabled, any user can install MSI packages with SYSTEM privileges, a well-known privilege escalation path. The per-user value must be 0 in every loaded profile; the escalation only works when both the per-user and the computer value are enabled, and both are checked.
    remediation: &rem-ddb3caa695 |
      Set the per-user registry value AlwaysInstallElevated in HKCU\SOFTWARE\Policies\Microsoft\Windows\Installer to 0 (REG_DWORD) for every user, preferably with a Group Policy Object (User Configuration). For the user who runs the command:

      $k = 'HKCU:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      if (-not (Test-Path -LiteralPath $k)) { New-Item -Path $k -Force | Out-Null }
      New-ItemProperty -LiteralPath $k -Name 'AlwaysInstallElevated' -PropertyType DWord -Value 0 -Force | Out-Null

      The check inspects the profiles of all users that are loaded.
  - id: "CIS-WIN2019-19.7.46.2.1-per_user_policy"
