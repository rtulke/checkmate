  - id: "CIS-WIN2019-2.3.7.6-CachedLogonsCount"
    name: "Registry value CachedLogonsCount is 1 (HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon)"
    description: "CIS Microsoft Windows Server 2019 benchmark recommendation 2.3.7.6. NIST SP 800-53 Rev. 5: IA-5(13)."
