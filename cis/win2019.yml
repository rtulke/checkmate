  - id: "CIS-WIN2019-2.3.5.5-RefusePasswordChange"
    name: "Registry value RefusePasswordChange is 0 (HKLM\\SYSTEM\\CurrentControlSet\\Services\\Netlogon\\Parameters)"
    description: "CIS Microsoft Windows Server 2019 benchmark recommendation 2.3.5.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, AC-2, CM-6, CM-7, CM-7(1), CM-9, SA-3, SA-8, SA-10."
    tags: [cis, cis-win2019, cis-section-2, cis-level-1, cis-level-2, cis-domain-controller, cis-level1-domain-controller, cis-level2-domain-controller]
    severity: medium
    when: "cis_windows_role in [\"dc\"]"
    run: |
      $k = Get-Item -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters' -ErrorAction SilentlyContinue
      $n = 'RefusePasswordChange'
      if ($null -eq $k -or $null -eq $k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) { 'ABSENT' }
      else { '{0}={1}' -f $k.GetValueKind($n), (@($k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) -join '|') }
    expect: "== DWord=0"
    rationale: &rat-186d52bfa4 |
      Computer account passwords are rotated automatically to limit the use of a compromised machine credential. If domain controllers refuse machine account password changes, those passwords never change. Keeping the setting disabled allows regular rotation.
    remediation: &rem-7479d4cb43 |
      Set the registry value RefusePasswordChange in HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters to 0 (REG_DWORD):

      $k = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      if (-not (Test-Path -LiteralPath $k)) { New-Item -Path $k -Force | Out-Null }
      New-ItemProperty -LiteralPath $k -Name 'RefusePasswordChange' -PropertyType DWord -Value 0 -Force | Out-Null

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
