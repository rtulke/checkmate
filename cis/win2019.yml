  - id: "CIS-WIN2019-5.2-spooler"
    name: "Service Spooler is disabled or not installed"
    description: "CIS Microsoft Windows Server 2019 benchmark recommendation 5.2. NIST SP 800-53 Rev. 5: CM-6, CM-7."
    tags: [cis, cis-win2019, cis-section-5, cis-level-2, cis-member-server, cis-level2-member-server]
    severity: low
    when: "cis_windows_role in [\"standalone\", \"member\"]"
    run: |
      $s = Get-Service -Name 'Spooler' -ErrorAction SilentlyContinue
      if ($null -eq $s) { 'NotInstalled' } else { $s.StartType.ToString() }
    expect: { some: "~ ^(Disabled|NotInstalled)$" }
    rationale: &rat-a9b2fed302 |
      The Print Spooler runs with SYSTEM privileges and has been the source of several critical vulnerabilities, such as PrintNightmare, which allowed remote code execution and privilege escalation. Systems that do not need to print or share printers, in particular domain controllers and many servers, should have the service disabled. Disabling it prevents all local and remote printing from the system.
    remediation: &rem-9ab5892c9f |
      Disable the service Spooler, or remove the feature or application that installs it:

      Stop-Service -Name 'Spooler' -Force -ErrorAction SilentlyContinue
      Set-Service -Name 'Spooler' -StartupType Disabled

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\System Services, the service Spooler (listed by its display name) with startup mode Disabled.

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
