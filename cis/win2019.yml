  - id: "CIS-WIN2019-2.3.1.2-LimitBlankPasswordUse"
    name: "Registry value LimitBlankPasswordUse is 1 (HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa)"
    description: "CIS Microsoft Windows Server 2019 benchmark recommendation 2.3.1.2. NIST SP 800-53 Rev. 5: IA-5(1)."
    tags: [cis, cis-win2019, cis-section-2, cis-level-1, cis-level-2, cis-member-server, cis-level1-member-server, cis-level2-member-server, cis-domain-controller, cis-level1-domain-controller, cis-level2-domain-controller]
    severity: medium
    run: |
      $k = Get-Item -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa' -ErrorAction SilentlyContinue
      $n = 'LimitBlankPasswordUse'
      if ($null -eq $k -or $null -eq $k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) { 'ABSENT' }
      else { '{0}={1}' -f $k.GetValueKind($n), (@($k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) -join '|') }
    expect: "== DWord=1"
    rationale: &rat-9689c807e6 |
      Local accounts with a blank password are trivial to abuse if they can be used over the network. With this value set to 1, accounts with empty passwords can only log on at the physical console, not through network logons, Remote Desktop or other remote services.
    remediation: &rem-ad1ffd4b8e |
      Set the registry value LimitBlankPasswordUse in HKLM\SYSTEM\CurrentControlSet\Control\Lsa to 1 (REG_DWORD):

      $k = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      if (-not (Test-Path -LiteralPath $k)) { New-Item -Path $k -Force | Out-Null }
      New-ItemProperty -LiteralPath $k -Name 'LimitBlankPasswordUse' -PropertyType DWord -Value 1 -Force | Out-Null

