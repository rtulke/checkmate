  - id: "CIS-WIN2019-2.3.5.1-SubmitControl"
    name: "Registry value SubmitControl is 0 (HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa)"
    description: "CIS Microsoft Windows Server 2019 benchmark recommendation 2.3.5.1. NIST SP 800-53 Rev. 5: AC-6(8)."
    tags: [cis, cis-win2019, cis-section-2, cis-level-1, cis-level-2, cis-domain-controller, cis-level1-domain-controller, cis-level2-domain-controller]
    severity: medium
    when: "cis_windows_role in [\"dc\"]"
    run: |
      $k = Get-Item -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa' -ErrorAction SilentlyContinue
      $n = 'SubmitControl'
      if ($null -eq $k -or $null -eq $k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) { 'ABSENT' }
      else { '{0}={1}' -f $k.GetValueKind($n), (@($k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) -join '|') }
    expect: "== DWord=0"
    rationale: &rat-5ce48ebe0d |
      Allowing Server Operators to schedule tasks on domain controllers lets members of that group run code as SYSTEM, effectively granting domain admin privileges. Disabling it closes this privilege escalation path.
    remediation: &rem-4b6d2e07e8 |
      Set the registry value SubmitControl in HKLM\SYSTEM\CurrentControlSet\Control\Lsa to 0 (REG_DWORD):

      $k = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      if (-not (Test-Path -LiteralPath $k)) { New-Item -Path $k -Force | Out-Null }
      New-ItemProperty -LiteralPath $k -Name 'SubmitControl' -PropertyType DWord -Value 0 -Force | Out-Null

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
  - id: "CIS-WIN2019-2.3.5.2-VulnerableChannelAllowList"
