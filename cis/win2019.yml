  - id: "CIS-WIN2019-2.3.10.1-lsaanonymousnamelookup"
    name: "Security policy setting LSAAnonymousNameLookup"
    description: "CIS Microsoft Windows Server 2019 benchmark recommendation 2.3.10.1. NIST SP 800-53 Rev. 5: AC-6(10), IA-2(2)."
    tags: [cis, cis-win2019, cis-section-2, cis-level-1, cis-level-2, cis-member-server, cis-level1-member-server, cis-level2-member-server, cis-domain-controller, cis-level1-domain-controller, cis-level2-domain-controller]
    severity: medium
    run: |
      $inf = Join-Path $env:TEMP ('checkmate-' + [guid]::NewGuid().ToString() + '.inf')
      try {
        & secedit.exe /export /areas SECURITYPOLICY /cfg $inf /quiet | Out-Null
        if (-not (Test-Path -LiteralPath $inf)) { throw 'secedit /export failed; checkmate must run as administrator' }
        $lines = Get-Content -LiteralPath $inf
      } finally {
        Remove-Item -LiteralPath $inf -Force -ErrorAction SilentlyContinue
      }
      $v = 'ABSENT'
      foreach ($line in $lines) { if ($line -match '^\s*LSAAnonymousNameLookup\s*=\s*(.*)$') { $v = $Matches[1].Trim().Trim('"') } }
      $v
    expect: { some: "~ ^0$" }
    rationale: &rat-a73134097a |
      Anonymous SID/name translation lets unauthenticated users resolve security identifiers to account names, for example to find the real name of the built-in Administrator account even after it has been renamed. Disabling it prevents this kind of anonymous account enumeration.
    remediation: &rem-630dcb0d0d |
      Set the security policy setting "Network access: Allow anonymous SID/Name translation" (LSAAnonymousNameLookup) to Disabled.

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Network access: Allow anonymous SID/Name translation
      On a single computer: Local Security Policy (secpol.msc).

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
