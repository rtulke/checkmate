  - id: "CIS-WIN2019-2.3.1.1-enableguestaccount"
    name: "Security policy setting EnableGuestAccount"
    description: "CIS Microsoft Windows Server 2019 benchmark recommendation 2.3.1.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-win2019, cis-section-2, cis-level-1, cis-level-2, cis-member-server, cis-level1-member-server, cis-level2-member-server]
    severity: medium
    when: "cis_windows_role in [\"standalone\", \"member\"]"
    run: |
      $inf = Join-Path $env:TEMP ('checkmate-' + [guid]::NewGuid().ToString() + '.inf')
      try {
        & secedit.exe /export /areas SECURITYPOLICY /cfg $inf /quiet | Out-Null
        if (-not (Test-Path -LiteralPath $inf)) { throw 'secedit /export failed; checkmate must run as administrator' }
        $lines = Get-Content -LiteralPath $inf
      } finally {
        Remove-Item -LiteralPath $inf -Force -ErrorAction SilentlyContinue
      }
      $v = 'ABSENT'
      foreach ($line in $lines) { if ($line -match '^\s*EnableGuestAccount\s*=\s*(.*)$') { $v = $Matches[1].Trim().Trim('"') } }
      $v
    expect: { some: "~ ^0$" }
    rationale: &rat-fb10c58c19 |
      The built-in Guest account allows logon without individual credentials and makes activity impossible to attribute to a person. Keeping it disabled removes an anonymous access path to the system and its network shares.
    remediation: &rem-54d3584423 |
      Set the security policy setting "Accounts: Guest account status" (EnableGuestAccount) to Disabled.

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Accounts: Guest account status
      On a single computer: Local Security Policy (secpol.msc).

