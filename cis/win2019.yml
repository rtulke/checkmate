  - id: "CIS-WIN2019-17.1.2-0cce9242_69ae_11d9_bed3_505054503030"
    name: "Audit policy Kerberos Authentication Service is configured"
    description: "CIS Microsoft Windows Server 2019 benchmark recommendation 17.1.2. NIST SP 800-53 Rev. 5: AU-3, AU-3(1), AU-7, AU-12."
    tags: [cis, cis-win2019, cis-section-17, cis-level-1, cis-level-2, cis-domain-controller, cis-level1-domain-controller, cis-level2-domain-controller]
    severity: medium
    when: "cis_windows_role in [\"dc\"]"
    run: |
      $rows = @(& auditpol.exe /get ('/subcategory:' + '{0CCE9242-69AE-11D9-BED3-505054503030}') /r 2>$null)
      if ($LASTEXITCODE -ne 0) { throw 'auditpol failed; checkmate must run as administrator' }
      $map = @{ 'No Auditing' = 0; 'Success' = 1; 'Failure' = 2; 'Success and Failure' = 3 }
      $v = 'ABSENT'
      foreach ($row in $rows) {
        $f = $row.Split(',')
        if ($f.Count -ge 5 -and $f[2].Trim() -ne 'Subcategory' -and $f[2].Trim() -ne '') {
          $i = $f[4].Trim()
          if ($map.ContainsKey($i)) { $v = $map[$i] } else { $v = 'UNKNOWN=' + $i }
        }
      }
      $v
    expect: { some: "~ ^3$" }
    rationale: &rat-4d1165eb15 |
      Kerberos ticket-granting ticket requests show which accounts authenticate and from where, and failures reveal password guessing and attacks such as AS-REP roasting. Auditing success and failure of the Kerberos Authentication Service on domain controllers provides this visibility.
    remediation: &rem-f2b3809e4d |
      Audit Success and Failure for the subcategory "Kerberos Authentication Service":

      auditpol.exe /set "/subcategory:{0CCE9242-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Advanced Audit Policy Configuration\Audit Policies\Account Logon\Audit Kerberos Authentication Service
      The advanced audit policy only takes effect when "Audit: Force audit policy subcategory settings to override audit policy category settings" is enabled.

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
