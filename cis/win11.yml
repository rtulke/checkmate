      Set the registry value NoConnectedUser in HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System to 3 (REG_DWORD):

      $k = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      if (-not (Test-Path -LiteralPath $k)) { New-Item -Path $k -Force | Out-Null }
      New-ItemProperty -LiteralPath $k -Name 'NoConnectedUser' -PropertyType DWord -Value 3 -Force | Out-Null

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
