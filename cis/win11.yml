  - id: "CIS-WIN11-17.1.1-credential_validation"
    name: "Audit policy Credential Validation is configured"
    description: "CIS Microsoft Windows 11 Enterprise benchmark recommendation 17.1.1. NIST SP 800-53 Rev. 5: AU-12, AU-3, AU-3(1), AU-7."
    tags: [cis, cis-win11, cis-section-17, cis-level-1, cis-level-2, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      $rows = @(& auditpol.exe /get ('/subcategory:' + '{0CCE923F-69AE-11D9-BED3-505054503030}') /r 2>$null)
      if ($LASTEXITCODE -ne 0) { throw 'auditpol failed; checkmate must run as administrator' }
      $map = @{ 'No Auditing' = 0; 'Success' = 1; 'Failure' = 2; 'Success and Failure' = 3 }
      $v = 'ABSENT'
      foreach ($row in $rows) {
        $f = $row.Split(',')
        if ($f.Count -ge 5 -and $f[2].Trim() -ne 'Subcategory' -and $f[2].Trim() -ne '') {
          $i = $f[4].Trim()
          if ($map.ContainsKey($i)) { $v = $map[$i] } else { $v = 'UNKNOWN=' + $i }
        }
      }
      $v
    expect: { some: "~ ^3$" }
    rationale: &rat-ccdb1e4916 |
      Credential validation events record the outcome of authentication attempts against account credentials, for example NTLM validation of local or domain accounts. Failures reveal password guessing and spraying; successes help trace the use of compromised accounts. The check requires auditing of both success and failure.
    remediation: &rem-f880666061 |
      Audit Success and Failure for the subcategory "Credential Validation":

      auditpol.exe /set "/subcategory:{0CCE923F-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Advanced Audit Policy Configuration\Audit Policies\Account Logon\Audit Credential Validation
      The advanced audit policy only takes effect when "Audit: Force audit policy subcategory settings to override audit policy category settings" is enabled.

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
