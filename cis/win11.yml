          try {
            & secedit.exe /export /areas SECURITYPOLICY /cfg $inf /quiet | Out-Null
            if (-not (Test-Path -LiteralPath $inf)) { throw 'secedit /export failed; checkmate must run as administrator' }
            $lines = Get-Content -LiteralPath $inf
          } finally {
            Remove-Item -LiteralPath $inf -Force -ErrorAction SilentlyContinue
          }
          $v = 'ABSENT'
          foreach ($line in $lines) { if ($line -match '^\s*MaximumPasswordAge\s*=\s*(.*)$') { $v = $Matches[1].Trim().Trim('"') } }
          $v
        }
        [IO.File]::WriteAllText((Join-Path $snap 'SystemAccess.MaximumPasswordAge'), ((@($value) -join "`n")))
        $p = Join-Path $snap 'SystemAccess.MaximumPasswordAge'; if (-not (Test-Path -LiteralPath $p)) { 'NONCOMPLIANT not_collected' } else { $r = (Get-Content -LiteralPath $p -Raw).Trim(); if ($r -notmatch '^[0-9]+$') { 'NONCOMPLIANT actual=' + $r } else { $v = [int]$r; if ($v -le 365 -and $v -ne 0) { 'COMPLIANT' } else { 'NONCOMPLIANT actual=' + $v } } }
      } finally {
        Remove-Item -LiteralPath $snap -Recurse -Force -ErrorAction SilentlyContinue
      }
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^COMPLIANT$" }
    rationale: &rat-649fef3e9c |
      A maximum password age limits how long a stolen or guessed password remains usable. Passwords that never expire give an attacker unlimited time to crack captured hashes or to keep using leaked credentials. A limit of at most 365 days, but never 0 (which means passwords never expire), balances this risk against the tendency of users to choose weak passwords when forced to change them too often.
    remediation: &rem-076e411f34 |
      Set the security policy setting "Maximum password age" (MaximumPasswordAge) to 365 or less, but not 0 days.

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Account Policies\Password Policy\Maximum password age
      On a single computer: Local Security Policy (secpol.msc). Or in PowerShell:

      net accounts /maxpwage:365

      For domain accounts this policy comes from the Group Policy Object linked to the domain (usually the Default Domain Policy); local settings apply only to local accounts.
