  - id: "CIS-WIN11-1.2.2-lockoutbadcount"
    name: "Security policy setting LockoutBadCount"
    description: "CIS Microsoft Windows 11 Enterprise benchmark recommendation 1.2.2. NIST SP 800-53 Rev. 5: AC-19, AC-7."
    tags: [cis, cis-win11, cis-section-1, cis-level-1, cis-level-2, cis-workstation, cis-level1-workstation, cis-level2-workstation]
