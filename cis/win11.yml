  - id: "CIS-WIN11-9.1.1-EnableFirewall"
    name: "Registry value EnableFirewall is 1 (HKLM\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\DomainProfile)"
    description: "CIS Microsoft Windows 11 Enterprise benchmark recommendation 9.1.1. NIST SP 800-53 Rev. 5: SC-7, SC-7(5)."
    tags: [cis, cis-win11, cis-section-9, cis-level-1, cis-level-2, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      $k = Get-Item -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile' -ErrorAction SilentlyContinue
      $n = 'EnableFirewall'
      if ($null -eq $k -or $null -eq $k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) { 'ABSENT' }
      else { '{0}={1}' -f $k.GetValueKind($n), (@($k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) -join '|') }
    expect: "== DWord=1"
    rationale: &rat-22880dd2d7 |
      A host-based firewall limits which network services of the system can be reached and contains the spread of malware between hosts. This check covers the domain profile, which applies when the computer is connected to its corporate domain network. The value 1 set by policy turns the firewall on for this profile.
    remediation: &rem-f9a98b5add |
      Set the registry value EnableFirewall in HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile to 1 (REG_DWORD):

      $k = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile'
      if (-not (Test-Path -LiteralPath $k)) { New-Item -Path $k -Force | Out-Null }
      New-ItemProperty -LiteralPath $k -Name 'EnableFirewall' -PropertyType DWord -Value 1 -Force | Out-Null

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
