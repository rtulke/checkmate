  - id: "CIS-WIN11-5.1-btagservice"
    name: "Service BTAGService is disabled or not installed"
    description: "CIS Microsoft Windows 11 Enterprise benchmark recommendation 5.1."
    tags: [cis, cis-win11, cis-section-5, cis-level-2, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      $s = Get-Service -Name 'BTAGService' -ErrorAction SilentlyContinue
      if ($null -eq $s) { 'NotInstalled' } else { $s.StartType.ToString() }
    expect: { some: "~ ^(Disabled|NotInstalled)$" }
    rationale: &rat-eba5d941b4 |
      The Bluetooth Audio Gateway service supports hands-free and headset profiles over Bluetooth. Bluetooth is a wireless attack surface that has seen numerous remotely exploitable vulnerabilities, and it can be used to pair unmanaged devices. On systems that do not need Bluetooth audio, the service should be disabled or not installed.
    remediation: &rem-8ef76aa4f6 |
      Disable the service BTAGService, or remove the feature or application that installs it:

      Stop-Service -Name 'BTAGService' -Force -ErrorAction SilentlyContinue
      Set-Service -Name 'BTAGService' -StartupType Disabled

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\System Services, the service BTAGService (listed by its display name) with startup mode Disabled.

