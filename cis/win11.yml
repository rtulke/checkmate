    expect: { some: "~ ^[1-5]$" }
    rationale: &rat-5990fb2666 |
      An account lockout threshold limits how many passwords an attacker can try against an account before it is locked. Without a threshold, online brute-force and password-spraying attacks can continue indefinitely. A threshold of 1 to 5 attempts stops guessing early; the trade-off is that attackers or misconfigured clients can deliberately lock accounts out.
    remediation: &rem-8807ed964d |
