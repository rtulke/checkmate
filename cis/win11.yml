  - id: "CIS-WIN11-19.5.1.1-per_user_policy"
    name: "Per-user policy NoToastApplicationNotificationOnLockScreen is set in every loaded profile"
    description: "CIS Microsoft Windows 11 Enterprise benchmark recommendation 19.5.1.1."
    tags: [cis, cis-win11, cis-section-19, cis-level-1, cis-level-2, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      $sids = @(Get-ChildItem -LiteralPath 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue |
        Where-Object { $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notmatch '_Classes$' } |
        Select-Object -ExpandProperty PSChildName)
      if ($sids.Count -eq 0) { 'NONCOMPLIANT no_user_hives_loaded'; return }
      $bad = @()
      foreach ($sid in $sids) {
        $actual = (Get-ItemProperty -LiteralPath ('Registry::HKEY_USERS\' + $sid + '\' + 'SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications') -Name 'NoToastApplicationNotificationOnLockScreen' -ErrorAction SilentlyContinue).NoToastApplicationNotificationOnLockScreen
        if ($null -eq $actual) { $bad += "$sid=absent" } elseif ("$actual" -ne '1') { $bad += "$sid=$actual" }
      }
      if ($bad.Count -eq 0) { "COMPLIANT profiles=$($sids.Count)" } else { 'NONCOMPLIANT ' + ($bad -join ' ') }
    expect: { some: "~ ^COMPLIANT profiles=[1-9][0-9]*$" }
