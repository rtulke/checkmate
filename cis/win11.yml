      $v
    expect: { some: "~ ^0$" }
    rationale: &rat-5c4dcc1adf |
      Storing passwords with reversible encryption is essentially equivalent to storing them in clear text: anyone who obtains the account database can recover the actual passwords. It is only needed by a few legacy protocols such as CHAP or HTTP Digest. Keeping the setting disabled ensures that only one-way password hashes are stored.
    remediation: &rem-d259601527 |
      Set the security policy setting "Store passwords using reversible encryption" (ClearTextPassword) to Disabled.

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Account Policies\Password Policy\Store passwords using reversible encryption
