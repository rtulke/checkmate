  - id: "CIS-WIN11-2.3.11.6-forcelogoffwhenhourexpire"
    name: "Security policy setting ForceLogoffWhenHourExpire"
    description: "CIS Microsoft Windows 11 Enterprise benchmark recommendation 2.3.11.6. NIST SP 800-53 Rev. 5: AC-2(12)."
    tags: [cis, cis-win11, cis-section-2, cis-level-1, cis-level-2, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    when: "not cis_windows_domain_joined"
    run: |
      $inf = Join-Path $env:TEMP ('checkmate-' + [guid]::NewGuid().ToString() + '.inf')
      try {
        & secedit.exe /export /areas SECURITYPOLICY /cfg $inf /quiet | Out-Null
        if (-not (Test-Path -LiteralPath $inf)) { throw 'secedit /export failed; checkmate must run as administrator' }
        $lines = Get-Content -LiteralPath $inf
      } finally {
        Remove-Item -LiteralPath $inf -Force -ErrorAction SilentlyContinue
      }
      $v = 'ABSENT'
      foreach ($line in $lines) { if ($line -match '^\s*ForceLogoffWhenHourExpire\s*=\s*(.*)$') { $v = $Matches[1].Trim().Trim('"') } }
      $v
    expect: { some: "~ ^1$" }
    rationale: &rat-573c2651bc |
      When logon hours are restricted for accounts, existing network sessions should end once the permitted time is over. Enabling this setting disconnects SMB sessions when logon hours expire, so restrictions are actually enforced and not only at the time of logon.
    remediation: &rem-454736b8e2 |
      Set the security policy setting "Network security: Force logoff when logon hours expire" (ForceLogoffWhenHourExpire) to Enabled.

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Network security: Force logoff when logon hours expire
      On a single computer: Local Security Policy (secpol.msc).

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
