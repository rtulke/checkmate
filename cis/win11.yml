    name: "Security policy setting MaximumPasswordAge"
    description: "CIS Microsoft Windows 11 Enterprise benchmark recommendation 1.1.2. NIST SP 800-53 Rev. 5: IA-5(1)."
    tags: [cis, cis-win11, cis-section-1, cis-level-1, cis-level-2, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 30000ms
