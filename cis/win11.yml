name: CIS Microsoft Windows 11 Enterprise
version: "3.0.0"
description: >
  Automated checks for 471 recommendations of the CIS Microsoft Windows 11 Enterprise benchmark
  (version 3.0.0), converted from the goss audit content of the
  ansible-lockdown project. Check names describe what is verified; the
  recommendation number is in the ID and the description. Select profiles
  with tags, e.g. `--tags cis-level1-member-server`. Run elevated (as
  administrator). Every check collects its own value (registry, secedit,
  auditpol, services, firewall). Set `-e cis_windows_role=dc` on domain
  controllers. On domain members set `-e cis_windows_domain_joined=true`;
  the domain policy then sets password and lockout settings.

vars:
  # true skips password and lockout rules that the domain policy sets
  cis_windows_domain_joined: false

defaults:
