    rationale: &rat-e1487e30e8 |
      Locking an account for a period after repeated failed logons slows down online password guessing considerably. A lockout duration of 15 minutes or more makes brute-force attacks impractical while still letting legitimate users regain access automatically. A value of 0 would require an administrator to unlock each account manually.
    remediation: &rem-8304f9f366 |
