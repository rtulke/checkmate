    name: "Registry value EnableVirtualization is 1 (HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System)"
    description: "CIS Microsoft Windows 11 Enterprise benchmark recommendation 2.3.17.8. NIST SP 800-53 Rev. 5: SC-29(1)."
    tags: [cis, cis-win11, cis-section-2, cis-level-1, cis-level-2, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      $k = Get-Item -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -ErrorAction SilentlyContinue
      $n = 'EnableVirtualization'
      if ($null -eq $k -or $null -eq $k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) { 'ABSENT' }
      else { '{0}={1}' -f $k.GetValueKind($n), (@($k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) -join '|') }
    expect: "== DWord=1"
