  - id: "CIS-WIN11-2.3.1.5-newguestname"
    name: "Security policy setting NewGuestName"
    description: "CIS Microsoft Windows 11 Enterprise benchmark recommendation 2.3.1.5. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-win11, cis-section-2, cis-level-1, cis-level-2, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      $inf = Join-Path $env:TEMP ('checkmate-' + [guid]::NewGuid().ToString() + '.inf')
      try {
        & secedit.exe /export /areas SECURITYPOLICY /cfg $inf /quiet | Out-Null
        if (-not (Test-Path -LiteralPath $inf)) { throw 'secedit /export failed; checkmate must run as administrator' }
        $lines = Get-Content -LiteralPath $inf
      } finally {
        Remove-Item -LiteralPath $inf -Force -ErrorAction SilentlyContinue
      }
      $v = 'ABSENT'
      foreach ($line in $lines) { if ($line -match '^\s*NewGuestName\s*=\s*(.*)$') { $v = $Matches[1].Trim().Trim('"') } }
      $v
    expect:
      - { some: "~ ^.+$" }
      - { none: "~ ^Guest$" }
    rationale: &rat-0e35cdaaf1 |
      The built-in Guest account has a well-known name that attackers try first. Renaming it removes an easily guessable target, in addition to keeping the account disabled. The check passes when the account name is not Guest.
    remediation: &rem-1514137787 |
      Set the security policy setting "Accounts: Rename guest account" (NewGuestName) to a name other than Guest.

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Accounts: Rename guest account
      On a single computer: Local Security Policy (secpol.msc).

