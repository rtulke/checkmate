  - id: "CIS-WIN11-19.7.42.1-per_user_policy"
    name: "Per-user policy AlwaysInstallElevated is set in every loaded profile"
    description: "CIS Microsoft Windows 11 Enterprise benchmark recommendation 19.7.42.1. NIST SP 800-53 Rev. 5: AC-2(9)."
    tags: [cis, cis-win11, cis-section-19, cis-level-1, cis-level-2, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      $sids = @(Get-ChildItem -LiteralPath 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue |
        Where-Object { $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notmatch '_Classes$' } |
        Select-Object -ExpandProperty PSChildName)
      if ($sids.Count -eq 0) { 'NONCOMPLIANT no_user_hives_loaded'; return }
      $bad = @()
      foreach ($sid in $sids) {
        $actual = (Get-ItemProperty -LiteralPath ('Registry::HKEY_USERS\' + $sid + '\' + 'SOFTWARE\Policies\Microsoft\Windows\Installer') -Name 'AlwaysInstallElevated' -ErrorAction SilentlyContinue).AlwaysInstallElevated
        if ($null -eq $actual) { $bad += "$sid=absent" } elseif ("$actual" -ne '0') { $bad += "$sid=$actual" }
      }
