  - id: "CIS-WIN11-2.3.1.1-NoConnectedUser"
    name: "Registry value NoConnectedUser is 3 (HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System)"
    description: "CIS Microsoft Windows 11 Enterprise benchmark recommendation 2.3.1.1."
    tags: [cis, cis-win11, cis-section-2, cis-level-1, cis-level-2, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      $k = Get-Item -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -ErrorAction SilentlyContinue
      $n = 'NoConnectedUser'
      if ($null -eq $k -or $null -eq $k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) { 'ABSENT' }
      else { '{0}={1}' -f $k.GetValueKind($n), (@($k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) -join '|') }
    expect: "== DWord=3"
    rationale: &rat-12e17bba4f |
      Allowing Microsoft accounts to be added or used for logon on managed systems lets users link personal cloud identities to company devices, outside central account management and auditing. A value of 3 prevents users from adding Microsoft accounts and from logging on with them.
