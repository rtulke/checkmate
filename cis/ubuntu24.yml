  - id: "CIS-UBUNTU24-5.1.23-sshd_pqc_kex"
    name: "sshd pqc kex: l_ver=$(sshd -V 2\u003e\u00261 | grep -Eio 'openssh_[0-9]+\\.[0-9]+' | head -1 | cut -d_ -f2)"
    description: "CIS Ubuntu 24.04 LTS benchmark recommendation 5.1.23. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-ubuntu24, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      l_ver=$(sshd -V 2>&1 | grep -Eio 'openssh_[0-9]+\.[0-9]+' | head -1 | cut -d_ -f2)
      l_kex=$(sshd -T 2>/dev/null | awk '$1 == "kexalgorithms" {print $2}')
      echo "$l_kex" | grep -q 'sntrup761x25519-sha512' && echo "PASS: sntrup761x25519-sha512" || echo "FAIL: sntrup761x25519-sha512 not in kexalgorithms"
      if [ -n "$l_ver" ] && [ "$(printf '%s\n' 9.9 "$l_ver" | sort -V | head -1)" = "9.9" ]; then
        echo "$l_kex" | grep -q 'mlkem768x25519-sha256' && echo "PASS: mlkem768x25519-sha256" || echo "FAIL: mlkem768x25519-sha256 not in kexalgorithms on OpenSSH $l_ver"
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS: sntrup761x25519-sha512" }
      - { none: "~ ^FAIL" }
