  - id: "CIS-UBUNTU24-5.4.2.7-secure_system_accts"
    name: "secure system accts: uid_min=$(awk '/^[[:space:]]*UID_MIN/ {print $2}' /etc/login.defs)"
    description: "CIS Ubuntu 24.04 LTS benchmark recommendation 5.4.2.7. NIST SP 800-53 Rev. 5: AC-2(5), AC-3, AC-11, MP-2."
    tags: [cis, cis-ubuntu24, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      uid_min=$(awk '/^[[:space:]]*UID_MIN/ {print $2}' /etc/login.defs)
      valid=$(awk -F/ '$NF != "nologin" && /^\// {print}' /etc/shells)
      awk -F: -v m="${uid_min:-1000}" '($1 !~ /^(root|halt|sync|shutdown|nfsnobody)$/ && ($3 < m+0 || $3 == 65534)) {print $1, $NF}' /etc/passwd | while read -r u s; do
        printf '%s\n' "$valid" | grep -qxF -- "$s" && echo "FAIL: Service account $u has a valid shell: $s"
      done
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
  - id: "CIS-UBUNTU24-5.4.2.8-test_valid_shells"
