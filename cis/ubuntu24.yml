  - id: "CIS-UBUNTU24-1.6.4-pam_motd_configured"
    name: "pam motd configured: os_id=\"$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"//g')\""
    description: "CIS Ubuntu 24.04 LTS benchmark recommendation 1.6.4. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu24, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      os_id="$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g')"
      for svc in sshd login su gdm-password; do
        if [ -f "/etc/pam.d/$svc" ]; then file="/etc/pam.d/$svc"
        elif [ -f "/usr/lib/pam.d/$svc" ]; then file="/usr/lib/pam.d/$svc"
        else continue
        fi
        grep -Pi '^\h*session\h+(required|optional)\h+pam_motd\.so\b.*\bmotd=' "$file" 2>/dev/null | grep -oP '\bmotd=\K\S+' | tr -d "\"'" | while IFS= read -r motd_path; do
          [ -r "$motd_path" ] || continue
          grep -Pqi -- "(\\\v|\\\r|\\\m|\\\s|\b${os_id}\b)" "$motd_path" && printf '%s: motd=%s\n' "$file" "$motd_path"
        done
      done
      true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
