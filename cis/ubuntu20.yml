    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
  - id: "CIS-UBUNTU20-1.6.5-etc_issue_perms-attrs"
    name: "/etc/issue: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Ubuntu 20.04 LTS benchmark recommendation 1.6.5. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3. CIS Controls v8: 3.3."
    tags: [cis, cis-ubuntu20, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
