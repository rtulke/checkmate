      - { none: "~ (?i)^UsePAM no" }
    rationale: *rat-20d91b73a4
    remediation: &rem-5cf3c26b74 |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches (?i)^UsePAM yes
      - no line matches (?i)^UsePAM no
  - id: "CIS-UBUNTU22-5.2.1-sudo"
    name: "Package sudo is installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.2.1. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' sudo 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-f5f9e1cba7 |
      sudo lets administrators run privileged commands with their own credentials instead of a shared root password. That gives individual accountability, fine-grained permissions and a log of every privileged command.
    remediation: &rem-83b291c388 |
      Install the package sudo:

      apt-get install sudo
  - id: "CIS-UBUNTU22-5.2.2-sudoers_use_pty-attrs"
    name: "/etc/sudoers: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.2.2. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/sudoers'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e7f078fa91 |
      When sudo runs a command without a pseudo terminal, a malicious program can keep running in the background and inject keystrokes into the user's terminal after sudo returns. use_pty runs commands in a separate pty, which prevents this and also enables reliable I/O logging.
    remediation: &rem-b6090d151e |
      Create /etc/sudoers.
  - id: "CIS-UBUNTU22-5.2.2-sudoers_use_pty-content"
    name: "/etc/sudoers has the expected content (1 rule)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.2.2. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/sudoers'
    allow_rc: any
    expect: { some: "~ ^Defaults.*\\suse_pty" }
    rationale: *rat-e7f078fa91
    remediation: &rem-b9e3ac8490 |
      Edit /etc/sudoers so that its lines meet these conditions (regular expressions):

      - a line matches ^Defaults.*\suse_pty
  - id: "CIS-UBUNTU22-5.2.2-pty_sudoers_d"
    name: "pty sudoers d: ls -1 /etc/sudoers.d/* \u003e /dev/null 2\u003e\u00261; if [ '$?' = '0' ]; then grep -c '^Defaults\\s*use…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.2.2. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      ls -1 /etc/sudoers.d/* > /dev/null 2>&1; if [ '$?' = '0' ]; then grep -c '^Defaults\s*use_pty' /etc/sudoers.d/*; else echo 99;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ [0-99]" }
    rationale: &rat-63218cca98 |
      With use_pty, sudo runs commands in a separate pseudo-terminal. A malicious program started through sudo then cannot inject input into the user's terminal or keep access to it after sudo exits. It also makes I/O logging complete.
    remediation: &rem-bf550576ff |
      Enable use_pty with a line of its own in a file under /etc/sudoers.d/, remove any Defaults !use_pty setting and validate the syntax.

      echo 'Defaults use_pty' > /etc/sudoers.d/50-use_pty
      chmod 0440 /etc/sudoers.d/50-use_pty
      grep -rnE '^\s*Defaults.*!use_pty' /etc/sudoers /etc/sudoers.d/
      visudo -c

      sudo ignores files in /etc/sudoers.d/ whose names contain a dot or end with ~.
  - id: "CIS-UBUNTU22-5.2.3-log_sudoers_d"
    name: "log sudoers d: grep -Ec \"^Defaults.*logfile=(\\\"|)/var/log/.*\\.log(\\\"|)\" /etc/sudoers /etc/sudoers.d/*"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.2.3. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ec "^Defaults.*logfile=(\"|)/var/log/.*\.log(\"|)" /etc/sudoers /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*:[1:99]" }
    rationale: &rat-73ffb83e75 |
      A dedicated sudo log file records every sudo invocation with user, terminal, working directory and command. That makes privileged activity easy to review and keeps the record separate from general system logs.
    remediation: &rem-b7aaa6ded0 |
      Configure a dedicated sudo log file under /var/log in a Defaults line of its own and validate the syntax.

      echo 'Defaults logfile="/var/log/sudo.log"' > /etc/sudoers.d/50-logfile
      chmod 0440 /etc/sudoers.d/50-logfile
      visudo -c
  - id: "CIS-UBUNTU22-5.2.4-nopasswd_sudoers_d"
    name: "nopasswd sudoers d: grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v '.*\\:#'"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.2.4. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v '.*\:#'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-eecb763928 |
      NOPASSWD lets users run commands with elevated privileges without entering their password. Anyone who gains access to such an account, or a process running as it, obtains root immediately. Requiring the password confirms the person and limits the impact of a hijacked session.
    remediation: &rem-a35cd5880e |
      Review every listed sudo rule with NOPASSWD and remove the tag (or the rule) unless a documented exception applies. Edit the files with visudo so syntax errors are caught.

      grep -rn NOPASSWD /etc/sudoers /etc/sudoers.d/
      visudo -f FILE

      Users who lose NOPASSWD need a password to use sudo. On cloud images the default user (for example via /etc/sudoers.d/90-cloud-init-users) often has none; set one first, or you may lose administrative access.
  - id: "CIS-UBUNTU22-5.2.5-authenticate_sudoers"
    name: "authenticate sudoers: grep -r \"^[^#].*\\!authenticate\" /etc/sudoers*"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.2.5. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -r "^[^#].*\!authenticate" /etc/sudoers*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-0aa92719bf |
      The !authenticate option lets sudo run commands without asking for the user's password. Anyone who gets hold of an unlocked session or a compromised account of such a user can then act with elevated privileges without any further barrier. Requiring re-authentication for sudo keeps privilege escalation tied to knowledge of the password.
    remediation: &rem-f4fb208b6d |
      Remove the !authenticate option from every sudoers rule and Defaults line reported by the check. Edit each file with visudo so that the syntax is validated before it is saved.

      grep -rn '!authenticate' /etc/sudoers /etc/sudoers.d/
      visudo -f /etc/sudoers
      visudo -f /etc/sudoers.d/FILE

      Affected users will be asked for their password again when they use sudo.
  - id: "CIS-UBUNTU22-5.2.6-sudo_timeout"
    name: "sudo timeout: grep -rP \"timestamp_timeout=\\K[0-9]*\" /etc/sudoers*"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.2.6. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -rP "timestamp_timeout=\K[0-9]*" /etc/sudoers*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ timestamp_timeout=(-1|1[6-9]|[2-9][0-9]|[1-9][0-9]{2,})" }
      - { some: "~ timestamp_timeout=([5-9]|1[0-5])" }
    rationale: &rat-14f3ec7a75 |
      After a successful authentication, sudo caches the credentials for a while so that further commands do not ask for the password again. A long or unlimited cache lets anyone with access to an unattended terminal run privileged commands. Keeping the timeout at 15 minutes or less limits that window while staying practical for administrators.
    remediation: &rem-391bdc9433 |
      Set the sudo credential cache timeout to 15 minutes or less in a sudoers drop-in file, and remove larger or negative timestamp_timeout values from all other sudoers files.

      grep -rn 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/
      echo 'Defaults timestamp_timeout=15' > /etc/sudoers.d/50-timestamp-timeout
      chmod 0440 /etc/sudoers.d/50-timestamp-timeout
      visudo -c

      Write the value without spaces around the equals sign; the check searches for timestamp_timeout=VALUE literally.
  - id: "CIS-UBUNTU22-5.2.7-su_conf-attrs"
    name: "/etc/pam.d/su: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/su'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-de1d2faee1 |
      Restricting su through pam_wheel to members of a specific group prevents ordinary users from switching to root even if they learn the root password. An empty dedicated group effectively forces administrators to use sudo, which logs individual actions.
    remediation: &rem-d67efd69b0 |
      Create /etc/pam.d/su.
  - id: "CIS-UBUNTU22-5.2.7-su_conf-content"
    name: "/etc/pam.d/su has the expected content (1 rule)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/su'
    allow_rc: any
    expect: { some: "~ ^\\s*auth\\s+(required|requisite)\\s+pam_wheel\\.so\\s+(\\S+\\s+)*(use_uid\\s+(\\S+\\s+)*group=\\S+|group=\\S+\\s+(\\S+\\s+)*use_uid)(\\s|$)" }
    rationale: *rat-de1d2faee1
    remediation: &rem-ee23a5a1dd |
      Edit /etc/pam.d/su so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*auth\s+(required|requisite)\s+pam_wheel\.so\s+(\S+\s+)*(use_uid\s+(\S+\s+)*group=\S+|group=\S+\s+(\S+\s+)*use_uid)(\s|$)
  - id: "CIS-UBUNTU22-5.2.7-sugroup_etc_group"
    name: "The group that pam_wheel allows to use su has no members"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      g=$(sed -nE 's/^[[:space:]]*auth[[:space:]]+(required|requisite)[[:space:]]+pam_wheel\.so[[:space:]](.*[[:space:]])?group=([^[:space:]]+).*/\3/p' /etc/pam.d/su 2>/dev/null | sed -n 1p)
      if [ -z "$g" ]; then echo "pam_wheel in /etc/pam.d/su names no group"; exit 0; fi
      e=$(getent group "$g")
      if [ -z "$e" ]; then echo "group $g does not exist"; exit 0; fi
      echo "$e" | awk -F: '$4 != "" {print "group " $1 " has members: " $4}'
    allow_rc: any
    expect: empty
    rationale: &rat-575a3911d0 |
      Restricting su with pam_wheel to members of a dedicated group prevents ordinary users from switching to root or other accounts by guessing or knowing their passwords. Using an empty group makes su usable only by root, so administrators must use sudo, which is logged per user. The group must exist and have no members.
    remediation: &rem-80fba87223 |
      Create a group without members and restrict su to it with pam_wheel in /etc/pam.d/su. The group can have any name; sugroup is an example.

      groupadd sugroup
      gpasswd -M '' sugroup
      grep -Eq '^\s*auth\s+(required|requisite)\s+pam_wheel\.so\s.*group=' /etc/pam.d/su || sed -i '/^auth\s\+sufficient\s\+pam_rootok.so/a auth required pam_wheel.so use_uid group=sugroup' /etc/pam.d/su

      If pam_wheel already names a group, remove its members instead: gpasswd -M '' GROUP.
  - id: "CIS-UBUNTU22-5.3.1.1-libpam-runtime"
