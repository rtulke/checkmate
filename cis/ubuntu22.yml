  - id: "CIS-UBUNTU22-2.2.4-telnet"
    name: "Package telnet is not installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 2.2.4. NIST SP 800-53 Rev. 5: CM-7, CM-11."
    tags: [cis, cis-ubuntu22, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
