  - id: "CIS-UBUNTU22-5.3.3.2.4-password_consecutive_characters"
    name: "password consecutive characters: grep -Psi -- '^\\h*maxrepeat\\h*=\\h*[1-3]\\b' /etc/security/pwquality.conf /etc/security/pwq…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.2.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
