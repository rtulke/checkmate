      Remove the package ftp, unless the system needs it:

      apt-get purge ftp
  - id: "CIS-UBUNTU22-2.3.1.1-chrony"
    name: "Package chrony is not installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 2.3.1.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' chrony 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: &rat-a0cc2c0b8d |
      Accurate, synchronized time is required for log correlation, Kerberos, certificate validation and time-based one-time passwords. A system should run exactly one time synchronization client. Depending on the platform the check expects chrony to be installed or, where systemd-timesyncd is the chosen client, not installed, to avoid competing daemons.
    remediation: &rem-cdcc6ec592 |
      Remove the package chrony, unless the system needs it:

      apt-get purge chrony
  - id: "CIS-UBUNTU22-2.3.1.1-ntp"
    name: "Package ntp is not installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 2.3.1.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' ntp 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: &rat-3360cd3b3f |
      Running more than one time synchronization daemon makes them compete for control of the clock. On these platforms time synchronization is expected to be handled by another daemon such as systemd-timesyncd or chrony, so the ntp package should not be installed.
    remediation: &rem-8bdd28ff2b |
      Remove the package ntp, unless the system needs it:

      apt-get purge ntp
  - id: "CIS-UBUNTU22-2.3.1.1-systemd-timesyncd"
    name: "Package systemd-timesyncd is installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 2.3.1.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' systemd-timesyncd 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-6d51fdf582 |
      Accurate, synchronized time is required to correlate logs across systems, to validate certificates and Kerberos tickets, and to build reliable forensic timelines. Where systemd-timesyncd is the chosen time client, its package must be installed.
    remediation: &rem-27c7234a9e |
      Install the package systemd-timesyncd:

