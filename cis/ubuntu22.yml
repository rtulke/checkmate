      - { none: "~ (?i)^MaxSessions (1[1-9]|[2-9][0-9]|[1-9]{3,})$" }
    rationale: *rat-5de57ba7dd
    remediation: &rem-2a968c7dc4 |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches (?i)^MaxSessions ([2-9]|10)
      - no line matches (?i)^MaxSessions (1[1-9]|[2-9][0-9]|[1-9]{3,})$
  - id: "CIS-UBUNTU22-5.1.18-ssh_maxstartups-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.18. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-32a21f45bb |
      MaxStartups controls how many unauthenticated connections sshd accepts at the same time. With 10:30:60, sshd starts refusing new unauthenticated connections at random once 10 are pending, with rising probability up to a hard limit of 60. This blunts connection floods and brute-force tools while legitimate users still get through.
    remediation: *rem-f6392187bb
  - id: "CIS-UBUNTU22-5.1.18-ssh_maxstartups-content"
    name: "/etc/ssh/sshd_config has the expected content (1 rule)"
