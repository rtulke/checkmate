  - id: "CIS-UBUNTU22-3.1.1-grub_ipv6"
    name: "grub ipv6: grep -i \"^[^#]\\s.*ipv6\" /boot/grub/grub.cfg"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i "^[^#]\s.*ipv6" /boot/grub/grub.cfg
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*linux.*ipv6.disable=1" }
      - { none: "~ ipv6.disable=0" }
    rationale: &rat-0a334b15e3 |
      If IPv6 is not used, its stack still processes traffic and may be reachable while firewall rules and monitoring focus on IPv4. Disabling IPv6 at boot removes this unmonitored attack surface. Systems or applications that need IPv6 must keep it enabled.
    remediation: &rem-979c83edd4 |
      Add ipv6.disable=1 to GRUB_CMDLINE_LINUX in /etc/default/grub, remove any ipv6.disable=0 and regenerate the GRUB configuration.

      sed -i 's/ipv6.disable=0//; s/^GRUB_CMDLINE_LINUX="/&ipv6.disable=1 /' /etc/default/grub
      update-grub

      A reboot is required. Only do this if the system does not use IPv6.
  - id: "CIS-UBUNTU22-3.1.1-ipv6_etc_default_grub"
    name: "ipv6 etc default grub: grep -i \"GRUB_CMDLINE_LINUX=.*ipv6\" /etc/default/grub"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i "GRUB_CMDLINE_LINUX=.*ipv6" /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX=.*ipv6.disable=1" }
      - { none: "~ ipv6.disable=0" }
    rationale: &rat-5fbd7e8fbd |
      If IPv6 is not used, its stack still processes traffic and may be reachable while firewall rules and monitoring focus on IPv4. Setting ipv6.disable=1 in /etc/default/grub keeps IPv6 disabled across kernel updates. Systems that need IPv6 must keep it enabled.
    remediation: *rem-979c83edd4
  - id: "CIS-UBUNTU22-3.1.2-wireless_disabled"
    name: "wireless disabled: find /sys/class/net/*/wireless -type d 2\u003e/dev/null | sed 's|/wireless$||' | while read if…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.1.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      find /sys/class/net/*/wireless -type d 2>/dev/null | sed 's|/wireless$||' | while read iface; do cat "$iface/operstate" 2>/dev/null; done | grep -v '^down$' >/dev/null && echo FAIL || echo OK
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^OK" }
      - { none: "~ ^FAIL" }
    rationale: &rat-0d79aa42e1 |
      Wireless interfaces open a network path that bypasses wired network controls such as firewalls and segmentation, and they expose the system to attackers within radio range. Servers rarely need them; turning off the radios or blocking their drivers removes this exposure.
    remediation: &rem-aa6b351acd |
      Block the driver module of every wireless interface so that no wireless interface comes up. Find each interface's driver, block it and unload it:

      basename "$(readlink -f /sys/class/net/IFACE/device/driver/module)"
      printf 'blacklist %s\ninstall %s /bin/false\n' MODULE MODULE >> /etc/modprobe.d/blacklist-wireless.conf
      modprobe -r MODULE

      On Ubuntu 20.04 every module under drivers/net/wireless must be named in /etc/modprobe.d/blacklist-wireless.conf:
      find /lib/modules/$(uname -r)/kernel/drivers/net/wireless -name '*.ko' -printf '%f\n' | sed 's/\.ko$//' | sort -u | while read -r m; do printf 'blacklist %s\ninstall %s /bin/false\n' "$m" "$m"; done >> /etc/modprobe.d/blacklist-wireless.conf

      On Ubuntu 18.04 the check reads NetworkManager instead:
      nmcli radio all off
  - id: "CIS-UBUNTU22-3.1.3-bluetooth_pkg"
    name: "Package bluez is not installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.1.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' bluez 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: &rat-26028fd092 |
      Bluetooth gives devices in radio range a way to connect to the system and has a history of remotely exploitable vulnerabilities. Servers rarely need it, so removing the BlueZ stack removes this wireless attack surface.
    remediation: &rem-60d4918f38 |
      Remove the package bluez, unless the system needs it:

      apt-get purge bluez
  - id: "CIS-UBUNTU22-3.2.1-lsmod_dccp"
    name: "lsmod dccp: lsmod | grep -i dccp"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.2.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i dccp
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-c5d39e1c4c |
      DCCP is a rarely used transport protocol whose kernel code has had serious vulnerabilities. Because unprivileged programs can trigger automatic loading of the module by opening a DCCP socket, an unused protocol still adds attack surface. The check verifies the module is not loaded.
    remediation: &rem-7463e2edd5 |
      Prevent the dccp module from loading and unload it if it is loaded.

      printf '%s\n' 'blacklist dccp' 'install dccp /bin/false' > /etc/modprobe.d/dccp.conf
      modprobe -r dccp

      If the module is in use, stop the application using it or reboot.
  - id: "CIS-UBUNTU22-3.2.1-modprobe_dccp"
    name: "modprobe dccp: modprobe -n -v dccp"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.2.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v dccp
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /bin/(true|false)" }
    rationale: &rat-41ef8e8fab |
      DCCP is a rarely used datagram transport protocol. Its kernel module has had several serious vulnerabilities that can be triggered by local users or from the network. Preventing the module from loading removes this attack surface on systems that do not use the protocol.
    remediation: &rem-66ee3312a3 |
      Keep the dccp module from being loaded: add an install override and a blacklist entry for it in /etc/modprobe.d/, then unload it if it is currently loaded.

      printf '%s\n' 'install dccp /bin/false' 'blacklist dccp' > /etc/modprobe.d/dccp.conf
      modprobe -r dccp

      modprobe -r reports an error if the module is not loaded, which is harmless; if sockets of this protocol are open, the module stays loaded until reboot.
  - id: "CIS-UBUNTU22-3.2.2-lsmod_TIPC"
    name: "lsmod TIPC: lsmod | grep -i tipc"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.2.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
