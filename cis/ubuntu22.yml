  - id: "CIS-UBUNTU22-1.1.2.1.3-tmp_nosuid_options"
    name: "/tmp is a separate mount with nosuid"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.1.2.1.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
