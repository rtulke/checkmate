  - id: "CIS-UBUNTU22-6.2.3.5-auditd_locale_cnf"
    name: "auditd locale cnf: grep system-locale /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.3.5. NIST SP 800-53 Rev. 5: AU-3, CM-6."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
