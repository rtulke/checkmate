  - id: "CIS-UBUNTU22-5.1.15-sshd_MACS"
    name: "sshd MACS: sshd -T | grep -Pi -- 'macs\\h+([^#\\n\\r]+,)?(hmac-md5|hmac-md5-96|hmac-ripemd160|hmac-sha1…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.15. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -Pi -- 'macs\h+([^#\n\r]+,)?(hmac-md5|hmac-md5-96|hmac-ripemd160|hmac-sha1-96|umac-64@openssh\.com|hmac-md5-etm@openssh\.com|hmac-md5-96-etm@openssh\.com|hmac-ripemd160-etm@openssh\.com|hmac-sha1-96-etm@openssh\.com|umac-64-etm@openssh\.com|umac-128-etm@openssh\.com)\b'
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-a16db2eaa8 |
      Message authentication codes protect SSH traffic against tampering. MD5, RIPEMD-160, truncated 96-bit and 64-bit UMAC algorithms provide weak or reduced integrity protection and may allow forgery or downgrade attacks. Limiting sshd to SHA-2 based MACs keeps integrity protection strong; very old clients may need an upgrade.
    remediation: &rem-0e4e160b54 |
      Remove the weak MACs and delete other MACs lines so the new value is the first one sshd reads. On Debian 11 to 13 and Ubuntu 22.04 and later:

      echo 'MACs -hmac-md5,hmac-md5-96,hmac-ripemd160,hmac-sha1-96,umac-64@openssh.com,hmac-md5-etm@openssh.com,hmac-md5-96-etm@openssh.com,hmac-ripemd160-etm@openssh.com,hmac-sha1-96-etm@openssh.com,umac-64-etm@openssh.com,umac-128-etm@openssh.com' > /etc/ssh/sshd_config.d/01-macs.conf

      On Ubuntu 20.04 the check expects an explicit list that contains hmac-sha2-512, hmac-sha2-256 and hmac-sha1 and no -etm or umac algorithms:

      echo 'MACs hmac-sha2-512,hmac-sha2-256,hmac-sha1' > /etc/ssh/sshd_config.d/01-macs.conf

      Then run sshd -t && systemctl reload ssh and verify with sshd -T | grep -i macs.
  - id: "CIS-UBUNTU22-5.1.16-sshd_authtries-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.16. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-7ebfd780b6 |
      MaxAuthTries caps the number of authentication attempts per connection. A low limit slows down online password guessing, because attackers must reconnect frequently, and failures are logged sooner. Four attempts is enough for normal use.
    remediation: *rem-f6392187bb
