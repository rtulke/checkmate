  - id: "CIS-UBUNTU22-6.2.3.11-auditd_session_live"
    name: "auditd session live: auditctl -l | grep -E '(session|logins)'"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.3.11. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      auditctl -l | grep -E '(session|logins)'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /var/run/utmp -p wa -k session" }
      - { some: "~ -w /var/log/wtmp -p wa -k session" }
      - { some: "~ -w /var/log/btmp -p wa -k session" }
    rationale: &rat-99f8f4c173 |
      utmp, wtmp and btmp record current sessions, past logins and failed login attempts. Watching them for changes helps to reconstruct who was logged in and reveals attempts to erase traces of logins. This check verifies that the rules are loaded in the running kernel.
    remediation: &rem-03d4a416f6 |
      Watch the session records utmp, wtmp and btmp: add the rules for your release to /etc/audit/rules.d/50-session.rules and load them.

      Debian 11, Debian 12, Ubuntu 20.04, Ubuntu 22.04 and Ubuntu 24.04:
      -w /var/run/utmp -p wa -k session
      -w /var/log/wtmp -p wa -k session
      -w /var/log/btmp -p wa -k session

      Debian 13:
      -a always,exit -F arch=b64 -S all -F path=/var/run/utmp -F perm=wa -k session
      -a always,exit -F arch=b64 -S all -F path=/var/log/wtmp -F perm=wa -k session
      -a always,exit -F arch=b64 -S all -F path=/var/log/btmp -F perm=wa -k session

      Ubuntu 18.04:
      -w /var/run/utmp -p wa -k session
      -w /var/log/wtmp -p wa -k logins
      -w /var/log/btmp -p wa -k logins

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
