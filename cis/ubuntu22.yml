    rationale: &rat-2895484d31 |
      pam_faillock locks accounts after repeated failed authentication attempts, which slows down password guessing. Its entry in common-account clears the failure records after a successful login, so the counter reflects only consecutive failures. Without it the lockout mechanism does not work as intended.
