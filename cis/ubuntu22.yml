      - { some: "~ (?i)^PermitUserEnvironment no" }
      - { none: "~ (?i)^PermitUserEnvironment yes" }
    rationale: *rat-a46f1c4dfd
    remediation: &rem-cf588fdb27 |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches (?i)^PermitUserEnvironment no
      - no line matches (?i)^PermitUserEnvironment yes
  - id: "CIS-UBUNTU22-5.1.22-ssh_usepam-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.22. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-20d91b73a4 |
      With UsePAM enabled, sshd runs the PAM account and session stacks, so lockout after failed logins, password expiry, access restrictions and session limits configured in PAM also apply to SSH logins. Without it these controls are bypassed for remote access.
    remediation: *rem-f6392187bb
  - id: "CIS-UBUNTU22-5.1.22-ssh_usepam-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.22. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
