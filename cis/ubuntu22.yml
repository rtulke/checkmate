      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-0ec07a7f50 |
      TIPC is a cluster communication protocol that few systems use, and its kernel code has had remotely exploitable vulnerabilities. Since opening a socket can load the module automatically, keeping it unloaded and blocked removes this attack surface. The check verifies the module is not loaded.
    remediation: &rem-f85d3137a2 |
      Prevent the tipc module from loading and unload it if it is loaded.

      printf '%s\n' 'blacklist tipc' 'install tipc /bin/false' > /etc/modprobe.d/tipc.conf
      modprobe -r tipc

      If the module is in use, stop the application using it or reboot.
  - id: "CIS-UBUNTU22-3.2.2-modprobe_TIPC"
    name: "modprobe TIPC: modprobe -n -v tipc"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.2.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v tipc
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ install /bin/(true|false)" }
    rationale: &rat-94829ab02a |
      TIPC is a cluster communication protocol that few systems use, and its kernel code has had remotely exploitable vulnerabilities. Mapping the module to /bin/false in the modprobe configuration prevents it from being loaded on demand, for example when a program opens a TIPC socket.
    remediation: *rem-f85d3137a2
  - id: "CIS-UBUNTU22-3.2.3-lsmod_RDS"
    name: "lsmod RDS: lsmod | grep -i rds"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.2.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
