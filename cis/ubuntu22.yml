  - id: "CIS-UBUNTU22-1.1.2.2.1-dev_shm_mount"
    name: "/dev/shm is a separate mount"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.1.2.2.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/dev/shm'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ ^(tmpfs) "
    rationale: &rat-33a19c43f1 |
      /dev/shm is world-writable shared memory storage. Mounting it as its own tmpfs bounds its size and allows restrictive mount options (nodev, nosuid, noexec), so it cannot easily serve as a staging area for device files, setuid programs or executable payloads.
    remediation: &rem-bc18969219 |
      Mount a tmpfs file system on /dev/shm with an entry in /etc/fstab or a systemd mount unit.
