      - { some: "~ -a always,exit -F arch=b32 -S chmod,fchmod,fchmodat -F auid\u003e=1000 -F auid!=(unset|4294967295|-1) -k perm_mod" }
      - { some: "~ -a always,exit -F arch=b64 -S chown,fchown,lchown,fchownat -F auid\u003e=1000 -F auid!=(unset|4294967295|-1) -k perm_mod" }
      - { some: "~ -a always,exit -F arch=b32 -S chown,fchown,lchown,fchownat -F auid\u003e=1000 -F auid!=(unset|4294967295|-1) -k perm_mod" }
      - { some: "~ -a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid\u003e=1000 -F auid!=(unset|4294967295|-1) -k perm_mod" }
      - { some: "~ -a always,exit -F arch=b32 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid\u003e=1000 -F auid!=(unset|4294967295|-1) -k perm_mod" }
