      - { none: "~ .*\\:maxsequence\\s*=\\s*0" }
    rationale: &rat-056e245d5d |
      Monotonic character sequences such as 12345 or abcdef are among the first patterns tried by password crackers. Limiting their length to three characters makes users choose passwords that are harder to predict.
    remediation: &rem-bbbdc2081c |
      Set maxsequence = 3 in a pwquality drop-in file and remove zero or higher settings of maxsequence from /etc/security/pwquality.conf and other drop-ins.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'maxsequence = 3' > /etc/security/pwquality.conf.d/50-maxsequence.conf

      The value is enforced by pam_pwquality (on Debian and Ubuntu install libpam-pwquality). Using a drop-in also matters for the check, which on some platforms fails when pwquality.conf.d contains no .conf file.
  - id: "CIS-UBUNTU22-5.3.3.2.6-dictchk_not_pamd"
    name: "dictchk not pamd: grep -Psi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwquality\\.so\\h+([^#\\n…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.2.6. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwquality\.so\h+([^#\n\r]+\h+)?dictcheck\h*=\h*0\b' /etc/pam.d/common-password
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-c426ead3e7 |
      A dictcheck=0 argument on the pam_pwquality line disables the dictionary check regardless of pwquality.conf. Users could then choose common words and known leaked passwords, which fall quickly to dictionary attacks.
    remediation: &rem-fd1d554115 |
      Remove the dictcheck= option from the pam_pwquality.so line in /etc/pam.d/common-password and keep dictcheck enabled in /etc/security/pwquality.conf.d/.

      grep -Pn 'pam_pwquality\.so.*\bdictcheck\s*=' /etc/pam.d/common-password /usr/share/pam-configs/*

      If the option comes from a profile in /usr/share/pam-configs/, remove it there and run pam-auth-update --package to regenerate common-password; otherwise edit common-password directly.
  - id: "CIS-UBUNTU22-5.3.3.2.6-password_dictchk"
    name: "password dictchk: grep -Psi -- '^\\h*dictcheck\\s*=' /etc/security/pwquality.conf /etc/security/pwquality.con…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.2.6. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*dictcheck\s*=' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:dictcheck\\s*=\\s*1" }
      - { none: "~ .*\\:dictcheck\\s*=\\s*0" }
    rationale: &rat-a54439690d |
      The dictionary check rejects passwords that are based on words from a cracking dictionary. Such passwords are guessed within seconds in offline attacks against stolen hashes. Keeping dictcheck enabled blocks the most common weak choices.
    remediation: &rem-f4e720cc77 |
      Enable the dictionary check explicitly and remove any dictcheck = 0 setting.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'dictcheck = 1' > /etc/security/pwquality.conf.d/50-dictcheck.conf
      grep -Pn '^\h*dictcheck\h*=\h*0' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf

      Delete or comment out the lines grep shows. On Debian and Ubuntu install libpam-pwquality and its cracklib dictionary so the check is effective.
  - id: "CIS-UBUNTU22-5.3.3.2.7-password_quality_enforce"
    name: "password quality enforce: grep -Psi -- '^\\h*enforcing\\s*=\\s*' /etc/security/pwquality.conf /etc/security/pwquality.…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.2.7. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*enforcing\s*=\s*' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:enforcing\\s*=\\s*1" }
      - { none: "~ .*\\:enforcing\\s*=\\s*0" }
    rationale: &rat-297189bc8a |
      pam_pwquality can run in a mode where it only warns about weak passwords but still accepts them. Setting enforcing = 1 makes the complexity rules binding, so passwords that fail the checks are rejected. An explicit setting also guards against configuration that silently disabled enforcement.
    remediation: &rem-5b3572d1af |
      Set enforcing = 1 in a pwquality drop-in file and remove any enforcing = 0 line from /etc/security/pwquality.conf and /etc/security/pwquality.conf.d/.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'enforcing = 1' > /etc/security/pwquality.conf.d/50-pwenforcing.conf
      grep -Psi '^\h*enforcing\s*=\s*0' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf

      The setting applies to the next password change; no restart is needed.
  - id: "CIS-UBUNTU22-5.3.3.2.7-quality_enforce_not_pamd"
    name: "quality enforce not pamd: grep -Psi -- '^\\h*password\\h+[^#\\n\\r]+\\h+pam_pwquality\\.so\\h+([^#\\n\\r]+\\h+)?enforcing=0\\b…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.2.7. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*password\h+[^#\n\r]+\h+pam_pwquality\.so\h+([^#\n\r]+\h+)?enforcing=0\b' /etc/pam.d/common-password
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-1765a9de3b |
      An enforcing=0 argument on the pam_pwquality line overrides pwquality.conf and turns the complexity checks into mere warnings. Users can then set passwords that violate policy while the configuration file looks compliant. Keeping the argument off the PAM line ensures the configured rules are enforced.
    remediation: &rem-85610bde86 |
      Remove the enforcing=0 argument from the pam_pwquality line in /etc/pam.d/common-password. If the line comes from a profile in /usr/share/pam-configs/ (usually pwquality), remove it there as well so pam-auth-update does not restore it.

      grep -n 'pam_pwquality' /etc/pam.d/common-password /usr/share/pam-configs/*
      sed -ri '/pam_pwquality\.so/s/\s+enforcing=0\b//' /etc/pam.d/common-password
  - id: "CIS-UBUNTU22-5.3.3.2.8-password_quality_enforce_root"
    name: "password quality enforce root: grep -Psi -- '^\\s*enforce_for_root\\b' /etc/security/pwquality.conf /etc/security/pwqualit…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.2.8. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\s*enforce_for_root\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:enforce_for_root" }
      - { none: "~ .*\\:#\\s*enforce_for_root\\s*=\\s*0" }
    rationale: &rat-ba2f1202e1 |
      By default pam_pwquality only warns root about a weak password and accepts it anyway. Since root often sets passwords for other accounts and for itself, enforce_for_root applies the same quality rules to passwords set by root.
    remediation: &rem-752a1b9c2a |
      Enable enforce_for_root in a pwquality drop-in file.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'enforce_for_root' > /etc/security/pwquality.conf.d/50-enforce_for_root.conf

      The option is evaluated by pam_pwquality (on Debian and Ubuntu install libpam-pwquality). Using a drop-in also matters for the check, which on some platforms fails when pwquality.conf.d contains no .conf file.
  - id: "CIS-UBUNTU22-5.3.3.3.1-pwhistory_remember_common_passwd-attrs"
    name: "/etc/pam.d/common-password: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.3.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/common-password'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e0779c3919 |
      Remembering at least 24 previous passwords prevents users from cycling back to an old password shortly after a forced change. Together with password ageing it ensures that a password that may have been exposed earlier does not come back into use.
    remediation: *rem-24dae7c4b7
  - id: "CIS-UBUNTU22-5.3.3.3.1-pwhistory_remember_common_passwd-content"
    name: "/etc/pam.d/common-password has the expected content (1 rule)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.3.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/common-password'
    allow_rc: any
    expect: { some: "~ ^\\s*password\\s*(requisite|required)\\s*pam_pwhistory.so.*remember\\s*=\\s*(2[4-9]|[3-9][0-9])" }
    rationale: *rat-e0779c3919
    remediation: &rem-ef2581476e |
      Edit /etc/pam.d/common-password so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*password\s*(requisite|required)\s*pam_pwhistory.so.*remember\s*=\s*(2[4-9]|[3-9][0-9])
  - id: "CIS-UBUNTU22-5.3.3.3.1-pwhistory_remember_pam_configs"
    name: "pwhistory remember pam configs: for file in `awk '/Password-Type:/{ f = 1;next } /-Type:/{ f = 0 } f {if (/pam_pwhistory\\…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.3.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      for file in `awk '/Password-Type:/{ f = 1;next } /-Type:/{ f = 0 } f {if (/pam_pwhistory\.so/) print FILENAME}' /usr/share/pam-configs/*`; do grep pam_pwhistory $file | grep -v remember;  done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-1d7ddbbc40 |
      Password history only prevents reuse if enough old passwords are remembered. On Debian-based systems the pam_pwhistory lines in the pam-auth-update profiles should carry the remember option so a regenerated PAM stack keeps the intended depth; on Red Hat systems a low remember value on the PAM line would override the configured policy. Remembering at least 24 passwords stops users from cycling back to recent ones.
    remediation: &rem-9fcd27d8d8 |
      Add remember=24 to every pam_pwhistory line of the profile(s) under /usr/share/pam-configs/ that lack it, then regenerate the PAM stack.

      grep -l pam_pwhistory /usr/share/pam-configs/*
      sed -ri '/pam_pwhistory\.so/{/remember=/!s/$/ remember=24/}' FILE
      pam-auth-update --enable $(basename FILE)

      A complete profile line typically reads: requisite pam_pwhistory.so remember=24 enforce_for_root try_first_pass use_authtok
  - id: "CIS-UBUNTU22-5.3.3.3.2-pwhistory_enforce_for_root-attrs"
    name: "/etc/pam.d/common-password: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.3.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/common-password'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-5a6040fb53 |
      By default pam_pwhistory does not apply its reuse check when a password is changed by root. enforce_for_root extends the history rule to these changes, so root's own password and passwords set as root also cannot reuse recent ones.
    remediation: *rem-24dae7c4b7
  - id: "CIS-UBUNTU22-5.3.3.3.2-pwhistory_enforce_for_root-content"
    name: "/etc/pam.d/common-password has the expected content (1 rule)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.3.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/common-password'
    allow_rc: any
    expect: { some: "~ ^\\s*password\\s*(requisite|required)\\s*pam_pwhistory.so.*enforce_for_root" }
    rationale: *rat-5a6040fb53
    remediation: &rem-9042a7fb5b |
      Edit /etc/pam.d/common-password so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*password\s*(requisite|required)\s*pam_pwhistory.so.*enforce_for_root
  - id: "CIS-UBUNTU22-5.3.3.3.2-pwhistory_enforce_for_root_pam_configs"
    name: "pwhistory enforce for root pam configs: for file in `awk '/Password-Type:/{ f = 1;next } /-Type:/{ f = 0 } f {if (/pam_pwhistory\\…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.3.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      for file in `awk '/Password-Type:/{ f = 1;next } /-Type:/{ f = 0 } f {if (/pam_pwhistory\.so/) print FILENAME}' /usr/share/pam-configs/*`; do grep pam_pwhistory $file | grep -v enforce_for_root; done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-92f8347a9d |
      On Debian-based systems pam-auth-update regenerates /etc/pam.d/common-password from the profiles in /usr/share/pam-configs. If the pam_pwhistory profile lacks enforce_for_root, regenerating the stack drops the option and password changes made as root are no longer checked against the history. Setting it in the profile keeps the control persistent.
    remediation: &rem-4eec3cc8cf |
      Add enforce_for_root to every pam_pwhistory line of the profile(s) under /usr/share/pam-configs/ that lack it, then regenerate the PAM stack.

      grep -l pam_pwhistory /usr/share/pam-configs/*
      sed -ri '/pam_pwhistory\.so/{/enforce_for_root/!s/$/ enforce_for_root/}' FILE
      pam-auth-update --enable $(basename FILE)
  - id: "CIS-UBUNTU22-5.3.3.3.3-pwhistory_use_authtok-attrs"
    name: "/etc/pam.d/common-password: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.3.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/common-password'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e35b0e1557 |
      use_authtok makes pam_pwhistory check the new password already obtained and accepted by the module above it, such as pam_pwquality, instead of prompting again. This guarantees that the password tested for reuse is the same one that passed the quality checks and is finally stored.
    remediation: *rem-24dae7c4b7
  - id: "CIS-UBUNTU22-5.3.3.3.3-pwhistory_use_authtok-content"
    name: "/etc/pam.d/common-password has the expected content (1 rule)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.3.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/common-password'
    allow_rc: any
    expect: { some: "~ ^\\s*password\\s*(requisite|required)\\s*pam_pwhistory.so.*use_authtok" }
    rationale: *rat-e35b0e1557
    remediation: &rem-8b4d555fe9 |
      Edit /etc/pam.d/common-password so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*password\s*(requisite|required)\s*pam_pwhistory.so.*use_authtok
  - id: "CIS-UBUNTU22-5.3.3.3.3-pwhistory_use_authtok_pam_configs"
    name: "pwhistory use authtok pam configs: for file in `awk '/Password-Type:/{ f = 1;next } /-Type:/{ f = 0 } f {if (/pam_pwhistory\\…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.3.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      for file in `awk '/Password-Type:/{ f = 1;next } /-Type:/{ f = 0 } f {if (/pam_pwhistory\.so/) print FILENAME}' /usr/share/pam-configs/*`; do grep pam_pwhistory $file | grep -v use_authtok; done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-285c43730e |
      On Debian-based systems the PAM password stack is regenerated from the profiles in /usr/share/pam-configs. If a pam_pwhistory profile line lacks use_authtok, a regenerated stack may prompt separately or check a different password than the one that passed the quality checks. Setting the option in the profile keeps the stack consistent.
    remediation: &rem-5983389ca3 |
      Add use_authtok to every pam_pwhistory line of the profile(s) under /usr/share/pam-configs/ that lack it, then regenerate the PAM stack.

      grep -l pam_pwhistory /usr/share/pam-configs/*
      sed -ri '/pam_pwhistory\.so/{/use_authtok/!s/$/ use_authtok/}' FILE
      pam-auth-update --enable $(basename FILE)
  - id: "CIS-UBUNTU22-5.3.3.4.1-pam_unix_nullok_pam_configs"
    name: "pam unix nullok pam configs: grep -PH -- '^\\h*^\\h*[^#\\n\\r]+\\h+pam_unix\\.so\\b' /etc/pam.d/common-password /etc/pam.d/co…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.4.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -PH -- '^\h*^\h*[^#\n\r]+\h+pam_unix\.so\b' /etc/pam.d/common-password /etc/pam.d/common-auth /etc/pam.d/common-account /etc/pam.d/common-session /etc/pam.d/common-session-noninteractive /usr/share/pam-configs/* | grep -P -- '\bnullok\b'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-4591b9b5f4 |
      The nullok option lets pam_unix accept accounts whose password field is empty, so anyone who knows the account name can authenticate without a password. Removing nullok from all pam_unix entries, and from the pam-auth-update profiles that generate them, ensures every login requires a password.
    remediation: &rem-20710270ea |
      Remove nullok from the pam_unix lines of each file reported by the check, including the profile in /usr/share/pam-configs/ (usually unix), then regenerate the PAM stack.

      awk -F: '$2 == "" {print $1}' /etc/shadow
      sed -ri '/pam_unix\.so/s/\s+nullok\b//' FILE
      pam-auth-update --enable unix

      Accounts listed by the first command can no longer log in afterwards; give them a password or lock them first.
  - id: "CIS-UBUNTU22-5.3.3.4.2-pam_unix_remember_pam_configs"
    name: "pam unix remember pam configs: grep -PH -- '^\\h*^\\h*[^#\\n\\r]+\\h+pam_unix\\.so\\b' /etc/pam.d/common-password /etc/pam.d/co…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.4.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -PH -- '^\h*^\h*[^#\n\r]+\h+pam_unix\.so\b' /etc/pam.d/common-password /etc/pam.d/common-auth /etc/pam.d/common-account /etc/pam.d/common-session /etc/pam.d/common-session-noninteractive /usr/share/pam-configs/* | grep -P -- '\bremember\b'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-3494945630 |
      Password history belongs to pam_pwhistory. The legacy remember option of pam_unix keeps its own history in /etc/security/opasswd, which duplicates or conflicts with the pwhistory configuration and makes the effective policy unclear. Removing it from pam_unix lines keeps history enforcement in one defined place.
    remediation: &rem-6570e0a84a |
      Remove the remember=N option from the pam_unix lines of each file reported by the check, including profiles in /usr/share/pam-configs/, and regenerate the PAM stack. Configure password history with pam_pwhistory instead.

      sed -ri '/pam_unix\.so/s/\s+remember=[0-9]+//' FILE
      pam-auth-update --enable unix
  - id: "CIS-UBUNTU22-5.3.3.4.3-pam_unix_strong_password_pam_configs"
    name: "pam unix strong password pam configs: grep -PH -- '^\\h*password\\h+([^#\\n\\r]+)\\h+pam_unix\\.so\\h+([^#\\n\\r]+\\h+)?(sha512|yescrypt)…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.4.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -PH -- '^\h*password\h+([^#\n\r]+)\h+pam_unix\.so\h+([^#\n\r]+\h+)?(sha512|yescrypt)\b' /etc/pam.d/common-password /usr/share/pam-configs/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*:password\\s+([^#\\n\\r]+)\\s+pam_unix\\.so.*(yescrypt|sha512)" }
    rationale: &rat-2bf87335aa |
      pam_unix decides which algorithm hashes new passwords in /etc/shadow. Legacy algorithms such as MD5 or DES make stolen hash files far easier to crack offline. Specifying yescrypt or SHA-512 ensures new passwords are stored with a strong, salted and deliberately slow hash.
    remediation: &rem-bf6043d3d9 |
      Make sure the pam_unix password line in /etc/pam.d/common-password names yescrypt (or sha512). The line is generated from /usr/share/pam-configs/unix, so set the algorithm on its Password: and Password-Initial: lines and regenerate.

      grep -n 'pam_unix.so' /etc/pam.d/common-password /usr/share/pam-configs/unix
      pam-auth-update --enable unix
      grep -P '^\s*password\s+.*pam_unix\.so.*\b(yescrypt|sha512)\b' /etc/pam.d/common-password

      Use sha512 on Ubuntu 20.04, whose pam_unix does not support yescrypt. Existing hashes change only when passwords are next changed.
  - id: "CIS-UBUNTU22-5.3.3.4.4-pam_unix_use_authtok_pam_configs"
    name: "pam unix use authtok pam configs: grep -PH -- '^\\s*password\\s+([^#\\n\\r]+)\\s+pam_unix\\.so\\s+([^#\\n\\r]+\\s+)?use_authtok\\b' /e…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.4.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -PH -- '^\s*password\s+([^#\n\r]+)\s+pam_unix\.so\s+([^#\n\r]+\s+)?use_authtok\b' /etc/pam.d/common-password
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*:password\\s+([^#\\n\\r]+)\\s+pam_unix\\.so.*use_authtok" }
    rationale: &rat-90a45cbb80 |
      When pam_unix follows a quality or history module in the password stack, use_authtok makes it store the password those modules already accepted instead of prompting again. Without it pam_unix could set a password that never went through the complexity and reuse checks.
    remediation: &rem-048d31494d |
      Make sure the pam_unix line in /etc/pam.d/common-password carries use_authtok. pam-auth-update adds it automatically when another password module such as pam_pwquality is enabled before pam_unix, so enable that profile and regenerate.

      pam-auth-update --enable pwquality
      grep -P '^\s*password\s+.*pam_unix\.so.*\buse_authtok\b' /etc/pam.d/common-password

      If it is still missing, add use_authtok to the Password: line of /usr/share/pam-configs/unix and run pam-auth-update --enable unix.
  - id: "CIS-UBUNTU22-5.4.1.1-login_defs_PASS_MAX_DAYS-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d10e12dea7 |
      A maximum password age limits how long a stolen or guessed password remains usable. PASS_MAX_DAYS in /etc/login.defs sets this limit for newly created accounts.
    remediation: &rem-0b6bdc1798 |
      Create /etc/login.defs.
  - id: "CIS-UBUNTU22-5.4.1.1-login_defs_PASS_MAX_DAYS-content"
    name: "/etc/login.defs has the expected content (3 rules)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_MAX_DAYS\\s*365" }
      - { none: "~ ^PASS_MAX_DAYS\\s*(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9]{3,})" }
      - { none: "~ ^PASS_MAX_DAYS\\s*-1" }
    rationale: *rat-d10e12dea7
    remediation: &rem-bfa939ea9a |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_MAX_DAYS\s*365
      - no line matches ^PASS_MAX_DAYS\s*(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9]{3,})
      - no line matches ^PASS_MAX_DAYS\s*-1
  - id: "CIS-UBUNTU22-5.4.1.1-users_max_pw_expire"
    name: "users max pw expire: awk -F: '($2~/^\\$.+\\$/) {if($5 \u003e 365 || $5 \u003c 1) print \"FAIL: \" $1 \" PASS_MAX_DAYS: \" $5}'…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($2~/^\$.+\$/) {if($5 > 365 || $5 < 1) print "FAIL: " $1 " PASS_MAX_DAYS: " $5}' /etc/shadow
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-98b5063c0a |
      The defaults in login.defs only apply to new accounts. Existing accounts with a password also need a maximum password age, otherwise a leaked password remains valid indefinitely.
    remediation: &rem-a3c30aeaa2 |
      Set a maximum password age of 365 days or less for each account that has a password, and the same default for new accounts.

      awk -F: '($2~/^\$.+\$/) {print $1, $5}' /etc/shadow
      chage --maxdays 365 USER
      sed -ri 's/^\s*PASS_MAX_DAYS\s+.*/PASS_MAX_DAYS 365/' /etc/login.defs
  - id: "CIS-UBUNTU22-5.4.1.2-login_defs_PASS_MIN_DAYS-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-8ab5343644 |
      A minimum password age stops users from changing their password several times in a row to get back to a previous one, which would defeat password history. PASS_MIN_DAYS sets this default for new accounts.
    remediation: *rem-0b6bdc1798
  - id: "CIS-UBUNTU22-5.4.1.2-login_defs_PASS_MIN_DAYS-content"
    name: "/etc/login.defs has the expected content (3 rules)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_MIN_DAYS\\s1" }
      - { some: "~ ^PASS_MIN_DAYS\\s([1-9]|[1-9][0-9]{2,})" }
      - { none: "~ ^PASS_MIN_DAYS\\s*(-[1-9]|0)" }
    rationale: *rat-8ab5343644
    remediation: &rem-469a43ffb2 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_MIN_DAYS\s1
      - a line matches ^PASS_MIN_DAYS\s([1-9]|[1-9][0-9]{2,})
      - no line matches ^PASS_MIN_DAYS\s*(-[1-9]|0)
  - id: "CIS-UBUNTU22-5.4.1.2-users_min_pw_expire"
    name: "users min pw expire: awk -F: '($2~/^\\$.+\\$/) {if($4 \u003c 1) print \"FAIL: \" $1 \" PASS_MIN_DAYS: \" $4}' /etc/shadow"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      awk -F: '($2~/^\$.+\$/) {if($4 < 1) print "FAIL: " $1 " PASS_MIN_DAYS: " $4}' /etc/shadow
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-4e27464f1a |
      The login.defs default only applies to new accounts. Existing accounts with a password also need a minimum password age so users cannot cycle through passwords and reuse an old one.
    remediation: &rem-f41ddcd68c |
      Set a minimum password age of at least 1 day for each account that has a password, and the same default for new accounts.

      awk -F: '($2~/^\$.+\$/) {print $1, $4}' /etc/shadow
      chage --mindays 1 USER
      sed -ri 's/^\s*PASS_MIN_DAYS\s+.*/PASS_MIN_DAYS 1/' /etc/login.defs
  - id: "CIS-UBUNTU22-5.4.1.3-login_def_PASS_WARN_AGE-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-b6acb5e924 |
      Warning users before their password expires lets them change it in time instead of being locked out or choosing a weak password in a hurry. PASS_WARN_AGE sets this warning period for new accounts.
    remediation: *rem-0b6bdc1798
  - id: "CIS-UBUNTU22-5.4.1.3-login_def_PASS_WARN_AGE-content"
    name: "/etc/login.defs has the expected content (2 rules)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_WARN_AGE\\s*7" }
      - { none: "~ ^PASS_WARN_AGE\\s*[1-6]" }
    rationale: *rat-b6acb5e924
    remediation: &rem-52765d33ac |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_WARN_AGE\s*7
      - no line matches ^PASS_WARN_AGE\s*[1-6]
  - id: "CIS-UBUNTU22-5.4.1.3-user_expire_warn"
    name: "user expire warn: awk -F: '($2~/^\\$.+\\$/) {if($6 \u003c 7) print \"FAIL: \" $1 \" PASS_WARN_AGE: \" $6}' /etc/shadow"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($2~/^\$.+\$/) {if($6 < 7) print "FAIL: " $1 " PASS_WARN_AGE: " $6}' /etc/shadow
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-5f8c45990f |
      A warning period before a password expires gives users time to choose a new password in a controlled way instead of being locked out or rushing a weak choice. Existing accounts need the setting as well, not only the login.defs default.
    remediation: &rem-edbb93fcbd |
      Set a password expiry warning of at least 7 days for each account that has a password, and the same default for new accounts.

      awk -F: '($2~/^\$.+\$/) {print $1, $6}' /etc/shadow
      chage --warndays 7 USER
      sed -ri 's/^\s*PASS_WARN_AGE\s+.*/PASS_WARN_AGE 7/' /etc/login.defs
  - id: "CIS-UBUNTU22-5.4.1.4-yescrypt_login_defs-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.1.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-66867afd0f |
      The hashing algorithm decides how hard stolen password hashes are to crack. ENCRYPT_METHOD set to YESCRYPT or SHA512 ensures new passwords use a strong, salted and slow hash instead of MD5 or other weak methods.
    remediation: *rem-0b6bdc1798
  - id: "CIS-UBUNTU22-5.4.1.4-yescrypt_login_defs-content"
    name: "/etc/login.defs has the expected content (2 rules)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.1.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^ENCRYPT_METHOD (YESCRYPT|SHA512)" }
      - { none: "~ ^ENCRYPT_METHOD (md5|bigcrypt|sha256|blowfish)" }
    rationale: *rat-66867afd0f
    remediation: &rem-2689f94081 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^ENCRYPT_METHOD (YESCRYPT|SHA512)
      - no line matches ^ENCRYPT_METHOD (md5|bigcrypt|sha256|blowfish)
  - id: "CIS-UBUNTU22-5.4.1.5-inactive_passwd"
    name: "inactive passwd: useradd -D | grep INACTIVE"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      useradd -D | grep INACTIVE
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^INACTIVE=([1-9]|[1-3][0-9]|4[0-5])$" }
      - { none: "~ INACTIVE=(-1|4[6-9]|[5-9][0-9]{1,})" }
    rationale: &rat-1b1499cc8f |
      The default INACTIVE value used by useradd defines how many days after password expiry an account is disabled. Disabling unused accounts automatically removes forgotten access paths that attackers like to exploit; a value of up to 30 or 45 days, depending on the policy, balances security and usability.
    remediation: &rem-728ced36b8 |
      Set the default password inactivity period for new accounts to 30 days and apply the same value to existing accounts that have a password.

      useradd -D -f 30
      useradd -D | grep INACTIVE
      chage --inactive 30 USER

      30 days satisfies every supported release; some releases also accept up to 45 days.
  - id: "CIS-UBUNTU22-5.4.1.5-inactive_users"
    name: "inactive users: awk -F: '($2~/^\\$.+\\$/) {if($7 == \"\" || $7 \u003e 45 || $7 \u003c 0) print \"FAIL: \" $1 \" INACTIVE: …"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($2~/^\$.+\$/) {if($7 == "" || $7 > 45 || $7 < 0) print "FAIL: " $1 " INACTIVE: " $7}' /etc/shadow
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-c4a4e8be14 |
      Accounts whose password has expired but which remain usable indefinitely are a common foothold for attackers because nobody notices their misuse. Setting a password inactivity period on every account with a password ensures that such accounts are disabled automatically after expiry.
    remediation: &rem-4e712889d3 |
      Set a password inactivity period of 30 days or less on every account that has a password, in particular on each account reported by the check.

      awk -F: '($2 ~ /^\$/) {print $1, $7}' /etc/shadow
      chage --inactive 30 USER

      Set the default for new accounts as well with useradd -D -f 30.
  - id: "CIS-UBUNTU22-5.4.1.6-passwd_chg_past"
    name: "No user has a last password change date in the future"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.1.6. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      now=$(date +%s)
      for usr in $(cut -d: -f1 /etc/shadow); do
        d=$(chage --list "$usr" 2>/dev/null | awk -F': ' '/^Last password change/ {print $2}')
        case "$d" in ""|never|*"must be changed"*) continue ;; esac
        t=$(date -d "$d" +%s 2>/dev/null) || { echo "$usr: cannot parse last password change '$d'"; continue; }
        if [ "$t" -gt "$now" ]; then echo "$usr: last password change $d is in the future"; fi
      done
    expect: empty
    rationale: &rat-eae9c8e6b4 |
      If the recorded date of the last password change lies in the future, password ageing does not work: the password never expires and the user cannot be forced to change it. Such dates usually result from a wrong system clock or manual edits and should be corrected.
    remediation: &rem-8950b282e3 |
      Check the system clock, then set the last password change of every listed user to today, or expire the password so it must be changed at the next login:

      chage --lastday "$(date +%Y-%m-%d)" USER
      chage --lastday 0 USER
  - id: "CIS-UBUNTU22-5.4.2.1-root_only_uid_0"
    name: "root only uid 0: awk -F: '($3 == 0 \u0026\u0026 $1 != \"root\") { print $1 }' /etc/passwd"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.2.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3 == 0 && $1 != "root") { print $1 }' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-cd5460c986 |
      Any account with UID 0 has full root privileges, regardless of its name. Additional UID 0 accounts are a common backdoor and bypass controls and logging that target root, so root should be the only one.
    remediation: &rem-731e1825c9 |
      Review every account other than root that has UID 0, then assign it a unique non-zero UID or remove it.

      awk -F: '($3 == 0 && $1 != "root") {print $1}' /etc/passwd
      usermod -u UID USER

      Fix ownership of the account's files after changing the UID. The ubuntu20/26 variant only verifies that root has UID 0.
  - id: "CIS-UBUNTU22-5.4.2.2-root_only_gid_0"
    name: "root only gid 0: awk -F: '($1 !~ /^(sync|shutdown|halt|operator)/ \u0026\u0026 $1 != \"root\" \u0026\u0026 $4 == 0) {print $1\":\"…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.2.2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($1 !~ /^(sync|shutdown|halt|operator)/ && $1 != "root" && $4 == 0) {print $1":"$4}' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-dcf461742c |
      Group 0 owns many sensitive system files. Accounts other than root with primary group 0 may gain access to these files, so only root should have GID 0 as its primary group.
    remediation: &rem-f6b3556b44 |
      Give root primary group 0 and assign every other listed account a different primary group.

      usermod -g 0 root
      awk -F: '($1 !~ /^(sync|shutdown|halt|operator)/ && $1 != "root" && $4 == 0) {print $1}' /etc/passwd
      usermod -g GROUP USER

      The ubuntu20/26 variant only verifies that root has GID 0.
  - id: "CIS-UBUNTU22-5.4.2.3-group_root_only_0"
    name: "group root only 0: awk -F: '($3 == 0 \u0026\u0026 $1 != \"root\") {print $1\":\"$3}' /etc/group"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.2.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3 == 0 && $1 != "root") {print $1":"$3}' /etc/group
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-e6e96aa117 |
      GID 0 is the root group, which owns many sensitive system files and directories. Any other group with GID 0 silently gives its members the same group access as root. Ensuring that only the group named root has GID 0 prevents such hidden privilege.
    remediation: &rem-481abd2b91 |
      Make sure the group root has GID 0 and give every other group that the check reports with GID 0 its own unused GID, or remove it if it is not needed.

      awk -F: '$3 == 0' /etc/group
      groupmod -g NEWGID GROUP

      Files keep GID 0 and therefore stay owned by the group root. Review the members of GROUP before changing it. If root itself does not have GID 0, fix it with groupmod -g 0 root after the other groups are moved.
  - id: "CIS-UBUNTU22-5.4.2.4-root_passwd_set"
    name: "root passwd set: passwd -S root | awk '$2 ~ /^P/ {print \"OK Password\"}'"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.2.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      passwd -S root | awk '$2 ~ /^P/ {print "OK Password"}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK Password" }
    rationale: &rat-dc1e5c0dc5 |
      If root has no password, anyone with local access, for example through the console or single-user mode, can become root without authentication. A set password, or a locked root account where administrators use sudo, ensures that root access requires a credential.
    remediation: &rem-c94fa31bf9 |
      Set a strong password for root.

      passwd root

      Where the check also accepts a locked account (status L), passwd -l root is an alternative if administrators use sudo.
  - id: "CIS-UBUNTU22-5.4.2.5-root_path_check"
    name: "root path check: /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/^PATH=//' | tr ':' '\\n'"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.2.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/^PATH=//' | tr ':' '\n'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\/" }
      - { none: "~ ^$" }
      - { none: "~ ^[^\\/]" }
    rationale: &rat-ee503b897e |
      If root's PATH contains the current directory, empty entries, relative paths or directories that other users can write to, a malicious program placed there can be executed with root privileges when an administrator types a common command name. Root's PATH should contain only absolute, root-owned and non-writable directories.
    remediation: &rem-0afab9f1f3 |
      Remove the current directory (.), empty entries (leading, trailing or double colons), relative paths and non-existent directories from root's PATH, and make sure every remaining directory is owned by root and not writable by group or others. Look for PATH assignments in root's and the system-wide shell startup files.

      su - root -c 'echo "$PATH"'
      grep -sn 'PATH' /root/.bash_profile /root/.bashrc /root/.profile /etc/profile /etc/bashrc /etc/bash.bashrc /etc/environment /etc/profile.d/*.sh
      chown root DIRECTORY
      chmod go-w DIRECTORY
  - id: "CIS-UBUNTU22-5.4.2.6-root_umask_bash_profile"
    name: "root umask bash profile: grep -i umask /root/.bash_profile /root/bashrc"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.2.6. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i umask /root/.bash_profile /root/bashrc
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ umask 00(2|7)7" }
    rationale: &rat-623cb7f319 |
      The umask determines the permissions of files root creates. With a permissive umask, configuration files, scripts or logs written by root can end up readable or writable by other users, leaking secrets or allowing tampering. Setting umask 027 or 077 in root's shell startup files keeps new files private by default.
    remediation: &rem-25f34f55b9 |
      Add umask 0027 (or 0077) at the start of a line in both /root/.bashrc and /root/.bash_profile. If /root/.bash_profile does not exist yet, create it so that it still loads /root/.profile.

      echo 'umask 0027' >> /root/.bashrc
      [ -e /root/.bash_profile ] || echo '[ -f ~/.profile ] && . ~/.profile' > /root/.bash_profile
      echo 'umask 0027' >> /root/.bash_profile

      Several variants fail when one of the files is missing, and the line must not be indented. Debian 13 reads /root/.profile instead of /root/.bash_profile; add the line there as well (echo 'umask 0027' >> /root/.profile).
  - id: "CIS-UBUNTU22-5.4.2.7-secure_system_accts"
    name: "secure system accts: awk -F: '$3\u003c1000' /etc/passwd | grep -Ev 'root|sync|halt|shutdown|nfsnobody|/sbin/nologin…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.2.7. NIST SP 800-53 Rev. 5: AC-2(5), AC-3, AC-11, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '$3<1000' /etc/passwd | grep -Ev 'root|sync|halt|shutdown|nfsnobody|/sbin/nologin|/bin/false'
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-6f6bd67ce7 |
      System and service accounts do not need an interactive shell. If one of them has a valid login shell, a weakness in a service or a misconfigured password can give an attacker an interactive session under that account. Setting the shell to nologin prevents this.
    remediation: &rem-7ac335f9ab |
      Set the login shell of every system account reported by the check to /usr/sbin/nologin.

      awk -F: '($3 < 1000 || $3 == 65534) {print $1, $7}' /etc/passwd
      usermod -s /usr/sbin/nologin USER

      Accounts root, sync, shutdown and halt are exempt. Make sure no service needs an interactive shell for the account before changing it.
  - id: "CIS-UBUNTU22-5.4.2.8-user_accts_valid_shell"
    name: "user accts valid shell: l_valid_shells=\"^($(awk -F/ '$NF != \"nologin\" {print}' /etc/shells | sed -rn '/^\\//{s,/,\\…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.2.8. NIST SP 800-53 Rev. 5: AC-2(5), AC-3, AC-11, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      l_valid_shells="^($(awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\/,g;p}' | paste -s -d '|' -))$"
      awk -v pat="$l_valid_shells" -F: '($1 != "root" && $(NF) !~ pat) {print $1}' /etc/passwd |
      while IFS= read -r l_user; do
      passwd -S "$l_user" | awk '$2 !~ /^L/ {print "Account: \"" $1 "\" does not have a valid login shell and is not locked"}'
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-b29d01d31a |
      Accounts without a valid login shell, such as service accounts with nologin, are not meant for interactive use. If their password is not locked they may still be usable for authentication through services that do not check the shell, for example FTP, su with a command or some PAM-based applications. Locking these accounts closes that path.
    remediation: &rem-bcf185911a |
      Each listed account has no valid login shell but an unlocked password. Lock the password of each listed USER:

      usermod -L USER

      If the account is actually meant for interactive logins, give it a valid shell from /etc/shells instead (usermod -s /bin/bash USER).
  - id: "CIS-UBUNTU22-5.4.3.1-nologin_not_in_shells-attrs"
    name: "/etc/shells: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/shells'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1371eb889f |
      /etc/shells lists valid login shells. Some services, such as FTP daemons or chsh, allow access only for accounts with a shell listed there. If nologin is listed, accounts that are meant to be blocked may be treated as having a valid shell and gain access through such services.
    remediation: &rem-fa056f672c |
      Create /etc/shells.
  - id: "CIS-UBUNTU22-5.4.3.1-nologin_not_in_shells-content"
    name: "/etc/shells has the expected content (1 rule)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/shells'
    allow_rc: any
    expect: { none: "~ .*nologin" }
    rationale: *rat-1371eb889f
    remediation: &rem-852b96f5ad |
      Edit /etc/shells so that its lines meet these conditions (regular expressions):

      - no line matches .*nologin
  - id: "CIS-UBUNTU22-5.4.3.2-check_timeout"
    name: "check timeout: grep TMOUT /etc/profile.d/*.sh /etc/profile /etc/profile.d/*.sh| cut -d \":\" -f2"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.3.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep TMOUT /etc/profile.d/*.sh /etc/profile /etc/profile.d/*.sh| cut -d ":" -f2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(readonly |)TMOUT" }
      - { some: "~ TMOUT=([1-8][0-9]{0,2}|900)$" }
      - { some: "~ export TMOUT" }
    rationale: &rat-e92d54c805 |
      An interactive shell left open on an unattended terminal can be used by anyone passing by. TMOUT makes the shell exit automatically after a period of inactivity. Marking it readonly and exporting it prevents users from disabling the timeout in their own session; long-running interactive work may need to account for it.
    remediation: &rem-d216d7a191 |
      Set an idle timeout of 900 seconds or less in a profile script and make it readonly and exported.

      printf '%s\n' 'TMOUT=900' 'readonly TMOUT' 'export TMOUT' > /etc/profile.d/50-tmout.sh

      Remove other TMOUT settings with larger or zero values from /etc/profile, /etc/bashrc and /etc/profile.d. The timeout applies to new login shells.
  - id: "CIS-UBUNTU22-5.4.3.3-umask_profile_scripts"
    name: "umask profile scripts: grep -i \"^\\s*umask\" /etc/profile /etc/profile.d/*.sh /etc/login.defs | cut -d \":\" -f 2"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.4.3.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i "^\s*umask" /etc/profile /etc/profile.d/*.sh /etc/login.defs | cut -d ":" -f 2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)umask\\s+0[2-7][7]" }
      - { none: "~ (?i)umask\\s+[7][0-1][0-6]" }
    rationale: &rat-0e0a7af57b |
      The umask set in shell profile scripts determines the permissions of files that users create. A permissive umask such as 022 makes new files readable by everyone, which can expose sensitive data. A system-wide umask of 027 or stricter removes access for other users by default.
    remediation: &rem-36fb94aa0b |
      Set a system-wide umask of 027 in a profile script.

      echo 'umask 027' > /etc/profile.d/50-umask.sh

      The setting applies to new login shells. On Ubuntu 24.04 the check also rejects weaker values in /etc/profile, other /etc/profile.d/*.sh scripts and the UMASK line of /etc/login.defs; raise them as well, for example with sed -ri 's/^(\s*UMASK\s+).*/\1027/' /etc/login.defs.
  - id: "CIS-UBUNTU22-6.1.1.1.1-systemd-journald-enabled"
    name: "Service systemd-journald is enabled"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.1.1. NIST SP 800-53 Rev. 5: SC-24."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journald | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-aa9c4cf1bc |
      systemd-journald collects kernel, service and user log messages and passes them to persistent storage or syslog. If it is not running, events from services and the kernel are lost, leaving gaps in the audit trail. It is a static unit that is always started by systemd.
    remediation: &rem-509c775265 |
      Enable the service systemd-journald:

      systemctl enable systemd-journald
  - id: "CIS-UBUNTU22-6.1.1.1.1-systemd-journald-running"
    name: "Service systemd-journald is running"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.1.1. NIST SP 800-53 Rev. 5: SC-24."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journald | cut -d= -f2
    expect: "== active"
    rationale: *rat-aa9c4cf1bc
    remediation: &rem-062cd16446 |
      Start the service systemd-journald:

      systemctl start systemd-journald
  - id: "CIS-UBUNTU22-6.1.1.1.3-log_rotate_journald_conf"
    name: "log rotate journald conf: systemd-analyze cat-config systemd/journald.conf | grep -Pi -- '^\\h*(SystemMaxUse|SystemK…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemd-analyze cat-config systemd/journald.conf | grep -Pi -- '^\h*(SystemMaxUse|SystemKeepFree|RuntimeMaxUse|RuntimeKeepFree|MaxFileSec)\h*=\h*\S'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (?i)^\\s*SystemMaxUse\\s*=" }
      - { some: "~ (?i)^\\s*SystemKeepFree\\s*=" }
      - { some: "~ (?i)^\\s*RuntimeMaxUse\\s*=" }
      - { some: "~ (?i)^\\s*RuntimeKeepFree\\s*=" }
      - { some: "~ (?i)^\\s*MaxFileSec\\s*=" }
    rationale: &rat-7192c1da81 |
      Without size and retention limits, the journal can grow until it fills its file system, which may stop services or cause new log records to be dropped. SystemMaxUse, SystemKeepFree, RuntimeMaxUse, RuntimeKeepFree and MaxFileSec bound disk usage and rotate journal files regularly in line with the retention policy.
    remediation: &rem-a5fb2647c9 |
      Set all five journal size and rotation limits in a journald drop-in and restart journald. Adjust the values to the site's retention policy.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nSystemMaxUse=1G\nSystemKeepFree=500M\nRuntimeMaxUse=200M\nRuntimeKeepFree=50M\nMaxFileSec=1month\n' > /etc/systemd/journald.conf.d/60-rotate.conf
      systemctl restart systemd-journald

      Some variants need at least one .conf file in /etc/systemd/journald.conf.d/, which the drop-in provides.
  - id: "CIS-UBUNTU22-6.1.1.1.4-forward_journald_disabled"
    name: "forward journald disabled: systemd-analyze cat-config systemd/journald.conf | grep -Pi -- '^\\h*ForwardToSyslog\\h*=' …"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-6, AU-7, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemd-analyze cat-config systemd/journald.conf | grep -Pi -- '^\h*ForwardToSyslog\h*=' | tail -n 1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^\\s*ForwardToSyslog\\s*=\\s*no\\s*$" }
    rationale: &rat-7503053bf7 |
      When journald is the only logging system, forwarding every message to a syslog socket duplicates the logs and hands them to a second path with different access controls and retention. Disabling ForwardToSyslog keeps one consistently protected log store. On systems that use rsyslog for local or remote logging the setting does not apply, because rsyslog depends on receiving these messages.
    remediation: &rem-6a96c2e8d8 |
      Set ForwardToSyslog=no in a journald drop-in, remove any ForwardToSyslog=yes line from /etc/systemd/journald.conf and its drop-ins, and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nForwardToSyslog=no\n' > /etc/systemd/journald.conf.d/60-forward-syslog.conf
      systemctl restart systemd-journald

      Use this only where journald, not rsyslog, is the chosen logging solution.
  - id: "CIS-UBUNTU22-6.1.1.1.5-storage_journald_conf"
    name: "storage journald conf: systemd-analyze cat-config systemd/journald.conf | grep -Pi -- '^\\h*Storage\\h*=' | tail -…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.1.5. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemd-analyze cat-config systemd/journald.conf | grep -Pi -- '^\h*Storage\h*=' | tail -n 1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^\\s*Storage\\s*=\\s*persistent\\s*$" }
    rationale: &rat-cda501aacd |
      With volatile or automatic storage, journald may keep logs only in /run, so they are lost at every reboot, including the events that led up to a crash or compromise. Storage=persistent writes the journal to /var/log/journal so the history survives restarts.
    remediation: &rem-32e0bcb5a2 |
      Configure persistent journal storage in a journald drop-in and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nStorage=persistent\n' > /etc/systemd/journald.conf.d/60-storage.conf
      systemctl restart systemd-journald

      Write the line without spaces around '='; some variants require exactly Storage=persistent.
  - id: "CIS-UBUNTU22-6.1.1.1.6-compress_journald_conf"
    name: "compress journald conf: systemd-analyze cat-config systemd/journald.conf | grep -Pi -- '^\\h*Compress\\h*=' | tail …"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.1.6. NIST SP 800-53 Rev. 5: AU-4."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemd-analyze cat-config systemd/journald.conf | grep -Pi -- '^\h*Compress\h*=' | tail -n 1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^\\s*Compress\\s*=\\s*yes\\s*$" }
    rationale: &rat-fc8701ed62 |
      Compressing large journal entries reduces the disk space the persistent journal needs, so more history fits within the configured limits and the log partition is less likely to fill. Running out of log space leads to lost records or service problems.
    remediation: &rem-bd6851d137 |
      Enable compression of large journal entries in a journald drop-in, remove any Compress=no setting, and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nCompress=yes\n' > /etc/systemd/journald.conf.d/60-compress.conf
      systemctl restart systemd-journald

      Some variants need at least one .conf file in /etc/systemd/journald.conf.d/, which the drop-in provides.
  - id: "CIS-UBUNTU22-6.1.1.2.1-systemd-journal-remote"
    name: "Package systemd-journal-remote is installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.2.1. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' systemd-journal-remote 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-c532adb37c |
      systemd-journal-remote provides systemd-journal-upload, which sends journal entries to a central collection server. Installing it is the prerequisite for keeping an off-host copy of the journal when journald is used as the logging solution.
    remediation: &rem-5d5bf76308 |
      Install the package systemd-journal-remote:

      apt-get install systemd-journal-remote
  - id: "CIS-UBUNTU22-6.1.1.2.2-journal_remote_configured-attrs"
    name: "/etc/systemd/journal-upload.conf: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.2.2. NIST SP 800-53 Rev. 5: AU-2, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/journal-upload.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-0e8e20ad09 |
      Logs kept only on the host they describe can be deleted or altered by an attacker who gains root and are lost if the system fails. systemd-journal-upload sends journal entries to a central server; configuring its URL together with a TLS key, certificate and trusted CA makes the transfer authenticated and encrypted.
    remediation: &rem-bc30e412e9 |
      Create /etc/systemd/journal-upload.conf.
  - id: "CIS-UBUNTU22-6.1.1.2.2-journal_remote_configured-content"
    name: "/etc/systemd/journal-upload.conf has the expected content (4 rules)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.2.2. NIST SP 800-53 Rev. 5: AU-2, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/systemd/journal-upload.conf'
    allow_rc: any
    expect:
      - { some: "~ ^URL=" }
      - { some: "~ ServerKeyFile=.*\\.pem" }
      - { some: "~ ServerCertificateFile=.*\\.pem" }
      - { some: "~ TrustedCertificateFile=.*\\.pem" }
    rationale: *rat-0e8e20ad09
    remediation: &rem-9feeba3841 |
      Edit /etc/systemd/journal-upload.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^URL=
      - a line matches ServerKeyFile=.*\.pem
      - a line matches ServerCertificateFile=.*\.pem
      - a line matches TrustedCertificateFile=.*\.pem
  - id: "CIS-UBUNTU22-6.1.1.2.3-systemd-journal-upload.service-enabled"
    name: "Service systemd-journal-upload.service is enabled"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.2.3. NIST SP 800-53 Rev. 5: AU-2, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journal-upload.service | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-b770b19f4c |
      Logs kept only on the host can be deleted or altered by an attacker who gains root. Running systemd-journal-upload continuously ships journal entries to a remote collector, preserving them off-host. It is only relevant where systemd-journal-remote is the chosen central logging method rather than rsyslog.
    remediation: &rem-c6c7c65dbe |
      Enable the service systemd-journal-upload.service:

      systemctl enable systemd-journal-upload.service
  - id: "CIS-UBUNTU22-6.1.1.2.3-systemd-journal-upload.service-running"
    name: "Service systemd-journal-upload.service is running"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.2.3. NIST SP 800-53 Rev. 5: AU-2, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journal-upload.service | cut -d= -f2
    expect: "== active"
    rationale: *rat-b770b19f4c
    remediation: &rem-7f8e123d83 |
      Start the service systemd-journal-upload.service:

      systemctl start systemd-journal-upload.service
  - id: "CIS-UBUNTU22-6.1.1.2.4-systemd-journal-remote.service-running"
    name: "Service systemd-journal-remote.service is not running"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journal-remote.service | cut -d= -f2
    expect: "!= active"
    rationale: &rat-64ce008fa2 |
      systemd-journal-remote receives journal data from other hosts over the network. On a system that is not a central log collector, running it exposes an unneeded network service and lets other machines write data to local disk. Keeping it stopped and disabled reduces the attack surface.
    remediation: &rem-247935200f |
      Stop the service systemd-journal-remote.service, unless the system needs it:

      systemctl stop systemd-journal-remote.service
  - id: "CIS-UBUNTU22-6.1.1.2.4-systemd-journal-remote.socket-enabled"
    name: "Service systemd-journal-remote.socket is not enabled"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journal-remote.socket | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-87dd56fa7c |
      systemd-journal-remote.socket accepts journal data from other hosts over the network. Only a designated log collector should listen for it; on other systems it is an unnecessary network service that could receive forged logs or be used to fill the disk.
    remediation: &rem-6593464f6f |
      Disable the service systemd-journal-remote.socket, unless the system needs it:

      systemctl disable systemd-journal-remote.socket

      To keep other units from starting it, mask it instead: systemctl mask systemd-journal-remote.socket
  - id: "CIS-UBUNTU22-6.1.1.2.4-systemd-journal-remote.socket-running"
    name: "Service systemd-journal-remote.socket is not running"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journal-remote.socket | cut -d= -f2
    expect: "!= active"
    rationale: *rat-87dd56fa7c
    remediation: &rem-965b15f40c |
      Stop the service systemd-journal-remote.socket, unless the system needs it:

      systemctl stop systemd-journal-remote.socket
  - id: "CIS-UBUNTU22-6.1.1.2.4-journald_remote_not_active"
    name: "journald remote not active: systemctl is-active systemd-journal-remote.socket systemd-journal-remote.service 2\u003e/dev/n…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl is-active systemd-journal-remote.socket systemd-journal-remote.service 2>/dev/null | grep '^active'
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-0aab99a796 |
      systemd-journal-remote listens for journal entries sent by other hosts. On a system that is not a central log collector, an active socket or service needlessly exposes a network listener and lets remote machines write data to local disk. Keeping both units stopped reduces the attack surface.
    remediation: &rem-124e841e0b |
      Stop the socket and the service of systemd-journal-remote unless this host is a central log collector.

      systemctl stop systemd-journal-remote.socket systemd-journal-remote.service
  - id: "CIS-UBUNTU22-6.1.1.2.4-journald_remote_not_enabled"
    name: "journald remote not enabled: systemctl is-enabled systemd-journal-remote.socket systemd-journal-remote.service 2\u003e/dev/…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.1.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl is-enabled systemd-journal-remote.socket systemd-journal-remote.service 2>/dev/null | grep '^enabled'
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-c568e1751f |
      If the systemd-journal-remote socket or service is enabled, the network receiver for journal data starts again at every boot even after being stopped. On hosts that are not log collectors, disabling both units ensures the listener stays off permanently.
    remediation: &rem-5f1659b2b9 |
      Disable and stop the socket and the service of systemd-journal-remote unless this host is a central log collector.

      systemctl disable --now systemd-journal-remote.socket systemd-journal-remote.service
  - id: "CIS-UBUNTU22-6.1.2.1-rsyslog"
    name: "Package rsyslog is installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.2.1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' rsyslog 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-ec4e2f2832 |
      rsyslog collects log messages from the kernel, services and applications, writes them to files and can forward them to a central log server. Without an installed, enabled and running syslog daemon, security-relevant events are not recorded in a durable way and incidents cannot be investigated.
    remediation: &rem-f12d1ee716 |
      Install the package rsyslog:

      apt-get install rsyslog
  - id: "CIS-UBUNTU22-6.1.2.2-rsyslog-enabled"
    name: "Service rsyslog is enabled"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.2.2. NIST SP 800-53 Rev. 5: ACM-6."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState rsyslog | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-ec4e2f2832
    remediation: &rem-092ce033e4 |
      Enable the service rsyslog:

      systemctl enable rsyslog
  - id: "CIS-UBUNTU22-6.1.2.2-rsyslog-running"
    name: "Service rsyslog is running"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.2.2. NIST SP 800-53 Rev. 5: ACM-6."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState rsyslog | cut -d= -f2
    expect: "== active"
    rationale: *rat-ec4e2f2832
    remediation: &rem-e1b56d94f4 |
      Start the service rsyslog:

      systemctl start rsyslog
  - id: "CIS-UBUNTU22-6.1.2.3-forward_journald_conf"
    name: "forward journald conf: systemd-analyze cat-config systemd/journald.conf | grep -Pi -- '^\\h*ForwardToSyslog\\h*=' …"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.2.3. NIST SP 800-53 Rev. 5: AC-3, AU-2, AU-4, AU-12, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemd-analyze cat-config systemd/journald.conf | grep -Pi -- '^\h*ForwardToSyslog\h*=' | tail -n 1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^\\s*ForwardToSyslog\\s*=\\s*yes\\s*$" }
    rationale: &rat-143e885d75 |
      When rsyslog is the log processor, journald must forward messages to it, otherwise events never reach the syslog files and remote collectors configured there. Setting ForwardToSyslog=yes makes sure all journal messages are also handled by rsyslog.
    remediation: &rem-59256c1df4 |
      Configure journald to forward messages to the syslog daemon in a drop-in and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nForwardToSyslog=yes\n' > /etc/systemd/journald.conf.d/60-forward.conf
      systemctl restart systemd-journald

      Remove any ForwardToSyslog=no line from /etc/systemd/journald.conf and other drop-ins. The Ubuntu 20.04 check reads only /etc/systemd/journald.conf itself, so set the option there as well:

      sed -i -E 's/^#?\s*ForwardToSyslog\s*=.*/ForwardToSyslog=yes/' /etc/systemd/journald.conf
      grep -q '^ForwardToSyslog=yes' /etc/systemd/journald.conf || sed -i '/^\[Journal\]/a ForwardToSyslog=yes' /etc/systemd/journald.conf
      systemctl restart systemd-journald
  - id: "CIS-UBUNTU22-6.1.2.4-perms_rsyslog_d"
    name: "perms rsyslog d: grep -s ^\\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf | cut -f2 -d:"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.2.4. NIST SP 800-53 Rev. 5: AC-3, AC-6, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -s ^\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf | cut -f2 -d:
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ \\$FileCreateMode 06[0-4]0" }
      - { none: "~ \\$FileCreateMode 06[6-7][0-7]" }
    rationale: &rat-2b2fc7d019 |
      Log files often contain sensitive information such as user names, host names and error details. Setting $FileCreateMode to 0640 or stricter ensures that log files created by rsyslog are not readable or writable by arbitrary users, who could otherwise gather information or tamper with evidence.
    remediation: &rem-aa234ce03e |
      Make rsyslog create log files with mode 0640 by setting $FileCreateMode in a drop-in file that is read before the logging rules, and change every other $FileCreateMode line to 0640 as well.

      grep -n 'FileCreateMode' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      echo '$FileCreateMode 0640' > /etc/rsyslog.d/00-filecreatemode.conf
      systemctl restart rsyslog

      The mode applies to files created after the restart; correct existing log files separately.
  - id: "CIS-UBUNTU22-6.1.2.5-etc_rsyslog.conf-attrs"
    name: "/etc/rsyslog.conf: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.2.5. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/rsyslog.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-863f7605c9 |
      rsyslog only records what its rules tell it to. Rules that route emergency, authentication, mail, news, cron, warning, critical and local facility messages into dedicated files make sure that security-relevant events are recorded and can be found quickly during an investigation. A restrictive file creation mode keeps the resulting log files from being readable by other users.
    remediation: &rem-d45052d244 |
      Create /etc/rsyslog.conf.
  - id: "CIS-UBUNTU22-6.1.2.5-etc_rsyslog.conf-content"
    name: "/etc/rsyslog.conf has the expected content (14 rules)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.2.5. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/rsyslog.conf'
    allow_rc: any
    expect:
      - { some: "~ ^\\*.emerg\\s+:omusrmsg:\\*" }
      - { some: "~ auth,authpriv.\\*\\s+/var/log/secure" }
      - { some: "~ ^mail.\\*\\s+-/var/log/mail" }
      - { some: "~ ^mail.info\\s+-/var/log/mail.info" }
      - { some: "~ ^mail.warning\\s+-/var/log/mail.warning" }
      - { some: "~ ^mail.err\\s+/var/log/mail.err" }
      - { some: "~ ^cron.\\*\\s+/var/log/cron" }
      - { some: "~ ^\\*\\.=warning;\\*\\.=err\\s+-\\/var\\/log\\/warn" }
      - { some: "~ ^\\*\\.crit\\s+-?\\/var\\/log\\/warn" }
      - { some: "~ ^\\*\\.\\*;mail\\.none;news\\.none\\s+-?\\/var\\/log\\/messages" }
      - { some: "~ ^local0,local1.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local2,local3.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local4,local5.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local6,local7.\\*\\s+-/var/log/localmessages" }
    rationale: *rat-863f7605c9
    remediation: &rem-2421047e17 |
      Edit /etc/rsyslog.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\*.emerg\s+:omusrmsg:\*
      - a line matches auth,authpriv.\*\s+/var/log/secure
      - a line matches ^mail.\*\s+-/var/log/mail
      - a line matches ^mail.info\s+-/var/log/mail.info
      - a line matches ^mail.warning\s+-/var/log/mail.warning
      - a line matches ^mail.err\s+/var/log/mail.err
      - a line matches ^cron.\*\s+/var/log/cron
      - a line matches ^\*\.=warning;\*\.=err\s+-\/var\/log\/warn
      - a line matches ^\*\.crit\s+-?\/var\/log\/warn
      - a line matches ^\*\.\*;mail\.none;news\.none\s+-?\/var\/log\/messages
      - a line matches ^local0,local1.\*\s+-/var/log/localmessages
      - a line matches ^local2,local3.\*\s+-/var/log/localmessages
      - a line matches ^local4,local5.\*\s+-/var/log/localmessages
      - a line matches ^local6,local7.\*\s+-/var/log/localmessages
  - id: "CIS-UBUNTU22-6.1.2.6-remote_syslog"
    name: "remote syslog: grep -E \"action.*omfwd.*target\" /etc/rsyslog.conf /etc/rsyslog.d/*.conf"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.2.6. NIST SP 800-53 Rev. 5: AU-6."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "action.*omfwd.*target" /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ \\*\\.\\* action\\(type=\"omfwd\" target=\"logagg\\.example\\.com\" port=\"514\"" }
      - { some: "~ protocol=\"tcp\"" }
    rationale: &rat-de6c4769ee |
      Logs kept only on the host can be deleted or altered by an attacker who has gained control of it, and they are lost if the system fails. Forwarding messages to a central log server keeps an independent copy and allows correlation of events across systems.
    remediation: &rem-6f08e3cbdc |
      Forward all messages to the central log server over TCP with an rsyslog drop-in file and restart rsyslog. Replace LOGHOST with the name of your log server.

      Ubuntu 22.04:
      echo '*.* action(type="omfwd" target="LOGHOST" port="514" protocol="tcp" action.resumeRetryCount="100" queue.type="LinkedList" queue.size="1000")' > /etc/rsyslog.d/60-remote.conf

      Ubuntu 18.04:
      echo '*.* @@LOGHOST:514' > /etc/rsyslog.d/60-remote.conf

      systemctl restart rsyslog

      On Ubuntu 22.04 the check compares the target with the fixed example host name logagg.example.com; the policy has to be adapted to the real log server.
  - id: "CIS-UBUNTU22-6.1.2.7-local_syslog_input"
    name: "local syslog input: grep -E \"imtcp\\\" port|InputTCPServerRun\" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.2.7. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12, CM-6."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "imtcp\" port|InputTCPServerRun" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -v ":#"
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-46d6ea0433 |
      rsyslog can accept log messages from other hosts over TCP. On a system that is not a designated log server, such a listener opens an unneeded network port and lets anyone who can reach it inject forged log entries or fill the disk.
    remediation: &rem-30523f0cee |
      Remove the TCP input definitions from the rsyslog configuration, or comment them out with # as the first character of the line, then restart rsyslog.

      grep -En 'imtcp" port|InputTCPServerRun' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      systemctl restart rsyslog

      Lines to disable look like input(type="imtcp" port="514") or $InputTCPServerRun 514. Keep them only on dedicated log servers.
  - id: "CIS-UBUNTU22-6.1.2.7-local_syslog_module"
    name: "local syslog module: grep \"imtcp\" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -Ev \":#|port=\""
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.2.7. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12, CM-6."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "imtcp" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -Ev ":#|port="
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-035740240e |
      Loading rsyslog's imtcp module is the first step to accepting log messages from the network. On a system that is not a designated log server the module is not needed, and leaving it loaded makes it easy to open a listener by accident. Not loading it keeps the host from receiving remote log data.
    remediation: &rem-2c410b4533 |
      Remove the lines that load the imtcp module, or comment them out with # as the first character of the line, then restart rsyslog.

      grep -n 'imtcp' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      systemctl restart rsyslog

      Lines to disable look like module(load="imtcp") or $ModLoad imtcp. The check ignores a commented line only if the # is at the very start.
  - id: "CIS-UBUNTU22-6.1.3.1-logfile_configured"
    name: "logfile configured: find /var/log/ -type f \\( -name 'lastlog' -o -name 'wtmp' -o -name 'btmp' \\) -perm /g+x,o…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.1.3.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /var/log/ -type f \( -name 'lastlog' -o -name 'wtmp' -o -name 'btmp' \) -perm /g+x,o+wx -exec ls -l "{}" + ; find /var/log/ -type f \( -name 'secure' -o -name 'auth*' -o -name 'syslog' -o -name 'messages' \) -perm /u+x,g+wx,o+rwx -exec ls -l "{}" +; find /var/log/ -type f \( -name 'SSSD' -o -name 'sssd' -o -name 'gdm*' \) -perm /ug+x,o+rwx -exec ls -l "{}" +
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-0de5450138 |
      Log files can contain sensitive data and are important evidence after a security incident. If they are writable or readable by unauthorised users, information leaks and logs can be altered or deleted to hide an attack. Access to files under /var/log should be limited to what each kind of log needs.
    remediation: &rem-42ace0ab21 |
      Review every file listed by the check and remove the excess permissions. General and authentication logs should be 0640 or stricter; lastlog, wtmp and btmp may keep group write (0664) for the utmp group.

      chmod u-x,g-wx,o-rwx FILE
      chmod g-x,o-wx /var/log/lastlog /var/log/wtmp /var/log/btmp

      Also adjust the creating service and the create directives in /etc/logrotate.conf and /etc/logrotate.d/, otherwise the permissions come back with the next rotation. On RHEL 7, Ubuntu 18.04 (and for lastlog on Amazon Linux 2023) the check also flags group write on these login records; remove it there with chmod g-w if accepted.
  - id: "CIS-UBUNTU22-6.2.1.1-audispd-plugins"
    name: "Package audispd-plugins is installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12, SI-5."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      dpkg-query -W -f='${Status}' audispd-plugins 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-c47e4e0adc |
      audispd-plugins provides plugins for the audit event dispatcher, notably audisp-remote, which forwards audit records to a remote server. Sending audit records off the host protects them from tampering by an attacker who obtains root locally and enables central analysis.
    remediation: &rem-0da9f6bc36 |
      Install the package audispd-plugins:

      apt-get install audispd-plugins
  - id: "CIS-UBUNTU22-6.2.1.1-audit_packages"
    name: "Package auditd is installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12, SI-5."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      dpkg-query -W -f='${Status}' auditd 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-7fcda27331 |
      The Linux audit framework records security-relevant events such as logins, privilege use, changes to critical files and administrative actions. Its user-space tools (auditd, auditctl, augenrules) must be installed for the kernel audit events to be collected, written to disk and reviewed.
    remediation: &rem-829fca5e08 |
      Install the package auditd:

      apt-get install auditd
  - id: "CIS-UBUNTU22-6.2.1.2-auditd-enabled"
    name: "Service auditd is enabled"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p UnitFileState auditd | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-f809f26f23 |
      auditd is the daemon that receives audit events from the kernel and writes them to disk. If it is not installed, enabled and running, audit rules have no effect on the persistent trail, and security events go unrecorded.
    remediation: &rem-5d15604058 |
      Enable the service auditd:

      systemctl enable auditd
  - id: "CIS-UBUNTU22-6.2.1.2-auditd-running"
    name: "Service auditd is running"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p ActiveState auditd | cut -d= -f2
    expect: "== active"
    rationale: *rat-f809f26f23
    remediation: &rem-ce273a00c5 |
      Start the service auditd:

      systemctl start auditd
  - id: "CIS-UBUNTU22-6.2.1.3-grub_audit_start-attrs"
    name: "/etc/default/grub: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-8f037ed85b |
      Processes started before auditd are only audited if auditing is enabled on the kernel command line. Booting with audit=1 makes the kernel record events from the very beginning of the boot process, so early activity cannot escape the audit trail; audit=0 anywhere would disable auditing.
    remediation: *rem-2d1523887c
  - id: "CIS-UBUNTU22-6.2.1.3-grub_audit_start-content"
    name: "/etc/default/grub has the expected content (2 rules)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect:
      - { some: "~ ^GRUB_CMDLINE_LINUX=.*audit=1" }
      - { none: "~ audit=0" }
    rationale: *rat-8f037ed85b
    remediation: &rem-eb7064eea6 |
      Edit /etc/default/grub so that its lines meet these conditions (regular expressions):

      - a line matches ^GRUB_CMDLINE_LINUX=.*audit=1
      - no line matches audit=0
  - id: "CIS-UBUNTU22-6.2.1.3-auditd_grub"
    name: "auditd grub: grep \"^\\s*linux\" /boot/grub/grub.cfg | grep -Evc \"audit=1\""
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep "^\s*linux" /boot/grub/grub.cfg | grep -Evc "audit=1"
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ 0" }
    rationale: &rat-962eefef95 |
      Processes started before the audit daemon are not audited unless auditing is enabled in the kernel from the start. The audit=1 kernel parameter turns on auditing at boot, so that early activity is recorded and processes can be audited throughout their life.
    remediation: &rem-be9235aa20 |
      Add audit=1 to GRUB_CMDLINE_LINUX in /etc/default/grub (unless it is already there) and regenerate the GRUB configuration; GRUB_CMDLINE_LINUX also applies to recovery entries, which the check includes.

      sed -ri 's/^(GRUB_CMDLINE_LINUX=")/\1audit=1 /' /etc/default/grub
      update-grub

      A reboot is required.
  - id: "CIS-UBUNTU22-6.2.1.4-grub_audit_backlog-attrs"
    name: "/etc/default/grub: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-2995c085fe |
      The kernel buffers audit records until auditd reads them. During boot or bursts of activity the default backlog of 64 records can overflow, causing records to be lost or the kernel to react according to the failure mode. audit_backlog_limit=8192 or more provides enough buffer space.
    remediation: *rem-2d1523887c
  - id: "CIS-UBUNTU22-6.2.1.4-grub_audit_backlog-content"
    name: "/etc/default/grub has the expected content (2 rules)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect:
      - { some: "~ GRUB_CMDLINE_LINUX=\".*audit_backlog_limit=8192" }
      - { some: "~ audit_backlog_limit=(819[2-9]|8[2-9]{2,}|9[0-9]{3,}|[1-9]{5,})" }
    rationale: *rat-2995c085fe
    remediation: &rem-ff87232567 |
      Edit /etc/default/grub so that its lines meet these conditions (regular expressions):

      - a line matches GRUB_CMDLINE_LINUX=".*audit_backlog_limit=8192
      - a line matches audit_backlog_limit=(819[2-9]|8[2-9]{2,}|9[0-9]{3,}|[1-9]{5,})
  - id: "CIS-UBUNTU22-6.2.1.4-auditd_grub_backlog"
    name: "auditd grub backlog: grep \"^\\s*linux\" /boot/grub/grub.cfg | grep -Evc \"audit_backlog_limit=\""
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep "^\s*linux" /boot/grub/grub.cfg | grep -Evc "audit_backlog_limit="
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ 0" }
    rationale: &rat-c5aa23a467 |
      The audit backlog buffers events until auditd can process them. During boot or bursts of activity a small default backlog can overflow, and events are lost. Setting audit_backlog_limit on the kernel command line makes the buffer large enough from the start.
    remediation: &rem-492309b40b |
      Add audit_backlog_limit=8192 to GRUB_CMDLINE_LINUX in /etc/default/grub and regenerate the GRUB configuration.

      sed -i 's/^GRUB_CMDLINE_LINUX="/&audit_backlog_limit=8192 /' /etc/default/grub
      update-grub

      If the parameter is already present with another value, edit it instead of adding it twice. A reboot is required to activate it.
  - id: "CIS-UBUNTU22-6.2.2.1-auditd_max_log_file"
    name: "auditd max log file: grep -E \"^max_log_file\" /etc/audit/auditd.conf"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.2.1. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E "^max_log_file" /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ max_log_file\\s*=\\s*[1-9][0-9]{1,2}" }
    rationale: &rat-c19882aca4 |
      max_log_file sets the size in megabytes at which auditd rotates its log file. A deliberately chosen size, together with the rotation action, makes sure that the audit trail fits the available disk space and the retention requirements.
    remediation: &rem-60ccd42d4c |
      Set max_log_file in /etc/audit/auditd.conf to the log file size in megabytes required by the site policy (the check accepts 10 to 999), then make auditd re-read its configuration.

      sed -i -E 's/^\s*#?\s*max_log_file\s*=.*/max_log_file = 32/' /etc/audit/auditd.conf
      grep -q '^max_log_file = ' /etc/audit/auditd.conf || echo 'max_log_file = 32' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      Keep the spaces around the equals sign; most variants of the check expect 'max_log_file = VALUE' exactly.
  - id: "CIS-UBUNTU22-6.2.2.2-auditd_max_log_action"
    name: "auditd max log action: grep -E \"^max_log_file_action\" /etc/audit/auditd.conf"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.2.2. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E "^max_log_file_action" /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ max_log_file_action\\s*=\\s*keep_logs" }
    rationale: &rat-cf0277f2a2 |
      max_log_file_action defines what auditd does when the log file reaches its maximum size. With keep_logs, logs are rotated but never deleted automatically, so no audit records are lost; disk usage then has to be monitored.
    remediation: &rem-ca1a3f989b |
      Set max_log_file_action to keep_logs in /etc/audit/auditd.conf, then make auditd re-read its configuration.

      sed -i -E 's/^\s*#?\s*max_log_file_action\s*=.*/max_log_file_action = keep_logs/' /etc/audit/auditd.conf
      grep -q '^max_log_file_action = keep_logs' /etc/audit/auditd.conf || echo 'max_log_file_action = keep_logs' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      With keep_logs auditd never deletes old logs; monitor the free space of the audit log partition.
  - id: "CIS-UBUNTU22-6.2.2.3-auditd_space_actions-attrs"
    name: "/etc/audit/auditd.conf: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.2.3. NIST SP 800-53 Rev. 5: AU-2, AU-8, AU-12, SI-5."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-91dc1205d0 |
      When the audit log partition fills up or a disk error occurs, auditd must not silently stop recording. These actions warn administrators by email as space runs low and halt or isolate the system when space is exhausted, so no activity takes place without an audit trail. Halting favours accountability over availability, which has to be weighed for each host.
    remediation: &rem-fdf1d22c95 |
      Create /etc/audit/auditd.conf.
  - id: "CIS-UBUNTU22-6.2.2.3-auditd_space_actions-content"
    name: "/etc/audit/auditd.conf has the expected content (2 rules)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.2.3. NIST SP 800-53 Rev. 5: AU-2, AU-8, AU-12, SI-5."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect:
      - { some: "~ disk_full_action\\s*=\\s*(halt|single)" }
      - { some: "~ disk_error_action\\s*=\\s*(syslog|single|halt)" }
    rationale: *rat-91dc1205d0
    remediation: &rem-779f28df0a |
      Edit /etc/audit/auditd.conf so that its lines meet these conditions (regular expressions):

      - a line matches disk_full_action\s*=\s*(halt|single)
      - a line matches disk_error_action\s*=\s*(syslog|single|halt)
  - id: "CIS-UBUNTU22-6.2.2.4-auditd_space_actions"
    name: "auditd space actions: grep -E \"action\" /etc/audit/auditd.conf"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-8, AU-12, SI-5."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E "action" /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ space_left_action\\s*=\\s*email" }
      - { some: "~ space_left_action\\s*=\\s*(email|exec|single|halt)" }
      - { some: "~ ^admin_space_left_action\\s*=\\s*halt" }
      - { some: "~ ^admin_space_left_action\\s*=\\s*(single|halt)" }
    rationale: *rat-91dc1205d0
    remediation: &rem-ee28b55efb |
      Set the disk space and disk error actions in /etc/audit/auditd.conf (the keys exist in the default file; add them if missing) and make auditd reread its configuration.

      sed -ri 's/^\s*#?\s*disk_full_action\s*=.*/disk_full_action = halt/' /etc/audit/auditd.conf
      sed -ri 's/^\s*#?\s*disk_error_action\s*=.*/disk_error_action = halt/' /etc/audit/auditd.conf
      sed -ri 's/^\s*#?\s*space_left_action\s*=.*/space_left_action = email/' /etc/audit/auditd.conf
      sed -ri 's/^\s*#?\s*admin_space_left_action\s*=.*/admin_space_left_action = halt/' /etc/audit/auditd.conf
      pkill -HUP -x auditd

      space_left_action = email needs a working local MTA and action_mail_acct; single is accepted instead of halt for disk_full_action, and syslog or single for disk_error_action, if availability matters more.
  - id: "CIS-UBUNTU22-6.2.3.1-auditd_admin_scope_cnf"
    name: "auditd admin scope cnf: grep scope /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.3.1. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep scope /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /etc/sudoers -p wa -k scope" }
      - { some: "~ -w /etc/sudoers\\.d/ -p wa -k scope" }
    rationale: &rat-7172c39fee |
      Changes to /etc/sudoers and /etc/sudoers.d alter who may run which commands with elevated privileges. Audit rules that record every write or attribute change to these files make unauthorised privilege grants detectable. This check verifies that the rules are part of the persistent audit configuration.
    remediation: &rem-06ec31c075 |
      Watch the sudoers configuration for changes: add the rules for your release to /etc/audit/rules.d/50-scope.rules and load them.

      Debian 11, Debian 12, Ubuntu 20.04 and Ubuntu 24.04:
      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d -p wa -k scope

      Debian 13:
      -a always,exit -F arch=b64 -S all -F path=/etc/sudoers -F perm=wa -k scope
      -a always,exit -F arch=b64 -S all -F dir=/etc/sudoers.d -F perm=wa -k scope

      Ubuntu 18.04 and Ubuntu 22.04:
      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d/ -p wa -k scope

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
  - id: "CIS-UBUNTU22-6.2.3.1-auditd_admin_scope_live"
    name: "auditd admin scope live: auditctl -l | grep scope"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.3.1. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      auditctl -l | grep scope
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /etc/sudoers -p wa -k scope" }
      - { some: "~ -w /etc/sudoers\\.d -p wa -k scope" }
    rationale: &rat-6dc7f1b6de |
      Changes to /etc/sudoers and /etc/sudoers.d alter who may run which commands with elevated privileges. Audit rules that record every write or attribute change to these files make unauthorised privilege grants detectable. This check verifies that the rules are loaded in the running kernel.
    remediation: *rem-06ec31c075
  - id: "CIS-UBUNTU22-6.2.3.2-auditd_sudo_actions"
    name: "auditd sudo actions: grep user_emulation /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.3.2. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep user_emulation /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*:-a always,exit -F arch=b64 -C euid!=uid -F auid!=(unset|4294967295|-1) -S execve -k user_emulation" }
      - { some: "~ .*:-a always,exit -F arch=b32 -C euid!=uid -F auid!=(unset|4294967295|-1) -S execve -k user_emulation" }
    rationale: &rat-5c8eb61f92 |
      Commands run with sudo or other set-user-ID mechanisms execute with an effective user ID that differs from the real user. Auditing these executions records who ran which command with elevated or different privileges, which is essential for accountability and for detecting misuse of administrative rights.
    remediation: &rem-a5e1d53136 |
      Add the following rules to a file under /etc/audit/rules.d/ and load them:

      cat >> /etc/audit/rules.d/50-user_emulation.rules <<'EOF'
      -a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation
      -a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation
      EOF
      augenrules --load

      If the audit configuration is immutable (-e 2 in the rules), the new rules only take effect after a reboot.
  - id: "CIS-UBUNTU22-6.2.3.2-auditd_sudo_actions_live"
    name: "auditd sudo actions live: auditctl -l | grep user_emulation"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.3.2. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      auditctl -l | grep user_emulation
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S execve -C uid!=euid -F auid!=(unset|4294967295|-1) -F key=user_emulation" }
      - { some: "~ -a always,exit -F arch=b32 -S execve -C uid!=euid -F auid!=(unset|4294967295|-1) -F key=user_emulation" }
    rationale: *rat-5c8eb61f92
    remediation: &rem-e21d668956 |
      Make sure the following rules are present in a file under /etc/audit/rules.d/ and load them into the running kernel:

      cat >> /etc/audit/rules.d/50-user_emulation.rules <<'EOF'
      -a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation
      -a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation
      EOF
      augenrules --load

      Check the result with auditctl -l. If the audit configuration is immutable (-e 2 in the rules), the new rules only take effect after a reboot.
  - id: "CIS-UBUNTU22-6.2.3.3-auditd_sudolog_chg"
    name: "auditd sudolog chg: grep sudo_log_file /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.3.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep sudo_log_file /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /var/log/sudo\\.log -p wa -k sudo_log_file" }
    rationale: &rat-92e109d127 |
      The sudo log file records administrative commands. An attacker who has gained elevated rights may try to edit or truncate it to hide their actions. Auditing writes and attribute changes to the file makes such tampering visible.
    remediation: &rem-c5d4ccbaad |
      Add the following rules to a file under /etc/audit/rules.d/ and load them:

      cat >> /etc/audit/rules.d/50-sudo.rules <<'EOF'
      -w /var/log/sudo.log -p wa -k sudo_log_file
      EOF
      augenrules --load

      If the audit configuration is immutable (-e 2 in the rules), the new rules only take effect after a reboot. The rule assumes sudo logs to /var/log/sudo.log (Defaults logfile="/var/log/sudo.log" in a file under /etc/sudoers.d/).
