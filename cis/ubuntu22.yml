  - id: "CIS-UBUNTU22-1.1.2.1.4-tmp_noexec_options"
    name: "/tmp is a separate mount with noexec"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.1.2.1.4. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/tmp'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]noexec(,|$)"
    rationale: &rat-734884225c |
      /tmp is world-writable and used by every user and service for temporary files. With noexec, programs cannot be executed directly from it, which blocks the common attack step of dropping a tool or exploit into a writable directory and running it. Scripts started through an interpreter are not stopped, and some installers may need adjusting. This check verifies the option on the currently mounted file system.
    remediation: &rem-c5e9d848d5 |
      Mount /tmp with the option noexec: add it to the options of /tmp in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/tmp'

      If /tmp is not a separate file system yet, create one first.
  - id: "CIS-UBUNTU22-1.1.2.1.4-tmp_fstab_noexec_options-attrs"
    name: "/etc/fstab: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.1.2.1.4. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/fstab'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-b93604791d |
      The noexec mount option prevents binaries from being executed directly from /tmp, a location every user can write to, which hinders exploits and malware that drop and run payloads there. Scripts can still be run through an interpreter, and some installers expect to execute from /tmp, so the option should be tested before enforcement.
    remediation: *rem-8ee214ccd7
