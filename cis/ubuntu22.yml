    remediation: *rem-a8dd9cdd16
  - id: "CIS-UBUNTU22-3.2.4-lsmod_sctp"
    name: "lsmod sctp: lsmod | grep -i sctp"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.2.4. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i sctp
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-a0ad621928 |
      SCTP is a message-oriented transport protocol used mainly in telecom environments. Its kernel code has had serious vulnerabilities, and since opening a socket can load the module automatically, an unused SCTP module adds attack surface. The check verifies the module is not loaded.
    remediation: &rem-7de8398c66 |
      Prevent the sctp module from loading and unload it if it is loaded.

      printf '%s\n' 'blacklist sctp' 'install sctp /bin/false' > /etc/modprobe.d/sctp.conf
      modprobe -r sctp

      If the module is in use, stop the application using it or reboot.
  - id: "CIS-UBUNTU22-3.2.4-modprobe_sctp"
    name: "modprobe sctp: modprobe -n -v sctp"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.2.4. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v sctp
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /bin/(true|false)" }
    rationale: &rat-be5bf6712f |
      SCTP is a message-oriented transport protocol used mainly in telecommunications. Its kernel module adds network-reachable code that most systems never use. Preventing the module from loading removes this attack surface on systems that do not use the protocol. Some telecom and clustering software needs SCTP.
    remediation: &rem-40e3047e72 |
      Keep the sctp module from being loaded: add an install override and a blacklist entry for it in /etc/modprobe.d/, then unload it if it is currently loaded.

      printf '%s\n' 'install sctp /bin/false' 'blacklist sctp' > /etc/modprobe.d/sctp.conf
      modprobe -r sctp

      modprobe -r reports an error if the module is not loaded, which is harmless; if sockets of this protocol are open, the module stays loaded until reboot.
  - id: "CIS-UBUNTU22-3.3.1.1-net.ipv4.ip_forward"
    name: "Kernel parameter net.ipv4.ip_forward is 0"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.3.1.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.ip_forward
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-f3a19b4b76 |
      With IP forwarding enabled the system routes packets between its interfaces like a router. A host that is not meant to route could then be used to bypass network segmentation. Disabling forwarding ensures only traffic addressed to the host itself is handled. Routers and many container or virtualization hosts need forwarding.
    remediation: &rem-330a5a5e8e |
      Set the kernel parameter net.ipv4.ip_forward to 0, now and at boot:

      sysctl -w 'net.ipv4.ip_forward=0'
      printf '%s\n' 'net.ipv4.ip_forward = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.ip_forward from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU22-3.3.1.1-ip4_forward_conf"
    name: "ip4 forward conf: grep net.ipv4.ip_forward /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.3.1.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep net.ipv4.ip_forward /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:net.ipv4.ip_forward\\s*=\\s*0" }
      - { none: "~ .*:net.ipv4.ip_forward\\s*=\\s*1" }
    rationale: &rat-f07ae88c3a |
      IP forwarding lets the system route packets between its interfaces. A host that is not meant to be a router could otherwise be used to bypass network segmentation or relay attack traffic. Routers, VPN gateways and container or virtualization hosts legitimately need forwarding and should be treated as exceptions.
    remediation: &rem-f3b22eb0d5 |
      Set net.ipv4.ip_forward to 0 in a sysctl drop-in file and apply it. Remove or correct any other line that sets a different value.

      printf '%s\n' 'net.ipv4.ip_forward = 0' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w net.ipv4.ip_forward=0
      sysctl -w net.ipv4.route.flush=1

      The check reads /etc/sysctl.conf and /etc/sysctl.d/ and on most platforms also /run/sysctl.d/, /usr/local/lib/sysctl.d/, /usr/lib/sysctl.d/ and /lib/sysctl.d/; a line with the opposite value in any of these files makes it fail.
  - id: "CIS-UBUNTU22-3.3.1.2-net.ipv4.conf.all.forwarding"
    name: "Kernel parameter net.ipv4.conf.all.forwarding is 0"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.3.1.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.all.forwarding
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-750ebc2379 |
      This parameter controls IPv4 forwarding on all interfaces. When enabled, the host routes packets between networks, which an attacker can use to bypass segmentation or pivot into otherwise unreachable networks. Routers, VPN gateways and hosts running containers or virtual machines with routed networking legitimately need forwarding. This check verifies the value in the running kernel.
    remediation: &rem-3320f1cd32 |
      Set the kernel parameter net.ipv4.conf.all.forwarding to 0, now and at boot:

      sysctl -w 'net.ipv4.conf.all.forwarding=0'
      printf '%s\n' 'net.ipv4.conf.all.forwarding = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.conf.all.forwarding from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU22-3.3.1.2-ip4_all_forwarding"
    name: "ip4 all forwarding: grep forwarding /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.3.1.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep forwarding /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:net.ipv4.conf.all.forwarding\\s*=\\s*0" }
      - { none: "~ .*:net.ipv4.conf.all.forwarding\\s*=\\s*1" }
    rationale: &rat-8a40ab9fb5 |
      When IPv4 forwarding is enabled the system routes packets between its interfaces, so it can be used to bypass network segmentation or act as a pivot. Hosts that are not routers, firewalls or container hosts should have forwarding disabled. This check verifies the persistent sysctl configuration files.
    remediation: &rem-0756f798c4 |
      Set net.ipv4.conf.all.forwarding to 0 in a file under /etc/sysctl.d/, apply it, and remove any line that sets it to 1:

      printf '%s\n' 'net.ipv4.conf.all.forwarding = 0' > /etc/sysctl.d/60-net_ipv4_conf_all_forwarding.conf
      sysctl -w net.ipv4.conf.all.forwarding=0
      grep -rs 'net.ipv4.conf.all.forwarding' /etc/sysctl.conf /etc/sysctl.d/ /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ /lib/sysctl.d/

      The check also reads vendor directories such as /usr/lib/sysctl.d; a package that sets the value to 1 there (for example container or virtualization software) keeps the check failing and indicates the host needs forwarding.
  - id: "CIS-UBUNTU22-3.3.1.3-net.ipv4.conf.default.forwarding"
    name: "Kernel parameter net.ipv4.conf.default.forwarding is 0"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.3.1.3. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
