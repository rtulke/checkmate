    rationale: &rat-49a4d72f8d |
      usermod changes account properties such as group membership, shell, home directory and lock state; misuse can grant privileges or hide accounts. Auditing its execution records who modified accounts, supporting accountability and detection of unauthorized changes.
    remediation: &rem-0d513f269f |
