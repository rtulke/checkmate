  - id: "CIS-UBUNTU22-3.3.1.18-net.ipv4.tcp_syncookies"
    name: "Kernel parameter net.ipv4.tcp_syncookies is 1"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.3.1.18. NIST SP 800-53 Rev. 5: SC-5."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.tcp_syncookies
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-59ba1f79a7 |
      In a SYN flood an attacker sends many connection requests without completing the handshake, filling the connection backlog and blocking legitimate clients. SYN cookies let the kernel accept new connections without keeping state once the backlog is full, keeping services reachable during such an attack.
    remediation: &rem-8326186a4f |
      Set the kernel parameter net.ipv4.tcp_syncookies to 1, now and at boot:

      sysctl -w 'net.ipv4.tcp_syncookies=1'
      printf '%s\n' 'net.ipv4.tcp_syncookies = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.tcp_syncookies from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU22-3.3.1.18-ipv4_tcp_syn_cookies"
    name: "ipv4 tcp syn cookies: grep net.ipv4.tcp_syncookies /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.3.1.18. NIST SP 800-53 Rev. 5: SC-5."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep net.ipv4.tcp_syncookies /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:net.ipv4.tcp_syncookies( |)=( |)1" }
      - { none: "~ .*:net.ipv4.tcp_syncookies( |)=( |)0" }
    rationale: &rat-2d34b5557e |
      In a SYN flood an attacker sends many connection requests without completing the handshake, filling the queue of half-open connections so legitimate clients are refused. SYN cookies let the kernel keep accepting connections when the queue is full, without storing state for each request.
    remediation: &rem-ecf4a2f8a9 |
      Set net.ipv4.tcp_syncookies to 1 in a sysctl drop-in file and apply it. Remove or correct any other line that sets a different value.

      printf '%s\n' 'net.ipv4.tcp_syncookies = 1' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w net.ipv4.tcp_syncookies=1

      The check reads /etc/sysctl.conf and /etc/sysctl.d/ and on most platforms also /run/sysctl.d/, /usr/local/lib/sysctl.d/, /usr/lib/sysctl.d/ and /lib/sysctl.d/; a line with the opposite value in any of these files makes it fail.
  - id: "CIS-UBUNTU22-4.1.1-ufw"
    name: "Package ufw is installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 4.1.1. NIST SP 800-53 Rev. 5: AC-17."
    tags: [cis, cis-ubuntu22, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' ufw 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-8061e449a6 |
      A host firewall limits which network services are reachable and contains the damage of a compromised neighbour. On Debian and Ubuntu, ufw is the simple front end for managing those rules; where another tool such as firewalld, nftables or iptables is chosen, ufw should be absent, because two firewall managers overwrite each other's rules and leave the effective policy unpredictable.
    remediation: &rem-659dd3ebf2 |
      Install the package ufw:

      apt-get install ufw
  - id: "CIS-UBUNTU22-4.1.2-ufw-enabled"
    name: "Service ufw is enabled"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 4.1.2. NIST SP 800-53 Rev. 5: AC-17."
    tags: [cis, cis-ubuntu22, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState ufw | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-8061e449a6
    remediation: &rem-3bd9f4aa3b |
      Enable the service ufw:

      systemctl enable ufw
  - id: "CIS-UBUNTU22-4.1.2-ufw-running"
    name: "Service ufw is running"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 4.1.2. NIST SP 800-53 Rev. 5: AC-17."
    tags: [cis, cis-ubuntu22, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState ufw | cut -d= -f2
    expect: "== active"
    rationale: *rat-8061e449a6
    remediation: &rem-36d5563792 |
      Start the service ufw:

      systemctl start ufw
  - id: "CIS-UBUNTU22-4.1.3-ufw_incoming_default"
    name: "ufw incoming default: ufw status verbose | awk -F',' '$1~/Default/ {print $1}'"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 4.1.3. NIST SP 800-53 Rev. 5: SC-7."
    tags: [cis, cis-ubuntu22, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      ufw status verbose | awk -F',' '$1~/Default/ {print $1}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Default: (deny|reject) \\(incoming\\)" }
    rationale: &rat-c67d66bc51 |
      With a default deny policy for incoming traffic, only services explicitly allowed by a firewall rule are reachable from the network. Services started later or listening by mistake stay unreachable until a rule is added, which keeps the exposed attack surface small.
    remediation: &rem-2e19ce171b |
      Allow the services the host must offer (at least SSH for remote administration), set the default incoming policy to deny and make sure ufw is enabled.

      ufw allow 22/tcp
      ufw default deny incoming
      ufw --force enable

      ufw status verbose only shows the default policies while ufw is active.
  - id: "CIS-UBUNTU22-4.1.4-ufw_outgoing_default"
    name: "ufw outgoing default: ufw status verbose | awk -F',' '$1~/Default/ {print $2}'"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 4.1.4. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      ufw status verbose | awk -F',' '$1~/Default/ {print $2}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ \\s*(deny|reject) \\(outgoing\\)" }
    rationale: &rat-956c7a9b19 |
      A default deny policy for outgoing traffic limits what a compromised process can reach: data exfiltration, connections to command-and-control servers and lateral movement then need an explicit rule. It requires an allow rule for every legitimate outbound flow (DNS, NTP, package repositories, logging, directory services), so it needs careful planning.
    remediation: &rem-38b909b89e |
      Create allow rules for all required outbound traffic first, then set the default outgoing policy to deny and make sure ufw is enabled.

      ufw allow out 53
      ufw allow out 123/udp
      ufw allow out 80/tcp
      ufw allow out 443/tcp
      ufw default deny outgoing
      ufw --force enable

      Adapt the allow rules to the host before switching the policy, otherwise name resolution, updates and other outbound services stop working.
  - id: "CIS-UBUNTU22-4.1.5-ufw_routed_default"
    name: "ufw routed default: ufw status verbose | awk -F',' '$1=\"Default\"{print $3}'"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 4.1.5. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu22, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      ufw status verbose | awk -F',' '$1="Default"{print $3}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*(deny|disabled) \\(routed\\)" }
    rationale: &rat-3dc87c0be4 |
      Unless the host is meant to be a router, it should not forward packets between interfaces. A deny or disabled policy for routed traffic prevents the system from being used to bypass network segmentation. Container hosts, VPN gateways and virtualization hosts may legitimately need forwarding and should then allow it with explicit route rules.
    remediation: &rem-f43803520f |
      Set the default policy for routed traffic to deny; this also writes DEFAULT_FORWARD_POLICY="DROP" to /etc/default/ufw, which the Ubuntu 26.04 check reads.

      ufw default deny routed
      ufw --force enable

      On hosts that must forward traffic, add explicit ufw route allow rules instead of opening the default policy.
  - id: "CIS-UBUNTU22-5.1.1-sshd_config_perms-attrs"
    name: "/etc/ssh/sshd_config: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-fc2827314f |
      sshd_config controls who may log in remotely and how. If unprivileged users could modify it they could enable root login or weaken authentication, and read access reveals details of the security configuration. It should be owned by root and accessible only by root.
    remediation: &rem-714a840007 |
      Create /etc/ssh/sshd_config if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/ssh/sshd_config'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/ssh/sshd_config'
  - id: "CIS-UBUNTU22-5.1.2-etc_ssh_ssh_host_prv_key_group"
    name: "/etc/ssh/ssh host prv key group: groupkeys=$(sudo find /etc/ssh/ -name '*_key' -type f ! -group root ); echo $groupkeys"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      groupkeys=$(sudo find /etc/ssh/ -name '*_key' -type f ! -group root ); echo $groupkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-5ef33206e2 |
      SSH host private keys prove the server's identity to clients. Anyone who can read a host key can impersonate the server and intercept sessions in a man-in-the-middle attack. Keeping the key files in the root group (or the dedicated ssh_keys group on Red Hat systems) ensures that any group read permission does not extend to ordinary users.
    remediation: &rem-369ef6a077 |
      Change the group of each private host key reported by the check to root.

      chgrp root FILE

      On RHEL 9 the group ssh_keys is also accepted by the check.
  - id: "CIS-UBUNTU22-5.1.2-etc_ssh_ssh_host_prv_key_perms"
    name: "/etc/ssh/ssh host prv key perms: keyperms=$(sudo find /etc/ssh/ -name '*_key' -type f \\( -perm /137 -o \\( -group root -per…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      keyperms=$(sudo find /etc/ssh/ -name '*_key' -type f \( -perm /137 -o \( -group root -perm /177 \) \) ); echo $keyperms
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-7f190524e0 |
      A host private key that other users can read or modify lets them impersonate the SSH server or replace its identity, which enables interception of administrator sessions. Restricting the files to owner read and write keeps the key usable only by sshd. OpenSSH also ignores private keys with overly open permissions, so tight modes avoid unexpected start-up failures.
    remediation: &rem-6abc4b4be2 |
      Remove execute, group write/execute and all permissions for others from each private host key reported by the check. Mode 0600 satisfies every variant.

      chmod 0600 FILE

      Debian 13, and Debian 11 and Ubuntu 22.04/24.04 for keys in the root group, do not accept group read, so do not use 0640 there.
  - id: "CIS-UBUNTU22-5.1.2-etc_ssh_ssh_host_prv_key_user"
    name: "/etc/ssh/ssh host prv key user: userkeys=$(sudo find /etc/ssh/ -name '*_key' -type f ! -user root ); echo $userkeys"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      userkeys=$(sudo find /etc/ssh/ -name '*_key' -type f ! -user root ); echo $userkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-fbdc35f7c9 |
      If a host private key is owned by an account other than root, that account can read, alter or replace the server's identity key, allowing impersonation of the server or a denial of service. Root ownership ensures that only administrators control the key material.
    remediation: &rem-3a33d707b3 |
      Make root the owner of each private host key reported by the check.

      chown root FILE
  - id: "CIS-UBUNTU22-5.1.3-etc_ssh_ssh_host_pub_key_group"
    name: "/etc/ssh/ssh host pub key group: groupkeys=$(sudo find /etc/ssh/ -name '*_key.pub' -type f ! -group root ); echo $groupkeys"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      groupkeys=$(sudo find /etc/ssh/ -name '*_key.pub' -type f ! -group root ); echo $groupkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-7b474e6437 |
      Public host keys are not secret, but they represent the server's identity that clients verify and that key management or monitoring relies on. If a non-root group can modify them, local users could replace the published key material. Root group ownership keeps changes to the server identity limited to administrators.
    remediation: &rem-4bb93212a2 |
      Change the group of each public host key reported by the check to root.

      chgrp root FILE
  - id: "CIS-UBUNTU22-5.1.3-etc_ssh_ssh_host_pub_key_perms"
    name: "/etc/ssh/ssh host pub key perms: keyperms=$(sudo find /etc/ssh/ -name '*_key.pub' -type f -perm /133 ); echo $keyperms"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      keyperms=$(sudo find /etc/ssh/ -name '*_key.pub' -type f -perm /133 ); echo $keyperms
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-33bc1e4eae |
      Public host keys may be world-readable, but write access for group or others would let local users replace them, and the execute bit serves no purpose. Limiting them to mode 0644 or stricter ensures that only root can change the server's published identity.
    remediation: &rem-78675bfedc |
      Remove execute and group/other write permissions from each public host key reported by the check (mode 0644 or stricter).

      chmod u-x,go-wx FILE
  - id: "CIS-UBUNTU22-5.1.3-etc_ssh_ssh_host_pub_key_user"
    name: "/etc/ssh/ssh host pub key user: userkeys=$(sudo find /etc/ssh/ -name '*_key.pub' -type f ! -user root ); echo $userkeys"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      userkeys=$(sudo find /etc/ssh/ -name '*_key.pub' -type f ! -user root ); echo $userkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-e69d03c157 |
      If a public host key is owned by a non-root account, that user can replace it and mislead or disrupt clients that verify the server's identity. Root ownership keeps the published host identity under administrative control.
    remediation: &rem-35eb98c235 |
      Make root the owner of each public host key reported by the check.

      chown root FILE
  - id: "CIS-UBUNTU22-5.1.4-sshd_access_limited"
    name: "SSH access is limited with AllowUsers, AllowGroups, DenyUsers or DenyGroups"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(allow|deny)(users|groups) +[^ ]'
    allow_rc: any
    expect: { some: "~ ." }
    rationale: &rat-8e5700f652 |
      Restricting SSH logins to explicitly allowed users or groups ensures that only accounts with a need for remote access can log in, even if other accounts have valid credentials or weak passwords. It limits the impact of compromised, forgotten or service accounts.
    remediation: &rem-804a07286e |
      Restrict SSH logins to the users or groups that need them with AllowUsers, AllowGroups, DenyUsers or DenyGroups, according to site policy. Set the directive in the global section of the sshd configuration (in /etc/ssh/sshd_config before any Match block, or in a file in /etc/ssh/sshd_config.d/ where the distribution includes that directory), then validate and reload the SSH service.

      echo 'AllowGroups GROUP' > /etc/ssh/sshd_config.d/10-access.conf
      sshd -t

      When both AllowUsers and AllowGroups are set, a user must match both lists. Make sure your own administrative account is allowed before reloading.
  - id: "CIS-UBUNTU22-5.1.5-ssh_banner-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-dd603f8444 |
      A banner shown before SSH authentication informs users that access is restricted and monitored. Such a notice can be a prerequisite for legal action against unauthorized users. The banner text should not reveal system details.
    remediation: &rem-f6392187bb |
      Create /etc/ssh/sshd_config.
  - id: "CIS-UBUNTU22-5.1.5-ssh_banner-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect:
      - { some: "~ Banner /etc/issue\\.net" }
      - { none: "~ ^Banner none" }
    rationale: *rat-dd603f8444
    remediation: &rem-a5e05e99fc |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches Banner /etc/issue\.net
      - no line matches ^Banner none
  - id: "CIS-UBUNTU22-5.1.5-ssh_configd_banner"
    name: "ssh configd banner: grep -Eis '^\\s*Banner\\s+\"?none\\b' /etc/ssh/sshd_config.d/*.conf"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis '^\s*Banner\s+"?none\b' /etc/ssh/sshd_config.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-c8f1dd710c |
      A pre-authentication banner shows the organisation's legal notice to everyone who connects, which supports action against unauthorised access and informs users about monitoring. A drop-in file with Banner none silently overrides a banner set in the main configuration, because sshd uses the first value it reads. Checking the drop-ins prevents such an override from removing the warning.
    remediation: &rem-d80aaaa50c |
      Remove every Banner none line from the files in /etc/ssh/sshd_config.d/ and configure a banner file instead; put the site's authorised-use notice into /etc/issue.net.

      grep -Eil '^\s*Banner\s+"?none\b' /etc/ssh/sshd_config.d/*.conf
      echo 'Banner /etc/issue.net' > /etc/ssh/sshd_config.d/01-banner.conf
      sshd -t && systemctl reload sshd

      On RHEL 8, which does not read sshd_config.d by default, set Banner in /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-UBUNTU22-5.1.6-no_weak_ssh_ciphers"
    name: "no weak ssh ciphers: sshd -T | grep -Pi -- '^ciphers\\h+\\\"?([^#\\n\\r]+,)?((3des|blowfish|cast128|aes(128|192|256…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.6. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -Pi -- '^ciphers\h+\"?([^#\n\r]+,)?((3des|blowfish|cast128|aes(128|192|256))-cbc|arcfour(128|256)?|rijndael-cbc@lysator\.liu\.se|chacha20-poly1305@openssh\.com)\b'
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ ." }
    rationale: &rat-77a6850889 |
      Ciphers such as 3DES, Blowfish, CAST128, RC4 (arcfour) and the CBC modes have known weaknesses that allow plaintext recovery or make traffic analysis easier. Offering them lets an attacker or an outdated client negotiate a weak session. Some variants also exclude chacha20-poly1305, which is affected by the Terrapin prefix truncation attack on unpatched peers.
    remediation: &rem-0c4995da3b |
      Configure an explicit list of strong ciphers for the SSH server.

      echo 'Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr' > /etc/ssh/sshd_config.d/00-ciphers.conf
      sshd -t && systemctl reload ssh

      sshd uses the first Ciphers value it reads; remove conflicting lines that are read earlier.
  - id: "CIS-UBUNTU22-5.1.7-sshd_clientalive-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.7. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-3cc59b4363 |
      SSH connections whose client has crashed or lost the network can stay open indefinitely, holding resources and leaving a session that might be resumed or hijacked. ClientAliveInterval and ClientAliveCountMax make sshd send keepalive probes through the encrypted channel and disconnect when the client stops answering. This does not end sessions of an idle client that is still connected.
    remediation: *rem-f6392187bb
  - id: "CIS-UBUNTU22-5.1.7-sshd_clientalive-content"
