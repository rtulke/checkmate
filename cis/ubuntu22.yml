  - id: "CIS-UBUNTU22-6.2.3.14-auditd_MAC_live"
    name: "auditd MAC live: auditctl -l | grep MAC-policy"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.3.14. NIST SP 800-53 Rev. 5: AU-3, CM-6."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      auditctl -l | grep MAC-policy
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /etc/apparmor -p wa -k MAC-policy" }
      - { some: "~ -w /etc/apparmor\\.d -p wa -k MAC-policy" }
    rationale: &rat-1c393a39f9 |
      SELinux or AppArmor policies enforce mandatory access control beyond normal file permissions. Changes to their configuration can weaken or disable this protection, so they should be recorded. This check verifies that the watches are loaded in the running kernel.
    remediation: &rem-a557546252 |
      Watch the mandatory access control (SELinux or AppArmor) configuration for changes: add the rules for your release to /etc/audit/rules.d/50-MAC-policy.rules and load them.

      Debian 11 and Debian 12:
      -w /etc/apparmor/ -p wa -k MAC-policy
      -w /etc/apparmor.d/ -p wa -k MAC-policy

      Debian 13:
      -a always,exit -F arch=b64 -S all -F path=/etc/apparmor -F perm=wa -k MAC-policy
      -a always,exit -F arch=b64 -S all -F dir=/etc/apparmor.d -F perm=wa -k MAC-policy

      Ubuntu 20.04, Ubuntu 22.04 and Ubuntu 24.04:
      -w /etc/apparmor -p wa -k MAC-policy
      -w /etc/apparmor.d -p wa -k MAC-policy

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
  - id: "CIS-UBUNTU22-6.2.3.15-chcon_module_cnf"
    name: "chcon module cnf: grep chcon /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.3.15. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-ubuntu22, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep chcon /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F path=/usr/bin/chcon -F perm=x -F auid\u003e=1000 -F auid!=(unset|4294967295|-1) -k perm_chng" }
    rationale: &rat-177b3dda3d |
      chcon changes the SELinux security context of files and can weaken mandatory access control protections. Recording every execution by regular users documents who changed security labels, which helps detect policy circumvention and supports investigations.
