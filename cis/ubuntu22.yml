      - no line matches (?i)maxauthtries ([5-9]|[1-9]{2,})
  - id: "CIS-UBUNTU22-5.1.17-ssh_maxsessions-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.17. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-5de57ba7dd |
      MaxSessions limits how many shell, login or subsystem sessions can be multiplexed over one SSH connection. Without a cap, a single authenticated connection could open a large number of sessions and exhaust server resources. A limit of 10 still accommodates normal multiplexing.
    remediation: *rem-f6392187bb
  - id: "CIS-UBUNTU22-5.1.17-ssh_maxsessions-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
