      - { some: "~ ^GRUB_CMDLINE_LINUX.*security=apparmor" }
      - { none: "~ apparmor=0" }
    rationale: *rat-ecf938aaab
    remediation: &rem-210c5e7ead |
      Edit /etc/default/grub so that its lines meet these conditions (regular expressions):

      - a line matches ^GRUB_CMDLINE_LINUX.*apparmor=1
      - a line matches ^GRUB_CMDLINE_LINUX.*security=apparmor
      - no line matches apparmor=0
  - id: "CIS-UBUNTU22-1.3.1.3-apparmor_enf_or_comp"
    name: "apparmor enf or comp: LOADED=`apparmor_status | grep 'profiles are loaded' | awk '{print $1}'` \u0026\u0026 ENFORCE=`appa…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.3.1.3. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      LOADED=`apparmor_status | grep 'profiles are loaded' | awk '{print $1}'` && ENFORCE=`apparmor_status | grep 'profiles are in enforce mode.' | awk '{print $1}'` && COMPLAIN=`apparmor_status | grep 'profiles are in complain mode.' | awk '{print $1}'` && if [ $((ENFORCE + COMPLAIN)) != "$LOADED" ]; then echo "Profiles Error";fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Profiles Error" }
    rationale: &rat-56a855fea9 |
      A loaded AppArmor profile only has an effect in enforce mode, where violations are blocked, or complain mode, where they are logged. Requiring every loaded profile to be in one of these modes, and no process with a defined profile to run unconfined, ensures applications that have a policy are actually restricted or at least monitored.
    remediation: &rem-cb32855c78 |
      Install the AppArmor utilities, put all profiles into enforce mode and restart processes that have a profile but are still running unconfined.

      apt-get install apparmor-utils
      aa-enforce /etc/apparmor.d/*
      aa-status
      systemctl restart SERVICE

      A reboot also places all processes under their profiles.
  - id: "CIS-UBUNTU22-1.3.1.4-apparmor_enf_only"
    name: "apparmor enf only: if [ \"`apparmor_status | grep 'profiles are in complain mode.' | awk '{print $1}'`\" != \"0…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.3.1.4. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      if [ "`apparmor_status | grep 'profiles are in complain mode.' | awk '{print $1}'`" != "0" ]; then echo "Not Enforcing" ;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Not Enforcing" }
    rationale: &rat-431a321151 |
      Complain mode only logs policy violations, while enforce mode blocks them. Running all profiles in enforce mode, with no process that has a profile left unconfined, means the confinement policies actually protect the system instead of merely documenting what a compromised program did.
    remediation: *rem-cb32855c78
  - id: "CIS-UBUNTU22-1.4.1-bootloader_password_set"
    name: "The boot loader has a superuser and a PBKDF2 password"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.4.1. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f=/boot/grub/grub.cfg
      if [ ! -e "$f" ]; then echo "$f does not exist"; exit 0; fi
      grep -Eq '^[[:space:]]*set superusers=' "$f" || echo "no superuser is set in $f"
      grep -Eq '^[[:space:]]*password_pbkdf2[[:space:]]+[^[:space:]]+[[:space:]]+grub\.pbkdf2\.sha512\.' "$f" || echo "no PBKDF2 password is set in $f"
    allow_rc: any
    expect: empty
    rationale: &rat-d4c535ae9c |
      Without a boot loader password, anyone with console access can edit boot entries, for example to add init=/bin/bash and get a root shell without authentication. A GRUB superuser with a PBKDF2 password hash protects the boot menu from such changes.
    remediation: &rem-889f235bb0 |
      Create a password hash, add a superuser with this hash in a file in /etc/grub.d/ and regenerate grub.cfg.

      grub-mkpasswd-pbkdf2

      Put these lines, with the hash the command printed, into /etc/grub.d/01_users, make the file executable and run update-grub:

      #!/bin/sh
      cat <<EOF
      set superusers="USER"
      password_pbkdf2 USER HASH
      EOF

      chmod 0700 /etc/grub.d/01_users
      update-grub

      With a superuser set, every boot entry asks for the password unless it has --unrestricted; add that option to CLASS in /etc/grub.d/10_linux if the system has to boot unattended.
  - id: "CIS-UBUNTU22-1.4.2-default_grub_perms-attrs"
    name: "/boot/grub/grub.cfg: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.4.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/boot/grub/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-a1a67cf5c0 |
      grub.cfg contains the boot loader password hash and kernel parameters. If ordinary users can read it, they can attack the hash offline and learn about the boot setup; if they can write it, they can change how the system boots. Mode 0600 owned by root:root prevents this.
    remediation: &rem-e39028cb7f |
      Create /boot/grub/grub.cfg if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/boot/grub/grub.cfg'
      chmod u-xs,g-rwxs,o-rwx,a-t '/boot/grub/grub.cfg'
  - id: "CIS-UBUNTU22-1.5.1-kernel.randomize_va_space"
    name: "Kernel parameter kernel.randomize_va_space is 2"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.5.1. NIST SP 800-53 Rev. 5: SI-16."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.randomize_va_space
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 2"
    rationale: &rat-5597c48019 |
      Address space layout randomization places the stack, heap, shared libraries and other memory regions at random addresses. This makes memory corruption exploits much harder because an attacker cannot predict where code or data is located. The value 2 enables full randomization, including the heap.
    remediation: &rem-a6e5efe9f8 |
      Set the kernel parameter kernel.randomize_va_space to 2, now and at boot:

      sysctl -w 'kernel.randomize_va_space=2'
      printf '%s\n' 'kernel.randomize_va_space = 2' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.randomize_va_space from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU22-1.5.1-aslr_enabled_2"
    name: "aslr enabled 2: grep \"kernel\\.randomize_va_space\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.5.1. NIST SP 800-53 Rev. 5: SI-16."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "kernel\.randomize_va_space" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^\\/etc\\/sysctl\\.(conf|d\\/[^:]+\\.conf):kernel\\.randomize_va_space\\s*=\\s*2$" }
      - { none: "~ :\\s*kernel\\.randomize_va_space\\s*=\\s*([^2\\s]|2\\S)" }
    rationale: &rat-2872b53691 |
      Address space layout randomization places the stack, heap, shared libraries and other memory regions at random addresses, which makes memory corruption exploits much harder. The value 2 enables full randomization. Setting it in a sysctl configuration file ensures it is applied at every boot and not only at runtime.
    remediation: &rem-9accd0beb4 |
      Set kernel.randomize_va_space to 2 in a sysctl configuration file so it is applied at every boot, and apply it now. Ubuntu 18.04 expects exactly one space on each side of the equals sign.

      printf '%s\n' 'kernel.randomize_va_space = 2' > /etc/sysctl.d/60-kernel_sysctl.conf
      sysctl -w kernel.randomize_va_space=2

      Remove or correct any other kernel.randomize_va_space line in /etc/sysctl.conf and /etc/sysctl.d/; on Debian 11 any other value there fails the check.
  - id: "CIS-UBUNTU22-1.5.2-kernel.yama.ptrace_scope"
    name: "Kernel parameter kernel.yama.ptrace_scope is 1"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.5.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.yama.ptrace_scope
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-87e99a2286 |
      ptrace lets one process inspect and modify the memory of another. With unrestricted ptrace, any process running as a user can attach to that user's other processes, for example to steal SSH agent keys, session tokens or passwords from a browser after compromising a single program. Yama mode 1 limits ptrace to direct descendants (plus explicit exceptions), which blocks this lateral access while keeping debuggers usable.
    remediation: &rem-1ac1532a42 |
      Set the kernel parameter kernel.yama.ptrace_scope to 1, now and at boot:

      sysctl -w 'kernel.yama.ptrace_scope=1'
      printf '%s\n' 'kernel.yama.ptrace_scope = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.yama.ptrace_scope from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU22-1.5.2-ptrace_restrict_2"
    name: "ptrace restrict 2: grep \"kernel\\.yama\\.ptrace_scope\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.5.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "kernel\.yama\.ptrace_scope" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^\\/etc\\/sysctl\\.(conf|d\\/[^:]+\\.conf):kernel\\.yama\\.ptrace_scope\\s*=\\s*[1-3]$" }
      - { none: "~ :\\s*kernel\\.yama\\.ptrace_scope\\s*=\\s*([^1-3\\s]|[1-3]\\S)" }
    rationale: &rat-38d11225e0 |
      ptrace lets one process inspect and modify the memory of another. Without restrictions, malware running as a user can read secrets such as SSH agent keys or passwords from any other process of that user. The Yama ptrace_scope setting limits tracing to parent processes or administrators.
    remediation: &rem-a2e6b53b4f |
      Set kernel.yama.ptrace_scope to 1 in a sysctl drop-in file, remove other settings of the parameter and apply it at runtime.

      grep -r ptrace_scope /etc/sysctl.conf /etc/sysctl.d/
      printf '%s\n' 'kernel.yama.ptrace_scope = 1' > /etc/sysctl.d/60-kernel_yama_ptrace.conf
      sysctl -w kernel.yama.ptrace_scope=1

      Values 2 or 3 are stricter and accepted on Ubuntu 22.04/24.04, but the Ubuntu 20.04 check only accepts 1. Debuggers such as gdb or strace attaching to running processes then require root.
  - id: "CIS-UBUNTU22-1.5.3-fs.suid_dumpable"
    name: "Kernel parameter fs.suid_dumpable is 0"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.5.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n fs.suid_dumpable
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-e7d91ef8bc |
      fs.suid_dumpable controls whether processes that changed privileges, such as setuid programs, may produce core dumps. A core dump of such a process can contain passwords, keys or other secrets from privileged memory and may be readable by the invoking user. Setting it to 0 disables these dumps. This check verifies the value in the running kernel.
    remediation: &rem-789aaadb7b |
      Set the kernel parameter fs.suid_dumpable to 0, now and at boot:

      sysctl -w 'fs.suid_dumpable=0'
      printf '%s\n' 'fs.suid_dumpable = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of fs.suid_dumpable from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU22-1.5.3-suid_dumpable_2"
    name: "suid dumpable 2: grep \"fs\\.suid_dumpable\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.5.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "fs\.suid_dumpable" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^\\/etc\\/sysctl\\.(conf|d\\/[^:]+\\.conf):fs\\.suid_dumpable\\s*=\\s*0$" }
      - { none: "~ :\\s*fs\\.suid_dumpable\\s*=\\s*([^0\\s]|0\\S)" }
    rationale: &rat-5352269d27 |
      fs.suid_dumpable controls whether setuid and other privilege-changing programs may write core dumps. Such dumps can contain memory of a privileged process, including credentials. A value of 0 prevents them. The check reads the persistent sysctl configuration files.
    remediation: &rem-e7880bb15a |
      Set fs.suid_dumpable=0, written without spaces as the check expects, in a file under /etc/sysctl.d/ and apply it:

      printf '%s\n' 'fs.suid_dumpable=0' > /etc/sysctl.d/60-fs_suid_dumpable.conf
      sysctl -w fs.suid_dumpable=0

      Delete or correct other fs.suid_dumpable lines in /etc/sysctl.conf and /etc/sysctl.d/; the Ubuntu 22.04 and 24.04 variants fail if any of them sets another value.
  - id: "CIS-UBUNTU22-1.5.4-core_dumps_limits"
    name: "core dumps limits: grep -E \"\\*.*hard.*core.*0\" /etc/security/limits.conf /etc/security/limits.d/*"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.5.4. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "\*.*hard.*core.*0" /etc/security/limits.conf /etc/security/limits.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^\\/etc\\/security\\/limits\\.(conf|d\\/[^:]+\\.conf):\\s*\\*\\s+hard\\s+core\\s+0(\\s|$)" }
    rationale: &rat-f0b293c191 |
      Core dumps write a process's memory to disk and can contain passwords, keys and other sensitive data. A hard core size limit of 0 in the PAM limits configuration prevents user processes from producing core files, and users cannot raise a hard limit themselves.
    remediation: &rem-7e22a0850b |
      Set a hard core file size limit of 0 for all users in a file under /etc/security/limits.d/ and remove entries elsewhere that allow a larger hard limit:

      printf '%s\n' '* hard core 0' > /etc/security/limits.d/60-coredump.conf

      The limit applies to new login sessions.
  - id: "CIS-UBUNTU22-1.5.5-prelink"
    name: "Package prelink is not installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.5.5. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' prelink 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: &rat-18deabdd17 |
      prelink rewrites binaries and libraries to speed up loading. These modifications interfere with file integrity tools such as AIDE and with package verification, and a compromised prelink could alter binaries system-wide. With address space randomization in place it brings little benefit.
    remediation: &rem-ff4898e838 |
      Remove the package prelink, unless the system needs it:

      apt-get purge prelink
  - id: "CIS-UBUNTU22-1.5.6-apport"
    name: "Package apport is not installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.5.6."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' apport 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: &rat-81273dba76 |
      Apport collects crash reports containing memory contents of the crashed process and can offer to send them to external services. It has also had local privilege escalation vulnerabilities. Removing it on servers avoids leaking sensitive data through crash dumps.
    remediation: &rem-cf36188d9e |
      Remove the package apport, unless the system needs it:

      apt-get purge apport
  - id: "CIS-UBUNTU22-1.5.6-error_report_apport_disable-attrs"
    name: "/etc/default/apport: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.5.6."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/default/apport'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-fdc6d02d06 |
      Apport collects crash data, including memory contents, and can upload reports. It has had several local privilege escalation vulnerabilities. Disabling it on servers avoids leaking sensitive data and removes this attack surface.
    remediation: &rem-fb339ea756 |
      Create /etc/default/apport.
  - id: "CIS-UBUNTU22-1.5.6-error_report_apport_disable-content"
    name: "/etc/default/apport has the expected content (2 rules)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.5.6."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/default/apport'
    allow_rc: any
    expect:
      - { some: "~ enabled=0" }
      - { none: "~ enabled=1" }
    rationale: *rat-fdc6d02d06
    remediation: &rem-c45a71037f |
      Edit /etc/default/apport so that its lines meet these conditions (regular expressions):

      - a line matches enabled=0
      - no line matches enabled=1
  - id: "CIS-UBUNTU22-1.6.1-disable_dyn_motd-attrs"
    name: "/etc/pam.d/sshd: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.6.1. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/sshd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-bfb2a68c7a |
      The dynamic message of the day runs scripts as root at every SSH login and can show system details such as release, update status or advertising content fetched from the network. Disabling pam_motd for SSH avoids information disclosure and code running with root rights during login.
    remediation: &rem-a2a173e0c3 |
      Create /etc/pam.d/sshd.
  - id: "CIS-UBUNTU22-1.6.1-disable_dyn_motd-content"
    name: "/etc/pam.d/sshd has the expected content (4 rules)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.6.1. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/sshd'
    allow_rc: any
    expect:
      - { some: "~ #\\s*session\\s+optional\\s+pam_motd.so\\s+motd=/run/motd.dynamic" }
      - { some: "~ #\\s*session\\s+optional\\s+pam_motd.so noupdate" }
      - { none: "~ ^session\\s+optional\\s+pam_motd.so noupdate" }
      - { none: "~ ^session\\s+optional\\s+pam_motd.so\\s+motd=/run/motd.dynamic" }
    rationale: *rat-bfb2a68c7a
    remediation: &rem-f70888b87b |
      Edit /etc/pam.d/sshd so that its lines meet these conditions (regular expressions):

      - a line matches #\s*session\s+optional\s+pam_motd.so\s+motd=/run/motd.dynamic
      - a line matches #\s*session\s+optional\s+pam_motd.so noupdate
      - no line matches ^session\s+optional\s+pam_motd.so noupdate
      - no line matches ^session\s+optional\s+pam_motd.so\s+motd=/run/motd.dynamic
  - id: "CIS-UBUNTU22-1.6.1-etc_motd_content-content"
    name: "/etc/motd has the expected content (4 rules)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.6.1. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/motd'
    allow_rc: any
    expect:
      - { some: "~ Authorized uses only\\. All activity may be monitored and reported\\." }
      - { none: "~ (\\\\v|\\\\r|\\\\m|\\\\s)" }
      - { none: "~ \\/etc\\/os-release" }
      - { none: "~ (?i)ubuntu" }
    rationale: &rat-7cc6469fbe |
      The message of the day is shown after login. It should carry the site's authorised-use notice and must not reveal operating system name, version, kernel or architecture, which help attackers select exploits.
    remediation: &rem-76abcbb503 |
      Edit /etc/motd so that its lines meet these conditions (regular expressions):

      - a line matches Authorized uses only\. All activity may be monitored and reported\.
      - no line matches (\\v|\\r|\\m|\\s)
      - no line matches \/etc\/os-release
      - no line matches (?i)ubuntu
  - id: "CIS-UBUNTU22-1.6.2-local_login_banner"
    name: "local login banner: grep -Eis \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.6.2. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/issue
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-e067d8b09c |
      The local login banner in /etc/issue is shown before authentication on the console. It should state the authorised-use policy and must not show operating system or kernel details, which would help an attacker choose exploits.
    remediation: &rem-5ba5406ce5 |
      Replace /etc/issue with a site banner that contains no OS information and no getty escape sequences.

      printf '%s\n' 'Authorized users only. All activity may be monitored and reported.' > /etc/issue

      On Ubuntu 24.04 the check also reads /etc/issue.d, /run/issue.d and /usr/lib/issue.d; edit or remove the files it reports there. Escape sequences like \r, \s, \m and \v and the OS name (from ID in /etc/os-release) are matched case-insensitively, so the word ubuntu must not appear anywhere in the banner.
  - id: "CIS-UBUNTU22-1.6.3-cremote_login_banner"
    name: "cremote login banner: grep -Eis \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.6.3. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/issue.net
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-4cdf82c771 |
      The banner in /etc/issue.net is shown to anyone who connects remotely, before authentication. Getty escape sequences such as \m, \r, \s and \v or the distribution name disclose operating system and kernel details that help attackers select exploits. The banner should only contain the site's legal warning.
    remediation: &rem-3223660e00 |
      Replace the contents of /etc/issue.net with a site-approved warning that contains no OS name, version or escape sequences (\m, \r, \s, \v).

      printf '%s\n' 'Authorized users only. All activity may be monitored and reported.' > /etc/issue.net
  - id: "CIS-UBUNTU22-1.6.4-motd_perms-attrs"
    name: "/etc/motd: mode 0644 or stricter, owner root, group root"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.6.4. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/motd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-84448e81ae |
      /etc/motd is displayed to every user after login. If unprivileged users could write to it, they could show misleading messages to other users, for example to trick them into running commands. Ownership by root and mode 0644 or stricter prevent this.
    remediation: &rem-cc50883ec8 |
      Create /etc/motd if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/motd'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/motd'
  - id: "CIS-UBUNTU22-1.6.5-etc_issue_perms-attrs"
    name: "/etc/issue: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.6.5. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-695e1a5a3f |
      /etc/issue is displayed before every local login. If unprivileged users could write to it, they could replace the warning text or display misleading instructions. Ownership by root and mode 0644 or stricter prevent this.
    remediation: &rem-683e1f474b |
      Create /etc/issue if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue'
  - id: "CIS-UBUNTU22-1.6.6-etc_issue_net_perms-attrs"
    name: "/etc/issue.net: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.6.6. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue.net'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-db96813c99 |
      /etc/issue.net holds the banner shown to remote users before login. If non-root users could modify it, they could alter the legal notice or insert misleading content shown to everyone who connects. Ownership by root and a mode of 0644 or stricter keeps it readable but protected.
    remediation: &rem-eb0556c5ea |
      Create /etc/issue.net if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue.net'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue.net'
  - id: "CIS-UBUNTU22-1.7.1-gdm3"
    name: "Package gdm3 is not installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.7.1. NIST SP 800-53 Rev. 5: CM-11."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      dpkg-query -W -f='${Status}' gdm3 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: &rat-a7a77db979 |
      Removing the package gdm3 removes the graphical display manager, which is not needed on servers and adds a large amount of code and a local login service to the attack surface. Workstations that use a graphical login need it.
    remediation: &rem-e959046b35 |
      Remove the package gdm3, unless the system needs it:

      apt-get purge gdm3
  - id: "CIS-UBUNTU22-2.1.1-autofs_masked-attrs"
    name: "/etc/systemd/system/autofs.service: exists, is a symbolic link, links to /dev/null"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 2.1.1. NIST SP 800-53 Rev. 5: SI-3, MP-7."
    tags: [cis, cis-ubuntu22, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/system/autofs.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: &rat-b552dece26 |
      autofs mounts file systems automatically when they are accessed, which makes it easier to introduce untrusted media. Masking the unit (linking it to /dev/null) ensures it cannot be started, neither manually nor as a dependency of another unit, where the package has to stay installed.
    remediation: &rem-5dfbad2866 |
      Create /etc/systemd/system/autofs.service if it is missing, then point the link to /dev/null:

      ln -sfn '/dev/null' '/etc/systemd/system/autofs.service'
  - id: "CIS-UBUNTU22-2.1.2-avahi_pkg"
    name: "Package avahi is not installed"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 2.1.2. NIST SP 800-53 Rev. 5: SI-4."
    tags: [cis, cis-ubuntu22, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' avahi 2>/dev/null | grep 'install ok installed' >/dev/null
