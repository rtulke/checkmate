    rationale: *rat-f655eb77df
    remediation: &rem-aa192ec351 |
      Edit /etc/security/faillock.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^unlock_time\s*=\s*([1-9]|[1-9][0-9]|[1-8][0-9]{1,2}|900)$
      - no line matches ^unlock_time\s*=\s*(90[1-9]|9[1-9][0-9]|[1-9][0-9][0-9]{2,})
  - id: "CIS-UBUNTU22-5.3.3.1.2-faillock_unlock_time_removed"
    name: "faillock unlock time removed: grep -Pl -- '\\bpam_faillock\\.so\\h+([^#\\n\\r]+\\h+)?unlock_time\\b' /usr/share/pam-configs/*"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Pl -- '\bpam_faillock\.so\h+([^#\n\r]+\h+)?unlock_time\b' /usr/share/pam-configs/*
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ .*" }
    rationale: &rat-04049c43e7 |
      How long a locked account stays locked should be set in /etc/security/faillock.conf. An unlock_time argument on the pam_faillock line overrides the file, which makes the real lockout duration differ from the documented configuration. Removing the argument keeps the setting in one auditable place.
    remediation: &rem-b9abc968bc |
      Remove the unlock_time= argument from the pam_faillock lines of each profile under /usr/share/pam-configs/ that the first command lists, set the value in /etc/security/faillock.conf instead and regenerate the PAM stack.

      grep -Pl '\bpam_faillock\.so\h+([^#\n\r]+\h+)?unlock_time\b' /usr/share/pam-configs/*
      sed -ri '/pam_faillock\.so/s/\s+unlock_time=[0-9]+//g' FILE
      echo 'unlock_time = 900' >> /etc/security/faillock.conf
      pam-auth-update --enable $(basename FILE)

      Edit an existing line in faillock.conf instead of adding a duplicate.
  - id: "CIS-UBUNTU22-5.3.3.1.3-faillock_even_root-attrs"
    name: "/etc/security/faillock.conf: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-3837626be2 |
      By default faillock does not lock the root account, so root remains an unlimited target for password guessing. even_deny_root, or a root_unlock_time of at least a minute, applies the lockout to root as well. Console or out-of-band access should remain available so a locked root cannot block recovery.
    remediation: *rem-41697c6a61
  - id: "CIS-UBUNTU22-5.3.3.1.3-faillock_even_root-content"
    name: "/etc/security/faillock.conf has the expected content (1 rule)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.1.3. NIST SP 800-53 Rev. 5: NA."
