    expect: false
    rationale: &rat-3bdc2b1e12 |
      Removing the package ldap-utils removes the LDAP command line clients. They are not needed unless the system administers a directory, and leaving them installed provides tools for querying directory data.
    remediation: &rem-fba80bd3ef |
      Remove the package ldap-utils, unless the system needs it:

      apt-get purge ldap-utils
  - id: "CIS-UBUNTU22-2.2.6-ftp_client"
