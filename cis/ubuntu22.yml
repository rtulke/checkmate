  - id: "CIS-UBUNTU22-1.3.1.2-grub_app_armor-attrs"
    name: "/etc/default/grub: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu22, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ecf938aaab |
      A mandatory access control module must be activated on the kernel command line so that it is active from early boot for every boot entry. Setting the parameters in /etc/default/grub makes this persistent across GRUB regenerations. On SUSE 16 the check expects SELinux (selinux=1 security=selinux) instead of AppArmor.
    remediation: &rem-2d1523887c |
      Create /etc/default/grub.
  - id: "CIS-UBUNTU22-1.3.1.2-grub_app_armor-content"
