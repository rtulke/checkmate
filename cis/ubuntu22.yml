  - id: "CIS-UBUNTU22-6.2.3.18-usermod_module_cnf"
    name: "usermod module cnf: grep usermod /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 6.2.3.18. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
