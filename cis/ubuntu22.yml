  - id: "CIS-UBUNTU22-2.4.1.2-crontab_perms-attrs"
    name: "/etc/crontab: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 2.4.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu22, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/crontab'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-11110b6073 |
      /etc/crontab defines system jobs that cron runs with the privileges of the listed users, typically root. If unprivileged users could write it they could schedule commands as root, and if they could read it they would learn which scripts run privileged and might be attacked. Restricting it to root with mode 0600 prevents both.
    remediation: &rem-59fd2ae0c5 |
      Create /etc/crontab if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/crontab'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/crontab'
