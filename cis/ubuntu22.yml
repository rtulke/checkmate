      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-037db005cf |
      Legacy .rhosts and .shosts files let users grant password-less access to their account from other hosts, outside of any central control. IgnoreRhosts makes sshd disregard these files, so such per-user trust relationships cannot be used to log in.
    remediation: *rem-f6392187bb
