  - id: "CIS-UBUNTU22-5.3.3.1.3-faillock_even_root_removed"
    name: "faillock even root removed: grep -Pl -- '\\bpam_faillock\\.so\\h+([^#\\n\\r]+\\h+)?(even_deny_root|root_unlock_time)' /usr/…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -Pl -- '\bpam_faillock\.so\h+([^#\n\r]+\h+)?(even_deny_root|root_unlock_time)' /usr/share/pam-configs/*
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ .*" }
    rationale: &rat-2d68e26972 |
      Whether lockout also applies to root, and for how long, should be configured in /etc/security/faillock.conf. even_deny_root or root_unlock_time given as pam_faillock arguments override the file and can diverge from the documented policy. Defining them only in faillock.conf keeps the root lockout behaviour consistent and auditable.
    remediation: &rem-739ce554be |
      Remove the even_deny_root and root_unlock_time arguments from the pam_faillock lines of each profile under /usr/share/pam-configs/ that the first command lists, set the value in /etc/security/faillock.conf instead and regenerate the PAM stack.

      grep -Pl '\bpam_faillock\.so\h+([^#\n\r]+\h+)?(even_deny_root|root_unlock_time)' /usr/share/pam-configs/*
      sed -ri '/pam_faillock\.so/s/\s+(even_deny_root|root_unlock_time(=[0-9]+)?)//g' FILE
      printf '%s\n' 'even_deny_root' 'root_unlock_time = 60' >> /etc/security/faillock.conf
      pam-auth-update --enable $(basename FILE)

      Edit an existing line in faillock.conf instead of adding a duplicate.
  - id: "CIS-UBUNTU22-5.3.3.2.1-passwd_change_not_pamd-attrs"
    name: "/etc/pam.d/common-password: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/common-password'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-9247230425 |
      difok defines how many characters of a new password must differ from the old one. A difok value of 0 or 1 given as an argument on the pam_pwquality line overrides pwquality.conf and lets users rotate passwords by changing a single character, which defeats password expiry.
    remediation: *rem-24dae7c4b7
  - id: "CIS-UBUNTU22-5.3.3.2.1-passwd_change_not_pamd-content"
    name: "/etc/pam.d/common-password has the expected content (1 rule)"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/common-password'
    allow_rc: any
    expect: { none: "~ ^\\s+password\\s+(requisite|required|sufficient)\\s+pam_pwquality\\.so\\s+([^#\\n\\r]+\\s+)?difok\\s*=\\s*([0-1])\\b" }
    rationale: *rat-9247230425
    remediation: &rem-bd16378d80 |
      Edit /etc/pam.d/common-password so that its lines meet these conditions (regular expressions):

      - no line matches ^\s+password\s+(requisite|required|sufficient)\s+pam_pwquality\.so\s+([^#\n\r]+\s+)?difok\s*=\s*([0-1])\b
  - id: "CIS-UBUNTU22-5.3.3.2.1-password_character_changed"
    name: "password character changed: grep -Psi -- '^\\h*difok\\h*=\\h*([2-9]|[1-9][0-9]+)\\b' /etc/security/pwquality.conf /etc/se…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*difok\h*=\h*([2-9]|[1-9][0-9]+)\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:difok\\s*=\\s*[2-9]" }
    rationale: &rat-b71bd8fb5f |
      Requiring that a new password differs from the old one in several characters prevents users from cycling through trivial variations such as appending a digit. Without it, password expiry adds little security because a leaked old password reveals the new one.
    remediation: &rem-30c88d9d14 |
      Set difok = 2 in a pwquality drop-in file and remove lower settings of difok from /etc/security/pwquality.conf and other drop-ins.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'difok = 2' > /etc/security/pwquality.conf.d/50-difok.conf

      The value is enforced by pam_pwquality (on Debian and Ubuntu install libpam-pwquality). Using a drop-in also matters for the check, which on some platforms fails when pwquality.conf.d contains no .conf file.
  - id: "CIS-UBUNTU22-5.3.3.2.2-password_minlen"
    name: "password minlen: grep -Psi -- '^\\h*minlen\\h*=\\h*(1[4-9]|[2-9][0-9]|[1-9][0-9]{2,})\\b' /etc/security/pwqual…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.2.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*minlen\h*=\h*(1[4-9]|[2-9][0-9]|[1-9][0-9]{2,})\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:minlen\\s*=\\s*(1[4-9]|[2-4][0-9])" }
    rationale: &rat-d3de089d0b |
      Password length is the most important factor for resistance against guessing and cracking. A minimum of 14 characters makes brute force attacks against stolen hashes impractical and encourages passphrases over short complex strings.
    remediation: &rem-3d639df090 |
      Set minlen = 14 in a pwquality drop-in file and remove lower settings of minlen from /etc/security/pwquality.conf and other drop-ins.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'minlen = 14' > /etc/security/pwquality.conf.d/50-minlen.conf

      The value is enforced by pam_pwquality (on Debian and Ubuntu install libpam-pwquality). Using a drop-in also matters for the check, which on some platforms fails when pwquality.conf.d contains no .conf file.
  - id: "CIS-UBUNTU22-5.3.3.2.2-password_minlen_not_pamd"
    name: "password minlen not pamd: grep -Psi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwquality\\.so\\h+([^#\\n…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.2.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwquality\.so\h+([^#\n\r]+\h+)?minlen\h*=\h*([0-9]|1[0-3])\b' /etc/pam.d/system-auth /etc/pam.d/common-password
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-eca3499dbe |
      A minlen argument on the pam_pwquality line overrides the value in pwquality.conf. A value below 14 there silently weakens the password length policy for all users.
    remediation: &rem-754b5a8c4d |
      Remove the minlen= option from the pam_pwquality.so line in /etc/pam.d/common-password and set minlen in /etc/security/pwquality.conf.d/ instead.

      grep -Pn 'pam_pwquality\.so.*\bminlen\s*=' /etc/pam.d/common-password /usr/share/pam-configs/*

      If the option comes from a profile in /usr/share/pam-configs/, remove it there and run pam-auth-update --package to regenerate common-password; otherwise edit common-password directly.
  - id: "CIS-UBUNTU22-5.3.3.2.3-password_complex"
    name: "password complex: grep -Psi -- '^\\h*(minclass|[dulo]credit)\\b' /etc/security/pwquality.conf /etc/security/p…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.2.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu22, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*(minclass|[dulo]credit)\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:minclass\\s*=\\s*([1-9]|[1-9][0-9])" }
      - { some: "~ .*\\:ucredit\\s*=\\s*(0|-\\d)" }
      - { some: "~ .*\\:lcredit\\s*=\\s*(0|-\\d)" }
      - { some: "~ .*\\:dcredit\\s*=\\s*(0|-\\d)" }
      - { some: "~ .*\\:ocredit\\s*=\\s*(0|-\\d)" }
    rationale: &rat-f4b189855b |
      Requiring several character classes enlarges the search space attackers must cover and prevents passwords made of a single class such as lowercase words. The variants differ: RHEL and Amazon Linux expect minclass 4 without per-class credit settings, Debian expects minclass, and Ubuntu additionally expects the per-class credit options to be set.
    remediation: &rem-5e39491c98 |
      Set minclass and explicit per-class credit values in a pwquality drop-in file.

      mkdir -p /etc/security/pwquality.conf.d
      printf '%s\n' 'minclass = 4' 'dcredit = 0' 'ucredit = 0' 'lcredit = 0' 'ocredit = 0' > /etc/security/pwquality.conf.d/50-pwcomplexity.conf

      The credit lines are only required by the Ubuntu check; 0 leaves the class requirement to minclass. Install libpam-pwquality so the values are enforced.
  - id: "CIS-UBUNTU22-5.3.3.2.3-password_complex_not_pamd"
    name: "password complex not pamd: grep -Psi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwquality\\.so\\h+([^#\\n…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.3.3.2.3. NIST SP 800-53 Rev. 5: IA-5."
