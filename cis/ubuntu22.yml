    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-72606260d1 |
      This parameter sets IPv4 forwarding for interfaces created later. If enabled, new interfaces, for example from VPNs or hot-plugged devices, would route packets between networks and could be used to bypass segmentation. Routers, VPN gateways and hosts running containers or virtual machines with routed networking legitimately need forwarding. This check verifies the value in the running kernel.
    remediation: &rem-4692d3e763 |
      Set the kernel parameter net.ipv4.conf.default.forwarding to 0, now and at boot:

      sysctl -w 'net.ipv4.conf.default.forwarding=0'
      printf '%s\n' 'net.ipv4.conf.default.forwarding = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.conf.default.forwarding from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU22-3.3.1.3-ip4_default_forwarding"
    name: "ip4 default forwarding: grep forwarding /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib…"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 3.3.1.3. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu22, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep forwarding /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:net.ipv4.conf.default.forwarding\\s*=\\s*0" }
      - { none: "~ .*:net.ipv4.conf.default.forwarding\\s*=\\s*1" }
    rationale: &rat-1a85dba7e0 |
      When IPv4 forwarding is enabled for new interfaces (default) the system routes packets between its interfaces, so it can be used to bypass network segmentation or act as a pivot. Hosts that are not routers, firewalls or container hosts should have forwarding disabled. This check verifies the persistent sysctl configuration files.
    remediation: &rem-733686c449 |
      Set net.ipv4.conf.default.forwarding to 0 in a file under /etc/sysctl.d/, apply it, and remove any line that sets it to 1:

      printf '%s\n' 'net.ipv4.conf.default.forwarding = 0' > /etc/sysctl.d/60-net_ipv4_conf_default_forwarding.conf
      sysctl -w net.ipv4.conf.default.forwarding=0
      grep -rs 'net.ipv4.conf.default.forwarding' /etc/sysctl.conf /etc/sysctl.d/ /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ /lib/sysctl.d/

      The check also reads vendor directories such as /usr/lib/sysctl.d; a package that sets the value to 1 there (for example container or virtualization software) keeps the check failing and indicates the host needs forwarding.
  - id: "CIS-UBUNTU22-3.3.1.4-net.ipv4.conf.all.send_redirects"
