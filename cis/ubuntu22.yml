  - id: "CIS-UBUNTU22-5.1.8-sshd_disableforwarding-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Ubuntu 22.04 LTS benchmark recommendation 5.1.8. NIST SP 800-53 Rev. 5: CM-7."
