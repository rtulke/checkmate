# Do not edit by hand; regenerate with `make cis-import`. See cis/NOTICE.
name: CIS Microsoft Windows Server 2022
version: "4.0.0"
description: >
  Automated checks for 433 recommendations of the CIS Microsoft Windows Server 2022 benchmark
  (version 4.0.0), converted from the goss audit content of the
  ansible-lockdown project. Check names describe what is verified; the
  recommendation number is in the ID and the description. Select profiles
  with tags, e.g. `--tags cis-level1-member-server`. Run elevated (as
  administrator). Every check collects its own value (registry, secedit,
  auditpol, services, firewall). Set `-e cis_windows_role=dc` on domain
  controllers and `-e cis_windows_role=standalone` on servers that are not
  domain members (adds the password and lockout rules the domain sets).

vars:
  # standalone, member (domain member server) or dc (domain controller)
  cis_windows_role: member

defaults:
  when: "facts.os == \"windows\" and facts.distro_name == \"Windows Server 2022\""
  timeout: 120s

checks:
  - id: "CIS-WIN2022-1.1.1-passwordhistorysize"
    name: "Security policy setting PasswordHistorySize"
    description: "CIS Microsoft Windows Server 2022 benchmark recommendation 1.1.1. NIST SP 800-53 Rev. 5: IA-5(1)."
    tags: [cis, cis-win2022, cis-section-1, cis-level-1, cis-level-2, cis-member-server, cis-level1-member-server, cis-level2-member-server, cis-domain-controller, cis-level1-domain-controller, cis-level2-domain-controller]
    severity: medium
    timeout: 30000ms
    when: "cis_windows_role in [\"standalone\"]"
    run: |
      $snap = Join-Path $env:TEMP ('checkmate-' + [guid]::NewGuid().ToString())
      New-Item -ItemType Directory -Path $snap | Out-Null
      try {
        $value = & {
          $inf = Join-Path $env:TEMP ('checkmate-' + [guid]::NewGuid().ToString() + '.inf')
          try {
            & secedit.exe /export /areas SECURITYPOLICY /cfg $inf /quiet | Out-Null
            if (-not (Test-Path -LiteralPath $inf)) { throw 'secedit /export failed; checkmate must run as administrator' }
            $lines = Get-Content -LiteralPath $inf
          } finally {
            Remove-Item -LiteralPath $inf -Force -ErrorAction SilentlyContinue
          }
          $v = 'ABSENT'
          foreach ($line in $lines) { if ($line -match '^\s*PasswordHistorySize\s*=\s*(.*)$') { $v = $Matches[1].Trim().Trim('"') } }
          $v
        }
        [IO.File]::WriteAllText((Join-Path $snap 'SystemAccess.PasswordHistorySize'), ((@($value) -join "`n")))
        $p = Join-Path $snap 'SystemAccess.PasswordHistorySize'; if (-not (Test-Path -LiteralPath $p)) { 'NONCOMPLIANT not_collected' } else { $r = (Get-Content -LiteralPath $p -Raw).Trim(); if ($r -notmatch '^[0-9]+$') { 'NONCOMPLIANT actual=' + $r } else { $v = [int]$r; if ($v -ge 24) { 'COMPLIANT' } else { 'NONCOMPLIANT actual=' + $v } } }
      } finally {
        Remove-Item -LiteralPath $snap -Recurse -Force -ErrorAction SilentlyContinue
      }
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^COMPLIANT$" }
    remediation: |
      Set the security policy setting "Enforce password history" (PasswordHistorySize) to 24 or more passwords remembered.

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Account Policies\Password Policy\Enforce password history
      On a single computer: Local Security Policy (secpol.msc). Or in PowerShell:

      net accounts /uniquepw:24

      For domain accounts this policy comes from the Group Policy Object linked to the domain (usually the Default Domain Policy); local settings apply only to local accounts.
