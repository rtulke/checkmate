  - id: "CIS-WIN2022-2.2.2-senetworklogonright"
    name: "User right SeNetworkLogonRight is assigned only as required"
    description: "CIS Microsoft Windows Server 2022 benchmark recommendation 2.2.2. NIST SP 800-53 Rev. 5: AC-2, AC-3, AC-6, AC-6(1), AC-6(7), AU-9(4)."
    tags: [cis, cis-win2022, cis-section-2, cis-level-1, cis-level-2, cis-domain-controller, cis-level1-domain-controller, cis-level2-domain-controller]
    severity: medium
    when: "cis_windows_role in [\"dc\"]"
    run: |
      $inf = Join-Path $env:TEMP ('checkmate-' + [guid]::NewGuid().ToString() + '.inf')
      try {
        & secedit.exe /export /areas USER_RIGHTS /cfg $inf /quiet | Out-Null
        if (-not (Test-Path -LiteralPath $inf)) { throw 'secedit /export failed; checkmate must run as administrator' }
        $lines = Get-Content -LiteralPath $inf
      } finally {
        Remove-Item -LiteralPath $inf -Force -ErrorAction SilentlyContinue
      }
      $members = @()
      foreach ($line in $lines) {
        if ($line -match '^\s*SeNetworkLogonRight\s*=\s*(.*)$') {
          $members = @($Matches[1].Split(',') | Where-Object { $_.Trim() -ne '' } | ForEach-Object {
            $t = $_.Trim().TrimStart('*')
            if ($t -like 'S-1-*') { $t } else {
              try { (New-Object System.Security.Principal.NTAccount($t)).Translate([System.Security.Principal.SecurityIdentifier]).Value }
              catch { "UNRESOLVED=$t" }
            }
          } | Sort-Object -Unique)
        }
      }
      if ($members.Count -eq 0) { 'NONE' } else { $members -join ',' }
    expect: { some: "~ ^S-1-5-11,S-1-5-32-544,S-1-5-9$" }
    remediation: |
      Assign the user right "Access this computer from the network" (SeNetworkLogonRight) to exactly Authenticated Users (S-1-5-11), Administrators (S-1-5-32-544), ENTERPRISE DOMAIN CONTROLLERS (S-1-5-9); remove all other accounts and groups.

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\User Rights Assignment\Access this computer from the network
      On a single computer: Local Security Policy (secpol.msc).

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
