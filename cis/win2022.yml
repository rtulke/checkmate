  - id: "CIS-WIN2022-18.9.39.1-SamNGCKeyROCAValidation"
    name: "Registry value SamNGCKeyROCAValidation is 1 (HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\SAM)"
    description: "CIS Microsoft Windows Server 2022 benchmark recommendation 18.9.39.1. NIST SP 800-53 Rev. 5: SC-39, SI-16."
    tags: [cis, cis-win2022, cis-section-18, cis-level-1, cis-level-2, cis-domain-controller, cis-level1-domain-controller, cis-level2-domain-controller]
    severity: medium
    when: "cis_windows_role in [\"dc\"]"
    run: |
      $k = Get-Item -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\SAM' -ErrorAction SilentlyContinue
      $n = 'SamNGCKeyROCAValidation'
      if ($null -eq $k -or $null -eq $k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) { 'ABSENT' }
      else { '{0}={1}' -f $k.GetValueKind($n), (@($k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) -join '|') }
    expect: "== DWord=1"
    remediation: |
      Set the registry value SamNGCKeyROCAValidation in HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\SAM to 1 (REG_DWORD):

      $k = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\SAM'
      if (-not (Test-Path -LiteralPath $k)) { New-Item -Path $k -Force | Out-Null }
      New-ItemProperty -LiteralPath $k -Name 'SamNGCKeyROCAValidation' -PropertyType DWord -Value 1 -Force | Out-Null

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
