  - id: "CIS-WIN2022-18.1.1.1-NoLockScreenCamera"
    name: "Registry value NoLockScreenCamera is 1 (HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Personalization)"
    description: "CIS Microsoft Windows Server 2022 benchmark recommendation 18.1.1.1. NIST SP 800-53 Rev. 5: CM-6b."
    tags: [cis, cis-win2022, cis-section-18, cis-level-1, cis-level-2, cis-member-server, cis-level1-member-server, cis-level2-member-server, cis-domain-controller, cis-level1-domain-controller, cis-level2-domain-controller]
    severity: medium
    run: |
      $k = Get-Item -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Personalization' -ErrorAction SilentlyContinue
      $n = 'NoLockScreenCamera'
      if ($null -eq $k -or $null -eq $k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) { 'ABSENT' }
      else { '{0}={1}' -f $k.GetValueKind($n), (@($k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) -join '|') }
    expect: "== DWord=1"
    remediation: |
      Set the registry value NoLockScreenCamera in HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization to 1 (REG_DWORD):

      $k = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
      if (-not (Test-Path -LiteralPath $k)) { New-Item -Path $k -Force | Out-Null }
      New-ItemProperty -LiteralPath $k -Name 'NoLockScreenCamera' -PropertyType DWord -Value 1 -Force | Out-Null

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
