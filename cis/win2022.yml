        if ($null -eq $actual) { $bad += "$sid=absent" } elseif ("$actual" -ne '1') { $bad += "$sid=$actual" }
      }
      if ($bad.Count -eq 0) { "COMPLIANT profiles=$($sids.Count)" } else { 'NONCOMPLIANT ' + ($bad -join ' ') }
    expect: { some: "~ ^COMPLIANT profiles=[1-9][0-9]*$" }
    remediation: |
      Set the per-user registry value PreventCodecDownload in HKCU\SOFTWARE\Policies\Microsoft\WindowsMediaPlayer to 1 (REG_DWORD) for every user, preferably with a Group Policy Object (User Configuration). For the user who runs the command:

      $k = 'HKCU:\SOFTWARE\Policies\Microsoft\WindowsMediaPlayer'
      if (-not (Test-Path -LiteralPath $k)) { New-Item -Path $k -Force | Out-Null }
      New-ItemProperty -LiteralPath $k -Name 'PreventCodecDownload' -PropertyType DWord -Value 1 -Force | Out-Null

      The check inspects the profiles of all users that are loaded.
  - id: "CIS-WIN2022-2.2.22-sedenynetworklogonright"
    name: "User right SeDenyNetworkLogonRight is assigned only as required"
    description: "CIS Microsoft Windows Server 2022 benchmark recommendation 2.2.22. NIST SP 800-53 Rev. 5: AC-2, AC-3, AC-6, AC-6(1), AC-6(7), AU-9(4)."
    tags: [cis, cis-win2022, cis-section-2, cis-level-1, cis-level-2, cis-member-server, cis-level1-member-server, cis-level2-member-server]
    severity: medium
    when: "cis_windows_role in [\"member\"]"
    run: |
      $inf = Join-Path $env:TEMP ('checkmate-' + [guid]::NewGuid().ToString() + '.inf')
      try {
        & secedit.exe /export /areas USER_RIGHTS /cfg $inf /quiet | Out-Null
        if (-not (Test-Path -LiteralPath $inf)) { throw 'secedit /export failed; checkmate must run as administrator' }
        $lines = Get-Content -LiteralPath $inf
      } finally {
        Remove-Item -LiteralPath $inf -Force -ErrorAction SilentlyContinue
      }
      $members = @()
      foreach ($line in $lines) {
        if ($line -match '^\s*SeDenyNetworkLogonRight\s*=\s*(.*)$') {
          $members = @($Matches[1].Split(',') | Where-Object { $_.Trim() -ne '' } | ForEach-Object {
            $t = $_.Trim().TrimStart('*')
            if ($t -like 'S-1-*') { $t } else {
              try { (New-Object System.Security.Principal.NTAccount($t)).Translate([System.Security.Principal.SecurityIdentifier]).Value }
              catch { "UNRESOLVED=$t" }
            }
          } | Sort-Object -Unique)
        }
      }
      if ($members.Count -eq 0) { 'NONE' } else { $members -join ',' }
    expect:
      - { some: "~ ^(.*,)?S-1-5-114(,.*)?$" }
      - { some: "~ ^(.*,)?S-1-5-32-546(,.*)?$" }
    remediation: |
      Add Local account and member of Administrators group (S-1-5-114) and Guests (S-1-5-32-546) to the user right "Deny access to this computer from the network" (SeDenyNetworkLogonRight); other accounts and groups may hold it as well.

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\User Rights Assignment\Deny access to this computer from the network
      On a single computer: Local Security Policy (secpol.msc).

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
