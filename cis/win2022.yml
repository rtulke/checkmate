      Assign the user right "Take ownership of files or other objects" (SeTakeOwnershipPrivilege) to exactly Administrators (S-1-5-32-544); remove all other accounts and groups.

      Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\User Rights Assignment\Take ownership of files or other objects
      On a single computer: Local Security Policy (secpol.msc).

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
