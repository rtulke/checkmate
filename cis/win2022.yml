  - id: "CIS-WIN2022-1.1.6-RelaxMinimumPasswordLengthLimits"
    name: "Registry value RelaxMinimumPasswordLengthLimits is 1 (HKLM\\SYSTEM\\CurrentControlSet\\Control\\SAM)"
    description: "CIS Microsoft Windows Server 2022 benchmark recommendation 1.1.6. NIST SP 800-53 Rev. 5: IA-5(1)."
    tags: [cis, cis-win2022, cis-section-1, cis-level-1, cis-level-2, cis-member-server, cis-level1-member-server, cis-level2-member-server]
    severity: medium
    when: "cis_windows_role in [\"standalone\", \"member\"]"
    run: |
      $k = Get-Item -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SAM' -ErrorAction SilentlyContinue
      $n = 'RelaxMinimumPasswordLengthLimits'
      if ($null -eq $k -or $null -eq $k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) { 'ABSENT' }
      else { '{0}={1}' -f $k.GetValueKind($n), (@($k.GetValue($n, $null, 'DoNotExpandEnvironmentNames')) -join '|') }
    expect: "== DWord=1"
    remediation: |
      Set the registry value RelaxMinimumPasswordLengthLimits in HKLM\SYSTEM\CurrentControlSet\Control\SAM to 1 (REG_DWORD):

      $k = 'HKLM:\SYSTEM\CurrentControlSet\Control\SAM'
      if (-not (Test-Path -LiteralPath $k)) { New-Item -Path $k -Force | Out-Null }
      New-ItemProperty -LiteralPath $k -Name 'RelaxMinimumPasswordLengthLimits' -PropertyType DWord -Value 1 -Force | Out-Null

      If a Group Policy Object manages this setting, change it there; a value set directly on the computer is replaced at the next policy refresh.
