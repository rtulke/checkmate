    run: |
      rpm -q --quiet openldap-clients
    expect: false
    rationale: &rat-ed14c6bd07 |
      The OpenLDAP client tools let users query and modify LDAP directories from the command line, which can be used to enumerate accounts and directory data, sometimes over unencrypted connections. Systems that do not need to administer a directory should not carry them. System authentication via SSSD does not require this package.
    remediation: &rem-c3c0dd7932 |
      Remove the package openldap-clients, unless the system needs it:

      dnf remove openldap-clients
  - id: "CIS-RHEL8-2.2.3-nis-clients"
    name: "Package ypbind is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.2.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet ypbind
    expect: false
    rationale: &rat-aa3474ea0d |
      The NIS client (ypbind) obtains account and host information over an unauthenticated, unencrypted protocol, so a rogue server on the network can supply fake maps. Removing it is appropriate wherever NIS is not used, which is almost everywhere today.
    remediation: &rem-c6563f282f |
      Remove the package ypbind, unless the system needs it:

      dnf remove ypbind
  - id: "CIS-RHEL8-2.2.4-telnet_client"
