  - id: "CIS-RHEL8-5.1.13-ssh_rhosts_live"
    name: "ssh rhosts live: sshd -T | grep -i '^ignorerhosts'"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.13. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -i '^ignorerhosts'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (?i)^ignorerhosts yes" }
      - { none: "~ (?i)^ignorerhosts no" }
    rationale: &rat-208615ee5e |
      The legacy .rhosts and .shosts files let users grant password-less access to their account from other hosts. Such trust relationships are hard to audit and easy to abuse once one host is compromised. Setting IgnoreRhosts makes the SSH server disregard these files for authentication.
    remediation: &rem-be3c8ee8f7 |
      Make the SSH server ignore .rhosts and .shosts files.

      echo 'IgnoreRhosts yes' > /etc/ssh/sshd_config.d/00-ignorerhosts.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any IgnoreRhosts line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-RHEL8-5.1.14-no_weak_ssh_kex"
    name: "no weak ssh kex: {"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.14. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      {
      #!/usr/bin/env bash
      
      source /etc/crypto-policies/back-ends/opensshserver.config
      source /etc/sysconfig/sshd
      sshd -T $OPTIONS $CRYPTO_POLICY | grep -Pi -- 'kexalgorithms\h+([^#\n\r]+,)?(diffie-hellman-group1-sha1|diffie-hellman-group14-sha1|diffie-hellman-group-exchange-sha1)\b'
      }
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ diffie-hellman-group1-sha1" }
      - { none: "~ diffie-hellman-group14-sha1" }
      - { none: "~ diffie-hellman-group-exchange-sha1" }
    rationale: &rat-feabaefb53 |
      Key exchange methods based on SHA-1 or on the 1024-bit Diffie-Hellman group 1 no longer provide adequate security: SHA-1 is vulnerable to collision attacks and small groups can be precomputed by well-resourced attackers. If the server offers them, a session key can be negotiated with a weak method, undermining the confidentiality of the whole connection.
    remediation: &rem-2a1cbf9cbe |
      Disable the SHA-1 key exchange methods. On RHEL and Amazon Linux sshd follows the system crypto policy; the NO-SHA1 module removes SHA-1 from it. Also remove any explicit KexAlgorithms line in /etc/ssh/sshd_config or /etc/ssh/sshd_config.d/*.conf that lists the sha1 methods.

      update-crypto-policies --set DEFAULT:NO-SHA1
      systemctl restart sshd

      NO-SHA1 also disables SHA-1 signatures system-wide, which can break very old clients and keys. --set replaces the whole policy: combine it with modules already in use (update-crypto-policies --show).
  - id: "CIS-RHEL8-5.1.15-sshd_logingrace-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.15. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-3eba865f26 |
      LoginGraceTime limits how long an unauthenticated connection may stay open. A short limit of 60 seconds or less reduces the impact of connection-exhaustion attacks against the SSH daemon and gives password guessing less time per connection.
    remediation: *rem-f6392187bb
  - id: "CIS-RHEL8-5.1.15-sshd_logingrace-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.15. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect:
      - { some: "~ ^LoginGraceTime ([1-9]|[1-5][0-9]|60)" }
      - { none: "~ ^LoginGraceTime (6[1-9]|[7-9][0-9]|[1-9][0-9]{2,})" }
    rationale: *rat-3eba865f26
    remediation: &rem-3e51ed477f |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches ^LoginGraceTime ([1-9]|[1-5][0-9]|60)
      - no line matches ^LoginGraceTime (6[1-9]|[7-9][0-9]|[1-9][0-9]{2,})
  - id: "CIS-RHEL8-5.1.15-ssh_logingrace_live"
    name: "ssh logingrace live: sshd -T | grep -i '^logingracetime'"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.15. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -i '^logingracetime'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (?i)^logingracetime ([1-9]|[1-5][0-9]|60)" }
      - { none: "~ (?i)^logingracetime (6[1-9]|[7-9][0-9]|[1-9][0-9]{2,})" }
    rationale: &rat-82827b7520 |
      LoginGraceTime limits how long an unauthenticated connection may stay open. A long grace period lets attackers hold many half-open connections and exhaust the server's connection slots, or spend more time on each guessing attempt. A limit of one minute or less still leaves enough time for legitimate logins.
    remediation: &rem-9451437f62 |
      Set the login grace time to 60 seconds or less.

      echo 'LoginGraceTime 60' > /etc/ssh/sshd_config.d/00-logingracetime.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any LoginGraceTime line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-RHEL8-5.1.16-sshd_loglevel-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.16. NIST SP 800-53 Rev. 5: AU-3, AU-12, SI-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-04f1745e29 |
      sshd logging at INFO or VERBOSE records logins, and with VERBOSE the key fingerprints used, which is needed to trace access during investigations. DEBUG levels log excessive detail, may include sensitive information and are not meant for production.
    remediation: *rem-f6392187bb
  - id: "CIS-RHEL8-5.1.16-sshd_loglevel-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.16. NIST SP 800-53 Rev. 5: AU-3, AU-12, SI-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
