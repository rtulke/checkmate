  - id: "CIS-RHEL8-3.2.5-modprobe_sctp"
    name: "modprobe sctp: modprobe -n -v sctp"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.2.5. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v sctp
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /bin/(true|false)" }
    rationale: &rat-be5bf6712f |
      SCTP is a message-oriented transport protocol used mainly in telecommunications. Its kernel module adds network-reachable code that most systems never use. Preventing the module from loading removes this attack surface on systems that do not use the protocol. Some telecom and clustering software needs SCTP.
    remediation: &rem-40e3047e72 |
      Keep the sctp module from being loaded: add an install override and a blacklist entry for it in /etc/modprobe.d/, then unload it if it is currently loaded.

      printf '%s\n' 'install sctp /bin/false' 'blacklist sctp' > /etc/modprobe.d/sctp.conf
      modprobe -r sctp

      modprobe -r reports an error if the module is not loaded, which is harmless; if sockets of this protocol are open, the module stays loaded until reboot.
  - id: "CIS-RHEL8-3.2.6-lsmod_tipc"
    name: "lsmod tipc: lsmod | grep -i tipc"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.2.6. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i tipc
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-93a1fbf5b3 |
      TIPC is a cluster communication protocol that ordinary servers do not use. Its kernel module has had remotely exploitable vulnerabilities, and an unused protocol module that can be loaded on demand is unnecessary attack surface. The check confirms the module is not loaded.
    remediation: &rem-a6bb92cddf |
      Prevent the tipc module from being loaded and unload it.

      printf '%s\n' 'blacklist tipc' 'install tipc /bin/false' > /etc/modprobe.d/tipc.conf
      modprobe -r tipc

      If the module is in use and cannot be removed, the change takes effect after a reboot.
  - id: "CIS-RHEL8-3.2.6-modprobe_tipc"
    name: "modprobe tipc: modprobe -n -v tipc"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.2.6. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
