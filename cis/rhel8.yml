    run: |
      rpm -q --quiet squid
    expect: false
    rationale: &rat-3ba46f5d95 |
      Squid is an HTTP proxy server. A proxy that is not meant to run can be abused to relay traffic or reach internal systems, so it should not be installed unless the system is an approved proxy.
    remediation: &rem-d2fd20e6ef |
      Remove the package squid, unless the system needs it:

      dnf remove squid
  - id: "CIS-RHEL8-2.1.19-httpd_pkg"
