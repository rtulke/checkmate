      - { some: "~ (?i)^hostbasedauthentication no" }
      - { none: "~ (?i)^hostbasedauthentication yes" }
    rationale: &rat-10e0cd6826 |
      Host-based authentication trusts a user because of the client host they connect from, using .rhosts, shosts.equiv or known host keys. A single compromised or spoofed client host then grants access to accounts on the server without individual credentials. Disabling it forces each user to authenticate personally.
    remediation: &rem-5a00c40bd5 |
