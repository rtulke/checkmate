    name: "user accts valid shell: l_valid_shells=\"^($(awk -F\\/ '$NF != \"nologin\" {print}' /etc/shells | sed -rn '/^\\//{s,/,…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.2.8. NIST SP 800-53 Rev. 5: AC-2(5), AC-3, AC-11, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
