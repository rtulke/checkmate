  - id: "CIS-RHEL8-5.3.3.4.4-use_authtok_pwhistory_password-attrs"
    name: "/etc/pam.d/password-auth: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.3.3.4.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
