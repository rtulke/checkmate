      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect:
      - { some: "~ ^LogLevel\\s(VERBOSE|INFO)" }
      - { none: "~ ^LogLevel DEBUG" }
    rationale: *rat-04f1745e29
    remediation: &rem-8319eaf4df |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches ^LogLevel\s(VERBOSE|INFO)
      - no line matches ^LogLevel DEBUG
  - id: "CIS-RHEL8-5.1.16-ssh_loglevel_live"
    name: "ssh loglevel live: sshd -T | grep -i '^loglevel'"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.16. NIST SP 800-53 Rev. 5: AU-3, AU-12, SI-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -i '^loglevel'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (?i)^loglevel\\s(VERBOSE|INFO)" }
      - { none: "~ (?i)^loglevel DEBUG" }
    rationale: &rat-1456734810 |
      SSH logs are the primary record of who logged in, from where and with which key. INFO records logins and logouts, and VERBOSE additionally records the key fingerprint used, which is valuable for incident investigation. Lower levels lose this information, while DEBUG produces excessive output and may log sensitive details.
    remediation: &rem-27ea57d275 |
      Set the SSH server log level to VERBOSE (INFO is also accepted).

      echo 'LogLevel VERBOSE' > /etc/ssh/sshd_config.d/00-loglevel.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any LogLevel line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-RHEL8-5.1.17-no_weak_ssh_macs"
    name: "no weak ssh macs: {"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.17. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      {
      #!/usr/bin/env bash
      
      source /etc/crypto-policies/back-ends/opensshserver.config
      source /etc/sysconfig/sshd
      sshd -T $OPTIONS $CRYPTO_POLICY | grep -Pi -- 'macs\h+([^#\n\r]+,)?(hmac-md5|hmac-md5-96|hmac-ripemd160|hmac-sha1-96|umac-64@openssh\.com|hmac-md5-etm@openssh\.com|hmac-md5-96-etm@openssh\.com|hmac-ripemd160-etm@openssh\.com|hmac-sha1-96-etm@openssh\.com|umac-64-etm@openssh\.com|umac-128-etm@openssh\.com)\b'
      }
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-740cca9bb0 |
      Message authentication codes protect SSH traffic against tampering. MD5, RIPEMD-160, truncated SHA-1 (96-bit) and the 64-bit UMAC tags are weak or too short to resist forgery reliably. If the server offers them, a connection may be protected by a weak integrity check. Some variants also exclude umac-128-etm@openssh.com.
    remediation: &rem-02d64e9ca2 |
      Remove the weak MACs from the SSH server. On RHEL and Amazon Linux sshd follows the system crypto policy, so add a policy module that drops them, and remove or correct any explicit MACs line in /etc/ssh/sshd_config or /etc/ssh/sshd_config.d/*.conf that lists them.

      echo 'mac@SSH = -HMAC-MD5 -UMAC-64 -UMAC-128' > /etc/crypto-policies/policies/modules/NO-SSHWEAKMACS.pmod
      update-crypto-policies --set DEFAULT:NO-SSHWEAKMACS
      systemctl restart sshd

      --set replaces the whole policy: keep the modules already in use (update-crypto-policies --show) and list all of them together, e.g. DEFAULT:NO-SHA1:NO-SSHWEAKCIPHERS:NO-SSHWEAKMACS.
  - id: "CIS-RHEL8-5.1.18-sshd_authtries-attrs"
