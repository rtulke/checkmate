    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nosuid(,|$)"
    rationale: &rat-572107ee67 |
      /tmp is world-writable and used by every user and service for temporary files. With nosuid, set-user-ID and set-group-ID bits on files there are ignored, so a privileged program planted or copied there cannot be used to gain elevated rights. This check verifies the option on the currently mounted file system.
    remediation: &rem-7a473b9cfd |
      Mount /tmp with the option nosuid: add it to the options of /tmp in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/tmp'

      If /tmp is not a separate file system yet, create one first.
  - id: "CIS-RHEL8-1.1.2.1.3-tmp_fstab_nosuid_soptions-attrs"
    name: "/etc/fstab: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.1.2.1.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
