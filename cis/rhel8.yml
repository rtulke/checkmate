      Remove the package nginx, unless the system needs it:

      dnf remove nginx
  - id: "CIS-RHEL8-2.1.20-xinetd_pkg"
    name: "Package xinetd is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.1.20. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet xinetd
    expect: false
    rationale: &rat-16174e0987 |
      xinetd starts network services on demand, often legacy services with weak or no authentication. Modern systems use systemd socket activation instead; xinetd should not be installed unless a required service depends on it.
    remediation: &rem-98e8e287d6 |
      Remove the package xinetd, unless the system needs it:

      dnf remove xinetd
  - id: "CIS-RHEL8-2.1.21-gdm_pkg"
    name: "Package gdm is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.1.21. NIST SP 800-53 Rev. 5: CM-7."
