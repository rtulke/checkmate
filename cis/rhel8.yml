    severity: low
    run: |
      rpm -q --quiet xorg-x11-server-common
    expect: false
    rationale: &rat-9887718198 |
      A graphical display server is rarely needed on servers. It adds a large amount of code, including setuid or privileged components with a history of vulnerabilities. Servers administered remotely should not have it installed.
    remediation: &rem-b99ea4a923 |
      Remove the package xorg-x11-server-common, unless the system needs it:

      dnf remove xorg-x11-server-common
  - id: "CIS-RHEL8-2.1.24-manual_listening_ports"
    name: "manual listening ports: echo \"Manual!! - Please check only approved services are listening\""
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.1.24. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual!! - Please check only approved services are listening"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-71d1cf147e |
      Every listening network service is a potential entry point. Reviewing listening ports and the processes behind them ensures that only approved services are reachable and reveals forgotten or unexpected ones. This is a manual review.
    remediation: &rem-905c71ee6f |
      This is a manual review. List all listening sockets with their processes, then stop and disable, or block with the firewall, every service that is not approved, and document the result.

      ss -tulpn
      systemctl disable --now SERVICE

      The check itself only prints a reminder and reports a failure on most platforms regardless of the result.
  - id: "CIS-RHEL8-2.2.1-ftp"
    name: "Package ftp is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.2.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet ftp
    expect: false
    rationale: &rat-801964c98f |
      The ftp client transfers data and credentials in clear text, so passwords and files can be captured on the network. Secure alternatives such as sftp or scp are available. Removing the client discourages insecure transfers.
    remediation: &rem-0f3873f227 |
      Remove the package ftp, unless the system needs it:

      dnf remove ftp
  - id: "CIS-RHEL8-2.2.2-openldap-clients"
    name: "Package openldap-clients is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.2.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-2, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
