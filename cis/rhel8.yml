  - id: "CIS-RHEL8-1.5.6-sysctl_ktpr_restrict_conf"
    name: "sysctl ktpr restrict conf: grep -R kernel.kptr_restrict /etc/sysctl.conf /etc/sysctl.d/"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.5.6. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
