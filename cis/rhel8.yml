  - id: "CIS-RHEL8-1.1.2.7.3-var_log_audit_nosuid_options"
    name: "/var/log/audit is a separate mount with nosuid"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.1.2.7.3. NIST SP 800-53 Rev. 5: AC-3, MP-2, CM-7."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/var/log/audit'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nosuid(,|$)"
    rationale: &rat-3990e4a53c |
      /var/log/audit holds the audit trail, which never needs device files, privileged programs or executables. With nosuid, set-user-ID and set-group-ID bits on files there are ignored, so a privileged program planted or copied there cannot be used to gain elevated rights. This check verifies the option on the currently mounted file system.
    remediation: &rem-01f5941b28 |
      Mount /var/log/audit with the option nosuid: add it to the options of /var/log/audit in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/var/log/audit'

      If /var/log/audit is not a separate file system yet, create one first.
  - id: "CIS-RHEL8-1.1.2.7.3-var_log_audit_fstab_nosuid_options-attrs"
    name: "/etc/fstab: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.1.2.7.3. NIST SP 800-53 Rev. 5: AC-3, MP-2, CM-7."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/fstab'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-35d3bb9a27 |
      Setuid and setgid programs placed on /var/log/audit, a location that should only hold audit logs, could be used to gain the privileges of their owner. Mounting it with nosuid makes the kernel ignore these bits, so such files cannot escalate privileges. The check verifies that the option is set persistently in /etc/fstab.
    remediation: *rem-8ee214ccd7
  - id: "CIS-RHEL8-1.1.2.7.3-var_log_audit_fstab_nosuid_options-content"
    name: "/etc/fstab has the expected content (1 rule)"
