    run: |
      rpm -q --quiet samba
    expect: false
    rationale: &rat-71a7199772 |
      Samba provides SMB/CIFS file and print sharing. It is a large network-facing service with a history of vulnerabilities; unless the system is meant to share files with SMB clients it should not be installed.
