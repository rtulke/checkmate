    allow_rc: any
    expect:
      - { some: "~ ^PASS_MIN_DAYS\\s+7" }
      - { none: "~ ^PASS_MIN_DAYS\\s+(0|-1)" }
    rationale: *rat-07438795a5
    remediation: &rem-0dabbafacc |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_MIN_DAYS\s+7
      - no line matches ^PASS_MIN_DAYS\s+(0|-1)
  - id: "CIS-RHEL8-5.4.1.2-check_users_MIN_DAYS"
    name: "check users MIN DAYS: awk -F: '/^[^:]+:[^!*]/ \u0026\u0026 (length($4) == 0 || $4 \u003c 7) {print $1\":\"$4}' /etc/shadow"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      awk -F: '/^[^:]+:[^!*]/ && (length($4) == 0 || $4 < 7) {print $1":"$4}' /etc/shadow
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-97fb70a127 |
      Without a minimum password age, a user forced to change a password can immediately change it several more times to cycle through the history and return to the old one. A minimum age of at least one day makes password history effective.
    remediation: &rem-65917eb6bd |
      Set a minimum password age of 7 days (RHEL 8 requires at least 7, RHEL 9 at least 1) for new accounts and for each existing account with a password.

      sed -ri 's/^\s*PASS_MIN_DAYS\s+.*/PASS_MIN_DAYS 7/' /etc/login.defs
      chage --mindays 7 USER
  - id: "CIS-RHEL8-5.4.1.3-check_users_warn_age"
    name: "check users warn age: awk -F: '/^[^:]+:[^!*]/ \u0026\u0026 (length($6) == 0 || $6 \u003c 7) {print $1\":\"$6}' /etc/shadow"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '/^[^:]+:[^!*]/ && (length($6) == 0 || $6 < 7) {print $1":"$6}' /etc/shadow
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-fa29f42f01 |
      The login.defs warning period only applies to passwords set after the change. Existing accounts with a shorter or no warning period can expire without notice, leading to lockouts or rushed weak passwords. This check verifies the warning period of every account with a password.
    remediation: &rem-77fd644133 |
      Set a warning period of at least 7 days for each account the check reports.

      chage --warndays 7 USER
  - id: "CIS-RHEL8-5.4.1.3-login_defs_warn_age"
    name: "login defs warn age: grep PASS_WARN_AGE /etc/login.defs"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep PASS_WARN_AGE /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS_WARN_AGE\\s+7" }
      - { none: "~ ^PASS_WARN_AGE\\s+[1-6]" }
    rationale: &rat-ca921e80d6 |
      Warning users several days before their password expires gives them time to choose a good new password instead of being forced into a hasty choice or being locked out. PASS_WARN_AGE sets the default warning period for new passwords.
    remediation: &rem-ce0575be3a |
      Set PASS_WARN_AGE to 7 in /etc/login.defs.

      sed -ri 's/^\s*PASS_WARN_AGE\s+.*/PASS_WARN_AGE 7/' /etc/login.defs
      grep -q '^PASS_WARN_AGE' /etc/login.defs || echo 'PASS_WARN_AGE 7' >> /etc/login.defs

      login.defs only applies to accounts created or passwords changed later; adjust existing accounts with chage.
  - id: "CIS-RHEL8-5.4.1.4-crypt__etc_login.defs-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-62fee2094e |
      ENCRYPT_METHOD in login.defs selects the hashing algorithm used by tools such as passwd, chpasswd and useradd. SHA512 or yescrypt produce salted, deliberately slow hashes that are much harder to crack than legacy algorithms.
    remediation: *rem-0b6bdc1798
  - id: "CIS-RHEL8-5.4.1.4-crypt__etc_login.defs-content"
    name: "/etc/login.defs has the expected content (1 rule)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect: { some: "~ ^ENCRYPT_METHOD (SHA512|yescrypt)" }
    rationale: *rat-62fee2094e
    remediation: &rem-a61e4f3b34 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^ENCRYPT_METHOD (SHA512|yescrypt)
  - id: "CIS-RHEL8-5.4.1.4-crypt_userlib-attrs"
    name: "/etc/libuser.conf: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/libuser.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-2c75b63cda |
      Tools based on libuser, such as luseradd and lpasswd, use their own crypt_style setting. If it is not set to a strong algorithm, passwords created with these tools could be hashed weakly even when PAM and login.defs are configured correctly.
    remediation: &rem-e322e2f413 |
      Create /etc/libuser.conf.
  - id: "CIS-RHEL8-5.4.1.4-crypt_userlib-content"
    name: "/etc/libuser.conf has the expected content (1 rule)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/libuser.conf'
    allow_rc: any
    expect: { some: "~ ^crypt_style = (sha512|yescrypt)" }
    rationale: *rat-2c75b63cda
    remediation: &rem-f46123b2f4 |
      Edit /etc/libuser.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^crypt_style = (sha512|yescrypt)
  - id: "CIS-RHEL8-5.4.1.5-inactive_passwd"
    name: "inactive passwd: useradd -D | grep INACTIVE"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      useradd -D | grep INACTIVE
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^INACTIVE=([1-9]|[0-2][0-9]|30)" }
    rationale: &rat-1b1499cc8f |
      The default INACTIVE value used by useradd defines how many days after password expiry an account is disabled. Disabling unused accounts automatically removes forgotten access paths that attackers like to exploit; a value of up to 30 or 45 days, depending on the policy, balances security and usability.
    remediation: &rem-728ced36b8 |
      Set the default password inactivity period for new accounts to 30 days and apply the same value to existing accounts that have a password.

      useradd -D -f 30
      useradd -D | grep INACTIVE
      chage --inactive 30 USER

      30 days satisfies every supported release; some releases also accept up to 45 days.
  - id: "CIS-RHEL8-5.4.1.5-inactive_users"
    name: "inactive users: grep -E ^[^:]+:[^\\!*] /etc/shadow | grep -vw root | cut -d : -f1,7"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E ^[^:]+:[^\!*] /etc/shadow | grep -vw root | cut -d : -f1,7
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ./" }
    rationale: &rat-c4a4e8be14 |
      Accounts whose password has expired but which remain usable indefinitely are a common foothold for attackers because nobody notices their misuse. Setting a password inactivity period on every account with a password ensures that such accounts are disabled automatically after expiry.
    remediation: &rem-4e712889d3 |
      Set a password inactivity period of 30 days or less on every account that has a password, in particular on each account reported by the check.

      awk -F: '($2 ~ /^\$/) {print $1, $7}' /etc/shadow
      chage --inactive 30 USER

      Set the default for new accounts as well with useradd -D -f 30.
  - id: "CIS-RHEL8-5.4.1.6-passwd_chg_past"
    name: "No user has a last password change date in the future"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.6. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      now=$(date +%s)
      for usr in $(cut -d: -f1 /etc/shadow); do
        d=$(chage --list "$usr" 2>/dev/null | awk -F': ' '/^Last password change/ {print $2}')
        case "$d" in ""|never|*"must be changed"*) continue ;; esac
        t=$(date -d "$d" +%s 2>/dev/null) || { echo "$usr: cannot parse last password change '$d'"; continue; }
        if [ "$t" -gt "$now" ]; then echo "$usr: last password change $d is in the future"; fi
      done
    expect: empty
    rationale: &rat-eae9c8e6b4 |
      If the recorded date of the last password change lies in the future, password ageing does not work: the password never expires and the user cannot be forced to change it. Such dates usually result from a wrong system clock or manual edits and should be corrected.
    remediation: &rem-8950b282e3 |
      Check the system clock, then set the last password change of every listed user to today, or expire the password so it must be changed at the next login:

      chage --lastday "$(date +%Y-%m-%d)" USER
      chage --lastday 0 USER
  - id: "CIS-RHEL8-5.4.2.1-uid_0_check"
    name: "uid 0 check: awk -F: '($3 == 0) { print $1 }' /etc/passwd"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.2.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3 == 0) { print $1 }' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root" }
      - { none: "~ [^root]" }
    rationale: &rat-90d4d66c1b |
      Any account with UID 0 has full root privileges, regardless of its name. Additional UID 0 accounts are a classic backdoor and make it impossible to attribute administrative actions; only root should have UID 0.
    remediation: &rem-5c4a8fc9e4 |
      Make sure that only root has UID 0. Find out what every other UID 0 account is used for, then give it a unique non-zero UID with vipw or remove it.

      awk -F: '($3 == 0) {print $1}' /etc/passwd
      vipw
      userdel USER

      usermod -u cannot be used here because the running root processes share UID 0. Also make sure that root itself has UID 0.
  - id: "CIS-RHEL8-5.4.2.2-gid_0_check"
    name: "gid 0 check: awk -F: '($1 !~ /^(sync|shutdown|halt|operator)/ \u0026\u0026 $4=='0') {print $1\":\"$4}' /etc/passwd"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.2.2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($1 !~ /^(sync|shutdown|halt|operator)/ && $4=='0') {print $1":"$4}' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root" }
      - { some: "~ [^root]" }
    rationale: &rat-86032dcad6 |
      Group ID 0 is the root group, which owns many sensitive files and directories. Any other account with primary group 0 can read or modify those resources with root-group rights, far beyond its role. Only root should have GID 0 as primary group, which keeps root-group access deliberate and auditable.
    remediation: &rem-d5614bed37 |
      Give every account reported by the check a different primary group and make sure root itself has primary group 0.

      usermod -g GROUP USER
      usermod -g 0 root

      Afterwards review files the account created with group 0: find / -xdev -user USER -group 0
  - id: "CIS-RHEL8-5.4.2.3-group_root_only_0"
    name: "group root only 0: awk -F: '$3=='0'{print $1\":\"$3}' /etc/group"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.2.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '$3=='0'{print $1":"$3}' /etc/group
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root:0" }
    rationale: &rat-e6e96aa117 |
      GID 0 is the root group, which owns many sensitive system files and directories. Any other group with GID 0 silently gives its members the same group access as root. Ensuring that only the group named root has GID 0 prevents such hidden privilege.
    remediation: &rem-481abd2b91 |
      Make sure the group root has GID 0 and give every other group that the check reports with GID 0 its own unused GID, or remove it if it is not needed.

      awk -F: '$3 == 0' /etc/group
      groupmod -g NEWGID GROUP

      Files keep GID 0 and therefore stay owned by the group root. Review the members of GROUP before changing it. If root itself does not have GID 0, fix it with groupmod -g 0 root after the other groups are moved.
  - id: "CIS-RHEL8-5.4.2.4-root_passwd_set"
    name: "root passwd set: passwd -S root | awk '$2 ~ /^P/ {print \"OK Password\"}'"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.2.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      passwd -S root | awk '$2 ~ /^P/ {print "OK Password"}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK Password" }
    rationale: &rat-dc1e5c0dc5 |
      If root has no password, anyone with local access, for example through the console or single-user mode, can become root without authentication. A set password, or a locked root account where administrators use sudo, ensures that root access requires a credential.
    remediation: &rem-c94fa31bf9 |
      Set a strong password for root.

      passwd root

      Where the check also accepts a locked account (status L), passwd -l root is an alternative if administrators use sudo.
  - id: "CIS-RHEL8-5.4.2.5-root_path_check"
    name: "root path check: /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.2.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e 's/:/\n/g'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ \\\\." }
    rationale: &rat-ee503b897e |
      If root's PATH contains the current directory, empty entries, relative paths or directories that other users can write to, a malicious program placed there can be executed with root privileges when an administrator types a common command name. Root's PATH should contain only absolute, root-owned and non-writable directories.
    remediation: &rem-0afab9f1f3 |
      Remove the current directory (.), empty entries (leading, trailing or double colons), relative paths and non-existent directories from root's PATH, and make sure every remaining directory is owned by root and not writable by group or others. Look for PATH assignments in root's and the system-wide shell startup files.

      su - root -c 'echo "$PATH"'
      grep -sn 'PATH' /root/.bash_profile /root/.bashrc /root/.profile /etc/profile /etc/bashrc /etc/bash.bashrc /etc/environment /etc/profile.d/*.sh
      chown root DIRECTORY
      chmod go-w DIRECTORY
  - id: "CIS-RHEL8-5.4.2.6-root_umask_bash_profile"
    name: "root umask bash profile: grep -i umask /root/.bash_profile /root/.bashrc"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.2.6. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i umask /root/.bash_profile /root/.bashrc
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*:umask 00(2|7)7" }
    rationale: &rat-623cb7f319 |
      The umask determines the permissions of files root creates. With a permissive umask, configuration files, scripts or logs written by root can end up readable or writable by other users, leaking secrets or allowing tampering. Setting umask 027 or 077 in root's shell startup files keeps new files private by default.
    remediation: &rem-25f34f55b9 |
      Add umask 0027 (or 0077) at the start of a line in both /root/.bashrc and /root/.bash_profile. If /root/.bash_profile does not exist yet, create it so that it still loads /root/.profile.

      echo 'umask 0027' >> /root/.bashrc
      [ -e /root/.bash_profile ] || echo '[ -f ~/.profile ] && . ~/.profile' > /root/.bash_profile
      echo 'umask 0027' >> /root/.bash_profile

      Several variants fail when one of the files is missing, and the line must not be indented. Debian 13 reads /root/.profile instead of /root/.bash_profile; add the line there as well (echo 'umask 0027' >> /root/.profile).
  - id: "CIS-RHEL8-5.4.2.7-secure_system_accts"
    name: "secure system accts: awk -F: '$3\u003c1000' /etc/passwd | grep -Ev 'root|sync|halt|shutdown|nfsnobody|/sbin/nologin…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.2.7. NIST SP 800-53 Rev. 5: AC-2(5), AC-3, AC-11, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '$3<1000' /etc/passwd | grep -Ev 'root|sync|halt|shutdown|nfsnobody|/sbin/nologin|/bin/false'
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-6f6bd67ce7 |
      System and service accounts do not need an interactive shell. If one of them has a valid login shell, a weakness in a service or a misconfigured password can give an attacker an interactive session under that account. Setting the shell to nologin prevents this.
    remediation: &rem-3badb6c42f |
      Set the login shell of every system account reported by the check to /sbin/nologin.

      awk -F: '($3 < 1000) {print $1, $7}' /etc/passwd
      usermod -s /sbin/nologin USER

      Accounts root, sync, shutdown and halt are exempt. Make sure no service needs an interactive shell for the account before changing it.
  - id: "CIS-RHEL8-5.4.2.8-user_accts_valid_shell"
    name: "user accts valid shell: l_valid_shells=\"^($(awk -F\\/ '$NF != \"nologin\" {print}' /etc/shells | sed -rn '/^\\//{s,/,…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.2.8. NIST SP 800-53 Rev. 5: AC-2(5), AC-3, AC-11, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      l_valid_shells="^($(awk -F\/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\\\/,g;p}' | paste -s -d '|' - ))$"
      awk -v pat="$l_valid_shells" -F: '($1 != "root" && $(NF) !~ pat) {print $1}' /etc/passwd | while IFS= read -r l_user; do
          passwd -S "$l_user" | awk '$2 !~ /^L/ {print "Account: \"" $1 "\" does not have a valid login shell and is not locked"}'
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-b29d01d31a |
      Accounts without a valid login shell, such as service accounts with nologin, are not meant for interactive use. If their password is not locked they may still be usable for authentication through services that do not check the shell, for example FTP, su with a command or some PAM-based applications. Locking these accounts closes that path.
    remediation: &rem-bcf185911a |
      Each listed account has no valid login shell but an unlocked password. Lock the password of each listed USER:

      usermod -L USER

      If the account is actually meant for interactive logins, give it a valid shell from /etc/shells instead (usermod -s /bin/bash USER).
  - id: "CIS-RHEL8-5.4.3.1-nologin_not_in_shells-attrs"
    name: "/etc/shells: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/shells'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1371eb889f |
      /etc/shells lists valid login shells. Some services, such as FTP daemons or chsh, allow access only for accounts with a shell listed there. If nologin is listed, accounts that are meant to be blocked may be treated as having a valid shell and gain access through such services.
    remediation: &rem-fa056f672c |
      Create /etc/shells.
  - id: "CIS-RHEL8-5.4.3.1-nologin_not_in_shells-content"
    name: "/etc/shells has the expected content (1 rule)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/shells'
    allow_rc: any
    expect: { none: "~ .*nologin" }
    rationale: *rat-1371eb889f
    remediation: &rem-852b96f5ad |
      Edit /etc/shells so that its lines meet these conditions (regular expressions):

      - no line matches .*nologin
  - id: "CIS-RHEL8-5.4.3.2-check_timeout"
    name: "check timeout: grep TMOUT /etc/profile.d/*.sh /etc/profile /etc/profile.d/*.sh| cut -d \":\" -f2"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.3.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep TMOUT /etc/profile.d/*.sh /etc/profile /etc/profile.d/*.sh| cut -d ":" -f2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(readonly |)TMOUT" }
      - { some: "~ TMOUT=([1-8][0-9]{0,2}|900)$" }
      - { some: "~ export TMOUT" }
    rationale: &rat-e92d54c805 |
      An interactive shell left open on an unattended terminal can be used by anyone passing by. TMOUT makes the shell exit automatically after a period of inactivity. Marking it readonly and exporting it prevents users from disabling the timeout in their own session; long-running interactive work may need to account for it.
    remediation: &rem-d216d7a191 |
      Set an idle timeout of 900 seconds or less in a profile script and make it readonly and exported.

      printf '%s\n' 'TMOUT=900' 'readonly TMOUT' 'export TMOUT' > /etc/profile.d/50-tmout.sh

      Remove other TMOUT settings with larger or zero values from /etc/profile, /etc/bashrc and /etc/profile.d. The timeout applies to new login shells.
  - id: "CIS-RHEL8-5.4.3.3-umask_profile_scripts"
    name: "umask profile scripts: grep -i \"^\\s*umask\" /etc/profile /etc/profile.d/*.sh /etc/login.defs | cut -d \":\" -f 2"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.3.3. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i "^\s*umask" /etc/profile /etc/profile.d/*.sh /etc/login.defs | cut -d ":" -f 2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)umask\\s+(0?)0[2-7][7]" }
      - { none: "~ (?i)umask\\s+[7][0-1][0-6]" }
    rationale: &rat-0e0a7af57b |
      The umask set in shell profile scripts determines the permissions of files that users create. A permissive umask such as 022 makes new files readable by everyone, which can expose sensitive data. A system-wide umask of 027 or stricter removes access for other users by default.
    remediation: &rem-5bcc36ecf9 |
      Set a system-wide umask of 0027 in a profile script.

      echo 'umask 0027' > /etc/profile.d/50-umask.sh
      grep -n umask /etc/profile /etc/bashrc /etc/profile.d/*.sh
      sed -ri 's/^(\s*umask\s+)0?0[02]2\s*$/\10027/' /etc/profile /etc/bashrc

      On Amazon Linux the check inspects every umask line in /etc/profile, /etc/bashrc and /etc/profile.d, so weaker values such as 002 and 022 there must be raised as well (the sed command does this for the default lines; review the grep output for others).
  - id: "CIS-RHEL8-6.1.1-aide_installed"
    name: "Package aide is installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.1.1. NIST SP 800-53 Rev. 5: AU-2, SI-6."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet aide
    expect: true
    rationale: &rat-d0fb4e491d |
      AIDE records checksums and attributes of important files in a database and later reports files that were added, removed or changed. Having it installed is the basis for detecting unauthorized modifications such as backdoored binaries or altered configuration.
    remediation: &rem-ddff504fa6 |
      Install the package aide:

      dnf install aide
  - id: "CIS-RHEL8-6.1.2-aide_cron"
    name: "aide cron: grep -rs aide /etc/cron.* /etc/crontab /var/spool/cron/*"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.1.2. NIST SP 800-53 Rev. 5: AU-2, CM-3."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -rs aide /etc/cron.* /etc/crontab /var/spool/cron/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { none: "~ ^#" }
    rationale: &rat-86b8cfeaea |
      A file integrity baseline is only useful if it is compared regularly. Scheduling AIDE checks ensures that unexpected changes to system files are reported automatically instead of remaining unnoticed until someone runs the check by hand.
    remediation: &rem-586580ed0b |
      Schedule a regular AIDE check with cron, for example daily in /etc/cron.d, after the AIDE database has been initialised (aide --init and moving aide.db.new.gz to aide.db.gz).

      echo '0 5 * * * root /usr/sbin/aide --check' > /etc/cron.d/aide
      chmod 0644 /etc/cron.d/aide

      A systemd timer would work as well, but this check only looks at cron files.
  - id: "CIS-RHEL8-6.1.3-audit_bins_crypto_aide"
    name: "audit bins crypto aide: grep /sbin/au /etc/aide.conf"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.1.3."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep /sbin/au /etc/aide.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ /sbin/auditctl p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/auditd p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/ausearch p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/aureport p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/autrace p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/augenrules p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
    rationale: &rat-362fec1225 |
      The audit tools (auditctl, auditd, ausearch, aureport, augenrules and related binaries) control and read the audit trail. An attacker who replaces them could hide activity or silently disable auditing. Including them in the AIDE database with permission, ownership, ACL, extended attribute and SHA-512 checks makes any modification of these binaries detectable.
    remediation: &rem-87c2bcf979 |
      Add AIDE rules for the audit tools to /etc/aide.conf, then rebuild the AIDE database so it includes them.

      cat >> /etc/aide.conf <<'EOF'
      /usr/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512
      EOF
      aide --init
      mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz

      On Amazon Linux 2027 the check expects /usr/bin/ paths (auditctl, auditd, ausearch, aureport, augenrules) with nothing after sha512 on the line; use those paths there.
  - id: "CIS-RHEL8-6.2.1.1.5-storage_journald_conf"
    name: "storage journald conf: grep -i storage /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.1.1.5. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i storage /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ (?i)^.*:Storage=persistent" }
    rationale: &rat-cda501aacd |
      With volatile or automatic storage, journald may keep logs only in /run, so they are lost at every reboot, including the events that led up to a crash or compromise. Storage=persistent writes the journal to /var/log/journal so the history survives restarts.
    remediation: &rem-ca3d937c53 |
      Set Storage=persistent in /etc/systemd/journald.conf (the Amazon Linux 2023 check reads only that file) and in a drop-in (the RHEL checks fail if /etc/systemd/journald.conf.d/ is empty), then restart journald.

      sed -i 's/^#\?\s*Storage\s*=.*/Storage=persistent/' /etc/systemd/journald.conf
      grep -q '^Storage=persistent' /etc/systemd/journald.conf || echo 'Storage=persistent' >> /etc/systemd/journald.conf
      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nStorage=persistent\n' > /etc/systemd/journald.conf.d/60-storage.conf
      systemctl restart systemd-journald
  - id: "CIS-RHEL8-6.2.1.1.6-compress_journald_conf"
    name: "compress journald conf: grep -i compress /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.1.1.6. NIST SP 800-53 Rev. 5: AU-4."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i compress /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ (?i)^.*:Compress\\s*=\\s*yes" }
      - { none: "~ (?i)^.*:Compress\\s*=\\s*no" }
    rationale: &rat-fc8701ed62 |
      Compressing large journal entries reduces the disk space the persistent journal needs, so more history fits within the configured limits and the log partition is less likely to fill. Running out of log space leads to lost records or service problems.
    remediation: &rem-50e753a726 |
      Set Compress=yes in /etc/systemd/journald.conf (the Amazon Linux 2023 check reads only that file) and in a drop-in (the RHEL checks fail if /etc/systemd/journald.conf.d/ is empty), then restart journald.

      sed -i 's/^#\?\s*Compress\s*=.*/Compress=yes/' /etc/systemd/journald.conf
      grep -q '^Compress=yes' /etc/systemd/journald.conf || echo 'Compress=yes' >> /etc/systemd/journald.conf
      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nCompress=yes\n' > /etc/systemd/journald.conf.d/60-compress.conf
      systemctl restart systemd-journald
  - id: "CIS-RHEL8-6.2.2.1-rsyslog"
    name: "Package rsyslog is installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.2.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet rsyslog
    expect: true
    rationale: &rat-ec4e2f2832 |
      rsyslog collects log messages from the kernel, services and applications, writes them to files and can forward them to a central log server. Without an installed, enabled and running syslog daemon, security-relevant events are not recorded in a durable way and incidents cannot be investigated.
    remediation: &rem-9fc091c437 |
      Install the package rsyslog:

      dnf install rsyslog
  - id: "CIS-RHEL8-6.2.2.2-rsyslog-enabled"
    name: "Service rsyslog is enabled"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.2.2. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState rsyslog | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-ec4e2f2832
    remediation: &rem-092ce033e4 |
      Enable the service rsyslog:

      systemctl enable rsyslog
  - id: "CIS-RHEL8-6.2.2.2-rsyslog-running"
    name: "Service rsyslog is running"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.2.2. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState rsyslog | cut -d= -f2
    expect: "== active"
    rationale: *rat-ec4e2f2832
    remediation: &rem-e1b56d94f4 |
      Start the service rsyslog:

      systemctl start rsyslog
  - id: "CIS-RHEL8-6.2.2.3-forward_journald_conf"
    name: "forward journald conf: grep -ris '^\\s*ForwardToSyslog' /etc/systemd/journald.conf /etc/systemd/journald.conf.d/"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.2.3. NIST SP 800-53 Rev. 5: AC-3, AU-2, AU-4, AU-12, MP-2."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -ris '^\s*ForwardToSyslog' /etc/systemd/journald.conf /etc/systemd/journald.conf.d/
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ (?i)^.*:ForwardToSyslog\\s*=\\s*yes" }
      - { none: "~ (?i)^.*:ForwardToSyslog\\s*=\\s*no" }
    rationale: &rat-62b6840396 |
      Logs must flow through exactly one well-defined path. Where rsyslog is the log processor (RHEL), journald must forward messages to it with ForwardToSyslog=yes so they reach the syslog files and remote collectors. Where journald alone handles logging (the Amazon Linux 2023 variant), forwarding is expected to be left unset to avoid duplicate or unintended processing.
    remediation: &rem-2851c29856 |
      On RHEL, configure journald to forward messages to rsyslog in a drop-in and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nForwardToSyslog=yes\n' > /etc/systemd/journald.conf.d/60-forward.conf
      systemctl restart systemd-journald

      On Amazon Linux 2023 the check expects the opposite: comment out any active ForwardToSyslog line in /etc/systemd/journald.conf (sed -i 's/^\s*ForwardToSyslog/#ForwardToSyslog/' /etc/systemd/journald.conf) and restart journald.
  - id: "CIS-RHEL8-6.2.2.4-perms_rsyslog_d"
    name: "perms rsyslog d: grep -s ^\\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf | cut -f2 -d:"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.2.4. NIST SP 800-53 Rev. 5: AC-3, AC-6, MP-2."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -s ^\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf | cut -f2 -d:
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ \\$FileCreateMode 06[0-4]0" }
      - { none: "~ \\$FileCreateMode 06[6-7][0-7]" }
    rationale: &rat-2b2fc7d019 |
      Log files often contain sensitive information such as user names, host names and error details. Setting $FileCreateMode to 0640 or stricter ensures that log files created by rsyslog are not readable or writable by arbitrary users, who could otherwise gather information or tamper with evidence.
    remediation: &rem-aa234ce03e |
      Make rsyslog create log files with mode 0640 by setting $FileCreateMode in a drop-in file that is read before the logging rules, and change every other $FileCreateMode line to 0640 as well.

      grep -n 'FileCreateMode' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      echo '$FileCreateMode 0640' > /etc/rsyslog.d/00-filecreatemode.conf
      systemctl restart rsyslog

      The mode applies to files created after the restart; correct existing log files separately.
  - id: "CIS-RHEL8-6.2.2.5-etc_rsyslog.conf-attrs"
    name: "/etc/rsyslog.conf: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.2.5. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/rsyslog.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-863f7605c9 |
      rsyslog only records what its rules tell it to. Rules that route emergency, authentication, mail, news, cron, warning, critical and local facility messages into dedicated files make sure that security-relevant events are recorded and can be found quickly during an investigation. A restrictive file creation mode keeps the resulting log files from being readable by other users.
    remediation: &rem-d45052d244 |
      Create /etc/rsyslog.conf.
  - id: "CIS-RHEL8-6.2.2.5-etc_rsyslog.conf-content"
    name: "/etc/rsyslog.conf has the expected content (13 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.2.5. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/rsyslog.conf'
    allow_rc: any
    expect:
      - { some: "~ ^\\*.emerg\\s+:omusrmsg:\\*" }
      - { some: "~ auth,authpriv.\\*\\s+/var/log/secure" }
      - { some: "~ ^mail.\\*\\s+-/var/log/mail" }
      - { some: "~ ^mail.info\\s+-/var/log/mail.info" }
      - { some: "~ ^mail.err\\s+/var/log/mail.err" }
      - { some: "~ ^cron.\\*\\s+/var/log/cron" }
      - { some: "~ ^*.=warning;\\*.=err\\s+-/var/log/warn" }
      - { some: "~ ^*.crit\\s+/var/log/warn" }
      - { some: "~ ^*.*;mail.none;news.none\\s+/var/log/messages" }
      - { some: "~ ^local0,local1.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local2,local3.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local4,local5.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local6,local7.\\*\\s+-/var/log/localmessages" }
    rationale: *rat-863f7605c9
    remediation: &rem-ec6fb086eb |
      Edit /etc/rsyslog.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\*.emerg\s+:omusrmsg:\*
      - a line matches auth,authpriv.\*\s+/var/log/secure
      - a line matches ^mail.\*\s+-/var/log/mail
      - a line matches ^mail.info\s+-/var/log/mail.info
      - a line matches ^mail.err\s+/var/log/mail.err
      - a line matches ^cron.\*\s+/var/log/cron
      - a line matches ^*.=warning;\*.=err\s+-/var/log/warn
      - a line matches ^*.crit\s+/var/log/warn
      - a line matches ^*.*;mail.none;news.none\s+/var/log/messages
      - a line matches ^local0,local1.\*\s+-/var/log/localmessages
      - a line matches ^local2,local3.\*\s+-/var/log/localmessages
      - a line matches ^local4,local5.\*\s+-/var/log/localmessages
      - a line matches ^local6,local7.\*\s+-/var/log/localmessages
  - id: "CIS-RHEL8-6.2.2.7-local_syslog_input"
    name: "local syslog input: grep -E \"imtcp\\\" port|InputTCPServerRun\" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.2.7. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12, CM-6."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "imtcp\" port|InputTCPServerRun" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -v ":#"
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-46d6ea0433 |
      rsyslog can accept log messages from other hosts over TCP. On a system that is not a designated log server, such a listener opens an unneeded network port and lets anyone who can reach it inject forged log entries or fill the disk.
    remediation: &rem-30523f0cee |
      Remove the TCP input definitions from the rsyslog configuration, or comment them out with # as the first character of the line, then restart rsyslog.

      grep -En 'imtcp" port|InputTCPServerRun' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      systemctl restart rsyslog

      Lines to disable look like input(type="imtcp" port="514") or $InputTCPServerRun 514. Keep them only on dedicated log servers.
  - id: "CIS-RHEL8-6.2.2.7-local_syslog_module"
    name: "local syslog module: grep \"imtcp\" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -Ev \":#|port=\""
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.2.7. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12, CM-6."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "imtcp" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -Ev ":#|port="
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-035740240e |
      Loading rsyslog's imtcp module is the first step to accepting log messages from the network. On a system that is not a designated log server the module is not needed, and leaving it loaded makes it easy to open a listener by accident. Not loading it keeps the host from receiving remote log data.
    remediation: &rem-2c410b4533 |
      Remove the lines that load the imtcp module, or comment them out with # as the first character of the line, then restart rsyslog.

      grep -n 'imtcp' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      systemctl restart rsyslog

      Lines to disable look like module(load="imtcp") or $ModLoad imtcp. The check ignores a commented line only if the # is at the very start.
  - id: "CIS-RHEL8-6.2.2.8-rsyslog_logrotate"
    name: "rsyslog logrotate: echo \"Manual\""
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.2.8. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Manual" }
    rationale: &rat-17eb210ea2 |
      Log files that are never rotated grow until they fill the file system, which can stop logging or crash services, while overly aggressive rotation discards records needed for investigations. A logrotate policy for the rsyslog files that matches the site's retention requirements keeps logs available for the required period without exhausting disk space.
    remediation: &rem-648542e71a |
      Review the logrotate configuration for the files rsyslog writes (/etc/logrotate.d/rsyslog, or /etc/logrotate.d/syslog on older Red Hat releases) and adjust frequency, number of rotations and compression to the site's retention policy.

      cat /etc/logrotate.d/rsyslog
      logrotate -d /etc/logrotate.d/rsyslog

      Typical settings in the file's block are weekly, rotate 4, compress, missingok and notifempty. Most variants of this check are manual reminders that report a failure until the review is accepted.
  - id: "CIS-RHEL8-6.2.3.1-logfile_configured_login_files"
    name: "logfile configured login files: find /var/log/ -type f -perm /g+x,o+wx -exec ls -l \"{}\" + | grep -E \"[b,u,w]tmp.*|lastllo…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.3.1. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /var/log/ -type f -perm /g+x,o+wx -exec ls -l "{}" + | grep -E "[b,u,w]tmp.*|lastllog"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-ba3523cf36 |
      The login record files wtmp, btmp, utmp and lastlog show who logged in when and from where, and btmp often contains passwords typed into the user name field. If others can write them, login history can be forged or erased; execute bits make no sense on them. The check flags such files with group execute or other write/execute permission.
    remediation: &rem-9b204ad015 |
      Remove group execute and other write and execute permission from each listed file:

      chmod g-x,o-wx FILE

      If a logrotate rule (create directive in /etc/logrotate.d/) or a tmpfiles.d entry recreates the file with wider permissions, correct it there as well.
  - id: "CIS-RHEL8-6.2.3.1-logfile_configured_sssd"
    name: "logfile configured sssd: find /var/log/ -type f -perm /g+x,o+rwx -exec ls -l \"{}\" + | grep -Ei \"ssd|gdm\""
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.3.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /var/log/ -type f -perm /g+x,o+rwx -exec ls -l "{}" + | grep -Ei "ssd|gdm"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-a4cd263071 |
      SSSD and GDM log files record authentication events, user names and directory lookups. Readable or writable by other users they leak account information or can be tampered with to hide activity. The check flags such files with group execute or any permission for others.
    remediation: &rem-3d2c8061ad |
      Remove group execute and all permissions for others from each listed file:

      chmod g-x,o-rwx FILE

      If the creating service or logrotate configuration sets wider permissions, correct it there as well.
  - id: "CIS-RHEL8-6.2.3.1-logfile_configured_syslog_logs"
    name: "logfile configured syslog logs: find /var/log/ -type f -perm /g+wx,o+wx -exec ls -l \"{}\" + | grep -E \"auth|secure|syslog|…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.2.3.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /var/log/ -type f -perm /g+wx,o+wx -exec ls -l "{}" + | grep -E "auth|secure|syslog|messages|journal|auth"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-6dd23cf4ee |
      System and authentication logs (messages, secure, auth, syslog, journal files) are primary evidence for incident investigations. If group members or other users can write to them, entries can be forged or deleted. The check flags such files with group or other write or execute permission.
    remediation: &rem-d817daf3c8 |
      Remove group and other write and execute permission from each listed file:

      chmod g-wx,o-wx FILE

      If the logging daemon or logrotate recreates the file with wider permissions, adjust its file creation mode (for rsyslog $FileCreateMode, for logrotate the create directive) as well.
  - id: "CIS-RHEL8-6.3.1.1-audit"
    name: "Package audit is installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.3.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12, SI-5."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      rpm -q --quiet audit
    expect: true
    rationale: &rat-5d5d992283 |
      The Linux audit framework records security-relevant events such as logins, privilege use, file access and configuration changes in a tamper-resistant trail. Without the audit user-space tools (audit on RPM systems, auditd on Debian and Ubuntu), these events cannot be collected, which makes detecting and investigating incidents far harder.
    remediation: &rem-1518bbb26a |
      Install the package audit:

      dnf install audit
  - id: "CIS-RHEL8-6.3.1.1-audit-libs"
    name: "Package audit-libs is installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.3.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12, SI-5."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      rpm -q --quiet audit-libs
    expect: true
    rationale: &rat-5f843a11e3 |
      audit-libs provides the libraries through which PAM, sshd, sudo and other programs send audit events to the kernel. If it is missing, those components cannot emit their user-space audit records, leaving gaps in the audit trail.
    remediation: &rem-e352b7f843 |
      Install the package audit-libs:

      dnf install audit-libs
  - id: "CIS-RHEL8-6.3.1.2-audit_default_grub"
    name: "audit default grub: grep audit= /etc/default/grub"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.3.1.2. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep audit= /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX=.*\\saudit=1.*" }
    rationale: &rat-20bfb20320 |
      Processes started before auditd are not audited unless the kernel enables auditing at boot. With audit=1 on the kernel command line, every process gets an audit context from the start, so early activity, including possible tampering during boot, is recorded. Keeping the parameter in /etc/default/grub ensures it survives configuration regeneration and new kernels.
    remediation: &rem-c9246ec31c |
      Add audit=1 to GRUB_CMDLINE_LINUX in /etc/default/grub (append it, not as the first word) and to all existing boot entries.

      grep -q '^GRUB_CMDLINE_LINUX=.*audit=1' /etc/default/grub || sed -ri 's/^(GRUB_CMDLINE_LINUX="[^"]*)"/\1 audit=1"/' /etc/default/grub
      grubby --update-kernel ALL --args 'audit=1'

      The change takes effect after a reboot. Remove conflicting values (e.g. audit=0) from the line if present.
  - id: "CIS-RHEL8-6.3.1.2-grubby_audit_1"
    name: "grubby audit 1: grubby --info=ALL | grep -Po 'audit=1'"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.3.1.2. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grubby --info=ALL | grep -Po 'audit=1'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^audit=1" }
    rationale: &rat-a6b8efd8b9 |
      On systems using boot loader entries managed by grubby, the kernel command line of each entry decides whether auditing is enabled at boot. If audit=1 is missing, processes started before auditd escape auditing. Checking the configured entries confirms the setting actually reaches the kernel.
    remediation: &rem-dc65031034 |
      Add audit=1 to the kernel arguments of all boot entries.

      grubby --update-kernel ALL --args 'audit=1'

      The change takes effect after a reboot. Also add it to GRUB_CMDLINE_LINUX in /etc/default/grub so new kernels inherit it.
  - id: "CIS-RHEL8-6.3.1.3-audit_backlog_default_grub"
    name: "audit backlog default grub: grep audit_backlog /etc/default/grub"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.3.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep audit_backlog /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX=.*\\saudit_backlog_limit=(8192|819[3-9]|8[2-9]{,2}|9[0-9]{3,9}|[1-9]{5,9}).*" }
    rationale: &rat-6f061b7300 |
      During boot, audit events are queued in the kernel until auditd starts. If the backlog buffer is too small, events are lost or the kernel may react according to the failure setting. A backlog limit of at least 8192 gives enough room to keep early events. Keeping it in /etc/default/grub ensures it persists.
    remediation: &rem-20a27f4695 |
      Add audit_backlog_limit=8192 to GRUB_CMDLINE_LINUX in /etc/default/grub (append it, not as the first word) and to all existing boot entries.

      grep -q '^GRUB_CMDLINE_LINUX=.*audit_backlog_limit=8192' /etc/default/grub || sed -ri 's/^(GRUB_CMDLINE_LINUX="[^"]*)"/\1 audit_backlog_limit=8192"/' /etc/default/grub
      grubby --update-kernel ALL --args 'audit_backlog_limit=8192'

      The change takes effect after a reboot. Remove conflicting values (e.g. a smaller audit_backlog_limit) from the line if present.
  - id: "CIS-RHEL8-6.3.1.4-auditd-enabled"
    name: "Service auditd is enabled"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.3.1.4. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p UnitFileState auditd | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-f809f26f23 |
      auditd is the daemon that receives audit events from the kernel and writes them to disk. If it is not installed, enabled and running, audit rules have no effect on the persistent trail, and security events go unrecorded.
    remediation: &rem-5d15604058 |
      Enable the service auditd:

      systemctl enable auditd
  - id: "CIS-RHEL8-6.3.1.4-auditd-running"
    name: "Service auditd is running"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.3.1.4. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p ActiveState auditd | cut -d= -f2
    expect: "== active"
    rationale: *rat-f809f26f23
    remediation: &rem-ce273a00c5 |
      Start the service auditd:

      systemctl start auditd
  - id: "CIS-RHEL8-6.3.2.1-max_log_auditd_conf"
    name: "max log auditd conf: grep max_log_file /etc/audit/auditd.conf"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.3.2.1. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep max_log_file /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^max_log_file = \\d\\d+" }
    rationale: &rat-3aaf4ad791 |
      max_log_file defines the size at which an audit log file is rotated. A deliberate size, together with the rotation action, controls how much audit history is kept and prevents single log files from becoming unmanageable or rotating too often to preserve evidence.
    remediation: &rem-6c2bac235c |
      Set max_log_file (size in MB) in /etc/audit/auditd.conf to a value that fits the site policy, e.g. 32.

      sed -ri 's/^\s*max_log_file\s*=.*/max_log_file = 32/' /etc/audit/auditd.conf
      grep -q '^max_log_file = ' /etc/audit/auditd.conf || echo 'max_log_file = 32' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      SIGHUP makes auditd reread its configuration. Most variants require the exact format 'max_log_file = NN' with at least two digits.
  - id: "CIS-RHEL8-6.3.2.2-max_log_action_auditd_conf"
    name: "max log action auditd conf: grep max_log_file_action /etc/audit/auditd.conf"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.3.2.2. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep max_log_file_action /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ max_log_file_action = keep_logs" }
    rationale: &rat-2c8c6634dd |
      When an audit log reaches its maximum size, the default action rotates and eventually deletes old logs, losing audit history. keep_logs rotates without deleting, so no audit records are discarded automatically. Disk usage must then be monitored, because logs accumulate until archived.
    remediation: &rem-604d9d4f57 |
      Set max_log_file_action to keep_logs in /etc/audit/auditd.conf.

      sed -ri 's/^\s*max_log_file_action\s*=.*/max_log_file_action = keep_logs/' /etc/audit/auditd.conf
      grep -q '^max_log_file_action = ' /etc/audit/auditd.conf || echo 'max_log_file_action = keep_logs' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      SIGHUP makes auditd reread its configuration. Archive old audit logs regularly to avoid filling the disk.
  - id: "CIS-RHEL8-6.3.2.3-logs_full_auditd_conf"
    name: "logs full auditd conf: grep -E \"disk.*action\" /etc/audit/auditd.conf"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.3.2.3. NIST SP 800-53 Rev. 5: AU-5."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E "disk.*action" /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ disk_full_action\\s*=\\s*(halt|single)" }
      - { some: "~ disk_error_action\\s*=\\s*(syslog|halt|single)" }
    rationale: &rat-70577f0aa7 |
      If the audit log partition fills up or a disk error occurs, auditing can silently stop and later actions go unrecorded. Halting or switching to single-user mode on a full disk, and at least reporting disk errors, guarantees that the system does not keep running without an audit trail. The trade-off is reduced availability, so audit storage must be sized and monitored.
    remediation: &rem-e2c732cb3a |
      Set disk_full_action to single (or halt) and disk_error_action to syslog, single or halt in /etc/audit/auditd.conf.

      sed -ri 's/^\s*disk_full_action\s*=.*/disk_full_action = single/' /etc/audit/auditd.conf
      grep -q '^disk_full_action = ' /etc/audit/auditd.conf || echo 'disk_full_action = single' >> /etc/audit/auditd.conf
      sed -ri 's/^\s*disk_error_action\s*=.*/disk_error_action = syslog/' /etc/audit/auditd.conf
      grep -q '^disk_error_action = ' /etc/audit/auditd.conf || echo 'disk_error_action = syslog' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      SIGHUP makes auditd reread its configuration. A full audit partition will then take the system out of normal operation.
  - id: "CIS-RHEL8-6.3.2.4-logs_low_space_auditd_conf"
    name: "logs low space auditd conf: grep space_left_action /etc/audit/auditd.conf"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.3.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-8, AU-12, SI-5."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep space_left_action /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ space_left_action\\s*=\\s*(email|exec|single|halt)" }
      - { some: "~ admin_space_left_action\\s*=\\s*(halt|single)" }
    rationale: &rat-35cb8a9517 |
      Low disk space on the audit partition is the warning sign before audit records are lost. Notifying administrators when space_left is reached, and switching to single-user mode or halting at admin_space_left, ensures someone reacts before auditing fails. Halting affects availability, so monitoring and capacity planning matter.
    remediation: &rem-63eb66207c |
      Set space_left_action to email (or exec, single, halt) and admin_space_left_action to single (or halt) in /etc/audit/auditd.conf.

      sed -ri 's/^\s*space_left_action\s*=.*/space_left_action = email/' /etc/audit/auditd.conf
      grep -q '^space_left_action = ' /etc/audit/auditd.conf || echo 'space_left_action = email' >> /etc/audit/auditd.conf
      sed -ri 's/^\s*admin_space_left_action\s*=.*/admin_space_left_action = single/' /etc/audit/auditd.conf
      grep -q '^admin_space_left_action = ' /etc/audit/auditd.conf || echo 'admin_space_left_action = single' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      email needs a working local mail transfer agent and action_mail_acct; SIGHUP makes auditd reread its configuration.
  - id: "CIS-RHEL8-6.3.3.1-auditd_admin_scope_cnf"
    name: "auditd admin scope cnf: grep scope /etc/audit/rules.d/*.rules"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.3.3.1. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep scope /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*rules:-w /etc/sudoers -p wa -k scope" }
      - { some: "~ ^.*rules:-w /etc/sudoers.d/ -p wa -k scope" }
    rationale: &rat-7172c39fee |
      Changes to /etc/sudoers and /etc/sudoers.d alter who may run which commands with elevated privileges. Audit rules that record every write or attribute change to these files make unauthorised privilege grants detectable. This check verifies that the rules are part of the persistent audit configuration.
    remediation: &rem-944b9ef9b6 |
      Watch the sudoers configuration for changes: add the rules for your release to /etc/audit/rules.d/50-scope.rules and load them.

      Amazon Linux 2, RHEL 7 and RHEL 8:
      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d/ -p wa -k scope

      Amazon Linux 2023 and RHEL 9:
      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d -p wa -k scope

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
  - id: "CIS-RHEL8-6.3.3.1-auditd_admin_scope_live"
