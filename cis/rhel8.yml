      /var/log/audit holds the audit trail, which never needs device files, privileged programs or executables. With nodev the kernel ignores character and block device files on it, so a device node created there cannot be used to access disks, memory or other hardware directly; legitimate device files live only under /dev. This check verifies the option on the currently mounted file system.
    remediation: &rem-8a3ae6bd16 |
      Mount /var/log/audit with the option nodev: add it to the options of /var/log/audit in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/var/log/audit'

      If /var/log/audit is not a separate file system yet, create one first.
  - id: "CIS-RHEL8-1.1.2.7.2-var_log_audit_fstab_nodev_options-attrs"
    name: "/etc/fstab: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.1.2.7.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/fstab'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-3f4668cf7a |
      Device files on /var/log/audit, a location that should only hold audit logs, would let someone who can create or place them access hardware directly and bypass the permissions on the real device nodes in /dev. Mounting it with nodev makes the kernel ignore device files there. The check verifies that the option is set persistently in /etc/fstab.
    remediation: *rem-8ee214ccd7
