    remediation: &rem-cf94b4c8a5 |
      Remove the package rsync-daemon, unless the system needs it:

      dnf remove rsync-daemon
  - id: "CIS-RHEL8-2.1.14-samba_pkg"
    name: "Package samba is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.1.14. NIST SP 800-53 Rev. 5: CM-6, CM-7."
