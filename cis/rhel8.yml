  - id: "CIS-RHEL8-2.1.1-autofs_pkg"
    name: "Package autofs is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.1.1. NIST SP 800-53 Rev. 5: SI-3, MP-7."
    tags: [cis, cis-rhel8, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet autofs
    expect: false
    rationale: &rat-66cc7255f3 |
      autofs mounts file systems automatically when they are accessed, including removable media and network shares. That makes it easier to introduce untrusted media and adds a privileged daemon. Systems that do not rely on automounted network shares or home directories should not have it installed.
    remediation: &rem-dfff09bb4b |
      Remove the package autofs, unless the system needs it:

      dnf remove autofs
  - id: "CIS-RHEL8-2.1.2-avahi_pkg"
    name: "Package avahi is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.1.2. NIST SP 800-53 Rev. 5: SI-4."
