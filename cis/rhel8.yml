    run: |
      rpm -q --quiet bind
    expect: false
    rationale: &rat-e524956514 |
      A DNS server is a complex network-facing service with a history of serious vulnerabilities. Systems that are not designated name servers should not have it installed, which removes that exposure and the risk of the host being abused for DNS amplification attacks.
    remediation: &rem-c6b14ce780 |
      Remove the package bind, unless the system needs it:

      dnf remove bind
  - id: "CIS-RHEL8-2.1.6-dnsmasq_pkg"
    name: "Package dnsmasq is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.1.6. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet dnsmasq
    expect: false
    rationale: &rat-6976005192 |
      dnsmasq combines a DNS forwarder with DHCP and TFTP servers. Unless the system needs it, for example for local virtualization networking, it is an unnecessary network-facing service that adds attack surface.
    remediation: &rem-04fb283cf6 |
      Remove the package dnsmasq, unless the system needs it:

      dnf remove dnsmasq
  - id: "CIS-RHEL8-2.1.7-ftp_pkg"
    name: "Package vsftp is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.1.7. NIST SP 800-53 Rev. 5: CM-7."
