      chown root:root '/etc/at.allow'
      chmod u-xs,g-wxs,o-rwx,a-t '/etc/at.allow'
  - id: "CIS-RHEL8-2.4.2.1-at_deny_users-absent"
    name: "/etc/at.deny does not exist"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.4.2.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      test -e '/etc/at.deny' || test -L '/etc/at.deny'
    expect: false
    rationale: &rat-58fb23d85e |
      When /etc/at.deny is used, every account not explicitly listed may schedule at jobs, so new accounts are allowed by default. Removing at.deny and relying on at.allow restricts the at scheduler to explicitly authorised users.
    remediation: &rem-d7950be1a0 |
      Remove /etc/at.deny, unless the system needs it:

      rm '/etc/at.deny'
  - id: "CIS-RHEL8-3.1.1-ipv6_required"
    name: "ipv6 required: if [ `grep 0 /proc/sys/net/ipv6/conf/all/disable_ipv6` ] || [ `grep 0 /proc/sys/net/ipv6/…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      if [ `grep 0 /proc/sys/net/ipv6/conf/all/disable_ipv6` ] || [ `grep 0 /proc/sys/net/ipv6/conf/default/disable_ipv6` ] || [ `cat /sys/module/ipv6/parameters/disable` == 0 ]; \
      then \
      echo 'ipv6_enabled'; \
      else echo 'fail'; \
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ipv6_enabled" }
    rationale: &rat-3f8cc1703a |
      The status of IPv6 should be a deliberate decision: when it is enabled it must be covered by firewall rules and network configuration just like IPv4, and when it is disabled that should be intended. This check expects IPv6 to be enabled, so a deliberately disabled IPv6 stack shows up as a finding that needs a documented exception.
    remediation: &rem-6d9676347a |
      If IPv6 is meant to be enabled, remove the settings that disable it. Find disable_ipv6 lines in the sysctl configuration, delete those that set 1, remove the kernel argument and re-enable IPv6 at runtime:

      grep -rs disable_ipv6 /etc/sysctl.conf /etc/sysctl.d/
      grubby --update-kernel=ALL --remove-args=ipv6.disable=1
      sysctl -w net.ipv6.conf.all.disable_ipv6=0
      sysctl -w net.ipv6.conf.default.disable_ipv6=0

      A removed ipv6.disable=1 kernel argument takes effect after a reboot. If IPv6 is disabled on purpose, document it as an accepted exception instead.
  - id: "CIS-RHEL8-3.1.2-wireless_disabled"
    name: "wireless disabled: nmcli radio all | tail -1"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.1.2. NIST SP 800-53 Rev. 5: AC-18."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      nmcli radio all | tail -1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(enabled|disabled|missing)\\s\\s(disabled)\\s\\s(enabled|disabled|missing)\\s\\s(disabled)" }
    rationale: &rat-0d79aa42e1 |
      Wireless interfaces open a network path that bypasses wired network controls such as firewalls and segmentation, and they expose the system to attackers within radio range. Servers rarely need them; turning off the radios or blocking their drivers removes this exposure.
    remediation: &rem-e8753abb57 |
      Turn off all Wi-Fi and WWAN radios with NetworkManager. The setting persists across reboots.

      nmcli radio all off
      nmcli radio all
  - id: "CIS-RHEL8-3.1.3-bluetooth_pkg"
    name: "Package bluez is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.1.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet bluez
    expect: false
    rationale: &rat-26028fd092 |
      Bluetooth gives devices in radio range a way to connect to the system and has a history of remotely exploitable vulnerabilities. Servers rarely need it, so removing the BlueZ stack removes this wireless attack surface.
    remediation: &rem-be2e8a23b3 |
      Remove the package bluez, unless the system needs it:

      dnf remove bluez
  - id: "CIS-RHEL8-3.2.1-lsmod_atm"
    name: "lsmod atm: lsmod | grep -i atm"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.2.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i atm
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-09db9f0366 |
      ATM (Asynchronous Transfer Mode) networking is obsolete on virtually all systems, yet its protocol module can be loaded on demand when a program opens an ATM socket, exposing rarely maintained kernel code to attackers. Preventing the module from loading removes this unnecessary attack surface.
    remediation: &rem-dfc0094ba7 |
      Prevent the atm module from being loaded and unload it if it is currently loaded.

      printf '%s\n' 'blacklist atm' 'install atm /bin/false' > /etc/modprobe.d/atm.conf
      modprobe -r atm

      lsmod | grep -i atm matches any module name containing "atm"; review the output before unloading anything else.
  - id: "CIS-RHEL8-3.2.1-modprobe_atm"
    name: "modprobe atm: modprobe -n -v atm"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.2.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v atm
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /bin/(true|false)" }
    rationale: *rat-09db9f0366
    remediation: &rem-71b37645c4 |
      Prevent the atm module from being loaded and unload it if it is currently loaded.

      printf '%s\n' 'blacklist atm' 'install atm /bin/false' > /etc/modprobe.d/atm.conf
      modprobe -r atm

      The check expects exactly /bin/false or /bin/true.
  - id: "CIS-RHEL8-3.2.2-lsmod_cat"
    name: "lsmod cat: lsmod | grep -i can"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.2.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i can
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-c62a5a183c |
      The CAN (Controller Area Network) protocol modules are used for vehicle and industrial buses and are not needed on ordinary servers. Any loadable protocol module adds kernel code reachable by local users, and rarely used network protocols have repeatedly contained exploitable bugs. The check verifies that no CAN module is loaded.
    remediation: &rem-0d9f16d958 |
      Prevent the can module from being loaded and unload it:

      printf '%s\n' 'install can /bin/false' 'blacklist can' > /etc/modprobe.d/can.conf
      lsmod | grep -i can
      modprobe -r MODULE

      Unload the CAN modules listed by lsmod (such as can_raw, can_bcm, can_gw, then can). The check matches 'can' anywhere in the lsmod output, so a module that merely contains these letters also fails it; review such hits.
  - id: "CIS-RHEL8-3.2.2-modprobe_can"
    name: "modprobe can: modprobe -n -v can"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.2.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v can
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /bin/(true|false)" }
    rationale: &rat-3d05bbfd9e |
      The Controller Area Network protocol is used in vehicles and industrial equipment and is not needed on typical servers or workstations. Its socket family can be loaded automatically when a program requests it, exposing additional kernel code that has had vulnerabilities. Disabling the can module removes this attack surface where no CAN interfaces are used.
    remediation: &rem-cf33684c1b |
      Prevent the can module from being loaded and unload it if it is currently loaded.

      printf '%s\n' 'blacklist can' 'install can /bin/false' > /etc/modprobe.d/can.conf
      modprobe -r can

      The check expects exactly /bin/false or /bin/true.
  - id: "CIS-RHEL8-3.2.3-lsmod_dccp"
    name: "lsmod dccp: lsmod | grep -i dccp"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.2.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i dccp
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-c5d39e1c4c |
      DCCP is a rarely used transport protocol whose kernel code has had serious vulnerabilities. Because unprivileged programs can trigger automatic loading of the module by opening a DCCP socket, an unused protocol still adds attack surface. The check verifies the module is not loaded.
    remediation: &rem-7463e2edd5 |
      Prevent the dccp module from loading and unload it if it is loaded.

      printf '%s\n' 'blacklist dccp' 'install dccp /bin/false' > /etc/modprobe.d/dccp.conf
      modprobe -r dccp

      If the module is in use, stop the application using it or reboot.
  - id: "CIS-RHEL8-3.2.3-modprobe_dccp"
    name: "modprobe dccp: modprobe -n -v dccp"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.2.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v dccp
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /bin/(true|false)" }
    rationale: &rat-41ef8e8fab |
      DCCP is a rarely used datagram transport protocol. Its kernel module has had several serious vulnerabilities that can be triggered by local users or from the network. Preventing the module from loading removes this attack surface on systems that do not use the protocol.
    remediation: &rem-66ee3312a3 |
      Keep the dccp module from being loaded: add an install override and a blacklist entry for it in /etc/modprobe.d/, then unload it if it is currently loaded.

      printf '%s\n' 'install dccp /bin/false' 'blacklist dccp' > /etc/modprobe.d/dccp.conf
      modprobe -r dccp

      modprobe -r reports an error if the module is not loaded, which is harmless; if sockets of this protocol are open, the module stays loaded until reboot.
  - id: "CIS-RHEL8-3.2.4-lsmod_RDS"
    name: "lsmod RDS: lsmod | grep -i rds"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.2.4. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
