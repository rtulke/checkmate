      Setuid and setgid programs placed on /tmp, a world-writable directory, could be used to gain the privileges of their owner. Mounting it with nosuid makes the kernel ignore these bits, so such files cannot escalate privileges. The check verifies that the option is set persistently in /etc/fstab.
