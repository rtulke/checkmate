    severity: medium
    run: |
      rpm -q --quiet avahi
    expect: false
    rationale: &rat-70b707d084 |
      Avahi implements mDNS/DNS-SD zero-configuration networking, advertising and discovering services on the local network. Servers rarely need it; it runs a listening network daemon and discloses information about the host. Removing it reduces attack surface.
    remediation: &rem-0691bdc571 |
      Remove the package avahi, unless the system needs it:

      dnf remove avahi
  - id: "CIS-RHEL8-2.1.3-cockpit_pkg"
