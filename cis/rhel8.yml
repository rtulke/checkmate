  - id: "CIS-RHEL8-5.3.3.3.1-pwhistory_pam"
    name: "pwhistory pam: grep -Pi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwhistory\\.so\\h+([^#\\n\\…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.3.3.3.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Pi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwhistory\.so\h+([^#\n\ r]+\h+)?remember=(2[0-3]|1[0-9]|[0-9])\b' /etc/pam.d/system-auth /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-d24e8fa8b2 |
      A remember value set directly on the pam_pwhistory line overrides pwhistory.conf. A value below 24 lets users return to an earlier password too soon, undermining forced password changes. The check flags such low values in system-auth and password-auth.
    remediation: &rem-a119585bdb |
      Remove remember= arguments below 24 from the pam_pwhistory lines and configure the history in /etc/security/pwhistory.conf instead. On authselect-managed systems edit the custom profile and apply it.

      grep -P 'pam_pwhistory\.so.*remember=' /etc/pam.d/system-auth /etc/pam.d/password-auth
      sed -ri '/pam_pwhistory\.so/s/\s+remember=[0-9]+//' /etc/authselect/custom/PROFILE/system-auth /etc/authselect/custom/PROFILE/password-auth
      authselect apply-changes
      grep -q '^remember' /etc/security/pwhistory.conf || echo 'remember = 24' >> /etc/security/pwhistory.conf

      Without authselect, apply the sed command to /etc/pam.d/system-auth and /etc/pam.d/password-auth directly.
