    expect: false
    rationale: &rat-2f661ac1b7 |
      cockpit-ws provides the Cockpit web console, a browser-based administration interface listening on the network. Every additional management interface widens the attack surface and offers another place to try credentials. Systems that are administered by other means should not have it installed.
    remediation: &rem-f6323bdaa9 |
      Remove the package cockpit-ws, unless the system needs it:

      dnf remove cockpit-ws
  - id: "CIS-RHEL8-2.1.4-dhcp_pkg"
    name: "Package dhcp-server is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.1.4. NIST SP 800-53 Rev. 5: CM-7."
