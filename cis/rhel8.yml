    severity: medium
    run: |
      rpm -q --quiet telnet
    expect: false
    rationale: &rat-f8caf76499 |
      The telnet client uses an unencrypted protocol, exposing credentials when used to log in to remote systems. Removing it prevents accidental insecure logins; SSH replaces it.
    remediation: &rem-3edcbf8297 |
      Remove the package telnet, unless the system needs it:

      dnf remove telnet
  - id: "CIS-RHEL8-2.2.5-tftp_client"
