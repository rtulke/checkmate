      - { none: "~ (?i)^gssapiauthentication yes" }
    rationale: &rat-04dcf46ac5 |
      GSSAPI authentication is used for Kerberos single sign-on. When it is not needed, it adds code and complexity to the authentication path and an additional mechanism that has to be secured and monitored. Disabling it reduces the attack surface of the SSH server; hosts that rely on Kerberos logins are a legitimate exception.
