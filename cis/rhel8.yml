  - id: "CIS-RHEL8-1.1.2.7.4-var_log_audit_noexec_options"
    name: "/var/log/audit is a separate mount with noexec"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.1.2.7.4. NIST SP 800-53 Rev. 5: AC-3, MP-2, CM-7."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/var/log/audit'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]noexec(,|$)"
    rationale: &rat-23ae1cc3c2 |
      /var/log/audit holds the audit trail, which never needs device files, privileged programs or executables. With noexec, programs cannot be executed directly from it, which blocks the common attack step of dropping a tool or exploit into a writable directory and running it. Scripts started through an interpreter are not stopped, and some installers may need adjusting. This check verifies the option on the currently mounted file system.
    remediation: &rem-bedda3ff14 |
      Mount /var/log/audit with the option noexec: add it to the options of /var/log/audit in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/var/log/audit'

      If /var/log/audit is not a separate file system yet, create one first.
  - id: "CIS-RHEL8-1.1.2.7.4-var_log_audit_fstab_noexec_options-attrs"
    name: "/etc/fstab: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.1.2.7.4. NIST SP 800-53 Rev. 5: AC-3, MP-2, CM-7."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/fstab'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ae7b4de4ad |
      /var/log/audit is a location that should only hold audit logs and does not need to hold executable programs. Mounting it with noexec prevents binaries dropped there from being executed directly, which hinders many attack tools and malware droppers; scripts can still be run through an interpreter. The check verifies that the option is set persistently in /etc/fstab.
    remediation: *rem-8ee214ccd7
  - id: "CIS-RHEL8-1.1.2.7.4-var_log_audit_fstab_noexec_options-content"
    name: "/etc/fstab has the expected content (1 rule)"
