  - id: "CIS-RHEL8-4.1.1-firewalld"
    name: "Package firewalld is installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 4.1.1. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-rhel8, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet firewalld
    expect: true
    rationale: &rat-9a34f07397 |
      A host-based firewall limits which network services are reachable even if a service is accidentally exposed or a perimeter firewall is misconfigured. firewalld must be installed, enabled at boot and running for its zone rules to be enforced, and on newer releases it should use the nftables backend rather than the deprecated iptables backend.
    remediation: &rem-d7f44118ed |
      Install the package firewalld:

      dnf install firewalld
  - id: "CIS-RHEL8-4.1.2-firewalld-attrs"
    name: "/etc/firewalld/firewalld.conf: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 4.1.2. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-rhel8, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/firewalld/firewalld.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: *rat-9a34f07397
    remediation: &rem-86233836e4 |
      Create /etc/firewalld/firewalld.conf.
  - id: "CIS-RHEL8-4.1.2-firewalld-content"
    name: "/etc/firewalld/firewalld.conf has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 4.1.2. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-rhel8, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/firewalld/firewalld.conf'
    allow_rc: any
    expect:
      - { some: "~ ^FirewallBackend\\s*=\\s*nftables" }
      - { none: "~ ^FirewallBackend\\s*=\\s*iptables" }
    rationale: *rat-9a34f07397
    remediation: &rem-a715af1107 |
      Edit /etc/firewalld/firewalld.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^FirewallBackend\s*=\s*nftables
      - no line matches ^FirewallBackend\s*=\s*iptables
  - id: "CIS-RHEL8-4.1.3-firewalld-enabled"
    name: "Service firewalld.service is enabled"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState firewalld.service | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-9a34f07397
    remediation: &rem-b6dc534789 |
      Enable the service firewalld.service:

      systemctl enable firewalld.service
  - id: "CIS-RHEL8-4.1.3-firewalld-running"
    name: "Service firewalld.service is running"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState firewalld.service | cut -d= -f2
    expect: "== active"
    rationale: *rat-9a34f07397
    remediation: &rem-4c91451d43 |
      Start the service firewalld.service:

      systemctl start firewalld.service
  - id: "CIS-RHEL8-4.1.4-active_firewalld"
    name: "active firewalld: for fw in `firewall-cmd --get-active-zones | grep -P -B 4  'interfaces: (?!lo|virbr)' | h…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 4.1.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      for fw in `firewall-cmd --get-active-zones | grep -P -B 4  'interfaces: (?!lo|virbr)' | head -n 1 | cut -d ' ' -f1`; do firewall-cmd --permanent --zone=$fw --get-target; done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ (?i)ACCEPT" }
      - { some: "~ (?i)(default|drop|reject)" }
    rationale: &rat-3ac92f34c9 |
      In firewalld the zone target decides what happens to traffic that no rule allows. A zone with target ACCEPT on the main network interface lets everything through and effectively disables the firewall. The default, DROP or REJECT targets enforce a deny-by-default policy.
    remediation: &rem-753afef86e |
      Make sure the active zone of the main network interface uses the default, DROP or REJECT target. Find the zone, set its target and reload:

      firewall-cmd --get-active-zones
      firewall-cmd --permanent --zone=ZONE --set-target=default
      firewall-cmd --reload

      Alternatively move the interface to a restrictive zone (firewall-cmd --permanent --zone=public --change-interface=IFACE). Allow required services such as ssh in that zone first, or remote access is cut off.
  - id: "CIS-RHEL8-4.1.5-loopback_traffic_firewalld"
    name: "loopback traffic firewalld: firewall-cmd --list-all --zone=\"$(firewall-cmd --get-zone-of-interface=lo | xargs)\" | gre…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 4.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      firewall-cmd --list-all --zone="$(firewall-cmd --get-zone-of-interface=lo | xargs)" | grep -B 1 target
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ trusted \\(active\\)" }
      - { some: "~ (trusted|public) \\(active\\)" }
      - { some: "~ target: ACCEPT" }
    rationale: &rat-eb3d8c4b56 |
      Local services communicate over the loopback interface, and blocking it breaks them in hard-to-diagnose ways. Binding lo to the trusted zone, whose target is ACCEPT, makes the firewall explicitly allow loopback traffic while other interfaces keep restrictive zones.
    remediation: &rem-b77d414ec9 |
      Bind the loopback interface to the trusted zone and reload firewalld:

      firewall-cmd --permanent --zone=trusted --change-interface=lo
      firewall-cmd --reload

      Do not put any other interface into the trusted zone, as its target ACCEPT allows all traffic.
  - id: "CIS-RHEL8-4.1.6-loopback_firewalld"
    name: "loopback firewalld: for zone in $(firewall-cmd --get-zone-of-interface=lo); do"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 4.1.6. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      for zone in $(firewall-cmd --get-zone-of-interface=lo); do
      echo " - Zone: $zone"
      firewall-cmd --zone="$zone" --list-rich-rules | awk '/(::1|127\.0\.0\.1)\b/{print}'
      done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*" }
    rationale: &rat-ea9ea0254f |
      Packets that claim a loopback source address (127.0.0.1 or ::1) but arrive from elsewhere are spoofed and may be used to reach services that trust local connections. Rich rules that drop such traffic complement the acceptance of real loopback traffic. The check lists the loopback-related rich rules of the zone that holds lo for review.
    remediation: &rem-8103bdbdd9 |
      Bind lo to the trusted zone and add rich rules that drop traffic with a loopback source address that is not destined to loopback, then reload:

      firewall-cmd --permanent --zone=trusted --change-interface=lo
      firewall-cmd --permanent --zone=trusted --add-rich-rule='rule family=ipv4 source address="127.0.0.1" destination not address="127.0.0.1" drop'
      firewall-cmd --permanent --zone=trusted --add-rich-rule='rule family=ipv6 source address="::1" destination not address="::1" drop'
      firewall-cmd --reload
  - id: "CIS-RHEL8-4.1.7-firewall_drop_unncessary_ports_manual"
    name: "firewall drop unncessary ports manual: echo \"Manual test\""
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 4.1.7. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual test"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Manual test" }
    rationale: &rat-90809a00fd |
      Every port the firewall allows is a path into the system. Services that were opened for testing or are no longer used remain reachable until removed from the firewall configuration. Regularly reviewing the allowed services and ports ensures that only those required by the system's role are open.
    remediation: &rem-629ba92304 |
      Review the services and ports allowed in each active firewalld zone and remove those the system does not need.

      firewall-cmd --get-active-zones
      firewall-cmd --list-all --zone=ZONE
      firewall-cmd --permanent --zone=ZONE --remove-service=SERVICE
      firewall-cmd --permanent --zone=ZONE --remove-port=PORT/PROTOCOL
      firewall-cmd --reload

      This is a manual check that always reports a failure for review.
  - id: "CIS-RHEL8-5.1.1-sshd_crypto_policy-attrs"
    name: "/etc/sysconfig/sshd: exists, owner root, group root"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/sysconfig/sshd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-6bd1f6d0ce |
      On RHEL, sshd normally takes its algorithms from the system-wide crypto policy. A CRYPTO_POLICY line in /etc/sysconfig/sshd overrides that and can silently re-enable weak ciphers or MACs. The file must also be owned by root so that others cannot inject such overrides.
    remediation: &rem-9b55a20b7a |
      Create /etc/sysconfig/sshd if it is missing, then set owner root and group root:

      chown root:root '/etc/sysconfig/sshd'
  - id: "CIS-RHEL8-5.1.1-sshd_crypto_policy-content"
    name: "/etc/sysconfig/sshd has the expected content (1 rule)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/sysconfig/sshd'
    allow_rc: any
    expect: { none: "~ (?i)^crypto_policy.*" }
    rationale: *rat-6bd1f6d0ce
    remediation: &rem-82ee153d98 |
      Edit /etc/sysconfig/sshd so that its lines meet these conditions (regular expressions):

      - no line matches (?i)^crypto_policy.*
  - id: "CIS-RHEL8-5.1.2-sshd_config_perms-attrs"
    name: "/etc/ssh/sshd_config: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-fc2827314f |
      sshd_config controls who may log in remotely and how. If unprivileged users could modify it they could enable root login or weaken authentication, and read access reveals details of the security configuration. It should be owned by root and accessible only by root.
    remediation: &rem-714a840007 |
      Create /etc/ssh/sshd_config if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/ssh/sshd_config'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/ssh/sshd_config'
  - id: "CIS-RHEL8-5.1.3-sysconfig_sshd_config-attrs"
    name: "/etc/sysconfig/sshd: exists, mode 0640 or stricter, owner root, group root"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/sysconfig/sshd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7137)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-3961f7db4b |
      /etc/sysconfig/sshd supplies options and environment to the SSH daemon. If others can write it, they can change how sshd starts, for example by overriding its crypto policy. Restricting ownership to root and the mode to 0640 or stricter prevents such tampering.
    remediation: &rem-40af539b36 |
      Create /etc/sysconfig/sshd if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-rwx,a-t:

      chown root:root '/etc/sysconfig/sshd'
      chmod u-xs,g-wxs,o-rwx,a-t '/etc/sysconfig/sshd'
  - id: "CIS-RHEL8-5.1.4-etc_ssh_ssh_host_prv_key_group"
    name: "/etc/ssh/ssh host prv key group: groupkeys=$(sudo find /etc/ssh/ -name *_key -type f ! \\(-group root -o ! -group ssh_keys …"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.4. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      groupkeys=$(sudo find /etc/ssh/ -name *_key -type f ! \(-group root -o ! -group ssh_keys \) ); echo $groupkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-5ef33206e2 |
      SSH host private keys prove the server's identity to clients. Anyone who can read a host key can impersonate the server and intercept sessions in a man-in-the-middle attack. Keeping the key files in the root group (or the dedicated ssh_keys group on Red Hat systems) ensures that any group read permission does not extend to ordinary users.
    remediation: &rem-369ef6a077 |
      Change the group of each private host key reported by the check to root.

      chgrp root FILE

      On RHEL 9 the group ssh_keys is also accepted by the check.
  - id: "CIS-RHEL8-5.1.4-etc_ssh_ssh_host_prv_key_perms"
    name: "/etc/ssh/ssh host prv key perms: keyperms=$(sudo find /etc/ssh/ -name *_key -type f -perm /137 ); echo $keyperms"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.4. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      keyperms=$(sudo find /etc/ssh/ -name *_key -type f -perm /137 ); echo $keyperms
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-7f190524e0 |
      A host private key that other users can read or modify lets them impersonate the SSH server or replace its identity, which enables interception of administrator sessions. Restricting the files to owner read and write keeps the key usable only by sshd. OpenSSH also ignores private keys with overly open permissions, so tight modes avoid unexpected start-up failures.
    remediation: &rem-6abc4b4be2 |
      Remove execute, group write/execute and all permissions for others from each private host key reported by the check. Mode 0600 satisfies every variant.

      chmod 0600 FILE

      Debian 13, and Debian 11 and Ubuntu 22.04/24.04 for keys in the root group, do not accept group read, so do not use 0640 there.
  - id: "CIS-RHEL8-5.1.4-etc_ssh_ssh_host_prv_key_user"
    name: "/etc/ssh/ssh host prv key user: userkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -user root ! \\( -group root -o -grou…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.4. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      userkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -user root ! \( -group root -o -group ssh_keys \) ); echo $userkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-fbdc35f7c9 |
      If a host private key is owned by an account other than root, that account can read, alter or replace the server's identity key, allowing impersonation of the server or a denial of service. Root ownership ensures that only administrators control the key material.
    remediation: &rem-3a33d707b3 |
      Make root the owner of each private host key reported by the check.

      chown root FILE
  - id: "CIS-RHEL8-5.1.5-etc_ssh_ssh_host_pub_key_group"
    name: "/etc/ssh/ssh host pub key group: groupkeys=$(sudo find /etc/ssh/ -name *_key.pub -type f ! -group root ); echo $groupkeys"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.5. NIST SP 800-53 Rev. 5: AC-3, CM-6, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      groupkeys=$(sudo find /etc/ssh/ -name *_key.pub -type f ! -group root ); echo $groupkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-7b474e6437 |
      Public host keys are not secret, but they represent the server's identity that clients verify and that key management or monitoring relies on. If a non-root group can modify them, local users could replace the published key material. Root group ownership keeps changes to the server identity limited to administrators.
    remediation: &rem-4bb93212a2 |
      Change the group of each public host key reported by the check to root.

      chgrp root FILE
  - id: "CIS-RHEL8-5.1.5-etc_ssh_ssh_host_pub_key_perms"
    name: "/etc/ssh/ssh host pub key perms: keysperm=$(sudo find /etc/ssh/ -name *_key.pub -type f -perm /133 ); echo $keyperms"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.5. NIST SP 800-53 Rev. 5: AC-3, CM-6, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      keysperm=$(sudo find /etc/ssh/ -name *_key.pub -type f -perm /133 ); echo $keyperms
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-33bc1e4eae |
      Public host keys may be world-readable, but write access for group or others would let local users replace them, and the execute bit serves no purpose. Limiting them to mode 0644 or stricter ensures that only root can change the server's published identity.
    remediation: &rem-78675bfedc |
      Remove execute and group/other write permissions from each public host key reported by the check (mode 0644 or stricter).

      chmod u-x,go-wx FILE
  - id: "CIS-RHEL8-5.1.5-etc_ssh_ssh_host_pub_key_user"
    name: "/etc/ssh/ssh host pub key user: userkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -user root ! -group root ); echo $us…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.5. NIST SP 800-53 Rev. 5: AC-3, CM-6, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      userkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -user root ! -group root ); echo $userkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-e69d03c157 |
      If a public host key is owned by a non-root account, that user can replace it and mislead or disrupt clients that verify the server's identity. Root ownership keeps the published host identity under administrative control.
    remediation: &rem-35eb98c235 |
      Make root the owner of each public host key reported by the check.

      chown root FILE
  - id: "CIS-RHEL8-5.1.6-sshd_access_limited"
    name: "sshd access limited: grep -Ei \"^(Allow|Deny)(Users|Groups)\" /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.6. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "^(Allow|Deny)(Users|Groups)" /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ (?i)(||denyusers nobody| )" }
    rationale: &rat-8e5700f652 |
      Restricting SSH logins to explicitly allowed users or groups ensures that only accounts with a need for remote access can log in, even if other accounts have valid credentials or weak passwords. It limits the impact of compromised, forgotten or service accounts.
    remediation: &rem-eb1a516d02 |
      Restrict SSH logins to the users or groups that need them with AllowUsers, AllowGroups, DenyUsers or DenyGroups, according to site policy. Insert the directives at the top of /etc/ssh/sshd_config so they are in the global section and are read on every version, then validate and reload. The RHEL 10 check only recognises the exact entries AllowUsers vagrant or DenyUsers nobody, so the harmless DenyUsers nobody line is included for it.

      sed -i '1i DenyUsers nobody' /etc/ssh/sshd_config
      sed -i '1i AllowGroups GROUP' /etc/ssh/sshd_config
      sshd -t
      systemctl reload sshd

      Make sure your own administrative account is allowed before reloading.
  - id: "CIS-RHEL8-5.1.7-sshd_banner-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.7. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d96adb0e0c |
      A login banner shown before authentication informs users that access is restricted and monitored, which supports legal action against misuse. Using /etc/issue.net keeps the text in one place, and the banner should not reveal operating system or version details.
    remediation: &rem-f6392187bb |
      Create /etc/ssh/sshd_config.
  - id: "CIS-RHEL8-5.1.7-sshd_banner-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.7. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect:
      - { some: "~ ^Banner /etc/issue.net" }
      - { none: "~ ^Banner none" }
    rationale: *rat-d96adb0e0c
    remediation: &rem-04bc3fa781 |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches ^Banner /etc/issue.net
      - no line matches ^Banner none
  - id: "CIS-RHEL8-5.1.7-ssh_configd_banner"
    name: "ssh configd banner: grep -Eis '^\\s*Banner\\s+\"?none\\b'/etc/ssh/sshd_config.d/*.conf"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.7. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis '^\s*Banner\s+"?none\b'/etc/ssh/sshd_config.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-c8f1dd710c |
      A pre-authentication banner shows the organisation's legal notice to everyone who connects, which supports action against unauthorised access and informs users about monitoring. A drop-in file with Banner none silently overrides a banner set in the main configuration, because sshd uses the first value it reads. Checking the drop-ins prevents such an override from removing the warning.
    remediation: &rem-d80aaaa50c |
      Remove every Banner none line from the files in /etc/ssh/sshd_config.d/ and configure a banner file instead; put the site's authorised-use notice into /etc/issue.net.

      grep -Eil '^\s*Banner\s+"?none\b' /etc/ssh/sshd_config.d/*.conf
      echo 'Banner /etc/issue.net' > /etc/ssh/sshd_config.d/01-banner.conf
      sshd -t && systemctl reload sshd

      On RHEL 8, which does not read sshd_config.d by default, set Banner in /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-RHEL8-5.1.8-no_weak_ssh_ciphers"
    name: "no weak ssh ciphers: sshd -T | grep -Pi -- '^ciphers\\h+\\\"?([^#\\n\\r]+,)?((3des|aes(128|192|256))-cbc)\\b'"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.8. NIST SP 800-53 Rev. 5: AC-17, MA-4."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -Pi -- '^ciphers\h+\"?([^#\n\r]+,)?((3des|aes(128|192|256))-cbc)\b'
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ ." }
    rationale: &rat-77a6850889 |
      Ciphers such as 3DES, Blowfish, CAST128, RC4 (arcfour) and the CBC modes have known weaknesses that allow plaintext recovery or make traffic analysis easier. Offering them lets an attacker or an outdated client negotiate a weak session. Some variants also exclude chacha20-poly1305, which is affected by the Terrapin prefix truncation attack on unpatched peers.
    remediation: &rem-1c18fae547 |
      Remove the weak ciphers from the SSH server. On RHEL and Amazon Linux sshd takes its algorithms from the system crypto policy, so add a policy module that drops them, and remove or correct any explicit Ciphers line in /etc/ssh/sshd_config or /etc/ssh/sshd_config.d/*.conf that still lists CBC, arcfour or chacha20 ciphers.

      echo 'cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC -CHACHA20-POLY1305' > /etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod
      update-crypto-policies --set DEFAULT:NO-SSHWEAKCIPHERS
      systemctl restart sshd

      --set replaces the whole policy: keep the modules already in use (update-crypto-policies --show) and list all of them together, e.g. DEFAULT:NO-SHA1:NO-SSHWEAKCIPHERS:NO-SSHWEAKMACS.
  - id: "CIS-RHEL8-5.1.9-sshd_clientalive-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.9. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-3cc59b4363 |
      SSH connections whose client has crashed or lost the network can stay open indefinitely, holding resources and leaving a session that might be resumed or hijacked. ClientAliveInterval and ClientAliveCountMax make sshd send keepalive probes through the encrypted channel and disconnect when the client stops answering. This does not end sessions of an idle client that is still connected.
    remediation: *rem-f6392187bb
  - id: "CIS-RHEL8-5.1.9-sshd_clientalive-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.9. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect:
      - { some: "~ ^ClientAliveInterval ([1-9]|[1-9][0-9]|[1-8][0-9][0-9]|900)" }
      - { some: "~ ^ClientAliveCountMax [1-4]" }
    rationale: *rat-3cc59b4363
    remediation: &rem-c383108a76 |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches ^ClientAliveInterval ([1-9]|[1-9][0-9]|[1-8][0-9][0-9]|900)
      - a line matches ^ClientAliveCountMax [1-4]
  - id: "CIS-RHEL8-5.1.9-sshd_clientalive_live"
    name: "sshd clientalive live: sshd -T | grep -i '^clientalive'"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.9. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -i '^clientalive'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^(?i)clientaliveinterval ([1-9]|[1-9][0-9]|[1-8][0-9][0-9]|900)" }
      - { some: "~ ^(?i)ClientAliveCountMax [1-4]" }
    rationale: &rat-87e45da1d2 |
      Idle or abandoned SSH sessions remain open indefinitely and can be taken over at an unattended terminal; dead connections also keep resources allocated. ClientAliveInterval makes the server probe the client regularly and ClientAliveCountMax ends the session after a limited number of unanswered probes, so broken or unresponsive sessions are closed.
    remediation: &rem-2064d83c5c |
      Set a client alive interval of 900 seconds or less and a count of 1 to 4.

      printf '%s\n' 'ClientAliveInterval 15' 'ClientAliveCountMax 3' > /etc/ssh/sshd_config.d/00-clientalive.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any ClientAlive* line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-RHEL8-5.1.10-sshd_disable_forward-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.10. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-c606a28d0f |
      SSH forwarding (TCP port forwarding, X11, agent and stream local forwarding) lets users tunnel arbitrary traffic through the server, bypassing firewalls and network monitoring. DisableForwarding yes switches all of it off with one setting. Systems used as deliberate jump hosts may need an exception.
    remediation: *rem-f6392187bb
  - id: "CIS-RHEL8-5.1.10-sshd_disable_forward-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.10. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect:
      - { some: "~ ^(?i)disableforwarding yes" }
      - { none: "~ ^(?i)disableforwarding no" }
    rationale: *rat-c606a28d0f
    remediation: &rem-10a6fb9a49 |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches ^(?i)disableforwarding yes
      - no line matches ^(?i)disableforwarding no
  - id: "CIS-RHEL8-5.1.10-ssh_disable_forward_live"
    name: "ssh disable forward live: sshd -T | grep -i '^disableforwarding'"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.10. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -i '^disableforwarding'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ (?i)^disableforwarding yes" }
      - { none: "~ (?i)^disableforwarding no" }
    rationale: &rat-8b93e4836f |
      SSH forwarding (TCP port, agent, X11 and stream local forwarding) lets users tunnel arbitrary traffic through the server, bypassing firewalls and network monitoring, or expose their agent to a compromised host. DisableForwarding turns off all forwarding types at once. Systems where users legitimately need tunnels should handle this as a documented exception.
    remediation: &rem-e3a56c9870 |
      Disable all forwarding in the SSH server.

      echo 'DisableForwarding yes' > /etc/ssh/sshd_config.d/00-disableforwarding.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any DisableForwarding line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-RHEL8-5.1.11-sshd_gssapi-attrs"
    name: "/etc/ssh/sshd_config: exists"
