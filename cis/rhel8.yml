  - id: "CIS-RHEL8-6.3.3.3-modify_sudolog_cnf"
    name: "modify sudolog cnf: grep sudo_log /etc/audit/rules.d/*.rules"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.3.3.3. NIST SP 800-53 Rev. 5: NA. CIS Controls v8: 8.5."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep sudo_log /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*rules:-w /var/log/sudo.log -p wa -k sudo_log_file" }
    rationale: &rat-6bbfdbb8a0 |
      The sudo log records which privileged commands were run by whom. Auditing writes to this file reveals attempts to alter or truncate it to hide activity. This check verifies that the rule is part of the persistent audit configuration.
    remediation: &rem-890ea14005 |
      Watch the sudo log file for modifications: add the following rules to /etc/audit/rules.d/50-sudo.rules and load them.

      -w /var/log/sudo.log -p wa -k sudo_log_file

      augenrules --load

      The watched path has to match the logfile setting in the sudoers configuration (Defaults logfile="/var/log/sudo.log"). If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
