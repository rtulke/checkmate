  - id: "CIS-RHEL8-1.1.1.11-cve_fs"
    name: "cve fs: /var/fs_with_cves.sh"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.1.1.11. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      /var/fs_with_cves.sh
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*\u003c- CVE exists!" }
    rationale: &rat-30c0153fca |
      File system drivers parse complex on-disk structures and have repeatedly contained exploitable vulnerabilities. If such a module can be loaded, an attacker can trigger it, for example by mounting a crafted image or plugging in removable media, and gain kernel privileges. The helper script lists available file system modules with known CVEs so that unneeded ones can be disabled.
    remediation: &rem-e16dad28c1 |
      Run the helper script and review each file system module it marks with '<- CVE exists!'. Disable every flagged module the system does not need and unload it:

      /var/fs_with_cves.sh
      printf '%s\n' 'install MODULE /bin/false' 'blacklist MODULE' > /etc/modprobe.d/MODULE.conf
      modprobe -r MODULE

      /var/fs_with_cves.sh is installed by the Ansible Lockdown remediation role; if it is missing the check fails, so deploy it with the role or review the available file system modules manually.
  - id: "CIS-RHEL8-1.1.2.1.1-tmp_mount"
    name: "/tmp is a separate mount"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.1.2.1.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/tmp'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: &rat-701a51792c |
      /tmp is world-writable and used by every user and many services. A separate file system (or a tmpfs) keeps users from filling the root file system through /tmp and allows restrictive mount options such as nodev, nosuid and noexec to be applied to it alone.
    remediation: &rem-fbf7b93a5e |
      Put /tmp on a separate file system (partition or logical volume) and mount it there with an entry in /etc/fstab or a systemd mount unit. This needs a new file system and moving the existing data. A tmpfs mount on /tmp, e.g. with systemd's tmp.mount, counts as well.
  - id: "CIS-RHEL8-1.1.2.1.2-tmp_nodev_options"
    name: "/tmp is a separate mount with nodev"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.1.2.1.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/tmp'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nodev(,|$)"
    rationale: &rat-c7d3bae4ce |
      /tmp is world-writable and used by every user and service for temporary files. With nodev the kernel ignores character and block device files on it, so a device node created there cannot be used to access disks, memory or other hardware directly; legitimate device files live only under /dev. This check verifies the option on the currently mounted file system.
    remediation: &rem-1c21763bee |
      Mount /tmp with the option nodev: add it to the options of /tmp in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/tmp'

      If /tmp is not a separate file system yet, create one first.
