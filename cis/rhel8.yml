  - id: "CIS-RHEL8-5.3.3.2.3-minclass_pwquality"
    name: "minclass pwquality: grep -Psi -- '^\\h*(minclass|[dulo]credit)\\b' /etc/security/pwquality.conf /etc/security/p…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.3.3.2.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*(minclass|[dulo]credit)\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:(minclass\\s*=\\s*[2-9]|[dulo]credit\\s*=\\s*-1)" }
    rationale: &rat-fe27b1be2a |
      Requiring characters from several classes (digits, upper case, lower case, others) enlarges the search space for password guessing and prevents passwords made only of letters or digits. The check accepts either minclass or mandatory credits in pwquality.conf or its drop-in directory.
    remediation: &rem-7be52cecc4 |
      Require at least four character classes in a pwquality drop-in file, and remove conflicting minclass or credit settings from /etc/security/pwquality.conf.

      mkdir -p /etc/security/pwquality.conf.d
      printf '%s\n' 'minclass = 4' > /etc/security/pwquality.conf.d/50-pwcomplexity.conf

      The setting applies at the next password change.
  - id: "CIS-RHEL8-5.3.3.2.4-maxrepeat_pwquality-attrs"
