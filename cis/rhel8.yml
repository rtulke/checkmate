      A DHCP server hands out network configuration to clients. On a system that is not meant to be a DHCP server it is unnecessary attack surface, and if started by mistake it can disrupt the network by handing out wrong addresses or gateways.
    remediation: &rem-2c543d9bdb |
      Remove the package dhcp-server, unless the system needs it:

      dnf remove dhcp-server
  - id: "CIS-RHEL8-2.1.5-dns_pkg"
    name: "Package bind is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.1.5. NIST SP 800-53 Rev. 5: CM-7."
