  - id: "CIS-RHEL8-2.3.1-chrony_installed"
    name: "Package chrony is installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.3.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-rhel8, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet chrony
    expect: true
    rationale: &rat-c17942a508 |
      Accurate time is essential for correlating log entries across systems, for forensic timelines, and for protocols such as Kerberos and TLS certificate validation that fail or become exploitable when clocks drift. chrony keeps the system clock synchronized with reliable time sources.
    remediation: &rem-d6d7094cb8 |
      Install the package chrony:

      dnf install chrony
  - id: "CIS-RHEL8-2.3.2-chrony_servers_pools-attrs"
    name: "/etc/chrony.conf: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.3.2. NIST SP 800-53 Rev. 5: AU-3, AU-12."
