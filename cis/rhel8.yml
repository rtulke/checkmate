    severity: medium
    run: |
      f='/etc/chrony.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-6707a62018 |
      Accurate time is required for correlating logs, validating certificates and Kerberos authentication. chrony needs at least one server or pool directive to know which time sources to synchronize with; without one the clock drifts unnoticed.
    remediation: &rem-02262ccc8c |
