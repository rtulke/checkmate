  - id: "CIS-RHEL8-1.1.1.10-usb-storage_blacklist-attrs"
    name: "/etc/modprobe.d/blacklist.conf: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.1.1.10. NIST SP 800-53 Rev. 5: CM-7, IA-3."
