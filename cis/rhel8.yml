    run: |
      rpm -q --quiet gdm
    expect: false
    rationale: &rat-a68c65c551 |
      gdm is the GNOME display manager that provides a graphical login. Servers rarely need a graphical environment, which pulls in a large amount of software with its own vulnerabilities. Removing it reduces the attack surface; workstations that need a desktop are the exception.
    remediation: &rem-32e28b14ab |
      Remove the package gdm, unless the system needs it:

      dnf remove gdm
  - id: "CIS-RHEL8-2.1.22-xwindow_pkg"
