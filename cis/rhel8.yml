      Changes to /etc/sudoers and /etc/sudoers.d alter who may run which commands with elevated privileges. Audit rules that record every write or attribute change to these files make unauthorised privilege grants detectable. This check verifies that the rules are loaded in the running kernel.
    remediation: *rem-944b9ef9b6
  - id: "CIS-RHEL8-6.3.3.2-other_user_actions_cnf"
    name: "other user actions cnf: grep user_emu /etc/audit/rules.d/*.rules"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 6.3.3.2. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-rhel8, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep user_emu /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*rules:-a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation" }
      - { some: "~ ^.*rules:-a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation" }
    rationale: &rat-eea525b5f2 |
      When a user runs a program as another user, for example through sudo, the effective user ID differs from the real one. Auditing such executions makes actions performed under another identity traceable to the person who started them. This check verifies that the rules are part of the persistent audit configuration.
    remediation: &rem-c887750061 |
      Record commands that users run with the identity of another user (for example through sudo): add the following rules to /etc/audit/rules.d/50-user_emulation.rules and load them.

      -a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation
      -a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
