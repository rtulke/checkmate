      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-32375af6dc |
      By default faillock does not lock root, leaving the most valuable account open to unlimited guessing. even_deny_root extends the lockout to root, and root_unlock_time sets how long root stays locked, typically shorter so that console recovery remains possible.
