    severity: medium
    run: |
      rpm -q --quiet telnet-server
    expect: false
    rationale: &rat-e99e65cfc5 |
      A telnet server accepts logins over an unencrypted protocol, exposing credentials and session content to anyone who can observe the traffic. SSH replaces it; the server should not be installed.
    remediation: &rem-dca29d92b3 |
      Remove the package telnet-server, unless the system needs it:

      dnf remove telnet-server
  - id: "CIS-RHEL8-2.1.17-tftp_pkg"
    name: "Package tftpd-hpa is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.1.17. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet tftpd-hpa
    expect: false
    rationale: &rat-ec591b84d8 |
      TFTP transfers files without any authentication or encryption. A TFTP server is only needed on systems that provide network boot images or device configurations; elsewhere it should not be installed.
    remediation: &rem-58cbe98bea |
      Remove the package tftpd-hpa, unless the system needs it:

      dnf remove tftpd-hpa
  - id: "CIS-RHEL8-2.1.18-squid_pkg"
    name: "Package squid is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.1.18. NIST SP 800-53 Rev. 5: CM-6, CM-7."
    tags: [cis, cis-rhel8, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
