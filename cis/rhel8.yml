      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-dcec5780f1 |
      GSSAPI authentication is used for Kerberos single sign-on. When it is not needed it only adds code paths and authentication methods that can be attacked or misconfigured. Disabling it reduces the SSH attack surface; keep it where Kerberos login is in use.
