  - id: "CIS-RHEL8-3.3.2.8-net.ipv6.conf.default.accept_ra"
    name: "Kernel parameter net.ipv6.conf.default.accept_ra is 0"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.3.2.8. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
