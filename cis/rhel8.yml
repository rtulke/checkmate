    remediation: &rem-ea56781c51 |
      Create /etc/security/opasswd if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/security/opasswd'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/security/opasswd'
  - id: "CIS-RHEL8-7.1.11-world_writable"
    name: "world writable: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type d \\( -p…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 7.1.11. NIST SP 800-53 Rev. 5: SC-4."
    tags: [cis, cis-rhel8, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type d \( -perm -0002 -a ! -perm -1000 \) 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-9f0a5a248e |
      Files and directories that everyone can write to allow any user to alter data, plant malicious content or replace files that others rely on. World-writable directories without the sticky bit additionally let users delete or rename other users' files. Such permissions should be removed or justified.
    remediation: &rem-9b39034669 |
      Review each file and directory listed by the check. Remove world write access where it is not required, and set the sticky bit on directories that must stay world-writable so that users cannot delete each other's files.

      ls -ld PATH
      chmod o-w FILE
      chmod +t DIRECTORY

      Shared directories such as /tmp and /var/tmp need mode 1777; clarify with the owning application before changing other files.
  - id: "CIS-RHEL8-7.1.12-unowned_ungrouped_dirs"
    name: "unowned ungrouped dirs: df --local -P | awk 'NR!=1 {print $6}' | xargs -I '{}' find '{}' -xdev \\( ! -path \"/run/u…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 7.1.12. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk 'NR!=1 {print $6}' | xargs -I '{}' find '{}' -xdev \( ! -path "/run/user/*" -a ! -path "/proc/*" -a ! -path "*/containerd/*" -a ! -path "*/kubelet/pods/*" -a ! -path "*/kubelet/plugins/*" -a ! -path "/sys/fs/cgroup/memory/*" -a ! -path "/var/*/private/*" \) \( -nouser -o -nogroup \) -not -fstype nfs -print
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-6853b0549c |
      Files and directories whose owner or group does not match any existing account are usually left over from deleted users or unpacked archives. If a new account later receives the same UID or GID, it silently gains access to that data. Assigning valid owners keeps access control predictable.
    remediation: &rem-87eb4e1869 |
      Review each reported file or directory and assign an existing owner and group, or remove it once it is confirmed to be no longer needed.

      ls -ld PATH
      chown USER:GROUP PATH
  - id: "CIS-RHEL8-7.1.13-audit_sgid_suid"
    name: "audit sgid suid: df --local -P | awk '{if (NR!=1) print $7}' | xargs -I '{}' find '{}' -xdev -type f \\( -p…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 7.1.13. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5, AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $7}' | xargs -I '{}' find '{}' -xdev -type f \( -perm -2000 -o -perm -4000 \)
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-a5e81e314d |
      Programs with the setuid or setgid bit run with the privileges of their owner or group, usually root, so a flaw in such a file or a replaced copy leads directly to privilege escalation. Reviewing these files, and checking that they belong to an installed package and match the packaged version, finds planted or modified privileged binaries.
    remediation: &rem-844c18c942 |
      Review every reported setuid or setgid file. Reinstall the owning package of files that differ from the packaged version, and remove the special bits from files that do not belong to any package unless they are known to be required.

      rpm -qf FILE
      rpm -Vf FILE
      dnf reinstall PACKAGE
      chmod u-s,g-s FILE

      On RHEL 8, 9 and 10 every setuid or setgid file is listed; review the list and remove the bits from programs the system does not need.
  - id: "CIS-RHEL8-7.2.1-accts_use_shadowed"
    name: "accts use shadowed: awk -F: '($2 != \"x\" ) { print $1 \" is not set to shadowed passwords \"}' /etc/passwd"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 7.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-rhel8, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($2 != "x" ) { print $1 " is not set to shadowed passwords "}' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-2034accf59 |
      If the password field in /etc/passwd holds a hash instead of the placeholder x, every user can read it, because /etc/passwd is world-readable, and crack it offline. Keeping hashes in /etc/shadow, which only root can read, prevents this exposure.
    remediation: &rem-0f8f7d54a9 |
      Move all password hashes to /etc/shadow, then review the reported accounts again.

      pwconv
      awk -F: '($2 != "x") {print $1}' /etc/passwd

      For any account still listed, set the password field to x with usermod or vipw and give the account a password with passwd USER.
  - id: "CIS-RHEL8-7.2.2-nopasswd_shadow"
    name: "nopasswd shadow: cat /etc/shadow | cut -d ':' -f2"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 7.2.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/shadow | cut -d ':' -f2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(\\*|\\!|\\$)" }
      - { none: "~ ^$" }
    rationale: &rat-9a863c273d |
      Every account should either have a password hash stored in /etc/shadow or be explicitly locked. An empty password field allows logging in without credentials, and password hashes kept in the world-readable /etc/passwd can be cracked by any user.
    remediation: &rem-05e12bb74f |
      Make sure every account keeps its password in /etc/shadow and no account has an empty password field: move hashes from /etc/passwd to /etc/shadow with pwconv, then lock or set a password for every account the check reports.

      pwconv
      awk -F: '($2 == "") {print $1}' /etc/shadow
      usermod -L USER
      passwd USER
  - id: "CIS-RHEL8-7.2.3-passwd_group_exist"
    name: "passwd group exist: awk -F: 'NR==FNR {g[$3]; next} !($4 in g) {print $1\":\"$4}' /etc/group /etc/passwd"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 7.2.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: 'NR==FNR {g[$3]; next} !($4 in g) {print $1":"$4}' /etc/group /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-a6fe2c7421 |
      Every primary group referenced in /etc/passwd should exist in /etc/group. Undefined group IDs usually result from manual edits or deleted groups; if the ID is reused later, the new group's members gain access to the affected users' files.
    remediation: &rem-ac0bde3f41 |
      For every user reported by the check, create the missing group with the referenced GID or assign the user an existing primary group.

      grpck -r
      groupadd -g GID GROUP
      usermod -g GROUP USER

      Changing the primary group does not change the ownership of existing files; adjust them if necessary.
  - id: "CIS-RHEL8-7.2.4-no_dup_uid"
    name: "no dup uid: cat /etc/passwd | cut -d: -f3 | uniq -d"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 7.2.4. NIST SP 800-53 Rev. 5: IA-2."
    tags: [cis, cis-rhel8, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/passwd | cut -d: -f3 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-92a5e740a2 |
      The kernel identifies users by UID, not by name. Several accounts with the same UID share all file ownerships and privileges and cannot be told apart in logs, which undermines accountability.
    remediation: &rem-3997dd9dfb |
      Review every duplicate UID reported by the check, give each account its own UID and assign the files of the former shared UID deliberately.

      awk -F: '($3 == UID) {print $1}' /etc/passwd
      usermod -u NEWUID USER
      find / -xdev -user UID -ls

      usermod adjusts only the home directory; other files owned by the old UID stay with the account that keeps it.
  - id: "CIS-RHEL8-7.2.5-no_dup_gid"
    name: "no dup gid: cat /etc/group | cut -d: -f3 | uniq -d"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 7.2.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/group | cut -d: -f3 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-1c1a4afdb8 |
      Groups are identified by GID. Several groups with the same GID share all group permissions, so membership in one silently grants the access rights of the other.
    remediation: &rem-6a315abc33 |
      Review every duplicate GID reported by the check, give each group its own GID and assign the files of the former shared GID deliberately.

      awk -F: '($3 == GID) {print $1}' /etc/group
      groupmod -g NEWGID GROUP
      find / -xdev -group GID -ls

      Files owned by the old GID are not changed automatically; adjust them where they belong to the renumbered group.
  - id: "CIS-RHEL8-7.2.6-no_dup_username"
    name: "no dup username: cat /etc/passwd | cut -d: -f1 | uniq -d"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 7.2.6. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/passwd | cut -d: -f1 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-48bf65be3b |
      Duplicate user names in /etc/passwd make it unpredictable which entry is used for login and which UID a name resolves to. This can lead to wrong file ownership and confusing audit trails.
    remediation: &rem-e93b096dcd |
      Review the duplicate entries for every user name reported by the check and remove or rename the surplus entry in /etc/passwd and /etc/shadow with the locking editors.

      grep -n '^USER:' /etc/passwd
      pwck -r
      vipw
      vipw -s
  - id: "CIS-RHEL8-7.2.7-no_dup_groupname"
    name: "no dup groupname: cat /etc/group | cut -d: -f1 | uniq -d"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 7.2.7. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/group | cut -d: -f1 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-5dd470fed7 |
      Duplicate group names in /etc/group make it unpredictable which GID a group name resolves to. This can lead to wrong access rights when files or memberships are assigned by name.
    remediation: &rem-c9a5680ce7 |
      Review the duplicate entries for every group name reported by the check and remove or rename the surplus entry in /etc/group and /etc/gshadow with the locking editors.

      grep -n '^GROUP:' /etc/group
      grpck -r
      vigr
      vigr -s
  - id: "CIS-RHEL8-7.2.8-home_dirs_exist"
    name: "home dirs exist: pwck -r | grep -v journal | grep \"does not exist\""
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 7.2.8. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      pwck -r | grep -v journal | grep "does not exist"
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ does not exist" }
    rationale: &rat-93950236f2 |
      An account whose home directory does not exist gets / as its working directory at login, and some programs then try to create files in unexpected places. Missing home directories also indicate stale accounts. Every account, and in particular every interactive one, should have an existing home directory.
    remediation: &rem-16e7619e2c |
      Create the missing home directory for every account listed by the check with the correct owner and mode, or point the account to an existing directory if it does not need its own home. On several platforms the check also lists system accounts; for those, review whether the account is still needed and prefer usermod -d to an existing directory over creating new directories.

      mkdir -p HOMEDIR
      chown USER: HOMEDIR
      chmod 750 HOMEDIR
      usermod -d EXISTINGDIR USER

      On RHEL 7 the check also requires that home directories of users with UID 1000 to 60000 have mode 750 or 700. On Ubuntu 18.04 every finding of pwck -r fails the check, not only missing home directories.
  - id: "CIS-RHEL8-7.2.8-home_dirs_owned"
    name: "home dirs owned: getent passwd {1000..60000} |  awk -F: '{ print $1  \" \"  $6 }' | while read user dir; do …"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 7.2.8. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      getent passwd {1000..60000} |  awk -F: '{ print $1  " "  $6 }' | while read user dir; do if [ $user != 'ftpd' ]; then owner=$(stat -L -c "%U" "$dir"); if [ "$owner" != "$user" ]; then echo "home dir for $user owned by $owner"; fi; fi; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-d265418053 |
      A user should own their home directory. If another account owns it, that account controls the user's files, startup scripts and SSH keys and can manipulate them to run code as the user.
    remediation: &rem-9804bc2d06 |
      Make each listed user the owner of their home directory after confirming that the directory really belongs to that user.

      ls -ld HOMEDIR
      chown USER HOMEDIR
  - id: "CIS-RHEL8-7.2.8-home_dirs_restrict"
    name: "home dirs restrict: for i in `getent passwd {1000..60000} |  awk '{split($0,a,\":\");print a[6]}'`; do stat -c …"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 7.2.8. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      for i in `getent passwd {1000..60000} |  awk '{split($0,a,":");print a[6]}'`; do stat -c "%a %n" $i ; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^7(0|5)0\\s" }
    rationale: &rat-38c62d069f |
      Home directories hold private data, shell startup files and credentials such as SSH keys. Modes of 750 or 700 prevent other users from reading or modifying them while still allowing optional group access.
    remediation: &rem-b0aa30ee8d |
      Set the home directory of every interactive user to mode 750 or 700.

      awk -F: '($3 >= 1000 && $3 <= 60000) {print $6}' /etc/passwd | xargs -r stat -c '%a %n'
      chmod 750 HOMEDIR

      Set the default for new home directories as well (HOME_MODE in /etc/login.defs; DIR_MODE in /etc/adduser.conf on Debian and Ubuntu).
  - id: "CIS-RHEL8-7.2.9-dot_netrc_perms"
    name: "dot netrc perms: find /home/  \\( -name .netrc -o -name .rhost -o -name .forward \\)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 7.2.9. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      find /home/  \( -name .netrc -o -name .rhost -o -name .forward \)
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-d1da7f7d6c |
      .netrc files store login credentials for FTP and other services in clear text, .rhosts files grant password-less remote access, and .forward files can pipe a user's mail into arbitrary commands. All three bypass central account controls and can expose credentials or allow code execution, so they should not exist in home directories unless explicitly approved.
    remediation: &rem-a93153e945 |
      Review every file reported by the check together with its owner. Remove the files that are not required once nothing depends on them, and document any approved exception.

      ls -l FILE
      rm FILE

      The check reports these files regardless of their permissions.
