  - id: "CIS-RHEL8-2.3.3-chrony_sysconfig-attrs"
    name: "/etc/sysconfig/chronyd: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.3.3."
    tags: [cis, cis-rhel8, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/sysconfig/chronyd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-427eff5d8f |
      chronyd starts as root but should drop privileges to the dedicated chrony user after initialization. Running the network-facing time daemon as root would turn any vulnerability in it into a full system compromise. The check verifies the -u chrony option in the daemon's startup options.
    remediation: &rem-3f8831cc4a |
      Create /etc/sysconfig/chronyd.
  - id: "CIS-RHEL8-2.3.3-chrony_sysconfig-content"
    name: "/etc/sysconfig/chronyd has the expected content (2 rules)"
