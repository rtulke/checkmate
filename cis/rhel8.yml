  - id: "CIS-RHEL8-3.3.2.7-net.ipv6.conf.all.accept_ra"
    name: "Kernel parameter net.ipv6.conf.all.accept_ra is 0"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.3.2.7. NIST SP 800-53 Rev. 5: CM-6."
