      echo 'UsePAM yes' > /etc/ssh/sshd_config.d/00-usepam.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any UsePAM line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-RHEL8-5.2.1-sudo"
    name: "Package sudo is installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.2.1. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet sudo
    expect: true
    rationale: &rat-f5f9e1cba7 |
      sudo lets administrators run privileged commands with their own credentials instead of a shared root password. That gives individual accountability, fine-grained permissions and a log of every privileged command.
    remediation: &rem-9822b7a6a6 |
      Install the package sudo:

      dnf install sudo
  - id: "CIS-RHEL8-5.2.2-pty_sudoers_d"
    name: "pty sudoers d: export PTY=`grep -q -Ei '^\\s*Defaults\\s+(\\[^#]+,\\s*)?use_pty' /etc/sudoers /etc/sudoers.d…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.2.2. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      export PTY=`grep -q -Ei '^\s*Defaults\s+(\[^#]+,\s*)?use_pty' /etc/sudoers /etc/sudoers.d/*; echo $?` && if [[ $PTY == 0 ]];then echo OK ;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK" }
    rationale: &rat-63218cca98 |
      With use_pty, sudo runs commands in a separate pseudo-terminal. A malicious program started through sudo then cannot inject input into the user's terminal or keep access to it after sudo exits. It also makes I/O logging complete.
    remediation: &rem-bf550576ff |
      Enable use_pty with a line of its own in a file under /etc/sudoers.d/, remove any Defaults !use_pty setting and validate the syntax.

      echo 'Defaults use_pty' > /etc/sudoers.d/50-use_pty
      chmod 0440 /etc/sudoers.d/50-use_pty
      grep -rnE '^\s*Defaults.*!use_pty' /etc/sudoers /etc/sudoers.d/
      visudo -c

      sudo ignores files in /etc/sudoers.d/ whose names contain a dot or end with ~.
  - id: "CIS-RHEL8-5.2.3-log_sudoers_d"
    name: "log sudoers d: export LOG=`grep -q -Esi '^\\s*Defaults\\s+([^#]+,\\s*)?logfile=' /etc/sudoers /etc/sudoers.…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.2.3. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      export LOG=`grep -q -Esi '^\s*Defaults\s+([^#]+,\s*)?logfile=' /etc/sudoers /etc/sudoers.d/*; echo $?` && if [[ $LOG == 0 ]];then echo OK ;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK" }
    rationale: &rat-73ffb83e75 |
      A dedicated sudo log file records every sudo invocation with user, terminal, working directory and command. That makes privileged activity easy to review and keeps the record separate from general system logs.
    remediation: &rem-b7aaa6ded0 |
      Configure a dedicated sudo log file under /var/log in a Defaults line of its own and validate the syntax.

      echo 'Defaults logfile="/var/log/sudo.log"' > /etc/sudoers.d/50-logfile
      chmod 0440 /etc/sudoers.d/50-logfile
      visudo -c
  - id: "CIS-RHEL8-5.2.4-nopasswd_sudoers_d"
    name: "nopasswd sudoers d: grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v '.*\\:#'"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.2.4. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v '.*\:#'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-eecb763928 |
      NOPASSWD lets users run commands with elevated privileges without entering their password. Anyone who gains access to such an account, or a process running as it, obtains root immediately. Requiring the password confirms the person and limits the impact of a hijacked session.
    remediation: &rem-a35cd5880e |
      Review every listed sudo rule with NOPASSWD and remove the tag (or the rule) unless a documented exception applies. Edit the files with visudo so syntax errors are caught.

      grep -rn NOPASSWD /etc/sudoers /etc/sudoers.d/
      visudo -f FILE

      Users who lose NOPASSWD need a password to use sudo. On cloud images the default user (for example via /etc/sudoers.d/90-cloud-init-users) often has none; set one first, or you may lose administrative access.
  - id: "CIS-RHEL8-5.2.5-authenticate_sudoers"
    name: "authenticate sudoers: grep -r \"^[^#].*\\!authenticate\" /etc/sudoers*"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.2.5. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -r "^[^#].*\!authenticate" /etc/sudoers*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-0aa92719bf |
      The !authenticate option lets sudo run commands without asking for the user's password. Anyone who gets hold of an unlocked session or a compromised account of such a user can then act with elevated privileges without any further barrier. Requiring re-authentication for sudo keeps privilege escalation tied to knowledge of the password.
    remediation: &rem-f4fb208b6d |
      Remove the !authenticate option from every sudoers rule and Defaults line reported by the check. Edit each file with visudo so that the syntax is validated before it is saved.

      grep -rn '!authenticate' /etc/sudoers /etc/sudoers.d/
      visudo -f /etc/sudoers
      visudo -f /etc/sudoers.d/FILE

      Affected users will be asked for their password again when they use sudo.
  - id: "CIS-RHEL8-5.2.6-sudo_timeout"
    name: "sudo timeout: grep -rP \"timestamp_timeout=\\K[0-9]*\" /etc/sudoers*"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.2.6. NIST SP 800-53 Rev. 5: IA-11."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -rP "timestamp_timeout=\K[0-9]*" /etc/sudoers*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ timestamp_timeout=(-1|1[6-9]|[2-9][0-9]|[1-9][0-9]{2,})" }
      - { some: "~ timestamp_timeout=([5-9]|1[0-5])" }
    rationale: &rat-14f3ec7a75 |
      After a successful authentication, sudo caches the credentials for a while so that further commands do not ask for the password again. A long or unlimited cache lets anyone with access to an unattended terminal run privileged commands. Keeping the timeout at 15 minutes or less limits that window while staying practical for administrators.
    remediation: &rem-391bdc9433 |
      Set the sudo credential cache timeout to 15 minutes or less in a sudoers drop-in file, and remove larger or negative timestamp_timeout values from all other sudoers files.

      grep -rn 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/
      echo 'Defaults timestamp_timeout=15' > /etc/sudoers.d/50-timestamp-timeout
      chmod 0440 /etc/sudoers.d/50-timestamp-timeout
      visudo -c

      Write the value without spaces around the equals sign; the check searches for timestamp_timeout=VALUE literally.
  - id: "CIS-RHEL8-5.2.7-restrict_su-attrs"
    name: "/etc/pam.d/su: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/su'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-43a7e69d11 |
      su lets any user who knows the root password, or another account's password, switch identity. Restricting su with pam_wheel to members of a dedicated (normally empty) group prevents switching to root through su and forces administrators to use sudo, where actions are attributed to individual accounts and logged.
    remediation: &rem-d67efd69b0 |
      Create /etc/pam.d/su.
  - id: "CIS-RHEL8-5.2.7-restrict_su-content"
    name: "/etc/pam.d/su has the expected content (1 rule)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/su'
    allow_rc: any
    expect: { some: "~ ^auth.*required.*pam_wheel.so\\suse_uid\\sgroup=sugroup" }
    rationale: *rat-43a7e69d11
    remediation: &rem-f77cd2d086 |
      Edit /etc/pam.d/su so that its lines meet these conditions (regular expressions):

      - a line matches ^auth.*required.*pam_wheel.so\suse_uid\sgroup=sugroup
  - id: "CIS-RHEL8-5.2.7-sugroup_etc_group"
    name: "sugroup etc group: grep sugroup /etc/group"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep sugroup /etc/group
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^sugroup:x:\\d+:$" }
      - { none: "~ ^sugroup:x:\\d+:.*:" }
    rationale: &rat-575a3911d0 |
      Restricting su with pam_wheel to members of a dedicated group prevents ordinary users from switching to root or other accounts by guessing or knowing their passwords. Using an empty group makes su usable only by root, so administrators must use sudo, which is logged per user. The group must exist and have no members.
    remediation: &rem-f454845d9c |
      Create an empty group named sugroup and restrict su to its members with pam_wheel.

      groupadd sugroup
      gpasswd -M '' sugroup
      grep -q 'pam_wheel.so.*group=sugroup' /etc/pam.d/su || sed -i '/^auth\s\+sufficient\s\+pam_rootok.so/a auth required pam_wheel.so use_uid group=sugroup' /etc/pam.d/su

      On Amazon Linux 2023 the check expects the group to be named nosugroup; use that name instead. The group must not have any members.
  - id: "CIS-RHEL8-5.3.1.1-pam_version"
    name: "pam version: dnf check-update pam"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.3.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dnf check-update pam
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^pam" }
    rationale: &rat-7802ae6e55 |
      Several authentication controls, such as faillock.conf, pwhistory configuration files and fixes for known PAM vulnerabilities, depend on a sufficiently recent PAM package. An outdated PAM may silently ignore settings that are believed to be active or leave security fixes unapplied. Keeping PAM at the required version ensures the configured policies are actually enforced.
    remediation: &rem-fafb62a7e1 |
      Update the pam package to the latest version available in the configured repositories.

      dnf upgrade pam
  - id: "CIS-RHEL8-5.3.1.2-authselect_version"
    name: "Package authselect is installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.3.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet authselect
    expect: true
    rationale: &rat-605b67ca20 |
      authselect manages the PAM and nsswitch configuration from tested profiles, which avoids error-prone manual edits of PAM files. Older versions lack features and fixes needed for current password and lockout settings, so a sufficiently recent version is required.
    remediation: &rem-b0409985eb |
      Install the package authselect:

      dnf install authselect
  - id: "CIS-RHEL8-5.3.2.1-authselect_profile"
    name: "authselect profile: authselect current"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.3.2.1."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      authselect current
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Profile ID: custom/cis_example_profile" }
      - { some: "~ ^- with-pwhistory" }
      - { some: "~ ^- with-faillock" }
      - { some: "~ ^- without-nullok" }
      - { none: "~ No existing configuration detected" }
    rationale: &rat-505be763de |
      authselect generates the PAM configuration from a profile and its enabled features, which keeps the configuration consistent and survives package updates. A custom profile with password history, faillock and without nullok ensures reuse protection, account lockout and the rejection of empty passwords are applied across all PAM services.
    remediation: &rem-e40538ef2b |
      Create the custom profile based on the sssd profile, select it with the required features and verify the result.

      authselect create-profile cis_example_profile -b sssd --symlink-meta
      authselect select custom/cis_example_profile with-pwhistory with-faillock without-nullok --force
      authselect current

      --force overwrites PAM files that were not created by authselect (a backup is kept); review local PAM changes first. The with-pwhistory feature requires a recent authselect version.
  - id: "CIS-RHEL8-5.3.2.2-authselect_pam_faillock_password-attrs"
    name: "/etc/pam.d/password-auth: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.3.2.2. NIST SP 800-53 Rev. 5: AC-7."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/password-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-70ba99db4c |
      pam_faillock locks an account after repeated failed logins, which slows down online password guessing. It only works when the preauth, authfail and account entries are all present in /etc/pam.d/password-auth, which the check verifies.
    remediation: &rem-709240e3c2 |
      Create /etc/pam.d/password-auth.
  - id: "CIS-RHEL8-5.3.2.2-authselect_pam_faillock_password-content"
    name: "/etc/pam.d/password-auth has the expected content (3 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.3.2.2. NIST SP 800-53 Rev. 5: AC-7."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/password-auth'
    allow_rc: any
    expect:
      - { some: "~ ^auth\\s+required\\s+pam_faillock.so preauth" }
      - { some: "~ ^auth\\s+required\\s+pam_faillock.so authfail" }
      - { some: "~ ^account\\s+required\\s+pam_faillock.so" }
    rationale: *rat-70ba99db4c
    remediation: &rem-b606dcded0 |
      Edit /etc/pam.d/password-auth so that its lines meet these conditions (regular expressions):

      - a line matches ^auth\s+required\s+pam_faillock.so preauth
      - a line matches ^auth\s+required\s+pam_faillock.so authfail
      - a line matches ^account\s+required\s+pam_faillock.so
  - id: "CIS-RHEL8-5.3.2.2-authselect_pam_faillock_system-attrs"
    name: "/etc/pam.d/system-auth: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.3.2.2. NIST SP 800-53 Rev. 5: AC-7."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
