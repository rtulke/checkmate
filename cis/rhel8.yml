  - id: "CIS-RHEL8-2.1.13-rsync_pkg"
    name: "Package rsync-daemon is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.1.13. NIST SP 800-53 Rev. 5: CM-6, CM-7."
