      sshd uses the first value it reads, so remove or correct any PermitUserEnvironment line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-RHEL8-5.1.24-sshd_usepam-attrs"
