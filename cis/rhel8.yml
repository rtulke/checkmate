    remediation: &rem-a8dd9cdd16 |
      Prevent the rds module from loading and unload it if it is loaded.

      printf '%s\n' 'blacklist rds' 'install rds /bin/false' > /etc/modprobe.d/rds.conf
      modprobe -r rds

      If the module is in use, stop the application using it or reboot.
  - id: "CIS-RHEL8-3.2.4-modprobe_RDS"
    name: "modprobe RDS: modprobe -n -v rds"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.2.4. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v rds
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ install /bin/(true|false)" }
    rationale: &rat-cc336625ff |
      RDS (Reliable Datagram Sockets) is a protocol for cluster interconnects that most systems never use, and its kernel code has had privilege escalation vulnerabilities. Mapping the module to /bin/false in the modprobe configuration prevents it from being loaded on demand.
    remediation: *rem-a8dd9cdd16
  - id: "CIS-RHEL8-3.2.5-lsmod_sctp"
    name: "lsmod sctp: lsmod | grep -i sctp"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 3.2.5. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-rhel8, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
