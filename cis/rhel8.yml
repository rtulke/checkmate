      dnf remove net-snmp
  - id: "CIS-RHEL8-2.1.16-telnet_pkg"
    name: "Package telnet-server is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 2.1.16. NIST SP 800-53 Rev. 5: CM-7, CM-11."
