    run: |
      grep -R kernel.kptr_restrict /etc/sysctl.conf /etc/sysctl.d/
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*conf:kernel.kptr_restrict\\s*=\\s*(1|2)" }
      - { none: "~ .*conf:kernel.kptr_restrict\\s*=\\s*0" }
    rationale: &rat-3973ca4f74 |
      kernel.kptr_restrict hides kernel memory addresses printed through /proc and other interfaces from unprivileged users (1) or from everyone (2). Leaked kernel pointers defeat address space randomization and make kernel exploits much easier. This variant checks the persistent setting in /etc/sysctl.conf and /etc/sysctl.d/.
    remediation: &rem-9860059ff9 |
      Set kernel.kptr_restrict to 1 in a file under /etc/sysctl.d/ and load the settings:

      printf '%s\n' 'kernel.kptr_restrict = 1' > /etc/sysctl.d/60-kernel_kptr_restrict.conf
      sysctl --system

      Remove or correct other lines setting kernel.kptr_restrict in /etc/sysctl.conf and /etc/sysctl.d/, because the check fails if any of them sets a different value.
