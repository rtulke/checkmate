  - id: "CIS-RHEL8-5.1.11-ssh_gssapi_live"
    name: "ssh gssapi live: sshd -T | grep -i '^gssapiauthentication'"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.11. NIST SP 800-53 Rev. 5: CM-6."
