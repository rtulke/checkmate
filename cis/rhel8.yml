  - id: "CIS-RHEL8-1.5.7-ptrace_restricted"
    name: "Kernel parameter kernel.yama.ptrace_scope matches ^(1|2|3)$"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.5.7. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.yama.ptrace_scope
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ ^(1|2|3)$"
    rationale: &rat-69435528c0 |
      Unrestricted ptrace lets any process attach to other processes of the same user and read their memory or inject code, for example to steal credentials from a running SSH agent or shell. Yama's ptrace_scope of 1 or higher limits tracing to a process's own descendants or to administrators, which contains the damage a compromised process can do.
    remediation: &rem-f63b93a9ff |
      Set the kernel parameter kernel.yama.ptrace_scope to one of 1, 2, 3 (the example uses 1), now and at boot:

      sysctl -w 'kernel.yama.ptrace_scope=1'
      printf '%s\n' 'kernel.yama.ptrace_scope = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.yama.ptrace_scope from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-RHEL8-1.5.7-ptrace_restricted_2"
    name: "ptrace restricted 2: grep \"kernel\\.yama\\.ptrace_scope\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.5.7. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "kernel\.yama\.ptrace_scope" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*:kernel\\.yama\\.ptrace_scope\\s*=\\s*(1|2|3)" }
    rationale: &rat-b0d72d1bb8 |
      Unrestricted ptrace lets any process attach to other processes of the same user and read their memory or inject code, for example to steal credentials from a running SSH agent or shell. Yama's ptrace_scope of 1 or higher limits tracing to a process's own descendants or to administrators, which contains the damage a compromised process can do. This check verifies the setting is persisted in the sysctl configuration.
    remediation: &rem-d86d484122 |
      Set kernel.yama.ptrace_scope to 1 in a sysctl drop-in file and apply it. Remove or correct other lines that set a different value.

      printf '%s\n' 'kernel.yama.ptrace_scope = 1' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w kernel.yama.ptrace_scope=1

      grep -r ptrace_scope /etc/sysctl.conf /etc/sysctl.d/ shows existing settings. Values 2 or 3 are stricter and also accepted on RHEL 8 and 10.
  - id: "CIS-RHEL8-1.5.8-address_space_random"
    name: "Kernel parameter kernel.randomize_va_space is 2"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.5.8. NIST SP 800-53 Rev. 5: SI-16."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.randomize_va_space
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 2"
    rationale: &rat-55eb3f834d |
      Address space layout randomization places the stack, heap, shared libraries and memory mappings at random addresses. Full randomization (value 2) makes memory corruption exploits much harder, because attackers can no longer rely on known addresses for code or data.
    remediation: &rem-a6e5efe9f8 |
      Set the kernel parameter kernel.randomize_va_space to 2, now and at boot:

      sysctl -w 'kernel.randomize_va_space=2'
      printf '%s\n' 'kernel.randomize_va_space = 2' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.randomize_va_space from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-RHEL8-1.5.8-aslr_enabled_2"
    name: "aslr enabled 2: grep \"kernel\\.randomize_va_space\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.5.8. NIST SP 800-53 Rev. 5: SI-16."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "kernel\.randomize_va_space" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^*.conf:kernel.randomize_va_space\\s*=\\s*2" }
    rationale: &rat-2872b53691 |
      Address space layout randomization places the stack, heap, shared libraries and other memory regions at random addresses, which makes memory corruption exploits much harder. The value 2 enables full randomization. Setting it in a sysctl configuration file ensures it is applied at every boot and not only at runtime.
    remediation: &rem-b364909f96 |
      Set kernel.randomize_va_space to 2 in a sysctl configuration file so it is applied at every boot, and apply it now. Write the line without spaces around the equals sign; some of the checks require that.

      printf '%s\n' 'kernel.randomize_va_space=2' > /etc/sysctl.d/60-kernel_sysctl.conf
      sysctl -w kernel.randomize_va_space=2

      Remove or correct any other kernel.randomize_va_space line in /etc/sysctl.conf and /etc/sysctl.d/.
  - id: "CIS-RHEL8-1.5.9-procmaxsize_coredump_conf"
    name: "procmaxsize coredump conf: grep -iR ProcessSizeMax /etc/systemd/coredump.conf /etc/systemd/coredump.conf.d/"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.5.9. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -iR ProcessSizeMax /etc/systemd/coredump.conf /etc/systemd/coredump.conf.d/
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^*.conf:ProcessSizeMax\\s*=\\s*0" }
      - { none: "~ ^*.conf:ProcessSizeMax\\s*=\\s*[1-9].*" }
    rationale: &rat-67dfbce863 |
      systemd-coredump collects core dumps of crashing processes. ProcessSizeMax=0 stops it from processing any dump, so memory contents of crashed programs, which may include passwords, keys or personal data, are not stored or passed on.
    remediation: &rem-b900773b99 |
      Set ProcessSizeMax=0 in the [Coredump] section of /etc/systemd/coredump.conf, replacing the commented default, and remove conflicting ProcessSizeMax lines from /etc/systemd/coredump.conf.d/:

      sed -i 's/^#\?ProcessSizeMax=.*/ProcessSizeMax=0/' /etc/systemd/coredump.conf
      grep -q '^ProcessSizeMax=0' /etc/systemd/coredump.conf || printf '%s\n' 'ProcessSizeMax=0' >> /etc/systemd/coredump.conf

      The main file is used instead of a drop-in because the RHEL 9 check only reads /etc/systemd/coredump.conf. systemd-coredump reads the file at each crash, no restart is needed.
  - id: "CIS-RHEL8-1.5.10-storage_coredump_conf"
    name: "storage coredump conf: grep -iR storage /etc/systemd/coredump.conf /etc/systemd/coredump.conf.d/"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.5.10. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -iR storage /etc/systemd/coredump.conf /etc/systemd/coredump.conf.d/
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^*.conf:Storage\\s*=\\s*none" }
    rationale: &rat-2636b8cdb0 |
      Storage=none tells systemd-coredump not to keep core dumps on disk; only the crash is logged. This prevents memory images of crashed processes, which may contain secrets, from accumulating in /var/lib/systemd/coredump where they could be read or exfiltrated.
    remediation: &rem-caec660d2e |
      Set Storage=none in the [Coredump] section of /etc/systemd/coredump.conf, replacing the commented default, and remove conflicting Storage lines from /etc/systemd/coredump.conf.d/:

      sed -i 's/^#\?Storage=.*/Storage=none/' /etc/systemd/coredump.conf
      grep -q '^Storage=none' /etc/systemd/coredump.conf || printf '%s\n' 'Storage=none' >> /etc/systemd/coredump.conf

      The main file is used instead of a drop-in because the RHEL 9 check only reads /etc/systemd/coredump.conf. systemd-coredump reads the file at each crash, no restart is needed.
  - id: "CIS-RHEL8-1.6.1-crypto_not_legacy-attrs"
    name: "/etc/crypto-policies/config: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.6.1. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/crypto-policies/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1a91ed7252 |
      The LEGACY system-wide crypto policy re-enables old algorithms and protocols such as SHA-1 signatures and small keys for compatibility. Using it weakens TLS, SSH, IPsec and other components at once. Keeping the policy at DEFAULT or stricter ensures only currently accepted algorithms are offered.
    remediation: &rem-0853942979 |
      Create /etc/crypto-policies/config.
  - id: "CIS-RHEL8-1.6.1-crypto_not_legacy-content"
    name: "/etc/crypto-policies/config has the expected content (1 rule)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.6.1. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/crypto-policies/config'
    allow_rc: any
    expect: { none: "~ ^\\s*LEGACY" }
    rationale: *rat-1a91ed7252
    remediation: &rem-0c33aaa5d4 |
      Edit /etc/crypto-policies/config so that its lines meet these conditions (regular expressions):

      - no line matches ^\s*LEGACY
  - id: "CIS-RHEL8-1.6.2-crypto_not_sha1_config-attrs"
    name: "/etc/crypto-policies/policies/modules/NO-SHA1.pmod: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.6.2. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/crypto-policies/policies/modules/NO-SHA1.pmod'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-a39e10d21f |
      SHA-1 is vulnerable to practical collision attacks, which undermines signatures that rely on it. A policy module that removes SHA-1 from hashes and signatures prevents components using the system-wide crypto policy from accepting it.
    remediation: &rem-e2b837a7e1 |
      Create /etc/crypto-policies/policies/modules/NO-SHA1.pmod.
  - id: "CIS-RHEL8-1.6.2-crypto_not_sha1_config-content"
    name: "/etc/crypto-policies/policies/modules/NO-SHA1.pmod has the expected content (3 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.6.2. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/crypto-policies/policies/modules/NO-SHA1.pmod'
    allow_rc: any
    expect:
      - { some: "~ ^hash = -SHA1" }
      - { some: "~ ^sign = -\\*-SHA1" }
      - { some: "~ ^sha1_in_certs = 0" }
    rationale: *rat-a39e10d21f
    remediation: &rem-978dc74b7f |
      Edit /etc/crypto-policies/policies/modules/NO-SHA1.pmod so that its lines meet these conditions (regular expressions):

      - a line matches ^hash = -SHA1
      - a line matches ^sign = -\*-SHA1
      - a line matches ^sha1_in_certs = 0
  - id: "CIS-RHEL8-1.6.2-crypto_not_sha1_current-attrs"
    name: "/etc/crypto-policies/state/CURRENT.pol: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.6.2. NIST SP 800-53 Rev. 5: SC-8. CIS Controls v8: 3.1."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/crypto-policies/state/CURRENT.pol'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f9c1472ee9 |
      The file CURRENT.pol shows the crypto policy that is actually in effect. Verifying that it no longer allows SHA-1 for hashes and signatures confirms that the policy module has been applied, not merely created.
    remediation: &rem-f645034cb6 |
      Create /etc/crypto-policies/state/CURRENT.pol.
  - id: "CIS-RHEL8-1.6.2-crypto_not_sha1_current-content"
    name: "/etc/crypto-policies/state/CURRENT.pol has the expected content (1 rule)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.6.2. NIST SP 800-53 Rev. 5: SC-8. CIS Controls v8: 3.1."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/crypto-policies/state/CURRENT.pol'
    allow_rc: any
    expect: { none: "~ ^(?i)(hash|sign).*sha1" }
    rationale: *rat-f9c1472ee9
    remediation: &rem-e9aecbfcfe |
      Edit /etc/crypto-policies/state/CURRENT.pol so that its lines meet these conditions (regular expressions):

      - no line matches ^(?i)(hash|sign).*sha1
  - id: "CIS-RHEL8-1.6.3-crypto_macs_less_128_config-attrs"
