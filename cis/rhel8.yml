      grep net.ipv6.conf.all.accept_source_route /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:net.ipv6.conf.all.accept_source_route\\s*=\\s*0" }
      - { none: "~ .*:net.ipv6.conf.all.accept_source_route\\s*=\\s*1" }
    rationale: &rat-fccff0d253 |
      Source-routed IPv6 packets let the sender dictate the path a packet takes through the network. Accepting them can allow an attacker to reach systems that would otherwise not be routable or to bypass network controls. Normal hosts never need to accept source-routed packets.
    remediation: &rem-c2ee801212 |
      Set net.ipv6.conf.all.accept_source_route to 0 in a sysctl drop-in file and apply it. Remove or correct any other line that sets a different value.

      printf '%s\n' 'net.ipv6.conf.all.accept_source_route = 0' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w net.ipv6.conf.all.accept_source_route=0
      sysctl -w net.ipv6.route.flush=1

      The check reads /etc/sysctl.conf and /etc/sysctl.d/ and on most platforms also /run/sysctl.d/, /usr/local/lib/sysctl.d/, /usr/lib/sysctl.d/ and /lib/sysctl.d/; a line with the opposite value in any of these files makes it fail.
  - id: "CIS-RHEL8-3.3.2.6-net.ipv6.conf.default.accept_source_rout"
