  - id: "CIS-RHEL8-5.3.3.1.3-root_unlock_faillock.conf-attrs"
    name: "/etc/security/faillock.conf: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.3.3.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
