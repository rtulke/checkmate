      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-42b3d99227 |
      With use_authtok, pam_unix stores the password that the earlier modules in /etc/pam.d/system-auth already checked, instead of prompting for a new one. Without it, a user could bypass the quality and history checks by entering a different password at the pam_unix prompt.
    remediation: *rem-1d9e638ad5
