    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/fstab'
    allow_rc: any
    expect: { some: "~ \\s\\/var\\/log\\/audit\\s.*noexec" }
    rationale: *rat-ae7b4de4ad
    remediation: &rem-ed06f14391 |
      Edit /etc/fstab so that its lines meet these conditions (regular expressions):

      - a line matches \s\/var\/log\/audit\s.*noexec
  - id: "CIS-RHEL8-1.2.1.1-gpg_keys"
    name: "gpg keys: rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --\u003e %{summary}"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.2.1.1. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --> %{summary}
      '
    expect: { rc: "== 0" }
    rationale: &rat-4781e33879 |
      Package signatures are only meaningful if the keys used to verify them are the right ones. An unexpected or attacker-supplied key in the package manager's keyring lets packages signed with it install without warning. Reviewing the imported keys ensures that only vendor and approved repository keys are trusted.
    remediation: &rem-e2da82e641 |
      Import the distribution vendor's package signing key and remove any key that does not belong to an approved repository. List the installed keys first.

      rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --> %{summary}\n'
      rpm --import /etc/pki/rpm-gpg/KEYFILE
      rpm -e gpg-pubkey-VERSION-RELEASE

      The vendor keys ship in /etc/pki/rpm-gpg/, for example RPM-GPG-KEY-redhat-release on RHEL, RPM-GPG-KEY-amazon-linux-2 on Amazon Linux 2 and RPM-GPG-KEY-amazon-linux-2023 on Amazon Linux 2023. On Amazon Linux 2027 the check expects the Amazon Linux key with the fingerprint 37ce7c3833e5a33c4a1e4b0d5408eaa4b1e92e3d.
  - id: "CIS-RHEL8-1.2.1.2-gpgcheck_global-attrs"
    name: "/etc/dnf/dnf.conf: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.2.1.2. NIST SP 800-53 Rev. 5: CM-14."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/dnf/dnf.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-daa6c7a8f3 |
      With gpgcheck enabled, the package manager verifies the signature of every package against trusted vendor keys before installing it. This protects against tampered packages from compromised mirrors or man-in-the-middle attacks. Setting it globally in dnf.conf makes verification the default for all repositories.
    remediation: &rem-6893311621 |
      Create /etc/dnf/dnf.conf.
  - id: "CIS-RHEL8-1.2.1.2-gpgcheck_global-content"
    name: "/etc/dnf/dnf.conf has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.2.1.2. NIST SP 800-53 Rev. 5: CM-14."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/dnf/dnf.conf'
    allow_rc: any
    expect:
      - { some: "~ ^gpgcheck=1" }
      - { none: "~ ^gpgcheck=0" }
    rationale: *rat-daa6c7a8f3
    remediation: &rem-8c899778af |
      Edit /etc/dnf/dnf.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^gpgcheck=1
      - no line matches ^gpgcheck=0
  - id: "CIS-RHEL8-1.2.1.2-gpgcheck_repo"
    name: "gpgcheck repo: grep -E '^\\s*gpgcheck\\s*=\\s*0' /etc/yum.repos.d/*.repo"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.2.1.2. NIST SP 800-53 Rev. 5: CM-14."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      grep -E '^\s*gpgcheck\s*=\s*0' /etc/yum.repos.d/*.repo
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-31c5dd5688 |
      A repository definition with gpgcheck=0 overrides the global setting and lets packages from that repository be installed without signature verification. A compromised mirror or a man-in-the-middle could then deliver tampered packages that run with root privileges during installation.
    remediation: &rem-8350053610 |
      Set gpgcheck=1 in every repository file the check lists, making sure each repository has a gpgkey configured.

      grep -E '^\s*gpgcheck\s*=\s*0' /etc/yum.repos.d/*.repo
      sed -ri 's/^\s*gpgcheck\s*=\s*0/gpgcheck=1/' /etc/yum.repos.d/FILE.repo

      If a repository has no signed packages, consult the vendor instead of disabling verification.
  - id: "CIS-RHEL8-1.2.1.3-repo_gpgcheck_global-attrs"
    name: "/etc/dnf/dnf.conf: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.2.1.3. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/dnf/dnf.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-a13f5fa04a |
      Package signatures protect individual packages, but not the repository metadata that tells the package manager which versions exist. Without metadata signature checking an attacker controlling a mirror or the network path can withhold security updates or offer outdated vulnerable packages that are still validly signed. Verifying metadata signatures closes that gap. Some repositories do not publish signed metadata, so enabling it globally may require per-repository exceptions.
    remediation: *rem-6893311621
  - id: "CIS-RHEL8-1.2.1.3-repo_gpgcheck_global-content"
    name: "/etc/dnf/dnf.conf has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.2.1.3. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/dnf/dnf.conf'
    allow_rc: any
    expect:
      - { some: "~ ^repo_gpgcheck=1" }
      - { none: "~ ^repo_gpgcheck=0" }
    rationale: *rat-a13f5fa04a
    remediation: &rem-8ad4bce9fb |
      Edit /etc/dnf/dnf.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^repo_gpgcheck=1
      - no line matches ^repo_gpgcheck=0
  - id: "CIS-RHEL8-1.2.1.3-repo_gpgcheck_repo"
    name: "repo gpgcheck repo: grep -E '^\\s*repo_gpgcheck\\s*=\\s*0' /etc/yum.repos.d/*.repo"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.2.1.3. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    timeout: 120000ms
    run: |
      grep -E '^\s*repo_gpgcheck\s*=\s*0' /etc/yum.repos.d/*.repo
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-ede943bafc |
      Besides individual packages, the repository metadata (package lists and checksums) can be signed. Verifying it protects against an attacker who serves stale or manipulated metadata, for example to withhold security updates. Repositories should not explicitly disable this verification; enabling it requires that the repository publishes signed metadata.
    remediation: &rem-14b2a0db29 |
      Do not disable repository metadata verification: in each listed FILE either set repo_gpgcheck=1 (written exactly like this, without spaces) for repositories that publish signed metadata, or delete the repo_gpgcheck=0 line.

      grep -Rn 'repo_gpgcheck' /etc/yum.repos.d/
      sed -i -E '/^\s*#?\s*repo_gpgcheck\s*=\s*0/d' FILE

      Only set repo_gpgcheck=1 if the repository provides a signed repomd.xml (repomd.xml.asc); otherwise yum or dnf can no longer load it. Amazon Linux 2 also flags commented-out repo_gpgcheck=0 lines, which the sed command removes as well.
  - id: "CIS-RHEL8-1.2.1.4-repos_configured"
    name: "repos configured: dnf repolist"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.2.1.4. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dnf repolist
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^appstream(-rpms|\\s)\\s+(AlmaLinux|Rocky Linux|Red Hat).*8.*- AppStream" }
      - { some: "~ ^baseos(-rpms|\\s)\\s+(AlmaLinux|Rocky Linux|Red Hat).*8.*- BaseOS" }
    rationale: &rat-70d1c99f9e |
      Systems should get packages and security fixes only from known, approved repositories. A missing or broken repository configuration prevents patching, while unknown repositories can introduce untrusted software. Depending on the platform the check verifies that the repository list can be read, that expected repositories are present, or asks for a manual review.
    remediation: &rem-f181846f51 |
      Make sure the system has working repositories from approved sources so that the repository listing succeeds. Review the configured repositories, enable the required ones and fix errors such as unreachable mirrors, proxy settings or a missing subscription.

      dnf repolist all
      dnf config-manager --set-enabled REPO
      subscription-manager register

      On RHEL 7 and Amazon Linux 2 use yum repolist all and yum-config-manager --enable REPO; subscription-manager is only used on RHEL. On Amazon Linux 2 the check expects the amzn2-core and amzn2extra-docker repositories (amazon-linux-extras enable docker). On RHEL 8 it expects the BaseOS and AppStream repositories.
  - id: "CIS-RHEL8-1.2.1.5-dnf_weak_deps-attrs"
    name: "/etc/dnf/dnf.conf: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.2.1.5. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/dnf/dnf.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1c6e216bca |
      By default dnf also installs weak dependencies (recommended packages). These add software that was not explicitly requested and therefore enlarge the attack surface and the patching workload. Disabling them keeps the installed package set minimal and deliberate.
    remediation: *rem-6893311621
  - id: "CIS-RHEL8-1.2.1.5-dnf_weak_deps-content"
    name: "/etc/dnf/dnf.conf has the expected content (1 rule)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.2.1.5. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/dnf/dnf.conf'
    allow_rc: any
    expect: { some: "~ install_weak_deps\\s*=\\s*(0|false|no)" }
    rationale: *rat-1c6e216bca
    remediation: &rem-c127659af2 |
      Edit /etc/dnf/dnf.conf so that its lines meet these conditions (regular expressions):

      - a line matches install_weak_deps\s*=\s*(0|false|no)
  - id: "CIS-RHEL8-1.2.2.1-security-updates"
    name: "security updates: dnf check-update"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.2.2.1. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      dnf check-update
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*(x86_64|386|noarch).*el8" }
    rationale: &rat-7cc1d8773a |
      Unpatched software is one of the most common ways systems are compromised. Installing available updates closes publicly known vulnerabilities before they can be exploited. The check reports a failure while updates are pending; on most platforms this includes non-security updates.
    remediation: &rem-bcb4a0c358 |
      Install all pending package updates; the check fails as long as any update is available, not only security updates.

      dnf upgrade

      On Amazon Linux 2 and RHEL 7 use yum update. Reboot if the kernel or core libraries were updated. On Amazon Linux 2023 dnf may also announce a newer release, which counts as pending; apply it with dnf upgrade --releasever=latest after testing.
  - id: "CIS-RHEL8-1.3.1.1-libselinux_installed"
    name: "Package libselinux is installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.3.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet libselinux
    expect: true
    rationale: &rat-91f7a8bd50 |
      libselinux provides the library interface that programs and tools use to work with SELinux. Without it SELinux cannot be managed or enforced, and the mandatory access control layer that confines services after a compromise is lost.
    remediation: &rem-9a0cee152e |
      Install the package libselinux:

      dnf install libselinux
  - id: "CIS-RHEL8-1.3.1.2-selinux_disabled_boot"
    name: "selinux disabled boot: grep \"^\\s*linux\" /boot/grub2/grubenv | grep -E \"(selinux=0|enforcing=0)\""
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "^\s*linux" /boot/grub2/grubenv | grep -E "(selinux=0|enforcing=0)"
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-09e36f9185 |
      SELinux can be switched off or set to permissive from the kernel command line with selinux=0 or enforcing=0. Such boot parameters override the configuration file and remove mandatory access control for all processes without it being obvious. Keeping them out of the boot configuration ensures SELinux starts as configured.
    remediation: &rem-2c0e091618 |
      Remove selinux=0 and enforcing=0 from the kernel command line of all boot entries and from the defaults used for new kernels, then regenerate the GRUB configuration.

      grubby --update-kernel=ALL --remove-args='selinux=0 enforcing=0'
      sed -i -E 's/[[:space:]]*\b(selinux|enforcing)=0\b//g' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      On Amazon Linux 2027 also remove these parameters from /etc/kernel/cmdline if that file exists. If SELinux was disabled until now, run touch /.autorelabel before rebooting so that files get correct labels.
  - id: "CIS-RHEL8-1.3.1.3-selinux_policy-attrs"
    name: "/etc/selinux/config: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.3.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/selinux/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-2fe59c1dc8 |
      The SELinux policy defines what each confined process may access. The targeted policy confines system and network-facing services; MLS adds multi-level security where required. Configuring a supported, maintained policy type ensures that a meaningful policy is loaded at boot.
    remediation: &rem-3c32e23d79 |
      Create /etc/selinux/config.
  - id: "CIS-RHEL8-1.3.1.3-selinux_policy-content"
    name: "/etc/selinux/config has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.3.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/selinux/config'
    allow_rc: any
    expect:
      - { some: "~ ^SELINUXTYPE( |)=( |)targeted" }
      - { none: "~ ^SELINUXTYPE( |)=( |)(permissive|disabled)" }
    rationale: *rat-2fe59c1dc8
    remediation: &rem-d37165dc39 |
      Edit /etc/selinux/config so that its lines meet these conditions (regular expressions):

      - a line matches ^SELINUXTYPE( |)=( |)targeted
      - no line matches ^SELINUXTYPE( |)=( |)(permissive|disabled)
  - id: "CIS-RHEL8-1.3.1.3-selinux_sestatus"
    name: "selinux sestatus: sestatus | grep 'Loaded policy'"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.3.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sestatus | grep 'Loaded policy'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ Loaded policy name:\\s+targeted" }
    rationale: &rat-bb1f5e169d |
      This check confirms that SELinux is active and has actually loaded the expected policy, rather than only being configured. Without a loaded policy, services run without mandatory access control and the compromise of one service is not contained.
    remediation: &rem-22a711895d |
      Enable SELinux with the targeted policy and reboot so that the policy gets loaded.

      dnf install selinux-policy-targeted
      sed -i -E 's/^\s*SELINUX\s*=.*/SELINUX=enforcing/; s/^\s*SELINUXTYPE\s*=.*/SELINUXTYPE=targeted/' /etc/selinux/config
      grubby --update-kernel=ALL --remove-args='selinux=0 enforcing=0'
      touch /.autorelabel
      reboot

      Use yum on Amazon Linux 2 and RHEL 7. RHEL 10 also accepts the mls policy. Relabeling can take long on large file systems; SELINUX=permissive for the first boot lets you review denials before enforcing.
  - id: "CIS-RHEL8-1.3.1.4-selinux_not_disabled-attrs"
    name: "/etc/selinux/config: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.3.1.4. NIST SP 800-53 Rev. 5: SC-3."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/selinux/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-fb4ff16ad2 |
      SELinux confines processes to the resources their policy allows, limiting what an attacker can do after exploiting a service. Disabling it in /etc/selinux/config removes this protection at the next boot and makes later re-enabling require a full filesystem relabel.
    remediation: *rem-3c32e23d79
  - id: "CIS-RHEL8-1.3.1.4-selinux_not_disabled-content"
    name: "/etc/selinux/config has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.3.1.4. NIST SP 800-53 Rev. 5: SC-3."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/selinux/config'
    allow_rc: any
    expect:
      - { some: "~ ^SELINUX\\s*=\\s*(enforcing|permissive)" }
      - { none: "~ ^SELINUX\\s*=\\s*disabled" }
    rationale: *rat-fb4ff16ad2
    remediation: &rem-8ec7178331 |
      Edit /etc/selinux/config so that its lines meet these conditions (regular expressions):

      - a line matches ^SELINUX\s*=\s*(enforcing|permissive)
      - no line matches ^SELINUX\s*=\s*disabled
  - id: "CIS-RHEL8-1.3.1.4-getenforce"
    name: "getenforce: getenforce"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.3.1.4. NIST SP 800-53 Rev. 5: SC-3."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      getenforce
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(Enforcing|Permissive)" }
      - { none: "~ ^Disabled" }
    rationale: &rat-f176d658b0 |
      SELinux confines services so that a compromised process can only access what its policy allows. getenforce shows the mode actually in effect; if it reports Disabled, no mandatory access control is applied regardless of the configuration file.
    remediation: &rem-d4a74f1569 |
      Enable SELinux in /etc/selinux/config, remove any selinux=0 or enforcing=0 kernel argument, schedule a full relabel and reboot.

      sed -ri 's/^\s*SELINUX\s*=.*/SELINUX=enforcing/' /etc/selinux/config
      grubby --update-kernel ALL --remove-args 'selinux=0 enforcing=0'
      touch /.autorelabel
      reboot

      Coming from Disabled, consider SELINUX=permissive first to find denials before switching to enforcing. The relabel can take a long time on large filesystems.
  - id: "CIS-RHEL8-1.3.1.5-selinux_enforcing-attrs"
    name: "/etc/selinux/config: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.3.1.5. NIST SP 800-53 Rev. 5: SC-3, SI-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/selinux/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ef8f54cc82 |
      In permissive mode SELinux only logs policy violations; only enforcing mode actually blocks them. Configuring enforcing mode persistently makes sure the mandatory access controls are applied after every boot.
    remediation: *rem-3c32e23d79
  - id: "CIS-RHEL8-1.3.1.5-selinux_enforcing-content"
    name: "/etc/selinux/config has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.3.1.5. NIST SP 800-53 Rev. 5: SC-3, SI-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/selinux/config'
    allow_rc: any
    expect:
      - { some: "~ ^SELINUX( |)=( |)enforcing" }
      - { none: "~ ^SELINUX( |)=( |)disabled" }
    rationale: *rat-ef8f54cc82
    remediation: &rem-46125c73bf |
      Edit /etc/selinux/config so that its lines meet these conditions (regular expressions):

      - a line matches ^SELINUX( |)=( |)enforcing
      - no line matches ^SELINUX( |)=( |)disabled
  - id: "CIS-RHEL8-1.3.1.5-getenforce_enforcing"
    name: "getenforce enforcing: getenforce"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.3.1.5. NIST SP 800-53 Rev. 5: SC-3, SI-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      getenforce
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Enforcing" }
    rationale: &rat-9984e79cdf |
      In enforcing mode SELinux actually blocks operations that violate the policy, confining compromised services and limiting lateral movement. In permissive mode violations are only logged, which is useful for troubleshooting but offers no protection. This check verifies that the running system is enforcing the policy.
    remediation: &rem-af4a2ae4b2 |
      Switch SELinux to enforcing at runtime and make it persistent; remove enforcing=0 or selinux=0 from the kernel command line if present:

      setenforce 1
      sed -i -E 's/^\s*SELINUX\s*=.*/SELINUX=enforcing/' /etc/selinux/config
      grubby --update-kernel ALL --remove-args "enforcing=0 selinux=0"

      If getenforce reports Disabled, setenforce does not work: set SELINUX=enforcing, run touch /.autorelabel and reboot. Review AVC denials (ausearch -m avc) before enforcing on production systems.
  - id: "CIS-RHEL8-1.3.1.6-selinux_unconfined"
    name: "selinux unconfined: ps -eZ | grep unconfined_service_t"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.3.1.6. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      ps -eZ | grep unconfined_service_t
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-a60d4dcb76 |
      Processes in the unconfined_service_t domain are services for which no SELinux policy applies, typically software installed outside the distribution packages. They run without SELinux restrictions, so a compromise of such a service is not contained. Every service should run in a confined domain or be reviewed and approved as an exception.
    remediation: &rem-491577d017 |
      Each listed process runs as an unconfined service. Identify its executable and give it a confined SELinux domain: restore the file context if a distribution service binary is mislabeled, or create and install a policy module for third-party software, then restart the service.

      ps -eZ | grep unconfined_service_t
      ls -Z BINARY
      restorecon -v BINARY
      sepolicy generate --init BINARY

      sepolicy generate (package policycoreutils-devel) creates a policy skeleton and a setup script; refine the module in permissive mode before enforcing it. Software that cannot be confined needs a documented exception.
  - id: "CIS-RHEL8-1.3.1.7-mctrans_removed"
    name: "Package mctrans is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.3.1.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet mctrans
    expect: false
    rationale: &rat-57d63cf66d |
      mcstransd translates SELinux security levels into human-readable labels and is only useful on systems that use MLS/MCS categories. On other systems it is an unnecessary daemon that processes requests and should not be installed.
    remediation: &rem-bb1d7c06ec |
      Remove the package mctrans, unless the system needs it:

      dnf remove mctrans
  - id: "CIS-RHEL8-1.3.1.8-setroubleshoot_removed"
    name: "Package setroubleshoot is not installed"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.3.1.8. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet setroubleshoot
    expect: false
    rationale: &rat-5cb69656e1 |
      setroubleshoot analyses SELinux denials and presents them to users, typically on desktops. On servers it is an unneeded service that runs with elevated privileges and has had vulnerabilities; denials can be analysed with the audit tools instead.
    remediation: &rem-299adb7a7b |
      Remove the package setroubleshoot, unless the system needs it:

      dnf remove setroubleshoot
  - id: "CIS-RHEL8-1.4.1-grub_bootpass-attrs"
    name: "/boot/grub2/user.cfg: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.4.1. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/boot/grub2/user.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-911a5447ea |
      Without a boot loader password, anyone with console access can edit kernel parameters at boot, for example to start a root shell or disable SELinux. Setting a hashed GRUB password in user.cfg, readable only by root, prevents unauthorised changes to boot entries.
    remediation: &rem-60591daf30 |
      Create /boot/grub2/user.cfg if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/boot/grub2/user.cfg'
      chmod u-xs,g-rwxs,o-rwx,a-t '/boot/grub2/user.cfg'
  - id: "CIS-RHEL8-1.4.1-grub_bootpass-content"
    name: "/boot/grub2/user.cfg has the expected content (1 rule)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.4.1. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/boot/grub2/user.cfg'
    allow_rc: any
    expect: { some: "~ ^GRUB2_PASSWORD=grub.pbkdf2.sha512." }
    rationale: *rat-911a5447ea
    remediation: &rem-396cfadda0 |
      Edit /boot/grub2/user.cfg so that its lines meet these conditions (regular expressions):

      - a line matches ^GRUB2_PASSWORD=grub.pbkdf2.sha512.
  - id: "CIS-RHEL8-1.4.2-boot_efi_mask"
    name: "/boot/efi is a separate mount with uid=0, gid=0, fmask=0077"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.4.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/boot/efi'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]uid=0(,|$)"
      - "~ [ ,]gid=0(,|$)"
      - "~ [ ,]fmask=0077(,|$)"
    rationale: &rat-531c193548 |
      The EFI system partition uses FAT, which has no Unix permissions; access is determined by mount options. Mounting it with uid=0, gid=0 and fmask=0077 makes boot loader files and their configuration readable and writable only by root, so unprivileged users cannot read or tamper with them.
    remediation: &rem-2a2bb3e507 |
      Mount /boot/efi with the options uid=0,gid=0,fmask=0077: add them to the options of /boot/efi in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/boot/efi'

      If /boot/efi is not a separate file system yet, create one first.
  - id: "CIS-RHEL8-1.5.1-core_size"
    name: "core size: grep -Psi -- '^\\s*hard\\s+core\\b' /etc/security/limits.conf /etc/security/limits.d/*"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.5.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\s*hard\s+core\b' /etc/security/limits.conf /etc/security/limits.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*conf:hard core 0" }
      - { none: "~ .*conf:hard core [1-9]" }
    rationale: &rat-f0b293c191 |
      Core dumps write a process's memory to disk and can contain passwords, keys and other sensitive data. A hard core size limit of 0 in the PAM limits configuration prevents user processes from producing core files, and users cannot raise a hard limit themselves.
    remediation: &rem-7e22a0850b |
      Set a hard core file size limit of 0 for all users in a file under /etc/security/limits.d/ and remove entries elsewhere that allow a larger hard limit:

      printf '%s\n' '* hard core 0' > /etc/security/limits.d/60-coredump.conf

      The limit applies to new login sessions.
  - id: "CIS-RHEL8-1.5.2-sysctl_hardlinks_conf"
    name: "sysctl hardlinks conf: grep -R fs.protected_hardlinks /etc/sysctl.conf /etc/sysctl.d/"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.5.2. NIST SP 800-53 Rev. 5: AC-3, AC-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -R fs.protected_hardlinks /etc/sysctl.conf /etc/sysctl.d/
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*conf:fs.protected_hardlinks\\s*=\\s*1" }
      - { none: "~ .*conf:fs.protected_hardlinks\\s*=\\s*0" }
    rationale: &rat-4553d28066 |
      With protected_hardlinks enabled, users can only create hard links to files they own or can read and write. This blocks a class of attacks where a hard link in a world-writable directory tricks a privileged program into overwriting or exposing a file it should not touch. This variant checks the persistent setting in /etc/sysctl.conf and /etc/sysctl.d/.
    remediation: &rem-9f1f02c9f6 |
      Set fs.protected_hardlinks to 1 in a file under /etc/sysctl.d/ and load the settings:

      printf '%s\n' 'fs.protected_hardlinks = 1' > /etc/sysctl.d/60-fs_protected_hardlinks.conf
      sysctl --system

      Remove or correct other lines setting fs.protected_hardlinks in /etc/sysctl.conf and /etc/sysctl.d/, because the check fails if any of them sets a different value.
  - id: "CIS-RHEL8-1.5.2-sysctl_hardlinks_live"
    name: "sysctl hardlinks live: sysctl fs.protected_hardlinks"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.5.2. NIST SP 800-53 Rev. 5: AC-3, AC-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl fs.protected_hardlinks
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ fs.protected_hardlinks\\s*=\\s*1" }
    rationale: &rat-5522afdcf7 |
      With protected_hardlinks enabled, users can only create hard links to files they own or can read and write. This blocks a class of attacks where a hard link in a world-writable directory tricks a privileged program into overwriting or exposing a file it should not touch. This variant checks the value currently active in the kernel.
    remediation: &rem-62f255bf5c |
      Set fs.protected_hardlinks to 1 in the running kernel and make it persistent:

      sysctl -w fs.protected_hardlinks=1
      printf '%s\n' 'fs.protected_hardlinks = 1' > /etc/sysctl.d/60-fs_protected_hardlinks.conf

      Check that no later file in /etc/sysctl.d/ or /etc/sysctl.conf sets a different value.
  - id: "CIS-RHEL8-1.5.3-sysctl_symlinks_conf"
    name: "sysctl symlinks conf: grep -R fs.protected_symlinks /etc/sysctl.conf /etc/sysctl.d/"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.5.3. NIST SP 800-53 Rev. 5: AC-3, AC-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -R fs.protected_symlinks /etc/sysctl.conf /etc/sysctl.d/
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*conf:fs.protected_symlinks\\s*=\\s*1" }
      - { none: "~ .*conf:fs.protected_symlinks\\s*=\\s*0" }
    rationale: &rat-117fceddc8 |
      With protected_symlinks enabled, symbolic links in world-writable sticky directories such as /tmp are only followed if the follower or the directory owner owns the link. This defeats classic symlink race attacks against privileged programs that write to temporary files. This variant checks the persistent setting in /etc/sysctl.conf and /etc/sysctl.d/.
    remediation: &rem-b3ac21cc82 |
      Set fs.protected_symlinks to 1 in a file under /etc/sysctl.d/ and load the settings:

      printf '%s\n' 'fs.protected_symlinks = 1' > /etc/sysctl.d/60-fs_protected_symlinks.conf
      sysctl --system

      Remove or correct other lines setting fs.protected_symlinks in /etc/sysctl.conf and /etc/sysctl.d/, because the check fails if any of them sets a different value.
  - id: "CIS-RHEL8-1.5.3-sysctl_symlinks_live"
    name: "sysctl symlinks live: sysctl fs.protected_symlinks"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 1.5.3. NIST SP 800-53 Rev. 5: AC-3, AC-6."
    tags: [cis, cis-rhel8, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      sysctl fs.protected_symlinks
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ fs.protected_symlinks\\s*=\\s*1" }
    rationale: &rat-2a2cb5be67 |
      With protected_symlinks enabled, symbolic links in world-writable sticky directories such as /tmp are only followed if the follower or the directory owner owns the link. This defeats classic symlink race attacks against privileged programs that write to temporary files. This variant checks the value currently active in the kernel.
    remediation: &rem-49b3e9f1b0 |
      Set fs.protected_symlinks to 1 in the running kernel and make it persistent:

      sysctl -w fs.protected_symlinks=1
      printf '%s\n' 'fs.protected_symlinks = 1' > /etc/sysctl.d/60-fs_protected_symlinks.conf

