      sshd uses the first value it reads, so remove or correct any HostbasedAuthentication line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-RHEL8-5.1.13-ssh_rhosts-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.1.13. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
