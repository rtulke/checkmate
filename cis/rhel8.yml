  - id: "CIS-RHEL8-5.4.1.1-max_days__etc_login.defs-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-0265be5e50 |
      A maximum password age limits how long a compromised password stays usable. PASS_MAX_DAYS in login.defs sets the default for newly created accounts; a value of 365 days or less ensures passwords are eventually changed, and -1 (never expires) is not allowed.
    remediation: &rem-0b6bdc1798 |
      Create /etc/login.defs.
  - id: "CIS-RHEL8-5.4.1.1-max_days__etc_login.defs-content"
    name: "/etc/login.defs has the expected content (3 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_MAX_DAYS\\s+365" }
      - { none: "~ ^PASS_MAX_DAYS\\s+(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9][0-9][0-9]|[1-9][0-9][0-9][0-9][0-9])" }
      - { none: "~ ^PASS_MAX_DAYS\\s+-1" }
    rationale: *rat-0265be5e50
    remediation: &rem-f1c03a2be4 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_MAX_DAYS\s+365
      - no line matches ^PASS_MAX_DAYS\s+(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9][0-9][0-9]|[1-9][0-9][0-9][0-9][0-9])
      - no line matches ^PASS_MAX_DAYS\s+-1
  - id: "CIS-RHEL8-5.4.1.1-check_users_MAX_DAYS"
    name: "check users MAX DAYS: awk -F: '/^[^:]+:[^!*]/ \u0026\u0026 (length($5) == 0 || $5 \u003c 1 || $5 \u003e 365) {print $1\":\"$5}' /etc/…"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '/^[^:]+:[^!*]/ && (length($5) == 0 || $5 < 1 || $5 > 365) {print $1":"$5}' /etc/shadow
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-ef3c15217c |
      Users should be warned several days before their password expires so they can change it in time instead of being locked out or choosing a weak replacement in a hurry. Most variants of this check verify a warning period of at least 7 days; the RHEL 8 variant verifies a maximum password age between 1 and 365 days, which limits how long a compromised password stays valid.
    remediation: &rem-d36ce4d250 |
      Set a password expiry warning of 7 days and, for RHEL 8, a maximum password age of 365 days or less, for new accounts and for each existing account with a password.

      sed -ri 's/^\s*PASS_WARN_AGE\s+.*/PASS_WARN_AGE 7/' /etc/login.defs
      sed -ri 's/^\s*PASS_MAX_DAYS\s+.*/PASS_MAX_DAYS 365/' /etc/login.defs
      chage --warndays 7 --maxdays 365 USER
  - id: "CIS-RHEL8-5.4.1.2-min_days__etc_login.defs-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-07438795a5 |
      A minimum password age prevents users from changing their password several times in a row to get around the password history and return to their old password. PASS_MIN_DAYS sets this default for new accounts.
    remediation: *rem-0b6bdc1798
  - id: "CIS-RHEL8-5.4.1.2-min_days__etc_login.defs-content"
    name: "/etc/login.defs has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 8 benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-rhel8, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
