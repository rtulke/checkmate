  - id: "CIS-DEBIAN12-5.4.1.6-passwd_chg_past"
    name: "No user has a last password change date in the future"
    description: "CIS Debian 12 benchmark recommendation 5.4.1.6. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian12, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      now=$(date +%s)
      for usr in $(cut -d: -f1 /etc/shadow); do
        d=$(chage --list "$usr" 2>/dev/null | awk -F': ' '/^Last password change/ {print $2}')
        case "$d" in ""|never|*"must be changed"*) continue ;; esac
        t=$(date -d "$d" +%s 2>/dev/null) || { echo "$usr: cannot parse last password change '$d'"; continue; }
        if [ "$t" -gt "$now" ]; then echo "$usr: last password change $d is in the future"; fi
      done
    expect: empty
    remediation: |
      Check the system clock, then set the last password change of every listed user to today, or expire the password so it must be changed at the next login:

      chage --lastday "$(date +%Y-%m-%d)" USER
      chage --lastday 0 USER
