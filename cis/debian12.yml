  - id: "CIS-DEBIAN12-5.4.2.8-secure_accts_valid_login"
    name: "secure accts valid login: l_valid_shells=\"^($(awk -F/ '$NF != \"nologin\" {print}' /etc/shells | sed -rn '/^\\//{s,/,\\…"
    description: "CIS Debian 12 benchmark recommendation 5.4.2.8. NIST SP 800-53 Rev. 5: AC-2, AC-3, AC-11, MP-2."
    tags: [cis, cis-debian12, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      l_valid_shells="^($(awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\/,g;p}' | paste -s -d '|' -))$"
      awk -v pat="$l_valid_shells" -F: '($1 != "root" && $(NF) !~ pat) {print $1}' /etc/passwd |
      while IFS= read -r l_user; do
      passwd -S "$l_user" | awk '$2 !~ /^L/ {print "Account: \"" $1 "\" does not have a valid login shell and is not locked"}'
      done
