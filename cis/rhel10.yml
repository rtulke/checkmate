  - id: "CIS-RHEL10-4.1.6-loopback_firewalld"
    name: "loopback firewalld: while IFS= read -r l_zone; do"
    description: "CIS Red Hat Enterprise Linux 10 benchmark recommendation 4.1.6. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel10, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      while IFS= read -r l_zone; do
      echo " - Zone: $l_zone"
      firewall-cmd --zone=$l_zone --list-rich-rules | \
      grep -P -- '(::1|127\.0\.0\.1)\b'
