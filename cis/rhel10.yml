    description: "CIS Red Hat Enterprise Linux 10 benchmark recommendation 1.4.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel10, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
