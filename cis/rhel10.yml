  - id: "CIS-RHEL10-5.1.1-sshd_config_perms-attrs"
    name: "/etc/ssh/sshd_config: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Red Hat Enterprise Linux 10 benchmark recommendation 5.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel10, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
  - id: "CIS-RHEL10-5.1.2-ssh_host_private_key_access"
    name: "ssh host private key access: l_ssh_group=\"\""
    description: "CIS Red Hat Enterprise Linux 10 benchmark recommendation 5.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-rhel10, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      l_ssh_group=""
      grep -Psiq -- '^\h*ID_LIKE="?([^#\n\r]+)?\bfedora\b' /etc/os-release 2>/dev/null && grep -Psq -- '^ssh_keys\b' /etc/group 2>/dev/null && l_ssh_group="ssh_keys"
      find -L /etc/ssh -xdev -type f 2>/dev/null | while IFS= read -r l_file; do
        grep -Eq -- '^-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' "$l_file" 2>/dev/null || continue
        ssh-keygen -lf "$l_file" >/dev/null 2>&1 || continue
        echo "checked: $l_file"
        stat -Lc '%#a:%U:%G' "$l_file" | while IFS=: read -r l_mode l_owner l_group; do
          if [ "$l_group" = "$l_ssh_group" ]; then l_mask="0137"; else l_mask="0177"; fi
          if [ $(( l_mode & l_mask )) -gt 0 ] || [ "$l_owner" != "root" ] || { [ "$l_group" != "$l_ssh_group" ] && [ "$l_group" != "root" ]; }; then
            echo "FAIL: $l_file mode $l_mode owner $l_owner group $l_group"
          fi
        done
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^checked: " }
      - { none: "~ ^FAIL:" }
