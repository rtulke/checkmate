    description: "CIS Red Hat Enterprise Linux 10 benchmark recommendation 7.2.8. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-rhel10, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      getent passwd {1000..60000} |  awk -F: '{ print $1  " "  $6 }' | while read user dir; do if [ $user != 'ftpd' ]; then owner=$(stat -L -c "%U" "$dir"); if [ "$owner" != "$user" ]; then echo "home dir for $user owned by $owner"; fi; fi; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
