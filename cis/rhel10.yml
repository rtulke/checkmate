  - id: "CIS-RHEL10-4.1.1-firewalld"
    name: "Package firewalld is installed"
    description: "CIS Red Hat Enterprise Linux 10 benchmark recommendation 4.1.1. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-rhel10, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet firewalld
    expect: true
  - id: "CIS-RHEL10-4.1.2-firewalld-attrs"
    name: "/etc/firewalld/firewalld.conf: exists"
    description: "CIS Red Hat Enterprise Linux 10 benchmark recommendation 4.1.2. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-rhel10, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/firewalld/firewalld.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
  - id: "CIS-RHEL10-4.1.2-firewalld-content"
    name: "/etc/firewalld/firewalld.conf has the expected content (2 rules)"
    description: "CIS Red Hat Enterprise Linux 10 benchmark recommendation 4.1.2. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-rhel10, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/firewalld/firewalld.conf'
    allow_rc: any
    expect:
      - { some: "~ ^FirewallBackend\\s*=\\s*nftables" }
      - { none: "~ ^FirewallBackend\\s*=\\s*iptables" }
  - id: "CIS-RHEL10-4.1.3-firewalld-enabled"
    name: "Service firewalld.service is enabled"
    description: "CIS Red Hat Enterprise Linux 10 benchmark recommendation 4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel10, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState firewalld.service | cut -d= -f2
    expect: "~ ^enabled"
  - id: "CIS-RHEL10-4.1.3-firewalld-running"
    name: "Service firewalld.service is running"
    description: "CIS Red Hat Enterprise Linux 10 benchmark recommendation 4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel10, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState firewalld.service | cut -d= -f2
    expect: "== active"
  - id: "CIS-RHEL10-4.1.4-active_firewalld"
    name: "active firewalld: for fw in `firewall-cmd --get-active-zones | grep -P -B 4  'interfaces: (?!lo|virbr)' | h…"
    description: "CIS Red Hat Enterprise Linux 10 benchmark recommendation 4.1.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel10, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      for fw in `firewall-cmd --get-active-zones | grep -P -B 4  'interfaces: (?!lo|virbr)' | head -n 1 | cut -d ' ' -f1`; do firewall-cmd --permanent --zone=$fw --get-target; done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ (?i)ACCEPT" }
      - { some: "~ (?i)(default|drop|reject)" }
  - id: "CIS-RHEL10-4.1.5-loopback_traffic_firewalld"
    name: "loopback traffic firewalld: firewall-cmd --list-all --zone=\"$(firewall-cmd --get-zone-of-interface=lo | xargs)\" | gre…"
    description: "CIS Red Hat Enterprise Linux 10 benchmark recommendation 4.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-rhel10, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      firewall-cmd --list-all --zone="$(firewall-cmd --get-zone-of-interface=lo | xargs)" | grep -B 1 target
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ trusted \\(active\\)" }
      - { some: "~ (trusted|public) \\(active\\)" }
