  - id: "CIS-RHEL10-6.2.1.2-tmpfile_creation"
    name: "tmpfile creation: config_files=(/etc/tmpfiles.d/systemd.conf /usr/lib/tmpfiles.d/systemd.conf)"
    description: "CIS Red Hat Enterprise Linux 10 benchmark recommendation 6.2.1.2. NIST SP 800-53 Rev. 5: AC-3, AU-2, AU-12, MP-2, SI-5."
    tags: [cis, cis-rhel10, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      config_files=(/etc/tmpfiles.d/systemd.conf /usr/lib/tmpfiles.d/systemd.conf)
      warn=()
      for file in "${config_files[@]}"; do
        [ -f "$file" ] || continue
        while read -r type path perm _; do
          if [[ "$type" == "f" && "$perm" =~ ^0?[0-7]{3,4}$ ]]; then
            perm="${perm#0}"
            if [ -f "$path" ]; then
              actual=$(stat -c "%a" "$path" 2>/dev/null)
              if [[ -n "$actual" && "$actual" -gt 640 ]]; then
                warn+=("File: $path | Perm: $actual (expected max: 640) | Defined in: $file")
              fi
            fi
          fi
        done < "$file"
      done
      if [ "${#warn[@]}" -eq 0 ]; then
        echo "No files with permissions more permissive than 0640."
      else
        echo -e "REVIEW needed"
        printf "%s\n" "${warn[@]}"
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^No files with permissions more permissive than 0640." }
      - { none: "~ \\sREVIEW needed" }
