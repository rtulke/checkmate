      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-8a79d83746 |
      PermitUserEnvironment lets users pass environment variables to sshd through their own files. Variables such as LD_PRELOAD can be used to bypass restrictions, for example forced commands. Disabling it keeps the session environment under administrative control.
    remediation: *rem-f6392187bb
