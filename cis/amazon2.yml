    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState firewalld | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-bcacc1250b |
      A host firewall only protects the system when it is active. firewalld has to be enabled so that it loads its rules at every boot, and running so that they are applied now.
    remediation: &rem-446eda8ec3 |
      Enable the service firewalld:

      systemctl enable firewalld
  - id: "CIS-AMAZON2-3.4.1.2-fw_fwd_fwd_running-running"
    name: "Service firewalld is running"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.1.2."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
