  - id: "CIS-AMAZON2-4.2.18-sshd_maxstartups-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.18. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
