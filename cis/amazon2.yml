    name: "false: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.4.2.5. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='false'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-cf8a8f9918 |
      Firewall rules that exist only in the running kernel are lost on reboot. A saved rules file ensures the configured packet filtering is restored when the system starts.
    remediation: &rem-e91e30c959 |
      Create false.
