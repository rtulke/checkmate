      yum remove samba
  - id: "CIS-AMAZON2-2.2.7-ftp_pkg"
    name: "Package vsftp is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.7. NIST SP 800-53 Rev. 5: CM-7."
