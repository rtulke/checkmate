    severity: medium
    run: |
      rpm -q --quiet vsftp
    expect: false
    rationale: &rat-7acf1c085d |
      FTP transfers credentials and data in clear text, and FTP servers are frequent attack targets. Unless the system is an approved FTP server, the server package should not be installed; SFTP or FTPS are secure alternatives.
    remediation: &rem-29da804144 |
      Remove the package vsftp, unless the system needs it:

      yum remove vsftp
  - id: "CIS-AMAZON2-2.2.8-cyrus_pkg"
    name: "Package cyrus-imapd is not installed"
