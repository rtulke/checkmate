      chmod u-xs,g-wxs,o-wx,a-t '/etc/group-'
  - id: "CIS-AMAZON2-6.1.5-etc_shadow_perms-attrs"
    name: "/etc/shadow: exists, mode 0000 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.1.5. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/shadow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7777)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-27546661c9 |
      /etc/shadow contains the password hashes of all accounts. If it is readable by unauthorised users, the hashes can be cracked offline; if it is writable, passwords can be replaced. It must be owned by root and allow no access to others.
    remediation: &rem-c814bda5a9 |
      Create /etc/shadow if it is missing, then set owner root and group root and remove the permissions u-rwxs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/shadow'
      chmod u-rwxs,g-rwxs,o-rwx,a-t '/etc/shadow'
  - id: "CIS-AMAZON2-6.1.6-etc_shadow-_perms-attrs"
    name: "/etc/shadow-: exists, mode 0000 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.1.6. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/shadow-'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7777)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-451a6369fc |
      /etc/shadow- is the backup copy of /etc/shadow and contains the same password hashes. It must be protected just as strictly to prevent offline cracking or manipulation of credentials.
    remediation: &rem-11c99aaf03 |
      Create /etc/shadow- if it is missing, then set owner root and group root and remove the permissions u-rwxs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/shadow-'
      chmod u-rwxs,g-rwxs,o-rwx,a-t '/etc/shadow-'
  - id: "CIS-AMAZON2-6.1.7-etc_gshadow-attrs"
    name: "/etc/gshadow: exists, mode 0000 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.1.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/gshadow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7777)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-810384ffaf |
      /etc/gshadow stores group passwords and the list of group administrators. Access by unauthorised users would allow cracking of group passwords or changes to group administration, so it must be owned by root with no access for others.
    remediation: &rem-d96c95bb87 |
      Create /etc/gshadow if it is missing, then set owner root and group root and remove the permissions u-rwxs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/gshadow'
      chmod u-rwxs,g-rwxs,o-rwx,a-t '/etc/gshadow'
  - id: "CIS-AMAZON2-6.1.8-etc_gshadow-_perms-attrs"
    name: "/etc/gshadow-: exists, mode 0000 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.1.8. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/gshadow-'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7777)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-49b1d49a70 |
      /etc/gshadow- is the backup copy of /etc/gshadow. It contains the same sensitive group password data and must be protected just as strictly.
    remediation: &rem-05c43a1cd1 |
      Create /etc/gshadow- if it is missing, then set owner root and group root and remove the permissions u-rwxs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/gshadow-'
      chmod u-rwxs,g-rwxs,o-rwx,a-t '/etc/gshadow-'
  - id: "CIS-AMAZON2-6.1.9-etc_shells_perms-attrs"
    name: "/etc/shells: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.1.9. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/shells'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-124d473497 |
      /etc/shells defines which shells are valid login shells. If others could modify it, they could add arbitrary programs as accepted shells and influence which accounts are allowed by services that rely on this list.
    remediation: &rem-118b2e8d3a |
      Create /etc/shells if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/shells'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/shells'
  - id: "CIS-AMAZON2-6.1.10-etc_security_opasswd_perms-attrs"
    name: "/etc/security/opasswd: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.1.10. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/security/opasswd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-c97f0a9796 |
      /etc/security/opasswd stores the hashes of previous passwords for the password history check. If it were readable by others, old hashes could be cracked and reveal password patterns; if writable, the history could be manipulated.
    remediation: &rem-919e703aea |
      Create /etc/security/opasswd if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/security/opasswd'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/security/opasswd'
  - id: "CIS-AMAZON2-6.1.11-world_writable"
    name: "world writable: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type d \\( -p…"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.1.11. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type d \( -perm -0002 -a ! -perm -1000 \) 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-9f0a5a248e |
      Files and directories that everyone can write to allow any user to alter data, plant malicious content or replace files that others rely on. World-writable directories without the sticky bit additionally let users delete or rename other users' files. Such permissions should be removed or justified.
    remediation: &rem-9b39034669 |
      Review each file and directory listed by the check. Remove world write access where it is not required, and set the sticky bit on directories that must stay world-writable so that users cannot delete each other's files.

      ls -ld PATH
      chmod o-w FILE
      chmod +t DIRECTORY

      Shared directories such as /tmp and /var/tmp need mode 1777; clarify with the owning application before changing other files.
  - id: "CIS-AMAZON2-6.1.12-no_ungrouped"
    name: "no ungrouped: df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nogroup"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.1.12. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nogroup
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-f90bfc406a |
      Files whose group ID does not correspond to any existing group are usually left over from deleted groups or unpacked archives. If a new group later receives that ID, its members automatically gain access to these files. Such files should be assigned to a valid group or removed.
    remediation: &rem-18d6a8b4fb |
      Review each file listed by the check and assign it to an appropriate existing group, or remove it if it is no longer needed.

      ls -ln FILE
      chgrp GROUP FILE
  - id: "CIS-AMAZON2-6.1.12-unowned_dirs"
    name: "unowned dirs: df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nouser"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.1.12. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nouser
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-ffe83ecc3b |
      Files whose owner (or group) ID does not correspond to any existing account are usually left over from deleted users or unpacked archives. If a new account later receives that ID, it automatically becomes the owner of these files. They should be assigned to a valid owner or removed.
    remediation: &rem-42672275f0 |
      Review each file listed by the check and assign it to an appropriate existing user and group, or remove it if it belonged to a deleted account and is no longer needed.

      ls -ln FILE
      chown USER:GROUP FILE
  - id: "CIS-AMAZON2-6.1.14-rpm_filecheck"
    name: "rpm filecheck: rpm -Va --nomtime --nosize --nomd5 --nolinkto \u003e /tmp/cis_rpmcheck; grep -vcw c /tmp/cis_r…"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.1.14. NIST SP 800-53 Rev. 5: AC-3, CM-1, CM-2, CM-6, CM-7, IA-5, MP-2."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    timeout: 120000ms
    run: |
      rpm -Va --nomtime --nosize --nomd5 --nolinkto > /tmp/cis_rpmcheck; grep -vcw c /tmp/cis_rpmcheck
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 0" }
    rationale: &rat-9f88d7b65b |
      Comparing installed files against the package database detects changed permissions, ownership or content of system files. Unexpected differences in files that are not configuration files can indicate tampering or a broken installation and should be investigated.
    remediation: &rem-582de1a1a5 |
      Review the package verification output and restore files that differ from the package without a legitimate reason: reset permissions and ownership, or reinstall the package if the content has changed.

      rpm -Va --nomtime --nosize --nomd5 --nolinkto | grep -vw c
      rpm -qf FILE
      rpm --setperms PACKAGE
      rpm --setugids PACKAGE
      yum reinstall PACKAGE

      Use dnf instead of yum on Amazon Linux 2023.
  - id: "CIS-AMAZON2-6.2.1-nopasswd_shadow"
    name: "nopasswd shadow: awk -F':' '($2 != \"x\") { print $1 }' /etc/passwd"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F':' '($2 != "x") { print $1 }' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-9a863c273d |
      Every account should either have a password hash stored in /etc/shadow or be explicitly locked. An empty password field allows logging in without credentials, and password hashes kept in the world-readable /etc/passwd can be cracked by any user.
    remediation: &rem-05e12bb74f |
      Make sure every account keeps its password in /etc/shadow and no account has an empty password field: move hashes from /etc/passwd to /etc/shadow with pwconv, then lock or set a password for every account the check reports.

      pwconv
      awk -F: '($2 == "") {print $1}' /etc/shadow
      usermod -L USER
      passwd USER
  - id: "CIS-AMAZON2-6.2.2-notempty_passwd_shadow"
    name: "notempty passwd shadow: awk -F':' '($2 == \"\") { print $1 }' /etc/passwd"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F':' '($2 == "") { print $1 }' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-5e712f6341 |
      An empty password field in /etc/passwd means that the account can be used without a password and bypasses the protected shadow file. Every account should have x in this field, with its hash or lock marker kept in /etc/shadow.
    remediation: &rem-adaa3325e4 |
      Move the password fields to /etc/shadow with pwconv, then lock or set a password for every account the check reported.

      pwconv
      usermod -L USER
      passwd USER
  - id: "CIS-AMAZON2-6.2.3-passwd_group_exist"
    name: "passwd group exist: comm -23 \u003c(awk -F: '{print $4}' /etc/passwd | sort -u) \u003c(awk -F: '{print $3}' /etc/group …"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      comm -23 <(awk -F: '{print $4}' /etc/passwd | sort -u) <(awk -F: '{print $3}' /etc/group  | sort -u)
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-a6fe2c7421 |
      Every primary group referenced in /etc/passwd should exist in /etc/group. Undefined group IDs usually result from manual edits or deleted groups; if the ID is reused later, the new group's members gain access to the affected users' files.
    remediation: &rem-ac0bde3f41 |
      For every user reported by the check, create the missing group with the referenced GID or assign the user an existing primary group.

      grpck -r
      groupadd -g GID GROUP
      usermod -g GROUP USER

      Changing the primary group does not change the ownership of existing files; adjust them if necessary.
  - id: "CIS-AMAZON2-6.2.4-no_dup_uid"
    name: "no dup uid: cat /etc/passwd | cut -d: -f3 | uniq -d"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.4. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/passwd | cut -d: -f3 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-92a5e740a2 |
      The kernel identifies users by UID, not by name. Several accounts with the same UID share all file ownerships and privileges and cannot be told apart in logs, which undermines accountability.
    remediation: &rem-3997dd9dfb |
      Review every duplicate UID reported by the check, give each account its own UID and assign the files of the former shared UID deliberately.

      awk -F: '($3 == UID) {print $1}' /etc/passwd
      usermod -u NEWUID USER
      find / -xdev -user UID -ls

      usermod adjusts only the home directory; other files owned by the old UID stay with the account that keeps it.
  - id: "CIS-AMAZON2-6.2.5-no_dup_gid"
    name: "no dup gid: cat /etc/group | cut -d: -f3 | uniq -d"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/group | cut -d: -f3 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-1c1a4afdb8 |
      Groups are identified by GID. Several groups with the same GID share all group permissions, so membership in one silently grants the access rights of the other.
    remediation: &rem-6a315abc33 |
      Review every duplicate GID reported by the check, give each group its own GID and assign the files of the former shared GID deliberately.

      awk -F: '($3 == GID) {print $1}' /etc/group
      groupmod -g NEWGID GROUP
      find / -xdev -group GID -ls

      Files owned by the old GID are not changed automatically; adjust them where they belong to the renumbered group.
  - id: "CIS-AMAZON2-6.2.6-no_dup_username"
    name: "no dup username: cat /etc/passwd | cut -d: -f1 | uniq -d"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.6. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/passwd | cut -d: -f1 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-48bf65be3b |
      Duplicate user names in /etc/passwd make it unpredictable which entry is used for login and which UID a name resolves to. This can lead to wrong file ownership and confusing audit trails.
    remediation: &rem-e93b096dcd |
      Review the duplicate entries for every user name reported by the check and remove or rename the surplus entry in /etc/passwd and /etc/shadow with the locking editors.

      grep -n '^USER:' /etc/passwd
      pwck -r
      vipw
      vipw -s
  - id: "CIS-AMAZON2-6.2.7-no_dup_groupname"
    name: "no dup groupname: cat /etc/group | cut -d: -f1 | uniq -d"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.7. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/group | cut -d: -f1 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-5dd470fed7 |
      Duplicate group names in /etc/group make it unpredictable which GID a group name resolves to. This can lead to wrong access rights when files or memberships are assigned by name.
    remediation: &rem-c9a5680ce7 |
      Review the duplicate entries for every group name reported by the check and remove or rename the surplus entry in /etc/group and /etc/gshadow with the locking editors.

      grep -n '^GROUP:' /etc/group
      grpck -r
      vigr
      vigr -s
  - id: "CIS-AMAZON2-6.2.8-root_path_check"
    name: "root path check: /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e…"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.8. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e 's/:/\n/g'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ \\\\." }
    rationale: &rat-ee503b897e |
      If root's PATH contains the current directory, empty entries, relative paths or directories that other users can write to, a malicious program placed there can be executed with root privileges when an administrator types a common command name. Root's PATH should contain only absolute, root-owned and non-writable directories.
    remediation: &rem-0afab9f1f3 |
      Remove the current directory (.), empty entries (leading, trailing or double colons), relative paths and non-existent directories from root's PATH, and make sure every remaining directory is owned by root and not writable by group or others. Look for PATH assignments in root's and the system-wide shell startup files.

      su - root -c 'echo "$PATH"'
      grep -sn 'PATH' /root/.bash_profile /root/.bashrc /root/.profile /etc/profile /etc/bashrc /etc/bash.bashrc /etc/environment /etc/profile.d/*.sh
      chown root DIRECTORY
      chmod go-w DIRECTORY
  - id: "CIS-AMAZON2-6.2.9-uid_0_check"
    name: "uid 0 check: awk -F: '($3 == 0) { print $1 }' /etc/passwd"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.9. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3 == 0) { print $1 }' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root" }
    rationale: &rat-90d4d66c1b |
      Any account with UID 0 has full root privileges, regardless of its name. Additional UID 0 accounts are a classic backdoor and make it impossible to attribute administrative actions; only root should have UID 0.
    remediation: &rem-5c4a8fc9e4 |
      Make sure that only root has UID 0. Find out what every other UID 0 account is used for, then give it a unique non-zero UID with vipw or remove it.

      awk -F: '($3 == 0) {print $1}' /etc/passwd
      vipw
      userdel USER

      usermod -u cannot be used here because the running root processes share UID 0. Also make sure that root itself has UID 0.
  - id: "CIS-AMAZON2-6.2.10-home_dirs_exist"
    name: "home dirs exist: pwck -r | grep -Ev \"journal|ftp|rngd|ec2-instance-connect\" | grep \"does not exist\""
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.10. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pwck -r | grep -Ev "journal|ftp|rngd|ec2-instance-connect" | grep "does not exist"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-93950236f2 |
      An account whose home directory does not exist gets / as its working directory at login, and some programs then try to create files in unexpected places. Missing home directories also indicate stale accounts. Every account, and in particular every interactive one, should have an existing home directory.
    remediation: &rem-16e7619e2c |
      Create the missing home directory for every account listed by the check with the correct owner and mode, or point the account to an existing directory if it does not need its own home. On several platforms the check also lists system accounts; for those, review whether the account is still needed and prefer usermod -d to an existing directory over creating new directories.

      mkdir -p HOMEDIR
      chown USER: HOMEDIR
      chmod 750 HOMEDIR
      usermod -d EXISTINGDIR USER

      On RHEL 7 the check also requires that home directories of users with UID 1000 to 60000 have mode 750 or 700. On Ubuntu 18.04 every finding of pwck -r fails the check, not only missing home directories.
  - id: "CIS-AMAZON2-6.2.10-home_dirs_owned"
    name: "home dirs owned: getent passwd {1000..60000} | \\"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.10. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      getent passwd {1000..60000} | \
      awk -F: '{ print $1  " "  $6 }' | \
      while read user dir; do
        if [ $user != 'ftpd' ]; then
          owner=$(stat -L -c "%U" "$dir");
          if [ "$owner" != "$user" ]; then
            echo "home dir for $user owned by $owner";
          fi;
        fi;
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-d265418053 |
      A user should own their home directory. If another account owns it, that account controls the user's files, startup scripts and SSH keys and can manipulate them to run code as the user.
    remediation: &rem-9804bc2d06 |
      Make each listed user the owner of their home directory after confirming that the directory really belongs to that user.

      ls -ld HOMEDIR
      chown USER HOMEDIR
  - id: "CIS-AMAZON2-6.2.10-home_dirs_restrict"
    name: "home dirs restrict: for i in $(getent passwd {1000..60000} | awk -F: '{print $6}'); do"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.10. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      for i in $(getent passwd {1000..60000} | awk -F: '{print $6}'); do
        stat -c "%a %n" "$i"
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 7[0,5]0\\s" }
    rationale: &rat-38c62d069f |
      Home directories hold private data, shell startup files and credentials such as SSH keys. Modes of 750 or 700 prevent other users from reading or modifying them while still allowing optional group access.
    remediation: &rem-b0aa30ee8d |
      Set the home directory of every interactive user to mode 750 or 700.

      awk -F: '($3 >= 1000 && $3 <= 60000) {print $6}' /etc/passwd | xargs -r stat -c '%a %n'
      chmod 750 HOMEDIR

      Set the default for new home directories as well (HOME_MODE in /etc/login.defs; DIR_MODE in /etc/adduser.conf on Debian and Ubuntu).
  - id: "CIS-AMAZON2-6.2.11-bash_history_perms"
    name: "bash history perms: find /home/ -name .bash_history -perm /go+rwx"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.11. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3>=1000)&&($7 !~ /(nologin|false)$/){print $6}' /etc/passwd | while read -r d; do
        if [ -d "$d" ]; then find "$d" -xdev -name .bash_history -perm /go+rwx 2>/dev/null || true; fi
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-422cb1e58d |
      .bash_history records the commands a user has typed, which can include passwords, host names or other sensitive arguments. It should be readable and writable only by its owner.
    remediation: &rem-53fd34913c |
      Restrict each .bash_history file listed by the check to its owner.

      chmod go-rwx FILE
  - id: "CIS-AMAZON2-6.2.11-dot_file_perms"
    name: "dot file perms: find /home/ -name \"\\.*\" -perm /g+w,o+w"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.11. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3>=1000)&&($7 !~ /(nologin|false)$/){print $6}' /etc/passwd | while read -r d; do
        if [ -d "$d" ]; then find "$d" -xdev -name "\.*" -perm /g+w,o+w 2>/dev/null || true; fi
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-b99f900519 |
      Files such as .bashrc, .profile or .ssh are executed or trusted when the user logs in. If group or other users can write to them, they can insert commands that run with the victim's privileges at the next login.
    remediation: &rem-2ca3c0e9f1 |
      Remove write access for group and others from each dot file or directory listed by the check, after confirming that it is not intentionally shared.

      ls -ld FILE
      chmod go-w FILE
  - id: "CIS-AMAZON2-6.2.11-dot_files_that_should_not_exist"
    name: "dot files that should not exist: find /home/ \\( -name '.netrc' -o -name '.forward' -o -name '.rhosts' \\)"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.2.11. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3>=1000)&&($7 !~ /(nologin|false)$/){print $6}' /etc/passwd | while read -r d; do
        if [ -d "$d" ]; then find "$d" -xdev \( -name '.netrc' -o -name '.forward' -o -name '.rhosts' \) 2>/dev/null || true; fi
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-ef3bcd6ea3 |
      .rhosts enables password-less access through the legacy r-commands, .netrc often stores plaintext credentials for FTP and other services, and .forward can redirect mail or run programs. These files in user home directories create hidden access paths and credential leaks.
    remediation: &rem-2b0512ac13 |
      Review each listed .netrc, .forward or .rhosts file with its owner, move any function that is still needed to a safer mechanism, and then remove the file.

      cat FILE
      rm FILE

      Treat credentials found in a .netrc file as exposed and change them.
