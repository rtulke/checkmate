    remediation: &rem-b9e3ac8490 |
      Edit /etc/sudoers so that its lines meet these conditions (regular expressions):

      - a line matches ^Defaults.*\suse_pty
  - id: "CIS-AMAZON2-4.3.2-pty_sudoers_d"
    name: "pty sudoers d: ls -1 /etc/sudoers.d/* \u003e /dev/null 2\u003e\u00261; if [ '$?' = '0' ]; then grep -c '^Defaults.*\\sus…"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.3.2. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      ls -1 /etc/sudoers.d/* > /dev/null 2>&1; if [ '$?' = '0' ]; then grep -c '^Defaults.*\suse_pty' /etc/sudoers.d/*; else echo 99;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ [0-99]" }
    rationale: *rat-63218cca98
    remediation: &rem-bf550576ff |
      Enable use_pty with a line of its own in a file under /etc/sudoers.d/, remove any Defaults !use_pty setting and validate the syntax.

      echo 'Defaults use_pty' > /etc/sudoers.d/50-use_pty
      chmod 0440 /etc/sudoers.d/50-use_pty
      grep -rnE '^\s*Defaults.*!use_pty' /etc/sudoers /etc/sudoers.d/
      visudo -c

      sudo ignores files in /etc/sudoers.d/ whose names contain a dot or end with ~.
  - id: "CIS-AMAZON2-4.3.3-sudoers_log_setting-attrs"
    name: "/etc/sudoers: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.3.3. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/sudoers'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-73ffb83e75 |
      A dedicated sudo log file records every sudo invocation with user, terminal, working directory and command. That makes privileged activity easy to review and keeps the record separate from general system logs.
    remediation: *rem-b6090d151e
  - id: "CIS-AMAZON2-4.3.3-sudoers_log_setting-content"
    name: "/etc/sudoers has the expected content (1 rule)"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.3.3. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/sudoers'
    allow_rc: any
    expect: { some: "~ ^Defaults\\s+logfile=\"/var/log/sudo.log\"" }
    rationale: *rat-73ffb83e75
    remediation: &rem-8bf22c8e4e |
      Edit /etc/sudoers so that its lines meet these conditions (regular expressions):

      - a line matches ^Defaults\s+logfile="/var/log/sudo.log"
  - id: "CIS-AMAZON2-4.3.3-log_sudoers_d"
    name: "log sudoers d: grep -c '^Defaults logfile=/var/log/*.log' /etc/sudoers.d/.*/"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.3.3. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -c '^Defaults logfile=/var/log/*.log' /etc/sudoers.d/.*/
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ [1:99]" }
    rationale: *rat-73ffb83e75
    remediation: &rem-b7aaa6ded0 |
      Configure a dedicated sudo log file under /var/log in a Defaults line of its own and validate the syntax.

      echo 'Defaults logfile="/var/log/sudo.log"' > /etc/sudoers.d/50-logfile
      chmod 0440 /etc/sudoers.d/50-logfile
      visudo -c
  - id: "CIS-AMAZON2-4.3.4-nopasswd_sudoers_d"
    name: "nopasswd sudoers d: grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v \".*:#\""
    description: "CIS Amazon Linux 2 benchmark recommendation 4.3.4. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v ".*:#"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-eecb763928 |
      NOPASSWD lets users run commands with elevated privileges without entering their password. Anyone who gains access to such an account, or a process running as it, obtains root immediately. Requiring the password confirms the person and limits the impact of a hijacked session.
    remediation: &rem-a35cd5880e |
      Review every listed sudo rule with NOPASSWD and remove the tag (or the rule) unless a documented exception applies. Edit the files with visudo so syntax errors are caught.

      grep -rn NOPASSWD /etc/sudoers /etc/sudoers.d/
      visudo -f FILE

      Users who lose NOPASSWD need a password to use sudo. On cloud images the default user (for example via /etc/sudoers.d/90-cloud-init-users) often has none; set one first, or you may lose administrative access.
  - id: "CIS-AMAZON2-4.3.5-authenticate_sudoers"
    name: "authenticate sudoers: grep -r \"^[^#].*\\!authenticate\" /etc/sudoers*"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.3.5. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -r "^[^#].*\!authenticate" /etc/sudoers*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-0aa92719bf |
      The !authenticate option lets sudo run commands without asking for the user's password. Anyone who gets hold of an unlocked session or a compromised account of such a user can then act with elevated privileges without any further barrier. Requiring re-authentication for sudo keeps privilege escalation tied to knowledge of the password.
    remediation: &rem-f4fb208b6d |
      Remove the !authenticate option from every sudoers rule and Defaults line reported by the check. Edit each file with visudo so that the syntax is validated before it is saved.

      grep -rn '!authenticate' /etc/sudoers /etc/sudoers.d/
      visudo -f /etc/sudoers
      visudo -f /etc/sudoers.d/FILE

      Affected users will be asked for their password again when they use sudo.
  - id: "CIS-AMAZON2-4.3.6-sudo_timeout"
    name: "sudo timeout: sudo -V | grep \"Authentication timestamp timeout:\""
    description: "CIS Amazon Linux 2 benchmark recommendation 4.3.6."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sudo -V | grep "Authentication timestamp timeout:"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Authentication timestamp timeout: -1" }
      - { some: "~ Authentication timestamp timeout: ([5-9]|1[0-5])" }
    rationale: &rat-14f3ec7a75 |
      After a successful authentication, sudo caches the credentials for a while so that further commands do not ask for the password again. A long or unlimited cache lets anyone with access to an unattended terminal run privileged commands. Keeping the timeout at 15 minutes or less limits that window while staying practical for administrators.
    remediation: &rem-391bdc9433 |
      Set the sudo credential cache timeout to 15 minutes or less in a sudoers drop-in file, and remove larger or negative timestamp_timeout values from all other sudoers files.

      grep -rn 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/
      echo 'Defaults timestamp_timeout=15' > /etc/sudoers.d/50-timestamp-timeout
      chmod 0440 /etc/sudoers.d/50-timestamp-timeout
      visudo -c

      Write the value without spaces around the equals sign; the check searches for timestamp_timeout=VALUE literally.
  - id: "CIS-AMAZON2-4.3.7-su_restricted-attrs"
    name: "/etc/pam.d/su: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.3.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/su'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-6eefed9126 |
      Without restriction, every local user can try to become root or another user with su, which turns su into a tool for password guessing and lateral movement. Requiring membership in a dedicated group through pam_wheel limits su to explicitly authorised people and pushes everyone else towards sudo, which is better controlled and logged.
    remediation: &rem-d67efd69b0 |
      Create /etc/pam.d/su.
  - id: "CIS-AMAZON2-4.3.7-su_restricted-content"
    name: "/etc/pam.d/su has the expected content (1 rule)"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.3.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/su'
    allow_rc: any
    expect: { some: "~ ^auth\\s+required\\s+pam_wheel.so\\suse_uid" }
    rationale: *rat-6eefed9126
    remediation: &rem-cddcfe7ad8 |
      Edit /etc/pam.d/su so that its lines meet these conditions (regular expressions):

      - a line matches ^auth\s+required\s+pam_wheel.so\suse_uid
  - id: "CIS-AMAZON2-4.4.1.1-pam_latest"
    name: "pam latest: yum update pam"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.4.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      yum update pam
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^No packages marked for update" }
    rationale: &rat-bde862ac58 |
      PAM performs authentication for almost every login path on the system, so flaws in it directly weaken access control. Keeping the pam package at the latest vendor release ensures that known security fixes are applied.
    remediation: &rem-d04a230dde |
      Update the pam package to the latest version available in the configured repositories.

      yum update pam

      Running services keep the old libraries loaded until they are restarted; restart them or reboot after the update.
  - id: "CIS-AMAZON2-4.4.1.2-libpwquality_installed"
    name: "Package libpwquality is installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.4.1.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet libpwquality
    expect: true
    rationale: &rat-5781d359ee |
      libpwquality provides the pam_pwquality module and the rules for checking new passwords against length, complexity and dictionary requirements. Without it, password policies cannot be enforced when users change their passwords.
    remediation: &rem-da9915094e |
      Install the package libpwquality:

      yum install libpwquality
  - id: "CIS-AMAZON2-4.4.2.1.1-faillock_password_auth-attrs"
    name: "/etc/pam.d/password-auth: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.4.2.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/pam.d/password-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-3d2c94f936 |
      pam_faillock counts failed authentication attempts and temporarily locks the account after too many failures. Without it in the password-auth stack, remote services such as SSH allow unlimited password guessing. The preauth, authfail and account entries are all needed for the counting and locking to work.
    remediation: &rem-709240e3c2 |
      Create /etc/pam.d/password-auth.
