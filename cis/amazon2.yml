      chgrp root /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules

      On Amazon Linux 2027 the tools are located in /usr/bin and autrace is not checked; adjust the paths accordingly.
  - id: "CIS-AMAZON2-5.3.1-aide"
    name: "Package aide is installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.3.1. NIST SP 800-53 Rev. 5: AU-2."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet aide
    expect: true
    rationale: &rat-24b82fc810 |
      AIDE is a file integrity checker that records a baseline of files and later reports changes. It detects unauthorised modifications of binaries and configuration files that could indicate a compromise.
    remediation: &rem-e06a562748 |
      Install the package aide:

      yum install aide
  - id: "CIS-AMAZON2-5.3.2-aide_cron"
    name: "aide cron: grep -rs aide /etc/cron.* /etc/crontab /var/spool/cron/*"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.3.2. NIST SP 800-53 Rev. 5: AU-2."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -rs aide /etc/cron.* /etc/crontab /var/spool/cron/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { none: "~ ^#" }
    rationale: &rat-86b8cfeaea |
      A file integrity baseline is only useful if it is compared regularly. Scheduling AIDE checks ensures that unexpected changes to system files are reported automatically instead of remaining unnoticed until someone runs the check by hand.
    remediation: &rem-586580ed0b |
      Schedule a regular AIDE check with cron, for example daily in /etc/cron.d, after the AIDE database has been initialised (aide --init and moving aide.db.new.gz to aide.db.gz).

      echo '0 5 * * * root /usr/sbin/aide --check' > /etc/cron.d/aide
      chmod 0644 /etc/cron.d/aide

      A systemd timer would work as well, but this check only looks at cron files.
  - id: "CIS-AMAZON2-6.1.1-etc_passwd_perms-attrs"
    name: "/etc/passwd: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/passwd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-1a40203603 |
      /etc/passwd lists all accounts and must be readable by everyone, but only root may change it. Write access for other users would allow them to create accounts or change UIDs and shells and thereby gain root privileges.
    remediation: &rem-08cad6e3c2 |
      Create /etc/passwd if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/passwd'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/passwd'
  - id: "CIS-AMAZON2-6.1.2-etc_passwd-_perms-attrs"
    name: "/etc/passwd-: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/passwd-'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-ef15544310 |
      /etc/passwd- is the backup copy of /etc/passwd. It deserves the same protection as the original: if others could modify it, a manipulated version might be restored or used to infer account details.
    remediation: &rem-2fef363834 |
      Create /etc/passwd- if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/passwd-'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/passwd-'
  - id: "CIS-AMAZON2-6.1.3-etc_group_perms-attrs"
    name: "/etc/group: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/group'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-fdb1854a02 |
      /etc/group defines group memberships and thus many access rights. It must be readable by everyone but writable only by root; otherwise users could add themselves to privileged groups.
    remediation: &rem-acc5fa1d09 |
      Create /etc/group if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/group'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/group'
  - id: "CIS-AMAZON2-6.1.4-etc_group-_perms-attrs"
    name: "/etc/group-: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2 benchmark recommendation 6.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
