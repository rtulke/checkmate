      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/cron.allow'
  - id: "CIS-AMAZON2-4.1.1.8-etc_cron.deny-absent"
    name: "/etc/cron.deny does not exist"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.1.1.8. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      test -e '/etc/cron.deny' || test -L '/etc/cron.deny'
    expect: false
    rationale: &rat-5eedbdb2a2 |
      When cron access is controlled with cron.allow, a cron.deny file is at best ignored and at worst creates the impression that only listed users are blocked. Removing it leaves the allow list as the single, clear control.
    remediation: &rem-d780ede041 |
      Remove /etc/cron.deny, unless the system needs it:

      rm '/etc/cron.deny'
