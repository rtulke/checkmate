  - id: "CIS-AMAZON2-3.1.1-etc_default_grub-attrs"
    name: "/etc/default/grub: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f5e498d047 |
      /etc/default/grub defines the kernel command line used for new boot entries. Security settings such as enabling AppArmor, auditing processes that start before the audit daemon, and a sufficient audit backlog need to be set there so that they apply from early boot. Depending on the platform the check verifies these parameters.
    remediation: &rem-2d1523887c |
      Create /etc/default/grub.
  - id: "CIS-AMAZON2-3.1.1-etc_default_grub-content"
    name: "/etc/default/grub has the expected content (1 rule)"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect: { none: "~ (\\S+\\s(ipv6\\.disable=1.*)$)^GRUB_CMDLINE_LINUX=\"" }
    rationale: *rat-f5e498d047
    remediation: &rem-1e43886a65 |
      Edit /etc/default/grub so that its lines meet these conditions (regular expressions):

      - no line matches (\S+\s(ipv6\.disable=1.*)$)^GRUB_CMDLINE_LINUX="
  - id: "CIS-AMAZON2-3.1.1-ipv6_grub"
    name: "ipv6 grub: grep \"^\\s*linux\" /boot/grub2/grub.cfg | grep ipv6.disable=1"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep "^\s*linux" /boot/grub2/grub.cfg | grep ipv6.disable=1
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-61b150b685 |
      Disabling IPv6 with the ipv6.disable=1 kernel parameter removes the IPv6 stack entirely, which can break software expecting it and bypasses the sysctl settings used to control IPv6. This check expects IPv6 not to be switched off on the kernel command line; where IPv6 has to be off, the disable_ipv6 sysctl settings are used instead.
    remediation: &rem-d24eba26b5 |
      Remove ipv6.disable=1 from the kernel command line and regenerate the GRUB configuration. If IPv6 has to be off, disable it with the net.ipv6.conf.all.disable_ipv6 and net.ipv6.conf.default.disable_ipv6 sysctl settings instead.

      grubby --update-kernel=ALL --remove-args=ipv6.disable=1
      sed -i -E 's/[[:space:]]*\bipv6\.disable=1\b//g' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      A reboot is needed for the change to take effect.
  - id: "CIS-AMAZON2-3.1.2-iwconfig"
    name: "iwconfig: iwconfig"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.1.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      iwconfig
    expect: { rc: "== 127" }
    rationale: &rat-cdd85758db |
      Servers normally do not need wireless networking. An active wireless interface can connect the system to unauthorized networks or bridge around perimeter controls. The check treats a missing iwconfig command (no wireless tools installed) as an indication that wireless networking is not in use.
    remediation: &rem-b11e434d95 |
      The check passes when the iwconfig command is not available. Remove the wireless tools and turn off any wireless radios.

      yum remove wireless-tools
      nmcli radio all off

      nmcli is only available where NetworkManager is used.
  - id: "CIS-AMAZON2-3.1.3-bluetooth-pkg"
    name: "Package bluetooth is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.1.3. NIST SP 800-53 Rev. 5: CM-7."
