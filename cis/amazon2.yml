  - id: "CIS-AMAZON2-3.4.3.1-nftables"
    name: "Package nftables is installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.3.1. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet nftables
    expect: true
    rationale: &rat-059df58fe1 |
      Exactly one tool should manage the host firewall. Where nftables is the chosen firewall, its package has to be installed and its service enabled and running so the rule set is loaded at boot. Where firewalld is used instead, the nftables service must not run alongside it. The expected state therefore depends on the platform.
    remediation: &rem-129246cb46 |
      Install the package nftables:

      yum install nftables
  - id: "CIS-AMAZON2-3.4.3.2-iptables6_flushed"
    name: "iptables6 flushed: ip6tables -L"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.3.2. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      ip6tables -L
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-a267c2544c |
      When nftables manages the firewall, leftover ip6tables rules are applied in addition to it and make the effective filtering hard to understand or unintentionally open. Flushing the ip6tables rules ensures only the nftables rule set determines which IPv6 traffic is allowed.
    remediation: &rem-48b3c8c424 |
      When nftables is the firewall, remove all IPv6 rules and user-defined chains from ip6tables.

      ip6tables -F
      ip6tables -X
      ip6tables -Z

      If iptables-services is installed, also disable the ip6tables service (systemctl disable --now ip6tables) so saved rules are not loaded again at boot.
  - id: "CIS-AMAZON2-3.4.3.2-iptables_flushed"
    name: "iptables flushed: iptables -L"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.3.2. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      iptables -L
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-ec8b571f0c |
      When nftables manages the firewall, leftover iptables rules are applied in addition to it and make the effective filtering hard to understand or unintentionally open. Flushing the iptables rules ensures only the nftables rule set determines which traffic is allowed.
    remediation: &rem-4cb7a7667c |
      When nftables is the firewall, remove all IPv4 rules and user-defined chains from iptables.

      iptables -F
      iptables -X
      iptables -Z

      If iptables-services is installed, also disable the iptables service (systemctl disable --now iptables) so saved rules are not loaded again at boot.
  - id: "CIS-AMAZON2-3.4.3.3-nftables_tables_manual"
    name: "nftables tables manual: echo \" Manual Test for nft tables\""
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.3.3. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo " Manual Test for nft tables"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Manual" }
    rationale: &rat-50569b9987 |
      nftables rules are organized in tables; without a table no filtering takes place. A table for the host firewall is the prerequisite for the base chains and rules that actually restrict traffic.
    remediation: &rem-4c55f52596 |
      This is a manual check that always reports a failure. Verify that an nftables table for the host firewall exists, and create one if not.

      nft list tables
      nft create table inet filter

      Save the rule set to the file loaded by nftables.service (/etc/sysconfig/nftables.conf or a file it includes) to keep it after a reboot.
  - id: "CIS-AMAZON2-3.4.3.4-nftables_base_chain_manual"
    name: "nftables base chain manual: nft list ruleset | grep -E \"hook (input|forward|output)\""
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.3.4. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      nft list ruleset | grep -E "hook (input|forward|output)"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ type filter hook input" }
      - { some: "~ type filter hook forward" }
      - { some: "~ type filter hook output" }
    rationale: &rat-39947e041d |
      Base chains attach nftables rules to the kernel's netfilter hooks. Without base chains for the input, forward and output hooks, packets passing those points are not filtered at all.
    remediation: &rem-31d5774eaf |
      Create base chains for the input, forward and output hooks in the firewall table. Add rules for required traffic, such as SSH, before switching any chain policy to drop.

      nft create chain inet filter input '{ type filter hook input priority 0 ; }'
      nft create chain inet filter forward '{ type filter hook forward priority 0 ; }'
      nft create chain inet filter output '{ type filter hook output priority 0 ; }'

      On Amazon Linux 2023 and RHEL 9 this is a manual check that always reports a failure; review the chains with nft list ruleset. Save the rule set to the file loaded by nftables.service (/etc/sysconfig/nftables.conf or a file it includes) to keep it after a reboot.
  - id: "CIS-AMAZON2-3.4.3.5-nftables_loopback_manual"
    name: "nftables loopback manual: nft list ruleset | awk '/hook input/,/}/' | grep 'iif \"lo\" accept'"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.3.5. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      nft list ruleset | awk '/hook input/,/}/' | grep 'iif "lo" accept'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ iif \"lo\" accept" }
    rationale: &rat-5f4ecb891b |
      Local services often communicate over the loopback interface. Explicitly accepting loopback traffic keeps them working once the firewall's default policy drops everything else.
    remediation: &rem-30fbb06ab4 |
      Accept all traffic on the loopback interface in the input base chain, ahead of rules that drop traffic.

      nft insert rule inet filter input iif lo accept

      Adjust table and chain names to your rule set. Save the rule set to the file loaded by nftables.service (/etc/sysconfig/nftables.conf or a file it includes) to keep it after a reboot.
  - id: "CIS-AMAZON2-3.4.3.5-nftables_loopback_source"
    name: "nftables loopback source: nft list ruleset | awk '/hook input/,/}/' | grep 'ip saddr'"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.3.5. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      nft list ruleset | awk '/hook input/,/}/' | grep 'ip saddr'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ip saddr 127.0.0.0/8 counter.*drop" }
    rationale: &rat-4f708457cf |
      Packets with a loopback source address (127.0.0.0/8) can legitimately only arrive on the loopback interface. Seen on any other interface they are spoofed, typically to reach services that trust local connections. Dropping them closes that path.
    remediation: &rem-0f10e24ac3 |
      Drop packets in the input chain that claim a loopback source address but arrive on another interface. The rule has to come after the rule accepting loopback traffic.

      nft add rule inet filter input ip saddr 127.0.0.0/8 counter drop
      nft add rule inet filter input ip6 saddr ::1 counter drop

      Adjust table and chain names to your rule set. Save the rule set to the file loaded by nftables.service (/etc/sysconfig/nftables.conf or a file it includes) to keep it after a reboot.
  - id: "CIS-AMAZON2-3.4.3.6-nftables_outbound_manual"
    name: "nftables outbound manual: echo \" Manual Test for nftable outbound and established\""
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.3.6. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo " Manual Test for nftable outbound and established"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Manual" }
    rationale: &rat-8dd0138856 |
      Rules for outgoing and established connections let the host initiate approved connections and receive the replies while unsolicited inbound traffic is still dropped. Reviewing them against site policy avoids both an overly open firewall and broken connectivity.
    remediation: &rem-52c74e2a4d |
      This is a manual check that always reports a failure. Review the rules for outbound and established connections against site policy; a typical configuration allows new outbound connections and the replies to them.

      nft add rule inet filter input ct state established,related accept
      nft add rule inet filter output ct state new,related,established accept

      Save the rule set to the file loaded by nftables.service (/etc/sysconfig/nftables.conf or a file it includes) to keep it after a reboot.
  - id: "CIS-AMAZON2-3.4.3.7-nftables_default_deny_input"
    name: "nftables default deny input: systemctl --quiet is-enabled nftables.service \u0026\u0026 nft list ruleset | grep -E 'hook (input|…"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.3.7. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl --quiet is-enabled nftables.service && nft list ruleset | grep -E 'hook (input|forward|output)' | grep -v 'policy drop'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-becb708023 |
      A default policy of drop on the base chains discards every packet that no rule explicitly allows. Newly started or forgotten services are then not reachable by accident; only deliberately permitted traffic passes.
    remediation: &rem-b3b36e291d |
      Once rules for all required traffic exist, set the policy of the input and forward base chains (on Amazon Linux 2 also output) to drop and keep nftables.service enabled.

      nft chain inet filter input '{ policy drop ; }'
      nft chain inet filter forward '{ policy drop ; }'
      nft chain inet filter output '{ policy drop ; }'
      systemctl enable nftables

      Allow SSH first or you lock yourself out; a drop policy on output also needs rules for outgoing traffic. Save the rule set to the file loaded by nftables.service (/etc/sysconfig/nftables.conf or a file it includes) to keep it after a reboot.
  - id: "CIS-AMAZON2-3.4.3.8-nftables_running-enabled"
    name: "Service nftables is enabled"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.3.8. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState nftables | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-ba1868c729 |
      The nftables service loads the saved rule set at boot. It has to be enabled and active, otherwise the host comes up without firewall rules after a restart.
    remediation: &rem-a7f4e9945f |
      Enable the service nftables:

      systemctl enable nftables
  - id: "CIS-AMAZON2-3.4.3.8-nftables_running-running"
    name: "Service nftables is running"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.3.8. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState nftables | cut -d= -f2
    expect: "== active"
    rationale: *rat-ba1868c729
    remediation: &rem-573c13f02b |
      Start the service nftables:

      systemctl start nftables
  - id: "CIS-AMAZON2-3.4.3.9-nftables_rules_permenant"
    name: "nftables rules permenant: echo \" Manual Test for nft rule are permenant\""
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.3.9. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo " Manual Test for nft rule are permenant"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Manual" }
    rationale: &rat-10c737f03f |
      Rules added with the nft command exist only in memory and are lost on reboot. Storing the rule set in a file loaded by the nftables service ensures the firewall comes back with the same protection after every restart.
    remediation: &rem-d3a6b16054 |
      This is a manual check that always reports a failure. Make sure nftables.service loads the rule set at boot: save the current rules to a file, include it from the service's configuration and enable the service.

      nft list ruleset > /etc/nftables/nftables.rules
      echo 'include "/etc/nftables/nftables.rules"' >> /etc/sysconfig/nftables.conf
      systemctl enable nftables

      Add flush ruleset as the first line of the rules file so that reloading does not duplicate rules.
  - id: "CIS-AMAZON2-3.4.4.1.1-iptables_installed"
    name: "Package iptables is installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.4.1.1. NIST SP 800-53 Rev. 5: CA-9."
