    name: "/etc/issue.net: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.6.3. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
