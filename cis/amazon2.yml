    severity: medium
    run: |
      rpm -q --quiet cyrus-imapd
    expect: false
    rationale: &rat-61ec7117cc |
      Cyrus IMAP is a mail server. On systems that do not provide mailboxes it is an unnecessary network-facing service that adds attack surface and maintenance effort.
    remediation: &rem-ceeb4a6c04 |
      Remove the package cyrus-imapd, unless the system needs it:

      yum remove cyrus-imapd
  - id: "CIS-AMAZON2-2.2.8-dovecot_pkg"
    name: "Package dovecot is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.8. NIST SP 800-53 Rev. 5: CM-7."
