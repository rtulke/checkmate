    severity: medium
    run: |
      f='/etc/systemd/system/rpcbind.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: &rat-61bf89ab10 |
      rpcbind maps RPC program numbers to ports, discloses information about RPC services and has been abused for DDoS amplification. Masking the service ensures it cannot be started, manually or as a dependency, where the package must stay installed.
    remediation: &rem-de589ae8af |
      Create /etc/systemd/system/rpcbind.service if it is missing, then point the link to /dev/null:

      ln -sfn '/dev/null' '/etc/systemd/system/rpcbind.service'
  - id: "CIS-AMAZON2-2.2.12-rpcbind_socket_masked-attrs"
    name: "/etc/systemd/system/rpcbind.socket: exists, is a symbolic link, links to /dev/null"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.12. NIST SP 800-53 Rev. 5: CM-6, CM-7."
    tags: [cis, cis-amazon2, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/system/rpcbind.socket'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: &rat-f5ef43c80f |
      rpcbind can be started on demand through its socket unit. Masking rpcbind.socket, together with the service, ensures that an incoming connection or another unit cannot activate the RPC port mapper on systems that do not need it.
    remediation: &rem-258756eeff |
      Create /etc/systemd/system/rpcbind.socket if it is missing, then point the link to /dev/null:

      ln -sfn '/dev/null' '/etc/systemd/system/rpcbind.socket'
  - id: "CIS-AMAZON2-2.2.13-rsync_pkg"
    name: "Package rsync-daemon is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.13. NIST SP 800-53 Rev. 5: CM-6, CM-7."
    tags: [cis, cis-amazon2, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet rsync-daemon
    expect: false
