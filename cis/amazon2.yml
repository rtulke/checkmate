      Edit /etc/fstab so that its lines meet these conditions (regular expressions):

      - a line matches \s\/var\/log\/audit\s.*noexec
  - id: "CIS-AMAZON2-1.2.1-gpg_keys"
    name: "gpg keys: rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --\u003e %{summary}"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.2.1. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --> %{summary}
      '
    expect: { rc: "== 0" }
    rationale: &rat-4781e33879 |
      Package signatures are only meaningful if the keys used to verify them are the right ones. An unexpected or attacker-supplied key in the package manager's keyring lets packages signed with it install without warning. Reviewing the imported keys ensures that only vendor and approved repository keys are trusted.
    remediation: &rem-e2da82e641 |
      Import the distribution vendor's package signing key and remove any key that does not belong to an approved repository. List the installed keys first.

      rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --> %{summary}\n'
      rpm --import /etc/pki/rpm-gpg/KEYFILE
      rpm -e gpg-pubkey-VERSION-RELEASE

      The vendor keys ship in /etc/pki/rpm-gpg/, for example RPM-GPG-KEY-redhat-release on RHEL, RPM-GPG-KEY-amazon-linux-2 on Amazon Linux 2 and RPM-GPG-KEY-amazon-linux-2023 on Amazon Linux 2023. On Amazon Linux 2027 the check expects the Amazon Linux key with the fingerprint 37ce7c3833e5a33c4a1e4b0d5408eaa4b1e92e3d.
  - id: "CIS-AMAZON2-1.2.2-gpg_check_conf-attrs"
    name: "/etc/yum.conf: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.2.2. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/yum.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-4333cbd1b4 |
      With gpgcheck enabled, the package manager verifies each package's signature against trusted keys before installing it. This protects against tampered packages from compromised mirrors, man-in-the-middle attacks or misconfigured repositories. Enabling it in the main configuration makes it the default for every repository.
    remediation: &rem-33809dea50 |
      Create /etc/yum.conf.
  - id: "CIS-AMAZON2-1.2.2-gpg_check_conf-content"
    name: "/etc/yum.conf has the expected content (2 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.2.2. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/yum.conf'
    allow_rc: any
    expect:
      - { some: "~ ^gpgcheck\\s*=\\s*1" }
      - { none: "~ ^gpgcheck\\s*=\\s*0" }
    rationale: *rat-4333cbd1b4
    remediation: &rem-d472f2b543 |
      Edit /etc/yum.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^gpgcheck\s*=\s*1
      - no line matches ^gpgcheck\s*=\s*0
  - id: "CIS-AMAZON2-1.2.2-gpg_check_repo"
    name: "gpg check repo: if [[ $(grep -Ehw \"gpgcheck\\s*=\\s*0\" /etc/yum.repos.d/*) ]]; then echo FAIL; else echo PA…"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.2.2. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      if [[ $(grep -Ehw "gpgcheck\s*=\s*0" /etc/yum.repos.d/*) ]]; then echo FAIL; else echo PASS; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS" }
    rationale: &rat-b0f4f69ff9 |
      A repository definition can override the global setting and turn signature checking off for its packages. Any repository with gpgcheck disabled lets unsigned or tampered packages be installed silently, so signature checking needs to stay enabled for every configured repository.
    remediation: &rem-4675487d5a |
      Enable package signature checking in every repository definition: find the repositories that disable it and set gpgcheck=1 in each listed FILE.

      grep -RniwE '(pkg_)?gpgcheck\s*=\s*(0|false|no)' /etc/yum.repos.d/ /etc/distro.repos.d/ /etc/dnf/repos.override.d/ 2>/dev/null
      sed -i -E 's/^(\s*)(pkg_)?gpgcheck\s*=\s*(0|false|no)\b/\1\2gpgcheck=1/I' FILE

      Amazon Linux 2 also flags commented-out gpgcheck=0 lines; delete those too. Make sure the repository's signing key (gpgkey=) is available, otherwise installations from it fail.
  - id: "CIS-AMAZON2-1.2.3-repogpg_check_conf-attrs"
    name: "/etc/yum.conf: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.2.3. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/yum.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-01c076d8ad |
      Signature verification in the package manager is the basis for trusting both packages and repository content. This check ensures that gpgcheck=1 is set globally in /etc/yum.conf and not turned off there, so that unsigned or tampered packages are rejected by default for all repositories.
    remediation: *rem-33809dea50
  - id: "CIS-AMAZON2-1.2.3-repogpg_check_conf-content"
    name: "/etc/yum.conf has the expected content (2 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.2.3. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      cat '/etc/yum.conf'
    allow_rc: any
    expect:
      - { some: "~ ^gpgcheck\\s*=\\s*1" }
      - { none: "~ ^gpgcheck\\s*=\\s*0" }
    rationale: *rat-01c076d8ad
    remediation: *rem-d472f2b543
  - id: "CIS-AMAZON2-1.2.3-repo_gpgcheck_repo"
    name: "repo gpgcheck repo: if [[ $(grep -Eh \"repo_gpgcheck\\s*=\\s*0\" /etc/yum.repos.d/*) ]]; then echo FAIL; else ech…"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.2.3. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    timeout: 120000ms
    run: |
      if [[ $(grep -Eh "repo_gpgcheck\s*=\s*0" /etc/yum.repos.d/*) ]]; then echo FAIL; else echo PASS; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS" }
    rationale: &rat-ede943bafc |
      Besides individual packages, the repository metadata (package lists and checksums) can be signed. Verifying it protects against an attacker who serves stale or manipulated metadata, for example to withhold security updates. Repositories should not explicitly disable this verification; enabling it requires that the repository publishes signed metadata.
    remediation: &rem-14b2a0db29 |
      Do not disable repository metadata verification: in each listed FILE either set repo_gpgcheck=1 (written exactly like this, without spaces) for repositories that publish signed metadata, or delete the repo_gpgcheck=0 line.

      grep -Rn 'repo_gpgcheck' /etc/yum.repos.d/
      sed -i -E '/^\s*#?\s*repo_gpgcheck\s*=\s*0/d' FILE

      Only set repo_gpgcheck=1 if the repository provides a signed repomd.xml (repomd.xml.asc); otherwise yum or dnf can no longer load it. Amazon Linux 2 also flags commented-out repo_gpgcheck=0 lines, which the sed command removes as well.
  - id: "CIS-AMAZON2-1.2.4-repos_configured"
    name: "repos configured: yum repolist"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.2.4. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      yum repolist
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ amzn2-core\\/2\\/x86_64" }
      - { some: "~ amzn2extra-docker\\/2\\/x86_64" }
    rationale: &rat-70d1c99f9e |
      Systems should get packages and security fixes only from known, approved repositories. A missing or broken repository configuration prevents patching, while unknown repositories can introduce untrusted software. Depending on the platform the check verifies that the repository list can be read, that expected repositories are present, or asks for a manual review.
    remediation: &rem-f181846f51 |
      Make sure the system has working repositories from approved sources so that the repository listing succeeds. Review the configured repositories, enable the required ones and fix errors such as unreachable mirrors, proxy settings or a missing subscription.

      dnf repolist all
      dnf config-manager --set-enabled REPO
      subscription-manager register

      On RHEL 7 and Amazon Linux 2 use yum repolist all and yum-config-manager --enable REPO; subscription-manager is only used on RHEL. On Amazon Linux 2 the check expects the amzn2-core and amzn2extra-docker repositories (amazon-linux-extras enable docker). On RHEL 8 it expects the BaseOS and AppStream repositories.
  - id: "CIS-AMAZON2-1.2.5-security-updates"
    name: "security updates: yum check-update | grep -c amzn2-core"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.2.5. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      yum check-update | grep -c amzn2-core
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ 0" }
      - { none: "~ ^[1-9]" }
    rationale: &rat-7cc1d8773a |
      Unpatched software is one of the most common ways systems are compromised. Installing available updates closes publicly known vulnerabilities before they can be exploited. The check reports a failure while updates are pending; on most platforms this includes non-security updates.
    remediation: &rem-bcb4a0c358 |
      Install all pending package updates; the check fails as long as any update is available, not only security updates.

      dnf upgrade

      On Amazon Linux 2 and RHEL 7 use yum update. Reboot if the kernel or core libraries were updated. On Amazon Linux 2023 dnf may also announce a newer release, which counts as pending; apply it with dnf upgrade --releasever=latest after testing.
  - id: "CIS-AMAZON2-1.3.1-single_user_emer"
    name: "single user emer: grep /sbin/sulogin /usr/lib/systemd/system/emergency.service"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.3.1."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep /sbin/sulogin /usr/lib/systemd/system/emergency.service
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^ExecStart=-/bin/sh -c \"/sbin/sulogin; /usr/bin/systemctl --fail --no-block default" }
    rationale: &rat-cfff4b34a1 |
      Emergency mode provides a root shell for system repair. If it starts without authentication, anyone with console access can obtain root by booting into it. Running sulogin from the emergency unit makes the mode ask for the root password first.
    remediation: &rem-8dee025b72 |
      Make emergency mode ask for the root password: the ExecStart line of emergency.service must run sulogin. The unit shipped with systemd contains it; restore the file if it was changed.

      grep ExecStart /usr/lib/systemd/system/emergency.service
      rpm -V systemd
      yum reinstall systemd
      systemctl daemon-reload

      The expected line is: ExecStart=-/bin/sh -c "/sbin/sulogin; /usr/bin/systemctl --fail --no-block default". Local changes would normally go into a drop-in under /etc/systemd/system/emergency.service.d/, but the check only reads the file in /usr/lib/systemd/system/.
  - id: "CIS-AMAZON2-1.3.1-single_user_rescue"
    name: "single user rescue: grep /sbin/sulogin /usr/lib/systemd/system/rescue.service"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.3.1."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep /sbin/sulogin /usr/lib/systemd/system/rescue.service
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^ExecStart=-/bin/sh -c \"/sbin/sulogin; /usr/bin/systemctl --fail --no-block default" }
    rationale: &rat-44fba19a94 |
      Rescue mode provides a root shell for system repair. If it starts without authentication, anyone with console access can obtain root by booting into it. Running sulogin from the rescue unit makes the mode ask for the root password first.
    remediation: &rem-a88b0bfbd2 |
      Make rescue mode ask for the root password: the ExecStart line of rescue.service must run sulogin. The unit shipped with systemd contains it; restore the file if it was changed.

      grep ExecStart /usr/lib/systemd/system/rescue.service
      rpm -V systemd
      yum reinstall systemd
      systemctl daemon-reload

      The expected line is: ExecStart=-/bin/sh -c "/sbin/sulogin; /usr/bin/systemctl --fail --no-block default". Local changes would normally go into a drop-in under /etc/systemd/system/rescue.service.d/, but the check only reads the file in /usr/lib/systemd/system/.
  - id: "CIS-AMAZON2-1.4.1-kernel.randomize_va_space"
    name: "Kernel parameter kernel.randomize_va_space is 2"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.4.1. NIST SP 800-53 Rev. 5: CM-6, CM-6b."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sysctl -n kernel.randomize_va_space
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 2"
    rationale: &rat-5597c48019 |
      Address space layout randomization places the stack, heap, shared libraries and other memory regions at random addresses. This makes memory corruption exploits much harder because an attacker cannot predict where code or data is located. The value 2 enables full randomization, including the heap.
    remediation: &rem-a6e5efe9f8 |
      Set the kernel parameter kernel.randomize_va_space to 2, now and at boot:

      sysctl -w 'kernel.randomize_va_space=2'
      printf '%s\n' 'kernel.randomize_va_space = 2' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.randomize_va_space from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-AMAZON2-1.4.1-aslr_enabled_2"
    name: "aslr enabled 2: grep -h \"kernel\\.randomize_va_space\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.4.1. NIST SP 800-53 Rev. 5: CM-6, CM-6b."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -h "kernel\.randomize_va_space" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^kernel.randomize_va_space=2" }
    rationale: &rat-2872b53691 |
      Address space layout randomization places the stack, heap, shared libraries and other memory regions at random addresses, which makes memory corruption exploits much harder. The value 2 enables full randomization. Setting it in a sysctl configuration file ensures it is applied at every boot and not only at runtime.
    remediation: &rem-b364909f96 |
      Set kernel.randomize_va_space to 2 in a sysctl configuration file so it is applied at every boot, and apply it now. Write the line without spaces around the equals sign; some of the checks require that.

      printf '%s\n' 'kernel.randomize_va_space=2' > /etc/sysctl.d/60-kernel_sysctl.conf
      sysctl -w kernel.randomize_va_space=2

      Remove or correct any other kernel.randomize_va_space line in /etc/sysctl.conf and /etc/sysctl.d/.
  - id: "CIS-AMAZON2-1.4.2-ptrace_scope"
    name: "Kernel parameter kernel.yama.ptrace_scope is 1"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.4.2. NIST SP 800-53 Rev. 5: CM-6, CM-6b."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sysctl -n kernel.yama.ptrace_scope
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-31167829c6 |
      ptrace lets one process inspect and modify the memory of another. Unrestricted, any process can attach to all other processes of the same user, so one compromised program can read secrets such as passwords or agent keys from others. With Yama scope 1 only a parent may trace its descendants; non-root debuggers can then no longer attach to arbitrary running processes.
    remediation: &rem-1ac1532a42 |
      Set the kernel parameter kernel.yama.ptrace_scope to 1, now and at boot:

      sysctl -w 'kernel.yama.ptrace_scope=1'
      printf '%s\n' 'kernel.yama.ptrace_scope = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.yama.ptrace_scope from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-AMAZON2-1.4.2-ptrace_scope_conf"
    name: "ptrace scope conf: grep -h \"kernel\\.yama\\.ptrace_scope\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.4.2. NIST SP 800-53 Rev. 5: CM-6, CM-6b."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -h "kernel\.yama\.ptrace_scope" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^kernel.yama.ptrace_scope\\s*=\\s*1" }
    rationale: &rat-954d126291 |
      ptrace lets one process inspect and modify the memory of another, so a single compromised program could read secrets from other processes of the same user. Yama scope 1 restricts tracing to a process's own descendants. Setting it in a sysctl configuration file ensures the restriction is applied at every boot.
    remediation: &rem-129faf0e1c |
      Set kernel.yama.ptrace_scope to 1 in a sysctl configuration file so it is applied at every boot, and set it for the running kernel.

      printf '%s\n' 'kernel.yama.ptrace_scope = 1' > /etc/sysctl.d/60-ptrace.conf
      sysctl -w kernel.yama.ptrace_scope=1

      Remove other kernel.yama.ptrace_scope lines from /etc/sysctl.conf and /etc/sysctl.d/; the file read last wins. Non-root users can then no longer attach debuggers such as gdb or strace to processes they did not start.
  - id: "CIS-AMAZON2-1.4.3-core_dumps_procsizemax-attrs"
    name: "/etc/systemd/coredump.conf: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.4.3. NIST SP 800-53 Rev. 5: CM-6b."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/systemd/coredump.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-8a612fd2e9 |
      Core dumps contain the memory of a crashed process, which may include passwords, keys and other sensitive data. ProcessSizeMax=0 stops systemd-coredump from processing and storing cores, so such data is not left on disk. Developers who need cores for debugging can enable them temporarily.
    remediation: &rem-38adbe4ae3 |
      Create /etc/systemd/coredump.conf.
  - id: "CIS-AMAZON2-1.4.3-core_dumps_procsizemax-content"
    name: "/etc/systemd/coredump.conf has the expected content (1 rule)"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.4.3. NIST SP 800-53 Rev. 5: CM-6b."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/systemd/coredump.conf'
    allow_rc: any
    expect: { some: "~ ^ProcessSizeMax\\s*=\\s*0" }
    rationale: *rat-8a612fd2e9
    remediation: &rem-430090799d |
      Edit /etc/systemd/coredump.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^ProcessSizeMax\s*=\s*0
  - id: "CIS-AMAZON2-1.4.4-core_dumps_storage-attrs"
    name: "/etc/systemd/coredump.conf: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.4.4."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/systemd/coredump.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d1fd0f5138 |
      Core dumps contain the memory of a crashed process, which may include passwords, keys and other sensitive data. Storage=none makes systemd-coredump log the crash without keeping the dump on disk, so the data cannot be read later by someone with access to the dump files.
    remediation: *rem-38adbe4ae3
  - id: "CIS-AMAZON2-1.4.4-core_dumps_storage-content"
    name: "/etc/systemd/coredump.conf has the expected content (1 rule)"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.4.4."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/systemd/coredump.conf'
    allow_rc: any
    expect: { some: "~ ^Storage\\s*=\\s*none" }
    rationale: *rat-d1fd0f5138
    remediation: &rem-0320b18b93 |
      Edit /etc/systemd/coredump.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^Storage\s*=\s*none
  - id: "CIS-AMAZON2-1.5.1.1-libselinux"
    name: "Package libselinux is installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.5.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet libselinux
    expect: true
    rationale: &rat-d13f41f770 |
      libselinux provides the interfaces through which programs and tools interact with SELinux. Without it SELinux cannot be managed or work as intended, losing the mandatory access control layer that confines services even after they are compromised.
    remediation: &rem-2d7c2dc29c |
      Install the package libselinux:

      yum install libselinux
  - id: "CIS-AMAZON2-1.5.1.2-selinux_disabled_boot"
    name: "selinux disabled boot: grep \"^\\s*linux\" /boot/grub2/grub.cfg | grep -E \"(selinux=0|enforcing=0)\""
    description: "CIS Amazon Linux 2 benchmark recommendation 1.5.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep "^\s*linux" /boot/grub2/grub.cfg | grep -E "(selinux=0|enforcing=0)"
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-09e36f9185 |
      SELinux can be switched off or set to permissive from the kernel command line with selinux=0 or enforcing=0. Such boot parameters override the configuration file and remove mandatory access control for all processes without it being obvious. Keeping them out of the boot configuration ensures SELinux starts as configured.
    remediation: &rem-2c0e091618 |
      Remove selinux=0 and enforcing=0 from the kernel command line of all boot entries and from the defaults used for new kernels, then regenerate the GRUB configuration.

      grubby --update-kernel=ALL --remove-args='selinux=0 enforcing=0'
      sed -i -E 's/[[:space:]]*\b(selinux|enforcing)=0\b//g' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      On Amazon Linux 2027 also remove these parameters from /etc/kernel/cmdline if that file exists. If SELinux was disabled until now, run touch /.autorelabel before rebooting so that files get correct labels.
  - id: "CIS-AMAZON2-1.5.1.3-selinux_policy-attrs"
    name: "/etc/selinux/config: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.5.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/selinux/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-2fe59c1dc8 |
      The SELinux policy defines what each confined process may access. The targeted policy confines system and network-facing services; MLS adds multi-level security where required. Configuring a supported, maintained policy type ensures that a meaningful policy is loaded at boot.
    remediation: &rem-3c32e23d79 |
      Create /etc/selinux/config.
  - id: "CIS-AMAZON2-1.5.1.3-selinux_policy-content"
    name: "/etc/selinux/config has the expected content (1 rule)"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.5.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/selinux/config'
    allow_rc: any
    expect: { some: "~ SELINUXTYPE=targeted" }
    rationale: *rat-2fe59c1dc8
    remediation: &rem-bd9b4a15e6 |
      Edit /etc/selinux/config so that its lines meet these conditions (regular expressions):

      - a line matches SELINUXTYPE=targeted
  - id: "CIS-AMAZON2-1.5.1.3-selinux_sestatus"
    name: "selinux sestatus: sestatus | grep 'Loaded policy'"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.5.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sestatus | grep 'Loaded policy'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ Loaded policy name:\\s+targeted" }
    rationale: &rat-bb1f5e169d |
      This check confirms that SELinux is active and has actually loaded the expected policy, rather than only being configured. Without a loaded policy, services run without mandatory access control and the compromise of one service is not contained.
    remediation: &rem-22a711895d |
      Enable SELinux with the targeted policy and reboot so that the policy gets loaded.

      dnf install selinux-policy-targeted
      sed -i -E 's/^\s*SELINUX\s*=.*/SELINUX=enforcing/; s/^\s*SELINUXTYPE\s*=.*/SELINUXTYPE=targeted/' /etc/selinux/config
      grubby --update-kernel=ALL --remove-args='selinux=0 enforcing=0'
      touch /.autorelabel
      reboot

      Use yum on Amazon Linux 2 and RHEL 7. RHEL 10 also accepts the mls policy. Relabeling can take long on large file systems; SELINUX=permissive for the first boot lets you review denials before enforcing.
  - id: "CIS-AMAZON2-1.5.1.4-selinux_state_config-attrs"
    name: "/etc/selinux/config: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.5.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/selinux/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-5f314992d7 |
      Setting SELINUX to enforcing or permissive in /etc/selinux/config keeps SELinux enabled at boot. A disabled SELinux leaves all processes without mandatory access control and cannot be re-enabled without a reboot and relabeling of the file system.
    remediation: *rem-3c32e23d79
  - id: "CIS-AMAZON2-1.5.1.4-selinux_state_config-content"
    name: "/etc/selinux/config has the expected content (2 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.5.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/selinux/config'
    allow_rc: any
    expect:
      - { some: "~ SELINUX=(enforcing|permissive)" }
      - { none: "~ ^SELINUX\\s*=\\s*disabled" }
    rationale: *rat-5f314992d7
    remediation: &rem-eca57ed9ac |
      Edit /etc/selinux/config so that its lines meet these conditions (regular expressions):

      - a line matches SELINUX=(enforcing|permissive)
      - no line matches ^SELINUX\s*=\s*disabled
  - id: "CIS-AMAZON2-1.5.1.4-selinux_running_mode"
    name: "selinux running mode: getenforce"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.5.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      getenforce
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ [Dd]isabled" }
      - { some: "~ (Enforcing|Permissive)" }
    rationale: &rat-02dc949b67 |
      When SELinux is disabled it provides no protection and cannot be activated without a reboot and relabeling. In permissive or enforcing mode the kernel keeps security contexts up to date, and in enforcing mode it blocks policy violations, containing compromised services.
    remediation: &rem-09ac3cac9a |
      Enable SELinux in /etc/selinux/config (enforcing, or permissive while reviewing denials), remove boot parameters that disable it, relabel the file system and reboot. A disabled SELinux cannot be switched on at runtime.

      sed -i -E 's/^\s*SELINUX\s*=.*/SELINUX=enforcing/' /etc/selinux/config
      grubby --update-kernel=ALL --remove-args='selinux=0'
      touch /.autorelabel
      reboot
  - id: "CIS-AMAZON2-1.5.1.5-selinux_enforcing_config-attrs"
    name: "/etc/selinux/config: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.5.1.5. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/selinux/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-8af0aba9b8 |
      Only in enforcing mode does SELinux block actions that violate policy; permissive mode merely logs them. Configuring enforcing in /etc/selinux/config ensures the system boots with mandatory access control actively enforced.
    remediation: *rem-3c32e23d79
  - id: "CIS-AMAZON2-1.5.1.5-selinux_enforcing_config-content"
    name: "/etc/selinux/config has the expected content (2 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.5.1.5. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/selinux/config'
    allow_rc: any
    expect:
      - { some: "~ SELINUX\\s*=\\s*enforcing" }
      - { none: "~ ^SELINUX\\s*=\\s*disabled" }
    rationale: *rat-8af0aba9b8
    remediation: &rem-a658d0b00d |
      Edit /etc/selinux/config so that its lines meet these conditions (regular expressions):

      - a line matches SELINUX\s*=\s*enforcing
      - no line matches ^SELINUX\s*=\s*disabled
  - id: "CIS-AMAZON2-1.5.1.5-selinux_run_enforcing"
    name: "selinux run enforcing: getenforce"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.5.1.5. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      getenforce
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ Enforcing" }
    rationale: &rat-1ae7dcb016 |
      This check verifies that SELinux is enforcing at runtime. In permissive mode violations are only logged, so a compromised service would not be contained. Enforcing mode actually denies operations outside the policy.
    remediation: &rem-58c05c7e0f |
      Switch SELinux to enforcing now and in the configuration. Review recent denials first, since enforcing mode blocks what permissive mode only logged.

      ausearch -m avc -ts today
      setenforce 1
      sed -i -E 's/^\s*SELINUX\s*=.*/SELINUX=enforcing/' /etc/selinux/config

      If getenforce reports Disabled, setenforce has no effect: remove selinux=0 from the kernel command line, run touch /.autorelabel and reboot.
  - id: "CIS-AMAZON2-1.5.1.6-selinux_unconfined"
    name: "selinux unconfined: ps -eZ | grep unconfined_service_t"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.5.1.6. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      ps -eZ | grep unconfined_service_t
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-a60d4dcb76 |
      Processes in the unconfined_service_t domain are services for which no SELinux policy applies, typically software installed outside the distribution packages. They run without SELinux restrictions, so a compromise of such a service is not contained. Every service should run in a confined domain or be reviewed and approved as an exception.
    remediation: &rem-491577d017 |
      Each listed process runs as an unconfined service. Identify its executable and give it a confined SELinux domain: restore the file context if a distribution service binary is mislabeled, or create and install a policy module for third-party software, then restart the service.

      ps -eZ | grep unconfined_service_t
      ls -Z BINARY
      restorecon -v BINARY
      sepolicy generate --init BINARY

      sepolicy generate (package policycoreutils-devel) creates a policy skeleton and a setup script; refine the module in permissive mode before enforcing it. Software that cannot be confined needs a documented exception.
  - id: "CIS-AMAZON2-1.5.1.7-mcstrans"
    name: "Package mcstrans is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.5.1.7. NIST SP 800-53 Rev. 5: SI-4."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet mcstrans
    expect: false
    rationale: &rat-f702f7174c |
      mcstrans translates SELinux MCS/MLS security levels into readable names. Most systems do not need it, and like any unnecessary daemon it adds privileged code and attack surface. Removing it keeps the system minimal.
    remediation: &rem-1948db82b4 |
      Remove the package mcstrans, unless the system needs it:

      yum remove mcstrans
  - id: "CIS-AMAZON2-1.5.1.8-setroubleshoot"
    name: "Package setroubleshoot is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.5.1.8. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet setroubleshoot
    expect: false
    rationale: &rat-d9369ee205 |
      setroubleshoot analyses SELinux denials and presents them to users, mainly on desktops. On servers it is not needed, runs additional privileged code and can expose information about denials to unprivileged users. Denials remain available in the audit log without it.
    remediation: &rem-927ef0f80f |
      Remove the package setroubleshoot, unless the system needs it:

      yum remove setroubleshoot
  - id: "CIS-AMAZON2-1.6.1-motd-attrs"
    name: "/etc/motd: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.6.1. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/motd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-94ce4a67af |
      The message of the day is shown to users after login. It should carry the organization's usage policy, not details such as operating system name, version or architecture that help attackers select exploits. The file should be owned by root and not writable by others, so that unprivileged users cannot change what is displayed.
    remediation: &rem-cc50883ec8 |
      Create /etc/motd if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/motd'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/motd'
  - id: "CIS-AMAZON2-1.6.1-motd-content"
    name: "/etc/motd has the expected content (2 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.6.1. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/motd'
    allow_rc: any
    expect:
      - { none: "~ (?i)(amazon|centos|fedora|redhat|linux)" }
      - { none: "~ x86_64" }
    rationale: *rat-94ce4a67af
    remediation: &rem-6274c86278 |
      Edit /etc/motd so that its lines meet these conditions (regular expressions):

      - no line matches (?i)(amazon|centos|fedora|redhat|linux)
      - no line matches x86_64
  - id: "CIS-AMAZON2-1.6.2-etc_issue-attrs"
    name: "/etc/issue: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.6.2. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-4d2717dc87 |
      /etc/issue is shown before local logins. It should present a usage or legal warning and not reveal operating system names, versions or architecture that help attackers. The file should be owned by root and not writable by others, so the message cannot be altered.
    remediation: &rem-683e1f474b |
      Create /etc/issue if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

