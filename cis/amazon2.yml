  - id: "CIS-AMAZON2-5.2.3.14-auditd_MAC_cnf"
    name: "auditd MAC cnf: grep MAC-policy /etc/audit/rules.d/*.rules"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.3.14. NIST SP 800-53 Rev. 5: NA."
