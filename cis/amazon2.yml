  - id: "CIS-AMAZON2-3.4.1.2-fw_fwd_ipt_masked-attrs"
    name: "/etc/systemd/system/iptables.service: exists, is a symbolic link, links to /dev/null"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.1.2."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/system/iptables.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: &rat-75d2cd139f |
      When firewalld manages the firewall, a second rule loader such as the iptables service would create conflicting rules. Masking iptables.service ensures that it cannot be started, manually or as a dependency of another unit.
    remediation: &rem-66e5912e8c |
      Create /etc/systemd/system/iptables.service if it is missing, then point the link to /dev/null:

      ln -sfn '/dev/null' '/etc/systemd/system/iptables.service'
  - id: "CIS-AMAZON2-3.4.1.2-fw_fwd_nft_masked-attrs"
    name: "/etc/systemd/system/nftables.service: exists, is a symbolic link, links to /dev/null"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.1.2."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/system/nftables.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: &rat-c7ace0fbd9 |
      When firewalld manages the firewall, the nftables service would load a second, conflicting rule set. Masking nftables.service ensures that it cannot be started, manually or as a dependency of another unit.
    remediation: &rem-de57692453 |
      Create /etc/systemd/system/nftables.service if it is missing, then point the link to /dev/null:

      ln -sfn '/dev/null' '/etc/systemd/system/nftables.service'
  - id: "CIS-AMAZON2-3.4.2.1-fwd_firewalld_installed"
    name: "Package firewalld is installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.2.1. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet firewalld
    expect: true
    rationale: &rat-24e32dbf8b |
      A host firewall limits which network services can be reached and from where. firewalld manages these rules with zones and services; it has to be installed when it is the chosen firewall.
    remediation: &rem-45b06fcae8 |
      Install the package firewalld:

      yum install firewalld
