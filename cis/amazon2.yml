  - id: "CIS-AMAZON2-5.1.1.3-journald_to_rsyslog-attrs"
    name: "/etc/systemd/journald.conf: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.1.3. NIST SP 800-53 Rev. 5: AC-3, AU-2, AU-4, AU-12, MP-2, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/journald.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e87ac396d0 |
      When rsyslog is the system's logging solution, journald has to pass its messages on to it. ForwardToSyslog=yes ensures that messages collected by journald also reach rsyslog, its log files and any central log server.
    remediation: &rem-91341b96af |
      Create /etc/systemd/journald.conf.
  - id: "CIS-AMAZON2-5.1.1.3-journald_to_rsyslog-content"
    name: "/etc/systemd/journald.conf has the expected content (2 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.1.3. NIST SP 800-53 Rev. 5: AC-3, AU-2, AU-4, AU-12, MP-2, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/systemd/journald.conf'
    allow_rc: any
    expect:
      - { some: "~ ^ForwardToSyslog=yes" }
      - { none: "~ ForwardToSyslog=[Nn][Oo]" }
    rationale: *rat-e87ac396d0
    remediation: &rem-eccdcbb6a0 |
      Edit /etc/systemd/journald.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^ForwardToSyslog=yes
      - no line matches ForwardToSyslog=[Nn][Oo]
  - id: "CIS-AMAZON2-5.1.1.4-perms_rsyslog_d"
    name: "perms rsyslog d: grep -s ^\\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf | cut -f2 -d:"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.1.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -s ^\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf | cut -f2 -d:
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ \\$FileCreateMode 06[0-4]0" }
      - { none: "~ \\$FileCreateMode 06[6-7][0-7]" }
    rationale: &rat-2b2fc7d019 |
      Log files often contain sensitive information such as user names, host names and error details. Setting $FileCreateMode to 0640 or stricter ensures that log files created by rsyslog are not readable or writable by arbitrary users, who could otherwise gather information or tamper with evidence.
    remediation: &rem-aa234ce03e |
      Make rsyslog create log files with mode 0640 by setting $FileCreateMode in a drop-in file that is read before the logging rules, and change every other $FileCreateMode line to 0640 as well.

      grep -n 'FileCreateMode' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      echo '$FileCreateMode 0640' > /etc/rsyslog.d/00-filecreatemode.conf
      systemctl restart rsyslog

      The mode applies to files created after the restart; correct existing log files separately.
  - id: "CIS-AMAZON2-5.1.1.5-etc_rsyslog.conf-attrs"
    name: "/etc/rsyslog.conf: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/rsyslog.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-863f7605c9 |
      rsyslog only records what its rules tell it to. Rules that route emergency, authentication, mail, news, cron, warning, critical and local facility messages into dedicated files make sure that security-relevant events are recorded and can be found quickly during an investigation. A restrictive file creation mode keeps the resulting log files from being readable by other users.
    remediation: &rem-d45052d244 |
      Create /etc/rsyslog.conf.
  - id: "CIS-AMAZON2-5.1.1.5-etc_rsyslog.conf-content"
    name: "/etc/rsyslog.conf has the expected content (14 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/rsyslog.conf'
    allow_rc: any
    expect:
      - { some: "~ ^\\*.emerg\\s+:omusrmsg:\\*" }
      - { some: "~ auth,authpriv.\\*\\s+/var/log/secure" }
      - { some: "~ ^mail.\\*\\s+-/var/log/mail" }
      - { some: "~ ^mail.info\\s+-/var/log/mail.info" }
      - { some: "~ ^mail.warning\\s+-/var/log/mail.warning" }
      - { some: "~ ^mail.err\\s+/var/log/mail.err" }
      - { some: "~ ^cron.\\*\\s+/var/log/cron" }
      - { some: "~ ^*.=warning;\\*.=err\\s+-/var/log/warn" }
      - { some: "~ ^*.crit\\s+/var/log/warn" }
      - { some: "~ ^*.*;mail.none;news.none\\s+/var/log/messages" }
      - { some: "~ ^local0,local1.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local2,local3.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local4,local5.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local6,local7.\\*\\s+-/var/log/localmessages" }
    rationale: *rat-863f7605c9
    remediation: &rem-150102496c |
      Edit /etc/rsyslog.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\*.emerg\s+:omusrmsg:\*
      - a line matches auth,authpriv.\*\s+/var/log/secure
      - a line matches ^mail.\*\s+-/var/log/mail
      - a line matches ^mail.info\s+-/var/log/mail.info
      - a line matches ^mail.warning\s+-/var/log/mail.warning
      - a line matches ^mail.err\s+/var/log/mail.err
      - a line matches ^cron.\*\s+/var/log/cron
      - a line matches ^*.=warning;\*.=err\s+-/var/log/warn
      - a line matches ^*.crit\s+/var/log/warn
      - a line matches ^*.*;mail.none;news.none\s+/var/log/messages
      - a line matches ^local0,local1.\*\s+-/var/log/localmessages
      - a line matches ^local2,local3.\*\s+-/var/log/localmessages
      - a line matches ^local4,local5.\*\s+-/var/log/localmessages
      - a line matches ^local6,local7.\*\s+-/var/log/localmessages
  - id: "CIS-AMAZON2-5.1.1.6-remote_syslog"
    name: "remote syslog: grep -E \"action.*omfwd.*target\" /etc/rsyslog.conf /etc/rsyslog.d/*.conf"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.1.6. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "action.*omfwd.*target" /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ \\*\\.\\* action\\(type=\"omfwd\" target=\"loghost\\.example\\.com\" port=\"514\"" }
      - { some: "~ protocol=\"tcp\"" }
    rationale: &rat-de6c4769ee |
      Logs kept only on the host can be deleted or altered by an attacker who has gained control of it, and they are lost if the system fails. Forwarding messages to a central log server keeps an independent copy and allows correlation of events across systems.
    remediation: &rem-e4df08c340 |
      Forward all messages to the central log server over TCP with an rsyslog drop-in file and restart rsyslog. Replace LOGHOST with the name of your log server.

      Amazon Linux 2 and RHEL 9:
      echo '*.* action(type="omfwd" target="LOGHOST" port="514" protocol="tcp" action.resumeRetryCount="100" queue.type="LinkedList" queue.size="1000")' > /etc/rsyslog.d/60-remote.conf

      Amazon Linux 2023 and RHEL 7:
      echo '*.* @@LOGHOST:514' > /etc/rsyslog.d/60-remote.conf

      systemctl restart rsyslog

      On Amazon Linux 2 and RHEL 9 the check compares the target with a fixed example host name (loghost.example.com or logagg.example.com); the policy has to be adapted to the real log server.
  - id: "CIS-AMAZON2-5.1.1.7-local_syslog_input_old"
    name: "local syslog input old: grep -P -- '^\\h*input\\(type=\"imtcp\" port=\"514\"\\)' /etc/rsyslog.conf /etc/rsyslog.d/*.conf"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.1.7. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -P -- '^\h*input\(type="imtcp" port="514"\)' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-b9fdadac19 |
      Loading rsyslog's TCP input turns the host into a log receiver that accepts messages from the network. Unless the system is a designated log server, this opens an unnecessary network service that can be abused to inject false messages or exhaust disk space.
    remediation: &rem-bb5e03f7ba |
      Unless this host is a designated log server, disable the rsyslog TCP listener: comment out each input(type="imtcp" port="514") line reported by the check and restart rsyslog.

      grep -nP '^\h*input\(type="imtcp"' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      sed -i -E 's/^(\s*input\(type="imtcp".*)$/#\1/' FILE
      systemctl restart rsyslog
  - id: "CIS-AMAZON2-5.1.1.7-local_syslog_module_new"
    name: "local syslog module new: grep -P -- '^\\h*(module|input)\\((load|type)=\"imtcp\".*\\)' /etc/rsyslog.conf /etc/rsyslog.d…"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.1.7. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -P -- '^\h*(module|input)\((load|type)="imtcp".*\)' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-579251a246 |
      Loading rsyslog's imtcp module or defining a TCP input turns the host into a log receiver that accepts messages from the network. Unless the system is a designated log server, this opens an unnecessary network service that can be abused to inject false messages or exhaust disk space.
    remediation: &rem-7206253e4e |
      Unless this host is a designated log server, stop rsyslog from accepting messages over TCP: comment out each module(load="imtcp") and input(type="imtcp" ...) line reported by the check and restart rsyslog.

      grep -nP '^\h*(module|input)\((load|type)="imtcp"' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      sed -i -E 's/^(\s*(module|input)\((load|type)="imtcp".*)$/#\1/' FILE
      systemctl restart rsyslog
  - id: "CIS-AMAZON2-5.1.2.1.1-systemd-journal-remote"
    name: "Package systemd-journal-remote is installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.2.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet systemd-journal-remote
    expect: true
    rationale: &rat-c532adb37c |
      systemd-journal-remote provides systemd-journal-upload, which sends journal entries to a central collection server. Installing it is the prerequisite for keeping an off-host copy of the journal when journald is used as the logging solution.
    remediation: &rem-7d28d9c9c7 |
      Install the package systemd-journal-remote:

      yum install systemd-journal-remote
  - id: "CIS-AMAZON2-5.1.2.1.2-journal-upload.conf_configured-attrs"
    name: "/etc/systemd/journal-upload.conf: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.2.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/journal-upload.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ecda3f9bef |
      systemd-journal-upload needs the URL of the central log server and the key and certificates for an authenticated, encrypted connection. Without this configuration, journal entries are not forwarded at all or are sent over an unprotected channel.
    remediation: &rem-bc30e412e9 |
      Create /etc/systemd/journal-upload.conf.
  - id: "CIS-AMAZON2-5.1.2.1.2-journal-upload.conf_configured-content"
    name: "/etc/systemd/journal-upload.conf has the expected content (4 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.2.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/systemd/journal-upload.conf'
    allow_rc: any
    expect:
      - { some: "~ ^URL=" }
      - { some: "~ /ServerKeyFile=\\.\\*\\.pem" }
      - { some: "~ /ServerCertificateFile=\\.\\*\\.pem" }
      - { some: "~ /TrustedCertificateFile=\\.\\*\\.pem" }
    rationale: *rat-ecda3f9bef
    remediation: &rem-7ca333f05c |
      Edit /etc/systemd/journal-upload.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^URL=
      - a line matches /ServerKeyFile=\.\*\.pem
      - a line matches /ServerCertificateFile=\.\*\.pem
      - a line matches /TrustedCertificateFile=\.\*\.pem
  - id: "CIS-AMAZON2-5.1.2.1.3-systemd-journal-upload-enabled"
    name: "Service systemd-journal-upload.service is enabled"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.2.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-12, CM-7, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journal-upload.service | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-f9ce71e3e2 |
      The systemd-journal-upload service continuously sends journal entries to the central log server. It has to be enabled and running so that a copy of the logs leaves the host and survives tampering or loss of the local system.
    remediation: &rem-c6c7c65dbe |
      Enable the service systemd-journal-upload.service:

      systemctl enable systemd-journal-upload.service
  - id: "CIS-AMAZON2-5.1.2.1.3-systemd-journal-upload-running"
    name: "Service systemd-journal-upload.service is running"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.2.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-12, CM-7, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journal-upload.service | cut -d= -f2
    expect: "== active"
    rationale: *rat-f9ce71e3e2
    remediation: &rem-7f8e123d83 |
      Start the service systemd-journal-upload.service:

      systemctl start systemd-journal-upload.service
  - id: "CIS-AMAZON2-5.1.2.1.4-systemd-journal-remote.stopped-enabled"
    name: "Service systemd-journal-remote.socket is not enabled"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.2.1.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journal-remote.socket | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-8260cf7f3c |
      The systemd-journal-remote socket makes the host accept journal entries from other systems over the network. Clients only send logs and do not need it; leaving it active exposes an unnecessary network service.
    remediation: &rem-6593464f6f |
      Disable the service systemd-journal-remote.socket, unless the system needs it:

      systemctl disable systemd-journal-remote.socket

      To keep other units from starting it, mask it instead: systemctl mask systemd-journal-remote.socket
  - id: "CIS-AMAZON2-5.1.2.1.4-systemd-journal-remote.stopped-running"
    name: "Service systemd-journal-remote.socket is not running"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.2.1.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journal-remote.socket | cut -d= -f2
    expect: "!= active"
    rationale: *rat-8260cf7f3c
    remediation: &rem-965b15f40c |
      Stop the service systemd-journal-remote.socket, unless the system needs it:

      systemctl stop systemd-journal-remote.socket
  - id: "CIS-AMAZON2-5.1.2.1.4-journald_socket_masked"
    name: "journald socket masked: systemctl is-enabled systemd-journal-remote.socket"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.2.1.4."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl is-enabled systemd-journal-remote.socket
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ ^masked" }
    rationale: &rat-9ba854dbda |
      systemd-journal-remote.socket lets the host receive journal entries from other systems. Masking it on systems that are not log collectors prevents the listener from being started, even indirectly by another unit, and removes an unnecessary network service.
    remediation: &rem-2d1745ded8 |
      Unless this host collects journals from other systems, stop the journal remote receiver and mask its socket and service so that they cannot be started.

      systemctl stop systemd-journal-remote.socket systemd-journal-remote.service
      systemctl mask systemd-journal-remote.socket systemd-journal-remote.service
  - id: "CIS-AMAZON2-5.1.2.2-journald_enabled-enabled"
    name: "Service systemd-journald is enabled"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.2.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journald | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-c0b6289e57 |
      systemd-journald collects log messages from the kernel, early boot, services and applications. It must be enabled and running so that these messages are captured and can be stored or forwarded.
    remediation: &rem-509c775265 |
      Enable the service systemd-journald:

      systemctl enable systemd-journald
  - id: "CIS-AMAZON2-5.1.2.2-journald_enabled-running"
    name: "Service systemd-journald is running"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.2.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journald | cut -d= -f2
    expect: "== active"
    rationale: *rat-c0b6289e57
    remediation: &rem-062cd16446 |
      Start the service systemd-journald:

      systemctl start systemd-journald
  - id: "CIS-AMAZON2-5.1.2.3-journald_compress"
    name: "journald compress: grep -i \"compress\" /etc/systemd/journald.conf"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.2.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i "compress" /etc/systemd/journald.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Compress=yes" }
      - { some: "~ !Compress=[Nn][Oo]" }
    rationale: &rat-3fb044d452 |
      Compressing large journal entries reduces the disk space used by logs. This lowers the risk that the log partition fills up, which could cause loss of log data or affect system stability.
    remediation: &rem-ca63607059 |
      Enable compression in /etc/systemd/journald.conf, the file this check reads, and restart journald.

      sed -i -E 's/^#?\s*Compress=.*/Compress=yes/' /etc/systemd/journald.conf
      grep -q '^Compress=yes' /etc/systemd/journald.conf || echo 'Compress=yes' >> /etc/systemd/journald.conf
      systemctl restart systemd-journald
  - id: "CIS-AMAZON2-5.1.2.4-journald_storage"
    name: "journald storage: grep -i \"storage\" /etc/systemd/journald.conf"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.2.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i "storage" /etc/systemd/journald.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Storage=persistent" }
    rationale: &rat-9f7a35ef11 |
      With Storage=persistent, journald writes logs to /var/log/journal on disk instead of keeping them only in memory. Otherwise all journal entries are lost at reboot, including evidence of what happened before a crash or an attack.
    remediation: &rem-b027560279 |
      Make journald store logs persistently on disk by setting Storage=persistent in /etc/systemd/journald.conf, the file this check reads, and restart journald.

      sed -i -E 's/^#?\s*Storage=.*/Storage=persistent/' /etc/systemd/journald.conf
      grep -q '^Storage=persistent' /etc/systemd/journald.conf || echo 'Storage=persistent' >> /etc/systemd/journald.conf
      systemctl restart systemd-journald
  - id: "CIS-AMAZON2-5.1.2.5-journald_forwardtosyslog"
    name: "journald forwardtosyslog: grep -i \"ForwardToSyslog\" /etc/systemd/journald.conf"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.2.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i "ForwardToSyslog" /etc/systemd/journald.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^#.*ForwardToSyslog=" }
      - { none: "~ ^\\s*ForwardToSyslog" }
    rationale: &rat-76c810379e |
      On systems that use journald alone as the logging solution, forwarding every message to a syslog daemon duplicates log data and may send it to destinations that are not managed. Leaving ForwardToSyslog unset in journald.conf keeps the logging path as designed.
    remediation: &rem-c14a4f7b8d |
      Comment out every active ForwardToSyslog line in /etc/systemd/journald.conf and keep a commented entry, then restart journald.

      sed -i -E 's/^\s*(ForwardToSyslog=.*)/#\1/' /etc/systemd/journald.conf
      grep -q '^#.*ForwardToSyslog=' /etc/systemd/journald.conf || echo '#ForwardToSyslog=no' >> /etc/systemd/journald.conf
      systemctl restart systemd-journald

      This applies to systems that use journald alone; it contradicts the ForwardToSyslog=yes requirement for rsyslog-based logging. If forwarding has to be switched off explicitly, set ForwardToSyslog=no in a file under /etc/systemd/journald.conf.d/, which this check does not read.
  - id: "CIS-AMAZON2-5.1.2.6-journald_log_rotation"
    name: "journald log rotation: grep -Ei \"(MaxFileSec|KeepFree|MaxUse)\" /etc/systemd/journald.conf"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.2.6. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "(MaxFileSec|KeepFree|MaxUse)" /etc/systemd/journald.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^#.*F" }
      - { some: "~ ^SystemMaxUse=" }
      - { some: "~ ^SystemKeepFree=" }
      - { some: "~ ^RuntimeMaxUse=" }
      - { some: "~ ^RuntimeKeepFree=" }
      - { some: "~ ^MaxFileSec=" }
    rationale: &rat-ee6c371b17 |
      journald removes old entries according to its size and time limits. Explicit values for SystemMaxUse, SystemKeepFree, RuntimeMaxUse, RuntimeKeepFree and MaxFileSec keep logs within the space reserved for them, so that logging neither fills the disk nor discards entries earlier than the retention policy requires.
    remediation: &rem-68e7ef2e62 |
      Set explicit size and age limits for the journal in the [Journal] section of /etc/systemd/journald.conf according to the site's retention policy (example values below), then restart journald. Uncomment and edit the existing entries instead of adding duplicates, and keep the other commented default entries.

      SystemMaxUse=1G
      SystemKeepFree=500M
      RuntimeMaxUse=200M
      RuntimeKeepFree=50M
      MaxFileSec=1month

      systemctl restart systemd-journald
  - id: "CIS-AMAZON2-5.1.4-logfile_configured"
    name: "logfile configured: find /var/log/ -type f \\( -name 'lastlog' -o -name 'wtmp' -o -name 'btmp' \\) -perm /g+x,o…"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /var/log/ -type f \( -name 'lastlog' -o -name 'wtmp' -o -name 'btmp' \) -perm /g+x,o+wx -exec ls -l "{}" + ; find /var/log/ -type f \( -name 'secure' -o -name 'auth*' -o -name 'syslog' -o -name 'messages' \) -perm /u+x,g+wx,o+rwx -exec ls -l "{}" +; find /var/log/ -type f \( -name 'SSSD' -o -name 'sssd' -o -name 'gdm*' \) -perm /ug+x,o+rwx -exec ls -l "{}" +
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-0de5450138 |
      Log files can contain sensitive data and are important evidence after a security incident. If they are writable or readable by unauthorised users, information leaks and logs can be altered or deleted to hide an attack. Access to files under /var/log should be limited to what each kind of log needs.
    remediation: &rem-42ace0ab21 |
      Review every file listed by the check and remove the excess permissions. General and authentication logs should be 0640 or stricter; lastlog, wtmp and btmp may keep group write (0664) for the utmp group.

      chmod u-x,g-wx,o-rwx FILE
      chmod g-x,o-wx /var/log/lastlog /var/log/wtmp /var/log/btmp

      Also adjust the creating service and the create directives in /etc/logrotate.conf and /etc/logrotate.d/, otherwise the permissions come back with the next rotation. On RHEL 7, Ubuntu 18.04 (and for lastlog on Amazon Linux 2023) the check also flags group write on these login records; remove it there with chmod g-w if accepted.
  - id: "CIS-AMAZON2-5.2.1.1-audit-libs_installed"
    name: "Package audit-libs is installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      rpm -q --quiet audit-libs
    expect: true
    rationale: &rat-86645b7dcc |
      audit-libs provides the libraries that the audit tools and other programs use to talk to the kernel audit subsystem. It is a prerequisite for recording and processing audit events.
    remediation: &rem-4689ce868c |
      Install the package audit-libs:

      yum install audit-libs
  - id: "CIS-AMAZON2-5.2.1.1-audit_installed"
    name: "Package audit is installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      rpm -q --quiet audit
    expect: true
    rationale: &rat-83cde9ead6 |
      The audit package provides auditd, auditctl and the reporting tools. Without it the kernel's audit events are not written to disk, and security-relevant actions on the system cannot be traced afterwards.
    remediation: &rem-dfea94a4a1 |
      Install the package audit:

      yum install audit
  - id: "CIS-AMAZON2-5.2.1.2-boot_audit_on"
    name: "boot audit on: grep \"audit=\" /boot/grub2/grub.cfg"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep "audit=" /boot/grub2/grub.cfg
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*linux /boot/vmlinuz-.*\\saudit=1.*" }
      - { none: "~ ^\\s*linux /boot/vmlinuz-.*\\saudit=0.*" }
    rationale: &rat-887e0b1bd2 |
      Processes that start before auditd are only audited if auditing is enabled in the kernel from boot. Adding audit=1 to the kernel command line in the generated GRUB configuration ensures that events from early boot are captured and that such processes can be audited at all.
    remediation: &rem-63cafe9de4 |
      Add audit=1 to GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub, regenerate /boot/grub2/grub.cfg and reboot.

      grep -q '^GRUB_CMDLINE_LINUX_DEFAULT=' /etc/default/grub || echo 'GRUB_CMDLINE_LINUX_DEFAULT=""' >> /etc/default/grub
      sed -i -E '/^GRUB_CMDLINE_LINUX_DEFAULT=/{s/\s*audit=[0-9]+//g;s/"$/ audit=1"/}' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      The setting takes effect after a reboot.
  - id: "CIS-AMAZON2-5.2.1.2-default_audit_on"
    name: "default audit on: grep \"audit=\" /etc/default/grub"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep "audit=" /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX_DEFAULT=.*\\saudit=1.*" }
      - { none: "~ ^GRUB_CMDLINE_LINUX_DEFAULT=.*audit=0" }
    rationale: &rat-3ac8cee96a |
      Processes that start before auditd are only audited if auditing is enabled in the kernel from boot. Putting audit=1 into the GRUB defaults ensures that every regenerated boot entry keeps this setting, also after kernel updates.
    remediation: &rem-76978a073d |
      Append audit=1 to GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub (separated by a space) and regenerate the GRUB configuration.

      grep -q '^GRUB_CMDLINE_LINUX_DEFAULT=' /etc/default/grub || echo 'GRUB_CMDLINE_LINUX_DEFAULT=""' >> /etc/default/grub
      sed -i -E '/^GRUB_CMDLINE_LINUX_DEFAULT=/{s/\s*audit=[0-9]+//g;s/"$/ audit=1"/}' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      The setting takes effect after a reboot.
  - id: "CIS-AMAZON2-5.2.1.3-boot_audit_backlog"
    name: "boot audit backlog: grep \"audit_backlog_limit=\" /boot/grub2/grub.cfg"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep "audit_backlog_limit=" /boot/grub2/grub.cfg
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*linux /boot/vmlinuz-..*\\saudit_backlog_limit=(8192|819[3-9]|8[2-9]{,2}|9[0-9]{3,9}|[1-9]{5,9}).*" }
    rationale: &rat-8348cba2c8 |
      When auditing is enabled at boot, the kernel buffers audit events until auditd reads them. The default backlog of 64 entries can overflow during boot or bursts of activity, and overflowing events are lost. A backlog limit of 8192 or more in the generated GRUB configuration prevents this.
    remediation: &rem-73cdde2ca8 |
      Add audit_backlog_limit=8192 to GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub, regenerate /boot/grub2/grub.cfg and reboot.

      grep -q '^GRUB_CMDLINE_LINUX_DEFAULT=' /etc/default/grub || echo 'GRUB_CMDLINE_LINUX_DEFAULT=""' >> /etc/default/grub
      sed -i -E '/^GRUB_CMDLINE_LINUX_DEFAULT=/{s/\s*audit_backlog_limit=[0-9]+//g;s/"$/ audit_backlog_limit=8192"/}' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      The setting takes effect after a reboot.
  - id: "CIS-AMAZON2-5.2.1.3-default_audit_backlog"
    name: "default audit backlog: grep \"audit_backlog_limit=\" /etc/default/grub"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep "audit_backlog_limit=" /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX_DEFAULT=.*\\saudit_backlog_limit=(8192|819[3-9]|8[2-9]{,2}|9[0-9]{3,9}|[1-9]{5,9}).*" }
    rationale: &rat-407ba74ad3 |
      When auditing is enabled at boot, the kernel buffers audit events until auditd reads them. The default backlog of 64 entries can overflow during boot or bursts of activity. Putting audit_backlog_limit=8192 into the GRUB defaults ensures that every regenerated boot entry has a large enough buffer.
    remediation: &rem-92cb38b477 |
      Append audit_backlog_limit=8192 to GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub (separated by a space) and regenerate the GRUB configuration.

      grep -q '^GRUB_CMDLINE_LINUX_DEFAULT=' /etc/default/grub || echo 'GRUB_CMDLINE_LINUX_DEFAULT=""' >> /etc/default/grub
      sed -i -E '/^GRUB_CMDLINE_LINUX_DEFAULT=/{s/\s*audit_backlog_limit=[0-9]+//g;s/"$/ audit_backlog_limit=8192"/}' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      The setting takes effect after a reboot.
  - id: "CIS-AMAZON2-5.2.1.4-auditd_enabled-enabled"
    name: "Service auditd is enabled"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p UnitFileState auditd | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-a5d4b05d22 |
      auditd receives audit events from the kernel and writes them to the audit log. It must be enabled and running, otherwise the configured audit rules produce no persistent record.
    remediation: &rem-5d15604058 |
      Enable the service auditd:

      systemctl enable auditd
  - id: "CIS-AMAZON2-5.2.1.4-auditd_enabled-running"
    name: "Service auditd is running"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p ActiveState auditd | cut -d= -f2
    expect: "== active"
    rationale: *rat-a5d4b05d22
    remediation: &rem-ce273a00c5 |
      Start the service auditd:

      systemctl start auditd
  - id: "CIS-AMAZON2-5.2.2.1-auditd_max_log_file"
    name: "auditd max log file: grep -E \"^max_log_file\" /etc/audit/auditd.conf"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.2.1. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E "^max_log_file" /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ max_log_file = [1-9][0-9]{1,2}" }
    rationale: &rat-c19882aca4 |
      max_log_file sets the size in megabytes at which auditd rotates its log file. A deliberately chosen size, together with the rotation action, makes sure that the audit trail fits the available disk space and the retention requirements.
    remediation: &rem-60ccd42d4c |
      Set max_log_file in /etc/audit/auditd.conf to the log file size in megabytes required by the site policy (the check accepts 10 to 999), then make auditd re-read its configuration.

      sed -i -E 's/^\s*#?\s*max_log_file\s*=.*/max_log_file = 32/' /etc/audit/auditd.conf
      grep -q '^max_log_file = ' /etc/audit/auditd.conf || echo 'max_log_file = 32' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      Keep the spaces around the equals sign; most variants of the check expect 'max_log_file = VALUE' exactly.
  - id: "CIS-AMAZON2-5.2.2.2-auditd_max_log_action"
    name: "auditd max log action: grep -E \"^max_log_file_action\" /etc/audit/auditd.conf"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.2.2. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E "^max_log_file_action" /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ max_log_file_action = keep_logs" }
    rationale: &rat-cf0277f2a2 |
      max_log_file_action defines what auditd does when the log file reaches its maximum size. With keep_logs, logs are rotated but never deleted automatically, so no audit records are lost; disk usage then has to be monitored.
    remediation: &rem-ca1a3f989b |
      Set max_log_file_action to keep_logs in /etc/audit/auditd.conf, then make auditd re-read its configuration.

      sed -i -E 's/^\s*#?\s*max_log_file_action\s*=.*/max_log_file_action = keep_logs/' /etc/audit/auditd.conf
      grep -q '^max_log_file_action = keep_logs' /etc/audit/auditd.conf || echo 'max_log_file_action = keep_logs' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      With keep_logs auditd never deletes old logs; monitor the free space of the audit log partition.
  - id: "CIS-AMAZON2-5.2.2.3-auditd_disable_full-attrs"
    name: "/etc/audit/auditd.conf: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.2.3. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-3ab382ea59 |
      If the disk holding the audit log fills up or reports errors, auditd can no longer record events. Configuring disk_full_action and disk_error_action to halt the system or switch to single user mode prevents it from continuing to run without an audit trail.
    remediation: &rem-fdf1d22c95 |
      Create /etc/audit/auditd.conf.
