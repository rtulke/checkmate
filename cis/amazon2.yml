      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect:
      - { some: "~ ^DisableForwarding yes" }
      - { none: "~ ^DisableForwarding no" }
    rationale: *rat-b05b4eb840
    remediation: &rem-ddbe0611dd |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches ^DisableForwarding yes
      - no line matches ^DisableForwarding no
  - id: "CIS-AMAZON2-4.2.9-sshd_gssapiauth-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.9. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-58c6a573dc |
      GSSAPI authentication, usually Kerberos, adds complex authentication code to the SSH server. Systems that do not use Kerberos single sign-on should disable it to reduce attack surface and avoid delays from failing lookups.
    remediation: *rem-f6392187bb
  - id: "CIS-AMAZON2-4.2.9-sshd_gssapiauth-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.9. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
