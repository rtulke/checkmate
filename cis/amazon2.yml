  - id: "CIS-AMAZON2-3.2.4-modprobe_sctp"
    name: "modprobe sctp: grep -Rh sctp /etc/modprobe.d/"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.2.4. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -Rh sctp /etc/modprobe.d/
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install sctp /bin/(false|true)" }
      - { some: "~ blacklist sctp" }
    rationale: &rat-be5bf6712f |
      SCTP is a message-oriented transport protocol used mainly in telecommunications. Its kernel module adds network-reachable code that most systems never use. Preventing the module from loading removes this attack surface on systems that do not use the protocol. Some telecom and clustering software needs SCTP.
    remediation: &rem-40e3047e72 |
      Keep the sctp module from being loaded: add an install override and a blacklist entry for it in /etc/modprobe.d/, then unload it if it is currently loaded.

      printf '%s\n' 'install sctp /bin/false' 'blacklist sctp' > /etc/modprobe.d/sctp.conf
      modprobe -r sctp

      modprobe -r reports an error if the module is not loaded, which is harmless; if sockets of this protocol are open, the module stays loaded until reboot.
  - id: "CIS-AMAZON2-3.3.1-net.ipv4.ip_forward"
    name: "Kernel parameter net.ipv4.ip_forward is 0"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-5, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.ip_forward
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-f3a19b4b76 |
      With IP forwarding enabled the system routes packets between its interfaces like a router. A host that is not meant to route could then be used to bypass network segmentation. Disabling forwarding ensures only traffic addressed to the host itself is handled. Routers and many container or virtualization hosts need forwarding.
    remediation: &rem-330a5a5e8e |
      Set the kernel parameter net.ipv4.ip_forward to 0, now and at boot:

      sysctl -w 'net.ipv4.ip_forward=0'
      printf '%s\n' 'net.ipv4.ip_forward = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.ip_forward from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-AMAZON2-3.3.2-net.ipv4.conf.all.send_redirects"
    name: "Kernel parameter net.ipv4.conf.all.send_redirects is 0"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.3.2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-5, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.all.send_redirects
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-e772f5113d |
      Routers send ICMP redirects to tell hosts about better routes. A system that is not a router has no reason to send them, and an attacker who controls it could use redirects to divert other hosts' traffic. The 'all' setting applies to all current interfaces.
    remediation: &rem-9e5a0d6d8d |
      Set the kernel parameter net.ipv4.conf.all.send_redirects to 0, now and at boot:

      sysctl -w 'net.ipv4.conf.all.send_redirects=0'
      printf '%s\n' 'net.ipv4.conf.all.send_redirects = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.conf.all.send_redirects from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-AMAZON2-3.3.2-net.ipv4.conf.default.send_redirects"
