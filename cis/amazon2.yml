  - id: "CIS-AMAZON2-4.3.1-sudo"
    name: "Package sudo is installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet sudo
    expect: true
    rationale: &rat-f5f9e1cba7 |
      sudo lets administrators run privileged commands with their own credentials instead of a shared root password. That gives individual accountability, fine-grained permissions and a log of every privileged command.
    remediation: &rem-f70c9e3150 |
      Install the package sudo:

      yum install sudo
  - id: "CIS-AMAZON2-4.3.2-sudoers_pty-attrs"
    name: "/etc/sudoers: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.3.2. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
