    severity: medium
    run: |
      rpm -q --quiet cups
    expect: false
    rationale: &rat-a74706f42c |
      CUPS provides printing services and can listen on the network. Servers that do not print or act as print servers do not need it; removing it eliminates a service with a history of vulnerabilities.
    remediation: &rem-079c782c8f |
      Remove the package cups, unless the system needs it:

      yum remove cups
  - id: "CIS-AMAZON2-2.2.12-rpcbind_pkg"
    name: "Package rpcbind is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.12. NIST SP 800-53 Rev. 5: CM-6, CM-7."
    tags: [cis, cis-amazon2, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet rpcbind
    expect: false
    rationale: &rat-9754eeb670 |
      rpcbind maps RPC program numbers to network ports and is required mainly by NFS. It discloses information about RPC services and has been abused for DDoS amplification. Systems that do not use RPC-based services should not have it installed.
    remediation: &rem-497febd13b |
      Remove the package rpcbind, unless the system needs it:

      yum remove rpcbind
  - id: "CIS-AMAZON2-2.2.12-rpcbind_service_masked-attrs"
