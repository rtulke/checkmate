    severity: medium
    run: |
      rpm -q --quiet dovecot
    expect: false
    rationale: &rat-2ecb6d09c8 |
      Dovecot is an IMAP and POP3 mail server. On systems that do not provide mailboxes it is an unnecessary network-facing service that adds attack surface and maintenance effort.
    remediation: &rem-ebe89aaafd |
      Remove the package dovecot, unless the system needs it:

      yum remove dovecot
  - id: "CIS-AMAZON2-2.2.9-nfs_pkg"
    name: "Package nfs-utils is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.9. NIST SP 800-53 Rev. 5: CM-6, CM-7."
    tags: [cis, cis-amazon2, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
