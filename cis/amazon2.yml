      at.allow lists the users permitted to schedule one-time jobs with at. An allow list means new or unused accounts cannot schedule jobs, which limits a way to run deferred commands. The file must belong to root and not be writable by others, so users cannot grant themselves access.
    remediation: &rem-71542f7e35 |
      Create /etc/at.allow if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/at.allow'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/at.allow'
  - id: "CIS-AMAZON2-4.1.2.1-etc_at.deny-absent"
    name: "/etc/at.deny does not exist"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.1.2.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      test -e '/etc/at.deny' || test -L '/etc/at.deny'
    expect: false
    rationale: &rat-5230675a36 |
      When at access is controlled with at.allow, an at.deny file is at best ignored and at worst creates the impression that only listed users are blocked. Removing it leaves the allow list as the single, clear control.
    remediation: &rem-d7950be1a0 |
      Remove /etc/at.deny, unless the system needs it:

      rm '/etc/at.deny'
  - id: "CIS-AMAZON2-4.2.1-sshd_config_perms-attrs"
    name: "/etc/ssh/sshd_config: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-fc2827314f |
      sshd_config controls who may log in remotely and how. If unprivileged users could modify it they could enable root login or weaken authentication, and read access reveals details of the security configuration. It should be owned by root and accessible only by root.
    remediation: &rem-714a840007 |
      Create /etc/ssh/sshd_config if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/ssh/sshd_config'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/ssh/sshd_config'
  - id: "CIS-AMAZON2-4.2.2-etc_ssh_ssh_host_key_group"
    name: "/etc/ssh/ssh host key group: groupkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -group root ); echo $groupkeys"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      groupkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -group root ); echo $groupkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-78bca69dc5 |
      SSH private host keys prove the server's identity to clients. Anyone who can read them can impersonate the server and intercept connections. Assigning them to the root group ensures no other group gains access through group permissions.
    remediation: &rem-06ada35bd6 |
      Set the group of the listed SSH private host keys to root and make them readable by root only.

      find /etc/ssh -xdev -type f -name '*_key' ! -group root
      chgrp root FILE
      chmod 0600 FILE

      The chmod is needed because OpenSSH rejects group-readable private keys unless they belong to the ssh_keys group (the Amazon Linux 2 default). On Ubuntu 18.04 the check also covers the public keys (*_key.pub); for those only the group needs to change.
  - id: "CIS-AMAZON2-4.2.2-etc_ssh_ssh_host_key_perms"
    name: "/etc/ssh/ssh host key perms: keyperms=$(sudo find /etc/ssh/ -name *_key -type f -perm /137 ); echo $keyperms"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      keyperms=$(sudo find /etc/ssh/ -name *_key -type f -perm /137 ); echo $keyperms
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-ea7db59f85 |
      SSH private host keys prove the server's identity to clients. Anyone who can read them can impersonate the server and intercept connections. Restricting the file mode keeps other users and groups from reading or changing them.
    remediation: &rem-f407e192a4 |
      Remove execute permission for the owner, write and execute for the group and all access for others from the listed SSH private host keys.

      find /etc/ssh -xdev -type f -name '*_key' -perm /137
      chmod u-x,g-wx,o-rwx FILE

      If the key's group is not ssh_keys, use chmod 0600 instead, because OpenSSH rejects group-readable private keys.
  - id: "CIS-AMAZON2-4.2.2-etc_ssh_ssh_host_key_user"
    name: "/etc/ssh/ssh host key user: userkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -user root ); echo $userkeys"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      userkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -user root ); echo $userkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-675c04f869 |
      SSH private host keys prove the server's identity to clients. If they were owned by another user, that user could read or replace them and impersonate the server. Ownership by root keeps them under administrative control.
    remediation: &rem-ab281d0940 |
      Make root the owner of the listed SSH host key files.

      find /etc/ssh -xdev -type f -name '*_key' ! -user root
      chown root FILE

      On Ubuntu 18.04 the check also covers the public keys (*_key.pub).
  - id: "CIS-AMAZON2-4.2.3-etc_ssh_ssh_pub_host_key_group"
    name: "/etc/ssh/ssh pub host key group: groupkeys=$(sudo find /etc/ssh/ -name *_key.pub -type f ! -group root ); echo $groupkeys"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      groupkeys=$(sudo find /etc/ssh/ -name *_key.pub -type f ! -group root ); echo $groupkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-a9e137c39c |
      SSH public host keys are what clients compare against to verify the server. If another group could modify them, wrong keys could be distributed or published. Assigning them to the root group prevents that.
    remediation: &rem-8c69f2e487 |
      Set the group of the listed SSH public host keys to root.

      find /etc/ssh -xdev -type f -name '*_key.pub' ! -group root
      chgrp root FILE
  - id: "CIS-AMAZON2-4.2.3-etc_ssh_ssh_pub_host_key_perms"
    name: "/etc/ssh/ssh pub host key perms: keysperm=$(sudo find /etc/ssh/ -name *_key.pub -type f  -perm /137 ); echo $keyperms"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      keysperm=$(sudo find /etc/ssh/ -name *_key.pub -type f  -perm /137 ); echo $keyperms
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-0fc0f14463 |
      SSH public host keys are what clients compare against to verify the server. Write access for others would allow wrong keys to be distributed or published. Restricting the file mode prevents unauthorized changes.
    remediation: &rem-01372e4aad |
      Remove execute permission for the owner, write and execute for the group and all access for others from the listed SSH public host keys.

      find /etc/ssh -xdev -type f -name '*_key.pub' -perm /137
      chmod u-x,g-wx,o-rwx FILE
  - id: "CIS-AMAZON2-4.2.3-etc_ssh_ssh_pub_host_key_user"
    name: "/etc/ssh/ssh pub host key user: userkeys=$(sudo find /etc/ssh/ -name *_key.pub -type f ! -user root ); echo $userkeys"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      userkeys=$(sudo find /etc/ssh/ -name *_key.pub -type f ! -user root ); echo $userkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-7e3b7e14ee |
      SSH public host keys are what clients compare against to verify the server. If another user owned them, that user could replace them. Ownership by root keeps them under administrative control.
    remediation: &rem-6fccefb00a |
      Make root the owner of the listed SSH public host keys.

      find /etc/ssh -xdev -type f -name '*_key.pub' ! -user root
      chown root FILE
  - id: "CIS-AMAZON2-4.2.4-sshd_access_limited"
    name: "SSH access is limited with AllowUsers, AllowGroups, DenyUsers or DenyGroups"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(allow|deny)(users|groups) +[^ ]'
    allow_rc: any
    expect: { some: "~ ." }
    rationale: &rat-8e5700f652 |
      Restricting SSH logins to explicitly allowed users or groups ensures that only accounts with a need for remote access can log in, even if other accounts have valid credentials or weak passwords. It limits the impact of compromised, forgotten or service accounts.
    remediation: &rem-804a07286e |
      Restrict SSH logins to the users or groups that need them with AllowUsers, AllowGroups, DenyUsers or DenyGroups, according to site policy. Set the directive in the global section of the sshd configuration (in /etc/ssh/sshd_config before any Match block, or in a file in /etc/ssh/sshd_config.d/ where the distribution includes that directory), then validate and reload the SSH service.

      echo 'AllowGroups GROUP' > /etc/ssh/sshd_config.d/10-access.conf
      sshd -t

      When both AllowUsers and AllowGroups are set, a user must match both lists. Make sure your own administrative account is allowed before reloading.
  - id: "CIS-AMAZON2-4.2.5-ssh_banner-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-dd603f8444 |
      A banner shown before SSH authentication informs users that access is restricted and monitored. Such a notice can be a prerequisite for legal action against unauthorized users. The banner text should not reveal system details.
    remediation: &rem-f6392187bb |
      Create /etc/ssh/sshd_config.
  - id: "CIS-AMAZON2-4.2.5-ssh_banner-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect:
      - { some: "~ ^Banner /etc/issue.net" }
      - { none: "~ ^Banner none" }
    rationale: *rat-dd603f8444
    remediation: &rem-04bc3fa781 |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches ^Banner /etc/issue.net
      - no line matches ^Banner none
  - id: "CIS-AMAZON2-4.2.6-sshd_ciphers-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.6. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-020e874b5b |
      Ciphers protect the confidentiality of SSH sessions. Outdated algorithms such as CBC modes, 3DES, Blowfish or RC4 are vulnerable to known attacks, and chacha20-poly1305 is exposed to the Terrapin attack when clients lack the fix. Restricting the server to strong ciphers keeps clients from negotiating a weak one.
    remediation: *rem-f6392187bb
  - id: "CIS-AMAZON2-4.2.6-sshd_ciphers-content"
    name: "/etc/ssh/sshd_config has the expected content (1 rule)"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.6. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect: { some: "~ Ciphers chacha20-poly1305@openssh\\.com,aes256-gcm@openssh\\.com,aes128-gcm@openssh\\.com,aes256-ctr,aes192-ctr,aes128-ctr" }
    rationale: *rat-020e874b5b
    remediation: &rem-ed3eba52fe |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches Ciphers chacha20-poly1305@openssh\.com,aes256-gcm@openssh\.com,aes128-gcm@openssh\.com,aes256-ctr,aes192-ctr,aes128-ctr
  - id: "CIS-AMAZON2-4.2.7-sshd_clientmax_alive-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.7. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-2b648e93b2 |
      ClientAliveInterval and ClientAliveCountMax let sshd detect unresponsive clients and close their sessions. This frees resources and ends sessions left behind by disconnected or abandoned clients. With 15 seconds and 3 probes a dead connection is closed after about 45 seconds.
    remediation: *rem-f6392187bb
  - id: "CIS-AMAZON2-4.2.7-sshd_clientmax_alive-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.7. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect:
      - { some: "~ ^ClientAliveInterval 15" }
      - { some: "~ ^ClientAliveCountMax 3" }
    rationale: *rat-2b648e93b2
    remediation: &rem-7cef73fa96 |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches ^ClientAliveInterval 15
      - a line matches ^ClientAliveCountMax 3
  - id: "CIS-AMAZON2-4.2.8-sshd_forwarding-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.8. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-b05b4eb840 |
      DisableForwarding turns off all SSH forwarding: X11, agent, TCP port and Unix socket forwarding. Forwarding can be used to tunnel traffic around firewalls, expose internal services or misuse a forwarded agent. Disabling it is appropriate unless users need tunnels.
    remediation: *rem-f6392187bb
  - id: "CIS-AMAZON2-4.2.8-sshd_forwarding-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.8. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
