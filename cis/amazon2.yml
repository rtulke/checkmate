  - id: "CIS-AMAZON2-4.4.2.1.3-faillock_password_auth_unlock_time-attrs"
    name: "/etc/pam.d/password-auth: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.4.2.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
