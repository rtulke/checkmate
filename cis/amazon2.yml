    remediation: &rem-cd6d514c64 |
      Remove the package nginx, unless the system needs it:

      yum remove nginx
  - id: "CIS-AMAZON2-2.2.19-xinetd_pkg"
    name: "Package xinetd is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.19. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
