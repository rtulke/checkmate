    expect: empty
    rationale: &rat-6716e10675 |
      MaxStartups controls how many unauthenticated connections sshd accepts. With 10:30:60 it starts randomly refusing 30 percent of new connections once 10 are pending and refuses all at 60, which keeps connection floods from exhausting the server.
    remediation: *rem-f6392187bb
