      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect:
      - { some: "~ ^(?i)gssapiauthentication no" }
      - { none: "~ ^(?i)gssapiauthentication yes" }
    rationale: *rat-58c6a573dc
    remediation: &rem-51b566cf08 |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches ^(?i)gssapiauthentication no
      - no line matches ^(?i)gssapiauthentication yes
  - id: "CIS-AMAZON2-4.2.10-sshd_hostbasedauth-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.10. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-cbd057cac6 |
      Host-based authentication trusts a client host's key together with the user name the client claims. If any trusted host is compromised, its users can log in without their own credentials. Disabling it requires every user to authenticate individually.
    remediation: *rem-f6392187bb
  - id: "CIS-AMAZON2-4.2.10-sshd_hostbasedauth-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.10. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
    allow_rc: any
    expect:
      - { some: "~ ^(?i)HostbasedAuthentication no" }
      - { none: "~ ^(?i)HostbasedAuthentication yes" }
    rationale: *rat-cbd057cac6
    remediation: &rem-5421cf0c19 |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches ^(?i)HostbasedAuthentication no
      - no line matches ^(?i)HostbasedAuthentication yes
  - id: "CIS-AMAZON2-4.2.11-sshd_ignorerhosts-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.11. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-974d4ba4c8 |
      IgnoreRhosts makes sshd ignore users' .rhosts and .shosts files, which would otherwise let users grant password-less access from other hosts on their own. Keeping it enabled prevents users from weakening authentication.
    remediation: *rem-f6392187bb
  - id: "CIS-AMAZON2-4.2.11-sshd_ignorerhosts-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.2.11. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat /etc/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config 2>/dev/null
