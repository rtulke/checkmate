  - id: "CIS-AMAZON2-4.5.1.2-login_passwd_expire-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.5.1.2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-22994f6026 |
      PASS_MAX_DAYS sets the default maximum password age for new accounts. Limiting it to 365 days reduces the time a compromised or shared password remains valid; disabling expiry entirely would allow such passwords to be used indefinitely.
    remediation: *rem-0b6bdc1798
  - id: "CIS-AMAZON2-4.5.1.2-login_passwd_expire-content"
    name: "/etc/login.defs has the expected content (3 rules)"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.5.1.2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
