  - id: "CIS-AMAZON2-5.2.3.3-modify_sudolog_cnf"
    name: "modify sudolog cnf: grep sudo_log /etc/audit/rules.d/*.rules"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.3.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
