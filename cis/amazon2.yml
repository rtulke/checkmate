      yum remove tftp
  - id: "CIS-AMAZON2-3.1.1-net.ipv6.conf.all.disable_ipv6"
    name: "Kernel parameter net.ipv6.conf.all.disable_ipv6 is 1"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      sysctl -n net.ipv6.conf.all.disable_ipv6
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-c30b4fa596 |
      If IPv6 is not used, leaving it enabled creates an unmonitored network path: interfaces get link-local and possibly autoconfigured addresses, and firewall rules written only for IPv4 do not apply. Disabling IPv6 removes this exposure; the 'all' setting covers currently existing interfaces. Systems that use IPv6 should filter it instead.
    remediation: &rem-d46869cfdf |
      Set the kernel parameter net.ipv6.conf.all.disable_ipv6 to 1, now and at boot:

      sysctl -w 'net.ipv6.conf.all.disable_ipv6=1'
      printf '%s\n' 'net.ipv6.conf.all.disable_ipv6 = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv6.conf.all.disable_ipv6 from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-AMAZON2-3.1.1-net.ipv6.conf.default.disable_ipv6"
    name: "Kernel parameter net.ipv6.conf.default.disable_ipv6 is 1"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.1.1. NIST SP 800-53 Rev. 5: CM-7."
