    name: "/tmp is a separate mount with nodev"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.1.2.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/tmp'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nodev(,|$)"
    rationale: &rat-e8e261fb2b |
      The nodev option makes the kernel ignore character and block device files on a file system. Without it, a user able to place a device file in /tmp could gain direct access to hardware or kernel memory, bypassing normal permission checks. /tmp has no legitimate need for device files.
    remediation: &rem-1c21763bee |
      Mount /tmp with the option nodev: add it to the options of /tmp in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/tmp'

      If /tmp is not a separate file system yet, create one first.
