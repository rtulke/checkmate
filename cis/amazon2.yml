    tags: [cis, cis-amazon2, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/libuser.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-78d0be0afb |
      Tools based on libuser, such as luseradd and lpasswd, hash passwords with the algorithm set by crypt_style in /etc/libuser.conf. A weak setting such as MD5 or DES would produce hashes that are easy to crack if the shadow file leaks; SHA-512 (or yescrypt where accepted) keeps them strong.
    remediation: &rem-e322e2f413 |
      Create /etc/libuser.conf.
  - id: "CIS-AMAZON2-4.5.1.1-libuser_algorithm-content"
