    expect: false
    rationale: &rat-1571abbfb7 |
      nfs-utils provides the NFS server and related RPC services, which have a history of vulnerabilities and rely on weak host-based trust by default. Systems that neither export nor mount NFS shares should not have it installed.
    remediation: &rem-1d43fcf1ca |
      Remove the package nfs-utils, unless the system needs it:

      yum remove nfs-utils
  - id: "CIS-AMAZON2-2.2.9-nfs_service_masked-attrs"
    name: "/etc/systemd/system/nfs-server.service: exists, is a symbolic link, links to /dev/null"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.9. NIST SP 800-53 Rev. 5: CM-6, CM-7."
    tags: [cis, cis-amazon2, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/system/nfs-server.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: &rat-28e02b8181 |
      The NFS server exports local file systems to other hosts and relies on RPC services with a history of vulnerabilities. Masking nfs-server.service ensures it cannot be started, manually or as a dependency, on systems that must keep the package but do not export file systems.
    remediation: &rem-241f2f3725 |
      Create /etc/systemd/system/nfs-server.service if it is missing, then point the link to /dev/null:

      ln -sfn '/dev/null' '/etc/systemd/system/nfs-server.service'
  - id: "CIS-AMAZON2-2.2.11-cups_pkg"
    name: "Package cups is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.11. NIST SP 800-53 Rev. 5: CM-7."
