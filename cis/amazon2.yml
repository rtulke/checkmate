  - id: "CIS-AMAZON2-1.1.1.1-cramfs_modprobe"
    name: "cramfs modprobe: grep -Rh cramfs /etc/modprobe.d/"
    description: "CIS Amazon Linux 2 benchmark recommendation 1.1.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Rh cramfs /etc/modprobe.d/
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install cramfs /bin/(false|true)" }
      - { some: "~ blacklist cramfs" }
    rationale: &rat-15e71d4ee9 |
      cramfs is a compressed read-only file system used mainly on embedded devices. File system drivers parse on-disk structures inside the kernel, so a flaw in a rarely used driver can be exploited with a crafted image or removable medium. Preventing the module from loading removes this attack surface on systems that do not need it.
    remediation: &rem-343d271728 |
      Keep the cramfs module from being loaded: add an install override and a blacklist entry for it in /etc/modprobe.d/, then unload it if it is currently loaded.

      printf '%s\n' 'install cramfs /bin/false' 'blacklist cramfs' > /etc/modprobe.d/cramfs.conf
      modprobe -r cramfs

      modprobe -r reports an error if the module is not loaded, which is harmless; if a file system of this type is mounted, unmount it first or reboot.
