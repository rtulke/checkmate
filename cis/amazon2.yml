  - id: "CIS-AMAZON2-5.1.1.1-rsyslog"
    name: "Package rsyslog is installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.1.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet rsyslog
    expect: true
    rationale: &rat-ec4e2f2832 |
      rsyslog collects log messages from the kernel, services and applications, writes them to files and can forward them to a central log server. Without an installed, enabled and running syslog daemon, security-relevant events are not recorded in a durable way and incidents cannot be investigated.
    remediation: &rem-9f36b11ab3 |
      Install the package rsyslog:

      yum install rsyslog
  - id: "CIS-AMAZON2-5.1.1.2-rsyslog-enabled"
