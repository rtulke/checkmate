      yum install iptables-services
  - id: "CIS-AMAZON2-3.4.4.2.1-iptables_loopback"
    name: "iptables loopback: cat false"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.4.2.1. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat false
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^-A INPUT -i lo -j ACCEPT" }
      - { some: "~ ^-A OUTPUT -o lo -j ACCEPT" }
      - { some: "~ ^-A INPUT -s 127.0.0.0/8 -j DROP" }
      - { none: "~ ^-A INPUT -i lo -j DROP" }
      - { none: "~ ^-A OUTPUT -o lo -j DROP" }
      - { none: "~ ^-A INPUT -s 127.0.0.0/8 -j ACCEPT" }
    rationale: &rat-39899d9fb7 |
      Local services rely on loopback traffic, which has to be accepted explicitly once the firewall drops unmatched packets. Packets with a 127.0.0.0/8 source arriving on other interfaces are spoofed and should be dropped, so they cannot reach services that trust local connections.
    remediation: &rem-18a97ad99d |
      Accept loopback traffic, drop packets with a loopback source address arriving on other interfaces and save the rules so the iptables service restores them at boot.

      iptables -I INPUT 1 -i lo -j ACCEPT
      iptables -I OUTPUT 1 -o lo -j ACCEPT
      iptables -I INPUT 2 -s 127.0.0.0/8 -j DROP
      service iptables save

      service iptables save writes the rules to /etc/sysconfig/iptables (package iptables-services).
