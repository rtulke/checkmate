      Remove the package rsync-daemon, unless the system needs it:

      yum remove rsync-daemon
  - id: "CIS-AMAZON2-2.2.14-snmp_pkg"
    name: "Package net-snmp is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.14. NIST SP 800-53 Rev. 5: CM-7."
