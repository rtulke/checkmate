    severity: low
    run: |
      sysctl -n net.ipv6.conf.default.disable_ipv6
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-31645d223c |
      If IPv6 is not used, leaving it enabled creates an unmonitored network path: interfaces get link-local and possibly autoconfigured addresses, and firewall rules written only for IPv4 do not apply. Disabling IPv6 removes this exposure; the 'default' setting covers interfaces created later. Systems that use IPv6 should filter it instead.
    remediation: &rem-cb874f74d1 |
      Set the kernel parameter net.ipv6.conf.default.disable_ipv6 to 1, now and at boot:

      sysctl -w 'net.ipv6.conf.default.disable_ipv6=1'
      printf '%s\n' 'net.ipv6.conf.default.disable_ipv6 = 1' >> /etc/sysctl.d/60-hardening.conf

