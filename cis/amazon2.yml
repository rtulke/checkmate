    expect: empty
    rationale: &rat-6f1e95e0ce |
      ENCRYPT_METHOD in /etc/login.defs determines how passwords set with passwd, chpasswd and useradd are hashed. A strong salted algorithm such as SHA-512 or yescrypt protects the password hashes against offline cracking if the shadow file is exposed.
    remediation: &rem-0b6bdc1798 |
