  - id: "CIS-AMAZON2-4.5.3.3-etc_login_defs_umask-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.5.3.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
