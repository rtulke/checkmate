  - id: "CIS-AMAZON2-4.5.1.1-login_algorithm-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Amazon Linux 2 benchmark recommendation 4.5.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
