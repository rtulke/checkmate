    remediation: &rem-0ced57e116 |
      Remove the package telnet-server, unless the system needs it:

      yum remove telnet-server
  - id: "CIS-AMAZON2-2.2.16-tftp_pkg"
    name: "Package tftp-server is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.16. NIST SP 800-53 Rev. 5: CM-7."
