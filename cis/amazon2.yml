    severity: medium
    run: |
      rpm -q --quiet bluetooth
    expect: false
    rationale: &rat-58c9c08153 |
      Bluetooth allows short-range wireless connections that bypass network controls and has had serious remote vulnerabilities. Servers do not need it, so the Bluetooth software should not be installed.
    remediation: &rem-df888f961d |
      Remove the package bluetooth, unless the system needs it:

      yum remove bluetooth
  - id: "CIS-AMAZON2-3.2.1-modprobe_dccp"
    name: "modprobe dccp: grep -Rh dccp /etc/modprobe.d/"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.2.1. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -Rh dccp /etc/modprobe.d/
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install dccp /bin/(false|true)" }
      - { some: "~ blacklist dccp" }
    rationale: &rat-41ef8e8fab |
      DCCP is a rarely used datagram transport protocol. Its kernel module has had several serious vulnerabilities that can be triggered by local users or from the network. Preventing the module from loading removes this attack surface on systems that do not use the protocol.
    remediation: &rem-66ee3312a3 |
      Keep the dccp module from being loaded: add an install override and a blacklist entry for it in /etc/modprobe.d/, then unload it if it is currently loaded.

      printf '%s\n' 'install dccp /bin/false' 'blacklist dccp' > /etc/modprobe.d/dccp.conf
      modprobe -r dccp

      modprobe -r reports an error if the module is not loaded, which is harmless; if sockets of this protocol are open, the module stays loaded until reboot.
  - id: "CIS-AMAZON2-3.2.2-modprobe_tipc"
    name: "modprobe tipc: grep -Rh tipc /etc/modprobe.d/"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.2.2. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
