  - id: "CIS-AMAZON2-5.2.4.10-audit_tools_group"
    name: "audit tools group: stat -c \"%n_%G\" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /…"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.4.10. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
