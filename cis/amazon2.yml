  - id: "CIS-AMAZON2-5.2.3.7-auditd_access_cnf"
    name: "auditd access cnf: grep access /etc/audit/rules.d/*.rules"
    description: "CIS Amazon Linux 2 benchmark recommendation 5.2.3.7. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-amazon2, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep access /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*rules:-a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid\u003e=1000 -F auid!=(unset|4294967295) -F key=access" }
      - { some: "~ ^.*rules:-a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid\u003e=1000 -F auid!=(unset|4294967295) -F key=access" }
      - { some: "~ ^.*rules:-a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid\u003e=1000 -F auid!=(unset|4294967295) -F key=access" }
      - { some: "~ ^.*rules:-a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid\u003e=1000 -F auid!=(unset|4294967295) -F key=access" }
    rationale: &rat-b0a74a2a93 |
      Repeated attempts to open, create or truncate files that fail with permission errors often indicate that someone is probing for data they are not allowed to access. Auditing these failures for regular users makes such attempts visible. This check verifies the persistent audit configuration.
    remediation: &rem-c9f66f5579 |
      Record file access attempts that fail because of missing permissions: add the rules for your release to /etc/audit/rules.d/50-access.rules and load them.

      Amazon Linux 2:
      -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -F key=access
      -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=unset -F key=access
      -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -F key=access
