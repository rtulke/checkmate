    rationale: *rat-c3b76463d4
    remediation: *rem-02f37054b7
  - id: "CIS-AMAZON2-3.4.4.1.1-iptables_services_installed"
    name: "Package iptables-services is installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.4.1.1. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet iptables-services
    expect: true
    rationale: &rat-2d67e19a85 |
