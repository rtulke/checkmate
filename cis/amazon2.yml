  - id: "CIS-AMAZON2-2.2.1-autofs_pkg"
    name: "Package autofs is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.1. NIST SP 800-53 Rev. 5: SI-3, MP-7."
    tags: [cis, cis-amazon2, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet autofs
    expect: false
    rationale: &rat-66cc7255f3 |
      autofs mounts file systems automatically when they are accessed, including removable media and network shares. That makes it easier to introduce untrusted media and adds a privileged daemon. Systems that do not rely on automounted network shares or home directories should not have it installed.
    remediation: &rem-208278d559 |
      Remove the package autofs, unless the system needs it:

      yum remove autofs
  - id: "CIS-AMAZON2-2.2.1-autofs_masked-attrs"
    name: "/etc/systemd/system/autofs.service: exists, is a symbolic link, links to /dev/null"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.1. NIST SP 800-53 Rev. 5: SI-3, MP-7."
    tags: [cis, cis-amazon2, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/system/autofs.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: &rat-b552dece26 |
      autofs mounts file systems automatically when they are accessed, which makes it easier to introduce untrusted media. Masking the unit (linking it to /dev/null) ensures it cannot be started, neither manually nor as a dependency of another unit, where the package has to stay installed.
    remediation: &rem-5dfbad2866 |
      Create /etc/systemd/system/autofs.service if it is missing, then point the link to /dev/null:

      ln -sfn '/dev/null' '/etc/systemd/system/autofs.service'
  - id: "CIS-AMAZON2-2.2.2-avahi_pkg"
    name: "Package avahi is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.2. NIST SP 800-53 Rev. 5: SI-4."
    tags: [cis, cis-amazon2, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet avahi
    expect: false
    rationale: &rat-70b707d084 |
      Avahi implements mDNS/DNS-SD zero-configuration networking, advertising and discovering services on the local network. Servers rarely need it; it runs a listening network daemon and discloses information about the host. Removing it reduces attack surface.
    remediation: &rem-761b7c8fdd |
      Remove the package avahi, unless the system needs it:

      yum remove avahi
  - id: "CIS-AMAZON2-2.2.3-dhcp_pkg"
    name: "Package dhcp-server is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet dhcp-server
    expect: false
    rationale: &rat-2033f6aeaa |
      A DHCP server hands out network configuration to clients. On a system that is not meant to be a DHCP server it is unnecessary attack surface, and if started by mistake it can disrupt the network by handing out wrong addresses or gateways.
    remediation: &rem-3b74395851 |
      Remove the package dhcp-server, unless the system needs it:

      yum remove dhcp-server
  - id: "CIS-AMAZON2-2.2.4-dns_pkg"
    name: "Package bind is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.4. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet bind
    expect: false
    rationale: &rat-e524956514 |
      A DNS server is a complex network-facing service with a history of serious vulnerabilities. Systems that are not designated name servers should not have it installed, which removes that exposure and the risk of the host being abused for DNS amplification attacks.
    remediation: &rem-1771801b5f |
      Remove the package bind, unless the system needs it:

      yum remove bind
  - id: "CIS-AMAZON2-2.2.5-dnsmasq_pkg"
    name: "Package dnsmasq is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.5. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet dnsmasq
    expect: false
    rationale: &rat-6976005192 |
      dnsmasq combines a DNS forwarder with DHCP and TFTP servers. Unless the system needs it, for example for local virtualization networking, it is an unnecessary network-facing service that adds attack surface.
    remediation: &rem-5e67a7ea72 |
      Remove the package dnsmasq, unless the system needs it:

      yum remove dnsmasq
  - id: "CIS-AMAZON2-2.2.6-samba_pkg"
    name: "Package samba is not installed"
    description: "CIS Amazon Linux 2 benchmark recommendation 2.2.6. NIST SP 800-53 Rev. 5: CM-6, CM-7."
    tags: [cis, cis-amazon2, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet samba
    expect: false
    rationale: &rat-71a7199772 |
      Samba provides SMB/CIFS file and print sharing. It is a large network-facing service with a history of vulnerabilities; unless the system is meant to share files with SMB clients it should not be installed.
    remediation: &rem-9c5ef70778 |
