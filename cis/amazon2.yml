  - id: "CIS-AMAZON2-3.3.3-net.ipv4.icmp_ignore_bogus_error_respons"
    name: "Kernel parameter net.ipv4.icmp_ignore_bogus_error_responses is 1"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.3.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-5, CM-7, IA-5."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.icmp_ignore_bogus_error_responses
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-355a28dbde |
      Some routers and attackers send ICMP error messages that violate the standards. Ignoring these bogus responses keeps the kernel from logging each of them, so the logs are not flooded, real problems are not hidden and disk space is not exhausted.
    remediation: &rem-71a066b725 |
      Set the kernel parameter net.ipv4.icmp_ignore_bogus_error_responses to 1, now and at boot:

