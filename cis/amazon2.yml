    expect: "== active"
    rationale: *rat-bcacc1250b
    remediation: &rem-a5044d0b79 |
      Start the service firewalld:

      systemctl start firewalld
  - id: "CIS-AMAZON2-3.4.1.2-fw_fwd_nft_stopped-enabled"
    name: "Service nftables is not enabled"
    description: "CIS Amazon Linux 2 benchmark recommendation 3.4.1.2."
    tags: [cis, cis-amazon2, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState nftables | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-2478081268 |
      Running several firewall management tools at the same time (firewalld, the nftables service, the iptables service) leads to conflicting rule sets and unpredictable filtering. When firewalld manages the firewall, the nftables service should be neither enabled nor running.
    remediation: &rem-7b07e6f2bd |
      Disable the service nftables, unless the system needs it:

      systemctl disable nftables

      To keep other units from starting it, mask it instead: systemctl mask nftables
