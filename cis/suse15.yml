      sh -c "grep auid /etc/audit/rules.d/*.rules"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid\u003e=1000 -F auid!=(unset|4294967295|-1) -k access" }
      - { some: "~ -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid\u003e=1000 -F auid!=(unset|4294967295|-1) -k access" }
      - { some: "~ -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid\u003e=1000 -F auid!=(unset|4294967295|-1) -k access" }
      - { some: "~ -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid\u003e=1000 -F auid!=(unset|4294967295|-1) -k access" }
    rationale: &rat-b0a74a2a93 |
      Repeated attempts to open, create or truncate files that fail with permission errors often indicate that someone is probing for data they are not allowed to access. Auditing these failures for regular users makes such attempts visible. This check verifies the persistent audit configuration.
    remediation: &rem-e74497d5d0 |
      Record file access attempts that fail because of missing permissions: add these rules to /etc/audit/rules.d/50-access.rules and load them.

      -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access
      -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access
      -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access
      -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
