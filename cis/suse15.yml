  - id: "CIS-SUSE15-1.7.4-motd_permissions-attrs"
    name: "/etc/motd: mode 0644 or stricter, owner root, group root"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.7.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/motd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
