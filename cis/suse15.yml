  - id: "CIS-SUSE15-3.3.10-net.ipv4.tcp_syncookies"
    name: "Kernel parameter net.ipv4.tcp_syncookies is 1"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.3.10. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse15, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.tcp_syncookies
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-59ba1f79a7 |
      In a SYN flood an attacker sends many connection requests without completing the handshake, filling the connection backlog and blocking legitimate clients. SYN cookies let the kernel accept new connections without keeping state once the backlog is full, keeping services reachable during such an attack.
    remediation: &rem-8326186a4f |
      Set the kernel parameter net.ipv4.tcp_syncookies to 1, now and at boot:

      sysctl -w 'net.ipv4.tcp_syncookies=1'
      printf '%s\n' 'net.ipv4.tcp_syncookies = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.tcp_syncookies from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-SUSE15-3.3.10-ipv4_tcp_syncookies"
    name: "ipv4 tcp syncookies: grep \"net\\.ipv4\\.tcp_syncookies\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.3.10. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse15, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "net\.ipv4\.tcp_syncookies" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^\\/etc\\/sysctl.*:net.ipv4.tcp_syncookies\\s*=\\s*1" }
    rationale: &rat-51c066af99 |
      In a SYN flood an attacker fills the queue of half-open TCP connections so that legitimate clients cannot connect. SYN cookies let the kernel keep accepting connections without storing state when the queue is full.
    remediation: &rem-fce02cd8e2 |
      Set net.ipv4.tcp_syncookies to 1 in a file in /etc/sysctl.d/ and apply it at runtime. Correct any other file that sets a different value (the check command lists them).

      printf '%s\n' 'net.ipv4.tcp_syncookies=1' >> /etc/sysctl.d/60-netipv4_sysctl.conf
      sysctl -w net.ipv4.tcp_syncookies=1

      Files in /etc/sysctl.d/ are applied in lexical order, so a later file can override this setting.
  - id: "CIS-SUSE15-4.1.1-firewalld_started-enabled"
    name: "Service firewalld is enabled"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 4.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState firewalld | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-319d30ea18 |
      A host-based firewall only protects the system when its service is running and starts at boot. firewalld must be enabled and active so that the configured zones and rules are applied continuously.
    remediation: &rem-446eda8ec3 |
      Enable the service firewalld:

      systemctl enable firewalld
