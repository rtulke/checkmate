    remediation: *rem-0548535fe6
  - id: "CIS-SUSE15-2.2.3-nis_client"
    name: "Package ypbind is not installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.2.3. NIST SP 800-53 Rev. 5: CM-7, CM-11."
    tags: [cis, cis-suse15, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet ypbind
    expect: false
    rationale: &rat-ac1806fa8d |
