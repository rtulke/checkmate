  - id: "CIS-SUSE15-3.1.1-ipv6_disabled"
    name: "ipv6 disabled: [ -d /proc/sys/net/ipv6 ] || { echo \"IPv6 disabled in the kernel\"; exit 0; }"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse15, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      [ -d /proc/sys/net/ipv6 ] || { echo "IPv6 disabled in the kernel"; exit 0; }
      f=/etc/sysctl.d/60-disable_ipv6.conf
      grep -Eq '^\s*net\.ipv6\.conf\.all\.disable_ipv6\s*=\s*1' "$f" && grep -Eq '^\s*net\.ipv6\.conf\.default\.disable_ipv6\s*=\s*1' "$f" && echo "IPv6 disabled by sysctl"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^IPv6 disabled (in the kernel|by sysctl)$" }
    rationale: &rat-14ea3ba3bc |
      Where IPv6 is not used, an enabled IPv6 stack still configures addresses and accepts traffic that firewall rules and monitoring may not cover. Disabling it through sysctl for all and default interfaces removes this unmanaged exposure. Systems or applications that need IPv6 must keep it enabled.
    remediation: &rem-5d6a9c4b7b |
      Disable IPv6 in /etc/sysctl.d/60-disable_ipv6.conf (the file the check reads) and apply it.

      printf '%s\n' 'net.ipv6.conf.all.disable_ipv6 = 1' 'net.ipv6.conf.default.disable_ipv6 = 1' > /etc/sysctl.d/60-disable_ipv6.conf
      sysctl -p /etc/sysctl.d/60-disable_ipv6.conf

      On SUSE 15 the check also passes when IPv6 is not available in the kernel at all.
  - id: "CIS-SUSE15-3.1.2-wireless_disabled"
    name: "wireless disabled: find /sys/class/net/*/ -type d -name wireless 2\u003e/dev/null | while read -r l_dir; do"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.1.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse15, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      find /sys/class/net/*/ -type d -name wireless 2>/dev/null | while read -r l_dir; do
        l_iface="$(dirname "$l_dir")"
        if [ -e "$l_iface/device/driver/module" ]; then
          basename "$(readlink -f "$l_iface/device/driver/module")"
        else
          echo "builtin:$(basename "$l_iface")"
        fi
      done | sort -u | while read -r l_mname; do
        case "$l_mname" in
          builtin:*) echo "${l_mname#builtin:} driver is built into the kernel"; continue ;;
        esac
        modprobe -n -v "$l_mname" 2>/dev/null | grep -P '^\h*install\h+/(usr/)?bin/(true|false)\b' >/dev/null || echo "$l_mname is loadable"
        lsmod | awk '{print $1}' | grep -x "$l_mname" >/dev/null && echo "$l_mname is loaded"
        modprobe --showconfig 2>/dev/null | grep -P "^\h*blacklist\h+$l_mname\b" >/dev/null || echo "$l_mname is not deny listed"
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-0d79aa42e1 |
      Wireless interfaces open a network path that bypasses wired network controls such as firewalls and segmentation, and they expose the system to attackers within radio range. Servers rarely need them; turning off the radios or blocking their drivers removes this exposure.
    remediation: &rem-91e73f7d9d |
      Block the driver module of every wireless interface so that it is deny listed, cannot be loaded and is unloaded. Find each interface's driver, block it and unload it:

      basename "$(readlink -f /sys/class/net/IFACE/device/driver/module)"
      printf 'blacklist %s\ninstall %s /bin/false\n' MODULE MODULE >> /etc/modprobe.d/blacklist-wireless.conf
      modprobe -r MODULE

      Drivers built into the kernel cannot be blocked this way; such hardware has to be disabled in the firmware setup or removed.
  - id: "CIS-SUSE15-3.1.3-bluetooth_pkg"
    name: "Package bluez is not installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.1.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse15, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet bluez
    expect: false
    rationale: &rat-26028fd092 |
      Bluetooth gives devices in radio range a way to connect to the system and has a history of remotely exploitable vulnerabilities. Servers rarely need it, so removing the BlueZ stack removes this wireless attack surface.
    remediation: &rem-fedc70f857 |
      Remove the package bluez, unless the system needs it:

      zypper remove bluez
  - id: "CIS-SUSE15-3.2.1-lsmod_dccp"
    name: "lsmod dccp: lsmod | grep -i dccp"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.2.1. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-suse15, cis-section-3, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      lsmod | grep -i dccp
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-c5d39e1c4c |
      DCCP is a rarely used transport protocol whose kernel code has had serious vulnerabilities. Because unprivileged programs can trigger automatic loading of the module by opening a DCCP socket, an unused protocol still adds attack surface. The check verifies the module is not loaded.
    remediation: &rem-7463e2edd5 |
      Prevent the dccp module from loading and unload it if it is loaded.

      printf '%s\n' 'blacklist dccp' 'install dccp /bin/false' > /etc/modprobe.d/dccp.conf
      modprobe -r dccp

      If the module is in use, stop the application using it or reboot.
  - id: "CIS-SUSE15-3.2.1-modprobe_dccp"
    name: "modprobe dccp: modprobe -n -v dccp"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.2.1. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-suse15, cis-section-3, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      modprobe -n -v dccp
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install \\/bin\\/(true|false)" }
    rationale: &rat-41ef8e8fab |
      DCCP is a rarely used datagram transport protocol. Its kernel module has had several serious vulnerabilities that can be triggered by local users or from the network. Preventing the module from loading removes this attack surface on systems that do not use the protocol.
    remediation: &rem-66ee3312a3 |
      Keep the dccp module from being loaded: add an install override and a blacklist entry for it in /etc/modprobe.d/, then unload it if it is currently loaded.

      printf '%s\n' 'install dccp /bin/false' 'blacklist dccp' > /etc/modprobe.d/dccp.conf
      modprobe -r dccp

      modprobe -r reports an error if the module is not loaded, which is harmless; if sockets of this protocol are open, the module stays loaded until reboot.
  - id: "CIS-SUSE15-3.2.2-lsmod_TIPC"
    name: "lsmod TIPC: lsmod | grep -i tipc"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.2.2. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-suse15, cis-section-3, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      lsmod | grep -i tipc
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-0ec07a7f50 |
      TIPC is a cluster communication protocol that few systems use, and its kernel code has had remotely exploitable vulnerabilities. Since opening a socket can load the module automatically, keeping it unloaded and blocked removes this attack surface. The check verifies the module is not loaded.
    remediation: &rem-f85d3137a2 |
      Prevent the tipc module from loading and unload it if it is loaded.

      printf '%s\n' 'blacklist tipc' 'install tipc /bin/false' > /etc/modprobe.d/tipc.conf
      modprobe -r tipc

      If the module is in use, stop the application using it or reboot.
  - id: "CIS-SUSE15-3.2.2-modprobe_TIPC"
    name: "modprobe TIPC: modprobe -n -v tipc"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.2.2. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-suse15, cis-section-3, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      modprobe -n -v tipc
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ install \\/bin\\/(true|false)" }
    rationale: &rat-94829ab02a |
      TIPC is a cluster communication protocol that few systems use, and its kernel code has had remotely exploitable vulnerabilities. Mapping the module to /bin/false in the modprobe configuration prevents it from being loaded on demand, for example when a program opens a TIPC socket.
    remediation: *rem-f85d3137a2
  - id: "CIS-SUSE15-3.2.3-lsmod_rds"
    name: "lsmod rds: lsmod | grep -i rds"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.2.3. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-suse15, cis-section-3, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      lsmod | grep -i rds
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-e2edf4be39 |
      RDS (Reliable Datagram Sockets) is a protocol for cluster communication that ordinary servers do not use. Its kernel module has had serious vulnerabilities, and an unused protocol module that can be loaded on demand is unnecessary attack surface. The check confirms the module is not loaded.
    remediation: &rem-a42fd56710 |
