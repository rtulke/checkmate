  - id: "CIS-SUSE15-1.8.1-gdm_removed"
    name: "Package gdm is not installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.8.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      rpm -q --quiet gdm
    expect: false
    rationale: &rat-90c9fbab39 |
      A graphical display manager and the desktop stack it pulls in add a large amount of software, listening components and potential vulnerabilities that servers rarely need. Removing GDM reduces the attack surface; workstations that need a graphical login are an exception.
    remediation: &rem-f2d2bd2ec0 |
      Remove the package gdm, unless the system needs it:

      zypper remove gdm
  - id: "CIS-SUSE15-2.1.1-autofs_pkg"
    name: "Package autofs is not installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.1.1. NIST SP 800-53 Rev. 5: SI-3, MP-7."
    tags: [cis, cis-suse15, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet autofs
    expect: false
    rationale: &rat-66cc7255f3 |
      autofs mounts file systems automatically when they are accessed, including removable media and network shares. That makes it easier to introduce untrusted media and adds a privileged daemon. Systems that do not rely on automounted network shares or home directories should not have it installed.
    remediation: &rem-52c4ac28ea |
      Remove the package autofs, unless the system needs it:

      zypper remove autofs
  - id: "CIS-SUSE15-2.1.2-avahi_pkg"
    name: "Package avahi is not installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.1.2. NIST SP 800-53 Rev. 5: SI-4."
    tags: [cis, cis-suse15, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet avahi
    expect: false
    rationale: &rat-70b707d084 |
      Avahi implements mDNS/DNS-SD zero-configuration networking, advertising and discovering services on the local network. Servers rarely need it; it runs a listening network daemon and discloses information about the host. Removing it reduces attack surface.
    remediation: &rem-b0fe32e931 |
      Remove the package avahi, unless the system needs it:

      zypper remove avahi
  - id: "CIS-SUSE15-2.1.3-dhcp_pkg"
    name: "Package dhcp-server is not installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.1.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse15, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet dhcp-server
