    expect: true
    rationale: &rat-9e2e0570f3 |
      sudo lets administrators run individual commands with elevated privileges under their own identity, with logging. This avoids shared root passwords and direct root logins, and provides an audit trail of privileged actions.
    remediation: &rem-cfb83c57ec |
      Install the package sudo:

      zypper install sudo
  - id: "CIS-SUSE15-5.2.2-pty_sudoers_d"
    name: "pty sudoers d: export PTY=`grep -q -Ei '^\\s*Defaults\\s+(\\[^#]+,\\s*)?use_pty' /etc/sudoers /etc/sudoers.d…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.2.2. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      export PTY=`grep -q -Ei '^\s*Defaults\s+(\[^#]+,\s*)?use_pty' /etc/sudoers /etc/sudoers.d/*; echo $?` && if [[ $PTY == 0 ]];then echo OK ;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK" }
    rationale: &rat-63218cca98 |
      With use_pty, sudo runs commands in a separate pseudo-terminal. A malicious program started through sudo then cannot inject input into the user's terminal or keep access to it after sudo exits. It also makes I/O logging complete.
    remediation: &rem-bf550576ff |
      Enable use_pty with a line of its own in a file under /etc/sudoers.d/, remove any Defaults !use_pty setting and validate the syntax.

      echo 'Defaults use_pty' > /etc/sudoers.d/50-use_pty
      chmod 0440 /etc/sudoers.d/50-use_pty
      grep -rnE '^\s*Defaults.*!use_pty' /etc/sudoers /etc/sudoers.d/
      visudo -c

      sudo ignores files in /etc/sudoers.d/ whose names contain a dot or end with ~.
  - id: "CIS-SUSE15-5.2.3-log_sudoers_d"
    name: "log sudoers d: export LOG=`grep -q -Esi '^\\s*Defaults\\s+([^#]+,\\s*)?logfile=' /etc/sudoers /etc/sudoers.…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.2.3. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      export LOG=`grep -q -Esi '^\s*Defaults\s+([^#]+,\s*)?logfile=' /etc/sudoers /etc/sudoers.d/*; echo $?` && if [[ $LOG == 0 ]];then echo OK ;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK" }
    rationale: &rat-73ffb83e75 |
      A dedicated sudo log file records every sudo invocation with user, terminal, working directory and command. That makes privileged activity easy to review and keeps the record separate from general system logs.
    remediation: &rem-b7aaa6ded0 |
      Configure a dedicated sudo log file under /var/log in a Defaults line of its own and validate the syntax.

      echo 'Defaults logfile="/var/log/sudo.log"' > /etc/sudoers.d/50-logfile
      chmod 0440 /etc/sudoers.d/50-logfile
      visudo -c
  - id: "CIS-SUSE15-5.2.4-nopasswd_sudoers_d"
    name: "nopasswd sudoers d: grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v '.*\\:#'"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.2.4. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-suse15, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v '.*\:#'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-eecb763928 |
      NOPASSWD lets users run commands with elevated privileges without entering their password. Anyone who gains access to such an account, or a process running as it, obtains root immediately. Requiring the password confirms the person and limits the impact of a hijacked session.
    remediation: &rem-a35cd5880e |
      Review every listed sudo rule with NOPASSWD and remove the tag (or the rule) unless a documented exception applies. Edit the files with visudo so syntax errors are caught.

      grep -rn NOPASSWD /etc/sudoers /etc/sudoers.d/
      visudo -f FILE

      Users who lose NOPASSWD need a password to use sudo. On cloud images the default user (for example via /etc/sudoers.d/90-cloud-init-users) often has none; set one first, or you may lose administrative access.
  - id: "CIS-SUSE15-5.2.5-authenticate_sudoers"
    name: "authenticate sudoers: grep -r \"^[^#].*\\!authenticate\" /etc/sudoers*"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.2.5. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -r "^[^#].*\!authenticate" /etc/sudoers*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-0aa92719bf |
      The !authenticate option lets sudo run commands without asking for the user's password. Anyone who gets hold of an unlocked session or a compromised account of such a user can then act with elevated privileges without any further barrier. Requiring re-authentication for sudo keeps privilege escalation tied to knowledge of the password.
    remediation: &rem-f4fb208b6d |
      Remove the !authenticate option from every sudoers rule and Defaults line reported by the check. Edit each file with visudo so that the syntax is validated before it is saved.

      grep -rn '!authenticate' /etc/sudoers /etc/sudoers.d/
      visudo -f /etc/sudoers
      visudo -f /etc/sudoers.d/FILE

      Affected users will be asked for their password again when they use sudo.
  - id: "CIS-SUSE15-5.2.6-sudo_timeout"
    name: "sudo timeout: grep -rP \"timestamp_timeout=\\K[0-9]*\" /etc/sudoers*"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.2.6. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -rP "timestamp_timeout=\K[0-9]*" /etc/sudoers*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ timestamp_timeout=(-1|1[6-9]|[2-9][0-9]|[1-9][0-9]{2,})" }
      - { some: "~ timestamp_timeout=([5-9]|1[0-5])" }
    rationale: &rat-14f3ec7a75 |
      After a successful authentication, sudo caches the credentials for a while so that further commands do not ask for the password again. A long or unlimited cache lets anyone with access to an unattended terminal run privileged commands. Keeping the timeout at 15 minutes or less limits that window while staying practical for administrators.
    remediation: &rem-391bdc9433 |
      Set the sudo credential cache timeout to 15 minutes or less in a sudoers drop-in file, and remove larger or negative timestamp_timeout values from all other sudoers files.

      grep -rn 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/
      echo 'Defaults timestamp_timeout=15' > /etc/sudoers.d/50-timestamp-timeout
      chmod 0440 /etc/sudoers.d/50-timestamp-timeout
      visudo -c

      Write the value without spaces around the equals sign; the check searches for timestamp_timeout=VALUE literally.
  - id: "CIS-SUSE15-5.2.7-restrict_su-attrs"
    name: "/etc/pam.d/su: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/su'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-43a7e69d11 |
      su lets any user who knows the root password, or another account's password, switch identity. Restricting su with pam_wheel to members of a dedicated (normally empty) group prevents switching to root through su and forces administrators to use sudo, where actions are attributed to individual accounts and logged.
    remediation: &rem-d67efd69b0 |
      Create /etc/pam.d/su.
  - id: "CIS-SUSE15-5.2.7-restrict_su-content"
    name: "/etc/pam.d/su has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/su'
    allow_rc: any
    expect: { some: "~ ^\\s*auth\\s+(required|requisite)\\s+pam_wheel\\.so\\s+(\\S+\\s+)*(use_uid\\s+(\\S+\\s+)*group=\\S+|group=\\S+\\s+(\\S+\\s+)*use_uid)(\\s|$)" }
    rationale: *rat-43a7e69d11
    remediation: &rem-ee23a5a1dd |
      Edit /etc/pam.d/su so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*auth\s+(required|requisite)\s+pam_wheel\.so\s+(\S+\s+)*(use_uid\s+(\S+\s+)*group=\S+|group=\S+\s+(\S+\s+)*use_uid)(\s|$)
  - id: "CIS-SUSE15-5.2.7-sugroup_etc_group"
    name: "The group that pam_wheel allows to use su has no members"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      g=$(sed -nE 's/^[[:space:]]*auth[[:space:]]+(required|requisite)[[:space:]]+pam_wheel\.so[[:space:]](.*[[:space:]])?group=([^[:space:]]+).*/\3/p' /etc/pam.d/su 2>/dev/null | sed -n 1p)
      if [ -z "$g" ]; then echo "pam_wheel in /etc/pam.d/su names no group"; exit 0; fi
      e=$(getent group "$g")
      if [ -z "$e" ]; then echo "group $g does not exist"; exit 0; fi
      echo "$e" | awk -F: '$4 != "" {print "group " $1 " has members: " $4}'
    allow_rc: any
    expect: empty
    rationale: &rat-575a3911d0 |
      Restricting su with pam_wheel to members of a dedicated group prevents ordinary users from switching to root or other accounts by guessing or knowing their passwords. Using an empty group makes su usable only by root, so administrators must use sudo, which is logged per user. The group must exist and have no members.
    remediation: &rem-80fba87223 |
      Create a group without members and restrict su to it with pam_wheel in /etc/pam.d/su. The group can have any name; sugroup is an example.

      groupadd sugroup
      gpasswd -M '' sugroup
      grep -Eq '^\s*auth\s+(required|requisite)\s+pam_wheel\.so\s.*group=' /etc/pam.d/su || sed -i '/^auth\s\+sufficient\s\+pam_rootok.so/a auth required pam_wheel.so use_uid group=sugroup' /etc/pam.d/su

      If pam_wheel already names a group, remove its members instead: gpasswd -M '' GROUP.
  - id: "CIS-SUSE15-5.3.1.1-pam_version"
    name: "Package pam is installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet pam
    expect: true
    rationale: &rat-7802ae6e55 |
      Several authentication controls, such as faillock.conf, pwhistory configuration files and fixes for known PAM vulnerabilities, depend on a sufficiently recent PAM package. An outdated PAM may silently ignore settings that are believed to be active or leave security fixes unapplied. Keeping PAM at the required version ensures the configured policies are actually enforced.
    remediation: &rem-d7039b64c8 |
      Install the package pam:

      zypper install pam
  - id: "CIS-SUSE15-5.3.1.1-pam_version-version"
    name: "Package pam version \u003e= 1.3.0-150000.6.71.2"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --qf '%{VERSION}-%{RELEASE}' pam
    allow_rc: any
    as: version
    expect:
      - { rc: "== 0" }
      - "\u003e= 1.3.0-150000.6.71.2"
    rationale: *rat-7802ae6e55
    remediation: &rem-9710a37e00 |
      Update the package pam to a version >= 1.3.0-150000.6.71.2:

      zypper update pam
  - id: "CIS-SUSE15-5.3.2.1.1-faillock_attempts_deny-attrs"
    name: "/etc/security/faillock.conf: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-241af1b0a8 |
      Locking an account after a small number of consecutive failed logins stops online password guessing against it. Without a limit, an attacker can try passwords indefinitely. A limit of five or fewer attempts keeps guessing impractical; the trade-off is that attackers can deliberately lock accounts, which the unlock time should balance.
    remediation: &rem-41697c6a61 |
      Create /etc/security/faillock.conf.
  - id: "CIS-SUSE15-5.3.2.1.1-faillock_attempts_deny-content"
    name: "/etc/security/faillock.conf has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/security/faillock.conf'
    allow_rc: any
    expect:
      - { some: "~ ^deny\\s*=\\s*[1-5]$" }
      - { none: "~ ^deny\\s*=\\s*([6-9]|[0-9]{2,})" }
    rationale: *rat-241af1b0a8
    remediation: &rem-ac54390737 |
      Edit /etc/security/faillock.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^deny\s*=\s*[1-5]$
      - no line matches ^deny\s*=\s*([6-9]|[0-9]{2,})
  - id: "CIS-SUSE15-5.3.2.1.2-faillock_unlock_time-attrs"
    name: "/etc/security/faillock.conf: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f655eb77df |
      The unlock time determines how long an account stays locked after too many failed logins. A short lock barely slows down automated guessing, while 0 keeps the account locked until an administrator intervenes. Variants differ in whether they favour long locks or a maximum of 15 minutes to limit denial of service.
    remediation: *rem-41697c6a61
  - id: "CIS-SUSE15-5.3.2.1.2-faillock_unlock_time-content"
    name: "/etc/security/faillock.conf has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/security/faillock.conf'
    allow_rc: any
    expect:
      - { some: "~ ^unlock_time\\s*=\\s*([1-9]|[1-9][0-9]|[1-8][0-9]{1,2}|900)$" }
      - { none: "~ ^unlock_time\\s*=\\s*(90[1-9]|9[1-9][0-9]|[1-9][0-9][0-9]{2,})" }
    rationale: *rat-f655eb77df
    remediation: &rem-aa192ec351 |
      Edit /etc/security/faillock.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^unlock_time\s*=\s*([1-9]|[1-9][0-9]|[1-8][0-9]{1,2}|900)$
      - no line matches ^unlock_time\s*=\s*(90[1-9]|9[1-9][0-9]|[1-9][0-9][0-9]{2,})
  - id: "CIS-SUSE15-5.3.2.1.3-faillock_root_unlock_time-attrs"
    name: "/etc/security/faillock.conf: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-455eda8837 |
      Without even_deny_root, root is exempt from faillock lockouts and can be guessed without limit. If root lockout is enabled with root_unlock_time, the value should be at least 60 seconds so that repeated guessing is actually slowed down.
    remediation: *rem-41697c6a61
  - id: "CIS-SUSE15-5.3.2.1.3-faillock_root_unlock_time-content"
    name: "/etc/security/faillock.conf has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/security/faillock.conf'
    allow_rc: any
    expect:
      - { some: "~ ^(even_deny_root|root_unlock_time\\s*=\\s*([6-9][0-9]|[1-9][0-9]{2,})$)" }
      - { none: "~ ^root_unlock_time\\s*=\\s*([0-9]|[1-5][0-9]|60)" }
    rationale: *rat-455eda8837
    remediation: &rem-1b110ec136 |
      Edit /etc/security/faillock.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^(even_deny_root|root_unlock_time\s*=\s*([6-9][0-9]|[1-9][0-9]{2,})$)
      - no line matches ^root_unlock_time\s*=\s*([0-9]|[1-5][0-9]|60)
  - id: "CIS-SUSE15-5.3.2.2.1-dict_check_use_pam"
    name: "dict check use pam: grep -Psi -- 'pam_cracklib.so' /etc/pam.d/*"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- 'pam_cracklib.so' /etc/pam.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ common-password:password\\s+requisite\\s+pam_cracklib.so" }
      - { some: "~ common-password-pc:password\\s*requisite\\s+pam_cracklib.so" }
      - { some: "~ common-password.pam-config-backup:password\\s+requisite\\s+pam_cracklib.so" }
    rationale: &rat-c36cb6cf94 |
      pam_cracklib rejects passwords that are based on dictionary words or simple variations of them, which are cracked first by wordlist attacks. It must be active in the common password stack so that every password change is checked.
    remediation: &rem-30329ed87e |
      Enable pam_cracklib in the common password configuration with pam-config and verify that common-password links to common-password-pc.

      pam-config -a --cracklib
      ls -l /etc/pam.d/common-password
      grep pam_cracklib.so /etc/pam.d/common-password*

      The check also expects the line in /etc/pam.d/common-password.pam-config-backup, which only exists where pam-config converted a manually edited file.
  - id: "CIS-SUSE15-5.3.2.2.2-difok_check_use_pam"
    name: "difok check use pam: pam-config --query --cracklib --cracklib-difok"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.2.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pam-config --query --cracklib --cracklib-difok
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ password\\:.*difok=([2-9]|1[0-9])" }
    rationale: &rat-c122407b2a |
      If a new password differs from the old one by only one or two characters, an attacker who knows the old password can guess the new one easily. difok requires a minimum number of changed characters.
    remediation: &rem-49bc4ce322 |
      Set the option with pam-config and verify it.

      pam-config -a --cracklib --cracklib-difok=2
      pam-config --query --cracklib

      pam-config writes /etc/pam.d/common-password-pc, which /etc/pam.d/common-password normally links to. If your pam-config version lacks the option, add the argument to the pam_cracklib.so line in /etc/pam.d/common-password-pc.
  - id: "CIS-SUSE15-5.3.2.2.3-minlen_check_use_pam"
    name: "minlen check use pam: pam-config --query --cracklib --cracklib-minlen"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.2.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pam-config --query --cracklib --cracklib-minlen
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ password\\:.*minlen=(1[4-9]|[2-5][0-9])" }
      - { none: "~ password\\.*:minlen\\s*=\\s*([1-9]|1[0-3])" }
    rationale: &rat-b9b0f478b7 |
      Password length is the main factor in resistance to guessing and offline cracking. A minimum length of 14 characters makes brute-force attacks impractical for passwords that are not otherwise predictable.
    remediation: &rem-391f7f4ecc |
      Set the option with pam-config and verify it.

      pam-config -a --cracklib --cracklib-minlen=14
      pam-config --query --cracklib

      pam-config writes /etc/pam.d/common-password-pc, which /etc/pam.d/common-password normally links to. If your pam-config version lacks the option, add the argument to the pam_cracklib.so line in /etc/pam.d/common-password-pc.
  - id: "CIS-SUSE15-5.3.2.2.4-mpasswd_complex_check_use_pam"
    name: "mpasswd complex check use pam: pam-config --query --cracklib"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.2.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pam-config --query --cracklib
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ password\\:.*(minclass\\s*=\\s*4|[dolu]credit\\s*=\\s*-1 [dolu]credit\\s*=\\s*-1 [dolu]credit\\s*=\\s*-1 [dolu]credit\\s*=\\s*-1)" }
    rationale: &rat-93d4af0045 |
      Requiring characters from all four classes (digits, upper case, lower case, others) enlarges the search space for password guessing and prevents passwords composed of letters or digits only.
    remediation: &rem-4e641eadf8 |
      Set the option with pam-config and verify it.

      pam-config -a --cracklib --cracklib-minclass=4
      pam-config --query --cracklib

      Alternatively set dcredit, ucredit, lcredit and ocredit to -1. pam-config writes /etc/pam.d/common-password-pc, which /etc/pam.d/common-password normally links to. If your pam-config version lacks the option, add the argument to the pam_cracklib.so line in /etc/pam.d/common-password-pc.
  - id: "CIS-SUSE15-5.3.2.2.5-maxrepeat_check_use_pam"
    name: "maxrepeat check use pam: pam-config --query --cracklib --cracklib-maxrepeat"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.2.5. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pam-config --query --cracklib --cracklib-maxrepeat
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ password\\:.*maxrepeat\\s*=\\s*[1-3]" }
      - { none: "~ password\\.*:maxrepeat\\s*=\\s*(0|[4-9]|[1-9][0-9])" }
    rationale: &rat-bb0654b08c |
      Long runs of the same character add little strength to a password and are easy to guess. Limiting consecutive identical characters to three forces more varied passwords.
    remediation: &rem-b189777870 |
      Set the option with pam-config and verify it.

      pam-config -a --cracklib --cracklib-maxrepeat=3
      pam-config --query --cracklib

      pam-config writes /etc/pam.d/common-password-pc, which /etc/pam.d/common-password normally links to. If your pam-config version lacks the option, add the argument to the pam_cracklib.so line in /etc/pam.d/common-password-pc.
  - id: "CIS-SUSE15-5.3.2.2.6-maxsequence_check_use_pam"
    name: "maxsequence check use pam: pam-config --query --cracklib --cracklib-maxsequence"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.2.6. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pam-config --query --cracklib --cracklib-maxsequence
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ password\\:.*maxsequence\\s*=\\s*[1-3]" }
      - { none: "~ password\\.*:maxsequence\\s*=\\s*(0|[4-9]|[1-9][0-9])" }
    rationale: &rat-f0549bdf6b |
      Monotonic sequences such as '1234' or 'abcd' are among the first patterns crackers try. Limiting them to three characters removes this predictable component.
    remediation: &rem-c9f7e9d889 |
      Set the option with pam-config and verify it.

      pam-config -a --cracklib --cracklib-maxsequence=3
      pam-config --query --cracklib

      pam-config writes /etc/pam.d/common-password-pc, which /etc/pam.d/common-password normally links to. If your pam-config version lacks the option, add the argument to the pam_cracklib.so line in /etc/pam.d/common-password-pc.
  - id: "CIS-SUSE15-5.3.2.2.7-enforce_for_root_check_use_pam"
    name: "enforce for root check use pam: pam-config --query --cracklib --cracklib-enforce_for_root"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.2.7. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pam-config --query --cracklib --cracklib-enforce_for_root
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ password\\:.*enforce_for_root" }
    rationale: &rat-ad5dcfd886 |
      By default, password quality failures are only warnings when root sets a password. enforce_for_root applies the strength rules to root as well, so weak passwords cannot be set through root.
    remediation: &rem-1388031f75 |
      Set the option with pam-config and verify it.

      pam-config -a --cracklib --cracklib-enforce_for_root
      pam-config --query --cracklib

      pam-config writes /etc/pam.d/common-password-pc, which /etc/pam.d/common-password normally links to. If your pam-config version lacks the option, add the argument to the pam_cracklib.so line in /etc/pam.d/common-password-pc.
  - id: "CIS-SUSE15-5.3.2.3.1-pwhistory_remember_use_pam"
    name: "pwhistory remember use pam: pam-config --query --pwhistory --pwhistory-remember"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.3.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pam-config --query --pwhistory --pwhistory-remember
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ password:.*remember\\s*=\\s*(2[4-9])" }
    rationale: &rat-6e230f8014 |
      Remembering the last 24 passwords prevents users from returning to an earlier password soon after a forced change, which would make password expiry pointless and allow reuse of exposed passwords.
    remediation: &rem-8bac3cd2b6 |
      Enable pam_pwhistory with a history of 24 passwords and verify it.

      pam-config -a --pwhistory --pwhistory-remember=24
      pam-config --query --pwhistory

      pam-config writes /etc/pam.d/common-password-pc, which /etc/pam.d/common-password normally links to.
  - id: "CIS-SUSE15-5.3.2.3.2-pwhistory_remember_root_use_pam"
    name: "pwhistory remember root use pam: pam-config --query --pwhistory --pwhistory-enforce_for_root"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.3.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pam-config --query --pwhistory --pwhistory-enforce_for_root
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ password:.*enforce_for_root" }
    rationale: &rat-e684170f93 |
      Without enforce_for_root, the password history is not checked when root changes passwords, so old passwords can be reused through root. The option closes this gap.
    remediation: &rem-0bf19de6ec |
      Add enforce_for_root to pam_pwhistory and verify it.

      pam-config -a --pwhistory --pwhistory-enforce_for_root
      pam-config --query --pwhistory

      pam-config writes /etc/pam.d/common-password-pc, which /etc/pam.d/common-password normally links to.
  - id: "CIS-SUSE15-5.3.2.3.3-pwhistory_authtok_use_pam"
    name: "pwhistory authtok use pam: grep -P -- '^\\h*password\\h+([^#\\n\\r]+)\\h+pam_pwhistory\\.so\\h+([^#\\n\\r]+\\h+)?use_authtok\\b…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.3.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -P -- '^\h*password\h+([^#\n\r]+)\h+pam_pwhistory\.so\h+([^#\n\r]+\h+)?use_authtok\b' /etc/pam.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ etc\\/pam.d\\/common-password:password\\s*required\\s*pam_pwhistory.so.*use_authtok" }
      - { some: "~ etc\\/pam.d\\/common-password-pc:password\\s*required\\s*pam_pwhistory.so.*use_authtok" }
    rationale: &rat-0ce6985167 |
      With use_authtok, pam_pwhistory checks the new password already accepted by the strength checks instead of prompting again, so the password compared against the history is the one that will actually be stored.
    remediation: &rem-3dd6415744 |
      Add use_authtok to the pam_pwhistory line with pam-config and verify that common-password and common-password-pc contain 'password required pam_pwhistory.so ... use_authtok'.

      pam-config -a --pwhistory --pwhistory-use_authtok
      grep pam_pwhistory /etc/pam.d/common-password /etc/pam.d/common-password-pc

      If the line uses a control other than required, change it to required in /etc/pam.d/common-password-pc.
  - id: "CIS-SUSE15-5.3.2.4.1-pam_unix_nullok"
    name: "pam unix nullok: pam-config --query --unix --unix-nullok"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.4.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pam-config --query --unix --unix-nullok
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*nullok" }
    rationale: &rat-09c8500cf8 |
      The nullok option lets pam_unix accept accounts with an empty password field, so such accounts can log in without any password. Removing it ensures every account must authenticate with a password.
    remediation: &rem-d687f8c702 |
      Remove the nullok option from pam_unix with pam-config and verify it.

      pam-config -d --unix-nullok
      pam-config --query --unix

      Accounts with an empty password can no longer log in afterwards; set passwords or lock them first.
  - id: "CIS-SUSE15-5.3.2.4.2-pam_unix_remember_root"
    name: "pam unix remember root: grep -Pi '^\\h*password\\h+([^#\\n\\r]+\\h+)?pam_unix\\.so\\b' /etc/pam.d/*"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.4.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Pi '^\h*password\h+([^#\n\r]+\h+)?pam_unix\.so\b' /etc/pam.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*pam_unix.*remember" }
    rationale: &rat-f3b8ef5104 |
      The remember option of pam_unix keeps password history in /etc/security/opasswd in a legacy way. Password history should be handled only by pam_pwhistory, so that one consistent policy, including for root, is applied.
    remediation: &rem-e01462f612 |
      Remove remember= from every pam_unix password line the check lists and configure history with pam_pwhistory instead.

      grep -Pi '^\h*password\h+([^#\n\r]+\h+)?pam_unix\.so\b' /etc/pam.d/*
      sed -ri '/pam_unix\.so/s/\s+remember=[0-9]+//' /etc/pam.d/FILE

      For /etc/pam.d/common-password edit common-password-pc, the file it links to.
  - id: "CIS-SUSE15-5.3.2.4.3-pam_unix_password_use_pam"
    name: "pam unix password use pam: pam-config --query --unix --unix-sha512"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.4.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pam-config --query --unix --unix-sha512
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ auth: .*(sha512|yesencrypt)" }
      - { some: "~ account: .*(sha512|yesencrypt)" }
      - { some: "~ password: .*(sha512|yesencrypt)" }
      - { some: "~ session: .*(sha512|yesencrypt)" }
    rationale: &rat-5d7782df0e |
      Passwords stored with a weak or legacy hash can be cracked quickly once the shadow file is exposed. Configuring pam_unix to hash new passwords with SHA-512 makes offline brute-force and dictionary attacks against stolen hashes considerably more expensive.
    remediation: &rem-16aec5bf0f |
      Enable the SHA-512 option of pam_unix with pam-config, then confirm it with the query command.

      pam-config --add --unix-sha512
      pam-config --query --unix --unix-sha512

      Only passwords set after the change are stored as SHA-512; existing users keep their old hash until they change their password.
  - id: "CIS-SUSE15-5.3.2.4.4-pam_unix_authtok"
    name: "pam unix authtok: grep -P -- '^\\h*password\\h+([^#\\n\\r]+)\\h+pam_unix\\.so\\h+([^#\\n\\r]+\\h+)?use_authtok\\b' /et…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.3.2.4.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -P -- '^\h*password\h+([^#\n\r]+)\h+pam_unix\.so\h+([^#\n\r]+\h+)?use_authtok\b' /etc/pam.d/common*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ password:password\\s*required\\s*pam_unix.so.*use_authtok" }
      - { some: "~ password-pc:password\\s*required\\s*pam_unix.so.*use_authtok" }
    rationale: &rat-14986774d5 |
      When a password quality module such as pam_pwquality checks a new password, pam_unix should store exactly that password instead of prompting again. The use_authtok option forces this, so the complexity rules cannot be bypassed by entering a different password at a second prompt.
    remediation: &rem-f9ec3d0bbc |
      Make sure the pam_unix line of the password stack in /etc/pam.d/common-password-pc (common-password is a symlink to it) uses the control value required and contains use_authtok. pam-config adds use_authtok automatically when a password quality module is enabled:

      pam-config --add --pwquality
      grep -P '^\h*password\h+required\h+pam_unix\.so\b.*\buse_authtok\b' /etc/pam.d/common-password-pc

      If the line is still missing use_authtok, edit it to read, for example, "password required pam_unix.so use_authtok nullok shadow try_first_pass". Manual edits to the -pc files are overwritten the next time pam-config runs.
  - id: "CIS-SUSE15-5.4.1.1-login_defs_max_days-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-de28e65ea9 |
      A maximum password age limits how long a compromised password remains useful to an attacker who obtained it unnoticed. PASS_MAX_DAYS sets the default maximum for new passwords; 365 days or less forces periodic renewal without the counterproductive effects of very frequent changes.
    remediation: &rem-0b6bdc1798 |
      Create /etc/login.defs.
  - id: "CIS-SUSE15-5.4.1.1-login_defs_max_days-content"
    name: "/etc/login.defs has the expected content (3 rules)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_MAX_DAYS\\s+365" }
      - { none: "~ ^PASS_MAX_DAYS\\s+(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9][0-9][0-9]|[1-9][0-9][0-9][0-9][0-9])" }
      - { none: "~ ^PASS_MAX_DAYS\\s+-1" }
    rationale: *rat-de28e65ea9
    remediation: &rem-f1c03a2be4 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_MAX_DAYS\s+365
      - no line matches ^PASS_MAX_DAYS\s+(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9][0-9][0-9]|[1-9][0-9][0-9][0-9][0-9])
      - no line matches ^PASS_MAX_DAYS\s+-1
  - id: "CIS-SUSE15-5.4.1.2-login_defs_min_days-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d3716bb90c |
      A minimum password age prevents users from changing their password several times in a row to get back to an old favourite, which would defeat password history. PASS_MIN_DAYS of at least one day sets this default for new passwords.
    remediation: *rem-0b6bdc1798
  - id: "CIS-SUSE15-5.4.1.2-login_defs_min_days-content"
    name: "/etc/login.defs has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_MIN_DAYS\\s[1-9]" }
      - { none: "~ ^PASS_MIN_DAYS\\s0" }
    rationale: *rat-d3716bb90c
    remediation: &rem-a762cb4ca6 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_MIN_DAYS\s[1-9]
      - no line matches ^PASS_MIN_DAYS\s0
  - id: "CIS-SUSE15-5.4.1.3-login_defs_warn_age-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ca921e80d6 |
      Warning users several days before their password expires gives them time to choose a good new password instead of being forced into a hasty choice or being locked out. PASS_WARN_AGE sets the default warning period for new passwords.
    remediation: *rem-0b6bdc1798
  - id: "CIS-SUSE15-5.4.1.3-login_defs_warn_age-content"
    name: "/etc/login.defs has the expected content (3 rules)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_WARN_AGE\\s+7$" }
      - { some: "~ ^PASS_WARN_AGE\\s+(7|[1-9][0-9]{1,3})$" }
      - { none: "~ ^PASS_WARN_AGE\\s+[1-6]$" }
    rationale: *rat-ca921e80d6
    remediation: &rem-b04f715e69 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_WARN_AGE\s+7$
      - a line matches ^PASS_WARN_AGE\s+(7|[1-9][0-9]{1,3})$
      - no line matches ^PASS_WARN_AGE\s+[1-6]$
  - id: "CIS-SUSE15-5.4.1.4-login_defs_hashing-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.1.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-281f6b805c |
      Password hashes in /etc/shadow are a prime target once an attacker gains read access. Strong, slow algorithms such as SHA-512 crypt or yescrypt make offline cracking far more expensive than legacy MD5 or DES hashes. ENCRYPT_METHOD sets the algorithm used by tools that read login.defs.
    remediation: *rem-0b6bdc1798
  - id: "CIS-SUSE15-5.4.1.4-login_defs_hashing-content"
    name: "/etc/login.defs has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.1.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect: { some: "~ ^ENCRYPT_METHOD (SHA512|YESCRYPT)" }
    rationale: *rat-281f6b805c
    remediation: &rem-87e3ee7c64 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^ENCRYPT_METHOD (SHA512|YESCRYPT)
  - id: "CIS-SUSE15-5.4.1.5-inactive_passwd"
    name: "inactive passwd: useradd -D | grep INACTIVE"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      useradd -D | grep INACTIVE
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^INACTIVE=([1-9]|[0-3][0-9]|4[0-5])" }
    rationale: &rat-1b1499cc8f |
      The default INACTIVE value used by useradd defines how many days after password expiry an account is disabled. Disabling unused accounts automatically removes forgotten access paths that attackers like to exploit; a value of up to 30 or 45 days, depending on the policy, balances security and usability.
    remediation: &rem-728ced36b8 |
      Set the default password inactivity period for new accounts to 30 days and apply the same value to existing accounts that have a password.

      useradd -D -f 30
      useradd -D | grep INACTIVE
      chage --inactive 30 USER

      30 days satisfies every supported release; some releases also accept up to 45 days.
  - id: "CIS-SUSE15-5.4.1.5-inactive_users"
    name: "inactive users: awk -F':' '($2~/^\\\\$.+\\\\$/) {if($7 \u003e 45 || $7 \u003c 0)print $1 }' /etc/shadow"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F':' '($2~/^\\$.+\\$/) {if($7 > 45 || $7 < 0)print $1 }' /etc/shadow
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^.*" }
    rationale: &rat-c4a4e8be14 |
      Accounts whose password has expired but which remain usable indefinitely are a common foothold for attackers because nobody notices their misuse. Setting a password inactivity period on every account with a password ensures that such accounts are disabled automatically after expiry.
    remediation: &rem-4e712889d3 |
      Set a password inactivity period of 30 days or less on every account that has a password, in particular on each account reported by the check.

      awk -F: '($2 ~ /^\$/) {print $1, $7}' /etc/shadow
      chage --inactive 30 USER

      Set the default for new accounts as well with useradd -D -f 30.
  - id: "CIS-SUSE15-5.4.1.6-passwd_chg_past"
    name: "No user has a last password change date in the future"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.1.6. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      now=$(date +%s)
      for usr in $(cut -d: -f1 /etc/shadow); do
        d=$(chage --list "$usr" 2>/dev/null | awk -F': ' '/^Last password change/ {print $2}')
        case "$d" in ""|never|*"must be changed"*) continue ;; esac
        t=$(date -d "$d" +%s 2>/dev/null) || { echo "$usr: cannot parse last password change '$d'"; continue; }
        if [ "$t" -gt "$now" ]; then echo "$usr: last password change $d is in the future"; fi
      done
    expect: empty
    rationale: &rat-eae9c8e6b4 |
      If the recorded date of the last password change lies in the future, password ageing does not work: the password never expires and the user cannot be forced to change it. Such dates usually result from a wrong system clock or manual edits and should be corrected.
    remediation: &rem-8950b282e3 |
      Check the system clock, then set the last password change of every listed user to today, or expire the password so it must be changed at the next login:

      chage --lastday "$(date +%Y-%m-%d)" USER
      chage --lastday 0 USER
  - id: "CIS-SUSE15-5.4.2.1-uid_0_check"
    name: "uid 0 check: awk -F: '($3 == 0) { print $1 }' /etc/passwd"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.2.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3 == 0) { print $1 }' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root" }
      - { none: "~ [^root]" }
    rationale: &rat-90d4d66c1b |
      Any account with UID 0 has full root privileges, regardless of its name. Additional UID 0 accounts are a classic backdoor and make it impossible to attribute administrative actions; only root should have UID 0.
    remediation: &rem-5c4a8fc9e4 |
      Make sure that only root has UID 0. Find out what every other UID 0 account is used for, then give it a unique non-zero UID with vipw or remove it.

      awk -F: '($3 == 0) {print $1}' /etc/passwd
      vipw
      userdel USER

      usermod -u cannot be used here because the running root processes share UID 0. Also make sure that root itself has UID 0.
  - id: "CIS-SUSE15-5.4.2.2-gid_0_check"
    name: "gid 0 check: awk -F: '($1 !~ /^(sync|shutdown|halt|operator)/ \u0026\u0026 $4=='0') {print $1\":\"$4}' /etc/passwd"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.2.2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($1 !~ /^(sync|shutdown|halt|operator)/ && $4=='0') {print $1":"$4}' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root" }
      - { some: "~ [^root]" }
    rationale: &rat-86032dcad6 |
      Group ID 0 is the root group, which owns many sensitive files and directories. Any other account with primary group 0 can read or modify those resources with root-group rights, far beyond its role. Only root should have GID 0 as primary group, which keeps root-group access deliberate and auditable.
    remediation: &rem-d5614bed37 |
      Give every account reported by the check a different primary group and make sure root itself has primary group 0.

      usermod -g GROUP USER
      usermod -g 0 root

      Afterwards review files the account created with group 0: find / -xdev -user USER -group 0
  - id: "CIS-SUSE15-5.4.2.3-group_root_only_0"
    name: "group root only 0: awk -F: '$3=='0'{print $1\":\"$3}' /etc/group"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.2.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '$3=='0'{print $1":"$3}' /etc/group
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root:0" }
    rationale: &rat-e6e96aa117 |
      GID 0 is the root group, which owns many sensitive system files and directories. Any other group with GID 0 silently gives its members the same group access as root. Ensuring that only the group named root has GID 0 prevents such hidden privilege.
    remediation: &rem-481abd2b91 |
      Make sure the group root has GID 0 and give every other group that the check reports with GID 0 its own unused GID, or remove it if it is not needed.

      awk -F: '$3 == 0' /etc/group
      groupmod -g NEWGID GROUP

      Files keep GID 0 and therefore stay owned by the group root. Review the members of GROUP before changing it. If root itself does not have GID 0, fix it with groupmod -g 0 root after the other groups are moved.
  - id: "CIS-SUSE15-5.4.2.4-root_passwd_set"
    name: "root passwd set: passwd -S root | awk '$2 ~ /^(P|L)/ {print \"OK Password\"}'"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.2.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      passwd -S root | awk '$2 ~ /^(P|L)/ {print "OK Password"}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK Password" }
    rationale: &rat-dc1e5c0dc5 |
      If root has no password, anyone with local access, for example through the console or single-user mode, can become root without authentication. A set password, or a locked root account where administrators use sudo, ensures that root access requires a credential.
    remediation: &rem-c94fa31bf9 |
      Set a strong password for root.

      passwd root

      Where the check also accepts a locked account (status L), passwd -l root is an alternative if administrators use sudo.
  - id: "CIS-SUSE15-5.4.2.5-root_path_check"
    name: "root path check: /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.2.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e 's/:/\n/g'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ \\\\." }
    rationale: &rat-ee503b897e |
      If root's PATH contains the current directory, empty entries, relative paths or directories that other users can write to, a malicious program placed there can be executed with root privileges when an administrator types a common command name. Root's PATH should contain only absolute, root-owned and non-writable directories.
    remediation: &rem-0afab9f1f3 |
      Remove the current directory (.), empty entries (leading, trailing or double colons), relative paths and non-existent directories from root's PATH, and make sure every remaining directory is owned by root and not writable by group or others. Look for PATH assignments in root's and the system-wide shell startup files.

      su - root -c 'echo "$PATH"'
      grep -sn 'PATH' /root/.bash_profile /root/.bashrc /root/.profile /etc/profile /etc/bashrc /etc/bash.bashrc /etc/environment /etc/profile.d/*.sh
      chown root DIRECTORY
      chmod go-w DIRECTORY
  - id: "CIS-SUSE15-5.4.2.6-root_umask_bash_profile"
    name: "root umask bash profile: grep -i umask /root/.bash_profile /root/.bashrc"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.2.6. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i umask /root/.bash_profile /root/.bashrc
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*:umask 00(2|7)7" }
    rationale: &rat-623cb7f319 |
      The umask determines the permissions of files root creates. With a permissive umask, configuration files, scripts or logs written by root can end up readable or writable by other users, leaking secrets or allowing tampering. Setting umask 027 or 077 in root's shell startup files keeps new files private by default.
    remediation: &rem-25f34f55b9 |
      Add umask 0027 (or 0077) at the start of a line in both /root/.bashrc and /root/.bash_profile. If /root/.bash_profile does not exist yet, create it so that it still loads /root/.profile.

      echo 'umask 0027' >> /root/.bashrc
      [ -e /root/.bash_profile ] || echo '[ -f ~/.profile ] && . ~/.profile' > /root/.bash_profile
      echo 'umask 0027' >> /root/.bash_profile

      Several variants fail when one of the files is missing, and the line must not be indented. Debian 13 reads /root/.profile instead of /root/.bash_profile; add the line there as well (echo 'umask 0027' >> /root/.profile).
  - id: "CIS-SUSE15-5.4.2.7-secure_system_accts"
    name: "secure system accts: awk -F: '$3\u003c1000' /etc/passwd | grep -Ev 'root|sync|halt|shutdown|nfsnobody|/sbin/nologin…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.2.7. NIST SP 800-53 Rev. 5: AC-2(5), AC-3, AC-11, MP-2."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '$3<1000' /etc/passwd | grep -Ev 'root|sync|halt|shutdown|nfsnobody|/sbin/nologin|/bin/false'
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-6f6bd67ce7 |
      System and service accounts do not need an interactive shell. If one of them has a valid login shell, a weakness in a service or a misconfigured password can give an attacker an interactive session under that account. Setting the shell to nologin prevents this.
    remediation: &rem-27c8a0da0c |
      Set the login shell of every system account reported by the check to /usr/sbin/nologin.

      awk -F: '($3 < 1000) {print $1, $7}' /etc/passwd
      usermod -s /usr/sbin/nologin USER

      Accounts root, sync, shutdown and halt are exempt. Make sure no service needs an interactive shell for the account before changing it.
  - id: "CIS-SUSE15-5.4.2.8-invalid_shell_lock_accts"
    name: "invalid shell lock accts: l_valid_shells=\"^($(awk -F\\/ '$NF != \"nologin\" {print}' /etc/shells | sed -rn '/^\\//{s,/,…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.2.8. NIST SP 800-53 Rev. 5: AC-2(5), AC-3, AC-11, MP-2."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      l_valid_shells="^($(awk -F\/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\\\/,g;p}' | paste -s -d '|' - ))$";
      for user in `awk -v pat="$l_valid_shells" -F: '($1 != "root" && $(NF) !~ pat) {print $1}' /etc/passwd`;
      do passwd -S $user | awk '$2 != "L" {print $1" Not Locked"}' 2>&1 >> test;
      done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-33e08eca35 |
      Accounts without a valid login shell, typically service and system accounts, are not meant for interactive use. If such an account still has a usable password, it can be abused for authentication through services that do not depend on the shell, such as FTP or some PAM-based logins. Locking these accounts removes that path.
    remediation: &rem-21f9a32169 |
      Lock every non-root account whose shell is not a valid login shell (nologin, /bin/false or a shell not listed in /etc/shells). List the candidates, review them, and lock each one:

      awk -F: '$1 != "root" && $7 ~ /(nologin|false)$/ {print $1}' /etc/passwd | xargs -r -n1 passwd -S
      usermod -L USER

      passwd -S shows L in the second column for locked accounts.
  - id: "CIS-SUSE15-5.4.3.1-nologin_not_in_shells-attrs"
    name: "/etc/shells: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/shells'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1371eb889f |
      /etc/shells lists valid login shells. Some services, such as FTP daemons or chsh, allow access only for accounts with a shell listed there. If nologin is listed, accounts that are meant to be blocked may be treated as having a valid shell and gain access through such services.
    remediation: &rem-fa056f672c |
      Create /etc/shells.
  - id: "CIS-SUSE15-5.4.3.1-nologin_not_in_shells-content"
    name: "/etc/shells has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse15, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/shells'
    allow_rc: any
    expect: { none: "~ .*nologin" }
    rationale: *rat-1371eb889f
    remediation: &rem-852b96f5ad |
      Edit /etc/shells so that its lines meet these conditions (regular expressions):

      - no line matches .*nologin
  - id: "CIS-SUSE15-5.4.3.2-check_timeout"
    name: "check timeout: grep TMOUT /etc/profile.d/*.sh /etc/profile /etc/profile.d/*.sh| cut -d \":\" -f2"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.3.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep TMOUT /etc/profile.d/*.sh /etc/profile /etc/profile.d/*.sh| cut -d ":" -f2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(readonly |)TMOUT" }
      - { some: "~ TMOUT=([1-8][0-9]{0,2}|900)$" }
      - { some: "~ export TMOUT" }
    rationale: &rat-e92d54c805 |
      An interactive shell left open on an unattended terminal can be used by anyone passing by. TMOUT makes the shell exit automatically after a period of inactivity. Marking it readonly and exporting it prevents users from disabling the timeout in their own session; long-running interactive work may need to account for it.
    remediation: &rem-d216d7a191 |
      Set an idle timeout of 900 seconds or less in a profile script and make it readonly and exported.

      printf '%s\n' 'TMOUT=900' 'readonly TMOUT' 'export TMOUT' > /etc/profile.d/50-tmout.sh

      Remove other TMOUT settings with larger or zero values from /etc/profile, /etc/bashrc and /etc/profile.d. The timeout applies to new login shells.
  - id: "CIS-SUSE15-5.4.3.3-umask_profile_scripts"
    name: "umask profile scripts: grep -i \"^\\s*umask\" /etc/profile /etc/profile.d/*.sh /etc/login.defs /etc/default/login /…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 5.4.3.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse15, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i "^\s*umask" /etc/profile /etc/profile.d/*.sh /etc/login.defs /etc/default/login /etc/pam.d/postlogin 2>&1 | grep -i umask | cut -d ":" -f1,2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*(?i)umask\\s+0[2-7][7]" }
      - { none: "~ .*(?i)umask\\s+[7][0-1][0-6]" }
    rationale: &rat-0e0a7af57b |
      The umask set in shell profile scripts determines the permissions of files that users create. A permissive umask such as 022 makes new files readable by everyone, which can expose sensitive data. A system-wide umask of 027 or stricter removes access for other users by default.
    remediation: &rem-055c359aea |
      Set a system-wide umask of 027 in a profile script.

      echo 'umask 027' > /etc/profile.d/50-umask.sh

      The setting applies to new login shells.
  - id: "CIS-SUSE15-6.1.1-aide_installed"
    name: "Package aide is installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.1.1. NIST SP 800-53 Rev. 5: AU-2."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet aide
    expect: true
    rationale: &rat-d0fb4e491d |
      AIDE records checksums and attributes of important files in a database and later reports files that were added, removed or changed. Having it installed is the basis for detecting unauthorized modifications such as backdoored binaries or altered configuration.
    remediation: &rem-d12c38beff |
      Install the package aide:

      zypper install aide
  - id: "CIS-SUSE15-6.1.2-aide_cron"
    name: "aide cron: grep -rs aide /etc/cron.* /etc/crontab /var/spool/cron/*"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.1.2. NIST SP 800-53 Rev. 5: AU-2."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -rs aide /etc/cron.* /etc/crontab /var/spool/cron/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { none: "~ ^#" }
    rationale: &rat-86b8cfeaea |
      A file integrity baseline is only useful if it is compared regularly. Scheduling AIDE checks ensures that unexpected changes to system files are reported automatically instead of remaining unnoticed until someone runs the check by hand.
    remediation: &rem-6b0208aa79 |
      Schedule a regular AIDE check with cron, for example daily in /etc/cron.d, after the AIDE database has been initialised (aide --init and moving aide.db.new to aide.db).

      echo '0 5 * * * root /usr/bin/aide --check' > /etc/cron.d/aide
      chmod 0644 /etc/cron.d/aide

      A systemd timer would work as well, but this check only looks at cron files.
  - id: "CIS-SUSE15-6.1.3-audit_bins_crypto_aide-attrs"
    name: "/etc/aide.conf: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.1.3."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/aide.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-362fec1225 |
      The audit tools (auditctl, auditd, ausearch, aureport, augenrules and related binaries) control and read the audit trail. An attacker who replaces them could hide activity or silently disable auditing. Including them in the AIDE database with permission, ownership, ACL, extended attribute and SHA-512 checks makes any modification of these binaries detectable.
    remediation: &rem-d3a54af954 |
      Create /etc/aide.conf.
  - id: "CIS-SUSE15-6.1.3-audit_bins_crypto_aide-content"
    name: "/etc/aide.conf has the expected content (6 rules)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.1.3."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/aide.conf'
    allow_rc: any
    expect:
      - { some: "~ /sbin/auditctl p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/auditd p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/ausearch p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/aureport p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/autrace p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/augenrules p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
    rationale: *rat-362fec1225
    remediation: &rem-91fb1909ba |
      Edit /etc/aide.conf so that its lines meet these conditions (regular expressions):

      - a line matches /sbin/auditctl p\+i\+n\+u\+g\+s\+b\+acl\+xattrs\+sha512
      - a line matches /sbin/auditd p\+i\+n\+u\+g\+s\+b\+acl\+xattrs\+sha512
      - a line matches /sbin/ausearch p\+i\+n\+u\+g\+s\+b\+acl\+xattrs\+sha512
      - a line matches /sbin/aureport p\+i\+n\+u\+g\+s\+b\+acl\+xattrs\+sha512
      - a line matches /sbin/autrace p\+i\+n\+u\+g\+s\+b\+acl\+xattrs\+sha512
      - a line matches /sbin/augenrules p\+i\+n\+u\+g\+s\+b\+acl\+xattrs\+sha512
  - id: "CIS-SUSE15-6.2.1.1-systemd-journald-enabled"
    name: "Service systemd-journald.service is enabled"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journald.service | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-aa9c4cf1bc |
      systemd-journald collects kernel, service and user log messages and passes them to persistent storage or syslog. If it is not running, events from services and the kernel are lost, leaving gaps in the audit trail. It is a static unit that is always started by systemd.
    remediation: &rem-bafea64b3e |
      Enable the service systemd-journald.service:

      systemctl enable systemd-journald.service
  - id: "CIS-SUSE15-6.2.1.1-systemd-journald-running"
    name: "Service systemd-journald.service is running"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journald.service | cut -d= -f2
    expect: "== active"
    rationale: *rat-aa9c4cf1bc
    remediation: &rem-2cbcdb9b93 |
      Start the service systemd-journald.service:

      systemctl start systemd-journald.service
  - id: "CIS-SUSE15-6.2.1.2-etc_tmpfiles.d_systemd.conf"
    name: "/etc/tmpfiles.d/systemd.conf: grep -HEn ^f /usr/lib/tmpfiles.d/systemd.conf /etc/tmpfiles.d/systemd.conf | awk -F' ' '(…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.1.2. NIST SP 800-53 Rev. 5: AC-3, AU-2, AU-12, MP-2, SI-5."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -HEn ^f /usr/lib/tmpfiles.d/systemd.conf /etc/tmpfiles.d/systemd.conf | awk -F' ' '($3> 640){print $1" "$2" "$3}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-653475c412 |
      systemd-tmpfiles sets the ownership and permissions of journal directories and files at boot. Overly permissive defaults would let unprivileged users read journal data containing sensitive information. Reviewing the tmpfiles entries ensures journal files are created with restrictive modes (0640 or stricter).
    remediation: &rem-dbf758b0bb |
      Make sure no file entry (lines starting with f) in the systemd tmpfiles configuration creates files with a mode above 0640: copy the vendor file to /etc/tmpfiles.d/, lower the listed modes, and apply it.

      grep -HEn '^f' /usr/lib/tmpfiles.d/systemd.conf /etc/tmpfiles.d/systemd.conf
      cp /usr/lib/tmpfiles.d/systemd.conf /etc/tmpfiles.d/systemd.conf
      systemd-tmpfiles --create /etc/tmpfiles.d/systemd.conf

      The check also reads the vendor file in /usr/lib, so an entry there with a wider mode keeps failing even when overridden in /etc.
  - id: "CIS-SUSE15-6.2.1.3-log_rotate_journald_conf"
    name: "log rotate journald conf: grep -Ei \"max|keep\" /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "max|keep" /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:SystemMaxUse\\s*=\\s*10M" }
      - { some: "~ .*\\:SystemKeepFree\\s*=\\s*100G" }
      - { some: "~ .*\\:RuntimeMaxUse\\s*=\\s*10M" }
      - { some: "~ .*\\:RuntimeKeepFree\\s*=\\s*100G" }
      - { some: "~ .*\\:MaxFileSec\\s*=\\s*1month" }
      - { none: "~ .*\\:SystemMaxUse\\s*=\\s*(?:[^10M])" }
      - { none: "~ .*\\:SystemKeepFree\\s*=\\s*(?:[^100G])" }
      - { none: "~ .*\\:RuntimeMaxUse\\s*=\\s*(?:[^10M])" }
      - { none: "~ .*\\:RuntimeKeepFree\\s*=\\s*(?:[^100G])" }
      - { none: "~ .*\\:MaxFileSec\\s*=\\s*(?:[^1month])" }
    rationale: &rat-7192c1da81 |
      Without size and retention limits, the journal can grow until it fills its file system, which may stop services or cause new log records to be dropped. SystemMaxUse, SystemKeepFree, RuntimeMaxUse, RuntimeKeepFree and MaxFileSec bound disk usage and rotate journal files regularly in line with the retention policy.
    remediation: &rem-f2440981a1 |
      Set the journal size and rotation limits to the exact values the check expects in a journald drop-in and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nSystemMaxUse=10M\nSystemKeepFree=100G\nRuntimeMaxUse=10M\nRuntimeKeepFree=100G\nMaxFileSec=1month\n' > /etc/systemd/journald.conf.d/60-rotate.conf
      systemctl restart systemd-journald

      SystemKeepFree=100G makes journald stop writing persistent logs when less than 100 GB are free; review whether these values suit the system.
  - id: "CIS-SUSE15-6.2.1.4-only_journald_installed_no_rsyslog-running"
    name: "Service rsyslog is not running"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.1.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState rsyslog | cut -d= -f2
    expect: "!= active"
    rationale: &rat-87d7b2f9da |
      Running two local logging daemons side by side duplicates log data, wastes disk space and makes it unclear which copy is authoritative during an investigation. When journald is chosen as the only logging service, rsyslog should not be running so that all logs are collected, protected and rotated in one consistently configured place.
    remediation: &rem-dfcfbb3a30 |
      Stop the service rsyslog, unless the system needs it:

      systemctl stop rsyslog
  - id: "CIS-SUSE15-6.2.1.4-only_journald_installed_pkg-running"
    name: "Service systemd-journald.service is running"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.1.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journald.service | cut -d= -f2
    expect: "== active"
    rationale: &rat-7cb263aba2 |
      systemd-journald collects kernel, service and authentication messages. If it is not running, events are lost and security-relevant activity cannot be reconstructed later, which also defeats any forwarding to a central log server.
    remediation: *rem-2cbcdb9b93
  - id: "CIS-SUSE15-6.2.2.1.1-systemd-journal-remote"
    name: "Package systemd-journal-remote is installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.2.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet systemd-journal-remote
    expect: true
    rationale: &rat-c532adb37c |
      systemd-journal-remote provides systemd-journal-upload, which sends journal entries to a central collection server. Installing it is the prerequisite for keeping an off-host copy of the journal when journald is used as the logging solution.
    remediation: &rem-f924b3aaaa |
      Install the package systemd-journal-remote:

      zypper install systemd-journal-remote
  - id: "CIS-SUSE15-6.2.2.1.2-journald_remote_config"
    name: "journald remote config: systemd-analyze cat-config systemd/journal-upload.conf"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.2.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemd-analyze cat-config systemd/journal-upload.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*URL=\\S+" }
      - { some: "~ ^\\s*ServerKeyFile=\\S+" }
      - { some: "~ ^\\s*ServerCertificateFile=\\S+" }
      - { some: "~ ^\\s*TrustedCertificateFile=\\S+" }
    rationale: &rat-9a9a4a0cf6 |
      Logs kept only on the local system can be deleted or altered by an attacker who gains root and are lost if the system fails. systemd-journal-upload sends journal entries to a central log server; configuring the server URL and TLS key, certificate and trusted CA ensures the transfer is authenticated and encrypted.
    remediation: &rem-6d121ec74a |
      Install systemd-journal-remote, configure the upload target and TLS files in /etc/systemd/journal-upload.conf and enable the upload service:

      zypper install systemd-journal-remote
      printf '%s\n' '[Upload]' 'URL=https://logserver.example.com:19532' 'ServerKeyFile=/etc/ssl/private/journal-upload.pem' 'ServerCertificateFile=/etc/ssl/certs/journal-upload.pem' 'TrustedCertificateFile=/etc/ssl/ca/trusted.pem' > /etc/systemd/journal-upload.conf
      systemctl enable --now systemd-journal-upload.service

      Replace the URL and certificate paths with your log server and PKI files.
  - id: "CIS-SUSE15-6.2.2.1.3-systemd-journal-upload.service-enabled"
    name: "Service systemd-journal-upload.service is enabled"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.2.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journal-upload.service | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-b770b19f4c |
      Logs kept only on the host can be deleted or altered by an attacker who gains root. Running systemd-journal-upload continuously ships journal entries to a remote collector, preserving them off-host. It is only relevant where systemd-journal-remote is the chosen central logging method rather than rsyslog.
    remediation: &rem-c6c7c65dbe |
      Enable the service systemd-journal-upload.service:

      systemctl enable systemd-journal-upload.service
  - id: "CIS-SUSE15-6.2.2.1.3-systemd-journal-upload.service-running"
    name: "Service systemd-journal-upload.service is running"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.2.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journal-upload.service | cut -d= -f2
    expect: "== active"
    rationale: *rat-b770b19f4c
    remediation: &rem-7f8e123d83 |
      Start the service systemd-journal-upload.service:

      systemctl start systemd-journal-upload.service
  - id: "CIS-SUSE15-6.2.2.1.4-systemd-journal-remote.socket-enabled"
    name: "Service systemd-journal-remote.socket is not enabled"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.2.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journal-remote.socket | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-87dd56fa7c |
      systemd-journal-remote.socket accepts journal data from other hosts over the network. Only a designated log collector should listen for it; on other systems it is an unnecessary network service that could receive forged logs or be used to fill the disk.
    remediation: &rem-6593464f6f |
      Disable the service systemd-journal-remote.socket, unless the system needs it:

      systemctl disable systemd-journal-remote.socket

      To keep other units from starting it, mask it instead: systemctl mask systemd-journal-remote.socket
  - id: "CIS-SUSE15-6.2.2.1.4-systemd-journal-remote.socket-running"
    name: "Service systemd-journal-remote.socket is not running"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.2.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journal-remote.socket | cut -d= -f2
    expect: "!= active"
    rationale: *rat-87dd56fa7c
    remediation: &rem-965b15f40c |
      Stop the service systemd-journal-remote.socket, unless the system needs it:

      systemctl stop systemd-journal-remote.socket
  - id: "CIS-SUSE15-6.2.2.1.4-journald_socket_masked"
    name: "journald socket masked: systemctl is-enabled systemd-journal-remote.socket"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.2.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl is-enabled systemd-journal-remote.socket
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ ^masked" }
    rationale: &rat-9ba854dbda |
      systemd-journal-remote.socket lets the host receive journal entries from other systems. Masking it on systems that are not log collectors prevents the listener from being started, even indirectly by another unit, and removes an unnecessary network service.
    remediation: &rem-2d1745ded8 |
      Unless this host collects journals from other systems, stop the journal remote receiver and mask its socket and service so that they cannot be started.

      systemctl stop systemd-journal-remote.socket systemd-journal-remote.service
      systemctl mask systemd-journal-remote.socket systemd-journal-remote.service
  - id: "CIS-SUSE15-6.2.2.2-journald_syslog"
    name: "journald syslog: grep -i forward /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.2.2. NIST SP 800-53 Rev. 5: AU-2, AU-6, AU-7, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i forward /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ (?i)^.*:(|#)ForwardToSyslog\\s*=\\s*no" }
      - { none: "~ (?i).*:ForwardToSyslog\\s*=\\s*yes" }
    rationale: &rat-5aadb5e51c |
      When journald is the central logging solution and logs are shipped with systemd-journal-upload, forwarding every message to a local syslog daemon as well duplicates storage and creates a second, possibly unprotected copy. ForwardToSyslog=no keeps a single logging path. If rsyslog is the chosen logging solution, forwarding may be required instead.
    remediation: &rem-e2bef7296f |
      Set ForwardToSyslog=no for journald in a drop-in file, remove any ForwardToSyslog=yes line from /etc/systemd/journald.conf and its drop-ins, and restart journald:

      mkdir -p /etc/systemd/journald.conf.d
      printf '%s\n' '[Journal]' 'ForwardToSyslog=no' > /etc/systemd/journald.conf.d/60-forwardtosyslog.conf
      systemctl restart systemd-journald

      Only do this when journald, not rsyslog, is the logging solution; on SUSE rsyslog normally relies on forwarding.
  - id: "CIS-SUSE15-6.2.2.3-compress_journald_conf"
    name: "compress journald conf: grep -i compress /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.2.3. NIST SP 800-53 Rev. 5: AU-4."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i compress /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ (?i)^.*:Compress\\s*=\\s*yes" }
      - { none: "~ (?i)^.*:Compress\\s*=\\s*no" }
    rationale: &rat-fc8701ed62 |
      Compressing large journal entries reduces the disk space the persistent journal needs, so more history fits within the configured limits and the log partition is less likely to fill. Running out of log space leads to lost records or service problems.
    remediation: &rem-bd6851d137 |
      Enable compression of large journal entries in a journald drop-in, remove any Compress=no setting, and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nCompress=yes\n' > /etc/systemd/journald.conf.d/60-compress.conf
      systemctl restart systemd-journald

      Some variants need at least one .conf file in /etc/systemd/journald.conf.d/, which the drop-in provides.
  - id: "CIS-SUSE15-6.2.2.4-storage_journald_conf"
    name: "storage journald conf: grep -i storage /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.2.4. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i storage /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ (?i)^.*:Storage=persistent" }
    rationale: &rat-cda501aacd |
      With volatile or automatic storage, journald may keep logs only in /run, so they are lost at every reboot, including the events that led up to a crash or compromise. Storage=persistent writes the journal to /var/log/journal so the history survives restarts.
    remediation: &rem-32e0bcb5a2 |
      Configure persistent journal storage in a journald drop-in and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nStorage=persistent\n' > /etc/systemd/journald.conf.d/60-storage.conf
      systemctl restart systemd-journald

      Write the line without spaces around '='; some variants require exactly Storage=persistent.
  - id: "CIS-SUSE15-6.2.3.1.2-local_syslog_input"
    name: "local syslog input: grep -E \"imtcp\\\" port|InputTCPServerRun\" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.3.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12, CM-6."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "imtcp\" port|InputTCPServerRun" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -v ":#"
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-46d6ea0433 |
      rsyslog can accept log messages from other hosts over TCP. On a system that is not a designated log server, such a listener opens an unneeded network port and lets anyone who can reach it inject forged log entries or fill the disk.
    remediation: &rem-30523f0cee |
      Remove the TCP input definitions from the rsyslog configuration, or comment them out with # as the first character of the line, then restart rsyslog.

      grep -En 'imtcp" port|InputTCPServerRun' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      systemctl restart rsyslog

      Lines to disable look like input(type="imtcp" port="514") or $InputTCPServerRun 514. Keep them only on dedicated log servers.
  - id: "CIS-SUSE15-6.2.3.1.2-local_syslog_module"
    name: "local syslog module: grep \"imtcp\" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -Ev \":#|port=\""
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.3.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12, CM-6."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "imtcp" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -Ev ":#|port="
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-035740240e |
      Loading rsyslog's imtcp module is the first step to accepting log messages from the network. On a system that is not a designated log server the module is not needed, and leaving it loaded makes it easy to open a listener by accident. Not loading it keeps the host from receiving remote log data.
    remediation: &rem-2c410b4533 |
      Remove the lines that load the imtcp module, or comment them out with # as the first character of the line, then restart rsyslog.

      grep -n 'imtcp' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      systemctl restart rsyslog

      Lines to disable look like module(load="imtcp") or $ModLoad imtcp. The check ignores a commented line only if the # is at the very start.
  - id: "CIS-SUSE15-6.2.3.2-rsyslog"
    name: "Package rsyslog is installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.3.2. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet rsyslog
    expect: true
    rationale: &rat-ec4e2f2832 |
      rsyslog collects log messages from the kernel, services and applications, writes them to files and can forward them to a central log server. Without an installed, enabled and running syslog daemon, security-relevant events are not recorded in a durable way and incidents cannot be investigated.
    remediation: &rem-3580819b11 |
      Install the package rsyslog:

      zypper install rsyslog
  - id: "CIS-SUSE15-6.2.3.3-rsyslog_service-enabled"
    name: "Service rsyslog.service is enabled"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.3.3. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState rsyslog.service | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-4a8a79b453 |
      Where rsyslog is the chosen logging solution, it has to be enabled and running so that messages are written to log files and forwarded as configured. A stopped daemon means events are lost and security incidents go unrecorded.
    remediation: &rem-cd4a6a7cfa |
      Enable the service rsyslog.service:

      systemctl enable rsyslog.service
  - id: "CIS-SUSE15-6.2.3.3-rsyslog_service-running"
    name: "Service rsyslog.service is running"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.3.3. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState rsyslog.service | cut -d= -f2
    expect: "== active"
    rationale: *rat-4a8a79b453
    remediation: &rem-8e9bdb3a16 |
      Start the service rsyslog.service:

      systemctl start rsyslog.service
  - id: "CIS-SUSE15-6.2.3.4-forward_journald_conf"
    name: "forward journald conf: systemd-analyze cat-config systemd/journald.conf | grep -i '^\\s*ForwardToSyslog' | tail -1"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.3.4. NIST SP 800-53 Rev. 5: AC-3, AU-2, AU-4, AU-12, MP-2."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemd-analyze cat-config systemd/journald.conf | grep -i '^\s*ForwardToSyslog' | tail -1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^\\s*ForwardToSyslog\\s*=\\s*yes" }
    rationale: &rat-143e885d75 |
      When rsyslog is the log processor, journald must forward messages to it, otherwise events never reach the syslog files and remote collectors configured there. Setting ForwardToSyslog=yes makes sure all journal messages are also handled by rsyslog.
    remediation: &rem-59256c1df4 |
      Configure journald to forward messages to the syslog daemon in a drop-in and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nForwardToSyslog=yes\n' > /etc/systemd/journald.conf.d/60-forward.conf
      systemctl restart systemd-journald

      Remove any ForwardToSyslog=no line from /etc/systemd/journald.conf and other drop-ins. The Ubuntu 20.04 check reads only /etc/systemd/journald.conf itself, so set the option there as well:

      sed -i -E 's/^#?\s*ForwardToSyslog\s*=.*/ForwardToSyslog=yes/' /etc/systemd/journald.conf
      grep -q '^ForwardToSyslog=yes' /etc/systemd/journald.conf || sed -i '/^\[Journal\]/a ForwardToSyslog=yes' /etc/systemd/journald.conf
      systemctl restart systemd-journald
  - id: "CIS-SUSE15-6.2.3.5-perms_rsyslog_d"
    name: "perms rsyslog d: grep -s ^\\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf | cut -f2 -d:"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.3.5. NIST SP 800-53 Rev. 5: AC-3, AC-6, MP-2."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -s ^\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf | cut -f2 -d:
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ \\$FileCreateMode 06[0-4]0" }
      - { none: "~ \\$FileCreateMode 06[6-7][0-7]" }
    rationale: &rat-2b2fc7d019 |
      Log files often contain sensitive information such as user names, host names and error details. Setting $FileCreateMode to 0640 or stricter ensures that log files created by rsyslog are not readable or writable by arbitrary users, who could otherwise gather information or tamper with evidence.
    remediation: &rem-aa234ce03e |
      Make rsyslog create log files with mode 0640 by setting $FileCreateMode in a drop-in file that is read before the logging rules, and change every other $FileCreateMode line to 0640 as well.

      grep -n 'FileCreateMode' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      echo '$FileCreateMode 0640' > /etc/rsyslog.d/00-filecreatemode.conf
      systemctl restart rsyslog

      The mode applies to files created after the restart; correct existing log files separately.
  - id: "CIS-SUSE15-6.2.3.6-rsyslog_logging-attrs"
    name: "/etc/rsyslog.conf: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.3.6. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/rsyslog.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ac253987a0 |
      Sorting messages by facility and priority into dedicated files, such as authentication, mail, cron and warnings, makes relevant events easy to find and allows different retention and permissions per category. Emergency messages are also broadcast to logged-in users. A defined rule set ensures important events are recorded rather than lost.
    remediation: &rem-d45052d244 |
      Create /etc/rsyslog.conf.
  - id: "CIS-SUSE15-6.2.3.6-rsyslog_logging-content"
    name: "/etc/rsyslog.conf has the expected content (13 rules)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.3.6. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/rsyslog.conf'
    allow_rc: any
    expect:
      - { some: "~ ^\\*.emerg\\s+:omusrmsg:\\*" }
      - { some: "~ auth,authpriv.\\*\\s+/var/log/secure" }
      - { some: "~ ^mail.\\*\\s+-/var/log/mail" }
      - { some: "~ ^mail.info\\s+-/var/log/mail.info" }
      - { some: "~ ^mail.err\\s+/var/log/mail.err" }
      - { some: "~ ^cron.\\*\\s+/var/log/cron" }
      - { some: "~ ^*.=warning;\\*.=err\\s+-/var/log/warn" }
      - { some: "~ ^*.crit\\s+/var/log/warn" }
      - { some: "~ ^*.*;mail.none;news.none\\s+/var/log/messages" }
      - { some: "~ ^local0,local1.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local2,local3.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local4,local5.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local6,local7.\\*\\s+-/var/log/localmessages" }
    rationale: *rat-ac253987a0
    remediation: &rem-ec6fb086eb |
      Edit /etc/rsyslog.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\*.emerg\s+:omusrmsg:\*
      - a line matches auth,authpriv.\*\s+/var/log/secure
      - a line matches ^mail.\*\s+-/var/log/mail
      - a line matches ^mail.info\s+-/var/log/mail.info
      - a line matches ^mail.err\s+/var/log/mail.err
      - a line matches ^cron.\*\s+/var/log/cron
      - a line matches ^*.=warning;\*.=err\s+-/var/log/warn
      - a line matches ^*.crit\s+/var/log/warn
      - a line matches ^*.*;mail.none;news.none\s+/var/log/messages
      - a line matches ^local0,local1.\*\s+-/var/log/localmessages
      - a line matches ^local2,local3.\*\s+-/var/log/localmessages
      - a line matches ^local4,local5.\*\s+-/var/log/localmessages
      - a line matches ^local6,local7.\*\s+-/var/log/localmessages
  - id: "CIS-SUSE15-6.2.3.7-rsyslog_pkg"
    name: "Package logrotate is installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.3.7. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet logrotate
    expect: true
    rationale: &rat-9c368a0ca1 |
      Without log rotation, log files grow until they fill the file system, which can stop logging altogether or disrupt services sharing the partition. The logrotate package rotates, compresses and expires log files on a schedule so that recent history is kept while disk usage stays bounded.
    remediation: &rem-4752f99239 |
      Install the package logrotate:

      zypper install logrotate
  - id: "CIS-SUSE15-6.2.3.7-rsyslog_logrotate"
    name: "rsyslog logrotate: echo \"Manual | please check file rotaton matches site policy - logrotate\""
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.3.7. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual | please check file rotaton matches site policy - logrotate"
    expect: { rc: "== 0" }
    rationale: &rat-17eb210ea2 |
      Log files that are never rotated grow until they fill the file system, which can stop logging or crash services, while overly aggressive rotation discards records needed for investigations. A logrotate policy for the rsyslog files that matches the site's retention requirements keeps logs available for the required period without exhausting disk space.
    remediation: &rem-648542e71a |
      Review the logrotate configuration for the files rsyslog writes (/etc/logrotate.d/rsyslog, or /etc/logrotate.d/syslog on older Red Hat releases) and adjust frequency, number of rotations and compression to the site's retention policy.

      cat /etc/logrotate.d/rsyslog
      logrotate -d /etc/logrotate.d/rsyslog

      Typical settings in the file's block are weekly, rotate 4, compress, missingok and notifempty. Most variants of this check are manual reminders that report a failure until the review is accepted.
  - id: "CIS-SUSE15-6.2.4.1-logfile_access_configured"
    name: "logfile access configured: find -L /var/log -type f \\( -perm /0137 -o ! -user root -o ! -group root \\) -exec stat -L…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.2.4.1. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-suse15, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find -L /var/log -type f \( -perm /0137 -o ! -user root -o ! -group root \) -exec stat -Lc '%a:%U:%G:%n' {} + 2>/dev/null | awk -F: '
        FNR == NR && FILENAME == "/etc/shells" { if ($0 ~ /^[[:space:]]*\//) { sub(/^[[:space:]]+/, ""); sub(/[[:space:]].*$/, ""); shells[$0] = 1 }; next }
        FILENAME == "/etc/passwd" { ushell[$1] = $7; next }
        function band(a, b,   r, bit) { r = 0; for (bit = 4; bit >= 1; bit = bit / 2) { if (a >= bit && b >= bit) r += bit; if (a >= bit) a -= bit; if (b >= bit) b -= bit }; return r }
        function excess(mode, mask,   i, m) { m = substr("000" mode, length(mode) + 1, 3); for (i = 1; i <= 3; i++) if (band(substr(m, i, 1) + 0, substr(mask, i, 1) + 0) > 0) return 1; return 0 }
        {
          mode = $1; user = $2; group = $3; fname = substr($0, length($1 FS $2 FS $3 FS) + 1)
          n = split(fname, p, "/"); base = p[n]; dir = substr(fname, 1, length(fname) - length(base) - 1)
          if (dir ~ /\/apt$/) { mask = "133"; au = "root"; ag = "root|adm" }
          else if (base ~ /^lastlog(\..*)?$/ || base ~ /^(wtmp|btmp)([.-].*)?$/ || base == "README") { mask = "113"; au = "root"; ag = "root|utmp" }
          else if (base ~ /^(cloud-init\.log|localmessages|waagent\.log)/) { mask = "133"; au = "root|syslog"; ag = "root|adm" }
          else if (base ~ /^secure([.-].*)?$/ || base ~ /^(auth\.log|syslog|messages)$/) { mask = "137"; au = "root|syslog"; ag = "root|adm" }
          else if (base ~ /^(SSSD|sssd)$/) { mask = "117"; au = "root|SSSD"; ag = "root|SSSD" }
          else if (base ~ /^(gdm|gdm3)$/) { mask = "117"; au = "root"; ag = "root|gdm|gdm3" }
          else if (base ~ /\.journal~?$/) { mask = "137"; au = "root"; ag = "root|systemd-journal" }
          else {
            mask = "137"; au = "root|syslog"; ag = "root|adm"
            if (user == "root" || !(ushell[user] in shells)) { au = au "|" user; ag = ag "|" group }
          }
          bad = ""
          if (excess(mode, mask)) bad = bad " mode=" mode
          if (user !~ ("^(" au ")$")) bad = bad " owner=" user
          if (group !~ ("^(" ag ")$")) bad = bad " group=" group
          if (bad != "") print fname ":" bad
        }' /etc/shells /etc/passwd -
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-86cf2d9f07 |
      Log files in /var/log contain authentication events, error messages and sometimes sensitive data. Overly permissive modes or wrong ownership let unprivileged users read this information or alter the evidence of their actions. Each log file should be owned by root or its writing service, belong to an appropriate group and have no more permissions than needed.
    remediation: &rem-676a1378c8 |
      Review each file the check reports and tighten owner, group and mode: generally owner root (or the service account that writes it), group root or adm, mode 0640 or stricter. wtmp, btmp and lastlog may use group utmp (up to 0664), and package manager logs, cloud-init.log and README may be 0644.

      stat -c '%a %U %G %n' FILE
      chmod u-x,g-wx,o-rwx FILE
      chown root:root FILE

      Also fix the create modes in logrotate and the writing service so rotated or recreated files keep the restricted permissions.
  - id: "CIS-SUSE15-6.3.1.1-audit_packages"
    name: "Package audit is installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12, SI-5."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      rpm -q --quiet audit
    expect: true
    rationale: &rat-7fcda27331 |
      The Linux audit framework records security-relevant events such as logins, privilege use, changes to critical files and administrative actions. Its user-space tools (auditd, auditctl, augenrules) must be installed for the kernel audit events to be collected, written to disk and reviewed.
    remediation: &rem-5230023cc7 |
      Install the package audit:

      zypper install audit
  - id: "CIS-SUSE15-6.3.1.2-audit_default_grub"
    name: "audit default grub: grep audit= /etc/default/grub"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep audit= /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX=.*[\\s\"]audit=1\\b" }
    rationale: &rat-20bfb20320 |
      Processes started before auditd are not audited unless the kernel enables auditing at boot. With audit=1 on the kernel command line, every process gets an audit context from the start, so early activity, including possible tampering during boot, is recorded. Keeping the parameter in /etc/default/grub ensures it survives configuration regeneration and new kernels.
    remediation: &rem-75b50b20ca |
      Add audit=1 to GRUB_CMDLINE_LINUX in /etc/default/grub and regenerate the GRUB configuration.

      grep -q '^GRUB_CMDLINE_LINUX=.*audit=1' /etc/default/grub || sed -ri 's/^(GRUB_CMDLINE_LINUX="[^"]*)"/\1 audit=1"/' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      The change takes effect after a reboot. Remove conflicting values (e.g. audit=0) from the line if present.
  - id: "CIS-SUSE15-6.3.1.2-audit_running_grub"
    name: "audit running grub: grep audit= /proc/cmdline"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep audit= /proc/cmdline
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^BOOT_IMAGE=.*\\saudit=1" }
      - { none: "~ ^BOOT_IMAGE=.*\\saudit=0" }
    rationale: &rat-89a40fb296 |
      auditd starts relatively late in the boot process. Processes that start before it are not auditable unless the kernel's audit subsystem is enabled from the very beginning. Passing audit=1 on the kernel command line enables auditing at boot so that early activity is recorded as well.
    remediation: &rem-c2d14c1ce9 |
      Add audit=1 to the kernel command line (replacing any audit=0), update the boot loader configuration and reboot.

      sed -i -E '/^GRUB_CMDLINE_LINUX_DEFAULT=/{s/(["[:space:]])audit=[0-9]+/\1/g;s/"$/ audit=1"/}' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg
      reboot

      On systems that boot with grub2-bls or systemd-boot (BLS entries managed by sdbootutil), add audit=1 to /etc/kernel/cmdline instead and run sdbootutil update-all-entries.
  - id: "CIS-SUSE15-6.3.1.3-audit_backlog_default_grub"
    name: "audit backlog default grub: grep audit_backlog /etc/default/grub"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep audit_backlog /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX=.*[\\s\"]audit_backlog_limit=(819[2-9]|8[2-9][0-9]{2}|9[0-9]{3}|[1-9][0-9]{4,})\\b" }
    rationale: &rat-6f061b7300 |
      During boot, audit events are queued in the kernel until auditd starts. If the backlog buffer is too small, events are lost or the kernel may react according to the failure setting. A backlog limit of at least 8192 gives enough room to keep early events. Keeping it in /etc/default/grub ensures it persists.
    remediation: &rem-d0361c3a31 |
      Add audit_backlog_limit=8192 to GRUB_CMDLINE_LINUX in /etc/default/grub and regenerate the GRUB configuration.

      grep -q '^GRUB_CMDLINE_LINUX=.*audit_backlog_limit=8192' /etc/default/grub || sed -ri 's/^(GRUB_CMDLINE_LINUX="[^"]*)"/\1 audit_backlog_limit=8192"/' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      The change takes effect after a reboot. Remove conflicting values (e.g. a smaller audit_backlog_limit) from the line if present.
  - id: "CIS-SUSE15-6.3.1.3-audit_backlog_running_grub"
    name: "audit backlog running grub: grep audit_backlog /proc/cmdline"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep audit_backlog /proc/cmdline
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^BOOT_IMAGE=.*\\saudit_backlog_limit=(819[2-9]|8[2-9][0-9]{2}|9[0-9]{3}|[1-9][0-9]{4,})\\b" }
    rationale: &rat-70cb88fec3 |
      The kernel buffers audit records in a backlog queue until auditd reads them. If the queue is too small, records are lost during bursts of activity or early in boot before auditd runs. Setting audit_backlog_limit to at least 8192 on the kernel command line gives enough buffer space to avoid losing events.
    remediation: &rem-8bac06e343 |
      Add audit_backlog_limit=8192 (or a larger value) to the kernel command line, update the boot loader configuration and reboot.

      sed -i -E '/^GRUB_CMDLINE_LINUX_DEFAULT=/{s/(["[:space:]])audit_backlog_limit=[0-9]+/\1/g;s/"$/ audit_backlog_limit=8192"/}' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg
      reboot

      On systems that boot with grub2-bls or systemd-boot (BLS entries managed by sdbootutil), add the parameter to /etc/kernel/cmdline instead and run sdbootutil update-all-entries.
  - id: "CIS-SUSE15-6.3.1.4-auditd_service-enabled"
    name: "Service auditd.service is enabled"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p UnitFileState auditd.service | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-7fd0131f83 |
      The audit daemon writes kernel audit events to disk. If it is not enabled and running, audit rules have no lasting effect and security-relevant activity is not recorded, so incidents cannot be traced and accountability is lost.
    remediation: &rem-549f7ea979 |
      Enable the service auditd.service:

      systemctl enable auditd.service
  - id: "CIS-SUSE15-6.3.1.4-auditd_service-running"
    name: "Service auditd.service is running"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p ActiveState auditd.service | cut -d= -f2
    expect: "== active"
    rationale: *rat-7fd0131f83
    remediation: &rem-2ce522dc81 |
      Start the service auditd.service:

      systemctl start auditd.service
  - id: "CIS-SUSE15-6.3.2.1-max_log_auditd_conf"
    name: "max log auditd conf: grep max_log_file /etc/audit/auditd.conf"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.2.1. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep max_log_file /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^max_log_file = \\d\\d+" }
    rationale: &rat-3aaf4ad791 |
      max_log_file defines the size at which an audit log file is rotated. A deliberate size, together with the rotation action, controls how much audit history is kept and prevents single log files from becoming unmanageable or rotating too often to preserve evidence.
    remediation: &rem-6c2bac235c |
      Set max_log_file (size in MB) in /etc/audit/auditd.conf to a value that fits the site policy, e.g. 32.

      sed -ri 's/^\s*max_log_file\s*=.*/max_log_file = 32/' /etc/audit/auditd.conf
      grep -q '^max_log_file = ' /etc/audit/auditd.conf || echo 'max_log_file = 32' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      SIGHUP makes auditd reread its configuration. Most variants require the exact format 'max_log_file = NN' with at least two digits.
  - id: "CIS-SUSE15-6.3.2.2-max_log_action_auditd_conf"
    name: "max log action auditd conf: grep max_log_file_action /etc/audit/auditd.conf"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.2.2. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep max_log_file_action /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ max_log_file_action = keep_logs" }
    rationale: &rat-2c8c6634dd |
      When an audit log reaches its maximum size, the default action rotates and eventually deletes old logs, losing audit history. keep_logs rotates without deleting, so no audit records are discarded automatically. Disk usage must then be monitored, because logs accumulate until archived.
    remediation: &rem-604d9d4f57 |
      Set max_log_file_action to keep_logs in /etc/audit/auditd.conf.

      sed -ri 's/^\s*max_log_file_action\s*=.*/max_log_file_action = keep_logs/' /etc/audit/auditd.conf
      grep -q '^max_log_file_action = ' /etc/audit/auditd.conf || echo 'max_log_file_action = keep_logs' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      SIGHUP makes auditd reread its configuration. Archive old audit logs regularly to avoid filling the disk.
  - id: "CIS-SUSE15-6.3.2.3-logs_full_auditd_conf"
    name: "logs full auditd conf: grep -E disk_.*_action /etc/audit/auditd.conf"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.2.3. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -E disk_.*_action /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ disk_full_action\\s*=\\s*(halt|single)" }
      - { some: "~ disk_error_action\\s*=\\s*(syslog|halt|single)" }
    rationale: &rat-70577f0aa7 |
      If the audit log partition fills up or a disk error occurs, auditing can silently stop and later actions go unrecorded. Halting or switching to single-user mode on a full disk, and at least reporting disk errors, guarantees that the system does not keep running without an audit trail. The trade-off is reduced availability, so audit storage must be sized and monitored.
    remediation: &rem-e2c732cb3a |
      Set disk_full_action to single (or halt) and disk_error_action to syslog, single or halt in /etc/audit/auditd.conf.

      sed -ri 's/^\s*disk_full_action\s*=.*/disk_full_action = single/' /etc/audit/auditd.conf
      grep -q '^disk_full_action = ' /etc/audit/auditd.conf || echo 'disk_full_action = single' >> /etc/audit/auditd.conf
      sed -ri 's/^\s*disk_error_action\s*=.*/disk_error_action = syslog/' /etc/audit/auditd.conf
      grep -q '^disk_error_action = ' /etc/audit/auditd.conf || echo 'disk_error_action = syslog' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      SIGHUP makes auditd reread its configuration. A full audit partition will then take the system out of normal operation.
  - id: "CIS-SUSE15-6.3.2.4-logs_low_space_auditd_conf"
    name: "logs low space auditd conf: grep space_left_action /etc/audit/auditd.conf"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-8, AU-12, SI-5."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep space_left_action /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ space_left_action\\s*=\\s*(email|exec|single|halt)" }
      - { some: "~ admin_space_left_action\\s*=\\s*(halt|single)" }
    rationale: &rat-35cb8a9517 |
      Low disk space on the audit partition is the warning sign before audit records are lost. Notifying administrators when space_left is reached, and switching to single-user mode or halting at admin_space_left, ensures someone reacts before auditing fails. Halting affects availability, so monitoring and capacity planning matter.
    remediation: &rem-63eb66207c |
      Set space_left_action to email (or exec, single, halt) and admin_space_left_action to single (or halt) in /etc/audit/auditd.conf.

      sed -ri 's/^\s*space_left_action\s*=.*/space_left_action = email/' /etc/audit/auditd.conf
      grep -q '^space_left_action = ' /etc/audit/auditd.conf || echo 'space_left_action = email' >> /etc/audit/auditd.conf
      sed -ri 's/^\s*admin_space_left_action\s*=.*/admin_space_left_action = single/' /etc/audit/auditd.conf
      grep -q '^admin_space_left_action = ' /etc/audit/auditd.conf || echo 'admin_space_left_action = single' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      email needs a working local mail transfer agent and action_mail_acct; SIGHUP makes auditd reread its configuration.
  - id: "CIS-SUSE15-6.3.3.1-auditd_admin_scope_cnf"
    name: "auditd admin scope cnf: grep scope /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.3.1. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep scope /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /etc/sudoers -p wa -k scope" }
      - { some: "~ -w /etc/sudoers\\.d -p wa -k scope" }
    rationale: &rat-7172c39fee |
      Changes to /etc/sudoers and /etc/sudoers.d alter who may run which commands with elevated privileges. Audit rules that record every write or attribute change to these files make unauthorised privilege grants detectable. This check verifies that the rules are part of the persistent audit configuration.
    remediation: &rem-65be48f470 |
      Watch the sudoers configuration for changes: add the following rules to /etc/audit/rules.d/50-scope.rules and load them.

      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d -p wa -k scope

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
