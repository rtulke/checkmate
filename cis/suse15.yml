      -a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation
      EOF
      augenrules --load

      Check the result with auditctl -l. If the audit configuration is immutable (-e 2 in the rules), the new rules only take effect after a reboot.
  - id: "CIS-SUSE15-6.3.3.3-auditd_sudolog_chg"
    name: "auditd sudolog chg: grep sudo_log_file /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.3.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep sudo_log_file /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /var/log/sudo\\.log -p wa -k sudo_log_file" }
    rationale: &rat-92e109d127 |
      The sudo log file records administrative commands. An attacker who has gained elevated rights may try to edit or truncate it to hide their actions. Auditing writes and attribute changes to the file makes such tampering visible.
    remediation: &rem-c5d4ccbaad |
      Add the following rules to a file under /etc/audit/rules.d/ and load them:

      cat >> /etc/audit/rules.d/50-sudo.rules <<'EOF'
      -w /var/log/sudo.log -p wa -k sudo_log_file
      EOF
      augenrules --load

      If the audit configuration is immutable (-e 2 in the rules), the new rules only take effect after a reboot. The rule assumes sudo logs to /var/log/sudo.log (Defaults logfile="/var/log/sudo.log" in a file under /etc/sudoers.d/).
