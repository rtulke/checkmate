  - id: "CIS-SUSE15-3.3.1-net.ipv4.ip_forward"
    name: "Kernel parameter net.ipv4.ip_forward is 0"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse15, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.ip_forward
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-f3a19b4b76 |
      With IP forwarding enabled the system routes packets between its interfaces like a router. A host that is not meant to route could then be used to bypass network segmentation. Disabling forwarding ensures only traffic addressed to the host itself is handled. Routers and many container or virtualization hosts need forwarding.
    remediation: &rem-330a5a5e8e |
      Set the kernel parameter net.ipv4.ip_forward to 0, now and at boot:

      sysctl -w 'net.ipv4.ip_forward=0'
      printf '%s\n' 'net.ipv4.ip_forward = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.ip_forward from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-SUSE15-3.3.1-ipv4_ip_forward"
    name: "ipv4 ip forward: grep -E \"^\\s*net\\.ipv4\\.ip_forward\" /etc/sysctl.conf /etc/sysctl.d/*.conf /usr/lib/sysctl…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse15, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "^\s*net\.ipv4\.ip_forward" /etc/sysctl.conf /etc/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /run/sysctl.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^.*:net.ipv4.ip_forward\\s*=\\s*0" }
    rationale: &rat-49a43343d7 |
      IP forwarding lets the host route packets between interfaces. A system that is not meant to be a router could otherwise be used to bypass network segmentation or relay attack traffic. Disabling forwarding ensures packets are only accepted for the host itself. Routers, VPN gateways and container or Kubernetes hosts legitimately need forwarding.
    remediation: &rem-c0b1e9eab5 |
      Set net.ipv4.ip_forward to 0 in a file in /etc/sysctl.d/ and apply it at runtime. Correct any other file that sets a different value (the check command lists them).

      printf '%s\n' 'net.ipv4.ip_forward=0' >> /etc/sysctl.d/60-netipv4_sysctl.conf
      sysctl -w net.ipv4.ip_forward=0
      sysctl -w net.ipv4.route.flush=1

      Files in /etc/sysctl.d/ are applied in lexical order, so a later file can override this setting.
  - id: "CIS-SUSE15-3.3.2-net.ipv4.conf.all.send_redirects"
    name: "Kernel parameter net.ipv4.conf.all.send_redirects is 0"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.3.2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse15, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.all.send_redirects
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-e772f5113d |
      Routers send ICMP redirects to tell hosts about better routes. A system that is not a router has no reason to send them, and an attacker who controls it could use redirects to divert other hosts' traffic. The 'all' setting applies to all current interfaces.
    remediation: &rem-9e5a0d6d8d |
      Set the kernel parameter net.ipv4.conf.all.send_redirects to 0, now and at boot:

      sysctl -w 'net.ipv4.conf.all.send_redirects=0'
      printf '%s\n' 'net.ipv4.conf.all.send_redirects = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.conf.all.send_redirects from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-SUSE15-3.3.2-net.ipv4.conf.default.send_redirects"
    name: "Kernel parameter net.ipv4.conf.default.send_redirects is 0"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.3.2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
