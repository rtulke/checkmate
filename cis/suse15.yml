  - id: "CIS-SUSE15-2.4.1.8-cron_allow_restricted-attrs"
    name: "/etc/cron.allow: exists, mode 0640 or stricter, owner root, group root"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.4.1.8. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse15, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/cron.allow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7137)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-9ac4787a69 |
      cron.allow defines which users may create cron jobs. It must be owned by root so that only administrators can change who is allowed to schedule jobs.
    remediation: &rem-3746395589 |
      Create /etc/cron.allow if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-rwx,a-t:

      chown root:root '/etc/cron.allow'
      chmod u-xs,g-wxs,o-rwx,a-t '/etc/cron.allow'
  - id: "CIS-SUSE15-2.4.1.8-cron_deny_absent-absent"
    name: "/etc/cron.deny does not exist"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.4.1.8. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse15, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      test -e '/etc/cron.deny' || test -L '/etc/cron.deny'
    expect: false
    rationale: &rat-4505b6a69e |
      With an allow list, only explicitly listed users may use cron, which is safer than a deny list that lets every new or forgotten account schedule jobs. Removing cron.deny ensures cron.allow is the only access control.
    remediation: &rem-d780ede041 |
      Remove /etc/cron.deny, unless the system needs it:

      rm '/etc/cron.deny'
