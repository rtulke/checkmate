      zypper remove xorg-x11-server
  - id: "CIS-SUSE15-2.2.1-ftp_client"
    name: "Package ftp is not installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.2.1. NIST SP 800-53 Rev. 5: CM-7, CM-11."
