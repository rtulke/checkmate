      - { rc: "== 0" }
      - { some: "~ .*_root$" }
    rationale: &rat-93d20735ce |
      The audit configuration and rule files determine what is recorded. If they are owned by a user other than root, that user can change or disable auditing.
    remediation: &rem-63ddfcf4ba |
      Make root the owner of all audit configuration and rule files.

      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) ! -user root -exec chown root {} +
  - id: "CIS-SUSE15-6.3.4.7-audit_conf_group"
    name: "audit conf group: for file  in `find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\)`; do stat …"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.4.7. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      for file  in `find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \)`; do stat -Lc " %n_%U" $file; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
