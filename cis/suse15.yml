  - id: "CIS-SUSE15-4.1.1-nftables_masked-attrs"
    name: "/etc/systemd/system/nftables.service: exists, is a symbolic link, links to /dev/null"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 4.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/system/nftables.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: &rat-38e0791684 |
      Running more than one firewall management service at the same time leads to rules overwriting each other and to unexpected open ports. Masking the nftables service where firewalld manages the firewall prevents it from being started, even as a dependency.
    remediation: &rem-de57692453 |
      Create /etc/systemd/system/nftables.service if it is missing, then point the link to /dev/null:

      ln -sfn '/dev/null' '/etc/systemd/system/nftables.service'
  - id: "CIS-SUSE15-4.2.1-firewalld_installed"
