  - id: "CIS-SUSE15-2.4.1.7-cron_d_perms-attrs"
    name: "/etc/cron.d: exists, is a directory, mode 0700 or stricter, owner root, group root"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.4.1.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse15, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
