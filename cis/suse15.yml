    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_6(0|4)0$" }
    rationale: &rat-dfb522cb65 |
      The audit configuration and rule files determine what is recorded. If they are writable by others, an attacker could disable auditing without root privileges; if they are readable by everyone, the gaps in monitoring become visible. A mode of 0640 or stricter prevents both.
    remediation: &rem-892fd1a120 |
      Remove write access for the group and all access for others from the audit configuration and rule files.

      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) -perm /0137 -exec chmod u-x,g-wx,o-rwx {} +
  - id: "CIS-SUSE15-6.3.4.6-audit_conf_owner"
    name: "audit conf owner: for file in `find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\)`; do stat -…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.4.6. NIST SP 800-53 Rev. 5: NA."
