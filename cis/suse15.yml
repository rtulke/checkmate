    rationale: &rat-efb996cae4 |
      ICMP redirects tell other hosts to use a different route, which only routers should do. The default setting applies to interfaces created later; disabling it ensures new interfaces do not send redirects either.
    remediation: &rem-2ca99cbedf |
      Set net.ipv4.conf.default.send_redirects to 0 in a file in /etc/sysctl.d/ and apply it at runtime. Correct any other file that sets a different value (the check command lists them).

