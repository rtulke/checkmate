  - id: "CIS-SUSE15-1.1.2.6.3-var_log_nosuid_options"
    name: "/var/log is a separate mount with nosuid"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.1.2.6.3. NIST SP 800-53 Rev. 5: CM-7, AC-3, MP-2."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
