      zypper remove ypbind
  - id: "CIS-SUSE15-2.2.4-telnet"
    name: "Package telnet is not installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.2.4. NIST SP 800-53 Rev. 5: CM-7, CM-11."
    tags: [cis, cis-suse15, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet telnet
    expect: false
    rationale: &rat-b00660eaf1 |
      The telnet client connects using an unencrypted protocol, so credentials and session data typed into it are exposed on the network. Removing it discourages insecure remote logins; use ssh for administration and tools such as nc or openssl s_client for port testing.
    remediation: &rem-8b064dd4b4 |
      Remove the package telnet, unless the system needs it:

      zypper remove telnet
  - id: "CIS-SUSE15-2.2.5-tftp-client"
    name: "Package tftp is not installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.2.5. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse15, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet tftp
    expect: false
    rationale: &rat-4307216737 |
      TFTP transfers files without authentication or encryption. The client is rarely needed outside network booting and device provisioning, and removing it prevents its use for unprotected file transfers.
    remediation: &rem-80a0cab684 |
      Remove the package tftp, unless the system needs it:

      zypper remove tftp
  - id: "CIS-SUSE15-2.3.1.1-chrony_tool"
    name: "Package chrony is installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.3.1.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-suse15, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet chrony
    expect: true
    rationale: &rat-fe5a572d89 |
      Accurate time is essential for correlating logs, validating certificates and time-based authentication. chrony is the time synchronisation daemon used for this, so it must be installed.
    remediation: &rem-9bff170edb |
      Install the package chrony:

      zypper install chrony
  - id: "CIS-SUSE15-2.3.1.1-ntp"
    name: "Package ntp is not installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.3.1.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-suse15, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet ntp
    expect: false
    rationale: &rat-3360cd3b3f |
      Running more than one time synchronization daemon makes them compete for control of the clock. On these platforms time synchronization is expected to be handled by another daemon such as systemd-timesyncd or chrony, so the ntp package should not be installed.
    remediation: &rem-670eb3f232 |
      Remove the package ntp, unless the system needs it:

      zypper remove ntp
  - id: "CIS-SUSE15-2.3.1.1-timesync_masked-attrs"
    name: "/etc/systemd/system/systemd-timesyncd.service: exists, is a symbolic link, links to /dev/null"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.3.1.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-suse15, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/system/systemd-timesyncd.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: &rat-be779f8e0d |
      Running more than one time synchronisation daemon makes them compete for control of the clock. When chrony is used, masking systemd-timesyncd ensures it cannot be started, leaving a single, consistently configured time source.
    remediation: &rem-7b7223e681 |
      Create /etc/systemd/system/systemd-timesyncd.service if it is missing, then point the link to /dev/null:

      ln -sfn '/dev/null' '/etc/systemd/system/systemd-timesyncd.service'
  - id: "CIS-SUSE15-2.3.3.1-chrony_pool-attrs"
    name: "/etc/chrony.d/pool.conf: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.3.3.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-suse15, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/chrony.d/pool.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d38df71f24 |
      Accurate time is needed to correlate logs across systems and to validate certificates and Kerberos tickets. Configuring chrony with defined pool sources ensures the host synchronises its clock from known, reliable references.
    remediation: &rem-2a52bf9203 |
      Create /etc/chrony.d/pool.conf.
  - id: "CIS-SUSE15-2.3.3.1-chrony_pool-content"
