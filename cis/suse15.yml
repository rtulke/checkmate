  - id: "CIS-SUSE15-3.3.3-net.ipv4.icmp_ignore_bogus_error_respons"
    name: "Kernel parameter net.ipv4.icmp_ignore_bogus_error_responses is 1"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 3.3.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-suse15, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.icmp_ignore_bogus_error_responses
    allow_rc: any
    expect:
      - { rc: "== 0" }
