      - { some: "~ -w /etc/sudoers -p wa -k scope" }
      - { some: "~ -w /etc/sudoers\\.d -p wa -k scope" }
    rationale: &rat-6dc7f1b6de |
      Changes to /etc/sudoers and /etc/sudoers.d alter who may run which commands with elevated privileges. Audit rules that record every write or attribute change to these files make unauthorised privilege grants detectable. This check verifies that the rules are loaded in the running kernel.
    remediation: *rem-65be48f470
  - id: "CIS-SUSE15-6.3.3.2-auditd_sudo_actions"
    name: "auditd sudo actions: grep user_emulation /etc/audit/rules.d/*.rules"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 6.3.3.2. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-suse15, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep user_emulation /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*:-a always,exit -F arch=b64 -C euid!=uid -F auid!=(unset|4294967295|-1) -S execve -k user_emulation" }
      - { some: "~ .*:-a always,exit -F arch=b32 -C euid!=uid -F auid!=(unset|4294967295|-1) -S execve -k user_emulation" }
    rationale: &rat-5c8eb61f92 |
      Commands run with sudo or other set-user-ID mechanisms execute with an effective user ID that differs from the real user. Auditing these executions records who ran which command with elevated or different privileges, which is essential for accountability and for detecting misuse of administrative rights.
    remediation: &rem-a5e1d53136 |
      Add the following rules to a file under /etc/audit/rules.d/ and load them:

      cat >> /etc/audit/rules.d/50-user_emulation.rules <<'EOF'
      -a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation
      -a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation
      EOF
      augenrules --load

      If the audit configuration is immutable (-e 2 in the rules), the new rules only take effect after a reboot.
  - id: "CIS-SUSE15-6.3.3.2-auditd_sudo_actions_live"
    name: "auditd sudo actions live: auditctl -l | grep user_emulation"
