  - id: "CIS-SUSE15-4.1.1-iptables_stopped-enabled"
    name: "Service iptables is not enabled"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 4.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState iptables | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-77b6856c48 |
      Running the iptables service alongside firewalld leads to conflicting rule sets, where one tool can overwrite or bypass the rules of the other. Only one firewall manager should be active.
