    remediation: &rem-2d3fb2c819 |
      Remove the package openldap2-client, unless the system needs it:

      zypper remove openldap2-client
  - id: "CIS-SUSE15-2.2.2-openldap2_5_removed"
    name: "Package openldap2_5 is not installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 2.2.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse15, cis-section-2, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
