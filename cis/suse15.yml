  - id: "CIS-SUSE15-1.1.2.7.1-var_log_audit_mount"
    name: "/var/log/audit is a separate mount"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.1.2.7.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-suse15, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
