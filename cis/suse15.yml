  - id: "CIS-SUSE15-1.2.1.1-gpg_keys"
    name: "gpg keys: rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --\u003e %{summary}"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.2.1.1. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --> %{summary}
      '
    expect: { rc: "== 0" }
    rationale: &rat-4781e33879 |
      Package signatures are only meaningful if the keys used to verify them are the right ones. An unexpected or attacker-supplied key in the package manager's keyring lets packages signed with it install without warning. Reviewing the imported keys ensures that only vendor and approved repository keys are trusted.
    remediation: &rem-4f17d36d12 |
      Import the SUSE package signing keys and remove any key that does not belong to an approved repository. List the installed keys first.

      rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --> %{summary}\n'
      rpm --import /usr/lib/rpm/gnupg/keys/KEYFILE
      rpm -e gpg-pubkey-VERSION-RELEASE

      zypper refresh also offers to import the keys of newly added repositories after showing their fingerprints.
  - id: "CIS-SUSE15-1.2.1.2-gpg_check_global"
    name: "gpg check global: if [ `grep -c -E '^\\s*gpgcheck.*0' /etc/zypp/zypp.conf` -ge 1 ]; then echo FAIL; elif [ `…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.2.1.2. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      if [ `grep -c -E '^\s*gpgcheck.*0' /etc/zypp/zypp.conf` -ge 1 ]; then echo FAIL; elif [ `grep -c -E '^\s*gpgcheck.*1' /etc/zypp/zypp.conf` -ge 1 ]; then echo Passed_Check;fi
    expect: { rc: "== 0" }
    rationale: &rat-b9d4a35c8e |
      Package signature verification ensures that only packages signed by a trusted vendor key are installed. With gpgcheck disabled, a compromised mirror, a man-in-the-middle on the download path or a tampered local file could deliver modified packages that run code as root during installation. Enabling it globally covers every repository that does not explicitly override it.
    remediation: &rem-3e8f836e8d |
      Make sure signature checking is not disabled in the zypper configuration or in any repository definition: set gpgcheck to on globally and to 1 in repository files.

      grep -Pris '^\h*gpgcheck\h*=' /etc/zypp/zypp.conf /usr/etc/zypp/zypp.conf /etc/zypp/zypp.conf.d/ /etc/zypp/repos.d/
      sed -ri 's/^\s*gpgcheck\s*=.*/gpgcheck = on/' /etc/zypp/zypp.conf
      sed -ri 's/^\s*gpgcheck\s*=.*/gpgcheck=1/' /etc/zypp/repos.d/*.repo

      Correct any disabling line found in /etc/zypp/zypp.conf.d/ the same way.
  - id: "CIS-SUSE15-1.2.1.2-gpg_check_repo"
    name: "gpg check repo: if [ `grep -c -E '^\\s*gpgcheck.*0' /etc/zypp/repos.d/*.repo` -ge 1 ]; then echo FAIL; eli…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.2.1.2. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      if [ `grep -c -E '^\s*gpgcheck.*0' /etc/zypp/repos.d/*.repo` -ge 1 ]; then echo FAIL; elif [ `grep -c -E '^\s*gpgcheck.*1' /etc/zypp/repos.d/*.repo` -ge 1 ]; then echo Passed_Check;fi
    expect: { rc: "== 0" }
    rationale: &rat-b0f4f69ff9 |
      A repository definition can override the global setting and turn signature checking off for its packages. Any repository with gpgcheck disabled lets unsigned or tampered packages be installed silently, so signature checking needs to stay enabled for every configured repository.
    remediation: &rem-b5ab7612a7 |
      Enable package signature checking for every repository that has it turned off.

      grep -RniE '^\s*gpgcheck\s*=\s*0' /etc/zypp/repos.d/
      zypper modifyrepo --gpgcheck ALIAS

      ALIAS is the repository alias shown by zypper repos.
  - id: "CIS-SUSE15-1.2.1.3-repo_gpgcheck_global"
    name: "repo gpgcheck global: grep -E \"^repo_gpgcheck\" /etc/zypp/zypp.conf"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.2.1.3. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-suse15, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    timeout: 120000ms
    run: |
      grep -E "^repo_gpgcheck" /etc/zypp/zypp.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^repo_gpgcheck( |)=( |)(1|on)" }
      - { none: "~ ^repo_gpgcheck( |)=( |)(0|false|off|no)" }
    rationale: &rat-a13f5fa04a |
      Package signatures protect individual packages, but not the repository metadata that tells the package manager which versions exist. Without metadata signature checking an attacker controlling a mirror or the network path can withhold security updates or offer outdated vulnerable packages that are still validly signed. Verifying metadata signatures closes that gap. Some repositories do not publish signed metadata, so enabling it globally may require per-repository exceptions.
    remediation: &rem-191f53a634 |
      Enable repository metadata signature checking in the [main] section of /etc/zypp/zypp.conf (on SUSE 16, copy /usr/etc/zypp/zypp.conf to /etc/zypp/zypp.conf first if it does not exist):

      [ -e /etc/zypp/zypp.conf ] || cp /usr/etc/zypp/zypp.conf /etc/zypp/zypp.conf
      sed -i -E '/^\s*repo_gpgcheck\s*=/d' /etc/zypp/zypp.conf
      sed -i '/^\[main\]/a repo_gpgcheck = on' /etc/zypp/zypp.conf
      zypper refresh

      Remove conflicting repo_gpgcheck settings from /etc/zypp/zypp.conf.d/ if that directory exists.
  - id: "CIS-SUSE15-1.2.1.3-repo_gpgcheck_repo"
    name: "repo gpgcheck repo: grep -RPi -- '^\\h*repo_gpgcheck\\h*=\\h*(0|false|no|off)\\b' /etc/zypp/repos.d/"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.2.1.3. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-suse15, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    timeout: 120000ms
    run: |
      grep -RPi -- '^\h*repo_gpgcheck\h*=\h*(0|false|no|off)\b' /etc/zypp/repos.d/
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-ede943bafc |
      Besides individual packages, the repository metadata (package lists and checksums) can be signed. Verifying it protects against an attacker who serves stale or manipulated metadata, for example to withhold security updates. Repositories should not explicitly disable this verification; enabling it requires that the repository publishes signed metadata.
    remediation: &rem-5189c1ff84 |
      Remove explicit repo_gpgcheck settings from the listed FILE; zypper then verifies signed repository metadata by default.

      grep -Rn 'repo_gpgcheck' /etc/zypp/repos.d/
      sed -i '/^\s*repo_gpgcheck\s*=/d' FILE
      zypper refresh

      On SUSE 16 the check flags every repo_gpgcheck line, even repo_gpgcheck=1, so delete the line instead of changing its value.
  - id: "CIS-SUSE15-1.2.1.4-repos_configured"
    name: "repos configured: zypper repos"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.2.1.4. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      zypper repos
    expect: { rc: "== 0" }
    rationale: &rat-70d1c99f9e |
      Systems should get packages and security fixes only from known, approved repositories. A missing or broken repository configuration prevents patching, while unknown repositories can introduce untrusted software. Depending on the platform the check verifies that the repository list can be read, that expected repositories are present, or asks for a manual review.
    remediation: &rem-f7e219a301 |
      zypper repos only succeeds when repositories are defined. Register the system (SCC, RMT or SUSE Manager) or add the approved repositories.

      zypper repos
      SUSEConnect -r REGCODE
      zypper addrepo URL ALIAS
  - id: "CIS-SUSE15-1.2.2.1-package-updates"
    name: "package updates: zypper lu"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.2.2.1. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      zypper lu
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ No updates found\\." }
    rationale: &rat-424a5d1342 |
      Most successful attacks exploit known vulnerabilities for which updates already exist. Installing available updates promptly closes these holes. The check passes only when zypper reports no pending updates.
    remediation: &rem-f639d73e83 |
      Refresh the repositories and install all available updates.

      zypper refresh
      zypper update
      zypper lu

      Test updates according to change management first. A reboot is needed if the kernel or core libraries were updated.
  - id: "CIS-SUSE15-1.3.1.1-apparmor-parser"
    name: "Package apparmor-parser is installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.3.1.1. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet apparmor-parser
    expect: true
    rationale: &rat-0cfc03cb3f |
      AppArmor restricts programs to the files and capabilities listed in their profiles, limiting the impact of a compromised service. The parser is required to load profiles into the kernel; without it AppArmor cannot be enforced.
    remediation: &rem-2b3fb72541 |
      Install the package apparmor-parser:

      zypper install apparmor-parser
  - id: "CIS-SUSE15-1.3.1.1-apparmor-profiles"
    name: "Package apparmor-profiles is installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.3.1.1. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet apparmor-profiles
    expect: true
    rationale: &rat-99d2689f52 |
      AppArmor only protects programs for which a profile exists. The profiles package provides ready-made profiles for common services, so that they can be confined without writing profiles from scratch.
    remediation: &rem-deca76c133 |
      Install the package apparmor-profiles:

      zypper install apparmor-profiles
  - id: "CIS-SUSE15-1.3.1.1-apparmor-utils"
    name: "Package apparmor-utils is installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.3.1.1. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet apparmor-utils
    expect: true
    rationale: &rat-57320ccd01 |
      apparmor-utils provides tools such as aa-enforce, aa-complain and aa-status for managing AppArmor profiles. They are needed to put profiles into enforce mode and to verify their state, which is how AppArmor confines applications and limits the damage of a compromised service.
    remediation: &rem-239a0acab7 |
      Install the package apparmor-utils:

      zypper install apparmor-utils
  - id: "CIS-SUSE15-1.3.1.1-libapparmor1"
    name: "Package libapparmor1 is installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.3.1.1. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet libapparmor1
    expect: true
    rationale: &rat-87dcc23f71 |
      libapparmor provides the library interface AppArmor-aware programs and tools use. It is required for AppArmor to be managed and used fully.
    remediation: &rem-ad84615af9 |
      Install the package libapparmor1:

      zypper install libapparmor1
  - id: "CIS-SUSE15-1.3.1.2-apparmor_boot_grub-attrs"
    name: "/boot/grub2/grub.cfg: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/boot/grub2/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-60629722a6 |
      AppArmor has to be enabled when the kernel starts; profiles cannot be loaded if the kernel runs another or no security module. Checking the generated GRUB configuration for apparmor=1 and security=apparmor confirms that every boot entry enables it.
    remediation: &rem-2a9d993c7f |
      Create /boot/grub2/grub.cfg.
  - id: "CIS-SUSE15-1.3.1.2-apparmor_boot_grub-content"
    name: "/boot/grub2/grub.cfg has the expected content (3 rules)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/boot/grub2/grub.cfg'
    allow_rc: any
    expect:
      - { some: "~ apparmor=1" }
      - { some: "~ security=apparmor" }
      - { none: "~ apparmor=0" }
    rationale: *rat-60629722a6
    remediation: &rem-46773c0636 |
      Edit /boot/grub2/grub.cfg so that its lines meet these conditions (regular expressions):

      - a line matches apparmor=1
      - a line matches security=apparmor
      - no line matches apparmor=0
  - id: "CIS-SUSE15-1.3.1.2-grub_app_armor-attrs"
    name: "/etc/default/grub: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ecf938aaab |
      A mandatory access control module must be activated on the kernel command line so that it is active from early boot for every boot entry. Setting the parameters in /etc/default/grub makes this persistent across GRUB regenerations. On SUSE 16 the check expects SELinux (selinux=1 security=selinux) instead of AppArmor.
    remediation: &rem-2d1523887c |
      Create /etc/default/grub.
  - id: "CIS-SUSE15-1.3.1.2-grub_app_armor-content"
    name: "/etc/default/grub has the expected content (3 rules)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect:
      - { some: "~ ^GRUB_CMDLINE_LINUX.*apparmor=1" }
      - { some: "~ ^GRUB_CMDLINE_LINUX.*security=apparmor" }
      - { none: "~ apparmor=0" }
    rationale: *rat-ecf938aaab
    remediation: &rem-210c5e7ead |
      Edit /etc/default/grub so that its lines meet these conditions (regular expressions):

      - a line matches ^GRUB_CMDLINE_LINUX.*apparmor=1
      - a line matches ^GRUB_CMDLINE_LINUX.*security=apparmor
      - no line matches apparmor=0
  - id: "CIS-SUSE15-1.3.1.3-apparmor_enf_or_comp"
    name: "apparmor enf or comp: apparmor_status 2\u003e/dev/null | awk '"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.3.1.3. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      apparmor_status 2>/dev/null | awk '
        /profiles are loaded/ {pl=$1}
        /profiles are in enforce mode/ {pe=$1}
        /profiles are in complain mode/ {pc=$1}
        /profiles are in kill mode/ {pk=$1}
        /processes are unconfined but have a profile defined/ {qu=$1}
        END {
          print "profiles_loaded=" pl+0
          print "profiles_enforce_or_complain=" (pl+0 == pe+pc+pk ? "all" : pe+pc+pk)
          print "processes_unconfined=" (qu == "" ? "missing" : qu)
        }'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^profiles_loaded=[1-9]" }
      - { some: "~ ^profiles_enforce_or_complain=all$" }
      - { some: "~ ^processes_unconfined=0$" }
    rationale: &rat-56a855fea9 |
      A loaded AppArmor profile only has an effect in enforce mode, where violations are blocked, or complain mode, where they are logged. Requiring every loaded profile to be in one of these modes, and no process with a defined profile to run unconfined, ensures applications that have a policy are actually restricted or at least monitored.
    remediation: &rem-6e0155fa4d |
      Install the AppArmor utilities, put all profiles into enforce mode and restart processes that have a profile but are still running unconfined.

      zypper install apparmor-utils
      aa-enforce /etc/apparmor.d/*
      aa-status
      systemctl restart SERVICE

      A reboot also places all processes under their profiles.
  - id: "CIS-SUSE15-1.3.1.4-apparmor_enf_only"
    name: "apparmor enf only: apparmor_status 2\u003e/dev/null | awk '"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.3.1.4. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse15, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      apparmor_status 2>/dev/null | awk '
        /profiles are loaded/ {pl=$1}
        /profiles are in complain mode/ {pc=$1}
        /processes are in complain mode/ {qc=$1}
        /processes are unconfined but have a profile defined/ {qu=$1}
        END {
          print "profiles_loaded=" pl+0
          print "profiles_complain=" (pc == "" ? "missing" : pc)
          print "processes_complain=" (qc == "" ? "missing" : qc)
          print "processes_unconfined=" (qu == "" ? "missing" : qu)
        }'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^profiles_loaded=[1-9]" }
      - { some: "~ ^profiles_complain=0$" }
      - { some: "~ ^processes_complain=0$" }
      - { some: "~ ^processes_unconfined=0$" }
    rationale: &rat-431a321151 |
      Complain mode only logs policy violations, while enforce mode blocks them. Running all profiles in enforce mode, with no process that has a profile left unconfined, means the confinement policies actually protect the system instead of merely documenting what a compromised program did.
    remediation: *rem-6e0155fa4d
  - id: "CIS-SUSE15-1.4.2-grub_bootloaders_perms-attrs"
    name: "/boot/grub2/grub.cfg: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.4.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/boot/grub2/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-186ae958c2 |
      grub.cfg describes how the system boots, including kernel parameters and, if a boot password is set, its hash. Restricting it to root with mode 0600 or stricter prevents users from reading these details or altering the boot configuration.
    remediation: &rem-9e6da05721 |
      Create /boot/grub2/grub.cfg if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/boot/grub2/grub.cfg'
      chmod u-xs,g-rwxs,o-rwx,a-t '/boot/grub2/grub.cfg'
  - id: "CIS-SUSE15-1.5.1-address_space_random"
    name: "Kernel parameter kernel.randomize_va_space is 2"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.5.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.randomize_va_space
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 2"
    rationale: &rat-55eb3f834d |
      Address space layout randomization places the stack, heap, shared libraries and memory mappings at random addresses. Full randomization (value 2) makes memory corruption exploits much harder, because attackers can no longer rely on known addresses for code or data.
    remediation: &rem-a6e5efe9f8 |
      Set the kernel parameter kernel.randomize_va_space to 2, now and at boot:

      sysctl -w 'kernel.randomize_va_space=2'
      printf '%s\n' 'kernel.randomize_va_space = 2' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.randomize_va_space from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-SUSE15-1.5.1-aslr_enabled_2"
    name: "aslr enabled 2: grep \"kernel\\.randomize_va_space\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.5.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "kernel\.randomize_va_space" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^*.conf:kernel.randomize_va_space\\s*=\\s*2" }
    rationale: &rat-2872b53691 |
      Address space layout randomization places the stack, heap, shared libraries and other memory regions at random addresses, which makes memory corruption exploits much harder. The value 2 enables full randomization. Setting it in a sysctl configuration file ensures it is applied at every boot and not only at runtime.
    remediation: &rem-8c969413dc |
      Set kernel.randomize_va_space to 2 in a sysctl configuration file so it is applied at every boot, and apply it now.

      printf '%s\n' 'kernel.randomize_va_space = 2' > /etc/sysctl.d/60-kernel_sysctl.conf
      sysctl -w kernel.randomize_va_space=2

      Remove or correct any other kernel.randomize_va_space line in /etc/sysctl.conf and /etc/sysctl.d/.
  - id: "CIS-SUSE15-1.5.2-fs_suid_dumpable"
    name: "Kernel parameter fs.suid_dumpable is 0"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.5.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n fs.suid_dumpable
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-b19e6b5b75 |
      Core dumps of setuid programs can contain sensitive data from a privileged process, such as password hashes or keys. With fs.suid_dumpable set to 0, the kernel does not write core dumps for processes that changed privileges.
    remediation: &rem-789aaadb7b |
      Set the kernel parameter fs.suid_dumpable to 0, now and at boot:

      sysctl -w 'fs.suid_dumpable=0'
      printf '%s\n' 'fs.suid_dumpable = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of fs.suid_dumpable from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-SUSE15-1.5.2-coredump_dumpable_conf"
    name: "coredump dumpable conf: grep \"fs.suid_dumpable\" /etc/sysctl.conf /etc/sysctl.d/* 2\u003e/dev/null"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.5.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "fs.suid_dumpable" /etc/sysctl.conf /etc/sysctl.d/* 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:fs.suid_dumpable\\s*=\\s*0" }
      - { none: "~ .*:fs.suid_dumpable\\s*=\\s*[1-9]" }
    rationale: &rat-6fc646badf |
      Core dumps of setuid programs can expose sensitive data from privileged processes, such as password hashes or keys. Setting fs.suid_dumpable = 0 in a sysctl configuration file makes this protection persistent across reboots.
    remediation: &rem-b811b38da5 |
      Set fs.suid_dumpable = 0 in a sysctl drop-in file, correct any other file that sets a non-zero value (run the check command to list them), and apply it.

      grep fs.suid_dumpable /etc/sysctl.conf /etc/sysctl.d/*
      printf '%s\n' 'fs.suid_dumpable = 0' > /etc/sysctl.d/60-fs_sysctl.conf
      sysctl -w fs.suid_dumpable=0
  - id: "CIS-SUSE15-1.5.2-coredump_limits_conf"
    name: "coredump limits conf: grep -E \"^\\s*\\*\\s+hard\\s+core\" /etc/security/limits.conf /etc/security/limits.d/* 2\u003e/dev/…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.5.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "^\s*\*\s+hard\s+core" /etc/security/limits.conf /etc/security/limits.d/* 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ \\* hard core 0" }
      - { none: "~ hard core [1-9]" }
    rationale: &rat-f1e913c08f |
      Core dumps can contain passwords, keys and other sensitive data from process memory. A hard core size limit of 0 for all users prevents them from being written and stops users from raising the limit themselves.
    remediation: &rem-28c39a97be |
      Add a hard core limit of 0 for all users, written with single spaces as the check expects, and remove any entry allowing a larger hard limit.

      echo '* hard core 0' > /etc/security/limits.d/50-coredump.conf
      grep -E 'hard\s+core' /etc/security/limits.conf /etc/security/limits.d/*

      The limit applies to new login sessions.
  - id: "CIS-SUSE15-1.5.3-prelink_package"
    name: "Package prelink is not installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.5.3."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet prelink
    expect: false
    rationale: &rat-921ff264ab |
      prelink modifies binaries and libraries in place to speed up loading. This interferes with integrity monitoring tools such as AIDE, which then report changes, and a compromised prelink could alter binaries. The package should not be installed.
    remediation: &rem-aa5607c6ed |
      Remove the package prelink, unless the system needs it:

      zypper remove prelink
  - id: "CIS-SUSE15-1.6.1-crypto_pkg_installed"
    name: "Package crypto-policies-scripts is installed"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.6.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet crypto-policies-scripts
    expect: true
    rationale: &rat-3eac6c2109 |
      crypto-policies-scripts provides the update-crypto-policies tool for selecting and applying a system-wide crypto policy. Without it, the policy cannot be managed consistently across TLS, SSH and other components.
    remediation: &rem-0bb71b1e47 |
      Install the package crypto-policies-scripts:

      zypper install crypto-policies-scripts
  - id: "CIS-SUSE15-1.6.2-crypto_policies_config"
    name: "crypto policies config: cat /etc/crypto-policies/config"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.6.2. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/crypto-policies/config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(|\\s+)(DEFAULT|FUTURE|FIPS)" }
      - { none: "~ ^(|\\s+)LEGACY" }
    rationale: &rat-97d5e3099e |
      The system-wide crypto policy defines which protocols, ciphers, key sizes and hash algorithms libraries such as OpenSSL, GnuTLS, NSS and OpenSSH accept. The LEGACY policy re-enables weak algorithms like SHA-1 signatures and small keys that allow downgrade or forgery attacks. Using DEFAULT, FUTURE or FIPS keeps all applications on a consistent, acceptable baseline.
    remediation: &rem-1c3854f2aa |
      Select the DEFAULT system-wide crypto policy (FUTURE or FIPS are also accepted) instead of LEGACY.

      update-crypto-policies --set DEFAULT
      update-crypto-policies --show

      Restart services or reboot so that all applications pick up the new policy. Selecting FIPS here does not by itself enable FIPS mode.
  - id: "CIS-SUSE15-1.6.3-crypto_policies_not_in_sshd"
    name: "crypto policies not in sshd: grep -Pi '^\\h*CRYPTO_POLICY\\h*=' /etc/sysconfig/ssh"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.6.3. NIST SP 800-53 Rev. 5: SC-8, IA-5, AC-17."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Pi '^\h*CRYPTO_POLICY\h*=' /etc/sysconfig/ssh
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-2936e5206f |
      sshd normally follows the system-wide crypto policy. A CRYPTO_POLICY variable in the sshd sysconfig file overrides it and can re-enable weak ciphers, MACs or key exchange methods without this being visible in the central policy. Removing the override keeps SSH aligned with the system policy.
    remediation: &rem-de250f39d3 |
      Comment out any CRYPTO_POLICY line in /etc/sysconfig/ssh and restart sshd.

      sed -ri 's/^\s*(CRYPTO_POLICY\s*=)/# \1/I' /etc/sysconfig/ssh
      systemctl restart sshd
  - id: "CIS-SUSE15-1.6.4-crypto_policies_no_sha1_current-attrs"
    name: "/etc/crypto-policies/state/CURRENT.pol: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.6.4. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/crypto-policies/state/CURRENT.pol'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-16fe00de9a |
      SHA-1 is no longer collision resistant; practical chosen-prefix collisions allow forging signatures and certificates that rely on it. The system-wide crypto policy determines which algorithms TLS, SSH, Kerberos and other libraries accept. A policy that excludes SHA-1 for hashes and signatures prevents applications from negotiating or trusting SHA-1 based signatures.
    remediation: &rem-f645034cb6 |
      Create /etc/crypto-policies/state/CURRENT.pol.
  - id: "CIS-SUSE15-1.6.4-crypto_policies_no_sha1_current-content"
    name: "/etc/crypto-policies/state/CURRENT.pol has the expected content (2 rules)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.6.4. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/crypto-policies/state/CURRENT.pol'
    allow_rc: any
    expect:
      - { some: "~ ^sha1_in_certs\\s*=\\s*0" }
      - { none: "~ ^(hash|sign)\\s*=\\s*SHA1" }
    rationale: *rat-16fe00de9a
    remediation: &rem-37a2064b7e |
      Edit /etc/crypto-policies/state/CURRENT.pol so that its lines meet these conditions (regular expressions):

      - a line matches ^sha1_in_certs\s*=\s*0
      - no line matches ^(hash|sign)\s*=\s*SHA1
  - id: "CIS-SUSE15-1.6.5-crypto_policies_no_weakmacs-attrs"
    name: "/etc/crypto-policies/state/CURRENT.pol: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.6.5. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/crypto-policies/state/CURRENT.pol'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-08e25e2adb |
      Message authentication codes protect data in transit against tampering. MACs with short tags, such as 64-bit variants, can be forged with feasible effort and offer too little margin against collision attacks on long-lived connections. Excluding them from the system-wide crypto policy ensures that TLS, SSH and other libraries only negotiate MACs with adequate strength.
    remediation: *rem-f645034cb6
  - id: "CIS-SUSE15-1.6.5-crypto_policies_no_weakmacs-content"
    name: "/etc/crypto-policies/state/CURRENT.pol has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.6.5. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/crypto-policies/state/CURRENT.pol'
    allow_rc: any
    expect: { none: "~ ^mac\\s*=\\s*.*64" }
    rationale: *rat-08e25e2adb
    remediation: &rem-c2b12a0218 |
      Edit /etc/crypto-policies/state/CURRENT.pol so that its lines meet these conditions (regular expressions):

      - no line matches ^mac\s*=\s*.*64
  - id: "CIS-SUSE15-1.6.6-crypto_policies_no_ssh_cbc-attrs"
    name: "/etc/crypto-policies/state/CURRENT.pol: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.6.6. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/crypto-policies/state/CURRENT.pol'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-779955ae7a |
      CBC mode ciphers in SSH have a history of plaintext-recovery attacks and, combined with encrypt-then-MAC, are affected by the Terrapin prefix truncation attack. Modern counter and AEAD modes such as AES-CTR and AES-GCM avoid these problems. Disabling CBC ciphers for SSH in the system-wide crypto policy removes these weaker modes from both the SSH server and clients.
    remediation: *rem-f645034cb6
  - id: "CIS-SUSE15-1.6.6-crypto_policies_no_ssh_cbc-content"
    name: "/etc/crypto-policies/state/CURRENT.pol has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.6.6. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/crypto-policies/state/CURRENT.pol'
    allow_rc: any
    expect: { none: "~ (?i)^\\s*cipher@(lib|open)ssh(-server|-client)?\\s*=\\s*([^#\\n\\r]+)?-CBC\\b" }
    rationale: *rat-779955ae7a
    remediation: &rem-e77fe9de9d |
      Edit /etc/crypto-policies/state/CURRENT.pol so that its lines meet these conditions (regular expressions):

      - no line matches (?i)^\s*cipher@(lib|open)ssh(-server|-client)?\s*=\s*([^#\n\r]+)?-CBC\b
  - id: "CIS-SUSE15-1.6.7-crypto_policies_no_ssh_chacha-poly1305-attrs"
    name: "/etc/crypto-policies/state/CURRENT.pol: exists"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.6.7. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/crypto-policies/state/CURRENT.pol'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-565eae9272 |
      The chacha20-poly1305 cipher in SSH is affected by the Terrapin prefix-truncation attack (CVE-2023-48795) when the peer lacks strict key exchange. Checking the effective crypto policy confirms SSH will not negotiate this cipher.
    remediation: *rem-f645034cb6
  - id: "CIS-SUSE15-1.6.7-crypto_policies_no_ssh_chacha-poly1305-content"
    name: "/etc/crypto-policies/state/CURRENT.pol has the expected content (1 rule)"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.6.7. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/crypto-policies/state/CURRENT.pol'
    allow_rc: any
    expect: { none: "~ (?i)^\\s*cipher@(lib|open)ssh(-server|-client)?\\s*=\\s*([^#\\n\\r]+)?\\bchacha20-poly1305\\b" }
    rationale: *rat-565eae9272
    remediation: &rem-57415af721 |
      Edit /etc/crypto-policies/state/CURRENT.pol so that its lines meet these conditions (regular expressions):

      - no line matches (?i)^\s*cipher@(lib|open)ssh(-server|-client)?\s*=\s*([^#\n\r]+)?\bchacha20-poly1305\b
  - id: "CIS-SUSE15-1.7.1-check_motd_files"
    name: "check motd files: grep -Eis \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.7.1. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/motd{,.d/*}
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-06adda8e6a |
      Login messages that reveal the operating system name, release or kernel version help attackers pick matching exploits. The getty escape sequences \m, \r, \s and \v insert exactly this information. Messages should contain only a site-approved notice.
    remediation: &rem-bc36052cf6 |
      Replace the message of the day with a site-approved notice that contains no OS name, version or escape sequences, and review the files in /etc/motd.d.

      echo 'Authorized users only. All activity may be monitored and reported.' > /etc/motd
      grep -Eis "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/motd /etc/motd.d/*

      Edit or remove listed files in /etc/motd.d after review.
  - id: "CIS-SUSE15-1.7.2-check_etc_issue"
    name: "check etc issue: grep -Eis \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.7.2. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/issue
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-6ca01e7c31 |
      /etc/issue is displayed before local logins. If it reveals the operating system name or release, directly or through the getty escape sequences \m, \r, \s and \v, it helps attackers choose matching exploits. It should contain only a site-approved legal notice.
    remediation: &rem-aa884c3ab5 |
      Replace /etc/issue with a site-approved notice that contains no OS name, version or escape sequences.

      echo 'Authorized users only. All activity may be monitored and reported.' > /etc/issue
  - id: "CIS-SUSE15-1.7.3-check_etc_issue_net"
    name: "check etc issue net: grep -Eis \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"…"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.7.3. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/issue.net
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-0d6114190c |
      /etc/issue.net is displayed to remote users before login, for example by SSH when a banner is configured. If it reveals the operating system name or release, it gives unauthenticated users information useful for choosing exploits. It should contain only a site-approved legal notice.
    remediation: &rem-16aee316b5 |
      Replace /etc/issue.net with a site-approved notice that contains no OS name, version or escape sequences.

      echo 'Authorized users only. All activity may be monitored and reported.' > /etc/issue.net
  - id: "CIS-SUSE15-1.7.4-motd_permissions-attrs"
    name: "/etc/motd: mode 0644 or stricter, owner root, group root"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.7.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/motd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-40c6847e15 |
      The message of the day is shown to every user after login. If non-root users could modify it, they could display misleading instructions, for example to trick other users into revealing credentials. Ownership by root and mode 0644 prevent this.
    remediation: &rem-cc50883ec8 |
      Create /etc/motd if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/motd'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/motd'
  - id: "CIS-SUSE15-1.7.5-etc_issue_permissions-attrs"
    name: "/etc/issue: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS SUSE Linux Enterprise 15 benchmark recommendation 1.7.5. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-suse15, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-f2e8e32c7b |
      /etc/issue is shown before local logins. If non-root users could write it, they could alter the legal warning or display misleading information. Ownership by root and mode 0644 or stricter prevent this.
    remediation: &rem-683e1f474b |
      Create /etc/issue if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue'
