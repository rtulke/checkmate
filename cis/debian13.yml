    rationale: &rat-9b57ac9d17 |
      pam_unix in common-session logs the opening and closing of sessions for local accounts, providing an audit trail of logins for all PAM-aware services. Keeping the required entry ensures these events are recorded.
    remediation: &rem-3e5b996c7b |
