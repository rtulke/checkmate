    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ ^*.conf:kernel.yama.ptrace_scope\\s*=\\s*(1|2|3)$" }
    rationale: *rat-38b04622d0
    remediation: *rem-1a9988f9e9
  - id: "CIS-DEBIAN13-1.5.11-fs.suid_dumpable_sysctl"
    name: "Kernel parameter fs.suid_dumpable is 0"
    description: "CIS Debian 13 benchmark recommendation 1.5.11. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n fs.suid_dumpable
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-b656a017f7 |
      Core dumps of setuid programs can contain privileged data such as password hashes or private keys. Setting fs.suid_dumpable to 0 stops setuid and otherwise privileged processes from producing core dumps.
    remediation: *rem-789aaadb7b
  - id: "CIS-DEBIAN13-1.5.11-system_coredump_conf"
    name: "system coredump conf: grep -Ps -- '^\\h*\\*\\h+hard\\h+core\\h+0\\b' /etc/security/limits.conf /etc/security/limits.d…"
    description: "CIS Debian 13 benchmark recommendation 1.5.11. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ps -- '^\h*\*\h+hard\h+core\h+0\b' /etc/security/limits.conf /etc/security/limits.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^*.conf:\\* hard core 0" }
    rationale: &rat-83a1eaee74 |
      Core dumps capture a process's memory, which can include passwords, keys or personal data, and they can fill up disks. A hard core size limit of 0 for all users prevents core files from being written, and unprivileged users cannot raise a hard limit.
    remediation: &rem-52845b0954 |
      Set a hard core size limit of 0 for all users in a file under /etc/security/limits.d/.

      printf '%s\n' '* hard core 0' >> /etc/security/limits.d/60-coredump.conf

      The limit applies to new sessions. Use a file in limits.d: the check expects the file name in front of the matching line, which grep only prints when that directory contains files.
  - id: "CIS-DEBIAN13-1.5.12-system_processsizemax_conf-attrs"
    name: "/etc/systemd/coredump.conf.d/60-coredump.conf: exists"
    description: "CIS Debian 13 benchmark recommendation 1.5.12. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/coredump.conf.d/60-coredump.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-b83636ff53 |
      Core dumps contain the memory of crashed processes and can expose passwords, keys and personal data to anyone able to read them. ProcessSizeMax=0 in the systemd-coredump configuration disables the processing of core dumps.
    remediation: &rem-a8c378dcf3 |
      Create /etc/systemd/coredump.conf.d/60-coredump.conf.
  - id: "CIS-DEBIAN13-1.5.12-system_processsizemax_conf-content"
