      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ad0dd2cb95 |
      Host-based authentication trusts a client because of the machine it connects from rather than authenticating the individual user. A compromised or spoofed trusted host then grants access to accounts on this server without any user credential. Disabling it ensures every login is authenticated per user.
    remediation: *rem-f6392187bb
