      chgrp root /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules

      Leave out autrace where it is not installed (for example on Debian 13).
  - id: "CIS-DEBIAN13-6.3.1-aide"
    name: "Package aide is installed"
    description: "CIS Debian 13 benchmark recommendation 6.3.1. NIST SP 800-53 Rev. 5: AU-2."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' aide 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-24b82fc810 |
      AIDE is a file integrity checker that records a baseline of files and later reports changes. It detects unauthorised modifications of binaries and configuration files that could indicate a compromise.
    remediation: &rem-22ee0488f4 |
      Install the package aide:

      apt-get install aide
  - id: "CIS-DEBIAN13-6.3.1-aide-common"
    name: "Package aide-common is installed"
    description: "CIS Debian 13 benchmark recommendation 6.3.1. NIST SP 800-53 Rev. 5: AU-2."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' aide-common 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-8e6297dc4c |
      AIDE builds a database of file checksums and attributes and reports later changes. Without such a file integrity tool, modified binaries, configuration files or planted backdoors can go unnoticed. The aide-common package provides the configuration and helper scripts that Debian and Ubuntu use to initialize and run AIDE regularly.
    remediation: &rem-39f5ad93cf |
      Install the package aide-common:

      apt-get install aide-common
  - id: "CIS-DEBIAN13-6.3.2-aide_cron"
    name: "aide cron: grep -rs aide /etc/cron.* /etc/crontab /var/spool/cron/*"
    description: "CIS Debian 13 benchmark recommendation 6.3.2. NIST SP 800-53 Rev. 5: AU-2."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -rs aide /etc/cron.* /etc/crontab /var/spool/cron/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { none: "~ ^#" }
    rationale: &rat-86b8cfeaea |
      A file integrity baseline is only useful if it is compared regularly. Scheduling AIDE checks ensures that unexpected changes to system files are reported automatically instead of remaining unnoticed until someone runs the check by hand.
    remediation: &rem-92b952e317 |
      Schedule a regular AIDE check with cron, for example daily in /etc/cron.d, after the AIDE database has been initialised (aideinit).

      echo '0 5 * * * root /usr/bin/aide --check --config /etc/aide/aide.conf' > /etc/cron.d/aide
      chmod 0644 /etc/cron.d/aide

      A systemd timer would work as well, but this check only looks at cron files.
  - id: "CIS-DEBIAN13-6.3.3-audit_bins_crypto_aide-attrs"
    name: "/etc/aide/aide.conf: exists"
    description: "CIS Debian 13 benchmark recommendation 6.3.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/aide/aide.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-362fec1225 |
      The audit tools (auditctl, auditd, ausearch, aureport, augenrules and related binaries) control and read the audit trail. An attacker who replaces them could hide activity or silently disable auditing. Including them in the AIDE database with permission, ownership, ACL, extended attribute and SHA-512 checks makes any modification of these binaries detectable.
    remediation: &rem-f9125890bc |
      Create /etc/aide/aide.conf.
  - id: "CIS-DEBIAN13-6.3.3-audit_bins_crypto_aide-content"
    name: "/etc/aide/aide.conf has the expected content (5 rules)"
    description: "CIS Debian 13 benchmark recommendation 6.3.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/aide/aide.conf'
    allow_rc: any
    expect:
      - { some: "~ ^\\s*\\/usr\\/sbin\\/auditctl\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ ^\\s*\\/usr\\/sbin\\/auditd\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ ^\\s*\\/usr\\/sbin\\/ausearch\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ ^\\s*\\/usr\\/sbin\\/aureport\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ ^\\s*\\/usr\\/sbin\\/augenrules\\s+p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
    rationale: *rat-362fec1225
    remediation: &rem-1543b69dbc |
      Edit /etc/aide/aide.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*\/usr\/sbin\/auditctl\s+p\+i\+n\+u\+g\+s\+b\+acl\+xattrs\+sha512
      - a line matches ^\s*\/usr\/sbin\/auditd\s+p\+i\+n\+u\+g\+s\+b\+acl\+xattrs\+sha512
      - a line matches ^\s*\/usr\/sbin\/ausearch\s+p\+i\+n\+u\+g\+s\+b\+acl\+xattrs\+sha512
      - a line matches ^\s*\/usr\/sbin\/aureport\s+p\+i\+n\+u\+g\+s\+b\+acl\+xattrs\+sha512
      - a line matches ^\s*\/usr\/sbin\/augenrules\s+p\+i\+n\+u\+g\+s\+b\+acl\+xattrs\+sha512
  - id: "CIS-DEBIAN13-7.1.1-etc_passwd_perms-attrs"
    name: "/etc/passwd: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 7.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/passwd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-1a40203603 |
      /etc/passwd lists all accounts and must be readable by everyone, but only root may change it. Write access for other users would allow them to create accounts or change UIDs and shells and thereby gain root privileges.
    remediation: &rem-08cad6e3c2 |
      Create /etc/passwd if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/passwd'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/passwd'
  - id: "CIS-DEBIAN13-7.1.2-passwd-_perms-attrs"
    name: "/etc/passwd-: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 7.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/passwd-'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-b4ee6fc5d0 |
      /etc/passwd- is the backup copy of the account database written by tools like useradd and vipw. It holds the same information as /etc/passwd and could be used to restore a manipulated version, so it needs the same protection: owned by root:root and not writable by others.
    remediation: &rem-2fef363834 |
      Create /etc/passwd- if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/passwd-'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/passwd-'
  - id: "CIS-DEBIAN13-7.1.3-etcgroup_perms-attrs"
    name: "/etc/group: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 7.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/group'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-ec6ff4b79b |
      /etc/group defines group memberships, which control access to files and privileges such as sudo or container management. If unauthorised users can modify it, they can add themselves to privileged groups. The file must stay readable for name resolution but writable only by root.
    remediation: &rem-acc5fa1d09 |
      Create /etc/group if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/group'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/group'
  - id: "CIS-DEBIAN13-7.1.4-etcgroup-_perms-attrs"
    name: "/etc/group-: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 7.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/group-'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-da71ff1d3f |
      /etc/group- is the backup copy written by tools such as groupadd and usermod. It contains the same membership data as /etc/group and could be used to restore a manipulated version, so it needs the same protection: owned by root and not writable by others.
    remediation: &rem-5da3704e0d |
      Create /etc/group- if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/group-'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/group-'
  - id: "CIS-DEBIAN13-7.1.5-etc_shadow_perms-attrs"
    name: "/etc/shadow: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 7.1.5. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/shadow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-27546661c9 |
      /etc/shadow contains the password hashes of all accounts. If it is readable by unauthorised users, the hashes can be cracked offline; if it is writable, passwords can be replaced. It must be owned by root and allow no access to others.
    remediation: &rem-613c8e9718 |
      Create /etc/shadow if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/shadow'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/shadow'
  - id: "CIS-DEBIAN13-7.1.6-etc_shadow-_perms-attrs"
    name: "/etc/shadow-: exists, mode 0644 or stricter, owner root, group root"
