    remediation: &rem-a20bb0f587 |
      Remove the package ftp, unless the system needs it:

      apt-get purge ftp
  - id: "CIS-DEBIAN13-2.3.1.1-chrony"
    name: "Package chrony is installed"
    description: "CIS Debian 13 benchmark recommendation 2.3.1.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' chrony 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-a0cc2c0b8d |
      Accurate, synchronized time is required for log correlation, Kerberos, certificate validation and time-based one-time passwords. A system should run exactly one time synchronization client. Depending on the platform the check expects chrony to be installed or, where systemd-timesyncd is the chosen client, not installed, to avoid competing daemons.
    remediation: &rem-ffa89cc9a9 |
      Install the package chrony:

      apt-get install chrony
  - id: "CIS-DEBIAN13-2.3.1.1-timesync_masked-attrs"
    name: "/etc/systemd/system/systemd-timesyncd.service: exists, is a symbolic link, links to /dev/null"
    description: "CIS Debian 13 benchmark recommendation 2.3.1.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/system/systemd-timesyncd.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: &rat-be779f8e0d |
      Running more than one time synchronisation daemon makes them compete for control of the clock. When chrony is used, masking systemd-timesyncd ensures it cannot be started, leaving a single, consistently configured time source.
    remediation: &rem-7b7223e681 |
      Create /etc/systemd/system/systemd-timesyncd.service if it is missing, then point the link to /dev/null:

      ln -sfn '/dev/null' '/etc/systemd/system/systemd-timesyncd.service'
  - id: "CIS-DEBIAN13-2.3.3.1-chrony_pool-attrs"
    name: "/etc/chrony/sources.d/pool.sources: exists"
    description: "CIS Debian 13 benchmark recommendation 2.3.3.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/chrony/sources.d/pool.sources'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d38df71f24 |
      Accurate time is needed to correlate logs across systems and to validate certificates and Kerberos tickets. Configuring chrony with defined pool sources ensures the host synchronises its clock from known, reliable references.
    remediation: &rem-fb98ead760 |
      Create /etc/chrony/sources.d/pool.sources.
  - id: "CIS-DEBIAN13-2.3.3.1-chrony_pool-content"
    name: "/etc/chrony/sources.d/pool.sources has the expected content (1 rule)"
    description: "CIS Debian 13 benchmark recommendation 2.3.3.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/chrony/sources.d/pool.sources'
    allow_rc: any
    expect: { some: "~ ^pool time.nist.gov iburst maxsources 4" }
    rationale: *rat-d38df71f24
    remediation: &rem-d4b632314a |
      Edit /etc/chrony/sources.d/pool.sources so that its lines meet these conditions (regular expressions):

      - a line matches ^pool time.nist.gov iburst maxsources 4
  - id: "CIS-DEBIAN13-2.3.3.1-chrony_timeservers-attrs"
    name: "/etc/chrony/sources.d/server.sources: exists"
    description: "CIS Debian 13 benchmark recommendation 2.3.3.1. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
