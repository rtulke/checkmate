  - id: "CIS-DEBIAN13-1.5.3-ptrace_restricted_live"
    name: "Kernel parameter kernel.yama.ptrace_scope matches ^(1|2|3)$"
    description: "CIS Debian 13 benchmark recommendation 1.5.3. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.yama.ptrace_scope
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ ^(1|2|3)$"
    rationale: &rat-38b04622d0 |
      ptrace lets a process inspect and modify the memory of other processes of the same user, so malware in a user session can steal credentials or inject code into programs such as SSH agents or browsers. With kernel.yama.ptrace_scope set to 1 or higher, only a parent may trace its children, or tracing requires special privileges, which blocks this abuse while debugging remains possible under control.
    remediation: &rem-f63b93a9ff |
      Set the kernel parameter kernel.yama.ptrace_scope to one of 1, 2, 3 (the example uses 1), now and at boot:

      sysctl -w 'kernel.yama.ptrace_scope=1'
      printf '%s\n' 'kernel.yama.ptrace_scope = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.yama.ptrace_scope from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
