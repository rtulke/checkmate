      sysctl -n fs.suid_dumpable
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-8cf5d2b11a |
      Core dumps of setuid programs can contain privileged data such as password hashes or keys the program has read. With fs.suid_dumpable = 0, processes that changed their privileges do not produce core dumps, so this data cannot leak into files the invoking user can read.
    remediation: &rem-789aaadb7b |
      Set the kernel parameter fs.suid_dumpable to 0, now and at boot:

      sysctl -w 'fs.suid_dumpable=0'
