  - id: "CIS-DEBIAN13-6.2.3.5-auditd_set_cnf"
    name: "auditd set cnf: grep system-locale /etc/audit/rules.d/*.rules"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.5. NIST SP 800-53 Rev. 5: AU-3, CM-6."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep system-locale /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale" }
    rationale: &rat-1c6969a44a |
      Changing the host name or domain name can disguise a system on the network and break the correlation of logs, monitoring and certificates. Auditing the sethostname and setdomainname system calls records who changed the system's network identity and when.
    remediation: &rem-172709b84a |
      Add the following rules to a file in /etc/audit/rules.d/ and load them.

      printf '%s\n' '-a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale' '-a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale' > /etc/audit/rules.d/50-system_locale.rules
      augenrules --load
      auditctl -l | grep system-locale

      If the audit configuration is immutable (-e 2 in the rules), a reboot is needed before the new rules become active.
  - id: "CIS-DEBIAN13-6.2.3.5-auditd_set_live"
    name: "auditd set live: auditctl -l | grep system-locale"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.5. NIST SP 800-53 Rev. 5: AU-3, CM-6."
