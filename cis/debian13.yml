    expect: empty
    rationale: &rat-eb0dc407c8 |
      /etc/issue.net is shown before remote logins by some services. It should not reveal the operating system, version or architecture, which helps attackers plan, and where required it carries the warning that access is restricted to authorized users and monitored. On some platforms the check also verifies root ownership and mode 0644 or stricter.
    remediation: &rem-88e05c3381 |
