  - id: "CIS-DEBIAN13-5.3.2.1-pam_unix_enabled_common_auth-attrs"
    name: "/etc/pam.d/common-auth: exists"
    description: "CIS Debian 13 benchmark recommendation 5.3.2.1. NIST SP 800-53 Rev. 5: IA-5."
