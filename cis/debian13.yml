    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ ^(1|2)$"
    rationale: &rat-d6cca2b759 |
      Kernel pointer addresses exposed through /proc and other interfaces help attackers defeat kernel address space layout randomisation. kernel.kptr_restrict = 1 hides these addresses from unprivileged users, and 2 hides them from everyone, which makes kernel exploits harder to build.
    remediation: &rem-79384eff1e |
