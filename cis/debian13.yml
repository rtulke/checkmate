      - { none: "~ (?i)kernel.*" }
      - { none: "~ x86_64" }
      - { none: "~ (?i)linux.*" }
      - { some: "~ Authorized users only\\. All activity may be monitored and reported\\." }
    rationale: *rat-b1dea4cbb3
    remediation: &rem-6ab1d57ef3 |
      Edit /etc/issue so that its lines meet these conditions (regular expressions):

      - no line matches (?i)debian.*
      - no line matches (?i)ubuntu.*
      - no line matches (?i)kernel.*
      - no line matches x86_64
