      - { some: "~ [^#]-a always,exit -F arch=b64 -S chmod,fchmod,fchmodat,fchmodat2 -F auid\u003e=1000 -F auid!=(unset|-1|auid!=4294967295) -k perm_mod" }
    rationale: &rat-0462112b7a |
      chmod, fchmod, fchmodat and fchmodat2 change file permission bits. Auditing these calls when made by regular user sessions records attempts to make files world-writable, add setuid bits or expose protected data. This variant inspects the persistent rule files in /etc/audit/rules.d, which are loaded at boot.
    remediation: &rem-4638bc8f00 |
      Add the following audit rule to a file in /etc/audit/rules.d/ and load the rules:

      printf '%s\n' '-a always,exit -F arch=b64 -S chmod,fchmod,fchmodat,fchmodat2 -F auid>=1000 -F auid!=unset -k perm_mod' >> /etc/audit/rules.d/50-perm_mod.rules
      augenrules --load

      If the loaded audit configuration is immutable (-e 2), the new rules only become active after a reboot. On 64-bit systems that also run 32-bit programs, add the same rules with -F arch=b32.
