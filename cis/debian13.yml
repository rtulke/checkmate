    rationale: *rat-6c400a9459
    remediation: &rem-85a3e77c40 |
      Edit /etc/default/apport so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*enabled\s*=\s*0\b
  - id: "CIS-DEBIAN13-1.5.8-kptr_restrict_live"
    name: "Kernel parameter kernel.kptr_restrict matches ^(1|2)$"
    description: "CIS Debian 13 benchmark recommendation 1.5.8. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
