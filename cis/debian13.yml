  - id: "CIS-DEBIAN13-5.3.3.1.3-faillock_even_root-attrs"
    name: "/etc/security/faillock.conf: exists"
    description: "CIS Debian 13 benchmark recommendation 5.3.3.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
