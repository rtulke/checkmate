  - id: "CIS-DEBIAN13-1.5.9-address_space_live"
    name: "Kernel parameter kernel.randomize_va_space is 2"
    description: "CIS Debian 13 benchmark recommendation 1.5.9. NIST SP 800-53 Rev. 5: SI-16."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.randomize_va_space
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 2"
    rationale: &rat-b24a80f84d |
      Address space layout randomisation places the stack, heap, shared libraries and other mappings at unpredictable addresses, which makes memory corruption exploits much harder to carry out reliably. kernel.randomize_va_space = 2 enables full randomisation including the heap.
    remediation: &rem-a6e5efe9f8 |
      Set the kernel parameter kernel.randomize_va_space to 2, now and at boot:

      sysctl -w 'kernel.randomize_va_space=2'
      printf '%s\n' 'kernel.randomize_va_space = 2' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.randomize_va_space from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
