  - id: "CIS-DEBIAN13-5.3.2.2-pam_faillock_enabled_common_auth-attrs"
    name: "/etc/pam.d/common-auth: exists"
    description: "CIS Debian 13 benchmark recommendation 5.3.2.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/common-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-31ef8ec829 |
      pam_faillock counts failed authentication attempts and locks the account after the configured number of failures. It needs a preauth entry before pam_unix, which denies access to accounts that are already locked, and an authfail entry after it, which records the failure. Both entries in common-auth are required for lockout to protect against brute-force attacks.
    remediation: *rem-a058bc1876
  - id: "CIS-DEBIAN13-5.3.2.2-pam_faillock_enabled_common_auth-content"
