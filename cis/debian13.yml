    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep usb-storage /etc/modprobe.d/*.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^([^:]+:)?\\s*blacklist\\s+usb-storage\\b" }
    rationale: &rat-4429dbd642 |
      USB mass-storage support allows anyone with physical access to attach drives, copy data off the system or introduce malware. Blocking the driver closes this channel; systems that legitimately need USB storage should be handled as a documented exception.
    remediation: &rem-197244d7a9 |
      Block the usb-storage module in a modprobe configuration file and unload it.

      printf '%s\n' 'blacklist usb-storage' 'install usb-storage /bin/false' > /etc/modprobe.d/usb-storage.conf
      modprobe -r uas usb-storage

      USB drives can no longer be used on this system.
  - id: "CIS-DEBIAN13-1.1.1.10-usb-storage"
    name: "usb storage: modprobe -n -v usb-storage | grep -E '(usb-storage|install)'"
    description: "CIS Debian 13 benchmark recommendation 1.1.1.10."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v usb-storage | grep -E '(usb-storage|install)'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /(usr/)?bin/(true|false)" }
    rationale: &rat-3d7871778f |
      USB mass storage support allows data to be copied off the system or malicious content to be introduced by anyone with physical access, and it exposes kernel driver code to crafted devices. Mapping usb-storage to /bin/false makes all load attempts fail, so USB drives cannot be mounted. Keep it enabled only where USB storage is an approved part of operations.
    remediation: &rem-977ef3e2a6 |
      Make every attempt to load usb-storage run /bin/false instead, blacklist it, and unload it if it is currently loaded.

      printf '%s\n' 'install usb-storage /bin/false' 'blacklist usb-storage' > /etc/modprobe.d/usb-storage.conf
      modprobe -r usb-storage

      Use /bin/false rather than /usr/bin/false: the SUSE checks only accept that path. If the module is in use, unmount the file system first or reboot.
  - id: "CIS-DEBIAN13-1.1.1.11-unused_filesystems"
    name: "unused filesystems: modprobe -n -v"
    description: "CIS Debian 13 benchmark recommendation 1.1.1.11. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ (afs|ceph|cifs|exfat|ext|fat|fscache|fuse|gfs2|nfs_common|nfsd|smbfs_common)" }
    rationale: &rat-c94edfe198 |
      Every file system driver that can be loaded adds kernel code reachable by mounting crafted media or images, and several rarely used drivers have had serious vulnerabilities. Disabling drivers for file systems the host never uses reduces the kernel attack surface without affecting operation.
    remediation: &rem-f054029a3c |
      Identify file system modules that are loaded or available but not needed, and disable each of them.

      lsmod
      findmnt -n -o FSTYPE | sort -u
      printf '%s\n' 'blacklist MODULE' 'install MODULE /bin/false' > /etc/modprobe.d/MODULE.conf
      modprobe -r MODULE

      Never disable drivers for file systems in use, such as ext4, vfat for the EFI partition, or nfs and cifs for network mounts.
  - id: "CIS-DEBIAN13-1.1.2.1.1-tmp_mount"
    name: "/tmp is a separate mount"
    description: "CIS Debian 13 benchmark recommendation 1.1.2.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/tmp'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: &rat-701a51792c |
      /tmp is world-writable and used by every user and many services. A separate file system (or a tmpfs) keeps users from filling the root file system through /tmp and allows restrictive mount options such as nodev, nosuid and noexec to be applied to it alone.
    remediation: &rem-fbf7b93a5e |
      Put /tmp on a separate file system (partition or logical volume) and mount it there with an entry in /etc/fstab or a systemd mount unit. This needs a new file system and moving the existing data. A tmpfs mount on /tmp, e.g. with systemd's tmp.mount, counts as well.
  - id: "CIS-DEBIAN13-1.1.2.1.2-tmp_nodev_options"
    name: "/tmp is a separate mount with nodev"
    description: "CIS Debian 13 benchmark recommendation 1.1.2.1.2. NIST SP 800-53 Rev. 5: CM-7, AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/tmp'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nodev(,|$)"
    rationale: &rat-c7d3bae4ce |
      /tmp is world-writable and used by every user and service for temporary files. With nodev the kernel ignores character and block device files on it, so a device node created there cannot be used to access disks, memory or other hardware directly; legitimate device files live only under /dev. This check verifies the option on the currently mounted file system.
    remediation: &rem-1c21763bee |
      Mount /tmp with the option nodev: add it to the options of /tmp in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/tmp'

      If /tmp is not a separate file system yet, create one first.
