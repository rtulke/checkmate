      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-c2b2455ea5 |
      The pam_unix entry in common-password writes new local passwords and determines the hashing algorithm used to store them. Without it password changes are not stored correctly and hashes may not meet policy.
    remediation: &rem-24dae7c4b7 |
