    name: "consecutive characters not pamd: grep -Psi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwquality\\.so\\h+([^#\\n…"
    description: "CIS Debian 13 benchmark recommendation 5.3.3.2.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
