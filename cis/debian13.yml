      cat /sys/module/ipv6/parameters/disable
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0" }
      - { none: "~ ^1" }
    rationale: &rat-01427bf9e8 |
      IPv6 status should be a deliberate decision. This check expects IPv6 to be enabled in the kernel, so that the IPv6-specific hardening settings and firewall rules apply, and flags systems where it was switched off with the ipv6.disable boot parameter. If the organization has decided not to use IPv6, the check can be waived.
    remediation: &rem-9026303c93 |
      Remove ipv6.disable=1 from the kernel command line in /etc/default/grub, regenerate the GRUB configuration and reboot.

      sed -ri 's/\s*ipv6\.disable=1//g' /etc/default/grub
      update-grub

      A reboot is required. IPv6 then needs to be covered by the firewall and the IPv6 sysctl settings.
  - id: "CIS-DEBIAN13-3.1.1-sysctl_ipv6_disable"
    name: "sysctl ipv6 disable: grep disable_ipv6 /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS Debian 13 benchmark recommendation 3.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep disable_ipv6 /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*: net.ipv6.conf.all.disable_ipv6 = 1" }
      - { none: "~ .*: net.ipv6.conf.default.disable_ipv6 = 1" }
    rationale: &rat-a2ed2b8d00 |
      IPv6 status should be a deliberate decision. This check expects IPv6 to remain enabled and flags sysctl settings that disable it on all or new interfaces, which can break software that expects IPv6 and leaves the stack in a partly configured state. If the organization has decided not to use IPv6, the check can be waived.
    remediation: &rem-8872c883ff |
      Remove the lines that set net.ipv6.conf.all.disable_ipv6 or net.ipv6.conf.default.disable_ipv6 to 1 from /etc/sysctl.conf and /etc/sysctl.d/, then enable IPv6 again.

      grep -r disable_ipv6 /etc/sysctl.conf /etc/sysctl.d/
      sed -i '/disable_ipv6\s*=\s*1/d' FILE
      sysctl -w net.ipv6.conf.all.disable_ipv6=0
      sysctl -w net.ipv6.conf.default.disable_ipv6=0
  - id: "CIS-DEBIAN13-3.1.2-wireless_disabled"
    name: "wireless disabled: find /sys/class/net/*/wireless -type d 2\u003e/dev/null | sed 's|/wireless$||' | while read if…"
    description: "CIS Debian 13 benchmark recommendation 3.1.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      find /sys/class/net/*/wireless -type d 2>/dev/null | sed 's|/wireless$||' | while read iface; do cat "$iface/operstate" 2>/dev/null; done | grep -qv '^down$' && echo FAIL || echo OK
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^OK" }
      - { none: "~ ^FAIL" }
    rationale: &rat-0d79aa42e1 |
      Wireless interfaces open a network path that bypasses wired network controls such as firewalls and segmentation, and they expose the system to attackers within radio range. Servers rarely need them; turning off the radios or blocking their drivers removes this exposure.
    remediation: &rem-aa6b351acd |
      Block the driver module of every wireless interface so that no wireless interface comes up. Find each interface's driver, block it and unload it:

      basename "$(readlink -f /sys/class/net/IFACE/device/driver/module)"
      printf 'blacklist %s\ninstall %s /bin/false\n' MODULE MODULE >> /etc/modprobe.d/blacklist-wireless.conf
      modprobe -r MODULE

      On Ubuntu 20.04 every module under drivers/net/wireless must be named in /etc/modprobe.d/blacklist-wireless.conf:
      find /lib/modules/$(uname -r)/kernel/drivers/net/wireless -name '*.ko' -printf '%f\n' | sed 's/\.ko$//' | sort -u | while read -r m; do printf 'blacklist %s\ninstall %s /bin/false\n' "$m" "$m"; done >> /etc/modprobe.d/blacklist-wireless.conf

      On Ubuntu 18.04 the check reads NetworkManager instead:
      nmcli radio all off
  - id: "CIS-DEBIAN13-3.1.3-bluetooth_pkg"
    name: "Package bluez is not installed"
    description: "CIS Debian 13 benchmark recommendation 3.1.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' bluez 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-26028fd092 |
      Bluetooth gives devices in radio range a way to connect to the system and has a history of remotely exploitable vulnerabilities. Servers rarely need it, so removing the BlueZ stack removes this wireless attack surface.
    remediation: &rem-60d4918f38 |
      Remove the package bluez, unless the system needs it:

      apt-get purge bluez
  - id: "CIS-DEBIAN13-3.2.1-lsmod_atm"
    name: "lsmod atm: lsmod | grep -i atm"
    description: "CIS Debian 13 benchmark recommendation 3.2.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i atm
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-09db9f0366 |
      ATM (Asynchronous Transfer Mode) networking is obsolete on virtually all systems, yet its protocol module can be loaded on demand when a program opens an ATM socket, exposing rarely maintained kernel code to attackers. Preventing the module from loading removes this unnecessary attack surface.
    remediation: &rem-dfc0094ba7 |
      Prevent the atm module from being loaded and unload it if it is currently loaded.

      printf '%s\n' 'blacklist atm' 'install atm /bin/false' > /etc/modprobe.d/atm.conf
      modprobe -r atm

      lsmod | grep -i atm matches any module name containing "atm"; review the output before unloading anything else.
  - id: "CIS-DEBIAN13-3.2.1-modprobe_atm"
