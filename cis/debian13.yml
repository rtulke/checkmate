      - no line matches (?i)^PermitEmptyPasswords yes
  - id: "CIS-DEBIAN13-5.1.21-ssh_permit_root-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Debian 13 benchmark recommendation 5.1.21. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-47fd7571af |
      Direct root logins over SSH expose the most powerful account to password guessing and leave no record of which administrator acted. Requiring personal accounts with escalation through sudo or su adds accountability and an extra barrier. Automation that needs root can use dedicated accounts with restricted sudo rules.
    remediation: *rem-f6392187bb
  - id: "CIS-DEBIAN13-5.1.21-ssh_permit_root-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Debian 13 benchmark recommendation 5.1.21. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
