  - id: "CIS-DEBIAN13-5.1.22-ssh_userenv-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Debian 13 benchmark recommendation 5.1.22. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-a46f1c4dfd |
      PermitUserEnvironment lets users pass environment variables through ~/.ssh/environment or authorized_keys options. Variables such as LD_PRELOAD or PATH can bypass restrictions like forced commands or restricted shells and run attacker-chosen code. Disabling it keeps the session environment under administrative control.
    remediation: *rem-f6392187bb
  - id: "CIS-DEBIAN13-5.1.22-ssh_userenv-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Debian 13 benchmark recommendation 5.1.22. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
