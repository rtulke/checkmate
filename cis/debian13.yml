  - id: "CIS-DEBIAN13-1.5.5-dmesg_restrict_live"
    name: "Kernel parameter kernel.dmesg_restrict is 1"
    description: "CIS Debian 13 benchmark recommendation 1.5.5. NIST SP 800-53 Rev. 5: SC-2, SC-4."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
