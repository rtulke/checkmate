  - id: "CIS-DEBIAN13-2.4.1.9-cron_allow_users-attrs"
    name: "/etc/cron.allow: exists, mode 0640 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 2.4.1.9. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/cron.allow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7137)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-4f0207cb70 |
      /etc/cron.allow defines the only users allowed to create cron jobs, which is safer than listing forbidden users because new accounts are denied by default. The file itself must be owned by root and not writable by others, otherwise a user could add themselves and schedule persistent jobs.
    remediation: &rem-3746395589 |
      Create /etc/cron.allow if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-rwx,a-t:

      chown root:root '/etc/cron.allow'
      chmod u-xs,g-wxs,o-rwx,a-t '/etc/cron.allow'
  - id: "CIS-DEBIAN13-2.4.1.9-cron_deny_users-absent"
    name: "/etc/cron.deny does not exist"
    description: "CIS Debian 13 benchmark recommendation 2.4.1.9. NIST SP 800-53 Rev. 5: AC-3, MP-2."
