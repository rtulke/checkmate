    run: |
      dpkg-query -W -f='${Status}' libpam-modules 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-2de35c7416 |
      libpam-modules supplies the standard PAM modules such as pam_unix, pam_faillock and pam_pwhistory, which implement password verification, account lockout and password history. Many authentication hardening controls depend on these modules being installed.
    remediation: &rem-907ab60500 |
      Install the package libpam-modules:

      apt-get install libpam-modules
  - id: "CIS-DEBIAN13-5.3.1.3-libpam-pwquality"
    name: "Package libpam-pwquality is installed"
    description: "CIS Debian 13 benchmark recommendation 5.3.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' libpam-pwquality 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-6bfcd4d189 |
      The pam_pwquality module rejects weak passwords when they are set, checking length, character classes, dictionary words and similarity to the previous password. Installing it is a prerequisite for enforcing password complexity rules on Debian-based systems.
    remediation: &rem-ff91ae64a0 |
      Install the package libpam-pwquality:

      apt-get install libpam-pwquality
  - id: "CIS-DEBIAN13-5.3.2.1-pam_unix_enabled_common_act-attrs"
    name: "/etc/pam.d/common-account: exists"
    description: "CIS Debian 13 benchmark recommendation 5.3.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
