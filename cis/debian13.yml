  - id: "CIS-DEBIAN13-5.1.12-sshd_KEX"
    name: "sshd KEX: sshd -T | grep -Pi -- 'kexalgorithms\\h+([^#\\n\\r]+,)?(diffie-hellman-group1-sha1|diffie-he…"
    description: "CIS Debian 13 benchmark recommendation 5.1.12. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -Pi -- 'kexalgorithms\h+([^#\n\r]+,)?(diffie-hellman-group1-sha1|diffie-hellman-group14-sha1|diffie-hellman-group-exchange-sha1)\b'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-4e0cce0b15 |
      The key exchange establishes the keys that protect the whole SSH session. Methods based on SHA-1 or the 1024-bit group 1 are considered too weak and could let a well-resourced attacker break or downgrade session security. Restricting key exchange to elliptic-curve and large-group SHA-2 methods keeps connections confidential; very old clients that only support legacy methods will no longer connect.
    remediation: &rem-f34b782887 |
      Remove the SHA-1 based Diffie-Hellman methods and delete other KexAlgorithms lines so the new value is the first one sshd reads. On Debian 11 to 13 and Ubuntu 22.04 and later:

      echo 'KexAlgorithms -diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1' > /etc/ssh/sshd_config.d/01-kex.conf

      On Ubuntu 20.04 the check expects an explicit list instead:

      echo 'KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group14-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256' > /etc/ssh/sshd_config.d/01-kex.conf

      Then run sshd -t && systemctl reload ssh and verify with sshd -T | grep -i kexalgorithms.
  - id: "CIS-DEBIAN13-5.1.13-ssh_post-quantum_algo"
    name: "ssh post quantum algo: ssh -Q kex"
    description: "CIS Debian 13 benchmark recommendation 5.1.13. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      ssh -Q kex
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ sntrup761x25519-sha512@openssh.com" }
      - { some: "~ mlkem768x25519-sha256" }
    rationale: &rat-29fd8860f0 |
      Encrypted traffic recorded today could be decrypted later once quantum computers can break classical key exchange. Hybrid key exchange methods such as mlkem768x25519-sha256 and sntrup761x25519-sha512 combine a classical algorithm with a quantum-resistant one and protect SSH sessions against this harvest-now, decrypt-later threat. They require a recent OpenSSH release.
    remediation: &rem-f836219ad4 |
      Install an OpenSSH release that supports both hybrid methods (OpenSSH 9.9 or later; Debian 13 ships OpenSSH 10) and keep them enabled.

      apt-get update
      apt-get install --only-upgrade openssh-client openssh-server
      ssh -Q kex | grep -E 'sntrup761x25519-sha512@openssh.com|mlkem768x25519-sha256'

      Do not remove these methods with a KexAlgorithms setting.
  - id: "CIS-DEBIAN13-5.1.14-ssh_logingrace-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Debian 13 benchmark recommendation 5.1.14. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-a9975bf989 |
      LoginGraceTime limits how long an unauthenticated connection may stay open. A long grace period lets attackers hold many pending connections, exhausting the startup slots and locking out legitimate users, and gives more time for each guessing attempt. One minute or less is ample for real logins.
    remediation: *rem-f6392187bb
  - id: "CIS-DEBIAN13-5.1.14-ssh_logingrace-content"
    name: "/etc/ssh/sshd_config has the expected content (1 rule)"
    description: "CIS Debian 13 benchmark recommendation 5.1.14. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
