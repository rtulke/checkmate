    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-2ac97141fe |
      Source-routed IPv6 packets carry a path chosen by the sender. Accepting them would let an attacker steer traffic through specific routes, possibly bypassing firewalls or reaching otherwise unreachable addresses. Hosts have no legitimate need for source routing. The 'default' setting applies to interfaces created later.
    remediation: &rem-6daa45f7d9 |
      Set the kernel parameter net.ipv6.conf.default.accept_source_route to 0, now and at boot:

      sysctl -w 'net.ipv6.conf.default.accept_source_route=0'
      printf '%s\n' 'net.ipv6.conf.default.accept_source_route = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv6.conf.default.accept_source_route from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-DEBIAN13-3.3.2.6-ipv6_default_source_routed"
    name: "ipv6 default source routed: grep net.ipv6.conf.default.accept_source_route /etc/sysctl.conf /etc/sysctl.d/*.conf /run…"
    description: "CIS Debian 13 benchmark recommendation 3.3.2.6. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep net.ipv6.conf.default.accept_source_route /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:net.ipv6.conf.default.accept_source_route\\s*=\\s*0" }
      - { none: "~ .*:net.ipv6.conf.default.accept_source_route\\s*=\\s*1" }
    rationale: &rat-bcd8204ee2 |
      Source-routed IPv6 packets let the sender dictate the path a packet takes through the network. Accepting them can allow an attacker to reach systems that would otherwise not be routable or to bypass network controls. Normal hosts never need to accept source-routed packets. The default setting applies to interfaces that are created later.
    remediation: &rem-d2ecca73e7 |
      Set net.ipv6.conf.default.accept_source_route to 0 in a sysctl drop-in file and apply it. Remove or correct any other line that sets a different value.

      printf '%s\n' 'net.ipv6.conf.default.accept_source_route = 0' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w net.ipv6.conf.default.accept_source_route=0
      sysctl -w net.ipv6.route.flush=1

      The check reads /etc/sysctl.conf and /etc/sysctl.d/ and on most platforms also /run/sysctl.d/, /usr/local/lib/sysctl.d/, /usr/lib/sysctl.d/ and /lib/sysctl.d/; a line with the opposite value in any of these files makes it fail.
  - id: "CIS-DEBIAN13-3.3.2.7-net.ipv6.conf.all.accept_ra"
    name: "Kernel parameter net.ipv6.conf.all.accept_ra is 0"
    description: "CIS Debian 13 benchmark recommendation 3.3.2.7. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv6.conf.all.accept_ra
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-168115a4b0 |
      IPv6 router advertisements let any device on the local link announce itself as a router and push prefixes and routes. Accepting them allows an attacker on the same network to redirect traffic through their system or disrupt connectivity. Systems with statically configured addressing should ignore router advertisements on all interfaces.
    remediation: &rem-c665311030 |
      Set the kernel parameter net.ipv6.conf.all.accept_ra to 0, now and at boot:

      sysctl -w 'net.ipv6.conf.all.accept_ra=0'
      printf '%s\n' 'net.ipv6.conf.all.accept_ra = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv6.conf.all.accept_ra from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-DEBIAN13-3.3.2.7-ipv6_all_accept_ra_live"
    name: "ipv6 all accept ra live: grep net.ipv6.conf.all.accept_ra /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.co…"
    description: "CIS Debian 13 benchmark recommendation 3.3.2.7. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep net.ipv6.conf.all.accept_ra /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ .*:net.ipv6.conf.all.accept_ra\\s*=\\s*0" }
      - { none: "~ .*:net.ipv6.conf.all.accept_ra\\s*=\\s*1" }
    rationale: &rat-94b489c3cd |
      IPv6 router advertisements configure addresses and default routes automatically, and any device on the local link can send forged ones to redirect traffic through itself or disrupt connectivity. Setting accept_ra to 0 makes the host ignore them; systems that rely on SLAAC or advertised routes need a static configuration instead.
    remediation: &rem-422c92b1b4 |
      Set the parameter to 0 in a file under /etc/sysctl.d/ and apply it. The check reads every sysctl location (/etc/sysctl.conf, /etc/sysctl.d, /run/sysctl.d, /usr/local/lib/sysctl.d, /usr/lib/sysctl.d, /lib/sysctl.d), so also remove or change any file there that sets it to 1.

      printf '%s\n' 'net.ipv6.conf.all.accept_ra = 0' > /etc/sysctl.d/60-net_ipv6_conf_all_accept_ra.conf
      sysctl -w net.ipv6.conf.all.accept_ra=0
      grep -rs 'net.ipv6.conf.all.accept_ra' /etc/sysctl.conf /etc/sysctl.d /run/sysctl.d /usr/local/lib/sysctl.d /usr/lib/sysctl.d /lib/sysctl.d
  - id: "CIS-DEBIAN13-3.3.2.8-net.ipv6.conf.default.accept_ra"
    name: "Kernel parameter net.ipv6.conf.default.accept_ra is 0"
    description: "CIS Debian 13 benchmark recommendation 3.3.2.8. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv6.conf.default.accept_ra
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-75e2235880 |
      The default accept_ra value applies to interfaces created after boot, such as VLANs, bridges or hot-plugged devices. If it is left enabled, new interfaces would accept rogue router advertisements that can redirect or disrupt traffic. Setting the default to 0 keeps new interfaces consistent with the hardened ones.
    remediation: &rem-10570df6c2 |
      Set the kernel parameter net.ipv6.conf.default.accept_ra to 0, now and at boot:

      sysctl -w 'net.ipv6.conf.default.accept_ra=0'
      printf '%s\n' 'net.ipv6.conf.default.accept_ra = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv6.conf.default.accept_ra from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-DEBIAN13-3.3.2.8-ipv6_default_accept_ra_live"
    name: "ipv6 default accept ra live: grep net.ipv6.conf.default.accept_ra /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/…"
    description: "CIS Debian 13 benchmark recommendation 3.3.2.8. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
