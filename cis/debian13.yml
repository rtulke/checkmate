  - id: "CIS-DEBIAN13-2.2.6-ftp_client"
    name: "Package ftp is not installed"
    description: "CIS Debian 13 benchmark recommendation 2.2.6. NIST SP 800-53 Rev. 5: CM-7, CM-11."
