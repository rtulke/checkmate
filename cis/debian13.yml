  - id: "CIS-DEBIAN13-2.1.22-mta_listening_port25"
    name: "mta listening port25: ss -lntu | grep -E \":25\\s\" | grep -E -v \"\\s(127.0.0.1|\\[?::1\\]?):25\\s\""
    description: "CIS Debian 13 benchmark recommendation 2.1.22. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      ss -lntu | grep -E ":25\s" | grep -E -v "\s(127.0.0.1|\[?::1\]?):25\s"
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-a12179a4ee |
      A mail transfer agent listening on external interfaces can be abused as a relay, attracts spam and exposes the MTA software to remote attacks. Most hosts only need to send local mail, which works with the MTA bound to the loopback interface. Only dedicated mail servers should accept SMTP connections from the network.
    remediation: &rem-130889d279 |
      Restrict the MTA to the loopback interface, or remove it if no local mail delivery is needed. For Postfix:

      postconf -e 'inet_interfaces = loopback-only'
      systemctl restart postfix
      ss -lntu | grep -E ':25\s'

      For Exim on Debian, set dc_local_interfaces='127.0.0.1 ; ::1' in /etc/exim4/update-exim4.conf.conf, then run update-exim4.conf and systemctl restart exim4.
  - id: "CIS-DEBIAN13-2.1.22-mta_postfix_inet_interfaces"
    name: "mta postfix inet interfaces: if [ -f /etc/postfix/main.cf ]; then grep -E '^\\s*inet_interfaces' /etc/postfix/main.cf |…"
    description: "CIS Debian 13 benchmark recommendation 2.1.22. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      if [ -f /etc/postfix/main.cf ]; then grep -E '^\s*inet_interfaces' /etc/postfix/main.cf || echo 'inet_interfaces not set'; else echo 'postfix not installed'; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(postfix not installed|\\s*inet_interfaces\\s*=\\s*loopback-only\\s*)$" }
    rationale: &rat-b7106c7b49 |
      Postfix's inet_interfaces setting decides on which addresses it accepts SMTP connections. Limiting it to the loopback interface lets the host send local mail while preventing others from using it as a relay or attacking the MTA over the network. Only dedicated mail servers need to listen on external interfaces.
    remediation: &rem-1ae830bdfe |
      Restrict Postfix to the loopback interface and restart it (a reload is not enough for this setting).

      postconf -e 'inet_interfaces = loopback-only'
      systemctl restart postfix
      postconf -h inet_interfaces

      The Debian 13 check accepts only the value loopback-only; Ubuntu 24.04 also accepts localhost, 127.0.0.1 or ::1.
  - id: "CIS-DEBIAN13-2.2.1-nis_client"
    name: "Package nis is not installed"
    description: "CIS Debian 13 benchmark recommendation 2.2.1. NIST SP 800-53 Rev. 5: CM-11."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
