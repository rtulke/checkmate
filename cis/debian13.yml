    rationale: &rat-d174e36dc2 |
      The pam_unix entry in common-auth verifies local users' passwords against /etc/shadow. If it is missing or altered, local authentication may fail entirely or be decided by other modules in an unintended way. Keeping the standard entry ensures passwords are actually verified.
    remediation: &rem-a058bc1876 |
