  - id: "CIS-DEBIAN13-6.2.3.21-auditd_mounts_cnf"
    name: "auditd mounts cnf: grep mounts /etc/audit/rules.d/*.rules"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.21. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep mounts /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S mount -F auid\u003e=1000 -F auid!=(unset|4294967295|-1) -k mounts" }
    rationale: &rat-a77caf1995 |
      Mounting file systems can be used to bring in unauthorised software or to copy data to removable media. Auditing mount calls by regular users makes such activity visible. This check verifies that the rules are part of the persistent audit configuration.
    remediation: &rem-cc8ef91227 |
      Record mount operations by users: add the rules for your release to /etc/audit/rules.d/50-mounts.rules and load them.

      Debian 11, Debian 12, Ubuntu 20.04, Ubuntu 22.04 and Ubuntu 24.04:
      -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -k mounts
      -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=unset -k mounts

      Debian 13:
      -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -k mounts

      Ubuntu 18.04:
      -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=4294967295 -k mounts
      -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=4294967295 -k mounts

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
