    run: |
      auditctl -l | grep delete
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S delete_module -F auid\u003e=1000 -F auid!=(unset|-1|auid!=4294967295) -F key=kernel_modules" }
    rationale: &rat-7c5b2ab05e |
      delete_module unloads kernel modules, which can be used to remove security modules or to cover up a previously loaded malicious module. Auditing it for user sessions records who unloaded modules. This variant inspects the rules currently loaded in the kernel, so it also catches rule files that were never loaded.
    remediation: &rem-7d56c9f6cb |
      Add the following audit rule to a file in /etc/audit/rules.d/ so it persists, then load the rules into the kernel:

      printf '%s\n' '-a always,exit -F arch=b64 -S delete_module -F auid>=1000 -F auid!=unset -k kernel_modules' >> /etc/audit/rules.d/50-kernel_modules.rules
      augenrules --load
      auditctl -l

      If the loaded audit configuration is immutable (-e 2), the new rules only become active after a reboot. On 64-bit systems that also run 32-bit programs, add the same rules with -F arch=b32.
  - id: "CIS-DEBIAN13-6.2.3.34-auditd_query_cnf"
    name: "auditd query cnf: grep query /etc/audit/rules.d/*.rules"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.34. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep query /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S create_module,query_module -F auid\u003e=1000 -F auid!=(unset|-1|auid!=4294967295) -k kernel_modules" }
    rationale: &rat-58d3ce044f |
      create_module and query_module are historic module management calls. Auditing them for user sessions makes sure any attempt to use them, for example by old exploit code probing the kernel, is recorded alongside the other module operations. This variant inspects the persistent rule files in /etc/audit/rules.d, which are loaded at boot.
    remediation: &rem-5f8dd8853e |
      Add the following audit rule to a file in /etc/audit/rules.d/ and load the rules:

      printf '%s\n' '-a always,exit -F arch=b64 -S create_module,query_module -F auid>=1000 -F auid!=unset -k kernel_modules' >> /etc/audit/rules.d/50-kernel_modules.rules
      augenrules --load

      If the loaded audit configuration is immutable (-e 2), the new rules only become active after a reboot. On 64-bit systems that also run 32-bit programs, add the same rules with -F arch=b32.
  - id: "CIS-DEBIAN13-6.2.3.34-auditd_query_module_live"
    name: "auditd query module live: auditctl -l | grep query"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.34. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      auditctl -l | grep query
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S create_module,query_module -F auid\u003e=1000 -F auid!=(unset|-1|auid!=4294967295)" }
    rationale: &rat-d989afb14f |
      create_module and query_module are historic module management calls. Auditing them for user sessions makes sure any attempt to use them, for example by old exploit code probing the kernel, is recorded alongside the other module operations. This variant inspects the rules currently loaded in the kernel, so it also catches rule files that were never loaded.
    remediation: &rem-fd504b74a3 |
      Add the following audit rule to a file in /etc/audit/rules.d/ so it persists, then load the rules into the kernel:

      printf '%s\n' '-a always,exit -F arch=b64 -S create_module,query_module -F auid>=1000 -F auid!=unset -k kernel_modules' >> /etc/audit/rules.d/50-kernel_modules.rules
      augenrules --load
      auditctl -l

      If the loaded audit configuration is immutable (-e 2), the new rules only become active after a reboot. On 64-bit systems that also run 32-bit programs, add the same rules with -F arch=b32.
  - id: "CIS-DEBIAN13-6.2.3.35-auditd_ignore_errors"
    name: "auditd ignore errors: grep -w '\\-c' /etc/audit/rules.d/*.rules"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.35. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -w '\-c' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -c" }
    rationale: &rat-6b3456f916 |
      By default auditctl stops loading rules at the first rule that fails, for example because a path or syscall does not exist on this system. The -c option makes it continue and load all remaining valid rules, so one bad line does not silently leave most of the audit policy inactive.
    remediation: &rem-0e99cd336f |
      Add the -c option to the audit rules, ideally in a file that sorts before the other rule files, and reload:

      printf '%s\n' '-c' > /etc/audit/rules.d/01-continue.rules
      augenrules --load

      auditctl -c still reports a non-zero result when a rule fails, so check the auditd/augenrules output for errors.
  - id: "CIS-DEBIAN13-6.2.3.36-auditd_immutable"
    name: "auditd immutable: grep \"-e 2\" /etc/audit/rules.d/*.rules | tail -1"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.36. NIST SP 800-53 Rev. 5: AU-9."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep "-e 2" /etc/audit/rules.d/*.rules | tail -1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -e 2" }
    rationale: &rat-3a8280a222 |
      With -e 2 as the last audit rule, the audit configuration becomes immutable until the next reboot. An attacker who gains root can then not silently remove or change audit rules to hide their actions; any change requires a reboot, which is itself noticeable.
    remediation: &rem-b5fe509082 |
      Make the audit configuration immutable by adding -e 2 as the last rule, in a file that sorts after all other rule files, and load the rules.

      echo '-e 2' > /etc/audit/rules.d/99-finalize.rules
      augenrules --load

      After loading, audit rules cannot be changed until the next reboot, so complete the rule set first. If -e 2 is already active, the change takes effect after a reboot.
  - id: "CIS-DEBIAN13-6.2.3.37-auditd_conf_vs_live"
    name: "auditd conf vs live: /usr/sbin/augenrules --check"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.37. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      /usr/sbin/augenrules --check
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\/usr\\/sbin\\/augenrules: No change" }
    rationale: &rat-28c9d94c0a |
      augenrules builds /etc/audit/audit.rules from the files in /etc/audit/rules.d. If the two differ, the rules loaded at the next boot are not those that administrators maintain, and recent changes may never take effect. The check confirms that the compiled rule file is up to date.
    remediation: &rem-c7c4a84bd5 |
      Regenerate /etc/audit/audit.rules from the files in /etc/audit/rules.d and load it.

      augenrules --check
      augenrules --load

      If the running configuration is immutable (-e 2), the compiled file is still updated, but the kernel uses the new rules only after a reboot.
  - id: "CIS-DEBIAN13-6.2.4.1-audit_logfile_perms"
    name: "audit logfile perms: for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc \"%…"
    description: "CIS Debian 13 benchmark recommendation 6.2.4.1. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc "%n_%a" $file; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_6(0|4)0$" }
    rationale: &rat-3e567f4da4 |
      Audit logs record security-relevant activity and may contain sensitive information. Limiting their mode to 0640 or stricter prevents unauthorised users from reading them and anyone except root from modifying them.
    remediation: &rem-45a094787e |
      Restrict the audit log files to mode 0640 or stricter. The commands use the default directory /var/log/audit; use the directory of log_file in /etc/audit/auditd.conf if it differs.

      find /var/log/audit -type f -perm /0137 -exec chmod u-x,g-wx,o-rwx {} +
      chmod 0600 /var/log/audit/audit.log

      Some variants require the current log file to be exactly 0600 or 0640.
  - id: "CIS-DEBIAN13-6.2.4.2-audit_logfile_owner"
    name: "audit logfile owner: for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc \"%…"
    description: "CIS Debian 13 benchmark recommendation 6.2.4.2. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc "%n_%U" $file; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_root$" }
    rationale: &rat-2960c33012 |
      Audit logs must only be modifiable by root. If they are owned by another user, that user could alter or delete records and thereby hide activity.
    remediation: &rem-d7ec9e6f98 |
      Make root the owner of all audit log files. The command uses the default directory /var/log/audit; use the directory of log_file in /etc/audit/auditd.conf if it differs.

      find /var/log/audit -type f ! -user root -exec chown root {} +

      On Debian 12 this check tests the group of the current log file instead (root or adm); correct it with chgrp root /var/log/audit/audit.log.
  - id: "CIS-DEBIAN13-6.2.4.3-audit_logfile_group"
    name: "audit logfile group: for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc \" …"
    description: "CIS Debian 13 benchmark recommendation 6.2.4.3. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc " %n_%G" $file; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_(adm|root)$" }
    rationale: &rat-27178e295b |
      The group of the audit log files determines who besides root may read them. Restricting it to root or a dedicated log group such as adm keeps audit data away from ordinary users.
    remediation: &rem-2be7ad5f04 |
      Assign the audit log files to the root group (adm is also accepted) and make sure log_group in /etc/audit/auditd.conf names the same group, so that auditd keeps using it. The command uses the default directory /var/log/audit.

      find /var/log/audit -type f ! -group root ! -group adm -exec chgrp root {} +
      grep -E '^\s*log_group' /etc/audit/auditd.conf
  - id: "CIS-DEBIAN13-6.2.4.3-audit_logfile_group_setting"
    name: "audit logfile group setting: grep log_group /etc/audit/audit* | awk '{ print $NF}'"
    description: "CIS Debian 13 benchmark recommendation 6.2.4.3. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep log_group /etc/audit/audit* | awk '{ print $NF}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(adm|root)$" }
    rationale: &rat-004712d53c |
      log_group in auditd.conf sets the group of the audit log files that auditd creates. Setting it to root or a dedicated log group ensures that new and rotated log files are not readable by ordinary users.
    remediation: &rem-651e7832f2 |
      Set log_group in /etc/audit/auditd.conf to root (adm is also accepted), apply it to the existing log files and make auditd re-read its configuration.

      sed -i -E 's/^\s*#?\s*log_group\s*=.*/log_group = root/' /etc/audit/auditd.conf
      grep -q '^log_group' /etc/audit/auditd.conf || echo 'log_group = root' >> /etc/audit/auditd.conf
      find /var/log/audit -type f ! -group root -exec chgrp root {} +
      pkill -HUP -x auditd
  - id: "CIS-DEBIAN13-6.2.4.4-audit_logfile_dir_perms"
    name: "audit logfile dir perms: for dir in `dirname \\`grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'\\``; do …"
    description: "CIS Debian 13 benchmark recommendation 6.2.4.4. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      for dir in `dirname \`grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'\``; do stat -Lc " %n_%a" $dir; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_7(0|5)0$" }
    rationale: &rat-00692bf603 |
      The audit log directory holds the audit trail. If other users can enter or list it, or group members can write to it, audit records could be read for reconnaissance or tampered with. Mode 0750 or stricter limits access to root and the audit group.
    remediation: &rem-8ac87c6fbb |
      Set the permissions of the audit log directory (the directory of log_file in /etc/audit/auditd.conf, by default /var/log/audit) to 0750.

      grep '^log_file' /etc/audit/auditd.conf
      chmod 0750 /var/log/audit

      Most variants accept exactly 0700 or 0750, so do not use other modes such as 0710 or 0740.
  - id: "CIS-DEBIAN13-6.2.4.5-audit_conf_perms"
    name: "audit conf perms: for file  in `find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\)`; do stat …"
    description: "CIS Debian 13 benchmark recommendation 6.2.4.5. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      for file  in `find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \)`; do stat -Lc " %n_%a" $file; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_6(0|4)0$" }
    rationale: &rat-dfb522cb65 |
      The audit configuration and rule files determine what is recorded. If they are writable by others, an attacker could disable auditing without root privileges; if they are readable by everyone, the gaps in monitoring become visible. A mode of 0640 or stricter prevents both.
    remediation: &rem-892fd1a120 |
      Remove write access for the group and all access for others from the audit configuration and rule files.

      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) -perm /0137 -exec chmod u-x,g-wx,o-rwx {} +
  - id: "CIS-DEBIAN13-6.2.4.6-audit_conf_owner"
    name: "audit conf owner: find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\) ! -user root"
    description: "CIS Debian 13 benchmark recommendation 6.2.4.6. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) ! -user root
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-93d20735ce |
      The audit configuration and rule files determine what is recorded. If they are owned by a user other than root, that user can change or disable auditing.
    remediation: &rem-63ddfcf4ba |
      Make root the owner of all audit configuration and rule files.

      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) ! -user root -exec chown root {} +
  - id: "CIS-DEBIAN13-6.2.4.7-audit_conf_group"
    name: "audit conf group: find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\) ! -group root"
    description: "CIS Debian 13 benchmark recommendation 6.2.4.7. NIST SP 800-53 Rev. 5: AU-3."
