    name: "ip4 all forwarding conf: grep net.ipv4.conf.all.forwarding /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.c…"
    description: "CIS Debian 13 benchmark recommendation 3.3.1.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
