  - id: "CIS-DEBIAN13-5.3.2.2-pam_faillock_enabled_common_act-attrs"
    name: "/etc/pam.d/common-account: exists"
    description: "CIS Debian 13 benchmark recommendation 5.3.2.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/common-account'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-2895484d31 |
      pam_faillock locks accounts after repeated failed authentication attempts, which slows down password guessing. Its entry in common-account clears the failure records after a successful login, so the counter reflects only consecutive failures. Without it the lockout mechanism does not work as intended.
    remediation: *rem-d4c3aa62b6
  - id: "CIS-DEBIAN13-5.3.2.2-pam_faillock_enabled_common_act-content"
