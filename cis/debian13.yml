    rationale: &rat-7e71d5e5cb |
      The kmod binary (insmod, rmmod, modprobe) loads and removes kernel modules. Executions by users with a login session are audited because loading a malicious module gives full control over the kernel and can hide an intruder. This variant inspects the rules currently loaded in the kernel, so it also catches rule files that were never loaded.
    remediation: &rem-9536a43f0a |
      Add the following audit rule to a file in /etc/audit/rules.d/ so it persists, then load the rules into the kernel:

      printf '%s\n' '-a always,exit -F arch=b64 -S all -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset -k kernel_modules' >> /etc/audit/rules.d/50-kernel_modules.rules
      augenrules --load
      auditctl -l

      If the loaded audit configuration is immutable (-e 2), the new rules only become active after a reboot.
  - id: "CIS-DEBIAN13-6.2.3.32-auditd_init_cnf"
    name: "auditd init cnf: grep init /etc/audit/rules.d/*.rules"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.32. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep init /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S init_module,finit_module -F auid\u003e=1000 -F auid!=(unset|-1|auid!=4294967295) -k kernel_modules" }
    rationale: &rat-bce9648a48 |
      init_module and finit_module load code into the running kernel. Auditing these calls for user sessions records every module load, which is essential for detecting rootkits and unauthorized drivers. This variant inspects the persistent rule files in /etc/audit/rules.d, which are loaded at boot.
    remediation: &rem-71cbdaf39a |
      Add the following audit rule to a file in /etc/audit/rules.d/ and load the rules:

      printf '%s\n' '-a always,exit -F arch=b64 -S init_module,finit_module -F auid>=1000 -F auid!=unset -k kernel_modules' >> /etc/audit/rules.d/50-kernel_modules.rules
      augenrules --load

      If the loaded audit configuration is immutable (-e 2), the new rules only become active after a reboot. On 64-bit systems that also run 32-bit programs, add the same rules with -F arch=b32.
  - id: "CIS-DEBIAN13-6.2.3.32-auditd_init_module_live"
