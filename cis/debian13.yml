  - id: "CIS-DEBIAN13-1.6.4-motd_perms-attrs"
    name: "/etc/motd: mode 0644 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 1.6.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/motd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-84448e81ae |
      /etc/motd is displayed to every user after login. If unprivileged users could write to it, they could show misleading messages to other users, for example to trick them into running commands. Ownership by root and mode 0644 or stricter prevent this.
    remediation: &rem-cc50883ec8 |
      Create /etc/motd if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/motd'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/motd'
  - id: "CIS-DEBIAN13-1.6.5-etc_issue_perms-attrs"
    name: "/etc/issue: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 1.6.5. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-695e1a5a3f |
      /etc/issue is displayed before every local login. If unprivileged users could write to it, they could replace the warning text or display misleading instructions. Ownership by root and mode 0644 or stricter prevent this.
    remediation: &rem-683e1f474b |
      Create /etc/issue if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue'
  - id: "CIS-DEBIAN13-1.6.6-etc_issue_net_perms-attrs"
    name: "/etc/issue.net: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 1.6.6. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue.net'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-db96813c99 |
      /etc/issue.net holds the banner shown to remote users before login. If non-root users could modify it, they could alter the legal notice or insert misleading content shown to everyone who connects. Ownership by root and a mode of 0644 or stricter keeps it readable but protected.
    remediation: &rem-eb0556c5ea |
      Create /etc/issue.net if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue.net'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue.net'
  - id: "CIS-DEBIAN13-1.7.1-gdm_removed"
    name: "Package gdm is not installed"
    description: "CIS Debian 13 benchmark recommendation 1.7.1. NIST SP 800-53 Rev. 5: CM-11."
    tags: [cis, cis-debian13, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      dpkg-query -W -f='${Status}' gdm 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-90c9fbab39 |
      A graphical display manager and the desktop stack it pulls in add a large amount of software, listening components and potential vulnerabilities that servers rarely need. Removing GDM reduces the attack surface; workstations that need a graphical login are an exception.
    remediation: &rem-d121d790af |
      Remove the package gdm, unless the system needs it:

      apt-get purge gdm
  - id: "CIS-DEBIAN13-2.1.1-autofs_pkg"
    name: "Package autofs is not installed"
    description: "CIS Debian 13 benchmark recommendation 2.1.1. NIST SP 800-53 Rev. 5: SI-3, MP-7."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' autofs 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-66cc7255f3 |
      autofs mounts file systems automatically when they are accessed, including removable media and network shares. That makes it easier to introduce untrusted media and adds a privileged daemon. Systems that do not rely on automounted network shares or home directories should not have it installed.
    remediation: &rem-054ad7e690 |
      Remove the package autofs, unless the system needs it:

      apt-get purge autofs
  - id: "CIS-DEBIAN13-2.1.2-avahi_pkg"
    name: "Package avahi-daemon is not installed"
    description: "CIS Debian 13 benchmark recommendation 2.1.2. NIST SP 800-53 Rev. 5: SI-4."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' avahi-daemon 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-70b707d084 |
      Avahi implements mDNS/DNS-SD zero-configuration networking, advertising and discovering services on the local network. Servers rarely need it; it runs a listening network daemon and discloses information about the host. Removing it reduces attack surface.
    remediation: &rem-983c3c748e |
      Remove the package avahi-daemon, unless the system needs it:

      apt-get purge avahi-daemon
  - id: "CIS-DEBIAN13-2.1.3-dhcp_pkg"
    name: "Package kea is not installed"
    description: "CIS Debian 13 benchmark recommendation 2.1.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' kea 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-2033f6aeaa |
      A DHCP server hands out network configuration to clients. On a system that is not meant to be a DHCP server it is unnecessary attack surface, and if started by mistake it can disrupt the network by handing out wrong addresses or gateways.
    remediation: &rem-45a76fbf2a |
      Remove the package kea, unless the system needs it:

      apt-get purge kea
  - id: "CIS-DEBIAN13-2.1.4-dns_pkg"
    name: "Package bind9 is not installed"
    description: "CIS Debian 13 benchmark recommendation 2.1.4. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' bind9 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-e524956514 |
      A DNS server is a complex network-facing service with a history of serious vulnerabilities. Systems that are not designated name servers should not have it installed, which removes that exposure and the risk of the host being abused for DNS amplification attacks.
    remediation: &rem-897cffc230 |
      Remove the package bind9, unless the system needs it:

      apt-get purge bind9
  - id: "CIS-DEBIAN13-2.1.5-dnsmasq_pkg"
    name: "Package dnsmasq is not installed"
    description: "CIS Debian 13 benchmark recommendation 2.1.5. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' dnsmasq 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-6976005192 |
      dnsmasq combines a DNS forwarder with DHCP and TFTP servers. Unless the system needs it, for example for local virtualization networking, it is an unnecessary network-facing service that adds attack surface.
    remediation: &rem-23ab3030a1 |
      Remove the package dnsmasq, unless the system needs it:

      apt-get purge dnsmasq
  - id: "CIS-DEBIAN13-2.1.6-ftp_pkg"
    name: "Package vsftpd is not installed"
    description: "CIS Debian 13 benchmark recommendation 2.1.6. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' vsftpd 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-7acf1c085d |
      FTP transfers credentials and data in clear text, and FTP servers are frequent attack targets. Unless the system is an approved FTP server, the server package should not be installed; SFTP or FTPS are secure alternatives.
    remediation: &rem-62a6c8265d |
      Remove the package vsftpd, unless the system needs it:

      apt-get purge vsftpd
  - id: "CIS-DEBIAN13-2.1.7-ldap_pkg"
    name: "Package slapd is not installed"
    description: "CIS Debian 13 benchmark recommendation 2.1.7. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' slapd 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-ca98560dc1 |
      slapd is an LDAP directory server. Unless the system is intended to provide directory services, removing it eliminates an unneeded network service and its vulnerabilities.
    remediation: &rem-ca443169e7 |
      Remove the package slapd, unless the system needs it:

      apt-get purge slapd
  - id: "CIS-DEBIAN13-2.1.8-dovecot_imapd_pkg"
