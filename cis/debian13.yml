      test -e '/etc/cron.deny' || test -L '/etc/cron.deny'
    expect: false
    rationale: &rat-593adc8129 |
      If /etc/cron.deny exists alongside cron.allow, access control relies on a blocklist in which any account not listed is allowed. Removing cron.deny and using only cron.allow means only explicitly approved users can schedule cron jobs.
    remediation: &rem-d780ede041 |
      Remove /etc/cron.deny, unless the system needs it:

      rm '/etc/cron.deny'
  - id: "CIS-DEBIAN13-2.4.2.1-at_allow_users-attrs"
