      printf '%s\n' 'blacklist atm' 'install atm /bin/false' > /etc/modprobe.d/atm.conf
      modprobe -r atm

      The check expects exactly /bin/false or /bin/true.
  - id: "CIS-DEBIAN13-3.2.2-lsmod_can"
    name: "lsmod can: lsmod | grep -i can"
    description: "CIS Debian 13 benchmark recommendation 3.2.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i can
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-3d05bbfd9e |
      The Controller Area Network protocol is used in vehicles and industrial equipment and is not needed on typical servers or workstations. Its socket family can be loaded automatically when a program requests it, exposing additional kernel code that has had vulnerabilities. Disabling the can module removes this attack surface where no CAN interfaces are used.
    remediation: &rem-58b62e9776 |
      Prevent the can module from being loaded and unload it if it is currently loaded.

      printf '%s\n' 'blacklist can' 'install can /bin/false' > /etc/modprobe.d/can.conf
      modprobe -r can

      If the module is in use, unload dependent modules such as can_raw or can_bcm first. lsmod | grep -i can matches any module name containing "can"; review the output.
  - id: "CIS-DEBIAN13-3.2.2-modprobe_can"
    name: "modprobe can: modprobe -n -v can"
