  - id: "CIS-DEBIAN13-1.6.1-motd_config-content"
    name: "/etc/motd has the expected content (5 rules)"
    description: "CIS Debian 13 benchmark recommendation 1.6.1. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/motd'
    allow_rc: any
    expect:
      - { none: "~ (?i)debian.*" }
      - { none: "~ (?i)ubuntu.*" }
      - { none: "~ (?i)kernel.*" }
      - { none: "~ x86_64" }
      - { none: "~ (?i)linux.*" }
    rationale: &rat-fcf145da02 |
      The message of the day is shown to every user after login. If it reveals the operating system, distribution, kernel or architecture, it helps attackers choose matching exploits. It should contain the organization's notice instead of system details; on some platforms the check also verifies the file is owned by root and not writable by others.
    remediation: &rem-ce8c09e24e |
      Edit /etc/motd so that its lines meet these conditions (regular expressions):

      - no line matches (?i)debian.*
      - no line matches (?i)ubuntu.*
      - no line matches (?i)kernel.*
      - no line matches x86_64
      - no line matches (?i)linux.*
  - id: "CIS-DEBIAN13-1.6.2-etc_issue_config-attrs"
    name: "/etc/issue: exists"
    description: "CIS Debian 13 benchmark recommendation 1.6.2. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-b1dea4cbb3 |
      /etc/issue is displayed before local console logins. It should carry a warning that use is restricted to authorized users and may be monitored, which supports legal action against misuse, and it should not reveal operating system or architecture details that help attackers. On some platforms the check also verifies root ownership and mode 0644 or stricter.
    remediation: &rem-e3ef3968ca |
      Create /etc/issue.
  - id: "CIS-DEBIAN13-1.6.2-etc_issue_config-content"
    name: "/etc/issue has the expected content (6 rules)"
    description: "CIS Debian 13 benchmark recommendation 1.6.2. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
