  - id: "CIS-DEBIAN13-1.6.3-etc_issue_net_config-attrs"
    name: "/etc/issue.net: exists"
    description: "CIS Debian 13 benchmark recommendation 1.6.3. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
