    rationale: &rat-7eacf9543c |
      unlink and unlinkat delete files. Auditing deletions made by regular user sessions helps reconstruct what happened to missing data and reveals attempts to remove evidence such as logs or tools. This variant inspects the persistent rule files in /etc/audit/rules.d, which are loaded at boot.
    remediation: &rem-2e40c2fdc5 |
