      cat '/etc/pam.d/common-password'
    allow_rc: any
    expect: { some: "~ ^\\s*password\\s*(requisite|required)\\s*pam_pwhistory.so.*enforce_for_root" }
    rationale: *rat-5a6040fb53
    remediation: &rem-9042a7fb5b |
      Edit /etc/pam.d/common-password so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*password\s*(requisite|required)\s*pam_pwhistory.so.*enforce_for_root
  - id: "CIS-DEBIAN13-5.3.3.3.2-pwhistory_enforce_for_root_pam_configs"
    name: "pwhistory enforce for root pam configs: for file in `awk '/Password-Type:/{ f = 1;next } /-Type:/{ f = 0 } f {if (/pam_pwhistory\\…"
    description: "CIS Debian 13 benchmark recommendation 5.3.3.3.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      for file in `awk '/Password-Type:/{ f = 1;next } /-Type:/{ f = 0 } f {if (/pam_pwhistory\.so/) print FILENAME}' /usr/share/pam-configs/*`; do grep pam_pwhistory $file | grep -v enforce_for_root; done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-92f8347a9d |
      On Debian-based systems pam-auth-update regenerates /etc/pam.d/common-password from the profiles in /usr/share/pam-configs. If the pam_pwhistory profile lacks enforce_for_root, regenerating the stack drops the option and password changes made as root are no longer checked against the history. Setting it in the profile keeps the control persistent.
    remediation: &rem-4eec3cc8cf |
      Add enforce_for_root to every pam_pwhistory line of the profile(s) under /usr/share/pam-configs/ that lack it, then regenerate the PAM stack.

      grep -l pam_pwhistory /usr/share/pam-configs/*
      sed -ri '/pam_pwhistory\.so/{/enforce_for_root/!s/$/ enforce_for_root/}' FILE
      pam-auth-update --enable $(basename FILE)
  - id: "CIS-DEBIAN13-5.3.3.3.3-pwhistory_use_authtok-attrs"
    name: "/etc/pam.d/common-password: exists"
    description: "CIS Debian 13 benchmark recommendation 5.3.3.3.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/common-password'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e35b0e1557 |
      use_authtok makes pam_pwhistory check the new password already obtained and accepted by the module above it, such as pam_pwquality, instead of prompting again. This guarantees that the password tested for reuse is the same one that passed the quality checks and is finally stored.
    remediation: *rem-24dae7c4b7
  - id: "CIS-DEBIAN13-5.3.3.3.3-pwhistory_use_authtok-content"
    name: "/etc/pam.d/common-password has the expected content (1 rule)"
    description: "CIS Debian 13 benchmark recommendation 5.3.3.3.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/common-password'
    allow_rc: any
    expect: { some: "~ ^\\s*password\\s*(requisite|required)\\s*pam_pwhistory.so.*use_authtok" }
    rationale: *rat-e35b0e1557
    remediation: &rem-8b4d555fe9 |
      Edit /etc/pam.d/common-password so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*password\s*(requisite|required)\s*pam_pwhistory.so.*use_authtok
  - id: "CIS-DEBIAN13-5.3.3.3.3-pwhistory_use_authtok_pam_configs"
    name: "pwhistory use authtok pam configs: for file in `awk '/Password-Type:/{ f = 1;next } /-Type:/{ f = 0 } f {if (/pam_pwhistory\\…"
    description: "CIS Debian 13 benchmark recommendation 5.3.3.3.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      for file in `awk '/Password-Type:/{ f = 1;next } /-Type:/{ f = 0 } f {if (/pam_pwhistory\.so/) print FILENAME}' /usr/share/pam-configs/*`; do grep pam_pwhistory $file | grep -v use_authtok; done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-285c43730e |
      On Debian-based systems the PAM password stack is regenerated from the profiles in /usr/share/pam-configs. If a pam_pwhistory profile line lacks use_authtok, a regenerated stack may prompt separately or check a different password than the one that passed the quality checks. Setting the option in the profile keeps the stack consistent.
    remediation: &rem-5983389ca3 |
      Add use_authtok to every pam_pwhistory line of the profile(s) under /usr/share/pam-configs/ that lack it, then regenerate the PAM stack.

      grep -l pam_pwhistory /usr/share/pam-configs/*
      sed -ri '/pam_pwhistory\.so/{/use_authtok/!s/$/ use_authtok/}' FILE
      pam-auth-update --enable $(basename FILE)
  - id: "CIS-DEBIAN13-5.3.3.4.1-pam_unix_nullok_pam_configs"
    name: "pam unix nullok pam configs: for l_file in /etc/pam.d/common-password /etc/pam.d/common-auth /etc/pam.d/common-account…"
    description: "CIS Debian 13 benchmark recommendation 5.3.3.4.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      for l_file in /etc/pam.d/common-password /etc/pam.d/common-auth /etc/pam.d/common-account /etc/pam.d/common-session /etc/pam.d/common-session-noninteractive; do
        [ -f "$l_file" ] || echo "MISSING: $l_file"
      done
      grep -PHs -- '^\h*[^#\n\r]+\h+pam_unix\.so\h+([^#\n\r]+\h+)?nullok\b' /etc/pam.d/common-password /etc/pam.d/common-auth /etc/pam.d/common-account /etc/pam.d/common-session /etc/pam.d/common-session-noninteractive /usr/share/pam-configs/*
      l_rc=$?
      [ "$l_rc" -le 1 ] || echo "GREP_ERROR: rc=$l_rc"
      exit 0
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-4591b9b5f4 |
      The nullok option lets pam_unix accept accounts whose password field is empty, so anyone who knows the account name can authenticate without a password. Removing nullok from all pam_unix entries, and from the pam-auth-update profiles that generate them, ensures every login requires a password.
    remediation: &rem-20710270ea |
      Remove nullok from the pam_unix lines of each file reported by the check, including the profile in /usr/share/pam-configs/ (usually unix), then regenerate the PAM stack.

      awk -F: '$2 == "" {print $1}' /etc/shadow
      sed -ri '/pam_unix\.so/s/\s+nullok\b//' FILE
      pam-auth-update --enable unix

      Accounts listed by the first command can no longer log in afterwards; give them a password or lock them first.
  - id: "CIS-DEBIAN13-5.3.3.4.2-pam_unix_remember_pam_configs"
    name: "pam unix remember pam configs: for l_file in /etc/pam.d/common-password /etc/pam.d/common-auth /etc/pam.d/common-account…"
    description: "CIS Debian 13 benchmark recommendation 5.3.3.4.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      for l_file in /etc/pam.d/common-password /etc/pam.d/common-auth /etc/pam.d/common-account /etc/pam.d/common-session /etc/pam.d/common-session-noninteractive; do
        [ -f "$l_file" ] || echo "MISSING: $l_file"
      done
      grep -PHs -- '^\h*[^#\n\r]+\h+pam_unix\.so\h+([^#\n\r]+\h+)?remember=\d+\b' /etc/pam.d/common-password /etc/pam.d/common-auth /etc/pam.d/common-account /etc/pam.d/common-session /etc/pam.d/common-session-noninteractive /usr/share/pam-configs/*
      l_rc=$?
      [ "$l_rc" -le 1 ] || echo "GREP_ERROR: rc=$l_rc"
      exit 0
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-3494945630 |
      Password history belongs to pam_pwhistory. The legacy remember option of pam_unix keeps its own history in /etc/security/opasswd, which duplicates or conflicts with the pwhistory configuration and makes the effective policy unclear. Removing it from pam_unix lines keeps history enforcement in one defined place.
    remediation: &rem-6570e0a84a |
      Remove the remember=N option from the pam_unix lines of each file reported by the check, including profiles in /usr/share/pam-configs/, and regenerate the PAM stack. Configure password history with pam_pwhistory instead.

      sed -ri '/pam_unix\.so/s/\s+remember=[0-9]+//' FILE
      pam-auth-update --enable unix
  - id: "CIS-DEBIAN13-5.3.3.4.3-pam_unix_strong_password_pam_configs"
    name: "pam unix strong password pam configs: grep -PH -- '^\\h*password\\h+([^#\\n\\r]+)\\h+pam_unix\\.so\\h+([^#\\n\\r]+\\h+)?(sha512|yescrypt)…"
    description: "CIS Debian 13 benchmark recommendation 5.3.3.4.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -PH -- '^\h*password\h+([^#\n\r]+)\h+pam_unix\.so\h+([^#\n\r]+\h+)?(sha512|yescrypt)\b' /etc/pam.d/common-password /usr/share/pam-configs/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*:password\\s+([^#\\n\\r]+)\\s+pam_unix\\.so.*(yescrypt|sha512)" }
    rationale: &rat-2bf87335aa |
      pam_unix decides which algorithm hashes new passwords in /etc/shadow. Legacy algorithms such as MD5 or DES make stolen hash files far easier to crack offline. Specifying yescrypt or SHA-512 ensures new passwords are stored with a strong, salted and deliberately slow hash.
    remediation: &rem-bf6043d3d9 |
      Make sure the pam_unix password line in /etc/pam.d/common-password names yescrypt (or sha512). The line is generated from /usr/share/pam-configs/unix, so set the algorithm on its Password: and Password-Initial: lines and regenerate.

      grep -n 'pam_unix.so' /etc/pam.d/common-password /usr/share/pam-configs/unix
      pam-auth-update --enable unix
      grep -P '^\s*password\s+.*pam_unix\.so.*\b(yescrypt|sha512)\b' /etc/pam.d/common-password

      Use sha512 on Ubuntu 20.04, whose pam_unix does not support yescrypt. Existing hashes change only when passwords are next changed.
  - id: "CIS-DEBIAN13-5.3.3.4.4-pam_unix_use_authtok_pam_configs"
    name: "pam unix use authtok pam configs: grep -PH -- '^\\s*password\\s+([^#\\n\\r]+)\\s+pam_unix\\.so\\s+([^#\\n\\r]+\\s+)?use_authtok\\b' /e…"
    description: "CIS Debian 13 benchmark recommendation 5.3.3.4.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -PH -- '^\s*password\s+([^#\n\r]+)\s+pam_unix\.so\s+([^#\n\r]+\s+)?use_authtok\b' /etc/pam.d/common-password
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*:password\\s+([^#\\n\\r]+)\\s+pam_unix\\.so.*use_authtok" }
    rationale: &rat-90a45cbb80 |
      When pam_unix follows a quality or history module in the password stack, use_authtok makes it store the password those modules already accepted instead of prompting again. Without it pam_unix could set a password that never went through the complexity and reuse checks.
    remediation: &rem-048d31494d |
      Make sure the pam_unix line in /etc/pam.d/common-password carries use_authtok. pam-auth-update adds it automatically when another password module such as pam_pwquality is enabled before pam_unix, so enable that profile and regenerate.

      pam-auth-update --enable pwquality
      grep -P '^\s*password\s+.*pam_unix\.so.*\buse_authtok\b' /etc/pam.d/common-password

      If it is still missing, add use_authtok to the Password: line of /usr/share/pam-configs/unix and run pam-auth-update --enable unix.
  - id: "CIS-DEBIAN13-5.4.1.1-check_user_expiry"
    name: "check user expiry: grep -E '^[^:]+:[^!*]' /etc/shadow | cut -d: -f1,5"
    description: "CIS Debian 13 benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E '^[^:]+:[^!*]' /etc/shadow | cut -d: -f1,5
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*:([0-9]|[1-9][0-9]|[1-2][0-9][0-9]|3[1-5][0-9]|36[0-5])$" }
    rationale: &rat-ce451c4e8f |
      Passwords that never expire stay valid indefinitely after being disclosed, phished or cracked. A maximum password age of at most 365 days limits how long a compromised password can be used. The exact interval should follow site policy.
    remediation: &rem-995944b710 |
      Set the maximum password age to 365 days or less for new accounts and for each existing account with a password.

      sed -ri 's/^\s*PASS_MAX_DAYS\s+.*/PASS_MAX_DAYS 365/' /etc/login.defs
      chage --maxdays 365 USER

      List accounts and their current value with: awk -F: '$2 ~ /^[^!*]/ {print $1 ":" $5}' /etc/shadow. On SUSE 16, copy /usr/etc/login.defs to /etc/login.defs first if it does not exist.
  - id: "CIS-DEBIAN13-5.4.1.1-login_defs_max_days"
    name: "login defs max days: grep PASS_MAX_DAYS /etc/login.defs"
    description: "CIS Debian 13 benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep PASS_MAX_DAYS /etc/login.defs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS_MAX_DAYS\\s+365" }
      - { none: "~ ^PASS_MAX_DAYS\\s+(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9][0-9][0-9]|[1-9][0-9][0-9][0-9][0-9])" }
      - { none: "~ ^PASS_MAX_DAYS\\s+-1" }
    rationale: &rat-de28e65ea9 |
      A maximum password age limits how long a compromised password remains useful to an attacker who obtained it unnoticed. PASS_MAX_DAYS sets the default maximum for new passwords; 365 days or less forces periodic renewal without the counterproductive effects of very frequent changes.
    remediation: &rem-5638dc8f2e |
      Set PASS_MAX_DAYS to 365 in /etc/login.defs.

      sed -ri 's/^\s*PASS_MAX_DAYS\s+.*/PASS_MAX_DAYS 365/' /etc/login.defs
      grep -q '^PASS_MAX_DAYS' /etc/login.defs || echo 'PASS_MAX_DAYS 365' >> /etc/login.defs

      login.defs only applies to accounts created or passwords changed later; adjust existing accounts with chage.
  - id: "CIS-DEBIAN13-5.4.1.2-login_defs_min_days-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Debian 13 benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d3716bb90c |
      A minimum password age prevents users from changing their password several times in a row to get back to an old favourite, which would defeat password history. PASS_MIN_DAYS of at least one day sets this default for new passwords.
    remediation: &rem-0b6bdc1798 |
      Create /etc/login.defs.
  - id: "CIS-DEBIAN13-5.4.1.2-login_defs_min_days-content"
    name: "/etc/login.defs has the expected content (2 rules)"
    description: "CIS Debian 13 benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_MIN_DAYS\\s[1-9]" }
      - { none: "~ ^PASS_MIN_DAYS\\s0" }
    rationale: *rat-d3716bb90c
    remediation: &rem-a762cb4ca6 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_MIN_DAYS\s[1-9]
      - no line matches ^PASS_MIN_DAYS\s0
  - id: "CIS-DEBIAN13-5.4.1.2-check_users_MIN_DAYS"
    name: "check users MIN DAYS: awk -F':' '($2 ~ /^\\$.+\\$/) { if ($4 \u003c 1) print \"User: \" $1 \" PASS_MIN_DAYS: \" $4 }' /etc…"
    description: "CIS Debian 13 benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      awk -F':' '($2 ~ /^\$.+\$/) { if ($4 < 1) print "User: " $1 " PASS_MIN_DAYS: " $4 }' /etc/shadow
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-97fb70a127 |
      Without a minimum password age, a user forced to change a password can immediately change it several more times to cycle through the history and return to the old one. A minimum age of at least one day makes password history effective.
    remediation: &rem-337245c30c |
      Set a minimum password age of at least 1 day for new accounts and for each existing account with a password.

      sed -ri 's/^\s*PASS_MIN_DAYS\s+.*/PASS_MIN_DAYS 1/' /etc/login.defs
      chage --mindays 1 USER
  - id: "CIS-DEBIAN13-5.4.1.3-login_defs_warn_age-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Debian 13 benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ca921e80d6 |
      Warning users several days before their password expires gives them time to choose a good new password instead of being forced into a hasty choice or being locked out. PASS_WARN_AGE sets the default warning period for new passwords.
    remediation: *rem-0b6bdc1798
  - id: "CIS-DEBIAN13-5.4.1.3-login_defs_warn_age-content"
    name: "/etc/login.defs has the expected content (3 rules)"
    description: "CIS Debian 13 benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_WARN_AGE\\s+7$" }
      - { some: "~ ^PASS_WARN_AGE\\s+(7|[1-9][0-9]{1,3})$" }
      - { none: "~ ^PASS_WARN_AGE\\s+[1-6]$" }
    rationale: *rat-ca921e80d6
    remediation: &rem-b04f715e69 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_WARN_AGE\s+7$
      - a line matches ^PASS_WARN_AGE\s+(7|[1-9][0-9]{1,3})$
      - no line matches ^PASS_WARN_AGE\s+[1-6]$
  - id: "CIS-DEBIAN13-5.4.1.3-check_users_MAX_DAYS"
    name: "check users MAX DAYS: grep -E '^[^:]+:[^!*]' /etc/shadow | cut -d: -f1,6"
    description: "CIS Debian 13 benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E '^[^:]+:[^!*]' /etc/shadow | cut -d: -f1,6
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^.*:([7-9]|[1-9][0-9]{1,})$" }
      - { none: "~ ^.*:[1-6]$" }
    rationale: &rat-ef3c15217c |
      Users should be warned several days before their password expires so they can change it in time instead of being locked out or choosing a weak replacement in a hurry. Most variants of this check verify a warning period of at least 7 days; the RHEL 8 variant verifies a maximum password age between 1 and 365 days, which limits how long a compromised password stays valid.
    remediation: &rem-d2f7828b9d |
      Set a password expiry warning of at least 7 days for new accounts and for each existing account with a password.

      sed -ri 's/^\s*PASS_WARN_AGE\s+.*/PASS_WARN_AGE 7/' /etc/login.defs
      chage --warndays 7 USER
  - id: "CIS-DEBIAN13-5.4.1.4-login_defs_hashing-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Debian 13 benchmark recommendation 5.4.1.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-281f6b805c |
      Password hashes in /etc/shadow are a prime target once an attacker gains read access. Strong, slow algorithms such as SHA-512 crypt or yescrypt make offline cracking far more expensive than legacy MD5 or DES hashes. ENCRYPT_METHOD sets the algorithm used by tools that read login.defs.
    remediation: *rem-0b6bdc1798
  - id: "CIS-DEBIAN13-5.4.1.4-login_defs_hashing-content"
    name: "/etc/login.defs has the expected content (1 rule)"
    description: "CIS Debian 13 benchmark recommendation 5.4.1.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect: { some: "~ ^ENCRYPT_METHOD (SHA512|YESCRYPT)" }
    rationale: *rat-281f6b805c
    remediation: &rem-87e3ee7c64 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^ENCRYPT_METHOD (SHA512|YESCRYPT)
  - id: "CIS-DEBIAN13-5.4.1.5-inactive_passwd"
    name: "inactive passwd: useradd -D | grep INACTIVE"
    description: "CIS Debian 13 benchmark recommendation 5.4.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      useradd -D | grep INACTIVE
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^INACTIVE=([1-9]|[0-3][0-9]|4[0-5])" }
    rationale: &rat-1b1499cc8f |
      The default INACTIVE value used by useradd defines how many days after password expiry an account is disabled. Disabling unused accounts automatically removes forgotten access paths that attackers like to exploit; a value of up to 30 or 45 days, depending on the policy, balances security and usability.
    remediation: &rem-728ced36b8 |
      Set the default password inactivity period for new accounts to 30 days and apply the same value to existing accounts that have a password.

      useradd -D -f 30
      useradd -D | grep INACTIVE
      chage --inactive 30 USER

      30 days satisfies every supported release; some releases also accept up to 45 days.
  - id: "CIS-DEBIAN13-5.4.1.5-inactive_users"
    name: "inactive users: awk -F':' -v root=0 '($2 ~ /^\\$.+\\$/) \u0026\u0026 (root || $1 != \"root\") { if ($7 \u003e 45 || $7 \u003c 0) …"
    description: "CIS Debian 13 benchmark recommendation 5.4.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F':' -v root=0 '($2 ~ /^\$.+\$/) && (root || $1 != "root") { if ($7 > 45 || $7 < 0) print "User: " $1 " INACTIVE: " $7 }' /etc/shadow
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-c4a4e8be14 |
      Accounts whose password has expired but which remain usable indefinitely are a common foothold for attackers because nobody notices their misuse. Setting a password inactivity period on every account with a password ensures that such accounts are disabled automatically after expiry.
    remediation: &rem-4e712889d3 |
      Set a password inactivity period of 30 days or less on every account that has a password, in particular on each account reported by the check.

      awk -F: '($2 ~ /^\$/) {print $1, $7}' /etc/shadow
      chage --inactive 30 USER

      Set the default for new accounts as well with useradd -D -f 30.
  - id: "CIS-DEBIAN13-5.4.1.6-passwd_chg_past"
    name: "No user has a last password change date in the future"
    description: "CIS Debian 13 benchmark recommendation 5.4.1.6. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      now=$(date +%s)
      for usr in $(cut -d: -f1 /etc/shadow); do
        d=$(chage --list "$usr" 2>/dev/null | awk -F': ' '/^Last password change/ {print $2}')
        case "$d" in ""|never|*"must be changed"*) continue ;; esac
        t=$(date -d "$d" +%s 2>/dev/null) || { echo "$usr: cannot parse last password change '$d'"; continue; }
        if [ "$t" -gt "$now" ]; then echo "$usr: last password change $d is in the future"; fi
      done
    expect: empty
    rationale: &rat-eae9c8e6b4 |
      If the recorded date of the last password change lies in the future, password ageing does not work: the password never expires and the user cannot be forced to change it. Such dates usually result from a wrong system clock or manual edits and should be corrected.
    remediation: &rem-8950b282e3 |
      Check the system clock, then set the last password change of every listed user to today, or expire the password so it must be changed at the next login:

      chage --lastday "$(date +%Y-%m-%d)" USER
      chage --lastday 0 USER
  - id: "CIS-DEBIAN13-5.4.2.1-uid_0_check"
    name: "uid 0 check: awk -F: '($3 == 0) { if ($1 == \"root\") r = 1; else print \"FAIL: \" $1 } END { if (!r) prin…"
    description: "CIS Debian 13 benchmark recommendation 5.4.2.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3 == 0) { if ($1 == "root") r = 1; else print "FAIL: " $1 } END { if (!r) print "FAIL: root is not UID 0" }' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-90d4d66c1b |
      Any account with UID 0 has full root privileges, regardless of its name. Additional UID 0 accounts are a classic backdoor and make it impossible to attribute administrative actions; only root should have UID 0.
    remediation: &rem-5c4a8fc9e4 |
      Make sure that only root has UID 0. Find out what every other UID 0 account is used for, then give it a unique non-zero UID with vipw or remove it.

      awk -F: '($3 == 0) {print $1}' /etc/passwd
      vipw
      userdel USER

      usermod -u cannot be used here because the running root processes share UID 0. Also make sure that root itself has UID 0.
  - id: "CIS-DEBIAN13-5.4.2.2-gid_0_check"
    name: "gid 0 check: awk -F: '($1 !~ /^(sync|shutdown|halt|operator)$/ \u0026\u0026 $4 == \"0\") { if ($1 == \"root\") r = 1…"
    description: "CIS Debian 13 benchmark recommendation 5.4.2.2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($1 !~ /^(sync|shutdown|halt|operator)$/ && $4 == "0") { if ($1 == "root") r = 1; else print "FAIL: " $1 ":" $4 } END { if (!r) print "FAIL: root primary GID is not 0" }' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-86032dcad6 |
      Group ID 0 is the root group, which owns many sensitive files and directories. Any other account with primary group 0 can read or modify those resources with root-group rights, far beyond its role. Only root should have GID 0 as primary group, which keeps root-group access deliberate and auditable.
    remediation: &rem-d5614bed37 |
      Give every account reported by the check a different primary group and make sure root itself has primary group 0.

      usermod -g GROUP USER
      usermod -g 0 root

      Afterwards review files the account created with group 0: find / -xdev -user USER -group 0
  - id: "CIS-DEBIAN13-5.4.2.3-group_root_only_0"
    name: "group root only 0: awk -F: '($3 == \"0\") { if ($1 == \"root\") r = 1; else print \"FAIL: \" $1 \":\" $3 } END { if …"
    description: "CIS Debian 13 benchmark recommendation 5.4.2.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3 == "0") { if ($1 == "root") r = 1; else print "FAIL: " $1 ":" $3 } END { if (!r) print "FAIL: group root is not GID 0" }' /etc/group
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-e6e96aa117 |
      GID 0 is the root group, which owns many sensitive system files and directories. Any other group with GID 0 silently gives its members the same group access as root. Ensuring that only the group named root has GID 0 prevents such hidden privilege.
    remediation: &rem-481abd2b91 |
      Make sure the group root has GID 0 and give every other group that the check reports with GID 0 its own unused GID, or remove it if it is not needed.

      awk -F: '$3 == 0' /etc/group
      groupmod -g NEWGID GROUP

      Files keep GID 0 and therefore stay owned by the group root. Review the members of GROUP before changing it. If root itself does not have GID 0, fix it with groupmod -g 0 root after the other groups are moved.
  - id: "CIS-DEBIAN13-5.4.2.4-root_passwd_set"
    name: "root passwd set: passwd -S root | awk '$2 ~ /^(P|L)/ {print \"OK Password\"}'"
    description: "CIS Debian 13 benchmark recommendation 5.4.2.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      passwd -S root | awk '$2 ~ /^(P|L)/ {print "OK Password"}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ OK Password" }
    rationale: &rat-dc1e5c0dc5 |
      If root has no password, anyone with local access, for example through the console or single-user mode, can become root without authentication. A set password, or a locked root account where administrators use sudo, ensures that root access requires a credential.
    remediation: &rem-c94fa31bf9 |
      Set a strong password for root.

      passwd root

      Where the check also accepts a locked account (status L), passwd -l root is an alternative if administrators use sudo.
  - id: "CIS-DEBIAN13-5.4.2.5-root_path_check"
    name: "root path check: /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e…"
    description: "CIS Debian 13 benchmark recommendation 5.4.2.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e 's/:/\n/g'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ \\\\." }
    rationale: &rat-ee503b897e |
      If root's PATH contains the current directory, empty entries, relative paths or directories that other users can write to, a malicious program placed there can be executed with root privileges when an administrator types a common command name. Root's PATH should contain only absolute, root-owned and non-writable directories.
    remediation: &rem-0afab9f1f3 |
      Remove the current directory (.), empty entries (leading, trailing or double colons), relative paths and non-existent directories from root's PATH, and make sure every remaining directory is owned by root and not writable by group or others. Look for PATH assignments in root's and the system-wide shell startup files.

      su - root -c 'echo "$PATH"'
      grep -sn 'PATH' /root/.bash_profile /root/.bashrc /root/.profile /etc/profile /etc/bashrc /etc/bash.bashrc /etc/environment /etc/profile.d/*.sh
      chown root DIRECTORY
      chmod go-w DIRECTORY
  - id: "CIS-DEBIAN13-5.4.2.6-root_umask_bash_profile"
    name: "root umask bash profile: grep -i umask /root/.profile /root/.bashrc"
    description: "CIS Debian 13 benchmark recommendation 5.4.2.6. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i umask /root/.profile /root/.bashrc
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*:umask 00(2|7)7" }
    rationale: &rat-623cb7f319 |
      The umask determines the permissions of files root creates. With a permissive umask, configuration files, scripts or logs written by root can end up readable or writable by other users, leaking secrets or allowing tampering. Setting umask 027 or 077 in root's shell startup files keeps new files private by default.
    remediation: &rem-25f34f55b9 |
      Add umask 0027 (or 0077) at the start of a line in both /root/.bashrc and /root/.bash_profile. If /root/.bash_profile does not exist yet, create it so that it still loads /root/.profile.

      echo 'umask 0027' >> /root/.bashrc
      [ -e /root/.bash_profile ] || echo '[ -f ~/.profile ] && . ~/.profile' > /root/.bash_profile
      echo 'umask 0027' >> /root/.bash_profile

      Several variants fail when one of the files is missing, and the line must not be indented. Debian 13 reads /root/.profile instead of /root/.bash_profile; add the line there as well (echo 'umask 0027' >> /root/.profile).
  - id: "CIS-DEBIAN13-5.4.2.7-secure_system_accts"
    name: "secure system accts: awk -F: '$3\u003c1000' /etc/passwd | grep -Ev 'root|sync|halt|shutdown|nfsnobody|/sbin/nologin…"
    description: "CIS Debian 13 benchmark recommendation 5.4.2.7. NIST SP 800-53 Rev. 5: AC-2, AC-3, AC-11, MP-2."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '$3<1000' /etc/passwd | grep -Ev 'root|sync|halt|shutdown|nfsnobody|/sbin/nologin|/bin/false'
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-6f6bd67ce7 |
      System and service accounts do not need an interactive shell. If one of them has a valid login shell, a weakness in a service or a misconfigured password can give an attacker an interactive session under that account. Setting the shell to nologin prevents this.
    remediation: &rem-7ac335f9ab |
      Set the login shell of every system account reported by the check to /usr/sbin/nologin.

      awk -F: '($3 < 1000 || $3 == 65534) {print $1, $7}' /etc/passwd
      usermod -s /usr/sbin/nologin USER

      Accounts root, sync, shutdown and halt are exempt. Make sure no service needs an interactive shell for the account before changing it.
  - id: "CIS-DEBIAN13-5.4.2.8-secure_accts_valid_login"
    name: "secure accts valid login: l_valid_shells=\"^($(awk -F/ '$NF != \"nologin\" {print}' /etc/shells | sed -rn '/^\\//{s,/,\\…"
    description: "CIS Debian 13 benchmark recommendation 5.4.2.8. NIST SP 800-53 Rev. 5: AC-2, AC-3, AC-11, MP-2."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      l_valid_shells="^($(awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\/,g;p}' | paste -s -d '|' -))$"
      awk -v pat="$l_valid_shells" -F: '($1 != "root" && $(NF) !~ pat) {print $1}' /etc/passwd |
      while IFS= read -r l_user; do
      passwd -S "$l_user" | awk '$2 !~ /^L/ {print "Account: \"" $1 "\" does not have a valid login shell and is not locked"}'
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-0d86a765bf |
      System accounts exist to run services and should not be used for interactive logins. An account without a valid login shell that still has an unlocked password may be usable through paths that do not check the shell, such as su to another shell, FTP or other PAM services. Locking such accounts removes that residual access.
    remediation: &rem-ed3668092b |
      Lock the password of each account reported by the check.

      usermod -L USER

      If the account genuinely needs interactive access, give it a valid login shell instead and document the exception.
  - id: "CIS-DEBIAN13-5.4.3.1-nologin_not_in_shells-attrs"
    name: "/etc/shells: exists"
    description: "CIS Debian 13 benchmark recommendation 5.4.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/shells'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1371eb889f |
      /etc/shells lists valid login shells. Some services, such as FTP daemons or chsh, allow access only for accounts with a shell listed there. If nologin is listed, accounts that are meant to be blocked may be treated as having a valid shell and gain access through such services.
    remediation: &rem-fa056f672c |
      Create /etc/shells.
  - id: "CIS-DEBIAN13-5.4.3.1-nologin_not_in_shells-content"
    name: "/etc/shells has the expected content (1 rule)"
    description: "CIS Debian 13 benchmark recommendation 5.4.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/shells'
    allow_rc: any
    expect: { none: "~ .*nologin" }
    rationale: *rat-1371eb889f
    remediation: &rem-852b96f5ad |
      Edit /etc/shells so that its lines meet these conditions (regular expressions):

      - no line matches .*nologin
  - id: "CIS-DEBIAN13-5.4.3.2-check_timeout"
    name: "check timeout: grep TMOUT /etc/profile.d/*.sh /etc/profile /etc/profile.d/*.sh| cut -d \":\" -f2"
    description: "CIS Debian 13 benchmark recommendation 5.4.3.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep TMOUT /etc/profile.d/*.sh /etc/profile /etc/profile.d/*.sh| cut -d ":" -f2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*(readonly\\s+)?TMOUT" }
      - { some: "~ ^\\s*(readonly\\s+|export\\s+)?TMOUT=([1-8][0-9]{0,2}|900)$" }
      - { some: "~ ^\\s*export\\s+TMOUT\\b" }
    rationale: &rat-e92d54c805 |
      An interactive shell left open on an unattended terminal can be used by anyone passing by. TMOUT makes the shell exit automatically after a period of inactivity. Marking it readonly and exporting it prevents users from disabling the timeout in their own session; long-running interactive work may need to account for it.
    remediation: &rem-d216d7a191 |
      Set an idle timeout of 900 seconds or less in a profile script and make it readonly and exported.

      printf '%s\n' 'TMOUT=900' 'readonly TMOUT' 'export TMOUT' > /etc/profile.d/50-tmout.sh

      Remove other TMOUT settings with larger or zero values from /etc/profile, /etc/bashrc and /etc/profile.d. The timeout applies to new login shells.
  - id: "CIS-DEBIAN13-5.4.3.3-umask_profile_scripts"
    name: "umask profile scripts: grep -i \"^\\s*umask\" /etc/profile /etc/profile.d/*.sh /etc/login.defs | cut -d \":\" -f 2"
    description: "CIS Debian 13 benchmark recommendation 5.4.3.3. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i "^\s*umask" /etc/profile /etc/profile.d/*.sh /etc/login.defs | cut -d ":" -f 2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)umask\\s+(0|)0[2-7][7]" }
      - { none: "~ (?i)umask\\s+[7][0-1][0-6]" }
    rationale: &rat-0e0a7af57b |
      The umask set in shell profile scripts determines the permissions of files that users create. A permissive umask such as 022 makes new files readable by everyone, which can expose sensitive data. A system-wide umask of 027 or stricter removes access for other users by default.
    remediation: &rem-36fb94aa0b |
      Set a system-wide umask of 027 in a profile script.

      echo 'umask 027' > /etc/profile.d/50-umask.sh

      The setting applies to new login shells. On Ubuntu 24.04 the check also rejects weaker values in /etc/profile, other /etc/profile.d/*.sh scripts and the UMASK line of /etc/login.defs; raise them as well, for example with sed -ri 's/^(\s*UMASK\s+).*/\1027/' /etc/login.defs.
  - id: "CIS-DEBIAN13-6.1.1.1.1-systemd-journald-enabled"
    name: "Service systemd-journald is enabled"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.1.1. NIST SP 800-53 Rev. 5: SC-24."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journald | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-aa9c4cf1bc |
      systemd-journald collects kernel, service and user log messages and passes them to persistent storage or syslog. If it is not running, events from services and the kernel are lost, leaving gaps in the audit trail. It is a static unit that is always started by systemd.
    remediation: &rem-509c775265 |
      Enable the service systemd-journald:

      systemctl enable systemd-journald
  - id: "CIS-DEBIAN13-6.1.1.1.1-systemd-journald-running"
    name: "Service systemd-journald is running"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.1.1. NIST SP 800-53 Rev. 5: SC-24."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journald | cut -d= -f2
    expect: "== active"
    rationale: *rat-aa9c4cf1bc
    remediation: &rem-062cd16446 |
      Start the service systemd-journald:

      systemctl start systemd-journald
  - id: "CIS-DEBIAN13-6.1.1.1.3-log_rotate_journald_conf"
    name: "log rotate journald conf: grep -Ei \"max|keep\" /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "max|keep" /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*\\:SystemMaxUse=" }
      - { some: "~ .*\\:SystemKeepFree=" }
      - { some: "~ .*\\:RuntimeMaxUse=" }
      - { some: "~ .*\\:RuntimeKeepFree=" }
      - { some: "~ .*\\:MaxFileSec=" }
    rationale: &rat-7192c1da81 |
      Without size and retention limits, the journal can grow until it fills its file system, which may stop services or cause new log records to be dropped. SystemMaxUse, SystemKeepFree, RuntimeMaxUse, RuntimeKeepFree and MaxFileSec bound disk usage and rotate journal files regularly in line with the retention policy.
    remediation: &rem-a5fb2647c9 |
      Set all five journal size and rotation limits in a journald drop-in and restart journald. Adjust the values to the site's retention policy.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nSystemMaxUse=1G\nSystemKeepFree=500M\nRuntimeMaxUse=200M\nRuntimeKeepFree=50M\nMaxFileSec=1month\n' > /etc/systemd/journald.conf.d/60-rotate.conf
      systemctl restart systemd-journald

      Some variants need at least one .conf file in /etc/systemd/journald.conf.d/, which the drop-in provides.
  - id: "CIS-DEBIAN13-6.1.1.1.4-forward_journald_disabled"
    name: "forward journald disabled: grep -i forwardtosyslog /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-6, AU-7, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i forwardtosyslog /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*\\:ForwardToSyslog\\s*=\\s*no" }
      - { none: "~ .*\\:ForwardToSyslog\\s*=\\s*yes" }
    rationale: &rat-7503053bf7 |
      When journald is the only logging system, forwarding every message to a syslog socket duplicates the logs and hands them to a second path with different access controls and retention. Disabling ForwardToSyslog keeps one consistently protected log store. On systems that use rsyslog for local or remote logging the setting does not apply, because rsyslog depends on receiving these messages.
    remediation: &rem-6a96c2e8d8 |
      Set ForwardToSyslog=no in a journald drop-in, remove any ForwardToSyslog=yes line from /etc/systemd/journald.conf and its drop-ins, and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nForwardToSyslog=no\n' > /etc/systemd/journald.conf.d/60-forward-syslog.conf
      systemctl restart systemd-journald

      Use this only where journald, not rsyslog, is the chosen logging solution.
  - id: "CIS-DEBIAN13-6.1.1.1.5-storage_journald_conf"
    name: "storage journald conf: grep -i Storage= /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.1.5. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i Storage= /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*\\:Storage=persistent" }
    rationale: &rat-cda501aacd |
      With volatile or automatic storage, journald may keep logs only in /run, so they are lost at every reboot, including the events that led up to a crash or compromise. Storage=persistent writes the journal to /var/log/journal so the history survives restarts.
    remediation: &rem-32e0bcb5a2 |
      Configure persistent journal storage in a journald drop-in and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nStorage=persistent\n' > /etc/systemd/journald.conf.d/60-storage.conf
      systemctl restart systemd-journald

      Write the line without spaces around '='; some variants require exactly Storage=persistent.
  - id: "CIS-DEBIAN13-6.1.1.1.6-compress_journald_conf"
    name: "compress journald conf: grep -i Compress= /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.1.6. NIST SP 800-53 Rev. 5: AU-4."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i Compress= /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*\\:Compress\\s*=\\s*yes" }
      - { none: "~ .*\\:Compress\\s*=\\s*[Nn][Oo]" }
    rationale: &rat-fc8701ed62 |
      Compressing large journal entries reduces the disk space the persistent journal needs, so more history fits within the configured limits and the log partition is less likely to fill. Running out of log space leads to lost records or service problems.
    remediation: &rem-bd6851d137 |
      Enable compression of large journal entries in a journald drop-in, remove any Compress=no setting, and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nCompress=yes\n' > /etc/systemd/journald.conf.d/60-compress.conf
      systemctl restart systemd-journald

      Some variants need at least one .conf file in /etc/systemd/journald.conf.d/, which the drop-in provides.
  - id: "CIS-DEBIAN13-6.1.1.2.1-systemd-journal-remote"
    name: "Package systemd-journal-remote is installed"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.2.1. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' systemd-journal-remote 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-c532adb37c |
      systemd-journal-remote provides systemd-journal-upload, which sends journal entries to a central collection server. Installing it is the prerequisite for keeping an off-host copy of the journal when journald is used as the logging solution.
    remediation: &rem-5d5bf76308 |
      Install the package systemd-journal-remote:

      apt-get install systemd-journal-remote
  - id: "CIS-DEBIAN13-6.1.1.2.2-journal_remote_configured-attrs"
    name: "/etc/systemd/journal-upload.conf: exists"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.2.2. NIST SP 800-53 Rev. 5: AU-2, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/journal-upload.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-0e8e20ad09 |
      Logs kept only on the host they describe can be deleted or altered by an attacker who gains root and are lost if the system fails. systemd-journal-upload sends journal entries to a central server; configuring its URL together with a TLS key, certificate and trusted CA makes the transfer authenticated and encrypted.
    remediation: &rem-bc30e412e9 |
      Create /etc/systemd/journal-upload.conf.
  - id: "CIS-DEBIAN13-6.1.1.2.2-journal_remote_configured-content"
    name: "/etc/systemd/journal-upload.conf has the expected content (4 rules)"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.2.2. NIST SP 800-53 Rev. 5: AU-2, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/systemd/journal-upload.conf'
    allow_rc: any
    expect:
      - { some: "~ ^URL=" }
      - { some: "~ ^ServerKeyFile=.*\\.pem$" }
      - { some: "~ ^ServerCertificateFile=.*\\.pem$" }
      - { some: "~ ^TrustedCertificateFile=.*\\.pem$" }
    rationale: *rat-0e8e20ad09
    remediation: &rem-93f97c52ef |
      Edit /etc/systemd/journal-upload.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^URL=
      - a line matches ^ServerKeyFile=.*\.pem$
      - a line matches ^ServerCertificateFile=.*\.pem$
      - a line matches ^TrustedCertificateFile=.*\.pem$
  - id: "CIS-DEBIAN13-6.1.1.2.3-systemd-journal-upload.service-enabled"
    name: "Service systemd-journal-upload.service is enabled"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.2.3. NIST SP 800-53 Rev. 5: AU-2, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journal-upload.service | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-b770b19f4c |
      Logs kept only on the host can be deleted or altered by an attacker who gains root. Running systemd-journal-upload continuously ships journal entries to a remote collector, preserving them off-host. It is only relevant where systemd-journal-remote is the chosen central logging method rather than rsyslog.
    remediation: &rem-c6c7c65dbe |
      Enable the service systemd-journal-upload.service:

      systemctl enable systemd-journal-upload.service
  - id: "CIS-DEBIAN13-6.1.1.2.3-systemd-journal-upload.service-running"
    name: "Service systemd-journal-upload.service is running"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.2.3. NIST SP 800-53 Rev. 5: AU-2, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journal-upload.service | cut -d= -f2
    expect: "== active"
    rationale: *rat-b770b19f4c
    remediation: &rem-7f8e123d83 |
      Start the service systemd-journal-upload.service:

      systemctl start systemd-journal-upload.service
  - id: "CIS-DEBIAN13-6.1.1.2.4-systemd-journal-remote.service-running"
    name: "Service systemd-journal-remote.service is not running"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journal-remote.service | cut -d= -f2
    expect: "!= active"
    rationale: &rat-64ce008fa2 |
      systemd-journal-remote receives journal data from other hosts over the network. On a system that is not a central log collector, running it exposes an unneeded network service and lets other machines write data to local disk. Keeping it stopped and disabled reduces the attack surface.
    remediation: &rem-247935200f |
      Stop the service systemd-journal-remote.service, unless the system needs it:

      systemctl stop systemd-journal-remote.service
  - id: "CIS-DEBIAN13-6.1.1.2.4-systemd-journal-remote.socket-enabled"
    name: "Service systemd-journal-remote.socket is not enabled"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journal-remote.socket | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-87dd56fa7c |
      systemd-journal-remote.socket accepts journal data from other hosts over the network. Only a designated log collector should listen for it; on other systems it is an unnecessary network service that could receive forged logs or be used to fill the disk.
    remediation: &rem-6593464f6f |
      Disable the service systemd-journal-remote.socket, unless the system needs it:

      systemctl disable systemd-journal-remote.socket

      To keep other units from starting it, mask it instead: systemctl mask systemd-journal-remote.socket
  - id: "CIS-DEBIAN13-6.1.1.2.4-systemd-journal-remote.socket-running"
    name: "Service systemd-journal-remote.socket is not running"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journal-remote.socket | cut -d= -f2
    expect: "!= active"
    rationale: *rat-87dd56fa7c
    remediation: &rem-965b15f40c |
      Stop the service systemd-journal-remote.socket, unless the system needs it:

      systemctl stop systemd-journal-remote.socket
  - id: "CIS-DEBIAN13-6.1.1.2.4-journald_service_masked"
    name: "journald service masked: systemctl is-enabled systemd-journal-remote.socket"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl is-enabled systemd-journal-remote.socket
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ ^masked" }
    rationale: &rat-85e968de87 |
      Masking systemd-journal-remote.socket links the unit to /dev/null, so it cannot be started at all, not by hand, as a dependency or through socket activation. On hosts that are not log collectors this guarantees that the network receiver for journal data stays off.
    remediation: &rem-29841157e2 |
      Stop and mask the systemd-journal-remote units unless this host is a central log collector.

      systemctl stop systemd-journal-remote.socket systemd-journal-remote.service
      systemctl mask systemd-journal-remote.socket systemd-journal-remote.service

      Masking also works when the package is not installed.
  - id: "CIS-DEBIAN13-6.1.1.2.4-journald_socket_masked"
    name: "journald socket masked: systemctl is-enabled systemd-journal-remote.socket"
    description: "CIS Debian 13 benchmark recommendation 6.1.1.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl is-enabled systemd-journal-remote.socket
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ ^masked" }
    rationale: &rat-9ba854dbda |
      systemd-journal-remote.socket lets the host receive journal entries from other systems. Masking it on systems that are not log collectors prevents the listener from being started, even indirectly by another unit, and removes an unnecessary network service.
    remediation: &rem-2d1745ded8 |
      Unless this host collects journals from other systems, stop the journal remote receiver and mask its socket and service so that they cannot be started.

      systemctl stop systemd-journal-remote.socket systemd-journal-remote.service
      systemctl mask systemd-journal-remote.socket systemd-journal-remote.service
  - id: "CIS-DEBIAN13-6.1.2.1-rsyslog"
    name: "Package rsyslog is installed"
    description: "CIS Debian 13 benchmark recommendation 6.1.2.1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' rsyslog 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-ec4e2f2832 |
      rsyslog collects log messages from the kernel, services and applications, writes them to files and can forward them to a central log server. Without an installed, enabled and running syslog daemon, security-relevant events are not recorded in a durable way and incidents cannot be investigated.
    remediation: &rem-f12d1ee716 |
      Install the package rsyslog:

      apt-get install rsyslog
  - id: "CIS-DEBIAN13-6.1.2.2-rsyslog_service-enabled"
    name: "Service rsyslog.service is enabled"
    description: "CIS Debian 13 benchmark recommendation 6.1.2.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState rsyslog.service | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-4a8a79b453 |
      Where rsyslog is the chosen logging solution, it has to be enabled and running so that messages are written to log files and forwarded as configured. A stopped daemon means events are lost and security incidents go unrecorded.
    remediation: &rem-cd4a6a7cfa |
      Enable the service rsyslog.service:

      systemctl enable rsyslog.service
  - id: "CIS-DEBIAN13-6.1.2.2-rsyslog_service-running"
    name: "Service rsyslog.service is running"
    description: "CIS Debian 13 benchmark recommendation 6.1.2.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState rsyslog.service | cut -d= -f2
    expect: "== active"
    rationale: *rat-4a8a79b453
    remediation: &rem-8e9bdb3a16 |
      Start the service rsyslog.service:

      systemctl start rsyslog.service
  - id: "CIS-DEBIAN13-6.1.2.3-forward_journald_conf"
    name: "forward journald conf: systemd-analyze cat-config systemd/journald.conf | grep -Ei '^\\s*ForwardToSyslog\\s*=' | t…"
    description: "CIS Debian 13 benchmark recommendation 6.1.2.3. NIST SP 800-53 Rev. 5: AC-3, AU-2, AU-4, AU-12, MP-2."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemd-analyze cat-config systemd/journald.conf | grep -Ei '^\s*ForwardToSyslog\s*=' | tail -1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^\\s*ForwardToSyslog\\s*=\\s*yes\\s*$" }
    rationale: &rat-143e885d75 |
      When rsyslog is the log processor, journald must forward messages to it, otherwise events never reach the syslog files and remote collectors configured there. Setting ForwardToSyslog=yes makes sure all journal messages are also handled by rsyslog.
    remediation: &rem-59256c1df4 |
      Configure journald to forward messages to the syslog daemon in a drop-in and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nForwardToSyslog=yes\n' > /etc/systemd/journald.conf.d/60-forward.conf
      systemctl restart systemd-journald

      Remove any ForwardToSyslog=no line from /etc/systemd/journald.conf and other drop-ins. The Ubuntu 20.04 check reads only /etc/systemd/journald.conf itself, so set the option there as well:

      sed -i -E 's/^#?\s*ForwardToSyslog\s*=.*/ForwardToSyslog=yes/' /etc/systemd/journald.conf
      grep -q '^ForwardToSyslog=yes' /etc/systemd/journald.conf || sed -i '/^\[Journal\]/a ForwardToSyslog=yes' /etc/systemd/journald.conf
      systemctl restart systemd-journald
  - id: "CIS-DEBIAN13-6.1.2.4-perms_rsyslog_d"
    name: "perms rsyslog d: grep -s ^\\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf | cut -f2 -d:"
    description: "CIS Debian 13 benchmark recommendation 6.1.2.4. NIST SP 800-53 Rev. 5: AC-3, AC-6, MP-2."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -s ^\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf | cut -f2 -d:
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ \\$FileCreateMode 06[0-4]0" }
      - { none: "~ \\$FileCreateMode 06[6-7][0-7]" }
    rationale: &rat-2b2fc7d019 |
      Log files often contain sensitive information such as user names, host names and error details. Setting $FileCreateMode to 0640 or stricter ensures that log files created by rsyslog are not readable or writable by arbitrary users, who could otherwise gather information or tamper with evidence.
    remediation: &rem-aa234ce03e |
      Make rsyslog create log files with mode 0640 by setting $FileCreateMode in a drop-in file that is read before the logging rules, and change every other $FileCreateMode line to 0640 as well.

      grep -n 'FileCreateMode' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      echo '$FileCreateMode 0640' > /etc/rsyslog.d/00-filecreatemode.conf
      systemctl restart rsyslog

      The mode applies to files created after the restart; correct existing log files separately.
  - id: "CIS-DEBIAN13-6.1.2.5-rsyslog_logging-attrs"
    name: "/etc/rsyslog.conf: exists"
    description: "CIS Debian 13 benchmark recommendation 6.1.2.5. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/rsyslog.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ac253987a0 |
      Sorting messages by facility and priority into dedicated files, such as authentication, mail, cron and warnings, makes relevant events easy to find and allows different retention and permissions per category. Emergency messages are also broadcast to logged-in users. A defined rule set ensures important events are recorded rather than lost.
    remediation: &rem-d45052d244 |
      Create /etc/rsyslog.conf.
  - id: "CIS-DEBIAN13-6.1.2.5-rsyslog_logging-content"
    name: "/etc/rsyslog.conf has the expected content (13 rules)"
    description: "CIS Debian 13 benchmark recommendation 6.1.2.5. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/rsyslog.conf'
    allow_rc: any
    expect:
      - { some: "~ ^\\*.emerg\\s+:omusrmsg:\\*" }
      - { some: "~ ^auth,authpriv\\.\\*\\s+/var/log/secure" }
      - { some: "~ ^mail.\\*\\s+-/var/log/mail" }
      - { some: "~ ^mail.info\\s+-/var/log/mail.info" }
      - { some: "~ ^mail.err\\s+/var/log/mail.err" }
      - { some: "~ ^cron.\\*\\s+/var/log/cron" }
      - { some: "~ ^\\*\\.=warning;\\*\\.=err\\s+-/var/log/warn" }
      - { some: "~ ^\\*\\.crit\\s+/var/log/warn" }
      - { some: "~ ^\\*\\.\\*;mail\\.none;news\\.none\\s+-/var/log/messages" }
      - { some: "~ ^local0,local1.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local2,local3.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local4,local5.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local6,local7.\\*\\s+-/var/log/localmessages" }
    rationale: *rat-ac253987a0
    remediation: &rem-a55813b69a |
      Edit /etc/rsyslog.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\*.emerg\s+:omusrmsg:\*
      - a line matches ^auth,authpriv\.\*\s+/var/log/secure
      - a line matches ^mail.\*\s+-/var/log/mail
      - a line matches ^mail.info\s+-/var/log/mail.info
      - a line matches ^mail.err\s+/var/log/mail.err
      - a line matches ^cron.\*\s+/var/log/cron
      - a line matches ^\*\.=warning;\*\.=err\s+-/var/log/warn
      - a line matches ^\*\.crit\s+/var/log/warn
      - a line matches ^\*\.\*;mail\.none;news\.none\s+-/var/log/messages
      - a line matches ^local0,local1.\*\s+-/var/log/localmessages
      - a line matches ^local2,local3.\*\s+-/var/log/localmessages
      - a line matches ^local4,local5.\*\s+-/var/log/localmessages
      - a line matches ^local6,local7.\*\s+-/var/log/localmessages
  - id: "CIS-DEBIAN13-6.1.2.7-local_syslog_input"
    name: "local syslog input: grep -E \"imtcp\\\" port|InputTCPServerRun\" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -…"
    description: "CIS Debian 13 benchmark recommendation 6.1.2.7. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12, CM-6."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "imtcp\" port|InputTCPServerRun" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -v ":#"
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-46d6ea0433 |
      rsyslog can accept log messages from other hosts over TCP. On a system that is not a designated log server, such a listener opens an unneeded network port and lets anyone who can reach it inject forged log entries or fill the disk.
    remediation: &rem-30523f0cee |
      Remove the TCP input definitions from the rsyslog configuration, or comment them out with # as the first character of the line, then restart rsyslog.

      grep -En 'imtcp" port|InputTCPServerRun' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      systemctl restart rsyslog

      Lines to disable look like input(type="imtcp" port="514") or $InputTCPServerRun 514. Keep them only on dedicated log servers.
  - id: "CIS-DEBIAN13-6.1.2.7-local_syslog_module"
    name: "local syslog module: grep \"imtcp\" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -Ev \":#|port=\""
    description: "CIS Debian 13 benchmark recommendation 6.1.2.7. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12, CM-6."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "imtcp" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -Ev ":#|port="
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-035740240e |
      Loading rsyslog's imtcp module is the first step to accepting log messages from the network. On a system that is not a designated log server the module is not needed, and leaving it loaded makes it easy to open a listener by accident. Not loading it keeps the host from receiving remote log data.
    remediation: &rem-2c410b4533 |
      Remove the lines that load the imtcp module, or comment them out with # as the first character of the line, then restart rsyslog.

      grep -n 'imtcp' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      systemctl restart rsyslog

      Lines to disable look like module(load="imtcp") or $ModLoad imtcp. The check ignores a commented line only if the # is at the very start.
  - id: "CIS-DEBIAN13-6.1.2.8-rsyslog_logrotate"
    name: "rsyslog logrotate: echo \"Manual | please check file rotaton matches site policy - logrotate\""
    description: "CIS Debian 13 benchmark recommendation 6.1.2.8. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual | please check file rotaton matches site policy - logrotate"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Manual" }
    rationale: &rat-17eb210ea2 |
      Log files that are never rotated grow until they fill the file system, which can stop logging or crash services, while overly aggressive rotation discards records needed for investigations. A logrotate policy for the rsyslog files that matches the site's retention requirements keeps logs available for the required period without exhausting disk space.
    remediation: &rem-648542e71a |
      Review the logrotate configuration for the files rsyslog writes (/etc/logrotate.d/rsyslog, or /etc/logrotate.d/syslog on older Red Hat releases) and adjust frequency, number of rotations and compression to the site's retention policy.

      cat /etc/logrotate.d/rsyslog
      logrotate -d /etc/logrotate.d/rsyslog

      Typical settings in the file's block are weekly, rotate 4, compress, missingok and notifempty. Most variants of this check are manual reminders that report a failure until the review is accepted.
  - id: "CIS-DEBIAN13-6.1.2.9-rsyslog-gnutls"
    name: "Package rsyslog-gnutls is installed"
    description: "CIS Debian 13 benchmark recommendation 6.1.2.9. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      dpkg-query -W -f='${Status}' rsyslog-gnutls 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-9b31e4ddd5 |
      The rsyslog-gnutls package provides the TLS network stream driver for rsyslog. It is required to encrypt log forwarding so that log data cannot be read or altered in transit.
    remediation: &rem-08b48b8426 |
      Install the package rsyslog-gnutls:

      apt-get install rsyslog-gnutls
  - id: "CIS-DEBIAN13-6.1.2.10-forwarding_gtls"
    name: "forwarding gtls: grep -Psi -- '^\\h*StreamDriver=\\\"gtls\\\"' /etc/rsyslog.conf /etc/rsyslog.d/*.conf"
    description: "CIS Debian 13 benchmark recommendation 6.1.2.10. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*StreamDriver=\"gtls\"' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ StreamDriver=\"gtls\"" }
      - { some: "~ StreamDriverAuthMode=\"anon\"" }
      - { some: "~ StreamDriverMode=\"1\"" }
    rationale: &rat-9ae7ad8bb3 |
      Log messages sent to a remote server over plain TCP or UDP can be read or altered in transit, and they often contain sensitive information. Forwarding through rsyslog's gtls stream driver encrypts the connection with TLS. The anon authentication mode encrypts but does not verify the server's identity; x509/name mode adds that protection.
    remediation: &rem-7b456be1c6 |
      Configure the forwarding action to use TLS and restart rsyslog. StreamDriver, StreamDriverMode and StreamDriverAuthMode must be on one line that begins with StreamDriver="gtls", because the check only looks at that line.

      apt-get install rsyslog-gnutls
      cat > /etc/rsyslog.d/60-remote-tls.conf <<'EOF'
      *.* action(type="omfwd" target="loghost.example.com" port="6514" protocol="tcp"
          StreamDriver="gtls" StreamDriverMode="1" StreamDriverAuthMode="anon")
      EOF
      systemctl restart rsyslog

      Replace loghost.example.com with the site's log server. The check accepts only the anon mode.
  - id: "CIS-DEBIAN13-6.1.2.11-rsyslog_ca"
    name: "rsyslog ca: grep -Psi -- 'DefaultNetstreamDriverCAFile' /etc/rsyslog.conf /etc/rsyslog.d/*.conf"
    description: "CIS Debian 13 benchmark recommendation 6.1.2.11. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- 'DefaultNetstreamDriverCAFile' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ global\\(DefaultNetstreamDriverCAFile=\"/change/me/to/correct/path\"\\)" }
    rationale: &rat-788ef9bf30 |
      For TLS-protected log forwarding rsyslog needs to know which certificate authority to trust. DefaultNetstreamDriverCAFile points to that CA certificate; without a correct one, server certificates cannot be verified, and encrypted forwarding either fails or runs without authentication.
    remediation: &rem-10ae6b01e5 |
      Set the global CA file of rsyslog's TLS driver to the CA certificate that signed the log server's certificate, then restart rsyslog.

      echo 'global(DefaultNetstreamDriverCAFile="/etc/ssl/certs/loghost-ca.pem")' > /etc/rsyslog.d/50-tls-ca.conf
      systemctl restart rsyslog

      The check as written accepts only the literal placeholder path /change/me/to/correct/path, so it reports a failure for any real CA file.
  - id: "CIS-DEBIAN13-6.1.3.1-logfile_configured"
    name: "logfile configured: find /var/log/ -type f \\( -name 'lastlog' -o -name 'wtmp' -o -name 'btmp' \\) -perm /g+x,o…"
    description: "CIS Debian 13 benchmark recommendation 6.1.3.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /var/log/ -type f \( -name 'lastlog' -o -name 'wtmp' -o -name 'btmp' \) -perm /g+x,o+wx -exec ls -l "{}" + ; find /var/log/ -type f \( -name 'secure' -o -name 'auth*' -o -name 'syslog' -o -name 'messages' \) -perm /u+x,g+wx,o+rwx -exec ls -l "{}" +; find /var/log/ -type f \( -name 'SSSD' -o -name 'sssd' -o -name 'gdm*' \) -perm /ug+x,o+rwx -exec ls -l "{}" +
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-0de5450138 |
      Log files can contain sensitive data and are important evidence after a security incident. If they are writable or readable by unauthorised users, information leaks and logs can be altered or deleted to hide an attack. Access to files under /var/log should be limited to what each kind of log needs.
    remediation: &rem-42ace0ab21 |
      Review every file listed by the check and remove the excess permissions. General and authentication logs should be 0640 or stricter; lastlog, wtmp and btmp may keep group write (0664) for the utmp group.

      chmod u-x,g-wx,o-rwx FILE
      chmod g-x,o-wx /var/log/lastlog /var/log/wtmp /var/log/btmp

      Also adjust the creating service and the create directives in /etc/logrotate.conf and /etc/logrotate.d/, otherwise the permissions come back with the next rotation. On RHEL 7, Ubuntu 18.04 (and for lastlog on Amazon Linux 2023) the check also flags group write on these login records; remove it there with chmod g-w if accepted.
  - id: "CIS-DEBIAN13-6.2.1.1-audispd-plugins"
    name: "Package audispd-plugins is installed"
    description: "CIS Debian 13 benchmark recommendation 6.2.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12, SI-5."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      dpkg-query -W -f='${Status}' audispd-plugins 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-c47e4e0adc |
      audispd-plugins provides plugins for the audit event dispatcher, notably audisp-remote, which forwards audit records to a remote server. Sending audit records off the host protects them from tampering by an attacker who obtains root locally and enables central analysis.
    remediation: &rem-0da9f6bc36 |
      Install the package audispd-plugins:

      apt-get install audispd-plugins
  - id: "CIS-DEBIAN13-6.2.1.1-auditd"
    name: "Package auditd is installed"
    description: "CIS Debian 13 benchmark recommendation 6.2.1.1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12, SI-5."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      dpkg-query -W -f='${Status}' auditd 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-f809f26f23 |
      auditd is the daemon that receives audit events from the kernel and writes them to disk. If it is not installed, enabled and running, audit rules have no effect on the persistent trail, and security events go unrecorded.
    remediation: &rem-829fca5e08 |
      Install the package auditd:

      apt-get install auditd
  - id: "CIS-DEBIAN13-6.2.1.2-auditd-enabled"
    name: "Service auditd is enabled"
    description: "CIS Debian 13 benchmark recommendation 6.2.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p UnitFileState auditd | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-f809f26f23
    remediation: &rem-5d15604058 |
      Enable the service auditd:

      systemctl enable auditd
  - id: "CIS-DEBIAN13-6.2.1.2-auditd-running"
    name: "Service auditd is running"
    description: "CIS Debian 13 benchmark recommendation 6.2.1.2. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p ActiveState auditd | cut -d= -f2
    expect: "== active"
    rationale: *rat-f809f26f23
    remediation: &rem-ce273a00c5 |
      Start the service auditd:

      systemctl start auditd
  - id: "CIS-DEBIAN13-6.2.1.3-audit_default_grub"
    name: "audit default grub: grep audit= /etc/default/grub"
    description: "CIS Debian 13 benchmark recommendation 6.2.1.3. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep audit= /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX_DEFAULT=.*\\saudit=1.*" }
    rationale: &rat-20bfb20320 |
      Processes started before auditd are not audited unless the kernel enables auditing at boot. With audit=1 on the kernel command line, every process gets an audit context from the start, so early activity, including possible tampering during boot, is recorded. Keeping the parameter in /etc/default/grub ensures it survives configuration regeneration and new kernels.
    remediation: &rem-6d379d7c17 |
      Add audit=1 to GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub (append it, not as the first word) and regenerate the GRUB configuration.

      grep -q '^GRUB_CMDLINE_LINUX_DEFAULT=.*audit=1' /etc/default/grub || sed -ri 's/^(GRUB_CMDLINE_LINUX_DEFAULT="[^"]*)"/\1 audit=1"/' /etc/default/grub
      update-grub

      The change takes effect after a reboot. Remove conflicting values (e.g. audit=0) from the line if present.
  - id: "CIS-DEBIAN13-6.2.1.4-audit_backlog_default_grub"
    name: "audit backlog default grub: grep audit_backlog /etc/default/grub"
    description: "CIS Debian 13 benchmark recommendation 6.2.1.4. NIST SP 800-53 Rev. 5: AU-2, AU-12, AU-3."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep audit_backlog /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^GRUB_CMDLINE_LINUX_DEFAULT=.*\\saudit_backlog_limit=(8192|819[3-9]|8[2-9]{,2}|9[0-9]{3,9}|[1-9]{5,9}).*" }
    rationale: &rat-6f061b7300 |
      During boot, audit events are queued in the kernel until auditd starts. If the backlog buffer is too small, events are lost or the kernel may react according to the failure setting. A backlog limit of at least 8192 gives enough room to keep early events. Keeping it in /etc/default/grub ensures it persists.
    remediation: &rem-6eec80b03e |
      Add audit_backlog_limit=8192 to GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub (append it, not as the first word) and regenerate the GRUB configuration.

      grep -q '^GRUB_CMDLINE_LINUX_DEFAULT=.*audit_backlog_limit=8192' /etc/default/grub || sed -ri 's/^(GRUB_CMDLINE_LINUX_DEFAULT="[^"]*)"/\1 audit_backlog_limit=8192"/' /etc/default/grub
      update-grub

      The change takes effect after a reboot. Remove conflicting values (e.g. a smaller audit_backlog_limit) from the line if present.
  - id: "CIS-DEBIAN13-6.2.2.1-max_log_auditd_conf"
    name: "max log auditd conf: grep max_log_file /etc/audit/auditd.conf"
    description: "CIS Debian 13 benchmark recommendation 6.2.2.1. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep max_log_file /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^max_log_file = \\d\\d+" }
    rationale: &rat-3aaf4ad791 |
      max_log_file defines the size at which an audit log file is rotated. A deliberate size, together with the rotation action, controls how much audit history is kept and prevents single log files from becoming unmanageable or rotating too often to preserve evidence.
    remediation: &rem-6c2bac235c |
      Set max_log_file (size in MB) in /etc/audit/auditd.conf to a value that fits the site policy, e.g. 32.

      sed -ri 's/^\s*max_log_file\s*=.*/max_log_file = 32/' /etc/audit/auditd.conf
      grep -q '^max_log_file = ' /etc/audit/auditd.conf || echo 'max_log_file = 32' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      SIGHUP makes auditd reread its configuration. Most variants require the exact format 'max_log_file = NN' with at least two digits.
  - id: "CIS-DEBIAN13-6.2.2.2-max_log_action_auditd_conf"
    name: "max log action auditd conf: grep max_log_file_action /etc/audit/auditd.conf"
    description: "CIS Debian 13 benchmark recommendation 6.2.2.2. NIST SP 800-53 Rev. 5: AU-8."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep max_log_file_action /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ max_log_file_action = keep_logs" }
    rationale: &rat-2c8c6634dd |
      When an audit log reaches its maximum size, the default action rotates and eventually deletes old logs, losing audit history. keep_logs rotates without deleting, so no audit records are discarded automatically. Disk usage must then be monitored, because logs accumulate until archived.
    remediation: &rem-604d9d4f57 |
      Set max_log_file_action to keep_logs in /etc/audit/auditd.conf.

      sed -ri 's/^\s*max_log_file_action\s*=.*/max_log_file_action = keep_logs/' /etc/audit/auditd.conf
      grep -q '^max_log_file_action = ' /etc/audit/auditd.conf || echo 'max_log_file_action = keep_logs' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      SIGHUP makes auditd reread its configuration. Archive old audit logs regularly to avoid filling the disk.
  - id: "CIS-DEBIAN13-6.2.2.3-logs_full_auditd_conf-attrs"
    name: "/etc/audit/auditd.conf: exists"
    description: "CIS Debian 13 benchmark recommendation 6.2.2.3. NIST SP 800-53 Rev. 5: AU-2, AU-8, AU-12, SI-5."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-70577f0aa7 |
      If the audit log partition fills up or a disk error occurs, auditing can silently stop and later actions go unrecorded. Halting or switching to single-user mode on a full disk, and at least reporting disk errors, guarantees that the system does not keep running without an audit trail. The trade-off is reduced availability, so audit storage must be sized and monitored.
    remediation: &rem-fdf1d22c95 |
      Create /etc/audit/auditd.conf.
  - id: "CIS-DEBIAN13-6.2.2.3-logs_full_auditd_conf-content"
    name: "/etc/audit/auditd.conf has the expected content (2 rules)"
    description: "CIS Debian 13 benchmark recommendation 6.2.2.3. NIST SP 800-53 Rev. 5: AU-2, AU-8, AU-12, SI-5."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect:
      - { some: "~ ^\\s*disk_full_action\\s*=\\s*(halt|single)" }
      - { some: "~ ^\\s*disk_error_action\\s*=\\s*(syslog|halt|single)" }
    rationale: *rat-70577f0aa7
    remediation: &rem-870b36f8c5 |
      Edit /etc/audit/auditd.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*disk_full_action\s*=\s*(halt|single)
      - a line matches ^\s*disk_error_action\s*=\s*(syslog|halt|single)
  - id: "CIS-DEBIAN13-6.2.2.4-logs_low_space_auditd_conf"
    name: "logs low space auditd conf: grep space_left_action /etc/audit/auditd.conf"
    description: "CIS Debian 13 benchmark recommendation 6.2.2.4. NIST SP 800-53 Rev. 5: AU-2, AU-8, AU-12, SI-5."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep space_left_action /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ space_left_action\\s*=\\s*(email|exec|single|halt)" }
      - { some: "~ admin_space_left_action\\s*=\\s*(halt|single)" }
    rationale: &rat-35cb8a9517 |
      Low disk space on the audit partition is the warning sign before audit records are lost. Notifying administrators when space_left is reached, and switching to single-user mode or halting at admin_space_left, ensures someone reacts before auditing fails. Halting affects availability, so monitoring and capacity planning matter.
    remediation: &rem-63eb66207c |
      Set space_left_action to email (or exec, single, halt) and admin_space_left_action to single (or halt) in /etc/audit/auditd.conf.

      sed -ri 's/^\s*space_left_action\s*=.*/space_left_action = email/' /etc/audit/auditd.conf
      grep -q '^space_left_action = ' /etc/audit/auditd.conf || echo 'space_left_action = email' >> /etc/audit/auditd.conf
      sed -ri 's/^\s*admin_space_left_action\s*=.*/admin_space_left_action = single/' /etc/audit/auditd.conf
      grep -q '^admin_space_left_action = ' /etc/audit/auditd.conf || echo 'admin_space_left_action = single' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      email needs a working local mail transfer agent and action_mail_acct; SIGHUP makes auditd reread its configuration.
  - id: "CIS-DEBIAN13-6.2.3.1-auditd_admin_scope_cnf"
    name: "auditd admin scope cnf: grep scope /etc/audit/rules.d/*.rules"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.1. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep scope /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S all -F path=/etc/sudoers -F perm=wa -k scope" }
      - { some: "~ -a always,exit -F arch=b64 -S all -F dir=/etc/sudoers\\.d -F perm=wa -k scope" }
    rationale: &rat-7172c39fee |
      Changes to /etc/sudoers and /etc/sudoers.d alter who may run which commands with elevated privileges. Audit rules that record every write or attribute change to these files make unauthorised privilege grants detectable. This check verifies that the rules are part of the persistent audit configuration.
    remediation: &rem-06ec31c075 |
      Watch the sudoers configuration for changes: add the rules for your release to /etc/audit/rules.d/50-scope.rules and load them.

      Debian 11, Debian 12, Ubuntu 20.04 and Ubuntu 24.04:
      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d -p wa -k scope

      Debian 13:
      -a always,exit -F arch=b64 -S all -F path=/etc/sudoers -F perm=wa -k scope
      -a always,exit -F arch=b64 -S all -F dir=/etc/sudoers.d -F perm=wa -k scope

      Ubuntu 18.04 and Ubuntu 22.04:
      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d/ -p wa -k scope

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
  - id: "CIS-DEBIAN13-6.2.3.1-auditd_admin_scope_live"
    name: "auditd admin scope live: auditctl -l | grep scope"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.1. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      auditctl -l | grep scope
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S all -F path=/etc/sudoers -F perm=wa -F key=scope" }
      - { some: "~ -a always,exit -F arch=b64 -S all -F dir=/etc/sudoers\\.d -F perm=wa -F key=scope" }
    rationale: &rat-6dc7f1b6de |
      Changes to /etc/sudoers and /etc/sudoers.d alter who may run which commands with elevated privileges. Audit rules that record every write or attribute change to these files make unauthorised privilege grants detectable. This check verifies that the rules are loaded in the running kernel.
    remediation: *rem-06ec31c075
  - id: "CIS-DEBIAN13-6.2.3.2-auditd_other_user_cnf"
    name: "auditd other user cnf: grep user_emu /etc/audit/rules.d/*.rules"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.2. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep user_emu /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -C euid!=uid -F auid!=(unset|-1|auid!=4294967295) -S execve -k user_emulation" }
    rationale: &rat-3e66a57501 |
      Running commands under another user's identity, for example through sudo or other setuid programs, is the main way elevated privileges are exercised. Auditing execve calls whose effective user ID differs from the real one records who ran what as someone else, which is essential for accountability and for detecting misuse of privilege.
    remediation: &rem-6f78d29c89 |
      Add the following rules to a file in /etc/audit/rules.d/ and load them.

      printf '%s\n' '-a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation' '-a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation' > /etc/audit/rules.d/50-user_emulation.rules
      augenrules --load
      auditctl -l | grep user_emulation

      If the audit configuration is immutable (-e 2 in the rules), a reboot is needed before the new rules become active.
