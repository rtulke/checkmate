  - id: "CIS-DEBIAN13-1.1.2.1.4-tmp_noexec_options"
    name: "/tmp is a separate mount with noexec"
    description: "CIS Debian 13 benchmark recommendation 1.1.2.1.4. NIST SP 800-53 Rev. 5: CM-7, AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
