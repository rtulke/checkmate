  - id: "CIS-DEBIAN13-5.1.20-ssh_empty_passwd-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Debian 13 benchmark recommendation 5.1.20. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-861378e10c |
      If an account has an empty password and sshd accepts it, anyone can log in to that account remotely without a credential. PermitEmptyPasswords no makes sshd refuse such logins regardless of how the account is configured.
    remediation: *rem-f6392187bb
  - id: "CIS-DEBIAN13-5.1.20-ssh_empty_passwd-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Debian 13 benchmark recommendation 5.1.20. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
