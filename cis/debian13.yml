      rm '/etc/at.deny'
  - id: "CIS-DEBIAN13-3.1.1-default_grub_ipv6"
    name: "default grub ipv6: cat /sys/module/ipv6/parameters/disable"
    description: "CIS Debian 13 benchmark recommendation 3.1.1. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
