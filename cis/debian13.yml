    rationale: &rat-913c4effb9 |
      init_module and finit_module load code into the running kernel. Auditing these calls for user sessions records every module load, which is essential for detecting rootkits and unauthorized drivers. This variant inspects the rules currently loaded in the kernel, so it also catches rule files that were never loaded.
