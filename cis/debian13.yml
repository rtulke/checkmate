  - id: "CIS-DEBIAN13-6.2.3.10-auditd_priv_cmds_cnf"
    name: "auditd priv cmds cnf: grep -hsqE -- '^-a always,exit -F path=[^[:space:]]+ -F perm=x -F auid\u003e=[0-9]+ -F auid!=u…"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.10. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -hsqE -- '^-a always,exit -F path=[^[:space:]]+ -F perm=x -F auid>=[0-9]+ -F auid!=unset -k privileged$' /etc/audit/rules.d/*.rules || echo "MISSING privileged command rules"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-8e8800ac94 |
      Programs with the setuid or setgid bit run with the privileges of their owner or group and are a common route for privilege escalation. Auditing every execution of these programs by regular users shows who used elevated privileges and helps detect misuse of vulnerable binaries.
    remediation: &rem-c3e83b859d |
      Generate an audit rule for every setuid and setgid program on the local file systems, write the rules to a file in /etc/audit/rules.d/ and load them. Repeat this whenever software that installs such programs is added.

      UID_MIN=$(awk '/^\s*UID_MIN/ {print $2}' /etc/login.defs)
      df --local -P | awk 'NR > 1 {print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm /6000 2>/dev/null | sort -u | awk -v m="${UID_MIN:-1000}" '{print "-a always,exit -F path=" $0 " -F perm=x -F auid>=" m " -F auid!=unset -k privileged"}' > /etc/audit/rules.d/50-privileged.rules
      augenrules --load

      On Amazon Linux 2/2023, RHEL 8 to 10 and Debian 11 this is a manual check that always asks for a review. On RHEL 7, SUSE 15 and Ubuntu 18.04/20.04 the check only looks for an audit rule containing the word delete, which the file deletion rules provide. If the audit configuration is immutable (-e 2), reboot to activate the rules.
  - id: "CIS-DEBIAN13-6.2.3.10-auditd_priv_cmds_live"
    name: "auditd priv cmds live: auditctl -l 2\u003e/dev/null | grep -E -- 'path=[^[:space:]]+' | grep -E -- 'perm=x' | grep -q…"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.10. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      auditctl -l 2>/dev/null | grep -E -- 'path=[^[:space:]]+' | grep -E -- 'perm=x' | grep -qE -- '(-k|key=)[[:space:]]?privileged([[:space:]]|$)' || echo "MISSING privileged command rules"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-3d16135cb3 |
      Setuid and setgid programs run with elevated privileges regardless of who starts them, so their use by regular users is a key indicator of privilege use and possible abuse. Auditing every execution of these programs by logged-in users records who exercised elevated rights and when.
    remediation: &rem-00cd8312ab |
      Generate an audit rule for every setuid and setgid program, load the rules, and repeat this whenever software adds new privileged binaries.

      find / -xdev \( -perm -4000 -o -perm -2000 \) -type f | awk '{print "-a always,exit -F path=" $1 " -F perm=x -F auid>=1000 -F auid!=unset -k privileged"}' > /etc/audit/rules.d/50-privileged.rules
      augenrules --load
      auditctl -l | grep privileged

      Run the find for every other local file system mounted without nosuid as well and append its output. If the audit configuration is immutable (-e 2 in the rules), a reboot is needed before the new rules become active.
  - id: "CIS-DEBIAN13-6.2.3.11-auditd_access_cnf"
    name: "auditd access cnf: grep access /etc/audit/rules.d/*.rules"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.11. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep access /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ [^#]-a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid\u003e=1000 -F auid!=(unset|-1|auid!=4294967295) -k access" }
      - { some: "~ [^#]-a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid\u003e=1000 -F auid!=(unset|-1|auid!=4294967295) -k access" }
    rationale: &rat-b0a74a2a93 |
      Repeated attempts to open, create or truncate files that fail with permission errors often indicate that someone is probing for data they are not allowed to access. Auditing these failures for regular users makes such attempts visible. This check verifies the persistent audit configuration.
    remediation: &rem-4c1188adcf |
      Record file access attempts that fail because of missing permissions: add the rules for your release to /etc/audit/rules.d/50-access.rules and load them.

      Debian 11, Debian 12, Ubuntu 20.04, Ubuntu 22.04 and Ubuntu 24.04:
      -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access
      -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access
      -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access
      -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access

      Debian 13:
      -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access
      -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access

      Ubuntu 18.04:
      -a always,exit -F arch=b64 -S creat -S open -S openat -S truncate -S ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=4294967295 -k access
      -a always,exit -F arch=b64 -S creat -S open -S openat -S truncate -S ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=4294967295 -k access
      -a always,exit -F arch=b32 -S creat -S open -S openat -S truncate -S ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=4294967295 -k access
      -a always,exit -F arch=b32 -S creat -S open -S openat -S truncate -S ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=4294967295 -k access

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
