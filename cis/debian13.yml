      f='/etc/shells'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-124d473497 |
      /etc/shells defines which shells are valid login shells. If others could modify it, they could add arbitrary programs as accepted shells and influence which accounts are allowed by services that rely on this list.
    remediation: &rem-118b2e8d3a |
      Create /etc/shells if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/shells'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/shells'
  - id: "CIS-DEBIAN13-7.1.10-etc_security_opasswd__old_perms-attrs"
    name: "/etc/security/opasswd.old: mode 0600 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 7.1.10. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/security/opasswd.old'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-3e5b7e6c6b |
      /etc/security/opasswd stores hashes of previous passwords for history checks, and opasswd.old is its backup. Exposing these hashes allows offline cracking, which reveals the patterns users tend to reuse. Only root should be able to read or modify the file.
    remediation: &rem-c04eb468d2 |
      Create /etc/security/opasswd.old if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/security/opasswd.old'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/security/opasswd.old'
  - id: "CIS-DEBIAN13-7.1.10-etc_security_opasswd_perms-attrs"
    name: "/etc/security/opasswd: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 7.1.10. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/security/opasswd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-c97f0a9796 |
      /etc/security/opasswd stores the hashes of previous passwords for the password history check. If it were readable by others, old hashes could be cracked and reveal password patterns; if writable, the history could be manipulated.
    remediation: &rem-ea56781c51 |
      Create /etc/security/opasswd if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/security/opasswd'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/security/opasswd'
  - id: "CIS-DEBIAN13-7.1.11-sticky_bit"
    name: "sticky bit: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type d \\( -p…"
    description: "CIS Debian 13 benchmark recommendation 7.1.11. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type d \( -perm -0002 -a ! -perm -1000 \)
    allow_rc: any
    expect:
      - { rc: "in [0, 123]" }
      - { none: "~ .*" }
      - { stderr: "!~ (unknown predicate|invalid|paths must precede)" }
    rationale: &rat-efff70ba56 |
      In a world-writable directory without the sticky bit, any user can delete or rename files owned by others, enabling denial of service and attacks such as swapping a file another process is about to use. The sticky bit limits removal and renaming to the file owner, the directory owner and root, as is standard for /tmp.
    remediation: &rem-2801f3f799 |
      Review each directory reported by the check. Set the sticky bit if it must remain world-writable, otherwise remove the write permission for others.

      chmod a+t DIR
      chmod o-w DIR
  - id: "CIS-DEBIAN13-7.1.12-unowned_ungrouped_dirs"
    name: "unowned ungrouped dirs: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev \\( ! -path \"/…"
    description: "CIS Debian 13 benchmark recommendation 7.1.12. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev \( ! -path "/run/user/*" -a ! -path "/proc/*" -a ! -path "*/containerd/*" -a ! -path "*/kubelet/pods/*" -a ! -path "*/kubelet/plugins/*" -a ! -path "/sys/fs/cgroup/memory/*" -a ! -path "/var/*/private/*" \) \( -nouser -o -nogroup \)
    allow_rc: any
    expect:
      - { rc: "in [0, 123]" }
      - { none: "~ .*" }
      - { stderr: "!~ (unknown predicate|invalid|paths must precede)" }
    rationale: &rat-6853b0549c |
      Files and directories whose owner or group does not match any existing account are usually left over from deleted users or unpacked archives. If a new account later receives the same UID or GID, it silently gains access to that data. Assigning valid owners keeps access control predictable.
    remediation: &rem-87eb4e1869 |
      Review each reported file or directory and assign an existing owner and group, or remove it once it is confirmed to be no longer needed.

      ls -ld PATH
      chown USER:GROUP PATH
  - id: "CIS-DEBIAN13-7.1.13-audit_sgid_suid"
    name: "audit sgid suid: findmnt -Dkerno fstype,target,options | awk '($1 !~ /^[[:space:]]*(nfs|proc|smb|vfat|iso9…"
    description: "CIS Debian 13 benchmark recommendation 7.1.13. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5, AC-3, MP-2."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      findmnt -Dkerno fstype,target,options | awk '($1 !~ /^[[:space:]]*(nfs|proc|smb|vfat|iso9660|efivarfs|selinuxfs)/ && $2 !~ /^\/run\/user\// && $3 !~ /noexec/ && $3 !~ /nosuid/){print $2}' | while IFS= read -r l_mount; do
        find "$l_mount" -xdev -type f \( -perm -4000 -o -perm -2000 \) -print 2>/dev/null
      done | sort -u | while IFS= read -r l_file; do
        echo "reviewed: $l_file"
        l_alt="${l_file#/usr}"
        l_pkg=$(dpkg -S "$l_file" 2>/dev/null || dpkg -S "$l_alt" 2>/dev/null)
        if [ -z "$l_pkg" ]; then
          echo "FAIL: $l_file is not owned by any package"
        else
          dpkg -V "${l_pkg%%:*}" 2>/dev/null | awk -v f="$l_file" -v a="$l_alt" '($NF == f || $NF == a) && $1 ~ /5/ {print "FAIL: " f " differs from its package (" $1 ")"}'
        fi
      done
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { some: "~ ^reviewed: " }
      - { none: "~ ^FAIL:" }
    rationale: &rat-a5e81e314d |
      Programs with the setuid or setgid bit run with the privileges of their owner or group, usually root, so a flaw in such a file or a replaced copy leads directly to privilege escalation. Reviewing these files, and checking that they belong to an installed package and match the packaged version, finds planted or modified privileged binaries.
    remediation: &rem-1c2f76036a |
      Review every reported setuid or setgid file. Reinstall the owning package of files that differ from the packaged version, and remove the special bits from files that do not belong to any package unless they are known to be required.

      dpkg -S FILE
      dpkg -V PACKAGE
      apt-get install --reinstall PACKAGE
      chmod u-s,g-s FILE

      On Debian 12 every setuid or setgid file is listed; review the list and remove the bits from programs the system does not need.
  - id: "CIS-DEBIAN13-7.2.1-accts_use_shadowed"
    name: "accts use shadowed: awk -F: '($2 != \"x\" ) { print $1 \" is not set to shadowed passwords \"}' /etc/passwd"
    description: "CIS Debian 13 benchmark recommendation 7.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($2 != "x" ) { print $1 " is not set to shadowed passwords "}' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-2034accf59 |
      If the password field in /etc/passwd holds a hash instead of the placeholder x, every user can read it, because /etc/passwd is world-readable, and crack it offline. Keeping hashes in /etc/shadow, which only root can read, prevents this exposure.
    remediation: &rem-0f8f7d54a9 |
      Move all password hashes to /etc/shadow, then review the reported accounts again.

      pwconv
      awk -F: '($2 != "x") {print $1}' /etc/passwd

      For any account still listed, set the password field to x with usermod or vipw and give the account a password with passwd USER.
  - id: "CIS-DEBIAN13-7.2.2-nopasswd_shadow"
    name: "nopasswd shadow: cat /etc/shadow | cut -d ':' -f2"
    description: "CIS Debian 13 benchmark recommendation 7.2.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/shadow | cut -d ':' -f2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(\\*|\\!|\\$)" }
      - { none: "~ ^$" }
    rationale: &rat-9a863c273d |
      Every account should either have a password hash stored in /etc/shadow or be explicitly locked. An empty password field allows logging in without credentials, and password hashes kept in the world-readable /etc/passwd can be cracked by any user.
    remediation: &rem-05e12bb74f |
      Make sure every account keeps its password in /etc/shadow and no account has an empty password field: move hashes from /etc/passwd to /etc/shadow with pwconv, then lock or set a password for every account the check reports.

      pwconv
      awk -F: '($2 == "") {print $1}' /etc/shadow
      usermod -L USER
      passwd USER
  - id: "CIS-DEBIAN13-7.2.3-passwd_group_exist"
    name: "passwd group exist: awk -F: '{print $4}' /etc/passwd |sort -u \u003e /tmp/uid \u0026\u0026 awk -F: '{print $3}' /etc/group| …"
    description: "CIS Debian 13 benchmark recommendation 7.2.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '{print $4}' /etc/passwd |sort -u > /tmp/uid && awk -F: '{print $3}' /etc/group| sort -u> /tmp/gid && comm -23 /tmp/uid /tmp/gid && rm -f /tmp/uid /tmp/gid
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-a6fe2c7421 |
      Every primary group referenced in /etc/passwd should exist in /etc/group. Undefined group IDs usually result from manual edits or deleted groups; if the ID is reused later, the new group's members gain access to the affected users' files.
    remediation: &rem-ac0bde3f41 |
      For every user reported by the check, create the missing group with the referenced GID or assign the user an existing primary group.

      grpck -r
      groupadd -g GID GROUP
      usermod -g GROUP USER

      Changing the primary group does not change the ownership of existing files; adjust them if necessary.
  - id: "CIS-DEBIAN13-7.2.4-shadow_group_empty-attrs"
    name: "/etc/group: exists"
    description: "CIS Debian 13 benchmark recommendation 7.2.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/group'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-752bb52dc0 |
      Members of the shadow group can read /etc/shadow and therefore all local password hashes. On Debian-based systems the group should have no members; any user added to it can attempt offline cracking of every local password.
    remediation: &rem-c6eedafd62 |
      Create /etc/group.
  - id: "CIS-DEBIAN13-7.2.4-shadow_group_empty-content"
    name: "/etc/group has the expected content (2 rules)"
    description: "CIS Debian 13 benchmark recommendation 7.2.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/group'
    allow_rc: any
    expect:
      - { some: "~ ^shadow:x:\\d{2,}:$" }
      - { none: "~ ^shadow:x:\\d{2,}:." }
    rationale: *rat-752bb52dc0
    remediation: &rem-20d1afdd85 |
      Edit /etc/group so that its lines meet these conditions (regular expressions):

      - a line matches ^shadow:x:\d{2,}:$
      - no line matches ^shadow:x:\d{2,}:.
  - id: "CIS-DEBIAN13-7.2.5-no_dup_uid"
    name: "no dup uid: cat /etc/passwd | cut -d: -f3 | sort | uniq -d"
    description: "CIS Debian 13 benchmark recommendation 7.2.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/passwd | cut -d: -f3 | sort | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-92a5e740a2 |
      The kernel identifies users by UID, not by name. Several accounts with the same UID share all file ownerships and privileges and cannot be told apart in logs, which undermines accountability.
    remediation: &rem-3997dd9dfb |
      Review every duplicate UID reported by the check, give each account its own UID and assign the files of the former shared UID deliberately.

      awk -F: '($3 == UID) {print $1}' /etc/passwd
      usermod -u NEWUID USER
      find / -xdev -user UID -ls

      usermod adjusts only the home directory; other files owned by the old UID stay with the account that keeps it.
  - id: "CIS-DEBIAN13-7.2.6-no_dup_gid"
    name: "no dup gid: cat /etc/group | cut -d: -f3 | sort | uniq -d"
    description: "CIS Debian 13 benchmark recommendation 7.2.6. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/group | cut -d: -f3 | sort | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-1c1a4afdb8 |
      Groups are identified by GID. Several groups with the same GID share all group permissions, so membership in one silently grants the access rights of the other.
    remediation: &rem-6a315abc33 |
      Review every duplicate GID reported by the check, give each group its own GID and assign the files of the former shared GID deliberately.

      awk -F: '($3 == GID) {print $1}' /etc/group
      groupmod -g NEWGID GROUP
      find / -xdev -group GID -ls

      Files owned by the old GID are not changed automatically; adjust them where they belong to the renumbered group.
  - id: "CIS-DEBIAN13-7.2.7-no_dup_username"
    name: "no dup username: cat /etc/passwd | cut -d: -f1 | sort | uniq -d"
    description: "CIS Debian 13 benchmark recommendation 7.2.7. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/passwd | cut -d: -f1 | sort | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-48bf65be3b |
      Duplicate user names in /etc/passwd make it unpredictable which entry is used for login and which UID a name resolves to. This can lead to wrong file ownership and confusing audit trails.
    remediation: &rem-e93b096dcd |
      Review the duplicate entries for every user name reported by the check and remove or rename the surplus entry in /etc/passwd and /etc/shadow with the locking editors.

      grep -n '^USER:' /etc/passwd
      pwck -r
      vipw
      vipw -s
  - id: "CIS-DEBIAN13-7.2.8-no_dup_groupname"
    name: "no dup groupname: cat /etc/group | cut -d: -f1 | sort | uniq -d"
    description: "CIS Debian 13 benchmark recommendation 7.2.8. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/group | cut -d: -f1 | sort | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-5dd470fed7 |
      Duplicate group names in /etc/group make it unpredictable which GID a group name resolves to. This can lead to wrong access rights when files or memberships are assigned by name.
    remediation: &rem-c9a5680ce7 |
      Review the duplicate entries for every group name reported by the check and remove or rename the surplus entry in /etc/group and /etc/gshadow with the locking editors.

      grep -n '^GROUP:' /etc/group
      grpck -r
      vigr
      vigr -s
  - id: "CIS-DEBIAN13-7.2.9-home_dirs_exist"
    name: "home dirs exist: pwck -r | grep -Ev \"journal|ircd|list|var\\/spool|var\\/www\" | grep \"does not exist\""
    description: "CIS Debian 13 benchmark recommendation 7.2.9. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      pwck -r | grep -Ev "journal|ircd|list|var\/spool|var\/www" | grep "does not exist"
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ does not exist" }
    rationale: &rat-93950236f2 |
      An account whose home directory does not exist gets / as its working directory at login, and some programs then try to create files in unexpected places. Missing home directories also indicate stale accounts. Every account, and in particular every interactive one, should have an existing home directory.
    remediation: &rem-16e7619e2c |
      Create the missing home directory for every account listed by the check with the correct owner and mode, or point the account to an existing directory if it does not need its own home. On several platforms the check also lists system accounts; for those, review whether the account is still needed and prefer usermod -d to an existing directory over creating new directories.

      mkdir -p HOMEDIR
      chown USER: HOMEDIR
      chmod 750 HOMEDIR
      usermod -d EXISTINGDIR USER

      On RHEL 7 the check also requires that home directories of users with UID 1000 to 60000 have mode 750 or 700. On Ubuntu 18.04 every finding of pwck -r fails the check, not only missing home directories.
  - id: "CIS-DEBIAN13-7.2.9-home_dirs_owned"
    name: "home dirs owned: awk -F':' '$3 \u003e= 1000 \u0026\u0026 $3 \u003c= 60000 { print $1 \" \" $6 }' /etc/passwd | while read -r use…"
    description: "CIS Debian 13 benchmark recommendation 7.2.9. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      awk -F':' '$3 >= 1000 && $3 <= 60000 { print $1 " " $6 }' /etc/passwd | while read -r user dir; do if [ "$user" != 'ftpd' ]; then owner=$(stat -L -c "%U" "$dir"); if [ "$owner" != "$user" ]; then echo "home dir for $user owned by $owner"; fi; fi; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-d265418053 |
      A user should own their home directory. If another account owns it, that account controls the user's files, startup scripts and SSH keys and can manipulate them to run code as the user.
    remediation: &rem-9804bc2d06 |
      Make each listed user the owner of their home directory after confirming that the directory really belongs to that user.

      ls -ld HOMEDIR
      chown USER HOMEDIR
  - id: "CIS-DEBIAN13-7.2.9-home_dirs_restrict"
    name: "home dirs restrict: for i in $(getent passwd $(seq 1000 60000) | awk -F: '{print $6}'); do"
    description: "CIS Debian 13 benchmark recommendation 7.2.9. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      for i in $(getent passwd $(seq 1000 60000) | awk -F: '{print $6}'); do
      stat -Lc '%n %a' "$i" 2>/dev/null; done | grep -vE ' (700|750)$'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-38c62d069f |
      Home directories hold private data, shell startup files and credentials such as SSH keys. Modes of 750 or 700 prevent other users from reading or modifying them while still allowing optional group access.
    remediation: &rem-b0aa30ee8d |
      Set the home directory of every interactive user to mode 750 or 700.

      awk -F: '($3 >= 1000 && $3 <= 60000) {print $6}' /etc/passwd | xargs -r stat -c '%a %n'
      chmod 750 HOMEDIR

      Set the default for new home directories as well (HOME_MODE in /etc/login.defs; DIR_MODE in /etc/adduser.conf on Debian and Ubuntu).
  - id: "CIS-DEBIAN13-7.2.10-dot_netrc_perms"
    name: "dot netrc perms: find /home/  \\( -name .netrc -o -name .rhost -o -name .forward \\)"
    description: "CIS Debian 13 benchmark recommendation 7.2.10. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      awk -F: '($3>=1000)&&($7 !~ /(nologin|false)$/){print $6}' /etc/passwd | while read -r d; do
        if [ -d "$d" ]; then find "$d" -xdev  \( -name .netrc -o -name .rhost -o -name .forward \) 2>/dev/null || true; fi
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-d1da7f7d6c |
      .netrc files store login credentials for FTP and other services in clear text, .rhosts files grant password-less remote access, and .forward files can pipe a user's mail into arbitrary commands. All three bypass central account controls and can expose credentials or allow code execution, so they should not exist in home directories unless explicitly approved.
    remediation: &rem-a93153e945 |
      Review every file reported by the check together with its owner. Remove the files that are not required once nothing depends on them, and document any approved exception.

      ls -l FILE
      rm FILE

      The check reports these files regardless of their permissions.
