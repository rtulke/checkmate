      -w /var/log/faillog -p wa -k logins
      -w /var/log/lastlog -p wa -k logins
      -w /var/log/tallylog -p wa -k logins

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
