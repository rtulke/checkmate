    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/fstab'
    allow_rc: any
    expect: { some: "~ ^\\s*[^#\\s]\\S*\\s+\\/var\\/log\\/audit\\s+\\S+\\s+\\S*\\bnoexec\\b" }
    rationale: *rat-e14e9c282f
    remediation: &rem-a7a534bc05 |
      Edit /etc/fstab so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*[^#\s]\S*\s+\/var\/log\/audit\s+\S+\s+\S*\bnoexec\b
  - id: "CIS-DEBIAN13-1.2.1.1-sources_signed_by"
    name: "sources signed by: find /etc/apt/sources.list /etc/apt/sources.list.d/ -maxdepth 1 -type f \\"
    description: "CIS Debian 13 benchmark recommendation 1.2.1.1. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /etc/apt/sources.list /etc/apt/sources.list.d/ -maxdepth 1 -type f \
      \( -name 'sources.list' -o -name '*.list' -o -name '*.sources' \) \
      -exec grep -LEs -- '^([^#]*)?[[:space:]]*Signed-By' {} +
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ ." }
    rationale: &rat-69ab56f46e |
      APT verifies repository metadata against trusted keys. If a source does not name its key with Signed-By, any key in the global trusted keyrings is accepted for it, so a key added for one third-party repository could sign packages that appear to come from another. Binding each source to its own keyring limits the impact of a compromised or malicious repository key.
    remediation: &rem-25c4fce138 |
      Convert the package sources to the deb822 format and give every source a Signed-By field that points to its keyring.

      apt modernize-sources
      grep -L 'Signed-By' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list

      Add a Signed-By: line naming the right keyring to every stanza of each file still listed. The check matches Signed-By case-sensitively, so one-line entries with [signed-by=...] are still reported, and /etc/apt/sources.list must not remain without it.
  - id: "CIS-DEBIAN13-1.2.1.2-apt_weak_deps"
    name: "apt weak deps: /usr/bin/apt-config dump | /usr/bin/grep \"APT::Install-\""
    description: "CIS Debian 13 benchmark recommendation 1.2.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      /usr/bin/apt-config dump | /usr/bin/grep "APT::Install-"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ APT::Install-Recommends \"(0|false)\";" }
      - { some: "~ APT::Install-Suggests \"(0|false)\";" }
    rationale: &rat-f59c6396c6 |
      By default APT also installs recommended packages, which pulls in software nobody explicitly chose. Every extra package enlarges the attack surface and the patching workload. Disabling automatic installation of recommended and suggested packages keeps the installed set minimal; needed functionality then has to be installed explicitly.
    remediation: &rem-6ccc6d0110 |
      Disable recommended and suggested packages in an APT configuration file.

      printf '%s\n' 'APT::Install-Recommends "0";' 'APT::Install-Suggests "0";' > /etc/apt/apt.conf.d/60-no-weak-deps
      apt-config dump | grep 'APT::Install-'
  - id: "CIS-DEBIAN13-1.2.1.3-gpg_keys_perms"
    name: "gpg keys perms: find -L /usr/share/keyrings/ /etc/apt/trusted.gpg.d/ \\"
    description: "CIS Debian 13 benchmark recommendation 1.2.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      find -L /usr/share/keyrings/ /etc/apt/trusted.gpg.d/ \
      -mount -xdev -type f \( ! -user root -o ! -group root -o -perm /133 \) \
      -name '*gpg' -exec stat -Lc 'File: %n Mode: (%#a) User: (%U) Group: (%G)' {} +
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-462dcd0da9 |
      The keyrings in /usr/share/keyrings and /etc/apt/trusted.gpg.d decide which repository signatures APT trusts. If a non-root user can modify them, they can add their own key and get malicious packages accepted as authentic. Root ownership and mode 0644 or stricter keep these trust anchors under administrative control.
    remediation: &rem-39b8cd13dd |
      Fix owner, group and mode of each keyring file reported by the check.

      chown root:root FILE
      chmod u-x,go-wx FILE
  - id: "CIS-DEBIAN13-1.2.1.3-gpg_keys_perms_signed"
    name: "gpg keys perms signed: find -L /etc/apt/sources.list.d/ -mount -xdev -type f \\"
    description: "CIS Debian 13 benchmark recommendation 1.2.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      find -L /etc/apt/sources.list.d/ -mount -xdev -type f \
      \( ! -user root -o ! -group root -o -perm /133 \) \
      \( -name '*.list' -o -name '*.sources' \) \
      -exec grep -lsE '^([^#]*)?[[:space:]]*Signed-By' {} +
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-d4d1b9c182 |
      Source files with a Signed-By field bind each repository to the keyring APT trusts for it. If such a file is writable by non-root users, the repository URL or the referenced keyring can be changed to attacker-controlled content. Root ownership and mode 0644 or stricter protect this binding.
    remediation: &rem-4dd64c39e0 |
      Fix owner, group and mode of each source file reported by the check.

      chown root:root FILE
      chmod u-x,go-wx FILE
  - id: "CIS-DEBIAN13-1.2.1.4-apt_trusted_perms-attrs"
    name: "/etc/apt/trusted.gpg.d: exists, is a directory, mode 0755 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 1.2.1.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/apt/trusted.gpg.d'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -d "$f" ] || echo "$f is not a directory"
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7022)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-9d5957e544 |
      /etc/apt/trusted.gpg.d holds keyrings that APT trusts for all repositories. If others can write to the directory, they can drop in their own key and have malicious packages accepted. It must be owned by root and not writable by group or others.
    remediation: &rem-5c5cc3b1b1 |
      Create /etc/apt/trusted.gpg.d if it is missing, then make it a directory, set owner root and group root and remove the permissions u-s,g-ws,o-w,a-t:

      chown root:root '/etc/apt/trusted.gpg.d'
      chmod u-s,g-ws,o-w,a-t '/etc/apt/trusted.gpg.d'
  - id: "CIS-DEBIAN13-1.2.1.5-apt_auth_conf_dir-attrs"
    name: "/etc/apt/auth.conf.d: exists, is a directory, mode 0755 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 1.2.1.5. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/apt/auth.conf.d'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -d "$f" ] || echo "$f is not a directory"
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7022)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-541b0acf6c |
      /etc/apt/auth.conf.d contains files with repository credentials. A directory writable by non-root users lets them replace these files or add new ones to redirect or capture authentication. Root ownership without group or other write access protects the credentials.
    remediation: &rem-ed3889a241 |
      Create /etc/apt/auth.conf.d if it is missing, then make it a directory, set owner root and group root and remove the permissions u-s,g-ws,o-w,a-t:

      chown root:root '/etc/apt/auth.conf.d'
      chmod u-s,g-ws,o-w,a-t '/etc/apt/auth.conf.d'
  - id: "CIS-DEBIAN13-1.2.1.6-apt_auth_conf_files"
    name: "apt auth conf files: find -L /etc/apt/auth.conf.d/ -type f -name '*.conf' \\( ! -user root -o ! -group root -o …"
    description: "CIS Debian 13 benchmark recommendation 1.2.1.6. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find -L /etc/apt/auth.conf.d/ -type f -name '*.conf' \( ! -user root -o ! -group root -o -perm /0137 \) 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-39caaa15e5 |
      Files in /etc/apt/auth.conf.d contain credentials for authenticated repositories. If they are readable by other users or owned by non-root accounts, those credentials can be stolen or replaced. Limiting the files to root keeps repository passwords and tokens confidential.
    remediation: &rem-770b82e1d9 |
      Fix owner, group and mode of each credentials file reported by the check (the check accepts at most 0640).

      chown root:root FILE
      chmod 0600 FILE
  - id: "CIS-DEBIAN13-1.2.1.7-keyrings_perms-attrs"
    name: "/usr/share/keyrings: exists, is a directory, mode 0755 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 1.2.1.7. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/usr/share/keyrings'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -d "$f" ] || echo "$f is not a directory"
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7022)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-53edd8e119 |
      /usr/share/keyrings stores the repository signing keys that Signed-By refers to. Write access for non-root users would let them replace a key and get forged packages accepted. The directory must be owned by root and not writable by group or others.
    remediation: &rem-b05dcca307 |
      Create /usr/share/keyrings if it is missing, then make it a directory, set owner root and group root and remove the permissions u-s,g-ws,o-w,a-t:

      chown root:root '/usr/share/keyrings'
      chmod u-s,g-ws,o-w,a-t '/usr/share/keyrings'
  - id: "CIS-DEBIAN13-1.2.1.8-apt_sources_list.d_perms-attrs"
    name: "/etc/apt/sources.list.d: exists, is a directory, mode 0755 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 1.2.1.8. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/apt/sources.list.d'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -d "$f" ] || echo "$f is not a directory"
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7022)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-05b4b017a9 |
      /etc/apt/sources.list.d defines where packages come from. If non-root users can add or replace files there, they can point APT at malicious repositories. The directory must be owned by root and not writable by group or others.
    remediation: &rem-98646ef209 |
      Create /etc/apt/sources.list.d if it is missing, then make it a directory, set owner root and group root and remove the permissions u-s,g-ws,o-w,a-t:

      chown root:root '/etc/apt/sources.list.d'
      chmod u-s,g-ws,o-w,a-t '/etc/apt/sources.list.d'
  - id: "CIS-DEBIAN13-1.2.1.9-apt_auth_conf"
    name: "apt auth conf: find -L /etc/apt/sources.list.d/ -type f \\( ! -user root -o ! -group root -o -perm /0133 …"
    description: "CIS Debian 13 benchmark recommendation 1.2.1.9. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find -L /etc/apt/sources.list.d/ -type f \( ! -user root -o ! -group root -o -perm /0133 \) 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-34b9feea68 |
      The files in /etc/apt/sources.list.d determine where packages are downloaded from and which keys they are verified with. If non-root users can modify them, they can redirect APT to malicious repositories or weaken signature bindings. Root ownership and mode 0644 or stricter prevent such tampering.
    remediation: &rem-7f2075f1a7 |
      Fix owner, group and mode of each file in /etc/apt/sources.list.d reported by the check.

      chown root:root FILE
      chmod u-x,go-wx FILE
  - id: "CIS-DEBIAN13-1.2.2.1-security-updates"
    name: "security updates: LC_ALL=C apt update | tail -1"
    description: "CIS Debian 13 benchmark recommendation 1.2.2.1. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      LC_ALL=C apt update | tail -1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ All packages are up to date" }
    rationale: &rat-7cc1d8773a |
      Unpatched software is one of the most common ways systems are compromised. Installing available updates closes publicly known vulnerabilities before they can be exploited. The check reports a failure while updates are pending; on most platforms this includes non-security updates.
    remediation: &rem-e931a9ea9c |
      Refresh the package lists and install all available upgrades, including those that need new dependencies.

      apt-get update
      apt-get upgrade
      apt-get full-upgrade

      Review the plan of full-upgrade, which may remove packages. Packages kept back with apt-mark hold still cause a failure. Reboot if the kernel or core libraries were updated.
  - id: "CIS-DEBIAN13-1.3.1.1-apparmor"
    name: "Package apparmor is installed"
    description: "CIS Debian 13 benchmark recommendation 1.3.1.1. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' apparmor 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-d4cd5996bb |
      AppArmor is a mandatory access control system that confines programs to a defined set of files, capabilities and network access. Having it installed is the prerequisite for limiting what a compromised service can do beyond normal user permissions.
    remediation: &rem-378a6baa70 |
      Install the package apparmor:

      apt-get install apparmor
  - id: "CIS-DEBIAN13-1.3.1.1-apparmor-utils"
    name: "Package apparmor-utils is installed"
    description: "CIS Debian 13 benchmark recommendation 1.3.1.1. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' apparmor-utils 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-57320ccd01 |
      apparmor-utils provides tools such as aa-enforce, aa-complain and aa-status for managing AppArmor profiles. They are needed to put profiles into enforce mode and to verify their state, which is how AppArmor confines applications and limits the damage of a compromised service.
    remediation: &rem-3f2b5d326d |
      Install the package apparmor-utils:

      apt-get install apparmor-utils
  - id: "CIS-DEBIAN13-1.3.1.2-apparmor_enabled_boot-attrs"
    name: "/etc/default/grub: exists"
    description: "CIS Debian 13 benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1c81e58022 |
      AppArmor only protects the system if the kernel activates it at boot, before the services its profiles are meant to confine are started. The check verifies the kernel command line in /etc/default/grub enables AppArmor or, on some platforms, at least does not disable it with apparmor=0.
    remediation: &rem-2d1523887c |
      Create /etc/default/grub.
  - id: "CIS-DEBIAN13-1.3.1.2-apparmor_enabled_boot-content"
    name: "/etc/default/grub has the expected content (1 rule)"
    description: "CIS Debian 13 benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect: { none: "~ GRUB_CMDLINE_LINUX_DEFAULT=.*apparmor=0" }
    rationale: *rat-1c81e58022
    remediation: &rem-5b94091c1e |
      Edit /etc/default/grub so that its lines meet these conditions (regular expressions):

      - no line matches GRUB_CMDLINE_LINUX_DEFAULT=.*apparmor=0
  - id: "CIS-DEBIAN13-1.3.1.3-apparmor_enf_only"
    name: "apparmor enf only: apparmor_status 2\u003e/dev/null | awk '"
    description: "CIS Debian 13 benchmark recommendation 1.3.1.3. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-debian13, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      apparmor_status 2>/dev/null | awk '
        /profiles are loaded/ {pl=$1}
        /profiles are in complain mode/ {pc=$1}
        /processes are in complain mode/ {qc=$1}
        /processes are unconfined but have a profile defined/ {qu=$1}
        END {
          print "profiles_loaded=" pl+0
          print "profiles_complain=" (pc == "" ? "missing" : pc)
          print "processes_complain=" (qc == "" ? "missing" : qc)
          print "processes_unconfined=" (qu == "" ? "missing" : qu)
        }'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^profiles_loaded=[1-9]" }
      - { some: "~ ^profiles_complain=0$" }
      - { some: "~ ^processes_complain=0$" }
      - { some: "~ ^processes_unconfined=0$" }
    rationale: &rat-431a321151 |
      Complain mode only logs policy violations, while enforce mode blocks them. Running all profiles in enforce mode, with no process that has a profile left unconfined, means the confinement policies actually protect the system instead of merely documenting what a compromised program did.
    remediation: &rem-cb32855c78 |
      Install the AppArmor utilities, put all profiles into enforce mode and restart processes that have a profile but are still running unconfined.

      apt-get install apparmor-utils
      aa-enforce /etc/apparmor.d/*
      aa-status
      systemctl restart SERVICE

      A reboot also places all processes under their profiles.
  - id: "CIS-DEBIAN13-1.3.1.4-apparmor_retrict_unpriv"
    name: "Kernel parameter kernel.apparmor_restrict_unprivileged_unconfined is 1"
    description: "CIS Debian 13 benchmark recommendation 1.3.1.4. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.apparmor_restrict_unprivileged_unconfined
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-d3e297587d |
      Unprivileged user namespaces expose kernel functionality otherwise reserved to root and have been used in many local privilege-escalation exploits. With kernel.apparmor_restrict_unprivileged_unconfined = 1, AppArmor denies these capabilities to unprivileged processes that are not confined by a profile allowing them.
    remediation: &rem-64b2fdf0a8 |
      Set the kernel parameter kernel.apparmor_restrict_unprivileged_unconfined to 1, now and at boot:

      sysctl -w 'kernel.apparmor_restrict_unprivileged_unconfined=1'
      printf '%s\n' 'kernel.apparmor_restrict_unprivileged_unconfined = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.apparmor_restrict_unprivileged_unconfined from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-DEBIAN13-1.4.2-grub_bootloaders_perms-attrs"
    name: "/boot/grub/grub.cfg: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Debian 13 benchmark recommendation 1.4.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/boot/grub/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-186ae958c2 |
      grub.cfg describes how the system boots, including kernel parameters and, if a boot password is set, its hash. Restricting it to root with mode 0600 or stricter prevents users from reading these details or altering the boot configuration.
    remediation: &rem-e39028cb7f |
      Create /boot/grub/grub.cfg if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/boot/grub/grub.cfg'
      chmod u-xs,g-rwxs,o-rwx,a-t '/boot/grub/grub.cfg'
  - id: "CIS-DEBIAN13-1.5.1-protected_hardlinks_live"
    name: "Kernel parameter fs.protected_hardlinks is 1"
    description: "CIS Debian 13 benchmark recommendation 1.5.1. NIST SP 800-53 Rev. 5: AC-3, AC-6."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n fs.protected_hardlinks
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-9c755ec90f |
      Without this protection users can create hard links to files they do not own, such as setuid binaries or files in shared directories, and exploit races in privileged programs or keep vulnerable binaries reachable after updates. With fs.protected_hardlinks = 1 the kernel only permits hard links to files the user owns or can read and write.
    remediation: &rem-dfb7dcb76a |
      Set the kernel parameter fs.protected_hardlinks to 1, now and at boot:

      sysctl -w 'fs.protected_hardlinks=1'
      printf '%s\n' 'fs.protected_hardlinks = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of fs.protected_hardlinks from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
