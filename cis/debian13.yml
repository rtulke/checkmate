  - id: "CIS-DEBIAN13-5.3.3.1.3-faillock_even_root_removed"
    name: "faillock even root removed: grep -Pl -- '\\bpam_faillock\\.so\\h+([^#\\n\\r]+\\h+)?(even_deny_root|root_unlock_time)' /usr/…"
    description: "CIS Debian 13 benchmark recommendation 5.3.3.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
