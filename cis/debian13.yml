      cat '/etc/systemd/coredump.conf.d/60-coredump.conf'
    allow_rc: any
    expect: { some: "~ ^ProcessSizeMax\\s*=\\s*0\\s*$" }
    rationale: *rat-b83636ff53
    remediation: &rem-a2563c3d30 |
      Edit /etc/systemd/coredump.conf.d/60-coredump.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^ProcessSizeMax\s*=\s*0\s*$
  - id: "CIS-DEBIAN13-1.5.13-coredump_storage_conf-attrs"
    name: "/etc/systemd/coredump.conf: exists"
    description: "CIS Debian 13 benchmark recommendation 1.5.13. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/coredump.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-0b5cfb7408 |
      Core dumps preserve the memory of crashed processes, which can include passwords, keys and other sensitive data. Storage=none tells systemd-coredump not to keep them on disk, while the crash itself is still logged.
    remediation: &rem-38adbe4ae3 |
      Create /etc/systemd/coredump.conf.
