    remediation: &rem-e4d2f56c3f |
      Persist the setting in a file under /etc/sysctl.d/ whose name ends in .conf, apply it, and remove conflicting settings of fs.protected_hardlinks from /etc/sysctl.conf and other files in /etc/sysctl.d/.

