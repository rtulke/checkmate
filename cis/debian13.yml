      - "== 0"
    rationale: &rat-25c9a7e137 |
      IP forwarding lets the host route packets between its interfaces. On a system that is not meant to be a router, forwarding can be abused to bypass network segmentation and reach otherwise isolated networks. Disabling it, at runtime and in the persistent configuration, prevents this; routers, VPN gateways and container hosts are legitimate exceptions.
    remediation: &rem-3320f1cd32 |
      Set the kernel parameter net.ipv4.conf.all.forwarding to 0, now and at boot:

      sysctl -w 'net.ipv4.conf.all.forwarding=0'
      printf '%s\n' 'net.ipv4.conf.all.forwarding = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.conf.all.forwarding from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
