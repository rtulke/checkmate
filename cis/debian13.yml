  - id: "CIS-DEBIAN13-5.1.8-sshd_disableforwarding-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Debian 13 benchmark recommendation 5.1.8. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
