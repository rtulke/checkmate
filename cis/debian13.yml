  - id: "CIS-DEBIAN13-5.3.3.1.2-faillock_unlock_time_removed"
    name: "faillock unlock time removed: grep -Pl -- '\\bpam_faillock\\.so\\h+([^#\\n\\r]+\\h+)?unlock_time\\b' /usr/share/pam-configs/*"
    description: "CIS Debian 13 benchmark recommendation 5.3.3.1.2. NIST SP 800-53 Rev. 5: NA."
