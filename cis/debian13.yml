  - id: "CIS-DEBIAN13-6.2.3.33-auditd_delete_cnf"
    name: "auditd delete cnf: grep delete /etc/audit/rules.d/*.rules"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.33. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep delete /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .-a always,exit -F arch=b64 -S delete_module -F auid\u003e=1000 -F auid!=(unset|-1|auid!=4294967295) -k kernel_modules" }
    rationale: &rat-4bfa181df2 |
      Deleting or renaming files is a common way to destroy data or hide traces of an attack. Auditing these operations for regular users makes it possible to find out who removed or moved files. This check verifies the persistent audit configuration.
    remediation: &rem-fc81cf212a |
      Record file deletions and renames by users: add the rules for your release to /etc/audit/rules.d/50-delete.rules and load them.

      Debian 11, Debian 12, Ubuntu 20.04 and Ubuntu 22.04:
      -a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -k delete
      -a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -k delete

      Debian 13:
      -a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -k delete
      -a always,exit -F arch=b64 -S delete_module -F auid>=1000 -F auid!=unset -k kernel_modules

      Ubuntu 18.04:
      -a always,exit -F arch=b64 -S unlink -S unlinkat -S rename -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
      -a always,exit -F arch=b32 -S unlink -S unlinkat -S rename -S renameat -F auid>=1000 -F auid!=4294967295 -k delete

      Ubuntu 24.04:
      -a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat,renameat2 -F auid>=1000 -F auid!=unset -k delete
      -a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat,renameat2 -F auid>=1000 -F auid!=unset -k delete

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
  - id: "CIS-DEBIAN13-6.2.3.33-auditd_delete_module_live"
    name: "auditd delete module live: auditctl -l | grep delete"
    description: "CIS Debian 13 benchmark recommendation 6.2.3.33. NIST SP 800-53 Rev. 5: AU-12."
    tags: [cis, cis-debian13, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
