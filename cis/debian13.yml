    expect: false
    rationale: &rat-ac1806fa8d |
      NIS is a legacy directory service that sends information, including password hashes, unencrypted and with weak authentication. The client should not be installed; LDAP with TLS or similar services replace it.
    remediation: &rem-98afbdc9fd |
      Remove the package nis, unless the system needs it:

      apt-get purge nis
  - id: "CIS-DEBIAN13-2.2.2-rsh"
    name: "Package rsh is not installed"
    description: "CIS Debian 13 benchmark recommendation 2.2.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-debian13, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
