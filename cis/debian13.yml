      - { some: "~ -a always,exit -F arch=b64 -S sethostname,setdomainname -F key=system-locale" }
    rationale: &rat-93ce1c3dd7 |
      Calls to sethostname and setdomainname change how the host identifies itself on the network and in logs. Recording them in the audit trail shows who renamed the system, which helps detect attempts to impersonate another host or to confuse log correlation. This variant inspects the rules currently loaded in the kernel, so it also catches rule files that were never loaded.
    remediation: &rem-f700b17994 |
      Add the following audit rule to a file in /etc/audit/rules.d/ so it persists, then load the rules into the kernel:

      printf '%s\n' '-a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale' >> /etc/audit/rules.d/50-system_locale.rules
      augenrules --load
      auditctl -l

      If the loaded audit configuration is immutable (-e 2), the new rules only become active after a reboot. On 64-bit systems that also run 32-bit programs, add the same rules with -F arch=b32.
