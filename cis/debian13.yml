  - id: "CIS-DEBIAN13-1.5.6-prelink_absent"
    name: "Package prelink is not installed"
    description: "CIS Debian 13 benchmark recommendation 1.5.6. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' prelink 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-edd337c308 |
      Prelink modifies binaries and libraries to speed up loading, which changes files that integrity tools such as AIDE or package verification monitor and weakens address space layout randomisation. Removing it keeps binaries in their original, verifiable state.
    remediation: &rem-ff4898e838 |
      Remove the package prelink, unless the system needs it:

      apt-get purge prelink
  - id: "CIS-DEBIAN13-1.5.7-apport_stopped-enabled"
    name: "Service apport is not enabled"
    description: "CIS Debian 13 benchmark recommendation 1.5.7. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState apport | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-6c400a9459 |
      Apport collects crash reports that include memory dumps of crashed processes, which may contain passwords, keys or other sensitive data, and it has had privilege-escalation vulnerabilities of its own. Disabling it on servers keeps such data off the disk and removes that attack surface.
    remediation: &rem-ffe56f907e |
      Disable the service apport, unless the system needs it:

      systemctl disable apport

      To keep other units from starting it, mask it instead: systemctl mask apport
  - id: "CIS-DEBIAN13-1.5.7-apport_stopped-running"
    name: "Service apport is not running"
    description: "CIS Debian 13 benchmark recommendation 1.5.7. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-debian13, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState apport | cut -d= -f2
    expect: "!= active"
    rationale: *rat-6c400a9459
    remediation: &rem-1f0d8981d8 |
      Stop the service apport, unless the system needs it:

      systemctl stop apport
