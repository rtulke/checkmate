  - id: "CIS-DEBIAN13-5.1.11-ssh_rhosts-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Debian 13 benchmark recommendation 5.1.11. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-debian13, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-037db005cf |
      Legacy .rhosts and .shosts files let users grant password-less access to their account from other hosts, outside of any central control. IgnoreRhosts makes sshd disregard these files, so such per-user trust relationships cannot be used to log in.
    remediation: *rem-f6392187bb
  - id: "CIS-DEBIAN13-5.1.11-ssh_rhosts-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
