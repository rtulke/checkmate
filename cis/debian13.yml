    rationale: &rat-3837626be2 |
      By default faillock does not lock the root account, so root remains an unlimited target for password guessing. even_deny_root, or a root_unlock_time of at least a minute, applies the lockout to root as well. Console or out-of-band access should remain available so a locked root cannot block recovery.
