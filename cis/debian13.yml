      SSH forwarding lets a logged-in user tunnel TCP connections, X11 sessions, agent and Unix sockets through the server, which can bypass firewalls and monitoring or expose internal services. DisableForwarding turns off all forms of forwarding at once. Hosts that legitimately need tunnels, such as jump hosts, should be handled as documented exceptions.
