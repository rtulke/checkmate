      - { rc: "in [0, 1]" }
      - { some: "~ install /bin/(true|false)" }
    rationale: &rat-cc336625ff |
      RDS (Reliable Datagram Sockets) is a protocol for cluster interconnects that most systems never use, and its kernel code has had privilege escalation vulnerabilities. Mapping the module to /bin/false in the modprobe configuration prevents it from being loaded on demand.
    remediation: *rem-a8dd9cdd16
  - id: "CIS-UBUNTU26-3.2.5-lsmod_sctp"
    name: "lsmod sctp: lsmod | grep -i sctp"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.2.5. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i sctp
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-a0ad621928 |
      SCTP is a message-oriented transport protocol used mainly in telecom environments. Its kernel code has had serious vulnerabilities, and since opening a socket can load the module automatically, an unused SCTP module adds attack surface. The check verifies the module is not loaded.
    remediation: &rem-7de8398c66 |
      Prevent the sctp module from loading and unload it if it is loaded.

      printf '%s\n' 'blacklist sctp' 'install sctp /bin/false' > /etc/modprobe.d/sctp.conf
      modprobe -r sctp

      If the module is in use, stop the application using it or reboot.
  - id: "CIS-UBUNTU26-3.2.5-modprobe_sctp"
    name: "modprobe sctp: modprobe -n -v sctp"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.2.5. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v sctp
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /bin/(true|false)" }
    rationale: &rat-be5bf6712f |
      SCTP is a message-oriented transport protocol used mainly in telecommunications. Its kernel module adds network-reachable code that most systems never use. Preventing the module from loading removes this attack surface on systems that do not use the protocol. Some telecom and clustering software needs SCTP.
    remediation: &rem-40e3047e72 |
      Keep the sctp module from being loaded: add an install override and a blacklist entry for it in /etc/modprobe.d/, then unload it if it is currently loaded.

      printf '%s\n' 'install sctp /bin/false' 'blacklist sctp' > /etc/modprobe.d/sctp.conf
      modprobe -r sctp

      modprobe -r reports an error if the module is not loaded, which is harmless; if sockets of this protocol are open, the module stays loaded until reboot.
