    run: |
      sysctl -n fs.suid_dumpable
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-e7d91ef8bc |
      fs.suid_dumpable controls whether processes that changed privileges, such as setuid programs, may produce core dumps. A core dump of such a process can contain passwords, keys or other secrets from privileged memory and may be readable by the invoking user. Setting it to 0 disables these dumps. This check verifies the value in the running kernel.
    remediation: &rem-789aaadb7b |
      Set the kernel parameter fs.suid_dumpable to 0, now and at boot:

      sysctl -w 'fs.suid_dumpable=0'
      printf '%s\n' 'fs.suid_dumpable = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of fs.suid_dumpable from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU26-1.5.4-suid_dumpable_configured"
    name: "suid dumpable configured: grep \"fs\\.suid_dumpable\" $([ -f /etc/sysctl.conf ] \u0026\u0026 echo /etc/sysctl.conf) /etc/sysctl.…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.4. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "fs\.suid_dumpable" $([ -f /etc/sysctl.conf ] && echo /etc/sysctl.conf) /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ fs\\.suid_dumpable=0" }
    rationale: &rat-7967d7b0f6 |
      Core dumps of setuid programs can contain privileged memory such as password hashes or keys. fs.suid_dumpable=0 prevents processes that changed privileges from producing core dumps. Persisting it in the sysctl configuration keeps it after reboots.
    remediation: &rem-dd62dda959 |
      Set fs.suid_dumpable to 0 in a sysctl drop-in file and apply it to the running kernel. The check expects the exact text fs.suid_dumpable=0, without spaces around the equals sign.

      printf '%s\n' 'fs.suid_dumpable=0' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w fs.suid_dumpable=0

      Remove or correct any other setting of fs.suid_dumpable in /etc/sysctl.conf and /etc/sysctl.d/.
  - id: "CIS-UBUNTU26-1.5.5-kernel.dmesg_restrict"
    name: "Kernel parameter kernel.dmesg_restrict is 1"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.5. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
