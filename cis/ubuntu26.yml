      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-c06949c7fa |
      /etc/apt/auth.conf.d holds credentials for authenticated repositories. If other users can write to the directory, they can add or replace credential files, for example to redirect APT to repositories they control. It must be owned by root and not group- or world-writable.
    remediation: &rem-ed3889a241 |
      Create /etc/apt/auth.conf.d if it is missing, then make it a directory, set owner root and group root and remove the permissions u-s,g-ws,o-w,a-t:

