      - no line matches ^session\s+optional\s+pam_motd.so\s+motd=\/run\/motd.dynamic
      - no line matches ^session\s+optional\s+pam_motd.so noupdate
  - id: "CIS-UBUNTU26-1.6.5-sshd_warning_banner_content-attrs"
    name: "/etc/issue.net: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.6.5. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue.net'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-21ac3fecb2 |
      When the SSH server's Banner points to /etc/issue.net, its content is sent to every client before authentication. Escape sequences or the distribution name in it disclose platform details to unauthenticated users. The banner should only contain the site's legal warning.
    remediation: &rem-88e05c3381 |
