  - id: "CIS-UBUNTU26-2.4.1.8-cron_d_perms-attrs"
    name: "/etc/cron.d: exists, mode 0700 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 2.4.1.8. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
