  - id: "CIS-UBUNTU26-5.4.2.8-test_valid_shells"
    name: "test valid shells: bash -c 'valid=$(awk -F/ \"\\$NF != \\\"nologin\\\" \u0026\u0026 /^\\// {print}\" /etc/shells)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.4.2.8. NIST SP 800-53 Rev. 5: AC-2(5), AC-3, AC-11, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      bash -c 'valid=$(awk -F/ "\$NF != \"nologin\" && /^\// {print}" /etc/shells)
      awk -F: "\$1 != \"root\" {print \$1, \$NF}" /etc/passwd | while read -r u s; do
        printf "%s\n" "$valid" | grep -qxF -- "$s" && continue
        passwd -S "$u" | awk "\$2 !~ /^L/ {print \"Account: \" \$1 \" does not have a valid login shell and is not locked\"}"
      done'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
