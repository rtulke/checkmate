    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-6f3d2b725c |
      Files in /etc/apt/auth.conf.d contain logins and passwords or tokens for private repositories. If other users can read them, the credentials can be stolen and reused; if they can write them, they can be altered. They should be owned by root and not accessible to other users.
    remediation: &rem-bc1a1024eb |
      Review each reported file and set owner root, group root and mode 0600.

      chown root:root FILE
      chmod 0600 FILE

      APT reads these files as root, so no further access is needed.
  - id: "CIS-UBUNTU26-1.2.1.7-usr_share_keyrings-attrs"
    name: "/usr/share/keyrings: exists, is a directory, mode 0755 or stricter, owner root, group root"
