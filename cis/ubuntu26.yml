      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-9fac345b06 |
      The message of the day is shown to users at login. If it reveals the operating system name, version or kernel release, it gives attackers information for targeting known vulnerabilities. Login messages should be controlled and should not disclose system details.
    remediation: *rem-a2a173e0c3
  - id: "CIS-UBUNTU26-1.6.4-pam_motd_configured-content"
    name: "/etc/pam.d/sshd has the expected content (2 rules)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.6.4. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
