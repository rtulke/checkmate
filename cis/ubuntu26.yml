  - id: "CIS-UBUNTU26-1.5.3-kernel.yama.ptrace_scope"
    name: "Kernel parameter kernel.yama.ptrace_scope is 1"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.3. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.yama.ptrace_scope
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-87e99a2286 |
      ptrace lets one process inspect and modify the memory of another. With unrestricted ptrace, any process running as a user can attach to that user's other processes, for example to steal SSH agent keys, session tokens or passwords from a browser after compromising a single program. Yama mode 1 limits ptrace to direct descendants (plus explicit exceptions), which blocks this lateral access while keeping debuggers usable.
    remediation: &rem-1ac1532a42 |
      Set the kernel parameter kernel.yama.ptrace_scope to 1, now and at boot:

      sysctl -w 'kernel.yama.ptrace_scope=1'
      printf '%s\n' 'kernel.yama.ptrace_scope = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.yama.ptrace_scope from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU26-1.5.3-ptrace_restrict_configured"
    name: "ptrace restrict configured: grep \"^kernel\\.yama.ptrace_scope\" $([ -f /etc/sysctl.conf ] \u0026\u0026 echo /etc/sysctl.conf) /et…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.3. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "^kernel\.yama.ptrace_scope" $([ -f /etc/sysctl.conf ] && echo /etc/sysctl.conf) /etc/sysctl.d/* | cut -d ":" -f2
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ kernel.yama.ptrace_scope\\s*=\\s*1" }
    rationale: &rat-84bd97a56a |
      With unrestricted ptrace, any process can attach to other processes of the same user and read their memory, for example to steal SSH agent keys or session tokens after a compromise. kernel.yama.ptrace_scope=1 only allows a process to trace its own descendants. Persisting it in the sysctl configuration keeps it after reboots.
    remediation: &rem-8a915cd169 |
      Set kernel.yama.ptrace_scope to 1 in a sysctl drop-in file and apply it to the running kernel.

      printf '%s\n' 'kernel.yama.ptrace_scope = 1' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w kernel.yama.ptrace_scope=1

      The check only reads /etc/sysctl.conf and /etc/sysctl.d/; remove or correct any other setting of kernel.yama.ptrace_scope in these locations.
  - id: "CIS-UBUNTU26-1.5.4-fs.suid_dumpable"
    name: "Kernel parameter fs.suid_dumpable is 0"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.4. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
