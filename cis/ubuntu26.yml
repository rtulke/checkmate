  - id: "CIS-UBUNTU26-3.3.1.4-net.ipv4.conf.all.send_redirects"
    name: "Kernel parameter net.ipv4.conf.all.send_redirects is 0"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.3.1.4. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.all.send_redirects
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-e772f5113d |
      Routers send ICMP redirects to tell hosts about better routes. A system that is not a router has no reason to send them, and an attacker who controls it could use redirects to divert other hosts' traffic. The 'all' setting applies to all current interfaces.
    remediation: &rem-9e5a0d6d8d |
      Set the kernel parameter net.ipv4.conf.all.send_redirects to 0, now and at boot:

      sysctl -w 'net.ipv4.conf.all.send_redirects=0'
      printf '%s\n' 'net.ipv4.conf.all.send_redirects = 0' >> /etc/sysctl.d/60-hardening.conf

