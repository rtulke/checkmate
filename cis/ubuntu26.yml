      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-8f8463f92d |
      RDS (Reliable Datagram Sockets) is a protocol for cluster interconnects that most systems never use, and its kernel code has had privilege escalation vulnerabilities. Because opening a socket can load the module automatically, keeping it unloaded removes this attack surface. The check verifies the module is not loaded.
    remediation: &rem-a8dd9cdd16 |
      Prevent the rds module from loading and unload it if it is loaded.

      printf '%s\n' 'blacklist rds' 'install rds /bin/false' > /etc/modprobe.d/rds.conf
      modprobe -r rds

      If the module is in use, stop the application using it or reboot.
  - id: "CIS-UBUNTU26-3.2.4-modprobe_RDS"
    name: "modprobe RDS: modprobe -n -v rds"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.2.4. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
