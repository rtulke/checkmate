  - id: "CIS-UBUNTU26-1.2.1.2-apt_weak_dependencies-attrs"
    name: "/etc/apt/apt.conf.d/60-no-weak-dependencies: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      f='/etc/apt/apt.conf.d/60-no-weak-dependencies'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-08d3257de0 |
      By default APT also installs recommended packages, which pulls in software the system does not strictly need. Every additional package increases the attack surface and the patching effort. Disabling automatic installation of recommended and suggested packages keeps installations minimal and deliberate.
    remediation: &rem-6bd24ccb3c |
      Create /etc/apt/apt.conf.d/60-no-weak-dependencies.
  - id: "CIS-UBUNTU26-1.2.1.2-apt_weak_dependencies-content"
