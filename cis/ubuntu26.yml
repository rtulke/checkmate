    rationale: &rat-6a5efc0267 |
      Normally packets for 127.0.0.0/8 arriving on external interfaces are dropped. With route_localnet enabled they can be routed to the loopback interface, which may expose services that are meant to be reachable only locally. Keeping it at 0, persistently in the sysctl configuration, preserves the loopback boundary.
