  - id: "CIS-UBUNTU26-1.5.10-core_file_size_limits"
    name: "core file size limits: grep -E \"\\*.*hard.*core.*0\" /etc/security/limits.conf /etc/security/limits.d/*"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.10. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "\*.*hard.*core.*0" /etc/security/limits.conf /etc/security/limits.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^\\/*.*\\shard.*core.*0" }
    rationale: &rat-be7df1a331 |
      Core dumps contain the memory of the crashed process, which can include passwords, keys and other sensitive data, and they can fill the file system. A hard core file size limit of 0 for all users prevents processes from writing core dumps through the resource limit mechanism.
    remediation: &rem-894026fd79 |
      Add a hard core limit of 0 for all users in a limits drop-in file.

      printf '%s\n' '* hard core 0' > /etc/security/limits.d/60-coredump.conf

      The limit applies to new login sessions. Remove conflicting '* hard core' entries with other values from /etc/security/limits.conf and /etc/security/limits.d/.
  - id: "CIS-UBUNTU26-1.5.11-coredump_processsizemax-attrs"
    name: "/etc/systemd/coredump.conf.d/60-coredump.conf: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.11. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/coredump.conf.d/60-coredump.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-6c106d550c |
      systemd-coredump captures and stores core dumps of crashing processes, which can contain credentials and other sensitive memory contents. Setting ProcessSizeMax=0 in a coredump drop-in stops systemd-coredump from processing and storing dumps, complementing the core size resource limit.
    remediation: &rem-a8c378dcf3 |
      Create /etc/systemd/coredump.conf.d/60-coredump.conf.
