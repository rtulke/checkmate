      chmod u-s,g-ws,o-w,a-t '/etc/apt/auth.conf.d'
  - id: "CIS-UBUNTU26-1.2.1.6-apt_auth_conf_d_files"
    name: "apt auth conf d files: find /etc/apt/auth.conf.d/ -type f 2\u003e/dev/null | xargs -r stat -c '%U:%G:%a:%n' | grep -P…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.6. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
