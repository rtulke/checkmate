      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-7cc6469fbe |
      The message of the day is shown after login. It should carry the site's authorised-use notice and must not reveal operating system name, version, kernel or architecture, which help attackers select exploits.
    remediation: &rem-0e26f8edaf |
      Create /etc/motd.
  - id: "CIS-UBUNTU26-1.6.1-etc_motd_content-content"
    name: "/etc/motd has the expected content (4 rules)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.6.1. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
