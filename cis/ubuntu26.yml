  - id: "CIS-UBUNTU26-3.3.1.18-net.ipv4.tcp_syncookies"
    name: "Kernel parameter net.ipv4.tcp_syncookies is 1"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.3.1.18. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
