      - { none: "~ (?i)ubuntu" }
    rationale: *rat-21ac3fecb2
    remediation: &rem-0d44e2f002 |
      Edit /etc/issue.net so that its lines meet these conditions (regular expressions):

      - no line matches (\\v|\\r|\\m|\\s)
      - no line matches (?i)ubuntu
  - id: "CIS-UBUNTU26-1.6.6-motd_permissions"
    name: "motd permissions: FILE=/etc/motd \u0026\u0026 if [ -f $FILE ]; then PERMS=`stat  -c '%U %G %a' $FILE`; if [ \"$PERMS\" …"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.6.6. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      FILE=/etc/motd && if [ -f $FILE ]; then PERMS=`stat  -c '%U %G %a' $FILE`; if [ "$PERMS" != "root root 644" ]; then echo "Permissions Incorrect"; fi; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Permissions Incorrect" }
    rationale: &rat-40c6847e15 |
      The message of the day is shown to every user after login. If non-root users could modify it, they could display misleading instructions, for example to trick other users into revealing credentials. Ownership by root and mode 0644 prevent this.
    remediation: &rem-c67676bc05 |
      Set owner and group root and mode 0644 on /etc/motd.

      chown root:root /etc/motd
      chmod 0644 /etc/motd

      On Ubuntu the check expects exactly 644 and reads the permissions of the path itself; if /etc/motd is a symbolic link, replace it with a regular file or remove it.
  - id: "CIS-UBUNTU26-1.6.7-etc_issue_perms-attrs"
    name: "/etc/issue: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.6.7. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-695e1a5a3f |
      /etc/issue is displayed before every local login. If unprivileged users could write to it, they could replace the warning text or display misleading instructions. Ownership by root and mode 0644 or stricter prevent this.
    remediation: &rem-683e1f474b |
      Create /etc/issue if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue'
  - id: "CIS-UBUNTU26-1.6.8-etc_issue_net_access_perms-attrs"
    name: "/etc/issue.net: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.6.8. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue.net'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-9ef74dbe4b |
      /etc/issue.net is shown to anyone connecting remotely. If non-root users could modify it, they could remove the legal warning or display misleading information. It must be owned by root:root and must not be writable by group or others.
    remediation: &rem-eb0556c5ea |
      Create /etc/issue.net if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue.net'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue.net'
  - id: "CIS-UBUNTU26-1.6.9-pam_motd_perms"
    name: "pam motd perms: grep -hPo 'motd=\\K\\S+' /etc/pam.d/* 2\u003e/dev/null | sort -u | xargs -r stat -Lc '%n %a %U %…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.6.9. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -hPo 'motd=\K\S+' /etc/pam.d/* 2>/dev/null | sort -u | xargs -r stat -Lc '%n %a %U %G' 2>/dev/null | awk '$2 !~ /^[0-6][0-4][0-4]$/ || $3 != "root" || $4 != "root"' ; true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-6ba5f8df41 |
      PAM displays the files referenced by motd= options at login. If those files are writable by non-root users, an attacker can show fake messages to every user, for example to trick administrators into running commands. They must be owned by root:root with mode 644 or stricter.
    remediation: &rem-d581f8710e |
      Review each reported file and set owner root, group root and mode 0644.

      chown root:root FILE
      chmod 0644 FILE

      For generated files such as /run/motd.dynamic, also correct the program that creates them.
