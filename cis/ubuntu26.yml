      chown root:root '/usr/share/keyrings'
      chmod u-s,g-ws,o-w,a-t '/usr/share/keyrings'
  - id: "CIS-UBUNTU26-1.2.1.8-apt_sources_list_d-attrs"
    name: "/etc/apt/sources.list.d: exists, is a directory, mode 0755 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.8. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/apt/sources.list.d'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -d "$f" ] || echo "$f is not a directory"
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7022)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-1a86d196b2 |
      The files in /etc/apt/sources.list.d define where packages come from. If other users can write to the directory, they can add a repository that serves malicious packages or override existing ones. It must be owned by root and writable only by root.
    remediation: &rem-98646ef209 |
      Create /etc/apt/sources.list.d if it is missing, then make it a directory, set owner root and group root and remove the permissions u-s,g-ws,o-w,a-t:

      chown root:root '/etc/apt/sources.list.d'
      chmod u-s,g-ws,o-w,a-t '/etc/apt/sources.list.d'
  - id: "CIS-UBUNTU26-1.2.1.9-apt_sources_list_d_files"
    name: "apt sources list d files: find /etc/apt/sources.list.d/ -type f 2\u003e/dev/null | xargs -r stat -c '%U:%G:%a:%n' | grep…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.9. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /etc/apt/sources.list.d/ -type f 2>/dev/null | xargs -r stat -c '%U:%G:%a:%n' | grep -Pv -- '^root:root:0?[0246][04][04]:' ; true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-cb5125d7f8 |
      Repository definitions control where APT downloads packages from and which keys it trusts for them. If a non-root user can modify these files, they can point the system to a malicious repository or weaken signature settings. Each file should be owned by root:root with mode 644 or stricter.
    remediation: &rem-bc653d711e |
      Review each reported file and set owner root, group root and mode 0644.

      chown root:root FILE
      chmod 0644 FILE
  - id: "CIS-UBUNTU26-1.2.1.10-apt_sources_list_https"
    name: "apt sources list https: grep -Ps -- '^\\s*deb(-src)?\\s+http://' /etc/apt/sources.list ; true"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.10. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ps -- '^\s*deb(-src)?\s+http://' /etc/apt/sources.list ; true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-f4cf19c4ed |
      APT verifies package signatures, but over plain HTTP everyone on the network path can see which packages are downloaded and can delay, replay or withhold repository data. HTTPS adds transport encryption and server authentication, which hides the installed software and makes freeze and downgrade attacks harder.
    remediation: &rem-595c935689 |
      Change the reported deb and deb-src lines in /etc/apt/sources.list from http:// to https:// where the mirror supports HTTPS, then refresh the package lists.

      sed -i -E 's#^(\s*deb(-src)?\s+)http://#\1https://#' /etc/apt/sources.list
      apt-get update

      If apt-get update fails for a mirror, replace it with one that offers HTTPS.
  - id: "CIS-UBUNTU26-1.2.1.11-apt_sources_list_d_https"
    name: "apt sources list d https: grep -Ps -- '^\\s*deb(-src)?\\s+http://' /etc/apt/sources.list.d/*.list 2\u003e/dev/null ; grep …"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.11. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ps -- '^\s*deb(-src)?\s+http://' /etc/apt/sources.list.d/*.list 2>/dev/null ; grep -Ps -- '^\s*URIs:\s+http://' /etc/apt/sources.list.d/*.sources 2>/dev/null ; true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-c8bc5a9699 |
      APT verifies package signatures, but over plain HTTP everyone on the network path can see which packages are downloaded and can delay, replay or withhold repository data. Using HTTPS for all repositories in sources.list.d adds transport encryption and server authentication.
    remediation: &rem-d42263b8ff |
      Change the reported entries in /etc/apt/sources.list.d from http:// to https:// where the mirror supports HTTPS (deb lines in .list files, URIs fields in .sources files), then refresh the package lists.

      sed -i -E 's#^(\s*deb(-src)?\s+)http://#\1https://#' /etc/apt/sources.list.d/*.list
      sed -i -E 's#^(\s*URIs:\s+)http://#\1https://#' /etc/apt/sources.list.d/*.sources
      apt-get update

      Review the result first: a URIs field may list several mirrors, and a mirror without HTTPS must be replaced.
  - id: "CIS-UBUNTU26-1.2.1.12-apt_allow_insecure_repositories-attrs"
    name: "/etc/apt/apt.conf.d/99-no-insecure-repositories: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.12. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/apt/apt.conf.d/99-no-insecure-repositories'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-13c7bfd310 |
      If APT may use repositories without valid signatures, anyone who can tamper with the network path or a mirror can feed arbitrary packages to the system. Setting Acquire::AllowInsecureRepositories to 0 makes APT refuse unsigned or unverifiable repositories.
    remediation: &rem-3cabd87d7e |
      Create /etc/apt/apt.conf.d/99-no-insecure-repositories.
  - id: "CIS-UBUNTU26-1.2.1.12-apt_allow_insecure_repositories-content"
    name: "/etc/apt/apt.conf.d/99-no-insecure-repositories has the expected content (1 rule)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.12. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/apt/apt.conf.d/99-no-insecure-repositories'
    allow_rc: any
    expect: { some: "~ Acquire::AllowInsecureRepositories\\s+\"0\";" }
    rationale: *rat-13c7bfd310
    remediation: &rem-76a6b6d315 |
      Edit /etc/apt/apt.conf.d/99-no-insecure-repositories so that its lines meet these conditions (regular expressions):

      - a line matches Acquire::AllowInsecureRepositories\s+"0";
  - id: "CIS-UBUNTU26-1.2.1.13-apt_allow_weak_repositories-attrs"
    name: "/etc/apt/apt.conf.d/99-no-insecure-repositories: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.13. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/apt/apt.conf.d/99-no-insecure-repositories'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-c20a5e7988 |
      Repository metadata signed only with weak algorithms offers little protection against forged package lists. Setting Acquire::AllowWeakRepositories to 0 makes APT reject such signatures instead of accepting them with a warning.
    remediation: *rem-3cabd87d7e
  - id: "CIS-UBUNTU26-1.2.1.13-apt_allow_weak_repositories-content"
    name: "/etc/apt/apt.conf.d/99-no-insecure-repositories has the expected content (1 rule)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.13. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
