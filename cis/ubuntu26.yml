  - id: "CIS-UBUNTU26-3.3.1.4-ipv4_all_send_redirects"
    name: "ipv4 all send redirects: grep \"net\\.ipv4\\.conf\\.all\\.send_redirects\" $([ -f /etc/sysctl.conf ] \u0026\u0026 echo /etc/sysctl…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.3.1.4. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "net\.ipv4\.conf\.all\.send_redirects" $([ -f /etc/sysctl.conf ] && echo /etc/sysctl.conf) /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ net\\.ipv4\\.conf\\.all\\.send_redirects\\s*=\\s*0" }
    rationale: &rat-740f66aebc |
      ICMP redirects tell other hosts to use a different gateway and are only meaningful on routers. A compromised host that sends redirects can steer neighbours' traffic through itself. Disabling sending of redirects, persistently in the sysctl configuration, prevents this on systems that do not route.
    remediation: &rem-f510f99462 |
