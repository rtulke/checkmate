  - id: "CIS-UBUNTU26-1.5.8-kptr_restrict_configured"
    name: "kptr restrict configured: grep \"^kernel\\.kptr_restrict\" $([ -f /etc/sysctl.conf ] \u0026\u0026 echo /etc/sysctl.conf) /etc/sy…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.8. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "^kernel\.kptr_restrict" $([ -f /etc/sysctl.conf ] && echo /etc/sysctl.conf) /etc/sysctl.d/* | cut -d ":" -f2
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ kernel.kptr_restrict\\s*=\\s*(1|2)" }
    rationale: &rat-268a3d5c71 |
      Kernel pointer addresses exposed through /proc and other interfaces let attackers defeat kernel address space randomization. kernel.kptr_restrict set to 1 or 2 hides these addresses from unprivileged users. Persisting it in the sysctl configuration keeps it after reboots.
    remediation: &rem-9036d002bd |
      Set kernel.kptr_restrict to 1 in a sysctl drop-in file and apply it to the running kernel.

      printf '%s\n' 'kernel.kptr_restrict = 1' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w kernel.kptr_restrict=1

      The check only reads /etc/sysctl.conf and /etc/sysctl.d/; remove or correct any other setting of kernel.kptr_restrict in these locations.
  - id: "CIS-UBUNTU26-1.5.9-kernel.randomize_va_space"
    name: "Kernel parameter kernel.randomize_va_space is 2"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.9. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.randomize_va_space
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 2"
    rationale: &rat-5597c48019 |
      Address space layout randomization places the stack, heap, shared libraries and other memory regions at random addresses. This makes memory corruption exploits much harder because an attacker cannot predict where code or data is located. The value 2 enables full randomization, including the heap.
    remediation: &rem-a6e5efe9f8 |
      Set the kernel parameter kernel.randomize_va_space to 2, now and at boot:

      sysctl -w 'kernel.randomize_va_space=2'
      printf '%s\n' 'kernel.randomize_va_space = 2' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.randomize_va_space from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU26-1.5.9-aslr_configured"
    name: "aslr configured: grep \"^kernel\\.randomize_va_space\" $([ -f /etc/sysctl.conf ] \u0026\u0026 echo /etc/sysctl.conf) /e…"
