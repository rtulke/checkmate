    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.1.2.6.4. NIST SP 800-53 Rev. 5: CM-7, AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/var/log'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]noexec(,|$)"
    rationale: &rat-1929f7dcec |
      /var/log holds log files, which never need device files, privileged programs or executables. With noexec, programs cannot be executed directly from it, which blocks the common attack step of dropping a tool or exploit into a writable directory and running it. Scripts started through an interpreter are not stopped, and some installers may need adjusting. This check verifies the option on the currently mounted file system.
    remediation: &rem-d62db4e043 |
      Mount /var/log with the option noexec: add it to the options of /var/log in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/var/log'

      If /var/log is not a separate file system yet, create one first.
