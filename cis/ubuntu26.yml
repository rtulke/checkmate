  - id: "CIS-UBUNTU26-1.2.1.3-apt_gpg_key_perms"
    name: "apt gpg key perms: find /etc/apt/trusted.gpg.d /usr/share/keyrings -type f \\( -name \"*.gpg\" -o -name \"*.asc\"…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.3. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /etc/apt/trusted.gpg.d /usr/share/keyrings -type f \( -name "*.gpg" -o -name "*.asc" \) 2>/dev/null | xargs -r stat -c '%U:%G:%a:%n' | grep -Pv -- '^root:root:0?[0246][04][04]:' ; true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-2c602e9f45 |
      APT trusts the keys in /usr/share/keyrings and /etc/apt/trusted.gpg.d to verify package signatures. If a non-root user can modify or replace these keyrings, they can make APT accept packages signed with their own key and gain root at the next installation. Keyrings must be owned by root and not writable by anyone else.
    remediation: &rem-3742f9b777 |
      Review each reported file and set owner root, group root and mode 0644.

      chown root:root FILE
      chmod 0644 FILE

      On Ubuntu 24.04 the check also lists source files in /etc/apt/sources.list.d that have wrong ownership or mode and no Signed-By option; the same commands fix them.
  - id: "CIS-UBUNTU26-1.2.1.4-apt_trusted_gpg_d-attrs"
    name: "/etc/apt/trusted.gpg.d: exists, is a directory, mode 0755 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.4. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/apt/trusted.gpg.d'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -d "$f" ] || echo "$f is not a directory"
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7022)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-b2a7640aee |
      /etc/apt/trusted.gpg.d holds keys that APT trusts for every repository. If other users can write to this directory, they can add their own key and have APT accept packages they sign. The directory must be owned by root and writable only by root.
    remediation: &rem-5c5cc3b1b1 |
      Create /etc/apt/trusted.gpg.d if it is missing, then make it a directory, set owner root and group root and remove the permissions u-s,g-ws,o-w,a-t:

      chown root:root '/etc/apt/trusted.gpg.d'
      chmod u-s,g-ws,o-w,a-t '/etc/apt/trusted.gpg.d'
  - id: "CIS-UBUNTU26-1.2.1.5-apt_auth_conf_d-attrs"
    name: "/etc/apt/auth.conf.d: exists, is a directory, mode 0755 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.5. NIST SP 800-53 Rev. 5: AC-6."
