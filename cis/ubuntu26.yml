    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-47cf4e5814 |
      The kernel log often contains memory addresses, hardware details and error messages that help attackers develop or tune kernel exploits. With kernel.dmesg_restrict set to 1, only processes with CAP_SYSLOG can read it, so unprivileged users cannot use dmesg to gather this information. This check verifies the value in the running kernel.
    remediation: &rem-61b3baa50f |
      Set the kernel parameter kernel.dmesg_restrict to 1, now and at boot:

      sysctl -w 'kernel.dmesg_restrict=1'
      printf '%s\n' 'kernel.dmesg_restrict = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.dmesg_restrict from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU26-1.5.5-dmesg_restrict_configured"
    name: "dmesg restrict configured: grep \"^kernel\\.dmesg_restrict\" $([ -f /etc/sysctl.conf ] \u0026\u0026 echo /etc/sysctl.conf) /etc/s…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.5. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "^kernel\.dmesg_restrict" $([ -f /etc/sysctl.conf ] && echo /etc/sysctl.conf) /etc/sysctl.d/* | cut -d ":" -f2
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ kernel.dmesg_restrict\\s*=\\s*1" }
    rationale: &rat-9cfeb8c631 |
      The kernel log can reveal memory addresses, hardware details and driver errors that help attackers develop kernel exploits. kernel.dmesg_restrict=1 limits reading the kernel ring buffer to privileged users. Persisting it in the sysctl configuration keeps it after reboots.
    remediation: &rem-c1d9d5a6ff |
      Set kernel.dmesg_restrict to 1 in a sysctl drop-in file and apply it to the running kernel.

      printf '%s\n' 'kernel.dmesg_restrict = 1' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w kernel.dmesg_restrict=1

      The check only reads /etc/sysctl.conf and /etc/sysctl.d/; remove or correct any other setting of kernel.dmesg_restrict in these locations.
  - id: "CIS-UBUNTU26-1.5.6-prelink"
    name: "Package prelink is not installed"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.6. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' prelink 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: &rat-18deabdd17 |
      prelink rewrites binaries and libraries to speed up loading. These modifications interfere with file integrity tools such as AIDE and with package verification, and a compromised prelink could alter binaries system-wide. With address space randomization in place it brings little benefit.
    remediation: &rem-ff4898e838 |
      Remove the package prelink, unless the system needs it:

      apt-get purge prelink
  - id: "CIS-UBUNTU26-1.5.7-apport"
    name: "Package apport is not installed"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.7."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' apport 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: &rat-81273dba76 |
      Apport collects crash reports containing memory contents of the crashed process and can offer to send them to external services. It has also had local privilege escalation vulnerabilities. Removing it on servers avoids leaking sensitive data through crash dumps.
    remediation: &rem-cf36188d9e |
      Remove the package apport, unless the system needs it:

      apt-get purge apport
  - id: "CIS-UBUNTU26-1.5.7-error_report_apport_disable-attrs"
    name: "/etc/default/apport: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.7."
