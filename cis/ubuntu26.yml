  - id: "CIS-UBUNTU26-4.1.1-ufw"
    name: "Package ufw is installed"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' ufw 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-8061e449a6 |
      A host firewall limits which network services are reachable and contains the damage of a compromised neighbour. On Debian and Ubuntu, ufw is the simple front end for managing those rules; where another tool such as firewalld, nftables or iptables is chosen, ufw should be absent, because two firewall managers overwrite each other's rules and leave the effective policy unpredictable.
    remediation: &rem-659dd3ebf2 |
      Install the package ufw:

      apt-get install ufw
  - id: "CIS-UBUNTU26-4.1.2-ufw-enabled"
    name: "Service ufw is enabled"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 4.1.2. NIST SP 800-53 Rev. 5: SC-7."
    tags: [cis, cis-ubuntu26, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState ufw | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-8061e449a6
    remediation: &rem-3bd9f4aa3b |
      Enable the service ufw:

      systemctl enable ufw
  - id: "CIS-UBUNTU26-4.1.2-ufw-running"
    name: "Service ufw is running"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 4.1.2. NIST SP 800-53 Rev. 5: SC-7."
    tags: [cis, cis-ubuntu26, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState ufw | cut -d= -f2
    expect: "== active"
    rationale: *rat-8061e449a6
    remediation: &rem-36d5563792 |
      Start the service ufw:

      systemctl start ufw
  - id: "CIS-UBUNTU26-4.1.3-ufw_incoming_default"
    name: "ufw incoming default: ufw status verbose | grep Default:"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 4.1.3. NIST SP 800-53 Rev. 5: SC-7."
    tags: [cis, cis-ubuntu26, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      ufw status verbose | grep Default:
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ deny \\(incoming\\)" }
    rationale: &rat-c67d66bc51 |
      With a default deny policy for incoming traffic, only services explicitly allowed by a firewall rule are reachable from the network. Services started later or listening by mistake stay unreachable until a rule is added, which keeps the exposed attack surface small.
    remediation: &rem-2e19ce171b |
      Allow the services the host must offer (at least SSH for remote administration), set the default incoming policy to deny and make sure ufw is enabled.

      ufw allow 22/tcp
      ufw default deny incoming
      ufw --force enable

      ufw status verbose only shows the default policies while ufw is active.
  - id: "CIS-UBUNTU26-4.1.4-ufw_outgoing_default"
    name: "ufw outgoing default: ufw status verbose | grep Default:"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 4.1.4. NIST SP 800-53 Rev. 5: SC-7."
    tags: [cis, cis-ubuntu26, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      ufw status verbose | grep Default:
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ deny \\(outgoing\\)" }
    rationale: &rat-956c7a9b19 |
      A default deny policy for outgoing traffic limits what a compromised process can reach: data exfiltration, connections to command-and-control servers and lateral movement then need an explicit rule. It requires an allow rule for every legitimate outbound flow (DNS, NTP, package repositories, logging, directory services), so it needs careful planning.
    remediation: &rem-38b909b89e |
      Create allow rules for all required outbound traffic first, then set the default outgoing policy to deny and make sure ufw is enabled.

      ufw allow out 53
      ufw allow out 123/udp
      ufw allow out 80/tcp
      ufw allow out 443/tcp
      ufw default deny outgoing
      ufw --force enable

      Adapt the allow rules to the host before switching the policy, otherwise name resolution, updates and other outbound services stop working.
  - id: "CIS-UBUNTU26-4.1.5-ufw_routed_default"
    name: "ufw routed default: ufw status verbose | grep -Po '\\S+(?= \\(routed\\))' ; grep -Po '^DEFAULT_FORWARD_POLICY=\"\\…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 4.1.5. NIST SP 800-53 Rev. 5: SC-7."
    tags: [cis, cis-ubuntu26, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      ufw status verbose | grep -Po '\S+(?= \(routed\))' ; grep -Po '^DEFAULT_FORWARD_POLICY="\K[A-Z]+' /etc/default/ufw
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(deny|reject|disabled)$" }
      - { some: "~ ^(DROP|REJECT)$" }
    rationale: &rat-3dc87c0be4 |
      Unless the host is meant to be a router, it should not forward packets between interfaces. A deny or disabled policy for routed traffic prevents the system from being used to bypass network segmentation. Container hosts, VPN gateways and virtualization hosts may legitimately need forwarding and should then allow it with explicit route rules.
    remediation: &rem-f43803520f |
      Set the default policy for routed traffic to deny; this also writes DEFAULT_FORWARD_POLICY="DROP" to /etc/default/ufw, which the Ubuntu 26.04 check reads.

      ufw default deny routed
      ufw --force enable

      On hosts that must forward traffic, add explicit ufw route allow rules instead of opening the default policy.
  - id: "CIS-UBUNTU26-5.1.1-sshd_config_perms-attrs"
    name: "/etc/ssh/sshd_config: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-fc2827314f |
      sshd_config controls who may log in remotely and how. If unprivileged users could modify it they could enable root login or weaken authentication, and read access reveals details of the security configuration. It should be owned by root and accessible only by root.
    remediation: &rem-714a840007 |
      Create /etc/ssh/sshd_config if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/ssh/sshd_config'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/ssh/sshd_config'
  - id: "CIS-UBUNTU26-5.1.2-etc_ssh_sshd_config.d-attrs"
    name: "/etc/ssh/sshd_config.d: exists, is a directory, mode 0700 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config.d'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -d "$f" ] || echo "$f is not a directory"
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7077)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-be9edfcccf |
      /etc/ssh/sshd_config.d contains drop-in files that override SSH server settings. If others can write to it, they can add a file that weakens authentication or permits root login. It should be owned by root:root and accessible only by root.
    remediation: &rem-d17368da87 |
      Create /etc/ssh/sshd_config.d if it is missing, then make it a directory, set owner root and group root and remove the permissions u-s,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/ssh/sshd_config.d'
      chmod u-s,g-rwxs,o-rwx,a-t '/etc/ssh/sshd_config.d'
  - id: "CIS-UBUNTU26-5.1.3-etc_ssh_ssh_host_prv_key_group"
    name: "/etc/ssh/ssh host prv key group: groupkeys=$(sudo find /etc/ssh/ -name '*_key' -type f ! -group root ); echo $groupkeys"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      groupkeys=$(sudo find /etc/ssh/ -name '*_key' -type f ! -group root ); echo $groupkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-5ef33206e2 |
      SSH host private keys prove the server's identity to clients. Anyone who can read a host key can impersonate the server and intercept sessions in a man-in-the-middle attack. Keeping the key files in the root group (or the dedicated ssh_keys group on Red Hat systems) ensures that any group read permission does not extend to ordinary users.
    remediation: &rem-369ef6a077 |
      Change the group of each private host key reported by the check to root.

      chgrp root FILE

      On RHEL 9 the group ssh_keys is also accepted by the check.
  - id: "CIS-UBUNTU26-5.1.3-etc_ssh_ssh_host_prv_key_perms"
    name: "/etc/ssh/ssh host prv key perms: keyperms=$(sudo find /etc/ssh/ -name '*_key' -type f -perm /137 ); echo $keyperms"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      keyperms=$(sudo find /etc/ssh/ -name '*_key' -type f -perm /137 ); echo $keyperms
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-7f190524e0 |
      A host private key that other users can read or modify lets them impersonate the SSH server or replace its identity, which enables interception of administrator sessions. Restricting the files to owner read and write keeps the key usable only by sshd. OpenSSH also ignores private keys with overly open permissions, so tight modes avoid unexpected start-up failures.
    remediation: &rem-6abc4b4be2 |
      Remove execute, group write/execute and all permissions for others from each private host key reported by the check. Mode 0600 satisfies every variant.

      chmod 0600 FILE

      Debian 13, and Debian 11 and Ubuntu 22.04/24.04 for keys in the root group, do not accept group read, so do not use 0640 there.
  - id: "CIS-UBUNTU26-5.1.3-etc_ssh_ssh_host_prv_key_user"
    name: "/etc/ssh/ssh host prv key user: userkeys=$(sudo find /etc/ssh/ -name '*_key' -type f ! -user root ); echo $userkeys"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      userkeys=$(sudo find /etc/ssh/ -name '*_key' -type f ! -user root ); echo $userkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-fbdc35f7c9 |
      If a host private key is owned by an account other than root, that account can read, alter or replace the server's identity key, allowing impersonation of the server or a denial of service. Root ownership ensures that only administrators control the key material.
    remediation: &rem-3a33d707b3 |
      Make root the owner of each private host key reported by the check.

      chown root FILE
  - id: "CIS-UBUNTU26-5.1.4-etc_ssh_ssh_host_pub_key_group"
    name: "/etc/ssh/ssh host pub key group: groupkeys=$(sudo find /etc/ssh/ -name '*_key.pub' -type f ! -group root ); echo $groupkeys"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      groupkeys=$(sudo find /etc/ssh/ -name '*_key.pub' -type f ! -group root ); echo $groupkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-7b474e6437 |
      Public host keys are not secret, but they represent the server's identity that clients verify and that key management or monitoring relies on. If a non-root group can modify them, local users could replace the published key material. Root group ownership keeps changes to the server identity limited to administrators.
    remediation: &rem-4bb93212a2 |
      Change the group of each public host key reported by the check to root.

      chgrp root FILE
  - id: "CIS-UBUNTU26-5.1.4-etc_ssh_ssh_host_pub_key_perms"
    name: "/etc/ssh/ssh host pub key perms: keyperms=$(sudo find /etc/ssh/ -name '*_key.pub' -type f -perm /133 ); echo $keyperms"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      keyperms=$(sudo find /etc/ssh/ -name '*_key.pub' -type f -perm /133 ); echo $keyperms
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-33bc1e4eae |
      Public host keys may be world-readable, but write access for group or others would let local users replace them, and the execute bit serves no purpose. Limiting them to mode 0644 or stricter ensures that only root can change the server's published identity.
    remediation: &rem-78675bfedc |
      Remove execute and group/other write permissions from each public host key reported by the check (mode 0644 or stricter).

      chmod u-x,go-wx FILE
  - id: "CIS-UBUNTU26-5.1.4-etc_ssh_ssh_host_pub_key_user"
    name: "/etc/ssh/ssh host pub key user: userkeys=$(sudo find /etc/ssh/ -name '*_key.pub' -type f ! -user root ); echo $userkeys"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      userkeys=$(sudo find /etc/ssh/ -name '*_key.pub' -type f ! -user root ); echo $userkeys
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-e69d03c157 |
      If a public host key is owned by a non-root account, that user can replace it and mislead or disrupt clients that verify the server's identity. Root ownership keeps the published host identity under administrative control.
    remediation: &rem-35eb98c235 |
      Make root the owner of each public host key reported by the check.

      chown root FILE
  - id: "CIS-UBUNTU26-5.1.5-sshd_access_limited"
    name: "SSH access is limited with AllowUsers, AllowGroups, DenyUsers or DenyGroups"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.5. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(allow|deny)(users|groups) +[^ ]'
    allow_rc: any
    expect: { some: "~ ." }
    rationale: &rat-8e5700f652 |
      Restricting SSH logins to explicitly allowed users or groups ensures that only accounts with a need for remote access can log in, even if other accounts have valid credentials or weak passwords. It limits the impact of compromised, forgotten or service accounts.
    remediation: &rem-804a07286e |
      Restrict SSH logins to the users or groups that need them with AllowUsers, AllowGroups, DenyUsers or DenyGroups, according to site policy. Set the directive in the global section of the sshd configuration (in /etc/ssh/sshd_config before any Match block, or in a file in /etc/ssh/sshd_config.d/ where the distribution includes that directory), then validate and reload the SSH service.

      echo 'AllowGroups GROUP' > /etc/ssh/sshd_config.d/10-access.conf
      sshd -t

      When both AllowUsers and AllowGroups are set, a user must match both lists. Make sure your own administrative account is allowed before reloading.
  - id: "CIS-UBUNTU26-5.1.6-ssh_banner"
    name: "ssh banner: sshd -T 2\u003e/dev/null | grep -Ei '^(banner) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.6. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(banner) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^banner\\s+\\S+" }
      - { none: "~ ^banner\\s+none$" }
    rationale: &rat-dd603f8444 |
      A banner shown before SSH authentication informs users that access is restricted and monitored. Such a notice can be a prerequisite for legal action against unauthorized users. The banner text should not reveal system details.
    remediation: &rem-c186f08e58 |
      Make sshd show /etc/issue.net before authentication with a drop-in file, remove any Banner none line, then validate and reload.

      echo 'Banner /etc/issue.net' > /etc/ssh/sshd_config.d/50-banner.conf
      sed -i -E '/^Banner\s+none/Id' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
      sshd -t
      systemctl reload ssh

      Put the site's warning text into /etc/issue.net. The first value of a setting wins, so no earlier file may set another Banner.
  - id: "CIS-UBUNTU26-5.1.6-ssh_configd_banner"
    name: "ssh configd banner: grep -Eis '^\\s*Banner\\s+\"?none\\b' /etc/ssh/sshd_config.d/*.conf"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.6. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis '^\s*Banner\s+"?none\b' /etc/ssh/sshd_config.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-c8f1dd710c |
      A pre-authentication banner shows the organisation's legal notice to everyone who connects, which supports action against unauthorised access and informs users about monitoring. A drop-in file with Banner none silently overrides a banner set in the main configuration, because sshd uses the first value it reads. Checking the drop-ins prevents such an override from removing the warning.
    remediation: &rem-d80aaaa50c |
      Remove every Banner none line from the files in /etc/ssh/sshd_config.d/ and configure a banner file instead; put the site's authorised-use notice into /etc/issue.net.

      grep -Eil '^\s*Banner\s+"?none\b' /etc/ssh/sshd_config.d/*.conf
      echo 'Banner /etc/issue.net' > /etc/ssh/sshd_config.d/01-banner.conf
      sshd -t && systemctl reload sshd

      On RHEL 8, which does not read sshd_config.d by default, set Banner in /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-UBUNTU26-5.1.7-sshd_ciphers"
    name: "sshd ciphers: sshd -T | grep -Pi -- '^ciphers\\h+\\\"?([^#\\n\\r]+,)?((3des|blowfish|cast128|aes(128|192|256…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.7. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -Pi -- '^ciphers\h+\"?([^#\n\r]+,)?((3des|blowfish|cast128|aes(128|192|256))-cbc|arcfour(128|256)?|rijndael-cbc@lysator\.liu\.se)\b'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-020e874b5b |
      Ciphers protect the confidentiality of SSH sessions. Outdated algorithms such as CBC modes, 3DES, Blowfish or RC4 are vulnerable to known attacks, and chacha20-poly1305 is exposed to the Terrapin attack when clients lack the fix. Restricting the server to strong ciphers keeps clients from negotiating a weak one.
    remediation: &rem-6c953ecddd |
      Debian 11 to 13 and Ubuntu 24.04 and later: remove CBC-mode ciphers and chacha20-poly1305 from the server's default cipher list with a drop-in file.

      echo 'Ciphers -3des-cbc,aes128-cbc,aes192-cbc,aes256-cbc,chacha20-poly1305@openssh.com' > /etc/ssh/sshd_config.d/50-ciphers.conf

      Ubuntu 20.04 expects an explicit list of GCM and CTR ciphers in which no CBC, arcfour or chacha20-poly1305 name appears:

      echo 'Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr' > /etc/ssh/sshd_config.d/50-ciphers.conf

      Then validate, reload and check the effective list:

      sshd -t
      systemctl reload ssh
      sshd -T | grep -i '^ciphers'

      Remove other Ciphers lines that are read earlier; the first value wins. Dropping chacha20-poly1305 mitigates the Terrapin attack for clients without the strict key exchange fix.
  - id: "CIS-UBUNTU26-5.1.8-sshd_clientalive"
    name: "sshd clientalive: sshd -T 2\u003e/dev/null | grep -Ei '^(clientaliveinterval|clientalivecountmax) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.8. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(clientaliveinterval|clientalivecountmax) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^clientaliveinterval [1-9][0-9]*$" }
      - { some: "~ ^clientalivecountmax [1-9][0-9]*$" }
    rationale: &rat-3cc59b4363 |
      SSH connections whose client has crashed or lost the network can stay open indefinitely, holding resources and leaving a session that might be resumed or hijacked. ClientAliveInterval and ClientAliveCountMax make sshd send keepalive probes through the encrypted channel and disconnect when the client stops answering. This does not end sessions of an idle client that is still connected.
    remediation: &rem-b77f98827e |
      Set ClientAliveInterval 15 (300 on Ubuntu 20.04 and 22.04) and ClientAliveCountMax 3 in the SSH server configuration and remove conflicting ClientAlive lines; the check expects exactly these values.

      printf '%s\n' 'ClientAliveInterval 15' 'ClientAliveCountMax 3' > /etc/ssh/sshd_config.d/01-clientalive.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i clientalive

      On Ubuntu 20.04 and 22.04 write 'ClientAliveInterval 300' instead of 15. If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d; then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-UBUNTU26-5.1.9-sshd_disableforwarding"
    name: "sshd disableforwarding: sshd -T 2\u003e/dev/null | grep -Ei '^(disableforwarding) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.9. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(disableforwarding) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^disableforwarding yes$" }
    rationale: &rat-6433883942 |
      SSH forwarding lets a logged-in user tunnel TCP connections, X11 sessions, agent and Unix sockets through the server, which can bypass firewalls and monitoring or expose internal services. DisableForwarding turns off all forms of forwarding at once. Hosts that legitimately need tunnels, such as jump hosts, should be handled as documented exceptions.
    remediation: &rem-75202a6e41 |
      Set DisableForwarding yes and remove any DisableForwarding no line. On Ubuntu 22.04 the check also rejects an active X11Forwarding yes line, which the default sshd_config contains, so comment it out.

      echo 'DisableForwarding yes' > /etc/ssh/sshd_config.d/01-disableforwarding.conf
      sed -ri 's/^(X11Forwarding\s+yes)/#\1/I' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i disableforwarding

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d; then set it at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-UBUNTU26-5.1.10-sshd_gssapiauth"
    name: "sshd gssapiauth: sshd -T 2\u003e/dev/null | grep -Ei '^(gssapiauthentication) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.10. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(gssapiauthentication) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^gssapiauthentication no$" }
    rationale: &rat-58c6a573dc |
      GSSAPI authentication, usually Kerberos, adds complex authentication code to the SSH server. Systems that do not use Kerberos single sign-on should disable it to reduce attack surface and avoid delays from failing lookups.
    remediation: &rem-b686a1dc10 |
      Turn off GSSAPI authentication with a drop-in file and comment out any GSSAPIAuthentication yes line, then validate and reload.

      echo 'GSSAPIAuthentication no' > /etc/ssh/sshd_config.d/50-gssapi.conf
      sed -i -E 's/^\s*GSSAPIAuthentication\s+yes/#&/I' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
      sshd -t
      systemctl reload ssh
  - id: "CIS-UBUNTU26-5.1.11-ssh_hostbased_auth"
    name: "ssh hostbased auth: sshd -T 2\u003e/dev/null | grep -Ei '^(hostbasedauthentication) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.11. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(hostbasedauthentication) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^hostbasedauthentication no$" }
    rationale: &rat-ad0dd2cb95 |
      Host-based authentication trusts a client because of the machine it connects from rather than authenticating the individual user. A compromised or spoofed trusted host then grants access to accounts on this server without any user credential. Disabling it ensures every login is authenticated per user.
    remediation: &rem-620aa5f782 |
      Set HostbasedAuthentication no in the SSH server configuration and remove any HostbasedAuthentication yes line.

      echo 'HostbasedAuthentication no' > /etc/ssh/sshd_config.d/01-hostbasedauthentication.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i hostbasedauthentication

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-UBUNTU26-5.1.12-ssh_rhosts"
    name: "ssh rhosts: sshd -T 2\u003e/dev/null | grep -Ei '^(ignorerhosts) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.12. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(ignorerhosts) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^ignorerhosts yes$" }
    rationale: &rat-037db005cf |
      Legacy .rhosts and .shosts files let users grant password-less access to their account from other hosts, outside of any central control. IgnoreRhosts makes sshd disregard these files, so such per-user trust relationships cannot be used to log in.
    remediation: &rem-0ad83b2018 |
      Set IgnoreRhosts yes in the SSH server configuration and remove any IgnoreRhosts no line.

      echo 'IgnoreRhosts yes' > /etc/ssh/sshd_config.d/01-ignorerhosts.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i ignorerhosts

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-UBUNTU26-5.1.13-sshd_KEX"
    name: "sshd KEX: sshd -T | grep -Pi -- 'kexalgorithms\\h+([^#\\n\\r]+,)?(diffie-hellman-group1-sha1|diffie-he…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.13. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -Pi -- 'kexalgorithms\h+([^#\n\r]+,)?(diffie-hellman-group1-sha1|diffie-hellman-group14-sha1|diffie-hellman-group-exchange-sha1)\b'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-4e0cce0b15 |
      The key exchange establishes the keys that protect the whole SSH session. Methods based on SHA-1 or the 1024-bit group 1 are considered too weak and could let a well-resourced attacker break or downgrade session security. Restricting key exchange to elliptic-curve and large-group SHA-2 methods keeps connections confidential; very old clients that only support legacy methods will no longer connect.
    remediation: &rem-f34b782887 |
      Remove the SHA-1 based Diffie-Hellman methods and delete other KexAlgorithms lines so the new value is the first one sshd reads. On Debian 11 to 13 and Ubuntu 22.04 and later:

      echo 'KexAlgorithms -diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1' > /etc/ssh/sshd_config.d/01-kex.conf

      On Ubuntu 20.04 the check expects an explicit list instead:

      echo 'KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group14-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256' > /etc/ssh/sshd_config.d/01-kex.conf

      Then run sshd -t && systemctl reload ssh and verify with sshd -T | grep -i kexalgorithms.
  - id: "CIS-UBUNTU26-5.1.14-sshd_pqc_kex"
    name: "sshd pqc kex: sshd -T | grep -i kexalgorithms"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.14. NIST SP 800-53 Rev. 5: SC-8."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -i kexalgorithms
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ sntrup761x25519-sha512" }
      - { some: "~ mlkem768x25519-sha256" }
    rationale: &rat-ceb33c2ee2 |
      SSH traffic recorded today could be decrypted later once quantum computers can break classical key exchange (store now, decrypt later). Hybrid key exchange methods such as sntrup761x25519-sha512 and mlkem768x25519-sha256 combine a classical and a post-quantum algorithm, so session keys stay protected even if one of them is broken.
    remediation: &rem-702ab8404b |
      Make sure the effective KexAlgorithms list contains the hybrid post-quantum methods. Without a KexAlgorithms setting the OpenSSH defaults already include them; otherwise fix the restrictive line or set the list in a drop-in that sorts before the others, because sshd uses the first value it reads.

      On Ubuntu 24.04 (OpenSSH 9.6):
      printf '%s\n' 'KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256' > /etc/ssh/sshd_config.d/01-kex.conf

      On Ubuntu 26.04:
      printf '%s\n' 'KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256' > /etc/ssh/sshd_config.d/01-kex.conf

      sshd -t && systemctl reload ssh

      OpenSSH before 9.9 only knows the name sntrup761x25519-sha512@openssh.com and refuses to start with the short name or mlkem768x25519-sha256.
  - id: "CIS-UBUNTU26-5.1.15-ssh_logingrace"
    name: "ssh logingrace: sshd -T 2\u003e/dev/null | grep -Ei '^(logingracetime) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.15. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(logingracetime) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^logingracetime ([1-9]|[1-5][0-9]|60)$" }
    rationale: &rat-a9975bf989 |
      LoginGraceTime limits how long an unauthenticated connection may stay open. A long grace period lets attackers hold many pending connections, exhausting the startup slots and locking out legitimate users, and gives more time for each guessing attempt. One minute or less is ample for real logins.
    remediation: &rem-888f194a5f |
      Set LoginGraceTime to 60 seconds or less, written as a plain number (for example 60, not 1m), and remove conflicting lines.

      echo 'LoginGraceTime 60' > /etc/ssh/sshd_config.d/01-logingracetime.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i logingracetime

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-UBUNTU26-5.1.16-ssh_loglevel"
    name: "ssh loglevel: sshd -T 2\u003e/dev/null | grep -Ei '^(loglevel) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.16. NIST SP 800-53 Rev. 5: AU-3, AU-12, SI-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(loglevel) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^loglevel (VERBOSE|INFO)$" }
    rationale: &rat-210132db63 |
      At INFO level sshd records logins and logouts, and VERBOSE additionally records the fingerprint of the key used, which is valuable for investigations. Lower levels hide attacks, while DEBUG levels can log sensitive details and flood the logs. INFO or VERBOSE gives a useful audit trail.
    remediation: &rem-44ccef0bbc |
      Set LogLevel VERBOSE (INFO is also accepted) and remove any LogLevel DEBUG line.

      echo 'LogLevel VERBOSE' > /etc/ssh/sshd_config.d/01-loglevel.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i loglevel

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-UBUNTU26-5.1.17-sshd_MACS"
    name: "sshd MACS: sshd -T | grep -Pi -- 'macs\\h+([^#\\n\\r]+,)?(hmac-md5|hmac-md5-96|hmac-ripemd160|hmac-sha1…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.17. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T | grep -Pi -- 'macs\h+([^#\n\r]+,)?(hmac-md5|hmac-md5-96|hmac-ripemd160|hmac-sha1-96|umac-64@openssh\.com|hmac-md5-etm@openssh\.com|hmac-md5-96-etm@openssh\.com|hmac-ripemd160-etm@openssh\.com|hmac-sha1-96-etm@openssh\.com|umac-64-etm@openssh\.com|umac-128-etm@openssh\.com)\b'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-a16db2eaa8 |
      Message authentication codes protect SSH traffic against tampering. MD5, RIPEMD-160, truncated 96-bit and 64-bit UMAC algorithms provide weak or reduced integrity protection and may allow forgery or downgrade attacks. Limiting sshd to SHA-2 based MACs keeps integrity protection strong; very old clients may need an upgrade.
    remediation: &rem-0e4e160b54 |
      Remove the weak MACs and delete other MACs lines so the new value is the first one sshd reads. On Debian 11 to 13 and Ubuntu 22.04 and later:

      echo 'MACs -hmac-md5,hmac-md5-96,hmac-ripemd160,hmac-sha1-96,umac-64@openssh.com,hmac-md5-etm@openssh.com,hmac-md5-96-etm@openssh.com,hmac-ripemd160-etm@openssh.com,hmac-sha1-96-etm@openssh.com,umac-64-etm@openssh.com,umac-128-etm@openssh.com' > /etc/ssh/sshd_config.d/01-macs.conf

      On Ubuntu 20.04 the check expects an explicit list that contains hmac-sha2-512, hmac-sha2-256 and hmac-sha1 and no -etm or umac algorithms:

      echo 'MACs hmac-sha2-512,hmac-sha2-256,hmac-sha1' > /etc/ssh/sshd_config.d/01-macs.conf

      Then run sshd -t && systemctl reload ssh and verify with sshd -T | grep -i macs.
  - id: "CIS-UBUNTU26-5.1.18-sshd_authtries"
    name: "sshd authtries: sshd -T 2\u003e/dev/null | grep -Ei '^(maxauthtries) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.18. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(maxauthtries) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^maxauthtries [1-4]$" }
    rationale: &rat-7ebfd780b6 |
      MaxAuthTries caps the number of authentication attempts per connection. A low limit slows down online password guessing, because attackers must reconnect frequently, and failures are logged sooner. Four attempts is enough for normal use.
    remediation: &rem-64bb4487b3 |
      Set MaxAuthTries to 4 or less and remove lines with higher values.

      echo 'MaxAuthTries 4' > /etc/ssh/sshd_config.d/01-maxauthtries.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i maxauthtries

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh. On Debian 12, Ubuntu 20.04 and 22.04 and SUSE 15 the check also counts commented lines, so delete the commented default as well: sed -i -E '/^\s*#\s*MaxAuthTries\s/Id' /etc/ssh/sshd_config
  - id: "CIS-UBUNTU26-5.1.19-ssh_maxsessions"
    name: "ssh maxsessions: sshd -T 2\u003e/dev/null | grep -Ei '^(maxsessions) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.19. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(maxsessions) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^maxsessions ([1-9]|10)$" }
    rationale: &rat-5de57ba7dd |
      MaxSessions limits how many shell, login or subsystem sessions can be multiplexed over one SSH connection. Without a cap, a single authenticated connection could open a large number of sessions and exhaust server resources. A limit of 10 still accommodates normal multiplexing.
    remediation: &rem-d4bf1cc141 |
      Set MaxSessions to 10 or less and remove lines with higher values.

      echo 'MaxSessions 10' > /etc/ssh/sshd_config.d/01-maxsessions.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i maxsessions

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-UBUNTU26-5.1.20-ssh_maxstartups"
    name: "ssh maxstartups: sshd -T 2\u003e/dev/null | grep -Ei '^(maxstartups) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.20. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(maxstartups) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^maxstartups ([1-9]|10):([1-9]|[12][0-9]|30):([1-9]|[1-5][0-9]|60)$" }
    rationale: &rat-32a21f45bb |
      MaxStartups controls how many unauthenticated connections sshd accepts at the same time. With 10:30:60, sshd starts refusing new unauthenticated connections at random once 10 are pending, with rising probability up to a hard limit of 60. This blunts connection floods and brute-force tools while legitimate users still get through.
    remediation: &rem-36fe032f0c |
      Set MaxStartups 10:30:60 and remove conflicting MaxStartups lines.

      echo 'MaxStartups 10:30:60' > /etc/ssh/sshd_config.d/01-maxstartups.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i maxstartups

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-UBUNTU26-5.1.21-ssh_empty_passwd"
    name: "ssh empty passwd: sshd -T 2\u003e/dev/null | grep -Ei '^(permitemptypasswords) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.21. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(permitemptypasswords) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^permitemptypasswords no$" }
    rationale: &rat-861378e10c |
      If an account has an empty password and sshd accepts it, anyone can log in to that account remotely without a credential. PermitEmptyPasswords no makes sshd refuse such logins regardless of how the account is configured.
    remediation: &rem-0c40a7ec4d |
      Set PermitEmptyPasswords no and remove any PermitEmptyPasswords yes line.

      echo 'PermitEmptyPasswords no' > /etc/ssh/sshd_config.d/01-permitemptypasswords.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i permitemptypasswords

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-UBUNTU26-5.1.22-ssh_permit_root"
    name: "ssh permit root: sshd -T 2\u003e/dev/null | grep -Ei '^(permitrootlogin) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.22. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(permitrootlogin) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^permitrootlogin no$" }
    rationale: &rat-47fd7571af |
      Direct root logins over SSH expose the most powerful account to password guessing and leave no record of which administrator acted. Requiring personal accounts with escalation through sudo or su adds accountability and an extra barrier. Automation that needs root can use dedicated accounts with restricted sudo rules.
    remediation: &rem-49bd30d8bb |
      Set PermitRootLogin no and remove any PermitRootLogin yes line. Make sure an administrative account with sudo access works before reloading sshd.

      echo 'PermitRootLogin no' > /etc/ssh/sshd_config.d/01-permitrootlogin.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i permitrootlogin

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-UBUNTU26-5.1.23-ssh_userenv"
    name: "ssh userenv: sshd -T 2\u003e/dev/null | grep -Ei '^(permituserenvironment) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.23. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(permituserenvironment) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^permituserenvironment no$" }
    rationale: &rat-a46f1c4dfd |
      PermitUserEnvironment lets users pass environment variables through ~/.ssh/environment or authorized_keys options. Variables such as LD_PRELOAD or PATH can bypass restrictions like forced commands or restricted shells and run attacker-chosen code. Disabling it keeps the session environment under administrative control.
    remediation: &rem-b672df6f9a |
      Set PermitUserEnvironment no and remove any PermitUserEnvironment yes line.

      echo 'PermitUserEnvironment no' > /etc/ssh/sshd_config.d/01-permituserenvironment.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i permituserenvironment

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-UBUNTU26-5.1.24-ssh_usepam"
    name: "ssh usepam: sshd -T 2\u003e/dev/null | grep -Ei '^(usepam) '"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.1.24. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(usepam) '
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^usepam yes$" }
    rationale: &rat-20d91b73a4 |
      With UsePAM enabled, sshd runs the PAM account and session stacks, so lockout after failed logins, password expiry, access restrictions and session limits configured in PAM also apply to SSH logins. Without it these controls are bypassed for remote access.
    remediation: &rem-5c14f62bd4 |
      Set UsePAM yes and remove any UsePAM no line.

      echo 'UsePAM yes' > /etc/ssh/sshd_config.d/01-usepam.conf
      sshd -t && systemctl reload sshd
      sshd -T | grep -i usepam

      If sshd -T does not show the new value, an earlier line wins or sshd_config does not include sshd_config.d (as on RHEL 7 and 8, where the RHEL 7 check also reads only that file); then set the value at the top of /etc/ssh/sshd_config. On Debian and Ubuntu the service is called ssh.
  - id: "CIS-UBUNTU26-5.2.1-sudo"
    name: "Package sudo is installed"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.2.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' sudo 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-f5f9e1cba7 |
      sudo lets administrators run privileged commands with their own credentials instead of a shared root password. That gives individual accountability, fine-grained permissions and a log of every privileged command.
    remediation: &rem-83b291c388 |
      Install the package sudo:

      apt-get install sudo
  - id: "CIS-UBUNTU26-5.2.2-sudoers_use_pty-attrs"
    name: "/etc/sudoers: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.2.2. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/sudoers'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e7f078fa91 |
      When sudo runs a command without a pseudo terminal, a malicious program can keep running in the background and inject keystrokes into the user's terminal after sudo returns. use_pty runs commands in a separate pty, which prevents this and also enables reliable I/O logging.
    remediation: &rem-b6090d151e |
      Create /etc/sudoers.
  - id: "CIS-UBUNTU26-5.2.2-sudoers_use_pty-content"
    name: "/etc/sudoers has the expected content (1 rule)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.2.2. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/sudoers'
    allow_rc: any
    expect: { some: "~ ^Defaults.*\\suse_pty" }
    rationale: *rat-e7f078fa91
    remediation: &rem-b9e3ac8490 |
      Edit /etc/sudoers so that its lines meet these conditions (regular expressions):

      - a line matches ^Defaults.*\suse_pty
  - id: "CIS-UBUNTU26-5.2.2-pty_sudoers_d"
    name: "pty sudoers d: grep -rhEs '^\\s*Defaults\\s+([^#]+,\\s*)?!use_pty' /etc/sudoers /etc/sudoers.d/; true"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.2.2. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -rhEs '^\s*Defaults\s+([^#]+,\s*)?!use_pty' /etc/sudoers /etc/sudoers.d/; true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-63218cca98 |
      With use_pty, sudo runs commands in a separate pseudo-terminal. A malicious program started through sudo then cannot inject input into the user's terminal or keep access to it after sudo exits. It also makes I/O logging complete.
    remediation: &rem-bf550576ff |
      Enable use_pty with a line of its own in a file under /etc/sudoers.d/, remove any Defaults !use_pty setting and validate the syntax.

      echo 'Defaults use_pty' > /etc/sudoers.d/50-use_pty
      chmod 0440 /etc/sudoers.d/50-use_pty
      grep -rnE '^\s*Defaults.*!use_pty' /etc/sudoers /etc/sudoers.d/
      visudo -c

      sudo ignores files in /etc/sudoers.d/ whose names contain a dot or end with ~.
  - id: "CIS-UBUNTU26-5.2.3-log_sudoers_d"
    name: "log sudoers d: bash -c 'if journalctl -t sudo -t sudo-rs --no-pager -q -n 1 2\u003e/dev/null | grep -q .; the…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.2.3. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      bash -c 'if journalctl -t sudo -t sudo-rs --no-pager -q -n 1 2>/dev/null | grep . >/dev/null; then echo "method A: sudo events reach the journal"; fi
      if grep -rPsiq "^\h*Defaults\h+([^#]+,\h*)?logfile\h*=\h*(\"|\x27)?\H+" /etc/sudoers /etc/sudoers.d/; then echo "method B: sudo logfile is set"; fi
      true'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ method (A|B):" }
    rationale: &rat-73ffb83e75 |
      A dedicated sudo log file records every sudo invocation with user, terminal, working directory and command. That makes privileged activity easy to review and keeps the record separate from general system logs.
    remediation: &rem-b7aaa6ded0 |
      Configure a dedicated sudo log file under /var/log in a Defaults line of its own and validate the syntax.

      echo 'Defaults logfile="/var/log/sudo.log"' > /etc/sudoers.d/50-logfile
      chmod 0440 /etc/sudoers.d/50-logfile
      visudo -c
  - id: "CIS-UBUNTU26-5.2.4-nopasswd_sudoers_d"
    name: "nopasswd sudoers d: grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v '.*\\:#'"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.2.4. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v '.*\:#'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-eecb763928 |
      NOPASSWD lets users run commands with elevated privileges without entering their password. Anyone who gains access to such an account, or a process running as it, obtains root immediately. Requiring the password confirms the person and limits the impact of a hijacked session.
    remediation: &rem-a35cd5880e |
      Review every listed sudo rule with NOPASSWD and remove the tag (or the rule) unless a documented exception applies. Edit the files with visudo so syntax errors are caught.

      grep -rn NOPASSWD /etc/sudoers /etc/sudoers.d/
      visudo -f FILE

      Users who lose NOPASSWD need a password to use sudo. On cloud images the default user (for example via /etc/sudoers.d/90-cloud-init-users) often has none; set one first, or you may lose administrative access.
  - id: "CIS-UBUNTU26-5.2.5-authenticate_sudoers"
    name: "authenticate sudoers: grep -r \"^[^#].*\\!authenticate\" /etc/sudoers*"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.2.5. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -r "^[^#].*\!authenticate" /etc/sudoers*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-0aa92719bf |
      The !authenticate option lets sudo run commands without asking for the user's password. Anyone who gets hold of an unlocked session or a compromised account of such a user can then act with elevated privileges without any further barrier. Requiring re-authentication for sudo keeps privilege escalation tied to knowledge of the password.
    remediation: &rem-f4fb208b6d |
      Remove the !authenticate option from every sudoers rule and Defaults line reported by the check. Edit each file with visudo so that the syntax is validated before it is saved.

      grep -rn '!authenticate' /etc/sudoers /etc/sudoers.d/
      visudo -f /etc/sudoers
      visudo -f /etc/sudoers.d/FILE

      Affected users will be asked for their password again when they use sudo.
  - id: "CIS-UBUNTU26-5.2.6-sudo_timeout"
    name: "sudo timeout: grep -rP \"timestamp_timeout=\\K[0-9]*\" /etc/sudoers*"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.2.6. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -rP "timestamp_timeout=\K[0-9]*" /etc/sudoers*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ timestamp_timeout=(-1|1[6-9]|[2-9][0-9]|[1-9][0-9]{2,})" }
      - { some: "~ timestamp_timeout=([5-9]|1[0-5])" }
    rationale: &rat-14f3ec7a75 |
      After a successful authentication, sudo caches the credentials for a while so that further commands do not ask for the password again. A long or unlimited cache lets anyone with access to an unattended terminal run privileged commands. Keeping the timeout at 15 minutes or less limits that window while staying practical for administrators.
    remediation: &rem-391bdc9433 |
      Set the sudo credential cache timeout to 15 minutes or less in a sudoers drop-in file, and remove larger or negative timestamp_timeout values from all other sudoers files.

      grep -rn 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/
      echo 'Defaults timestamp_timeout=15' > /etc/sudoers.d/50-timestamp-timeout
      chmod 0440 /etc/sudoers.d/50-timestamp-timeout
      visudo -c

      Write the value without spaces around the equals sign; the check searches for timestamp_timeout=VALUE literally.
  - id: "CIS-UBUNTU26-5.2.7-su_conf-attrs"
    name: "/etc/pam.d/su: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/su'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-de1d2faee1 |
      Restricting su through pam_wheel to members of a specific group prevents ordinary users from switching to root even if they learn the root password. An empty dedicated group effectively forces administrators to use sudo, which logs individual actions.
    remediation: &rem-d67efd69b0 |
      Create /etc/pam.d/su.
  - id: "CIS-UBUNTU26-5.2.7-su_conf-content"
    name: "/etc/pam.d/su has the expected content (1 rule)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/su'
    allow_rc: any
    expect: { some: "~ ^\\s*auth\\s+(required|requisite)\\s+pam_wheel\\.so\\s+(\\S+\\s+)*(use_uid\\s+(\\S+\\s+)*group=\\S+|group=\\S+\\s+(\\S+\\s+)*use_uid)(\\s|$)" }
    rationale: *rat-de1d2faee1
    remediation: &rem-ee23a5a1dd |
      Edit /etc/pam.d/su so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*auth\s+(required|requisite)\s+pam_wheel\.so\s+(\S+\s+)*(use_uid\s+(\S+\s+)*group=\S+|group=\S+\s+(\S+\s+)*use_uid)(\s|$)
  - id: "CIS-UBUNTU26-5.2.7-sugroup_etc_group"
    name: "The group that pam_wheel allows to use su has no members"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      g=$(sed -nE 's/^[[:space:]]*auth[[:space:]]+(required|requisite)[[:space:]]+pam_wheel\.so[[:space:]](.*[[:space:]])?group=([^[:space:]]+).*/\3/p' /etc/pam.d/su 2>/dev/null | sed -n 1p)
      if [ -z "$g" ]; then echo "pam_wheel in /etc/pam.d/su names no group"; exit 0; fi
      e=$(getent group "$g")
      if [ -z "$e" ]; then echo "group $g does not exist"; exit 0; fi
      echo "$e" | awk -F: '$4 != "" {print "group " $1 " has members: " $4}'
    allow_rc: any
    expect: empty
    rationale: &rat-575a3911d0 |
      Restricting su with pam_wheel to members of a dedicated group prevents ordinary users from switching to root or other accounts by guessing or knowing their passwords. Using an empty group makes su usable only by root, so administrators must use sudo, which is logged per user. The group must exist and have no members.
    remediation: &rem-80fba87223 |
      Create a group without members and restrict su to it with pam_wheel in /etc/pam.d/su. The group can have any name; sugroup is an example.

      groupadd sugroup
      gpasswd -M '' sugroup
      grep -Eq '^\s*auth\s+(required|requisite)\s+pam_wheel\.so\s.*group=' /etc/pam.d/su || sed -i '/^auth\s\+sufficient\s\+pam_rootok.so/a auth required pam_wheel.so use_uid group=sugroup' /etc/pam.d/su

      If pam_wheel already names a group, remove its members instead: gpasswd -M '' GROUP.
  - id: "CIS-UBUNTU26-5.3.1.1-libpam-runtime"
    name: "Package libpam-runtime is installed"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' libpam-runtime 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-d12af28ab2 |
      PAM is the framework through which login, sudo, su and other services authenticate users and apply account policy. libpam-runtime provides the shared configuration and the pam-auth-update tool that maintain the common PAM stack on Debian-based systems. Without it the authentication policy cannot be managed consistently.
    remediation: &rem-fadd178445 |
      Install the package libpam-runtime:

      apt-get install libpam-runtime
  - id: "CIS-UBUNTU26-5.3.1.2-libpam-modules"
    name: "Package libpam-modules is installed"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' libpam-modules 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-2de35c7416 |
      libpam-modules supplies the standard PAM modules such as pam_unix, pam_faillock and pam_pwhistory, which implement password verification, account lockout and password history. Many authentication hardening controls depend on these modules being installed.
    remediation: &rem-907ab60500 |
      Install the package libpam-modules:

      apt-get install libpam-modules
  - id: "CIS-UBUNTU26-5.3.1.3-libpam-pwquality"
    name: "Package libpam-pwquality is installed"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.1.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' libpam-pwquality 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-6bfcd4d189 |
      The pam_pwquality module rejects weak passwords when they are set, checking length, character classes, dictionary words and similarity to the previous password. Installing it is a prerequisite for enforcing password complexity rules on Debian-based systems.
    remediation: &rem-ff91ae64a0 |
      Install the package libpam-pwquality:

      apt-get install libpam-pwquality
  - id: "CIS-UBUNTU26-5.3.1.4-cracklib-runtime"
    name: "Package cracklib-runtime is installed"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.1.4. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' cracklib-runtime 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-7ad01b26a0 |
      cracklib-runtime provides the word dictionary and utilities used by password quality checks to reject passwords built from common words. Without it, dictionary checks cannot work and easily guessable passwords may be accepted.
    remediation: &rem-5a1ea93c66 |
      Install the package cracklib-runtime:

      apt-get install cracklib-runtime
  - id: "CIS-UBUNTU26-5.3.2.1-pam_unix_enabled_common_act-attrs"
    name: "/etc/pam.d/common-account: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/common-account'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ed327f45f5 |
      pam_unix performs the traditional account checks against /etc/passwd and /etc/shadow, including account expiry and password ageing. If the standard pam_unix entry is missing from common-account, expired or disabled local accounts might still be accepted by PAM-aware services.
    remediation: &rem-d4c3aa62b6 |
      Create /etc/pam.d/common-account.
  - id: "CIS-UBUNTU26-5.3.2.1-pam_unix_enabled_common_act-content"
    name: "/etc/pam.d/common-account has the expected content (1 rule)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/common-account'
    allow_rc: any
    expect: { some: "~ ^account\\s*\\[success=\\d new_authtok_reqd=done default=ignore\\]\\s*pam_unix.so" }
    rationale: *rat-ed327f45f5
    remediation: &rem-b84d66a879 |
      Edit /etc/pam.d/common-account so that its lines meet these conditions (regular expressions):

      - a line matches ^account\s*\[success=\d new_authtok_reqd=done default=ignore\]\s*pam_unix.so
  - id: "CIS-UBUNTU26-5.3.2.1-pam_unix_enabled_common_auth-attrs"
    name: "/etc/pam.d/common-auth: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/common-auth'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d174e36dc2 |
      The pam_unix entry in common-auth verifies local users' passwords against /etc/shadow. If it is missing or altered, local authentication may fail entirely or be decided by other modules in an unintended way. Keeping the standard entry ensures passwords are actually verified.
    remediation: &rem-a058bc1876 |
      Create /etc/pam.d/common-auth.
  - id: "CIS-UBUNTU26-5.3.2.1-pam_unix_enabled_common_auth-content"
    name: "/etc/pam.d/common-auth has the expected content (1 rule)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/common-auth'
    allow_rc: any
    expect: { some: "~ ^\\s*auth\\s+\\[success=\\d default=.*\\]\\s+pam_unix.so" }
    rationale: *rat-d174e36dc2
    remediation: &rem-3f4931220d |
      Edit /etc/pam.d/common-auth so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*auth\s+\[success=\d default=.*\]\s+pam_unix.so
  - id: "CIS-UBUNTU26-5.3.2.1-pam_unix_enabled_common_password-attrs"
    name: "/etc/pam.d/common-password: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/common-password'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-c2b2455ea5 |
      The pam_unix entry in common-password writes new local passwords and determines the hashing algorithm used to store them. Without it password changes are not stored correctly and hashes may not meet policy.
    remediation: &rem-24dae7c4b7 |
