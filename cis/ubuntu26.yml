    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-03dad5bfa7 |
      When route_localnet is enabled, the kernel routes packets with 127.0.0.0/8 addresses to and from external interfaces. Services that listen only on localhost, assuming they are unreachable from the network, could then be reached by remote attackers, as happened with kubelet and similar components. This check verifies the value in the running kernel.
    remediation: &rem-566dc8e9ab |
      Set the kernel parameter net.ipv4.conf.all.route_localnet to 0, now and at boot:

      sysctl -w 'net.ipv4.conf.all.route_localnet=0'
      printf '%s\n' 'net.ipv4.conf.all.route_localnet = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.conf.all.route_localnet from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU26-3.3.1.19-ipv4_route_localnet"
    name: "ipv4 route localnet: grep \"net\\.ipv4\\.conf\\.all\\.route_localnet\" $([ -f /etc/sysctl.conf ] \u0026\u0026 echo /etc/sysctl…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.3.1.19. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "net\.ipv4\.conf\.all\.route_localnet" $([ -f /etc/sysctl.conf ] && echo /etc/sysctl.conf) /etc/sysctl.d/*
    allow_rc: any
    expect:
