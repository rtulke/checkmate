  - id: "CIS-UBUNTU26-1.5.12-coredump_storage-attrs"
    name: "/etc/systemd/coredump.conf.d/60-coredump.conf: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.12. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/coredump.conf.d/60-coredump.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1b3c070ac8 |
      Core dumps contain the memory of the crashed process, which can include passwords, keys and other sensitive data, and they can consume a lot of disk space. Setting Storage=none in systemd-coredump stops dumps from being written to disk while crashes are still logged. Developers who need dumps for debugging can enable them temporarily.
    remediation: *rem-a8c378dcf3
