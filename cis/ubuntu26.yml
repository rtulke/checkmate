    allow_rc: any
    expect: { some: "~ Acquire::AllowWeakRepositories\\s+\"0\";" }
    rationale: *rat-c20a5e7988
    remediation: &rem-0f263757ac |
      Edit /etc/apt/apt.conf.d/99-no-insecure-repositories so that its lines meet these conditions (regular expressions):

      - a line matches Acquire::AllowWeakRepositories\s+"0";
  - id: "CIS-UBUNTU26-1.2.1.14-apt_allow_downgrade_to_insecure_reposito-attrs"
    name: "/etc/apt/apt.conf.d/99-no-insecure-repositories: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.14. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/apt/apt.conf.d/99-no-insecure-repositories'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-346f62c9c3 |
      An attacker who controls the network path could serve a previously signed repository without its signature to bypass verification. Setting Acquire::AllowDowngradeToInsecureRepositories to 0 prevents a signed repository from silently becoming unauthenticated.
    remediation: *rem-3cabd87d7e
  - id: "CIS-UBUNTU26-1.2.1.14-apt_allow_downgrade_to_insecure_reposito-content"
    name: "/etc/apt/apt.conf.d/99-no-insecure-repositories has the expected content (1 rule)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.14. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/apt/apt.conf.d/99-no-insecure-repositories'
    allow_rc: any
    expect: { some: "~ Acquire::AllowDowngradeToInsecureRepositories\\s+\"0\";" }
    rationale: *rat-346f62c9c3
    remediation: &rem-ed7c97ba41 |
      Edit /etc/apt/apt.conf.d/99-no-insecure-repositories so that its lines meet these conditions (regular expressions):

      - a line matches Acquire::AllowDowngradeToInsecureRepositories\s+"0";
  - id: "CIS-UBUNTU26-1.2.1.15-apt_check_date-attrs"
    name: "/etc/apt/apt.conf.d/99-no-insecure-repositories: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.15. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/apt/apt.conf.d/99-no-insecure-repositories'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-b3f6f12a46 |
      Repository metadata carries a Date and often a Valid-Until field. Checking them detects replayed old metadata (freeze attacks) that would hide newer security updates from the system, as well as metadata from the future. Acquire::Check-Date makes APT reject metadata with implausible dates.
    remediation: *rem-3cabd87d7e
  - id: "CIS-UBUNTU26-1.2.1.15-apt_check_date-content"
    name: "/etc/apt/apt.conf.d/99-no-insecure-repositories has the expected content (1 rule)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.1.15. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/apt/apt.conf.d/99-no-insecure-repositories'
    allow_rc: any
    expect: { some: "~ Acquire::Check-Date\\s+\"true\";" }
    rationale: *rat-b3f6f12a46
    remediation: &rem-1faa988191 |
      Edit /etc/apt/apt.conf.d/99-no-insecure-repositories so that its lines meet these conditions (regular expressions):

      - a line matches Acquire::Check-Date\s+"true";
  - id: "CIS-UBUNTU26-1.2.2.1-check_updates"
    name: "check updates: apt --just-print upgrade"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.2.2.1. NIST SP 800-53 Rev. 5: SI-2."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      apt --just-print upgrade
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^The following packages will be upgraded" }
    rationale: &rat-b506a16c7d |
      Most successful attacks exploit known vulnerabilities for which fixes are already available. Keeping installed packages up to date closes these holes and also brings bug fixes for stability.
    remediation: &rem-494564142a |
      Refresh the package lists and install all pending updates.

      apt-get update
      apt-get upgrade
      apt-get dist-upgrade

      Review the list before confirming dist-upgrade, as it can install or remove packages to resolve dependencies. Reboot if the kernel or core libraries were updated.
  - id: "CIS-UBUNTU26-1.3.1.1-apparmor"
    name: "Package apparmor is installed"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.3.1.1. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' apparmor 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-d4cd5996bb |
      AppArmor is a mandatory access control system that confines programs to a defined set of files, capabilities and network access. Having it installed is the prerequisite for limiting what a compromised service can do beyond normal user permissions.
    remediation: &rem-378a6baa70 |
      Install the package apparmor:

      apt-get install apparmor
  - id: "CIS-UBUNTU26-1.3.1.2-apparmor_boot_grub-attrs"
    name: "/boot/grub/grub.cfg: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/boot/grub/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-60629722a6 |
      AppArmor has to be enabled when the kernel starts; profiles cannot be loaded if the kernel runs another or no security module. Checking the generated GRUB configuration for apparmor=1 and security=apparmor confirms that every boot entry enables it.
    remediation: &rem-34fe50bf63 |
      Create /boot/grub/grub.cfg.
  - id: "CIS-UBUNTU26-1.3.1.2-apparmor_boot_grub-content"
    name: "/boot/grub/grub.cfg has the expected content (3 rules)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/boot/grub/grub.cfg'
    allow_rc: any
    expect:
      - { some: "~ apparmor=1" }
      - { some: "~ security=apparmor" }
      - { none: "~ apparmor=0" }
    rationale: *rat-60629722a6
    remediation: &rem-b6dfe2c9ec |
      Edit /boot/grub/grub.cfg so that its lines meet these conditions (regular expressions):

      - a line matches apparmor=1
      - a line matches security=apparmor
      - no line matches apparmor=0
  - id: "CIS-UBUNTU26-1.3.1.2-grub_app_armor-attrs"
    name: "/etc/default/grub: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ecf938aaab |
      A mandatory access control module must be activated on the kernel command line so that it is active from early boot for every boot entry. Setting the parameters in /etc/default/grub makes this persistent across GRUB regenerations. On SUSE 16 the check expects SELinux (selinux=1 security=selinux) instead of AppArmor.
    remediation: &rem-2d1523887c |
      Create /etc/default/grub.
  - id: "CIS-UBUNTU26-1.3.1.2-grub_app_armor-content"
    name: "/etc/default/grub has the expected content (3 rules)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect:
      - { some: "~ ^GRUB_CMDLINE_LINUX.*apparmor=1" }
      - { some: "~ ^GRUB_CMDLINE_LINUX.*security=apparmor" }
      - { none: "~ apparmor=0" }
    rationale: *rat-ecf938aaab
    remediation: &rem-210c5e7ead |
      Edit /etc/default/grub so that its lines meet these conditions (regular expressions):

      - a line matches ^GRUB_CMDLINE_LINUX.*apparmor=1
      - a line matches ^GRUB_CMDLINE_LINUX.*security=apparmor
      - no line matches apparmor=0
  - id: "CIS-UBUNTU26-1.3.1.3-apparmor_profiles_enforcing"
    name: "apparmor profiles enforcing: LOADED=`apparmor_status | grep 'profiles are loaded' | awk '{print $1}'` \u0026\u0026 ENFORCE=`appa…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.3.1.3. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      LOADED=`apparmor_status | grep 'profiles are loaded' | awk '{print $1}'` && ENFORCE=`apparmor_status | grep 'profiles are in enforce mode' | awk '{print $1}'` && COMPLAIN=`apparmor_status | grep 'profiles are in complain mode' | awk '{print $1}'` && if [ "$ENFORCE" != "$LOADED" ] || [ "$COMPLAIN" != "0" ]; then echo "Not Enforcing"; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Not Enforcing" }
    rationale: &rat-7f97a529df |
      AppArmor profiles in complain mode only log policy violations without blocking them. Running every loaded profile in enforce mode makes sure confined applications are actually limited to the resources their profile allows, which contains the damage of a compromised service.
    remediation: &rem-fac913e946 |
      List the profiles that are not in enforce mode, review them and switch each to enforce mode; disable profiles that cannot be enforced.

      aa-status
      aa-enforce /etc/apparmor.d/PROFILE

      aa-enforce is part of apparmor-utils. Test the affected applications afterwards, because denials now block them.
  - id: "CIS-UBUNTU26-1.3.1.4-kernel.apparmor_restrict_unprivileged_un"
    name: "Kernel parameter kernel.apparmor_restrict_unprivileged_unconfined is 1"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.3.1.4. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.apparmor_restrict_unprivileged_unconfined
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-8978556828 |
      Unprivileged processes that run without an AppArmor profile could use change_profile to move into a more permissive profile and thereby escape the restrictions on unprivileged user namespaces. Setting kernel.apparmor_restrict_unprivileged_unconfined to 1 blocks this, closing a path frequently used to reach kernel attack surface.
    remediation: &rem-64b2fdf0a8 |
      Set the kernel parameter kernel.apparmor_restrict_unprivileged_unconfined to 1, now and at boot:

      sysctl -w 'kernel.apparmor_restrict_unprivileged_unconfined=1'
      printf '%s\n' 'kernel.apparmor_restrict_unprivileged_unconfined = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.apparmor_restrict_unprivileged_unconfined from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU26-1.3.1.4-apparmor_restrict_unconfined_conf"
    name: "apparmor restrict unconfined conf: grep -r \"kernel\\.apparmor_restrict_unprivileged_unconfined\" $([ -f /etc/sysctl.conf ] \u0026\u0026 …"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.3.1.4. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -r "kernel\.apparmor_restrict_unprivileged_unconfined" $([ -f /etc/sysctl.conf ] && echo /etc/sysctl.conf) /etc/sysctl.d/
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ kernel\\.apparmor_restrict_unprivileged_unconfined\\s*=\\s*1" }
    rationale: &rat-8c033070f1 |
      A kernel parameter set only at runtime is lost at the next reboot. Persisting kernel.apparmor_restrict_unprivileged_unconfined=1 in the sysctl configuration keeps unprivileged unconfined processes from changing into other AppArmor profiles to escape the user namespace restrictions on every boot.
    remediation: &rem-7958baa9de |
      Set kernel.apparmor_restrict_unprivileged_unconfined to 1 in a sysctl drop-in file and apply it to the running kernel.

      printf '%s\n' 'kernel.apparmor_restrict_unprivileged_unconfined = 1' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=1

      The check only reads /etc/sysctl.conf and /etc/sysctl.d/; remove or correct any other setting of kernel.apparmor_restrict_unprivileged_unconfined in these locations.
  - id: "CIS-UBUNTU26-1.4.1-bootloader_password_set"
    name: "The boot loader has a superuser and a PBKDF2 password"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.4.1. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f=/boot/grub/grub.cfg
      if [ ! -e "$f" ]; then echo "$f does not exist"; exit 0; fi
      grep -Eq '^[[:space:]]*set superusers=' "$f" || echo "no superuser is set in $f"
      grep -Eq '^[[:space:]]*password_pbkdf2[[:space:]]+[^[:space:]]+[[:space:]]+grub\.pbkdf2\.sha512\.' "$f" || echo "no PBKDF2 password is set in $f"
    allow_rc: any
    expect: empty
    rationale: &rat-d4c535ae9c |
      Without a boot loader password, anyone with console access can edit boot entries, for example to add init=/bin/bash and get a root shell without authentication. A GRUB superuser with a PBKDF2 password hash protects the boot menu from such changes.
    remediation: &rem-889f235bb0 |
      Create a password hash, add a superuser with this hash in a file in /etc/grub.d/ and regenerate grub.cfg.

      grub-mkpasswd-pbkdf2

      Put these lines, with the hash the command printed, into /etc/grub.d/01_users, make the file executable and run update-grub:

      #!/bin/sh
      cat <<EOF
      set superusers="USER"
      password_pbkdf2 USER HASH
      EOF

      chmod 0700 /etc/grub.d/01_users
      update-grub

      With a superuser set, every boot entry asks for the password unless it has --unrestricted; add that option to CLASS in /etc/grub.d/10_linux if the system has to boot unattended.
  - id: "CIS-UBUNTU26-1.4.2-default_grub_perms-attrs"
    name: "/boot/grub/grub.cfg: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.4.2. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/boot/grub/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-a1a67cf5c0 |
      grub.cfg contains the boot loader password hash and kernel parameters. If ordinary users can read it, they can attack the hash offline and learn about the boot setup; if they can write it, they can change how the system boots. Mode 0600 owned by root:root prevents this.
    remediation: &rem-e39028cb7f |
      Create /boot/grub/grub.cfg if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/boot/grub/grub.cfg'
      chmod u-xs,g-rwxs,o-rwx,a-t '/boot/grub/grub.cfg'
  - id: "CIS-UBUNTU26-1.5.1-fs.protected_hardlinks"
    name: "Kernel parameter fs.protected_hardlinks is 1"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n fs.protected_hardlinks
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-125d715f8b |
      With fs.protected_hardlinks set to 1, users can only create hard links to files they own or can read and write. This blocks a classic attack in which a hard link to a sensitive or setuid file is planted in a world-writable directory so that a privileged program or a later cleanup acts on the wrong file, for example to escalate privileges or overwrite system files. This check verifies the value in the running kernel.
    remediation: &rem-dfb7dcb76a |
      Set the kernel parameter fs.protected_hardlinks to 1, now and at boot:

      sysctl -w 'fs.protected_hardlinks=1'
      printf '%s\n' 'fs.protected_hardlinks = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of fs.protected_hardlinks from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU26-1.5.1-protected_hardlinks_configured"
    name: "protected hardlinks configured: grep \"^fs\\.protected_hardlinks\" $([ -f /etc/sysctl.conf ] \u0026\u0026 echo /etc/sysctl.conf) /etc/…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.5.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-ubuntu26, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "^fs\.protected_hardlinks" $([ -f /etc/sysctl.conf ] && echo /etc/sysctl.conf) /etc/sysctl.d/* | cut -d ":" -f2
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ fs.protected_hardlinks\\s*=\\s*1" }
    rationale: &rat-a5ca9edd35 |
      Without hardlink protection, users can create hard links to files they do not own, for example in world-writable directories, and trick privileged programs into modifying those files (time-of-check/time-of-use attacks). fs.protected_hardlinks=1 only allows hard links to files the user owns or can read and write. Persisting it in the sysctl configuration keeps it after reboots.
    remediation: &rem-cfdd687031 |
      Set fs.protected_hardlinks to 1 in a sysctl drop-in file and apply it to the running kernel.

      printf '%s\n' 'fs.protected_hardlinks = 1' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w fs.protected_hardlinks=1

      The check only reads /etc/sysctl.conf and /etc/sysctl.d/; remove or correct any other setting of fs.protected_hardlinks in these locations.
  - id: "CIS-UBUNTU26-1.5.2-fs.protected_symlinks"
    name: "Kernel parameter fs.protected_symlinks is 1"
