  - id: "CIS-UBUNTU26-5.3.3.1.1-faillock_attempts_deny-attrs"
    name: "/etc/security/faillock.conf: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-241af1b0a8 |
      Locking an account after a small number of consecutive failed logins stops online password guessing against it. Without a limit, an attacker can try passwords indefinitely. A limit of five or fewer attempts keeps guessing impractical; the trade-off is that attackers can deliberately lock accounts, which the unlock time should balance.
    remediation: &rem-41697c6a61 |
      Create /etc/security/faillock.conf.
  - id: "CIS-UBUNTU26-5.3.3.1.1-faillock_attempts_deny-content"
    name: "/etc/security/faillock.conf has the expected content (2 rules)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
