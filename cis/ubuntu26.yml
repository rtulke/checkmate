    name: "/etc/cron.weekly: exists, mode 0700 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 2.4.1.5. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/cron.weekly'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7077)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-2375f36446 |
      /etc/cron.weekly contains scripts that cron runs as root. If other users could write to it they could add commands executed with root privileges, and read access reveals which maintenance jobs exist. Owner root, group root and mode 0700 restrict it to root.
    remediation: &rem-5911972a57 |
      Create /etc/cron.weekly if it is missing, then set owner root and group root and remove the permissions u-s,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/cron.weekly'
      chmod u-s,g-rwxs,o-rwx,a-t '/etc/cron.weekly'
  - id: "CIS-UBUNTU26-2.4.1.6-cron_monthly_perms-attrs"
