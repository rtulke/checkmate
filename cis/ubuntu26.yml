      With fs.protected_symlinks set to 1, symbolic links in world-writable sticky directories such as /tmp are only followed if the follower owns the link or the directory. This defeats time-of-check/time-of-use races in which an attacker plants a symlink so that a privileged process writes to or reads from an unintended file. This check verifies the value in the running kernel.
    remediation: &rem-1878740bd3 |
      Set the kernel parameter fs.protected_symlinks to 1, now and at boot:

      sysctl -w 'fs.protected_symlinks=1'
      printf '%s\n' 'fs.protected_symlinks = 1' >> /etc/sysctl.d/60-hardening.conf

