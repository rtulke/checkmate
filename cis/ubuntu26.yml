      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f655eb77df |
      The unlock time determines how long an account stays locked after too many failed logins. A short lock barely slows down automated guessing, while 0 keeps the account locked until an administrator intervenes. Variants differ in whether they favour long locks or a maximum of 15 minutes to limit denial of service.
    remediation: *rem-41697c6a61
  - id: "CIS-UBUNTU26-5.3.3.1.2-faillock_unlock_time-content"
