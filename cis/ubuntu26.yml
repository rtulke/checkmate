      Symlink attacks in world-writable sticky directories such as /tmp let a user redirect file operations of privileged programs to arbitrary files. fs.protected_symlinks=1 only lets symlinks in such directories be followed when the follower or the directory owner owns the link. Persisting it in the sysctl configuration keeps it after reboots.
    remediation: &rem-98007eebf9 |
      Set fs.protected_symlinks to 1 in a sysctl drop-in file and apply it to the running kernel.

      printf '%s\n' 'fs.protected_symlinks = 1' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w fs.protected_symlinks=1

