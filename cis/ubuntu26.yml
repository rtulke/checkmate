    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-750ebc2379 |
      This parameter controls IPv4 forwarding on all interfaces. When enabled, the host routes packets between networks, which an attacker can use to bypass segmentation or pivot into otherwise unreachable networks. Routers, VPN gateways and hosts running containers or virtual machines with routed networking legitimately need forwarding. This check verifies the value in the running kernel.
    remediation: &rem-3320f1cd32 |
      Set the kernel parameter net.ipv4.conf.all.forwarding to 0, now and at boot:

      sysctl -w 'net.ipv4.conf.all.forwarding=0'
      printf '%s\n' 'net.ipv4.conf.all.forwarding = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.conf.all.forwarding from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU26-3.3.1.2-ipv4_all_forwarding"
    name: "ipv4 all forwarding: grep \"net\\.ipv4\\.conf\\.all\\.forwarding\" $([ -f /etc/sysctl.conf ] \u0026\u0026 echo /etc/sysctl.con…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.3.1.2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "net\.ipv4\.conf\.all\.forwarding" $([ -f /etc/sysctl.conf ] && echo /etc/sysctl.conf) /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ net\\.ipv4\\.conf\\.all\\.forwarding\\s*=\\s*0" }
    rationale: &rat-f39ba74e9d |
      A host that forwards IPv4 packets between its interfaces can be used to route traffic around firewalls or network segmentation. Systems that are not routers should have forwarding disabled; persisting the setting in the sysctl configuration keeps it after reboots. Container hosts, VPN gateways and routers legitimately need forwarding.
    remediation: &rem-a56368ee4c |
      Set net.ipv4.conf.all.forwarding to 0 in a sysctl drop-in file and apply it to the running kernel.

      printf '%s\n' 'net.ipv4.conf.all.forwarding = 0' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w net.ipv4.conf.all.forwarding=0

      The check only reads /etc/sysctl.conf and /etc/sysctl.d/; remove or correct any other setting of net.ipv4.conf.all.forwarding in these locations.
  - id: "CIS-UBUNTU26-3.3.1.3-net.ipv4.conf.default.forwarding"
