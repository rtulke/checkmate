  - id: "CIS-UBUNTU26-2.4.1.9-etc_cron.allow-attrs"
    name: "/etc/cron.allow: exists, mode 0640 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 2.4.1.9. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/cron.allow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7137)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-67db008abb |
      cron.allow lists the users permitted to create cron jobs. An allow list means new or unused accounts cannot schedule jobs, which limits a common way to keep persistence. The file itself must belong to root and not be writable by others, so users cannot grant themselves access.
    remediation: &rem-3746395589 |
      Create /etc/cron.allow if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-rwx,a-t:

      chown root:root '/etc/cron.allow'
      chmod u-xs,g-wxs,o-rwx,a-t '/etc/cron.allow'
  - id: "CIS-UBUNTU26-2.4.1.9-cron_deny_absent-absent"
    name: "/etc/cron.deny does not exist"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 2.4.1.9. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      test -e '/etc/cron.deny' || test -L '/etc/cron.deny'
    expect: false
    rationale: &rat-4505b6a69e |
      With an allow list, only explicitly listed users may use cron, which is safer than a deny list that lets every new or forgotten account schedule jobs. Removing cron.deny ensures cron.allow is the only access control.
    remediation: &rem-d780ede041 |
      Remove /etc/cron.deny, unless the system needs it:

      rm '/etc/cron.deny'
  - id: "CIS-UBUNTU26-2.4.2.1-at_allow"
    name: "at allow: if dpkg-query -s at \u003e/dev/null 2\u003e\u00261; then stat -Lc '%a %U %G' /etc/at.allow 2\u003e\u00261; else ec…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 2.4.2.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      if dpkg-query -s at >/dev/null 2>&1; then stat -Lc '%a %U %G' /etc/at.allow 2>&1; else echo "at not installed"; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(at not installed|[0-6][0-4]0 root (root|daemon))$" }
    rationale: &rat-94f2627cc2 |
      With /etc/at.allow in place, only the users listed in it may schedule jobs with at; without it, every user not named in at.deny can. Restricting at to approved users and protecting the file (owned by root, not writable by group or others) prevents unauthorized scheduling of commands and changes to the allow list.
    remediation: &rem-ea08d4d286 |
      Create /etc/at.allow with restrictive ownership and mode, then list the users allowed to use at, one per line.

      touch /etc/at.allow
      chown root:daemon /etc/at.allow
      chmod 0640 /etc/at.allow

      If at is not needed, removing it with apt-get purge at also satisfies the check.
  - id: "CIS-UBUNTU26-2.4.2.1-at_deny"
    name: "at deny: if [ -e /etc/at.deny ]; then stat -Lc '%a %U %G' /etc/at.deny; else echo absent; fi"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 2.4.2.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      if [ -e /etc/at.deny ]; then stat -Lc '%a %U %G' /etc/at.deny; else echo absent; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(absent|[0-6][0-4]0 root (root|daemon))$" }
    rationale: &rat-02ef859eb4 |
      /etc/at.deny lists users who may not use at. If others can write to it, users could remove themselves from the list. It should either be absent, so that access is controlled by at.allow only, or be owned by root with mode 640 or stricter.
    remediation: &rem-0f06e007bc |
      Restrict ownership and mode of /etc/at.deny.

      chown root:daemon /etc/at.deny
      chmod 0640 /etc/at.deny

      Alternatively delete it with rm /etc/at.deny once /etc/at.allow lists the permitted users; at.deny is ignored while at.allow exists.
  - id: "CIS-UBUNTU26-3.1.2-wireless_disabled"
    name: "wireless disabled: if [ -n \"$(find /sys/class/net/*/ -type d -name wireless 2\u003e/dev/null)\" ]; then echo MANUA…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.1.2. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      if [ -n "$(find /sys/class/net/*/ -type d -name wireless 2>/dev/null)" ]; then echo MANUAL; else echo OK; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^OK" }
      - { none: "~ ^MANUAL" }
    rationale: &rat-0d79aa42e1 |
      Wireless interfaces open a network path that bypasses wired network controls such as firewalls and segmentation, and they expose the system to attackers within radio range. Servers rarely need them; turning off the radios or blocking their drivers removes this exposure.
    remediation: &rem-aa6b351acd |
      Block the driver module of every wireless interface so that no wireless interface comes up. Find each interface's driver, block it and unload it:

      basename "$(readlink -f /sys/class/net/IFACE/device/driver/module)"
      printf 'blacklist %s\ninstall %s /bin/false\n' MODULE MODULE >> /etc/modprobe.d/blacklist-wireless.conf
      modprobe -r MODULE

      On Ubuntu 20.04 every module under drivers/net/wireless must be named in /etc/modprobe.d/blacklist-wireless.conf:
      find /lib/modules/$(uname -r)/kernel/drivers/net/wireless -name '*.ko' -printf '%f\n' | sed 's/\.ko$//' | sort -u | while read -r m; do printf 'blacklist %s\ninstall %s /bin/false\n' "$m" "$m"; done >> /etc/modprobe.d/blacklist-wireless.conf

      On Ubuntu 18.04 the check reads NetworkManager instead:
      nmcli radio all off
  - id: "CIS-UBUNTU26-3.1.3-bluetooth_pkg"
    name: "Package bluez is not installed"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.1.3. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' bluez 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: false
    rationale: &rat-26028fd092 |
      Bluetooth gives devices in radio range a way to connect to the system and has a history of remotely exploitable vulnerabilities. Servers rarely need it, so removing the BlueZ stack removes this wireless attack surface.
    remediation: &rem-60d4918f38 |
      Remove the package bluez, unless the system needs it:

      apt-get purge bluez
  - id: "CIS-UBUNTU26-3.2.1-lsmod_atm"
    name: "lsmod atm: lsmod | grep -i atm"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.2.1. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i atm
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-09db9f0366 |
      ATM (Asynchronous Transfer Mode) networking is obsolete on virtually all systems, yet its protocol module can be loaded on demand when a program opens an ATM socket, exposing rarely maintained kernel code to attackers. Preventing the module from loading removes this unnecessary attack surface.
    remediation: &rem-dfc0094ba7 |
      Prevent the atm module from being loaded and unload it if it is currently loaded.

      printf '%s\n' 'blacklist atm' 'install atm /bin/false' > /etc/modprobe.d/atm.conf
      modprobe -r atm

      lsmod | grep -i atm matches any module name containing "atm"; review the output before unloading anything else.
  - id: "CIS-UBUNTU26-3.2.1-modprobe_atm"
    name: "modprobe atm: modprobe -n -v atm"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.2.1. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v atm
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ install /bin/(true|false)" }
    rationale: *rat-09db9f0366
    remediation: &rem-71b37645c4 |
      Prevent the atm module from being loaded and unload it if it is currently loaded.

      printf '%s\n' 'blacklist atm' 'install atm /bin/false' > /etc/modprobe.d/atm.conf
      modprobe -r atm

      The check expects exactly /bin/false or /bin/true.
  - id: "CIS-UBUNTU26-3.2.2-lsmod_can"
    name: "lsmod can: lsmod | grep -i can"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.2.2. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i can
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-3d05bbfd9e |
      The Controller Area Network protocol is used in vehicles and industrial equipment and is not needed on typical servers or workstations. Its socket family can be loaded automatically when a program requests it, exposing additional kernel code that has had vulnerabilities. Disabling the can module removes this attack surface where no CAN interfaces are used.
    remediation: &rem-58b62e9776 |
      Prevent the can module from being loaded and unload it if it is currently loaded.

      printf '%s\n' 'blacklist can' 'install can /bin/false' > /etc/modprobe.d/can.conf
      modprobe -r can

      If the module is in use, unload dependent modules such as can_raw or can_bcm first. lsmod | grep -i can matches any module name containing "can"; review the output.
  - id: "CIS-UBUNTU26-3.2.2-modprobe_can"
    name: "modprobe can: modprobe -n -v can"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.2.2. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v can
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ install /bin/(true|false)" }
    rationale: *rat-3d05bbfd9e
    remediation: &rem-cf33684c1b |
      Prevent the can module from being loaded and unload it if it is currently loaded.

      printf '%s\n' 'blacklist can' 'install can /bin/false' > /etc/modprobe.d/can.conf
      modprobe -r can

      The check expects exactly /bin/false or /bin/true.
  - id: "CIS-UBUNTU26-3.2.3-lsmod_dccp"
    name: "lsmod dccp: lsmod | grep -i dccp"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.2.3. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | grep -i dccp
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^.*" }
    rationale: &rat-c5d39e1c4c |
      DCCP is a rarely used transport protocol whose kernel code has had serious vulnerabilities. Because unprivileged programs can trigger automatic loading of the module by opening a DCCP socket, an unused protocol still adds attack surface. The check verifies the module is not loaded.
    remediation: &rem-7463e2edd5 |
      Prevent the dccp module from loading and unload it if it is loaded.

      printf '%s\n' 'blacklist dccp' 'install dccp /bin/false' > /etc/modprobe.d/dccp.conf
      modprobe -r dccp

      If the module is in use, stop the application using it or reboot.
  - id: "CIS-UBUNTU26-3.2.3-modprobe_dccp"
    name: "modprobe dccp: modprobe -n -v dccp"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.2.3. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      modprobe -n -v dccp
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /bin/(true|false)" }
    rationale: &rat-41ef8e8fab |
      DCCP is a rarely used datagram transport protocol. Its kernel module has had several serious vulnerabilities that can be triggered by local users or from the network. Preventing the module from loading removes this attack surface on systems that do not use the protocol.
    remediation: &rem-66ee3312a3 |
      Keep the dccp module from being loaded: add an install override and a blacklist entry for it in /etc/modprobe.d/, then unload it if it is currently loaded.

      printf '%s\n' 'install dccp /bin/false' 'blacklist dccp' > /etc/modprobe.d/dccp.conf
      modprobe -r dccp

      modprobe -r reports an error if the module is not loaded, which is harmless; if sockets of this protocol are open, the module stays loaded until reboot.
  - id: "CIS-UBUNTU26-3.2.4-lsmod_RDS"
    name: "lsmod RDS: lsmod | grep -i rds"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.2.4. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
