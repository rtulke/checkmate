  - id: "CIS-UBUNTU26-6.3.1-aide"
    name: "Package aide is installed"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.3.1. NIST SP 800-53 Rev. 5: AU-2."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' aide 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-24b82fc810 |
      AIDE is a file integrity checker that records a baseline of files and later reports changes. It detects unauthorised modifications of binaries and configuration files that could indicate a compromise.
    remediation: &rem-22ee0488f4 |
      Install the package aide:

      apt-get install aide
  - id: "CIS-UBUNTU26-6.3.1-aide-common"
    name: "Package aide-common is installed"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.3.1. NIST SP 800-53 Rev. 5: AU-2."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' aide-common 2>/dev/null | grep 'install ok installed' >/dev/null
    expect: true
    rationale: &rat-8e6297dc4c |
      AIDE builds a database of file checksums and attributes and reports later changes. Without such a file integrity tool, modified binaries, configuration files or planted backdoors can go unnoticed. The aide-common package provides the configuration and helper scripts that Debian and Ubuntu use to initialize and run AIDE regularly.
    remediation: &rem-39f5ad93cf |
      Install the package aide-common:

      apt-get install aide-common
  - id: "CIS-UBUNTU26-6.3.2-dailyaidecheck.timer-enabled"
    name: "Service dailyaidecheck.timer is enabled"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.3.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState dailyaidecheck.timer | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-4daa0a7fa6 |
      A file integrity database only helps if it is checked regularly. The dailyaidecheck timer runs AIDE every day and reports changed, added or removed files, so unauthorized modifications are noticed in time.
    remediation: &rem-116d603da7 |
      Enable the service dailyaidecheck.timer:

      systemctl enable dailyaidecheck.timer
  - id: "CIS-UBUNTU26-6.3.2-dailyaidecheck.timer-running"
    name: "Service dailyaidecheck.timer is running"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.3.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState dailyaidecheck.timer | cut -d= -f2
    expect: "== active"
    rationale: *rat-4daa0a7fa6
    remediation: &rem-fc4ee02ac1 |
      Start the service dailyaidecheck.timer:

      systemctl start dailyaidecheck.timer
  - id: "CIS-UBUNTU26-6.3.2-dailyaidecheck_service"
    name: "dailyaidecheck service: systemctl is-enabled dailyaidecheck.service"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.3.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl is-enabled dailyaidecheck.service
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(static|enabled)$" }
    rationale: &rat-a97cf632e7 |
      The daily AIDE check is carried out by dailyaidecheck.service, which its timer starts. If the service is masked or disabled, the timer cannot run the check and file integrity monitoring stops silently.
    remediation: &rem-c81e7dcfe9 |
      Make sure AIDE is installed and the check service is not masked, then enable the timer.

      apt-get install aide
      systemctl unmask dailyaidecheck.service
      systemctl enable --now dailyaidecheck.timer
      systemctl is-enabled dailyaidecheck.service

      The service is normally static; if it reports disabled, enable it with systemctl enable dailyaidecheck.service.
  - id: "CIS-UBUNTU26-6.3.3-audit_tools_crypto"
    name: "audit tools crypto: grep -P -- '(\\/sbin\\/(audit|au)\\H*\\b)' /etc/aide/aide.conf"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.3.3. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -P -- '(\/sbin\/(audit|au)\H*\b)' /etc/aide/aide.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ /sbin/auditctl p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/auditd p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/ausearch p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/aureport p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/augenrules p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
    rationale: &rat-73d2765b0b |
      Attackers who gain root often replace or modify the audit tools to hide their activity or to stop events from being recorded. Having AIDE track the attributes and SHA-512 hashes of auditctl, auditd, ausearch, aureport, autrace and augenrules makes any change to these binaries visible at the next integrity check.
    remediation: &rem-ddfa8090a2 |
      Add AIDE rules for the audit tools to /etc/aide/aide.conf (the check reads only this file, not /etc/aide/aide.conf.d) and re-initialise the AIDE database.

      printf '%s\n' '/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512' >> /etc/aide/aide.conf
      printf '%s\n' '/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512' >> /etc/aide/aide.conf
      printf '%s\n' '/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512' >> /etc/aide/aide.conf
      printf '%s\n' '/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512' >> /etc/aide/aide.conf
      printf '%s\n' '/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512' >> /etc/aide/aide.conf
      printf '%s\n' '/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512' >> /etc/aide/aide.conf
      aideinit -y -f

      Ubuntu 26.04 does not require the autrace line; leave it out if /sbin/autrace does not exist.
  - id: "CIS-UBUNTU26-7.1.1-passwd_perms-attrs"
    name: "/etc/passwd: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/passwd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-a167450576 |
      /etc/passwd lists all accounts and must be readable by everyone for name lookups, but only root may modify it. If others could write to it they could add accounts or change a user ID to 0 and gain root. Owner root, group root and mode 0644 provide this protection.
    remediation: &rem-08cad6e3c2 |
      Create /etc/passwd if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/passwd'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/passwd'
  - id: "CIS-UBUNTU26-7.1.2-passwd-_perms-attrs"
    name: "/etc/passwd: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/passwd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-b4ee6fc5d0 |
      /etc/passwd- is the backup copy of the account database written by tools like useradd and vipw. It holds the same information as /etc/passwd and could be used to restore a manipulated version, so it needs the same protection: owned by root:root and not writable by others.
    remediation: *rem-08cad6e3c2
  - id: "CIS-UBUNTU26-7.1.3-group_perms-attrs"
    name: "/etc/group: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/group'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-63d76b0c8d |
      /etc/group defines group memberships, including administrative groups such as wheel. If non-root users could modify it they could add themselves to privileged groups. It must be owned by root:root with mode 0644 so it is readable but protected.
    remediation: &rem-acc5fa1d09 |
      Create /etc/group if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/group'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/group'
  - id: "CIS-UBUNTU26-7.1.4-group-_perms-attrs"
    name: "/etc/group-: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/group-'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-46fe720062 |
      /etc/group- is the backup of the group database. It contains the same membership information as /etc/group and must be protected the same way, owned by root:root and not writable by others, so it cannot be used to plant manipulated group memberships.
    remediation: &rem-5da3704e0d |
      Create /etc/group- if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/group-'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/group-'
  - id: "CIS-UBUNTU26-7.1.5-shadow_perms-attrs"
    name: "/etc/shadow: exists, mode 0640 or stricter, owner root, group root or shadow"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.1.5. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/shadow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7137)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root'|'shadow') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-1890aeb8b4 |
      /etc/shadow holds the password hashes and aging data of all accounts. Read access allows offline cracking of the hashes, and write access allows setting any password or unlocking accounts. Only root, and on Debian-like and SUSE systems the shadow group, may access it.
    remediation: &rem-88b451e7ca |
      Create /etc/shadow if it is missing, then set owner root and group root or shadow and remove the permissions u-xs,g-wxs,o-rwx,a-t:

      chown root:root '/etc/shadow'
      chmod u-xs,g-wxs,o-rwx,a-t '/etc/shadow'
  - id: "CIS-UBUNTU26-7.1.6-shadow-_perms-attrs"
    name: "/etc/shadow-: exists, mode 0640 or stricter, owner root, group root or shadow"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.1.6. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/shadow-'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7137)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root'|'shadow') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-8b7a9c949b |
      /etc/shadow- is the backup of the shadow file and contains password hashes, often only slightly older than the current ones. It needs the same strict protection as /etc/shadow to prevent offline password cracking.
    remediation: &rem-85db233ccb |
      Create /etc/shadow- if it is missing, then set owner root and group root or shadow and remove the permissions u-xs,g-wxs,o-rwx,a-t:

      chown root:root '/etc/shadow-'
      chmod u-xs,g-wxs,o-rwx,a-t '/etc/shadow-'
  - id: "CIS-UBUNTU26-7.1.7-gshadow_perms-attrs"
    name: "/etc/gshadow: exists, mode 0640 or stricter, owner root, group root or shadow"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.1.7. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/gshadow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7137)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root'|'shadow') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-07f61f03b9 |
      /etc/gshadow contains group passwords and the lists of group administrators. Exposure allows cracking group passwords, and modification allows users to grant themselves group membership or administration rights. It must be restricted to root and, where used, the shadow group.
    remediation: &rem-9296f96732 |
      Create /etc/gshadow if it is missing, then set owner root and group root or shadow and remove the permissions u-xs,g-wxs,o-rwx,a-t:

      chown root:root '/etc/gshadow'
      chmod u-xs,g-wxs,o-rwx,a-t '/etc/gshadow'
  - id: "CIS-UBUNTU26-7.1.8-gshadow-_perms-attrs"
    name: "/etc/gshadow-: exists, mode 0640 or stricter, owner root, group root or shadow"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.1.8. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/gshadow-'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7137)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root'|'shadow') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-6f659e3db8 |
      /etc/gshadow- is the backup of the group shadow file and contains the same sensitive group password and administrator information. It needs the same strict ownership and permissions as /etc/gshadow.
    remediation: &rem-452fb610b5 |
      Create /etc/gshadow- if it is missing, then set owner root and group root or shadow and remove the permissions u-xs,g-wxs,o-rwx,a-t:

      chown root:root '/etc/gshadow-'
      chmod u-xs,g-wxs,o-rwx,a-t '/etc/gshadow-'
  - id: "CIS-UBUNTU26-7.1.9-etc_shells_perms-attrs"
    name: "/etc/shells: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.1.9. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/shells'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-124d473497 |
      /etc/shells defines which shells are valid login shells. If others could modify it, they could add arbitrary programs as accepted shells and influence which accounts are allowed by services that rely on this list.
    remediation: &rem-118b2e8d3a |
      Create /etc/shells if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/shells'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/shells'
  - id: "CIS-UBUNTU26-7.1.10-etc_security_opasswd_perms-attrs"
    name: "/etc/security/opasswd: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.1.10. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/security/opasswd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-c97f0a9796 |
      /etc/security/opasswd stores the hashes of previous passwords for the password history check. If it were readable by others, old hashes could be cracked and reveal password patterns; if writable, the history could be manipulated.
    remediation: &rem-ea56781c51 |
      Create /etc/security/opasswd if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/security/opasswd'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/security/opasswd'
  - id: "CIS-UBUNTU26-7.1.11-world_writable"
    name: "world writable: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.1.11. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -0002 -o -type d \( -perm -0002 -a ! -perm -1000 \)
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-9f0a5a248e |
      Files and directories that everyone can write to allow any user to alter data, plant malicious content or replace files that others rely on. World-writable directories without the sticky bit additionally let users delete or rename other users' files. Such permissions should be removed or justified.
    remediation: &rem-9b39034669 |
      Review each file and directory listed by the check. Remove world write access where it is not required, and set the sticky bit on directories that must stay world-writable so that users cannot delete each other's files.

      ls -ld PATH
      chmod o-w FILE
      chmod +t DIRECTORY

      Shared directories such as /tmp and /var/tmp need mode 1777; clarify with the owning application before changing other files.
  - id: "CIS-UBUNTU26-7.1.12-unowned_dirs"
    name: "No file or directory is without an owner or a group"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.1.12. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk 'NR!=1 {print $6}' | while read -r m; do
        find "$m" -xdev \( -nouser -o -nogroup \) 2>/dev/null || true
      done | grep -v journal-upload || true
    expect: empty
    rationale: &rat-ffe83ecc3b |
      Files whose owner (or group) ID does not correspond to any existing account are usually left over from deleted users or unpacked archives. If a new account later receives that ID, it automatically becomes the owner of these files. They should be assigned to a valid owner or removed.
    remediation: &rem-a0251b5d28 |
      Give every listed file and directory an existing owner and group, or remove it if it is no longer needed:

      chown USER:GROUP PATH
  - id: "CIS-UBUNTU26-7.1.13-audit_sgid"
    name: "audit sgid: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.1.13. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5, AC-3, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 120000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -02000 -o -perm -04000
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-9073ab3ca7 |
      Set-user-ID and set-group-ID programs run with the privileges of their owner or group, often root. Unexpected or modified SUID/SGID files are a common way to escalate privileges or keep a backdoor. Regularly reviewing them, and confirming they belong to installed packages and are unmodified, helps detect such changes.
    remediation: &rem-93591d6fc4 |
      Review every SUID and SGID file the check reports. Find the owning package and verify the file against the package checksums. Reinstall packages whose files differ, investigate files that belong to no package, and remove the special bit from programs that are not needed.

      dpkg -S FILE
      dpkg -V PACKAGE
      apt-get install --reinstall PACKAGE
      chmod u-s,g-s FILE

      Do not remove the bit from programs such as passwd, su or sudo without understanding the consequences.
  - id: "CIS-UBUNTU26-7.2.1-shadowed_passwds-attrs"
    name: "/etc/passwd: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/passwd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-5bff221a0c |
      /etc/passwd must be readable by all users. If password hashes are stored there instead of in the protected shadow file, any local user can copy them and crack them offline. An x in the password field shows that the hash is kept in /etc/shadow.
    remediation: &rem-88dbdb7375 |
      Create /etc/passwd.
  - id: "CIS-UBUNTU26-7.2.1-shadowed_passwds-content"
    name: "/etc/passwd has the expected content (1 rule)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/passwd'
    allow_rc: any
    expect: { some: "~ ^.*:x:" }
    rationale: *rat-5bff221a0c
    remediation: &rem-6cf53c0250 |
      Edit /etc/passwd so that its lines meet these conditions (regular expressions):

      - a line matches ^.*:x:
  - id: "CIS-UBUNTU26-7.2.2-passwd_fields_not_empty_shadow-attrs"
    name: "/etc/shadow: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/shadow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-47612a06c2 |
      An account with an empty password field may allow login without any password, depending on the PAM configuration. Every account should have a password hash or be locked so that it cannot be used without authentication.
    remediation: &rem-098e77832a |
      Create /etc/shadow.
  - id: "CIS-UBUNTU26-7.2.2-passwd_fields_not_empty_shadow-content"
    name: "/etc/shadow has the expected content (1 rule)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/shadow'
    allow_rc: any
    expect: { none: "~ ^*.[a-z]::" }
    rationale: *rat-47612a06c2
    remediation: &rem-208e81f02d |
      Edit /etc/shadow so that its lines meet these conditions (regular expressions):

      - no line matches ^*.[a-z]::
  - id: "CIS-UBUNTU26-7.2.3-passwd_group_exist"
    name: "passwd group exist: awk -F: '{print $4}' /etc/passwd |sort -u \u003e /tmp/uid \u0026\u0026 awk -F: '{print $3}' /etc/group| …"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '{print $4}' /etc/passwd |sort -u > /tmp/uid && awk -F: '{print $3}' /etc/group| sort -u> /tmp/gid && comm -23 /tmp/uid /tmp/gid && rm -f /tmp/uid /tmp/gid
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-a6fe2c7421 |
      Every primary group referenced in /etc/passwd should exist in /etc/group. Undefined group IDs usually result from manual edits or deleted groups; if the ID is reused later, the new group's members gain access to the affected users' files.
    remediation: &rem-ac0bde3f41 |
      For every user reported by the check, create the missing group with the referenced GID or assign the user an existing primary group.

      grpck -r
      groupadd -g GID GROUP
      usermod -g GROUP USER

      Changing the primary group does not change the ownership of existing files; adjust them if necessary.
  - id: "CIS-UBUNTU26-7.2.4-shadow_group_empty-attrs"
    name: "/etc/group: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/group'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-752bb52dc0 |
      Members of the shadow group can read /etc/shadow and therefore all local password hashes. On Debian-based systems the group should have no members; any user added to it can attempt offline cracking of every local password.
    remediation: &rem-c6eedafd62 |
      Create /etc/group.
  - id: "CIS-UBUNTU26-7.2.4-shadow_group_empty-content"
    name: "/etc/group has the expected content (2 rules)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/group'
    allow_rc: any
    expect:
      - { some: "~ ^shadow:x:\\d{2,}:$" }
      - { none: "~ ^shadow:x:\\d{2,}:." }
    rationale: *rat-752bb52dc0
    remediation: &rem-20d1afdd85 |
      Edit /etc/group so that its lines meet these conditions (regular expressions):

      - a line matches ^shadow:x:\d{2,}:$
      - no line matches ^shadow:x:\d{2,}:.
  - id: "CIS-UBUNTU26-7.2.5-no_dup_uid"
    name: "no dup uid: cat /etc/passwd | cut -d: -f3 | sort | uniq -d"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/passwd | cut -d: -f3 | sort | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-92a5e740a2 |
      The kernel identifies users by UID, not by name. Several accounts with the same UID share all file ownerships and privileges and cannot be told apart in logs, which undermines accountability.
    remediation: &rem-3997dd9dfb |
      Review every duplicate UID reported by the check, give each account its own UID and assign the files of the former shared UID deliberately.

      awk -F: '($3 == UID) {print $1}' /etc/passwd
      usermod -u NEWUID USER
      find / -xdev -user UID -ls

      usermod adjusts only the home directory; other files owned by the old UID stay with the account that keeps it.
  - id: "CIS-UBUNTU26-7.2.6-no_dup_gid"
    name: "no dup gid: cat /etc/group | cut -d: -f3 | sort | uniq -d"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.6. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/group | cut -d: -f3 | sort | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-1c1a4afdb8 |
      Groups are identified by GID. Several groups with the same GID share all group permissions, so membership in one silently grants the access rights of the other.
    remediation: &rem-6a315abc33 |
      Review every duplicate GID reported by the check, give each group its own GID and assign the files of the former shared GID deliberately.

      awk -F: '($3 == GID) {print $1}' /etc/group
      groupmod -g NEWGID GROUP
      find / -xdev -group GID -ls

      Files owned by the old GID are not changed automatically; adjust them where they belong to the renumbered group.
  - id: "CIS-UBUNTU26-7.2.7-no_dup_username"
    name: "no dup username: cat /etc/passwd | cut -d: -f1 | sort | uniq -d"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.7. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/passwd | cut -d: -f1 | sort | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-48bf65be3b |
      Duplicate user names in /etc/passwd make it unpredictable which entry is used for login and which UID a name resolves to. This can lead to wrong file ownership and confusing audit trails.
    remediation: &rem-e93b096dcd |
      Review the duplicate entries for every user name reported by the check and remove or rename the surplus entry in /etc/passwd and /etc/shadow with the locking editors.

      grep -n '^USER:' /etc/passwd
      pwck -r
      vipw
      vipw -s
  - id: "CIS-UBUNTU26-7.2.8-no_dup_groupname"
    name: "no dup groupname: cat /etc/group | cut -d: -f1 | sort | uniq -d"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.8. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/group | cut -d: -f1 | sort | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-5dd470fed7 |
      Duplicate group names in /etc/group make it unpredictable which GID a group name resolves to. This can lead to wrong access rights when files or memberships are assigned by name.
    remediation: &rem-c9a5680ce7 |
      Review the duplicate entries for every group name reported by the check and remove or rename the surplus entry in /etc/group and /etc/gshadow with the locking editors.

      grep -n '^GROUP:' /etc/group
      grpck -r
      vigr
      vigr -s
  - id: "CIS-UBUNTU26-7.2.9-home_dirs_exist"
    name: "home dirs exist: for i in `cat /etc/passwd | grep -Ev \"halt|sync|shutdown|nfsnobody|nologin|false\" | cut -…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.9. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      for i in `cat /etc/passwd | grep -Ev "halt|sync|shutdown|nfsnobody|nologin|false" | cut -d ':' -f6`; do if [ ! -d $i ]; then echo "homedir missing $i"; fi; done
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ ." }
    rationale: &rat-93950236f2 |
      An account whose home directory does not exist gets / as its working directory at login, and some programs then try to create files in unexpected places. Missing home directories also indicate stale accounts. Every account, and in particular every interactive one, should have an existing home directory.
    remediation: &rem-16e7619e2c |
      Create the missing home directory for every account listed by the check with the correct owner and mode, or point the account to an existing directory if it does not need its own home. On several platforms the check also lists system accounts; for those, review whether the account is still needed and prefer usermod -d to an existing directory over creating new directories.

      mkdir -p HOMEDIR
      chown USER: HOMEDIR
      chmod 750 HOMEDIR
      usermod -d EXISTINGDIR USER

      On RHEL 7 the check also requires that home directories of users with UID 1000 to 60000 have mode 750 or 700. On Ubuntu 18.04 every finding of pwck -r fails the check, not only missing home directories.
  - id: "CIS-UBUNTU26-7.2.9-home_dirs_ownership"
    name: "home dirs ownership: getent passwd {1000..60000} | awk -F: '{ print $1  \" \"  $7 }' | while read user dir; do i…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.9. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      getent passwd {1000..60000} | awk -F: '{ print $1  " "  $7 }' | while read user dir; do if [ $user != 'ftpd' ]; then owner=$(stat -L -c "%U" "$dir"); if [ "$owner" != "$user" ]; then echo "home dir for $user owned by $owner"; fi; fi; done
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ ." }
    rationale: &rat-d20cc1f220 |
      A home directory owned by someone other than its user lets that other account read, change or replace the user's files, including startup scripts such as .profile or .bashrc that run at login. Correct ownership keeps users in control of their own data and prevents this kind of privilege abuse.
    remediation: &rem-d05c49291e |
      Change the owner of each home directory the check reports to the user it belongs to. Review the directory first if it might legitimately be shared.

      chown USER HOMEDIR

      Use chown -R only after checking that the files inside should also belong to the user.
  - id: "CIS-UBUNTU26-7.2.9-home_dirs_permissions"
    name: "home dirs permissions: export def_home=`grep \"^HOME=\" /etc/default/useradd |cut -d= -f2` \u0026\u0026 for i in `ls $def_ho…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.9. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      export def_home=`grep "^HOME=" /etc/default/useradd |cut -d= -f2` && for i in `ls $def_home`; do stat -c "%a %n" $def_home/$i | grep -Ev "7[0-5]0|syslog"; done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-7235b11d32 |
      Group- or world-accessible home directories expose personal files, shell history, SSH keys and configuration to other local users, and writable ones allow planting malicious files. Restricting home directories to mode 750 or stricter limits access to the owner and, at most, read access for the group.
    remediation: &rem-b1b67c89ca |
      Remove write permission for the group and all permissions for others from each home directory the check reports.

      chmod 750 HOMEDIR

      Use chmod 700 if group members do not need read access.
  - id: "CIS-UBUNTU26-7.2.10-bad_dot_files"
    name: "bad dot files: find /home/ -name \"\\.forward\" -o -name \"\\.netrc\" -o -name \"\\.rhosts\""
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.10. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3>=1000)&&($7 !~ /(nologin|false)$/){print $6}' /etc/passwd | while read -r d; do
        if [ -d "$d" ]; then find "$d" -xdev -name "\.forward" -o -name "\.netrc" -o -name "\.rhosts" 2>/dev/null || true; fi
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-ed9a305dae |
      .forward files can redirect a user's mail to external addresses or pipe it to programs, .rhosts enables password-less trust relationships for legacy r-commands, and .netrc can contain plain-text credentials for remote systems. All three weaken security and should not exist in user home directories.
    remediation: &rem-d403673853 |
      Review each .forward, .netrc and .rhosts file the check reports with its owner, then remove it, or move it out of /home if it must be kept for reference.

      find /home/ \( -name .forward -o -name .netrc -o -name .rhosts \) -ls
      rm FILE

      If a credential was stored in a .netrc file, change that password on the remote system.
  - id: "CIS-UBUNTU26-7.2.10-dot_file_bash_history"
    name: "dot file bash history: find /home/ -name \"\\.bash_history\" -perm /go+rwx"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.10. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3>=1000)&&($7 !~ /(nologin|false)$/){print $6}' /etc/passwd | while read -r d; do
        if [ -d "$d" ]; then find "$d" -xdev -name "\.bash_history" -perm /go+rwx 2>/dev/null || true; fi
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-d542e8ee51 |
      Shell history files can contain sensitive information such as passwords typed on the command line, host names and internal procedures. If other users can read or modify them, that information leaks or the history can be manipulated. Only the owner should have access.
    remediation: &rem-d01066ee8c |
      Restrict each .bash_history file the check reports to its owner.

      chmod 600 FILE

      Also check that the file is owned by the user whose home directory it is in (chown USER FILE).
  - id: "CIS-UBUNTU26-7.2.10-dot_file_perms"
    name: "dot file perms: find /home/ -name \"\\.*\" -perm /g+w,o+w | grep -v .bash_history"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.10. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3>=1000)&&($7 !~ /(nologin|false)$/){print $6}' /etc/passwd | while read -r d; do
        if [ -d "$d" ]; then find "$d" -xdev -name "\.*" -perm /g+w,o+w 2>/dev/null || true; fi
      done | grep -v .bash_history
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-b99f900519 |
      Files such as .bashrc, .profile or .ssh are executed or trusted when the user logs in. If group or other users can write to them, they can insert commands that run with the victim's privileges at the next login.
    remediation: &rem-2ca3c0e9f1 |
      Remove write access for group and others from each dot file or directory listed by the check, after confirming that it is not intentionally shared.

      ls -ld FILE
      chmod go-w FILE
  - id: "CIS-UBUNTU26-7.2.11-dot_dir_perms"
    name: "dot dir perms: find /home/ -type d -name \"\\.*\" ! -name \".ssh\" -perm /g+w,o+rwx"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.11. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3>=1000)&&($7 !~ /(nologin|false)$/){print $6}' /etc/passwd | while read -r d; do
        if [ -d "$d" ]; then find "$d" -xdev -type d -name "\.*" ! -name ".ssh" -perm /g+w,o+rwx 2>/dev/null || true; fi
      done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-49e39766e0 |
      Hidden directories in home directories hold application settings, shell history, credentials and keys. If they are group-writable or accessible to others, other users can read sensitive data or plant configuration that executes as the owner. They should not be group-writable and not accessible to others.
    remediation: &rem-cf64e22c9c |
      Review each reported directory with its owner and remove group write and all access for others.

      chmod g-w,o-rwx DIR

      Confirm first that no shared access is intentionally required for the directory.
  - id: "CIS-UBUNTU26-7.2.11-dot_ssh_dir_perms"
    name: "dot ssh dir perms: find /home/ -type d -name \".ssh\" -perm /go+rwx"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 7.2.11. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3>=1000)&&($7 !~ /(nologin|false)$/){print $6}' /etc/passwd | while read -r d; do
        if [ -d "$d" ]; then find "$d" -xdev -type d -name ".ssh" -perm /go+rwx 2>/dev/null || true; fi
      done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ." }
    rationale: &rat-45e651237e |
      ~/.ssh holds private keys, authorized_keys and known_hosts. If group or others can access it, keys can be stolen, and write access lets an attacker add a key to authorized_keys and log in as the user. OpenSSH also refuses keys in directories with loose permissions when StrictModes is enabled.
    remediation: &rem-e0aff8b12d |
      Restrict each reported .ssh directory to its owner.

      chmod 0700 DIR
