      - { some: "~ -a always,exit -F arch=b64 -F dir=/etc/apparmor\\.d -F perm=wa -k MAC-policy" }
    rationale: &rat-e8387d81f4 |
      The AppArmor configuration and profiles in /etc/apparmor and /etc/apparmor.d confine applications. Changes can weaken or disable that confinement. Auditing writes to these directories records modifications of the mandatory access control policy.
    remediation: &rem-95a7200814 |
      Add audit rules for /etc/apparmor and /etc/apparmor.d with the key MAC-policy and load them.

      printf '%s\n' '-a always,exit -F arch=b64 -F dir=/etc/apparmor -F perm=wa -k MAC-policy' >> /etc/audit/rules.d/50-MAC-policy.rules
      printf '%s\n' '-a always,exit -F arch=b64 -F dir=/etc/apparmor.d -F perm=wa -k MAC-policy' >> /etc/audit/rules.d/50-MAC-policy.rules
      augenrules --load

      If the loaded audit rules are immutable (-e 2), the new rules only become active after a reboot.
  - id: "CIS-UBUNTU26-6.2.3.27-auditd_27_config"
    name: "auditd 27 config: grep perm_chng /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.3.27. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep perm_chng /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -F path=/usr/bin/chcon -F perm=x -F auid\u003e=1000 -F auid!=unset -k perm_chng" }
    rationale: &rat-be46718d94 |
      chcon changes the security context of files. Misuse can relabel files so that confined processes may access them. Auditing executions of chcon by regular users records such changes.
    remediation: &rem-0e3880976e |
      Add an audit rule for /usr/bin/chcon with the key perm_chng and load it.

      printf '%s\n' '-a always,exit -F arch=b64 -F path=/usr/bin/chcon -F perm=x -F auid>=1000 -F auid!=unset -k perm_chng' >> /etc/audit/rules.d/50-perm_chng.rules
      augenrules --load

      If the loaded audit rules are immutable (-e 2), the new rules only become active after a reboot.
  - id: "CIS-UBUNTU26-6.2.3.28-auditd_28_config"
    name: "auditd 28 config: grep perm_chng /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.3.28. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep perm_chng /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -F path=/usr/bin/setfacl -F perm=x -F auid\u003e=1000 -F auid!=unset -k perm_chng" }
    rationale: &rat-e25e44b4a1 |
      setfacl adds or changes POSIX ACLs, which can grant other users access beyond the regular mode bits. Auditing executions of setfacl by regular users records these permission changes.
    remediation: &rem-d47ae4df58 |
      Add an audit rule for /usr/bin/setfacl with the key perm_chng and load it.

      printf '%s\n' '-a always,exit -F arch=b64 -F path=/usr/bin/setfacl -F perm=x -F auid>=1000 -F auid!=unset -k perm_chng' >> /etc/audit/rules.d/50-perm_chng.rules
      augenrules --load

      If the loaded audit rules are immutable (-e 2), the new rules only become active after a reboot.
  - id: "CIS-UBUNTU26-6.2.3.29-auditd_29_config"
    name: "auditd 29 config: grep perm_chng /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.3.29. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep perm_chng /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -F path=/usr/bin/chacl -F perm=x -F auid\u003e=1000 -F auid!=unset -k perm_chng" }
    rationale: &rat-41f67b9492 |
      chacl changes POSIX ACLs, which can grant other users access beyond the regular mode bits. Auditing executions of chacl by regular users records these permission changes.
    remediation: &rem-6a992d2261 |
      Add an audit rule for /usr/bin/chacl with the key perm_chng and load it.

      printf '%s\n' '-a always,exit -F arch=b64 -F path=/usr/bin/chacl -F perm=x -F auid>=1000 -F auid!=unset -k perm_chng' >> /etc/audit/rules.d/50-perm_chng.rules
      augenrules --load

      If the loaded audit rules are immutable (-e 2), the new rules only become active after a reboot.
  - id: "CIS-UBUNTU26-6.2.3.30-auditd_30_config"
    name: "auditd 30 config: grep usermod /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.3.30. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep usermod /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -F path=/usr/sbin/usermod -F perm=x -F auid\u003e=1000 -F auid!=unset -k usermod" }
    rationale: &rat-56ebe86d77 |
      usermod changes account properties such as group membership, shell, UID and lock state and can be used to grant privileges. Auditing every execution of usermod by logged-in users records these account changes.
    remediation: &rem-6bfb7590a9 |
      Add an audit rule for /usr/sbin/usermod with the key usermod and load it.

      printf '%s\n' '-a always,exit -F arch=b64 -F path=/usr/sbin/usermod -F perm=x -F auid>=1000 -F auid!=unset -k usermod' >> /etc/audit/rules.d/50-usermod.rules
      augenrules --load

      If the loaded audit rules are immutable (-e 2), the new rules only become active after a reboot.
  - id: "CIS-UBUNTU26-6.2.3.31-auditd_31_config"
    name: "auditd 31 config: grep kernel_modules /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.3.31. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep kernel_modules /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -F path=/usr/bin/kmod -F perm=x -F auid\u003e=1000 -F auid!=unset -k kernel_modules" }
    rationale: &rat-523f184919 |
      Kernel modules run with full kernel privileges; loading a malicious module gives complete control over the system and can hide an intruder. Auditing executions of kmod, which provides insmod, modprobe and rmmod, records attempts to load or remove modules.
    remediation: &rem-3b4d10cda6 |
      Add an audit rule for /usr/bin/kmod with the key kernel_modules and load it.

      printf '%s\n' '-a always,exit -F arch=b64 -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset -k kernel_modules' >> /etc/audit/rules.d/50-kernel_modules.rules
      augenrules --load

      If the loaded audit rules are immutable (-e 2), the new rules only become active after a reboot.
  - id: "CIS-UBUNTU26-6.2.3.32-auditd_32_config"
    name: "auditd 32 config: grep kernel_modules /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.3.32. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep kernel_modules /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S init_module,finit_module -F auid\u003e=1000 -F auid!=unset -k kernel_modules" }
      - { some: "~ -a always,exit -F arch=b32 -S init_module,finit_module -F auid\u003e=1000 -F auid!=unset -k kernel_modules" }
    rationale: &rat-8bacfee691 |
      Kernel modules run with full kernel privileges, and module loading is a common rootkit technique. Auditing the init_module and finit_module system calls records every attempt to load a module, regardless of the tool used.
    remediation: &rem-1663ec2ef6 |
      Add audit rules for the module loading system calls with the key kernel_modules and load them.

      printf '%s\n' '-a always,exit -F arch=b64 -S init_module,finit_module -F auid>=1000 -F auid!=unset -k kernel_modules' >> /etc/audit/rules.d/50-kernel_modules.rules
      printf '%s\n' '-a always,exit -F arch=b32 -S init_module,finit_module -F auid>=1000 -F auid!=unset -k kernel_modules' >> /etc/audit/rules.d/50-kernel_modules.rules
      augenrules --load

      If the loaded audit rules are immutable (-e 2), the new rules only become active after a reboot.
  - id: "CIS-UBUNTU26-6.2.3.33-auditd_33_config"
    name: "auditd 33 config: grep kernel_modules /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.3.33. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep kernel_modules /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S delete_module -F auid\u003e=1000 -F auid!=unset -k kernel_modules" }
      - { some: "~ -a always,exit -F arch=b32 -S delete_module -F auid\u003e=1000 -F auid!=unset -k kernel_modules" }
    rationale: &rat-34bf964a14 |
      Unloading kernel modules can disable security functions such as firewall or auditing components. Auditing the delete_module system call records every attempt to remove a module.
    remediation: &rem-b1b7e9faea |
      Add audit rules for the delete_module system call with the key kernel_modules and load them.

      printf '%s\n' '-a always,exit -F arch=b64 -S delete_module -F auid>=1000 -F auid!=unset -k kernel_modules' >> /etc/audit/rules.d/50-kernel_modules.rules
      printf '%s\n' '-a always,exit -F arch=b32 -S delete_module -F auid>=1000 -F auid!=unset -k kernel_modules' >> /etc/audit/rules.d/50-kernel_modules.rules
      augenrules --load

      If the loaded audit rules are immutable (-e 2), the new rules only become active after a reboot.
  - id: "CIS-UBUNTU26-6.2.3.34-auditd_load_on_error"
    name: "auditd load on error: grep \"^-c\" /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.3.34. NIST SP 800-53 Rev. 5: AU-3, AU-12."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep "^-c" /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -c" }
    rationale: &rat-8500b9ae6f |
      By default auditctl stops at the first rule that fails to load, so a single invalid rule (for example one referring to a path that does not exist on this system) leaves all following rules inactive. The -c option makes rule loading continue past errors, so the rest of the audit policy stays in force.
    remediation: &rem-8ce5985625 |
      Add the -c option at the start of a line in an early rules file and reload the rules.

      printf '%s\n' '-c' > /etc/audit/rules.d/05-continue-on-error.rules
      augenrules --load

      Check the output of augenrules for rules that failed to load and fix them. If the loaded audit rules are immutable (-e 2), the new rules only become active after a reboot.
  - id: "CIS-UBUNTU26-6.2.3.35-auditd_immutable"
    name: "auditd immutable: grep -h -e \"^-e 2\" /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.3.35. NIST SP 800-53 Rev. 5: AC-3, AU-3, AU-12, MP-2."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep -h -e "^-e 2" /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -e 2" }
    rationale: &rat-3a8280a222 |
      With -e 2 as the last audit rule, the audit configuration becomes immutable until the next reboot. An attacker who gains root can then not silently remove or change audit rules to hide their actions; any change requires a reboot, which is itself noticeable.
    remediation: &rem-b5fe509082 |
      Make the audit configuration immutable by adding -e 2 as the last rule, in a file that sorts after all other rule files, and load the rules.

      echo '-e 2' > /etc/audit/rules.d/99-finalize.rules
      augenrules --load

      After loading, audit rules cannot be changed until the next reboot, so complete the rule set first. If -e 2 is already active, the change takes effect after a reboot.
  - id: "CIS-UBUNTU26-6.2.3.36-auditd_config_match"
    name: "auditd config match: augenrules --check"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.3.36. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      augenrules --check
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*: No change" }
    rationale: &rat-5a0b10aeb5 |
      Audit rules are maintained as files under /etc/audit/rules.d/ and compiled into /etc/audit/audit.rules by augenrules. If the two differ, the rules loaded at boot are not the rules that were reviewed and approved, and recent changes may silently be missing.
    remediation: &rem-c01d27a866 |
      Regenerate /etc/audit/audit.rules from the files in /etc/audit/rules.d/ and load the result, then verify that augenrules reports no change.

      augenrules --load
      augenrules --check

      If the audit configuration is immutable (-e 2 in the rules), the new rules only take effect after a reboot.
  - id: "CIS-UBUNTU26-6.2.4.1-audit_logfile_perms"
    name: "audit logfile perms: find \"$(grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }' | xargs dirname)\" -ty…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.4.1. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      find "$(grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }' | xargs dirname)" -type f -perm /137
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-3e567f4da4 |
      Audit logs record security-relevant activity and may contain sensitive information. Limiting their mode to 0640 or stricter prevents unauthorised users from reading them and anyone except root from modifying them.
    remediation: &rem-45a094787e |
      Restrict the audit log files to mode 0640 or stricter. The commands use the default directory /var/log/audit; use the directory of log_file in /etc/audit/auditd.conf if it differs.

      find /var/log/audit -type f -perm /0137 -exec chmod u-x,g-wx,o-rwx {} +
      chmod 0600 /var/log/audit/audit.log

      Some variants require the current log file to be exactly 0600 or 0640.
  - id: "CIS-UBUNTU26-6.2.4.2-audit_logfile_owner"
    name: "audit logfile owner: find \"$(grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }' | xargs dirname)\"  -t…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.4.2. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      find "$(grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }' | xargs dirname)"  -type f ! -user root
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-2960c33012 |
      Audit logs must only be modifiable by root. If they are owned by another user, that user could alter or delete records and thereby hide activity.
    remediation: &rem-d7ec9e6f98 |
      Make root the owner of all audit log files. The command uses the default directory /var/log/audit; use the directory of log_file in /etc/audit/auditd.conf if it differs.

      find /var/log/audit -type f ! -user root -exec chown root {} +

      On Debian 12 this check tests the group of the current log file instead (root or adm); correct it with chgrp root /var/log/audit/audit.log.
  - id: "CIS-UBUNTU26-6.2.4.3-audit_logfile_group"
    name: "audit logfile group: for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc \" …"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.4.3. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc " %n_%G" $file; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_(adm|root)$" }
    rationale: &rat-27178e295b |
      The group of the audit log files determines who besides root may read them. Restricting it to root or a dedicated log group such as adm keeps audit data away from ordinary users.
    remediation: &rem-2be7ad5f04 |
      Assign the audit log files to the root group (adm is also accepted) and make sure log_group in /etc/audit/auditd.conf names the same group, so that auditd keeps using it. The command uses the default directory /var/log/audit.

      find /var/log/audit -type f ! -group root ! -group adm -exec chgrp root {} +
      grep -E '^\s*log_group' /etc/audit/auditd.conf
  - id: "CIS-UBUNTU26-6.2.4.3-audit_logfile_group_setting"
    name: "audit logfile group setting: find \"$(grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }' | xargs dirname)\"  -t…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.4.3. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      find "$(grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }' | xargs dirname)"  -type f ! -group root ! -group adm
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-004712d53c |
      log_group in auditd.conf sets the group of the audit log files that auditd creates. Setting it to root or a dedicated log group ensures that new and rotated log files are not readable by ordinary users.
    remediation: &rem-651e7832f2 |
      Set log_group in /etc/audit/auditd.conf to root (adm is also accepted), apply it to the existing log files and make auditd re-read its configuration.

      sed -i -E 's/^\s*#?\s*log_group\s*=.*/log_group = root/' /etc/audit/auditd.conf
      grep -q '^log_group' /etc/audit/auditd.conf || echo 'log_group = root' >> /etc/audit/auditd.conf
      find /var/log/audit -type f ! -group root -exec chgrp root {} +
      pkill -HUP -x auditd
  - id: "CIS-UBUNTU26-6.2.4.4-audit_logfile_dir_perms"
    name: "audit logfile dir perms: for dir in `dirname \\`grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'\\``; do …"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.4.4. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      for dir in `dirname \`grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'\``; do stat -Lc " %n_%a" $dir; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_7[0145]0$" }
    rationale: &rat-00692bf603 |
      The audit log directory holds the audit trail. If other users can enter or list it, or group members can write to it, audit records could be read for reconnaissance or tampered with. Mode 0750 or stricter limits access to root and the audit group.
    remediation: &rem-8ac87c6fbb |
      Set the permissions of the audit log directory (the directory of log_file in /etc/audit/auditd.conf, by default /var/log/audit) to 0750.

      grep '^log_file' /etc/audit/auditd.conf
      chmod 0750 /var/log/audit

      Most variants accept exactly 0700 or 0750, so do not use other modes such as 0710 or 0740.
  - id: "CIS-UBUNTU26-6.2.4.5-audit_conf_perms"
    name: "audit conf perms: for file  in `find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\)`; do stat …"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.4.5. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      for file  in `find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \)`; do stat -Lc " %n_%a" $file; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_6(0|4)0$" }
    rationale: &rat-dfb522cb65 |
      The audit configuration and rule files determine what is recorded. If they are writable by others, an attacker could disable auditing without root privileges; if they are readable by everyone, the gaps in monitoring become visible. A mode of 0640 or stricter prevents both.
    remediation: &rem-892fd1a120 |
      Remove write access for the group and all access for others from the audit configuration and rule files.

      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) -perm /0137 -exec chmod u-x,g-wx,o-rwx {} +
  - id: "CIS-UBUNTU26-6.2.4.6-audit_conf_owner"
    name: "audit conf owner: for file  in `find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\)`; do stat …"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 6.2.4.6. NIST SP 800-53 Rev. 5: AU-3."
    tags: [cis, cis-ubuntu26, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      for file  in `find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \)`; do stat -Lc " %n_%U" $file; done
    allow_rc: any
    expect:
