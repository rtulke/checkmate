  - id: "CIS-UBUNTU26-5.3.3.2.1-passwd_change_not_pamd-content"
    name: "/etc/pam.d/common-password has the expected content (1 rule)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/common-password'
    allow_rc: any
    expect: { none: "~ ^\\s+password\\s+(requisite|required|sufficient)\\s+pam_pwquality\\.so\\s+([^#\\n\\r]+\\s+)?difok\\s*=\\s*([0-1])\\b" }
    rationale: *rat-9247230425
    remediation: &rem-bd16378d80 |
      Edit /etc/pam.d/common-password so that its lines meet these conditions (regular expressions):

      - no line matches ^\s+password\s+(requisite|required|sufficient)\s+pam_pwquality\.so\s+([^#\n\r]+\s+)?difok\s*=\s*([0-1])\b
  - id: "CIS-UBUNTU26-5.3.3.2.1-password_character_changed"
    name: "password character changed: grep -Psi -- '^\\h*difok\\h*=\\h*([2-9]|[1-9][0-9]+)\\b' /etc/security/pwquality.conf /etc/se…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*difok\h*=\h*([2-9]|[1-9][0-9]+)\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:difok\\s*=\\s*[2-9]" }
    rationale: &rat-b71bd8fb5f |
      Requiring that a new password differs from the old one in several characters prevents users from cycling through trivial variations such as appending a digit. Without it, password expiry adds little security because a leaked old password reveals the new one.
    remediation: &rem-30c88d9d14 |
      Set difok = 2 in a pwquality drop-in file and remove lower settings of difok from /etc/security/pwquality.conf and other drop-ins.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'difok = 2' > /etc/security/pwquality.conf.d/50-difok.conf

      The value is enforced by pam_pwquality (on Debian and Ubuntu install libpam-pwquality). Using a drop-in also matters for the check, which on some platforms fails when pwquality.conf.d contains no .conf file.
  - id: "CIS-UBUNTU26-5.3.3.2.2-password_minlen"
    name: "password minlen: grep -Psi -- '^\\h*minlen\\h*=\\h*(1[4-9]|[2-9][0-9]|[1-9][0-9]{2,})\\b' /etc/security/pwqual…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*minlen\h*=\h*(1[4-9]|[2-9][0-9]|[1-9][0-9]{2,})\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:minlen\\s*=\\s*(1[4-9]|[2-4][0-9])" }
    rationale: &rat-d3de089d0b |
      Password length is the most important factor for resistance against guessing and cracking. A minimum of 14 characters makes brute force attacks against stolen hashes impractical and encourages passphrases over short complex strings.
    remediation: &rem-3d639df090 |
      Set minlen = 14 in a pwquality drop-in file and remove lower settings of minlen from /etc/security/pwquality.conf and other drop-ins.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'minlen = 14' > /etc/security/pwquality.conf.d/50-minlen.conf

      The value is enforced by pam_pwquality (on Debian and Ubuntu install libpam-pwquality). Using a drop-in also matters for the check, which on some platforms fails when pwquality.conf.d contains no .conf file.
  - id: "CIS-UBUNTU26-5.3.3.2.2-password_minlen_not_pamd"
    name: "password minlen not pamd: grep -Psi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwquality\\.so\\h+([^#\\n…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwquality\.so\h+([^#\n\r]+\h+)?minlen\h*=\h*([0-9]|1[0-3])\b' /etc/pam.d/system-auth /etc/pam.d/common-password
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-eca3499dbe |
      A minlen argument on the pam_pwquality line overrides the value in pwquality.conf. A value below 14 there silently weakens the password length policy for all users.
    remediation: &rem-754b5a8c4d |
      Remove the minlen= option from the pam_pwquality.so line in /etc/pam.d/common-password and set minlen in /etc/security/pwquality.conf.d/ instead.

      grep -Pn 'pam_pwquality\.so.*\bminlen\s*=' /etc/pam.d/common-password /usr/share/pam-configs/*

      If the option comes from a profile in /usr/share/pam-configs/, remove it there and run pam-auth-update --package to regenerate common-password; otherwise edit common-password directly.
  - id: "CIS-UBUNTU26-5.3.3.2.3-password_complex"
    name: "password complex: grep -Psi -- '^\\h*(minclass|[dulo]credit)\\b' /etc/security/pwquality.conf /etc/security/p…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*(minclass|[dulo]credit)\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:minclass\\s*=\\s*([1-9]|[1-9][0-9])" }
      - { some: "~ .*\\:ucredit\\s*=\\s*(0|-\\d)" }
      - { some: "~ .*\\:lcredit\\s*=\\s*(0|-\\d)" }
      - { some: "~ .*\\:dcredit\\s*=\\s*(0|-\\d)" }
      - { some: "~ .*\\:ocredit\\s*=\\s*(0|-\\d)" }
    rationale: &rat-f4b189855b |
      Requiring several character classes enlarges the search space attackers must cover and prevents passwords made of a single class such as lowercase words. The variants differ: RHEL and Amazon Linux expect minclass 4 without per-class credit settings, Debian expects minclass, and Ubuntu additionally expects the per-class credit options to be set.
    remediation: &rem-5e39491c98 |
      Set minclass and explicit per-class credit values in a pwquality drop-in file.

      mkdir -p /etc/security/pwquality.conf.d
      printf '%s\n' 'minclass = 4' 'dcredit = 0' 'ucredit = 0' 'lcredit = 0' 'ocredit = 0' > /etc/security/pwquality.conf.d/50-pwcomplexity.conf

      The credit lines are only required by the Ubuntu check; 0 leaves the class requirement to minclass. Install libpam-pwquality so the values are enforced.
  - id: "CIS-UBUNTU26-5.3.3.2.3-password_complex_not_pamd"
    name: "password complex not pamd: grep -Psi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwquality\\.so\\h+([^#\\n…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwquality\.so\h+([^#\n\r]+\h+)?(minclass=\d*|[dulo]credit=-?\d*)\b' /etc/pam.d/common-password
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-bd87e96f71 |
      Complexity options such as minclass or dcredit given on the pam_pwquality line override pwquality.conf. Settings there are easily overlooked and can weaken the complexity policy without anyone noticing.
    remediation: &rem-c9d355646d |
      Remove the minclass= and dcredit=, ucredit=, lcredit=, ocredit= options from the pam_pwquality.so line in /etc/pam.d/common-password and set them in /etc/security/pwquality.conf.d/ instead.

      grep -Pn 'pam_pwquality\.so.*\b(minclass|[dulo]credit)\s*=' /etc/pam.d/common-password /usr/share/pam-configs/*

      If the option comes from a profile in /usr/share/pam-configs/, remove it there and run pam-auth-update --package to regenerate common-password; otherwise edit common-password directly.
  - id: "CIS-UBUNTU26-5.3.3.2.4-consecutive_characters_not_pamd"
    name: "consecutive characters not pamd: grep -Psi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwquality\\.so\\h+([^#\\n…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwquality\.so\h+([^#\n\r]+\h+)?maxrepeat\h*=\h*(0|[4-9]|[1-9][0-9]+)\b' /etc/pam.d/common-password
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-b0c24729eb |
      A maxrepeat argument on the pam_pwquality line overrides pwquality.conf. A value of 0 (no limit) or 4 and more there allows passwords like aaaa1111 that are easy to guess.
    remediation: &rem-a562e98476 |
      Remove the maxrepeat= option from the pam_pwquality.so line in /etc/pam.d/common-password and set maxrepeat in /etc/security/pwquality.conf.d/ instead.

      grep -Pn 'pam_pwquality\.so.*\bmaxrepeat\s*=' /etc/pam.d/common-password /usr/share/pam-configs/*

      If the option comes from a profile in /usr/share/pam-configs/, remove it there and run pam-auth-update --package to regenerate common-password; otherwise edit common-password directly.
  - id: "CIS-UBUNTU26-5.3.3.2.4-password_consecutive_characters"
    name: "password consecutive characters: grep -Psi -- '^\\h*maxrepeat\\h*=\\h*[1-3]\\b' /etc/security/pwquality.conf /etc/security/pwq…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.4. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*maxrepeat\h*=\h*[1-3]\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:maxrepeat\\s*=\\s*[1-3]" }
      - { none: "~ .*\\:maxrepeat\\s*=\\s*0" }
    rationale: &rat-d9b92e13d5 |
      Limiting how often the same character may repeat consecutively rejects passwords such as aaaa1111 or Passsssword that add length without adding real entropy and appear early in cracking dictionaries.
    remediation: &rem-3a9f48811a |
      Set maxrepeat = 3 in a pwquality drop-in file and remove zero or higher settings of maxrepeat from /etc/security/pwquality.conf and other drop-ins.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'maxrepeat = 3' > /etc/security/pwquality.conf.d/50-maxrepeat.conf

      The value is enforced by pam_pwquality (on Debian and Ubuntu install libpam-pwquality). Using a drop-in also matters for the check, which on some platforms fails when pwquality.conf.d contains no .conf file.
  - id: "CIS-UBUNTU26-5.3.3.2.5-maxseq_not_pamd"
    name: "maxseq not pamd: grep -Psi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwquality\\.so\\h+([^#\\n…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.5. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwquality\.so\h+([^#\n\r]+\h+)?maxsequence\h*=\h*(0|[4-9]|[1-9][0-9]+)\b' /etc/pam.d/common-password
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-99805670c8 |
      A maxsequence argument on the pam_pwquality line overrides pwquality.conf. A value of 0 (no limit) or 4 and more there permits monotonic sequences like 12345 or abcde in passwords.
    remediation: &rem-9913cef643 |
      Remove the maxsequence= option from the pam_pwquality.so line in /etc/pam.d/common-password and set maxsequence in /etc/security/pwquality.conf.d/ instead.

      grep -Pn 'pam_pwquality\.so.*\bmaxsequence\s*=' /etc/pam.d/common-password /usr/share/pam-configs/*

      If the option comes from a profile in /usr/share/pam-configs/, remove it there and run pam-auth-update --package to regenerate common-password; otherwise edit common-password directly.
  - id: "CIS-UBUNTU26-5.3.3.2.5-password_maxseq"
    name: "password maxseq: grep -Psi -- '^\\h*maxsequence\\h*=\\h*[1-3]\\b' /etc/security/pwquality.conf /etc/security/p…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.5. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*maxsequence\h*=\h*[1-3]\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:maxsequence\\s*=\\s*[1-3]" }
      - { none: "~ .*\\:maxsequence\\s*=\\s*0" }
    rationale: &rat-056e245d5d |
      Monotonic character sequences such as 12345 or abcdef are among the first patterns tried by password crackers. Limiting their length to three characters makes users choose passwords that are harder to predict.
    remediation: &rem-bbbdc2081c |
      Set maxsequence = 3 in a pwquality drop-in file and remove zero or higher settings of maxsequence from /etc/security/pwquality.conf and other drop-ins.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'maxsequence = 3' > /etc/security/pwquality.conf.d/50-maxsequence.conf

      The value is enforced by pam_pwquality (on Debian and Ubuntu install libpam-pwquality). Using a drop-in also matters for the check, which on some platforms fails when pwquality.conf.d contains no .conf file.
  - id: "CIS-UBUNTU26-5.3.3.2.6-dictchk_not_pamd"
    name: "dictchk not pamd: grep -Psi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwquality\\.so\\h+([^#\\n…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.6. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwquality\.so\h+([^#\n\r]+\h+)?dictcheck\h*=\h*0\b' /etc/pam.d/common-password
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-c426ead3e7 |
      A dictcheck=0 argument on the pam_pwquality line disables the dictionary check regardless of pwquality.conf. Users could then choose common words and known leaked passwords, which fall quickly to dictionary attacks.
    remediation: &rem-fd1d554115 |
      Remove the dictcheck= option from the pam_pwquality.so line in /etc/pam.d/common-password and keep dictcheck enabled in /etc/security/pwquality.conf.d/.

      grep -Pn 'pam_pwquality\.so.*\bdictcheck\s*=' /etc/pam.d/common-password /usr/share/pam-configs/*

      If the option comes from a profile in /usr/share/pam-configs/, remove it there and run pam-auth-update --package to regenerate common-password; otherwise edit common-password directly.
  - id: "CIS-UBUNTU26-5.3.3.2.6-password_dictchk"
    name: "password dictchk: grep -Psi -- '^\\h*dictcheck\\s*=' /etc/security/pwquality.conf /etc/security/pwquality.con…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.6. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*dictcheck\s*=' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:dictcheck\\s*=\\s*1" }
      - { none: "~ .*\\:dictcheck\\s*=\\s*0" }
    rationale: &rat-a54439690d |
      The dictionary check rejects passwords that are based on words from a cracking dictionary. Such passwords are guessed within seconds in offline attacks against stolen hashes. Keeping dictcheck enabled blocks the most common weak choices.
    remediation: &rem-f4e720cc77 |
      Enable the dictionary check explicitly and remove any dictcheck = 0 setting.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'dictcheck = 1' > /etc/security/pwquality.conf.d/50-dictcheck.conf
      grep -Pn '^\h*dictcheck\h*=\h*0' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf

      Delete or comment out the lines grep shows. On Debian and Ubuntu install libpam-pwquality and its cracklib dictionary so the check is effective.
  - id: "CIS-UBUNTU26-5.3.3.2.7-password_quality_enforce"
    name: "password quality enforce: grep -Psi -- '^\\h*enforcing\\s*=\\s*' /etc/security/pwquality.conf /etc/security/pwquality.…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.7. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*enforcing\s*=\s*' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:enforcing\\s*=\\s*1" }
      - { none: "~ .*\\:enforcing\\s*=\\s*0" }
    rationale: &rat-297189bc8a |
      pam_pwquality can run in a mode where it only warns about weak passwords but still accepts them. Setting enforcing = 1 makes the complexity rules binding, so passwords that fail the checks are rejected. An explicit setting also guards against configuration that silently disabled enforcement.
    remediation: &rem-5b3572d1af |
      Set enforcing = 1 in a pwquality drop-in file and remove any enforcing = 0 line from /etc/security/pwquality.conf and /etc/security/pwquality.conf.d/.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'enforcing = 1' > /etc/security/pwquality.conf.d/50-pwenforcing.conf
      grep -Psi '^\h*enforcing\s*=\s*0' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf

      The setting applies to the next password change; no restart is needed.
  - id: "CIS-UBUNTU26-5.3.3.2.7-quality_enforce_not_pamd"
    name: "quality enforce not pamd: grep -Psi -- '^\\h*password\\h+[^#\\n\\r]+\\h+pam_pwquality\\.so\\h+([^#\\n\\r]+\\h+)?enforcing=0\\b…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.7. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\h*password\h+[^#\n\r]+\h+pam_pwquality\.so\h+([^#\n\r]+\h+)?enforcing=0\b' /etc/pam.d/common-password
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-1765a9de3b |
      An enforcing=0 argument on the pam_pwquality line overrides pwquality.conf and turns the complexity checks into mere warnings. Users can then set passwords that violate policy while the configuration file looks compliant. Keeping the argument off the PAM line ensures the configured rules are enforced.
    remediation: &rem-85610bde86 |
      Remove the enforcing=0 argument from the pam_pwquality line in /etc/pam.d/common-password. If the line comes from a profile in /usr/share/pam-configs/ (usually pwquality), remove it there as well so pam-auth-update does not restore it.

      grep -n 'pam_pwquality' /etc/pam.d/common-password /usr/share/pam-configs/*
      sed -ri '/pam_pwquality\.so/s/\s+enforcing=0\b//' /etc/pam.d/common-password
  - id: "CIS-UBUNTU26-5.3.3.2.8-password_quality_enforce_root"
    name: "password quality enforce root: grep -Psi -- '^\\s*enforce_for_root\\b' /etc/security/pwquality.conf /etc/security/pwqualit…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.2.8. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Psi -- '^\s*enforce_for_root\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:enforce_for_root" }
      - { none: "~ .*\\:#\\s*enforce_for_root\\s*=\\s*0" }
    rationale: &rat-ba2f1202e1 |
      By default pam_pwquality only warns root about a weak password and accepts it anyway. Since root often sets passwords for other accounts and for itself, enforce_for_root applies the same quality rules to passwords set by root.
    remediation: &rem-752a1b9c2a |
      Enable enforce_for_root in a pwquality drop-in file.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'enforce_for_root' > /etc/security/pwquality.conf.d/50-enforce_for_root.conf

      The option is evaluated by pam_pwquality (on Debian and Ubuntu install libpam-pwquality). Using a drop-in also matters for the check, which on some platforms fails when pwquality.conf.d contains no .conf file.
  - id: "CIS-UBUNTU26-5.3.3.3.1-pwhistory_remember_common_passwd-attrs"
    name: "/etc/pam.d/common-password: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.3.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/common-password'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e0779c3919 |
      Remembering at least 24 previous passwords prevents users from cycling back to an old password shortly after a forced change. Together with password ageing it ensures that a password that may have been exposed earlier does not come back into use.
    remediation: *rem-24dae7c4b7
  - id: "CIS-UBUNTU26-5.3.3.3.1-pwhistory_remember_common_passwd-content"
    name: "/etc/pam.d/common-password has the expected content (1 rule)"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.3.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/common-password'
    allow_rc: any
    expect: { some: "~ ^\\s*password\\s*(requisite|required)\\s*pam_pwhistory.so.*remember\\s*=\\s*(2[4-9]|[3-9][0-9])" }
    rationale: *rat-e0779c3919
    remediation: &rem-ef2581476e |
      Edit /etc/pam.d/common-password so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*password\s*(requisite|required)\s*pam_pwhistory.so.*remember\s*=\s*(2[4-9]|[3-9][0-9])
  - id: "CIS-UBUNTU26-5.3.3.3.1-pwhistory_remember_pam_configs"
    name: "pwhistory remember pam configs: for file in `awk '/Password-Type:/{ f = 1;next } /-Type:/{ f = 0 } f {if (/pam_pwhistory\\…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.3.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      for file in `awk '/Password-Type:/{ f = 1;next } /-Type:/{ f = 0 } f {if (/pam_pwhistory\.so/) print FILENAME}' /usr/share/pam-configs/*`; do grep pam_pwhistory $file | grep -v remember;  done
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-1d7ddbbc40 |
      Password history only prevents reuse if enough old passwords are remembered. On Debian-based systems the pam_pwhistory lines in the pam-auth-update profiles should carry the remember option so a regenerated PAM stack keeps the intended depth; on Red Hat systems a low remember value on the PAM line would override the configured policy. Remembering at least 24 passwords stops users from cycling back to recent ones.
    remediation: &rem-9fcd27d8d8 |
      Add remember=24 to every pam_pwhistory line of the profile(s) under /usr/share/pam-configs/ that lack it, then regenerate the PAM stack.

      grep -l pam_pwhistory /usr/share/pam-configs/*
      sed -ri '/pam_pwhistory\.so/{/remember=/!s/$/ remember=24/}' FILE
      pam-auth-update --enable $(basename FILE)

      A complete profile line typically reads: requisite pam_pwhistory.so remember=24 enforce_for_root try_first_pass use_authtok
  - id: "CIS-UBUNTU26-5.3.3.3.2-pwhistory_enforce_for_root-attrs"
    name: "/etc/pam.d/common-password: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.3.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/common-password'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-5a6040fb53 |
      By default pam_pwhistory does not apply its reuse check when a password is changed by root. enforce_for_root extends the history rule to these changes, so root's own password and passwords set as root also cannot reuse recent ones.
    remediation: *rem-24dae7c4b7
  - id: "CIS-UBUNTU26-5.3.3.3.2-pwhistory_enforce_for_root-content"
    name: "/etc/pam.d/common-password has the expected content (1 rule)"
