  - id: "CIS-UBUNTU26-1.1.2.7.1-var_log_audit_mount"
    name: "/var/log/audit is a separate mount"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 1.1.2.7.1. NIST SP 800-53 Rev. 5: CM-7."
