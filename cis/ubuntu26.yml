  - id: "CIS-UBUNTU26-5.3.3.1.1-faillock_attempts_deny_removed"
    name: "faillock attempts deny removed: grep -Pl -- '\\bpam_faillock\\.so\\h+([^#\\n\\r]+\\h+)?deny\\b' /usr/share/pam-configs/*"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.1.1. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Pl -- '\bpam_faillock\.so\h+([^#\n\r]+\h+)?deny\b' /usr/share/pam-configs/*
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ .*" }
    rationale: &rat-468b24eae7 |
      The lockout threshold of pam_faillock should be defined in one place, /etc/security/faillock.conf. A deny argument on the PAM line overrides the file, so the effective policy can differ from what administrators and auditors see in faillock.conf and may be changed silently when profiles are regenerated. Keeping the argument off the PAM line keeps the threshold centrally managed.
    remediation: &rem-aba47ec21c |
      Remove the deny= argument from the pam_faillock lines of each profile under /usr/share/pam-configs/ that the first command lists, set the value in /etc/security/faillock.conf instead and regenerate the PAM stack.

      grep -Pl '\bpam_faillock\.so\h+([^#\n\r]+\h+)?deny\b' /usr/share/pam-configs/*
      sed -ri '/pam_faillock\.so/s/\s+deny=[0-9]+//g' FILE
      echo 'deny = 5' >> /etc/security/faillock.conf
      pam-auth-update --enable $(basename FILE)

      Edit an existing line in faillock.conf instead of adding a duplicate.
  - id: "CIS-UBUNTU26-5.3.3.1.2-faillock_unlock_time-attrs"
    name: "/etc/security/faillock.conf: exists"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 5.3.3.1.2. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
