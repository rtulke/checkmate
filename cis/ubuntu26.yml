  - id: "CIS-UBUNTU26-3.2.7-unneeded_network_protocol_modules"
    name: "unneeded network protocol modules: lsmod | awk '{print $1}' | grep -Ff \u003c(find /lib/modules/\"$(uname -r)\"/kernel/net -type f …"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.2.7. NIST SP 800-53 Rev. 5: NA."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      lsmod | awk '{print $1}' | grep -Ff <(find /lib/modules/"$(uname -r)"/kernel/net -type f -name '*.ko*' -printf '%f\n' 2>/dev/null | sed -E 's/\.ko(\.[xg]z|\.zst)?$//' | sort -u) || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .+" }
    rationale: &rat-4b3a4e5b75 |
      Every loaded kernel networking module adds kernel code that is reachable from the network or from local users, and rarely used protocol modules have repeatedly contained exploitable flaws. Keeping only the networking modules the system actually needs reduces the kernel attack surface.
    remediation: &rem-217d1a7db0 |
      Review the reported modules. For each one the system does not need, prevent it from loading and unload it.

      printf '%s\n' 'install MODULE /bin/false' 'blacklist MODULE' > /etc/modprobe.d/MODULE.conf
      modprobe -r MODULE

      Modules required by the firewall (netfilter, nf_tables), bridges, bonding or VPNs must stay loaded; document them as accepted exceptions.
  - id: "CIS-UBUNTU26-3.3.1.1-net.ipv4.ip_forward"
    name: "Kernel parameter net.ipv4.ip_forward is 0"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.3.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.ip_forward
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-f3a19b4b76 |
      With IP forwarding enabled the system routes packets between its interfaces like a router. A host that is not meant to route could then be used to bypass network segmentation. Disabling forwarding ensures only traffic addressed to the host itself is handled. Routers and many container or virtualization hosts need forwarding.
    remediation: &rem-330a5a5e8e |
      Set the kernel parameter net.ipv4.ip_forward to 0, now and at boot:

      sysctl -w 'net.ipv4.ip_forward=0'
      printf '%s\n' 'net.ipv4.ip_forward = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.ip_forward from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU26-3.3.1.1-ipv4_ip_forward"
    name: "ipv4 ip forward: grep \"net\\.ipv4\\.ip_forward\" $([ -f /etc/sysctl.conf ] \u0026\u0026 echo /etc/sysctl.conf) /etc/sys…"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.3.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "net\.ipv4\.ip_forward" $([ -f /etc/sysctl.conf ] && echo /etc/sysctl.conf) /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ net\\.ipv4\\.ip_forward\\s*=\\s*0" }
    rationale: &rat-49a43343d7 |
      IP forwarding lets the host route packets between interfaces. A system that is not meant to be a router could otherwise be used to bypass network segmentation or relay attack traffic. Disabling forwarding ensures packets are only accepted for the host itself. Routers, VPN gateways and container or Kubernetes hosts legitimately need forwarding.
    remediation: &rem-c0b1e9eab5 |
      Set net.ipv4.ip_forward to 0 in a file in /etc/sysctl.d/ and apply it at runtime. Correct any other file that sets a different value (the check command lists them).

      printf '%s\n' 'net.ipv4.ip_forward=0' >> /etc/sysctl.d/60-netipv4_sysctl.conf
      sysctl -w net.ipv4.ip_forward=0
      sysctl -w net.ipv4.route.flush=1

      Files in /etc/sysctl.d/ are applied in lexical order, so a later file can override this setting.
  - id: "CIS-UBUNTU26-3.3.1.2-net.ipv4.conf.all.forwarding"
    name: "Kernel parameter net.ipv4.conf.all.forwarding is 0"
    description: "CIS Ubuntu 26.04 LTS benchmark recommendation 3.3.1.2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5."
    tags: [cis, cis-ubuntu26, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
