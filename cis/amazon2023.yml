    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -S all -F path=/usr/bin/kmod -F perm=x -F auid\u003e=1000 -F auid!=-1 -F key=kernel_modules" }
      - { some: "~ -a always,exit -F arch=b64 -S create_module,init_module,delete_module,query_module,finit_module -F auid\u003e=1000 -F auid!=-1 -F key=kernel_modules" }
    rationale: &rat-c0d0d59fdd |
      Loading a kernel module runs code with full kernel privileges and is a typical technique for rootkits. Auditing the module system calls and the module tools makes loading and unloading of modules traceable. This check verifies that the rules are loaded in the running kernel.
    remediation: &rem-46f8d5de10 |
      Record the loading and unloading of kernel modules: add the rules for your release to /etc/audit/rules.d/50-kernel_modules.rules and load them.

      Amazon Linux 2 and RHEL 8:
      -a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset -k kernel_modules
      -a always,exit -F arch=b64 -S init_module,finit_module,delete_module,create_module,query_module -F auid>=1000 -F auid!=unset -k kernel_modules
      -a always,exit -F arch=b32 -S init_module,finit_module,delete_module,create_module,query_module -F auid>=1000 -F auid!=unset -k kernel_modules

      Amazon Linux 2023 and RHEL 9:
      -a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset -k kernel_modules
      -a always,exit -F arch=b64 -S init_module,finit_module,delete_module,create_module,query_module -F auid>=1000 -F auid!=unset -k kernel_modules

      RHEL 7:
      -w /sbin/insmod -p x -k modules
      -w /sbin/rmmod -p x -k modules
      -w /sbin/modprobe -p x -k modules
      -a always,exit -F arch=b64 -S init_module -S delete_module -k modules

      augenrules --load

      create_module and query_module exist only on x86_64; leave them out on other architectures. If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
  - id: "CIS-AMAZON2023-5.2.3.19-auditd_module_cnf"
    name: "auditd module cnf: grep modules /etc/audit/rules.d/*.rules"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.3.19."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep modules /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F path=/usr/bin/kmod -F perm=x -F auid\u003e=1000 -F auid!=(unset|4294967295) -k kernel_modules" }
      - { some: "~ -a always,exit -F arch=b64 -S init_module,finit_module,delete_module,create_module.query_module -F auid\u003e=1000 -F auid!=(unset|4294967295) -k kernel_modules" }
    rationale: &rat-c8c09470ae |
      Loading a kernel module runs code with full kernel privileges and is a typical technique for rootkits. Auditing the module system calls and the module tools makes loading and unloading of modules traceable. This check verifies that the rules are part of the persistent audit configuration.
    remediation: *rem-46f8d5de10
  - id: "CIS-AMAZON2023-5.2.3.20-auditd_immutable"
    name: "auditd immutable: grep \"-e 2\" /etc/audit/rules.d/*.rules | tail -1"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.3.20."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep "-e 2" /etc/audit/rules.d/*.rules | tail -1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -e 2" }
    rationale: &rat-3a8280a222 |
      With -e 2 as the last audit rule, the audit configuration becomes immutable until the next reboot. An attacker who gains root can then not silently remove or change audit rules to hide their actions; any change requires a reboot, which is itself noticeable.
    remediation: &rem-b5fe509082 |
      Make the audit configuration immutable by adding -e 2 as the last rule, in a file that sorts after all other rule files, and load the rules.

      echo '-e 2' > /etc/audit/rules.d/99-finalize.rules
      augenrules --load

      After loading, audit rules cannot be changed until the next reboot, so complete the rule set first. If -e 2 is already active, the change takes effect after a reboot.
  - id: "CIS-AMAZON2023-5.2.3.21-auditd_conf_vs_live"
    name: "auditd conf vs live: augenrules --check"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.3.21."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      augenrules --check
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\/usr\\/sbin\\/augenrules: No change" }
    rationale: &rat-28c9d94c0a |
      augenrules builds /etc/audit/audit.rules from the files in /etc/audit/rules.d. If the two differ, the rules loaded at the next boot are not those that administrators maintain, and recent changes may never take effect. The check confirms that the compiled rule file is up to date.
    remediation: &rem-c7c4a84bd5 |
      Regenerate /etc/audit/audit.rules from the files in /etc/audit/rules.d and load it.

      augenrules --check
      augenrules --load

      If the running configuration is immutable (-e 2), the compiled file is still updated, but the kernel uses the new rules only after a reboot.
  - id: "CIS-AMAZON2023-5.2.4.1-audit_logfile_perms"
    name: "audit logfile perms: for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc \"%…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.4.1."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc "%n_%a" $file; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_6(0|4)0$" }
    rationale: &rat-3e567f4da4 |
      Audit logs record security-relevant activity and may contain sensitive information. Limiting their mode to 0640 or stricter prevents unauthorised users from reading them and anyone except root from modifying them.
    remediation: &rem-45a094787e |
      Restrict the audit log files to mode 0640 or stricter. The commands use the default directory /var/log/audit; use the directory of log_file in /etc/audit/auditd.conf if it differs.

      find /var/log/audit -type f -perm /0137 -exec chmod u-x,g-wx,o-rwx {} +
      chmod 0600 /var/log/audit/audit.log

      Some variants require the current log file to be exactly 0600 or 0640.
  - id: "CIS-AMAZON2023-5.2.4.2-audit_logfile_owner"
    name: "audit logfile owner: for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc \"%…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.4.2."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc "%n_%U" $file; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_root$" }
    rationale: &rat-2960c33012 |
      Audit logs must only be modifiable by root. If they are owned by another user, that user could alter or delete records and thereby hide activity.
    remediation: &rem-d7ec9e6f98 |
      Make root the owner of all audit log files. The command uses the default directory /var/log/audit; use the directory of log_file in /etc/audit/auditd.conf if it differs.

      find /var/log/audit -type f ! -user root -exec chown root {} +

      On Debian 12 this check tests the group of the current log file instead (root or adm); correct it with chgrp root /var/log/audit/audit.log.
  - id: "CIS-AMAZON2023-5.2.4.3-audit_logfile_group"
    name: "audit logfile group: for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc \" …"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.4.3."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc " %n_%G" $file; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_(adm|root)$" }
    rationale: &rat-27178e295b |
      The group of the audit log files determines who besides root may read them. Restricting it to root or a dedicated log group such as adm keeps audit data away from ordinary users.
    remediation: &rem-2be7ad5f04 |
      Assign the audit log files to the root group (adm is also accepted) and make sure log_group in /etc/audit/auditd.conf names the same group, so that auditd keeps using it. The command uses the default directory /var/log/audit.

      find /var/log/audit -type f ! -group root ! -group adm -exec chgrp root {} +
      grep -E '^\s*log_group' /etc/audit/auditd.conf
  - id: "CIS-AMAZON2023-5.2.4.3-audit_logfile_group_setting"
    name: "audit logfile group setting: grep log_group /etc/audit/audit* | awk '{ print $NF}'"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.4.3."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep log_group /etc/audit/audit* | awk '{ print $NF}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(adm|root)$" }
    rationale: &rat-004712d53c |
      log_group in auditd.conf sets the group of the audit log files that auditd creates. Setting it to root or a dedicated log group ensures that new and rotated log files are not readable by ordinary users.
    remediation: &rem-651e7832f2 |
      Set log_group in /etc/audit/auditd.conf to root (adm is also accepted), apply it to the existing log files and make auditd re-read its configuration.

      sed -i -E 's/^\s*#?\s*log_group\s*=.*/log_group = root/' /etc/audit/auditd.conf
      grep -q '^log_group' /etc/audit/auditd.conf || echo 'log_group = root' >> /etc/audit/auditd.conf
      find /var/log/audit -type f ! -group root -exec chgrp root {} +
      pkill -HUP -x auditd
  - id: "CIS-AMAZON2023-5.2.4.4-audit_logfile_dir_perms"
    name: "audit logfile dir perms: for dir in `dirname \\`grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'\\``; do …"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.4.4."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      for dir in `dirname \`grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'\``; do stat -Lc " %n_%a" $dir; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_7(0|5)0$" }
    rationale: &rat-00692bf603 |
      The audit log directory holds the audit trail. If other users can enter or list it, or group members can write to it, audit records could be read for reconnaissance or tampered with. Mode 0750 or stricter limits access to root and the audit group.
    remediation: &rem-8ac87c6fbb |
      Set the permissions of the audit log directory (the directory of log_file in /etc/audit/auditd.conf, by default /var/log/audit) to 0750.

      grep '^log_file' /etc/audit/auditd.conf
      chmod 0750 /var/log/audit

      Most variants accept exactly 0700 or 0750, so do not use other modes such as 0710 or 0740.
  - id: "CIS-AMAZON2023-5.2.4.5-audit_conf_perms"
    name: "audit conf perms: for file  in `find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\)`; do stat …"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.4.5."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      for file  in `find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \)`; do stat -Lc " %n_%a" $file; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_6(0|4)0$" }
    rationale: &rat-dfb522cb65 |
      The audit configuration and rule files determine what is recorded. If they are writable by others, an attacker could disable auditing without root privileges; if they are readable by everyone, the gaps in monitoring become visible. A mode of 0640 or stricter prevents both.
    remediation: &rem-892fd1a120 |
      Remove write access for the group and all access for others from the audit configuration and rule files.

      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) -perm /0137 -exec chmod u-x,g-wx,o-rwx {} +
  - id: "CIS-AMAZON2023-5.2.4.6-audit_conf_owner"
    name: "audit conf owner: for file  in `find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\)`; do stat …"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.4.6."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      for file  in `find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \)`; do stat -Lc " %n_%U" $file; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_root$" }
    rationale: &rat-93d20735ce |
      The audit configuration and rule files determine what is recorded. If they are owned by a user other than root, that user can change or disable auditing.
    remediation: &rem-63ddfcf4ba |
      Make root the owner of all audit configuration and rule files.

      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) ! -user root -exec chown root {} +
  - id: "CIS-AMAZON2023-5.2.4.7-audit_conf_group"
    name: "audit conf group: for file  in `find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\)`; do stat …"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.4.7."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      for file  in `find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \)`; do stat -Lc " %n_%U" $file; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_root$" }
    rationale: &rat-6c39b636dc |
      The audit configuration and rule files determine what is recorded. Assigning them to the root group prevents members of other groups from gaining access to them through group permissions.
    remediation: &rem-f8aa9c4a66 |
      Assign all audit configuration and rule files to the root group.

      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) ! -group root -exec chgrp root {} +
  - id: "CIS-AMAZON2023-5.2.4.8-audit_tools_perms"
    name: "audit tools perms: stat -c \"%n_%a\" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.4.8."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      stat -c "%n_%a" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_7(0|5)(0|5)$" }
    rationale: &rat-6e46b7cb2c |
      The audit tools configure the kernel audit rules and read or process the audit trail. If group or other users can modify these binaries, they could be replaced with versions that hide events or disable auditing. They should not be writable by anyone but root.
    remediation: &rem-a3d289ce64 |
      Remove write access for the group and others from the audit tools.

      chmod go-w /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules

      Leave out autrace where it is not installed (for example on Debian 13). Reinstalling the audit package also restores the packaged permissions.
  - id: "CIS-AMAZON2023-5.2.4.9-audit_tools_owner"
    name: "audit tools owner: stat -c \"%n_%U\" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.4.9."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      stat -c "%n_%U" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_root$" }
    rationale: &rat-44ca7d2028 |
      The audit tools configure the kernel audit rules and read or process the audit trail. If they are owned by a user other than root, that user could replace them with manipulated versions.
    remediation: &rem-7da205fc51 |
      Make root the owner of the audit tools.

      chown root /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules

      On Amazon Linux 2027 the tools are located in /usr/bin and autrace is not checked; adjust the paths accordingly.
  - id: "CIS-AMAZON2023-5.2.4.10-audit_tools_group"
    name: "audit tools group: stat -c \"%n_%G\" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.4.10."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      stat -c "%n_%G" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ .*_root$" }
    rationale: &rat-86efb1bef3 |
      The audit tools configure the kernel audit rules and read or process the audit trail. Assigning them to the root group prevents members of other groups from gaining control over them through group permissions.
    remediation: &rem-28ff0445b4 |
      Assign the audit tools to the root group.

      chgrp root /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules

      On Amazon Linux 2027 the tools are located in /usr/bin and autrace is not checked; adjust the paths accordingly.
  - id: "CIS-AMAZON2023-6.1.1-passwd_perms"
    name: "passwd perms: stat -L -c \"%a %U %G\" /etc/passwd"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.1.1."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0,4][0,4] root root" }
    rationale: &rat-a167450576 |
      /etc/passwd lists all accounts and must be readable by everyone for name lookups, but only root may modify it. If others could write to it they could add accounts or change a user ID to 0 and gain root. Owner root, group root and mode 0644 provide this protection.
    remediation: &rem-6caf729613 |
      Set owner, group and permissions of /etc/passwd.

      chown root:root /etc/passwd
      chmod 0644 /etc/passwd
  - id: "CIS-AMAZON2023-6.1.2-passwd_perms_6_1_2"
    name: "passwd perms 6 1 2: stat -L -c \"%a %U %G\" /etc/passwd"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.1.2."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0,4][0,4] root root" }
    rationale: *rat-a167450576
    remediation: *rem-6caf729613
  - id: "CIS-AMAZON2023-6.1.3-passwd-_perms"
    name: "passwd perms: stat -L -c \"%a %U %G\" /etc/passwd-"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.1.3."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/passwd-
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0,4][0,4] root root" }
    rationale: &rat-b4ee6fc5d0 |
      /etc/passwd- is the backup copy of the account database written by tools like useradd and vipw. It holds the same information as /etc/passwd and could be used to restore a manipulated version, so it needs the same protection: owned by root:root and not writable by others.
    remediation: &rem-e0e293ff9d |
      Set owner, group and permissions of /etc/passwd-.

      chown root:root /etc/passwd-
      chmod 0644 /etc/passwd-

      Mode 0600 is accepted as well. The Ubuntu 22.04 and 26.04 variants check /etc/passwd instead; fix it the same way.
  - id: "CIS-AMAZON2023-6.1.4-group_perms"
    name: "group perms: stat -L -c \"%a %U %G\" /etc/group"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.1.4."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/group
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0,4][0,4] root root" }
    rationale: &rat-63d76b0c8d |
      /etc/group defines group memberships, including administrative groups such as wheel. If non-root users could modify it they could add themselves to privileged groups. It must be owned by root:root with mode 0644 so it is readable but protected.
    remediation: &rem-bbf151425e |
      Set owner, group and permissions of /etc/group.

      chown root:root /etc/group
      chmod 0644 /etc/group
  - id: "CIS-AMAZON2023-6.1.5-group-_perms"
    name: "group perms: stat -L -c \"%a %U %G\" /etc/group-"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.1.5."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/group-
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0,4][0,4] root root" }
    rationale: &rat-46fe720062 |
      /etc/group- is the backup of the group database. It contains the same membership information as /etc/group and must be protected the same way, owned by root:root and not writable by others, so it cannot be used to plant manipulated group memberships.
    remediation: &rem-c35567da05 |
      Set owner, group and permissions of /etc/group-.

      chown root:root /etc/group-
      chmod 0644 /etc/group-

      Mode 0600 is accepted as well.
  - id: "CIS-AMAZON2023-6.1.6-shadow_perms"
    name: "shadow perms: stat -L -c \"%a %U %G\" /etc/shadow"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.1.6."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/shadow
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 0 root root" }
    rationale: &rat-1890aeb8b4 |
      /etc/shadow holds the password hashes and aging data of all accounts. Read access allows offline cracking of the hashes, and write access allows setting any password or unlocking accounts. Only root, and on Debian-like and SUSE systems the shadow group, may access it.
    remediation: &rem-5e2fff2c8a |
      Set owner, group and permissions of /etc/shadow.

      chown root:root /etc/shadow
      chmod 0000 /etc/shadow

      Mode 0000 is the distribution default; root can still read and write the file.
  - id: "CIS-AMAZON2023-6.1.7-shadow-_perms"
    name: "shadow perms: stat -L -c \"%a %U %G\" /etc/shadow-"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.1.7."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/shadow-
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 0 root root" }
    rationale: &rat-8b7a9c949b |
      /etc/shadow- is the backup of the shadow file and contains password hashes, often only slightly older than the current ones. It needs the same strict protection as /etc/shadow to prevent offline password cracking.
    remediation: &rem-6b304d3af9 |
      Set owner, group and permissions of /etc/shadow-.

      chown root:root /etc/shadow-
      chmod 0000 /etc/shadow-

      Mode 0000 is the distribution default; root can still read and write the file.
  - id: "CIS-AMAZON2023-6.1.8-gshadow_perms"
    name: "gshadow perms: stat -L -c \"%a %U %G\" /etc/gshadow"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.1.8."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/gshadow
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 0 root root" }
    rationale: &rat-07f61f03b9 |
      /etc/gshadow contains group passwords and the lists of group administrators. Exposure allows cracking group passwords, and modification allows users to grant themselves group membership or administration rights. It must be restricted to root and, where used, the shadow group.
    remediation: &rem-f606d496c5 |
      Set owner, group and permissions of /etc/gshadow.

      chown root:root /etc/gshadow
      chmod 0000 /etc/gshadow

      Mode 0000 is the distribution default; root can still read and write the file.
  - id: "CIS-AMAZON2023-6.1.9-gshadow-_perms"
    name: "gshadow perms: stat -L -c \"%a %U %G\" /etc/gshadow-"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.1.9."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/gshadow-
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 0 root root" }
    rationale: &rat-6f659e3db8 |
      /etc/gshadow- is the backup of the group shadow file and contains the same sensitive group password and administrator information. It needs the same strict ownership and permissions as /etc/gshadow.
    remediation: &rem-ac61f19423 |
      Set owner, group and permissions of /etc/gshadow-.

      chown root:root /etc/gshadow-
      chmod 0000 /etc/gshadow-

      Mode 0000 is the distribution default; root can still read and write the file.
  - id: "CIS-AMAZON2023-6.1.10-rpm_filecheck"
    name: "rpm filecheck: rpm -Va --nomtime --nosize --nomd5 --nolinkto \u003e /tmp/cis_rpmcheck | grep -vw c \u0026\u0026 cat /tm…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.1.10."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    timeout: 60000ms
    run: |
      rpm -Va --nomtime --nosize --nomd5 --nolinkto > /tmp/cis_rpmcheck | grep -vw c && cat /tmp/cis_rpmcheck | wc -l
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ 0" }
    rationale: &rat-9f88d7b65b |
      Comparing installed files against the package database detects changed permissions, ownership or content of system files. Unexpected differences in files that are not configuration files can indicate tampering or a broken installation and should be investigated.
    remediation: &rem-582de1a1a5 |
      Review the package verification output and restore files that differ from the package without a legitimate reason: reset permissions and ownership, or reinstall the package if the content has changed.

      rpm -Va --nomtime --nosize --nomd5 --nolinkto | grep -vw c
      rpm -qf FILE
      rpm --setperms PACKAGE
      rpm --setugids PACKAGE
      yum reinstall PACKAGE

      Use dnf instead of yum on Amazon Linux 2023.
  - id: "CIS-AMAZON2023-6.1.11-world_writable"
    name: "world writable: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -perm -0002"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.1.11."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -perm -0002
    allow_rc: any
    expect:
      - { rc: "in [0, 123]" }
      - { none: "~ ." }
    rationale: &rat-9f0a5a248e |
      Files and directories that everyone can write to allow any user to alter data, plant malicious content or replace files that others rely on. World-writable directories without the sticky bit additionally let users delete or rename other users' files. Such permissions should be removed or justified.
    remediation: &rem-9b39034669 |
      Review each file and directory listed by the check. Remove world write access where it is not required, and set the sticky bit on directories that must stay world-writable so that users cannot delete each other's files.

      ls -ld PATH
      chmod o-w FILE
      chmod +t DIRECTORY

      Shared directories such as /tmp and /var/tmp need mode 1777; clarify with the owning application before changing other files.
  - id: "CIS-AMAZON2023-6.1.12-unowned"
    name: "unowned: df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nouser -nogr…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.1.12."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nouser -nogroup
    allow_rc: any
    expect:
      - { rc: "in [0, 123]" }
      - { none: "~ ." }
    rationale: &rat-79b3e6f000 |
      Files without a valid owning user or group usually remain after an account was deleted. If a new account later receives the same UID or GID, it silently inherits those files and their data. Unowned files also hint at unpackaged software or tampering and should be reviewed.
    remediation: &rem-428f0b1787 |
      Review each listed file or directory and assign it to a valid user and group, or remove it once it is confirmed to be unneeded.

      ls -ld FILE
      chown USER:GROUP FILE

      Do not delete anything before checking what it is and whether it holds data still in use.
  - id: "CIS-AMAZON2023-6.1.13-sgid_executables"
    name: "sgid executables: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.1.13."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -2000
    allow_rc: any
    expect:
      - { rc: "in [0, 123]" }
      - { none: "~ ." }
    rationale: &rat-639403665a |
      Programs with the SGID bit run with the privileges of their group, so a vulnerable or planted SGID binary can be used to gain those group privileges. Knowing exactly which SGID files exist makes unexpected additions stand out, and removing the bit where it is not needed reduces escalation paths.
    remediation: &rem-75ef1a4a01 |
      Review each listed SGID file: confirm that it belongs to an installed package and that the SGID bit is needed, and remove the bit where it is not.

      rpm -qf FILE
      rpm -Vf FILE
      chmod g-s FILE

      The check lists every SGID file, including legitimate ones shipped by the distribution, so it usually cannot pass on a standard installation; removing the bit from such files can break them.
  - id: "CIS-AMAZON2023-6.1.13-suid_executables"
    name: "suid executables: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.1.13."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -4000
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-e06547f452 |
      Programs with the SUID bit run with the privileges of their owner, usually root, and are a classic route to privilege escalation if vulnerable or planted by an attacker. Reviewing the list of SUID files reveals unexpected additions, and removing the bit where it is not needed reduces the attack surface.
    remediation: &rem-47fe2a5feb |
      Review each listed SUID file: confirm that it belongs to an installed package and that the SUID bit is needed, and remove the bit where it is not.

      rpm -qf FILE
      rpm -Vf FILE
      chmod u-s FILE

      The check lists every SUID file, including essential ones such as passwd, su, sudo or mount, so it usually cannot pass on a standard installation; removing the bit from those breaks them.
  - id: "CIS-AMAZON2023-6.2.1-accts_passwds-attrs"
    name: "/etc/passwd: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.1."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/passwd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ef8dde0dca |
      Password hashes stored directly in /etc/passwd are readable by every user and can be cracked offline. All accounts should use shadowed passwords, marked by an x in the password field of /etc/passwd, with the actual hashes kept in the protected /etc/shadow file.
    remediation: &rem-88dbdb7375 |
      Create /etc/passwd.
  - id: "CIS-AMAZON2023-6.2.1-accts_passwds-content"
    name: "/etc/passwd has the expected content (2 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.1."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/passwd'
    allow_rc: any
    expect:
      - { some: "~ ^.*:x:*" }
      - { none: "~ /\\^\\.\\*:\\[a-w\\]\\[y-z\\]:\\.\\*" }
    rationale: *rat-ef8dde0dca
    remediation: &rem-cd4dbdb5d2 |
      Edit /etc/passwd so that its lines meet these conditions (regular expressions):

      - a line matches ^.*:x:*
      - no line matches /\^\.\*:\[a-w\]\[y-z\]:\.\*
  - id: "CIS-AMAZON2023-6.2.2-shadow_empty_passwd-attrs"
    name: "/etc/shadow: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.2."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/shadow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d4705e8ea7 |
      In /etc/shadow, a password field of !! marks an account that never received a password. Such accounts should be reviewed: interactive accounts need a proper password or should be locked deliberately, so that their state is intentional and documented rather than a leftover of account creation.
    remediation: &rem-098e77832a |
      Create /etc/shadow.
  - id: "CIS-AMAZON2023-6.2.2-shadow_empty_passwd-content"
    name: "/etc/shadow has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.2."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/shadow'
    allow_rc: any
    expect: { none: "~ ^.*:\\!\\!:.*" }
    rationale: *rat-d4705e8ea7
    remediation: &rem-8b9ddeb1f0 |
      Edit /etc/shadow so that its lines meet these conditions (regular expressions):

      - no line matches ^.*:\!\!:.*
  - id: "CIS-AMAZON2023-6.2.3-passwd_group_exist"
    name: "passwd group exist: pwck -r | grep 'no group' | awk '{ gsub(\"[:\\47]\",\"\"); print $2}'"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.3."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      pwck -r | grep 'no group' | awk '{ gsub("[:\47]",""); print $2}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-a6fe2c7421 |
      Every primary group referenced in /etc/passwd should exist in /etc/group. Undefined group IDs usually result from manual edits or deleted groups; if the ID is reused later, the new group's members gain access to the affected users' files.
    remediation: &rem-ac0bde3f41 |
      For every user reported by the check, create the missing group with the referenced GID or assign the user an existing primary group.

      grpck -r
      groupadd -g GID GROUP
      usermod -g GROUP USER

      Changing the primary group does not change the ownership of existing files; adjust them if necessary.
  - id: "CIS-AMAZON2023-6.2.4-no_dup_uid"
    name: "no dup uid: cat /etc/passwd | cut -d: -f3 | uniq -d"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.4."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat /etc/passwd | cut -d: -f3 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-92a5e740a2 |
      The kernel identifies users by UID, not by name. Several accounts with the same UID share all file ownerships and privileges and cannot be told apart in logs, which undermines accountability.
    remediation: &rem-3997dd9dfb |
      Review every duplicate UID reported by the check, give each account its own UID and assign the files of the former shared UID deliberately.

      awk -F: '($3 == UID) {print $1}' /etc/passwd
      usermod -u NEWUID USER
      find / -xdev -user UID -ls

      usermod adjusts only the home directory; other files owned by the old UID stay with the account that keeps it.
  - id: "CIS-AMAZON2023-6.2.5-no_dup_gid"
    name: "no dup gid: cat /etc/group | cut -d: -f3 | uniq -d"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.5."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat /etc/group | cut -d: -f3 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-1c1a4afdb8 |
      Groups are identified by GID. Several groups with the same GID share all group permissions, so membership in one silently grants the access rights of the other.
    remediation: &rem-6a315abc33 |
      Review every duplicate GID reported by the check, give each group its own GID and assign the files of the former shared GID deliberately.

      awk -F: '($3 == GID) {print $1}' /etc/group
      groupmod -g NEWGID GROUP
      find / -xdev -group GID -ls

      Files owned by the old GID are not changed automatically; adjust them where they belong to the renumbered group.
  - id: "CIS-AMAZON2023-6.2.6-no_dup_username"
    name: "no dup username: cat /etc/passwd | cut -d: -f1 | uniq -d"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.6."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      cat /etc/passwd | cut -d: -f1 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-48bf65be3b |
      Duplicate user names in /etc/passwd make it unpredictable which entry is used for login and which UID a name resolves to. This can lead to wrong file ownership and confusing audit trails.
    remediation: &rem-e93b096dcd |
      Review the duplicate entries for every user name reported by the check and remove or rename the surplus entry in /etc/passwd and /etc/shadow with the locking editors.

      grep -n '^USER:' /etc/passwd
      pwck -r
      vipw
      vipw -s
  - id: "CIS-AMAZON2023-6.2.7-no_dup_groupname"
    name: "no dup groupname: cat /etc/group | cut -d: -f1 | uniq -d"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.7."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat /etc/group | cut -d: -f1 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-5dd470fed7 |
      Duplicate group names in /etc/group make it unpredictable which GID a group name resolves to. This can lead to wrong access rights when files or memberships are assigned by name.
    remediation: &rem-c9a5680ce7 |
      Review the duplicate entries for every group name reported by the check and remove or rename the surplus entry in /etc/group and /etc/gshadow with the locking editors.

      grep -n '^GROUP:' /etc/group
      grpck -r
      vigr
      vigr -s
  - id: "CIS-AMAZON2023-6.2.8-root_path_check"
    name: "root path check: /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.8."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e 's/:/\n/g'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ \\\\." }
    rationale: &rat-ee503b897e |
      If root's PATH contains the current directory, empty entries, relative paths or directories that other users can write to, a malicious program placed there can be executed with root privileges when an administrator types a common command name. Root's PATH should contain only absolute, root-owned and non-writable directories.
    remediation: &rem-0afab9f1f3 |
      Remove the current directory (.), empty entries (leading, trailing or double colons), relative paths and non-existent directories from root's PATH, and make sure every remaining directory is owned by root and not writable by group or others. Look for PATH assignments in root's and the system-wide shell startup files.

      su - root -c 'echo "$PATH"'
      grep -sn 'PATH' /root/.bash_profile /root/.bashrc /root/.profile /etc/profile /etc/bashrc /etc/bash.bashrc /etc/environment /etc/profile.d/*.sh
      chown root DIRECTORY
      chmod go-w DIRECTORY
  - id: "CIS-AMAZON2023-6.2.9-uid_0_check"
    name: "uid 0 check: awk -F: '($3 == 0) { print $1 }' /etc/passwd"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.9."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      awk -F: '($3 == 0) { print $1 }' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root" }
    rationale: &rat-90d4d66c1b |
      Any account with UID 0 has full root privileges, regardless of its name. Additional UID 0 accounts are a classic backdoor and make it impossible to attribute administrative actions; only root should have UID 0.
    remediation: &rem-5c4a8fc9e4 |
      Make sure that only root has UID 0. Find out what every other UID 0 account is used for, then give it a unique non-zero UID with vipw or remove it.

      awk -F: '($3 == 0) {print $1}' /etc/passwd
      vipw
      userdel USER

      usermod -u cannot be used here because the running root processes share UID 0. Also make sure that root itself has UID 0.
  - id: "CIS-AMAZON2023-6.2.10-home_dirs_exist"
    name: "home dirs exist: set -o pipefail; pwck -r | grep -P \"^user '(?P\u003cuser\u003e.*)': directory '(?P\u003cdir\u003e.*)' does no…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.10."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      set -o pipefail; pwck -r | grep -P "^user '(?P<user>.*)': directory '(?P<dir>.*)' does not exist$"
    allow_rc: any
    expect:
      - { rc: "== 2" }
      - { none: "~ ." }
    rationale: &rat-93950236f2 |
      An account whose home directory does not exist gets / as its working directory at login, and some programs then try to create files in unexpected places. Missing home directories also indicate stale accounts. Every account, and in particular every interactive one, should have an existing home directory.
    remediation: &rem-16e7619e2c |
      Create the missing home directory for every account listed by the check with the correct owner and mode, or point the account to an existing directory if it does not need its own home. On several platforms the check also lists system accounts; for those, review whether the account is still needed and prefer usermod -d to an existing directory over creating new directories.

      mkdir -p HOMEDIR
      chown USER: HOMEDIR
      chmod 750 HOMEDIR
      usermod -d EXISTINGDIR USER

      On RHEL 7 the check also requires that home directories of users with UID 1000 to 60000 have mode 750 or 700. On Ubuntu 18.04 every finding of pwck -r fails the check, not only missing home directories.
  - id: "CIS-AMAZON2023-6.2.10-home_dirs_owned"
    name: "home dirs owned: getent passwd {1000..60000} |  awk -F: '{ print $1  \" \"  $6 }' | while read user dir; do …"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.10."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      getent passwd {1000..60000} |  awk -F: '{ print $1  " "  $6 }' | while read user dir; do if [ $user != 'ftpd' ]; then owner=$(stat -L -c "%U" "$dir"); if [ "$owner" != "$user" ]; then echo "home dir for $user owned by $owner"; fi; fi; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-d265418053 |
      A user should own their home directory. If another account owns it, that account controls the user's files, startup scripts and SSH keys and can manipulate them to run code as the user.
    remediation: &rem-9804bc2d06 |
      Make each listed user the owner of their home directory after confirming that the directory really belongs to that user.

      ls -ld HOMEDIR
      chown USER HOMEDIR
  - id: "CIS-AMAZON2023-6.2.10-home_dirs_perms"
    name: "home dirs perms: for i in `getent passwd {1000..60000} |  awk '{split($0,a,\":\");print a[6]}'`; do stat -c …"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.10."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      for i in `getent passwd {1000..60000} |  awk '{split($0,a,":");print a[6]}'`; do stat -c "%a %n" $i ; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 7[0,5]0\\s" }
    rationale: &rat-f821d3f770 |
      Home directories hold users' private files, SSH keys and shell startup scripts. If other users can write to them they can plant malicious startup files or keys, and if they can read them they can access private data. Mode 0750 or stricter keeps home directories under their owner's control.
    remediation: &rem-128a5149ae |
      Set the home directory of each local user (UID 1000-60000) to mode 0750 or 0700.

      getent passwd | awk -F: '$3 >= 1000 && $3 <= 60000 { print $1, $6 }'
      chmod 0750 HOME

      Review shared or service home directories before changing them.
  - id: "CIS-AMAZON2023-6.2.11-dot_file_perms"
    name: "dot file perms: find /home/ -name \"\\.*\" -perm /g+w,o+w"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.11."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      awk -F: '($3>=1000)&&($7 !~ /(nologin|false)$/){print $6}' /etc/passwd | while read -r d; do
        if [ -d "$d" ]; then find "$d" -xdev -name "\.*" -perm /g+w,o+w 2>/dev/null || true; fi
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-b99f900519 |
      Files such as .bashrc, .profile or .ssh are executed or trusted when the user logs in. If group or other users can write to them, they can insert commands that run with the victim's privileges at the next login.
    remediation: &rem-2ca3c0e9f1 |
      Remove write access for group and others from each dot file or directory listed by the check, after confirming that it is not intentionally shared.

      ls -ld FILE
      chmod go-w FILE
  - id: "CIS-AMAZON2023-6.2.11-dot_files_exist"
    name: "dot files exist: find /home/ -name .forward -name .netrc -name .rhosts"
    description: "CIS Amazon Linux 2023 benchmark recommendation 6.2.11."
    tags: [cis, cis-amazon2023, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      awk -F: '($3>=1000)&&($7 !~ /(nologin|false)$/){print $6}' /etc/passwd | while read -r d; do
        if [ -d "$d" ]; then find "$d" -xdev -name .forward -name .netrc -name .rhosts 2>/dev/null || true; fi
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-ba97234fe4 |
      .rhosts files grant password-less access based on host trust, .netrc files often contain plain-text credentials for FTP and other services, and .forward files can redirect a user's mail or run programs on mail delivery. Their presence in home directories weakens authentication and can leak data, so they should be reviewed and removed.
    remediation: &rem-9cdce6c741 |
      Find .forward, .netrc and .rhosts files in users' home directories, review them with their owners, and remove those that are not needed.

      find /home/ \( -name .forward -o -name .netrc -o -name .rhosts \) -type f
      rm FILE

      Change any credentials found in .netrc files.
