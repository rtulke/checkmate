name: CIS Amazon Linux 2023
version: "1.0.0"
description: >
  Automated checks for 232 recommendations of the CIS Amazon Linux 2023 benchmark
  (version 1.0.0), converted from the goss audit content of the
  ansible-lockdown project. Check names describe what is verified; the
  recommendation number is in the ID and the description. Select profiles
  with tags, e.g. `--tags cis-level-1+cis-server`.

defaults:
  when: "facts.distro == \"amzn\" and facts.version_major == 2023"
  timeout: 120s

checks:
  - id: "CIS-AMAZON2023-1.1.1.1-blacklist_squashfs-attrs"
    name: "/etc/modprobe.d/blacklist.conf: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.1.1.1."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    only_if: "modinfo squashfs \u003e/dev/null 2\u003e\u00261"
    run: |
      f='/etc/modprobe.d/blacklist.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-7adfb527a0 |
      squashfs is a compressed read-only file system driver. File system drivers parse untrusted on-disk structures inside the kernel, so a crafted image on a USB stick or a mounted file can trigger driver bugs. A blacklist entry stops the module from being loaded automatically when such media appears, which shrinks the kernel attack surface. It is required by snap packages on Ubuntu and by some live or appliance images, so check for such use before disabling it.
    remediation: &rem-388bd29af8 |
      Create /etc/modprobe.d/blacklist.conf.
  - id: "CIS-AMAZON2023-1.1.1.1-blacklist_squashfs-content"
    name: "/etc/modprobe.d/blacklist.conf has the expected content (1 rule)"
