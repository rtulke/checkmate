      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-fa08e872ce |
      MaxStartups limits the number of concurrent unauthenticated SSH connections and starts dropping new ones randomly beyond a threshold. This protects sshd from resource exhaustion by connection floods while keeping the service available for legitimate logins.
    remediation: *rem-f6392187bb
  - id: "CIS-AMAZON2023-4.2.17-sshd_config_maxstartups-content"
