      The noexec option prevents binaries from being executed directly from /dev/shm. Attackers often drop and run tools in writable locations, so this makes exploitation harder, although scripts can still be run through an interpreter. Applications rarely need to execute code from shared memory, so the option is usually safe.
    remediation: &rem-c5e0a0acc2 |
      Mount /dev/shm with the option noexec: add it to the options of /dev/shm in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/dev/shm'

      If /dev/shm is not a separate file system yet, create one first.
  - id: "CIS-AMAZON2023-1.1.8.4-dev_shm_nosuid_opts"
    name: "/dev/shm is a separate mount with nosuid"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.1.8.4."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/dev/shm'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nosuid(,|$)"
    rationale: &rat-cc27e5b118 |
      The nosuid option makes the kernel ignore setuid and setgid bits on /dev/shm. This prevents a user from planting a privileged binary there, for example from removable media or a restored archive, and using it to escalate privileges. /dev/shm does not need to contain setuid programs.
    remediation: &rem-e2662eb988 |
      Mount /dev/shm with the option nosuid: add it to the options of /dev/shm in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/dev/shm'

      If /dev/shm is not a separate file system yet, create one first.
  - id: "CIS-AMAZON2023-1.1.9-blacklist_usb-attrs"
    name: "/etc/modprobe.d/blacklist.conf: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.1.9."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "modinfo usb-storage \u003e/dev/null 2\u003e\u00261"
    run: |
      f='/etc/modprobe.d/blacklist.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d10363579d |
      USB mass storage support lets anyone with physical access attach drives, which can be used to copy data off the system or to introduce malware, and it exposes the kernel's USB and file system code to crafted devices. Blacklisting usb-storage prevents the module from loading automatically when a device is plugged in. Systems that rely on USB disks for backups or installation media need an exception.
    remediation: *rem-388bd29af8
  - id: "CIS-AMAZON2023-1.1.9-blacklist_usb-content"
    name: "/etc/modprobe.d/blacklist.conf has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.1.9."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "modinfo usb-storage \u003e/dev/null 2\u003e\u00261"
    run: |
      cat '/etc/modprobe.d/blacklist.conf'
    allow_rc: any
    expect: { some: "~ ^blacklist usb-storage" }
    rationale: *rat-d10363579d
    remediation: &rem-0bbf1d4354 |
      Edit /etc/modprobe.d/blacklist.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^blacklist usb-storage
  - id: "CIS-AMAZON2023-1.1.9-usb-storage"
    name: "usb storage: modprobe -n -v usb-storage | grep -E '(usb-storage|install)'"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.1.9."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      modprobe -n -v usb-storage | grep -E '(usb-storage|install)'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /(usr/)?bin/(true|false)" }
    rationale: &rat-3d7871778f |
      USB mass storage support allows data to be copied off the system or malicious content to be introduced by anyone with physical access, and it exposes kernel driver code to crafted devices. Mapping usb-storage to /bin/false makes all load attempts fail, so USB drives cannot be mounted. Keep it enabled only where USB storage is an approved part of operations.
    remediation: &rem-977ef3e2a6 |
      Make every attempt to load usb-storage run /bin/false instead, blacklist it, and unload it if it is currently loaded.

      printf '%s\n' 'install usb-storage /bin/false' 'blacklist usb-storage' > /etc/modprobe.d/usb-storage.conf
      modprobe -r usb-storage

      Use /bin/false rather than /usr/bin/false: the SUSE checks only accept that path. If the module is in use, unmount the file system first or reboot.
  - id: "CIS-AMAZON2023-1.2.1-gpg_keys"
    name: "gpg keys: rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --\u003e %{summary}"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.2.1."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --> %{summary}
      '
    expect: { rc: "== 0" }
    rationale: &rat-4781e33879 |
      Package signatures are only meaningful if the keys used to verify them are the right ones. An unexpected or attacker-supplied key in the package manager's keyring lets packages signed with it install without warning. Reviewing the imported keys ensures that only vendor and approved repository keys are trusted.
    remediation: &rem-e2da82e641 |
      Import the distribution vendor's package signing key and remove any key that does not belong to an approved repository. List the installed keys first.

      rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --> %{summary}\n'
      rpm --import /etc/pki/rpm-gpg/KEYFILE
      rpm -e gpg-pubkey-VERSION-RELEASE

      The vendor keys ship in /etc/pki/rpm-gpg/, for example RPM-GPG-KEY-redhat-release on RHEL, RPM-GPG-KEY-amazon-linux-2 on Amazon Linux 2 and RPM-GPG-KEY-amazon-linux-2023 on Amazon Linux 2023. On Amazon Linux 2027 the check expects the Amazon Linux key with the fingerprint 37ce7c3833e5a33c4a1e4b0d5408eaa4b1e92e3d.
  - id: "CIS-AMAZON2023-1.2.2-gpg_check_global"
    name: "gpg check global: if [ `grep -c -E '^\\s*gpgcheck.*0' /etc/yum.conf` -ge 1 ]; then echo FAIL; elif [ `grep -…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.2.2."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      if [ `grep -c -E '^\s*gpgcheck.*0' /etc/yum.conf` -ge 1 ]; then echo FAIL; elif [ `grep -c -E '^\s*gpgcheck.*1' /etc/yum.conf` -ge 1 ]; then echo Passed_Check;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ FAIL" }
    rationale: &rat-b9d4a35c8e |
      Package signature verification ensures that only packages signed by a trusted vendor key are installed. With gpgcheck disabled, a compromised mirror, a man-in-the-middle on the download path or a tampered local file could deliver modified packages that run code as root during installation. Enabling it globally covers every repository that does not explicitly override it.
    remediation: &rem-fd953dd28c |
      Enable package signature checking in the [main] section of the package manager configuration and remove any gpgcheck=0 setting.

      sed -i --follow-symlinks 's/^\s*gpgcheck\s*=.*/gpgcheck=1/' /etc/dnf/dnf.conf
      grep -q '^\s*gpgcheck' /etc/dnf/dnf.conf || sed -i --follow-symlinks '/^\[main\]/a gpgcheck=1' /etc/dnf/dnf.conf

      On RHEL 7 and Amazon Linux 2023 the check reads /etc/yum.conf: run the same commands on that file (on Amazon Linux 2023 it normally links to /etc/dnf/dnf.conf).
  - id: "CIS-AMAZON2023-1.2.2-gpg_check_repo"
    name: "gpg check repo: if [ `grep -c -E '^\\s*gpgcheck.*0' /etc/yum.repos.d/*.repo` -ge 1 ]; then echo FAIL; elif…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.2.2."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      if [ `grep -c -E '^\s*gpgcheck.*0' /etc/yum.repos.d/*.repo` -ge 1 ]; then echo FAIL; elif [ `grep -c -E '^\s*gpgcheck.*1' /etc/yum.repos.d/*.repo` -ge 1 ]; then echo Passed_Check;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ FAIL" }
    rationale: &rat-b0f4f69ff9 |
      A repository definition can override the global setting and turn signature checking off for its packages. Any repository with gpgcheck disabled lets unsigned or tampered packages be installed silently, so signature checking needs to stay enabled for every configured repository.
    remediation: &rem-4675487d5a |
      Enable package signature checking in every repository definition: find the repositories that disable it and set gpgcheck=1 in each listed FILE.

      grep -RniwE '(pkg_)?gpgcheck\s*=\s*(0|false|no)' /etc/yum.repos.d/ /etc/distro.repos.d/ /etc/dnf/repos.override.d/ 2>/dev/null
      sed -i -E 's/^(\s*)(pkg_)?gpgcheck\s*=\s*(0|false|no)\b/\1\2gpgcheck=1/I' FILE

      Amazon Linux 2 also flags commented-out gpgcheck=0 lines; delete those too. Make sure the repository's signing key (gpgkey=) is available, otherwise installations from it fail.
  - id: "CIS-AMAZON2023-1.2.3-repos_configured"
    name: "repos configured: yum repolist"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.2.3."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      yum repolist
    expect: { rc: "== 0" }
    rationale: &rat-70d1c99f9e |
      Systems should get packages and security fixes only from known, approved repositories. A missing or broken repository configuration prevents patching, while unknown repositories can introduce untrusted software. Depending on the platform the check verifies that the repository list can be read, that expected repositories are present, or asks for a manual review.
    remediation: &rem-f181846f51 |
      Make sure the system has working repositories from approved sources so that the repository listing succeeds. Review the configured repositories, enable the required ones and fix errors such as unreachable mirrors, proxy settings or a missing subscription.

      dnf repolist all
      dnf config-manager --set-enabled REPO
      subscription-manager register

      On RHEL 7 and Amazon Linux 2 use yum repolist all and yum-config-manager --enable REPO; subscription-manager is only used on RHEL. On Amazon Linux 2 the check expects the amzn2-core and amzn2extra-docker repositories (amazon-linux-extras enable docker). On RHEL 8 it expects the BaseOS and AppStream repositories.
  - id: "CIS-AMAZON2023-1.2.4-repo_gpg_check_global"
    name: "repo gpg check global: if [ `grep -c -E '^\\s*repo_gpgcheck.*0' /etc/dnf/dnf.conf` -ge 1 ]; then echo FAIL; elif …"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.2.4."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      if [ `grep -c -E '^\s*repo_gpgcheck.*0' /etc/dnf/dnf.conf` -ge 1 ]; then echo FAIL; elif [ `grep -c -E '^\s*repo_gpgcheck.*1' /etc/dnf/dnf.conf` -ge 1 ]; then echo Passed_Check;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ FAIL" }
    rationale: &rat-82a2c24f8b |
      repo_gpgcheck makes the package manager verify the GPG signature of repository metadata, not only of individual packages. This protects against tampered or replayed metadata that could, for example, withhold security updates or point to different packages. It only works when every enabled repository publishes signed metadata.
    remediation: &rem-f311940b16 |
      Enable metadata signature checking in the [main] section of /etc/dnf/dnf.conf and remove any repo_gpgcheck=0 setting there.

      sed -i 's/^\s*repo_gpgcheck\s*=.*/repo_gpgcheck=1/' /etc/dnf/dnf.conf
      grep -q '^\s*repo_gpgcheck' /etc/dnf/dnf.conf || sed -i '/^\[main\]/a repo_gpgcheck=1' /etc/dnf/dnf.conf
      dnf makecache

      If a repository does not provide signed metadata, dnf will refuse to use it; set repo_gpgcheck=0 only in that repository's own definition after assessing the risk.
  - id: "CIS-AMAZON2023-1.2.4-repo_gpg_check_repo"
    name: "repo gpg check repo: if [ `grep -c -E '^\\s*repo_gpgcheck.*0' /etc/yum.repos.d/*.repo` -ge 1 ]; then echo FAIL;…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.2.4."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      if [ `grep -c -E '^\s*repo_gpgcheck.*0' /etc/yum.repos.d/*.repo` -ge 1 ]; then echo FAIL; elif [ `grep -c -E '^\s*repo_gpgcheck.*1' /etc/yum.repos.d/*.repo` -ge 1 ]; then echo Passed_Check;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ FAIL" }
    rationale: &rat-b860f4a62f |
      Individual repository definitions can override the global setting and disable verification of signed repository metadata. A repository with repo_gpgcheck=0 accepts unsigned or tampered metadata, which can be used to hide updates or substitute packages. Checking each repository file closes that gap.
    remediation: &rem-985b20c78b |
      Find repository definitions that disable metadata signature checking and enable it for them.

      grep -n '^\s*repo_gpgcheck\s*=\s*0' /etc/yum.repos.d/*.repo
      sed -i 's/^\s*repo_gpgcheck\s*=\s*0/repo_gpgcheck=1/' /etc/yum.repos.d/*.repo
      dnf makecache

      Only enable it for repositories that publish signed metadata; otherwise dnf can no longer use them.
  - id: "CIS-AMAZON2023-1.3.1-aide"
    name: "Package aide is installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.3.1."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet aide
    expect: true
    rationale: &rat-24b82fc810 |
      AIDE is a file integrity checker that records a baseline of files and later reports changes. It detects unauthorised modifications of binaries and configuration files that could indicate a compromise.
    remediation: &rem-ddff504fa6 |
      Install the package aide:

      dnf install aide
  - id: "CIS-AMAZON2023-1.3.2-aide_cron"
    name: "aide cron: grep -rs aide /etc/cron.* /etc/crontab /var/spool/cron/*"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.3.2."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -rs aide /etc/cron.* /etc/crontab /var/spool/cron/*
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { none: "~ ^#" }
    rationale: &rat-86b8cfeaea |
      A file integrity baseline is only useful if it is compared regularly. Scheduling AIDE checks ensures that unexpected changes to system files are reported automatically instead of remaining unnoticed until someone runs the check by hand.
    remediation: &rem-586580ed0b |
      Schedule a regular AIDE check with cron, for example daily in /etc/cron.d, after the AIDE database has been initialised (aide --init and moving aide.db.new.gz to aide.db.gz).

      echo '0 5 * * * root /usr/sbin/aide --check' > /etc/cron.d/aide
      chmod 0644 /etc/cron.d/aide

      A systemd timer would work as well, but this check only looks at cron files.
  - id: "CIS-AMAZON2023-1.3.3-audit_bins_crypto_aide"
    name: "audit bins crypto aide: grep /sbin/au /etc/aide.conf"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.3.3."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep /sbin/au /etc/aide.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ /sbin/auditctl p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/auditd p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/ausearch p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/aureport p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/autrace p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
      - { some: "~ /sbin/augenrules p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512" }
    rationale: &rat-362fec1225 |
      The audit tools (auditctl, auditd, ausearch, aureport, augenrules and related binaries) control and read the audit trail. An attacker who replaces them could hide activity or silently disable auditing. Including them in the AIDE database with permission, ownership, ACL, extended attribute and SHA-512 checks makes any modification of these binaries detectable.
    remediation: &rem-87c2bcf979 |
      Add AIDE rules for the audit tools to /etc/aide.conf, then rebuild the AIDE database so it includes them.

      cat >> /etc/aide.conf <<'EOF'
      /usr/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512
      EOF
      aide --init
      mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz

      On Amazon Linux 2027 the check expects /usr/bin/ paths (auditctl, auditd, ausearch, aureport, augenrules) with nothing after sha512 on the line; use those paths there.
  - id: "CIS-AMAZON2023-1.4.1-boot_grub2_grub.cfg-attrs"
    name: "/boot/grub2/grub.cfg: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.4.1."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/boot/grub2/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-841f0e4891 |
      The GRUB configuration contains the kernel command line and, if set, the boot loader password hash. If other users can read or modify it they can learn boot parameters, attack the password hash offline or add options that disable security features such as SELinux or auditing on the next boot. Restricting it to root prevents this.
    remediation: &rem-9e6da05721 |
      Create /boot/grub2/grub.cfg if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/boot/grub2/grub.cfg'
      chmod u-xs,g-rwxs,o-rwx,a-t '/boot/grub2/grub.cfg'
  - id: "CIS-AMAZON2023-1.5.1-kernel.randomize_va_space"
    name: "Kernel parameter kernel.randomize_va_space is 2"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.5.1."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sysctl -n kernel.randomize_va_space
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 2"
    rationale: &rat-5597c48019 |
      Address space layout randomization places the stack, heap, shared libraries and other memory regions at random addresses. This makes memory corruption exploits much harder because an attacker cannot predict where code or data is located. The value 2 enables full randomization, including the heap.
    remediation: &rem-a6e5efe9f8 |
      Set the kernel parameter kernel.randomize_va_space to 2, now and at boot:

      sysctl -w 'kernel.randomize_va_space=2'
      printf '%s\n' 'kernel.randomize_va_space = 2' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.randomize_va_space from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-AMAZON2023-1.5.1-aslr_enabled_2"
    name: "aslr enabled 2: grep \"kernel\\.randomize_va_space\" /etc/sysctl.conf /etc/sysctl.d/* | cut -d \":\" -f2"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.5.1."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep "kernel\.randomize_va_space" /etc/sysctl.conf /etc/sysctl.d/* | cut -d ":" -f2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^kernel.randomize_va_space(| )=(| )2" }
    rationale: &rat-2872b53691 |
      Address space layout randomization places the stack, heap, shared libraries and other memory regions at random addresses, which makes memory corruption exploits much harder. The value 2 enables full randomization. Setting it in a sysctl configuration file ensures it is applied at every boot and not only at runtime.
    remediation: &rem-b364909f96 |
      Set kernel.randomize_va_space to 2 in a sysctl configuration file so it is applied at every boot, and apply it now. Write the line without spaces around the equals sign; some of the checks require that.

      printf '%s\n' 'kernel.randomize_va_space=2' > /etc/sysctl.d/60-kernel_sysctl.conf
      sysctl -w kernel.randomize_va_space=2

      Remove or correct any other kernel.randomize_va_space line in /etc/sysctl.conf and /etc/sysctl.d/.
  - id: "CIS-AMAZON2023-1.5.2-kernel.yama.ptrace_scope"
    name: "Kernel parameter kernel.yama.ptrace_scope is 1"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.5.2."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sysctl -n kernel.yama.ptrace_scope
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-87e99a2286 |
      ptrace lets one process inspect and modify the memory of another. With unrestricted ptrace, any process running as a user can attach to that user's other processes, for example to steal SSH agent keys, session tokens or passwords from a browser after compromising a single program. Yama mode 1 limits ptrace to direct descendants (plus explicit exceptions), which blocks this lateral access while keeping debuggers usable.
    remediation: &rem-1ac1532a42 |
      Set the kernel parameter kernel.yama.ptrace_scope to 1, now and at boot:

      sysctl -w 'kernel.yama.ptrace_scope=1'
      printf '%s\n' 'kernel.yama.ptrace_scope = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.yama.ptrace_scope from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-AMAZON2023-1.5.2-ptrace_scope"
    name: "ptrace scope: grep \"kernel\\.yama\\.ptrace_scope\" /etc/sysctl.conf /etc/sysctl.d/* | cut -d \":\" -f2"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.5.2."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep "kernel\.yama\.ptrace_scope" /etc/sysctl.conf /etc/sysctl.d/* | cut -d ":" -f2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^kernel.yama.ptrace_scope(\\s|)=(\\s|)1" }
    rationale: &rat-31167829c6 |
      ptrace lets one process inspect and modify the memory of another. Unrestricted, any process can attach to all other processes of the same user, so one compromised program can read secrets such as passwords or agent keys from others. With Yama scope 1 only a parent may trace its descendants; non-root debuggers can then no longer attach to arbitrary running processes.
    remediation: &rem-129faf0e1c |
      Set kernel.yama.ptrace_scope to 1 in a sysctl configuration file so it is applied at every boot, and set it for the running kernel.

      printf '%s\n' 'kernel.yama.ptrace_scope = 1' > /etc/sysctl.d/60-ptrace.conf
      sysctl -w kernel.yama.ptrace_scope=1

      Remove other kernel.yama.ptrace_scope lines from /etc/sysctl.conf and /etc/sysctl.d/; the file read last wins. Non-root users can then no longer attach debuggers such as gdb or strace to processes they did not start.
  - id: "CIS-AMAZON2023-1.5.3-coredump_storage-attrs"
    name: "/etc/systemd/coredump.conf: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.5.3."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/systemd/coredump.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1b3c070ac8 |
      Core dumps contain the memory of the crashed process, which can include passwords, keys and other sensitive data, and they can consume a lot of disk space. Setting Storage=none in systemd-coredump stops dumps from being written to disk while crashes are still logged. Developers who need dumps for debugging can enable them temporarily.
    remediation: &rem-38adbe4ae3 |
      Create /etc/systemd/coredump.conf.
  - id: "CIS-AMAZON2023-1.5.3-coredump_storage-content"
    name: "/etc/systemd/coredump.conf has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.5.3."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/systemd/coredump.conf'
    allow_rc: any
    expect: { some: "~ ^Storage=none" }
    rationale: *rat-1b3c070ac8
    remediation: &rem-2e22490786 |
      Edit /etc/systemd/coredump.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^Storage=none
  - id: "CIS-AMAZON2023-1.5.4-coredump_backtraces-attrs"
    name: "/etc/systemd/coredump.conf: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.5.4."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/systemd/coredump.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-28eb5caf90 |
      Setting ProcessSizeMax=0 in systemd-coredump disables the processing of core dumps, so no memory image or backtrace is generated or stored when a program crashes. This prevents sensitive memory contents from ending up on disk or in the journal, at the cost of less crash diagnostics.
    remediation: *rem-38adbe4ae3
  - id: "CIS-AMAZON2023-1.5.4-coredump_backtraces-content"
    name: "/etc/systemd/coredump.conf has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.5.4."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/systemd/coredump.conf'
    allow_rc: any
    expect: { some: "~ ^ProcessSizeMax=0" }
    rationale: *rat-28eb5caf90
    remediation: &rem-1a674933ec |
      Edit /etc/systemd/coredump.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^ProcessSizeMax=0
  - id: "CIS-AMAZON2023-1.6.1.1-libselinux"
    name: "Package libselinux is installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.6.1.1."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet libselinux
    expect: true
    rationale: &rat-d13f41f770 |
      libselinux provides the interfaces through which programs and tools interact with SELinux. Without it SELinux cannot be managed or work as intended, losing the mandatory access control layer that confines services even after they are compromised.
    remediation: &rem-9a0cee152e |
      Install the package libselinux:

      dnf install libselinux
  - id: "CIS-AMAZON2023-1.6.1.2-selinux_disabled_boot-attrs"
    name: "/boot/grub2/grub.cfg: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.6.1.2."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/boot/grub2/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-09e36f9185 |
      SELinux can be switched off or set to permissive from the kernel command line with selinux=0 or enforcing=0. Such boot parameters override the configuration file and remove mandatory access control for all processes without it being obvious. Keeping them out of the boot configuration ensures SELinux starts as configured.
    remediation: &rem-2a9d993c7f |
      Create /boot/grub2/grub.cfg.
  - id: "CIS-AMAZON2023-1.6.1.2-selinux_disabled_boot-content"
    name: "/boot/grub2/grub.cfg has the expected content (2 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.6.1.2."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/boot/grub2/grub.cfg'
    allow_rc: any
    expect:
      - { none: "~ selinux=0" }
      - { none: "~ enforcing=0" }
    rationale: *rat-09e36f9185
    remediation: &rem-ed073d5753 |
      Edit /boot/grub2/grub.cfg so that its lines meet these conditions (regular expressions):

      - no line matches selinux=0
      - no line matches enforcing=0
  - id: "CIS-AMAZON2023-1.6.1.3-selinux_policy-attrs"
    name: "/etc/selinux/config: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.6.1.3."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/selinux/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-2fe59c1dc8 |
      The SELinux policy defines what each confined process may access. The targeted policy confines system and network-facing services; MLS adds multi-level security where required. Configuring a supported, maintained policy type ensures that a meaningful policy is loaded at boot.
    remediation: &rem-3c32e23d79 |
      Create /etc/selinux/config.
  - id: "CIS-AMAZON2023-1.6.1.3-selinux_policy-content"
    name: "/etc/selinux/config has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.6.1.3."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/selinux/config'
    allow_rc: any
    expect: { some: "~ SELINUXTYPE=(targeted|mls)" }
    rationale: *rat-2fe59c1dc8
    remediation: &rem-b98fa91fad |
      Edit /etc/selinux/config so that its lines meet these conditions (regular expressions):

      - a line matches SELINUXTYPE=(targeted|mls)
  - id: "CIS-AMAZON2023-1.6.1.4-selinux_config-attrs"
    name: "/etc/selinux/config: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.6.1.4."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/selinux/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-5e0545b981 |
      SELinux enforces mandatory access control that confines services even when they are compromised or run as root. If it is disabled in /etc/selinux/config, no policy is loaded at boot and re-enabling it later requires a full file relabel. Keeping it at least permissive ensures labels stay correct and the system can be switched to enforcing.
    remediation: *rem-3c32e23d79
  - id: "CIS-AMAZON2023-1.6.1.4-selinux_config-content"
    name: "/etc/selinux/config has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.6.1.4."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/selinux/config'
    allow_rc: any
    expect: { some: "~ SELINUX=(enforcing|permissive)" }
    rationale: *rat-5e0545b981
    remediation: &rem-6a48ebc4aa |
      Edit /etc/selinux/config so that its lines meet these conditions (regular expressions):

      - a line matches SELINUX=(enforcing|permissive)
  - id: "CIS-AMAZON2023-1.6.1.4-selinux_config_running"
    name: "selinux config running: getenforce"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.6.1.4."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      getenforce
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ SELINUX=(Enforcing|Permissive)" }
    rationale: &rat-42bf743559 |
      Even when SELinux is configured on disk, it may have been switched off at runtime or disabled on the kernel command line. Checking the current mode confirms that the policy is actually loaded and active, so that services are confined now and not only after the next reboot.
    remediation: &rem-af9be7e317 |
      Make sure SELinux is active: set it in /etc/selinux/config and switch the running system to enforcing.

      sed -i 's/^\s*SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config
      setenforce 1
      getenforce

      If getenforce reports Disabled, remove selinux=0 from the kernel command line, run touch /.autorelabel and reboot.
  - id: "CIS-AMAZON2023-1.6.1.5-selinux_config_enforcing"
    name: "selinux config enforcing: grep -Ei \"^\\s*SELINUX=[Ee]nforcing\" /etc/selinux/config"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.6.1.5."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Ei "^\s*SELINUX=[Ee]nforcing" /etc/selinux/config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ SELINUX=enforcing" }
    rationale: &rat-3f8c235be5 |
      In enforcing mode SELinux actually blocks actions that its policy does not allow, confining compromised services, while permissive mode only logs violations. Configuring enforcing mode in /etc/selinux/config ensures the protection is active after every boot. Custom applications may need policy adjustments, which can be prepared by reviewing denials in permissive mode first.
    remediation: &rem-822cbbb529 |
      Set SELinux to enforcing in /etc/selinux/config and switch the running system to enforcing.

      sed -i 's/^\s*SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config
      setenforce 1

      If SELinux was disabled before, run touch /.autorelabel and reboot instead of setenforce. Review denials (ausearch -m AVC) before switching production systems.
  - id: "CIS-AMAZON2023-1.6.1.5-selinux_run_enforcing"
    name: "selinux run enforcing: getenforce"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.6.1.5."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      getenforce
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ Enforcing" }
    rationale: &rat-1ae7dcb016 |
      This check verifies that SELinux is enforcing at runtime. In permissive mode violations are only logged, so a compromised service would not be contained. Enforcing mode actually denies operations outside the policy.
    remediation: &rem-58c05c7e0f |
      Switch SELinux to enforcing now and in the configuration. Review recent denials first, since enforcing mode blocks what permissive mode only logged.

      ausearch -m avc -ts today
      setenforce 1
      sed -i -E 's/^\s*SELINUX\s*=.*/SELINUX=enforcing/' /etc/selinux/config

      If getenforce reports Disabled, setenforce has no effect: remove selinux=0 from the kernel command line, run touch /.autorelabel and reboot.
  - id: "CIS-AMAZON2023-1.6.1.6-selinux_unconfined"
    name: "selinux unconfined: ps -eZ | grep unconfined_service_t"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.6.1.6."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      ps -eZ | grep unconfined_service_t
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-a60d4dcb76 |
      Processes in the unconfined_service_t domain are services for which no SELinux policy applies, typically software installed outside the distribution packages. They run without SELinux restrictions, so a compromise of such a service is not contained. Every service should run in a confined domain or be reviewed and approved as an exception.
    remediation: &rem-491577d017 |
      Each listed process runs as an unconfined service. Identify its executable and give it a confined SELinux domain: restore the file context if a distribution service binary is mislabeled, or create and install a policy module for third-party software, then restart the service.

      ps -eZ | grep unconfined_service_t
      ls -Z BINARY
      restorecon -v BINARY
      sepolicy generate --init BINARY

      sepolicy generate (package policycoreutils-devel) creates a policy skeleton and a setup script; refine the module in permissive mode before enforcing it. Software that cannot be confined needs a documented exception.
  - id: "CIS-AMAZON2023-1.6.1.7-setroubleshoot"
    name: "Package setroubleshoot is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.6.1.7."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet setroubleshoot
    expect: false
    rationale: &rat-d9369ee205 |
      setroubleshoot analyses SELinux denials and presents them to users, mainly on desktops. On servers it is not needed, runs additional privileged code and can expose information about denials to unprivileged users. Denials remain available in the audit log without it.
    remediation: &rem-299adb7a7b |
      Remove the package setroubleshoot, unless the system needs it:

      dnf remove setroubleshoot
  - id: "CIS-AMAZON2023-1.6.1.8-mcstrans"
    name: "Package mcstrans is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.6.1.8."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet mcstrans
    expect: false
    rationale: &rat-f702f7174c |
      mcstrans translates SELinux MCS/MLS security levels into readable names. Most systems do not need it, and like any unnecessary daemon it adds privileged code and attack surface. Removing it keeps the system minimal.
    remediation: &rem-2112e5213e |
      Remove the package mcstrans, unless the system needs it:

      dnf remove mcstrans
  - id: "CIS-AMAZON2023-1.7.2-etc_issue_message-attrs"
    name: "/etc/issue: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.7.2."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-35a6d08b7e |
      /etc/issue is shown before local console logins. If it reveals the operating system name, release or architecture, it hands an attacker useful information for choosing exploits. The banner should instead carry the organisation's authorised-use notice without system details.
    remediation: &rem-e3ef3968ca |
      Create /etc/issue.
  - id: "CIS-AMAZON2023-1.7.2-etc_issue_message-content"
    name: "/etc/issue has the expected content (6 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.7.2."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/issue'
    allow_rc: any
    expect:
      - { none: "~ \\[Cc\\]ent\\[Oo\\]\\[Ss\\]" }
      - { none: "~ \\[Rr\\]hel" }
      - { none: "~ \\[Rr\\]ed\\[Hh\\]at" }
      - { none: "~ x86_64" }
      - { none: "~ \\[Ll\\]inux" }
      - { none: "~ \\[Aa\\]mazon" }
    rationale: *rat-35a6d08b7e
    remediation: &rem-3e0dd231cb |
      Edit /etc/issue so that its lines meet these conditions (regular expressions):

      - no line matches \[Cc\]ent\[Oo\]\[Ss\]
      - no line matches \[Rr\]hel
      - no line matches \[Rr\]ed\[Hh\]at
      - no line matches x86_64
      - no line matches \[Ll\]inux
      - no line matches \[Aa\]mazon
  - id: "CIS-AMAZON2023-1.7.6-etc_issue_net_perms-attrs"
    name: "/etc/issue.net: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.7.6."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/issue.net'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-db96813c99 |
      /etc/issue.net holds the banner shown to remote users before login. If non-root users could modify it, they could alter the legal notice or insert misleading content shown to everyone who connects. Ownership by root and a mode of 0644 or stricter keeps it readable but protected.
    remediation: &rem-eb0556c5ea |
      Create /etc/issue.net if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue.net'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue.net'
  - id: "CIS-AMAZON2023-1.7.5-etc_issue_perms-attrs"
    name: "/etc/issue: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.7.5."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-695e1a5a3f |
      /etc/issue is displayed before every local login. If unprivileged users could write to it, they could replace the warning text or display misleading instructions. Ownership by root and mode 0644 or stricter prevent this.
    remediation: &rem-683e1f474b |
      Create /etc/issue if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue'
  - id: "CIS-AMAZON2023-1.7.3-issue_net_message-attrs"
    name: "/etc/issue.net: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.7.3."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/issue.net'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-a0fd6bb628 |
      /etc/issue.net is presented to remote users before authentication, for example as the SSH banner. Exposing the operating system name, version or architecture there helps attackers pick exploits before they even log in. It should contain only the authorised-use notice.
    remediation: &rem-88e05c3381 |
      Create /etc/issue.net.
  - id: "CIS-AMAZON2023-1.7.3-issue_net_message-content"
    name: "/etc/issue.net has the expected content (6 rules)"
