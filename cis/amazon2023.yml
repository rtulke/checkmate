  - id: "CIS-AMAZON2023-4.1.8-cron_allow_users-attrs"
    name: "/etc/cron.allow: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.1.8."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/cron.allow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-4f0207cb70 |
      /etc/cron.allow defines the only users allowed to create cron jobs, which is safer than listing forbidden users because new accounts are denied by default. The file itself must be owned by root and not writable by others, otherwise a user could add themselves and schedule persistent jobs.
    remediation: &rem-2f79d5f392 |
      Create /etc/cron.allow if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/cron.allow'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/cron.allow'
  - id: "CIS-AMAZON2023-4.1.8-cron_deny_users-absent"
    name: "/etc/cron.deny does not exist"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.1.8."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      test -e '/etc/cron.deny' || test -L '/etc/cron.deny'
    expect: false
    rationale: &rat-593adc8129 |
      If /etc/cron.deny exists alongside cron.allow, access control relies on a blocklist in which any account not listed is allowed. Removing cron.deny and using only cron.allow means only explicitly approved users can schedule cron jobs.
    remediation: &rem-d780ede041 |
      Remove /etc/cron.deny, unless the system needs it:

      rm '/etc/cron.deny'
  - id: "CIS-AMAZON2023-4.1.9-at_allow_users-attrs"
    name: "/etc/at.allow: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.1.9."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/at.allow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-f8db307709 |
      /etc/at.allow lists the only users permitted to schedule one-time jobs with at. An allow list denies new or unexpected accounts by default. The file must be owned by root and protected from modification so users cannot grant themselves access.
    remediation: &rem-71542f7e35 |
      Create /etc/at.allow if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/at.allow'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/at.allow'
  - id: "CIS-AMAZON2023-4.1.9-at_deny_users-absent"
    name: "/etc/at.deny does not exist"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.1.9."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
