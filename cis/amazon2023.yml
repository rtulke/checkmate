    rationale: &rat-52574c203d |
      squashfs is a compressed read-only file system driver. Rarely used file system drivers are a common source of kernel vulnerabilities that can be reached simply by mounting a crafted image. Mapping the module to /bin/false makes every load attempt fail, including explicit modprobe calls, so the code never runs on this system. It is required by snap packages on Ubuntu and by some live or appliance images, so check for such use before disabling it.
