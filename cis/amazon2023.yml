  - id: "CIS-AMAZON2023-4.2.1-sshconfig_perms-attrs"
    name: "/etc/ssh/sshd_config: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.2.1."
