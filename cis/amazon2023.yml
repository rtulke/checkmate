  - id: "CIS-AMAZON2023-1.1.2.1-tmp_exists_and_opts"
    name: "/tmp is a separate mount"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.1.2.1."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/tmp'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: &rat-3207127443 |
      A separate file system for /tmp keeps world-writable temporary data from filling the root file system and allows restrictive mount options such as nodev, nosuid and noexec to be applied. It also prevents hard links from /tmp to files elsewhere on the root file system. A tmpfs mount is a common way to provide it.
    remediation: &rem-fbf7b93a5e |
      Put /tmp on a separate file system (partition or logical volume) and mount it there with an entry in /etc/fstab or a systemd mount unit. This needs a new file system and moving the existing data. A tmpfs mount on /tmp, e.g. with systemd's tmp.mount, counts as well.
