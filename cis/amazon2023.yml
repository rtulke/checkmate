    allow_rc: any
    expect:
      - { none: "~ \\[Cc\\]ent\\[Oo\\]\\[Ss\\]" }
      - { none: "~ \\[Rr\\]hel" }
      - { none: "~ \\[Rr\\]ed\\[Hh\\]at" }
      - { none: "~ x86_64" }
      - { none: "~ \\[Ll\\]inux" }
      - { none: "~ \\[Aa\\]mazon" }
    rationale: *rat-a0fd6bb628
    remediation: &rem-0469965a87 |
      Edit /etc/issue.net so that its lines meet these conditions (regular expressions):

      - no line matches \[Cc\]ent\[Oo\]\[Ss\]
      - no line matches \[Rr\]hel
      - no line matches \[Rr\]ed\[Hh\]at
      - no line matches x86_64
      - no line matches \[Ll\]inux
      - no line matches \[Aa\]mazon
  - id: "CIS-AMAZON2023-1.7.1-motd_message-attrs"
    name: "/etc/motd: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.7.1."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/motd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-90d6c50de3 |
      The message of the day is displayed to every user after login. It should be owned by root and not writable by others so that it cannot be used to mislead users, and it should not disclose operating system details that help attackers who gained a foothold.
    remediation: &rem-cc50883ec8 |
      Create /etc/motd if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/motd'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/motd'
  - id: "CIS-AMAZON2023-1.7.1-motd_message-content"
    name: "/etc/motd has the expected content (6 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.7.1."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/motd'
    allow_rc: any
    expect:
      - { none: "~ \\[Cc\\]ent\\[Oo\\]\\[Ss\\]" }
      - { none: "~ \\[Rr\\]hel" }
      - { none: "~ \\[Rr\\]ed\\[Hh\\]at" }
      - { none: "~ x86_64" }
      - { none: "~ \\[Ll\\]inux" }
      - { none: "~ \\[Aa\\]mazon" }
    rationale: *rat-90d6c50de3
    remediation: &rem-c941d9a3bb |
      Edit /etc/motd so that its lines meet these conditions (regular expressions):

      - no line matches \[Cc\]ent\[Oo\]\[Ss\]
      - no line matches \[Rr\]hel
      - no line matches \[Rr\]ed\[Hh\]at
      - no line matches x86_64
      - no line matches \[Ll\]inux
      - no line matches \[Aa\]mazon
  - id: "CIS-AMAZON2023-1.7.4-motd_perms-attrs"
    name: "/etc/motd: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.7.4."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/motd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-84448e81ae |
      /etc/motd is displayed to every user after login. If unprivileged users could write to it, they could show misleading messages to other users, for example to trick them into running commands. Ownership by root and mode 0644 or stricter prevent this.
    remediation: *rem-cc50883ec8
  - id: "CIS-AMAZON2023-1.8-security-updates"
    name: "security updates: yum check-update"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.8."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 60000ms
    run: |
      yum check-update
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ [0-9].* packages available" }
      - { none: "~ upgrade" }
    rationale: &rat-7cc1d8773a |
      Unpatched software is one of the most common ways systems are compromised. Installing available updates closes publicly known vulnerabilities before they can be exploited. The check reports a failure while updates are pending; on most platforms this includes non-security updates.
    remediation: &rem-bcb4a0c358 |
      Install all pending package updates; the check fails as long as any update is available, not only security updates.

      dnf upgrade

      On Amazon Linux 2 and RHEL 7 use yum update. Reboot if the kernel or core libraries were updated. On Amazon Linux 2023 dnf may also announce a newer release, which counts as pending; apply it with dnf upgrade --releasever=latest after testing.
  - id: "CIS-AMAZON2023-1.9-crypto_policies_config-attrs"
    name: "/etc/crypto-policies/config: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.9."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/crypto-policies/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-97d5e3099e |
      The system-wide crypto policy defines which protocols, ciphers, key sizes and hash algorithms libraries such as OpenSSL, GnuTLS, NSS and OpenSSH accept. The LEGACY policy re-enables weak algorithms like SHA-1 signatures and small keys that allow downgrade or forgery attacks. Using DEFAULT, FUTURE or FIPS keeps all applications on a consistent, acceptable baseline.
    remediation: &rem-0853942979 |
      Create /etc/crypto-policies/config.
  - id: "CIS-AMAZON2023-1.9-crypto_policies_config-content"
    name: "/etc/crypto-policies/config has the expected content (2 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.9."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/crypto-policies/config'
    allow_rc: any
    expect:
      - { some: "~ ^(|\\s+)(DEFAULT|FUTURE|FIPS)" }
      - { none: "~ ^(|\\s+)LEGACY" }
    rationale: *rat-97d5e3099e
    remediation: &rem-c14b2056bd |
      Edit /etc/crypto-policies/config so that its lines meet these conditions (regular expressions):

      - a line matches ^(|\s+)(DEFAULT|FUTURE|FIPS)
      - no line matches ^(|\s+)LEGACY
  - id: "CIS-AMAZON2023-2.1.1-chrony"
    name: "Package chrony is installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.1.1."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet chrony
    expect: true
    rationale: &rat-a0cc2c0b8d |
      Accurate, synchronized time is required for log correlation, Kerberos, certificate validation and time-based one-time passwords. A system should run exactly one time synchronization client. Depending on the platform the check expects chrony to be installed or, where systemd-timesyncd is the chosen client, not installed, to avoid competing daemons.
    remediation: &rem-d6d7094cb8 |
      Install the package chrony:

      dnf install chrony
  - id: "CIS-AMAZON2023-2.1.2-chrony_server_config"
    name: "chrony server config: grep -Pr -- '^\\h*(server|pool)\\h+[^#\\n\\r]+' /etc/chrony.conf /etc/chrony.d/*.conf"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.1.2."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Pr -- '^\h*(server|pool)\h+[^#\n\r]+' /etc/chrony.conf /etc/chrony.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ ^(server|pool)\\s0.pool.ntp.org" }
      - { some: "~ ^(server|pool)\\s1.pool.ntp.org" }
      - { some: "~ ^(server|pool)\\s2.pool.ntp.org" }
      - { some: "~ ^(server|pool)\\s3.pool.ntp.org" }
    rationale: &rat-bc8c548f1b |
      Accurate time is needed to correlate logs across systems, validate certificates and Kerberos tickets, and keep audit evidence reliable. chrony only synchronises if it has configured time sources. The check verifies that the expected server or pool entries are present.
    remediation: &rem-6789760355 |
      Configure the time sources expected by the check in chrony and restart the service.

      printf '%s\n' 'pool 0.pool.ntp.org iburst' 'pool 1.pool.ntp.org iburst' 'pool 2.pool.ntp.org iburst' 'pool 3.pool.ntp.org iburst' >> /etc/chrony.conf
      systemctl restart chronyd
      chronyc sources

      On EC2 the Amazon Time Sync Service (169.254.169.123) is normally preferred; use the time sources mandated by the site policy.
  - id: "CIS-AMAZON2023-2.2.1-xorgs-x11-servers"
    name: "Package xorgs-x11-servers is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.1."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet xorgs-x11-servers
    expect: false
    rationale: &rat-5b2ffe2158 |
      A graphical X server adds a large amount of complex, historically vulnerable code and usually brings further desktop packages with it. Servers are administered remotely and do not need a local display server, so leaving it off reduces the attack surface and patching effort. Workstations that need a GUI are the exception.
    remediation: &rem-5cb7c4d9a3 |
      Remove the package xorgs-x11-servers, unless the system needs it:

      dnf remove xorgs-x11-servers
  - id: "CIS-AMAZON2023-2.2.2-avahi"
    name: "Package avahi is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.2."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet avahi
    expect: false
    rationale: &rat-6dd3f1442b |
      Avahi implements mDNS/DNS-SD zero-configuration networking, announcing the host and its services on the local network and listening for multicast traffic. Servers do not need automatic service discovery, and the daemon both leaks information about the system and exposes a network listener that has had vulnerabilities. Removing it avoids both.
    remediation: &rem-0691bdc571 |
      Remove the package avahi, unless the system needs it:

      dnf remove avahi
  - id: "CIS-AMAZON2023-2.2.3-cups"
    name: "Package cups is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.3."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet cups
    expect: false
    rationale: &rat-5fd2f513f0 |
      CUPS provides printing services and can listen on the network (port 631), offer a web interface and browse for remote printers. Systems that do not print gain nothing from it but carry an extra network service with a history of security fixes. Remove it unless the host prints or acts as a print server.
    remediation: &rem-fb4236c747 |
      Remove the package cups, unless the system needs it:

      dnf remove cups
  - id: "CIS-AMAZON2023-2.2.4-dhcp"
    name: "Package dhcp is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.4."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet dhcp
    expect: false
    rationale: &rat-76febf12e3 |
      The dhcp package provides a DHCP server. An unintended DHCP server can hand out wrong addresses, gateways or DNS servers to other machines, and the daemon is network-facing code that must be patched. Only hosts that are designated DHCP servers should have it installed.
    remediation: &rem-7a9d50dbc2 |
      Remove the package dhcp, unless the system needs it:

      dnf remove dhcp
  - id: "CIS-AMAZON2023-2.2.5-bind"
    name: "Package bind is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.5."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet bind
    expect: false
    rationale: &rat-68a563d1d3 |
      BIND provides a DNS server. Running a name server where none is needed exposes a complex network service, can be abused for amplification attacks if misconfigured, and may disclose internal names. Only designated DNS servers should have it installed; the client tools are in a separate package.
    remediation: &rem-c6b14ce780 |
      Remove the package bind, unless the system needs it:

      dnf remove bind
  - id: "CIS-AMAZON2023-2.2.6-vsftpd"
    name: "Package vsftpd is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.6."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet vsftpd
    expect: false
    rationale: &rat-436c2763bd |
      vsftpd is an FTP server. FTP transfers credentials and data unencrypted unless TLS is configured carefully, and an FTP service is a frequent target for brute-force attacks and data leaks. Use SFTP or another encrypted transfer method and keep the FTP server off systems that do not explicitly provide it.
    remediation: &rem-bef22f0340 |
      Remove the package vsftpd, unless the system needs it:

      dnf remove vsftpd
  - id: "CIS-AMAZON2023-2.2.7-tftp-server"
    name: "Package tftp-server is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.7."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet tftp-server
    expect: false
    rationale: &rat-04d1e79862 |
      TFTP has no authentication and no encryption, so any client that can reach the service can read, and sometimes write, files in its directory. It is only needed on hosts that serve network boot images or device configurations, and should be absent everywhere else.
    remediation: &rem-60bae67a00 |
      Remove the package tftp-server, unless the system needs it:

      dnf remove tftp-server
  - id: "CIS-AMAZON2023-2.2.8-httpd"
    name: "Package httpd is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.8."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet httpd
    expect: false
    rationale: &rat-363beaff7b |
      The Apache HTTP server opens a network service with a large attack surface through its modules and the content it serves. If the host is not meant to be a web server, removing it avoids accidental exposure of files and the patching burden of an unused service.
    remediation: &rem-6556a2b733 |
      Remove the package httpd, unless the system needs it:

      dnf remove httpd
  - id: "CIS-AMAZON2023-2.2.8-nginx"
    name: "Package nginx is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.8."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet nginx
    expect: false
    rationale: &rat-9aac42f589 |
      nginx is a web server and reverse proxy. If the host is not intended to serve web content or proxy traffic, an installed web server only adds network-exposed code and the risk of accidentally publishing files. Remove it unless the system has a documented web role.
    remediation: &rem-38c88478d8 |
      Remove the package nginx, unless the system needs it:

      dnf remove nginx
  - id: "CIS-AMAZON2023-2.2.9-cyrus-impad"
    name: "Package cyrus-impad is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.9."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet cyrus-impad
    expect: false
    rationale: &rat-ea08af2648 |
      Cyrus IMAP is a mail access server (IMAP/POP3). Mail servers handle authentication and untrusted input from the network and need careful configuration and patching. Systems that are not mail servers should not run one.
    remediation: &rem-09c04504fe |
      Remove the package cyrus-impad, unless the system needs it:

      dnf remove cyrus-impad
  - id: "CIS-AMAZON2023-2.2.9-dovecot"
    name: "Package dovecot is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.9."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet dovecot
    expect: false
    rationale: &rat-22557fc45d |
      Dovecot is an IMAP and POP3 server that accepts user logins over the network. On systems that are not mail servers it is an unnecessary authentication endpoint and network service, and should be removed.
    remediation: &rem-771c817ac1 |
      Remove the package dovecot, unless the system needs it:

      dnf remove dovecot
  - id: "CIS-AMAZON2023-2.2.10-samba"
    name: "Package samba is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.10."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet samba
    expect: false
    rationale: &rat-d7ad1732cb |
      Samba provides SMB/CIFS file and print sharing. The SMB protocol and its implementations have a long history of critical vulnerabilities, and shares can expose data if misconfigured. Install the server only on hosts that must share files with Windows clients; client-only use does not need the server package.
    remediation: &rem-ea07c4a8bc |
      Remove the package samba, unless the system needs it:

      dnf remove samba
  - id: "CIS-AMAZON2023-2.2.11-squid"
    name: "Package squid is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.11."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet squid
    expect: false
    rationale: &rat-04d3922e1d |
      Squid is an HTTP caching proxy. An unneeded or misconfigured proxy can be abused to relay traffic, bypass network controls or reach internal systems, and it is network-facing code that requires patching. Remove it unless the host is a designated proxy server.
    remediation: &rem-d2fd20e6ef |
      Remove the package squid, unless the system needs it:

      dnf remove squid
  - id: "CIS-AMAZON2023-2.2.12-net-snmp"
    name: "Package net-snmp is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.12."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet net-snmp
    expect: false
    rationale: &rat-7e8efdc0ad |
      net-snmp provides an SNMP agent. SNMP v1 and v2c send community strings in clear text and can disclose detailed system information or, with write access, allow configuration changes. Run an SNMP agent only where monitoring requires it, and then prefer SNMPv3 with authentication and encryption.
    remediation: &rem-9bb126d571 |
      Remove the package net-snmp, unless the system needs it:

      dnf remove net-snmp
  - id: "CIS-AMAZON2023-2.2.13-telnet-server"
    name: "Package telnet-server is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.13."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet telnet-server
    expect: false
    rationale: &rat-c93a56c245 |
      Telnet sends user names, passwords and the whole session in clear text, so anyone able to observe the network can capture credentials. SSH provides the same remote access securely, so a telnet server should not be installed.
    remediation: &rem-dca29d92b3 |
      Remove the package telnet-server, unless the system needs it:

      dnf remove telnet-server
  - id: "CIS-AMAZON2023-2.2.14-dnsmasq"
    name: "Package dnsmasq is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.14."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet dnsmasq
    expect: false
    rationale: &rat-0114a915ff |
      dnsmasq is a lightweight DNS forwarder and DHCP server. If it runs unintentionally it can answer DNS or DHCP requests on the network, be abused for amplification, or interfere with the real infrastructure services. Remove it unless the host needs it, for example for local virtualization networking.
    remediation: &rem-04fb283cf6 |
      Remove the package dnsmasq, unless the system needs it:

      dnf remove dnsmasq
  - id: "CIS-AMAZON2023-2.2.15-mta_installed"
    name: "mta installed: ss -lntu | grep -E \":25\\s\" | grep -E -v \"\\s(127.0.0.1|\\[?::1\\]?):25\\s\""
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.15."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      ss -lntu | grep -E ":25\s" | grep -E -v "\s(127.0.0.1|\[?::1\]?):25\s"
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-9517b0fc0d |
      A mail transfer agent that listens on external interfaces accepts SMTP connections from the network, which exposes a complex service to attack and can turn the host into a spam relay if misconfigured. Most systems only need to deliver locally generated mail, which works with the MTA bound to the loopback interface.
    remediation: &rem-957d67671c |
      Bind the mail transfer agent to the loopback interface only (or remove it if the host sends no mail), then restart it.

      postconf -e 'inet_interfaces = loopback-only'
      systemctl restart postfix
      ss -lntu | grep ':25\s'

      For other MTAs such as sendmail or exim, restrict the listening address in their own configuration. Hosts that are mail relays by design are an exception.
  - id: "CIS-AMAZON2023-2.2.16-nfs-server-enabled"
    name: "Service nfs-server is not enabled"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.16."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemctl show -p UnitFileState nfs-server | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-b265db25c3 |
      An NFS server exports file systems over the network, often with host-based trust and limited authentication. A server that is not meant to share files should not run it, both to avoid accidental data exposure and to remove the related RPC services from the network.
    remediation: &rem-567ded0930 |
      Disable the service nfs-server, unless the system needs it:

      systemctl disable nfs-server

      To keep other units from starting it, mask it instead: systemctl mask nfs-server
  - id: "CIS-AMAZON2023-2.2.16-nfs-server-running"
    name: "Service nfs-server is not running"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.16."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemctl show -p ActiveState nfs-server | cut -d= -f2
    expect: "!= active"
    rationale: *rat-b265db25c3
    remediation: &rem-91d9a2d26d |
      Stop the service nfs-server, unless the system needs it:

      systemctl stop nfs-server
  - id: "CIS-AMAZON2023-2.2.17-rpcbind-enabled"
    name: "Service rpcbind is not enabled"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.17."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemctl show -p UnitFileState rpcbind | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-8a6c37a84c |
      rpcbind maps RPC program numbers to network ports and is required mainly by NFS and NIS. It listens on the network, can disclose which RPC services run on the host and has been abused for DDoS amplification. Disable or remove it unless NFS or other RPC services are in use.
    remediation: &rem-f6ecb0c35d |
      Disable the service rpcbind, unless the system needs it:

      systemctl disable rpcbind

      To keep other units from starting it, mask it instead: systemctl mask rpcbind
  - id: "CIS-AMAZON2023-2.2.17-rpcbind-running"
    name: "Service rpcbind is not running"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.17."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemctl show -p ActiveState rpcbind | cut -d= -f2
    expect: "!= active"
    rationale: *rat-8a6c37a84c
    remediation: &rem-929053d5b1 |
      Stop the service rpcbind, unless the system needs it:

      systemctl stop rpcbind
  - id: "CIS-AMAZON2023-2.2.17-rpcbind.socket"
    name: "rpcbind.socket: systemctl is-enabled rpcbind.socket"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.17."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemctl is-enabled rpcbind.socket
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^masked" }
    rationale: &rat-2bda361477 |
      rpcbind can be started on demand through its socket unit, so disabling only the service is not enough. Masking rpcbind.socket prevents the port mapper from being activated by incoming connections or by other units. It is only needed on systems that provide or use NFSv3, NIS or other RPC services.
    remediation: &rem-bce2386bbd |
      Stop and mask the rpcbind socket and service unless the system needs RPC services such as NFSv3.

      systemctl stop rpcbind.socket rpcbind.service
      systemctl mask rpcbind.socket rpcbind.service
  - id: "CIS-AMAZON2023-2.2.18-rsync-enabled"
    name: "Service rsync is not enabled"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.18."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemctl show -p UnitFileState rsync | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-f865cf7f4c |
      The rsync daemon offers file synchronisation over a plain-text protocol with weak or no authentication depending on its configuration. Systems that do not act as rsync servers should not run the daemon; rsync over SSH does not need it.
    remediation: &rem-8905efaf3f |
      Disable the service rsync, unless the system needs it:

      systemctl disable rsync

      To keep other units from starting it, mask it instead: systemctl mask rsync
  - id: "CIS-AMAZON2023-2.2.18-rsync-running"
    name: "Service rsync is not running"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.2.18."
