  - id: "CIS-AMAZON2023-4.2.18-sshd_config_maxsessions-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.2.18."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-94b8bd03a1 |
      MaxSessions limits how many sessions can be multiplexed over a single SSH connection. Capping it limits resource usage and the amount of activity that can hide behind one authenticated connection.
    remediation: *rem-f6392187bb
  - id: "CIS-AMAZON2023-4.2.18-sshd_config_maxsessions-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
