      - { none: "~ ^Banner none" }
    rationale: *rat-3d88a774be
    remediation: &rem-04bc3fa781 |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches ^Banner /etc/issue.net
      - no line matches ^Banner none
  - id: "CIS-AMAZON2023-4.2.16-sshd_config_maxauthtries-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.2.16."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-28e402b927 |
      MaxAuthTries limits how many authentication attempts a client may make per connection. A low limit slows down online password guessing and causes failed attempts to be logged sooner, without affecting legitimate users who rarely need more than a few tries.
    remediation: *rem-f6392187bb
  - id: "CIS-AMAZON2023-4.2.16-sshd_config_maxauthtries-content"
