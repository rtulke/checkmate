  - id: "CIS-AMAZON2023-3.4.1.2-etc_systemd_system_nftables.service-attrs"
    name: "/etc/systemd/system/nftables.service: exists, is a symbolic link, links to /dev/null"
    description: "CIS Amazon Linux 2023 benchmark recommendation 3.4.1.2."
    tags: [cis, cis-amazon2023, cis-section-3, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/systemd/system/nftables.service'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -L "$f" ] || echo "$f is not a symbolic link"
      [ "$(readlink "$f")" = '/dev/null' ] || echo "$f links to $(readlink "$f")"
    expect: empty
    rationale: &rat-95c27dda68 |
      When firewalld manages the firewall, starting the separate nftables service as well would load a second, independently maintained rule set that can conflict with or override firewalld's rules. Masking nftables.service (a link to /dev/null) ensures that only one firewall manager is in control.
    remediation: &rem-de57692453 |
      Create /etc/systemd/system/nftables.service if it is missing, then point the link to /dev/null:

      ln -sfn '/dev/null' '/etc/systemd/system/nftables.service'
  - id: "CIS-AMAZON2023-3.4.2.1-default_zone"
    name: "default zone: firewall-cmd --get-default-zone"
    description: "CIS Amazon Linux 2023 benchmark recommendation 3.4.2.1."
    tags: [cis, cis-amazon2023, cis-section-3, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      firewall-cmd --get-default-zone
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ public" }
    rationale: &rat-0dee2fbee6 |
      firewalld applies the default zone to every interface that is not explicitly assigned to another zone. A permissive default such as trusted would allow all traffic on new interfaces. Using a restrictive zone like public ensures that new interfaces only expose explicitly allowed services.
    remediation: &rem-c563573046 |
      Set the firewalld default zone to public.

      firewall-cmd --set-default-zone=public
      firewall-cmd --get-default-zone

      Review the services and ports allowed in that zone with firewall-cmd --list-all.
  - id: "CIS-AMAZON2023-4.1.1-cronie"
