      - a line matches MaxAuthTries [1-4]
      - no line matches MaxAuthTries (0|[5-9])
  - id: "CIS-AMAZON2023-4.2.17-sshd_config_maxstartups-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.2.17."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
