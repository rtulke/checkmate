    tags: [cis, cis-amazon2023, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    only_if: "modinfo squashfs \u003e/dev/null 2\u003e\u00261"
    run: |
      cat '/etc/modprobe.d/blacklist.conf'
    allow_rc: any
    expect: { some: "~ ^blacklist squashfs" }
    rationale: *rat-7adfb527a0
    remediation: &rem-d0577f94c7 |
      Edit /etc/modprobe.d/blacklist.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^blacklist squashfs
  - id: "CIS-AMAZON2023-1.1.1.1-squashfs"
    name: "squashfs: modprobe -n -v squashfs | grep -E '(squashfs|install)'"
    description: "CIS Amazon Linux 2023 benchmark recommendation 1.1.1.1."
    tags: [cis, cis-amazon2023, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      modprobe -n -v squashfs | grep -E '(squashfs|install)'
