  - id: "CIS-AMAZON2023-4.2.19-sshd_config_logingrace-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.2.19."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-69c8f28b04 |
      LoginGraceTime sets how long an unauthenticated connection may stay open. A short grace period (under a minute) frees resources quickly and reduces the impact of attacks that open many connections and stall the authentication phase.
    remediation: *rem-f6392187bb
  - id: "CIS-AMAZON2023-4.2.19-sshd_config_logingrace-content"
    name: "/etc/ssh/sshd_config has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.2.19."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
