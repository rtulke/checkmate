  - id: "CIS-AMAZON2023-3.2.1-net.ipv4.ip_forward"
    name: "Kernel parameter net.ipv4.ip_forward is 0"
    description: "CIS Amazon Linux 2023 benchmark recommendation 3.2.1."
    tags: [cis, cis-amazon2023, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sysctl -n net.ipv4.ip_forward
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-f3a19b4b76 |
      With IP forwarding enabled the system routes packets between its interfaces like a router. A host that is not meant to route could then be used to bypass network segmentation. Disabling forwarding ensures only traffic addressed to the host itself is handled. Routers and many container or virtualization hosts need forwarding.
    remediation: &rem-330a5a5e8e |
      Set the kernel parameter net.ipv4.ip_forward to 0, now and at boot:

      sysctl -w 'net.ipv4.ip_forward=0'
      printf '%s\n' 'net.ipv4.ip_forward = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.ip_forward from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-AMAZON2023-3.2.1-net.ipv6.conf.all.forwarding"
    name: "Kernel parameter net.ipv6.conf.all.forwarding is 0"
    description: "CIS Amazon Linux 2023 benchmark recommendation 3.2.1."
    tags: [cis, cis-amazon2023, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sysctl -n net.ipv6.conf.all.forwarding
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-4641a6da53 |
      With IPv6 forwarding enabled the host routes packets between its interfaces, which can bridge network segments that should be separated and bypass perimeter controls. A system that is not a router should not forward traffic. Container hosts and routers are legitimate exceptions.
    remediation: &rem-177f4895ae |
      Set the kernel parameter net.ipv6.conf.all.forwarding to 0, now and at boot:

