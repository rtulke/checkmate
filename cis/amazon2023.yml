      - { none: "~ ^CRYPTO_POLICY" }
    rationale: &rat-53a50afea8 |
      On systems with system-wide crypto policies, sshd takes its ciphers, MACs and key exchange algorithms from that policy. A CRYPTO_POLICY override in /etc/sysconfig/sshd or the sshd configuration silently replaces it and can re-enable weak algorithms. Removing the override keeps SSH aligned with the central policy.
    remediation: &rem-92478d0b4e |
      Comment out any CRYPTO_POLICY override so that sshd follows the system-wide crypto policy, then restart sshd.

      grep -Ein '^\s*CRYPTO_POLICY' /etc/sysconfig/sshd /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*
      sed -ri 's/^(\s*CRYPTO_POLICY\s*=)/# \1/I' /etc/sysconfig/sshd
      systemctl restart sshd
  - id: "CIS-AMAZON2023-4.2.15-sshd_config_banner-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.2.15."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-3d88a774be |
      A pre-login banner states that access is restricted to authorised users and that activity may be monitored. Such a notice supports legal action against intruders and informs legitimate users of their obligations. sshd only shows it if the Banner option points to the banner file.
    remediation: *rem-f6392187bb
  - id: "CIS-AMAZON2023-4.2.15-sshd_config_banner-content"
