  - id: "CIS-AMAZON2023-4.5.4-system-auth_algorithm-content"
    name: "/etc/pam.d/system-auth has the expected content (2 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.5.4."
