      systemctl stop rsync
  - id: "CIS-AMAZON2023-2.3.1-telnet"
    name: "Package telnet is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.3.1."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet telnet
    expect: false
    rationale: &rat-b00660eaf1 |
      The telnet client connects using an unencrypted protocol, so credentials and session data typed into it are exposed on the network. Removing it discourages insecure remote logins; use ssh for administration and tools such as nc or openssl s_client for port testing.
    remediation: &rem-3edcbf8297 |
      Remove the package telnet, unless the system needs it:

      dnf remove telnet
  - id: "CIS-AMAZON2023-2.3.2-openldap-clients"
    name: "Package openldap-clients is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.3.2."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet openldap-clients
    expect: false
    rationale: &rat-ed14c6bd07 |
      The OpenLDAP client tools let users query and modify LDAP directories from the command line, which can be used to enumerate accounts and directory data, sometimes over unencrypted connections. Systems that do not need to administer a directory should not carry them. System authentication via SSSD does not require this package.
    remediation: &rem-c3c0dd7932 |
      Remove the package openldap-clients, unless the system needs it:

      dnf remove openldap-clients
  - id: "CIS-AMAZON2023-2.3.3-ypbind"
    name: "Package ypbind is not installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.3.3."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet ypbind
    expect: false
    rationale: &rat-a417b62a5e |
      ypbind is the client for NIS (Yellow Pages), a legacy directory service that sends account data, including password hashes, unencrypted and has weak authentication. NIS should be replaced by LDAP with TLS or similar, and the client removed.
    remediation: &rem-c6563f282f |
      Remove the package ypbind, unless the system needs it:

      dnf remove ypbind
  - id: "CIS-AMAZON2023-2.4-essential_pkgs"
    name: "essential pkgs: echo \"Warning - Ensure all services are required - remove or mask if not\""
    description: "CIS Amazon Linux 2023 benchmark recommendation 2.4."
    tags: [cis, cis-amazon2023, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      echo "Warning - Ensure all services are required - remove or mask if not"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Warning" }
    rationale: &rat-ad088147e5 |
      Every installed package and running service adds code that must be patched and may be attacked. Keeping only what the system's role requires reduces the attack surface and maintenance effort. This is a review task that cannot be fully automated, because what is required depends on the purpose of each host.
    remediation: &rem-299e94f3b4 |
      Review the installed packages, enabled services and listening ports, and remove or mask everything the system's role does not require.

      systemctl list-unit-files --state=enabled
      ss -plntu
      dnf remove PACKAGE
      systemctl --now mask SERVICE

      This is a manual control: the check always reports a failure as a reminder and cannot pass automatically.
  - id: "CIS-AMAZON2023-3.1.2-blacklist_dccp-attrs"
    name: "/etc/modprobe.d/blacklist.conf: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 3.1.2."
    tags: [cis, cis-amazon2023, cis-section-3, cis-level-2, cis-server, cis-level2-server]
    severity: low
    only_if: "modinfo dccp \u003e/dev/null 2\u003e\u00261"
    run: |
      f='/etc/modprobe.d/blacklist.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-e698bfc626 |
      DCCP (Datagram Congestion Control Protocol) is a transport protocol almost no application uses, and its kernel implementation has had several serious vulnerabilities, including privilege escalation bugs. Blacklisting the module stops it from being loaded automatically, for example when an unprivileged program opens a socket of that protocol family.
    remediation: *rem-388bd29af8
  - id: "CIS-AMAZON2023-3.1.2-blacklist_dccp-content"
    name: "/etc/modprobe.d/blacklist.conf has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 3.1.2."
    tags: [cis, cis-amazon2023, cis-section-3, cis-level-2, cis-server, cis-level2-server]
    severity: low
    only_if: "modinfo dccp \u003e/dev/null 2\u003e\u00261"
    run: |
      cat '/etc/modprobe.d/blacklist.conf'
    allow_rc: any
    expect: { some: "~ ^blacklist dccp" }
    rationale: *rat-e698bfc626
    remediation: &rem-327075c2fb |
      Edit /etc/modprobe.d/blacklist.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^blacklist dccp
  - id: "CIS-AMAZON2023-3.1.2-dccp_disabled"
    name: "dccp disabled: modprobe -n -v dccp | grep -E '(dccp|install)'"
    description: "CIS Amazon Linux 2023 benchmark recommendation 3.1.2."
    tags: [cis, cis-amazon2023, cis-section-3, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      modprobe -n -v dccp | grep -E '(dccp|install)'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /(usr/)?bin/(true|false)" }
    rationale: &rat-a0916c5efd |
      DCCP (Datagram Congestion Control Protocol) is a transport protocol almost no application uses, and its kernel implementation has had several serious vulnerabilities, including privilege escalation bugs. Mapping the module to /bin/false makes every load attempt fail, so the protocol code cannot be reached on this system.
    remediation: &rem-5cfeccc700 |
      Make every attempt to load dccp run /bin/false instead, blacklist it, and unload it if it is currently loaded.

      printf '%s\n' 'install dccp /bin/false' 'blacklist dccp' > /etc/modprobe.d/dccp.conf
      modprobe -r dccp

      If the module is in use, unmount the file system first or reboot.
