      - { some: "~ ^ClientAliveCountMax 3" }
    rationale: *rat-f4075c7069
    remediation: &rem-7cef73fa96 |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches ^ClientAliveInterval 15
      - a line matches ^ClientAliveCountMax 3
  - id: "CIS-AMAZON2023-4.3.1-sudo"
    name: "Package sudo is installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.3.1."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet sudo
    expect: true
    rationale: &rat-f5f9e1cba7 |
      sudo lets administrators run privileged commands with their own credentials instead of a shared root password. That gives individual accountability, fine-grained permissions and a log of every privileged command.
    remediation: &rem-9822b7a6a6 |
      Install the package sudo:

      dnf install sudo
  - id: "CIS-AMAZON2023-4.3.2-sudoers_pty-attrs"
    name: "/etc/sudoers: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.3.2."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/sudoers'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-63218cca98 |
      With use_pty, sudo runs commands in a separate pseudo-terminal. A malicious program started through sudo then cannot inject input into the user's terminal or keep access to it after sudo exits. It also makes I/O logging complete.
    remediation: &rem-b6090d151e |
      Create /etc/sudoers.
  - id: "CIS-AMAZON2023-4.3.2-sudoers_pty-content"
    name: "/etc/sudoers has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.3.2."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/sudoers'
    allow_rc: any
    expect: { some: "~ ^Defaults.*\\suse_pty" }
    rationale: *rat-63218cca98
    remediation: &rem-b9e3ac8490 |
      Edit /etc/sudoers so that its lines meet these conditions (regular expressions):

      - a line matches ^Defaults.*\suse_pty
  - id: "CIS-AMAZON2023-4.3.2-pty_sudoers_d"
    name: "pty sudoers d: ls -1 /etc/sudoers.d/* \u003e /dev/null 2\u003e\u00261; if [ '$?' = '0' ]; then grep -c '^Defaults.*\\sus…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.3.2."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      ls -1 /etc/sudoers.d/* > /dev/null 2>&1; if [ '$?' = '0' ]; then grep -c '^Defaults.*\suse_pty' /etc/sudoers.d/*; else echo 99;fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ [0-99]" }
    rationale: *rat-63218cca98
    remediation: &rem-bf550576ff |
      Enable use_pty with a line of its own in a file under /etc/sudoers.d/, remove any Defaults !use_pty setting and validate the syntax.

      echo 'Defaults use_pty' > /etc/sudoers.d/50-use_pty
      chmod 0440 /etc/sudoers.d/50-use_pty
      grep -rnE '^\s*Defaults.*!use_pty' /etc/sudoers /etc/sudoers.d/
      visudo -c

      sudo ignores files in /etc/sudoers.d/ whose names contain a dot or end with ~.
  - id: "CIS-AMAZON2023-4.3.3-sudoers_log-attrs"
    name: "/etc/sudoers: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.3.3."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/sudoers'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1251782ada |
      A dedicated sudo log file records every command run through sudo, who ran it and when, in one place. This makes privileged activity easier to review and preserves evidence even if the general system log is noisy or rotated quickly.
    remediation: *rem-b6090d151e
  - id: "CIS-AMAZON2023-4.3.3-sudoers_log-content"
    name: "/etc/sudoers has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.3.3."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/sudoers'
    allow_rc: any
    expect: { some: "~ ^Defaults\\s+logfile=\"/var/log/sudo.log\"" }
    rationale: *rat-1251782ada
    remediation: &rem-8bf22c8e4e |
      Edit /etc/sudoers so that its lines meet these conditions (regular expressions):

      - a line matches ^Defaults\s+logfile="/var/log/sudo.log"
  - id: "CIS-AMAZON2023-4.3.3-log_sudoers_d"
    name: "log sudoers d: grep -c '^Defaults logfile=/var/log/*.log' /etc/sudoers.d/.*/"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.3.3."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -c '^Defaults logfile=/var/log/*.log' /etc/sudoers.d/.*/
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ [1:99]" }
    rationale: &rat-73ffb83e75 |
      A dedicated sudo log file records every sudo invocation with user, terminal, working directory and command. That makes privileged activity easy to review and keeps the record separate from general system logs.
    remediation: &rem-b7aaa6ded0 |
      Configure a dedicated sudo log file under /var/log in a Defaults line of its own and validate the syntax.

      echo 'Defaults logfile="/var/log/sudo.log"' > /etc/sudoers.d/50-logfile
      chmod 0440 /etc/sudoers.d/50-logfile
      visudo -c
  - id: "CIS-AMAZON2023-4.3.4-sudoers_reauth-attrs"
    name: "/etc/sudoers: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.3.4."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/sudoers'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-4efcb05786 |
      The !authenticate option lets users run sudo commands without entering their password. A hijacked session or malicious script running as that user then gets root immediately. Requiring authentication adds a barrier and confirms the user's intent.
    remediation: *rem-b6090d151e
  - id: "CIS-AMAZON2023-4.3.4-sudoers_reauth-content"
    name: "/etc/sudoers has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.3.4."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/sudoers'
    allow_rc: any
    expect: { none: "~ !authenticate" }
    rationale: *rat-4efcb05786
    remediation: &rem-5c6c68c245 |
      Edit /etc/sudoers so that its lines meet these conditions (regular expressions):

      - no line matches !authenticate
  - id: "CIS-AMAZON2023-4.3.4-sudoers_reauth_d"
    name: "sudoers reauth d: grep authenticate /etc/sudoers.d/*"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.3.4."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep authenticate /etc/sudoers.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ !authenticate" }
    rationale: &rat-d2cd9e9d0a |
      Drop-in files in /etc/sudoers.d can disable authentication with !authenticate for users or commands, which allows privilege escalation without a password from any compromised session of those users. All sudo rules should require the user to authenticate.
    remediation: &rem-bfbd9b08d3 |
      Remove every !authenticate option from the files in /etc/sudoers.d/. The check also needs at least one line mentioning authenticate there, so add an explicit default.

      grep -n 'authenticate' /etc/sudoers.d/*
      visudo -f /etc/sudoers.d/FILE
      echo 'Defaults authenticate' > /etc/sudoers.d/50-authenticate
      chmod 0440 /etc/sudoers.d/50-authenticate
      visudo -c
  - id: "CIS-AMAZON2023-4.3.5-sudo_timeout"
    name: "sudo timeout: grep -rP \"timestamp_timeout=\\K[0-9]*\" /etc/sudoers*"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.3.5."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -rP "timestamp_timeout=\K[0-9]*" /etc/sudoers*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ timestamp_timeout=(-1|1[6-9]|[2-9][0-9]|[1-9][0-9]{2,})" }
      - { some: "~ timestamp_timeout=([5-9]|1[0-5])" }
    rationale: &rat-14f3ec7a75 |
      After a successful authentication, sudo caches the credentials for a while so that further commands do not ask for the password again. A long or unlimited cache lets anyone with access to an unattended terminal run privileged commands. Keeping the timeout at 15 minutes or less limits that window while staying practical for administrators.
    remediation: &rem-391bdc9433 |
      Set the sudo credential cache timeout to 15 minutes or less in a sudoers drop-in file, and remove larger or negative timestamp_timeout values from all other sudoers files.

      grep -rn 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/
      echo 'Defaults timestamp_timeout=15' > /etc/sudoers.d/50-timestamp-timeout
      chmod 0440 /etc/sudoers.d/50-timestamp-timeout
      visudo -c

      Write the value without spaces around the equals sign; the check searches for timestamp_timeout=VALUE literally.
  - id: "CIS-AMAZON2023-4.3.6-su_restricted-attrs"
    name: "/etc/pam.d/su: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.3.6."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/pam.d/su'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-6eefed9126 |
      Without restriction, every local user can try to become root or another user with su, which turns su into a tool for password guessing and lateral movement. Requiring membership in a dedicated group through pam_wheel limits su to explicitly authorised people and pushes everyone else towards sudo, which is better controlled and logged.
    remediation: &rem-d67efd69b0 |
      Create /etc/pam.d/su.
  - id: "CIS-AMAZON2023-4.3.6-su_restricted-content"
    name: "/etc/pam.d/su has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.3.6."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/pam.d/su'
    allow_rc: any
    expect: { some: "~ ^auth.*required.*pam_wheel.so\\suse_uid\\sgroup=nosugroup" }
    rationale: *rat-6eefed9126
    remediation: &rem-40aecc033e |
      Edit /etc/pam.d/su so that its lines meet these conditions (regular expressions):

      - a line matches ^auth.*required.*pam_wheel.so\suse_uid\sgroup=nosugroup
  - id: "CIS-AMAZON2023-4.3.6-sugroup_etc_group"
    name: "The group that pam_wheel allows to use su has no members"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.3.6."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      g=$(sed -nE 's/^[[:space:]]*auth[[:space:]]+(required|requisite)[[:space:]]+pam_wheel\.so[[:space:]](.*[[:space:]])?group=([^[:space:]]+).*/\3/p' /etc/pam.d/su 2>/dev/null | head -n 1)
      if [ -z "$g" ]; then echo "pam_wheel in /etc/pam.d/su names no group"; exit 0; fi
      e=$(getent group "$g")
      if [ -z "$e" ]; then echo "group $g does not exist"; exit 0; fi
      echo "$e" | awk -F: '$4 != "" {print "group " $1 " has members: " $4}'
    allow_rc: any
    expect: empty
    rationale: &rat-575a3911d0 |
      Restricting su with pam_wheel to members of a dedicated group prevents ordinary users from switching to root or other accounts by guessing or knowing their passwords. Using an empty group makes su usable only by root, so administrators must use sudo, which is logged per user. The group must exist and have no members.
    remediation: &rem-80fba87223 |
      Create a group without members and restrict su to it with pam_wheel in /etc/pam.d/su. The group can have any name; sugroup is an example.

      groupadd sugroup
      gpasswd -M '' sugroup
      grep -Eq '^\s*auth\s+(required|requisite)\s+pam_wheel\.so\s.*group=' /etc/pam.d/su || sed -i '/^auth\s\+sufficient\s\+pam_rootok.so/a auth required pam_wheel.so use_uid group=sugroup' /etc/pam.d/su

      If pam_wheel already names a group, remove its members instead: gpasswd -M '' GROUP.
  - id: "CIS-AMAZON2023-4.4.1-custom_profile"
    name: "custom profile: head -1 /etc/authselect/authselect.conf | grep 'custom/'"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.4.1."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      head -1 /etc/authselect/authselect.conf | grep 'custom/'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^custom\\/.*" }
    rationale: &rat-fada3d149c |
      authselect manages the PAM and nsswitch configuration from profiles. Changes made directly to files of a stock profile are overwritten when authselect applies it again, silently undoing hardening. A custom profile keeps site-specific PAM settings under authselect control and persistent across updates.
    remediation: &rem-f55f04b4fa |
      Create a custom authselect profile based on the current one and select it, keeping the currently enabled features.

      authselect current
      authselect create-profile cis -b sssd
      authselect select custom/cis $(authselect current --raw | cut -s -d' ' -f2-)

      Use the base profile reported by authselect current instead of sssd if it differs. If authselect refuses because files were edited manually, review the changes and add --force.
