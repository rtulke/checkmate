    rationale: *rat-69c8f28b04
    remediation: &rem-88e6a02957 |
      Edit /etc/ssh/sshd_config or a file in /etc/ssh/sshd_config.d/ (the first value of a setting wins) so that its lines meet these conditions (regular expressions):

      - a line matches ^LoginGraceTime ([1-9]|[1-5][0-9])
  - id: "CIS-AMAZON2023-4.2.20-sshd_config_idle_timeout-attrs"
    name: "/etc/ssh/sshd_config: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.2.20."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f4075c7069 |
      ClientAliveInterval and ClientAliveCountMax make sshd probe idle clients and drop connections that stop responding. This cleans up dead sessions and limits the time an unattended or orphaned session remains usable by someone else.
    remediation: *rem-f6392187bb
  - id: "CIS-AMAZON2023-4.2.20-sshd_config_idle_timeout-content"
    name: "/etc/ssh/sshd_config has the expected content (2 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.2.20."
