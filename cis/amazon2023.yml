    rationale: *rat-a6ec3e0c94
    remediation: &rem-141169957d |
      Edit /etc/pam.d/system-auth so that its lines meet these conditions (regular expressions):

      - a line matches ^password\s+sufficient\s+pam_unix.so sha512
      - no line matches ^password\s+sufficient\s+pam_unix.so md5
  - id: "CIS-AMAZON2023-4.6.1.1-login_passwd_expiry-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.1.1."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-8ba787d384 |
      PASS_MAX_DAYS limits how long a password remains valid for newly created accounts. Expiring passwords at least yearly limits the window in which a stolen or guessed password can be used. Existing accounts must be updated separately with chage.
    remediation: *rem-0b6bdc1798
  - id: "CIS-AMAZON2023-4.6.1.1-login_passwd_expiry-content"
    name: "/etc/login.defs has the expected content (3 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.1.1."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_MAX_DAYS\\s+365" }
      - { none: "~ ^PASS_MAX_DAYS\\s+(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9][0-9][0-9]|[1-9][0-9][0-9][0-9][0-9])" }
      - { none: "~ ^PASS_MAX_DAYS\\s+-1" }
    rationale: *rat-8ba787d384
    remediation: &rem-f1c03a2be4 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_MAX_DAYS\s+365
      - no line matches ^PASS_MAX_DAYS\s+(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9][0-9][0-9]|[1-9][0-9][0-9][0-9][0-9])
      - no line matches ^PASS_MAX_DAYS\s+-1
  - id: "CIS-AMAZON2023-4.6.1.2-login_passwd_change-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.1.2."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-590e01d08d |
      PASS_MIN_DAYS prevents users from changing their password again immediately. Without a minimum age, users can cycle through several changes in a row to get back to their old password and circumvent password history.
    remediation: *rem-0b6bdc1798
  - id: "CIS-AMAZON2023-4.6.1.2-login_passwd_change-content"
    name: "/etc/login.defs has the expected content (2 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.1.2."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_MIN_DAYS\\s+1" }
      - { none: "~ ^PASS_MIN_DAYS\\s+0" }
    rationale: *rat-590e01d08d
    remediation: &rem-e6a487ac26 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_MIN_DAYS\s+1
      - no line matches ^PASS_MIN_DAYS\s+0
  - id: "CIS-AMAZON2023-4.6.1.3-login_expire_warn-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.1.3."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-fd60ebf51a |
      PASS_WARN_AGE controls how many days before expiry users are warned to change their password. A warning period of seven days gives users time to choose a good new password instead of being locked out or rushed into a weak choice.
    remediation: *rem-0b6bdc1798
  - id: "CIS-AMAZON2023-4.6.1.3-login_expire_warn-content"
    name: "/etc/login.defs has the expected content (2 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.1.3."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_WARN_AGE\\s*7" }
      - { none: "~ ^PASS_WARN_AGE\\s*[1-6]" }
    rationale: *rat-fd60ebf51a
    remediation: &rem-52765d33ac |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_WARN_AGE\s*7
      - no line matches ^PASS_WARN_AGE\s*[1-6]
  - id: "CIS-AMAZON2023-4.6.1.4-inactive_passwd"
    name: "inactive passwd: useradd -D | grep INACTIVE"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.1.4."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      useradd -D | grep INACTIVE
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^INACTIVE=[1-30]" }
    rationale: &rat-1b1499cc8f |
      The default INACTIVE value used by useradd defines how many days after password expiry an account is disabled. Disabling unused accounts automatically removes forgotten access paths that attackers like to exploit; a value of up to 30 or 45 days, depending on the policy, balances security and usability.
    remediation: &rem-728ced36b8 |
      Set the default password inactivity period for new accounts to 30 days and apply the same value to existing accounts that have a password.

      useradd -D -f 30
      useradd -D | grep INACTIVE
      chage --inactive 30 USER

      30 days satisfies every supported release; some releases also accept up to 45 days.
  - id: "CIS-AMAZON2023-4.6.1.4-inactive_users"
    name: "inactive users: grep -E ^[^:]+:[^\\!*] /etc/shadow | grep -vw root | cut -d : -f1,7"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.1.4."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -E ^[^:]+:[^\!*] /etc/shadow | grep -vw root | cut -d : -f1,7
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-c4a4e8be14 |
      Accounts whose password has expired but which remain usable indefinitely are a common foothold for attackers because nobody notices their misuse. Setting a password inactivity period on every account with a password ensures that such accounts are disabled automatically after expiry.
    remediation: &rem-4e712889d3 |
      Set a password inactivity period of 30 days or less on every account that has a password, in particular on each account reported by the check.

      awk -F: '($2 ~ /^\$/) {print $1, $7}' /etc/shadow
      chage --inactive 30 USER

      Set the default for new accounts as well with useradd -D -f 30.
  - id: "CIS-AMAZON2023-4.6.1.5-passwd_chg_past"
    name: "No user has a last password change date in the future"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.1.5."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      now=$(date +%s)
      for usr in $(cut -d: -f1 /etc/shadow); do
        d=$(chage --list "$usr" 2>/dev/null | awk -F': ' '/^Last password change/ {print $2}')
        case "$d" in ""|never|*"must be changed"*) continue ;; esac
        t=$(date -d "$d" +%s 2>/dev/null) || { echo "$usr: cannot parse last password change '$d'"; continue; }
        if [ "$t" -gt "$now" ]; then echo "$usr: last password change $d is in the future"; fi
      done
    expect: empty
    rationale: &rat-eae9c8e6b4 |
      If the recorded date of the last password change lies in the future, password ageing does not work: the password never expires and the user cannot be forced to change it. Such dates usually result from a wrong system clock or manual edits and should be corrected.
    remediation: &rem-8950b282e3 |
      Check the system clock, then set the last password change of every listed user to today, or expire the password so it must be changed at the next login:

      chage --lastday "$(date +%Y-%m-%d)" USER
      chage --lastday 0 USER
  - id: "CIS-AMAZON2023-4.6.2-secure_system_LK"
    name: "secure system LK: /awk -F: '$3\u003c1000' /etc/passwd | egrep -wv 'root' | cut -d: -f1 | xargs -I '{}' passwd -S…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.2."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      /awk -F: '$3<1000' /etc/passwd | egrep -wv 'root' | cut -d: -f1 | xargs -I '{}' passwd -S '{}' | egrep -cvw 'LK|L'/
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ 0" }
    rationale: &rat-fac0721bde |
      System accounts exist to own files and run services; they are not meant for interactive logins. Locking their passwords ensures that nobody can authenticate as such an account with a password, which removes a class of easily overlooked access paths.
    remediation: &rem-c1d7b7b88a |
      Lock the password of every system account (UID below 1000, except root) that is not locked yet.

      awk -F: '($3 < 1000 && $1 != "root") {print $1}' /etc/passwd | xargs -n 1 passwd -S
      usermod -L USER

      Locking disables password authentication only; services running under these accounts keep working.
  - id: "CIS-AMAZON2023-4.6.2-secure_system_accts"
    name: "secure system accts: /awk -F: '$3\u003c1000' /etc/passwd | egrep -v 'root|sync|halt|shutdown|/sbin/nologin|/bin/fal…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.2."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      /awk -F: '$3<1000' /etc/passwd | egrep -v 'root|sync|halt|shutdown|/sbin/nologin|/bin/false'/
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-6f6bd67ce7 |
      System and service accounts do not need an interactive shell. If one of them has a valid login shell, a weakness in a service or a misconfigured password can give an attacker an interactive session under that account. Setting the shell to nologin prevents this.
    remediation: &rem-3badb6c42f |
      Set the login shell of every system account reported by the check to /sbin/nologin.

      awk -F: '($3 < 1000) {print $1, $7}' /etc/passwd
      usermod -s /sbin/nologin USER

      Accounts root, sync, shutdown and halt are exempt. Make sure no service needs an interactive shell for the account before changing it.
  - id: "CIS-AMAZON2023-4.6.3-etc_profile.d_tmout.sh-attrs"
    name: "/etc/profile.d/tmout.sh: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.3."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/profile.d/tmout.sh'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f83d06fbd2 |
      Shell sessions left open on an unattended terminal can be misused by anyone passing by. Setting TMOUT to 900 seconds or less, read-only and exported, makes the shell terminate idle sessions automatically and prevents users from switching the timeout off.
    remediation: &rem-d92e4786c7 |
      Create /etc/profile.d/tmout.sh.
  - id: "CIS-AMAZON2023-4.6.3-etc_profile.d_tmout.sh-content"
    name: "/etc/profile.d/tmout.sh has the expected content (3 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.3."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/profile.d/tmout.sh'
    allow_rc: any
    expect:
      - { some: "~ TMOUT=([1-8][0-9]{0,2}|900)" }
      - { some: "~ readonly TMOUT" }
      - { some: "~ export TMOUT" }
    rationale: *rat-f83d06fbd2
    remediation: &rem-afcb85671c |
      Edit /etc/profile.d/tmout.sh so that its lines meet these conditions (regular expressions):

      - a line matches TMOUT=([1-8][0-9]{0,2}|900)
      - a line matches readonly TMOUT
      - a line matches export TMOUT
  - id: "CIS-AMAZON2023-4.6.4-root"
    name: "User root has UID 0 and GID 0"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.4."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      getent passwd root
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ ^root:[^:]*:0:0:"
    rationale: &rat-d7d4d06032 |
      Many system components, file ownerships and administrative procedures assume a root account with UID 0 exists. Its presence is a prerequisite for the other root-related checks, such as password and login restrictions, to be meaningful.
    remediation: &rem-f77400a1aa |
      Make GID 0 the primary group of root:

      usermod -g 0 root

      root must have the UID 0. A different UID means the account database was changed; compare /etc/passwd with a backup and correct the entry with vipw instead of renumbering files.
  - id: "CIS-AMAZON2023-4.6.5-etc_profile-attrs"
    name: "/etc/profile: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.5."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/profile'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-77bded2eb5 |
      The default umask determines the permissions of files that users create. A restrictive umask such as 027 or 077 in /etc/profile prevents new files from being readable or writable by other users by default, reducing accidental data exposure.
    remediation: &rem-764ba5dedf |
      Create /etc/profile.
  - id: "CIS-AMAZON2023-4.6.5-etc_profile-content"
    name: "/etc/profile has the expected content (2 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.5."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/profile'
    allow_rc: any
    expect:
      - { some: "~ ^(\\s+|)umask\\s0(2|7)(2|7)" }
      - { none: "~ ^(\\s+|)umask\\s[1-7][0-7][0-7]" }
    rationale: *rat-77bded2eb5
    remediation: &rem-cfda09167b |
      Edit /etc/profile so that its lines meet these conditions (regular expressions):

      - a line matches ^(\s+|)umask\s0(2|7)(2|7)
      - no line matches ^(\s+|)umask\s[1-7][0-7][0-7]
  - id: "CIS-AMAZON2023-4.6.6-root_pw_set"
    name: "root pw set: passwd -S root | grep \"Password set\""
    description: "CIS Amazon Linux 2023 benchmark recommendation 4.6.6."
    tags: [cis, cis-amazon2023, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      passwd -S root | grep "Password set"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^root.*Password set.*crypt" }
    rationale: &rat-7899c1d3cf |
      If root has no password, or a locked one, the system may be unrecoverable from the console in an emergency or, depending on configuration, allow passwordless root access in single-user mode. A set, strongly hashed root password ensures that root access always requires a credential.
    remediation: &rem-8df0db776a |
      Set a strong password for root.

      passwd root
      passwd -S root

      On cloud images root is often locked deliberately; setting a password enables console and single-user logins for root, so store it securely.
  - id: "CIS-AMAZON2023-5.1.1.1-rsyslog"
    name: "Package rsyslog is installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.1.1."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet rsyslog
    expect: true
    rationale: &rat-ec4e2f2832 |
      rsyslog collects log messages from the kernel, services and applications, writes them to files and can forward them to a central log server. Without an installed, enabled and running syslog daemon, security-relevant events are not recorded in a durable way and incidents cannot be investigated.
    remediation: &rem-9fc091c437 |
      Install the package rsyslog:

      dnf install rsyslog
  - id: "CIS-AMAZON2023-5.1.1.1-rsyslog-enabled"
    name: "Service rsyslog is enabled"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.1.1."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemctl show -p UnitFileState rsyslog | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-ec4e2f2832
    remediation: &rem-092ce033e4 |
      Enable the service rsyslog:

      systemctl enable rsyslog
  - id: "CIS-AMAZON2023-5.1.1.1-rsyslog-running"
    name: "Service rsyslog is running"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.1.1."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemctl show -p ActiveState rsyslog | cut -d= -f2
    expect: "== active"
    rationale: *rat-ec4e2f2832
    remediation: &rem-e1b56d94f4 |
      Start the service rsyslog:

      systemctl start rsyslog
  - id: "CIS-AMAZON2023-5.1.1.3-etc_systemd_journald.conf-attrs"
    name: "/etc/systemd/journald.conf: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.1.3."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/systemd/journald.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d0ced83513 |
      journald settings decide whether logs are forwarded to a syslog daemon, compressed and stored persistently. If logs are not forwarded or only kept in memory, they are lost on reboot or never reach central log collection, which hinders incident investigation.
    remediation: &rem-91341b96af |
      Create /etc/systemd/journald.conf.
  - id: "CIS-AMAZON2023-5.1.1.3-etc_systemd_journald.conf-content"
    name: "/etc/systemd/journald.conf has the expected content (2 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.1.3."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/systemd/journald.conf'
    allow_rc: any
    expect:
      - { some: "~ ^ForwardToSyslog=yes" }
      - { none: "~ ^ForwardToSyslog=[Nn][Oo]" }
    rationale: *rat-d0ced83513
    remediation: &rem-c62806d8f6 |
      Edit /etc/systemd/journald.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^ForwardToSyslog=yes
      - no line matches ^ForwardToSyslog=[Nn][Oo]
  - id: "CIS-AMAZON2023-5.1.1.4-rsyslog_perms-attrs"
    name: "/etc/rsyslog.conf: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.1.4."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/rsyslog.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-3eb947b283 |
      $FileCreateMode sets the permissions of log files that rsyslog creates. Logs often contain user names, IP addresses and other sensitive information, so new files should be readable only by root and, if needed, an administrative group (0640 or stricter).
    remediation: &rem-d45052d244 |
      Create /etc/rsyslog.conf.
  - id: "CIS-AMAZON2023-5.1.1.4-rsyslog_perms-content"
    name: "/etc/rsyslog.conf has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.1.4."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/rsyslog.conf'
    allow_rc: any
    expect: { some: "~ \\$FileCreateMode 0[0,6][0,4]0" }
    rationale: *rat-3eb947b283
    remediation: &rem-7c7543bc25 |
      Edit /etc/rsyslog.conf so that its lines meet these conditions (regular expressions):

      - a line matches \$FileCreateMode 0[0,6][0,4]0
  - id: "CIS-AMAZON2023-5.1.1.5-rsyslog_logging_config-attrs"
    name: "/etc/rsyslog.conf: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.1.5."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/rsyslog.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-9842b8a595 |
      rsyslog rules decide which messages are written where. Sending authentication, mail, warning, critical and local facility messages to dedicated files ensures important events are recorded and can be found when investigating an incident, and emergencies are broadcast to logged-in users.
    remediation: *rem-d45052d244
  - id: "CIS-AMAZON2023-5.1.1.5-rsyslog_logging_config-content"
    name: "/etc/rsyslog.conf has the expected content (13 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.1.5."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/rsyslog.conf'
    allow_rc: any
    expect:
      - { some: "~ ^mail.\\*\\s+-/var/log/mail" }
      - { some: "~ ^auth,authpriv.\\*\\s+\\/var\\/log/secure" }
      - { some: "~ ^mail.info\\s+-\\/var\\/log\\/mail.info" }
      - { some: "~ ^mail.warning\\s+-\\/var\\/log\\/mail.warn" }
      - { some: "~ ^mail.err\\s+\\/var\\/log\\/mail.err" }
      - { some: "~ ^\\*.=warning;\\*.=err\\s+-\\/var\\/log\\/warn" }
      - { some: "~ ^\\*.crit\\s+\\/var\\/log\\/warn" }
      - { some: "~ ^\\*.*;mail.none;news.none\\s+\\/var\\/log\\/messages" }
      - { some: "~ ^local0,local1.\\*\\s+-\\/var\\/log\\/localmessages" }
      - { some: "~ ^local2,local3.\\*\\s+-\\/var\\/log\\/localmessages" }
      - { some: "~ ^local4,local5.\\*\\s+-\\/var\\/log\\/localmessages" }
      - { some: "~ ^local6,local7.\\*\\s+-\\/var\\/log\\/localmessages" }
      - { some: "~ ^\\*.emerg\\s+\\:omusrmsg\\:\\*" }
    rationale: *rat-9842b8a595
    remediation: &rem-a7e797ec38 |
      Edit /etc/rsyslog.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^mail.\*\s+-/var/log/mail
      - a line matches ^auth,authpriv.\*\s+\/var\/log/secure
      - a line matches ^mail.info\s+-\/var\/log\/mail.info
      - a line matches ^mail.warning\s+-\/var\/log\/mail.warn
      - a line matches ^mail.err\s+\/var\/log\/mail.err
      - a line matches ^\*.=warning;\*.=err\s+-\/var\/log\/warn
      - a line matches ^\*.crit\s+\/var\/log\/warn
      - a line matches ^\*.*;mail.none;news.none\s+\/var\/log\/messages
      - a line matches ^local0,local1.\*\s+-\/var\/log\/localmessages
      - a line matches ^local2,local3.\*\s+-\/var\/log\/localmessages
      - a line matches ^local4,local5.\*\s+-\/var\/log\/localmessages
      - a line matches ^local6,local7.\*\s+-\/var\/log\/localmessages
      - a line matches ^\*.emerg\s+\:omusrmsg\:\*
  - id: "CIS-AMAZON2023-5.1.1.6-remote_syslog"
    name: "remote syslog: grep \"^*.*[^I][^I]*@\" /etc/rsyslog.conf /etc/rsyslog.d/*.conf"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.1.6."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep "^*.*[^I][^I]*@" /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ \\*\\.\\* @@*." }
    rationale: &rat-de6c4769ee |
      Logs kept only on the host can be deleted or altered by an attacker who has gained control of it, and they are lost if the system fails. Forwarding messages to a central log server keeps an independent copy and allows correlation of events across systems.
    remediation: &rem-e4df08c340 |
      Forward all messages to the central log server over TCP with an rsyslog drop-in file and restart rsyslog. Replace LOGHOST with the name of your log server.

      Amazon Linux 2 and RHEL 9:
      echo '*.* action(type="omfwd" target="LOGHOST" port="514" protocol="tcp" action.resumeRetryCount="100" queue.type="LinkedList" queue.size="1000")' > /etc/rsyslog.d/60-remote.conf

      Amazon Linux 2023 and RHEL 7:
      echo '*.* @@LOGHOST:514' > /etc/rsyslog.d/60-remote.conf

      systemctl restart rsyslog

      On Amazon Linux 2 and RHEL 9 the check compares the target with a fixed example host name (loghost.example.com or logagg.example.com); the policy has to be adapted to the real log server.
  - id: "CIS-AMAZON2023-5.1.1.7-syslog_TCPServerRun"
    name: "syslog TCPServerRun: grep '$InputTCPServerRun' /etc/rsyslog.conf /etc/rsyslog.d/*.conf"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.1.7."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep '$InputTCPServerRun' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*[^#]?(| )\\$InputTCPServerRun" }
      - { some: "~ .*:#(| )\\$InputTCPServerRun" }
    rationale: &rat-d0b74f356a |
      Only designated log servers should accept syslog messages from the network. If a regular host listens for remote syslog over TCP, anyone who can reach it can inject false entries or fill the disk. The legacy $InputTCPServerRun directive should therefore be disabled on clients.
    remediation: &rem-586a05961c |
      Comment out every $InputTCPServerRun directive in the rsyslog configuration (unless the host is a log server) and restart rsyslog. The check passes only when a commented-out directive is present, so keep or add the commented line.

      grep -n 'InputTCPServerRun' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      sed -i 's/^\s*\$InputTCPServerRun/#$InputTCPServerRun/' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      grep -q '^#\s*\$InputTCPServerRun' /etc/rsyslog.conf || echo '#$InputTCPServerRun 514' >> /etc/rsyslog.conf
      systemctl restart rsyslog

      Also remove any input(type="imtcp" ...) statements. The check fails with an error if /etc/rsyslog.d/ contains no .conf file.
  - id: "CIS-AMAZON2023-5.1.1.7-syslog_imtcp"
    name: "syslog imtcp: grep '$ModLoad imtcp' /etc/rsyslog.conf /etc/rsyslog.d/*.conf"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.1.7."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep '$ModLoad imtcp' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*:#(| )\\$ModLoad imtcp" }
    rationale: &rat-9955889d9b |
      The imtcp module lets rsyslog receive log messages over TCP from the network. On hosts that are not log servers this opens an unnecessary listener through which attackers could inject forged log entries or exhaust disk space. The module should not be loaded.
    remediation: &rem-3c52234df8 |
      Comment out every $ModLoad imtcp directive in the rsyslog configuration (unless the host is a log server) and restart rsyslog. The check passes only when a commented-out directive is present, so keep or add the commented line.

      grep -n 'imtcp' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      sed -i 's/^\s*\$ModLoad imtcp/#$ModLoad imtcp/' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      grep -q '^#\s*\$ModLoad imtcp' /etc/rsyslog.conf || echo '#$ModLoad imtcp' >> /etc/rsyslog.conf
      systemctl restart rsyslog

      Also remove any module(load="imtcp") statements. The check fails with an error if /etc/rsyslog.d/ contains no .conf file.
  - id: "CIS-AMAZON2023-5.1.2.1.1-systemd-journal-remote"
    name: "Package systemd-journal-remote is installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.2.1.1."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      rpm -q --quiet systemd-journal-remote
    expect: true
    rationale: &rat-c532adb37c |
      systemd-journal-remote provides systemd-journal-upload, which sends journal entries to a central collection server. Installing it is the prerequisite for keeping an off-host copy of the journal when journald is used as the logging solution.
    remediation: &rem-8e840a624e |
      Install the package systemd-journal-remote:

      dnf install systemd-journal-remote
  - id: "CIS-AMAZON2023-5.1.2.1.2-etc_systemd_journal-upload.conf-attrs"
    name: "/etc/systemd/journal-upload.conf: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.2.1.2."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/journal-upload.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-816969c5e1 |
      systemd-journal-upload sends journal entries to a central journal-remote server. The URL and TLS key and certificate settings are required so that logs are delivered to the right collector over an authenticated, encrypted connection and cannot be read or forged in transit.
    remediation: &rem-bc30e412e9 |
      Create /etc/systemd/journal-upload.conf.
  - id: "CIS-AMAZON2023-5.1.2.1.2-etc_systemd_journal-upload.conf-content"
    name: "/etc/systemd/journal-upload.conf has the expected content (4 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.2.1.2."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/systemd/journal-upload.conf'
    allow_rc: any
    expect:
      - { some: "~ ^URL=" }
      - { some: "~ /ServerKeyFile=\\.\\*\\.pem" }
      - { some: "~ /ServerCertificateFile=\\.\\*\\.pem" }
      - { some: "~ /TrustedCertificateFile=\\.\\*\\.pem" }
    rationale: *rat-816969c5e1
    remediation: &rem-7ca333f05c |
      Edit /etc/systemd/journal-upload.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^URL=
      - a line matches /ServerKeyFile=\.\*\.pem
      - a line matches /ServerCertificateFile=\.\*\.pem
      - a line matches /TrustedCertificateFile=\.\*\.pem
  - id: "CIS-AMAZON2023-5.1.2.1.3-systemd-journal-upload.service-enabled"
    name: "Service systemd-journal-upload.service is enabled"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.2.1.3."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journal-upload.service | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-b770b19f4c |
      Logs kept only on the host can be deleted or altered by an attacker who gains root. Running systemd-journal-upload continuously ships journal entries to a remote collector, preserving them off-host. It is only relevant where systemd-journal-remote is the chosen central logging method rather than rsyslog.
    remediation: &rem-c6c7c65dbe |
      Enable the service systemd-journal-upload.service:

      systemctl enable systemd-journal-upload.service
  - id: "CIS-AMAZON2023-5.1.2.1.3-systemd-journal-upload.service-running"
    name: "Service systemd-journal-upload.service is running"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.2.1.3."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journal-upload.service | cut -d= -f2
    expect: "== active"
    rationale: *rat-b770b19f4c
    remediation: &rem-7f8e123d83 |
      Start the service systemd-journal-upload.service:

      systemctl start systemd-journal-upload.service
  - id: "CIS-AMAZON2023-5.1.2.1.4-systemd-journal-remote.socket-enabled"
    name: "Service systemd-journal-remote.socket is not enabled"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.2.1.4."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journal-remote.socket | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-87dd56fa7c |
      systemd-journal-remote.socket accepts journal data from other hosts over the network. Only a designated log collector should listen for it; on other systems it is an unnecessary network service that could receive forged logs or be used to fill the disk.
    remediation: &rem-6593464f6f |
      Disable the service systemd-journal-remote.socket, unless the system needs it:

      systemctl disable systemd-journal-remote.socket

      To keep other units from starting it, mask it instead: systemctl mask systemd-journal-remote.socket
  - id: "CIS-AMAZON2023-5.1.2.1.4-systemd-journal-remote.socket-running"
    name: "Service systemd-journal-remote.socket is not running"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.2.1.4."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journal-remote.socket | cut -d= -f2
    expect: "!= active"
    rationale: *rat-87dd56fa7c
    remediation: &rem-965b15f40c |
      Stop the service systemd-journal-remote.socket, unless the system needs it:

      systemctl stop systemd-journal-remote.socket
  - id: "CIS-AMAZON2023-5.1.2.1.4-journald_socket_masked"
    name: "journald socket masked: systemctl is-enabled systemd-journal-remote.socket"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.2.1.4."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl is-enabled systemd-journal-remote.socket
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ ^masked" }
    rationale: &rat-9ba854dbda |
      systemd-journal-remote.socket lets the host receive journal entries from other systems. Masking it on systems that are not log collectors prevents the listener from being started, even indirectly by another unit, and removes an unnecessary network service.
    remediation: &rem-2d1745ded8 |
      Unless this host collects journals from other systems, stop the journal remote receiver and mask its socket and service so that they cannot be started.

      systemctl stop systemd-journal-remote.socket systemd-journal-remote.service
      systemctl mask systemd-journal-remote.socket systemd-journal-remote.service
  - id: "CIS-AMAZON2023-5.1.2.2-systemd-journald-enabled"
    name: "Service systemd-journald is enabled"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.2.2."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState systemd-journald | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-aa9c4cf1bc |
      systemd-journald collects kernel, service and user log messages and passes them to persistent storage or syslog. If it is not running, events from services and the kernel are lost, leaving gaps in the audit trail. It is a static unit that is always started by systemd.
    remediation: &rem-509c775265 |
      Enable the service systemd-journald:

      systemctl enable systemd-journald
  - id: "CIS-AMAZON2023-5.1.2.2-systemd-journald-running"
    name: "Service systemd-journald is running"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.2.2."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journald | cut -d= -f2
    expect: "== active"
    rationale: *rat-aa9c4cf1bc
    remediation: &rem-062cd16446 |
      Start the service systemd-journald:

      systemctl start systemd-journald
  - id: "CIS-AMAZON2023-5.1.2.3-compress_journald_conf"
    name: "compress journald conf: grep -i compress /etc/systemd/journald.conf"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.2.3."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i compress /etc/systemd/journald.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Compress=yes" }
      - { none: "~ ^Compress=[Nn][Oo]" }
    rationale: &rat-fc8701ed62 |
      Compressing large journal entries reduces the disk space the persistent journal needs, so more history fits within the configured limits and the log partition is less likely to fill. Running out of log space leads to lost records or service problems.
    remediation: &rem-50e753a726 |
      Set Compress=yes in /etc/systemd/journald.conf (the Amazon Linux 2023 check reads only that file) and in a drop-in (the RHEL checks fail if /etc/systemd/journald.conf.d/ is empty), then restart journald.

      sed -i 's/^#\?\s*Compress\s*=.*/Compress=yes/' /etc/systemd/journald.conf
      grep -q '^Compress=yes' /etc/systemd/journald.conf || echo 'Compress=yes' >> /etc/systemd/journald.conf
      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nCompress=yes\n' > /etc/systemd/journald.conf.d/60-compress.conf
      systemctl restart systemd-journald
  - id: "CIS-AMAZON2023-5.1.2.4-storage_journald_conf"
    name: "storage journald conf: grep -i storage /etc/systemd/journald.conf"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.2.4."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i storage /etc/systemd/journald.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Storage=persistent" }
    rationale: &rat-cda501aacd |
      With volatile or automatic storage, journald may keep logs only in /run, so they are lost at every reboot, including the events that led up to a crash or compromise. Storage=persistent writes the journal to /var/log/journal so the history survives restarts.
    remediation: &rem-ca3d937c53 |
      Set Storage=persistent in /etc/systemd/journald.conf (the Amazon Linux 2023 check reads only that file) and in a drop-in (the RHEL checks fail if /etc/systemd/journald.conf.d/ is empty), then restart journald.

      sed -i 's/^#\?\s*Storage\s*=.*/Storage=persistent/' /etc/systemd/journald.conf
      grep -q '^Storage=persistent' /etc/systemd/journald.conf || echo 'Storage=persistent' >> /etc/systemd/journald.conf
      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nStorage=persistent\n' > /etc/systemd/journald.conf.d/60-storage.conf
      systemctl restart systemd-journald
  - id: "CIS-AMAZON2023-5.1.2.5-forward_journald_conf"
    name: "forward journald conf: grep -i forward /etc/systemd/journald.conf"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.2.5."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -i forward /etc/systemd/journald.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^\\s*ForwardToSyslog" }
    rationale: &rat-62b6840396 |
      Logs must flow through exactly one well-defined path. Where rsyslog is the log processor (RHEL), journald must forward messages to it with ForwardToSyslog=yes so they reach the syslog files and remote collectors. Where journald alone handles logging (the Amazon Linux 2023 variant), forwarding is expected to be left unset to avoid duplicate or unintended processing.
    remediation: &rem-2851c29856 |
      On RHEL, configure journald to forward messages to rsyslog in a drop-in and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '[Journal]\nForwardToSyslog=yes\n' > /etc/systemd/journald.conf.d/60-forward.conf
      systemctl restart systemd-journald

      On Amazon Linux 2023 the check expects the opposite: comment out any active ForwardToSyslog line in /etc/systemd/journald.conf (sed -i 's/^\s*ForwardToSyslog/#ForwardToSyslog/' /etc/systemd/journald.conf) and restart journald.
  - id: "CIS-AMAZON2023-5.1.2.6-log_rotate_journald_conf"
    name: "log rotate journald conf: grep -Ei \"max|keep\" /etc/systemd/journald.conf"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.2.6."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Ei "max|keep" /etc/systemd/journald.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^SystemMaxUse=" }
      - { some: "~ ^SystemKeepFree=" }
      - { some: "~ ^RuntimeMaxUse=" }
      - { some: "~ ^RuntimeKeepFree=" }
      - { some: "~ ^MaxFileSec=" }
    rationale: &rat-7192c1da81 |
      Without size and retention limits, the journal can grow until it fills its file system, which may stop services or cause new log records to be dropped. SystemMaxUse, SystemKeepFree, RuntimeMaxUse, RuntimeKeepFree and MaxFileSec bound disk usage and rotate journal files regularly in line with the retention policy.
    remediation: &rem-5c5f534192 |
      Set all five journal size and rotation limits in /etc/systemd/journald.conf (the Amazon Linux 2023 check reads only that file) and restart journald. Adjust the values to the site's retention policy.

      sed -ri '/^#?\s*(SystemMaxUse|SystemKeepFree|RuntimeMaxUse|RuntimeKeepFree|MaxFileSec)\s*=/d' /etc/systemd/journald.conf
      printf '%s\n' 'SystemMaxUse=1G' 'SystemKeepFree=500M' 'RuntimeMaxUse=200M' 'RuntimeKeepFree=50M' 'MaxFileSec=1month' >> /etc/systemd/journald.conf
      systemctl restart systemd-journald
  - id: "CIS-AMAZON2023-5.1.3-logfile_configured"
    name: "logfile configured: find /var/log/ -type f -perm /g+wx,o+rwx -exec ls -l \"{}\" + | grep -Ev \"[b,u,w]tmp.*|last…"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.1.3."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /var/log/ -type f -perm /g+wx,o+rwx -exec ls -l "{}" + | grep -Ev "[b,u,w]tmp.*|lastllog"
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-0de5450138 |
      Log files can contain sensitive data and are important evidence after a security incident. If they are writable or readable by unauthorised users, information leaks and logs can be altered or deleted to hide an attack. Access to files under /var/log should be limited to what each kind of log needs.
    remediation: &rem-42ace0ab21 |
      Review every file listed by the check and remove the excess permissions. General and authentication logs should be 0640 or stricter; lastlog, wtmp and btmp may keep group write (0664) for the utmp group.

      chmod u-x,g-wx,o-rwx FILE
      chmod g-x,o-wx /var/log/lastlog /var/log/wtmp /var/log/btmp

      Also adjust the creating service and the create directives in /etc/logrotate.conf and /etc/logrotate.d/, otherwise the permissions come back with the next rotation. On RHEL 7, Ubuntu 18.04 (and for lastlog on Amazon Linux 2023) the check also flags group write on these login records; remove it there with chmod g-w if accepted.
  - id: "CIS-AMAZON2023-5.2.1.1-audit"
    name: "Package audit is installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.1.1."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      rpm -q --quiet audit
    expect: true
    rationale: &rat-5d5d992283 |
      The Linux audit framework records security-relevant events such as logins, privilege use, file access and configuration changes in a tamper-resistant trail. Without the audit user-space tools (audit on RPM systems, auditd on Debian and Ubuntu), these events cannot be collected, which makes detecting and investigating incidents far harder.
    remediation: &rem-1518bbb26a |
      Install the package audit:

      dnf install audit
  - id: "CIS-AMAZON2023-5.2.1.1-audit-libs"
    name: "Package audit-libs is installed"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.1.1."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      rpm -q --quiet audit-libs
    expect: true
    rationale: &rat-5f843a11e3 |
      audit-libs provides the libraries through which PAM, sshd, sudo and other programs send audit events to the kernel. If it is missing, those components cannot emit their user-space audit records, leaving gaps in the audit trail.
    remediation: &rem-e352b7f843 |
      Install the package audit-libs:

      dnf install audit-libs
  - id: "CIS-AMAZON2023-5.2.1.2-grub_enable_audit-attrs"
    name: "/etc/default/grub: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.1.2."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-c5e6e217c0 |
      auditd starts relatively late in the boot process. Processes started before it would not be audited unless auditing is enabled on the kernel command line. audit=1 ensures that every process is auditable from the very beginning, so early malicious activity is not missed.
    remediation: &rem-2d1523887c |
      Create /etc/default/grub.
  - id: "CIS-AMAZON2023-5.2.1.2-grub_enable_audit-content"
    name: "/etc/default/grub has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.1.2."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect: { some: "~ GRUB_CMDLINE_LINUX_DEFAULT=\".*audit=1" }
    rationale: *rat-c5e6e217c0
    remediation: &rem-871df284df |
      Edit /etc/default/grub so that its lines meet these conditions (regular expressions):

      - a line matches GRUB_CMDLINE_LINUX_DEFAULT=".*audit=1
  - id: "CIS-AMAZON2023-5.2.1.3-grub_audit_backlog-attrs"
    name: "/etc/default/grub: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.1.3."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-2995c085fe |
      The kernel buffers audit records until auditd reads them. During boot or bursts of activity the default backlog of 64 records can overflow, causing records to be lost or the kernel to react according to the failure mode. audit_backlog_limit=8192 or more provides enough buffer space.
    remediation: *rem-2d1523887c
  - id: "CIS-AMAZON2023-5.2.1.3-grub_audit_backlog-content"
    name: "/etc/default/grub has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.1.3."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect: { some: "~ GRUB_CMDLINE_LINUX_DEFAULT=\".*audit_backlog_limit=8192" }
    rationale: *rat-2995c085fe
    remediation: &rem-08caf66d8a |
      Edit /etc/default/grub so that its lines meet these conditions (regular expressions):

      - a line matches GRUB_CMDLINE_LINUX_DEFAULT=".*audit_backlog_limit=8192
  - id: "CIS-AMAZON2023-5.2.1.4-auditd-enabled"
    name: "Service auditd is enabled"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.1.4."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p UnitFileState auditd | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-f809f26f23 |
      auditd is the daemon that receives audit events from the kernel and writes them to disk. If it is not installed, enabled and running, audit rules have no effect on the persistent trail, and security events go unrecorded.
    remediation: &rem-5d15604058 |
      Enable the service auditd:

      systemctl enable auditd
  - id: "CIS-AMAZON2023-5.2.1.4-auditd-running"
    name: "Service auditd is running"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.1.4."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      systemctl show -p ActiveState auditd | cut -d= -f2
    expect: "== active"
    rationale: *rat-f809f26f23
    remediation: &rem-ce273a00c5 |
      Start the service auditd:

      systemctl start auditd
  - id: "CIS-AMAZON2023-5.2.2.1-auditd_storage_size-attrs"
    name: "/etc/audit/auditd.conf: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.2.1."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-619ca47fa4 |
      max_log_file sets the size at which auditd rotates or acts on the audit log. Setting it deliberately, in line with expected audit volume and available disk space, ensures the log is managed predictably instead of growing uncontrolled or being rotated too often for retention needs.
    remediation: &rem-fdf1d22c95 |
      Create /etc/audit/auditd.conf.
  - id: "CIS-AMAZON2023-5.2.2.1-auditd_storage_size-content"
    name: "/etc/audit/auditd.conf has the expected content (2 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.2.1."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect:
      - { some: "~ ^max_log_file(| )=(| )10" }
      - { some: "~ max_log_file(| )=(| )\\d{1,6}" }
    rationale: *rat-619ca47fa4
    remediation: &rem-bff8716ecf |
      Edit /etc/audit/auditd.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^max_log_file(| )=(| )10
      - a line matches max_log_file(| )=(| )\d{1,6}
  - id: "CIS-AMAZON2023-5.2.2.2-auditd_log_deleted-attrs"
    name: "/etc/audit/auditd.conf: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.2.2."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1cbd312f6e |
      With max_log_file_action = keep_logs, auditd rotates the audit log when it reaches its size limit but never deletes old logs. This preserves the full audit history for investigations, at the price of needing disk space monitoring and archiving.
    remediation: *rem-fdf1d22c95
  - id: "CIS-AMAZON2023-5.2.2.2-auditd_log_deleted-content"
    name: "/etc/audit/auditd.conf has the expected content (1 rule)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.2.2."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect: { some: "~ max_log_file_action = keep_logs" }
    rationale: *rat-1cbd312f6e
    remediation: &rem-d69a8a78a7 |
      Edit /etc/audit/auditd.conf so that its lines meet these conditions (regular expressions):

      - a line matches max_log_file_action = keep_logs
  - id: "CIS-AMAZON2023-5.2.2.3-auditd_logs_full-attrs"
    name: "/etc/audit/auditd.conf: exists"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.2.3."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/audit/auditd.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-a2e57fc35c |
      When the audit partition runs low, auditd should warn administrators by email and, when space becomes critically low, halt the system rather than continue without auditing. This guarantees no activity happens unrecorded, but the halt action makes disk space monitoring essential to avoid outages.
    remediation: *rem-fdf1d22c95
  - id: "CIS-AMAZON2023-5.2.2.3-auditd_logs_full-content"
    name: "/etc/audit/auditd.conf has the expected content (3 rules)"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.2.3."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      cat '/etc/audit/auditd.conf'
    allow_rc: any
    expect:
      - { some: "~ ^space_left_action = email" }
      - { some: "~ ^action_mail_acct = root" }
      - { some: "~ ^admin_space_left_action = halt" }
    rationale: *rat-a2e57fc35c
    remediation: &rem-6876d7cbb4 |
      Edit /etc/audit/auditd.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^space_left_action = email
      - a line matches ^action_mail_acct = root
      - a line matches ^admin_space_left_action = halt
  - id: "CIS-AMAZON2023-5.2.3.1-auditd_admin_scope_cnf"
    name: "auditd admin scope cnf: grep scope /etc/audit/rules.d/*.rules"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.3.1."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep scope /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /etc/sudoers -p wa -k scope" }
      - { some: "~ -w /etc/sudoers\\.d -p wa -k scope" }
    rationale: &rat-7172c39fee |
      Changes to /etc/sudoers and /etc/sudoers.d alter who may run which commands with elevated privileges. Audit rules that record every write or attribute change to these files make unauthorised privilege grants detectable. This check verifies that the rules are part of the persistent audit configuration.
    remediation: &rem-944b9ef9b6 |
      Watch the sudoers configuration for changes: add the rules for your release to /etc/audit/rules.d/50-scope.rules and load them.

      Amazon Linux 2, RHEL 7 and RHEL 8:
      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d/ -p wa -k scope

      Amazon Linux 2023 and RHEL 9:
      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d -p wa -k scope

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
  - id: "CIS-AMAZON2023-5.2.3.1-auditd_admin_scope_live"
    name: "auditd admin scope live: auditctl -l | grep scope"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.3.1."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      auditctl -l | grep scope
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /etc/sudoers -p wa -k scope" }
      - { some: "~ -w /etc/sudoers\\.d -p wa -k scope" }
    rationale: &rat-6dc7f1b6de |
      Changes to /etc/sudoers and /etc/sudoers.d alter who may run which commands with elevated privileges. Audit rules that record every write or attribute change to these files make unauthorised privilege grants detectable. This check verifies that the rules are loaded in the running kernel.
    remediation: *rem-944b9ef9b6
  - id: "CIS-AMAZON2023-5.2.3.2-auditd_sudo_scope_cnf"
    name: "auditd sudo scope cnf: grep user_emu /etc/audit/rules.d/*.rules"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.3.2."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep user_emu /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation" }
      - { some: "~ -a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation" }
    rationale: &rat-7605c80404 |
      Commands executed with an effective user ID different from the real user, as with sudo, are privileged actions that should be traceable to the person who ran them. Persistent audit rules on execve with euid!=uid record such user emulation so administrators' privileged activity can be reviewed.
    remediation: &rem-c008261622 |
      Add audit rules that record commands executed as a different user to a file under /etc/audit/rules.d/ and load them.

      printf '%s\n' '-a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation' '-a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation' > /etc/audit/rules.d/50-user_emulation.rules
      augenrules --load

      If the audit configuration is immutable (-e 2), reboot to activate the rules.
  - id: "CIS-AMAZON2023-5.2.3.2-auditd_sudo_scope_live"
    name: "auditd sudo scope live: auditctl -l | grep user_emu"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.3.2."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      auditctl -l | grep user_emu
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S execve -C uid!=euid -F auid!=-1 -F key=user_emulation" }
      - { some: "~ -a always,exit -F arch=b32 -S execve -C uid!=euid -F auid!=-1 -F key=user_emulation" }
    rationale: &rat-6db668cdcd |
      Audit rules on disk only take effect once they are loaded into the kernel. Verifying the loaded rule set confirms that commands run with another user's privileges, for example through sudo, are actually being recorded right now.
    remediation: &rem-a70518d7e7 |
      Make sure the user emulation rules are configured under /etc/audit/rules.d/ and load them into the kernel.

      printf '%s\n' '-a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation' '-a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation' > /etc/audit/rules.d/50-user_emulation.rules
      augenrules --load
      auditctl -l | grep user_emulation

      If auditctl -s shows enabled 2 (immutable), reboot to activate the rules.
  - id: "CIS-AMAZON2023-5.2.3.3-auditd_modify_sudo_log_conf"
    name: "auditd modify sudo log conf: grep sudo_log /etc/audit/rules.d/*.rules"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.3.3."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep sudo_log /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /var/log/sudo\\.log -p wa -k sudo_log_file" }
    rationale: &rat-8de45c7d2c |
      The sudo log file is the record of privileged commands. Watching it for writes and attribute changes in the audit configuration makes any attempt to alter or wipe that record visible in the audit trail.
    remediation: &rem-d10ca2e1cb |
      Add an audit watch on the sudo log file to a file under /etc/audit/rules.d/ and load it.

      echo '-w /var/log/sudo.log -p wa -k sudo_log_file' > /etc/audit/rules.d/50-sudo.rules
      augenrules --load

      If the audit configuration is immutable (-e 2), reboot to activate the rule. Adjust the path if sudo logs to a different file.
  - id: "CIS-AMAZON2023-5.2.3.3-auditd_modify_sudo_log_live"
    name: "auditd modify sudo log live: auditctl -l | grep sudo_log"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.3.3."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      auditctl -l | grep sudo_log
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /var/log/sudo\\.log -p wa -k sudo_log_file" }
    rationale: &rat-37fed6aa25 |
      A watch on the sudo log only protects it once it is loaded into the kernel. Checking the active rule set confirms that changes to the record of privileged commands are currently being audited.
    remediation: &rem-e97f2344c3 |
      Make sure the sudo log watch is configured under /etc/audit/rules.d/ and load it into the kernel.

      echo '-w /var/log/sudo.log -p wa -k sudo_log_file' > /etc/audit/rules.d/50-sudo.rules
      augenrules --load
      auditctl -l | grep sudo_log

      If auditctl -s shows enabled 2 (immutable), reboot to activate the rule.
  - id: "CIS-AMAZON2023-5.2.3.4-auditd_time_cnf"
    name: "auditd time cnf: grep time-change /etc/audit/rules.d/*.rules"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.3.4."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep time-change /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime -k time-change" }
      - { some: "~ -w /etc/localtime -p wa -k time-change" }
      - { some: "~ -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time-change" }
    rationale: &rat-1630928119 |
      Reliable timestamps are essential for correlating log entries and reconstructing events. Auditing changes to the system clock and the local time zone reveals attempts to manipulate time in order to confuse log analysis or bypass time-based controls. This check verifies the persistent audit configuration.
    remediation: &rem-813d6fbc7a |
      Record changes to the system time and time zone: add the rules for your release to /etc/audit/rules.d/50-time-change.rules and load them.

      Amazon Linux 2 and Amazon Linux 2023:
      -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time-change
      -a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime -k time-change
      -w /etc/localtime -p wa -k time-change

      RHEL 7:
      -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change
      -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k time-change
      -a always,exit -F arch=b64 -S clock_settime -k time-change
      -a always,exit -F arch=b32 -S clock_settime -k time-change
      -w /etc/localtime -p wa -k time-change

      RHEL 8 and RHEL 9:
      -a always,exit -F arch=b64 -S adjtimex,settimeofday -k time-change
      -a always,exit -F arch=b32 -S adjtimex,settimeofday -k time-change
      -a always,exit -F arch=b64 -S clock_settime -F a0=0x0 -k time-change
      -a always,exit -F arch=b32 -S clock_settime -F a0=0x0 -k time-change
      -w /etc/localtime -p wa -k time-change

      RHEL 10:
      -a always,exit -F arch=b64 -S adjtimex,settimeofday -F key=time-change
      -a always,exit -F arch=b64 -S clock_settime -F a0=0x0 -F key=time-change
      -a always,exit -F arch=b64 -S all -F path=/etc/localtime -F perm=wa -F key=time-change
      -w /etc/localtime -p wa -k time-change

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
  - id: "CIS-AMAZON2023-5.2.3.4-auditd_time_live"
    name: "auditd time live: auditctl -l | grep time-change"
    description: "CIS Amazon Linux 2023 benchmark recommendation 5.2.3.4."
    tags: [cis, cis-amazon2023, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      auditctl -l | grep time-change
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b32 -S settimeofday,adjtimex,clock_settime -F key=time-change" }
      - { some: "~ -w /etc/localtime -p wa -k time-change" }
      - { some: "~ -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -F key=time-change" }
    rationale: &rat-7d6727d082 |
      Reliable timestamps are essential for correlating log entries and reconstructing events. Auditing changes to the system clock and the local time zone reveals attempts to manipulate time in order to confuse log analysis or bypass time-based controls. This check verifies the rules loaded in the running kernel.
    remediation: *rem-813d6fbc7a
  - id: "CIS-AMAZON2023-5.2.3.5-auditd_locale_cnf"
