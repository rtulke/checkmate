  - id: "CIS-UBUNTU18-3.5.3.3.4-ipt6_open_ports"
    name: "ipt6 open ports: echo \"Manual - Please confirm ip6tables rules for open ports configured and matched site …"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.3.3.4."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual - Please confirm ip6tables rules for open ports configured and matched site policy"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Manual" }
    rationale: &rat-9ecee60e4a |
      Every port a host listens on over IPv6 is reachable by any IPv6 peer unless the firewall restricts it. With a default-drop policy, missing rules break needed services, while overly broad rules expose services that should stay internal. Comparing the ip6tables rules with the sockets actually listening keeps IPv6 exposure limited to what the site has approved.
    remediation: &rem-757b9bba24 |
      Compare the IPv6 sockets the host listens on with the ip6tables INPUT rules. Add an accept rule for each port the site policy allows (example for SSH below), remove rules for ports that are not needed, and save the rule set.

      ss -6tuln
      ip6tables -L INPUT -v -n
      ip6tables -A INPUT -p tcp --dport 22 -m conntrack --ctstate NEW -j ACCEPT
      netfilter-persistent save

      This is a manual review item: the check only prints a reminder and reports a failure until the review is accepted.
  - id: "CIS-UBUNTU18-4.1.1.1-audispd-plugins"
