      grep system-locale /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S sethostname -S setdomainname -k system-locale" }
      - { some: "~ -a always,exit -F arch=b32 -S sethostname -S setdomainname -k system-locale" }
      - { some: "~ -w /etc/issue -p wa -k system-locale" }
      - { some: "~ -w /etc/issue\\.net -p wa -k system-locale" }
      - { some: "~ -w /etc/hosts -p wa -k system-locale" }
      - { some: "~ -w /etc/network -p wa -k system-locale" }
    rationale: &rat-eef6ac766d |
      Changes to the host name, domain name, login banners or network configuration can redirect traffic, disguise a system or prepare further attacks. Auditing them makes such modifications traceable. This check verifies that the rules are part of the persistent audit configuration.
    remediation: &rem-86bf11bb6f |
      Record changes to the host name, domain name, login banners and network configuration: add the rules for your release to /etc/audit/rules.d/50-system_locale.rules and load them.

      Debian 11, Debian 12, Ubuntu 20.04 and Ubuntu 22.04:
      -a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale
      -a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale
      -w /etc/issue -p wa -k system-locale
      -w /etc/issue.net -p wa -k system-locale
      -w /etc/hosts -p wa -k system-locale
      -w /etc/network -p wa -k system-locale
      -w /etc/networks -p wa -k system-locale
      -w /etc/netplan -p wa -k system-locale

      Debian 13:
      -a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale
      -a always,exit -F arch=b64 -S all -F path=/etc/issue -F perm=wa -k system-locale
      -a always,exit -F arch=b64 -S all -F path=/etc/issue.net -F perm=wa -k system-locale
      -a always,exit -F arch=b64 -S all -F path=/etc/hosts -F perm=wa -k system-locale
      -a always,exit -F arch=b64 -S all -F path=/etc/network/interfaces -F perm=wa -k system-locale
      -a always,exit -F arch=b64 -S all -F dir=/etc/network/interfaces.d -F perm=wa -k system-locale
      -a always,exit -F arch=b64 -S all -F dir=/etc/netplan -F perm=wa -k system-locale

      Ubuntu 18.04:
      -a always,exit -F arch=b64 -S sethostname -S setdomainname -k system-locale
      -a always,exit -F arch=b32 -S sethostname -S setdomainname -k system-locale
      -w /etc/issue -p wa -k system-locale
      -w /etc/issue.net -p wa -k system-locale
      -w /etc/hosts -p wa -k system-locale
      -w /etc/network -p wa -k system-locale

      augenrules --load

      On Debian 13 add the rules for /etc/network/interfaces, /etc/network/interfaces.d and /etc/netplan only for paths that exist. If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
