  - id: "CIS-UBUNTU18-5.3.18-ssh_config_banner"
    name: "ssh config banner: grep -Eis '^\\s*Banner\\s+\"?none\\b'/etc/ssh/sshd_config.d/*.conf"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.3.18."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
