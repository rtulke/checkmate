  - id: "CIS-UBUNTU18-4.2.3-logfile_configured"
    name: "logfile configured: find /var/log -type f -perm /g+wx,o+rwx -exec ls -l {} \\;"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 4.2.3."
    tags: [cis, cis-ubuntu18, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /var/log -type f -perm /g+wx,o+rwx -exec ls -l {} \;
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-0de5450138 |
      Log files can contain sensitive data and are important evidence after a security incident. If they are writable or readable by unauthorised users, information leaks and logs can be altered or deleted to hide an attack. Access to files under /var/log should be limited to what each kind of log needs.
    remediation: &rem-42ace0ab21 |
      Review every file listed by the check and remove the excess permissions. General and authentication logs should be 0640 or stricter; lastlog, wtmp and btmp may keep group write (0664) for the utmp group.

      chmod u-x,g-wx,o-rwx FILE
      chmod g-x,o-wx /var/log/lastlog /var/log/wtmp /var/log/btmp

      Also adjust the creating service and the create directives in /etc/logrotate.conf and /etc/logrotate.d/, otherwise the permissions come back with the next rotation. On RHEL 7, Ubuntu 18.04 (and for lastlog on Amazon Linux 2023) the check also flags group write on these login records; remove it there with chmod g-w if accepted.
  - id: "CIS-UBUNTU18-4.3-logrotate_config"
    name: "logrotate config: echo \" Manual - Please ensure lograote is configured as per site policy\""
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 4.3."
    tags: [cis, cis-ubuntu18, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo " Manual - Please ensure lograote is configured as per site policy"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Manual" }
    rationale: &rat-0b0be86061 |
      Without log rotation, logs can fill the filesystem and stop logging or other services. Rotated log files must also be created with restrictive permissions, because logs often contain sensitive data that ordinary users should not read.
    remediation: &rem-28edcc4314 |
      Review the logrotate configuration against site policy and make sure every create directive uses mode 0640 or stricter.

      grep -Es '^\s*create\s+\S+' /etc/logrotate.conf /etc/logrotate.d/*

      Change each listed create line to a restrictive mode, for example create 0640 root adm. Lines with a bare create keep the original file's mode.
  - id: "CIS-UBUNTU18-4.4-etc_logrotate.conf-attrs"
    name: "/etc/logrotate.conf: exists"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 4.4."
    tags: [cis, cis-ubuntu18, cis-section-4, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/logrotate.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-704881c556 |
      Log files grow continuously; without rotation they eventually fill the file system and stop logging or affect other services. logrotate periodically rotates, compresses and expires logs according to a defined retention, and its create directive sets the permissions of new log files.
    remediation: &rem-5b488c90de |
      Create /etc/logrotate.conf.
  - id: "CIS-UBUNTU18-4.4-etc_logrotate.conf-content"
