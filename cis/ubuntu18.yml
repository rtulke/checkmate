      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-df170e4b67 |
      Password ageing limits how long a compromised password stays usable. A minimum age stops users from cycling through passwords to reuse an old one, a maximum age forces periodic changes, and a warning period gives users time to change before expiry.
    remediation: &rem-0b6bdc1798 |
      Create /etc/login.defs.
