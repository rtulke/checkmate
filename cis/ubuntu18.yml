      This is a manual review item: the automated check always reports it so that the result is reviewed and documented.
  - id: "CIS-UBUNTU18-3.5.3.3.1-ipt6_def_deny"
    name: "ipt6 def deny: echo \"Manual - Please confirm ip6tables default denies are configured and matched site po…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.3.3.1."
