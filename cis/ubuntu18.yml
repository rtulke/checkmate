      nft add rule inet filter input ct state established,related accept
      nft add rule inet filter output ct state new,established,related accept

      This is a manual review item: the automated check always reports it so that the result is reviewed and documented.
  - id: "CIS-UBUNTU18-3.5.2.8-nft_def_deny"
    name: "nft def deny: echo \"Manual - Please confirm nfttables default denies are configured and matched site po…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.2.8."
