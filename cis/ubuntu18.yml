  - id: "CIS-UBUNTU18-1.1.20-cdrom_nosuid"
    name: "cdrom nosuid: if [ `grep -c -i cdrom /etc/fstab` = 1 ] ; then if [ `grep -c -E 'cdrom.*nosuid' /etc/fst…"
