      - a line matches ^create 0640
  - id: "CIS-UBUNTU18-4.4-logrotate_config"
    name: "logrotate config: grep -Es \"^\\s*create\\s+\\S+\" /etc/logrotate.conf /etc/logrotate.d/* | grep - E -v \"\\s(0)?[…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 4.4."
