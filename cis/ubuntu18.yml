  - id: "CIS-UBUNTU18-4.1.7-auditd_logins_cnf"
    name: "auditd logins cnf: grep logins /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 4.1.7."
    tags: [cis, cis-ubuntu18, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep logins /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /var/log/faillog -p wa -k logins" }
      - { some: "~ -w /var/log/lastlog -p wa -k logins" }
      - { some: "~ -w /var/log/tallylog -p wa -k logins" }
    rationale: &rat-7b52877a11 |
      The lastlog and faillock (or faillog/tallylog) records store the last successful logins and failed authentication attempts. Watching them reveals brute-force attempts, account lockouts and tampering with login records. This check verifies the persistent audit configuration.
    remediation: &rem-bb00c393ee |
      Watch the login and failed-login records: add the rules for your release to /etc/audit/rules.d/50-login.rules and load them.

      Debian 11, Debian 12, Ubuntu 20.04, Ubuntu 22.04 and Ubuntu 24.04:
      -w /var/log/lastlog -p wa -k logins
      -w /var/run/faillock -p wa -k logins

      Debian 13:
      -a always,exit -F arch=b64 -S all -F path=/var/log/lastlog -F perm=wa -k logins
      -a always,exit -F arch=b64 -S all -F path=/var/run/faillock -F perm=wa -k logins

      Ubuntu 18.04:
      -w /var/log/faillog -p wa -k logins
      -w /var/log/lastlog -p wa -k logins
      -w /var/log/tallylog -p wa -k logins

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
