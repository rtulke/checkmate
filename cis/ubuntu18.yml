  - id: "CIS-UBUNTU18-5.2.1-sudo"
    name: "Package sudo is installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.2.1."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' sudo 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-f5f9e1cba7 |
      sudo lets administrators run privileged commands with their own credentials instead of a shared root password. That gives individual accountability, fine-grained permissions and a log of every privileged command.
    remediation: &rem-83b291c388 |
      Install the package sudo:

      apt-get install sudo
  - id: "CIS-UBUNTU18-5.2.2-etc_sudoers-attrs"
    name: "/etc/sudoers: exists"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.2.2."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
