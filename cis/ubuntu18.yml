      If /home is not a separate file system yet, create one first.
  - id: "CIS-UBUNTU18-1.1.19-cdrom_nodev"
    name: "cdrom nodev: if [ `grep -c -i cdrom /etc/fstab` = 1 ] ; then if [ `grep -c -E 'cdrom.*nodev' /etc/fsta…"
