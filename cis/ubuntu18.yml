      - { none: "~ ^Manual" }
    rationale: &rat-f2b453bff8 |
      With a default DROP policy on the ip6tables INPUT, FORWARD and OUTPUT chains, IPv6 traffic not explicitly allowed is blocked. Without it, IPv6 can become an unfiltered path around an IPv4-only firewall. Required traffic must be allowed first. This is a manual review item.
    remediation: &rem-2d69897fbe |
      Add accept rules for required IPv6 traffic first, then set the default policy of the built-in ip6tables chains to DROP and save the rules.

      ip6tables -A INPUT -i lo -j ACCEPT
      ip6tables -A OUTPUT -o lo -j ACCEPT
      ip6tables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
      ip6tables -A OUTPUT -m conntrack --ctstate NEW,ESTABLISHED,RELATED -j ACCEPT
      ip6tables -P INPUT DROP
      ip6tables -P FORWARD DROP
