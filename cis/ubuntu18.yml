  - id: "CIS-UBUNTU18-1.4.1-usr_sbin_grub-mkconfig-attrs"
    name: "/usr/sbin/grub-mkconfig: exists"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.4.1."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/usr/sbin/grub-mkconfig'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-85779a9a6a |
      grub-mkconfig regenerates the boot loader configuration on every kernel update. If it creates the file with permissive modes, a hardened grub.cfg becomes readable again, exposing boot parameters and the password hash. Ensuring the script writes the file with mode 0400 keeps the permissions restrictive across updates.
    remediation: &rem-3bd2366818 |
      Create /usr/sbin/grub-mkconfig.
  - id: "CIS-UBUNTU18-1.4.1-usr_sbin_grub-mkconfig-content"
    name: "/usr/sbin/grub-mkconfig has the expected content (2 rules)"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.4.1."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/usr/sbin/grub-mkconfig'
    allow_rc: any
    expect:
      - { some: "~ s+chmod 400${grub_cfg}.new || true" }
      - { none: "~ chmod ([0-3]|[5-7)[[1-7][1-7])" }
    rationale: *rat-85779a9a6a
    remediation: &rem-369bbb029f |
      Edit /usr/sbin/grub-mkconfig so that its lines meet these conditions (regular expressions):

      - a line matches s+chmod 400${grub_cfg}.new || true
      - no line matches chmod ([0-3]|[5-7)[[1-7][1-7])
  - id: "CIS-UBUNTU18-1.4.2-boot_grub_grub.cfg-attrs"
    name: "/boot/grub/grub.cfg: exists"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.4.2."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/boot/grub/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-0e189bbc0f |
      The GRUB configuration controls how the kernel boots. Without a boot loader password anyone at the console can edit boot entries, for example to start a root shell; loose file permissions expose the password hash and kernel parameters to local users. The same file also carries the kernel parameters that enable AppArmor at boot, which must not be disabled.
    remediation: &rem-34fe50bf63 |
      Create /boot/grub/grub.cfg.
  - id: "CIS-UBUNTU18-1.4.2-boot_grub_grub.cfg-content"
    name: "/boot/grub/grub.cfg has the expected content (2 rules)"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.4.2."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/boot/grub/grub.cfg'
    allow_rc: any
    expect:
      - { some: "~ set superusers=\"root\"" }
      - { some: "~ /password_pbkdf2 root blah" }
    rationale: *rat-0e189bbc0f
    remediation: &rem-afbfb7cb35 |
      Edit /boot/grub/grub.cfg so that its lines meet these conditions (regular expressions):

      - a line matches set superusers="root"
      - a line matches /password_pbkdf2 root blah
  - id: "CIS-UBUNTU18-1.4.3-boot_grub_grub.cfg-attrs"
    name: "/boot/grub/grub.cfg: exists, mode 0256 or stricter, owner root, group root"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.4.3."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/boot/grub/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7521)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: *rat-0e189bbc0f
    remediation: &rem-6e2ade5b5a |
      Create /boot/grub/grub.cfg if it is missing, then set owner root and group root and remove the permissions u-rxs,g-ws,o-x,a-t:

      chown root:root '/boot/grub/grub.cfg'
      chmod u-rxs,g-ws,o-x,a-t '/boot/grub/grub.cfg'
  - id: "CIS-UBUNTU18-1.4.4-check_root_pw"
    name: "check root pw: grep -Eq '^root:\\$[0-9]' /etc/shadow || echo \"root is not locked\""
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.4.4."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eq '^root:\$[0-9]' /etc/shadow || echo "root is not locked"
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ^root is not locked" }
    rationale: &rat-e1054758c7 |
      If root has no password, booting into single-user or recovery mode can give a root shell without any authentication. A password for root ensures that maintenance modes still require credentials.
    remediation: &rem-b72b013286 |
      Set a strong password for root.

      passwd root
  - id: "CIS-UBUNTU18-1.5.1-kernel_nx"
    name: "kernel nx: journalctl | grep 'protection: active'"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.5.1."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      journalctl | grep 'protection: active'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ kernel: NX \\(Execute Disable\\) protection: active" }
    rationale: &rat-d4c9adfb2f |
      The NX (No-eXecute, also XD or Execute Disable) CPU feature lets the kernel mark memory regions such as the stack and heap as non-executable. This blocks a large class of buffer overflow exploits that inject and run code in data memory. The check confirms from the boot messages that the kernel activated NX protection.
    remediation: &rem-d099efaf03 |
      Enable the NX/XD (Execute Disable) feature in the system firmware (BIOS/UEFI), or for virtual machines expose it in the hypervisor's CPU configuration, then reboot and verify:

      journalctl -k -b | grep 'protection: active'

      On 32-bit x86 a PAE-capable kernel is required. The check searches the journal, so the boot messages must still be present (persistent journal or not yet rotated).
  - id: "CIS-UBUNTU18-1.5.2-kernel.randomize_va_space"
    name: "Kernel parameter kernel.randomize_va_space is 2"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.5.2."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n kernel.randomize_va_space
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 2"
    rationale: &rat-5597c48019 |
      Address space layout randomization places the stack, heap, shared libraries and other memory regions at random addresses. This makes memory corruption exploits much harder because an attacker cannot predict where code or data is located. The value 2 enables full randomization, including the heap.
    remediation: &rem-a6e5efe9f8 |
      Set the kernel parameter kernel.randomize_va_space to 2, now and at boot:

      sysctl -w 'kernel.randomize_va_space=2'
      printf '%s\n' 'kernel.randomize_va_space = 2' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.randomize_va_space from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU18-1.5.2-aslr_enabled_2"
    name: "aslr enabled 2: grep \"^kernel\\.randomize_va_space\" /etc/sysctl.conf /etc/sysctl.d/* | cut -d \":\" -f2"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.5.2."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "^kernel\.randomize_va_space" /etc/sysctl.conf /etc/sysctl.d/* | cut -d ":" -f2
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ kernel.randomize_va_space\\s=\\s2" }
    rationale: &rat-2872b53691 |
      Address space layout randomization places the stack, heap, shared libraries and other memory regions at random addresses, which makes memory corruption exploits much harder. The value 2 enables full randomization. Setting it in a sysctl configuration file ensures it is applied at every boot and not only at runtime.
    remediation: &rem-9accd0beb4 |
      Set kernel.randomize_va_space to 2 in a sysctl configuration file so it is applied at every boot, and apply it now. Ubuntu 18.04 expects exactly one space on each side of the equals sign.

      printf '%s\n' 'kernel.randomize_va_space = 2' > /etc/sysctl.d/60-kernel_sysctl.conf
      sysctl -w kernel.randomize_va_space=2

      Remove or correct any other kernel.randomize_va_space line in /etc/sysctl.conf and /etc/sysctl.d/; on Debian 11 any other value there fails the check.
  - id: "CIS-UBUNTU18-1.5.3-prelink"
    name: "Package prelink is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.5.3."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' prelink 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-18deabdd17 |
      prelink rewrites binaries and libraries to speed up loading. These modifications interfere with file integrity tools such as AIDE and with package verification, and a compromised prelink could alter binaries system-wide. With address space randomization in place it brings little benefit.
    remediation: &rem-ff4898e838 |
      Remove the package prelink, unless the system needs it:

      apt-get purge prelink
  - id: "CIS-UBUNTU18-1.5.4-fs.suid_dumpable"
    name: "Kernel parameter fs.suid_dumpable is 0"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.5.4."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n fs.suid_dumpable
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-e7d91ef8bc |
      fs.suid_dumpable controls whether processes that changed privileges, such as setuid programs, may produce core dumps. A core dump of such a process can contain passwords, keys or other secrets from privileged memory and may be readable by the invoking user. Setting it to 0 disables these dumps. This check verifies the value in the running kernel.
    remediation: &rem-789aaadb7b |
      Set the kernel parameter fs.suid_dumpable to 0, now and at boot:

      sysctl -w 'fs.suid_dumpable=0'
      printf '%s\n' 'fs.suid_dumpable = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of fs.suid_dumpable from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-UBUNTU18-1.5.4-coredump-enabled"
    name: "Service coredump is not enabled"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.5.4."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState coredump | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-7c182ccdb3 |
      Core dumps can contain passwords, keys and other sensitive memory content of crashed processes. Disabling the core dump handling service keeps such data from being collected and stored.
    remediation: &rem-be15d1d09f |
      Disable the service coredump, unless the system needs it:

      systemctl disable coredump

      To keep other units from starting it, mask it instead: systemctl mask coredump
  - id: "CIS-UBUNTU18-1.5.4-coredump-running"
    name: "Service coredump is not running"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.5.4."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState coredump | cut -d= -f2
    expect: "!= active"
    rationale: *rat-7c182ccdb3
    remediation: &rem-e90c3ca41f |
      Stop the service coredump, unless the system needs it:

      systemctl stop coredump
  - id: "CIS-UBUNTU18-1.5.4-etc_systemd_coredump.conf-attrs"
    name: "/etc/systemd/coredump.conf: exists"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.5.4."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/systemd/coredump.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-a93a26cf65 |
      Core dumps can contain passwords, keys and other sensitive memory content. Storage=none keeps systemd-coredump from saving them to disk and ProcessSizeMax=0 stops it from processing dumps at all, so crashing processes do not leave memory images behind.
    remediation: &rem-38adbe4ae3 |
      Create /etc/systemd/coredump.conf.
  - id: "CIS-UBUNTU18-1.5.4-etc_systemd_coredump.conf-content"
    name: "/etc/systemd/coredump.conf has the expected content (2 rules)"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.5.4."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/systemd/coredump.conf'
    allow_rc: any
    expect:
      - { some: "~ ^Storage=none" }
      - { some: "~ ^ProcessSizeMax=0" }
    rationale: *rat-a93a26cf65
    remediation: &rem-95cbb4733e |
      Edit /etc/systemd/coredump.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^Storage=none
      - a line matches ^ProcessSizeMax=0
  - id: "CIS-UBUNTU18-1.5.4-core_dumps_limits"
    name: "core dumps limits: grep -E \"\\*.*hard.*core.*0\" /etc/security/limits.conf /etc/security/limits.d/*"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.5.4."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "\*.*hard.*core.*0" /etc/security/limits.conf /etc/security/limits.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\/*.*\\shard.*core.*0" }
    rationale: &rat-f0b293c191 |
      Core dumps write a process's memory to disk and can contain passwords, keys and other sensitive data. A hard core size limit of 0 in the PAM limits configuration prevents user processes from producing core files, and users cannot raise a hard limit themselves.
    remediation: &rem-7e22a0850b |
      Set a hard core file size limit of 0 for all users in a file under /etc/security/limits.d/ and remove entries elsewhere that allow a larger hard limit:

      printf '%s\n' '* hard core 0' > /etc/security/limits.d/60-coredump.conf

      The limit applies to new login sessions.
  - id: "CIS-UBUNTU18-1.5.4-suid_dumpable_2"
    name: "suid dumpable 2: grep \"fs\\.suid_dumpable\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.5.4."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep "fs\.suid_dumpable" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ fs\\.suid_dumpable=0" }
    rationale: &rat-5352269d27 |
      fs.suid_dumpable controls whether setuid and other privilege-changing programs may write core dumps. Such dumps can contain memory of a privileged process, including credentials. A value of 0 prevents them. The check reads the persistent sysctl configuration files.
    remediation: &rem-e7880bb15a |
      Set fs.suid_dumpable=0, written without spaces as the check expects, in a file under /etc/sysctl.d/ and apply it:

      printf '%s\n' 'fs.suid_dumpable=0' > /etc/sysctl.d/60-fs_suid_dumpable.conf
      sysctl -w fs.suid_dumpable=0

      Delete or correct other fs.suid_dumpable lines in /etc/sysctl.conf and /etc/sysctl.d/; the Ubuntu 22.04 and 24.04 variants fail if any of them sets another value.
  - id: "CIS-UBUNTU18-1.6.1.1-apparmor"
    name: "Package apparmor is installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.6.1.1."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' apparmor 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-d4cd5996bb |
      AppArmor is a mandatory access control system that confines programs to a defined set of files, capabilities and network access. Having it installed is the prerequisite for limiting what a compromised service can do beyond normal user permissions.
    remediation: &rem-378a6baa70 |
      Install the package apparmor:

      apt-get install apparmor
  - id: "CIS-UBUNTU18-1.6.1.2-boot_grub_grub.cfg-attrs"
    name: "/boot/grub/grub.cfg: exists"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.6.1.2."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/boot/grub/grub.cfg'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: *rat-0e189bbc0f
    remediation: *rem-34fe50bf63
  - id: "CIS-UBUNTU18-1.6.1.2-boot_grub_grub.cfg-content"
    name: "/boot/grub/grub.cfg has the expected content (3 rules)"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.6.1.2."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/boot/grub/grub.cfg'
    allow_rc: any
    expect:
      - { some: "~ apparmor=1" }
      - { some: "~ security=apparmor" }
      - { none: "~ apparmor=0" }
    rationale: *rat-0e189bbc0f
    remediation: &rem-b6dfe2c9ec |
      Edit /boot/grub/grub.cfg so that its lines meet these conditions (regular expressions):

      - a line matches apparmor=1
      - a line matches security=apparmor
      - no line matches apparmor=0
  - id: "CIS-UBUNTU18-1.6.1.2-etc_default_grub-attrs"
    name: "/etc/default/grub: exists"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.6.1.2."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/default/grub'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f5e498d047 |
      /etc/default/grub defines the kernel command line used for new boot entries. Security settings such as enabling AppArmor, auditing processes that start before the audit daemon, and a sufficient audit backlog need to be set there so that they apply from early boot. Depending on the platform the check verifies these parameters.
    remediation: &rem-2d1523887c |
      Create /etc/default/grub.
  - id: "CIS-UBUNTU18-1.6.1.2-etc_default_grub-content"
    name: "/etc/default/grub has the expected content (3 rules)"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.6.1.2."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/default/grub'
    allow_rc: any
    expect:
      - { some: "~ ^GRUB_CMDLINE_LINUX.*apparmor=1" }
      - { some: "~ ^GRUB_CMDLINE_LINUX.*security=apparmor" }
      - { none: "~ apparmor=0" }
    rationale: *rat-f5e498d047
    remediation: &rem-210c5e7ead |
      Edit /etc/default/grub so that its lines meet these conditions (regular expressions):

      - a line matches ^GRUB_CMDLINE_LINUX.*apparmor=1
      - a line matches ^GRUB_CMDLINE_LINUX.*security=apparmor
      - no line matches apparmor=0
  - id: "CIS-UBUNTU18-1.6.1.3-apparmor_enf_or_comp"
    name: "apparmor enf or comp: LOADED=`apparmor_status | grep 'profiles are loaded' | awk '{print $1}'` \u0026\u0026 ENFORCE=`appa…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.6.1.3."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      LOADED=`apparmor_status | grep 'profiles are loaded' | awk '{print $1}'` && ENFORCE=`apparmor_status | grep 'profiles are in enforce mode.' | awk '{print $1}'` && COMPLAIN=`apparmor_status | grep 'profiles are in complain mode.' | awk '{print $1}'` && if [ $((LOADED + COMPLAIN)) != "$ENFORCE" ]; then echo "Profiles Error";fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ Profiles Error" }
    rationale: &rat-56a855fea9 |
      A loaded AppArmor profile only has an effect in enforce mode, where violations are blocked, or complain mode, where they are logged. Requiring every loaded profile to be in one of these modes, and no process with a defined profile to run unconfined, ensures applications that have a policy are actually restricted or at least monitored.
    remediation: &rem-cb32855c78 |
      Install the AppArmor utilities, put all profiles into enforce mode and restart processes that have a profile but are still running unconfined.

      apt-get install apparmor-utils
      aa-enforce /etc/apparmor.d/*
      aa-status
      systemctl restart SERVICE

      A reboot also places all processes under their profiles.
  - id: "CIS-UBUNTU18-1.7.1-check_motd_files"
    name: "check motd files: grep -Eis \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.7.1."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/update-motd.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-06adda8e6a |
      Login messages that reveal the operating system name, release or kernel version help attackers pick matching exploits. The getty escape sequences \m, \r, \s and \v insert exactly this information. Messages should contain only a site-approved notice.
    remediation: &rem-032a5e5ab7 |
      Remove OS names, versions and the escape sequences \m, \r, \s and \v from the checked files: replace /etc/issue and /etc/issue.net with a site-approved notice and review the scripts in /etc/update-motd.d.

      echo 'Authorized users only. All activity may be monitored and reported.' > /etc/issue
      echo 'Authorized users only. All activity may be monitored and reported.' > /etc/issue.net
      grep -Eil "(\\\v|\\\r|\\\m|\\\s|ubuntu)" /etc/update-motd.d/*

      Edit or remove the listed update-motd.d scripts after review; disabling them with chmod -x does not change their content, which is what the check examines.
  - id: "CIS-UBUNTU18-1.7.2-etc_issue.net-attrs"
    name: "/etc/issue.net: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.7.2."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue.net'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-e92ea8bf7a |
      /etc/issue.net is shown before remote logins, for example as the SSH banner. It should present a usage or legal warning and not reveal operating system names, versions or architecture that help attackers. The file should be owned by root and not writable by others, so the message cannot be altered.
    remediation: &rem-eb0556c5ea |
      Create /etc/issue.net if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue.net'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue.net'
  - id: "CIS-UBUNTU18-1.7.3-etc_issue-attrs"
    name: "/etc/issue: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.7.3."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-4d2717dc87 |
      /etc/issue is shown before local logins. It should present a usage or legal warning and not reveal operating system names, versions or architecture that help attackers. The file should be owned by root and not writable by others, so the message cannot be altered.
    remediation: &rem-683e1f474b |
      Create /etc/issue if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/issue'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/issue'
  - id: "CIS-UBUNTU18-1.7.5-check_motd_files"
    name: "check motd files: grep -Eis \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.7.5."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/issue.net
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: *rat-06adda8e6a
    remediation: *rem-032a5e5ab7
  - id: "CIS-UBUNTU18-1.7.6-check_motd_files"
    name: "check motd files: grep -Eis \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.7.6."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -Eis "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/issue
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: *rat-06adda8e6a
    remediation: *rem-032a5e5ab7
  - id: "CIS-UBUNTU18-1.8.1-gdm3"
    name: "Package gdm3 is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.8.1."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' gdm3 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-a7a77db979 |
      Removing the package gdm3 removes the graphical display manager, which is not needed on servers and adds a large amount of code and a local login service to the attack surface. Workstations that use a graphical login need it.
    remediation: &rem-e959046b35 |
      Remove the package gdm3, unless the system needs it:

      apt-get purge gdm3
  - id: "CIS-UBUNTU18-1.9-check_updates"
    name: "check updates: apt update | tail -1"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.9."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 60000ms
    run: |
      apt update | tail -1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^[1-9]{0,4}$ packages can be upgraded" }
      - { some: "~ ^All packages are up to date" }
    rationale: &rat-b506a16c7d |
      Most successful attacks exploit known vulnerabilities for which fixes are already available. Keeping installed packages up to date closes these holes and also brings bug fixes for stability.
    remediation: &rem-494564142a |
      Refresh the package lists and install all pending updates.

      apt-get update
      apt-get upgrade
      apt-get dist-upgrade

      Review the list before confirming dist-upgrade, as it can install or remove packages to resolve dependencies. Reboot if the kernel or core libraries were updated.
  - id: "CIS-UBUNTU18-2.1.1.1-chrony"
    name: "Package chrony is installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.1.1."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' chrony 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-a0cc2c0b8d |
      Accurate, synchronized time is required for log correlation, Kerberos, certificate validation and time-based one-time passwords. A system should run exactly one time synchronization client. Depending on the platform the check expects chrony to be installed or, where systemd-timesyncd is the chosen client, not installed, to avoid competing daemons.
    remediation: &rem-ffa89cc9a9 |
      Install the package chrony:

      apt-get install chrony
  - id: "CIS-UBUNTU18-2.1.1.3-chrony"
    name: "Package chrony is installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.1.3."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' chrony 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: *rat-a0cc2c0b8d
    remediation: *rem-ffa89cc9a9
  - id: "CIS-UBUNTU18-2.1.1.3-ntp"
    name: "Package ntp is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.1.3."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' ntp 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-3360cd3b3f |
      Running more than one time synchronization daemon makes them compete for control of the clock. On these platforms time synchronization is expected to be handled by another daemon such as systemd-timesyncd or chrony, so the ntp package should not be installed.
    remediation: &rem-8bdd28ff2b |
      Remove the package ntp, unless the system needs it:

      apt-get purge ntp
  - id: "CIS-UBUNTU18-2.1.1.3-chronyd-enabled"
    name: "Service chronyd is enabled"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.1.3."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState chronyd | cut -d= -f2
    expect: "~ ^enabled"
    rationale: &rat-487a3e248c |
      chronyd keeps the system clock synchronized with reliable time sources. Correct time is needed for log correlation, Kerberos, certificate validation and one-time passwords. The service has to be enabled to start at boot and active now.
    remediation: &rem-f78265882f |
      Enable the service chronyd:

      systemctl enable chronyd
  - id: "CIS-UBUNTU18-2.1.1.3-chronyd-running"
    name: "Service chronyd is running"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.1.3."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState chronyd | cut -d= -f2
    expect: "== active"
    rationale: *rat-487a3e248c
    remediation: &rem-c06e819daf |
      Start the service chronyd:

      systemctl start chronyd
  - id: "CIS-UBUNTU18-2.1.1.3-timesyncd-enabled"
    name: "Service timesyncd is not enabled"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.1.3."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState timesyncd | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-143493ebc5 |
      Where systemd-timesyncd is the chosen time client, it must be enabled and running to keep the clock synchronized, which log correlation, certificate validation and forensic timelines depend on. Where another daemon such as chrony is used, timesyncd must be disabled so the two do not fight over the clock.
    remediation: &rem-e3ec0afcb7 |
      Disable the service timesyncd, unless the system needs it:

      systemctl disable timesyncd

      To keep other units from starting it, mask it instead: systemctl mask timesyncd
  - id: "CIS-UBUNTU18-2.1.1.3-timesyncd-running"
    name: "Service timesyncd is not running"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.1.3."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState timesyncd | cut -d= -f2
    expect: "!= active"
    rationale: *rat-143493ebc5
    remediation: &rem-0babbfaca2 |
      Stop the service timesyncd, unless the system needs it:

      systemctl stop timesyncd
  - id: "CIS-UBUNTU18-2.1.1.3-etc_chrony_chrony.conf-attrs"
    name: "/etc/chrony/chrony.conf: exists"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.1.3."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/chrony/chrony.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-c95470f85c |
      Accurate time is essential for correlating logs, validating certificates and Kerberos. chrony should synchronise against authorised time servers and run as the unprivileged _chrony user so that a flaw in the daemon does not give root access.
    remediation: &rem-66b2f28d95 |
      Create /etc/chrony/chrony.conf.
  - id: "CIS-UBUNTU18-2.1.1.3-etc_chrony_chrony.conf-content"
    name: "/etc/chrony/chrony.conf has the expected content (2 rules)"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.1.3."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/chrony/chrony.conf'
    allow_rc: any
    expect:
      - { some: "~ ^server \u003cno value\u003e" }
      - { some: "~ ^user _chrony" }
    rationale: *rat-c95470f85c
    remediation: &rem-24d636b4eb |
      Edit /etc/chrony/chrony.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^server <no value>
      - a line matches ^user _chrony
  - id: "CIS-UBUNTU18-2.1.2-xserver-xorg"
    name: "Package xserver-xorg is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.2."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' xserver-xorg 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-1d2925df6e |
      Removing the package xserver-xorg removes the X Window System, which servers do not need and which has a long history of security issues. Systems that run a graphical desktop need it.
    remediation: &rem-ecd0bd4198 |
      Remove the package xserver-xorg, unless the system needs it:

      apt-get purge xserver-xorg
  - id: "CIS-UBUNTU18-2.1.3-avahi-daemon"
    name: "Package avahi-daemon is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.3."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' avahi-daemon 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-ecc8324fa9 |
      Removing the package avahi-daemon removes the mDNS/DNS-SD service, which announces the host and its services on the local network and listens for multicast traffic. Servers rarely need automatic service discovery.
    remediation: &rem-983c3c748e |
      Remove the package avahi-daemon, unless the system needs it:

      apt-get purge avahi-daemon
  - id: "CIS-UBUNTU18-2.1.4-cups"
    name: "Package cups is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.4."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' cups 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-5fd2f513f0 |
      CUPS provides printing services and can listen on the network (port 631), offer a web interface and browse for remote printers. Systems that do not print gain nothing from it but carry an extra network service with a history of security fixes. Remove it unless the host prints or acts as a print server.
    remediation: &rem-95a4b34c66 |
      Remove the package cups, unless the system needs it:

      apt-get purge cups
  - id: "CIS-UBUNTU18-2.1.5-cups"
    name: "Package cups is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.5."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' cups 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: *rat-5fd2f513f0
    remediation: *rem-95a4b34c66
  - id: "CIS-UBUNTU18-2.1.6-slapd"
    name: "Package slapd is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.6."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' slapd 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-5a5eeab5a1 |
      Removing the package slapd removes the OpenLDAP server. A directory server that is not required is an unnecessary network service that may expose account data. Keep it only on hosts that serve LDAP.
    remediation: &rem-ca443169e7 |
      Remove the package slapd, unless the system needs it:

      apt-get purge slapd
  - id: "CIS-UBUNTU18-2.1.8-bind9"
    name: "Package bind9 is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.8."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' bind9 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-c5954f0e99 |
      Removing the package bind9 removes the BIND DNS server. An unneeded DNS server is network-reachable code that can be abused for attacks such as amplification or cache poisoning. Keep it only on designated DNS servers.
    remediation: &rem-897cffc230 |
      Remove the package bind9, unless the system needs it:

      apt-get purge bind9
  - id: "CIS-UBUNTU18-2.1.9-vsftpd"
    name: "Package vsftpd is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.9."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' vsftpd 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-436c2763bd |
      vsftpd is an FTP server. FTP transfers credentials and data unencrypted unless TLS is configured carefully, and an FTP service is a frequent target for brute-force attacks and data leaks. Use SFTP or another encrypted transfer method and keep the FTP server off systems that do not explicitly provide it.
    remediation: &rem-62a6c8265d |
      Remove the package vsftpd, unless the system needs it:

      apt-get purge vsftpd
  - id: "CIS-UBUNTU18-2.1.10-httpd"
    name: "Package httpd is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.10."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' httpd 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-363beaff7b |
      The Apache HTTP server opens a network service with a large attack surface through its modules and the content it serves. If the host is not meant to be a web server, removing it avoids accidental exposure of files and the patching burden of an unused service.
    remediation: &rem-3a010adb5d |
      Remove the package httpd, unless the system needs it:

      apt-get purge httpd
  - id: "CIS-UBUNTU18-2.1.11-dovecot-imapd"
    name: "Package dovecot-imapd is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.11."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' dovecot-imapd 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-cd00498564 |
      Removing the package dovecot-imapd removes the IMAP server. A mail access service that is not needed exposes a login service and mail data to the network. Keep it only on mail servers.
    remediation: &rem-08f47d4643 |
      Remove the package dovecot-imapd, unless the system needs it:

      apt-get purge dovecot-imapd
  - id: "CIS-UBUNTU18-2.1.11-dovecot-pop3d"
    name: "Package dovecot-pop3d is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.11."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' dovecot-pop3d 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-26f5a727ee |
      Removing the package dovecot-pop3d removes the POP3 server. A mail access service that is not needed exposes a login service and mail data to the network. Keep it only on mail servers.
    remediation: &rem-a2e1098916 |
      Remove the package dovecot-pop3d, unless the system needs it:

      apt-get purge dovecot-pop3d
  - id: "CIS-UBUNTU18-2.1.12-samba"
    name: "Package samba is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.12."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' samba 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-d7ad1732cb |
      Samba provides SMB/CIFS file and print sharing. The SMB protocol and its implementations have a long history of critical vulnerabilities, and shares can expose data if misconfigured. Install the server only on hosts that must share files with Windows clients; client-only use does not need the server package.
    remediation: &rem-a425bec452 |
      Remove the package samba, unless the system needs it:

      apt-get purge samba
  - id: "CIS-UBUNTU18-2.1.13-squid"
    name: "Package squid is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.13."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' squid 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-04d3922e1d |
      Squid is an HTTP caching proxy. An unneeded or misconfigured proxy can be abused to relay traffic, bypass network controls or reach internal systems, and it is network-facing code that requires patching. Remove it unless the host is a designated proxy server.
    remediation: &rem-03e09abbbd |
      Remove the package squid, unless the system needs it:

      apt-get purge squid
  - id: "CIS-UBUNTU18-2.1.14-snmpd"
    name: "Package snmpd is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.14."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' snmpd 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-6f7b2c568f |
      Removing the package snmpd removes the SNMP agent. SNMP, especially v1/v2c with community strings, can disclose detailed system information and in some setups allow configuration changes. Keep it only where SNMP monitoring is required and properly secured.
    remediation: &rem-0625668e79 |
      Remove the package snmpd, unless the system needs it:

      apt-get purge snmpd
  - id: "CIS-UBUNTU18-2.1.15-port_25_local_only"
    name: "port 25 local only: ss -lntu | grep -E ':25\\s' | grep -E -v '\\s(127.0.0.1|::1):25\\s'"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.15."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      ss -lntu | grep -E ':25\s' | grep -E -v '\s(127.0.0.1|::1):25\s'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-bfca8c550e |
      A mail transfer agent that listens on external interfaces can be abused as an open relay or attacked over the network. Systems that only send local mail should accept SMTP connections on the loopback interface only.
    remediation: &rem-8ea157e690 |
      Configure the mail transfer agent to listen on the loopback interface only. For Postfix:

      postconf -e 'inet_interfaces = loopback-only'
      systemctl restart postfix

      For Exim4 set dc_local_interfaces='127.0.0.1 ; ::1' in /etc/exim4/update-exim4.conf.conf, then run update-exim4.conf and systemctl restart exim4.
  - id: "CIS-UBUNTU18-2.1.16-rsync"
    name: "Package rsync is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.16."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' rsync 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-f865cf7f4c |
      The rsync daemon offers file synchronisation over a plain-text protocol with weak or no authentication depending on its configuration. Systems that do not act as rsync servers should not run the daemon; rsync over SSH does not need it.
    remediation: &rem-890a742a78 |
      Remove the package rsync, unless the system needs it:

      apt-get purge rsync
  - id: "CIS-UBUNTU18-2.1.17-nis"
    name: "Package nis is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.1.17."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' nis 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-fda00482cd |
      Removing the package nis removes the NIS client and server tools. NIS transmits account data, including password hashes, without encryption and has weak authentication.
    remediation: &rem-98afbdc9fd |
      Remove the package nis, unless the system needs it:

      apt-get purge nis
  - id: "CIS-UBUNTU18-2.2.1-nis"
    name: "Package nis is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.2.1."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' nis 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: *rat-fda00482cd
    remediation: *rem-98afbdc9fd
  - id: "CIS-UBUNTU18-2.2.2-rsh-client"
    name: "Package rsh-client is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.2.2."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' rsh-client 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-51164d638c |
      Removing the package rsh-client removes rsh, rcp and rlogin, which send credentials and data in clear text. Their presence also encourages use of these insecure protocols instead of SSH.
    remediation: &rem-94fdc8cf39 |
      Remove the package rsh-client, unless the system needs it:

      apt-get purge rsh-client
  - id: "CIS-UBUNTU18-2.2.3-talk"
    name: "Package talk is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.2.3."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' talk 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-c19976dd5a |
      The talk client connects to the talk daemon over unencrypted network connections and is an obsolete chat tool. Keeping it installed adds software that nobody needs and that could be abused to reach other hosts, so it should be removed unless there is a documented use.
    remediation: &rem-694690ac2f |
      Remove the package talk, unless the system needs it:

      apt-get purge talk
  - id: "CIS-UBUNTU18-2.2.4-telnet"
    name: "Package telnet is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.2.4."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' telnet 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-b00660eaf1 |
      The telnet client connects using an unencrypted protocol, so credentials and session data typed into it are exposed on the network. Removing it discourages insecure remote logins; use ssh for administration and tools such as nc or openssl s_client for port testing.
    remediation: &rem-21205a790b |
      Remove the package telnet, unless the system needs it:

      apt-get purge telnet
  - id: "CIS-UBUNTU18-2.2.5-ldap-utils"
    name: "Package ldap-utils is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.2.5."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
