  - id: "CIS-UBUNTU18-5.3.1-etc_ssh_sshd_config-attrs"
    name: "/etc/ssh/sshd_config: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.3.1."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
