    rationale: *rat-9425c177af
    remediation: *rem-473336823d
  - id: "CIS-UBUNTU18-1.2.1-repos_configd"
    name: "repos configd: echo \"Please check manually for configured repos\""
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.2.1."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Please check manually for configured repos"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ /\\^Please\\.\\*" }
    rationale: &rat-1fb23ee204 |
      Packages are only as trustworthy as the repositories they come from. Reviewing the configured APT sources and the trusted signing keys ensures that updates come from intended, authenticated sources and that no unknown repository or key can inject software.
    remediation: &rem-a6dfc72214 |
      Review the configured package sources and the trusted repository signing keys and remove anything that is not approved.

      apt-cache policy
      grep -rh '^deb' /etc/apt/sources.list /etc/apt/sources.list.d/
      apt-key list
      ls -l /etc/apt/trusted.gpg.d/

      This is a manual review; the check always passes.
  - id: "CIS-UBUNTU18-1.2.2-repos_configd"
    name: "repos configd: echo \"Please check manually for gpg keys\""
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.2.2."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
