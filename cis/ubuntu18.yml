    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-86b7d17107 |
      A login banner shown before authentication states that access is restricted and monitored. This deters casual misuse and supports legal action, so the SSH server should not have its banner set to none.
    remediation: &rem-232280ca03 |
      Remove any Banner none setting and point the SSH banner to a site warning file such as /etc/issue.net in /etc/ssh/sshd_config, above any Match block.

      Banner /etc/issue.net

      Then reload the service with systemctl reload ssh.
