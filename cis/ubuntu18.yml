    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Manual" }
    rationale: &rat-627639aeaf |
      Every port the system listens on should have a deliberate firewall rule. Comparing listening services with the iptables rules finds services exposed by accident and rules left from removed services. Because the required ports depend on the system's role, this is a manual review item.
    remediation: &rem-d49de86ca0 |
      Compare the listening ports with the iptables rules and add an accept rule for each port the system must offer; stop services that should not listen.

      ss -tulnH
      iptables -L INPUT -v -n
      iptables -A INPUT -p PROTOCOL --dport PORT -m conntrack --ctstate NEW -j ACCEPT
