  - id: "CIS-UBUNTU18-4.1.4-auditd_identity_cnf"
    name: "auditd identity cnf: grep identity /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 4.1.4."
    tags: [cis, cis-ubuntu18, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep identity /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -w /etc/group -p wa -k identity" }
      - { some: "~ -w /etc/passwd -p wa -k identity" }
      - { some: "~ -w /etc/gshadow -p wa -k identity" }
      - { some: "~ -w /etc/shadow -p wa -k identity" }
      - { some: "~ -w /etc/security/opasswd -p wa -k identity" }
    rationale: &rat-29e0efdb1e |
      The files that define users, groups, passwords and the authentication stack control who can log in and with which privileges. Watching them for writes and attribute changes makes it possible to detect unauthorised account creation or privilege changes. This check verifies the persistent audit configuration.
    remediation: &rem-549e959151 |
      Watch the account, group, password and PAM configuration files for changes: add the following rules to /etc/audit/rules.d/50-identity.rules and load them.

      -w /etc/group -p wa -k identity
      -w /etc/passwd -p wa -k identity
      -w /etc/gshadow -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/security/opasswd -p wa -k identity
      -w /etc/nsswitch.conf -p wa -k identity
      -w /etc/pam.conf -p wa -k identity
      -w /etc/pam.d -p wa -k identity

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
