    severity: low
    run: |
      modprobe -n -v TIPC
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ install /(usr/)?bin/(true|false)" }
    rationale: &rat-94829ab02a |
      TIPC is a cluster communication protocol that few systems use, and its kernel code has had remotely exploitable vulnerabilities. Mapping the module to /bin/false in the modprobe configuration prevents it from being loaded on demand, for example when a program opens a TIPC socket.
    remediation: *rem-f85d3137a2
  - id: "CIS-UBUNTU18-3.5.1.1-ufw"
    name: "Package ufw is installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.1.1."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' ufw 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-8061e449a6 |
      A host firewall limits which network services are reachable and contains the damage of a compromised neighbour. On Debian and Ubuntu, ufw is the simple front end for managing those rules; where another tool such as firewalld, nftables or iptables is chosen, ufw should be absent, because two firewall managers overwrite each other's rules and leave the effective policy unpredictable.
    remediation: &rem-659dd3ebf2 |
      Install the package ufw:

      apt-get install ufw
  - id: "CIS-UBUNTU18-3.5.1.2-iptables-persistent"
    name: "Package iptables-persistent is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.1.2."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' iptables-persistent 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-0a31466bda |
      Which firewall persistence tool is present has to match the chosen firewall. With ufw or nftables, iptables-persistent loads a competing rule set at boot and should not be installed; where plain iptables is the chosen firewall, it is needed so the rules are restored after a reboot.
    remediation: &rem-c2c4e0c0a6 |
      Remove the package iptables-persistent, unless the system needs it:

      apt-get purge iptables-persistent
  - id: "CIS-UBUNTU18-3.5.1.3-ufw-enabled"
    name: "Service ufw is enabled"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.1.3."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState ufw | cut -d= -f2
    expect: "~ ^enabled"
    rationale: *rat-8061e449a6
    remediation: &rem-3bd9f4aa3b |
      Enable the service ufw:

      systemctl enable ufw
  - id: "CIS-UBUNTU18-3.5.1.3-ufw-running"
    name: "Service ufw is running"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.1.3."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState ufw | cut -d= -f2
    expect: "== active"
    rationale: *rat-8061e449a6
    remediation: &rem-36d5563792 |
      Start the service ufw:

      systemctl start ufw
  - id: "CIS-UBUNTU18-3.5.1.4-ufw_local"
    name: "ufw local: ufw status verbose"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.1.4."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      ufw status verbose
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Anywhere on lo             ALLOW IN    Anywhere" }
      - { some: "~ ^Anywhere                   DENY IN     127.0.0.0\\/8" }
      - { some: "~ ^Anywhere (v6) on lo        ALLOW IN    Anywhere (v6)" }
      - { some: "~ ^Anywhere (v6)              DENY IN     ::1" }
      - { some: "~ ^Anywhere                   ALLOW OUT   Anywhere on lo" }
      - { some: "~ ^Anywhere (v6)              ALLOW OUT   Anywhere (v6) on lo" }
    rationale: &rat-43e2635bfc |
      Many local services communicate over the loopback interface, so it must be allowed. At the same time, packets from the network claiming a loopback source address are always spoofed and should be dropped, because some services trust localhost connections.
    remediation: &rem-933ca34bc5 |
      Allow traffic on the loopback interface and deny loopback source addresses arriving on other interfaces, then make sure ufw is active.

      ufw allow in on lo
      ufw allow out on lo
      ufw deny in from 127.0.0.0/8
      ufw deny in from ::1
      ufw enable

      Add the allow rules before the deny rules, because ufw evaluates rules in order.
  - id: "CIS-UBUNTU18-3.5.1.5-ufw_outbound"
    name: "ufw outbound: echo \"Manual - Please confirm firewall outbound Policies match site policies\""
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.1.5."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual - Please confirm firewall outbound Policies match site policies"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Manual" }
    rationale: &rat-9eae47b76a |
      Outbound rules decide which connections the host may initiate. Limiting them to what the system needs restricts data exfiltration and the ability of malware to reach command-and-control servers. Because the right rules depend on the system's role, this is a manual review item.
    remediation: &rem-ed9bb3aa66 |
      Review the outbound ufw rules against the site policy and allow only the outgoing traffic the system needs.

      ufw status verbose
      ufw allow out PORT/PROTOCOL

      This is a manual review item: the automated check always reports it so that the result is reviewed and documented.
  - id: "CIS-UBUNTU18-3.5.1.6-ufw_open_ports"
    name: "ufw open ports: echo \"Manual - Please confirm firewall rules exist for open ports match site policies\""
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.1.6."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual - Please confirm firewall rules exist for open ports match site policies"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Manual" }
    rationale: &rat-2b1e73def8 |
      Every port the system listens on should be covered by a deliberate firewall rule. Comparing listening services with the firewall configuration finds services exposed by accident and rules left over from removed services. Because the required ports depend on the system's role, this is a manual review item.
    remediation: &rem-7fe6e6d4a7 |
      Compare the listening ports with the ufw rules. Add an allow rule for each port the system must offer, and stop or remove services that should not be listening.

      ss -tulnH
      ufw status verbose
      ufw allow in PORT/PROTOCOL

      This is a manual review item: the automated check always reports it so that the result is reviewed and documented.
  - id: "CIS-UBUNTU18-3.5.1.7-ufw_def_deny"
    name: "ufw def deny: echo \"Manual - Please confirm firewall default deny policy match site policies\""
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.1.7."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual - Please confirm firewall default deny policy match site policies"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Manual" }
    rationale: &rat-6599e3e627 |
      A default deny policy for incoming, outgoing and routed traffic means that anything not explicitly allowed is blocked, so new services or misconfigurations are not exposed automatically. Required traffic must be allowed first, otherwise the system may become unreachable.
    remediation: &rem-b1ac0ee840 |
      Allow all required traffic first, then set the default policies to deny incoming and outgoing and to disable routing.

      ufw allow in on lo
      ufw allow out on lo
      ufw allow in ssh
      ufw allow out PORT/PROTOCOL
      ufw default deny incoming
      ufw default deny outgoing
      ufw default disable routed

      Denying outgoing traffic blocks DNS, NTP and package updates unless allowed. On Ubuntu 18.04 this is a manual review item that the check always reports.
  - id: "CIS-UBUNTU18-3.5.2.1-nftables"
    name: "Package nftables is installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.2.1."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' nftables 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-059df58fe1 |
      Exactly one tool should manage the host firewall. Where nftables is the chosen firewall, its package has to be installed and its service enabled and running so the rule set is loaded at boot. Where firewalld is used instead, the nftables service must not run alongside it. The expected state therefore depends on the platform.
    remediation: &rem-9c3f5c72b8 |
      Install the package nftables:

      apt-get install nftables
  - id: "CIS-UBUNTU18-3.5.2.2-ufw"
    name: "Package ufw is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.2.2."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' ufw 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: *rat-8061e449a6
    remediation: &rem-7f6d83d359 |
      Remove the package ufw, unless the system needs it:

      apt-get purge ufw
  - id: "CIS-UBUNTU18-3.5.2.3-ip6tables_flushed"
    name: "ip6tables flushed: ip6tables -L"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.2.3."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      ip6tables -L
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-03baa320d4 |
      When nftables is the active firewall, leftover ip6tables rules are evaluated alongside it, which makes the effective policy hard to understand and can create gaps or conflicts. Flushing the ip6tables rule set ensures only one framework defines the IPv6 filtering.
    remediation: &rem-cc914e3e86 |
      Flush and delete all ip6tables rules and user-defined chains, and stop restoring them at boot.

      for t in filter nat mangle raw security; do ip6tables -t $t -F; ip6tables -t $t -X; done
      rm -f /etc/iptables/rules.v6

      Make sure the nftables rule set covers IPv6 before flushing.
  - id: "CIS-UBUNTU18-3.5.2.3-iptables_flushed"
    name: "iptables flushed: iptables -L"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.2.3."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      iptables -L
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-ec8b571f0c |
      When nftables manages the firewall, leftover iptables rules are applied in addition to it and make the effective filtering hard to understand or unintentionally open. Flushing the iptables rules ensures only the nftables rule set determines which traffic is allowed.
    remediation: &rem-0a38fd6fc9 |
      When nftables is the firewall, remove all IPv4 rules and user-defined chains from iptables.

      iptables -F
      iptables -X
      iptables -Z

      If iptables-persistent is installed, remove it (apt-get purge iptables-persistent) or empty /etc/iptables/rules.v4, otherwise the rules are restored at boot.
  - id: "CIS-UBUNTU18-3.5.2.4-nft_tables"
    name: "nft tables: echo \"Manual - Please confirm nfttables table exists and matched site policy\""
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.2.4."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual - Please confirm nfttables table exists and matched site policy"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Manual" }
    rationale: &rat-d4612286c4 |
      nftables only filters traffic once a table exists to hold its chains and rules. Confirming that a table exists and matches the site policy ensures the firewall is actually configured rather than just installed. This is a manual review item.
    remediation: &rem-9e08a19679 |
      List the nftables tables and create one if none exists.

      nft list tables
      nft create table inet filter

      This is a manual review item: the automated check always reports it so that the result is reviewed and documented.
  - id: "CIS-UBUNTU18-3.5.2.5-nft_chains"
    name: "nft chains: echo \"Manual - Please confirm nfttables base chain exists and matched site policy\""
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.2.5."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual - Please confirm nfttables base chain exists and matched site policy"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Manual" }
    rationale: &rat-03d23b9486 |
      Base chains attach nftables rules to the kernel's packet processing hooks. Without input, forward and output base chains, the rules in a table never see any traffic. This is a manual review item.
    remediation: &rem-ca04b9bc75 |
      Create base chains for the input, forward and output hooks in the filter table.

      nft create chain inet filter input '{ type filter hook input priority 0; }'
      nft create chain inet filter forward '{ type filter hook forward priority 0; }'
      nft create chain inet filter output '{ type filter hook output priority 0; }'

      This is a manual review item: the automated check always reports it so that the result is reviewed and documented.
  - id: "CIS-UBUNTU18-3.5.2.6-nft_loopback"
    name: "nft loopback: echo \"Manual - Please confirm nfttables loopback traffic configured and matched site poli…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.2.6."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual - Please confirm nfttables loopback traffic configured and matched site policy"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Manual" }
    rationale: &rat-9e8cd593c2 |
      Local services rely on loopback traffic, so it must be accepted, while packets from the network claiming a loopback source address are always spoofed and must be dropped. This protects services that only listen on localhost. This is a manual review item.
    remediation: &rem-ac197a7b1e |
      Accept loopback traffic and drop loopback source addresses arriving on other interfaces.

      nft add rule inet filter input iif lo accept
      nft add rule inet filter input ip saddr 127.0.0.0/8 counter drop
      nft add rule inet filter input ip6 saddr ::1 counter drop

      This is a manual review item: the automated check always reports it so that the result is reviewed and documented.
  - id: "CIS-UBUNTU18-3.5.2.7-nft_conns"
    name: "nft conns: echo \"Manual - Please confirm nfttables connections are configured and matched site polic…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.2.7."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual - Please confirm nfttables connections are configured and matched site policy"
