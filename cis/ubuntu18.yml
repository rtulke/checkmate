  - id: "CIS-UBUNTU18-1.1.2-tmp"
    name: "/tmp is a separate mount"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.1.2."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/tmp'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: &rat-be51b66bde |
      /tmp is writable by every user. A separate file system for it, mounted with noexec, nodev and nosuid, keeps users from filling the root file system and blocks common attack steps such as running dropped tools, creating device files or using planted setuid programs.
    remediation: &rem-fbf7b93a5e |
      Put /tmp on a separate file system (partition or logical volume) and mount it there with an entry in /etc/fstab or a systemd mount unit. This needs a new file system and moving the existing data. A tmpfs mount on /tmp, e.g. with systemd's tmp.mount, counts as well.
