    expect: empty
    rationale: &rat-db1efd99eb |
      auditd.conf decides how large audit logs may grow and what happens when they or the disk fill up. Keeping logs instead of rotating them away, alerting when space runs low and halting when it is exhausted ensure that audit records are not silently lost.
