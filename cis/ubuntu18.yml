  - id: "CIS-UBUNTU18-4.1.5-auditd_locale_cnf"
    name: "auditd locale cnf: grep system-locale /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 4.1.5."
    tags: [cis, cis-ubuntu18, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
