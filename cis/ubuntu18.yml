      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7077)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-5cb8691ff6 |
      Files in /etc/cron.d define system jobs that can run as any user, including root. If unprivileged users could add or change files there they could run commands as root; read access reveals privileged jobs. Ownership by root and mode 0700 prevent this.
    remediation: &rem-33b07f66ca |
      Create /etc/cron.d if it is missing, then set owner root and group root and remove the permissions u-s,g-rwxs,o-rwx,a-t:

