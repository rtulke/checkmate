  - id: "CIS-UBUNTU18-2.2.6-rpcbind"
    name: "Package rpcbind is not installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.2.6."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' rpcbind 2>/dev/null | grep -q 'install ok installed'
    expect: false
    rationale: &rat-8a6c37a84c |
      rpcbind maps RPC program numbers to network ports and is required mainly by NFS and NIS. It listens on the network, can disclose which RPC services run on the host and has been abused for DDoS amplification. Disable or remove it unless NFS or other RPC services are in use.
    remediation: &rem-7daa44e56e |
