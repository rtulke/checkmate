    expect: { rc: "== 0" }
    rationale: &rat-562407ef6d |
      /home holds user data that users can write freely. Mounting it with nodev prevents users from creating device files there to access hardware directly. On a separate file system user data also cannot fill the root file system.
    remediation: &rem-702e477e3a |
      Put /home on a separate file system (partition or logical volume) and mount it there with an entry in /etc/fstab or a systemd mount unit. This needs a new file system and moving the existing data.
  - id: "CIS-UBUNTU18-1.1.17-home-2"
    name: "/home is a separate mount with nodev"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.1.17."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/home'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nodev(,|$)"
    rationale: *rat-562407ef6d
    remediation: &rem-df8c1696fc |
      Mount /home with the option nodev: add it to the options of /home in /etc/fstab (or its systemd mount unit), then apply:

