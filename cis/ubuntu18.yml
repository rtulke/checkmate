  - id: "CIS-UBUNTU18-1.1.22-sticky_bit"
    name: "sticky bit: df --local -P 2\u003e /dev/null | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev …"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.1.22."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 60000ms
    run: |
      df --local -P 2> /dev/null | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type d \( -perm -0002 -a ! -perm -1000 \) 2>/dev/null
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-efff70ba56 |
      In a world-writable directory without the sticky bit, any user can delete or rename files owned by others, enabling denial of service and attacks such as swapping a file another process is about to use. The sticky bit limits removal and renaming to the file owner, the directory owner and root, as is standard for /tmp.
    remediation: &rem-2801f3f799 |
      Review each directory reported by the check. Set the sticky bit if it must remain world-writable, otherwise remove the write permission for others.

      chmod a+t DIR
      chmod o-w DIR
  - id: "CIS-UBUNTU18-1.1.23-autofs-enabled"
    name: "Service autofs is not enabled"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.1.23."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p UnitFileState autofs | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-be672be210 |
      autofs mounts file systems, including removable media and network shares, automatically on access. This lets users without privileges bring in media with malicious content or trigger mounts of untrusted sources. Unless automatic mounting is needed, the service should be disabled.
    remediation: &rem-7661f5c35e |
      Disable the service autofs, unless the system needs it:

      systemctl disable autofs

      To keep other units from starting it, mask it instead: systemctl mask autofs
  - id: "CIS-UBUNTU18-1.1.23-autofs-running"
    name: "Service autofs is not running"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 1.1.23."
    tags: [cis, cis-ubuntu18, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      systemctl show -p ActiveState autofs | cut -d= -f2
    expect: "!= active"
    rationale: *rat-be672be210
    remediation: &rem-07a8398219 |
      Stop the service autofs, unless the system needs it:

      systemctl stop autofs
