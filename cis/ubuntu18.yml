      f='/etc/sudoers'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-3523c85d53 |
      Running sudo commands in a pseudo terminal prevents a backgrounded process from injecting input into the user's terminal after the command ends. A dedicated sudo log file keeps a separate, easy to review record of all privileged commands.
    remediation: &rem-b6090d151e |
      Create /etc/sudoers.
  - id: "CIS-UBUNTU18-5.2.2-etc_sudoers-content"
