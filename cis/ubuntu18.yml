    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ net.ipv4.conf.all.rp_filter = 1" }
    rationale: &rat-709c3ad7d6 |
      Reverse path filtering drops packets whose source address would not be routed back through the interface they arrived on. Strict filtering (value 1) blocks many spoofed packets used in denial-of-service and spoofing attacks. Systems with asymmetric routing may need loose mode and should be treated as an exception.
    remediation: &rem-8d83a99485 |
