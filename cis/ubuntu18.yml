  - id: "CIS-UBUNTU18-5.1.1-cron"
    name: "Package cron is installed"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.1.1."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      dpkg-query -W -f='${Status}' cron 2>/dev/null | grep -q 'install ok installed'
    expect: true
    rationale: &rat-23d53a9a2b |
      cron runs scheduled jobs such as log rotation, integrity checks and other maintenance. If the daemon is not installed, enabled and running, these security-relevant tasks silently stop.
    remediation: &rem-3da5cd76b8 |
