  - id: "CIS-UBUNTU18-3.2.1-ipv4_disable_all_redirect"
    name: "ipv4 disable all redirect: grep -E \"^\\s*net\\.ipv4\\.conf\\.all\\.send_redirects\" /etc/sysctl.conf /etc/sysctl.d/*"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.2.1."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E "^\s*net\.ipv4\.conf\.all\.send_redirects" /etc/sysctl.conf /etc/sysctl.d/*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ .*:net.ipv4.conf.all.send_redirects=0" }
    rationale: &rat-8d203c21e1 |
      ICMP redirects tell other hosts to use a different route. Only routers should send them; a host that sends redirects could, if compromised, be used to misdirect traffic of other systems. Disabling sending on all interfaces prevents this.
    remediation: &rem-0387013d32 |
      Set net.ipv4.conf.all.send_redirects to 0 in a file in /etc/sysctl.d/ and apply it at runtime. Correct any other file that sets a different value (the check command lists them).

      printf '%s\n' 'net.ipv4.conf.all.send_redirects=0' >> /etc/sysctl.d/60-netipv4_sysctl.conf
      sysctl -w net.ipv4.conf.all.send_redirects=0
      sysctl -w net.ipv4.route.flush=1

      Files in /etc/sysctl.d/ are applied in lexical order, so a later file can override this setting.
