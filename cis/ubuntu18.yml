    expect: empty
    rationale: &rat-34082207bf |
      Firewall rules that only exist in the running kernel are lost on reboot, leaving the system unprotected. /etc/nftables.conf holds the persistent nftables ruleset that is loaded at boot.
    remediation: &rem-0111bdad91 |
      Create /etc/nftables.conf.
  - id: "CIS-UBUNTU18-3.5.2.10-nft_rules"
    name: "nft rules: echo \"Manual - Please review nfttables configuration and matches site policy\""
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.2.10."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual - Please review nfttables configuration and matches site policy"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ .*" }
    rationale: &rat-b580f821a1 |
      The nftables rule set must be saved in the boot configuration and loaded by the nftables service, otherwise the system starts unprotected after a reboot. Reviewing the stored configuration against the site policy ensures the persistent rules match what is intended. This is a manual review item.
    remediation: &rem-8ec412dee0 |
      Save the reviewed rule set to /etc/nftables.conf and enable the nftables service so it is loaded at boot.

      nft list ruleset
      printf '%s\n' '#!/usr/sbin/nft -f' 'flush ruleset' > /etc/nftables.conf
      nft list ruleset >> /etc/nftables.conf
      systemctl enable nftables

      This is a manual review item: the automated check always reports it so that the result is reviewed and documented.
