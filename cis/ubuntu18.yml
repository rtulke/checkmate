    rationale: &rat-d4f3bcc691 |
      Removable optical media can carry device files, setuid programs or executables prepared on another system. Mounting such media with nodev prevents device files on them from giving access to hardware. The check accepts systems without an fstab entry for such media.
    remediation: &rem-dda751f97a |
      Remove the cdrom entry from /etc/fstab and mount cdrom media manually only when needed, with the options nodev,nosuid,noexec. List the entries, then delete those lines with an editor:

      grep -n -i cdrom /etc/fstab

      Commented-out lines also count for this check, so delete them rather than commenting them out.
