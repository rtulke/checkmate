      apt-get purge rpcbind
  - id: "CIS-UBUNTU18-2.3-non_essen_svcs"
    name: "non essen svcs: echo \"Manual -  checking of services that are not required are removed or masked\""
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 2.3."
    tags: [cis, cis-ubuntu18, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual -  checking of services that are not required are removed or masked"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Manual" }
    rationale: &rat-bc8e0605a2 |
      Every running network service is a potential entry point. Services that are not required for the system's role should be removed or masked so they cannot be started or exploited.
    remediation: &rem-9d2bbae22f |
      Review the listening and running services and remove or mask those that are not required.

      ss -plntu
      systemctl list-units --type=service --state=running
      apt-get purge PACKAGE
      systemctl --now mask SERVICE

      This is a manual review; the check always passes.
  - id: "CIS-UBUNTU18-3.1.2-wireless_disabled"
    name: "wireless disabled: nmcli radio all | tail -1"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.1.2."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: medium
    run: |
      nmcli radio all | tail -1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(enabled|disabled)\\s\\s(disabled)\\s\\s(enabled|disabled)\\s\\s(disabled)" }
    rationale: &rat-0d79aa42e1 |
      Wireless interfaces open a network path that bypasses wired network controls such as firewalls and segmentation, and they expose the system to attackers within radio range. Servers rarely need them; turning off the radios or blocking their drivers removes this exposure.
    remediation: &rem-aa6b351acd |
      Block the driver module of every wireless interface so that no wireless interface comes up. Find each interface's driver, block it and unload it:

      basename "$(readlink -f /sys/class/net/IFACE/device/driver/module)"
      printf 'blacklist %s\ninstall %s /bin/false\n' MODULE MODULE >> /etc/modprobe.d/blacklist-wireless.conf
      modprobe -r MODULE

      On Ubuntu 20.04 every module under drivers/net/wireless must be named in /etc/modprobe.d/blacklist-wireless.conf:
      find /lib/modules/$(uname -r)/kernel/drivers/net/wireless -name '*.ko' -printf '%f\n' | sed 's/\.ko$//' | sort -u | while read -r m; do printf 'blacklist %s\ninstall %s /bin/false\n' "$m" "$m"; done >> /etc/modprobe.d/blacklist-wireless.conf

      On Ubuntu 18.04 the check reads NetworkManager instead:
      nmcli radio all off
  - id: "CIS-UBUNTU18-3.2.1-net.ipv4.conf.all.send_redirects"
    name: "Kernel parameter net.ipv4.conf.all.send_redirects is 0"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.2.1."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.all.send_redirects
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-e772f5113d |
      Routers send ICMP redirects to tell hosts about better routes. A system that is not a router has no reason to send them, and an attacker who controls it could use redirects to divert other hosts' traffic. The 'all' setting applies to all current interfaces.
    remediation: &rem-9e5a0d6d8d |
      Set the kernel parameter net.ipv4.conf.all.send_redirects to 0, now and at boot:

      sysctl -w 'net.ipv4.conf.all.send_redirects=0'
      printf '%s\n' 'net.ipv4.conf.all.send_redirects = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.conf.all.send_redirects from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
