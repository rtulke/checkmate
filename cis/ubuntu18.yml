  - id: "CIS-UBUNTU18-4.1.3-auditd_time_cnf"
    name: "auditd time cnf: grep time-change /etc/audit/rules.d/*.rules"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 4.1.3."
    tags: [cis, cis-ubuntu18, cis-section-4, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    run: |
      grep time-change /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change" }
      - { some: "~ -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k time-change" }
      - { some: "~ -a always,exit -F arch=b64 -S clock_settime -k time-change" }
      - { some: "~ -a always,exit -F arch=b32 -S clock_settime -k time-change" }
      - { some: "~ -w /etc/localtime -p wa -k time-change" }
    rationale: &rat-1630928119 |
      Reliable timestamps are essential for correlating log entries and reconstructing events. Auditing changes to the system clock and the local time zone reveals attempts to manipulate time in order to confuse log analysis or bypass time-based controls. This check verifies the persistent audit configuration.
    remediation: &rem-9182d44748 |
      Record changes to the system time and time zone: add the rules for your release to /etc/audit/rules.d/50-time-change.rules and load them.

      Debian 11, Debian 12 and Ubuntu 20.04:
      -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time-change
      -a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime -k time-change
      -w /etc/localtime -p wa -k time-change

      Debian 13:
      -a always,exit -F arch=b64 -S adjtimex,settimeofday -k time-change
      -a always,exit -F arch=b64 -S clock_settime -F a0=0x0 -k time-change
      -a always,exit -F arch=b64 -S all -F path=/etc/localtime -F perm=wa -k time-change

      Ubuntu 18.04:
      -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change
      -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k time-change
      -a always,exit -F arch=b64 -S clock_settime -k time-change
      -a always,exit -F arch=b32 -S clock_settime -k time-change
      -w /etc/localtime -p wa -k time-change

      Ubuntu 22.04 and Ubuntu 24.04:
      -a always,exit -F arch=b64 -S adjtimex,settimeofday -k time-change
      -a always,exit -F arch=b32 -S adjtimex,settimeofday -k time-change
      -a always,exit -F arch=b64 -S clock_settime -F a0=0x0 -k time-change
      -a always,exit -F arch=b32 -S clock_settime -F a0=0x0 -k time-change
      -w /etc/localtime -p wa -k time-change

      augenrules --load

      If the audit configuration is immutable (-e 2), the new rules take effect only after a reboot.
