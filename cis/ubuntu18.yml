      cat '/etc/login.defs'
    allow_rc: any
    expect:
      - { some: "~ ^PASS_WARN_AGE\\s*7" }
      - { none: "~ ^PASS_WARN_AGE\\s*[1-6]" }
    rationale: *rat-df170e4b67
    remediation: &rem-52765d33ac |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^PASS_WARN_AGE\s*7
      - no line matches ^PASS_WARN_AGE\s*[1-6]
  - id: "CIS-UBUNTU18-5.5.1.3-user_expire_warn"
    name: "user expire warn: awk -F: '(/^[^:]+:[^!*]/ \u0026\u0026 $6\u003c7){print $1 \" \" $6}' /etc/shadow"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.5.1.3."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '(/^[^:]+:[^!*]/ && $6<7){print $1 " " $6}' /etc/shadow
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ ^.*" }
    rationale: &rat-5f8c45990f |
      A warning period before a password expires gives users time to choose a new password in a controlled way instead of being locked out or rushing a weak choice. Existing accounts need the setting as well, not only the login.defs default.
    remediation: &rem-edbb93fcbd |
      Set a password expiry warning of at least 7 days for each account that has a password, and the same default for new accounts.

      awk -F: '($2~/^\$.+\$/) {print $1, $6}' /etc/shadow
      chage --warndays 7 USER
      sed -ri 's/^\s*PASS_WARN_AGE\s+.*/PASS_WARN_AGE 7/' /etc/login.defs
  - id: "CIS-UBUNTU18-5.5.1.4-inactive_passwd"
    name: "inactive passwd: useradd -D | grep INACTIVE"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.5.1.4."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      useradd -D | grep INACTIVE
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^INACTIVE=[1-30]" }
    rationale: &rat-1b1499cc8f |
      The default INACTIVE value used by useradd defines how many days after password expiry an account is disabled. Disabling unused accounts automatically removes forgotten access paths that attackers like to exploit; a value of up to 30 or 45 days, depending on the policy, balances security and usability.
    remediation: &rem-728ced36b8 |
      Set the default password inactivity period for new accounts to 30 days and apply the same value to existing accounts that have a password.

      useradd -D -f 30
      useradd -D | grep INACTIVE
      chage --inactive 30 USER

      30 days satisfies every supported release; some releases also accept up to 45 days.
  - id: "CIS-UBUNTU18-5.5.1.4-inactive_users"
    name: "inactive users: grep -E ^[^:]+:[^\\!*] /etc/shadow | grep -vw root | cut -d : -f1,7"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.5.1.4."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -E ^[^:]+:[^\!*] /etc/shadow | grep -vw root | cut -d : -f1,7
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-c4a4e8be14 |
      Accounts whose password has expired but which remain usable indefinitely are a common foothold for attackers because nobody notices their misuse. Setting a password inactivity period on every account with a password ensures that such accounts are disabled automatically after expiry.
    remediation: &rem-4e712889d3 |
      Set a password inactivity period of 30 days or less on every account that has a password, in particular on each account reported by the check.

      awk -F: '($2 ~ /^\$/) {print $1, $7}' /etc/shadow
      chage --inactive 30 USER

      Set the default for new accounts as well with useradd -D -f 30.
  - id: "CIS-UBUNTU18-5.5.1.5-passwd_chg_past"
    name: "No user has a last password change date in the future"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.5.1.5."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      now=$(date +%s)
      for usr in $(cut -d: -f1 /etc/shadow); do
        d=$(chage --list "$usr" 2>/dev/null | awk -F': ' '/^Last password change/ {print $2}')
        case "$d" in ""|never|*"must be changed"*) continue ;; esac
        t=$(date -d "$d" +%s 2>/dev/null) || { echo "$usr: cannot parse last password change '$d'"; continue; }
        if [ "$t" -gt "$now" ]; then echo "$usr: last password change $d is in the future"; fi
      done
    expect: empty
    rationale: &rat-eae9c8e6b4 |
      If the recorded date of the last password change lies in the future, password ageing does not work: the password never expires and the user cannot be forced to change it. Such dates usually result from a wrong system clock or manual edits and should be corrected.
    remediation: &rem-8950b282e3 |
      Check the system clock, then set the last password change of every listed user to today, or expire the password so it must be changed at the next login:

      chage --lastday "$(date +%Y-%m-%d)" USER
      chage --lastday 0 USER
  - id: "CIS-UBUNTU18-5.5.2-secure_system_LK"
    name: "secure system LK: /awk -F: '$3\u003c1000' /etc/passwd | egrep -wv 'root' | cut -d: -f1 | xargs -I '{}' passwd -S…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.5.2."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      /awk -F: '$3<1000' /etc/passwd | egrep -wv 'root' | cut -d: -f1 | xargs -I '{}' passwd -S '{}' | egrep -cvw 'LK|L'/
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { some: "~ 0" }
    rationale: &rat-fac0721bde |
      System accounts exist to own files and run services; they are not meant for interactive logins. Locking their passwords ensures that nobody can authenticate as such an account with a password, which removes a class of easily overlooked access paths.
    remediation: &rem-c1d7b7b88a |
      Lock the password of every system account (UID below 1000, except root) that is not locked yet.

      awk -F: '($3 < 1000 && $1 != "root") {print $1}' /etc/passwd | xargs -n 1 passwd -S
      usermod -L USER

      Locking disables password authentication only; services running under these accounts keep working.
  - id: "CIS-UBUNTU18-5.5.2-secure_system_accts"
    name: "secure system accts: /awk -F: '$3\u003c1000' /etc/passwd | egrep -v 'root|sync|halt|shutdown|/sbin/nologin|/bin/fal…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.5.2."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      /awk -F: '$3<1000' /etc/passwd | egrep -v 'root|sync|halt|shutdown|/sbin/nologin|/bin/false'/
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-6f6bd67ce7 |
      System and service accounts do not need an interactive shell. If one of them has a valid login shell, a weakness in a service or a misconfigured password can give an attacker an interactive session under that account. Setting the shell to nologin prevents this.
    remediation: &rem-7ac335f9ab |
      Set the login shell of every system account reported by the check to /usr/sbin/nologin.

      awk -F: '($3 < 1000 || $3 == 65534) {print $1, $7}' /etc/passwd
      usermod -s /usr/sbin/nologin USER

      Accounts root, sync, shutdown and halt are exempt. Make sure no service needs an interactive shell for the account before changing it.
  - id: "CIS-UBUNTU18-5.5.3-root"
    name: "User root has UID 0 and GID 0"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.5.3."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      getent passwd root
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ ^root:[^:]*:0:0:"
    rationale: &rat-d7d4d06032 |
      Many system components, file ownerships and administrative procedures assume a root account with UID 0 exists. Its presence is a prerequisite for the other root-related checks, such as password and login restrictions, to be meaningful.
    remediation: &rem-f77400a1aa |
      Make GID 0 the primary group of root:

      usermod -g 0 root

      root must have the UID 0. A different UID means the account database was changed; compare /etc/passwd with a backup and correct the entry with vipw instead of renumbering files.
  - id: "CIS-UBUNTU18-5.5.4-etc_pam.d_common-session-attrs"
    name: "/etc/pam.d/common-session: exists"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.5.4."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/common-session'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-44bb1db750 |
      The default umask determines the permissions of newly created files. A restrictive umask applied through pam_umask keeps new files from being readable or writable by other users unless explicitly shared.
    remediation: &rem-3e5b996c7b |
      Create /etc/pam.d/common-session.
  - id: "CIS-UBUNTU18-5.5.4-etc_pam.d_common-session-content"
    name: "/etc/pam.d/common-session has the expected content (3 rules)"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.5.4."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/common-session'
    allow_rc: any
    expect:
      - { some: "~ ^session\\s*optional\\s*pam_umask.so" }
      - { some: "~ ^\\s+umask\\s0(2|7)(2|7)" }
      - { none: "~ ^\\s+umask\\s[1-7][0-7][0-7]" }
    rationale: *rat-44bb1db750
    remediation: &rem-83d17e4f40 |
      Edit /etc/pam.d/common-session so that its lines meet these conditions (regular expressions):

      - a line matches ^session\s*optional\s*pam_umask.so
      - a line matches ^\s+umask\s0(2|7)(2|7)
      - no line matches ^\s+umask\s[1-7][0-7][0-7]
  - id: "CIS-UBUNTU18-5.5.4-umask_027"
    name: "umask 027: grep -RPi \"'(^|^[^#]*)\\s*umask\\s+([0-7][0-7][01][0-7]\\b|[0-7][0-7][0-7][0-6]\\b|[0-7][01][…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.5.4."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep -RPi "'(^|^[^#]*)\s*umask\s+([0-7][0-7][01][0-7]\b|[0-7][0-7][0-7][0-6]\b|[0-7][01][0-7]\b|[0-7][0-7][0-6]\b|(u=[rwx]{0,3},)?(g=[rwx]{0,3},)?o=[rwx]+\b|(u=[rwx]{1,3},)?g=[^rx]{1,3}(,o=[rwx]{0,3})?\b)'" /etc/login.defs /etc/profile* /etc/bash.bashrc*
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-61aff1c9cd |
      With a permissive default umask such as 022, every file a user creates is readable by all other users. A umask of 027 or stricter prevents unintentional disclosure and keeps group members from modifying files.
    remediation: &rem-7d5034c008 |
      Set the default umask to 027 and change every weaker umask setting in the shell startup files.

      sed -ri 's/^\s*UMASK\s+.*/UMASK 027/' /etc/login.defs
      printf '%s\n' 'umask 027' > /etc/profile.d/50-umask.sh
      grep -RPin '^\s*umask\s+' /etc/login.defs /etc/profile* /etc/bash.bashrc*

      Edit each listed line that sets a weaker value (group write or any access for others) to umask 027.
  - id: "CIS-UBUNTU18-5.5.5-etc_profile.d_tmout.sh-attrs"
    name: "/etc/profile.d/tmout.sh: exists"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.5.5."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/profile.d/tmout.sh'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f83d06fbd2 |
      Shell sessions left open on an unattended terminal can be misused by anyone passing by. Setting TMOUT to 900 seconds or less, read-only and exported, makes the shell terminate idle sessions automatically and prevents users from switching the timeout off.
    remediation: &rem-d92e4786c7 |
      Create /etc/profile.d/tmout.sh.
  - id: "CIS-UBUNTU18-5.5.5-etc_profile.d_tmout.sh-content"
    name: "/etc/profile.d/tmout.sh has the expected content (2 rules)"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.5.5."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/profile.d/tmout.sh'
    allow_rc: any
    expect:
      - { some: "~ ^TMOUT=([1-8][0-9]{0,2}|900)" }
      - { some: "~ ^readonly TMOUT" }
    rationale: *rat-f83d06fbd2
    remediation: &rem-956f0d8575 |
      Edit /etc/profile.d/tmout.sh so that its lines meet these conditions (regular expressions):

      - a line matches ^TMOUT=([1-8][0-9]{0,2}|900)
      - a line matches ^readonly TMOUT
  - id: "CIS-UBUNTU18-5.6-root_system_console"
    name: "root system console: echo \"Manual check of valid terminal in /etc/securetty is required\""
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.6."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual check of valid terminal in /etc/securetty is required"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Manual.*" }
    rationale: &rat-f83340509c |
      /etc/securetty lists the terminals on which root may log in directly. Restricting it to physically secured consoles forces administrators to log in as themselves and escalate, which leaves an audit trail.
    remediation: &rem-8729f134b1 |
      Review /etc/securetty and remove every terminal that is not in a physically secure location.

      cat /etc/securetty

      This is a manual review.
  - id: "CIS-UBUNTU18-5.7-etc_group-attrs"
    name: "/etc/group: exists"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.7."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/group'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-4582689d34 |
      The wheel group is used together with pam_wheel to decide who may become root with su. Its membership must be deliberate: every member is a potential path to root, and an unexpected member widens that path. The check verifies that the group exists with the expected membership.
    remediation: &rem-c6eedafd62 |
      Create /etc/group.
  - id: "CIS-UBUNTU18-5.7-etc_group-content"
    name: "/etc/group has the expected content (1 rule)"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.7."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/group'
    allow_rc: any
    expect: { some: "~ ^wheel:x:[1-9][0-9]{1,4}:$" }
    rationale: *rat-4582689d34
    remediation: &rem-fb814d6520 |
      Edit /etc/group so that its lines meet these conditions (regular expressions):

      - a line matches ^wheel:x:[1-9][0-9]{1,4}:$
  - id: "CIS-UBUNTU18-5.7-etc_pam.d_su-attrs"
    name: "/etc/pam.d/su: exists"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.7."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/pam.d/su'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-a589ec45f0 |
      Without a restriction, any user who knows the root password can use su to become root. Requiring membership in a dedicated group through pam_wheel limits su to approved administrators and makes shared root password use more accountable.
    remediation: &rem-d67efd69b0 |
      Create /etc/pam.d/su.
  - id: "CIS-UBUNTU18-5.7-etc_pam.d_su-content"
    name: "/etc/pam.d/su has the expected content (1 rule)"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 5.7."
    tags: [cis, cis-ubuntu18, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/pam.d/su'
    allow_rc: any
    expect: { some: "~ ^auth.*required.*pam_wheel.so\\suse_uid" }
    rationale: *rat-a589ec45f0
    remediation: &rem-f709ce6ec0 |
      Edit /etc/pam.d/su so that its lines meet these conditions (regular expressions):

      - a line matches ^auth.*required.*pam_wheel.so\suse_uid
  - id: "CIS-UBUNTU18-6.1.1-rpm_filecheck"
    name: "rpm filecheck: echo \"Manual Check of packages required\""
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.1.1."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-2, cis-server, cis-level2-server, cis-workstation, cis-level2-workstation]
    severity: low
    timeout: 60000ms
    run: |
      echo "Manual Check of packages required"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Manual" }
    rationale: &rat-9f88d7b65b |
      Comparing installed files against the package database detects changed permissions, ownership or content of system files. Unexpected differences in files that are not configuration files can indicate tampering or a broken installation and should be investigated.
    remediation: &rem-c12b95e610 |
      Review the package verification output and reinstall packages whose files have changed without a legitimate reason.

      dpkg --verify
      dpkg -S FILE
      apt-get install --reinstall PACKAGE

      This is a manual check on Ubuntu 18.04 that always reports a finding; document the result of the review.
  - id: "CIS-UBUNTU18-6.1.2-passwd_perms"
    name: "passwd perms: stat -L -c \"%a %U %G\" /etc/passwd"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.1.2."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0.4][0,4] root root" }
    rationale: &rat-a167450576 |
      /etc/passwd lists all accounts and must be readable by everyone for name lookups, but only root may modify it. If others could write to it they could add accounts or change a user ID to 0 and gain root. Owner root, group root and mode 0644 provide this protection.
    remediation: &rem-6caf729613 |
      Set owner, group and permissions of /etc/passwd.

      chown root:root /etc/passwd
      chmod 0644 /etc/passwd
  - id: "CIS-UBUNTU18-6.1.3-passwd-_perms"
    name: "passwd perms: stat -L -c \"%a %U %G\" /etc/passwd-"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.1.3."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/passwd-
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (0|[4,6][0,4][0,4]) root root" }
    rationale: &rat-b4ee6fc5d0 |
      /etc/passwd- is the backup copy of the account database written by tools like useradd and vipw. It holds the same information as /etc/passwd and could be used to restore a manipulated version, so it needs the same protection: owned by root:root and not writable by others.
    remediation: &rem-e0e293ff9d |
      Set owner, group and permissions of /etc/passwd-.

      chown root:root /etc/passwd-
      chmod 0644 /etc/passwd-

      Mode 0600 is accepted as well. The Ubuntu 22.04 and 26.04 variants check /etc/passwd instead; fix it the same way.
  - id: "CIS-UBUNTU18-6.1.4-group_perms"
    name: "group perms: stat -L -c \"%a %U %G\" /etc/group"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.1.4."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/group
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0.4][0,4] root root" }
    rationale: &rat-63d76b0c8d |
      /etc/group defines group memberships, including administrative groups such as wheel. If non-root users could modify it they could add themselves to privileged groups. It must be owned by root:root with mode 0644 so it is readable but protected.
    remediation: &rem-bbf151425e |
      Set owner, group and permissions of /etc/group.

      chown root:root /etc/group
      chmod 0644 /etc/group
  - id: "CIS-UBUNTU18-6.1.5-group-_perms"
    name: "group perms: stat -L -c \"%a %U %G\" /etc/group-"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.1.5."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/group-
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0.4][0,4] root root" }
    rationale: &rat-46fe720062 |
      /etc/group- is the backup of the group database. It contains the same membership information as /etc/group and must be protected the same way, owned by root:root and not writable by others, so it cannot be used to plant manipulated group memberships.
    remediation: &rem-c35567da05 |
      Set owner, group and permissions of /etc/group-.

      chown root:root /etc/group-
      chmod 0644 /etc/group-

      Mode 0600 is accepted as well.
  - id: "CIS-UBUNTU18-6.1.6-shadow_perms"
    name: "shadow perms: stat -L -c \"%a %U %G\" /etc/shadow"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.1.6."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/shadow
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0.4]0 root (root|shadow)" }
    rationale: &rat-1890aeb8b4 |
      /etc/shadow holds the password hashes and aging data of all accounts. Read access allows offline cracking of the hashes, and write access allows setting any password or unlocking accounts. Only root, and on Debian-like and SUSE systems the shadow group, may access it.
    remediation: &rem-8bdf2121ff |
      Set owner, group and permissions of /etc/shadow.

      chown root:shadow /etc/shadow
      chmod 0640 /etc/shadow

      Group root and stricter modes are accepted as well, except on Ubuntu 18.04, which only accepts mode 0600 or 0640.
  - id: "CIS-UBUNTU18-6.1.7-shadow-_perms"
    name: "shadow perms: stat -L -c \"%a %U %G\" /etc/shadow-"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.1.7."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/shadow-
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0.4]0 root (root|shadow)" }
    rationale: &rat-8b7a9c949b |
      /etc/shadow- is the backup of the shadow file and contains password hashes, often only slightly older than the current ones. It needs the same strict protection as /etc/shadow to prevent offline password cracking.
    remediation: &rem-fab5fc2c30 |
      Set owner, group and permissions of /etc/shadow-.

      chown root:shadow /etc/shadow-
      chmod 0640 /etc/shadow-

      Group root and stricter modes are accepted as well, except on Ubuntu 18.04, which only accepts mode 0600 or 0640.
  - id: "CIS-UBUNTU18-6.1.8-gshadow_perms"
    name: "gshadow perms: stat -L -c \"%a %U %G\" /etc/gshadow"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.1.8."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/gshadow
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0.4]0 root (root|shadow)" }
    rationale: &rat-07f61f03b9 |
      /etc/gshadow contains group passwords and the lists of group administrators. Exposure allows cracking group passwords, and modification allows users to grant themselves group membership or administration rights. It must be restricted to root and, where used, the shadow group.
    remediation: &rem-0469e7c238 |
      Set owner, group and permissions of /etc/gshadow.

      chown root:shadow /etc/gshadow
      chmod 0640 /etc/gshadow

      Group root and stricter modes are accepted as well, except on Ubuntu 18.04, which only accepts mode 0600 or 0640.
  - id: "CIS-UBUNTU18-6.1.9-gshadow-_perms"
    name: "gshadow perms: stat -L -c \"%a %U %G\" /etc/gshadow-"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.1.9."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      stat -L -c "%a %U %G" /etc/gshadow-
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 6[0,4]0 root (root|shadow)" }
    rationale: &rat-6f659e3db8 |
      /etc/gshadow- is the backup of the group shadow file and contains the same sensitive group password and administrator information. It needs the same strict ownership and permissions as /etc/gshadow.
    remediation: &rem-82fe522197 |
      Set owner, group and permissions of /etc/gshadow-.

      chown root:shadow /etc/gshadow-
      chmod 0640 /etc/gshadow-

      Group root and stricter modes are accepted as well, except on Ubuntu 18.04, which only accepts mode 0600 or 0640.
  - id: "CIS-UBUNTU18-6.1.10-world_writable"
    name: "world writable: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.1.10."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 60000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -0002
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-9f0a5a248e |
      Files and directories that everyone can write to allow any user to alter data, plant malicious content or replace files that others rely on. World-writable directories without the sticky bit additionally let users delete or rename other users' files. Such permissions should be removed or justified.
    remediation: &rem-9b39034669 |
      Review each file and directory listed by the check. Remove world write access where it is not required, and set the sticky bit on directories that must stay world-writable so that users cannot delete each other's files.

      ls -ld PATH
      chmod o-w FILE
      chmod +t DIRECTORY

      Shared directories such as /tmp and /var/tmp need mode 1777; clarify with the owning application before changing other files.
  - id: "CIS-UBUNTU18-6.1.11-unowned_dirs"
    name: "unowned dirs: df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nouser"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.1.11."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 60000ms
    run: |
      df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nouser
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-ffe83ecc3b |
      Files whose owner (or group) ID does not correspond to any existing account are usually left over from deleted users or unpacked archives. If a new account later receives that ID, it automatically becomes the owner of these files. They should be assigned to a valid owner or removed.
    remediation: &rem-42672275f0 |
      Review each file listed by the check and assign it to an appropriate existing user and group, or remove it if it belonged to a deleted account and is no longer needed.

      ls -ln FILE
      chown USER:GROUP FILE
  - id: "CIS-UBUNTU18-6.1.12-no_ungrouped"
    name: "no ungrouped: df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nogroup"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.1.12."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 60000ms
    run: |
      df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nogroup
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-f90bfc406a |
      Files whose group ID does not correspond to any existing group are usually left over from deleted groups or unpacked archives. If a new group later receives that ID, its members automatically gain access to these files. Such files should be assigned to a valid group or removed.
    remediation: &rem-18d6a8b4fb |
      Review each file listed by the check and assign it to an appropriate existing group, or remove it if it is no longer needed.

      ls -ln FILE
      chgrp GROUP FILE
  - id: "CIS-UBUNTU18-6.1.13-audit_suid_exec"
    name: "audit suid exec: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.1.13."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 60000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -4000
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-6ce19f1719 |
      Setuid programs run with the owner's rights, usually root. An unexpected or modified setuid binary is a classic backdoor and privilege escalation path, so the set of setuid files should be reviewed and limited to what the system needs.
    remediation: &rem-9a33b1825f |
      Review every listed FILE: confirm it belongs to an installed package and is unmodified, and remove the setuid bit where it is not needed.

      dpkg -S FILE
      dpkg --verify PACKAGE
      chmod u-s FILE

      Standard tools such as passwd, su, sudo and mount need the setuid bit; removing it breaks them.
  - id: "CIS-UBUNTU18-6.1.14-audit_sgid"
    name: "audit sgid: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.1.14."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 60000ms
    run: |
      df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -2000
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-9073ab3ca7 |
      Set-user-ID and set-group-ID programs run with the privileges of their owner or group, often root. Unexpected or modified SUID/SGID files are a common way to escalate privileges or keep a backdoor. Regularly reviewing them, and confirming they belong to installed packages and are unmodified, helps detect such changes.
    remediation: &rem-93591d6fc4 |
      Review every SUID and SGID file the check reports. Find the owning package and verify the file against the package checksums. Reinstall packages whose files differ, investigate files that belong to no package, and remove the special bit from programs that are not needed.

      dpkg -S FILE
      dpkg -V PACKAGE
      apt-get install --reinstall PACKAGE
      chmod u-s,g-s FILE

      Do not remove the bit from programs such as passwd, su or sudo without understanding the consequences.
  - id: "CIS-UBUNTU18-6.2.1-etc_passwd-attrs"
    name: "/etc/passwd: exists"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.1."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/passwd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ace380baef |
      /etc/passwd is world-readable. Password hashes must therefore be kept in the shadow file, indicated by an 'x' in the password field; a hash stored in /etc/passwd could be copied by any local user and cracked offline.
    remediation: &rem-88dbdb7375 |
      Create /etc/passwd.
  - id: "CIS-UBUNTU18-6.2.1-etc_passwd-content"
    name: "/etc/passwd has the expected content (1 rule)"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.1."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/passwd'
    allow_rc: any
    expect: { some: "~ ^.*:x:" }
    rationale: *rat-ace380baef
    remediation: &rem-6cf53c0250 |
      Edit /etc/passwd so that its lines meet these conditions (regular expressions):

      - a line matches ^.*:x:
  - id: "CIS-UBUNTU18-6.2.2-etc_shadow-attrs"
    name: "/etc/shadow: exists"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.2."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      f='/etc/shadow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ef368ce717 |
      /etc/shadow holds the password hashes and aging data for all accounts. The content rules flag accounts whose password field indicates an unset or empty password, because such accounts can either be unlocked unnoticed or allow login without any password.
    remediation: &rem-098e77832a |
      Create /etc/shadow.
  - id: "CIS-UBUNTU18-6.2.2-etc_shadow-content"
    name: "/etc/shadow has the expected content (1 rule)"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.2."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat '/etc/shadow'
    allow_rc: any
    expect: { none: "~ ^*.[a-z]::" }
    rationale: *rat-ef368ce717
    remediation: &rem-208e81f02d |
      Edit /etc/shadow so that its lines meet these conditions (regular expressions):

      - no line matches ^*.[a-z]::
  - id: "CIS-UBUNTU18-6.2.3-passwd_group_exist"
    name: "passwd group exist: awk -F: '{print $4}' /etc/passwd |sort -u \u003e /tmp/uid \u0026\u0026 awk -F: '{print $3}' /etc/group| …"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.3."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '{print $4}' /etc/passwd |sort -u > /tmp/uid && awk -F: '{print $3}' /etc/group| sort -u> /tmp/gid && comm -23 /tmp/uid /tmp/gid && rm -f /tmp/uid /tmp/gid
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-a6fe2c7421 |
      Every primary group referenced in /etc/passwd should exist in /etc/group. Undefined group IDs usually result from manual edits or deleted groups; if the ID is reused later, the new group's members gain access to the affected users' files.
    remediation: &rem-ac0bde3f41 |
      For every user reported by the check, create the missing group with the referenced GID or assign the user an existing primary group.

      grpck -r
      groupadd -g GID GROUP
      usermod -g GROUP USER

      Changing the primary group does not change the ownership of existing files; adjust them if necessary.
  - id: "CIS-UBUNTU18-6.2.4-home_dirs_exist"
    name: "home dirs exist: pwck -r"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.4."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      pwck -r
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ ." }
    rationale: &rat-93950236f2 |
      An account whose home directory does not exist gets / as its working directory at login, and some programs then try to create files in unexpected places. Missing home directories also indicate stale accounts. Every account, and in particular every interactive one, should have an existing home directory.
    remediation: &rem-16e7619e2c |
      Create the missing home directory for every account listed by the check with the correct owner and mode, or point the account to an existing directory if it does not need its own home. On several platforms the check also lists system accounts; for those, review whether the account is still needed and prefer usermod -d to an existing directory over creating new directories.

      mkdir -p HOMEDIR
      chown USER: HOMEDIR
      chmod 750 HOMEDIR
      usermod -d EXISTINGDIR USER

      On RHEL 7 the check also requires that home directories of users with UID 1000 to 60000 have mode 750 or 700. On Ubuntu 18.04 every finding of pwck -r fails the check, not only missing home directories.
  - id: "CIS-UBUNTU18-6.2.5-home_dirs_owned"
    name: "home dirs owned: getent passwd {1000..60000} |  awk -F: '{ print $1  \" \"  $7 }' | while read user dir; do …"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.5."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      getent passwd {1000..60000} |  awk -F: '{ print $1  " "  $7 }' | while read user dir; do if [ $user != 'ftpd' ]; then owner=$(stat -L -c "%U" "$dir"); if [ "$owner" != "$user" ]; then echo "home dir for $user owned by $owner"; fi; fi; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-d265418053 |
      A user should own their home directory. If another account owns it, that account controls the user's files, startup scripts and SSH keys and can manipulate them to run code as the user.
    remediation: &rem-9804bc2d06 |
      Make each listed user the owner of their home directory after confirming that the directory really belongs to that user.

      ls -ld HOMEDIR
      chown USER HOMEDIR
  - id: "CIS-UBUNTU18-6.2.6-home_dirs_restrict"
    name: "home dirs restrict: export def_home=`grep \"^HOME\" /etc/default/useradd |cut -d= -f2` \u0026\u0026 for i in `ls $def_hom…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.6."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    timeout: 60000ms
    run: |
      export def_home=`grep "^HOME" /etc/default/useradd |cut -d= -f2` && for i in `ls $def_home`; do stat -c "%a %n" $def_home/$i; done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ 7(0|5)0\\s" }
      - { none: "~ ^7[6-9][1-9]\\s.*" }
    rationale: &rat-38c62d069f |
      Home directories hold private data, shell startup files and credentials such as SSH keys. Modes of 750 or 700 prevent other users from reading or modifying them while still allowing optional group access.
    remediation: &rem-b0aa30ee8d |
      Set the home directory of every interactive user to mode 750 or 700.

      awk -F: '($3 >= 1000 && $3 <= 60000) {print $6}' /etc/passwd | xargs -r stat -c '%a %n'
      chmod 750 HOMEDIR

      Set the default for new home directories as well (HOME_MODE in /etc/login.defs; DIR_MODE in /etc/adduser.conf on Debian and Ubuntu).
  - id: "CIS-UBUNTU18-6.2.7-dot_file_perms"
    name: "dot file perms: find /home/ -name \"\\.*\" -perm /g+w,o+w"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.7."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /home/ -name "\.*" -perm /g+w,o+w
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-b99f900519 |
      Files such as .bashrc, .profile or .ssh are executed or trusted when the user logs in. If group or other users can write to them, they can insert commands that run with the victim's privileges at the next login.
    remediation: &rem-2ca3c0e9f1 |
      Remove write access for group and others from each dot file or directory listed by the check, after confirming that it is not intentionally shared.

      ls -ld FILE
      chmod go-w FILE
  - id: "CIS-UBUNTU18-6.2.8-dot_netrc_files"
    name: "dot netrc files: find /home/ -name .netrc"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.8."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /home/ -name .netrc
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-926265401c |
      .netrc files store login names and often plaintext passwords for FTP and other services. Anyone who obtains the file, or the backups containing it, gets these credentials.
    remediation: &rem-d8707d9e7f |
      List the .netrc files, review each one with its owner, and remove those that are not needed.

      find /home/ -name .netrc
      rm /home/USER/.netrc

      Credentials still needed should be moved to a protected credential store.
  - id: "CIS-UBUNTU18-6.2.9-dot_forward_files"
    name: "dot forward files: find /home/ -name .forward"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.9."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /home/ -name .forward
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-a3dc90d1e5 |
      .forward files in home directories redirect a user's mail or pipe it into arbitrary commands. They can be used to exfiltrate sensitive mail or to run commands whenever mail arrives, outside of central control.
    remediation: &rem-e97a50617e |
      List the .forward files, review each one with its owner, and remove those that are not needed.

      find /home/ -name .forward
      rm /home/USER/.forward

      Arrange mail forwarding centrally, for example through /etc/aliases, if it is required.
  - id: "CIS-UBUNTU18-6.2.10-dot_rhosts_files"
    name: "dot rhosts files: find /home/ -name .rhosts"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.10."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      find /home/ -name .rhosts
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-d0755f20b1 |
      .rhosts files grant password-less access through the legacy r-services to hosts and users listed in them, trusting only the source address. They allow easy lateral movement and should not exist.
    remediation: &rem-57790ac1dd |
      List the .rhosts files, review each one with its owner, and remove those that are not needed.

      find /home/ -name .rhosts
      rm /home/USER/.rhosts

      Use SSH keys for any required password-less access.
  - id: "CIS-UBUNTU18-6.2.11-uid_0_check"
    name: "uid 0 check: awk -F: '($3 == 0) { print $1 }' /etc/passwd"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.11."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      awk -F: '($3 == 0) { print $1 }' /etc/passwd
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ root" }
    rationale: &rat-90d4d66c1b |
      Any account with UID 0 has full root privileges, regardless of its name. Additional UID 0 accounts are a classic backdoor and make it impossible to attribute administrative actions; only root should have UID 0.
    remediation: &rem-5c4a8fc9e4 |
      Make sure that only root has UID 0. Find out what every other UID 0 account is used for, then give it a unique non-zero UID with vipw or remove it.

      awk -F: '($3 == 0) {print $1}' /etc/passwd
      vipw
      userdel USER

      usermod -u cannot be used here because the running root processes share UID 0. Also make sure that root itself has UID 0.
  - id: "CIS-UBUNTU18-6.2.12-root_path_check"
    name: "root path check: /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.12."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      /bin/bash --login -c 'env | grep ^PATH=' | sed -e 's/PATH=//' -e 's/::/:/' -e 's/:$//' -e 's/:/\n/g'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ \\\\." }
    rationale: &rat-ee503b897e |
      If root's PATH contains the current directory, empty entries, relative paths or directories that other users can write to, a malicious program placed there can be executed with root privileges when an administrator types a common command name. Root's PATH should contain only absolute, root-owned and non-writable directories.
    remediation: &rem-0afab9f1f3 |
      Remove the current directory (.), empty entries (leading, trailing or double colons), relative paths and non-existent directories from root's PATH, and make sure every remaining directory is owned by root and not writable by group or others. Look for PATH assignments in root's and the system-wide shell startup files.

      su - root -c 'echo "$PATH"'
      grep -sn 'PATH' /root/.bash_profile /root/.bashrc /root/.profile /etc/profile /etc/bashrc /etc/bash.bashrc /etc/environment /etc/profile.d/*.sh
      chown root DIRECTORY
      chmod go-w DIRECTORY
  - id: "CIS-UBUNTU18-6.2.13-no_dup_uid"
    name: "no dup uid: cat /etc/passwd | cut -d: -f3 | uniq -d"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.13."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/passwd | cut -d: -f3 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-92a5e740a2 |
      The kernel identifies users by UID, not by name. Several accounts with the same UID share all file ownerships and privileges and cannot be told apart in logs, which undermines accountability.
    remediation: &rem-3997dd9dfb |
      Review every duplicate UID reported by the check, give each account its own UID and assign the files of the former shared UID deliberately.

      awk -F: '($3 == UID) {print $1}' /etc/passwd
      usermod -u NEWUID USER
      find / -xdev -user UID -ls

      usermod adjusts only the home directory; other files owned by the old UID stay with the account that keeps it.
  - id: "CIS-UBUNTU18-6.2.14-no_dup_gid"
    name: "no dup gid: cat /etc/group | cut -d: -f3 | uniq -d"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.14."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/group | cut -d: -f3 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-1c1a4afdb8 |
      Groups are identified by GID. Several groups with the same GID share all group permissions, so membership in one silently grants the access rights of the other.
    remediation: &rem-6a315abc33 |
      Review every duplicate GID reported by the check, give each group its own GID and assign the files of the former shared GID deliberately.

      awk -F: '($3 == GID) {print $1}' /etc/group
      groupmod -g NEWGID GROUP
      find / -xdev -group GID -ls

      Files owned by the old GID are not changed automatically; adjust them where they belong to the renumbered group.
  - id: "CIS-UBUNTU18-6.2.15-no_dup_username"
    name: "no dup username: cat /etc/passwd | cut -d: -f1 | uniq -d"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.15."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/passwd | cut -d: -f1 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-48bf65be3b |
      Duplicate user names in /etc/passwd make it unpredictable which entry is used for login and which UID a name resolves to. This can lead to wrong file ownership and confusing audit trails.
    remediation: &rem-e93b096dcd |
      Review the duplicate entries for every user name reported by the check and remove or rename the surplus entry in /etc/passwd and /etc/shadow with the locking editors.

      grep -n '^USER:' /etc/passwd
      pwck -r
      vipw
      vipw -s
  - id: "CIS-UBUNTU18-6.2.16-no_dup_groupname"
    name: "no dup groupname: cat /etc/group | cut -d: -f1 | uniq -d"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.16."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      cat /etc/group | cut -d: -f1 | uniq -d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-5dd470fed7 |
      Duplicate group names in /etc/group make it unpredictable which GID a group name resolves to. This can lead to wrong access rights when files or memberships are assigned by name.
    remediation: &rem-c9a5680ce7 |
      Review the duplicate entries for every group name reported by the check and remove or rename the surplus entry in /etc/group and /etc/gshadow with the locking editors.

      grep -n '^GROUP:' /etc/group
      grpck -r
      vigr
      vigr -s
  - id: "CIS-UBUNTU18-6.2.17-empty_shadow_group"
    name: "empty shadow group: grep ^shadow /etc/group | awk -F':''{print $NF}'"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 6.2.17."
    tags: [cis, cis-ubuntu18, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      grep ^shadow /etc/group | awk -F':''{print $NF}'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-3f948c86e6 |
      Members of the shadow group can read /etc/shadow and therefore all password hashes. Nobody should be a member of this group or have it as primary group, so the hashes stay readable only by root.
    remediation: &rem-24c648e32a |
      Remove all members from the shadow group and give accounts that have it as primary group a different primary group.

      grep '^shadow:' /etc/group
      gpasswd -d USER shadow
      awk -F: -v gid="$(getent group shadow | cut -d: -f3)" '$4 == gid {print $1}' /etc/passwd
      usermod -g GROUP USER
