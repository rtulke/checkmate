  - id: "CIS-UBUNTU18-3.5.3.2.1-ipt_def_deny"
    name: "ipt def deny: echo \"Manual - Please confirm iptables default denies are configured and matched site pol…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.3.2.1."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual - Please confirm iptables default denies are configured and matched site policy"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Manual" }
    rationale: &rat-0eae3bbf05 |
      With a default DROP policy on the INPUT, FORWARD and OUTPUT chains, any traffic not explicitly allowed is blocked, so new services or mistakes are not exposed automatically. Rules for required traffic must exist before the policy is changed, or the system becomes unreachable.
    remediation: &rem-395a4cf9e0 |
      Add accept rules for required traffic first, then set the default policy of the built-in chains to DROP and save the rules.

      iptables -A INPUT -i lo -j ACCEPT
      iptables -A OUTPUT -o lo -j ACCEPT
      iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
      iptables -A OUTPUT -m conntrack --ctstate NEW,ESTABLISHED,RELATED -j ACCEPT
      iptables -A INPUT -p tcp --dport 22 -m conntrack --ctstate NEW -j ACCEPT
      iptables -P INPUT DROP
      iptables -P FORWARD DROP
      iptables -P OUTPUT DROP
      netfilter-persistent save

      On Debian 11 and Ubuntu this is a manual review item that the check always reports; on Debian 12 the check reads the chain policies.
  - id: "CIS-UBUNTU18-3.5.3.2.2-ipt_loopback"
    name: "ipt loopback: echo \"Manual - Please confirm iptables loopback connections are configured and matched si…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.3.2.2."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
    severity: medium
    run: |
      echo "Manual - Please confirm iptables loopback connections are configured and matched site policy"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ^Manual" }
    rationale: &rat-b82eb32e30 |
      Local services rely on loopback traffic, so it must be accepted, while packets from the network with a source address in 127.0.0.0/8 are always spoofed and should be dropped. This protects services that only listen on localhost. This is a manual review item.
    remediation: &rem-393b25b7bb |
      Accept loopback traffic, drop loopback source addresses on other interfaces and save the rules.

      iptables -A INPUT -i lo -j ACCEPT
      iptables -A OUTPUT -o lo -j ACCEPT
      iptables -A INPUT -s 127.0.0.0/8 -j DROP
      netfilter-persistent save

      This is a manual review item: the automated check always reports it so that the result is reviewed and documented.
