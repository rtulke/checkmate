  - id: "CIS-UBUNTU18-3.5.3.2.4-ipt_open_ports"
    name: "ipt open ports: echo \"Manual - Please confirm iptables rules for open ports configured and matched site p…"
    description: "CIS Ubuntu 18.04 LTS benchmark recommendation 3.5.3.2.4."
    tags: [cis, cis-ubuntu18, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server, cis-workstation, cis-level1-workstation, cis-level2-workstation]
