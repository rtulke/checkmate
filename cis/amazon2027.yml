  - id: "CIS-AMAZON2027-1.5.4-kernel.dmesg_restrict"
    name: "Kernel parameter kernel.dmesg_restrict is 1"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.5.4. NIST SP 800-53 Rev. 5: SC-2, SC-4."
