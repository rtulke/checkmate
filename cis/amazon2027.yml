name: CIS Amazon Linux 2027
version: "0.0.1"
description: >
  Automated checks for 307 recommendations of the CIS Amazon Linux 2027 benchmark
  (version 0.0.1), converted from the goss audit content of the
  ansible-lockdown project. Check names describe what is verified; the
  recommendation number is in the ID and the description. Select profiles
  with tags, e.g. `--tags cis-level-1+cis-server`.

defaults:
  when: "facts.distro == \"amzn\" and facts.version_major == 2027"
  timeout: 120s

checks:
  - id: "CIS-AMAZON2027-1.1.1.1-sys_module_overlay-absent"
    name: "/sys/module/overlay does not exist"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.1.1. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      test -e '/sys/module/overlay' || test -L '/sys/module/overlay'
    expect: false
    rationale: &rat-f0f7a2ecac |
      The overlay file system lets unprivileged users in user namespaces build layered file systems, and its kernel code has had several privilege escalation vulnerabilities. If the module is not loaded, that attack surface is absent. Container runtimes such as Docker and Podman rely on it, so hosts running containers need it.
    remediation: &rem-951708433a |
      Unload the kernel module overlay and keep it from being loaded again:

      printf '%s\n' 'blacklist overlay' 'install overlay /bin/false' > /etc/modprobe.d/overlay.conf
      modprobe -r overlay

      If the module is built into the kernel or in use, it cannot be unloaded; a reboot applies the blacklist.
  - id: "CIS-AMAZON2027-1.1.1.1-modprobe_overlay"
    name: "modprobe overlay: modprobe --showconfig | grep -P -- '\\b(install|blacklist)\\h+overlay\\b'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.1.1. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+overlay\b'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^blacklist overlay$" }
      - { some: "~ ^install overlay (\\/usr)?\\/bin\\/(true|false)$" }
    rationale: &rat-27157567ef |
      The overlay file system driver has had multiple privilege escalation vulnerabilities, and it can be reached by unprivileged users through user namespaces. Blacklisting it and mapping it to /bin/false prevents it from being loaded at all. Systems that run containers with Docker, Podman or Kubernetes need overlay and must keep it enabled.
    remediation: &rem-b848503204 |
      Blacklist the overlay module, make every load attempt run /bin/false, and unload it if it is currently loaded.

      printf '%s\n' 'blacklist overlay' 'install overlay /bin/false' > /etc/modprobe.d/overlay.conf
      modprobe -r overlay

      This breaks container runtimes that use overlayfs; do not apply it on container hosts.
  - id: "CIS-AMAZON2027-1.1.1.2-sys_module_squashfs-absent"
    name: "/sys/module/squashfs does not exist"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.1.2. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
