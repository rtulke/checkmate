  - id: "CIS-AMAZON2027-7.1.13-audit_sgid_suid"
    name: "audit sgid suid: findmnt -Dkerno fstype,target,options | awk '($1 !~ /^[[:space:]]*(nfs|proc|smb|vfat|iso9…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.13. NIST SP 800-53 Rev. 5: AC-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      findmnt -Dkerno fstype,target,options | awk '($1 !~ /^[[:space:]]*(nfs|proc|smb|vfat|iso9660|efivarfs|selinuxfs)/ && $2 !~ /^\/run\/user\// && $3 !~ /noexec/ && $3 !~ /nosuid/){print $2}' | while IFS= read -r l_mount; do
        find "$l_mount" -xdev -type f \( -perm -4000 -o -perm -2000 \) -print 2>/dev/null
      done | sort -u | while IFS= read -r l_file; do
        echo "reviewed: $l_file"
        if ! rpm -qf "$l_file" >/dev/null 2>&1; then
          echo "FAIL: $l_file is not owned by any package"
        else
          rpm -Vf "$l_file" 2>/dev/null | awk -v f="$l_file" '$NF == f && $1 ~ /(5|M)/ {print "FAIL: " f " differs from its package (" $1 ")"}'
        fi
      done
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { some: "~ ^reviewed: " }
      - { none: "~ ^FAIL:" }
