  - id: "CIS-AMAZON2027-1.1.2.1.4-tmp_noexec_options"
    name: "/tmp is a separate mount with noexec"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.2.1.4. NIST SP 800-53 Rev. 5: CM-6, CM-7. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/tmp'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]noexec(,|$)"
    rationale: &rat-734884225c |
      /tmp is world-writable and used by every user and service for temporary files. With noexec, programs cannot be executed directly from it, which blocks the common attack step of dropping a tool or exploit into a writable directory and running it. Scripts started through an interpreter are not stopped, and some installers may need adjusting. This check verifies the option on the currently mounted file system.
    remediation: &rem-c5e9d848d5 |
      Mount /tmp with the option noexec: add it to the options of /tmp in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/tmp'

      If /tmp is not a separate file system yet, create one first.
  - id: "CIS-AMAZON2027-1.1.2.1.4-tmp_noexec_persistent_options"
    name: "tmp noexec persistent options: if [ \"$(systemctl show tmp.mount -p SourcePath --value)\" = \"/etc/fstab\" ]; then"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.2.1.4. NIST SP 800-53 Rev. 5: CM-6, CM-7. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      if [ "$(systemctl show tmp.mount -p SourcePath --value)" = "/etc/fstab" ]; then
        findmnt --fstab -n -o OPTIONS /tmp
      else
        systemctl cat tmp.mount 2>/dev/null | sed -n 's/^Options=//p'
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ \\bnoexec\\b" }
    rationale: &rat-dbfb783b11 |
      /tmp is world-writable and used by every user and service for temporary files. With noexec, programs cannot be executed directly from it, which blocks the common attack step of dropping a tool or exploit into a writable directory and running it. Scripts started through an interpreter are not stopped, and some installers may need adjusting. This check verifies the persistent configuration of /tmp (its /etc/fstab entry or the tmp.mount unit), so the option survives reboots.
    remediation: &rem-3b3ae63b6e |
      Add noexec to the persistent mount options of /tmp. If /tmp is defined in /etc/fstab, add it to the options field (fourth column) of the /tmp line, for example:

      tmpfs /tmp tmpfs defaults,rw,nosuid,nodev,noexec,relatime 0 0

      If /tmp is provided by the tmp.mount unit, override its options with a drop-in instead:

      mkdir -p /etc/systemd/system/tmp.mount.d
      printf '%s\n' '[Mount]' 'Options=mode=1777,strictatime,nosuid,nodev,noexec,size=50%%,nr_inodes=1m' > /etc/systemd/system/tmp.mount.d/50-options.conf

      Then reload systemd and apply the option to the running mount:

      systemctl daemon-reload
      mount -o remount,noexec /tmp
  - id: "CIS-AMAZON2027-1.1.2.2.1-dev_shm_mount"
    name: "/dev/shm is a separate mount"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.2.2.1. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/dev/shm'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: &rat-33a19c43f1 |
      /dev/shm is world-writable shared memory storage. Mounting it as its own tmpfs bounds its size and allows restrictive mount options (nodev, nosuid, noexec), so it cannot easily serve as a staging area for device files, setuid programs or executable payloads.
    remediation: &rem-3751699ada |
      Put /dev/shm on a separate file system (partition or logical volume) and mount it there with an entry in /etc/fstab or a systemd mount unit. This needs a new file system and moving the existing data.
  - id: "CIS-AMAZON2027-1.1.2.2.2-dev_shm_nodev_options"
    name: "/dev/shm is a separate mount with nodev"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.2.2.2. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/dev/shm'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nodev(,|$)"
    rationale: &rat-9f5ea69519 |
      /dev/shm is a world-writable shared-memory file system that any process can write to. With nodev the kernel ignores character and block device files on it, so a device node created there cannot be used to access disks, memory or other hardware directly; legitimate device files live only under /dev. This check verifies the option on the currently mounted file system.
    remediation: &rem-ed341d7421 |
      Mount /dev/shm with the option nodev: add it to the options of /dev/shm in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/dev/shm'

      If /dev/shm is not a separate file system yet, create one first.
