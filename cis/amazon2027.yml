  - id: "CIS-AMAZON2027-5.3.2.5-pam_unix_enabled_password_auth-attrs"
    name: "/etc/pam.d/password-auth: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.2.5. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
