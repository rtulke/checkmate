    expect: empty
    rationale: &rat-a30fa0d0e3 |
      An /etc/cron.allow file turns cron access into an allowlist: only the users listed in it may create personal crontabs. This prevents arbitrary or compromised accounts from scheduling persistent jobs. The file must be owned by root so that users cannot add themselves to it.
    remediation: &rem-8916504889 |
      Create /etc/cron.allow if it is missing, then set owner root and group root or crontab and remove the permissions u-xs,g-wxs,o-rwx,a-t:

      chown root:root '/etc/cron.allow'
      chmod u-xs,g-wxs,o-rwx,a-t '/etc/cron.allow'
  - id: "CIS-AMAZON2027-2.4.1.9-cis_2_4_1_9_cron_deny-absent"
    name: "/etc/cron.deny does not exist"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.4.1.9. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "rpm -q --quiet cronie"
    run: |
      test -e '/etc/cron.deny' || test -L '/etc/cron.deny'
    expect: false
    rationale: &rat-5f24f042bc |
      /etc/cron.deny is a denylist: every user not listed may use cron. Relying on it means new or forgotten accounts automatically get access. Removing it and using /etc/cron.allow instead ensures that only explicitly authorized users can schedule jobs.
    remediation: &rem-d780ede041 |
      Remove /etc/cron.deny, unless the system needs it:

      rm '/etc/cron.deny'
  - id: "CIS-AMAZON2027-2.4.2.1-cis_2_4_2_1_at_allow-attrs"
    name: "/etc/at.allow: exists, mode 0640 or stricter, owner root, group root or daemon"
