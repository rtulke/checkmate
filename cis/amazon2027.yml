    severity: low
    run: |
      rpm -q --quiet xorg-x11-server-common
    expect: false
    rationale: &rat-378d85559b |
      The X Window System server components provide a graphical display server. X11 has a weak security model in which clients can observe each other's input and output, and servers rarely need a graphical environment. If the system does not need it, removing the package eliminates the attack surface and the patching burden; keep it only where the service is a deliberate part of the system's role.
    remediation: &rem-b99ea4a923 |
