      - { none: "~ ^\\s*root_unlock_time\\s*=\\s*([1-9]|[1-5][0-9])\\b" }
    rationale: *rat-3837626be2
    remediation: &rem-cecb1b9b81 |
      Edit /etc/security/faillock.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*(even_deny_root|root_unlock_time\s*=\s*\d+)\b
      - no line matches ^\s*root_unlock_time\s*=\s*([1-9]|[1-5][0-9])\b
  - id: "CIS-AMAZON2027-5.3.3.1.3-faillock_even_root_pam"
    name: "faillock even root pam: grep -Pi -- '^\\h*auth\\h+([^#\\n\\r]+\\h+)pam_faillock\\.so\\h+([^#\\n\\r]+\\h+)?root_unlock_time\\…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.1.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep -Pi -- '^\h*auth\h+([^#\n\r]+\h+)pam_faillock\.so\h+([^#\n\r]+\h+)?root_unlock_time\h*=\h*([1-9]|[1-5][0-9])\b' /etc/pam.d/system-auth /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-0f9c8a2712 |
      A root_unlock_time argument on the pam_faillock lines overrides /etc/security/faillock.conf. A value under 60 seconds there lets an attacker resume guessing the root password almost immediately after a lockout.
    remediation: &rem-7441676bdf |
      Remove the root_unlock_time option from the pam_faillock.so lines in /etc/pam.d/system-auth and /etc/pam.d/password-auth and set even_deny_root or root_unlock_time = 60 or more in /etc/security/faillock.conf instead.

      grep -Pn 'pam_faillock\.so.*\broot_unlock_time\s*=' /etc/pam.d/system-auth /etc/pam.d/password-auth
      authselect current

      If authselect manages the files, remove the option from the custom profile (/etc/authselect/custom/PROFILE/system-auth and password-auth) and run authselect apply-changes; otherwise edit the two files directly.
  - id: "CIS-AMAZON2027-5.3.3.2.1-passwd_change_not_pamd"
    name: "passwd change not pamd: grep -Psi -- '^\\s*password\\s+(requisite|required|sufficient)\\s+pam_pwquality\\.so\\s+([^#\\n…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.2.1. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Psi -- '^\s*password\s+(requisite|required|sufficient)\s+pam_pwquality\.so\s+([^#\n\r]+\s+)?difok\s*=\s*([0-1])\b' /etc/pam.d/system-auth /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-9247230425 |
      difok defines how many characters of a new password must differ from the old one. A difok value of 0 or 1 given as an argument on the pam_pwquality line overrides pwquality.conf and lets users rotate passwords by changing a single character, which defeats password expiry.
    remediation: &rem-fff768a8be |
      Remove the difok= option from the pam_pwquality.so lines in /etc/pam.d/system-auth and /etc/pam.d/password-auth and set difok in /etc/security/pwquality.conf.d/ instead.

      grep -Pn 'pam_pwquality\.so.*\bdifok\s*=' /etc/pam.d/system-auth /etc/pam.d/password-auth
      authselect current

      If authselect manages the files, remove the option from the custom profile (/etc/authselect/custom/PROFILE/system-auth and password-auth) and run authselect apply-changes; otherwise edit the two files directly.
  - id: "CIS-AMAZON2027-5.3.3.2.1-password_character_changed"
    name: "password character changed: grep -Psi -- '^\\h*difok\\h*=\\h*([2-9]|[1-9][0-9]+)\\b' /etc/security/pwquality.conf /etc/se…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.2.1. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Psi -- '^\h*difok\h*=\h*([2-9]|[1-9][0-9]+)\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:difok\\s*=\\s*[2-9]" }
    rationale: &rat-b71bd8fb5f |
      Requiring that a new password differs from the old one in several characters prevents users from cycling through trivial variations such as appending a digit. Without it, password expiry adds little security because a leaked old password reveals the new one.
    remediation: &rem-30c88d9d14 |
      Set difok = 2 in a pwquality drop-in file and remove lower settings of difok from /etc/security/pwquality.conf and other drop-ins.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'difok = 2' > /etc/security/pwquality.conf.d/50-difok.conf

      The value is enforced by pam_pwquality (on Debian and Ubuntu install libpam-pwquality). Using a drop-in also matters for the check, which on some platforms fails when pwquality.conf.d contains no .conf file.
  - id: "CIS-AMAZON2027-5.3.3.2.2-password_minlen"
    name: "password minlen: grep -Psi -- '^\\h*minlen\\h*=\\h*(1[4-9]|[2-9][0-9]|[1-9][0-9]{2,})\\b' /etc/security/pwqual…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.2.2. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Psi -- '^\h*minlen\h*=\h*(1[4-9]|[2-9][0-9]|[1-9][0-9]{2,})\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:minlen\\s*=\\s*(1[4-9]|[2-4][0-9])" }
    rationale: &rat-d3de089d0b |
      Password length is the most important factor for resistance against guessing and cracking. A minimum of 14 characters makes brute force attacks against stolen hashes impractical and encourages passphrases over short complex strings.
    remediation: &rem-3d639df090 |
      Set minlen = 14 in a pwquality drop-in file and remove lower settings of minlen from /etc/security/pwquality.conf and other drop-ins.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'minlen = 14' > /etc/security/pwquality.conf.d/50-minlen.conf

      The value is enforced by pam_pwquality (on Debian and Ubuntu install libpam-pwquality). Using a drop-in also matters for the check, which on some platforms fails when pwquality.conf.d contains no .conf file.
  - id: "CIS-AMAZON2027-5.3.3.2.2-password_minlen_not_pamd"
    name: "password minlen not pamd: grep -Psi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwquality\\.so\\h+([^#\\n…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.2.2. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Psi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwquality\.so\h+([^#\n\r]+\h+)?minlen\h*=\h*([0-9]|1[0-3])\b' /etc/pam.d/system-auth /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { none: "~ .*" }
    rationale: &rat-eca3499dbe |
      A minlen argument on the pam_pwquality line overrides the value in pwquality.conf. A value below 14 there silently weakens the password length policy for all users.
    remediation: &rem-b9424fc11c |
      Remove the minlen= option from the pam_pwquality.so lines in /etc/pam.d/system-auth and /etc/pam.d/password-auth and set minlen in /etc/security/pwquality.conf.d/ instead.

      grep -Pn 'pam_pwquality\.so.*\bminlen\s*=' /etc/pam.d/system-auth /etc/pam.d/password-auth
      authselect current

      If authselect manages the files, remove the option from the custom profile (/etc/authselect/custom/PROFILE/system-auth and password-auth) and run authselect apply-changes; otherwise edit the two files directly.
  - id: "CIS-AMAZON2027-5.3.3.2.3-password_complex"
    name: "password complex: grep -Psi -- '^\\h*(minclass|[dulo]credit)\\b' /etc/security/pwquality.conf /etc/security/p…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.2.3. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Psi -- '^\h*(minclass|[dulo]credit)\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:minclass\\s*=\\s*([4-9]|[1-9][0-9])" }
      - { none: "~ .*\\:minclass\\s*=\\s*[0-3]" }
      - { none: "~ .*\\:(d|l|o|u)credit" }
    rationale: &rat-f4b189855b |
      Requiring several character classes enlarges the search space attackers must cover and prevents passwords made of a single class such as lowercase words. The variants differ: RHEL and Amazon Linux expect minclass 4 without per-class credit settings, Debian expects minclass, and Ubuntu additionally expects the per-class credit options to be set.
    remediation: &rem-fccd673dd5 |
      Require all four character classes with minclass and remove dcredit, ucredit, lcredit and ocredit from /etc/security/pwquality.conf and its drop-ins.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'minclass = 4' > /etc/security/pwquality.conf.d/50-pwcomplexity.conf
      grep -Pn '^\h*([dulo]credit|minclass)\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf

      Delete or comment out the credit lines and lower minclass values that grep shows.
  - id: "CIS-AMAZON2027-5.3.3.2.3-password_complex_not_pamd"
    name: "password complex not pamd: grep -Psi -- '^\\s*password\\s+(requisite|required|sufficient)\\s+pam_pwquality\\.so\\s+([^#\\n…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.2.3. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Psi -- '^\s*password\s+(requisite|required|sufficient)\s+pam_pwquality\.so\s+([^#\n\r]+\s+)?(minclass=\d*|[dulo]credit=-?\d*)\b' /etc/pam.d/system-auth /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-bd87e96f71 |
      Complexity options such as minclass or dcredit given on the pam_pwquality line override pwquality.conf. Settings there are easily overlooked and can weaken the complexity policy without anyone noticing.
    remediation: &rem-d474d331bb |
      Remove the minclass= and dcredit=, ucredit=, lcredit=, ocredit= options from the pam_pwquality.so lines in /etc/pam.d/system-auth and /etc/pam.d/password-auth and set them in /etc/security/pwquality.conf.d/ instead.

      grep -Pn 'pam_pwquality\.so.*\b(minclass|[dulo]credit)\s*=' /etc/pam.d/system-auth /etc/pam.d/password-auth
      authselect current

      If authselect manages the files, remove the option from the custom profile (/etc/authselect/custom/PROFILE/system-auth and password-auth) and run authselect apply-changes; otherwise edit the two files directly.
  - id: "CIS-AMAZON2027-5.3.3.2.4-consecutive_characters_not_pamd"
    name: "consecutive characters not pamd: grep -Psi -- '^\\s*password\\s+(requisite|required|sufficient)\\s+pam_pwquality\\.so\\s+([^#\\n…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.2.4. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Psi -- '^\s*password\s+(requisite|required|sufficient)\s+pam_pwquality\.so\s+([^#\n\r]+\s+)?maxrepeat\s*=\s*(0|[4-9]|[1-9][0-9]+)\b' /etc/pam.d/system-auth /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-b0c24729eb |
      A maxrepeat argument on the pam_pwquality line overrides pwquality.conf. A value of 0 (no limit) or 4 and more there allows passwords like aaaa1111 that are easy to guess.
    remediation: &rem-11cccfcdac |
      Remove the maxrepeat= option from the pam_pwquality.so lines in /etc/pam.d/system-auth and /etc/pam.d/password-auth and set maxrepeat in /etc/security/pwquality.conf.d/ instead.

      grep -Pn 'pam_pwquality\.so.*\bmaxrepeat\s*=' /etc/pam.d/system-auth /etc/pam.d/password-auth
      authselect current

      If authselect manages the files, remove the option from the custom profile (/etc/authselect/custom/PROFILE/system-auth and password-auth) and run authselect apply-changes; otherwise edit the two files directly.
  - id: "CIS-AMAZON2027-5.3.3.2.4-password_consecutive_characters"
    name: "password consecutive characters: grep -Psi -- '^\\s*maxrepeat\\s*=\\s*[1-3]\\b' /etc/security/pwquality.conf /etc/security/pwq…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.2.4. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Psi -- '^\s*maxrepeat\s*=\s*[1-3]\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:maxrepeat\\s*=\\s*[1-3]" }
      - { none: "~ .*\\:maxrepeat\\s*=\\s*0" }
    rationale: &rat-d9b92e13d5 |
      Limiting how often the same character may repeat consecutively rejects passwords such as aaaa1111 or Passsssword that add length without adding real entropy and appear early in cracking dictionaries.
    remediation: &rem-3a9f48811a |
      Set maxrepeat = 3 in a pwquality drop-in file and remove zero or higher settings of maxrepeat from /etc/security/pwquality.conf and other drop-ins.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'maxrepeat = 3' > /etc/security/pwquality.conf.d/50-maxrepeat.conf

      The value is enforced by pam_pwquality (on Debian and Ubuntu install libpam-pwquality). Using a drop-in also matters for the check, which on some platforms fails when pwquality.conf.d contains no .conf file.
  - id: "CIS-AMAZON2027-5.3.3.2.5-maxseq_not_pamd"
    name: "maxseq not pamd: grep -Psi -- '^\\s*password\\s+(requisite|required|sufficient)\\s+pam_pwquality\\.so\\s+([^#\\n…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.2.5. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Psi -- '^\s*password\s+(requisite|required|sufficient)\s+pam_pwquality\.so\s+([^#\n\r]+\s+)?maxsequence\s*=\s*(0|[4-9]|[1-9][0-9]+)\b' /etc/pam.d/system-auth /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { none: "~ .*" }
    rationale: &rat-99805670c8 |
      A maxsequence argument on the pam_pwquality line overrides pwquality.conf. A value of 0 (no limit) or 4 and more there permits monotonic sequences like 12345 or abcde in passwords.
    remediation: &rem-9799a9278f |
      Remove the maxsequence= option from the pam_pwquality.so lines in /etc/pam.d/system-auth and /etc/pam.d/password-auth and set maxsequence in /etc/security/pwquality.conf.d/ instead.

      grep -Pn 'pam_pwquality\.so.*\bmaxsequence\s*=' /etc/pam.d/system-auth /etc/pam.d/password-auth
      authselect current

      If authselect manages the files, remove the option from the custom profile (/etc/authselect/custom/PROFILE/system-auth and password-auth) and run authselect apply-changes; otherwise edit the two files directly.
  - id: "CIS-AMAZON2027-5.3.3.2.5-password_maxseq"
    name: "password maxseq: grep -Psi -- '^\\s*maxsequence\\s*=\\s*[1-3]\\b' /etc/security/pwquality.conf /etc/security/p…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.2.5. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Psi -- '^\s*maxsequence\s*=\s*[1-3]\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:maxsequence\\s*=\\s*[1-3]" }
      - { none: "~ .*\\:maxsequence\\s*=\\s*0" }
    rationale: &rat-056e245d5d |
      Monotonic character sequences such as 12345 or abcdef are among the first patterns tried by password crackers. Limiting their length to three characters makes users choose passwords that are harder to predict.
    remediation: &rem-bbbdc2081c |
      Set maxsequence = 3 in a pwquality drop-in file and remove zero or higher settings of maxsequence from /etc/security/pwquality.conf and other drop-ins.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'maxsequence = 3' > /etc/security/pwquality.conf.d/50-maxsequence.conf

      The value is enforced by pam_pwquality (on Debian and Ubuntu install libpam-pwquality). Using a drop-in also matters for the check, which on some platforms fails when pwquality.conf.d contains no .conf file.
  - id: "CIS-AMAZON2027-5.3.3.2.6-dictchk_not_pamd"
    name: "dictchk not pamd: grep -Psi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwquality\\.so\\h+([^#\\n…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.2.6. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Psi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwquality\.so\h+([^#\n\r]+\h+)?dictcheck\h*=\h*0\b' /etc/pam.d/system-auth /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-c426ead3e7 |
      A dictcheck=0 argument on the pam_pwquality line disables the dictionary check regardless of pwquality.conf. Users could then choose common words and known leaked passwords, which fall quickly to dictionary attacks.
    remediation: &rem-64571e1d6e |
      Remove the dictcheck= option from the pam_pwquality.so lines in /etc/pam.d/system-auth and /etc/pam.d/password-auth and keep dictcheck enabled in /etc/security/pwquality.conf.d/.

      grep -Pn 'pam_pwquality\.so.*\bdictcheck\s*=' /etc/pam.d/system-auth /etc/pam.d/password-auth
      authselect current

      If authselect manages the files, remove the option from the custom profile (/etc/authselect/custom/PROFILE/system-auth and password-auth) and run authselect apply-changes; otherwise edit the two files directly.
  - id: "CIS-AMAZON2027-5.3.3.2.6-password_dictchk"
    name: "password dictchk: grep -Psi -- '^\\h*dictcheck\\h*=\\h*0\\b' /etc/security/pwquality.conf /etc/security/pwquali…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.2.6. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Psi -- '^\h*dictcheck\h*=\h*0\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [1, 2]" }
      - { none: "~ ." }
    rationale: &rat-a54439690d |
      The dictionary check rejects passwords that are based on words from a cracking dictionary. Such passwords are guessed within seconds in offline attacks against stolen hashes. Keeping dictcheck enabled blocks the most common weak choices.
    remediation: &rem-f4e720cc77 |
      Enable the dictionary check explicitly and remove any dictcheck = 0 setting.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'dictcheck = 1' > /etc/security/pwquality.conf.d/50-dictcheck.conf
      grep -Pn '^\h*dictcheck\h*=\h*0' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf

      Delete or comment out the lines grep shows. On Debian and Ubuntu install libpam-pwquality and its cracklib dictionary so the check is effective.
  - id: "CIS-AMAZON2027-5.3.3.2.7-password_quality_enforce_root"
    name: "password quality enforce root: grep -Psi -- '^\\s*enforce_for_root\\b' /etc/security/pwquality.conf /etc/security/pwqualit…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.2.7. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Psi -- '^\s*enforce_for_root\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 1, 2]" }
      - { some: "~ .*\\:enforce_for_root" }
    rationale: &rat-ba2f1202e1 |
      By default pam_pwquality only warns root about a weak password and accepts it anyway. Since root often sets passwords for other accounts and for itself, enforce_for_root applies the same quality rules to passwords set by root.
    remediation: &rem-752a1b9c2a |
      Enable enforce_for_root in a pwquality drop-in file.

      mkdir -p /etc/security/pwquality.conf.d
      echo 'enforce_for_root' > /etc/security/pwquality.conf.d/50-enforce_for_root.conf

      The option is evaluated by pam_pwquality (on Debian and Ubuntu install libpam-pwquality). Using a drop-in also matters for the check, which on some platforms fails when pwquality.conf.d contains no .conf file.
  - id: "CIS-AMAZON2027-5.4.1.1-login_defs_max_days-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-de28e65ea9 |
      A maximum password age limits how long a compromised password remains useful to an attacker who obtained it unnoticed. PASS_MAX_DAYS sets the default maximum for new passwords; 365 days or less forces periodic renewal without the counterproductive effects of very frequent changes.
    remediation: &rem-0b6bdc1798 |
      Create /etc/login.defs.
  - id: "CIS-AMAZON2027-5.4.1.1-login_defs_max_days-content"
    name: "/etc/login.defs has the expected content (1 rule)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect: { some: "~ ^\\s*PASS_MAX_DAYS\\s+([1-9]|[1-9][0-9]|[1-2][0-9]{2}|3[0-5][0-9]|36[0-5])\\b" }
    rationale: *rat-de28e65ea9
    remediation: &rem-138dfe7b5e |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*PASS_MAX_DAYS\s+([1-9]|[1-9][0-9]|[1-2][0-9]{2}|3[0-5][0-9]|36[0-5])\b
  - id: "CIS-AMAZON2027-5.4.1.2-login_defs_min_days-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: IA-5(1). CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d3716bb90c |
      A minimum password age prevents users from changing their password several times in a row to get back to an old favourite, which would defeat password history. PASS_MIN_DAYS of at least one day sets this default for new passwords.
    remediation: *rem-0b6bdc1798
  - id: "CIS-AMAZON2027-5.4.1.2-login_defs_min_days-content"
    name: "/etc/login.defs has the expected content (1 rule)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.1.2. NIST SP 800-53 Rev. 5: IA-5(1). CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect: { some: "~ ^\\s*PASS_MIN_DAYS\\s+[1-9][0-9]*\\b" }
    rationale: *rat-d3716bb90c
    remediation: &rem-70071c8e7e |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*PASS_MIN_DAYS\s+[1-9][0-9]*\b
  - id: "CIS-AMAZON2027-5.4.1.3-login_defs_warn_age-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-ca921e80d6 |
      Warning users several days before their password expires gives them time to choose a good new password instead of being forced into a hasty choice or being locked out. PASS_WARN_AGE sets the default warning period for new passwords.
    remediation: *rem-0b6bdc1798
  - id: "CIS-AMAZON2027-5.4.1.3-login_defs_warn_age-content"
    name: "/etc/login.defs has the expected content (1 rule)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect: { some: "~ ^\\s*PASS_WARN_AGE\\s+([7-9]|[1-9][0-9]+)\\b" }
    rationale: *rat-ca921e80d6
    remediation: &rem-e0568def8a |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*PASS_WARN_AGE\s+([7-9]|[1-9][0-9]+)\b
  - id: "CIS-AMAZON2027-5.4.1.3-check_users_warn_age"
    name: "check users warn age: awk -F: '($2~/^\\$.+\\$/) {if($6 \u003c 7) print \"FAIL: \" $1 \" PASS_WARN_AGE: \" $6}' /etc/shadow"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.1.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      awk -F: '($2~/^\$.+\$/) {if($6 < 7) print "FAIL: " $1 " PASS_WARN_AGE: " $6}' /etc/shadow
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-fa29f42f01 |
      The login.defs warning period only applies to passwords set after the change. Existing accounts with a shorter or no warning period can expire without notice, leading to lockouts or rushed weak passwords. This check verifies the warning period of every account with a password.
    remediation: &rem-77fd644133 |
      Set a warning period of at least 7 days for each account the check reports.

      chage --warndays 7 USER
  - id: "CIS-AMAZON2027-5.4.1.4-login_defs_hashing-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.1.4. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-281f6b805c |
      Password hashes in /etc/shadow are a prime target once an attacker gains read access. Strong, slow algorithms such as SHA-512 crypt or yescrypt make offline cracking far more expensive than legacy MD5 or DES hashes. ENCRYPT_METHOD sets the algorithm used by tools that read login.defs.
    remediation: *rem-0b6bdc1798
  - id: "CIS-AMAZON2027-5.4.1.4-login_defs_hashing-content"
    name: "/etc/login.defs has the expected content (1 rule)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.1.4. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect: { some: "~ ^ENCRYPT_METHOD (SHA512|YESCRYPT)" }
    rationale: *rat-281f6b805c
    remediation: &rem-87e3ee7c64 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^ENCRYPT_METHOD (SHA512|YESCRYPT)
  - id: "CIS-AMAZON2027-5.4.1.5-inactive_passwd"
    name: "inactive passwd: useradd -D | grep INACTIVE"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.1.5. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      useradd -D | grep INACTIVE
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^INACTIVE=([0-9]|[1-3][0-9]|4[0-5])$" }
    rationale: &rat-1b1499cc8f |
      The default INACTIVE value used by useradd defines how many days after password expiry an account is disabled. Disabling unused accounts automatically removes forgotten access paths that attackers like to exploit; a value of up to 30 or 45 days, depending on the policy, balances security and usability.
    remediation: &rem-728ced36b8 |
      Set the default password inactivity period for new accounts to 30 days and apply the same value to existing accounts that have a password.

      useradd -D -f 30
      useradd -D | grep INACTIVE
      chage --inactive 30 USER

      30 days satisfies every supported release; some releases also accept up to 45 days.
  - id: "CIS-AMAZON2027-5.4.1.5-inactive_users"
    name: "inactive users: awk -F: '($2~/^\\$.+\\$/) {if($7 == \"\" || $7 \u003e 45 || $7 \u003c 0) print \"FAIL: \" $1 \" INACTIVE: …"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.1.5. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      awk -F: '($2~/^\$.+\$/) {if($7 == "" || $7 > 45 || $7 < 0) print "FAIL: " $1 " INACTIVE: " $7}' /etc/shadow
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-c4a4e8be14 |
      Accounts whose password has expired but which remain usable indefinitely are a common foothold for attackers because nobody notices their misuse. Setting a password inactivity period on every account with a password ensures that such accounts are disabled automatically after expiry.
    remediation: &rem-4e712889d3 |
      Set a password inactivity period of 30 days or less on every account that has a password, in particular on each account reported by the check.

      awk -F: '($2 ~ /^\$/) {print $1, $7}' /etc/shadow
      chage --inactive 30 USER

      Set the default for new accounts as well with useradd -D -f 30.
  - id: "CIS-AMAZON2027-5.4.1.6-passwd_chg_past"
    name: "passwd chg past: awk -F: -v l_today=\"$(( $(date +%s) / 86400 ))\" '($2~/^\\$.+\\$/ \u0026\u0026 $3 \u003e l_today) {print \"F…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.1.6. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      awk -F: -v l_today="$(( $(date +%s) / 86400 ))" '($2~/^\$.+\$/ && $3 > l_today) {print "FAIL: " $1 " last password change is " $3 - l_today " day(s) in the future"}' /etc/shadow
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-eae9c8e6b4 |
      If the recorded date of the last password change lies in the future, password ageing does not work: the password never expires and the user cannot be forced to change it. Such dates usually result from a wrong system clock or manual edits and should be corrected.
    remediation: &rem-e841282180 |
      Make sure the system clock is correct first. Then reset the last password change date of every listed user to today, or expire the password so that it must be changed at the next login.

      date
      chage --lastday "$(date +%Y-%m-%d)" USER
      chage --lastday 0 USER

      Use the first chage command to keep the current password valid, or the second one to force an immediate change.
  - id: "CIS-AMAZON2027-5.4.2.3-group_root_only_0"
    name: "group root only 0: awk -F: '($3 == 0 \u0026\u0026 $1 == \"root\") {print \"root_ok\"} ($3 == 0 \u0026\u0026 $1 != \"root\") {print \"FA…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.2.3. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: NA."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      awk -F: '($3 == 0 && $1 == "root") {print "root_ok"} ($3 == 0 && $1 != "root") {print "FAIL: " $1}' /etc/group
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^root_ok$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-e6e96aa117 |
      GID 0 is the root group, which owns many sensitive system files and directories. Any other group with GID 0 silently gives its members the same group access as root. Ensuring that only the group named root has GID 0 prevents such hidden privilege.
    remediation: &rem-481abd2b91 |
      Make sure the group root has GID 0 and give every other group that the check reports with GID 0 its own unused GID, or remove it if it is not needed.

      awk -F: '$3 == 0' /etc/group
      groupmod -g NEWGID GROUP

      Files keep GID 0 and therefore stay owned by the group root. Review the members of GROUP before changing it. If root itself does not have GID 0, fix it with groupmod -g 0 root after the other groups are moved.
  - id: "CIS-AMAZON2027-5.4.2.4-root_passwd_set"
    name: "root passwd set: passwd -S root | awk '$2 ~ /^(P|L)/ {print \"root_status_ok \" $2}'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.2.4. NIST SP 800-53 Rev. 5: AC-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      passwd -S root | awk '$2 ~ /^(P|L)/ {print "root_status_ok " $2}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^root_status_ok (P|L)" }
    rationale: &rat-dc1e5c0dc5 |
      If root has no password, anyone with local access, for example through the console or single-user mode, can become root without authentication. A set password, or a locked root account where administrators use sudo, ensures that root access requires a credential.
    remediation: &rem-c94fa31bf9 |
      Set a strong password for root.

      passwd root

      Where the check also accepts a locked account (status L), passwd -l root is an alternative if administrators use sudo.
  - id: "CIS-AMAZON2027-5.4.2.5-root_path_check"
    name: "root path check: l_root_path=\"$(su - root -c 'printf \"%s\" \"$PATH\"')\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.2.5. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: NA."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      l_root_path="$(su - root -c 'printf "%s" "$PATH"')"
      [ -n "$l_root_path" ] && echo "path_found"
      printf '%s\n' "$l_root_path" | grep -- "::" >/dev/null && echo "FAIL: root's PATH contains an empty directory (::)"
      printf '%s\n' "$l_root_path" | grep -P -- ":\h*$" >/dev/null && echo "FAIL: root's PATH ends with a trailing colon (:)"
      printf '%s\n' "$l_root_path" | grep -P -- '(^\h*|:)\.(:|\h*$)' >/dev/null && echo "FAIL: root's PATH contains the current working directory (.)"
      printf '%s\n' "$l_root_path" | tr ':' '\n' | while IFS= read -r l_path; do
        [ -z "$l_path" ] && continue
        if [ -d "$l_path" ]; then
          stat -Lc '%#a %U' "$l_path" | while read -r l_mode l_own; do
            [ "$l_own" != "root" ] && echo "FAIL: $l_path is owned by $l_own"
            [ $(( l_mode & 022 )) -gt 0 ] && echo "FAIL: $l_path is mode $l_mode"
          done
        else
          echo "FAIL: $l_path is not an existing directory"
        fi
      done
      true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^path_found$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-ee503b897e |
      If root's PATH contains the current directory, empty entries, relative paths or directories that other users can write to, a malicious program placed there can be executed with root privileges when an administrator types a common command name. Root's PATH should contain only absolute, root-owned and non-writable directories.
    remediation: &rem-0afab9f1f3 |
      Remove the current directory (.), empty entries (leading, trailing or double colons), relative paths and non-existent directories from root's PATH, and make sure every remaining directory is owned by root and not writable by group or others. Look for PATH assignments in root's and the system-wide shell startup files.

      su - root -c 'echo "$PATH"'
      grep -sn 'PATH' /root/.bash_profile /root/.bashrc /root/.profile /etc/profile /etc/bashrc /etc/bash.bashrc /etc/environment /etc/profile.d/*.sh
      chown root DIRECTORY
      chmod go-w DIRECTORY
  - id: "CIS-AMAZON2027-5.4.2.6-root_umask_effective"
    name: "root umask effective: su - root -c 'umask'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.2.6. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      su - root -c 'umask'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0?[0-7][2367]7$" }
    rationale: &rat-448b341f92 |
      Files created by root inherit permissions from root's umask. A permissive umask makes new configuration files, logs or keys readable or writable by other users. A umask of 027 or stricter removes group write and all access for other users from newly created files.
    remediation: &rem-aec47e9542 |
      Set umask 0027 at the end of root's login profile and remove weaker umask settings there.

      grep -n umask /root/.bash_profile /root/.bashrc /root/.profile
      echo 'umask 0027' >> /root/.bash_profile

      The check runs su - root -c umask, which reads /etc/profile, the profile.d scripts and root's profile; the last umask set in that chain wins.
  - id: "CIS-AMAZON2027-5.4.3.1-nologin_not_in_shells-attrs"
    name: "/etc/shells: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: NA."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/shells'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-1371eb889f |
      /etc/shells lists valid login shells. Some services, such as FTP daemons or chsh, allow access only for accounts with a shell listed there. If nologin is listed, accounts that are meant to be blocked may be treated as having a valid shell and gain access through such services.
    remediation: &rem-fa056f672c |
      Create /etc/shells.
  - id: "CIS-AMAZON2027-5.4.3.1-nologin_not_in_shells-content"
    name: "/etc/shells has the expected content (1 rule)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.3.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: NA."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      cat '/etc/shells'
    allow_rc: any
    expect: { none: "~ .*nologin" }
    rationale: *rat-1371eb889f
    remediation: &rem-852b96f5ad |
      Edit /etc/shells so that its lines meet these conditions (regular expressions):

      - no line matches .*nologin
  - id: "CIS-AMAZON2027-5.4.3.2-check_timeout"
    name: "check timeout: l_set=0"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.3.2. NIST SP 800-53 Rev. 5: AC-12. CIS Controls v8: 4.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      l_set=0
      for l_file in $(grep -Pls -- '^([^#\n\r]+)?\bTMOUT\b' /etc/*bashrc /etc/profile /etc/profile.d/*.sh /etc/profile.d/sh.local /usr/etc/profile.d/*.sh /usr/etc/profile.d/sh.local 2>/dev/null); do
        l_val="$(grep -Po -- '^([^#\n\r]+)?\bTMOUT=\d+\b' "$l_file" | awk -F= '{v=$NF} END{if (NR>0) print v}')"
        [ -z "$l_val" ] && continue
        l_set=1
        grep -Pq -- '^\h*(typeset\h\-xr\hTMOUT=\d+|([^#\n\r]+)?\breadonly\h+TMOUT\b)' "$l_file" || echo "FAIL: $l_file TMOUT is not marked readonly"
        grep -Pq -- '^\h*(typeset\h\-xr\hTMOUT=\d+|([^#\n\r]+)?\bexport\b([^#\n\r]+\b)?TMOUT\b)' "$l_file" || echo "FAIL: $l_file TMOUT is not exported"
        { [ "$l_val" -gt 0 ] && [ "$l_val" -le 900 ]; } || echo "FAIL: $l_file TMOUT=$l_val is out of range"
      done
      [ "$l_set" -eq 1 ] && echo "tmout_set"
      true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^tmout_set$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-e92d54c805 |
      An interactive shell left open on an unattended terminal can be used by anyone passing by. TMOUT makes the shell exit automatically after a period of inactivity. Marking it readonly and exporting it prevents users from disabling the timeout in their own session; long-running interactive work may need to account for it.
    remediation: &rem-d216d7a191 |
      Set an idle timeout of 900 seconds or less in a profile script and make it readonly and exported.

      printf '%s\n' 'TMOUT=900' 'readonly TMOUT' 'export TMOUT' > /etc/profile.d/50-tmout.sh

      Remove other TMOUT settings with larger or zero values from /etc/profile, /etc/bashrc and /etc/profile.d. The timeout applies to new login shells.
  - id: "CIS-AMAZON2027-5.4.3.3-login_defs_umask-attrs"
    name: "/etc/login.defs: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.3.3. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/login.defs'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-5c3aa29de0 |
      The UMASK value in login.defs defines the default permissions for home directories and files created by tools such as useradd. A permissive value lets other users read or modify new users' files. A umask of 027 or stricter keeps new data private to the owner and group.
    remediation: *rem-0b6bdc1798
  - id: "CIS-AMAZON2027-5.4.3.3-login_defs_umask-content"
    name: "/etc/login.defs has the expected content (1 rule)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.3.3. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/login.defs'
    allow_rc: any
    expect: { some: "~ ^\\s*UMASK\\s+0?[0-7][2367]7\\b" }
    rationale: *rat-5c3aa29de0
    remediation: &rem-b032431b46 |
      Edit /etc/login.defs so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*UMASK\s+0?[0-7][2367]7\b
  - id: "CIS-AMAZON2027-5.4.3.4-umask_profile_scripts"
    name: "umask profile scripts: l_floor=23"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.4.3.4. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      l_floor=23
      for l_file in /etc/profile /etc/bashrc /etc/bash.bashrc /etc/profile.d/sh.local /etc/profile.d/*.sh; do
        [ -r "$l_file" ] || continue
        grep -Psi -- '^\h*umask\h+\S' "$l_file" | while IFS= read -r l_line; do
          l_arg="$(printf '%s' "$l_line" | grep -Poi -- '^\h*umask\h+\K[^[:space:]#;]+')"
          [ -n "$l_arg" ] || continue
          l_dec="INVALID"
          if printf '%s' "$l_arg" | grep -E '^[0-7]{3,4}$' >/dev/null; then
            l_dec="$(( 8#$l_arg ))"
          elif printf '%s' "$l_arg" | grep -E '^([augo]+=[rwx]*)(,[augo]+=[rwx]*)*$' >/dev/null; then
            l_u=0; l_g=0; l_o=0
            for l_clause in $(printf '%s' "$l_arg" | tr ',' ' '); do
              l_who="${l_clause%%=*}"; l_perms="${l_clause#*=}"; l_bits=0
              case "$l_perms" in *r*) l_bits=$(( l_bits | 4 ));; esac
              case "$l_perms" in *w*) l_bits=$(( l_bits | 2 ));; esac
              case "$l_perms" in *x*) l_bits=$(( l_bits | 1 ));; esac
              l_deny=$(( 7 - l_bits ))
              case "$l_who" in *a*) l_u=$l_deny; l_g=$l_deny; l_o=$l_deny;; esac
              case "$l_who" in *u*) l_u=$l_deny;; esac
              case "$l_who" in *g*) l_g=$l_deny;; esac
              case "$l_who" in *o*) l_o=$l_deny;; esac
            done
            l_dec=$(( l_u * 64 + l_g * 8 + l_o ))
          fi
          if [ "$l_dec" = "INVALID" ] || [ $(( l_dec & l_floor )) -ne "$l_floor" ]; then
            echo "FAIL: $l_file: $l_line"
          fi
        done
      done
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-0e0a7af57b |
      The umask set in shell profile scripts determines the permissions of files that users create. A permissive umask such as 022 makes new files readable by everyone, which can expose sensitive data. A system-wide umask of 027 or stricter removes access for other users by default.
    remediation: &rem-5bcc36ecf9 |
      Set a system-wide umask of 0027 in a profile script.

      echo 'umask 0027' > /etc/profile.d/50-umask.sh
      grep -n umask /etc/profile /etc/bashrc /etc/profile.d/*.sh
      sed -ri 's/^(\s*umask\s+)0?0[02]2\s*$/\10027/' /etc/profile /etc/bashrc

      On Amazon Linux the check inspects every umask line in /etc/profile, /etc/bashrc and /etc/profile.d, so weaker values such as 002 and 022 there must be raised as well (the sed command does this for the default lines; review the grep output for others).
  - id: "CIS-AMAZON2027-6.1.1.1-systemd-journald-running"
    name: "Service systemd-journald is running"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.1.1. NIST SP 800-53 Rev. 5: SC-24. CIS Controls v8: 4.8, 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemctl show -p ActiveState systemd-journald | cut -d= -f2
    expect: "== active"
    rationale: &rat-aa9c4cf1bc |
      systemd-journald collects kernel, service and user log messages and passes them to persistent storage or syslog. If it is not running, events from services and the kernel are lost, leaving gaps in the audit trail. It is a static unit that is always started by systemd.
    remediation: &rem-062cd16446 |
      Start the service systemd-journald:

      systemctl start systemd-journald
  - id: "CIS-AMAZON2027-6.1.1.2-journald_remote_not_in_use"
    name: "journald remote not in use: systemctl show -p Id -p UnitFileState -p ActiveState systemd-journal-remote.socket system…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.1.2. NIST SP 800-53 Rev. 5: AU-12, AU-2, AU-7. CIS Controls v8: 4.8, 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemctl show -p Id -p UnitFileState -p ActiveState systemd-journal-remote.socket systemd-journal-remote.service | awk -v RS='' '{ id=""; u=0; for(i=1;i<=NF;i++){ if($i ~ /^Id=/) id=substr($i,4); if($i ~ /^UnitFileState=(enabled|enabled-runtime)$/) u=1; if($i ~ /^ActiveState=active$/) u=1 } if(u) print id " is in use" }'
      echo check_complete
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^check_complete$" }
      - { none: "~ is in use" }
    rationale: &rat-ab8c191772 |
      systemd-journal-remote receives journal entries from other hosts over the network. On a system that is not a designated log collector, the listening service only adds attack surface and lets remote parties fill the disk or inject log data. Central log servers are the legitimate exception.
    remediation: &rem-b2602c4102 |
      Stop and mask the journal-remote socket and service, or remove the package if it is not needed.

      systemctl stop systemd-journal-remote.socket systemd-journal-remote.service
      systemctl mask systemd-journal-remote.socket systemd-journal-remote.service

      Alternatively: dnf remove systemd-journal-remote.
  - id: "CIS-AMAZON2027-6.1.1.3-journald_forward_to_syslog"
    name: "journald forward to syslog: systemd-analyze cat-config systemd/journald.conf | grep -Pi -- '^\\h*ForwardToSyslog\\h*=' …"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.1.3. NIST SP 800-53 Rev. 5: AU-6. CIS Controls v8: 8.2, 8.9."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemd-analyze cat-config systemd/journald.conf | grep -Pi -- '^\h*ForwardToSyslog\h*=' | tail -n 1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^\\s*ForwardToSyslog\\s*=\\s*yes\\s*$" }
    rationale: &rat-5246345486 |
      When rsyslog is the logging system that ships logs to a central server and applies retention, journald must pass its messages to it. Without ForwardToSyslog, messages that exist only in the journal are missing from syslog files and remote collection. If journald itself is used for remote logging, this setting is not needed.
    remediation: &rem-fab4033320 |
      Enable forwarding to syslog in a journald drop-in and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '%s\n' '[Journal]' 'ForwardToSyslog=yes' > /etc/systemd/journald.conf.d/99-forward-to-syslog.conf
      systemctl restart systemd-journald

      The check uses the last ForwardToSyslog value in the merged configuration, so the drop-in should sort last.
  - id: "CIS-AMAZON2027-6.1.1.4-journald_rotation"
    name: "journald rotation: systemd-analyze cat-config systemd/journald.conf | grep -Psi -- '^\\h*(SystemMaxUse|System…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.1.4. NIST SP 800-53 Rev. 5: AU-12, AU-2, AU-7. CIS Controls v8: 4.8, 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemd-analyze cat-config systemd/journald.conf | grep -Psi -- '^\h*(SystemMaxUse|SystemKeepFree|SystemMaxFileSize|RuntimeMaxUse|RuntimeKeepFree|RuntimeMaxFileSize|MaxFileSec)\h*='
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^\\s*(SystemMaxUse|SystemKeepFree|SystemMaxFileSize|RuntimeMaxUse|RuntimeKeepFree|RuntimeMaxFileSize|MaxFileSec)\\s*=\\s*\\S+" }
    rationale: &rat-fb8d9da0a5 |
      Without explicit limits the journal can grow until it consumes the space reserved for it, or rotate so aggressively that evidence is lost before it is reviewed. Setting size and age limits makes retention predictable and protects other services from a full file system.
    remediation: &rem-fcdaa3fc65 |
      Configure journal size and rotation limits in a journald drop-in and restart journald.

      mkdir -p /etc/systemd/journald.conf.d
      printf '%s\n' '[Journal]' 'SystemMaxUse=1G' 'SystemKeepFree=500M' 'RuntimeMaxUse=200M' 'RuntimeKeepFree=50M' 'MaxFileSec=1month' > /etc/systemd/journald.conf.d/60-rotation.conf
      systemctl restart systemd-journald

      Adjust the values to the site's retention policy and disk size.
  - id: "CIS-AMAZON2027-6.1.1.5-journald_journal_file_mode"
    name: "journald journal file mode: find /var/log/journal /run/log/journal -type f -name '*.journal*' -perm /0137 2\u003e/dev/null…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.1.5. NIST SP 800-53 Rev. 5: AU-9. CIS Controls v8: 8.2, 8.9."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      find /var/log/journal /run/log/journal -type f -name '*.journal*' -perm /0137 2>/dev/null | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0$" }
    rationale: &rat-1e74614d10 |
      Journal files contain authentication events, command lines and other sensitive system information. If they are writable by the group or readable by other users, unprivileged users can read this data or tamper with the audit trail. Mode 0640 or stricter limits access to root and the journal group.
    remediation: &rem-a0274f575d |
      Remove excess permissions from the journal files and make the restriction persistent through tmpfiles.d.

      find /var/log/journal /run/log/journal -type f -name '*.journal*' -perm /0137 -exec chmod u-x,g-wx,o-rwx {} +

      Also make sure the tmpfiles.d entry for the journal uses mode 0640 so the files are not loosened again at boot.
  - id: "CIS-AMAZON2027-6.1.1.5-journald_tmpfiles_journal_mode"
    name: "journald tmpfiles journal mode: systemd-tmpfiles --cat-config | grep -P -- '^\\h*[^#\\h]+\\h+/var/log/journal/\\S*\\.journal'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.1.5. NIST SP 800-53 Rev. 5: AU-9. CIS Controls v8: 8.2, 8.9."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemd-tmpfiles --cat-config | grep -P -- '^\h*[^#\h]+\h+/var/log/journal/\S*\.journal'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ \\.journal\\S*\\s+0?[0246][04]0\\s" }
      - { none: "~ \\.journal\\S*\\s+0?([1357][0-7]{2}|[0-7][1235-7][0-7]|[0-7]{2}[1-7])\\s" }
    rationale: &rat-4c14976dd3 |
      systemd-tmpfiles sets the permissions of the journal files at boot. If its configuration grants a looser mode, any manual hardening of the journal files is undone on the next boot. Keeping the tmpfiles.d entry at 0640 or stricter makes the protection of journal files persistent.
    remediation: &rem-1bae5f7d9d |
      Override the vendor tmpfiles.d file in /etc/tmpfiles.d (a file there with the same name replaces it) and make the journal entry use mode 0640, then apply it.

      cp -n /usr/lib/tmpfiles.d/systemd.conf /etc/tmpfiles.d/systemd.conf
      grep -n '/var/log/journal' /etc/tmpfiles.d/systemd.conf
      systemd-tmpfiles --create --prefix /var/log/journal

      Before applying, edit the copy so the line reads: z /var/log/journal/%m/system.journal 0640 root systemd-journal - - . Check other files shown by systemd-tmpfiles --cat-config for journal entries with a weaker mode.
  - id: "CIS-AMAZON2027-6.1.2.1-rsyslog"
    name: "Package rsyslog is installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.2.1. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet rsyslog
    expect: true
    rationale: &rat-ec4e2f2832 |
      rsyslog collects log messages from the kernel, services and applications, writes them to files and can forward them to a central log server. Without an installed, enabled and running syslog daemon, security-relevant events are not recorded in a durable way and incidents cannot be investigated.
    remediation: &rem-9fc091c437 |
      Install the package rsyslog:

      dnf install rsyslog
  - id: "CIS-AMAZON2027-6.1.2.2-rsyslog-enabled"
    name: "Service rsyslog is enabled"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.2.2. NIST SP 800-53 Rev. 5: AU-12, AU-2, AU-3. CIS Controls v8: 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "rpm -q --quiet rsyslog"
    run: |
      systemctl show -p UnitFileState rsyslog | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-ec4e2f2832
    remediation: &rem-092ce033e4 |
      Enable the service rsyslog:

      systemctl enable rsyslog
  - id: "CIS-AMAZON2027-6.1.2.2-rsyslog-running"
    name: "Service rsyslog is running"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.2.2. NIST SP 800-53 Rev. 5: AU-12, AU-2, AU-3. CIS Controls v8: 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "rpm -q --quiet rsyslog"
    run: |
      systemctl show -p ActiveState rsyslog | cut -d= -f2
    expect: "== active"
    rationale: *rat-ec4e2f2832
    remediation: &rem-e1b56d94f4 |
      Start the service rsyslog:

      systemctl start rsyslog
  - id: "CIS-AMAZON2027-6.1.2.3-rsyslog_file_create_mode"
    name: "rsyslog file create mode: grep -Psih -- '^\\h*(\\$FileCreateMode\\h+|[^#]*\\btype\\h*=\\h*\"?omfile\"?[^#]*\\bfileCreateMode…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.2.3. NIST SP 800-53 Rev. 5: AC-3, AC-6, MP-2. CIS Controls v8: 3.3, 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "rpm -q --quiet rsyslog"
    run: |
      grep -Psih -- '^\h*(\$FileCreateMode\h+|[^#]*\btype\h*=\h*"?omfile"?[^#]*\bfileCreateMode\h*=\h*"?)0[0-7]{3}' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [0, 2]" }
      - { some: "~ (FileCreateMode\\s+|fileCreateMode\\s*=\\s*\"?)0[0246][04]0\\b" }
      - { none: "~ (FileCreateMode\\s+|fileCreateMode\\s*=\\s*\"?)0([1357][0-7]{2}|[0-7][1235-7][0-7]|[0-7]{2}[1-7])\\b" }
    rationale: &rat-c326a1cccf |
      rsyslog creates new log files with the mode given by FileCreateMode. A permissive default makes freshly created logs readable by every user, exposing authentication data and system details. Setting 0640 or stricter ensures new log files are protected from the start.
    remediation: &rem-5dffef558b |
      Set the file creation mode for rsyslog in a drop-in that is read before the file actions, remove weaker settings, and restart rsyslog.

      echo '$FileCreateMode 0640' > /etc/rsyslog.d/00-filecreatemode.conf
      grep -Pin 'FileCreateMode' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      systemctl restart rsyslog

      $FileCreateMode only affects actions that follow it, so the include of /etc/rsyslog.d must come before the rules in rsyslog.conf (the default).
  - id: "CIS-AMAZON2027-6.1.2.4-rsyslog_conf_file_access"
    name: "rsyslog conf file access: { find /etc/rsyslog.conf -not -type l \\( ! -user root -o ! -group root -o -perm /0137 \\) …"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.2.4. NIST SP 800-53 Rev. 5: AC-3. CIS Controls v8: 3.3, 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "rpm -q --quiet rsyslog"
    run: |
      { find /etc/rsyslog.conf -not -type l \( ! -user root -o ! -group root -o -perm /0137 \) 2>/dev/null; find /etc/rsyslog.d/ -type f -name '*.conf' \( ! -user root -o ! -group root -o -perm /0137 \) 2>/dev/null; } | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0$" }
    rationale: &rat-2ca714bfce |
      rsyslog configuration decides which events are logged and where they are sent. A user who can modify it can suppress logging of their activities or redirect logs; readable files reveal log destinations. Owner and group root with mode 0640 or stricter protect the configuration.
    remediation: &rem-8e69961e22 |
      Find the files with wrong owner, group or mode and fix each of them.

      find /etc/rsyslog.conf /etc/rsyslog.d/ -type f -name '*.conf' \( ! -user root -o ! -group root -o -perm /0137 \) -ls
      chown root:root FILE
      chmod u-x,g-wx,o-rwx FILE
  - id: "CIS-AMAZON2027-6.1.2.5-rsyslog_d_dir_access"
    name: "rsyslog d dir access: find /etc/rsyslog.d/ -maxdepth 0 -type d \\( ! -user root -o ! -group root -o -perm /0022 …"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.2.5. NIST SP 800-53 Rev. 5: AC-3. CIS Controls v8: 3.3, 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "rpm -q --quiet rsyslog"
    run: |
      find /etc/rsyslog.d/ -maxdepth 0 -type d \( ! -user root -o ! -group root -o -perm /0022 \) 2>/dev/null | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0$" }
    rationale: &rat-a58ffbde5b |
      rsyslog loads every configuration file in /etc/rsyslog.d. If non-root users can write to the directory, they can add a file that discards or redirects log messages. Ownership by root:root without group or other write permission prevents this.
    remediation: &rem-1b7207be45 |
      Set owner, group and permissions of the directory.

      chown root:root /etc/rsyslog.d
      chmod go-w /etc/rsyslog.d
  - id: "CIS-AMAZON2027-6.1.2.6-rsyslog_workdir_access"
    name: "rsyslog workdir access: d=$(grep -Psoh -- '^[^#]*(\\$WorkDirectory\\h+|workDirectory\\h*=\\h*\"?)\\K[^\"\\h)]+' /etc/rsys…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.2.6. NIST SP 800-53 Rev. 5: AC-3. CIS Controls v8: 3.3, 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "rpm -q --quiet rsyslog"
    run: |
      d=$(grep -Psoh -- '^[^#]*(\$WorkDirectory\h+|workDirectory\h*=\h*"?)\K[^"\h)]+' /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null | tail -n 1)
      find "${d:-/var/lib/rsyslog}" -maxdepth 0 -type d \( ! -user root -o ! -group root -o -perm /0077 \) 2>/dev/null | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0$" }
    rationale: &rat-ef8f40d45f |
      The rsyslog working directory holds queue and state files that can contain buffered log messages not yet delivered. Access by other users would let them read or tamper with these messages. The directory should belong to root:root and be accessible only by root.
    remediation: &rem-f88e6ddd9b |
      Set owner, group and mode of the rsyslog work directory (WorkDirectory from the configuration, default /var/lib/rsyslog).

      chown root:root /var/lib/rsyslog
      chmod 0700 /var/lib/rsyslog

      Use the configured directory instead if WorkDirectory points elsewhere.
  - id: "CIS-AMAZON2027-6.1.2.7-rsyslog_not_log_server"
    name: "rsyslog not log server: grep -Psi -- '^\\h*module\\(load=\"?(imtcp|imudp|imptcp|imrelp)\"?' /etc/rsyslog.conf /etc/rs…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.2.7. NIST SP 800-53 Rev. 5: AU-12, AU-2, AU-7, CM-6. CIS Controls v8: 4.8, 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "rpm -q --quiet rsyslog"
    run: |
      grep -Psi -- '^\h*module\(load="?(imtcp|imudp|imptcp|imrelp)"?' /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null
      grep -Psi -- '^\h*input\(type="?(imtcp|imudp|imptcp|imrelp)"?' /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null
      grep -Psi -- '^\h*\$ModLoad\h+(imtcp|imudp|imptcp|imrelp)\b' /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null
      grep -Psi -- '^\h*\$(InputTCPServerRun|UDPServerRun|InputPTCPServerRun|InputRELPServerRun)\b' /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null
      echo check_complete
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^check_complete$" }
      - { none: "~ (?i)(imtcp|imudp|imptcp|imrelp|ServerRun)" }
    rationale: &rat-df26b41a93 |
      Loading the imtcp, imudp, imptcp or imrelp input modules turns rsyslog into a network log receiver. On a system that is not a designated log server, this opens a listening port that remote parties can use to flood the disk or inject false log entries. Central log servers are the legitimate exception.
    remediation: &rem-a04c8c1b49 |
      Remove or comment out the network input directives the check finds and restart rsyslog.

      grep -Pin '(imtcp|imudp|imptcp|imrelp|ServerRun)' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      systemctl restart rsyslog

      Edit each reported line (module(load=...), input(type=...), $ModLoad, $...ServerRun) before restarting.
  - id: "CIS-AMAZON2027-6.1.2.8-etc_rsyslog.conf-attrs"
    name: "/etc/rsyslog.conf: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.2.8. NIST SP 800-53 Rev. 5: AU-12, AU-2, AU-7. CIS Controls v8: 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "rpm -q --quiet rsyslog"
    run: |
      f='/etc/rsyslog.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-863f7605c9 |
      rsyslog only records what its rules tell it to. Rules that route emergency, authentication, mail, news, cron, warning, critical and local facility messages into dedicated files make sure that security-relevant events are recorded and can be found quickly during an investigation. A restrictive file creation mode keeps the resulting log files from being readable by other users.
    remediation: &rem-d45052d244 |
      Create /etc/rsyslog.conf.
  - id: "CIS-AMAZON2027-6.1.2.8-etc_rsyslog.conf-content"
    name: "/etc/rsyslog.conf has the expected content (13 rules)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.2.8. NIST SP 800-53 Rev. 5: AU-12, AU-2, AU-7. CIS Controls v8: 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "rpm -q --quiet rsyslog"
    run: |
      cat '/etc/rsyslog.conf'
    allow_rc: any
    expect:
      - { some: "~ ^\\*\\.emerg\\s+:omusrmsg:\\*" }
      - { some: "~ ^auth,authpriv\\.\\*\\s+/var/log/secure" }
      - { some: "~ ^mail\\.\\*\\s+-/var/log/mail" }
      - { some: "~ ^mail\\.info\\s+-/var/log/mail\\.info" }
      - { some: "~ ^mail\\.err\\s+/var/log/mail\\.err" }
      - { some: "~ ^cron\\.\\*\\s+/var/log/cron" }
      - { some: "~ ^\\*\\.=warning;\\*\\.=err\\s+-/var/log/warn" }
      - { some: "~ ^\\*\\.crit\\s+/var/log/warn" }
      - { some: "~ ^\\*\\.\\*;mail\\.none;news\\.none\\s+-?/var/log/messages" }
      - { some: "~ ^local0,local1\\.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local2,local3\\.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local4,local5\\.\\*\\s+-/var/log/localmessages" }
      - { some: "~ ^local6,local7\\.\\*\\s+-/var/log/localmessages" }
    rationale: *rat-863f7605c9
    remediation: &rem-32a398d16d |
      Edit /etc/rsyslog.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\*\.emerg\s+:omusrmsg:\*
      - a line matches ^auth,authpriv\.\*\s+/var/log/secure
      - a line matches ^mail\.\*\s+-/var/log/mail
      - a line matches ^mail\.info\s+-/var/log/mail\.info
      - a line matches ^mail\.err\s+/var/log/mail\.err
      - a line matches ^cron\.\*\s+/var/log/cron
      - a line matches ^\*\.=warning;\*\.=err\s+-/var/log/warn
      - a line matches ^\*\.crit\s+/var/log/warn
      - a line matches ^\*\.\*;mail\.none;news\.none\s+-?/var/log/messages
      - a line matches ^local0,local1\.\*\s+-/var/log/localmessages
      - a line matches ^local2,local3\.\*\s+-/var/log/localmessages
      - a line matches ^local4,local5\.\*\s+-/var/log/localmessages
      - a line matches ^local6,local7\.\*\s+-/var/log/localmessages
  - id: "CIS-AMAZON2027-6.1.2.14-etc_logrotate.conf-attrs"
    name: "/etc/logrotate.conf: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.2.14. NIST SP 800-53 Rev. 5: AU-8. CIS Controls v8: 4.8, 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/logrotate.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-704881c556 |
      Log files grow continuously; without rotation they eventually fill the file system and stop logging or affect other services. logrotate periodically rotates, compresses and expires logs according to a defined retention, and its create directive sets the permissions of new log files.
    remediation: &rem-5b488c90de |
      Create /etc/logrotate.conf.
  - id: "CIS-AMAZON2027-6.1.2.14-etc_logrotate.conf-content"
    name: "/etc/logrotate.conf has the expected content (2 rules)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.2.14. NIST SP 800-53 Rev. 5: AU-8. CIS Controls v8: 4.8, 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/logrotate.conf'
    allow_rc: any
    expect:
      - { some: "~ ^\\s*(daily|weekly|monthly|yearly)\\s*$" }
      - { some: "~ ^\\s*rotate\\s+\\d+" }
    rationale: *rat-704881c556
    remediation: &rem-c56d7e9e5c |
      Edit /etc/logrotate.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*(daily|weekly|monthly|yearly)\s*$
      - a line matches ^\s*rotate\s+\d+
  - id: "CIS-AMAZON2027-6.1.3.1-logfile_access_configured"
    name: "logfile access configured: find -L /var/log -type f \\( -perm /0137 -o ! -user root -o ! -group root \\) -exec stat -L…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.3.1. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      find -L /var/log -type f \( -perm /0137 -o ! -user root -o ! -group root \) -exec stat -Lc '%n %U %G %a' {} + 2>/dev/null | awk '
      { f=$1; u=$2; g=$3; m=strtonum("0" $4); n=f; sub(/.*\//, "", n)
        if (f == "/var/log/README") { mask=91; ok=(u=="root" && g=="root") }
        else if (n ~ /^((u|b|w)tmp|lastlog)/) { mask=75; ok=(u=="root" && (g=="root" || g=="utmp")) }
        else if (n ~ /\.journal~?$/) { mask=95; ok=(u=="root" && (g=="root" || g=="systemd-journal")) }
        else if (f ~ /^\/var\/log\/(apt\/|dnf\.|dnf5\.log|hawkey\.log|zypp\/|zypper\.log|yum\.log)/) { mask=91; ok=(u=="root" && (g=="root" || g=="adm")) }
        else if (n ~ /^(cloud-init\.log|localmessages|waagent\.log)/) { mask=91; ok=((u=="root" || u=="syslog") && (g=="root" || g=="adm")) }
        else if (u != "root" && u != "syslog") { mask=95; ok=1 }
        else { mask=95; ok=(g=="root" || g=="adm") }
        if (and(m, mask) != 0 || !ok) print "FAIL: " f " " u " " g " " $4 }'
      echo check_complete
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^check_complete$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-86cf2d9f07 |
      Log files in /var/log contain authentication events, error messages and sometimes sensitive data. Overly permissive modes or wrong ownership let unprivileged users read this information or alter the evidence of their actions. Each log file should be owned by root or its writing service, belong to an appropriate group and have no more permissions than needed.
    remediation: &rem-676a1378c8 |
      Review each file the check reports and tighten owner, group and mode: generally owner root (or the service account that writes it), group root or adm, mode 0640 or stricter. wtmp, btmp and lastlog may use group utmp (up to 0664), and package manager logs, cloud-init.log and README may be 0644.

      stat -c '%a %U %G %n' FILE
      chmod u-x,g-wx,o-rwx FILE
      chown root:root FILE

      Also fix the create modes in logrotate and the writing service so rotated or recreated files keep the restricted permissions.
  - id: "CIS-AMAZON2027-6.2.1.1-audit"
    name: "Package audit is installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.1.1. NIST SP 800-53 Rev. 5: AU-12, AU-2, AU-3, SI-5. CIS Controls v8: 8.2, 8.5."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      rpm -q --quiet audit
    expect: true
    rationale: &rat-5d5d992283 |
      The Linux audit framework records security-relevant events such as logins, privilege use, file access and configuration changes in a tamper-resistant trail. Without the audit user-space tools (audit on RPM systems, auditd on Debian and Ubuntu), these events cannot be collected, which makes detecting and investigating incidents far harder.
    remediation: &rem-1518bbb26a |
      Install the package audit:

      dnf install audit
  - id: "CIS-AMAZON2027-6.2.1.1-audit-libs"
    name: "Package audit-libs is installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.1.1. NIST SP 800-53 Rev. 5: AU-12, AU-2, AU-3, SI-5. CIS Controls v8: 8.2, 8.5."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      rpm -q --quiet audit-libs
    expect: true
    rationale: &rat-5f843a11e3 |
      audit-libs provides the libraries through which PAM, sshd, sudo and other programs send audit events to the kernel. If it is missing, those components cannot emit their user-space audit records, leaving gaps in the audit trail.
    remediation: &rem-e352b7f843 |
      Install the package audit-libs:

      dnf install audit-libs
  - id: "CIS-AMAZON2027-6.2.1.2-audit_default_grub"
    name: "audit default grub: grep -Psoi -- '^\\h*GRUB_CMDLINE_LINUX=\"([^#\\n\\r]+\\h+)?audit=1\\b' /etc/default/grub"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.1.2. NIST SP 800-53 Rev. 5: AU-2. CIS Controls v8: 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep -Psoi -- '^\h*GRUB_CMDLINE_LINUX="([^#\n\r]+\h+)?audit=1\b' /etc/default/grub
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ audit=1" }
    rationale: &rat-20bfb20320 |
      Processes started before auditd are not audited unless the kernel enables auditing at boot. With audit=1 on the kernel command line, every process gets an audit context from the start, so early activity, including possible tampering during boot, is recorded. Keeping the parameter in /etc/default/grub ensures it survives configuration regeneration and new kernels.
    remediation: &rem-c9246ec31c |
      Add audit=1 to GRUB_CMDLINE_LINUX in /etc/default/grub (append it, not as the first word) and to all existing boot entries.

      grep -q '^GRUB_CMDLINE_LINUX=.*audit=1' /etc/default/grub || sed -ri 's/^(GRUB_CMDLINE_LINUX="[^"]*)"/\1 audit=1"/' /etc/default/grub
      grubby --update-kernel ALL --args 'audit=1'

      The change takes effect after a reboot. Remove conflicting values (e.g. audit=0) from the line if present.
  - id: "CIS-AMAZON2027-6.2.1.2-grubby_audit_1"
    name: "grubby audit 1: grubby --info=ALL | grep '^args=' | grep -vc '\\baudit=1\\b'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.1.2. NIST SP 800-53 Rev. 5: AU-2. CIS Controls v8: 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grubby --info=ALL | grep '^args=' | grep -vc '\baudit=1\b'
    allow_rc: any
    expect:
      - { rc: "in [0, 1]" }
      - { some: "~ ^0$" }
    rationale: &rat-a6b8efd8b9 |
      On systems using boot loader entries managed by grubby, the kernel command line of each entry decides whether auditing is enabled at boot. If audit=1 is missing, processes started before auditd escape auditing. Checking the configured entries confirms the setting actually reaches the kernel.
    remediation: &rem-dc65031034 |
      Add audit=1 to the kernel arguments of all boot entries.

      grubby --update-kernel ALL --args 'audit=1'

      The change takes effect after a reboot. Also add it to GRUB_CMDLINE_LINUX in /etc/default/grub so new kernels inherit it.
  - id: "CIS-AMAZON2027-6.2.1.3-audit_backlog_default_grub"
    name: "audit backlog default grub: grep -Po -- '^\\h*GRUB_CMDLINE_LINUX=\"([^#\\n\\r]+\\h+)?\\baudit_backlog_limit=\\K\\d+' /etc/def…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.1.3. NIST SP 800-53 Rev. 5: AU-12, AU-2, SI-5. CIS Controls v8: 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep -Po -- '^\h*GRUB_CMDLINE_LINUX="([^#\n\r]+\h+)?\baudit_backlog_limit=\K\d+' /etc/default/grub | awk '{ if ($1 + 0 >= 8192) ok=1 } END { print (ok ? "ok" : "fail") }'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^ok$" }
    rationale: &rat-6f061b7300 |
      During boot, audit events are queued in the kernel until auditd starts. If the backlog buffer is too small, events are lost or the kernel may react according to the failure setting. A backlog limit of at least 8192 gives enough room to keep early events. Keeping it in /etc/default/grub ensures it persists.
    remediation: &rem-20a27f4695 |
      Add audit_backlog_limit=8192 to GRUB_CMDLINE_LINUX in /etc/default/grub (append it, not as the first word) and to all existing boot entries.

      grep -q '^GRUB_CMDLINE_LINUX=.*audit_backlog_limit=8192' /etc/default/grub || sed -ri 's/^(GRUB_CMDLINE_LINUX="[^"]*)"/\1 audit_backlog_limit=8192"/' /etc/default/grub
      grubby --update-kernel ALL --args 'audit_backlog_limit=8192'

      The change takes effect after a reboot. Remove conflicting values (e.g. a smaller audit_backlog_limit) from the line if present.
  - id: "CIS-AMAZON2027-6.2.1.3-audit_backlog_grubby"
    name: "audit backlog grubby: grubby --info=ALL | grep '^args=' | awk '{ if (match($0, /audit_backlog_limit=[0-9]+/)) {…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.1.3. NIST SP 800-53 Rev. 5: AU-12, AU-2, SI-5. CIS Controls v8: 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grubby --info=ALL | grep '^args=' | awk '{ if (match($0, /audit_backlog_limit=[0-9]+/)) { v=substr($0, RSTART + 20, RLENGTH - 20); if (v + 0 < 8192) bad++ } else bad++ } END { print bad + 0 }'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0$" }
    rationale: &rat-11683c1216 |
      The audit backlog limit has to be present on every boot entry to be effective for whichever kernel boots. A missing or small value risks losing audit events generated before auditd is running.
    remediation: &rem-6aa246dbca |
      Add audit_backlog_limit=8192 to all boot entries.

      grubby --update-kernel ALL --args 'audit_backlog_limit=8192'

      The change takes effect after a reboot. Also add it to GRUB_CMDLINE_LINUX in /etc/default/grub so new kernels inherit it.
  - id: "CIS-AMAZON2027-6.2.1.4-auditd-enabled"
    name: "Service auditd is enabled"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.1.4. NIST SP 800-53 Rev. 5: AU-12, AU-2, SI-5. CIS Controls v8: 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      systemctl show -p UnitFileState auditd | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-f809f26f23 |
      auditd is the daemon that receives audit events from the kernel and writes them to disk. If it is not installed, enabled and running, audit rules have no effect on the persistent trail, and security events go unrecorded.
    remediation: &rem-5d15604058 |
      Enable the service auditd:

      systemctl enable auditd
  - id: "CIS-AMAZON2027-6.2.1.4-auditd-running"
    name: "Service auditd is running"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.1.4. NIST SP 800-53 Rev. 5: AU-12, AU-2, SI-5. CIS Controls v8: 8.2."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      systemctl show -p ActiveState auditd | cut -d= -f2
    expect: "== active"
    rationale: *rat-f809f26f23
    remediation: &rem-ce273a00c5 |
      Start the service auditd:

      systemctl start auditd
  - id: "CIS-AMAZON2027-6.2.2.1-max_log_auditd_conf"
    name: "max log auditd conf: grep max_log_file /etc/audit/auditd.conf"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.2.1. NIST SP 800-53 Rev. 5: AU-4. CIS Controls v8: 8.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep max_log_file /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*max_log_file\\s*=\\s*\\d+\\b" }
    rationale: &rat-3aaf4ad791 |
      max_log_file defines the size at which an audit log file is rotated. A deliberate size, together with the rotation action, controls how much audit history is kept and prevents single log files from becoming unmanageable or rotating too often to preserve evidence.
    remediation: &rem-6c2bac235c |
      Set max_log_file (size in MB) in /etc/audit/auditd.conf to a value that fits the site policy, e.g. 32.

      sed -ri 's/^\s*max_log_file\s*=.*/max_log_file = 32/' /etc/audit/auditd.conf
      grep -q '^max_log_file = ' /etc/audit/auditd.conf || echo 'max_log_file = 32' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      SIGHUP makes auditd reread its configuration. Most variants require the exact format 'max_log_file = NN' with at least two digits.
  - id: "CIS-AMAZON2027-6.2.2.2-max_log_action_auditd_conf"
    name: "max log action auditd conf: grep max_log_file_action /etc/audit/auditd.conf"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.2.2. NIST SP 800-53 Rev. 5: AU-11. CIS Controls v8: 8.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep max_log_file_action /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ max_log_file_action = keep_logs" }
    rationale: &rat-2c8c6634dd |
      When an audit log reaches its maximum size, the default action rotates and eventually deletes old logs, losing audit history. keep_logs rotates without deleting, so no audit records are discarded automatically. Disk usage must then be monitored, because logs accumulate until archived.
    remediation: &rem-604d9d4f57 |
      Set max_log_file_action to keep_logs in /etc/audit/auditd.conf.

      sed -ri 's/^\s*max_log_file_action\s*=.*/max_log_file_action = keep_logs/' /etc/audit/auditd.conf
      grep -q '^max_log_file_action = ' /etc/audit/auditd.conf || echo 'max_log_file_action = keep_logs' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      SIGHUP makes auditd reread its configuration. Archive old audit logs regularly to avoid filling the disk.
  - id: "CIS-AMAZON2027-6.2.2.3-logs_full_auditd_conf"
    name: "logs full auditd conf: grep -E \"disk.*action\" /etc/audit/auditd.conf"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.2.3. NIST SP 800-53 Rev. 5: AU-5. CIS Controls v8: 8.2, 8.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep -E "disk.*action" /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ disk_full_action\\s*=\\s*(halt|single)" }
      - { some: "~ disk_error_action\\s*=\\s*(syslog|halt|single)" }
    rationale: &rat-70577f0aa7 |
      If the audit log partition fills up or a disk error occurs, auditing can silently stop and later actions go unrecorded. Halting or switching to single-user mode on a full disk, and at least reporting disk errors, guarantees that the system does not keep running without an audit trail. The trade-off is reduced availability, so audit storage must be sized and monitored.
    remediation: &rem-e2c732cb3a |
      Set disk_full_action to single (or halt) and disk_error_action to syslog, single or halt in /etc/audit/auditd.conf.

      sed -ri 's/^\s*disk_full_action\s*=.*/disk_full_action = single/' /etc/audit/auditd.conf
      grep -q '^disk_full_action = ' /etc/audit/auditd.conf || echo 'disk_full_action = single' >> /etc/audit/auditd.conf
      sed -ri 's/^\s*disk_error_action\s*=.*/disk_error_action = syslog/' /etc/audit/auditd.conf
      grep -q '^disk_error_action = ' /etc/audit/auditd.conf || echo 'disk_error_action = syslog' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      SIGHUP makes auditd reread its configuration. A full audit partition will then take the system out of normal operation.
  - id: "CIS-AMAZON2027-6.2.2.4-logs_low_space_auditd_conf"
    name: "logs low space auditd conf: grep space_left_action /etc/audit/auditd.conf"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.2.4. NIST SP 800-53 Rev. 5: AU-5. CIS Controls v8: 8.2, 8.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep space_left_action /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ space_left_action\\s*=\\s*(email|exec|single|halt)" }
      - { some: "~ admin_space_left_action\\s*=\\s*(halt|single)" }
    rationale: &rat-35cb8a9517 |
      Low disk space on the audit partition is the warning sign before audit records are lost. Notifying administrators when space_left is reached, and switching to single-user mode or halting at admin_space_left, ensures someone reacts before auditing fails. Halting affects availability, so monitoring and capacity planning matter.
    remediation: &rem-63eb66207c |
      Set space_left_action to email (or exec, single, halt) and admin_space_left_action to single (or halt) in /etc/audit/auditd.conf.

      sed -ri 's/^\s*space_left_action\s*=.*/space_left_action = email/' /etc/audit/auditd.conf
      grep -q '^space_left_action = ' /etc/audit/auditd.conf || echo 'space_left_action = email' >> /etc/audit/auditd.conf
      sed -ri 's/^\s*admin_space_left_action\s*=.*/admin_space_left_action = single/' /etc/audit/auditd.conf
      grep -q '^admin_space_left_action = ' /etc/audit/auditd.conf || echo 'admin_space_left_action = single' >> /etc/audit/auditd.conf
      pkill -HUP -x auditd

      email needs a working local mail transfer agent and action_mail_acct; SIGHUP makes auditd reread its configuration.
  - id: "CIS-AMAZON2027-6.2.3.1-auditd_6_2_3_1_cnf"
    name: "auditd 6 2 3 1 cnf: grep -Phs -- '\\bsudoers(\\.d)?\\b' /etc/audit/rules.d/*.rules"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.1. NIST SP 800-53 Rev. 5: AU-3. CIS Controls v8: 8.5."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep -Phs -- '\bsudoers(\.d)?\b' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*(-w /etc/sudoers/? -p wa -k scope|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/sudoers/? -F perm=wa (-k |-F key=)scope)\\s*$" }
      - { some: "~ ^\\s*(-w /etc/sudoers\\.d/? -p wa -k scope|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/sudoers\\.d/? -F perm=wa (-k |-F key=)scope)\\s*$" }
    rationale: &rat-1a12e91d8e |
      Changes to /etc/sudoers and /etc/sudoers.d alter who may act as root. Auditing writes and attribute changes to these files records attempts to grant additional privileges, which is essential to detect privilege escalation and to prove who changed the sudo policy. This check verifies the persistent rule files in /etc/audit/rules.d.
    remediation: &rem-ec93399beb |
      Add the following rules to a file in /etc/audit/rules.d/ and load them:

      cat > /etc/audit/rules.d/50-scope.rules <<'EOF'
      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d -p wa -k scope
      EOF
      augenrules --load

      Check the result with auditctl -l. If the configuration is immutable (-e 2), the new rules are only loaded after a reboot.
  - id: "CIS-AMAZON2027-6.2.3.1-auditd_6_2_3_1_live"
    name: "auditd 6 2 3 1 live: auditctl -l | grep -P -- '\\bsudoers(\\.d)?\\b'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.1. NIST SP 800-53 Rev. 5: AU-3. CIS Controls v8: 8.5."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      auditctl -l | grep -P -- '\bsudoers(\.d)?\b'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*(-w /etc/sudoers/? -p wa -k scope|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/sudoers/? -F perm=wa (-k |-F key=)scope)\\s*$" }
      - { some: "~ ^\\s*(-w /etc/sudoers\\.d/? -p wa -k scope|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/sudoers\\.d/? -F perm=wa (-k |-F key=)scope)\\s*$" }
    rationale: &rat-8c131053d1 |
      Changes to /etc/sudoers and /etc/sudoers.d alter who may act as root. Auditing writes and attribute changes to these files records attempts to grant additional privileges, which is essential to detect privilege escalation and to prove who changed the sudo policy. This check verifies the rules loaded in the running kernel.
    remediation: &rem-4bbc42b49d |
