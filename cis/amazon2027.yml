    run: |
      findmnt -n -o FSTYPE,OPTIONS '/var/log/audit'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: &rat-ce12551b17 |
      The audit daemon needs reliable space for audit records and may stop logging or halt the system when its disk is full. A dedicated file system for /var/log/audit keeps other logs and applications from consuming that space and causing audit events to be lost.
    remediation: &rem-501781e5d6 |
      Put /var/log/audit on a separate file system (partition or logical volume) and mount it there with an entry in /etc/fstab or a systemd mount unit. This needs a new file system and moving the existing data.
  - id: "CIS-AMAZON2027-1.1.2.7.2-var_log_audit_nodev_options"
    name: "/var/log/audit is a separate mount with nodev"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.2.7.2. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "findmnt -n '/var/log/audit'"
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/var/log/audit'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nodev(,|$)"
    rationale: &rat-3990c7deb8 |
      /var/log/audit holds the audit trail, which never needs device files, privileged programs or executables. With nodev the kernel ignores character and block device files on it, so a device node created there cannot be used to access disks, memory or other hardware directly; legitimate device files live only under /dev. This check verifies the option on the currently mounted file system.
    remediation: &rem-8a3ae6bd16 |
      Mount /var/log/audit with the option nodev: add it to the options of /var/log/audit in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/var/log/audit'

      If /var/log/audit is not a separate file system yet, create one first.
