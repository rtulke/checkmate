  - id: "CIS-AMAZON2027-7.2.8-home_dirs_configured"
    name: "home dirs configured: l_valid_shells=\"^($(awk -F/ '$NF != \"nologin\" {print}' /etc/shells | sed -rn '/^\\//p' | p…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.2.8. NIST SP 800-53 Rev. 5: AC-3. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      l_valid_shells="^($(awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//p' | paste -s -d '|' - ))$"
      awk -v pat="$l_valid_shells" -F: '$(NF) ~ pat { print $1 " " $(NF-1) }' /etc/passwd | while read -r l_user l_home; do
        if [ ! -d "$l_home" ]; then
          echo "FAIL: user $l_user home directory $l_home does not exist"
          continue
        fi
        stat -Lc '%U %#a' "$l_home" | while read -r l_own l_mode; do
          [ "$l_own" != "$l_user" ] && echo "FAIL: user $l_user home $l_home is owned by $l_own"
          [ $(( l_mode & 027 )) -gt 0 ] && echo "FAIL: user $l_user home $l_home is mode $l_mode"
        done
      done
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
