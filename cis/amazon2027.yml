    name: "cis 2 3 2 chrony sources: grep -Ph -- '^\\h*(server|pool|refclock)\\h+\\H+' /etc/chrony.conf 2\u003e/dev/null"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.3.2. NIST SP 800-53 Rev. 5: AU-12, AU-3. CIS Controls v8: 8.4."
