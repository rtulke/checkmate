    name: "auditd 6 2 3 3 sudoers logfile: grep -rPsih -- '^\\h*Defaults\\h+([^#]+,\\h*)?logfile\\h*=' /etc/sudoers /etc/sudoers.d"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.3. NIST SP 800-53 Rev. 5: AU-12. CIS Controls v8: 8.5."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep -rPsih -- '^\h*Defaults\h+([^#]+,\h*)?logfile\h*=' /etc/sudoers /etc/sudoers.d
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^\\s*Defaults\\s+([^#]+,\\s*)?logfile\\s*=\\s*\"?/var/log/sudo\\.log" }
    rationale: &rat-3ce8f8a17d |
      By default sudo logs only through syslog, where entries are mixed with other messages and depend on the logging pipeline. A dedicated sudo log file provides a separate record of privileged commands, which can be watched by audit rules and reviewed independently.
    remediation: &rem-56f871262a |
      Configure sudo to write its own log file, using a drop-in validated by visudo.

      echo 'Defaults logfile="/var/log/sudo.log"' > /etc/sudoers.d/50-logfile
      chmod 0440 /etc/sudoers.d/50-logfile
      visudo -c

      File names in /etc/sudoers.d must not contain a dot, otherwise sudo ignores them.
