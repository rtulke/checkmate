      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\\S+,)?unlinkat(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)delete\\s*$" }
