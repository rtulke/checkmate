  - id: "CIS-AMAZON2027-6.2.3.21-auditd_6_2_3_21_cnf"
    name: "auditd 6 2 3 21 cnf: grep -Phs -- 'mount' /etc/audit/rules.d/*.rules"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.21. NIST SP 800-53 Rev. 5: AU-12. CIS Controls v8: 8.5."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep -Phs -- 'mount' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\\S+,)?mount(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)mounts\\s*$" }
      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\\S+,)?mount(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)mounts\\s*$" }
    rationale: &rat-ac139153ee |
      Recording mount system calls made by users shows when file systems or removable media are attached. This can point to data being copied to external media or to untrusted content and setuid programs being brought onto the host. This check looks at the persistent rules in /etc/audit/rules.d/, which are loaded at boot.
    remediation: &rem-38fdd68667 |
      Add rules that record the mount system call (64-bit and 32-bit) for users with key mounts. Put them in a file in /etc/audit/rules.d/ and load them.

      cat >> /etc/audit/rules.d/50-mounts.rules <<'EOF'
      -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -k mounts
      -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=unset -k mounts
      EOF
      augenrules --load

      If the loaded audit configuration is immutable (-e 2), the new rules only take effect after a reboot.
