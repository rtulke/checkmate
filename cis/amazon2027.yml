  - id: "CIS-AMAZON2027-6.2.3.22-auditd_6_2_3_22_cnf"
    name: "auditd 6 2 3 22 cnf: grep -Phs -- '(utmp|wtmp|btmp)' /etc/audit/rules.d/*.rules"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.22. NIST SP 800-53 Rev. 5: AU-3. CIS Controls v8: 8.5."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep -Phs -- '(utmp|wtmp|btmp)' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*(-w /var/run/utmp/? -p wa -k session|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/var/run/utmp/? -F perm=wa (-k |-F key=)session)\\s*$" }
      - { some: "~ ^\\s*(-w /var/log/wtmp/? -p wa -k session|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/var/log/wtmp/? -F perm=wa (-k |-F key=)session)\\s*$" }
      - { some: "~ ^\\s*(-w /var/log/btmp/? -p wa -k session|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/var/log/btmp/? -F perm=wa (-k |-F key=)session)\\s*$" }
    rationale: &rat-ea894e1653 |
      utmp, wtmp and btmp hold the current sessions, the login history and failed logins. Watching them for writes records session activity and exposes attempts to edit these files to hide logins or failed access attempts. This check looks at the persistent rules in /etc/audit/rules.d/, which are loaded at boot.
    remediation: &rem-51e6a61638 |
      Add rules that watch /var/run/utmp, /var/log/wtmp and /var/log/btmp for writes and attribute changes with key session. Put them in a file in /etc/audit/rules.d/ and load them.

      cat >> /etc/audit/rules.d/50-session.rules <<'EOF'
      -w /var/run/utmp -p wa -k session
      -w /var/log/wtmp -p wa -k session
      -w /var/log/btmp -p wa -k session
      EOF
      augenrules --load

      If the loaded audit configuration is immutable (-e 2), the new rules only take effect after a reboot.
