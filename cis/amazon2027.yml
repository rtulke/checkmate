  - id: "CIS-AMAZON2027-3.3.2.1-cis_3_3_2_1_force_forwarding"
    name: "cis 3 3 2 1 force forwarding: sysctl -a 2\u003e/dev/null | grep -P -- '^net\\.ipv6\\.conf\\.\\S+\\.force_forwarding\\h*=\\h*1\\b'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 3.3.2.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-amazon2027, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "test -e '/proc/sys/net/ipv6/conf/all/force_forwarding'"
    run: |
      sysctl -a 2>/dev/null | grep -P -- '^net\.ipv6\.conf\.\S+\.force_forwarding\h*=\h*1\b'
      l_sysctl="$(readlink -e /usr/lib/systemd/systemd-sysctl || readlink -e /lib/systemd/systemd-sysctl)"
      "$l_sysctl" --cat-config 2>/dev/null | awk '/^# \//{f=$2} /^[[:space:]]*net[./]ipv6[./]conf[./][^[:space:]=]+[./]force_forwarding[[:space:]]*=[[:space:]]*1([^0-9]|$)/{print f": "$0}'
      exit 0
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-9ed67a705f |
      force_forwarding enables IPv6 forwarding on an individual interface regardless of the global forwarding setting. A single interface with it set to 1 turns the host into an IPv6 router for that link, which can be used to bypass network segmentation even though global forwarding appears disabled. This check verifies that no interface has it enabled at runtime or in the sysctl configuration.
    remediation: &rem-04332be101 |
      Find interfaces with force_forwarding enabled, set it to 0 at runtime, and remove or change the persistent settings that enable it:

      sysctl -a 2>/dev/null | grep -P '^net\.ipv6\.conf\.\S+\.force_forwarding\s*=\s*1'
      sysctl -w net.ipv6.conf.INTERFACE.force_forwarding=0
      grep -rn force_forwarding /etc/sysctl.conf /etc/sysctl.d/ /run/sysctl.d/ /usr/lib/sysctl.d/

      INTERFACE is each interface reported by the first command. Hosts that deliberately route IPv6 on an interface need an exception.
