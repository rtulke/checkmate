      rpm -q --quiet tigervnc-server-minimal
    expect: false
    rationale: &rat-1379ed2d04 |
      tigervnc-server-minimal provides a VNC server binary. VNC is often run with weak authentication and without encryption, exposing graphical sessions to the network. If the system does not need it, removing the package eliminates the attack surface and the patching burden; keep it only where the service is a deliberate part of the system's role.
    remediation: &rem-026d9e2c03 |
      Remove the package tigervnc-server-minimal, unless the system needs it:

      dnf remove tigervnc-server-minimal
  - id: "CIS-AMAZON2027-2.1.19-cis_2_1_19_xorg-x11-server-common_pkg"
    name: "Package xorg-x11-server-common is not installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.1.19. NIST SP 800-53 Rev. 5: CM-11. CIS Controls v8: 4.8."
