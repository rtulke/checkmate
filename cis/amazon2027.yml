  - id: "CIS-AMAZON2027-1.2.1.1-gpg_keys"
    name: "gpg keys: rpm -q gpg-pubkey --queryformat '%{VERSION} %{PACKAGER}\\n'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.2.1.1. NIST SP 800-53 Rev. 5: SI-2. CIS Controls v8: 7.3, 7.4."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q gpg-pubkey --queryformat '%{VERSION} %{PACKAGER}\n'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^37ce7c3833e5a33c4a1e4b0d5408eaa4b1e92e3d Amazon Linux amazon-linux@amazon.com$" }
    rationale: &rat-4781e33879 |
      Package signatures are only meaningful if the keys used to verify them are the right ones. An unexpected or attacker-supplied key in the package manager's keyring lets packages signed with it install without warning. Reviewing the imported keys ensures that only vendor and approved repository keys are trusted.
    remediation: &rem-e2da82e641 |
      Import the distribution vendor's package signing key and remove any key that does not belong to an approved repository. List the installed keys first.

      rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --> %{summary}\n'
      rpm --import /etc/pki/rpm-gpg/KEYFILE
      rpm -e gpg-pubkey-VERSION-RELEASE

      The vendor keys ship in /etc/pki/rpm-gpg/, for example RPM-GPG-KEY-redhat-release on RHEL, RPM-GPG-KEY-amazon-linux-2 on Amazon Linux 2 and RPM-GPG-KEY-amazon-linux-2023 on Amazon Linux 2023. On Amazon Linux 2027 the check expects the Amazon Linux key with the fingerprint 37ce7c3833e5a33c4a1e4b0d5408eaa4b1e92e3d.
  - id: "CIS-AMAZON2027-1.2.1.2-gpg_check_repo"
    name: "gpg check repo: echo \"gpgcheck_disabled_repos=$(grep -Pris -- '^\\h*(pkg_)?gpgcheck\\h*=\\h*(0|false|no)\\b' …"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.2.1.2. NIST SP 800-53 Rev. 5: SI-2. CIS Controls v8: 7.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      echo "gpgcheck_disabled_repos=$(grep -Pris -- '^\h*(pkg_)?gpgcheck\h*=\h*(0|false|no)\b' /etc/yum.repos.d /etc/yum/repos.d /etc/distro.repos.d /etc/dnf/repos.override.d 2>/dev/null | wc -l)"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^gpgcheck_disabled_repos=0$" }
    rationale: &rat-b0f4f69ff9 |
      A repository definition can override the global setting and turn signature checking off for its packages. Any repository with gpgcheck disabled lets unsigned or tampered packages be installed silently, so signature checking needs to stay enabled for every configured repository.
    remediation: &rem-4675487d5a |
      Enable package signature checking in every repository definition: find the repositories that disable it and set gpgcheck=1 in each listed FILE.

      grep -RniwE '(pkg_)?gpgcheck\s*=\s*(0|false|no)' /etc/yum.repos.d/ /etc/distro.repos.d/ /etc/dnf/repos.override.d/ 2>/dev/null
      sed -i -E 's/^(\s*)(pkg_)?gpgcheck\s*=\s*(0|false|no)\b/\1\2gpgcheck=1/I' FILE

      Amazon Linux 2 also flags commented-out gpgcheck=0 lines; delete those too. Make sure the repository's signing key (gpgkey=) is available, otherwise installations from it fail.
  - id: "CIS-AMAZON2027-1.2.1.2-gpgcheck_dnf_effective"
    name: "gpgcheck dnf effective: dnf --dump-main-config 2\u003e/dev/null | grep -Pi -- '^\\h*pkg_gpgcheck\\h*='"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.2.1.2. NIST SP 800-53 Rev. 5: SI-2. CIS Controls v8: 7.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      dnf --dump-main-config 2>/dev/null | grep -Pi -- '^\h*pkg_gpgcheck\h*='
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^\\s*pkg_gpgcheck\\s*=\\s*(1|true|yes)\\s*$" }
      - { none: "~ (?i)^\\s*pkg_gpgcheck\\s*=\\s*(0|false|no)\\b" }
    rationale: &rat-2887e07855 |
      Verifying the GPG signature of every package before installation ensures that software comes from the distribution or another trusted publisher and has not been altered on a mirror, proxy or in transit. With signature checking disabled globally, a compromised repository or a man-in-the-middle could deliver trojaned packages that are installed with root privileges. This check reads the effective main configuration of dnf.
    remediation: &rem-9ab2f5191f |
      Enable package signature checking in the [main] section of /etc/dnf/dnf.conf and remove any setting that disables it:

      sed -i -E '/^\s*(pkg_)?gpgcheck\s*=/d' /etc/dnf/dnf.conf
      sed -i '/^\[main\]/a pkg_gpgcheck=1' /etc/dnf/dnf.conf
      dnf --dump-main-config | grep -i gpgcheck

      Also remove gpgcheck/pkg_gpgcheck overrides from drop-in files in /etc/dnf/libdnf5.conf.d/ if present.
  - id: "CIS-AMAZON2027-1.2.1.2-gpgcheck_repo_effective"
    name: "gpgcheck repo effective: echo \"gpgcheck_disabled_repos=$(dnf --dump-repo-config='*' 2\u003e/dev/null | grep -Pic -- '^\\…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.2.1.2. NIST SP 800-53 Rev. 5: SI-2. CIS Controls v8: 7.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      echo "gpgcheck_disabled_repos=$(dnf --dump-repo-config='*' 2>/dev/null | grep -Pic -- '^\h*pkg_gpgcheck\h*=\h*(0|false|no)\b')"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^gpgcheck_disabled_repos=0$" }
    rationale: &rat-92f4f77b14 |
      A single repository with signature checking disabled is enough to let unsigned or tampered packages onto the system, regardless of the global setting. Repository definitions added by third-party installers sometimes turn the check off. Requiring signature verification for every configured repository ensures that all installed software can be traced to a trusted signing key.
    remediation: &rem-dcb3f49c84 |
      Find the repository definitions that disable signature checking and enable it for each one, making sure a valid gpgkey= is configured for the repository:

      grep -PilR '^\h*(pkg_)?gpgcheck\h*=\h*(0|false|no)\b' /etc/yum.repos.d/ /etc/dnf/
      sed -i -E 's/^\s*(pkg_)?gpgcheck\s*=\s*(0|false|no)\b.*/gpgcheck=1/I' FILE
      dnf --dump-repo-config='*' | grep -Pi '^\h*pkg_gpgcheck'

      If a repository does not sign its packages, disable or replace it rather than leaving the check off.
  - id: "CIS-AMAZON2027-1.2.1.3-repo_gpgcheck_global"
    name: "repo gpgcheck global: dnf --dump-main-config 2\u003e/dev/null | grep -Pi -- '^\\h*repo_gpgcheck\\h*='"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.2.1.3. NIST SP 800-53 Rev. 5: SI-2. CIS Controls v8: 7.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    timeout: 120000ms
    run: |
      dnf --dump-main-config 2>/dev/null | grep -Pi -- '^\h*repo_gpgcheck\h*='
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^\\s*repo_gpgcheck\\s*=\\s*(1|true|yes)\\b" }
      - { none: "~ (?i)^\\s*repo_gpgcheck\\s*=\\s*(0|false|no)\\b" }
    rationale: &rat-a13f5fa04a |
      Package signatures protect individual packages, but not the repository metadata that tells the package manager which versions exist. Without metadata signature checking an attacker controlling a mirror or the network path can withhold security updates or offer outdated vulnerable packages that are still validly signed. Verifying metadata signatures closes that gap. Some repositories do not publish signed metadata, so enabling it globally may require per-repository exceptions.
    remediation: &rem-34f8f29df4 |
      Enable repository metadata signature checking in the [main] section of /etc/dnf/dnf.conf:

      sed -i -E '/^\s*repo_gpgcheck\s*=/d' /etc/dnf/dnf.conf
      sed -i '/^\[main\]/a repo_gpgcheck=1' /etc/dnf/dnf.conf
      dnf makecache

      If a repository does not provide signed metadata, dnf reports an error for it; set repo_gpgcheck=0 only in that repository's definition after confirming it is trusted.
  - id: "CIS-AMAZON2027-1.2.1.4-repos_configured"
    name: "repos configured: dnf repolist"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.2.1.4. NIST SP 800-53 Rev. 5: SI-2. CIS Controls v8: 7.3, 7.4."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      dnf repolist
    expect: { rc: "== 0" }
    rationale: &rat-70d1c99f9e |
      Systems should get packages and security fixes only from known, approved repositories. A missing or broken repository configuration prevents patching, while unknown repositories can introduce untrusted software. Depending on the platform the check verifies that the repository list can be read, that expected repositories are present, or asks for a manual review.
    remediation: &rem-f181846f51 |
      Make sure the system has working repositories from approved sources so that the repository listing succeeds. Review the configured repositories, enable the required ones and fix errors such as unreachable mirrors, proxy settings or a missing subscription.

      dnf repolist all
      dnf config-manager --set-enabled REPO
      subscription-manager register

      On RHEL 7 and Amazon Linux 2 use yum repolist all and yum-config-manager --enable REPO; subscription-manager is only used on RHEL. On Amazon Linux 2 the check expects the amzn2-core and amzn2extra-docker repositories (amazon-linux-extras enable docker). On RHEL 8 it expects the BaseOS and AppStream repositories.
  - id: "CIS-AMAZON2027-1.2.1.5-dnf_install_weak_deps"
    name: "dnf install weak deps: dnf --dump-main-config 2\u003e/dev/null | grep -Pi -- '^\\h*install_weak_deps\\h*='"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.2.1.5. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    timeout: 120000ms
    run: |
      dnf --dump-main-config 2>/dev/null | grep -Pi -- '^\h*install_weak_deps\h*='
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^\\s*install_weak_deps\\s*=\\s*(0|false|no)\\b" }
      - { none: "~ (?i)^\\s*install_weak_deps\\s*=\\s*(1|true|yes)\\b" }
    rationale: &rat-7591f15e98 |
      Weak dependencies are packages a package merely recommends or suggests. Installing them automatically pulls in software that nobody chose deliberately, enlarging the attack surface and the number of packages that need patching. Disabling them keeps installations limited to what is actually required; packages that are needed can still be installed explicitly.
    remediation: &rem-64a7bbbaf2 |
      Disable automatic installation of weak dependencies in the [main] section of /etc/dnf/dnf.conf:

      sed -i -E '/^\s*install_weak_deps\s*=/d' /etc/dnf/dnf.conf
      sed -i '/^\[main\]/a install_weak_deps=False' /etc/dnf/dnf.conf
      dnf --dump-main-config | grep -i install_weak_deps
  - id: "CIS-AMAZON2027-1.2.2.1-release-updates"
    name: "release updates: dnf check-release-update 2\u003e\u00261"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.2.2.1. NIST SP 800-53 Rev. 5: SI-2. CIS Controls v8: 7.3, 7.4."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      dnf check-release-update 2>&1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ --releasever=" }
    rationale: &rat-9ebdbc577d |
      Amazon Linux ships updates as versioned repository snapshots, so a system locked to an older release version does not receive security fixes published in newer releases even when dnf upgrade runs regularly. Staying on the latest release version ensures that available patches are actually applied.
    remediation: &rem-02464aae0e |
      Review the release notes of the newer version reported by the check, then upgrade to it (dnf check-release-update prints the exact command with the version):

      dnf check-release-update
      dnf upgrade --releasever=VERSION

      Reboot afterwards if the kernel or core libraries were updated. To follow new releases automatically, set the releasever to latest as described in the Amazon Linux documentation.
  - id: "CIS-AMAZON2027-1.2.2.1-security-updates"
    name: "security updates: dnf check-update"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.2.2.1. NIST SP 800-53 Rev. 5: SI-2. CIS Controls v8: 7.3, 7.4."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      dnf check-update
    expect: { rc: "== 0" }
    rationale: &rat-7cc1d8773a |
      Unpatched software is one of the most common ways systems are compromised. Installing available updates closes publicly known vulnerabilities before they can be exploited. The check reports a failure while updates are pending; on most platforms this includes non-security updates.
    remediation: &rem-bcb4a0c358 |
      Install all pending package updates; the check fails as long as any update is available, not only security updates.

      dnf upgrade

      On Amazon Linux 2 and RHEL 7 use yum update. Reboot if the kernel or core libraries were updated. On Amazon Linux 2023 dnf may also announce a newer release, which counts as pending; apply it with dnf upgrade --releasever=latest after testing.
  - id: "CIS-AMAZON2027-1.3.1.1-libselinux"
    name: "Package libselinux is installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.3.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet libselinux
    expect: true
    rationale: &rat-d13f41f770 |
      libselinux provides the interfaces through which programs and tools interact with SELinux. Without it SELinux cannot be managed or work as intended, losing the mandatory access control layer that confines services even after they are compromised.
    remediation: &rem-9a0cee152e |
      Install the package libselinux:

      dnf install libselinux
  - id: "CIS-AMAZON2027-1.3.1.2-selinux_disabled_boot"
    name: "selinux disabled boot: echo \"boot_entries=$(grubby --info=ALL 2\u003e/dev/null | grep -Pc '^\\h*args=.*\\b(selinux|enfo…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      echo "boot_entries=$(grubby --info=ALL 2>/dev/null | grep -Pc '^\h*args=.*\b(selinux|enforcing)=0\b')"
      echo "kernelopts=$(grep -PrsI -- '^\h*([^#\n\r]+\h+)?kernelopts=([^#\n\r]+\h+)?(selinux|enforcing)=0\b' /boot/grub2 /boot/efi | wc -l)"
      echo "kernel_cmdline=$(grep -Ps -- '\b(selinux|enforcing)=0\b' /etc/kernel/cmdline | wc -l)"
      echo "default_grub=$(grep -Psi -- '^\h*GRUB_CMDLINE_LINUX(_DEFAULT)?=.*\b(selinux|enforcing)=0\b' /etc/default/grub | wc -l)"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^boot_entries=0$" }
      - { some: "~ ^kernelopts=0$" }
      - { some: "~ ^kernel_cmdline=0$" }
      - { some: "~ ^default_grub=0$" }
    rationale: &rat-09e36f9185 |
      SELinux can be switched off or set to permissive from the kernel command line with selinux=0 or enforcing=0. Such boot parameters override the configuration file and remove mandatory access control for all processes without it being obvious. Keeping them out of the boot configuration ensures SELinux starts as configured.
    remediation: &rem-2c0e091618 |
      Remove selinux=0 and enforcing=0 from the kernel command line of all boot entries and from the defaults used for new kernels, then regenerate the GRUB configuration.

      grubby --update-kernel=ALL --remove-args='selinux=0 enforcing=0'
      sed -i -E 's/[[:space:]]*\b(selinux|enforcing)=0\b//g' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg

      On Amazon Linux 2027 also remove these parameters from /etc/kernel/cmdline if that file exists. If SELinux was disabled until now, run touch /.autorelabel before rebooting so that files get correct labels.
  - id: "CIS-AMAZON2027-1.3.1.3-selinux_policy"
    name: "selinux policy: grep SELINUXTYPE= /etc/selinux/config"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.3.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep SELINUXTYPE= /etc/selinux/config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^SELINUXTYPE( |)=( |)targeted" }
      - { none: "~ ^SELINUXTYPE( |)=( |)(permissive|disabled)" }
    rationale: &rat-2fe59c1dc8 |
      The SELinux policy defines what each confined process may access. The targeted policy confines system and network-facing services; MLS adds multi-level security where required. Configuring a supported, maintained policy type ensures that a meaningful policy is loaded at boot.
    remediation: &rem-bcf47677ad |
      Configure the targeted SELinux policy in /etc/selinux/config and make sure the policy package is installed.

      dnf install selinux-policy-targeted
      sed -i -E 's/^\s*SELINUXTYPE\s*=.*/SELINUXTYPE=targeted/' /etc/selinux/config
      grep -q '^SELINUXTYPE=' /etc/selinux/config || echo 'SELINUXTYPE=targeted' >> /etc/selinux/config

      Use yum on Amazon Linux 2 and RHEL 7. Amazon Linux 2023 and RHEL 10 also accept mls. Changing the policy type requires a relabel (touch /.autorelabel) and a reboot.
  - id: "CIS-AMAZON2027-1.3.1.3-selinux_sestatus"
    name: "selinux sestatus: sestatus | grep 'Loaded policy'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.3.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sestatus | grep 'Loaded policy'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ Loaded policy name:\\s+targeted" }
    rationale: &rat-bb1f5e169d |
      This check confirms that SELinux is active and has actually loaded the expected policy, rather than only being configured. Without a loaded policy, services run without mandatory access control and the compromise of one service is not contained.
    remediation: &rem-22a711895d |
      Enable SELinux with the targeted policy and reboot so that the policy gets loaded.

      dnf install selinux-policy-targeted
      sed -i -E 's/^\s*SELINUX\s*=.*/SELINUX=enforcing/; s/^\s*SELINUXTYPE\s*=.*/SELINUXTYPE=targeted/' /etc/selinux/config
      grubby --update-kernel=ALL --remove-args='selinux=0 enforcing=0'
      touch /.autorelabel
      reboot

      Use yum on Amazon Linux 2 and RHEL 7. RHEL 10 also accepts the mls policy. Relabeling can take long on large file systems; SELINUX=permissive for the first boot lets you review denials before enforcing.
  - id: "CIS-AMAZON2027-1.3.1.4-getenforce_set"
    name: "getenforce set: getenforce"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.3.1.4. NIST SP 800-53 Rev. 5: SC-3. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      getenforce
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(Enforcing|Permissive)" }
    rationale: &rat-c9cc40f90e |
      SELinux enforces mandatory access control that confines services and users beyond ordinary file permissions, limiting what a compromised process can reach. When SELinux is disabled, no policy is loaded and files are not labeled, so it cannot be turned on later without a full relabel. This check accepts Enforcing or Permissive, ensuring SELinux is at least active and labeling the system.
    remediation: &rem-dc8fe2f706 |
      Enable SELinux in /etc/selinux/config, make sure it is not disabled on the kernel command line, and trigger a file system relabel at the next boot:

      dnf install selinux-policy-targeted libselinux-utils
      sed -i -E 's/^\s*SELINUX\s*=.*/SELINUX=enforcing/' /etc/selinux/config
      grubby --update-kernel ALL --remove-args selinux=0
      touch /.autorelabel
      reboot

      The relabel can take a long time on large file systems. Use SELINUX=permissive first if you need to review denials before enforcing; this check accepts both.
  - id: "CIS-AMAZON2027-1.3.1.5-etc_selinux_config-attrs"
    name: "/etc/selinux/config: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.3.1.5. NIST SP 800-53 Rev. 5: SC-3, SI-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/selinux/config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-15cd9be578 |
      The SELINUX setting in /etc/selinux/config determines the mode SELinux starts in at boot. If it is not set to enforcing, a reboot silently drops the system back to permissive or disabled mode, even if enforcing was set at runtime, and the access control policy is no longer applied.
    remediation: &rem-3c32e23d79 |
      Create /etc/selinux/config.
  - id: "CIS-AMAZON2027-1.3.1.5-etc_selinux_config-content"
    name: "/etc/selinux/config has the expected content (1 rule)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.3.1.5. NIST SP 800-53 Rev. 5: SC-3, SI-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      cat '/etc/selinux/config'
    allow_rc: any
    expect: { some: "~ ^SELINUX( |)=( |)enforcing" }
    rationale: *rat-15cd9be578
    remediation: &rem-4143082e85 |
      Edit /etc/selinux/config so that its lines meet these conditions (regular expressions):

      - a line matches ^SELINUX( |)=( |)enforcing
  - id: "CIS-AMAZON2027-1.3.1.5-getenforce_enforcing"
    name: "getenforce enforcing: getenforce"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.3.1.5. NIST SP 800-53 Rev. 5: SC-3, SI-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      getenforce
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Enforcing" }
    rationale: &rat-9984e79cdf |
      In enforcing mode SELinux actually blocks operations that violate the policy, confining compromised services and limiting lateral movement. In permissive mode violations are only logged, which is useful for troubleshooting but offers no protection. This check verifies that the running system is enforcing the policy.
    remediation: &rem-af4a2ae4b2 |
      Switch SELinux to enforcing at runtime and make it persistent; remove enforcing=0 or selinux=0 from the kernel command line if present:

      setenforce 1
      sed -i -E 's/^\s*SELINUX\s*=.*/SELINUX=enforcing/' /etc/selinux/config
      grubby --update-kernel ALL --remove-args "enforcing=0 selinux=0"

      If getenforce reports Disabled, setenforce does not work: set SELINUX=enforcing, run touch /.autorelabel and reboot. Review AVC denials (ausearch -m avc) before enforcing on production systems.
  - id: "CIS-AMAZON2027-1.3.1.6-selinux_unconfined"
    name: "selinux unconfined: ps -eZ | grep unconfined_service_t"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.3.1.6. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      ps -eZ | grep unconfined_service_t
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-a60d4dcb76 |
      Processes in the unconfined_service_t domain are services for which no SELinux policy applies, typically software installed outside the distribution packages. They run without SELinux restrictions, so a compromise of such a service is not contained. Every service should run in a confined domain or be reviewed and approved as an exception.
    remediation: &rem-491577d017 |
      Each listed process runs as an unconfined service. Identify its executable and give it a confined SELinux domain: restore the file context if a distribution service binary is mislabeled, or create and install a policy module for third-party software, then restart the service.

      ps -eZ | grep unconfined_service_t
      ls -Z BINARY
      restorecon -v BINARY
      sepolicy generate --init BINARY

      sepolicy generate (package policycoreutils-devel) creates a policy skeleton and a setup script; refine the module in permissive mode before enforcing it. Software that cannot be confined needs a documented exception.
  - id: "CIS-AMAZON2027-1.3.1.7-mctrans"
    name: "Package mctrans is not installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.3.1.7. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet mctrans
    expect: false
    rationale: &rat-a18b8d75a9 |
      mcstrans provides the mcstransd daemon, which translates SELinux MLS/MCS levels into human-readable labels. Most systems do not use these translations, and an unneeded daemon that parses security labels only adds attack surface and resource usage. Removing it has no effect on SELinux enforcement itself.
    remediation: &rem-bb1d7c06ec |
      Remove the package mctrans, unless the system needs it:

      dnf remove mctrans
  - id: "CIS-AMAZON2027-1.3.1.8-setroubleshoot"
    name: "Package setroubleshoot is not installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.3.1.8. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet setroubleshoot
    expect: false
    rationale: &rat-d9369ee205 |
      setroubleshoot analyses SELinux denials and presents them to users, mainly on desktops. On servers it is not needed, runs additional privileged code and can expose information about denials to unprivileged users. Denials remain available in the audit log without it.
    remediation: &rem-299adb7a7b |
      Remove the package setroubleshoot, unless the system needs it:

      dnf remove setroubleshoot
  - id: "CIS-AMAZON2027-1.4.2-efi_boot_opts"
    name: "efi boot opts: l_opts=\"$(awk '$1 !~ /^#/ \u0026\u0026 $2 == \"/boot/efi\" {print $4}' /etc/fstab)\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.4.2. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      l_opts="$(awk '$1 !~ /^#/ && $2 == "/boot/efi" {print $4}' /etc/fstab)"
      if [ -z "$l_opts" ]; then
        echo "efi_not_in_fstab"
      else
        for l_opt in fmask=0077 uid=0 gid=0; do
          echo ",$l_opts," | grep ",$l_opt," >/dev/null || echo "efi_missing: $l_opt"
        done
        echo "efi_options_checked"
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(efi_not_in_fstab|efi_options_checked)$" }
      - { none: "~ ^efi_missing: " }
    rationale: &rat-7db6e4f833 |
      The EFI system partition uses vfat, which has no Unix permissions; access is determined entirely by mount options. Without restrictive options every user can read, and possibly modify, boot loader files, configuration and password hashes stored there. Mounting it owned by root with masks of 0077 limits access to root and protects the integrity of the boot chain.
    remediation: &rem-b5bc254b9c |
      Mount /boot/efi with uid=0, gid=0 and masks of 0077: edit the /boot/efi line in /etc/fstab so its options field contains these values, for example:

      UUID=XXXX-XXXX /boot/efi vfat defaults,uid=0,gid=0,umask=0077,fmask=0077,shortname=winnt 0 2

      Then apply the options:

      systemctl daemon-reload
      mount -o remount /boot/efi

      Keep the existing UUID of your partition. umask and fmask are both listed because the RHEL 9 check requires both.
  - id: "CIS-AMAZON2027-1.4.2-grub_bootloader_files_access"
    name: "grub bootloader files access: find /boot -type f \\( -name 'grub*' -o -name 'user.cfg' \\) -exec stat -Lc '%n %a %U %G' {…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.4.2. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      find /boot -type f \( -name 'grub*' -o -name 'user.cfg' \) -exec stat -Lc '%n %a %U %G' {} + | awk '
        $1 ~ /^\/boot\/efi\// && $2 !~ /^[0-7]00$/ { print "bad_mode: " $0; next }
        $1 !~ /^\/boot\/efi\// && $2 !~ /^[0246]00$/ { print "bad_mode: " $0; next }
        $3 != "root" || $4 != "root" { print "bad_owner: " $0 }'
      echo "grub_files_checked"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^grub_files_checked$" }
      - { none: "~ ^bad_(mode|owner): " }
    rationale: &rat-bc6f1cc2f2 |
      The GRUB configuration can contain the boot loader password hash and controls which kernel and parameters are booted. If ordinary users can read it they can attack the password offline; if they can modify it they can disable security features or gain root on the next boot. Restricting these files to root-only access protects the boot configuration.
    remediation: &rem-0a4bc283e5 |
      Set owner root:root and remove group and other permissions (and the execute bit) on the GRUB files outside the EFI partition:

      find /boot -path /boot/efi -prune -o -type f \( -name 'grub*' -o -name 'user.cfg' \) -exec chown root:root {} + -exec chmod u-x,go-rwx {} +

      Files under /boot/efi are on vfat, where chmod and chown have no effect: their mode and owner come from the mount options, so mount /boot/efi with uid=0,gid=0,umask=0077 (see the /boot/efi mount option check) and remount it.
  - id: "CIS-AMAZON2027-1.4.3-rescue_service_sulogin"
    name: "rescue service sulogin: systemctl show -p ExecStart --value rescue.service"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.4.3. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      systemctl show -p ExecStart --value rescue.service
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ sulogin" }
    rationale: &rat-7a95e20361 |
      Rescue mode starts a root shell for system repair. If it is configured without sulogin, anyone with console access, or the ability to change boot parameters, gets a root shell without knowing a password. Requiring authentication via sulogin keeps single-user maintenance access restricted to people who know the root password.
    remediation: &rem-32bbb7ce6c |
      Make sure rescue.service starts sulogin, which is the vendor default. Remove local overrides that replace ExecStart:

      systemctl cat rescue.service
      systemctl revert rescue.service
      systemctl daemon-reload
      systemctl show -p ExecStart --value rescue.service

      systemctl revert removes all drop-ins and copies in /etc/systemd/system for the unit; re-add any other wanted customization afterwards.
  - id: "CIS-AMAZON2027-1.4.4-emergency_service_sulogin"
    name: "emergency service sulogin: systemctl show -p ExecStart --value emergency.service"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.4.4. NIST SP 800-53 Rev. 5: AC-3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      systemctl show -p ExecStart --value emergency.service
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ sulogin" }
    rationale: &rat-eb75e62722 |
      Emergency mode provides a minimal root shell when the system cannot boot normally. Without sulogin, anyone with console access, or the ability to change boot parameters, obtains root without a password. Requiring the root password keeps this recovery path from becoming an authentication bypass.
    remediation: &rem-8c9d3adf19 |
      Make sure emergency.service starts sulogin, which is the vendor default. Remove local overrides that replace ExecStart:

      systemctl cat emergency.service
      systemctl revert emergency.service
      systemctl daemon-reload
      systemctl show -p ExecStart --value emergency.service

      systemctl revert removes all drop-ins and copies in /etc/systemd/system for the unit; re-add any other wanted customization afterwards.
  - id: "CIS-AMAZON2027-1.4.5-grubby_confirm_spawn"
    name: "grubby confirm spawn: echo \"boot_entries=$(grubby --info=ALL 2\u003e/dev/null | grep -Pc '^\\h*args=.*\\bsystemd\\.conf…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.4.5. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      echo "boot_entries=$(grubby --info=ALL 2>/dev/null | grep -Pc '^\h*args=.*\bsystemd\.confirm_spawn(?!=(0|no|false|off)\b)')"
      echo "kernel_cmdline=$(grep -Ps -- '\bsystemd\.confirm_spawn(?!=(0|no|false|off)\b)' /etc/kernel/cmdline | wc -l)"
      echo "default_grub=$(grep -Psi -- '^\h*GRUB_CMDLINE_LINUX(_DEFAULT)?=.*\bsystemd\.confirm_spawn(?!=(0|no|false|off)\b)' /etc/default/grub | wc -l)"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^boot_entries=0$" }
      - { some: "~ ^kernel_cmdline=0$" }
      - { some: "~ ^default_grub=0$" }
    rationale: &rat-4882e3112e |
      The kernel parameter systemd.confirm_spawn makes systemd ask on the console before starting each service. Someone with console access can then skip security services such as auditd or firewalld during boot. Ensuring the parameter is absent from boot entries and kernel command line configuration keeps the boot sequence from being interactively manipulated.
    remediation: &rem-915f5325ca |
      Remove systemd.confirm_spawn from all boot entries and from the files used to generate them:

      grubby --info=ALL | grep confirm_spawn
      grubby --update-kernel=ALL --remove-args=systemd.confirm_spawn
      sed -i -E 's/\s*systemd\.confirm_spawn(=\S*)?//g' /etc/default/grub
      [ -f /etc/kernel/cmdline ] && sed -i -E 's/\s*systemd\.confirm_spawn(=\S*)?//g' /etc/kernel/cmdline

      If grubby still lists the parameter with a value, pass it exactly as shown (e.g. --remove-args=systemd.confirm_spawn=1). The change takes effect at the next boot.
  - id: "CIS-AMAZON2027-1.5.1-fs.protected_hardlinks"
    name: "Kernel parameter fs.protected_hardlinks is 1"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.5.1. NIST SP 800-53 Rev. 5: AC-3(4), AC-6(10)."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sysctl -n fs.protected_hardlinks
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 1"
    rationale: &rat-125d715f8b |
      With fs.protected_hardlinks set to 1, users can only create hard links to files they own or can read and write. This blocks a classic attack in which a hard link to a sensitive or setuid file is planted in a world-writable directory so that a privileged program or a later cleanup acts on the wrong file, for example to escalate privileges or overwrite system files. This check verifies the value in the running kernel.
    remediation: &rem-dfb7dcb76a |
      Set the kernel parameter fs.protected_hardlinks to 1, now and at boot:

      sysctl -w 'fs.protected_hardlinks=1'
      printf '%s\n' 'fs.protected_hardlinks = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of fs.protected_hardlinks from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-AMAZON2027-1.5.1-fs_protected_hardlinks_persistent"
