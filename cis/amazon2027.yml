      /etc/cron.monthly holds scripts run once a month. Files there are executed by cron as root on a schedule. If a non-root user owns the directory or its group is not root, that user could add or modify jobs and thereby run arbitrary commands as root. Restricting ownership to root protects the integrity of scheduled tasks.
    remediation: &rem-315a228a47 |
