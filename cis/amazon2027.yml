    rationale: &rat-ef4ca47129 |
      The SELinux configuration and policy stores in /etc/selinux, /usr/share/selinux and /var/lib/selinux define the mandatory access control rules of the system. Watching them for changes records any attempt to weaken or disable the policy, which would otherwise silently remove an important layer of protection. This check looks at the persistent rules in /etc/audit/rules.d/, which are loaded at boot.
