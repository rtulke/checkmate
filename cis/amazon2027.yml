  - id: "CIS-AMAZON2027-1.1.1.5-unused_fs_kernel_modules"
    name: "unused fs kernel modules: l_search=\"$(readlink -e /usr/lib/modules/ || readlink -e /lib/modules/)\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.1.5. NIST SP 800-53 Rev. 5: CM-7."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      l_search="$(readlink -e /usr/lib/modules/ || readlink -e /lib/modules/)"
      l_mounted="$(findmnt -Dkerno fstype | sort -u)"
      l_loaded="$(lsmod | awk '{print $1}')"
      l_conf="$(modprobe --showconfig | grep -Pi -- '^\h*(blacklist|install)\h+')"
      for l_mod in $(find -L "$l_search"/*/kernel/fs/ -mindepth 2 -maxdepth 2 -type f ! -path '*/kernel/fs/nls/*' -exec basename {} \; | cut -d. -f1 | sort -u); do
        l_umod="$(echo "$l_mod" | tr '-' '_')"
        if echo "$l_mounted" | grep -P -- "\b${l_mod}\b" >/dev/null; then
          continue
        elif echo "$l_loaded" | grep -P -- "\b${l_umod}\b" >/dev/null; then
          echo "loaded: $l_mod"
        elif ! echo "$l_conf" | grep -Pi -- "\binstall\h+${l_umod}\h+\H+" >/dev/null || ! echo "$l_conf" | grep -Pi -- "\bblacklist\h+${l_umod}\b" >/dev/null; then
          echo "loadable: $l_mod"
        fi
      done
      echo "unused_fs_modules_checked"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^unused_fs_modules_checked$" }
      - { none: "~ ^loadable: " }
    rationale: &rat-1e068b2f59 |
      File system drivers that are neither in use nor blocked can be loaded on demand, for example when a crafted image or USB device is mounted, exposing kernel code that parses untrusted data. Vulnerabilities in rarely used file system drivers have repeatedly been used for privilege escalation. Blocking all file system modules that the system does not mount reduces this attack surface without affecting the file systems actually in use.
    remediation: &rem-053e866e73 |
      For each module reported as "loadable: MODULE", confirm that the system does not need it (also consider file systems mounted only occasionally, by autofs or at boot), then block it with a blacklist entry and an install command in /etc/modprobe.d/.

      printf '%s\n' 'blacklist MODULE' 'install MODULE /bin/false' > /etc/modprobe.d/MODULE.conf
      modprobe --showconfig | grep -P '^(blacklist|install)\s+MODULE\b'

      Write module names with underscores instead of dashes (the check normalizes them that way). Do not block modules needed for /, /boot or /boot/efi; modules reported as "loaded:" do not fail the check but should be reviewed too.
  - id: "CIS-AMAZON2027-1.1.2.1.1-tmp_mount"
    name: "/tmp is a separate mount"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.2.1.1. NIST SP 800-53 Rev. 5: CM-6, CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/tmp'
    allow_rc: any
    expect: { rc: "== 0" }
    rationale: &rat-701a51792c |
      /tmp is world-writable and used by every user and many services. A separate file system (or a tmpfs) keeps users from filling the root file system through /tmp and allows restrictive mount options such as nodev, nosuid and noexec to be applied to it alone.
    remediation: &rem-fbf7b93a5e |
      Put /tmp on a separate file system (partition or logical volume) and mount it there with an entry in /etc/fstab or a systemd mount unit. This needs a new file system and moving the existing data. A tmpfs mount on /tmp, e.g. with systemd's tmp.mount, counts as well.
  - id: "CIS-AMAZON2027-1.1.2.1.1-tmp_mount_unit_enabled"
    name: "tmp mount unit enabled: systemctl is-enabled tmp.mount"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.2.1.1. NIST SP 800-53 Rev. 5: CM-6, CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemctl is-enabled tmp.mount
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(generated|enabled|static|alias|indirect|linked)" }
      - { none: "~ masked" }
      - { none: "~ disabled" }
    rationale: &rat-47560f5a42 |
      Placing /tmp on its own file system, typically a tmpfs, keeps users and services from filling the root file system through a world-writable directory and makes it possible to apply restrictive mount options such as nodev, nosuid and noexec. A tmpfs is also emptied at every boot, so stale temporary files do not accumulate. This check verifies that /tmp is managed by systemd, either through an /etc/fstab entry or the tmp.mount unit.
    remediation: &rem-18d0e1f926 |
      Either define /tmp in /etc/fstab (systemd then generates tmp.mount) or enable the tmp.mount unit shipped with systemd:

      systemctl unmask tmp.mount
      systemctl enable tmp.mount

      The new mount hides the current content of /tmp, so activate it with a reboot (or systemctl start tmp.mount during a maintenance window).
  - id: "CIS-AMAZON2027-1.1.2.1.2-tmp_nodev_options"
    name: "/tmp is a separate mount with nodev"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.2.1.2. NIST SP 800-53 Rev. 5: CM-6, CM-7. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/tmp'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nodev(,|$)"
    rationale: &rat-c7d3bae4ce |
      /tmp is world-writable and used by every user and service for temporary files. With nodev the kernel ignores character and block device files on it, so a device node created there cannot be used to access disks, memory or other hardware directly; legitimate device files live only under /dev. This check verifies the option on the currently mounted file system.
    remediation: &rem-1c21763bee |
      Mount /tmp with the option nodev: add it to the options of /tmp in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/tmp'

      If /tmp is not a separate file system yet, create one first.
  - id: "CIS-AMAZON2027-1.1.2.1.2-tmp_nodev_persistent_options"
    name: "tmp nodev persistent options: if [ \"$(systemctl show tmp.mount -p SourcePath --value)\" = \"/etc/fstab\" ]; then"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.2.1.2. NIST SP 800-53 Rev. 5: CM-6, CM-7. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      if [ "$(systemctl show tmp.mount -p SourcePath --value)" = "/etc/fstab" ]; then
        findmnt --fstab -n -o OPTIONS /tmp
      else
        systemctl cat tmp.mount 2>/dev/null | sed -n 's/^Options=//p'
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ \\bnodev\\b" }
    rationale: &rat-115b21a343 |
      /tmp is world-writable and used by every user and service for temporary files. With nodev the kernel ignores character and block device files on it, so a device node created there cannot be used to access disks, memory or other hardware directly; legitimate device files live only under /dev. This check verifies the persistent configuration of /tmp (its /etc/fstab entry or the tmp.mount unit), so the option survives reboots.
    remediation: &rem-4964770121 |
      Add nodev to the persistent mount options of /tmp. If /tmp is defined in /etc/fstab, add it to the options field (fourth column) of the /tmp line, for example:

      tmpfs /tmp tmpfs defaults,rw,nosuid,nodev,noexec,relatime 0 0

      If /tmp is provided by the tmp.mount unit, override its options with a drop-in instead:

      mkdir -p /etc/systemd/system/tmp.mount.d
      printf '%s\n' '[Mount]' 'Options=mode=1777,strictatime,nosuid,nodev,noexec,size=50%%,nr_inodes=1m' > /etc/systemd/system/tmp.mount.d/50-options.conf

      Then reload systemd and apply the option to the running mount:

      systemctl daemon-reload
      mount -o remount,nodev /tmp
  - id: "CIS-AMAZON2027-1.1.2.1.3-tmp_nosuid_options"
    name: "/tmp is a separate mount with nosuid"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.2.1.3. NIST SP 800-53 Rev. 5: CM-6, CM-7. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/tmp'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]nosuid(,|$)"
    rationale: &rat-572107ee67 |
      /tmp is world-writable and used by every user and service for temporary files. With nosuid, set-user-ID and set-group-ID bits on files there are ignored, so a privileged program planted or copied there cannot be used to gain elevated rights. This check verifies the option on the currently mounted file system.
    remediation: &rem-7a473b9cfd |
      Mount /tmp with the option nosuid: add it to the options of /tmp in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/tmp'

