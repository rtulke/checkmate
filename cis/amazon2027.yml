      f='/etc/pam.d/su'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    remediation: |
      Create /etc/pam.d/su.
  - id: "CIS-AMAZON2027-5.2.12-restrict_su-content"
    name: "/etc/pam.d/su has the expected content (1 rule)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.12. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/pam.d/su'
    allow_rc: any
    expect: { some: "~ ^\\s*auth\\s+(required|requisite)\\s+pam_wheel\\.so\\s+(\\S+\\s+)*(use_uid\\s+(\\S+\\s+)*group=sugroup|group=sugroup\\s+(\\S+\\s+)*use_uid)\\b" }
