      dnf remove tftp
  - id: "CIS-AMAZON2027-2.3.1-chrony_installed"
    name: "Package chrony is installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.3.1. NIST SP 800-53 Rev. 5: AU-12, AU-3. CIS Controls v8: 8.4."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet chrony
    expect: true
    rationale: &rat-c17942a508 |
      Accurate time is essential for correlating log entries across systems, for forensic timelines, and for protocols such as Kerberos and TLS certificate validation that fail or become exploitable when clocks drift. chrony keeps the system clock synchronized with reliable time sources.
    remediation: &rem-d6d7094cb8 |
      Install the package chrony:

      dnf install chrony
  - id: "CIS-AMAZON2027-2.3.2-cis_2_3_2_chrony_sources"
    name: "cis 2 3 2 chrony sources: grep -Ph -- '^\\h*(server|pool|refclock)\\h+\\H+' /etc/chrony.conf 2\u003e/dev/null"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.3.2. NIST SP 800-53 Rev. 5: AU-12, AU-3. CIS Controls v8: 8.4."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Ph -- '^\h*(server|pool|refclock)\h+\H+' /etc/chrony.conf 2>/dev/null
      awk '/^[[:space:]]*(sourcedir|confdir)[[:space:]]+/{print $2}' /etc/chrony.conf 2>/dev/null | while IFS= read -r l_dir; do
        grep -PhRs -- '^\h*(server|pool|refclock)\h+\H+' "$l_dir"
      done
      exit 0
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*(server|pool|refclock)\\s+\\S+" }
    rationale: &rat-74e4c0a352 |
      chrony only keeps the clock accurate if it has time sources to synchronize with. Without a configured server, pool or reference clock the system time drifts, breaking log correlation, Kerberos authentication and certificate validation. This check verifies that at least one source is configured in chrony.conf or an included directory.
    remediation: &rem-73894cd208 |
      Configure at least one time source for chrony and restart it:

      printf '%s\n' 'server NTP_SERVER iburst' >> /etc/chrony.conf
      systemctl restart chronyd
      chronyc sources

      Replace NTP_SERVER with your organization's time server (on AWS, 169.254.169.123 is the Amazon Time Sync Service). pool entries or files in a sourcedir/confdir referenced by chrony.conf are also accepted.
  - id: "CIS-AMAZON2027-2.3.3-cis_2_3_3_chronyd_sysconfig-attrs"
    name: "/etc/sysconfig/chronyd: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.3.3. NIST SP 800-53 Rev. 5: AC-6. CIS Controls v8: 8.4."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/sysconfig/chronyd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-6c4c37777d |
      chronyd is designed to drop root privileges after startup and run as the unprivileged chrony user. Passing -u root in its startup options keeps the network-facing daemon running as root, so any vulnerability in it would give an attacker full control of the system.
    remediation: &rem-3f8831cc4a |
      Create /etc/sysconfig/chronyd.
  - id: "CIS-AMAZON2027-2.3.3-cis_2_3_3_chronyd_sysconfig-content"
    name: "/etc/sysconfig/chronyd has the expected content (1 rule)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.3.3. NIST SP 800-53 Rev. 5: AC-6. CIS Controls v8: 8.4."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/sysconfig/chronyd'
    allow_rc: any
    expect: { none: "~ ^(?i)\\s*OPTIONS=\"?\\s*([^#\\n\\r]+\\s+)?-u\\s+root\\b" }
    rationale: *rat-6c4c37777d
    remediation: &rem-39c4968595 |
      Edit /etc/sysconfig/chronyd so that its lines meet these conditions (regular expressions):

      - no line matches ^(?i)\s*OPTIONS="?\s*([^#\n\r]+\s+)?-u\s+root\b
  - id: "CIS-AMAZON2027-2.3.3-cis_2_3_3_chrony_user_root"
    name: "cis 2 3 3 chrony user root: grep -PHsi -- '^\\h*user\\h+root\\b' /etc/chrony.conf /etc/chrony.d/*.conf || true"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.3.3. NIST SP 800-53 Rev. 5: AC-6. CIS Controls v8: 8.4."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -PHsi -- '^\h*user\h+root\b' /etc/chrony.conf /etc/chrony.d/*.conf || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-7976d7f381 |
      chronyd processes packets from the network and should run with as few privileges as possible. A user root directive in the chrony configuration prevents it from dropping privileges, so a vulnerability in its packet parsing would lead directly to root access.
    remediation: &rem-5bfd2c6bfe |
      Remove every user root directive from the chrony configuration (chronyd then runs as its default unprivileged user) and restart it:

      grep -PHsin '^\h*user\h+root\b' /etc/chrony.conf /etc/chrony.d/*.conf
      sed -i -E '/^\s*user\s+root\b/Id' FILE
      systemctl restart chronyd
  - id: "CIS-AMAZON2027-2.3.3-cis_2_3_3_chronyd_process_user"
    name: "cis 2 3 3 chronyd process user: ps -C chronyd -o user= || true"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.3.3. NIST SP 800-53 Rev. 5: AC-6. CIS Controls v8: 8.4."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      ps -C chronyd -o user= || true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*chrony\\s*$" }
      - { none: "~ ^\\s*root\\s*$" }
    rationale: &rat-06330c9e29 |
      chronyd is a network-facing daemon and should run as the unprivileged chrony user after startup. If the running process is owned by root, a vulnerability in its handling of network packets would give an attacker full control. This check also implies that chronyd is actually running.
    remediation: &rem-61219d7f11 |
      Make sure chronyd is not told to stay root (no -u root in OPTIONS of /etc/sysconfig/chronyd, no user root in /etc/chrony.conf or /etc/chrony.d/*.conf), the chrony user exists, and the service is running:

      grep -n OPTIONS /etc/sysconfig/chronyd
      grep -PHsi '^\h*user\h+' /etc/chrony.conf /etc/chrony.d/*.conf
      id chrony
      systemctl enable chronyd
      systemctl restart chronyd
      ps -C chronyd -o user=

      Remove -u root and user root entries found by the grep commands before restarting.
  - id: "CIS-AMAZON2027-2.4.1.1-cis_2_4_1_1_crond-enabled"
    name: "Service crond.service is enabled"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "rpm -q --quiet cronie"
    run: |
      systemctl show -p UnitFileState crond.service | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: &rat-6814286da4 |
      Many maintenance tasks such as log rotation, update checks, integrity scans and backup jobs are scheduled through cron. If the cron daemon is disabled or not running, these tasks silently stop, which can lead to full disks, missed updates and gaps in security monitoring.
    remediation: &rem-e09b8b9a39 |
      Enable the service crond.service:

      systemctl enable crond.service
  - id: "CIS-AMAZON2027-2.4.1.1-cis_2_4_1_1_crond-running"
    name: "Service crond.service is running"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.4.1.1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "rpm -q --quiet cronie"
    run: |
      systemctl show -p ActiveState crond.service | cut -d= -f2
    expect: "== active"
    rationale: *rat-6814286da4
    remediation: &rem-e15197b6c4 |
      Start the service crond.service:

      systemctl start crond.service
  - id: "CIS-AMAZON2027-2.4.1.2-cis_2_4_1_2_crontab-attrs"
    name: "/etc/crontab: exists, mode 0700 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.4.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "rpm -q --quiet cronie"
    run: |
      f='/etc/crontab'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7077)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-1bf5073d89 |
      /etc/crontab defines system-wide jobs that cron runs with the privileges of the listed users, typically root. If it is owned by a non-root user or group, they could alter or add jobs and gain root privileges. It must be owned by root:root.
    remediation: &rem-06d6017655 |
      Create /etc/crontab if it is missing, then set owner root and group root and remove the permissions u-s,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/crontab'
      chmod u-s,g-rwxs,o-rwx,a-t '/etc/crontab'
  - id: "CIS-AMAZON2027-2.4.1.3-cis_2_4_1_3_cron_hourly-attrs"
    name: "/etc/cron.hourly: exists, is a directory, mode 0700 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.4.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "rpm -q --quiet cronie"
    run: |
      f='/etc/cron.hourly'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      [ -d "$f" ] || echo "$f is not a directory"
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7077)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-4b255b7144 |
      /etc/cron.hourly holds scripts run every hour. Files there are executed by cron as root on a schedule. If a non-root user owns the directory or its group is not root, that user could add or modify jobs and thereby run arbitrary commands as root. Restricting ownership to root protects the integrity of scheduled tasks.
    remediation: &rem-2c6ebe2fdf |
      Create /etc/cron.hourly if it is missing, then make it a directory, set owner root and group root and remove the permissions u-s,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/cron.hourly'
      chmod u-s,g-rwxs,o-rwx,a-t '/etc/cron.hourly'
  - id: "CIS-AMAZON2027-2.4.1.4-cis_2_4_1_4_cron_daily-attrs"
    name: "/etc/cron.daily: exists, is a directory, mode 0700 or stricter, owner root, group root"
