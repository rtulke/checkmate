    name: "selinux disabled boot: echo \"boot_entries=$(grubby --info=ALL 2\u003e/dev/null | grep -Pc '^\\h*args=.*\\b(selinux|enfo…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.3.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
