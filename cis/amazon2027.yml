    remediation: &rem-e35b733765 |
      Remove the package xorg-x11-server-Xwayland, unless the system needs it:

      dnf remove xorg-x11-server-Xwayland
  - id: "CIS-AMAZON2027-2.2.1-cis_2_2_1_ftp_pkg"
    name: "Package ftp is not installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.2.1. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet ftp
    expect: false
    rationale: &rat-b67c5f5773 |
      The ftp client uses an unencrypted protocol, so credentials and transferred data can be intercepted. Leaving cleartext clients installed encourages their use and gives attackers ready-made tools for moving data. SFTP or scp provide encrypted alternatives.
    remediation: &rem-0f3873f227 |
      Remove the package ftp, unless the system needs it:

      dnf remove ftp
  - id: "CIS-AMAZON2027-2.2.1-cis_2_2_1_lftp_pkg"
    name: "Package lftp is not installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.2.1. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 4.8."
