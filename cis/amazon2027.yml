    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      find /etc/ssh/sshd_config.d/ -maxdepth 0 \( ! -user root -o ! -group root -o -perm /077 \) -printf 'FAIL: %p %m %u %g\n'
