  - id: "CIS-AMAZON2027-1.1.2.7.4-var_log_audit_noexec_options"
    name: "/var/log/audit is a separate mount with noexec"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.2.7.4. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "findmnt -n '/var/log/audit'"
    run: |
      findmnt -n -o FSTYPE,OPTIONS '/var/log/audit'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ [ ,]noexec(,|$)"
    rationale: &rat-23ae1cc3c2 |
      /var/log/audit holds the audit trail, which never needs device files, privileged programs or executables. With noexec, programs cannot be executed directly from it, which blocks the common attack step of dropping a tool or exploit into a writable directory and running it. Scripts started through an interpreter are not stopped, and some installers may need adjusting. This check verifies the option on the currently mounted file system.
    remediation: &rem-bedda3ff14 |
      Mount /var/log/audit with the option noexec: add it to the options of /var/log/audit in /etc/fstab (or its systemd mount unit), then apply:

      mount -o remount '/var/log/audit'

      If /var/log/audit is not a separate file system yet, create one first.
