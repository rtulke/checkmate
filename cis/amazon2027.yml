  - id: "CIS-AMAZON2027-6.1.3.1-logfile_access_configured"
    name: "logfile access configured: find -L /var/log -type f \\( -perm /0137 -o ! -user root -o ! -group root \\) -exec stat -L…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.1.3.1. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      find -L /var/log -type f \( -perm /0137 -o ! -user root -o ! -group root \) -exec stat -Lc '%n %U %G %a' {} + 2>/dev/null | awk '
      { f=$1; u=$2; g=$3; m=strtonum("0" $4); n=f; sub(/.*\//, "", n)
        if (f == "/var/log/README") { mask=91; ok=(u=="root" && g=="root") }
        else if (n ~ /^((u|b|w)tmp|lastlog)/) { mask=75; ok=(u=="root" && (g=="root" || g=="utmp")) }
        else if (n ~ /\.journal~?$/) { mask=95; ok=(u=="root" && (g=="root" || g=="systemd-journal")) }
        else if (f ~ /^\/var\/log\/(apt\/|dnf\.|dnf5\.log|hawkey\.log|zypp\/|zypper\.log|yum\.log)/) { mask=91; ok=(u=="root" && (g=="root" || g=="adm")) }
        else if (n ~ /^(cloud-init\.log|localmessages|waagent\.log)/) { mask=91; ok=((u=="root" || u=="syslog") && (g=="root" || g=="adm")) }
        else if (u != "root" && u != "syslog") { mask=95; ok=1 }
        else { mask=95; ok=(g=="root" || g=="adm") }
        if (and(m, mask) != 0 || !ok) print "FAIL: " f " " u " " g " " $4 }'
      echo check_complete
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^check_complete$" }
      - { none: "~ ^FAIL:" }
