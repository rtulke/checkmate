  - id: "CIS-AMAZON2027-1.5.7-kernel.yama.ptrace_scope"
    name: "Kernel parameter kernel.yama.ptrace_scope matches ^(1|2|3)$"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.5.7. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sysctl -n kernel.yama.ptrace_scope
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "~ ^(1|2|3)$"
    rationale: &rat-87e99a2286 |
      ptrace lets one process inspect and modify the memory of another. With unrestricted ptrace, any process running as a user can attach to that user's other processes, for example to steal SSH agent keys, session tokens or passwords from a browser after compromising a single program. Yama mode 1 limits ptrace to direct descendants (plus explicit exceptions), which blocks this lateral access while keeping debuggers usable.
    remediation: &rem-f63b93a9ff |
      Set the kernel parameter kernel.yama.ptrace_scope to one of 1, 2, 3 (the example uses 1), now and at boot:

      sysctl -w 'kernel.yama.ptrace_scope=1'
      printf '%s\n' 'kernel.yama.ptrace_scope = 1' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of kernel.yama.ptrace_scope from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-AMAZON2027-1.5.7-kernel_yama_ptrace_scope_persistent"
    name: "kernel yama ptrace scope persistent: /usr/lib/systemd/systemd-sysctl --cat-config | grep -Eo '^[[:space:]]*kernel[.]yama[.]ptr…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.5.7. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      /usr/lib/systemd/systemd-sysctl --cat-config | grep -Eo '^[[:space:]]*kernel[.]yama[.]ptrace_scope[[:space:]]*=[[:space:]]*[^[:space:]]+' | tail -n 1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*kernel\\.yama\\.ptrace_scope\\s*=\\s*(1|2|3)$" }
    rationale: &rat-f8e358a261 |
      ptrace lets one process inspect and modify the memory of another. Without restriction, any process of a user can attach to all other processes of that user, so a single compromised program can steal credentials or session keys from, for example, an SSH agent or browser. A Yama ptrace_scope of 1 or higher limits attaching to descendants or privileged processes; 3 disables ptrace completely until reboot. This check reads the configuration that systemd-sysctl applies at boot, so the value persists across reboots instead of only being set at runtime.
    remediation: &rem-7930d6958b |
      Set kernel.yama.ptrace_scope to 1 in a file under /etc/sysctl.d/ and apply it to the running kernel:

      printf '%s\n' 'kernel.yama.ptrace_scope = 1' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w kernel.yama.ptrace_scope=1
      /usr/lib/systemd/systemd-sysctl --cat-config | grep -E '^\s*-?kernel[./]yama[./]ptrace_scope\s*='

      The last assignment in that output wins: remove or change conflicting entries in /etc/sysctl.conf and in files sorted after 60-hardening.conf. Values 2 and 3 also pass; 3 cannot be lowered again without a reboot.
  - id: "CIS-AMAZON2027-1.5.8-hard_core_limit"
    name: "hard core limit: grep -Pshi -- '^\\h*[^#\\n\\r]+\\h+hard\\h+core\\b' /etc/security/limits.conf /etc/security/lim…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.5.8. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Pshi -- '^\h*[^#\n\r]+\h+hard\h+core\b' /etc/security/limits.conf /etc/security/limits.d/*
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*\\*\\s+hard\\s+core\\s+0\\s*$" }
      - { none: "~ hard\\s+core\\s+([1-9]|unlimited|infinity)" }
    rationale: &rat-efbe113ca8 |
      Core dumps write the memory of a crashing process to disk, where it may contain passwords, keys or other sensitive data and can fill the file system. A hard core size limit of 0 for all users prevents processes started through PAM sessions from producing core dumps, and users cannot raise it again.
    remediation: &rem-000ebfcece |
      Set a hard core limit of 0 for all users in a file under /etc/security/limits.d/ and remove entries that allow a non-zero hard core limit:

      printf '%s\n' '* hard core 0' > /etc/security/limits.d/60-coredump.conf
      grep -PHn '^\h*[^#\n]+\h+hard\h+core\h+([1-9]|unlimited|infinity)' /etc/security/limits.conf /etc/security/limits.d/*

      Edit or remove every line the grep command lists. The limit applies to new login sessions.
  - id: "CIS-AMAZON2027-1.5.9-coredump_processsizemax_effective"
    name: "coredump processsizemax effective: systemd-analyze cat-config systemd/coredump.conf | grep -E '^[[:space:]]*ProcessSizeMax[[…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.5.9. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      systemd-analyze cat-config systemd/coredump.conf | grep -E '^[[:space:]]*ProcessSizeMax[[:space:]]*=' | tail -n 1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*ProcessSizeMax\\s*=\\s*0\\s*$" }
    rationale: &rat-b771614d59 |
      systemd-coredump collects core dumps of crashing processes, which can contain passwords, keys and other sensitive memory content and consume large amounts of disk space. Setting ProcessSizeMax to 0 makes systemd-coredump ignore crashes instead of processing their memory, so no dump is collected.
    remediation: &rem-552c261ff7 |
      Set ProcessSizeMax=0 for systemd-coredump in a drop-in file:

      mkdir -p /etc/systemd/coredump.conf.d
      printf '%s\n' '[Coredump]' 'ProcessSizeMax=0' > /etc/systemd/coredump.conf.d/60-processsizemax.conf
      systemd-analyze cat-config systemd/coredump.conf | grep ProcessSizeMax

      The last value shown wins: remove conflicting settings in drop-ins sorted later. The setting applies to the next crash; no restart is needed.
  - id: "CIS-AMAZON2027-1.5.10-coredump_storage_effective"
    name: "coredump storage effective: systemd-analyze cat-config systemd/coredump.conf | grep -E '^[[:space:]]*Storage[[:space:…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.5.10. NIST SP 800-53 Rev. 5: CM-6."
