  - id: "CIS-AMAZON2027-2.1.17-cis_2_1_17_mta_listening_ports"
    name: "cis 2 1 17 mta listening ports: ss -plntu | grep -P -- ':(25|465|587)\\b' | grep -Pv -- '\\h+(127\\.0\\.0\\.1|\\[?::1\\]?):(25|4…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.1.17. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      ss -plntu | grep -P -- ':(25|465|587)\b' | grep -Pv -- '\h+(127\.0\.0\.1|\[?::1\]?):(25|465|587)\b'
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-0704f90b8c |
      A mail transfer agent that listens on external interfaces for SMTP (25), SMTPS (465) or submission (587) can be abused as an open relay or attacked remotely, and it is rarely needed on systems that only send local mail. Restricting the MTA to the loopback interface keeps local delivery and outgoing mail working while removing the network exposure.
    remediation: &rem-d36195eed1 |
      Configure the mail transfer agent to listen on the loopback interface only, or remove it if it is not needed. For Postfix:

      postconf -e 'inet_interfaces = loopback-only'
      systemctl restart postfix
      ss -plntu | grep -P ':(25|465|587)\b'

      For other MTAs (sendmail, exim) bind them to 127.0.0.1 and ::1 in their configuration. Systems that are deliberately mail servers need an exception.
  - id: "CIS-AMAZON2027-2.1.17-cis_2_1_17_postfix_inet_interfaces"
    name: "cis 2 1 17 postfix inet interfaces: if command -v postconf \u003e/dev/null 2\u003e\u00261; then"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.1.17. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      if command -v postconf >/dev/null 2>&1; then
        postconf -h inet_interfaces | grep -Piv -- '^\h*(loopback-only|localhost|127\.0\.0\.1|\[?::1\]?)(\h*[,\h]\h*(localhost|127\.0\.0\.1|\[?::1\]?))*\h*$'
      fi
      true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { none: "~ ." }
    rationale: &rat-87cc5ed66d |
      Postfix's inet_interfaces setting decides on which addresses it accepts SMTP connections. Listening on all interfaces exposes the MTA to remote attacks and relay abuse on systems that only need to send mail. Setting it to loopback-only keeps local mail delivery and outgoing mail working.
    remediation: &rem-c2621c31d4 |
      Restrict Postfix to the loopback interface:

      postconf -e 'inet_interfaces = loopback-only'
      systemctl restart postfix

      A restart is required, a reload does not change the listening addresses. Systems that are deliberately mail servers need an exception.
