  - id: "CIS-AMAZON2027-5.1.8-sshd_access_limited"
    name: "sshd access limited: sshd -T 2\u003e/dev/null | grep -Pi -- '^\\h*(allow|deny)(users|groups)\\h+\\H+'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.8. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
