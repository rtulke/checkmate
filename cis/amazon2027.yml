  - id: "CIS-AMAZON2027-6.2.3.10-auditd_6_2_3_10_priv_cmds"
    name: "auditd 6 2 3 10 priv cmds: UID_MIN=$(awk '/^\\s*UID_MIN/ {print $2}' /etc/login.defs)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.10. NIST SP 800-53 Rev. 5: AU-3. CIS Controls v8: 8.5."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      UID_MIN=$(awk '/^\s*UID_MIN/ {print $2}' /etc/login.defs)
      RUNNING=$(auditctl -l)
      for P in $(findmnt -n -l -k -it "$(awk '/nodev/ { print $2 }' /proc/filesystems | paste -sd,)" | grep -Pv "noexec|nosuid" | awk '{print $1}'); do
        find "$P" -xdev \( -path "*/containers/storage/*" -o -path "*/containerd/*" -o -path "*/kubelet/*" -o -path "/snap/*" \) -prune -o -perm /6000 -type f -print 2>/dev/null
      done | sort -u | while read -r F; do
        grep -hs -- "path=$F " /etc/audit/rules.d/*.rules | grep -P -- '-a\s+(always,exit|exit,always)' | grep -P -- '-F\s+perm=x' | grep -P -- "-F\s+auid>=$UID_MIN" | grep -P -- '-F\s+auid!=(unset|-1|4294967295)' >/dev/null || echo "MISSING or incomplete on-disk rule: $F"
        printf '%s\n' "$RUNNING" | grep -- "path=$F " | grep -P -- '-a\s+(always,exit|exit,always)' | grep -P -- '-F\s+perm=x' | grep -P -- "-F\s+auid>=$UID_MIN" | grep -P -- '-F\s+auid!=(unset|-1|4294967295)' >/dev/null || echo "MISSING or incomplete loaded rule: $F"
      done
      echo check_complete
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^check_complete$" }
      - { none: "~ MISSING" }
    rationale: &rat-258a8f1f8b |
      Setuid and setgid programs run with the privileges of their owner or group, typically root. Auditing every execution of these programs by regular users records the use of privileged commands and helps detect abuse or exploitation of vulnerable binaries. The rules must cover all such programs on local file systems that allow setuid execution, both on disk and in the loaded rule set.
    remediation: &rem-0d9d521f57 |
      Generate an audit rule for each setuid/setgid program found on local file systems without noexec or nosuid, review the list, and load it.

      UID_MIN=$(awk '/^\s*UID_MIN/ {print $2}' /etc/login.defs)
      for P in $(findmnt -n -l -k -it "$(awk '/nodev/ { print $2 }' /proc/filesystems | paste -sd,)" | grep -Pv 'noexec|nosuid' | awk '{print $1}'); do find "$P" -xdev \( -path '*/containers/storage/*' -o -path '*/containerd/*' -o -path '*/kubelet/*' -o -path '/snap/*' \) -prune -o -perm /6000 -type f -print 2>/dev/null; done | sort -u | awk -v m="$UID_MIN" '{print "-a always,exit -F path=" $1 " -F perm=x -F auid>=" m " -F auid!=unset -k privileged"}' > /etc/audit/rules.d/50-privileged.rules
      augenrules --load

      Re-run after installing software that adds setuid/setgid programs. If the configuration is immutable (-e 2), the rules are only loaded after a reboot.
