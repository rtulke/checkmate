  - id: "CIS-AMAZON2027-1.1.1.4-sys_module_usb_storage-absent"
    name: "/sys/module/usb_storage does not exist"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.1.1.4. NIST SP 800-53 Rev. 5: CM-7(9), IA-3. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      test -e '/sys/module/usb_storage' || test -L '/sys/module/usb_storage'
    expect: false
    rationale: &rat-baf9f583eb |
      usb_storage is the driver that makes USB mass storage devices such as flash drives and external disks available. Every file system or storage driver the kernel can load is code that parses untrusted data, and flaws in rarely used drivers have repeatedly led to privilege escalation; for USB storage the main risks are data exfiltration and malware introduced through removable media. This check verifies that the module is not currently loaded. Systems that legitimately use USB drives need the module.
    remediation: &rem-97bf67dd99 |
      Unload the kernel module usb_storage and keep it from being loaded again:

      printf '%s\n' 'blacklist usb_storage' 'install usb_storage /bin/false' > /etc/modprobe.d/usb_storage.conf
      modprobe -r usb_storage

      If the module is built into the kernel or in use, it cannot be unloaded; a reboot applies the blacklist.
