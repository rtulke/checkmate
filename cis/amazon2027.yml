  - id: "CIS-AMAZON2027-6.2.3.23-auditd_6_2_3_23_faillock_cnf"
    name: "auditd 6 2 3 23 faillock cnf: grep -Phs -- 'faillock' /etc/audit/rules.d/*.rules"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.23. NIST SP 800-53 Rev. 5: AU-12. CIS Controls v8: 8.5."
