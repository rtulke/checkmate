      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\\S+,)?fsetxattr(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\\s*$" }
      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\\S+,)?removexattr(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\\s*$" }
      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\\S+,)?lremovexattr(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\\s*$" }
