  - id: "CIS-AMAZON2027-5.1.3-ssh_host_private_key_access"
    name: "ssh host private key access: l_ssh_group=\"\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.3. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      l_ssh_group=""
      grep -Psiq -- '^\h*ID_LIKE="?([^#\n\r]+)?\bfedora\b' /etc/os-release 2>/dev/null && grep -Psq -- '^ssh_keys\b' /etc/group 2>/dev/null && l_ssh_group="ssh_keys"
      sshd -T 2>/dev/null | awk 'tolower($1)=="hostkey"{print $2}' | while IFS= read -r l_file; do
        ssh-keygen -lf "$l_file" >/dev/null 2>&1 || continue
        echo "checked: $l_file"
        stat -Lc '%#a:%U:%G' "$l_file" | while IFS=: read -r l_mode l_owner l_group; do
          if [ "$l_group" = "$l_ssh_group" ]; then l_mask="0137"; else l_mask="0177"; fi
          if [ $(( l_mode & l_mask )) -gt 0 ] || [ "$l_owner" != "root" ] || { [ "$l_group" != "$l_ssh_group" ] && [ "$l_group" != "root" ]; }; then
            echo "FAIL: $l_file mode $l_mode owner $l_owner group $l_group"
          fi
        done
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^checked: " }
      - { none: "~ ^FAIL:" }
  - id: "CIS-AMAZON2027-5.1.4-ssh_host_public_key_access"
    name: "ssh host public key access: sshd -T 2\u003e/dev/null | awk 'tolower($1)==\"hostkey\"{print $2}' | while IFS= read -r l_key; …"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | awk 'tolower($1)=="hostkey"{print $2}' | while IFS= read -r l_key; do
        l_file="${l_key}.pub"
        ssh-keygen -lf "$l_file" >/dev/null 2>&1 || continue
        echo "checked: $l_file"
        stat -Lc '%#a:%U:%G' "$l_file" | while IFS=: read -r l_mode l_owner l_group; do
          if [ $(( l_mode & 0133 )) -gt 0 ] || [ "$l_owner" != "root" ] || [ "$l_group" != "root" ]; then
            echo "FAIL: $l_file mode $l_mode owner $l_owner group $l_group"
          fi
        done
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^checked: " }
      - { none: "~ ^FAIL:" }
  - id: "CIS-AMAZON2027-5.1.5-no_weak_ssh_ciphers"
