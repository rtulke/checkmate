      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\\S+,)?fremovexattr(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\\s*$" }
      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\\S+,)?setxattr(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\\s*$" }
