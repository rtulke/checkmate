      dnf remove xorg-x11-server-common
  - id: "CIS-AMAZON2027-2.1.20-cis_2_1_20_xwayland_pkg"
    name: "Package xorg-x11-server-Xwayland is not installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.1.20. NIST SP 800-53 Rev. 5: CM-11, CM-7."
