    severity: medium
    run: |
      rpm -q --quiet lftp
    expect: false
    rationale: &rat-4109314cdc |
      lftp is a file transfer client that is mostly used for plain FTP, where credentials and data are sent unencrypted. Removing unneeded transfer clients discourages insecure protocols and leaves fewer tools for exfiltrating data. SFTP or scp provide encrypted alternatives.
    remediation: &rem-4075a25358 |
      Remove the package lftp, unless the system needs it:

      dnf remove lftp
  - id: "CIS-AMAZON2027-2.2.2-cis_2_2_2_openldap_clients_pkg"
    name: "Package openldap-clients is not installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.2.2. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      rpm -q --quiet openldap-clients
    expect: false
    rationale: &rat-2d94b79357 |
      The OpenLDAP client tools allow querying and modifying LDAP directories. They are seldom needed on servers and give an attacker who gains access convenient tools for enumerating directory data. Remove them unless administrators or applications on this host need them.
    remediation: &rem-c3c0dd7932 |
      Remove the package openldap-clients, unless the system needs it:

      dnf remove openldap-clients
  - id: "CIS-AMAZON2027-2.2.3-cis_2_2_3_telnet_pkg"
    name: "Package telnet is not installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.2.3. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet telnet
    expect: false
    rationale: &rat-d66c607adb |
      The telnet client connects over an unencrypted protocol, exposing credentials and session content on the network. Its presence encourages insecure remote access and offers attackers a simple tool for probing services. SSH provides a secure alternative.
    remediation: &rem-3edcbf8297 |
      Remove the package telnet, unless the system needs it:

      dnf remove telnet
  - id: "CIS-AMAZON2027-2.2.4-cis_2_2_4_tftp_pkg"
    name: "Package tftp is not installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 2.2.4. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-2, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet tftp
    expect: false
    rationale: &rat-206f22639d |
      The TFTP client transfers files without authentication or encryption. It is rarely needed outside of network boot and device management, and it gives attackers an easy way to move files in and out of the system.
    remediation: &rem-8607d8b3cb |
