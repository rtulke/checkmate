  - id: "CIS-AMAZON2027-4.1.1-firewalld"
    name: "Package firewalld is installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 4.1.1. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2027, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      rpm -q --quiet firewalld
    expect: true
    rationale: &rat-9a34f07397 |
      A host-based firewall limits which network services are reachable even if a service is accidentally exposed or a perimeter firewall is misconfigured. firewalld must be installed, enabled at boot and running for its zone rules to be enforced, and on newer releases it should use the nftables backend rather than the deprecated iptables backend.
    remediation: &rem-d7f44118ed |
      Install the package firewalld:

      dnf install firewalld
  - id: "CIS-AMAZON2027-4.1.2-etc_firewalld_firewalld.conf-attrs"
    name: "/etc/firewalld/firewalld.conf: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 4.1.2. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2027, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/firewalld/firewalld.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-d6ebb58ebe |
      firewalld can drive either the nftables or the legacy iptables backend. The iptables backend is deprecated, and mixing it with nftables-based tooling produces rule sets that interfere with each other and make the effective filtering hard to verify. Ensuring firewalld does not use the iptables backend keeps a single, consistent nftables rule base.
    remediation: &rem-86233836e4 |
      Create /etc/firewalld/firewalld.conf.
