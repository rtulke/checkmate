      augenrules --load

      If the loaded audit configuration is immutable (-e 2), the new rules only take effect after a reboot.
  - id: "CIS-AMAZON2027-6.2.3.32-auditd_6_2_3_32_live"
    name: "auditd 6 2 3 32 live: auditctl -l | grep -P -- 'init_module'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.32. NIST SP 800-53 Rev. 5: AU-3, CM-6. CIS Controls v8: 8.5."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      auditctl -l | grep -P -- 'init_module'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\\S+,)?init_module(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)kernel_modules\\s*$" }
      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\\S+,)?finit_module(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)kernel_modules\\s*$" }
      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\\S+,)?init_module(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)kernel_modules\\s*$" }
      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\\S+,)?finit_module(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)kernel_modules\\s*$" }
    rationale: &rat-1fcfee9c4e |
      Loading a kernel module runs arbitrary code with full kernel privileges. Auditing the init_module and finit_module system calls captures every module load by users, including loads done without the kmod tools, which helps detect rootkits. This check looks at the rules currently loaded in the kernel (auditctl -l), so the rules must also have been loaded.
    remediation: *rem-d2669373c3
  - id: "CIS-AMAZON2027-6.2.3.33-auditd_6_2_3_33_cnf"
    name: "auditd 6 2 3 33 cnf: grep -Phs -- 'delete_module' /etc/audit/rules.d/*.rules"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.33. NIST SP 800-53 Rev. 5: AU-3, CM-6. CIS Controls v8: 8.5."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep -Phs -- 'delete_module' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\\S+,)?delete_module(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)kernel_modules\\s*$" }
      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\\S+,)?delete_module(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)kernel_modules\\s*$" }
    rationale: &rat-86ebde3e0d |
      Unloading kernel modules can disable security functions such as firewalls, auditing helpers or other protective drivers. Auditing the delete_module system call records every module removal by users. This check looks at the persistent rules in /etc/audit/rules.d/, which are loaded at boot.
    remediation: &rem-4a3f63940d |
      Add rules that record the delete_module system call (64-bit and 32-bit) for users with key kernel_modules. Put them in a file in /etc/audit/rules.d/ and load them.

      cat >> /etc/audit/rules.d/50-kernel_modules.rules <<'EOF'
      -a always,exit -F arch=b64 -S delete_module -F auid>=1000 -F auid!=unset -k kernel_modules
      -a always,exit -F arch=b32 -S delete_module -F auid>=1000 -F auid!=unset -k kernel_modules
      EOF
      augenrules --load

      If the loaded audit configuration is immutable (-e 2), the new rules only take effect after a reboot.
  - id: "CIS-AMAZON2027-6.2.3.33-auditd_6_2_3_33_live"
    name: "auditd 6 2 3 33 live: auditctl -l | grep -P -- 'delete_module'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.33. NIST SP 800-53 Rev. 5: AU-3, CM-6. CIS Controls v8: 8.5."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      auditctl -l | grep -P -- 'delete_module'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\\S+,)?delete_module(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)kernel_modules\\s*$" }
      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\\S+,)?delete_module(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)kernel_modules\\s*$" }
    rationale: &rat-f42f98d1c5 |
      Unloading kernel modules can disable security functions such as firewalls, auditing helpers or other protective drivers. Auditing the delete_module system call records every module removal by users. This check looks at the rules currently loaded in the kernel (auditctl -l), so the rules must also have been loaded.
    remediation: *rem-4a3f63940d
  - id: "CIS-AMAZON2027-6.2.3.34-auditd_6_2_3_34_cnf"
    name: "auditd 6 2 3 34 cnf: grep -Phs -- '^\\h*-[aA]\\h*(task,never|never,task)\\b' /etc/audit/rules.d/*.rules"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.34. NIST SP 800-53 Rev. 5: AU-2, AU-12. CIS Controls v8: 8.5."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep -Phs -- '^\h*-[aA]\h*(task,never|never,task)\b' /etc/audit/rules.d/*.rules
      echo check_complete
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^check_complete$" }
      - { none: "~ (task,never|never,task)" }
    rationale: &rat-67a0d7ba12 |
      A rule with the task,never action stops the kernel from creating audit contexts for new tasks, which effectively disables system call auditing for everything started afterwards. Some distributions ship such a rule by default for performance reasons. Leaving it in place makes the system call rules useless while they appear to be configured. This check looks at the persistent rules in /etc/audit/rules.d/, which are loaded at boot.
    remediation: &rem-783f5d45cf |
      Remove every rule with the action task,never (or never,task) from the files in /etc/audit/rules.d/ and reload the rules.

      grep -Pl -- '^\h*-[aA]\h*(task,never|never,task)\b' /etc/audit/rules.d/*.rules
      sed -ri '/^\s*-[aA]\s*(task,never|never,task)\b/d' FILE
      augenrules --load

      If the loaded audit configuration is immutable (-e 2), the new rules only take effect after a reboot.
  - id: "CIS-AMAZON2027-6.2.3.34-auditd_6_2_3_34_live"
    name: "auditd 6 2 3 34 live: auditctl -l | grep -P -- '^-a\\h+never,task\\b'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.34. NIST SP 800-53 Rev. 5: AU-2, AU-12. CIS Controls v8: 8.5."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      auditctl -l | grep -P -- '^-a\h+never,task\b'
      echo check_complete
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^check_complete$" }
      - { none: "~ never,task" }
    rationale: &rat-4038c58913 |
      A rule with the task,never action stops the kernel from creating audit contexts for new tasks, which effectively disables system call auditing for everything started afterwards. Some distributions ship such a rule by default for performance reasons. Leaving it in place makes the system call rules useless while they appear to be configured. This check looks at the rules currently loaded in the kernel (auditctl -l), so the rules must also have been loaded.
    remediation: *rem-783f5d45cf
  - id: "CIS-AMAZON2027-6.2.3.35-auditd_6_2_3_35_continue_on_error"
    name: "auditd 6 2 3 35 continue on error: grep -Ph -- '^\\h*-c\\b' /etc/audit/rules.d/*.rules | tail -1"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.35. NIST SP 800-53 Rev. 5: AU-12. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep -Ph -- '^\h*-c\b' /etc/audit/rules.d/*.rules | tail -1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*-c\\s*$" }
    rationale: &rat-993de1a67e |
      With the -c option the audit rule loader continues past a rule that fails to load instead of stopping at the first error. This keeps a single invalid or unsupported rule from leaving all later rules, including the final immutability setting, unloaded. Load errors should still be reviewed in the output of augenrules.
    remediation: &rem-50d185daa4 |
      Add the -c option to the audit rules, in a file that is read before the other rules, and reload them.

      printf '%s\n' '-c' > /etc/audit/rules.d/00-continue.rules
      augenrules --load

      If the loaded audit configuration is immutable (-e 2), the new rules only take effect after a reboot.
  - id: "CIS-AMAZON2027-6.2.3.36-auditd_6_2_3_36_immutable"
    name: "auditd 6 2 3 36 immutable: grep -Ph -- '^\\h*-e\\h+2\\b' /etc/audit/rules.d/*.rules | tail -1"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.36. NIST SP 800-53 Rev. 5: AU-9. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep -Ph -- '^\h*-e\h+2\b' /etc/audit/rules.d/*.rules | tail -1
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*-e\\s+2\\b" }
    rationale: &rat-2ed24b7e5e |
      Setting the audit configuration to immutable prevents anyone, including root, from changing or removing audit rules or disabling auditing until the next reboot. An intruder with root access then cannot quietly switch auditing off; any change requires a reboot, which is itself noticeable.
    remediation: &rem-470f9478c1 |
      Add -e 2 as the last audit rule, in a file that sorts after all other rule files, and load the rules.

      printf '%s\n' '-e 2' > /etc/audit/rules.d/99-finalize.rules
      augenrules --load

      Once the configuration is immutable, rule changes require a reboot; reboot now if an older immutable configuration is still loaded.
  - id: "CIS-AMAZON2027-6.2.3.37-auditd_conf_vs_live"
    name: "auditd conf vs live: /usr/sbin/augenrules --check"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.3.37. NIST SP 800-53 Rev. 5: AU-3. CIS Controls v8: 8.5."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      /usr/sbin/augenrules --check
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\/usr\\/sbin\\/augenrules: No change" }
    rationale: &rat-28c9d94c0a |
      augenrules builds /etc/audit/audit.rules from the files in /etc/audit/rules.d. If the two differ, the rules loaded at the next boot are not those that administrators maintain, and recent changes may never take effect. The check confirms that the compiled rule file is up to date.
    remediation: &rem-c7c4a84bd5 |
      Regenerate /etc/audit/audit.rules from the files in /etc/audit/rules.d and load it.

      augenrules --check
      augenrules --load

      If the running configuration is immutable (-e 2), the compiled file is still updated, but the kernel uses the new rules only after a reboot.
  - id: "CIS-AMAZON2027-6.2.4.1-audit_logfile_dir_mode"
    name: "audit logfile dir mode: stat -Lc '%a' \"$(dirname \"$(awk -F= '/^\\s*log_file\\s*/{print $2}' /etc/audit/auditd.conf …"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.4.1. NIST SP 800-53 Rev. 5: AU-9. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      stat -Lc '%a' "$(dirname "$(awk -F= '/^\s*log_file\s*/{print $2}' /etc/audit/auditd.conf | xargs)")"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^[0-7]?[0-7][0145]0$" }
    rationale: &rat-843a00fcdb |
      The audit log directory holds the record of security events. If group members could write to it or other users could access it, they could read sensitive event data or delete and replace log files to cover their tracks. Mode 0750 or stricter limits this to root and, for reading, the configured log group.
    remediation: &rem-427b9f2b1c |
      Remove write permission for the group and all permissions for others from the directory that contains the audit log file (log_file in /etc/audit/auditd.conf, by default /var/log/audit).

      d="$(dirname "$(awk -F= '/^\s*log_file\s*/{print $2}' /etc/audit/auditd.conf | xargs)")"
      chmod g-w,o-rwx "$d"
  - id: "CIS-AMAZON2027-6.2.4.2-audit_logfile_mode"
    name: "audit logfile mode: find \"$(dirname \"$(awk -F= '/^\\s*log_file\\s*/{print $2}' /etc/audit/auditd.conf | xargs)\"…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.4.2. NIST SP 800-53 Rev. 5: AU-9. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      find "$(dirname "$(awk -F= '/^\s*log_file\s*/{print $2}' /etc/audit/auditd.conf | xargs)")" -maxdepth 1 -type f -perm /0137 | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0$" }
    rationale: &rat-d6a18988ac |
      Audit log files contain detailed records of user and system activity. Write access for the group, execute bits or any access for other users would let unauthorized users read sensitive events or tamper with the evidence. Mode 0640 or stricter keeps the logs readable only by root and the log group.
    remediation: &rem-c89ad55630 |
      Set the audit log files in the log directory to mode 0640 or stricter.

      d="$(dirname "$(awk -F= '/^\s*log_file\s*/{print $2}' /etc/audit/auditd.conf | xargs)")"
      find "$d" -maxdepth 1 -type f -perm /0137 -exec chmod u-x,g-wx,o-rwx {} +
  - id: "CIS-AMAZON2027-6.2.4.3-audit_logfile_owner"
    name: "audit logfile owner: find \"$(dirname \"$(awk -F= '/^\\s*log_file\\s*/{print $2}' /etc/audit/auditd.conf | xargs)\"…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.4.3. NIST SP 800-53 Rev. 5: AU-9. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      find "$(dirname "$(awk -F= '/^\s*log_file\s*/{print $2}' /etc/audit/auditd.conf | xargs)")" -maxdepth 1 -type f ! -user root | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0$" }
    rationale: &rat-2960c33012 |
      Audit logs must only be modifiable by root. If they are owned by another user, that user could alter or delete records and thereby hide activity.
    remediation: &rem-d7ec9e6f98 |
      Make root the owner of all audit log files. The command uses the default directory /var/log/audit; use the directory of log_file in /etc/audit/auditd.conf if it differs.

      find /var/log/audit -type f ! -user root -exec chown root {} +

      On Debian 12 this check tests the group of the current log file instead (root or adm); correct it with chgrp root /var/log/audit/audit.log.
  - id: "CIS-AMAZON2027-6.2.4.4-audit_logfile_group"
    name: "audit logfile group: find \"$(dirname \"$(awk -F= '/^\\s*log_file\\s*/{print $2}' /etc/audit/auditd.conf | xargs)\"…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.4.4. NIST SP 800-53 Rev. 5: AU-9. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      find "$(dirname "$(awk -F= '/^\s*log_file\s*/{print $2}' /etc/audit/auditd.conf | xargs)")" -maxdepth 1 -type f \( ! -group root -a ! -group adm \) | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0$" }
    rationale: &rat-27178e295b |
      The group of the audit log files determines who besides root may read them. Restricting it to root or a dedicated log group such as adm keeps audit data away from ordinary users.
    remediation: &rem-2be7ad5f04 |
      Assign the audit log files to the root group (adm is also accepted) and make sure log_group in /etc/audit/auditd.conf names the same group, so that auditd keeps using it. The command uses the default directory /var/log/audit.

      find /var/log/audit -type f ! -group root ! -group adm -exec chgrp root {} +
      grep -E '^\s*log_group' /etc/audit/auditd.conf
  - id: "CIS-AMAZON2027-6.2.4.4-audit_logfile_group_setting"
    name: "audit logfile group setting: grep -Po '^\\s*log_group\\s*=\\s*\\K\\S+' /etc/audit/auditd.conf"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.4.4. NIST SP 800-53 Rev. 5: AU-9. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep -Po '^\s*log_group\s*=\s*\K\S+' /etc/audit/auditd.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(root|adm)$" }
    rationale: &rat-004712d53c |
      log_group in auditd.conf sets the group of the audit log files that auditd creates. Setting it to root or a dedicated log group ensures that new and rotated log files are not readable by ordinary users.
    remediation: &rem-651e7832f2 |
      Set log_group in /etc/audit/auditd.conf to root (adm is also accepted), apply it to the existing log files and make auditd re-read its configuration.

      sed -i -E 's/^\s*#?\s*log_group\s*=.*/log_group = root/' /etc/audit/auditd.conf
      grep -q '^log_group' /etc/audit/auditd.conf || echo 'log_group = root' >> /etc/audit/auditd.conf
      find /var/log/audit -type f ! -group root -exec chgrp root {} +
      pkill -HUP -x auditd
  - id: "CIS-AMAZON2027-6.2.4.5-audit_conf_mode"
    name: "audit conf mode: find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\) -perm /0137 | wc -l"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.4.5. NIST SP 800-53 Rev. 5: AU-9. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) -perm /0137 | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0$" }
    rationale: &rat-277272ee51 |
      The audit configuration and rule files decide what is recorded and how the daemon behaves. If other users could read them they would learn what is monitored, and write access would let them weaken auditing. Mode 0640 or stricter restricts them to root.
    remediation: &rem-a20120cd3b |
      Set all .conf and .rules files below /etc/audit/ to mode 0640 or stricter.

      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) -perm /0137 -exec chmod u-x,g-wx,o-rwx {} +
  - id: "CIS-AMAZON2027-6.2.4.6-audit_conf_owner"
    name: "audit conf owner: find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\) ! -user root | wc -l"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.4.6. NIST SP 800-53 Rev. 5: AU-9. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) ! -user root | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0$" }
    rationale: &rat-93d20735ce |
      The audit configuration and rule files determine what is recorded. If they are owned by a user other than root, that user can change or disable auditing.
    remediation: &rem-63ddfcf4ba |
      Make root the owner of all audit configuration and rule files.

      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) ! -user root -exec chown root {} +
  - id: "CIS-AMAZON2027-6.2.4.7-audit_conf_group"
    name: "audit conf group: find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\) ! -group root | wc -l"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.4.7. NIST SP 800-53 Rev. 5: AU-9. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) ! -group root | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0$" }
    rationale: &rat-6c39b636dc |
      The audit configuration and rule files determine what is recorded. Assigning them to the root group prevents members of other groups from gaining access to them through group permissions.
    remediation: &rem-f8aa9c4a66 |
      Assign all audit configuration and rule files to the root group.

      find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) ! -group root -exec chgrp root {} +
  - id: "CIS-AMAZON2027-6.2.4.8-audit_tools_mode"
    name: "audit tools mode: find -L /usr/bin/auditctl /usr/bin/aureport /usr/bin/ausearch /usr/bin/auditd /usr/bin/au…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.4.8. NIST SP 800-53 Rev. 5: AU-9. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      find -L /usr/bin/auditctl /usr/bin/aureport /usr/bin/ausearch /usr/bin/auditd /usr/bin/augenrules -maxdepth 0 -perm /0022 2>/dev/null | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0$" }
    rationale: &rat-730de07abb |
      The audit tools load rules, query the logs and run the daemon. If group or other users could modify these programs, they could replace them with versions that hide events or ignore rules. Removing group and other write permission protects the integrity of the audit tool chain.
    remediation: &rem-c9a83a737a |
      Remove write permission for group and others from the audit tools.

      chmod go-w /usr/bin/auditctl /usr/bin/aureport /usr/bin/ausearch /usr/bin/auditd /usr/bin/augenrules

      Alternatively restore the packaged permissions with rpm --setperms audit.
  - id: "CIS-AMAZON2027-6.2.4.9-audit_tools_owner"
    name: "audit tools owner: stat -Lc '%n %U' /usr/bin/auditctl /usr/bin/aureport /usr/bin/ausearch /usr/bin/auditd /u…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.4.9. NIST SP 800-53 Rev. 5: AU-9. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      stat -Lc '%n %U' /usr/bin/auditctl /usr/bin/aureport /usr/bin/ausearch /usr/bin/auditd /usr/bin/augenrules | awk '$2 != "root" {print}' | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0$" }
    rationale: &rat-44ca7d2028 |
      The audit tools configure the kernel audit rules and read or process the audit trail. If they are owned by a user other than root, that user could replace them with manipulated versions.
    remediation: &rem-7da205fc51 |
      Make root the owner of the audit tools.

      chown root /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules

      On Amazon Linux 2027 the tools are located in /usr/bin and autrace is not checked; adjust the paths accordingly.
  - id: "CIS-AMAZON2027-6.2.4.10-audit_tools_group"
    name: "audit tools group: stat -Lc '%n %G' /usr/bin/auditctl /usr/bin/aureport /usr/bin/ausearch /usr/bin/auditd /u…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.2.4.10. NIST SP 800-53 Rev. 5: AU-9. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      stat -Lc '%n %G' /usr/bin/auditctl /usr/bin/aureport /usr/bin/ausearch /usr/bin/auditd /usr/bin/augenrules | awk '$2 != "root" {print}' | wc -l
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^0$" }
    rationale: &rat-86efb1bef3 |
      The audit tools configure the kernel audit rules and read or process the audit trail. Assigning them to the root group prevents members of other groups from gaining control over them through group permissions.
    remediation: &rem-28ff0445b4 |
      Assign the audit tools to the root group.

      chgrp root /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules

      On Amazon Linux 2027 the tools are located in /usr/bin and autrace is not checked; adjust the paths accordingly.
  - id: "CIS-AMAZON2027-6.3.1-aide_installed"
    name: "Package aide is installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.3.1. NIST SP 800-53 Rev. 5: SI-7. CIS Controls v8: 3.14."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet aide
    expect: true
    rationale: &rat-d0fb4e491d |
      AIDE records checksums and attributes of important files in a database and later reports files that were added, removed or changed. Having it installed is the basis for detecting unauthorized modifications such as backdoored binaries or altered configuration.
    remediation: &rem-ddff504fa6 |
      Install the package aide:

      dnf install aide
  - id: "CIS-AMAZON2027-6.3.2-aide_scheduled_check"
    name: "aide scheduled check: grep -rEi 'aide[[:space:]]+(--check|--update)' /var/spool/cron/ /etc/crontab /etc/cron.d …"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.3.2. NIST SP 800-53 Rev. 5: SI-7. CIS Controls v8: 3.14."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -rEi 'aide[[:space:]]+(--check|--update)' /var/spool/cron/ /etc/crontab /etc/cron.d /etc/cron.hourly /etc/cron.daily /etc/cron.weekly /etc/cron.monthly 2>/dev/null | grep -Ev ':[[:space:]]*#'
      for t in $(systemctl list-unit-files --type=timer --no-legend | awk '{print $1}'); do
        en="$(systemctl is-enabled "$t" 2>/dev/null)"; ac="$(systemctl is-active "$t" 2>/dev/null)"
        [ "$en" = "enabled" ] || [ "$ac" = "active" ] || continue
        s="$(systemctl show -p Unit --value "$t")"; [ -z "$s" ] && s="${t%.timer}.service"
        systemctl cat "$s" 2>/dev/null | grep -E 'ExecStart=.*aide[[:space:]]+(--check|--update)' >/dev/null && echo "$t -> $s"
      done
      echo check_complete
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^check_complete$" }
      - { some: "~ (aide[[:space:]]+--(check|update)|\\.timer -\u003e )" }
    rationale: &rat-45f6129765 |
      An integrity database is only useful if it is compared regularly. Running AIDE checks on a schedule, through cron or a systemd timer, makes sure changes to monitored files are noticed within a predictable time instead of only when someone remembers to run a check.
    remediation: &rem-96d215d05c |
      Schedule a regular AIDE check, for example with a systemd timer that runs it daily.

      cat > /etc/systemd/system/aidecheck.service <<EOF
      [Unit]
      Description=AIDE file integrity check

      [Service]
      Type=oneshot
      ExecStart=$(command -v aide) --check
      EOF
      cat > /etc/systemd/system/aidecheck.timer <<'EOF'
      [Unit]
      Description=Daily AIDE file integrity check

      [Timer]
      OnCalendar=*-*-* 05:00:00
      Unit=aidecheck.service

      [Install]
      WantedBy=timers.target
      EOF
      systemctl daemon-reload
      systemctl enable --now aidecheck.timer

      A cron entry such as '0 5 * * * root /usr/sbin/aide --check' in /etc/cron.d/aide also passes. The AIDE database must have been initialized (aide --init) for the check to be useful.
  - id: "CIS-AMAZON2027-6.3.3-audit_bins_crypto_aide"
    name: "audit bins crypto aide: grep -E '^\\s*/usr/bin/au' /etc/aide.conf"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.3.3. NIST SP 800-53 Rev. 5: SI-7. CIS Controls v8: 3.14."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -E '^\s*/usr/bin/au' /etc/aide.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*/usr/bin/auditctl p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^\\s*/usr/bin/auditd p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^\\s*/usr/bin/ausearch p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^\\s*/usr/bin/aureport p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
      - { some: "~ ^\\s*/usr/bin/augenrules p\\+i\\+n\\+u\\+g\\+s\\+b\\+acl\\+xattrs\\+sha512\\s*$" }
    rationale: &rat-362fec1225 |
      The audit tools (auditctl, auditd, ausearch, aureport, augenrules and related binaries) control and read the audit trail. An attacker who replaces them could hide activity or silently disable auditing. Including them in the AIDE database with permission, ownership, ACL, extended attribute and SHA-512 checks makes any modification of these binaries detectable.
    remediation: &rem-87c2bcf979 |
      Add AIDE rules for the audit tools to /etc/aide.conf, then rebuild the AIDE database so it includes them.

      cat >> /etc/aide.conf <<'EOF'
      /usr/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512
      EOF
      aide --init
      mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz

      On Amazon Linux 2027 the check expects /usr/bin/ paths (auditctl, auditd, ausearch, aureport, augenrules) with nothing after sha512 on the line; use those paths there.
  - id: "CIS-AMAZON2027-6.3.4-aide_report_url_syslog"
    name: "aide report url syslog: grep -P '^\\h*report_url' /etc/aide.conf"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.3.4. NIST SP 800-53 Rev. 5: SI-7, SI-7(2). CIS Controls v8: 3.14."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -P '^\h*report_url' /etc/aide.conf
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*report_url\\s*=\\s*syslog:\\S+" }
    rationale: &rat-ae3c5e5c5e |
      Sending AIDE reports to syslog puts integrity findings into the regular log stream, where they can be forwarded to a central server, retained and alerted on. Reports that only go to a local file or to standard output are easily missed and can be removed by an intruder.
    remediation: &rem-2bb356e920 |
      Add a report_url that sends AIDE reports to syslog in /etc/aide.conf. Existing report_url lines can stay.

      printf '%s\n' 'report_url=syslog:LOG_AUTH' >> /etc/aide.conf
  - id: "CIS-AMAZON2027-7.1.1-cis_7_1_1_passwd-attrs"
    name: "/etc/passwd: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/passwd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-5c26f01d03 |
      /etc/passwd defines all local accounts with their UIDs, home directories and login shells. If it were not owned by root and group root, other users could add accounts or give an account UID 0 and so obtain root privileges.
    remediation: &rem-08cad6e3c2 |
      Create /etc/passwd if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/passwd'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/passwd'
  - id: "CIS-AMAZON2027-7.1.2-cis_7_1_2_passwd_backup-attrs"
    name: "/etc/passwd-: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "test -e '/etc/passwd-'"
    run: |
      f='/etc/passwd-'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-897df0c1e8 |
      /etc/passwd- is the backup copy of the account database written by the account tools. It contains the same information as /etc/passwd and could be used to restore a manipulated version, so it needs the same root ownership.
    remediation: &rem-2fef363834 |
      Create /etc/passwd- if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/passwd-'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/passwd-'
  - id: "CIS-AMAZON2027-7.1.3-cis_7_1_3_group-attrs"
    name: "/etc/group: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.3. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/group'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-a0a1a6e009 |
      /etc/group defines group memberships, which control access to files and administrative rights such as sudo. Root ownership prevents other users from adding themselves to privileged groups.
    remediation: &rem-acc5fa1d09 |
      Create /etc/group if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/group'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/group'
  - id: "CIS-AMAZON2027-7.1.4-cis_7_1_4_group_backup-attrs"
    name: "/etc/group-: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "test -e '/etc/group-'"
    run: |
      f='/etc/group-'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-18e0690bb4 |
      /etc/group- is the backup copy of the group database. It holds the same membership information as /etc/group and needs the same root ownership so it cannot be used to plant altered group memberships.
    remediation: &rem-5da3704e0d |
      Create /etc/group- if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/group-'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/group-'
  - id: "CIS-AMAZON2027-7.1.5-cis_7_1_5_shadow-attrs"
    name: "/etc/shadow: exists, mode 0000 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.5. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/shadow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7777)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-025ccda989 |
      /etc/shadow contains the password hashes and password ageing data of all local accounts. Anyone able to read it can attempt to crack the hashes offline, and write access would allow setting arbitrary passwords. Owner root, group root and no permission bits mean only privileged processes can access it.
    remediation: &rem-c814bda5a9 |
      Create /etc/shadow if it is missing, then set owner root and group root and remove the permissions u-rwxs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/shadow'
      chmod u-rwxs,g-rwxs,o-rwx,a-t '/etc/shadow'
  - id: "CIS-AMAZON2027-7.1.6-cis_7_1_6_shadow_backup-attrs"
    name: "/etc/shadow-: exists, mode 0000 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.6. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "test -e '/etc/shadow-'"
    run: |
      f='/etc/shadow-'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7777)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-a5ff70bbbd |
      /etc/shadow- is the backup of the shadow file and contains password hashes as well. It needs the same protection as /etc/shadow, otherwise the hashes can be read and cracked from the backup.
    remediation: &rem-11c99aaf03 |
      Create /etc/shadow- if it is missing, then set owner root and group root and remove the permissions u-rwxs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/shadow-'
      chmod u-rwxs,g-rwxs,o-rwx,a-t '/etc/shadow-'
  - id: "CIS-AMAZON2027-7.1.7-cis_7_1_7_gshadow-attrs"
    name: "/etc/gshadow: exists, mode 0000 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.7. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/gshadow'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7777)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-99dbf8b5df |
      /etc/gshadow holds group passwords and the lists of group administrators. Read access exposes password hashes for offline cracking and write access allows changing group administration, so it must be owned by root with no permission bits.
    remediation: &rem-d96c95bb87 |
      Create /etc/gshadow if it is missing, then set owner root and group root and remove the permissions u-rwxs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/gshadow'
      chmod u-rwxs,g-rwxs,o-rwx,a-t '/etc/gshadow'
  - id: "CIS-AMAZON2027-7.1.8-cis_7_1_8_gshadow_backup-attrs"
    name: "/etc/gshadow-: exists, mode 0000 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.8. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "test -e '/etc/gshadow-'"
    run: |
      f='/etc/gshadow-'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7777)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-f019edbdd7 |
      /etc/gshadow- is the backup of the group shadow file and contains the same sensitive data. It needs the same root ownership and restrictive mode as /etc/gshadow.
    remediation: &rem-05c43a1cd1 |
      Create /etc/gshadow- if it is missing, then set owner root and group root and remove the permissions u-rwxs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/gshadow-'
      chmod u-rwxs,g-rwxs,o-rwx,a-t '/etc/gshadow-'
  - id: "CIS-AMAZON2027-7.1.9-cis_7_1_9_shells-attrs"
    name: "/etc/shells: exists, mode 0644 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.9. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/shells'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7133)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-b08a5ba4b4 |
      /etc/shells lists the valid login shells, which programs such as chsh and some daemons use to decide whether an account may log in. Root ownership prevents users from adding arbitrary programs as accepted shells.
    remediation: &rem-118b2e8d3a |
      Create /etc/shells if it is missing, then set owner root and group root and remove the permissions u-xs,g-wxs,o-wx,a-t:

      chown root:root '/etc/shells'
      chmod u-xs,g-wxs,o-wx,a-t '/etc/shells'
  - id: "CIS-AMAZON2027-7.1.10-cis_7_1_10_opasswd-attrs"
    name: "/etc/security/opasswd: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.10. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "test -e '/etc/security/opasswd'"
    run: |
      f='/etc/security/opasswd'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-6b882d764c |
      /etc/security/opasswd stores previous password hashes so that password reuse can be refused. The hashes are sensitive and the file must be controlled by root so the history cannot be read or cleared by others.
    remediation: &rem-ea56781c51 |
      Create /etc/security/opasswd if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/security/opasswd'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/security/opasswd'
  - id: "CIS-AMAZON2027-7.1.10-cis_7_1_10_opasswd_old-attrs"
    name: "/etc/security/opasswd.old: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.10. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    only_if: "test -e '/etc/security/opasswd.old'"
    run: |
      f='/etc/security/opasswd.old'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-ec75056cf2 |
      /etc/security/opasswd.old is a backup of the password history file and contains old password hashes. It needs the same root ownership as opasswd to keep the hashes away from other users.
    remediation: &rem-c04eb468d2 |
      Create /etc/security/opasswd.old if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/security/opasswd.old'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/security/opasswd.old'
  - id: "CIS-AMAZON2027-7.1.11-world_writable_secured"
    name: "world writable secured: findmnt -Dkerno fstype,target | awk '($1 !~ /^[[:space:]]*(nfs|proc|cifs|smb|vfat|iso9660…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.11. NIST SP 800-53 Rev. 5: SC-4. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      findmnt -Dkerno fstype,target | awk '($1 !~ /^[[:space:]]*(nfs|proc|cifs|smb|vfat|iso9660|efivarfs|selinuxfs|ncpfs)/ && $2 !~ /^(\/run|\/tmp|\/var\/tmp)(\/|$)/){print $2}' | while IFS= read -r l_mount; do
        find "$l_mount" -mount -xdev \( -path "*/containers/storage/*" -o -path "*/containerd/*" -o -path "*/kubelet/*" -o -path "*/docker/*" -o -path "/sys/*" -o -path "/snap/*" -o -path "/boot/efi/*" \) -prune -o \( \( -type f -perm -0002 \) -o \( -type d -perm -0002 ! -perm -1000 \) \) -printf 'FAIL: %y %p\n' 2>/dev/null
      done
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-c403fdbb4d |
      World-writable files can be changed by any user, allowing tampering with scripts, data or configuration that other users or services trust. World-writable directories without the sticky bit let any user delete or replace files of other users. Removing world write access or setting the sticky bit closes these paths to privilege escalation and data manipulation.
    remediation: &rem-8fa5579c10 |
      Review every path reported with FAIL. Remove world write permission from files, and set the sticky bit on directories that must remain writable for everyone (or remove world write permission from them).

      chmod o-w FILE
      chmod +t DIRECTORY

      Check with the owner of the data before changing permissions that an application may depend on.
  - id: "CIS-AMAZON2027-7.1.12-unowned_ungrouped_dirs"
    name: "unowned ungrouped dirs: findmnt -Dkerno fstype,target | awk '($1 !~ /^[[:space:]]*(nfs|proc|cifs|smb|vfat|iso9660…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.12. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      findmnt -Dkerno fstype,target | awk '($1 !~ /^[[:space:]]*(nfs|proc|cifs|smb|vfat|iso9660|efivarfs|selinuxfs|ncpfs)/ && $2 !~ /^(\/run|\/tmp|\/var\/tmp)(\/|$)/){print $2}' | while IFS= read -r l_mount; do
        find "$l_mount" -mount -xdev \( -path "*/containers/storage/*" -o -path "*/containerd/*" -o -path "*/kubelet/*" -o -path "*/docker/*" -o -path "/sys/*" -o -path "/snap/*" -o -path "/boot/efi/*" \) -prune -o \( -type f -o -type d \) \( -nouser -o -nogroup \) -printf 'FAIL: %u %g %p\n' 2>/dev/null
      done
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-6853b0549c |
      Files and directories whose owner or group does not match any existing account are usually left over from deleted users or unpacked archives. If a new account later receives the same UID or GID, it silently gains access to that data. Assigning valid owners keeps access control predictable.
    remediation: &rem-87eb4e1869 |
      Review each reported file or directory and assign an existing owner and group, or remove it once it is confirmed to be no longer needed.

      ls -ld PATH
      chown USER:GROUP PATH
  - id: "CIS-AMAZON2027-7.1.13-audit_sgid_suid"
    name: "audit sgid suid: findmnt -Dkerno fstype,target,options | awk '($1 !~ /^[[:space:]]*(nfs|proc|smb|vfat|iso9…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.1.13. NIST SP 800-53 Rev. 5: AC-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      findmnt -Dkerno fstype,target,options | awk '($1 !~ /^[[:space:]]*(nfs|proc|smb|vfat|iso9660|efivarfs|selinuxfs)/ && $2 !~ /^\/run\/user\// && $3 !~ /noexec/ && $3 !~ /nosuid/){print $2}' | while IFS= read -r l_mount; do
        find "$l_mount" -xdev -type f \( -perm -4000 -o -perm -2000 \) -print 2>/dev/null
      done | sort -u | while IFS= read -r l_file; do
        echo "reviewed: $l_file"
        if ! rpm -qf "$l_file" >/dev/null 2>&1; then
          echo "FAIL: $l_file is not owned by any package"
        else
          rpm -Vf "$l_file" 2>/dev/null | awk -v f="$l_file" '$NF == f && $1 ~ /(5|M)/ {print "FAIL: " f " differs from its package (" $1 ")"}'
        fi
      done
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { some: "~ ^reviewed: " }
      - { none: "~ ^FAIL:" }
    rationale: &rat-a5e81e314d |
      Programs with the setuid or setgid bit run with the privileges of their owner or group, usually root, so a flaw in such a file or a replaced copy leads directly to privilege escalation. Reviewing these files, and checking that they belong to an installed package and match the packaged version, finds planted or modified privileged binaries.
    remediation: &rem-844c18c942 |
      Review every reported setuid or setgid file. Reinstall the owning package of files that differ from the packaged version, and remove the special bits from files that do not belong to any package unless they are known to be required.

      rpm -qf FILE
      rpm -Vf FILE
      dnf reinstall PACKAGE
      chmod u-s,g-s FILE

      On RHEL 8, 9 and 10 every setuid or setgid file is listed; review the list and remove the bits from programs the system does not need.
  - id: "CIS-AMAZON2027-7.2.1-accts_use_shadowed"
    name: "accts use shadowed: awk -F: '($2 != \"x\") { print \"FAIL: \" $1 \" is not set to shadowed passwords\" }' /etc/pass…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.2.1. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: NA."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      awk -F: '($2 != "x") { print "FAIL: " $1 " is not set to shadowed passwords" }' /etc/passwd
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-2034accf59 |
      If the password field in /etc/passwd holds a hash instead of the placeholder x, every user can read it, because /etc/passwd is world-readable, and crack it offline. Keeping hashes in /etc/shadow, which only root can read, prevents this exposure.
    remediation: &rem-0f8f7d54a9 |
      Move all password hashes to /etc/shadow, then review the reported accounts again.

      pwconv
      awk -F: '($2 != "x") {print $1}' /etc/passwd

      For any account still listed, set the password field to x with usermod or vipw and give the account a password with passwd USER.
  - id: "CIS-AMAZON2027-7.2.2-nopasswd_shadow"
    name: "nopasswd shadow: awk -F: '($2 == \"\") { print \"FAIL: \" $1 \" does not have a password\" }' /etc/shadow"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.2.2. NIST SP 800-53 Rev. 5: IA-5. CIS Controls v8: 5.2."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      awk -F: '($2 == "") { print "FAIL: " $1 " does not have a password" }' /etc/shadow
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-9a863c273d |
      Every account should either have a password hash stored in /etc/shadow or be explicitly locked. An empty password field allows logging in without credentials, and password hashes kept in the world-readable /etc/passwd can be cracked by any user.
    remediation: &rem-05e12bb74f |
      Make sure every account keeps its password in /etc/shadow and no account has an empty password field: move hashes from /etc/passwd to /etc/shadow with pwconv, then lock or set a password for every account the check reports.

      pwconv
      awk -F: '($2 == "") {print $1}' /etc/shadow
      usermod -L USER
      passwd USER
  - id: "CIS-AMAZON2027-7.2.3-passwd_group_exist"
    name: "passwd group exist: awk -F: 'NR == FNR { gid[$3]; next } !($4 in gid) { print \"FAIL: \" $1 \" has GID \" $4 \" wh…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.2.3. NIST SP 800-53 Rev. 5: AC-2. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      awk -F: 'NR == FNR { gid[$3]; next } !($4 in gid) { print "FAIL: " $1 " has GID " $4 " which does not exist in /etc/group" }' /etc/group /etc/passwd
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-a6fe2c7421 |
      Every primary group referenced in /etc/passwd should exist in /etc/group. Undefined group IDs usually result from manual edits or deleted groups; if the ID is reused later, the new group's members gain access to the affected users' files.
    remediation: &rem-ac0bde3f41 |
      For every user reported by the check, create the missing group with the referenced GID or assign the user an existing primary group.

      grpck -r
      groupadd -g GID GROUP
      usermod -g GROUP USER

      Changing the primary group does not change the ownership of existing files; adjust them if necessary.
  - id: "CIS-AMAZON2027-7.2.4-no_dup_uid"
    name: "no dup uid: cut -d: -f3 /etc/passwd | sort | uniq -d | sed 's/^/FAIL: duplicate UID /'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.2.4. NIST SP 800-53 Rev. 5: IA-2. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cut -d: -f3 /etc/passwd | sort | uniq -d | sed 's/^/FAIL: duplicate UID /'
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-92a5e740a2 |
      The kernel identifies users by UID, not by name. Several accounts with the same UID share all file ownerships and privileges and cannot be told apart in logs, which undermines accountability.
    remediation: &rem-3997dd9dfb |
      Review every duplicate UID reported by the check, give each account its own UID and assign the files of the former shared UID deliberately.

      awk -F: '($3 == UID) {print $1}' /etc/passwd
      usermod -u NEWUID USER
      find / -xdev -user UID -ls

      usermod adjusts only the home directory; other files owned by the old UID stay with the account that keeps it.
  - id: "CIS-AMAZON2027-7.2.5-no_dup_gid"
    name: "no dup gid: cut -d: -f3 /etc/group | sort | uniq -d | sed 's/^/FAIL: duplicate GID /'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.2.5. NIST SP 800-53 Rev. 5: AC-2. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cut -d: -f3 /etc/group | sort | uniq -d | sed 's/^/FAIL: duplicate GID /'
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-1c1a4afdb8 |
      Groups are identified by GID. Several groups with the same GID share all group permissions, so membership in one silently grants the access rights of the other.
    remediation: &rem-6a315abc33 |
      Review every duplicate GID reported by the check, give each group its own GID and assign the files of the former shared GID deliberately.

      awk -F: '($3 == GID) {print $1}' /etc/group
      groupmod -g NEWGID GROUP
      find / -xdev -group GID -ls

      Files owned by the old GID are not changed automatically; adjust them where they belong to the renumbered group.
  - id: "CIS-AMAZON2027-7.2.6-no_dup_username"
    name: "no dup username: cut -d: -f1 /etc/passwd | sort | uniq -d | sed 's/^/FAIL: duplicate user name /'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.2.6. NIST SP 800-53 Rev. 5: IA-2. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cut -d: -f1 /etc/passwd | sort | uniq -d | sed 's/^/FAIL: duplicate user name /'
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-48bf65be3b |
      Duplicate user names in /etc/passwd make it unpredictable which entry is used for login and which UID a name resolves to. This can lead to wrong file ownership and confusing audit trails.
    remediation: &rem-e93b096dcd |
      Review the duplicate entries for every user name reported by the check and remove or rename the surplus entry in /etc/passwd and /etc/shadow with the locking editors.

      grep -n '^USER:' /etc/passwd
      pwck -r
      vipw
      vipw -s
  - id: "CIS-AMAZON2027-7.2.7-no_dup_groupname"
    name: "no dup groupname: cut -d: -f1 /etc/group | sort | uniq -d | sed 's/^/FAIL: duplicate group name /'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.2.7. NIST SP 800-53 Rev. 5: AC-2. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cut -d: -f1 /etc/group | sort | uniq -d | sed 's/^/FAIL: duplicate group name /'
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-5dd470fed7 |
      Duplicate group names in /etc/group make it unpredictable which GID a group name resolves to. This can lead to wrong access rights when files or memberships are assigned by name.
    remediation: &rem-c9a5680ce7 |
      Review the duplicate entries for every group name reported by the check and remove or rename the surplus entry in /etc/group and /etc/gshadow with the locking editors.

      grep -n '^GROUP:' /etc/group
      grpck -r
      vigr
      vigr -s
  - id: "CIS-AMAZON2027-7.2.8-home_dirs_configured"
    name: "home dirs configured: l_valid_shells=\"^($(awk -F/ '$NF != \"nologin\" {print}' /etc/shells | sed -rn '/^\\//p' | p…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 7.2.8. NIST SP 800-53 Rev. 5: AC-3. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-7, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    timeout: 120000ms
    run: |
      l_valid_shells="^($(awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//p' | paste -s -d '|' - ))$"
      awk -v pat="$l_valid_shells" -F: '$(NF) ~ pat { print $1 " " $(NF-1) }' /etc/passwd | while read -r l_user l_home; do
        if [ ! -d "$l_home" ]; then
          echo "FAIL: user $l_user home directory $l_home does not exist"
          continue
        fi
        stat -Lc '%U %#a' "$l_home" | while read -r l_own l_mode; do
          [ "$l_own" != "$l_user" ] && echo "FAIL: user $l_user home $l_home is owned by $l_own"
          [ $(( l_mode & 027 )) -gt 0 ] && echo "FAIL: user $l_user home $l_home is mode $l_mode"
        done
      done
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-11d27a2501 |
      Every user with a login shell needs an existing home directory that the user owns; otherwise sessions start in an unexpected place, or another owner can plant shell startup files that run as the user. Home directories that are group-writable or accessible to others expose private data and allow tampering with startup files.
    remediation: &rem-db1a57e5fb |
      For each reported user, create the missing home directory, give it to the user and remove group write and all access for others.

      mkdir -p HOME
      chown USER: HOME
      chmod g-w,o-rwx HOME

      For system accounts that do not need a home directory, setting the login shell to nologin (usermod -s /usr/sbin/nologin USER) also removes them from the check.
