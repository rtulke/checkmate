  - id: "CIS-AMAZON2027-1.5.6-kernel.randomize_va_space"
    name: "Kernel parameter kernel.randomize_va_space is 2"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.5.6. NIST SP 800-53 Rev. 5: SI-16."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
