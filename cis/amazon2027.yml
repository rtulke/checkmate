  - id: "CIS-AMAZON2027-1.5.5-kernel.kptr_restrict"
    name: "Kernel parameter kernel.kptr_restrict matches ^(1|2)$"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.5.5. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
