      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\\S+,)?finit_module(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)kernel_modules\\s*$" }
      - { some: "~ ^\\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\\S+,)?init_module(,\\S+)? (.* )?-F auid\u003e=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)kernel_modules\\s*$" }
