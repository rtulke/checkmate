  - id: "CIS-AMAZON2027-5.3.3.1.1-faillock_attempts_deny-attrs"
    name: "/etc/security/faillock.conf: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.1.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-241af1b0a8 |
      Locking an account after a small number of consecutive failed logins stops online password guessing against it. Without a limit, an attacker can try passwords indefinitely. A limit of five or fewer attempts keeps guessing impractical; the trade-off is that attackers can deliberately lock accounts, which the unlock time should balance.
    remediation: &rem-41697c6a61 |
      Create /etc/security/faillock.conf.
  - id: "CIS-AMAZON2027-5.3.3.1.1-faillock_attempts_deny-content"
    name: "/etc/security/faillock.conf has the expected content (2 rules)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.1.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/security/faillock.conf'
    allow_rc: any
    expect:
      - { some: "~ ^\\s*deny\\s*=\\s*[1-5]\\b" }
      - { none: "~ ^\\s*deny\\s*=\\s*(0|[6-9]|[1-9][0-9]+)\\b" }
    rationale: *rat-241af1b0a8
    remediation: &rem-876e6d67d4 |
      Edit /etc/security/faillock.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*deny\s*=\s*[1-5]\b
      - no line matches ^\s*deny\s*=\s*(0|[6-9]|[1-9][0-9]+)\b
  - id: "CIS-AMAZON2027-5.3.3.1.1-faillock_attempts_deny_pam"
    name: "faillock attempts deny pam: grep -Pi -- '^\\h*auth\\h+(requisite|required|sufficient)\\h+pam_faillock\\.so\\h+([^#\\n\\r]+\\h…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.1.1. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Pi -- '^\h*auth\h+(requisite|required|sufficient)\h+pam_faillock\.so\h+([^#\n\r]+\h+)?deny\h*=\h*(0|[6-9]|[1-9][0-9]+)\b' /etc/pam.d/system-auth /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-7fd197517e |
      The faillock deny value can also be given as an argument on the pam_faillock lines, where it overrides /etc/security/faillock.conf. A deny=0 or a high value there disables or weakens the lockout although faillock.conf looks correct. Keeping the setting in faillock.conf only gives one authoritative place.
    remediation: &rem-c19c0f493c |
      Remove the deny option from the pam_faillock.so lines in /etc/pam.d/system-auth and /etc/pam.d/password-auth and set deny = 5 or less in /etc/security/faillock.conf instead.

      grep -Pn 'pam_faillock\.so.*\bdeny\s*=' /etc/pam.d/system-auth /etc/pam.d/password-auth
      authselect current

      If authselect manages the files, remove the option from the custom profile (/etc/authselect/custom/PROFILE/system-auth and password-auth) and run authselect apply-changes; otherwise edit the two files directly.
  - id: "CIS-AMAZON2027-5.3.3.1.2-faillock_unlock_time-attrs"
    name: "/etc/security/faillock.conf: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.1.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-f655eb77df |
      The unlock time determines how long an account stays locked after too many failed logins. A short lock barely slows down automated guessing, while 0 keeps the account locked until an administrator intervenes. Variants differ in whether they favour long locks or a maximum of 15 minutes to limit denial of service.
    remediation: *rem-41697c6a61
  - id: "CIS-AMAZON2027-5.3.3.1.2-faillock_unlock_time-content"
    name: "/etc/security/faillock.conf has the expected content (2 rules)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.1.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/security/faillock.conf'
    allow_rc: any
    expect:
      - { some: "~ ^\\s*unlock_time\\s*=\\s*(0|9[0-9][0-9]|[1-9][0-9]{3,})\\b" }
      - { none: "~ ^\\s*unlock_time\\s*=\\s*([1-9]|[1-9][0-9]|[1-8][0-9][0-9])\\b" }
    rationale: *rat-f655eb77df
    remediation: &rem-0874c065e1 |
      Edit /etc/security/faillock.conf so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*unlock_time\s*=\s*(0|9[0-9][0-9]|[1-9][0-9]{3,})\b
      - no line matches ^\s*unlock_time\s*=\s*([1-9]|[1-9][0-9]|[1-8][0-9][0-9])\b
  - id: "CIS-AMAZON2027-5.3.3.1.2-faillock_unlock_time_pam"
    name: "faillock unlock time pam: grep -Pi -- '^\\h*auth\\h+(requisite|required|sufficient)\\h+pam_faillock\\.so\\h+([^#\\n\\r]+\\h…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.1.2. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Pi -- '^\h*auth\h+(requisite|required|sufficient)\h+pam_faillock\.so\h+([^#\n\r]+\h+)?unlock_time\h*=\h*([1-9]|[1-9][0-9]|[1-8][0-9][0-9])\b' /etc/pam.d/system-auth /etc/pam.d/password-auth
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-96b386d263 |
      An unlock_time argument on the pam_faillock lines overrides /etc/security/faillock.conf. A value below 900 seconds there shortens the lockout so much that password guessing continues with little delay, even though faillock.conf looks compliant.
    remediation: &rem-7e7647bd23 |
      Remove the unlock_time option from the pam_faillock.so lines in /etc/pam.d/system-auth and /etc/pam.d/password-auth and set unlock_time = 900 or more (0 means until unlocked by an administrator) in /etc/security/faillock.conf instead.

      grep -Pn 'pam_faillock\.so.*\bunlock_time\s*=' /etc/pam.d/system-auth /etc/pam.d/password-auth
      authselect current

      If authselect manages the files, remove the option from the custom profile (/etc/authselect/custom/PROFILE/system-auth and password-auth) and run authselect apply-changes; otherwise edit the two files directly.
  - id: "CIS-AMAZON2027-5.3.3.1.3-faillock_even_root-attrs"
    name: "/etc/security/faillock.conf: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.1.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      f='/etc/security/faillock.conf'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-3837626be2 |
      By default faillock does not lock the root account, so root remains an unlimited target for password guessing. even_deny_root, or a root_unlock_time of at least a minute, applies the lockout to root as well. Console or out-of-band access should remain available so a locked root cannot block recovery.
    remediation: *rem-41697c6a61
  - id: "CIS-AMAZON2027-5.3.3.1.3-faillock_even_root-content"
    name: "/etc/security/faillock.conf has the expected content (2 rules)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.3.3.1.3. NIST SP 800-53 Rev. 5: IA-5."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-2, cis-server, cis-level2-server]
