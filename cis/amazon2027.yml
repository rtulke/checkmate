  - id: "CIS-AMAZON2027-1.4.2-efi_boot_opts"
    name: "efi boot opts: l_opts=\"$(awk '$1 !~ /^#/ \u0026\u0026 $2 == \"/boot/efi\" {print $4}' /etc/fstab)\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.4.2. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      l_opts="$(awk '$1 !~ /^#/ && $2 == "/boot/efi" {print $4}' /etc/fstab)"
      if [ -z "$l_opts" ]; then
        echo "efi_not_in_fstab"
      else
        for l_opt in fmask=0077 uid=0 gid=0; do
          echo ",$l_opts," | grep -q ",$l_opt," || echo "efi_missing: $l_opt"
        done
        echo "efi_options_checked"
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(efi_not_in_fstab|efi_options_checked)$" }
      - { none: "~ ^efi_missing: " }
  - id: "CIS-AMAZON2027-1.4.2-grub_bootloader_files_access"
    name: "grub bootloader files access: find /boot -type f \\( -name 'grub*' -o -name 'user.cfg' \\) -exec stat -Lc '%n %a %U %G' {…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.4.2. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      find /boot -type f \( -name 'grub*' -o -name 'user.cfg' \) -exec stat -Lc '%n %a %U %G' {} + | awk '
        $1 ~ /^\/boot\/efi\// && $2 !~ /^[0-7]00$/ { print "bad_mode: " $0; next }
        $1 !~ /^\/boot\/efi\// && $2 !~ /^[0246]00$/ { print "bad_mode: " $0; next }
        $3 != "root" || $4 != "root" { print "bad_owner: " $0 }'
      echo "grub_files_checked"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^grub_files_checked$" }
      - { none: "~ ^bad_(mode|owner): " }
