  - id: "CIS-AMAZON2027-3.1.1-cis_3_1_1_ipv6_required"
    name: "cis 3 1 1 ipv6 required: if [ `grep 0 /proc/sys/net/ipv6/conf/all/disable_ipv6` ] || [ `grep 0 /proc/sys/net/ipv6/…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 3.1.1. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      if [ `grep 0 /proc/sys/net/ipv6/conf/all/disable_ipv6` ] || [ `grep 0 /proc/sys/net/ipv6/conf/default/disable_ipv6` ] || [ `cat /sys/module/ipv6/parameters/disable` == 0 ]; \
      then \
      echo 'ipv6_enabled'; \
      else echo 'fail'; \
      fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ipv6_enabled" }
    rationale: &rat-d6058c913e |
      IPv6 is enabled by default on modern Linux systems and many components expect it. Disabling it inconsistently can break services, while leaving it enabled without corresponding firewall rules and kernel parameter hardening leaves an unmonitored attack path. This check verifies that IPv6 is enabled, so the IPv6 hardening checks apply to an active stack and the system's IPv6 state is known.
    remediation: &rem-65b2f66c6b |
      Enable IPv6: remove ipv6.disable=1 from the kernel command line and settings that set disable_ipv6 to 1, then activate it:

      grubby --update-kernel ALL --remove-args ipv6.disable=1
      grep -rn disable_ipv6 /etc/sysctl.conf /etc/sysctl.d/
      sysctl -w net.ipv6.conf.all.disable_ipv6=0
      sysctl -w net.ipv6.conf.default.disable_ipv6=0

      Edit or remove the disable_ipv6 entries found by grep. A reboot is needed if ipv6.disable=1 was on the kernel command line. If IPv6 is deliberately disabled by site policy, document an exception instead.
  - id: "CIS-AMAZON2027-3.1.2-cis_3_1_2_bluez_pkg"
    name: "Package bluez is not installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 3.1.2. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-3, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      rpm -q --quiet bluez
    expect: false
    rationale: &rat-1039b5b83b |
      BlueZ provides the Bluetooth stack. Bluetooth exposes a wireless attack surface reachable by anyone nearby, and the stack has had serious remote vulnerabilities; servers rarely need it. If the system does not need it, removing the package eliminates the attack surface and the patching burden; keep it only where the service is a deliberate part of the system's role.
    remediation: &rem-be2e8a23b3 |
      Remove the package bluez, unless the system needs it:

      dnf remove bluez
  - id: "CIS-AMAZON2027-3.2.1-cis_3_2_1_rds_not_available"
    name: "cis 3 2 1 rds not available: l_mod=\"rds\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 3.2.1. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-amazon2027, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      l_mod="rds"
      l_avail=""
      for l_path in /usr/lib/modules/*/kernel/net/"$l_mod" /lib/modules/*/kernel/net/"$l_mod"; do
        [ -d "$l_path" ] && [ -n "$(ls -A "$l_path")" ] && l_avail="yes"
      done
      if [ -z "$l_avail" ]; then
        echo "PASS - $l_mod not available"
        exit 0
      fi
      l_fail=""
      lsmod | awk '{print $1}' | grep -x "$l_mod" >/dev/null && { echo "FAIL - $l_mod is loaded"; l_fail="yes"; }
      modprobe --showconfig | grep -P -- "^\h*blacklist\h+$l_mod\b" >/dev/null || { echo "FAIL - $l_mod is not deny listed"; l_fail="yes"; }
      modprobe --showconfig | grep -P -- "^\h*install\h+$l_mod\h+(/usr)?/bin/(true|false)\b" >/dev/null || { echo "FAIL - $l_mod is loadable"; l_fail="yes"; }
      [ -z "$l_fail" ] && echo "PASS - $l_mod not loaded and not loadable"
      exit 0
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS - rds not (available|loaded and not loadable)$" }
      - { none: "~ FAIL" }
    rationale: &rat-de11d10817 |
      Reliable Datagram Sockets (RDS) is a protocol for high-performance cluster communication that ordinary systems do not use. The RDS kernel module has had several privilege escalation vulnerabilities, and because unprivileged users can trigger automatic loading of protocol modules by opening a socket, an unused module is still attack surface. Blacklisting the module and mapping its install command to /bin/false prevents it from being loaded.
    remediation: &rem-dab4200949 |
      Prevent the rds module from being loaded and unload it if it is loaded:

      printf '%s\n' 'blacklist rds' 'install rds /bin/false' > /etc/modprobe.d/rds.conf
      modprobe -r rds

      modprobe -r fails if the module is in use or dependent modules (rds_tcp, rds_rdma) are loaded, which must be unloaded first; the configuration still takes effect at the next boot. Systems that really use RDS need an exception.
  - id: "CIS-AMAZON2027-3.2.2-cis_3_2_2_sctp_not_available"
    name: "cis 3 2 2 sctp not available: l_mod=\"sctp\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 3.2.2. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-amazon2027, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      l_mod="sctp"
      l_avail=""
      for l_path in /usr/lib/modules/*/kernel/net/"$l_mod" /lib/modules/*/kernel/net/"$l_mod"; do
        [ -d "$l_path" ] && [ -n "$(ls -A "$l_path")" ] && l_avail="yes"
      done
      if [ -z "$l_avail" ]; then
        echo "PASS - $l_mod not available"
        exit 0
      fi
      l_fail=""
      lsmod | awk '{print $1}' | grep -x "$l_mod" >/dev/null && { echo "FAIL - $l_mod is loaded"; l_fail="yes"; }
      modprobe --showconfig | grep -P -- "^\h*blacklist\h+$l_mod\b" >/dev/null || { echo "FAIL - $l_mod is not deny listed"; l_fail="yes"; }
      modprobe --showconfig | grep -P -- "^\h*install\h+$l_mod\h+(/usr)?/bin/(true|false)\b" >/dev/null || { echo "FAIL - $l_mod is loadable"; l_fail="yes"; }
      [ -z "$l_fail" ] && echo "PASS - $l_mod not loaded and not loadable"
      exit 0
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS - sctp not (available|loaded and not loadable)$" }
      - { none: "~ FAIL" }
    rationale: &rat-e5702427a9 |
      SCTP is a message-oriented transport protocol used mainly in telecom signalling and some cluster stacks. Unprivileged users can trigger automatic loading of its kernel module by opening a socket, so vulnerabilities in rarely used protocol code become exploitable even when nothing on the system needs SCTP. Blacklisting the module and mapping its install command to /bin/false prevents it from being loaded.
    remediation: &rem-5ce61f1451 |
      Prevent the sctp module from being loaded and unload it if it is loaded:

      printf '%s\n' 'blacklist sctp' 'install sctp /bin/false' > /etc/modprobe.d/sctp.conf
      modprobe -r sctp

      modprobe -r fails if the module is in use; the configuration still takes effect at the next boot. Systems that really use SCTP need an exception.
  - id: "CIS-AMAZON2027-3.2.3-cis_3_2_3_can_not_available"
    name: "cis 3 2 3 can not available: l_mod=\"can\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 3.2.3. NIST SP 800-53 Rev. 5: CM-7, SI-4."
    tags: [cis, cis-amazon2027, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      l_mod="can"
      l_avail=""
      for l_path in /usr/lib/modules/*/kernel/net/"$l_mod" /lib/modules/*/kernel/net/"$l_mod"; do
        [ -d "$l_path" ] && [ -n "$(ls -A "$l_path")" ] && l_avail="yes"
      done
      if [ -z "$l_avail" ]; then
        echo "PASS - $l_mod not available"
        exit 0
      fi
      l_fail=""
      lsmod | awk '{print $1}' | grep -x "$l_mod" >/dev/null && { echo "FAIL - $l_mod is loaded"; l_fail="yes"; }
      modprobe --showconfig | grep -P -- "^\h*blacklist\h+$l_mod\b" >/dev/null || { echo "FAIL - $l_mod is not deny listed"; l_fail="yes"; }
      modprobe --showconfig | grep -P -- "^\h*install\h+$l_mod\h+(/usr)?/bin/(true|false)\b" >/dev/null || { echo "FAIL - $l_mod is loadable"; l_fail="yes"; }
      [ -z "$l_fail" ] && echo "PASS - $l_mod not loaded and not loadable"
      exit 0
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS - can not (available|loaded and not loadable)$" }
      - { none: "~ FAIL" }
    rationale: &rat-a749a9cd6b |
      The Controller Area Network (CAN) protocol family is used for automotive and industrial buses and has no use on typical servers. Unprivileged users can trigger automatic loading of protocol modules by opening a socket, and flaws in CAN protocol modules have led to local privilege escalation. Blacklisting the module and mapping its install command to /bin/false prevents it from being loaded.
    remediation: &rem-59276b69d3 |
      Prevent the can module from being loaded and unload it if it is loaded:

      printf '%s\n' 'blacklist can' 'install can /bin/false' > /etc/modprobe.d/can.conf
      modprobe -r can

      modprobe -r fails if the module is in use or dependent modules (can_raw, can_bcm, can_gw) are loaded, which must be unloaded first; the configuration still takes effect at the next boot. Systems that really use CAN need an exception.
  - id: "CIS-AMAZON2027-3.3.1.1-net.ipv4.ip_forward"
    name: "Kernel parameter net.ipv4.ip_forward is 0"
    description: "CIS Amazon Linux 2027 benchmark recommendation 3.3.1.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-amazon2027, cis-section-3, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      sysctl -n net.ipv4.ip_forward
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-f3a19b4b76 |
      With IP forwarding enabled the system routes packets between its interfaces like a router. A host that is not meant to route could then be used to bypass network segmentation. Disabling forwarding ensures only traffic addressed to the host itself is handled. Routers and many container or virtualization hosts need forwarding.
    remediation: &rem-330a5a5e8e |
      Set the kernel parameter net.ipv4.ip_forward to 0, now and at boot:

      sysctl -w 'net.ipv4.ip_forward=0'
      printf '%s\n' 'net.ipv4.ip_forward = 0' >> /etc/sysctl.d/60-hardening.conf

      Remove other settings of net.ipv4.ip_forward from /etc/sysctl.conf and /etc/sysctl.d/: the file read last wins.
  - id: "CIS-AMAZON2027-3.3.1.1-cis_3_3_1_1_sysctl_conf"
    name: "cis 3 3 1 1 sysctl conf: l_sysctl=\"$(readlink -e /usr/lib/systemd/systemd-sysctl || readlink -e /lib/systemd/syste…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 3.3.1.1. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-amazon2027, cis-section-3, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      l_sysctl="$(readlink -e /usr/lib/systemd/systemd-sysctl || readlink -e /lib/systemd/systemd-sysctl)"
      l_value="$("$l_sysctl" --cat-config 2>/dev/null | grep -Pi -- '^\h*-?net(\.|/)ipv4(\.|/)ip_forward\h*=' | tail -n 1 | cut -d= -f2 | xargs)"
      echo "net.ipv4.ip_forward=$l_value"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^net\\.ipv4\\.ip_forward=0$" }
    rationale: &rat-042e073270 |
      With IP forwarding enabled the host routes packets between its interfaces like a router. An attacker could use it to bypass network segmentation or to reach networks the host is attached to. Routers, VPN gateways and hosts running containers or virtual machines with routed networking legitimately need forwarding. This check reads the configuration that systemd-sysctl applies at boot, so the value persists across reboots instead of only being set at runtime.
    remediation: &rem-7816eeb6aa |
      Set net.ipv4.ip_forward to 0 in a file under /etc/sysctl.d/ and apply it to the running kernel:

      printf '%s\n' 'net.ipv4.ip_forward = 0' >> /etc/sysctl.d/60-hardening.conf
      sysctl -w net.ipv4.ip_forward=0
      /usr/lib/systemd/systemd-sysctl --cat-config | grep -E '^\s*-?net[./]ipv4[./]ip_forward\s*='

      The last assignment in that output wins: remove or change conflicting entries in /etc/sysctl.conf and in files sorted after 60-hardening.conf.
  - id: "CIS-AMAZON2027-3.3.1.2-net.ipv4.conf.all.forwarding"
    name: "Kernel parameter net.ipv4.conf.all.forwarding is 0"
    description: "CIS Amazon Linux 2027 benchmark recommendation 3.3.1.2. NIST SP 800-53 Rev. 5: CM-6."
    tags: [cis, cis-amazon2027, cis-section-3, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sysctl -n net.ipv4.conf.all.forwarding
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - "== 0"
    rationale: &rat-750ebc2379 |
      This parameter controls IPv4 forwarding on all interfaces. When enabled, the host routes packets between networks, which an attacker can use to bypass segmentation or pivot into otherwise unreachable networks. Routers, VPN gateways and hosts running containers or virtual machines with routed networking legitimately need forwarding. This check verifies the value in the running kernel.
    remediation: &rem-3320f1cd32 |
      Set the kernel parameter net.ipv4.conf.all.forwarding to 0, now and at boot:

      sysctl -w 'net.ipv4.conf.all.forwarding=0'
      printf '%s\n' 'net.ipv4.conf.all.forwarding = 0' >> /etc/sysctl.d/60-hardening.conf

