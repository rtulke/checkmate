      Loading a kernel module runs arbitrary code with full kernel privileges. Auditing the init_module and finit_module system calls captures every module load by users, including loads done without the kmod tools, which helps detect rootkits. This check looks at the persistent rules in /etc/audit/rules.d/, which are loaded at boot.
