      grep -Phs -- 'faillock' /etc/audit/rules.d/*.rules
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^\\s*(-w /var/run/faillock/? -p wa -k logins|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/var/run/faillock/? -F perm=wa (-k |-F key=)logins)\\s*$" }
    rationale: &rat-d8c6289f2e |
      The faillock directory holds the per-user counters of failed authentication attempts that drive account lockout. Auditing writes to it records brute-force attempts and lockouts and shows when someone resets or manipulates the counters. This check looks at the persistent rules in /etc/audit/rules.d/, which are loaded at boot.
    remediation: &rem-5eed8dd665 |
