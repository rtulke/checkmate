    rationale: &rat-5e3c5063e0 |
      Extended attributes carry security data such as SELinux labels, POSIX ACLs and file capabilities. Recording every change to them by logged-in users reveals attempts to relabel files, widen access through ACLs or grant capabilities to binaries outside normal administration. This check looks at the rules currently loaded in the kernel (auditctl -l), so the rules must also have been loaded.
