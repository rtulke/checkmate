    rationale: &rat-ac273e53b8 |
      squashfs is a compressed read-only file system used for images such as live media and snap packages. Every file system driver the kernel can load on demand is code that parses untrusted on-disk data, and flaws in rarely used drivers have led to privilege escalation or denial of service. This check verifies that the module is not currently loaded. Systems that run snap packages or mount squashfs images need the module.
