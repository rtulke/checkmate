      - { some: "~ ^\\s*Storage\\s*=\\s*none\\s*$" }
    rationale: &rat-fec9591a7c |
      Core dumps stored on disk by systemd-coredump can contain passwords, keys and other sensitive memory content and remain available long after the crash. Setting Storage to none keeps systemd-coredump from saving dumps, while the crash itself is still logged.
    remediation: &rem-ff7d7edd45 |
      Set Storage=none for systemd-coredump in a drop-in file:

      mkdir -p /etc/systemd/coredump.conf.d
      printf '%s\n' '[Coredump]' 'Storage=none' > /etc/systemd/coredump.conf.d/60-storage.conf
      systemd-analyze cat-config systemd/coredump.conf | grep Storage

      The last value shown wins: remove conflicting settings in drop-ins sorted later. The setting applies to the next crash; no restart is needed.
  - id: "CIS-AMAZON2027-1.6.1-crypto_policies_config"
    name: "crypto policies config: cat /etc/crypto-policies/config"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.6.1. NIST SP 800-53 Rev. 5: SC-6. CIS Controls v8: 3.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat /etc/crypto-policies/config
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(|\\s+)(DEFAULT|FUTURE|FIPS)" }
      - { none: "~ ^(|\\s+)LEGACY" }
    rationale: &rat-97d5e3099e |
      The system-wide crypto policy defines which protocols, ciphers, key sizes and hash algorithms libraries such as OpenSSL, GnuTLS, NSS and OpenSSH accept. The LEGACY policy re-enables weak algorithms like SHA-1 signatures and small keys that allow downgrade or forgery attacks. Using DEFAULT, FUTURE or FIPS keeps all applications on a consistent, acceptable baseline.
    remediation: &rem-1c3854f2aa |
      Select the DEFAULT system-wide crypto policy (FUTURE or FIPS are also accepted) instead of LEGACY.

      update-crypto-policies --set DEFAULT
      update-crypto-policies --show

      Restart services or reboot so that all applications pick up the new policy. Selecting FIPS here does not by itself enable FIPS mode.
  - id: "CIS-AMAZON2027-1.6.2-crypto_policies_no_sha1_current-attrs"
    name: "/etc/crypto-policies/state/CURRENT.pol: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.6.2. NIST SP 800-53 Rev. 5: SC-6. CIS Controls v8: 3.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/crypto-policies/state/CURRENT.pol'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-16fe00de9a |
      SHA-1 is no longer collision resistant; practical chosen-prefix collisions allow forging signatures and certificates that rely on it. The system-wide crypto policy determines which algorithms TLS, SSH, Kerberos and other libraries accept. A policy that excludes SHA-1 for hashes and signatures prevents applications from negotiating or trusting SHA-1 based signatures.
    remediation: &rem-f645034cb6 |
      Create /etc/crypto-policies/state/CURRENT.pol.
  - id: "CIS-AMAZON2027-1.6.2-crypto_policies_no_sha1_current-content"
    name: "/etc/crypto-policies/state/CURRENT.pol has the expected content (3 rules)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.6.2. NIST SP 800-53 Rev. 5: SC-6. CIS Controls v8: 3.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/crypto-policies/state/CURRENT.pol'
    allow_rc: any
    expect:
      - { some: "~ (?i)^\\s*hash\\s*=" }
      - { none: "~ (?i)^\\s*(hash|sign)\\s*=.*SHA-?1\\b" }
      - { none: "~ (?i)^\\s*sha1_in_certs\\s*=\\s*[1-9]" }
    rationale: *rat-16fe00de9a
    remediation: &rem-ea91e7dc42 |
      Edit /etc/crypto-policies/state/CURRENT.pol so that its lines meet these conditions (regular expressions):

      - a line matches (?i)^\s*hash\s*=
      - no line matches (?i)^\s*(hash|sign)\s*=.*SHA-?1\b
      - no line matches (?i)^\s*sha1_in_certs\s*=\s*[1-9]
  - id: "CIS-AMAZON2027-1.6.2-crypto_policies_no_sha1_scopes"
    name: "crypto policies no sha1 scopes: echo \"sha1_nonexempt_scopes=$(grep -Pi -- '^\\h*(hash|sign)@\\S+\\h*=.*SHA-?1\\b' /etc/crypto…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.6.2. NIST SP 800-53 Rev. 5: SC-6. CIS Controls v8: 3.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      echo "sha1_nonexempt_scopes=$(grep -Pi -- '^\h*(hash|sign)@\S+\h*=.*SHA-?1\b' /etc/crypto-policies/state/CURRENT.pol | grep -Piv -- '^\h*(hash|sign)@(nss-)?(rpm|dnssec|smime|pkcs12)[^\h=]*\h*=' | wc -l)"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^sha1_nonexempt_scopes=0$" }
    rationale: &rat-e98f7f3d40 |
      SHA-1 is no longer collision resistant, and forged SHA-1 signatures are practical. Crypto policies can re-enable algorithms for individual scopes such as TLS or SSH, so a policy that looks clean globally may still accept SHA-1 for some applications. This check ensures that SHA-1 hashes and signatures are not allowed in any scope apart from narrow compatibility exceptions such as RPM and DNSSEC.
    remediation: &rem-e6b78631d4 |
      Use a crypto policy that does not enable SHA-1 for scoped hash or sign properties. Check the current policy, drop sub-policies or custom modules that add SHA-1, and apply it:

      update-crypto-policies --show
      grep -Pi '^\h*(hash|sign)@\S+\h*=.*SHA-?1\b' /etc/crypto-policies/state/CURRENT.pol
      update-crypto-policies --set DEFAULT

      If you use other sub-policies, keep them in the --set argument (e.g. DEFAULT:NO-SSHCBC) and only remove the SHA1 sub-policy or the offending lines in /etc/crypto-policies/policies/modules/*.pmod. Reboot so that all services pick up the new policy.
  - id: "CIS-AMAZON2027-1.6.3-crypto_policies_no_weakmacs-attrs"
    name: "/etc/crypto-policies/state/CURRENT.pol: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.6.3. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 3.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/crypto-policies/state/CURRENT.pol'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-08e25e2adb |
      Message authentication codes protect data in transit against tampering. MACs with short tags, such as 64-bit variants, can be forged with feasible effort and offer too little margin against collision attacks on long-lived connections. Excluding them from the system-wide crypto policy ensures that TLS, SSH and other libraries only negotiate MACs with adequate strength.
    remediation: *rem-f645034cb6
  - id: "CIS-AMAZON2027-1.6.3-crypto_policies_no_weakmacs-content"
    name: "/etc/crypto-policies/state/CURRENT.pol has the expected content (2 rules)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.6.3. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 3.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/crypto-policies/state/CURRENT.pol'
    allow_rc: any
    expect:
      - { some: "~ (?i)^\\s*mac\\s*=" }
      - { none: "~ (?i)^\\s*mac(@[^=\\s]+)?\\s*=\\s*([^#]+)?-64\\b" }
    rationale: *rat-08e25e2adb
    remediation: &rem-019cf2ddca |
      Edit /etc/crypto-policies/state/CURRENT.pol so that its lines meet these conditions (regular expressions):

      - a line matches (?i)^\s*mac\s*=
      - no line matches (?i)^\s*mac(@[^=\s]+)?\s*=\s*([^#]+)?-64\b
  - id: "CIS-AMAZON2027-1.6.4-crypto_policies_no_ssh_cbc"
    name: "crypto policies no ssh cbc: f=/etc/crypto-policies/state/CURRENT.pol"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.6.4. NIST SP 800-53 Rev. 5: SC-6. CIS Controls v8: 3.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f=/etc/crypto-policies/state/CURRENT.pol
      if grep -Piq -- '^\h*cipher@(lib|open)ssh(-server|-client)?\h*=\h*([^#\n\r]+)?-CBC\b' "$f"; then echo ssh_cbc=enabled
      elif grep -Piq -- '^\h*cipher\h*=\h*([^#\n\r]+)?-CBC\b' "$f" && ! grep -Piq -- '^\h*cipher@(lib|open)ssh' "$f"; then echo ssh_cbc=enabled
      else echo ssh_cbc=disabled; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^ssh_cbc=disabled$" }
    rationale: &rat-779955ae7a |
      CBC mode ciphers in SSH have a history of plaintext-recovery attacks and, combined with encrypt-then-MAC, are affected by the Terrapin prefix truncation attack. Modern counter and AEAD modes such as AES-CTR and AES-GCM avoid these problems. Disabling CBC ciphers for SSH in the system-wide crypto policy removes these weaker modes from both the SSH server and clients.
    remediation: &rem-cc0e96bd57 |
      Create a crypto policy module that removes CBC ciphers for SSH and apply it as a sub-policy:

      printf '%s\n' 'cipher@SSH = -*-CBC' > /etc/crypto-policies/policies/modules/NO-SSHCBC.pmod
      update-crypto-policies --set DEFAULT:NO-SSHCBC
      systemctl restart sshd

      Keep other sub-policies you use in the --set argument (e.g. DEFAULT:NO-SHA1:NO-SSHCBC); several SSH restrictions can also be combined in one module. Reboot so that all services pick up the new policy.
  - id: "CIS-AMAZON2027-1.6.5-crypto_policies_no_ssh_chacha20"
    name: "crypto policies no ssh chacha20: f=/etc/crypto-policies/state/CURRENT.pol"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.6.5. NIST SP 800-53 Rev. 5: SC-6. CIS Controls v8: 3.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f=/etc/crypto-policies/state/CURRENT.pol
      if grep -Piq -- '^\h*cipher@(lib|open)ssh' "$f"; then l=$(grep -Pi -- '^\h*cipher@(lib|open)ssh(-server|-client)?\h*=' "$f"); else l=$(grep -Pi -- '^\h*cipher\h*=' "$f"); fi
      if [ -z "$l" ]; then echo ssh_chacha20=unknown
      elif echo "$l" | grep -i 'chacha20-poly1305' >/dev/null; then echo ssh_chacha20=enabled
      else echo ssh_chacha20=disabled; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^ssh_chacha20=disabled$" }
    rationale: &rat-1c2cc88db7 |
      The Terrapin attack (CVE-2023-48795) lets a man-in-the-middle silently drop messages at the start of an SSH session when ChaCha20-Poly1305 or CBC with encrypt-then-MAC is used, which can downgrade security features. Removing chacha20-poly1305 from the SSH ciphers in the crypto policy protects against this when peers do not support strict key exchange. AES-GCM and AES-CTR remain available.
    remediation: &rem-de29ce5e3c |
      Create a crypto policy module that removes ChaCha20-Poly1305 for SSH and apply it as a sub-policy:

      printf '%s\n' 'cipher@SSH = -CHACHA20-POLY1305' > /etc/crypto-policies/policies/modules/NO-SSHCHACHA20.pmod
      update-crypto-policies --set DEFAULT:NO-SSHCHACHA20
      systemctl restart sshd

      Keep other sub-policies you use in the --set argument (e.g. DEFAULT:NO-SHA1:NO-SSHCHACHA20); several SSH restrictions can also be combined in one module. Reboot so that all services pick up the new policy.
  - id: "CIS-AMAZON2027-1.6.6-crypto_policies_no_ssh_etm"
    name: "crypto policies no ssh etm: f=/etc/crypto-policies/state/CURRENT.pol"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.6.6. NIST SP 800-53 Rev. 5: SC-6. CIS Controls v8: 3.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f=/etc/crypto-policies/state/CURRENT.pol
      if grep -Piq -- '^\h*etm\h*=\h*DISABLE_ETM\b' "$f" || { grep -Piq -- '^\h*etm@libssh\h*=\h*DISABLE_ETM\b' "$f" && grep -Piq -- '^\h*etm@openssh\h*=\h*DISABLE_ETM\b' "$f"; } || { grep -Piq -- '^\h*etm@libssh\h*=\h*DISABLE_ETM\b' "$f" && grep -Piq -- '^\h*etm@openssh-client\h*=\h*DISABLE_ETM\b' "$f" && grep -Piq -- '^\h*etm@openssh-server\h*=\h*DISABLE_ETM\b' "$f"; }; then echo ssh_etm=disabled; else echo ssh_etm=enabled; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^ssh_etm=disabled$" }
    rationale: &rat-62aa6b2ef9 |
      The Terrapin attack (CVE-2023-48795) exploits encrypt-then-MAC (EtM) modes in combination with CBC ciphers to truncate the start of an SSH session undetected. Disabling EtM MACs for SSH in the crypto policy removes this attack path for peers that lack the strict key exchange countermeasure. The trade-off is that SSH falls back to the classic encrypt-and-MAC construction or AEAD ciphers.
    remediation: &rem-d768aa687f |
      Create a crypto policy module that disables encrypt-then-MAC for SSH and apply it as a sub-policy:

      printf '%s\n' 'etm@SSH = DISABLE_ETM' > /etc/crypto-policies/policies/modules/NO-SSHETM.pmod
      update-crypto-policies --set DEFAULT:NO-SSHETM
      systemctl restart sshd

      Keep other sub-policies you use in the --set argument (e.g. DEFAULT:NO-SHA1:NO-SSHETM); several SSH restrictions can also be combined in one module. Reboot so that all services pick up the new policy.
  - id: "CIS-AMAZON2027-1.6.7-crypto_policies_pq"
    name: "crypto policies pq: echo \"policy:$(cat /etc/crypto-policies/config 2\u003e/dev/null | xargs)\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.6.7. NIST SP 800-53 Rev. 5: SC-13. CIS Controls v8: 3.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      echo "policy:$(cat /etc/crypto-policies/config 2>/dev/null | xargs)"
      echo "ssh_mlkem_kex:$(grep -Pic -- '^\h*KexAlgorithms\h+\S*mlkem' /etc/crypto-policies/back-ends/openssh.config 2>/dev/null || true)"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^policy:\\S+$" }
      - { none: "~ ^policy:.*:NO-PQ(:|$)" }
      - { some: "~ ^ssh_mlkem_kex:[1-9][0-9]*$" }
    rationale: &rat-fd44f8436e |
      Traffic recorded today could be decrypted later once large quantum computers exist (harvest now, decrypt later). Hybrid post-quantum key exchange such as ML-KEM combined with X25519 protects the session keys against this while keeping classical security. This check ensures the crypto policy does not disable post-quantum algorithms and that SSH offers an ML-KEM key exchange.
    remediation: &rem-4a81851fcc |
      Remove the NO-PQ sub-policy from the system-wide crypto policy and apply it:

      cat /etc/crypto-policies/config
      update-crypto-policies --set DEFAULT
      grep -i '^KexAlgorithms' /etc/crypto-policies/back-ends/openssh.config
      systemctl restart sshd

      Keep other sub-policies you use (e.g. DEFAULT:NO-SSHCBC). If KexAlgorithms still lacks an mlkem entry, update the crypto-policies and openssh packages to versions that support ML-KEM.
  - id: "CIS-AMAZON2027-1.7.1-motd_no_system_info"
    name: "motd no system info: l_os=\"$(grep -Po '^ID=\"?\\K[^\"]+' /etc/os-release)|$(grep -Po '^NAME=\"?\\K[^\"]+' /etc/os-re…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.7.1. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6. CIS Controls v8: 3.3, 4.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      l_os="$(grep -Po '^ID="?\K[^"]+' /etc/os-release)|$(grep -Po '^NAME="?\K[^"]+' /etc/os-release)"
      for l_file in /etc/motd /run/motd /usr/lib/motd /etc/motd.d/* /run/motd.d/* /usr/lib/motd.d/*; do
        [ -f "$l_file" ] || continue
        l_name="$(basename "$l_file")"
        case "$l_file" in
          /run/motd.d/*) [ -e "/etc/motd.d/$l_name" ] && continue ;;
          /usr/lib/motd.d/*) { [ -e "/etc/motd.d/$l_name" ] || [ -e "/run/motd.d/$l_name" ]; } && continue ;;
        esac
        grep -Psil -- '(\\[mrsv]|\b('"$l_os"')\b)' "$l_file" | sed 's/^/sysinfo_in: /'
      done
      echo "motd_files_checked"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^motd_files_checked$" }
      - { none: "~ ^sysinfo_in: " }
    rationale: &rat-5428dc96f5 |
      The message of the day is shown to everyone who logs in. Operating system names, versions, kernel release or architecture in it give an attacker who obtains any login useful information for choosing exploits. Keeping the motd free of such details, and using it for usage policy instead, avoids disclosing system information unnecessarily.
    remediation: &rem-1fb99d02b8 |
      Edit or neutralize each file reported as "sysinfo_in: FILE": remove the escape sequences \m, \r, \s and \v and references to the OS name, or replace the text with your usage policy. For a file shipped in /usr/lib/motd.d/ or generated in /run/motd.d/, override it with a file of the same name in /etc/motd.d/:

      vi FILE
      mkdir -p /etc/motd.d
      ln -s /dev/null /etc/motd.d/NAME

      NAME is the file name of the reported file.
  - id: "CIS-AMAZON2027-1.7.2-etc_issue_banner-attrs"
    name: "/etc/issue: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.7.2. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6. CIS Controls v8: 3.3, 4.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/issue'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-33b14bee9b |
      /etc/issue is shown on local console logins. A clear warning that only authorized use is permitted and that activity is monitored supports legal action against intruders and informs users of monitoring, which may be required in some jurisdictions. This check verifies that the banner contains the expected warning text.
    remediation: &rem-e3ef3968ca |
      Create /etc/issue.
  - id: "CIS-AMAZON2027-1.7.2-etc_issue_banner-content"
    name: "/etc/issue has the expected content (1 rule)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.7.2. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6. CIS Controls v8: 3.3, 4.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/issue'
    allow_rc: any
    expect: { some: "~ Authorized users only\\. All activity may be monitored and reported\\." }
    rationale: *rat-33b14bee9b
    remediation: &rem-a91545b73f |
      Edit /etc/issue so that its lines meet these conditions (regular expressions):

      - a line matches Authorized users only\. All activity may be monitored and reported\.
  - id: "CIS-AMAZON2027-1.7.2-etc_issue_no_system_info"
    name: "etc issue no system info: os_id=$(. /etc/os-release; echo \"$ID\")"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.7.2. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6. CIS Controls v8: 3.3, 4.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      os_id=$(. /etc/os-release; echo "$ID")
      [ -e /etc/issue ] && echo "issue_sysinfo_lines=$(grep -Psi -- "(\\\\[vrms]|\\b${os_id}\\b)" /etc/issue | wc -l)"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^issue_sysinfo_lines=0$" }
    rationale: &rat-15f2ce4885 |
      /etc/issue is displayed before login on local consoles, so anyone with console access sees it without authenticating. Escape sequences such as \r, \m, \s and \v, or the OS name, reveal the operating system, kernel release and architecture, which helps an attacker select exploits. The banner should contain a usage warning instead.
    remediation: &rem-956c279763 |
      Replace the content of /etc/issue with a warning text that does not contain escape sequences or the OS name:

      printf '%s\n' 'Authorized users only. All activity may be monitored and reported.' > /etc/issue

      Use your organization's approved wording. The check fails if /etc/issue does not exist, so create it rather than deleting it.
  - id: "CIS-AMAZON2027-1.7.3-etc_issue_net_no_system_info"
    name: "etc issue net no system info: os_id=$(. /etc/os-release; echo \"$ID\")"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.7.3. NIST SP 800-53 Rev. 5: CM-1, CM-3, CM-6. CIS Controls v8: 3.3, 4.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      os_id=$(. /etc/os-release; echo "$ID")
      [ -e /etc/issue.net ] && echo "issue_net_sysinfo_lines=$(grep -Psi -- "(\\\\[vrms]|\\b${os_id}\\b)" /etc/issue.net | wc -l)"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^issue_net_sysinfo_lines=0$" }
    rationale: &rat-51c8b3806b |
      /etc/issue.net is the banner that network login services such as telnet, and SSH when configured to use it, show before authentication, so it is visible to anyone who can connect. Escape sequences or the OS name in it disclose the operating system and version to unauthenticated remote users. The banner should contain a usage warning instead.
    remediation: &rem-ddc2320e8f |
      Replace the content of /etc/issue.net with a warning text that does not contain escape sequences or the OS name:

      printf '%s\n' 'Authorized users only. All activity may be monitored and reported.' > /etc/issue.net

      Use your organization's approved wording. The check fails if /etc/issue.net does not exist, so create it rather than deleting it.
  - id: "CIS-AMAZON2027-1.7.4-etc_motd_access"
    name: "etc motd access: if [ -e /etc/motd ]; then stat -Lc '%a %U %G' /etc/motd; else echo motd_absent; fi"
    description: "CIS Amazon Linux 2027 benchmark recommendation 1.7.4. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3, 4.1."
    tags: [cis, cis-amazon2027, cis-section-1, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      if [ -e /etc/motd ]; then stat -Lc '%a %U %G' /etc/motd; else echo motd_absent; fi
    allow_rc: any
    expect:
      - { rc: "== 0" }
