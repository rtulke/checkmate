  - id: "CIS-AMAZON2027-6.3.2-aide_scheduled_check"
    name: "aide scheduled check: grep -rEi 'aide[[:space:]]+(--check|--update)' /var/spool/cron/ /etc/crontab /etc/cron.d …"
    description: "CIS Amazon Linux 2027 benchmark recommendation 6.3.2. NIST SP 800-53 Rev. 5: SI-7. CIS Controls v8: 3.14."
    tags: [cis, cis-amazon2027, cis-section-6, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -rEi 'aide[[:space:]]+(--check|--update)' /var/spool/cron/ /etc/crontab /etc/cron.d /etc/cron.hourly /etc/cron.daily /etc/cron.weekly /etc/cron.monthly 2>/dev/null | grep -Ev ':[[:space:]]*#'
      for t in $(systemctl list-unit-files --type=timer --no-legend | awk '{print $1}'); do
        en="$(systemctl is-enabled "$t" 2>/dev/null)"; ac="$(systemctl is-active "$t" 2>/dev/null)"
        [ "$en" = "enabled" ] || [ "$ac" = "active" ] || continue
        s="$(systemctl show -p Unit --value "$t")"; [ -z "$s" ] && s="${t%.timer}.service"
        systemctl cat "$s" 2>/dev/null | grep -Eq 'ExecStart=.*aide[[:space:]]+(--check|--update)' && echo "$t -> $s"
      done
      echo check_complete
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^check_complete$" }
      - { some: "~ (aide[[:space:]]+--(check|update)|\\.timer -\u003e )" }
