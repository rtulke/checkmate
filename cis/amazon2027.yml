    tags: [cis, cis-amazon2027, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      systemctl show -p UnitFileState firewalld | cut -d= -f2
    expect: "~ ^(enabled|enabled-runtime|static|alias|generated)$"
    rationale: *rat-9a34f07397
    remediation: &rem-446eda8ec3 |
      Enable the service firewalld:

      systemctl enable firewalld
  - id: "CIS-AMAZON2027-4.1.3-firewalld-running"
    name: "Service firewalld is running"
    description: "CIS Amazon Linux 2027 benchmark recommendation 4.1.3. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2027, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      systemctl show -p ActiveState firewalld | cut -d= -f2
    expect: "== active"
    rationale: *rat-9a34f07397
    remediation: &rem-a5044d0b79 |
      Start the service firewalld:

      systemctl start firewalld
  - id: "CIS-AMAZON2027-4.1.5-cis_4_1_5_loopback_zone_target"
    name: "cis 4 1 5 loopback zone target: l_zone=\"$(firewall-cmd --get-zone-of-interface=lo 2\u003e\u00261 | xargs)\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 4.1.5. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2027, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      l_zone="$(firewall-cmd --get-zone-of-interface=lo 2>&1 | xargs)"
      l_pzone="$(firewall-cmd --permanent --get-zone-of-interface=lo 2>&1 | xargs)"
      echo "zone:$l_zone"
      echo "permanent_zone:$l_pzone"
      firewall-cmd --list-all --zone="$l_zone" 2>/dev/null | grep -Psi -- '^\h*target:\h+\H+' | xargs
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^target: ACCEPT$" }
      - { some: "~ ^zone:\\S+$" }
      - { some: "~ ^permanent_zone:\\S+$" }
      - { none: "~ zone:no zone" }
    rationale: &rat-715b5e0562 |
      Loopback traffic is used by many local services to talk to each other and must not be filtered, but it should be handled explicitly rather than by accident. Binding the loopback interface to a zone with target ACCEPT, both at runtime and in the permanent configuration, makes the treatment of local traffic part of the documented firewall policy and allows the loopback anti-spoofing rules to be attached to that zone.
    remediation: &rem-5f0b189566 |
      Bind the loopback interface to the trusted zone (target ACCEPT) at runtime and permanently:

      firewall-cmd --zone=trusted --change-interface=lo
      firewall-cmd --permanent --zone=trusted --change-interface=lo
      firewall-cmd --get-zone-of-interface=lo
      firewall-cmd --permanent --get-zone-of-interface=lo

      If NetworkManager manages lo, the permanent zone may need to be set on its connection instead (nmcli connection modify lo connection.zone trusted).
  - id: "CIS-AMAZON2027-4.1.6-cis_4_1_6_loopback_rich_rules"
    name: "cis 4 1 6 loopback rich rules: l_zone=\"$(firewall-cmd --get-zone-of-interface=lo 2\u003e/dev/null | xargs)\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 4.1.6. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2027, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      l_zone="$(firewall-cmd --get-zone-of-interface=lo 2>/dev/null | xargs)"
      echo "Zone: $l_zone"
      firewall-cmd --zone="$l_zone" --list-rich-rules 2>/dev/null | grep -P -- '(::1|127\.0\.0\.0/8)\b' | sed 's/^/runtime: /'
      firewall-cmd --permanent --zone="$l_zone" --list-rich-rules 2>/dev/null | grep -P -- '(::1|127\.0\.0\.0/8)\b' | sed 's/^/permanent: /'
      exit 0
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^Zone: \\S+$" }
      - { some: "~ ^runtime: rule family=\"ipv4\" source address=\"127\\.0\\.0\\.0/8\" destination NOT address=\"127\\.0\\.0\\.0/8\" drop$" }
      - { some: "~ ^runtime: rule family=\"ipv6\" source address=\"::1\" destination NOT address=\"::1\" drop$" }
      - { some: "~ ^permanent: rule family=\"ipv4\" source address=\"127\\.0\\.0\\.0/8\" destination NOT address=\"127\\.0\\.0\\.0/8\" drop$" }
      - { some: "~ ^permanent: rule family=\"ipv6\" source address=\"::1\" destination NOT address=\"::1\" drop$" }
    rationale: &rat-469732ab4a |
      Packets with a loopback source address should only ever originate on the host itself. If such packets arrive on a network interface they are spoofed, typically to reach services that trust localhost. Dropping traffic whose source is 127.0.0.0/8 or ::1 but whose destination is not a loopback address blocks this spoofing for both IPv4 and IPv6.
    remediation: &rem-0e0fa462a3 |
      Add both anti-spoofing rich rules to the zone of the loopback interface, permanently, then reload so they are also active at runtime:

      z="$(firewall-cmd --get-zone-of-interface=lo)"
      firewall-cmd --permanent --zone="$z" --add-rich-rule='rule family="ipv4" source address="127.0.0.0/8" destination NOT address="127.0.0.0/8" drop'
      firewall-cmd --permanent --zone="$z" --add-rich-rule='rule family="ipv6" source address="::1" destination NOT address="::1" drop'
      firewall-cmd --reload

      The loopback interface must be bound to a zone first (see the loopback zone check).
  - id: "CIS-AMAZON2027-4.1.8-cis_4_1_8_default_zone_drop"
    name: "cis 4 1 8 default zone drop: firewall-cmd --get-default-zone"
    description: "CIS Amazon Linux 2027 benchmark recommendation 4.1.8. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2027, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      firewall-cmd --get-default-zone
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^drop$" }
    rationale: &rat-8d44368b77 |
      The default zone applies to every interface and connection that is not explicitly assigned to another zone. With drop as the default, unexpected or newly added interfaces silently discard incoming traffic instead of exposing services, enforcing a deny-by-default policy. Required services must then be allowed explicitly.
    remediation: &rem-c2d05a0b46 |
      Allow the services you need (at least SSH for remote administration) in the drop zone first, then make it the default zone:

      firewall-cmd --permanent --zone=drop --add-service=ssh
      firewall-cmd --reload
      firewall-cmd --set-default-zone=drop

      --set-default-zone takes effect immediately for all interfaces without an explicit zone; check other services and interface bindings beforehand to avoid locking yourself out.
  - id: "CIS-AMAZON2027-4.1.9-iptables-services"
    name: "Package iptables-services is not installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 4.1.9. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2027, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      rpm -q --quiet iptables-services
    expect: false
    rationale: &rat-cf1a8d2a6b |
      iptables-services provides the legacy iptables and ip6tables services that load static rule sets at boot. Running them alongside firewalld or nftables leads to competing rule sets, making the effective filtering unpredictable and possibly opening ports unintentionally. Use a single firewall management tool.
    remediation: &rem-b0b5ea6421 |
      Remove the package iptables-services, unless the system needs it:

      dnf remove iptables-services
  - id: "CIS-AMAZON2027-4.1.9-ufw"
    name: "Package ufw is not installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 4.1.9. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2027, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      rpm -q --quiet ufw
    expect: false
    rationale: &rat-8061e449a6 |
      A host firewall limits which network services are reachable and contains the damage of a compromised neighbour. On Debian and Ubuntu, ufw is the simple front end for managing those rules; where another tool such as firewalld, nftables or iptables is chosen, ufw should be absent, because two firewall managers overwrite each other's rules and leave the effective policy unpredictable.
    remediation: &rem-57d6aea560 |
      Remove the package ufw, unless the system needs it:

      dnf remove ufw
  - id: "CIS-AMAZON2027-4.1.9-cis_4_1_9_nftables_service-enabled"
    name: "Service nftables is not enabled"
    description: "CIS Amazon Linux 2027 benchmark recommendation 4.1.9. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2027, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      systemctl show -p UnitFileState nftables | cut -d= -f2
    expect: "!~ ^enabled"
    rationale: &rat-de44648203 |
      When firewalld manages the host firewall, a separately enabled nftables service loads its own rule set from /etc/sysconfig/nftables.conf at boot. The two rule sets can conflict or flush each other, so the active policy no longer matches what administrators configured in firewalld. Keeping only one firewall service in charge makes the filtering predictable and auditable.
    remediation: &rem-7b07e6f2bd |
      Disable the service nftables, unless the system needs it:

      systemctl disable nftables

      To keep other units from starting it, mask it instead: systemctl mask nftables
  - id: "CIS-AMAZON2027-4.1.9-cis_4_1_9_nftables_service-running"
    name: "Service nftables is not running"
    description: "CIS Amazon Linux 2027 benchmark recommendation 4.1.9. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2027, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      systemctl show -p ActiveState nftables | cut -d= -f2
    expect: "!= active"
    rationale: *rat-de44648203
    remediation: &rem-dee61180b5 |
      Stop the service nftables, unless the system needs it:

      systemctl stop nftables
  - id: "CIS-AMAZON2027-4.1.10-cis_4_1_10_log_denied"
    name: "cis 4 1 10 log denied: firewall-cmd --get-log-denied"
    description: "CIS Amazon Linux 2027 benchmark recommendation 4.1.10. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2027, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      firewall-cmd --get-log-denied
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^(all|unicast|broadcast|multicast)$" }
    rationale: &rat-8188437b56 |
      Logging packets that firewalld rejects or drops gives visibility into port scans, blocked intrusion attempts and misconfigured clients. Without it, denied traffic disappears silently and an incident cannot be reconstructed from the logs. Logging all denied packets can be noisy on exposed hosts, so log volume and rotation should be planned.
    remediation: &rem-1d31b70fab |
      Enable logging of denied packets in firewalld (the setting is permanent and firewalld reloads automatically).

      firewall-cmd --set-log-denied=all

      unicast, broadcast or multicast are also accepted if all is too verbose.
  - id: "CIS-AMAZON2027-4.1.11-cis_4_1_11_icmp_timestamp"
    name: "cis 4 1 11 icmp timestamp: l_fail=\"\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 4.1.11. NIST SP 800-53 Rev. 5: CA-9."
    tags: [cis, cis-amazon2027, cis-section-4, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      l_fail=""
      l_zones="$(firewall-cmd --get-active-zones 2>/dev/null | awk '!/^[[:space:]]/ {print $1}')"
      [ -z "$l_zones" ] && { echo "FAIL - no active zone, interfaces are not assigned to a zone"; l_fail="yes"; }
      for l_zone in $l_zones; do
        [ "$(firewall-cmd --permanent --zone="$l_zone" --get-target)" = "default" ] || continue
        l_inv="$(firewall-cmd --permanent --zone="$l_zone" --query-icmp-block-inversion)"
        l_blocks=" $(firewall-cmd --permanent --zone="$l_zone" --list-icmp-blocks) "
        for l_type in timestamp-request timestamp-reply; do
          if [ "$l_inv" = "yes" ]; then
            echo "$l_blocks" | grep " $l_type " >/dev/null && { echo "FAIL - zone $l_zone allows $l_type"; l_fail="yes"; }
          else
            echo "$l_blocks" | grep " $l_type " >/dev/null || { echo "FAIL - zone $l_zone does not block $l_type"; l_fail="yes"; }
          fi
        done
      done
      [ -z "$l_fail" ] && echo "PASS"
      exit 0
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^PASS$" }
      - { none: "~ FAIL" }
    rationale: &rat-4f2e0089c9 |
      ICMP timestamp requests reveal the system clock of the host, which helps attackers fingerprint the operating system and can weaken time-based protections such as predictable sequence numbers. Normal operation never needs these messages. Blocking timestamp requests and replies in every active firewalld zone removes this information leak; the check also fails if no interface is assigned to an active zone.
    remediation: &rem-24b918ef1f |
      In every active zone with the default target, block ICMP timestamp requests and replies in the permanent configuration and reload firewalld; use the zone names the check reports.

      firewall-cmd --permanent --zone=ZONE --add-icmp-block=timestamp-request
      firewall-cmd --permanent --zone=ZONE --add-icmp-block=timestamp-reply
      firewall-cmd --reload

      If icmp-block-inversion is enabled in the zone, the list is an allow list: remove the two types with --remove-icmp-block instead. If no zone is active, assign the interfaces to a zone first, e.g. firewall-cmd --permanent --zone=public --add-interface=IFACE.
  - id: "CIS-AMAZON2027-5.1.1-sshd_config_perms-attrs"
    name: "/etc/ssh/sshd_config: exists, mode 0600 or stricter, owner root, group root"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/ssh/sshd_config'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
      if [ -n "$(find -H "$f" -maxdepth 0 -perm /7177)" ]; then echo "$f has mode $(stat -L -c %a "$f")"; fi
      case "$(stat -L -c %U "$f")" in 'root') ;; *) echo "$f is owned by $(stat -L -c %U "$f")" ;; esac
      case "$(stat -L -c %G "$f")" in 'root') ;; *) echo "$f has group $(stat -L -c %G "$f")" ;; esac
    expect: empty
    rationale: &rat-fc2827314f |
      sshd_config controls who may log in remotely and how. If unprivileged users could modify it they could enable root login or weaken authentication, and read access reveals details of the security configuration. It should be owned by root and accessible only by root.
    remediation: &rem-714a840007 |
      Create /etc/ssh/sshd_config if it is missing, then set owner root and group root and remove the permissions u-xs,g-rwxs,o-rwx,a-t:

      chown root:root '/etc/ssh/sshd_config'
      chmod u-xs,g-rwxs,o-rwx,a-t '/etc/ssh/sshd_config'
  - id: "CIS-AMAZON2027-5.1.1-sshd_config_d_conf_perms"
    name: "sshd config d conf perms: find /etc/ssh/sshd_config.d/ -type f -name '*.conf' \\( -perm /177 -o ! -user root -o ! -g…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.1. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      find /etc/ssh/sshd_config.d/ -type f -name '*.conf' \( -perm /177 -o ! -user root -o ! -group root \) -printf 'FAIL: %p %m %u %g\n' 2>/dev/null
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-d9f7d80697 |
      Drop-in files in /etc/ssh/sshd_config.d/ control how the SSH server authenticates users, so anyone who can modify one can enable root login or weaker authentication. Readable files also disclose security settings. Restricting them to owner and group root with mode 0600 ensures that only root can change or read the SSH server configuration.
    remediation: &rem-3a3ac378c6 |
      Make every .conf file the check reports owned by root:root and readable and writable only by root.

      chown root:root FILE
      chmod u-x,go-rwx FILE
  - id: "CIS-AMAZON2027-5.1.2-sshd_config_d_dir_perms"
    name: "sshd config d dir perms: find /etc/ssh/sshd_config.d/ -maxdepth 0 \\( ! -user root -o ! -group root -o -perm /077 \\…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      find /etc/ssh/sshd_config.d/ -maxdepth 0 \( ! -user root -o ! -group root -o -perm /077 \) -printf 'FAIL: %p %m %u %g\n'
      echo "scan_rc=$?"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_rc=0$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-3f0321e232 |
      The sshd_config.d directory decides which drop-in files the SSH server loads. If other users can write to it, they can add a file that overrides authentication settings; if they can list it, they learn the configuration layout. Owning it by root:root with no group or other permissions keeps control of the SSH configuration with root.
    remediation: &rem-139cb906e4 |
      Set owner, group and mode of the directory (create it if it is missing).

      mkdir -p /etc/ssh/sshd_config.d
      chown root:root /etc/ssh/sshd_config.d
      chmod 0700 /etc/ssh/sshd_config.d
  - id: "CIS-AMAZON2027-5.1.3-ssh_host_private_key_access"
    name: "ssh host private key access: l_ssh_group=\"\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.3. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      l_ssh_group=""
      grep -Psiq -- '^\h*ID_LIKE="?([^#\n\r]+)?\bfedora\b' /etc/os-release 2>/dev/null && grep -Psq -- '^ssh_keys\b' /etc/group 2>/dev/null && l_ssh_group="ssh_keys"
      sshd -T 2>/dev/null | awk 'tolower($1)=="hostkey"{print $2}' | while IFS= read -r l_file; do
        ssh-keygen -lf "$l_file" >/dev/null 2>&1 || continue
        echo "checked: $l_file"
        stat -Lc '%#a:%U:%G' "$l_file" | while IFS=: read -r l_mode l_owner l_group; do
          if [ "$l_group" = "$l_ssh_group" ]; then l_mask="0137"; else l_mask="0177"; fi
          if [ $(( l_mode & l_mask )) -gt 0 ] || [ "$l_owner" != "root" ] || { [ "$l_group" != "$l_ssh_group" ] && [ "$l_group" != "root" ]; }; then
            echo "FAIL: $l_file mode $l_mode owner $l_owner group $l_group"
          fi
        done
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^checked: " }
      - { none: "~ ^FAIL:" }
    rationale: &rat-4bc70e70de |
      SSH host private keys prove the identity of the server to clients. Anyone who can read them can impersonate the server and intercept connections without triggering host key warnings. They must be owned by root and readable only by root, or on Red Hat style systems additionally by the ssh_keys group used by the key helper.
    remediation: &rem-02060d6367 |
      Fix ownership and permissions of each private key the check reports.

      chown root:root FILE
      chmod 0600 FILE

      On systems with an ssh_keys group (RHEL, Fedora-based) root:ssh_keys with mode 0640 is also accepted. The check needs at least one valid host key; if none exists, create them with ssh-keygen -A.
  - id: "CIS-AMAZON2027-5.1.4-ssh_host_public_key_access"
    name: "ssh host public key access: sshd -T 2\u003e/dev/null | awk 'tolower($1)==\"hostkey\"{print $2}' | while IFS= read -r l_key; …"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.4. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | awk 'tolower($1)=="hostkey"{print $2}' | while IFS= read -r l_key; do
        l_file="${l_key}.pub"
        ssh-keygen -lf "$l_file" >/dev/null 2>&1 || continue
        echo "checked: $l_file"
        stat -Lc '%#a:%U:%G' "$l_file" | while IFS=: read -r l_mode l_owner l_group; do
          if [ $(( l_mode & 0133 )) -gt 0 ] || [ "$l_owner" != "root" ] || [ "$l_group" != "root" ]; then
            echo "FAIL: $l_file mode $l_mode owner $l_owner group $l_group"
          fi
        done
      done
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^checked: " }
      - { none: "~ ^FAIL:" }
    rationale: &rat-b95a33507a |
      Host public keys are distributed to clients to verify the server. They may be readable by everyone, but if a non-root user can replace them, clients may be given a wrong key and trust a rogue server, and verification records become unreliable. Ownership by root:root and mode 0644 or stricter prevents tampering.
    remediation: &rem-5b49bb4492 |
      Fix ownership and permissions of each public key the check reports.

      chown root:root FILE
      chmod u-x,go-wx FILE
  - id: "CIS-AMAZON2027-5.1.5-no_weak_ssh_ciphers"
    name: "no weak ssh ciphers: l_offered=\"$(sshd -T 2\u003e/dev/null | awk 'tolower($1)==\"ciphers\"{print $2}')\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.5. NIST SP 800-53 Rev. 5: SC-8. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      l_offered="$(sshd -T 2>/dev/null | awk 'tolower($1)=="ciphers"{print $2}')"
      [ -n "$l_offered" ] && echo "ciphers_offered"
      printf '%s\n' "$l_offered" | tr ',' '\n' | grep -Fx -e 3des-cbc -e blowfish-cbc -e cast128-cbc -e aes128-cbc -e aes192-cbc -e aes256-cbc -e arcfour -e arcfour128 -e arcfour256 -e rijndael-cbc@lysator.liu.se | sed 's/^/WEAK: /'
      true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^ciphers_offered$" }
      - { none: "~ ^WEAK:" }
    rationale: &rat-77a6850889 |
      Ciphers such as 3DES, Blowfish, CAST128, RC4 (arcfour) and the CBC modes have known weaknesses that allow plaintext recovery or make traffic analysis easier. Offering them lets an attacker or an outdated client negotiate a weak session. Some variants also exclude chacha20-poly1305, which is affected by the Terrapin prefix truncation attack on unpatched peers.
    remediation: &rem-1c18fae547 |
      Remove the weak ciphers from the SSH server. On RHEL and Amazon Linux sshd takes its algorithms from the system crypto policy, so add a policy module that drops them, and remove or correct any explicit Ciphers line in /etc/ssh/sshd_config or /etc/ssh/sshd_config.d/*.conf that still lists CBC, arcfour or chacha20 ciphers.

      echo 'cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC -CHACHA20-POLY1305' > /etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod
      update-crypto-policies --set DEFAULT:NO-SSHWEAKCIPHERS
      systemctl restart sshd

      --set replaces the whole policy: keep the modules already in use (update-crypto-policies --show) and list all of them together, e.g. DEFAULT:NO-SHA1:NO-SSHWEAKCIPHERS:NO-SSHWEAKMACS.
  - id: "CIS-AMAZON2027-5.1.6-no_weak_ssh_kex"
    name: "no weak ssh kex: l_offered=\"$(sshd -T 2\u003e/dev/null | awk 'tolower($1)==\"kexalgorithms\"{print $2}')\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.6. NIST SP 800-53 Rev. 5: SC-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      l_offered="$(sshd -T 2>/dev/null | awk 'tolower($1)=="kexalgorithms"{print $2}')"
      [ -n "$l_offered" ] && echo "kexalgorithms_offered"
      printf '%s\n' "$l_offered" | tr ',' '\n' | grep -Fx -e diffie-hellman-group1-sha1 -e diffie-hellman-group14-sha1 -e diffie-hellman-group-exchange-sha1 | sed 's/^/WEAK: /'
      true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^kexalgorithms_offered$" }
      - { none: "~ ^WEAK:" }
    rationale: &rat-feabaefb53 |
      Key exchange methods based on SHA-1 or on the 1024-bit Diffie-Hellman group 1 no longer provide adequate security: SHA-1 is vulnerable to collision attacks and small groups can be precomputed by well-resourced attackers. If the server offers them, a session key can be negotiated with a weak method, undermining the confidentiality of the whole connection.
    remediation: &rem-2a1cbf9cbe |
      Disable the SHA-1 key exchange methods. On RHEL and Amazon Linux sshd follows the system crypto policy; the NO-SHA1 module removes SHA-1 from it. Also remove any explicit KexAlgorithms line in /etc/ssh/sshd_config or /etc/ssh/sshd_config.d/*.conf that lists the sha1 methods.

      update-crypto-policies --set DEFAULT:NO-SHA1
      systemctl restart sshd

      NO-SHA1 also disables SHA-1 signatures system-wide, which can break very old clients and keys. --set replaces the whole policy: combine it with modules already in use (update-crypto-policies --show).
  - id: "CIS-AMAZON2027-5.1.7-no_weak_ssh_macs"
    name: "no weak ssh macs: l_offered=\"$(sshd -T 2\u003e/dev/null | awk 'tolower($1)==\"macs\"{print $2}')\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.7. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      l_offered="$(sshd -T 2>/dev/null | awk 'tolower($1)=="macs"{print $2}')"
      [ -n "$l_offered" ] && echo "macs_offered"
      printf '%s\n' "$l_offered" | tr ',' '\n' | grep -Fx -e hmac-md5 -e hmac-md5-96 -e hmac-ripemd160 -e hmac-sha1-96 -e umac-64@openssh.com -e hmac-md5-etm@openssh.com -e hmac-md5-96-etm@openssh.com -e hmac-ripemd160-etm@openssh.com -e hmac-sha1-96-etm@openssh.com -e umac-64-etm@openssh.com | sed 's/^/WEAK: /'
      true
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^macs_offered$" }
      - { none: "~ ^WEAK:" }
    rationale: &rat-740cca9bb0 |
      Message authentication codes protect SSH traffic against tampering. MD5, RIPEMD-160, truncated SHA-1 (96-bit) and the 64-bit UMAC tags are weak or too short to resist forgery reliably. If the server offers them, a connection may be protected by a weak integrity check. Some variants also exclude umac-128-etm@openssh.com.
    remediation: &rem-02d64e9ca2 |
      Remove the weak MACs from the SSH server. On RHEL and Amazon Linux sshd follows the system crypto policy, so add a policy module that drops them, and remove or correct any explicit MACs line in /etc/ssh/sshd_config or /etc/ssh/sshd_config.d/*.conf that lists them.

      echo 'mac@SSH = -HMAC-MD5 -UMAC-64 -UMAC-128' > /etc/crypto-policies/policies/modules/NO-SSHWEAKMACS.pmod
      update-crypto-policies --set DEFAULT:NO-SSHWEAKMACS
      systemctl restart sshd

      --set replaces the whole policy: keep the modules already in use (update-crypto-policies --show) and list all of them together, e.g. DEFAULT:NO-SHA1:NO-SSHWEAKCIPHERS:NO-SSHWEAKMACS.
  - id: "CIS-AMAZON2027-5.1.8-sshd_access_limited"
    name: "SSH access is limited with AllowUsers, AllowGroups, DenyUsers or DenyGroups"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.8. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Ei '^(allow|deny)(users|groups) +[^ ]'
    allow_rc: any
    expect: { some: "~ ." }
    rationale: &rat-8e5700f652 |
      Restricting SSH logins to explicitly allowed users or groups ensures that only accounts with a need for remote access can log in, even if other accounts have valid credentials or weak passwords. It limits the impact of compromised, forgotten or service accounts.
    remediation: &rem-804a07286e |
      Restrict SSH logins to the users or groups that need them with AllowUsers, AllowGroups, DenyUsers or DenyGroups, according to site policy. Set the directive in the global section of the sshd configuration (in /etc/ssh/sshd_config before any Match block, or in a file in /etc/ssh/sshd_config.d/ where the distribution includes that directory), then validate and reload the SSH service.

      echo 'AllowGroups GROUP' > /etc/ssh/sshd_config.d/10-access.conf
      sshd -t

      When both AllowUsers and AllowGroups are set, a user must match both lists. Make sure your own administrative account is allowed before reloading.
  - id: "CIS-AMAZON2027-5.1.9-sshd_banner_content"
    name: "sshd banner content: l_banner=\"$(sshd -T 2\u003e/dev/null | awk 'tolower($1) == \"banner\" {print $2}')\""
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.9. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      l_banner="$(sshd -T 2>/dev/null | awk 'tolower($1) == "banner" {print $2}')"
      l_os_id="$(awk -F= '$1=="ID"{gsub(/"/,"",$2); print $2}' /etc/os-release)"
      [ -n "$l_os_id" ] || l_os_id="rhel"
      grep -Psi -- '(\\v|\\r|\\m|\\s|\b'"$l_os_id"'\b)' "$l_banner"
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-d3f6ebea05 |
      A login banner states that access is restricted and monitored, which supports legal action against misuse. It must not reveal the operating system, release, kernel version or architecture: escape sequences such as \m, \r, \s and \v, or the distribution name, give attackers information for picking exploits before they have even authenticated.
    remediation: &rem-143d60166b |
      Replace the content of the file that the SSH Banner option points to with a site-approved warning that contains no escape sequences (\m, \r, \s, \v) and no operating system name.

      sshd -T | grep -i '^banner'
      echo 'Authorized users only. All activity may be monitored and reported.' > /etc/issue.net

      The example assumes the banner file is /etc/issue.net. On Amazon Linux the check also fails when no banner is configured (see the Banner setting).
  - id: "CIS-AMAZON2027-5.1.9-sshd_banner_live"
    name: "sshd banner live: sshd -T 2\u003e/dev/null | grep -Pi -- '^banner\\h+\\/\\H+'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.9. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Pi -- '^banner\h+\/\H+'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^banner \\/\\S+" }
    rationale: &rat-07b8c93cf3 |
      Displaying a warning banner before SSH authentication informs users that access is restricted and monitored. This removes any claim of ignorance and supports disciplinary or legal action after misuse. The SSH server only shows a banner when the Banner option points to a file.
    remediation: &rem-86c7efc6ca |
      Point the Banner option to a file with the site-approved warning text.

      echo 'Banner /etc/issue.net' > /etc/ssh/sshd_config.d/00-banner.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any Banner line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. Keep /etc/issue.net free of OS details.
  - id: "CIS-AMAZON2027-5.1.10-sshd_clientalive_live"
    name: "sshd clientalive live: sshd -T 2\u003e/dev/null | grep -Pi -- '^(clientaliveinterval|clientalivecountmax)\\h'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.10. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -Pi -- '^(clientaliveinterval|clientalivecountmax)\h'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^clientaliveinterval [1-9][0-9]*$" }
      - { some: "~ (?i)^clientalivecountmax [1-9][0-9]*$" }
    rationale: &rat-87e45da1d2 |
      Idle or abandoned SSH sessions remain open indefinitely and can be taken over at an unattended terminal; dead connections also keep resources allocated. ClientAliveInterval makes the server probe the client regularly and ClientAliveCountMax ends the session after a limited number of unanswered probes, so broken or unresponsive sessions are closed.
    remediation: &rem-2064d83c5c |
      Set a client alive interval of 900 seconds or less and a count of 1 to 4.

      printf '%s\n' 'ClientAliveInterval 15' 'ClientAliveCountMax 3' > /etc/ssh/sshd_config.d/00-clientalive.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any ClientAlive* line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-AMAZON2027-5.1.11-ssh_disable_forward_live"
    name: "ssh disable forward live: sshd -T 2\u003e/dev/null | grep -i -- '^disableforwarding\\s'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.11. NIST SP 800-53 Rev. 5: CM-7. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      sshd -T 2>/dev/null | grep -i -- '^disableforwarding\s'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^disableforwarding yes$" }
    rationale: &rat-8b93e4836f |
      SSH forwarding (TCP port, agent, X11 and stream local forwarding) lets users tunnel arbitrary traffic through the server, bypassing firewalls and network monitoring, or expose their agent to a compromised host. DisableForwarding turns off all forwarding types at once. Systems where users legitimately need tunnels should handle this as a documented exception.
    remediation: &rem-e3a56c9870 |
      Disable all forwarding in the SSH server.

      echo 'DisableForwarding yes' > /etc/ssh/sshd_config.d/00-disableforwarding.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any DisableForwarding line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-AMAZON2027-5.1.12-ssh_gssapi_live"
    name: "ssh gssapi live: sshd -T 2\u003e/dev/null | grep -i -- '^gssapiauthentication\\s'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.12. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 4.8."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      sshd -T 2>/dev/null | grep -i -- '^gssapiauthentication\s'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^gssapiauthentication no$" }
    rationale: &rat-04dcf46ac5 |
      GSSAPI authentication is used for Kerberos single sign-on. When it is not needed, it adds code and complexity to the authentication path and an additional mechanism that has to be secured and monitored. Disabling it reduces the attack surface of the SSH server; hosts that rely on Kerberos logins are a legitimate exception.
    remediation: &rem-2f822456ce |
      Disable GSSAPI authentication in the SSH server.

      echo 'GSSAPIAuthentication no' > /etc/ssh/sshd_config.d/00-gssapi.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any GSSAPIAuthentication line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead. On RHEL the vendor drop-in 50-redhat.conf enables it, so the 00- file must sort before it.
  - id: "CIS-AMAZON2027-5.1.13-ssh_hostbased_auth_live"
    name: "ssh hostbased auth live: sshd -T 2\u003e/dev/null | grep -i -- '^hostbasedauthentication\\s'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.13. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i -- '^hostbasedauthentication\s'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^hostbasedauthentication no$" }
    rationale: &rat-10e0cd6826 |
      Host-based authentication trusts a user because of the client host they connect from, using .rhosts, shosts.equiv or known host keys. A single compromised or spoofed client host then grants access to accounts on the server without individual credentials. Disabling it forces each user to authenticate personally.
    remediation: &rem-5a00c40bd5 |
      Disable host-based authentication in the SSH server.

      echo 'HostbasedAuthentication no' > /etc/ssh/sshd_config.d/00-hostbasedauth.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any HostbasedAuthentication line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-AMAZON2027-5.1.14-ssh_rhosts_live"
    name: "ssh rhosts live: sshd -T 2\u003e/dev/null | grep -i -- '^ignorerhosts\\s'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.14. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i -- '^ignorerhosts\s'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^ignorerhosts yes$" }
    rationale: &rat-208615ee5e |
      The legacy .rhosts and .shosts files let users grant password-less access to their account from other hosts. Such trust relationships are hard to audit and easy to abuse once one host is compromised. Setting IgnoreRhosts makes the SSH server disregard these files for authentication.
    remediation: &rem-be3c8ee8f7 |
      Make the SSH server ignore .rhosts and .shosts files.

      echo 'IgnoreRhosts yes' > /etc/ssh/sshd_config.d/00-ignorerhosts.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any IgnoreRhosts line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-AMAZON2027-5.1.15-ssh_logingrace_live"
    name: "ssh logingrace live: sshd -T 2\u003e/dev/null | grep -i -- '^logingracetime\\s'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.15. NIST SP 800-53 Rev. 5: CM-6. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i -- '^logingracetime\s'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^logingracetime ([1-9]|[1-5][0-9]|60)$" }
    rationale: &rat-82827b7520 |
      LoginGraceTime limits how long an unauthenticated connection may stay open. A long grace period lets attackers hold many half-open connections and exhaust the server's connection slots, or spend more time on each guessing attempt. A limit of one minute or less still leaves enough time for legitimate logins.
    remediation: &rem-9451437f62 |
      Set the login grace time to 60 seconds or less.

      echo 'LoginGraceTime 60' > /etc/ssh/sshd_config.d/00-logingracetime.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any LoginGraceTime line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-AMAZON2027-5.1.16-ssh_loglevel_live"
    name: "ssh loglevel live: sshd -T 2\u003e/dev/null | grep -i -- '^loglevel\\s'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.16. NIST SP 800-53 Rev. 5: AU-12, AU-3, SI-5. CIS Controls v8: 8.2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i -- '^loglevel\s'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^loglevel (VERBOSE|INFO)$" }
    rationale: &rat-1456734810 |
      SSH logs are the primary record of who logged in, from where and with which key. INFO records logins and logouts, and VERBOSE additionally records the key fingerprint used, which is valuable for incident investigation. Lower levels lose this information, while DEBUG produces excessive output and may log sensitive details.
    remediation: &rem-27ea57d275 |
      Set the SSH server log level to VERBOSE (INFO is also accepted).

      echo 'LogLevel VERBOSE' > /etc/ssh/sshd_config.d/00-loglevel.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any LogLevel line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-AMAZON2027-5.1.17-sshd_authtries_live"
    name: "sshd authtries live: sshd -T 2\u003e/dev/null | grep -i -- '^maxauthtries\\s'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.17. NIST SP 800-53 Rev. 5: AU-3. CIS Controls v8: 8.5."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i -- '^maxauthtries\s'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^maxauthtries [1-4]$" }
    rationale: &rat-5f11c85db3 |
      MaxAuthTries limits how many authentication attempts a client may make on a single connection. A low limit slows down online password guessing and causes failed attempts to be logged sooner, which helps detection. A value of four or less still tolerates a few mistyped passwords or offered keys.
    remediation: &rem-9a6dc14261 |
      Set MaxAuthTries to 4 or less.

      echo 'MaxAuthTries 4' > /etc/ssh/sshd_config.d/00-maxauthtries.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any MaxAuthTries line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-AMAZON2027-5.1.18-ssh_maxstartups_live"
    name: "ssh maxstartups live: sshd -T 2\u003e/dev/null | awk 'tolower($1) == \"maxstartups\" {split($2, a, \":\"); if (a[1] \u003e 10…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.18. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | awk 'tolower($1) == "maxstartups" {split($2, a, ":"); if (a[1] > 10 || a[2] > 30 || a[3] > 60) print "FAIL: " $0; else print "maxstartups_ok"}'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^maxstartups_ok$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-a5f0c9c489 |
      MaxStartups controls how many unauthenticated connections the SSH server accepts concurrently and when it starts dropping new ones at random. Without a limit an attacker can open many pending connections and deny access to legitimate users. The value 10:30:60 starts random drops at 10 pending connections and refuses all beyond 60.
    remediation: &rem-f1caa80b39 |
      Set MaxStartups to 10:30:60 (or stricter values).

      echo 'MaxStartups 10:30:60' > /etc/ssh/sshd_config.d/00-maxstartups.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any MaxStartups line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-AMAZON2027-5.1.19-ssh_maxsessions_config"
    name: "ssh maxsessions config: grep -Psi -- '^\\h*MaxSessions\\h+\\\"?(1[1-9]|[2-9][0-9]|[1-9][0-9][0-9]+)\\b' /etc/ssh/sshd_…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.19. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -Psi -- '^\h*MaxSessions\h+\"?(1[1-9]|[2-9][0-9]|[1-9][0-9][0-9]+)\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
    allow_rc: any
    expect:
      - { rc: "in [1, 2]" }
      - { none: "~ ." }
    rationale: &rat-56314b11ec |
      MaxSessions caps the number of shell, login or subsystem sessions multiplexed over one SSH connection. A high limit lets a single authenticated connection consume many resources and makes abuse harder to spot. This check ensures no configuration file sets the limit above 10.
    remediation: &rem-2f10836f81 |
      Change every MaxSessions line in the SSH server configuration that sets a value above 10 to 10 or less.

      grep -Pin '^\h*MaxSessions\h' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
      echo 'MaxSessions 10' > /etc/ssh/sshd_config.d/00-maxsessions.conf
      sshd -t && systemctl reload sshd

      Edit or remove the lines found by grep that set a higher value; the check fails as long as any of them remains.
  - id: "CIS-AMAZON2027-5.1.19-ssh_maxsessions_live"
    name: "ssh maxsessions live: sshd -T 2\u003e/dev/null | grep -i -- '^maxsessions\\s'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.19. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i -- '^maxsessions\s'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^maxsessions ([1-9]|10)$" }
    rationale: &rat-0bd3db16a6 |
      MaxSessions caps the number of sessions multiplexed over one SSH connection. Limiting it to 10 or less keeps a single authenticated connection from consuming excessive resources and reduces the impact of a hijacked connection.
    remediation: &rem-ce9b3952eb |
      Set MaxSessions to 10 or less.

      echo 'MaxSessions 10' > /etc/ssh/sshd_config.d/00-maxsessions.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any MaxSessions line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-AMAZON2027-5.1.20-ssh_empty_passwd_live"
    name: "ssh empty passwd live: sshd -T 2\u003e/dev/null | grep -i -- '^permitemptypasswords\\s'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.20. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i -- '^permitemptypasswords\s'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^permitemptypasswords no$" }
    rationale: &rat-4c6c617237 |
      If the SSH server accepts accounts with an empty password, anyone who knows or guesses such an account name can log in remotely without any secret. PermitEmptyPasswords no rejects these logins even if an account accidentally ends up without a password.
    remediation: &rem-b2fd13ed6b |
      Disallow logins with empty passwords.

      echo 'PermitEmptyPasswords no' > /etc/ssh/sshd_config.d/00-permitemptypasswords.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any PermitEmptyPasswords line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-AMAZON2027-5.1.21-ssh_permit_root_live"
    name: "ssh permit root live: sshd -T 2\u003e/dev/null | grep -i -- '^permitrootlogin\\s'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.21. NIST SP 800-53 Rev. 5: AC-6. CIS Controls v8: 5.4."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i -- '^permitrootlogin\s'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^permitrootlogin no$" }
    rationale: &rat-f7faa98a32 |
      Direct root login over SSH exposes the most powerful account to password guessing and makes it impossible to tell from the logs which administrator acted. Requiring administrators to log in with a personal account and then use sudo or su provides accountability and an extra barrier. Make sure a non-root administrative account works before disabling root login.
    remediation: &rem-ac34626202 |
      Disable root login over SSH.

      echo 'PermitRootLogin no' > /etc/ssh/sshd_config.d/00-permitrootlogin.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any PermitRootLogin line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead. Verify that another administrative account can log in and use sudo first.
  - id: "CIS-AMAZON2027-5.1.22-ssh_userenv_live"
    name: "ssh userenv live: sshd -T 2\u003e/dev/null | grep -i -- '^permituserenvironment\\s'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.22. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i -- '^permituserenvironment\s'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^permituserenvironment no$" }
    rationale: &rat-073f0b3d12 |
      PermitUserEnvironment lets users pass environment variables to the SSH server through ~/.ssh/environment or authorized_keys options. Variables such as LD_PRELOAD or PATH can be used to bypass restrictions like forced commands or to run code in unintended ways. Disabling it keeps the session environment under administrator control.
    remediation: &rem-c975a850e3 |
      Disable user-supplied environment variables in the SSH server.

      echo 'PermitUserEnvironment no' > /etc/ssh/sshd_config.d/00-permituserenvironment.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any PermitUserEnvironment line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-AMAZON2027-5.1.23-ssh_usepam_live"
    name: "ssh usepam live: sshd -T 2\u003e/dev/null | grep -i -- '^usepam\\s'"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.1.23. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5. CIS Controls v8: 4.1."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      sshd -T 2>/dev/null | grep -i -- '^usepam\s'
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ (?i)^usepam yes$" }
    rationale: &rat-79595c4433 |
      With UsePAM enabled, SSH logins pass through the PAM account and session stacks, which enforce account expiry, lockout after failed attempts, resource limits and session logging. Without PAM these controls are bypassed for SSH, even if they are configured correctly for local logins.
    remediation: &rem-abacb17da8 |
      Enable PAM for the SSH server.

      echo 'UsePAM yes' > /etc/ssh/sshd_config.d/00-usepam.conf
      sshd -t && systemctl reload sshd

      sshd uses the first value it reads, so remove or correct any UsePAM line read earlier (in sshd_config before the Include line or in a drop-in that sorts first); sshd -T shows the effective value. On RHEL 8, which does not read sshd_config.d, set it in /etc/ssh/sshd_config above any Match block instead.
  - id: "CIS-AMAZON2027-5.2.1-sudo"
    name: "Package sudo is installed"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.1. NIST SP 800-53 Rev. 5: AC-6. CIS Controls v8: 5.4."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      rpm -q --quiet sudo
    expect: true
    rationale: &rat-f5f9e1cba7 |
      sudo lets administrators run privileged commands with their own credentials instead of a shared root password. That gives individual accountability, fine-grained permissions and a log of every privileged command.
    remediation: &rem-9822b7a6a6 |
      Install the package sudo:

      dnf install sudo
  - id: "CIS-AMAZON2027-5.2.2-sudoers_files_access"
    name: "sudoers files access: find /etc/sudoers /etc/sudoers.d/ -type f \\( -perm /0337 -o ! -user root -o ! -group root…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.2. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      find /etc/sudoers /etc/sudoers.d/ -type f \( -perm /0337 -o ! -user root -o ! -group root \) -printf 'FAIL: %p %m %u %g\n'
      echo "scan_rc=$?"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_rc=0$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-a9ec2ff046 |
      The sudoers files define who may run which commands as root. If anyone other than root can modify them, that user can grant themselves full privileges; readable files also show attackers which accounts and commands to target. Owner and group root with mode 0440 or stricter protects this policy.
    remediation: &rem-07790038fb |
      Fix ownership and permissions of each file the check reports.

      chown root:root FILE
      chmod 0440 FILE

      Run visudo -c afterwards to confirm the sudo configuration is still valid.
  - id: "CIS-AMAZON2027-5.2.3-sudoers_d_dir_access"
    name: "sudoers d dir access: find /etc/sudoers.d -maxdepth 0 -type d \\( -perm /0027 -o ! -user root -o ! -group root \\…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.3. NIST SP 800-53 Rev. 5: AC-3, MP-2."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      find /etc/sudoers.d -maxdepth 0 -type d \( -perm /0027 -o ! -user root -o ! -group root \) -printf 'FAIL: %p %m %u %g\n'
      echo "scan_rc=$?"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_rc=0$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-a628b3da09 |
      Every file placed in /etc/sudoers.d becomes part of the sudo policy. If non-root users can write to the directory, they can drop in a rule granting themselves root access. Ownership by root:root and no write or other access beyond mode 0750 keeps the directory under root's control.
    remediation: &rem-df761a90c7 |
      Set owner, group and mode of the directory.

      chown root:root /etc/sudoers.d
      chmod 0750 /etc/sudoers.d
  - id: "CIS-AMAZON2027-5.2.4-pty_sudoers_d_not_disabled"
    name: "pty sudoers d not disabled: grep -rPi -- '^\\h*Defaults\\h+([^#\\n\\r]+,\\h*)?!use_pty\\b' /etc/sudoers /etc/sudoers.d/"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.4. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -rPi -- '^\h*Defaults\h+([^#\n\r]+,\h*)?!use_pty\b' /etc/sudoers /etc/sudoers.d/
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-93dba38922 |
      With use_pty, sudo runs commands in a separate pseudo-terminal. This prevents a process started with sudo, or one it leaves running in the background, from injecting keystrokes into the user's terminal after the command has finished. Disabling it with !use_pty removes this protection.
    remediation: &rem-9cfed4d5a0 |
      Remove !use_pty from every Defaults line the check finds; edit each file with visudo so syntax errors are caught.

      grep -rPin '^\h*Defaults\h+([^#\n\r]+,\h*)?!use_pty\b' /etc/sudoers /etc/sudoers.d/
      visudo -f FILE

      If use_pty is not the default of the installed sudo version, also add Defaults use_pty.
  - id: "CIS-AMAZON2027-5.2.5-log_sudoers_d"
    name: "log sudoers d: grep -rPsi -- '^\\h*Defaults\\h+([^#\\n\\r]+,\\h*)?logfile\\h*=\\h*\\S+' /etc/sudoers /etc/sudoer…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.5. NIST SP 800-53 Rev. 5: AU-12, AU-3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -rPsi -- '^\h*Defaults\h+([^#\n\r]+,\h*)?logfile\h*=\h*\S+' /etc/sudoers /etc/sudoers.d/
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ logfile\\s*=" }
    rationale: &rat-73ffb83e75 |
      A dedicated sudo log file records every sudo invocation with user, terminal, working directory and command. That makes privileged activity easy to review and keeps the record separate from general system logs.
    remediation: &rem-b7aaa6ded0 |
      Configure a dedicated sudo log file under /var/log in a Defaults line of its own and validate the syntax.

      echo 'Defaults logfile="/var/log/sudo.log"' > /etc/sudoers.d/50-logfile
      chmod 0440 /etc/sudoers.d/50-logfile
      visudo -c
  - id: "CIS-AMAZON2027-5.2.6-nopasswd_sudoers_d"
    name: "nopasswd sudoers d: grep -r \"^[^#].*NOPASSWD\" /etc/sudoers /etc/sudoers.d/"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.6. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-2, cis-server, cis-level2-server]
    severity: low
    run: |
      grep -r "^[^#].*NOPASSWD" /etc/sudoers /etc/sudoers.d/
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-eecb763928 |
      NOPASSWD lets users run commands with elevated privileges without entering their password. Anyone who gains access to such an account, or a process running as it, obtains root immediately. Requiring the password confirms the person and limits the impact of a hijacked session.
    remediation: &rem-a35cd5880e |
      Review every listed sudo rule with NOPASSWD and remove the tag (or the rule) unless a documented exception applies. Edit the files with visudo so syntax errors are caught.

      grep -rn NOPASSWD /etc/sudoers /etc/sudoers.d/
      visudo -f FILE

      Users who lose NOPASSWD need a password to use sudo. On cloud images the default user (for example via /etc/sudoers.d/90-cloud-init-users) often has none; set one first, or you may lose administrative access.
  - id: "CIS-AMAZON2027-5.2.7-authenticate_sudoers"
    name: "authenticate sudoers: grep -r '^[^#].*!authenticate' /etc/sudoers /etc/sudoers.d/"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.7. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -r '^[^#].*!authenticate' /etc/sudoers /etc/sudoers.d/
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-0aa92719bf |
      The !authenticate option lets sudo run commands without asking for the user's password. Anyone who gets hold of an unlocked session or a compromised account of such a user can then act with elevated privileges without any further barrier. Requiring re-authentication for sudo keeps privilege escalation tied to knowledge of the password.
    remediation: &rem-f4fb208b6d |
      Remove the !authenticate option from every sudoers rule and Defaults line reported by the check. Edit each file with visudo so that the syntax is validated before it is saved.

      grep -rn '!authenticate' /etc/sudoers /etc/sudoers.d/
      visudo -f /etc/sudoers
      visudo -f /etc/sudoers.d/FILE

      Affected users will be asked for their password again when they use sudo.
  - id: "CIS-AMAZON2027-5.2.8-sudo_pwfeedback"
    name: "sudo pwfeedback: grep -rPi -- '^\\h*Defaults\\h+([^#\\n\\r]+,\\h*)?pwfeedback\\b' /etc/sudoers /etc/sudoers.d/"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.8. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -rPi -- '^\h*Defaults\h+([^#\n\r]+,\h*)?pwfeedback\b' /etc/sudoers /etc/sudoers.d/
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-a04ad51927 |
      The pwfeedback option makes sudo print an asterisk for each typed password character. This reveals the password length to anyone watching the screen or recording the session, and the option was the source of a serious buffer overflow in older sudo versions. Without it, the password prompt gives no feedback.
    remediation: &rem-d1a83f077e |
      Remove pwfeedback from every Defaults line the check finds; edit each file with visudo.

      grep -rPin '^\h*Defaults\h+([^#\n\r]+,\h*)?pwfeedback\b' /etc/sudoers /etc/sudoers.d/
      visudo -f FILE
  - id: "CIS-AMAZON2027-5.2.9-sudo_visiblepw"
    name: "sudo visiblepw: grep -rPi -- '^\\h*Defaults\\h+([^#\\n\\r]+,\\h*)?visiblepw\\b' /etc/sudoers /etc/sudoers.d/"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.9. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -rPi -- '^\h*Defaults\h+([^#\n\r]+,\h*)?visiblepw\b' /etc/sudoers /etc/sudoers.d/
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-878e275480 |
      By default sudo refuses to ask for a password when it cannot disable echo on the terminal, for example in some scripts or remote command executions. The visiblepw option overrides this, so the password may be shown on screen or end up in logs and terminal recordings.
    remediation: &rem-7a32702704 |
      Remove visiblepw from every Defaults line the check finds; edit each file with visudo.

      grep -rPin '^\h*Defaults\h+([^#\n\r]+,\h*)?visiblepw\b' /etc/sudoers /etc/sudoers.d/
      visudo -f FILE
  - id: "CIS-AMAZON2027-5.2.10-sudo_timeout"
    name: "sudo timeout: grep -rhoPi -- '^[^#\\n\\r]*timestamp_timeout\\h*=\\h*\\K-?[0-9.]+' /etc/sudoers /etc/sudoers.…"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.10. NIST SP 800-53 Rev. 5: IA-11."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -rhoPi -- '^[^#\n\r]*timestamp_timeout\h*=\h*\K-?[0-9.]+' /etc/sudoers /etc/sudoers.d/ | awk '{ if ($1 < 0 || $1 > 15) print "FAIL: timestamp_timeout=" $1 }'
      echo "scan_done"
    allow_rc: any
    expect:
      - { rc: "== 0" }
      - { some: "~ ^scan_done$" }
      - { none: "~ ^FAIL:" }
    rationale: &rat-14f3ec7a75 |
      After a successful authentication, sudo caches the credentials for a while so that further commands do not ask for the password again. A long or unlimited cache lets anyone with access to an unattended terminal run privileged commands. Keeping the timeout at 15 minutes or less limits that window while staying practical for administrators.
    remediation: &rem-391bdc9433 |
      Set the sudo credential cache timeout to 15 minutes or less in a sudoers drop-in file, and remove larger or negative timestamp_timeout values from all other sudoers files.

      grep -rn 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/
      echo 'Defaults timestamp_timeout=15' > /etc/sudoers.d/50-timestamp-timeout
      chmod 0440 /etc/sudoers.d/50-timestamp-timeout
      visudo -c

      Write the value without spaces around the equals sign; the check searches for timestamp_timeout=VALUE literally.
  - id: "CIS-AMAZON2027-5.2.11-sudo_timestamp_type"
    name: "sudo timestamp type: grep -rPi -- 'timestamp_type\\h*=\\h*global' /etc/sudoers /etc/sudoers.d/"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.11. NIST SP 800-53 Rev. 5: AC-6."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      grep -rPi -- 'timestamp_type\h*=\h*global' /etc/sudoers /etc/sudoers.d/
    allow_rc: any
    expect:
      - { rc: "== 1" }
      - { none: "~ ." }
    rationale: &rat-a6def46f46 |
      After a successful authentication, sudo caches the credentials for a few minutes. With timestamp_type=global this cache is shared by all of a user's sessions, so a process or attacker in any other terminal of that user can run sudo without a password. The default per-terminal timestamp limits the cache to the session that authenticated.
    remediation: &rem-233a87ea3b |
      Remove the timestamp_type=global setting from the sudoers files the check finds; edit each file with visudo.

      grep -rPin 'timestamp_type\h*=\h*global' /etc/sudoers /etc/sudoers.d/
      visudo -f FILE

      Without the setting sudo uses the default per-terminal (tty) timestamp.
  - id: "CIS-AMAZON2027-5.2.12-restrict_su-attrs"
    name: "/etc/pam.d/su: exists"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.12. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      f='/etc/pam.d/su'
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then echo "$f does not exist"; exit 0; fi
    expect: empty
    rationale: &rat-43a7e69d11 |
      su lets any user who knows the root password, or another account's password, switch identity. Restricting su with pam_wheel to members of a dedicated (normally empty) group prevents switching to root through su and forces administrators to use sudo, where actions are attributed to individual accounts and logged.
    remediation: &rem-d67efd69b0 |
      Create /etc/pam.d/su.
  - id: "CIS-AMAZON2027-5.2.12-restrict_su-content"
    name: "/etc/pam.d/su has the expected content (1 rule)"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.12. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      cat '/etc/pam.d/su'
    allow_rc: any
    expect: { some: "~ ^\\s*auth\\s+(required|requisite)\\s+pam_wheel\\.so\\s+(\\S+\\s+)*(use_uid\\s+(\\S+\\s+)*group=\\S+|group=\\S+\\s+(\\S+\\s+)*use_uid)(\\s|$)" }
    rationale: *rat-43a7e69d11
    remediation: &rem-ee23a5a1dd |
      Edit /etc/pam.d/su so that its lines meet these conditions (regular expressions):

      - a line matches ^\s*auth\s+(required|requisite)\s+pam_wheel\.so\s+(\S+\s+)*(use_uid\s+(\S+\s+)*group=\S+|group=\S+\s+(\S+\s+)*use_uid)(\s|$)
  - id: "CIS-AMAZON2027-5.2.12-sugroup_etc_group"
    name: "The group that pam_wheel allows to use su has no members"
    description: "CIS Amazon Linux 2027 benchmark recommendation 5.2.12. NIST SP 800-53 Rev. 5: AC-3, MP-2. CIS Controls v8: 3.3."
    tags: [cis, cis-amazon2027, cis-section-5, cis-level-1, cis-level-2, cis-server, cis-level1-server, cis-level2-server]
    severity: medium
    run: |
      g=$(sed -nE 's/^[[:space:]]*auth[[:space:]]+(required|requisite)[[:space:]]+pam_wheel\.so[[:space:]](.*[[:space:]])?group=([^[:space:]]+).*/\3/p' /etc/pam.d/su 2>/dev/null | sed -n 1p)
      if [ -z "$g" ]; then echo "pam_wheel in /etc/pam.d/su names no group"; exit 0; fi
      e=$(getent group "$g")
      if [ -z "$e" ]; then echo "group $g does not exist"; exit 0; fi
      echo "$e" | awk -F: '$4 != "" {print "group " $1 " has members: " $4}'
    allow_rc: any
    expect: empty
    rationale: &rat-575a3911d0 |
      Restricting su with pam_wheel to members of a dedicated group prevents ordinary users from switching to root or other accounts by guessing or knowing their passwords. Using an empty group makes su usable only by root, so administrators must use sudo, which is logged per user. The group must exist and have no members.
    remediation: &rem-80fba87223 |
      Create a group without members and restrict su to it with pam_wheel in /etc/pam.d/su. The group can have any name; sugroup is an example.

      groupadd sugroup
      gpasswd -M '' sugroup
      grep -Eq '^\s*auth\s+(required|requisite)\s+pam_wheel\.so\s.*group=' /etc/pam.d/su || sed -i '/^auth\s\+sufficient\s\+pam_rootok.so/a auth required pam_wheel.so use_uid group=sugroup' /etc/pam.d/su

      If pam_wheel already names a group, remove its members instead: gpasswd -M '' GROUP.
  - id: "CIS-AMAZON2027-5.3.1.1-pam_version"
    name: "pam version: l_inst=\"$(rpm -q --qf '%{VERSION}-%{RELEASE}' pam)\" \u0026\u0026 [ \"$(printf '%s\\n%s\\n' '1.5.1-8' \"…"
