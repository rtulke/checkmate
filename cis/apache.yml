  # 9 Denial of service mitigations, 10 request limits

  - id: "CIS-APACHE-{{ item.value.cis }}-{{ item.key | lower }}"
    name: "{{ item.value.name }}"
    description: "CIS Apache HTTP Server 2.4 benchmark recommendation {{ item.value.cis }}. Without the directive httpd uses {{ item.value.default }}."
    tags: [cis, cis-apache24, cis-section-9, cis-level-1, cis-level-2]
    severity: low
    only_if: '{{ httpd }} -t'
    loop:
      Timeout: { cis: "9.1", name: The request timeout is 10 seconds or less, default: 60, expect: "<= 10" }
      KeepAlive: { cis: "9.2", name: Persistent connections are enabled, default: "on", expect: "== on" }
      MaxKeepAliveRequests: { cis: "9.3", name: A persistent connection serves at least 100 requests, default: 100, expect: ">= 100" }
      KeepAliveTimeout: { cis: "9.4", name: Idle persistent connections close within 15 seconds, default: 5, expect: "<= 15" }
    run: |
      v=$({{ conf }} | awk 'tolower($1) == tolower("{{ item.key }}") {v = tolower($2)} END {print v}')
      # 0 means unlimited for LimitRequestBody
      if [ "{{ item.key }}" = LimitRequestBody ] && [ "$v" = 0 ]; then v=1073741824; fi
      echo "${v:-{{ item.value.default }}}"
    expect: "{{ item.value.expect }}"


  - id: "CIS-APACHE-{{ item.value.cis }}-{{ item.key | lower }}"
    name: "{{ item.value.name }}"
    description: "CIS Apache HTTP Server 2.4 benchmark recommendation {{ item.value.cis }}. Without the directive httpd uses {{ item.value.default }}."
    tags: [cis, cis-apache24, cis-section-10, cis-level-2]
    severity: low
    only_if: '{{ httpd }} -t'
    loop:
      LimitRequestLine: { cis: "10.1", name: The request line is limited to 512 bytes, default: 8190, expect: "<= 512" }
      LimitRequestFields: { cis: "10.2", name: A request has at most 100 header fields, default: 100, expect: "<= 100" }
      LimitRequestFieldSize: { cis: "10.3", name: A header field is limited to 1024 bytes, default: 8190, expect: "<= 1024" }
      LimitRequestBody: { cis: "10.4", name: The request body is limited to 100 KB, default: "1073741824", expect: "<= 102400" }
    run: |
      v=$({{ conf }} | awk 'tolower($1) == tolower("{{ item.key }}") {v = tolower($2)} END {print v}')
      # 0 means unlimited for LimitRequestBody
      if [ "{{ item.key }}" = LimitRequestBody ] && [ "$v" = 0 ]; then v=1073741824; fi
      echo "${v:-{{ item.value.default }}}"
    expect: "{{ item.value.expect }}"

  - id: CIS-APACHE-9.5-request-read-timeout
    name: Slow requests are cut off by mod_reqtimeout
    description: CIS Apache HTTP Server 2.4 benchmark recommendations 9.5 and 9.6.
    tags: [cis, cis-apache24, cis-section-9, cis-level-1, cis-level-2]
    severity: low
    only_if: '{{ httpd }} -t'
    run: '{{ httpd }} -M 2>/dev/null'
    expect: { some: "~ ^[[:space:]]*reqtimeout_module[[:space:]]" }

  # 11 SELinux (RHEL-like systems)

  - id: CIS-APACHE-11.1-selinux-enforcing
    name: SELinux is enforcing
    description: CIS Apache HTTP Server 2.4 benchmark recommendation 11.1.
    tags: [cis, cis-apache24, cis-section-11, cis-level-2]
    severity: low
    when: 'facts.distro in ["rhel", "centos", "rocky", "almalinux", "ol", "fedora"] or "rhel" in facts.distro_like'
    only_if: '{{ httpd }} -t'
    run: getenforce 2>/dev/null || echo "SELinux not available"
    expect: "== Enforcing"

  - id: CIS-APACHE-11.2-httpd-confined
    name: httpd processes run in the httpd_t domain
    description: CIS Apache HTTP Server 2.4 benchmark recommendation 11.2.
    tags: [cis, cis-apache24, cis-section-11, cis-level-2]
    severity: low
    when: 'facts.distro in ["rhel", "centos", "rocky", "almalinux", "ol", "fedora"] or "rhel" in facts.distro_like'
    only_if: '{{ httpd }} -t && pgrep -x httpd'
    run: ps -eZ | awk '$NF == "httpd" {print $1}'
    expect:
      - "!empty"
      - each: "~ :httpd_t:"

  - id: CIS-APACHE-11.3-httpd-not-permissive
    name: The httpd_t domain is not permissive
    description: CIS Apache HTTP Server 2.4 benchmark recommendation 11.3.
    tags: [cis, cis-apache24, cis-section-11, cis-level-2]
    severity: low
    when: 'facts.distro in ["rhel", "centos", "rocky", "almalinux", "ol", "fedora"] or "rhel" in facts.distro_like'
    only_if: '{{ httpd }} -t && command -v semodule'
    run: semodule -l 2>/dev/null | grep -i permissive_httpd_t || true
    expect: empty

  # 12 AppArmor (Debian and Ubuntu)

  - id: CIS-APACHE-12.1-apparmor-enabled
    name: AppArmor is enabled
    description: CIS Apache HTTP Server 2.4 benchmark recommendation 12.1.
    tags: [cis, cis-apache24, cis-section-12, cis-level-2]
    severity: low
    when: 'facts.distro in ["debian", "ubuntu"] or "debian" in facts.distro_like'
    only_if: '{{ httpd }} -t'
    run: cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo N
    expect: "== Y"

  - id: CIS-APACHE-12.3-apparmor-enforce
    name: An AppArmor profile for apache2 is in enforce mode
    description: CIS Apache HTTP Server 2.4 benchmark recommendations 12.2 and 12.3.
    tags: [cis, cis-apache24, cis-section-12, cis-level-2]
    severity: low
    when: 'facts.distro in ["debian", "ubuntu"] or "debian" in facts.distro_like'
    only_if: '{{ httpd }} -t && command -v aa-status'
    run: aa-status 2>/dev/null | sed -n '/profiles are in enforce mode/,/profiles are in complain mode/p' | grep -c apache2 || true
    expect: "> 0"
